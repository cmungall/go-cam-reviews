<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Nucleus with chromatin -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f0f7ff" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="80" font-family="Arial" font-size="20" font-weight="bold" fill="#2c3e50" text-anchor="middle">Nucleus</text>
  
  <!-- DNA Double-strand break site -->
  <rect x="150" y="150" width="500" height="350" rx="20" ry="20" fill="#e8f4fc" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="180" font-family="Arial" font-size="18" font-weight="bold" fill="#3498db" text-anchor="middle">Site of Double-strand Break (DSB)</text>
  
  <!-- DNA with break -->
  <path d="M200,240 L350,240 M450,240 L600,240" stroke="#333" stroke-width="6"/>
  <path d="M200,260 L350,260 M450,260 L600,260" stroke="#333" stroke-width="6"/>
  <text x="400" y="230" font-family="Arial" font-size="16" font-weight="bold" fill="#e74c3c" text-anchor="middle">DSB</text>
  
  <!-- Step 1: MDC1 recruitment -->
  <circle cx="300" cy="320" r="35" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="300" y="325" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">MDC1</text>
  <rect x="220" y="365" width="160" height="40" rx="5" ry="5" fill="#f0f0f0" stroke="#7d3c98" stroke-width="1"/>
  <text x="300" y="390" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Chromatin-protein adaptor activity</text>
  
  <!-- Step 2: RNF8 recruitment -->
  <rect x="380" y="305" width="70" height="50" rx="5" ry="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="415" y="335" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">RNF8</text>
  <rect x="335" y="365" width="160" height="40" rx="5" ry="5" fill="#f0f0f0" stroke="#d35400" stroke-width="1"/>
  <text x="415" y="390" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Ubiquitin protein ligase activity</text>
  
  <!-- Step 3: NBN ubiquitination -->
  <path d="M500,305 L540,305 L540,355 L500,355 Z" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="520" y="335" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">NBN</text>
  <rect x="460" y="365" width="120" height="30" rx="5" ry="5" fill="#f0f0f0" stroke="#2980b9" stroke-width="1"/>
  <text x="520" y="385" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">NBN protein</text>
  
  <!-- Ubiquitin tag -->
  <circle cx="490" cy="295" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <text x="490" y="299" font-family="Arial" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Ub</text>
  
  <!-- Arrows connecting events -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <path d="M335,325 L375,325" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="355" y="315" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Recruits</text>
  
  <path d="M450,330 L495,330" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="473" y="320" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Ubiquitinates</text>
  
  <!-- Process labeling -->
  <circle cx="240" cy="320" r="18" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="240" y="325" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">1</text>
  
  <circle cx="355" cy="290" r="18" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="355" y="295" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">2</text>
  
  <circle cx="475" cy="290" r="18" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="475" y="295" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">3</text>
  
  <!-- K6-linked ubiquitination label -->
  <rect x="440" y="240" width="120" height="40" rx="5" ry="5" fill="#f9ebea" stroke="#e74c3c" stroke-width="1"/>
  <text x="500" y="260" font-family="Arial" font-size="12" font-weight="bold" fill="#e74c3c" text-anchor="middle">K6-linked</text>
  <text x="500" y="275" font-family="Arial" font-size="12" fill="#e74c3c" text-anchor="middle">ubiquitination</text>
  
  <!-- Process outcome -->
  <path d="M520,355 L520,420 L400,420" stroke="#27ae60" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="480" y="410" font-family="Arial" font-size="12" fill="#27ae60" text-anchor="middle">Promotes</text>
  
  <rect x="220" y="400" width="180" height="50" rx="10" ry="10" fill="#27ae60" stroke="#27ae60" stroke-width="2"/>
  <text x="310" y="425" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">DSB Repair via</text>
  <text x="310" y="442" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Homologous Recombination</text>
  
  <!-- Overall process label -->
  <rect x="175" y="465" width="450" height="30" rx="5" ry="5" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
  <text x="400" y="485" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">Protein localization to site of double-strand break</text>
</svg>