<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with light beige color to represent cell environment -->
  <rect width="1000" height="1000" fill="#fffaf0" stroke="#333" stroke-width="2" rx="10" ry="10"/>
  
  <!-- Cell components -->
  <!-- Cytosol area -->
  <rect x="50" y="70" width="900" height="800" fill="#e6f7ff" stroke="#333" stroke-width="2" rx="20" ry="20" opacity="0.5"/>
  <text x="70" y="110" font-family="Arial" font-size="24" font-weight="bold" fill="#333">Cytosol</text>
  
  <!-- Vacuole -->
  <ellipse cx="220" cy="400" rx="140" ry="120" fill="#d1e6cc" stroke="#333" stroke-width="2" opacity="0.6"/>
  <text x="190" y="400" font-family="Arial" font-size="20" font-weight="bold" fill="#333">Vacuole</text>

  <!-- Pathway connections - arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Starting point: Hexanoyl-ACP + Malonyl-CoA -->
  <rect x="110" y="180" width="150" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="125" y="210" font-family="Arial" font-size="16">Hexanoyl-ACP</text>
  
  <rect x="110" y="235" width="150" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="125" y="265" font-family="Arial" font-size="16">Malonyl-CoA</text>
  
  <!-- First reaction -->
  <line x1="185" y1="280" x2="185" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="110" y="310" width="160" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="130" y="335" font-family="Arial" font-size="16" font-weight="bold">aflC (Q12053)</text>
  <text x="125" y="355" font-family="Arial" font-size="14">Norsolorinate synthase</text>
  
  <!-- Product: Norsolorinic acid anthrone -->
  <line x1="185" y1="370" x2="185" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="110" y="400" width="180" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="115" y="430" font-family="Arial" font-size="16">Norsolorinic acid anthrone</text>
  
  <!-- Second reaction - in vacuole -->
  <line x1="200" y1="445" x2="230" y2="475" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="180" y="475" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="200" y="500" font-family="Arial" font-size="16" font-weight="bold">aflD (Q00278)</text>
  <text x="200" y="520" font-family="Arial" font-size="14">Ketoreductase</text>
  
  <!-- Product: Averantin -->
  <line x1="250" y1="535" x2="270" y2="565" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="220" y="565" width="130" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="245" y="595" font-family="Arial" font-size="16">Averantin</text>

  <!-- Return to cytosol - pathway continues -->
  <line x1="350" y1="585" x2="380" y2="585" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Third reaction -->
  <rect x="380" y="555" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="400" y="580" font-family="Arial" font-size="16" font-weight="bold">aflG (Q12732)</text>
  <text x="410" y="600" font-family="Arial" font-size="14">Hydroxylase</text>
  
  <!-- Product: 5'-Hydroxyaverantin -->
  <line x1="520" y1="585" x2="550" y2="585" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="550" y="565" width="160" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="560" y="595" font-family="Arial" font-size="16">5'-Hydroxyaverantin</text>

  <!-- Fourth reaction -->
  <line x1="630" y1="565" x2="630" y2="525" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="560" y="465" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="580" y="490" font-family="Arial" font-size="16" font-weight="bold">aflH (P87017)</text>
  <text x="580" y="510" font-family="Arial" font-size="14">Dehydrogenase</text>
  
  <!-- Product: 5'-Oxoaverantin -->
  <line x1="630" y1="465" x2="630" y2="425" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="550" y="380" width="160" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="570" y="410" font-family="Arial" font-size="16">5'-Oxoaverantin</text>

  <!-- Fifth reaction -->
  <line x1="630" y1="380" x2="630" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="560" y="280" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="580" y="305" font-family="Arial" font-size="16" font-weight="bold">aflK (Q12062)</text>
  <text x="610" y="325" font-family="Arial" font-size="14">Cyclase</text>
  
  <!-- Product: Averufin -->
  <line x1="630" y1="280" x2="630" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="580" y="195" width="120" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="605" y="225" font-family="Arial" font-size="16">Averufin</text>

  <!-- Sixth reaction -->
  <line x1="700" y1="215" x2="730" y2="215" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="730" y="185" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="750" y="210" font-family="Arial" font-size="16" font-weight="bold">aflI (Q12437)</text>
  <text x="745" y="230" font-family="Arial" font-size="14">Oxidoreductase</text>
  
  <!-- Product: Versiconal hemiacetal acetate -->
  <line x1="800" y1="245" x2="800" y2="275" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="720" y="275" width="160" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="730" y="302" font-family="Arial" font-size="14">Versiconal hemiacetal acetate</text>

  <!-- Continuing pathway vertically down -->
  <line x1="800" y1="320" x2="800" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="730" y="350" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="750" y="375" font-family="Arial" font-size="16" font-weight="bold">aflJ (Q6UEG5)</text>
  <text x="775" y="395" font-family="Arial" font-size="14">Esterase</text>
  
  <!-- Product: Versiconal -->
  <line x1="800" y1="410" x2="800" y2="440" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="740" y="440" width="120" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="760" y="470" font-family="Arial" font-size="16">Versiconal</text>

  <!-- Next reaction -->
  <line x1="800" y1="485" x2="800" y2="515" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="730" y="515" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="750" y="540" font-family="Arial" font-size="16" font-weight="bold">aflK (Q12062)</text>
  <text x="738" y="560" font-family="Arial" font-size="14">Versicolorin synthase</text>
  
  <!-- Product: Versicolorin B -->
  <line x1="800" y1="575" x2="800" y2="605" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="740" y="605" width="120" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="750" y="635" font-family="Arial" font-size="16">Versicolorin B</text>

  <!-- Branching pathway -->
  <line x1="740" y1="625" x2="510" y2="625" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="370" y="595" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="390" y="620" font-family="Arial" font-size="16" font-weight="bold">aflL (Q9UW95)</text>
  <text x="400" y="640" font-family="Arial" font-size="14">Desaturase</text>
  
  <!-- Product: Versicolorin A -->
  <line x1="370" y1="625" x2="310" y2="625" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="190" y="605" width="120" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="200" y="635" font-family="Arial" font-size="16">Versicolorin A</text>

  <!-- Joining the pathways - Sterigmatocystin formation -->
  <line x1="250" y1="650" x2="250" y2="680" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="650" x2="800" y2="680" stroke="#333" stroke-width="2"/>
  <line x1="250" y1="680" x2="800" y2="680" stroke="#333" stroke-width="2"/>
  <line x1="500" y1="680" x2="500" y2="710" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Sterigmatocystin formation -->
  <rect x="430" y="710" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="445" y="735" font-family="Arial" font-size="16" font-weight="bold">Multiple steps</text>
  <text x="450" y="755" font-family="Arial" font-size="14">(O-methylations)</text>
  
  <!-- Product: Sterigmatocystin -->
  <line x1="500" y1="770" x2="500" y2="800" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="430" y="800" width="140" height="45" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="450" y="830" font-family="Arial" font-size="16">Sterigmatocystin</text>

  <!-- Final reaction to Aflatoxins -->
  <line x1="570" y1="822" x2="620" y2="822" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="620" y="792" width="140" height="60" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="640" y="817" font-family="Arial" font-size="16" font-weight="bold">aflQ (O13345)</text>
  <text x="645" y="837" font-family="Arial" font-size="14">Monooxygenase</text>
  
  <!-- Final products: Aflatoxins -->
  <line x1="760" y1="822" x2="790" y2="822" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="790" y="785" width="140" height="35" rx="5" ry="5" fill="#fff3c3" stroke="#333" stroke-width="2"/>
  <text x="810" y="810" font-family="Arial" font-size="16" font-weight="bold">Aflatoxin B1</text>
  
  <rect x="790" y="825" width="140" height="35" rx="5" ry="5" fill="#fff3c3" stroke="#333" stroke-width="2"/>
  <text x="810" y="850" font-family="Arial" font-size="16" font-weight="bold">Aflatoxin B2</text>
  
  <rect x="790" y="865" width="140" height="35" rx="5" ry="5" fill="#fff3c3" stroke="#333" stroke-width="2"/>
  <text x="810" y="890" font-family="Arial" font-size="16" font-weight="bold">Aflatoxin G1</text>

  <rect x="790" y="905" width="140" height="35" rx="5" ry="5" fill="#fff3c3" stroke="#333" stroke-width="2"/>
  <text x="810" y="930" font-family="Arial" font-size="16" font-weight="bold">Aflatoxin G2</text>

  <!-- Legend -->
  <rect x="70" y="860" width="300" height="120" fill="white" stroke="#333" stroke-width="1" rx="5" ry="5"/>
  <text x="90" y="885" font-family="Arial" font-size="18" font-weight="bold">Legend:</text>
  
  <rect x="90" y="895" width="24" height="24" fill="#f9d5e5" stroke="#333" stroke-width="1"/>
  <text x="125" y="913" font-family="Arial" font-size="16">Enzyme</text>
  
  <rect x="90" y="925" width="24" height="24" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="125" y="943" font-family="Arial" font-size="16">Intermediate metabolite</text>
  
  <rect x="90" y="955" width="24" height="24" fill="#fff3c3" stroke="#333" stroke-width="1"/>
  <text x="125" y="973" font-family="Arial" font-size="16">Final product (Aflatoxin)</text>

  <!-- Flow guidance arrows to enhance pathway visualization -->
  <path d="M 250,680 Q 400,700 550,680" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
  <path d="M 570,822 Q 650,780 730,822" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>

  <text x="350" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="#333">Aflatoxin Biosynthesis Pathway</text>
  <text x="400" y="65" font-family="Arial" font-size="18" fill="#333">Aspergillus parasiticus</text>
</svg>