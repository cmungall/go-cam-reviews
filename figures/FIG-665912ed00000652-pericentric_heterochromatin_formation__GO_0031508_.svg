<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#ffffff"/>
  
  <!-- Title with more spacing -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Pericentric Heterochromatin Formation</text>
  <text x="400" y="55" font-family="Arial" font-size="16" text-anchor="middle">Schizosaccharomyces pombe (Fission Yeast)</text>
  <text x="400" y="80" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">Pathway depicting both siRNA-mediated and direct mechanisms for heterochromatin assembly</text>

  <!-- Nuclear membrane -->
  <ellipse cx="400" cy="420" rx="330" ry="290" fill="#f8f8f8" stroke="#333333" stroke-width="2.5"/>
  <text x="400" y="170" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle">Nucleus</text>
  
  <!-- Chromosome region -->
  <path d="M250,420 C300,370 500,370 550,420 C500,470 300,470 250,420 Z" fill="#e6e6fa" stroke="#333333" stroke-width="2"/>
  <text x="400" y="425" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Pericentric Heterochromatin</text>
  
  <!-- SHREC Complex -->
  <rect x="170" y="320" width="120" height="70" rx="10" ry="10" fill="#ffcccc" stroke="#cc0000" stroke-width="2"/>
  <text x="230" y="340" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">SHREC Complex</text>
  <text x="230" y="360" font-family="Arial" font-size="12" text-anchor="middle">clr1, clr2, clr3, mit1</text>
  <text x="230" y="375" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">H3K14 deacetylase activity</text>
  
  <!-- CLRC Complex -->
  <rect x="320" y="220" width="120" height="70" rx="10" ry="10" fill="#cce5ff" stroke="#0066cc" stroke-width="2"/>
  <text x="380" y="240" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">CLRC Complex</text>
  <text x="380" y="260" font-family="Arial" font-size="12" text-anchor="middle">clr4, raf1, raf2, cul4, rik1</text>
  <text x="380" y="275" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">H3K9 methyltransferase activity</text>
  
  <!-- RITS Complex -->
  <rect x="490" y="320" width="120" height="70" rx="10" ry="10" fill="#d9f2d9" stroke="#006600" stroke-width="2"/>
  <text x="550" y="340" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">RITS Complex</text>
  <text x="550" y="360" font-family="Arial" font-size="12" text-anchor="middle">chp1, tas3, ago1</text>
  <text x="550" y="375" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">RNA-induced silencing</text>
  
  <!-- ARC Complex -->
  <rect x="490" y="420" width="120" height="70" rx="10" ry="10" fill="#fff2cc" stroke="#ff9900" stroke-width="2"/>
  <text x="550" y="440" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">ARC Complex</text>
  <text x="550" y="460" font-family="Arial" font-size="12" text-anchor="middle">arb1, arb2</text>
  <text x="550" y="475" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">siRNA binding</text>
  
  <!-- RDRC Complex -->
  <rect x="490" y="520" width="140" height="70" rx="10" ry="10" fill="#e6ccff" stroke="#6600cc" stroke-width="2"/>
  <text x="560" y="540" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">RDRC Complex</text>
  <text x="560" y="560" font-family="Arial" font-size="12" text-anchor="middle">rdp1, hrr1, cid12</text>
  <text x="560" y="575" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">RNA-dependent RNA polymerase</text>
  
  <!-- FACT Complex -->
  <rect x="170" y="220" width="120" height="70" rx="10" ry="10" fill="#ffe6cc" stroke="#cc6600" stroke-width="2"/>
  <text x="230" y="240" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">FACT Complex</text>
  <text x="230" y="260" font-family="Arial" font-size="12" text-anchor="middle">spt16, pob3</text>
  <text x="230" y="275" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">H2A-H2B histone chaperone</text>
  
  <!-- Other important proteins -->
  <circle cx="180" y="520" r="35" fill="#ccccff" stroke="#6666cc" stroke-width="2"/>
  <text x="180" y="515" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">sir2</text>
  <text x="180" y="532" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">H3K9 deacetylase</text>
  
  <circle cx="250" y="520" r="35" fill="#ccccff" stroke="#6666cc" stroke-width="2"/>
  <text x="250" y="515" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">swi6</text>
  <text x="250" y="532" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">HP1 homolog</text>
  
  <circle cx="320" y="520" r="35" fill="#ccccff" stroke="#6666cc" stroke-width="2"/>
  <text x="320" y="515" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">chp2</text>
  <text x="320" y="532" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">HP1 homolog</text>

  <rect x="400" y="520" width="60" height="35" rx="15" ry="15" fill="#ffccee" stroke="#cc0099" stroke-width="2"/>
  <text x="430" y="535" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">dcr1</text>
  <text x="430" y="547" font-family="Arial" font-size="9" font-style="italic" text-anchor="middle">Dicer</text>
  
  <!-- Add stc1 adapter protein -->
  <rect x="380" y="450" width="60" height="35" rx="15" ry="15" fill="#ffccee" stroke="#cc0099" stroke-width="2"/>
  <text x="410" y="460" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">stc1</text>
  <text x="410" y="472" font-family="Arial" font-size="9" font-style="italic" text-anchor="middle">adaptor protein</text>
  
  <!-- Histone demethylases -->
  <ellipse cx="250" y="140" rx="65" ry="28" fill="#ffffcc" stroke="#999900" stroke-width="2"/>
  <text x="250" y="140" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">lsd1/lsd2</text>
  <text x="250" y="152" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">H3K9 demethylases</text>
  
  <!-- H3K9me Nucleosomes -->
  <rect x="380" y="390" width="22" height="12" fill="#cc33ff" stroke="#6600cc" stroke-width="1.5"/>
  <rect x="402" y="390" width="22" height="12" fill="#cc33ff" stroke="#6600cc" stroke-width="1.5"/>
  <text x="402" y="412" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">H3K9me</text>
  
  <!-- Other labeled proteins -->
  <ellipse cx="550" y="140" rx="65" ry="28" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="550" y="140" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">ers1/rad25</text>
  <text x="550" y="152" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">scaffolding proteins</text>
  
  <rect x="450" y="220" width="65" height="35" rx="5" ry="5" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="482" y="240" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">dsh1</text>
  
  <!-- Arrows and connections with different styles and labels -->
  <!-- FACT to CLRC - direct regulation -->
  <path d="M290,250 L320,250" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrowhead)"/>
  <text x="305" y="240" font-family="Arial" font-size="10" text-anchor="middle">Direct</text>
  
  <!-- SHREC to Chromatin - enzymatic activity -->
  <path d="M290,350 L350,390" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowhead)"/>
  <text x="320" y="365" font-family="Arial" font-size="10" text-anchor="middle">Enzymatic</text>
  
  <!-- CLRC to Chromatin - enzymatic activity -->
  <path d="M380,290 L380,390" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowhead)"/>
  <text x="395" y="340" font-family="Arial" font-size="10" text-anchor="middle">Methylation</text>
  
  <!-- swi6/chp2 to Chromatin - binding -->
  <path d="M285,495 L370,430" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrowhead)"/>
  <text x="315" y="455" font-family="Arial" font-size="10" text-anchor="middle">Binding</text>
  
  <!-- sir2 to Chromatin - enzymatic activity -->
  <path d="M190,490 L360,420" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowhead)"/>
  <text x="260" y="435" font-family="Arial" font-size="10" text-anchor="middle">Deacetylation</text>
  
  <!-- RITS to Chromatin - binding -->
  <path d="M490,350 L420,390" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrowhead)"/>
  <text x="445" y="360" font-family="Arial" font-size="10" text-anchor="middle">Binding</text>
  
  <!-- RITS to ARC - direct interaction -->
  <path d="M550,390 L550,420" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrowhead)"/>
  <text x="565" y="405" font-family="Arial" font-size="10" text-anchor="middle">Direct</text>
  
  <!-- ARC to RDRC - direct interaction -->
  <path d="M550,490 L550,520" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrowhead)"/>
  <text x="565" y="505" font-family="Arial" font-size="10" text-anchor="middle">Direct</text>
  
  <!-- RDRC to dcr1 - processing -->
  <path d="M490,555 L460,535" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowhead)"/>
  <text x="475" y="560" font-family="Arial" font-size="10" text-anchor="middle">Processing</text>
  
  <!-- dcr1 to RITS - siRNA generation -->
  <path d="M430,520 C450,490 470,460 500,390" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowhead)"/>
  <text x="455" y="440" font-family="Arial" font-size="10" text-anchor="middle">siRNA</text>
  
  <!-- stc1 connections - adaptor function -->
  <path d="M440,450 L490,390" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="475" y="410" font-family="Arial" font-size="10" text-anchor="middle">Adaptor</text>
  
  <path d="M380,450 L360,290" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="355" y="355" font-family="Arial" font-size="10" text-anchor="middle">Adaptor</text>
  
  <!-- lsd1/lsd2 to CLRC - regulation -->
  <path d="M295,160 L330,220" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="325" y="180" font-family="Arial" font-size="10" text-anchor="middle">Regulation</text>
  
  <!-- ers1/rad25 to pathway -->
  <path d="M520,165 L482,220" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrowhead)"/>
  <text x="505" y="180" font-family="Arial" font-size="10" text-anchor="middle">Scaffold</text>
  
  <!-- siRNA pathway loop -->
  <path d="M560,590 C630,550 640,400 600,350" fill="none" stroke="#006600" stroke-width="2.5" stroke-dasharray="10,4" marker-end="url(#arrowhead)"/>
  <text x="645" y="450" font-family="Arial" font-size="14" font-style="italic" font-weight="bold" fill="#006600" text-anchor="middle">siRNA</text>
  <text x="645" y="470" font-family="Arial" font-size="14" font-style="italic" font-weight="bold" fill="#006600" text-anchor="middle">feedback</text>
  <text x="645" y="490" font-family="Arial" font-size="14" font-style="italic" font-weight="bold" fill="#006600" text-anchor="middle">loop</text>
  
  <!-- Marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Legend with interaction types -->
  <rect x="600" y="580" width="190" height="210" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="620" y="600" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <rect x="620" y="610" width="15" height="15" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="642" y="622" font-family="Arial" font-size="12">SHREC Complex</text>
  
  <rect x="620" y="630" width="15" height="15" fill="#cce5ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="642" y="642" font-family="Arial" font-size="12">CLRC Complex</text>
  
  <rect x="620" y="650" width="15" height="15" fill="#d9f2d9" stroke="#006600" stroke-width="1.5"/>
  <text x="642" y="662" font-family="Arial" font-size="12">RITS Complex</text>
  
  <rect x="620" y="670" width="15" height="15" fill="#fff2cc" stroke="#ff9900" stroke-width="1.5"/>
  <text x="642" y="682" font-family="Arial" font-size="12">ARC Complex</text>
  
  <rect x="620" y="690" width="15" height="15" fill="#e6ccff" stroke="#6600cc" stroke-width="1.5"/>
  <text x="642" y="702" font-family="Arial" font-size="12">RDRC Complex</text>
  
  <rect x="620" y="710" width="15" height="15" fill="#ffe6cc" stroke="#cc6600" stroke-width="1.5"/>
  <text x="642" y="722" font-family="Arial" font-size="12">FACT Complex</text>
  
  <ellipse cx="627" cy="735" rx="7" ry="7" fill="#ccccff" stroke="#6666cc" stroke-width="1.5"/>
  <text x="642" y="738" font-family="Arial" font-size="12">Regulatory proteins</text>
  
  <!-- Interaction types -->
  <line x1="620" y1="750" x2="635" y2="750" stroke="#000000" stroke-width="2" stroke-dasharray="none"/>
  <text x="642" y="754" font-family="Arial" font-size="12">Direct interaction</text>
  
  <line x1="620" y1="765" x2="635" y2="765" stroke="#000000" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="642" y="769" font-family="Arial" font-size="12">Enzymatic activity</text>
  
  <line x1="620" y1="780" x2="635" y2="780" stroke="#000000" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="642" y="784" font-family="Arial" font-size="12">Adaptor function</text>
  
  <line x1="620" y1="795" x2="635" y2="795" stroke="#000000" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="642" y="799" font-family="Arial" font-size="12">Regulatory function</text>
  
  <line x1="620" y1="810" x2="635" y2="810" stroke="#006600" stroke-width="2.5" stroke-dasharray="10,4"/>
  <text x="642" y="814" font-family="Arial" font-size="12">siRNA feedback loop</text>
</svg>