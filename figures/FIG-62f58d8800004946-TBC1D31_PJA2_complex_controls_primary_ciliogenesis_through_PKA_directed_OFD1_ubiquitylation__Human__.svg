<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with slight gradient -->
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg_gradient)" />

  <!-- Cell membrane outline -->
  <path d="M50,180 Q400,150 750,180 V550 Q400,520 50,550 Z" fill="#f8f9fa" stroke="#343a40" stroke-width="2" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">
    TBC1D31/PJA2 Complex Controls Primary Ciliogenesis Through 
  </text>
  <text x="400" y="70" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">
    PKA-Directed OFD1 Ubiquitylation
  </text>

  <!-- Ciliary basal body and cilium -->
  <g transform="translate(400,300)">
    <!-- Ciliary basal body - GO:0036064 -->
    <rect x="-100" y="-60" width="200" height="120" rx="10" ry="10" fill="#adb5bd" stroke="#495057" stroke-width="2" />
    <text x="0" y="90" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Ciliary Basal Body</text>
    <text x="0" y="110" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#495057">(GO:0036064)</text>
    
    <!-- Primary cilium extending upward -->
    <path d="M-40,-60 L-40,-150 M40,-60 L40,-150" stroke="#495057" stroke-width="2" stroke-dasharray="5,3" />
    <path d="M-40,-150 Q0,-170 40,-150" stroke="#495057" stroke-width="2" fill="none" />
    <text x="0" y="-180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Primary Cilium</text>
  </g>
  
  <!-- Protein Players -->
  <!-- TBC1D31 - Molecular adaptor activity -->
  <g transform="translate(220,230)">
    <circle cx="0" cy="0" r="35" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">TBC1D31</text>
    <text x="0" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">Molecular Adaptor</text>
    <text x="0" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">(GO:0060090)</text>
  </g>
  
  <!-- OFD1 - Molecular adaptor activity -->
  <g transform="translate(400,180)">
    <circle cx="0" cy="0" r="35" fill="#74c0fc" stroke="#1864ab" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">OFD1</text>
    <text x="0" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">Molecular Adaptor</text>
    <text x="0" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">(GO:0060090)</text>
  </g>
  
  <!-- PJA2 - Ubiquitin ligase activity -->
  <g transform="translate(580,230)">
    <circle cx="0" cy="0" r="35" fill="#ff922b" stroke="#e67700" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">PJA2</text>
    <text x="0" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">Ubiquitin Ligase</text>
    <text x="0" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">(GO:0061630)</text>
  </g>
  
  <!-- PRKCA - kinase activity -->
  <g transform="translate(650,350)">
    <circle cx="0" cy="0" r="35" fill="#82c91e" stroke="#5c940d" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">PRKCA</text>
    <text x="0" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">Ca, DAG-dependent</text>
    <text x="0" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="#495057">Ser/Thr Kinase</text>
  </g>
  
  <!-- Interactions and processes -->
  <!-- TBC1D31 positively regulates OFD1 -->
  <path d="M255,230 L365,180" stroke="#1864ab" stroke-width="2" marker-end="url(#arrowPositive)" fill="none" />
  <text x="310" y="195" font-family="Arial" font-size="12" text-anchor="middle" fill="#1864ab" transform="rotate(-20,310,195)">Positively regulates</text>
  
  <!-- PJA2 negatively regulates OFD1 -->
  <path d="M545,230 L435,180" stroke="#e67700" stroke-width="2" marker-end="url(#arrowNegative)" fill="none" />
  <text x="490" y="195" font-family="Arial" font-size="12" text-anchor="middle" fill="#e67700" transform="rotate(20,490,195)">Negatively regulates</text>
  
  <!-- PRKCA positively regulates PJA2 -->
  <path d="M635,315 L595,265" stroke="#5c940d" stroke-width="2" marker-end="url(#arrowPositive)" fill="none" />
  <text x="630" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#5c940d" transform="rotate(-35,630,300)">Activates</text>
  
  <!-- Ubiquitylation arrow from PJA2 to OFD1 -->
  <path d="M550,210 C520,180 480,150 435,165" stroke="#e67700" stroke-width="2" stroke-dasharray="5,3" fill="none" />
  <text x="490" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#e67700">Ubiquitylation</text>
  
  <!-- Process annotations -->
  <text x="400" y="450" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">Cilium Assembly (GO:0060271)</text>
  <text x="580" y="410" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#e67700">Proteasome-mediated</text>
  <text x="580" y="430" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#e67700">Ubiquitin-dependent</text>
  <text x="580" y="450" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#e67700">Protein Catabolism</text>
  <text x="580" y="470" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#e67700">(GO:0043161)</text>
  
  <!-- Legend -->
  <rect x="50" y="400" width="220" height="140" rx="5" ry="5" fill="white" stroke="#343a40" stroke-width="1" />
  <text x="160" y="420" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Legend</text>
  
  <!-- Protein types -->
  <circle cx="70" cy="440" r="8" fill="#4dabf7" stroke="#1864ab" stroke-width="1" />
  <text x="160" y="445" font-family="Arial" font-size="12" fill="#212529">Adaptor Proteins (TBC1D31, OFD1)</text>
  
  <circle cx="70" cy="465" r="8" fill="#ff922b" stroke="#e67700" stroke-width="1" />
  <text x="155" y="470" font-family="Arial" font-size="12" fill="#212529">Ubiquitin Ligase (PJA2)</text>
  
  <circle cx="70" cy="490" r="8" fill="#82c91e" stroke="#5c940d" stroke-width="1" />
  <text x="130" y="495" font-family="Arial" font-size="12" fill="#212529">Kinase (PRKCA)</text>
  
  <!-- Arrow types -->
  <line x1="70" y1="515" x2="90" y2="515" stroke="#1864ab" stroke-width="2" marker-end="url(#arrowPositive)" />
  <text x="175" y="520" font-family="Arial" font-size="12" fill="#212529">Positive Regulation/Activation</text>
  
  <line x1="70" y1="540" x2="90" y2="540" stroke="#e67700" stroke-width="2" marker-end="url(#arrowNegative)" />
  <text x="160" y="545" font-family="Arial" font-size="12" fill="#212529">Negative Regulation</text>
  
  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowPositive" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#212529" />
    </marker>
    <marker id="arrowNegative" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e67700" />
    </marker>
  </defs>
</svg>