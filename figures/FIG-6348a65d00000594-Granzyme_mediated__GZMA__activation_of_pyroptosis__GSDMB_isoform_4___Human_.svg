<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Granzyme-mediated (GZMA) activation of pyroptosis (GSDMB isoform 4)</text>
  
  <!-- Cytotoxic T cell -->
  <ellipse cx="200" cy="200" rx="120" ry="100" fill="#e6f3ff" stroke="#666666" stroke-width="2"/>
  <text x="200" y="140" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cytotoxic T Cell</text>
  
  <!-- Target cell -->
  <ellipse cx="500" cy="350" rx="180" ry="150" fill="#fff3e6" stroke="#666666" stroke-width="2"/>
  <text x="500" y="240" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Target Cell</text>
  
  <!-- Target cell nucleus -->
  <ellipse cx="500" cy="360" rx="50" ry="40" fill="#d9d9d9" stroke="#666666" stroke-width="1"/>
  <text x="500" y="365" font-family="Arial" font-size="14" text-anchor="middle">Nucleus</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Cytoplasm</text>
  
  <!-- Plasma membrane label -->
  <text x="380" y="430" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Plasma membrane</text>
  
  <!-- PRF1 protein -->
  <circle cx="290" cy="270" r="15" fill="#ff9999" stroke="#666666" stroke-width="1"/>
  <text x="290" y="275" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">PRF1</text>
  
  <!-- GZMA protein -->
  <rect x="250" y="230" width="30" height="20" fill="#99cc99" stroke="#666666" stroke-width="1" rx="5" ry="5"/>
  <text x="265" y="245" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">GZMA</text>
  
  <!-- Step 1 label -->
  <circle cx="260" cy="210" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="260" y="215" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">1</text>
  
  <!-- Arrow from T cell to target -->
  <path d="M 260,220 L 320,260" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- PRF1 creating pore -->
  <path d="M 320,340 C 330,330 340,350 350,340" stroke="#ff9999" stroke-width="4" fill="none"/>
  <text x="335" y="320" font-family="Arial" font-size="14" text-anchor="middle">Pore</text>
  
  <!-- Step 2 label -->
  <circle cx="320" cy="300" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">2</text>
  
  <!-- GZMA entering through pore -->
  <rect x="330" y="350" width="30" height="20" fill="#99cc99" stroke="#666666" stroke-width="1" rx="5" ry="5"/>
  <text x="345" y="365" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">GZMA</text>
  
  <!-- GSDMB protein (inactive) -->
  <path d="M 450,380 L 470,380 L 470,400 L 450,400 Z" fill="#9999ff" stroke="#666666" stroke-width="1"/>
  <text x="460" y="395" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">GSDMB-4</text>
  
  <!-- Step 3 label -->
  <circle cx="410" cy="350" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="355" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">3</text>
  
  <!-- Arrow showing GZMA activating GSDMB -->
  <path d="M 370,360 L 430,380" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="370" font-family="Arial" font-size="14" text-anchor="middle">Cleaves</text>
  
  <!-- GSDMB protein (activated) -->
  <path d="M 520,420 L 540,420 L 540,440 L 520,440 Z" fill="#9999ff" stroke="#ff0000" stroke-width="2"/>
  <text x="530" y="435" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">GSDMB-4</text>
  
  <!-- Arrow showing GSDMB activation -->
  <path d="M 470,400 L 510,420" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="490" y="410" font-family="Arial" font-size="14" text-anchor="middle">Activation</text>
  
  <!-- Step 4 label -->
  <circle cx="530" cy="390" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="530" y="395" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">4</text>
  
  <!-- GSDMB binding to membrane -->
  <path d="M 550,440 L 590,470" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="590" y="450" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Phospholipid binding</text>
  
  <!-- GSDMB pore formation -->
  <path d="M 600,480 C 610,470 620,490 630,480" stroke="#9999ff" stroke-width="4" fill="none"/>
  <text x="615" y="460" font-family="Arial" font-size="14" text-anchor="middle">Pore</text>
  
  <!-- Cell lysis visual -->
  <path d="M 650,350 Q 680,380 650,410" stroke="#666666" stroke-width="1" stroke-dasharray="5,5" fill="none"/>
  <path d="M 660,370 Q 690,400 660,430" stroke="#666666" stroke-width="1" stroke-dasharray="5,5" fill="none"/>
  
  <!-- Final arrow to pyroptosis -->
  <path d="M 640,470 L 690,480" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="700" y="485" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#cc0000">Pyroptosis</text>
  
  <!-- Legend -->
  <rect x="620" y="100" width="160" height="220" fill="#f9f9f9" stroke="#666666" stroke-width="1"/>
  <text x="700" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="640" y="140" r="10" fill="#ff9999" stroke="#666666" stroke-width="1"/>
  <text x="700" y="145" font-family="Arial" font-size="14" text-anchor="middle">PRF1 (Perforin)</text>
  
  <rect x="630" y="160" width="20" height="15" fill="#99cc99" stroke="#666666" stroke-width="1" rx="5" ry="5"/>
  <text x="700" y="170" font-family="Arial" font-size="14" text-anchor="middle">GZMA (Granzyme A)</text>
  
  <path d="M 630,190 L 650,190 L 650,205 L 630,205 Z" fill="#9999ff" stroke="#666666" stroke-width="1"/>
  <text x="700" y="200" font-family="Arial" font-size="14" text-anchor="middle">GSDMB-4 (inactive)</text>
  
  <path d="M 630,220 L 650,220 L 650,235 L 630,235 Z" fill="#9999ff" stroke="#ff0000" stroke-width="2"/>
  <text x="700" y="230" font-family="Arial" font-size="14" text-anchor="middle">GSDMB-4 (active)</text>
  
  <path d="M 630,250 C 640,245 650,255 660,250" stroke="#9999ff" stroke-width="4" fill="none"/>
  <text x="700" y="255" font-family="Arial" font-size="14" text-anchor="middle">Membrane pore</text>
  
  <circle cx="635" y="275" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="635" y="280" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">1</text>
  <text x="700" y="280" font-family="Arial" font-size="14" text-anchor="middle">Process steps</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Processes labels -->
  <rect x="305" y="275" width="90" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
  <text x="350" y="290" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">GO:0071806</text>
  
  <rect x="365" y="335" width="90" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
  <text x="410" y="350" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">GO:0051604</text>
  
  <rect x="520" y="405" width="90" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
  <text x="565" y="420" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">GO:0005543</text>
  
  <rect x="575" y="485" width="90" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
  <text x="620" y="500" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">GO:1902483</text>
</svg>