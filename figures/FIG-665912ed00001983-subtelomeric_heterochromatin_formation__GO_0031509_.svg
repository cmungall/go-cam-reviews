<svg width="800" height="750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="750" fill="#f8f8f8" />
  
  <!-- Cell Nucleus -->
  <ellipse cx="400" cy="350" rx="380" ry="320" fill="#f0f0ff" stroke="#666" stroke-width="2" />
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">S. pombe Nucleus</text>
  
  <!-- Telomere Region -->
  <path d="M 150,150 Q 220,120 300,150 Q 380,180 450,150 Q 520,120 600,150" fill="#e6e6fa" stroke="#888" stroke-width="2" />
  <text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Telomere Region</text>
  
  <!-- CLRC Complex -->
  <rect x="100" y="200" width="180" height="140" rx="10" ry="10" fill="#d1e7dd" stroke="#198754" stroke-width="2" />
  <text x="190" y="225" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">CLRC Complex</text>
  <text x="190" y="250" text-anchor="middle" font-family="Arial" font-size="12">cul4 (SPAC3A11.08)</text>
  <text x="190" y="270" text-anchor="middle" font-family="Arial" font-size="12">rik1 (SPCC11E10.08)</text>
  <text x="190" y="290" text-anchor="middle" font-family="Arial" font-size="12">raf1 (SPCC613.12c)</text>
  <text x="190" y="310" text-anchor="middle" font-family="Arial" font-size="12">raf2 (SPCC970.07c)</text>
  <text x="190" y="330" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">E3 ubiquitin ligase complex</text>
  
  <!-- SHREC Complex -->
  <rect x="520" y="200" width="180" height="140" rx="10" ry="10" fill="#cff4fc" stroke="#0dcaf0" stroke-width="2" />
  <text x="610" y="225" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">SHREC Complex</text>
  <text x="610" y="250" text-anchor="middle" font-family="Arial" font-size="12">clr1 (SPBC2D10.17)</text>
  <text x="610" y="270" text-anchor="middle" font-family="Arial" font-size="12">clr2 (SPAC1B3.17)</text>
  <text x="610" y="290" text-anchor="middle" font-family="Arial" font-size="12">clr3 (SPBC800.03)</text>
  <text x="610" y="310" text-anchor="middle" font-family="Arial" font-size="12">mit1 (SPBP35G2.10)</text>
  <text x="610" y="330" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">Histone deacetylase complex</text>
  
  <!-- RNAi Machinery -->
  <rect x="100" y="400" width="180" height="170" rx="10" ry="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2" />
  <text x="190" y="425" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">RNAi Machinery</text>
  <text x="190" y="450" text-anchor="middle" font-family="Arial" font-size="12">dcr1 (SPCC188.13c)</text>
  <text x="190" y="470" text-anchor="middle" font-family="Arial" font-size="12">rdp1 (SPAC6F12.09)</text>
  <text x="190" y="490" text-anchor="middle" font-family="Arial" font-size="12">hrr1 (SPCC1739.03)</text>
  <text x="190" y="510" text-anchor="middle" font-family="Arial" font-size="12">arb1 (SPAC140.03)</text>
  <text x="190" y="530" text-anchor="middle" font-family="Arial" font-size="12">ago1 (SPCC736.11)</text>
  <text x="190" y="550" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">siRNA production and processing</text>
  
  <!-- RITS Complex -->
  <rect x="340" y="400" width="180" height="120" rx="10" ry="10" fill="#f8d7da" stroke="#dc3545" stroke-width="2" />
  <text x="430" y="425" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">RITS Complex</text>
  <text x="430" y="450" text-anchor="middle" font-family="Arial" font-size="12">chp1 (SPAC18G6.02c)</text>
  <text x="430" y="470" text-anchor="middle" font-family="Arial" font-size="12">tas3 (SPBC83.03c)</text>
  <text x="430" y="490" text-anchor="middle" font-family="Arial" font-size="12">stc1 (SPBP8B7.28c)</text>
  <text x="430" y="510" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">RNA-induced transcriptional silencing</text>
  
  <!-- FACT Complex -->
  <rect x="580" y="400" width="180" height="100" rx="10" ry="10" fill="#e2e3e5" stroke="#6c757d" stroke-width="2" />
  <text x="670" y="425" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">FACT Complex</text>
  <text x="670" y="450" text-anchor="middle" font-family="Arial" font-size="12">pob3 (SPBC609.05)</text>
  <text x="670" y="470" text-anchor="middle" font-family="Arial" font-size="12">spt16 (SPBP8B7.19)</text>
  <text x="670" y="490" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">Histone chaperone complex</text>
  
  <!-- Histone Methylation and HP1 Proteins -->
  <rect x="340" y="200" width="180" height="120" rx="10" ry="10" fill="#ffeeba" stroke="#856404" stroke-width="2" />
  <text x="430" y="225" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Histone Modifiers</text>
  <text x="430" y="250" text-anchor="middle" font-family="Arial" font-size="12">clr4 (SPBC428.08c)</text>
  <text x="430" y="270" text-anchor="middle" font-family="Arial" font-size="12">swi6 (SPAC664.01c)</text>
  <text x="430" y="290" text-anchor="middle" font-family="Arial" font-size="12">chp2 (SPBC16C6.10)</text>
  <text x="430" y="310" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">H3K9 methylation and binding</text>
  
  <!-- Histone Demethylases -->
  <rect x="340" y="550" width="180" height="100" rx="10" ry="10" fill="#d7f3e3" stroke="#28a745" stroke-width="2" />
  <text x="430" y="575" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Histone Demethylases</text>
  <text x="430" y="600" text-anchor="middle" font-family="Arial" font-size="12">lsd1 (SPBC146.09c)</text>
  <text x="430" y="620" text-anchor="middle" font-family="Arial" font-size="12">lsd2 (SPAC23E2.02)</text>
  <text x="430" y="640" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">H3K9 demethylation activity</text>
  
  <!-- Other Proteins -->
  <rect x="580" y="550" width="180" height="100" rx="10" ry="10" fill="#e8daef" stroke="#8e44ad" stroke-width="2" />
  <text x="670" y="575" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Other Factors</text>
  <text x="670" y="600" text-anchor="middle" font-family="Arial" font-size="12">rss1 (SPAC4H3.06)</text>
  <text x="670" y="620" text-anchor="middle" font-family="Arial" font-size="12">rad25 (SPAC17A2.13c)</text>
  <text x="670" y="640" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">Regulatory proteins</text>
  
  <!-- Connection Arrows with Labels-->
  <!-- CLRC to Histone Modifiers -->
  <path d="M 280,260 L 340,260" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="290" y="235" width="45" height="20" fill="white" opacity="0.8" rx="5" ry="5" />
  <text x="312" y="250" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">recruits</text>
  
  <!-- SHREC to Histone Modifiers -->
  <path d="M 520,260 L 460,260" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="470" y="235" width="45" height="20" fill="white" opacity="0.8" rx="5" ry="5" />
  <text x="492" y="250" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">recruits</text>
  
  <!-- RNAi to RITS -->
  <path d="M 280,460 L 340,460" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="290" y="435" width="45" height="20" fill="white" opacity="0.8" rx="5" ry="5" />
  <text x="313" y="450" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">siRNAs</text>
  
  <!-- RITS to Histone Modifiers -->
  <path d="M 430,400 L 430,320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="405" y="350" width="50" height="20" fill="white" opacity="0.8" rx="5" ry="5" />
  <text x="430" y="365" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">directs</text>
  
  <!-- FACT to Histone Modifiers -->
  <path d="M 670,400 C 620,350 550,330 460,260" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="565" y="350" width="60" height="20" fill="white" opacity="0.8" rx="5" ry="5" />
  <text x="595" y="365" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">facilitates</text>
  
  <!-- Histone Demethylases to Histone Modifiers -->
  <path d="M 400,550 C 380,450 380,400 400,320" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="6,4" stroke="#0b5394" />
  <rect x="335" y="440" width="70" height="20" fill="white" opacity="0.8" rx="5" ry="5" />
  <text x="370" y="455" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#0b5394">modulates</text>
  
  <!-- Other Factors to RNAi -->
  <path d="M 580,600 C 500,570 400,560 260,500" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="400" y="560" width="70" height="20" fill="white" opacity="0.8" rx="5" ry="5" />
  <text x="435" y="575" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">regulates</text>
  
  <!-- Arrow pointing to final outcome -->
  <rect x="410" y="90" width="180" height="30" rx="15" ry="15" fill="#ffd700" stroke="#856404" stroke-width="2" />
  <text x="500" y="110" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Heterochromatin Formation</text>
  <path d="M 430,200 C 470,180 480,140 500,120" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Chromatin illustration in telomere region -->
  <circle cx="200" cy="150" r="7" fill="#444" />
  <circle cx="220" cy="150" r="7" fill="#444" />
  <circle cx="240" cy="150" r="7" fill="#444" />
  <circle cx="260" cy="150" r="7" fill="#444" />
  <circle cx="280" cy="150" r="7" fill="#444" />
  <circle cx="300" cy="150" r="7" fill="#444" />
  <line x1="193" y1="150" x2="307" y2="150" stroke="#333" stroke-width="2" />
  
  <circle cx="500" cy="150" r="7" fill="#444" />
  <circle cx="520" cy="150" r="7" fill="#444" />
  <circle cx="540" cy="150" r="7" fill="#444" />
  <circle cx="560" cy="150" r="7" fill="#444" />
  <line x1="493" y1="150" x2="567" y2="150" stroke="#333" stroke-width="2" />
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="20" y="670" width="760" height="60" rx="5" ry="5" fill="white" stroke="#888" stroke-width="1" />
  <text x="40" y="690" font-family="Arial" font-size="12" font-weight="bold">Legend:</text>
  
  <rect x="100" y="685" width="15" height="15" fill="#d1e7dd" stroke="#198754" stroke-width="1" />
  <text x="120" y="697" font-family="Arial" font-size="12">CLRC Complex</text>
  
  <rect x="220" y="685" width="15" height="15" fill="#cff4fc" stroke="#0dcaf0" stroke-width="1" />
  <text x="240" y="697" font-family="Arial" font-size="12">SHREC Complex</text>
  
  <rect x="340" y="685" width="15" height="15" fill="#fff3cd" stroke="#ffc107" stroke-width="1" />
  <text x="360" y="697" font-family="Arial" font-size="12">RNAi Machinery</text>
  
  <rect x="460" y="685" width="15" height="15" fill="#f8d7da" stroke="#dc3545" stroke-width="1" />
  <text x="480" y="697" font-family="Arial" font-size="12">RITS Complex</text>
  
  <rect x="580" y="685" width="15" height="15" fill="#e2e3e5" stroke="#6c757d" stroke-width="1" />
  <text x="600" y="697" font-family="Arial" font-size="12">FACT Complex</text>
  
  <rect x="700" y="685" width="15" height="15" fill="#ffeeba" stroke="#856404" stroke-width="1" />
  <text x="720" y="697" font-family="Arial" font-size="12">Histone Modifiers</text>
  
  <line x1="40" y1="715" x2="70" y2="715" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="80" y="717" font-family="Arial" font-size="12">Positive Regulation</text>
  
  <line x1="220" y1="715" x2="250" y2="715" stroke="#0b5394" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead)" />
  <text x="260" y="717" font-family="Arial" font-size="12" fill="#0b5394">Regulatory Modulation</text>
  
  <circle cx="380" y="715" r="7" fill="#444" />
  <text x="395" y="717" font-family="Arial" font-size="12">Nucleosome</text>
  
  <text x="520" y="717" font-family="Arial" font-size="11" font-style="italic">Italics = functional description</text>
</svg>