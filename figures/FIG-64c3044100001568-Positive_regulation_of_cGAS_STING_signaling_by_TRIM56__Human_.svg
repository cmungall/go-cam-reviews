<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2" opacity="0.8"/>
  
  <!-- Cell nucleus -->
  <ellipse cx="250" cy="250" rx="150" ry="120" fill="#e6f2ff" stroke="#666" stroke-width="2"/>
  <text x="250" y="250" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Nucleus</text>
  
  <!-- Cytoplasm label -->
  <text x="450" y="150" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Cytoplasm</text>
  
  <!-- DNA in nucleus -->
  <path d="M150,250 C200,220 250,280 300,250" stroke="#6666cc" stroke-width="8" fill="none"/>
  <text x="225" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">dsDNA</text>
  
  <!-- cGAS protein -->
  <rect x="380" y="210" width="120" height="60" rx="10" ry="10" fill="#a1d99b" stroke="#333" stroke-width="2"/>
  <text x="440" y="245" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">cGAS</text>
  <text x="440" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(Q8N884)</text>
  
  <!-- TRIM56 protein -->
  <rect x="380" y="350" width="120" height="60" rx="10" ry="10" fill="#fdae6b" stroke="#333" stroke-width="2"/>
  <text x="440" y="385" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">TRIM56</text>
  <text x="440" y="405" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(Q9BRZ2)</text>
  
  <!-- STING (implied, not explicitly in GO-CAM) -->
  <rect x="580" y="210" width="120" height="60" rx="10" ry="10" fill="#cbd5e8" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="640" y="245" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">STING</text>
  <text x="640" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(not in source)</text>
  
  <!-- Monoubiquitination -->
  <path d="M440,350 C440,320 440,290 440,270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="420" cy="310" r="15" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="420" y="314" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Ub</text>
  <text x="495" y="310" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Protein monoubiquitination</text>
  <text x="495" y="325" font-family="Arial" font-size="10" text-anchor="start" fill="#666">(GO:0006513)</text>
  
  <!-- Ubiquitin ligase activity -->
  <text x="360" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Ubiquitin protein</text>
  <text x="360" y="445" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">ligase activity</text>
  <text x="360" y="460" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(GO:0061630)</text>
  
  <!-- DNA binding activity -->
  <path d="M300,250 C320,250 340,250 380,240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="320" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">dsDNA binding</text>
  <text x="320" y="245" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(GO:0003690)</text>
  
  <!-- cGAMP synthesis -->
  <path d="M500,240 C530,240 560,240 580,240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <ellipse cx="540" cy="220" rx="25" ry="12" fill="#b3e5fc" stroke="#333" stroke-width="1"/>
  <text x="540" y="223" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">cGAMP</text>
  <text x="540" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Cyclic GMP-AMP</text>
  <text x="540" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">synthase activity</text>
  <text x="540" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(GO:0061501)</text>
  
  <!-- Condensate formation -->
  <circle cx="440" cy="175" r="25" fill="#a1d99b" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="460" cy="165" r="20" fill="#a1d99b" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="425" cy="160" r="15" fill="#a1d99b" stroke="#333" stroke-width="1" opacity="0.5"/>
  <text x="440" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Molecular condensate</text>
  <text x="440" y="120" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">scaffold activity</text>
  <text x="440" y="105" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(GO:0140693)</text>
  
  <!-- Pathway label -->
  <text x="400" y="90" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">cGAS/STING Signaling Pathway</text>
  <text x="400" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Positive regulation by TRIM56 (GO:0140896)</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Downstream signaling (implied) -->
  <path d="M640,270 C640,300 640,330 640,360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <rect x="580" y="360" width="120" height="60" rx="25" ry="25" fill="#ffcc99" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="640" y="385" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Positive regulation of</text>
  <text x="640" y="405" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">innate immune response</text>
  <text x="640" y="420" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(implicit outcome)</text>

  <!-- Binding event between cGAS and dsDNA -->
  <path d="M380,230 L330,240" stroke="#333" stroke-width="2" marker-start="url(#circlemarker)"/>

  <!-- cGAS/STING pathway parts -->
  <path d="M440,175 C440,180 440,190 440,210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Circle marker for binding -->
  <defs>
    <marker id="circlemarker" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3" fill="white" stroke="#333" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="50" y="500" width="700" height="50" fill="#f0f0f0" stroke="#666" stroke-width="1"/>
  <text x="60" y="520" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Proteins:</text>
  <rect x="120" y="512" width="15" height="15" rx="3" ry="3" fill="#a1d99b" stroke="#333" stroke-width="1"/>
  <text x="140" y="520" font-family="Arial" font-size="12" fill="#333">cGAS</text>
  <rect x="180" y="512" width="15" height="15" rx="3" ry="3" fill="#fdae6b" stroke="#333" stroke-width="1"/>
  <text x="200" y="520" font-family="Arial" font-size="12" fill="#333">TRIM56</text>
  <circle cx="240" cy="520" r="7" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="255" y="520" font-family="Arial" font-size="12" fill="#333">Ubiquitin</text>
  
  <text x="60" y="540" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Interactions:</text>
  <path d="M120,540 L150,540" stroke="#333" stroke-width="2"/>
  <text x="170" y="540" font-family="Arial" font-size="12" fill="#333">Direct</text>
  <path d="M210,540 L240,540" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="260" y="540" font-family="Arial" font-size="12" fill="#333">Implicit</text>
  <rect x="315" y="532" width="15" height="15" rx="3" ry="3" fill="#ffffff" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="365" y="540" font-family="Arial" font-size="12" fill="#333">Not in source data</text>
  <ellipse cx="450" cy="520" rx="15" ry="7" fill="#b3e5fc" stroke="#333" stroke-width="1"/>
  <text x="475" y="520" font-family="Arial" font-size="12" fill="#333">Molecule</text>
  <text x="530" y="540" font-family="Arial" font-size="12" fill="#333">GO:XXXXX = Gene Ontology term ID</text>
</svg>