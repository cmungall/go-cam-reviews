<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  
  <!-- Nuclear membrane -->
  <ellipse cx="400" cy="300" rx="200" ry="150" fill="#e6f2ff" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="170" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Nucleus</text>
  <text x="400" y="190" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Mitotic Interphase</text>
  
  <!-- ER membrane -->
  <path d="M600,280 Q650,320 620,380 Q580,420 530,400" fill="none" stroke="#333" stroke-width="2"/>
  <text x="610" y="350" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">ER membrane</text>
  
  <!-- CGAS protein -->
  <circle cx="350" cy="280" r="30" fill="#f1c40f" stroke="#333" stroke-width="2"/>
  <text x="350" y="285" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CGAS</text>
  
  <!-- STING1 protein -->
  <rect x="520" y="350" width="60" height="40" rx="10" ry="10" fill="#3498db" stroke="#333" stroke-width="2"/>
  <text x="550" y="375" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">STING1</text>
  
  <!-- ECS complex components -->
  <circle cx="280" cy="280" r="25" fill="#e74c3c" stroke="#333" stroke-width="2"/>
  <text x="280" y="285" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CUL5</text>
  
  <circle cx="230" cy="310" r="20" fill="#9b59b6" stroke="#333" stroke-width="2"/>
  <text x="230" y="315" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">SPSB3</text>
  
  <circle cx="230" cy="250" r="20" fill="#2ecc71" stroke="#333" stroke-width="2"/>
  <text x="230" y="255" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RNF7</text>
  
  <!-- ECS complex bracket and labels -->
  <path d="M200,220 L180,220 L180,340 L200,340" fill="none" stroke="#333" stroke-width="2"/>
  <text x="150" y="280" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ECS</text>
  <text x="150" y="298" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Complex</text>
  
  <!-- Component role labels -->
  <text x="280" y="260" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Scaffold</text>
  <text x="230" y="330" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Adaptor</text>
  <text x="230" y="230" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">E3 Ligase</text>
  
  <!-- Ubiquitin tag -->
  <polygon points="350,230 360,240 350,250 340,240" fill="#ff9800" stroke="#333" stroke-width="1.5"/>
  <polygon points="370,230 380,240 370,250 360,240" fill="#ff9800" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="220" font-family="Arial" font-size="14" text-anchor="middle">K48-Ub</text>
  
  <!-- Proteasome -->
  <path d="M460,280 C480,265 500,265 520,280 C500,295 480,295 460,280 Z" fill="#95a5a6" stroke="#333" stroke-width="2"/>
  <text x="490" y="283" font-family="Arial" font-size="16" text-anchor="middle">Proteasome</text>
  
  <!-- cGAMP molecule -->
  <circle cx="450" cy="350" r="15" fill="#f39c12" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="355" font-family="Arial" font-size="14" text-anchor="middle">cGAMP</text>
  
  <!-- Process annotation boxes -->
  <!-- Ubiquitination process annotation -->
  <rect x="260" y="180" width="140" height="50" rx="5" ry="5" fill="#f8f9fa" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="330" y="195" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">K48-linked Ubiquitination</text>
  <text x="330" y="215" font-family="Arial" font-size="12" text-anchor="middle">RNF7 transfers ubiquitin to</text>
  <text x="330" y="230" font-family="Arial" font-size="12" text-anchor="middle">CGAS (targeted by SPSB3)</text>
  
  <!-- Degradation process annotation -->
  <rect x="410" y="180" width="140" height="50" rx="5" ry="5" fill="#f8f9fa" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="480" y="195" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Proteasomal Degradation</text>
  <text x="480" y="215" font-family="Arial" font-size="12" text-anchor="middle">K48-ubiquitinated CGAS is</text>
  <text x="480" y="230" font-family="Arial" font-size="12" text-anchor="middle">recognized and degraded</text>
  
  <!-- CGAS activity annotation -->
  <rect x="380" y="330" width="150" height="50" rx="5" ry="5" fill="#f8f9fa" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="455" y="350" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CGAS Activity</text>
  <text x="455" y="370" font-family="Arial" font-size="12" text-anchor="middle">Synthesizes cGAMP</text>
  <text x="455" y="385" font-family="Arial" font-size="12" text-anchor="middle">(2',3'-cyclic GMP-AMP)</text>
  
  <!-- Pathway arrows with improved spacing -->
  <!-- CGAS to cGAMP -->
  <path d="M365,310 Q400,340 435,350" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- cGAMP to STING1 -->
  <path d="M465,350 L510,350" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- CUL5 to SPSB3 -->
  <path d="M260,290 L240,300" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- CUL5 to RNF7 -->
  <path d="M260,270 L240,260" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ECS complex to CGAS -->
  <path d="M255,280 L320,280" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- CGAS to Proteasome -->
  <path d="M380,280 L455,280" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  
  <!-- Negative regulation annotation -->
  <path d="M310,240 L280,220" fill="none" stroke="#ff0000" stroke-width="2" marker-end="url(#redArrowhead)"/>
  <text x="310" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff0000">Negatively regulates</text>
  <text x="310" y="267" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff0000">cGAS/STING pathway</text>
  
  <!-- Legend -->
  <rect x="20" y="470" width="260" height="120" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="150" y="490" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="40" cy="515" r="8" fill="#f1c40f" stroke="#333" stroke-width="1"/>
  <text x="180" y="518" font-family="Arial" font-size="14" text-anchor="left">CGAS (2',3'-cyclic GMP-AMP synthase)</text>
  
  <rect x="32" cy="535" width="16" height="10" rx="3" ry="3" fill="#3498db" stroke="#333" stroke-width="1"/>
  <text x="180" y="538" font-family="Arial" font-size="14" text-anchor="left">STING1 (Stimulator of interferon genes)</text>
  
  <circle cx="40" cy="555" r="8" fill="#e74c3c" stroke="#333" stroke-width="1"/>
  <text x="180" y="558" font-family="Arial" font-size="14" text-anchor="left">CUL5 (Scaffold protein)</text>
  
  <circle cx="40" cy="575" r="8" fill="#9b59b6" stroke="#333" stroke-width="1"/>
  <text x="180" y="578" font-family="Arial" font-size="14" text-anchor="left">SPSB3 (Substrate recognition adaptor)</text>
  
  <circle cx="40" cy="595" r="8" fill="#2ecc71" stroke="#333" stroke-width="1"/>
  <text x="180" y="598" font-family="Arial" font-size="14" text-anchor="left">RNF7 (E3 ubiquitin-protein ligase)</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">ECS(SPSB3) Complex Mediates Ubiquitination and Degradation of CGAS</text>
  <text x="400" y="65" font-family="Arial" font-size="18" text-anchor="middle">in the Nucleus During Mitotic Interphase</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <marker id="redArrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0000"/>
    </marker>
  </defs>
</svg>