<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell nucleus background -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f8f8f8" stroke="#888" stroke-width="2"/>
  <text x="400" y="55" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Cell Nucleus</text>
  
  <!-- DNA double-strand break -->
  <path d="M 150,300 H 650" stroke="#333" stroke-width="8" stroke-dasharray="10,5"/>
  <text x="400" y="280" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Site of Double-Strand Break (GO:0035861)</text>
  
  <!-- DNA Break Focus (magnified area) -->
  <circle cx="400" cy="350" r="150" fill="#e6f0ff" stroke="#666" stroke-width="2"/>
  
  <!-- Histone marks (implicit detail) -->
  <circle cx="320" y="220" r="15" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="320" y="224" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">H</text>
  <text x="340" y="215" text-anchor="start" font-family="Arial" font-size="12" font-style="italic" fill="#666">Modified histone</text>
  <text x="340" y="230" text-anchor="start" font-family="Arial" font-size="12" font-style="italic" fill="#666">(Implicit)</text>
  
  <!-- Proteins and interactions -->
  <!-- TP53BP1 -->
  <rect x="300" y="250" width="80" height="40" rx="10" ry="10" fill="#9fc5e8" stroke="#333" stroke-width="2"/>
  <text x="340" y="275" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">TP53BP1</text>
  
  <!-- DYNLL1 -->
  <rect x="370" y="330" width="70" height="40" rx="10" ry="10" fill="#d5a6bd" stroke="#333" stroke-width="2"/>
  <text x="405" y="355" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">DYNLL1</text>
  
  <!-- MRE11 -->
  <rect x="400" y="420" width="70" height="40" rx="10" ry="10" fill="#b6d7a8" stroke="#333" stroke-width="2"/>
  <text x="435" y="445" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">MRE11</text>
  
  <!-- Histone recognition arrow -->
  <path d="M 325,235 L 335,250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,2"/>
  
  <!-- Recruitment arrow from TP53BP1 to DYNLL1 -->
  <path d="M 350,290 L 390,330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="350" y="320" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Recruits</text>
  
  <!-- Inhibition arrow from DYNLL1 to MRE11 -->
  <path d="M 405,370 L 425,420" stroke="#ff0000" stroke-width="2" marker-end="url(#inhibit)"/>
  <text x="390" y="395" text-anchor="middle" font-family="Arial" font-size="14" fill="#ff0000">Inhibits</text>
  
  <!-- DNA resection representation -->
  <path d="M 450,430 L 500,430" stroke="#333" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="520" y="435" text-anchor="start" font-family="Arial" font-size="12">DNA end resection</text>
  <text x="520" y="450" text-anchor="start" font-family="Arial" font-size="12">(limited by DYNLL1)</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
    refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="inhibit" markerWidth="10" markerHeight="10"
    refX="5" refY="5" orient="auto">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#ff0000" stroke-width="2"/>
      <line x1="0" y1="10" x2="10" y2="0" stroke="#ff0000" stroke-width="2"/>
    </marker>
  </defs>
  
  <!-- MRE11 Activities -->
  <text x="520" y="390" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold">MRE11 Activities:</text>
  <text x="520" y="410" text-anchor="start" font-family="Arial" font-size="12">- DNA Endonuclease (GO:0004520)</text>
  <text x="520" y="425" text-anchor="start" font-family="Arial" font-size="12">- 3'-5' DNA Exonuclease (GO:0008296)</text>
  
  <!-- Biological Processes -->
  <rect x="150" y="500" width="500" height="60" rx="10" ry="10" fill="#f9e6ff" stroke="#888" stroke-width="1"/>
  <text x="400" y="520" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Biological Processes</text>
  <text x="250" y="540" text-anchor="middle" font-family="Arial" font-size="12">DNA strand resection involved in</text>
  <text x="250" y="555" text-anchor="middle" font-family="Arial" font-size="12">replication fork processing (GO:0110025)</text>
  <text x="550" y="540" text-anchor="middle" font-family="Arial" font-size="12">Negative regulation of DNA strand</text>
  <text x="550" y="555" text-anchor="middle" font-family="Arial" font-size="12">resection (GO:0110027)</text>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">DYNLL1 Binding to MRE11 Limits DNA End Resection</text>
  
  <!-- Legend -->
  <rect x="100" y="100" width="180" height="140" rx="10" ry="10" fill="white" stroke="#888" stroke-width="1" fill-opacity="0.9"/>
  <text x="190" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <!-- TP53BP1 legend -->
  <rect x="110" y="130" width="20" height="15" rx="3" ry="3" fill="#9fc5e8" stroke="#333" stroke-width="1"/>
  <text x="140" y="143" text-anchor="start" font-family="Arial" font-size="12">TP53BP1 (Histone reader)</text>
  
  <!-- DYNLL1 legend -->
  <rect x="110" y="155" width="20" height="15" rx="3" ry="3" fill="#d5a6bd" stroke="#333" stroke-width="1"/>
  <text x="140" y="168" text-anchor="start" font-family="Arial" font-size="12">DYNLL1 (Enzyme inhibitor)</text>
  
  <!-- MRE11 legend -->
  <rect x="110" y="180" width="20" height="15" rx="3" ry="3" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
  <text x="140" y="193" text-anchor="start" font-family="Arial" font-size="12">MRE11 (Nuclease)</text>
  
  <!-- Interaction legend -->
  <line x1="110" y1="210" x2="130" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="140" y="213" text-anchor="start" font-family="Arial" font-size="12">Promotion</text>
  
  <line x1="110" y1="225" x2="130" y2="225" stroke="#ff0000" stroke-width="2" marker-end="url(#inhibit)"/>
  <text x="140" y="228" text-anchor="start" font-family="Arial" font-size="12">Inhibition</text>
</svg>