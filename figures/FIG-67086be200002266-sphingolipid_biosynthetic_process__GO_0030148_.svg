<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell compartments -->
  <rect x="50" y="100" width="700" height="550" rx="20" ry="20" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <rect x="100" y="170" width="600" height="330" rx="15" ry="15" fill="#e6f2ff" stroke="#6699cc" stroke-width="2"/>
  <rect x="400" y="520" width="250" height="110" rx="15" ry="15" fill="#ffe6cc" stroke="#ff9933" stroke-width="2"/>
  
  <!-- Labels for compartments -->
  <text x="60" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Cell</text>
  <text x="110" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Endoplasmic Reticulum (ER)</text>
  <text x="410" y="540" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Golgi Apparatus</text>
  
  <!-- Add arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Pathway molecules and reactions -->
  
  <!-- Sphingolipid synthesis starts with Serine and Palmitoyl-CoA -->
  <circle cx="150" cy="250" r="15" fill="#b3ffb3" stroke="green" stroke-width="2"/>
  <text x="115" y="230" font-family="Arial" font-size="12" fill="#333333" font-weight="bold">L-Serine</text>
  
  <circle cx="230" cy="250" r="15" fill="#b3d9ff" stroke="blue" stroke-width="2"/>
  <text x="190" y="230" font-family="Arial" font-size="12" fill="#333333" font-weight="bold">Palmitoyl-CoA</text>
  
  <!-- Reaction 1: SPT complex -->
  <rect x="170" y="280" width="80" height="30" rx="8" ry="8" fill="#ffb3b3" stroke="#cc0000" stroke-width="1.5"/>
  <text x="210" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">SPT complex</text>
  <text x="210" y="320" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">lcb1, lcb2, tsc3</text>
  
  <!-- Arrows to SPT -->
  <line x1="150" y1="260" x2="180" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="230" y1="260" x2="200" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- 3-keto-sphinganine product -->
  <circle cx="190" cy="350" r="15" fill="#ffff99" stroke="#999900" stroke-width="2"/>
  <text x="110" y="380" font-family="Arial" font-size="12" fill="#333333" font-weight="bold">3-keto-sphinganine</text>
  
  <!-- Arrow from SPT to 3-keto-sphinganine -->
  <line x1="190" y1="310" x2="190" y2="335" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Reaction 2: KDHR (3-keto-sphinganine reductase) -->
  <rect x="150" y="400" width="80" height="30" rx="8" ry="8" fill="#ffb3b3" stroke="#cc0000" stroke-width="1.5"/>
  <text x="190" y="420" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">KDHR</text>
  <text x="190" y="435" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">SPCC1450.15</text>
  
  <!-- Arrow to KDHR -->
  <line x1="190" y1="365" x2="190" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Dihydrosphingosine/Sphinganine -->
  <circle cx="300" cy="400" r="15" fill="#ffff99" stroke="#999900" stroke-width="2"/>
  <text x="240" y="375" font-family="Arial" font-size="12" fill="#333333" font-weight="bold">Dihydrosphingosine</text>
  
  <!-- Arrow from KDHR to dihydrosphingosine -->
  <line x1="230" y1="415" x2="285" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Ceramide synthase complex -->
  <rect x="350" y="385" width="100" height="30" rx="8" ry="8" fill="#ffb3b3" stroke="#cc0000" stroke-width="1.5"/>
  <text x="400" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Ceramide synthase</text>
  <text x="400" y="420" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">lag1, lac1</text>
  
  <!-- Arrow to ceramide synthase -->
  <line x1="315" y1="400" x2="350" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Dihydroceramide -->
  <circle cx="480" cy="400" r="15" fill="#ffff99" stroke="#999900" stroke-width="2"/>
  <text x="480" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Dihydroceramide</text>
  
  <!-- Arrow from Ceramide synthase to dihydroceramide -->
  <line x1="450" y1="400" x2="465" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Dihydroceramide desaturase -->
  <rect x="520" y="385" width="80" height="30" rx="8" ry="8" fill="#ffb3b3" stroke="#cc0000" stroke-width="1.5"/>
  <text x="560" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Desaturase</text>
  <text x="560" y="420" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">dsd1</text>
  
  <!-- Arrow to desaturase -->
  <line x1="495" y1="400" x2="520" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Ceramide -->
  <circle cx="630" cy="400" r="15" fill="#ffff99" stroke="#999900" stroke-width="2"/>
  <text x="630" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Ceramide</text>
  
  <!-- Arrow from desaturase to ceramide -->
  <line x1="600" y1="400" x2="615" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Ceramide hydroxylase -->
  <rect x="580" y="330" width="100" height="30" rx="8" ry="8" fill="#ffb3b3" stroke="#cc0000" stroke-width="1.5"/>
  <text x="630" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Hydroxylase</text>
  <text x="630" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">sur2, scs7</text>
  
  <!-- Arrows to and from hydroxylase -->
  <line x1="630" y1="385" x2="630" y2="360" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Phytoceramide -->
  <circle cx="630" cy="280" r="15" fill="#ffff99" stroke="#999900" stroke-width="2"/>
  <text x="630" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Phytoceramide</text>
  
  <!-- Arrow from hydroxylase to phytoceramide -->
  <line x1="630" y1="330" x2="630" y2="295" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- ER to Golgi transport proteins -->
  <rect x="480" y="230" width="90" height="30" rx="8" ry="8" fill="#d9b3ff" stroke="#6600cc" stroke-width="1.5"/>
  <text x="525" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">ER to Golgi</text>
  <text x="525" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">svf1, svf2</text>
  
  <!-- Arrow from phytoceramide to transport -->
  <line x1="620" y1="280" x2="550" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Transport arrow to Golgi - Made thicker and more prominent -->
  <line x1="525" y1="260" x2="525" y2="520" stroke="#333" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#arrowhead)"/>
  
  <!-- IPC synthase in Golgi -->
  <rect x="480" y="560" width="80" height="30" rx="8" ry="8" fill="#ffb3b3" stroke="#cc0000" stroke-width="1.5"/>
  <text x="520" y="580" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">IPC synthase</text>
  <text x="520" y="595" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">aur1, kei1</text>
  
  <!-- IPC (Inositol phosphoceramide) -->
  <circle cx="600" cy="560" r="15" fill="#ffff99" stroke="#999900" stroke-width="2"/>
  <text x="600" y="585" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">IPC</text>
  
  <!-- Arrow to IPC synthase -->
  <line x1="525" y1="540" x2="520" y2="560" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from IPC synthase to IPC -->
  <line x1="560" y1="575" x2="585" y2="560" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- MIPC synthesis -->
  <rect x="480" y="610" width="80" height="30" rx="8" ry="8" fill="#ffb3b3" stroke="#cc0000" stroke-width="1.5"/>
  <text x="520" y="630" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">MIPC synthase</text>
  <text x="520" y="645" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">imt1, imt2, imt3</text>
  
  <!-- Arrow to MIPC synthase -->
  <line x1="600" y1="575" x2="530" y2="610" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- MIPC (Mannosylinositol phosphorylceramide) -->
  <circle cx="600" cy="625" r="15" fill="#ffff99" stroke="#999900" stroke-width="2"/>
  <text x="600" y="650" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">MIPC</text>
  
  <!-- Arrow from MIPC synthase to MIPC -->
  <line x1="560" y1="625" x2="585" y2="625" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Legend for Elongation Pathway - moved slightly to avoid overlaps -->
  <rect x="120" y="470" width="170" height="80" rx="5" ry="5" fill="#f9f9f9" stroke="#666666" stroke-width="1"/>
  <text x="130" y="490" font-family="Arial" font-size="12" font-weight="bold" fill="#333333">Fatty Acid Elongation</text>
  <text x="130" y="510" font-family="Arial" font-size="10" fill="#333333">elo1, elo2 - Elongases</text>
  <text x="130" y="525" font-family="Arial" font-size="10" fill="#333333">phs1 - Dehydratase</text>
  <text x="130" y="540" font-family="Arial" font-size="10" fill="#333333">tsc13 - Reductase</text>
  
  <!-- Regulatory elements -->
  <rect x="300" y="250" width="80" height="30" rx="5" ry="5" fill="#ffccf2" stroke="#ff66cc" stroke-width="1.5"/>
  <text x="340" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Regulation</text>
  <text x="340" y="285" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">orm1</text>
  
  <!-- Added a legend for the arrows and symbols -->
  <rect x="580" y="140" width="150" height="75" rx="5" ry="5" fill="#f9f9f9" stroke="#666666" stroke-width="1"/>
  <text x="590" y="160" font-family="Arial" font-size="12" font-weight="bold" fill="#333333">Legend</text>
  <line x1="590" y1="170" x2="610" y2="170" stroke="#333" stroke-width="1.5"/>
  <text x="615" y="173" font-family="Arial" font-size="10" fill="#333333">Reaction</text>
  <line x1="590" y1="185" x2="610" y2="185" stroke="#333" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="615" y="188" font-family="Arial" font-size="10" fill="#333333">Transport</text>
  <circle cx="595" cy="200" r="5" fill="#ffff99" stroke="#999900" stroke-width="1"/>
  <text x="615" y="203" font-family="Arial" font-size="10" fill="#333333">Metabolite</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333333">Sphingolipid Biosynthetic Pathway in Fission Yeast</text>
  <text x="400" y="80" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666666">Sphingolipid biosynthetic process (GO:0030148)</text>
</svg>