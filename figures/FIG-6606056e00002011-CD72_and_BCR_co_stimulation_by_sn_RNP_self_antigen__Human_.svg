<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Background -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2" />
  
  <!-- Plasma Membrane -->
  <path d="M 50 150 
           H 750" 
        stroke="#7A7A7A" stroke-width="6" fill="none" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">CD72 and BCR co-stimulation by sn/RNP self antigen (Human)</text>
  
  <!-- Label for extracellular and intracellular spaces -->
  <text x="100" y="120" font-family="Arial" font-size="14" font-style="italic">Extracellular space</text>
  <text x="100" y="200" font-family="Arial" font-size="14" font-style="italic">Cytoplasm</text>
  
  <!-- sn/RNP self antigen in extracellular space -->
  <circle cx="400" cy="100" r="25" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
  <text x="400" y="105" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">sn/RNP</text>
  
  <!-- B Cell Receptor Complex (BCR) -->
  <rect x="280" y="130" width="80" height="40" rx="5" ry="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" />
  <text x="320" y="155" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">BCR Complex</text>
  <text x="320" y="178" font-family="Arial" font-size="10" text-anchor="middle">(CD79A/CD79B)</text>
  
  <!-- CD72 Receptor -->
  <rect x="480" y="130" width="80" height="40" rx="5" ry="5" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="520" y="155" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">CD72</text>
  
  <!-- LYN Kinase -->
  <ellipse cx="320" cy="220" rx="40" ry="25" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
  <text x="320" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">LYN</text>
  
  <!-- Phosphorylated CD72 -->
  <ellipse cx="520" cy="280" rx="40" ry="25" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="520" y="275" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">CD72</text>
  <text x="520" y="290" font-family="Arial" font-size="10" text-anchor="middle">phosphorylated</text>
  
  <!-- PTPN6 (SHP-1) -->
  <ellipse cx="400" cy="350" rx="45" ry="25" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
  <text x="400" y="345" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">PTPN6</text>
  <text x="400" y="360" font-family="Arial" font-size="10" text-anchor="middle">(SHP-1)</text>
  
  <!-- B cell signaling outcome -->
  <rect x="320" y="430" width="160" height="40" rx="5" ry="5" fill="#f8cecc" stroke="#b85450" stroke-width="2" />
  <text x="400" y="445" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Negative regulation of</text>
  <text x="400" y="460" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">BCR signaling pathway</text>
  
  <!-- B cell homeostasis -->
  <rect x="320" y="500" width="160" height="30" rx="15" ry="15" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="400" y="520" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">B cell homeostasis</text>
  
  <!-- Connections/Arrows -->
  <!-- sn/RNP to BCR -->
  <path d="M 385 115 L 340 130" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="350" y="115" font-family="Arial" font-size="11" text-anchor="middle">binds</text>
  
  <!-- sn/RNP to CD72 -->
  <path d="M 415 115 L 490 130" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="465" y="115" font-family="Arial" font-size="11" text-anchor="middle">binds</text>
  
  <!-- BCR to LYN - activation -->
  <path d="M 320 170 L 320 195" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="295" y="185" font-family="Arial" font-size="11" text-anchor="middle">activates</text>
  
  <!-- LYN to CD72 - phosphorylation -->
  <path d="M 350 235 C 400 240, 450 255, 485 280" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="420" y="245" font-family="Arial" font-size="11" text-anchor="middle">phosphorylates</text>
  
  <!-- CD72 to PTPN6 - recruitment -->
  <path d="M 490 300 C 470 315, 450 330, 430 345" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="435" y="310" font-family="Arial" font-size="11" text-anchor="middle">recruits</text>
  
  <!-- PTPN6 to negative regulation outcome -->
  <path d="M 400 375 L 400 430" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="420" y="405" font-family="Arial" font-size="11" text-anchor="middle">triggers</text>
  
  <!-- Negative regulation to B cell homeostasis -->
  <path d="M 400 470 L 400 500" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="420" y="485" font-family="Arial" font-size="11" text-anchor="middle">leads to</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <!-- Process labels with GO terms -->
  <text x="200" y="225" font-family="Arial" font-size="11" text-anchor="middle">Protein tyrosine</text>
  <text x="200" y="240" font-family="Arial" font-size="11" text-anchor="middle">kinase activity</text>
  <text x="200" y="255" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">(GO:0004713)</text>
  
  <text x="620" y="280" font-family="Arial" font-size="11" text-anchor="middle">Transmembrane</text>
  <text x="620" y="295" font-family="Arial" font-size="11" text-anchor="middle">signaling receptor</text>
  <text x="620" y="310" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">(GO:0004888)</text>
  
  <text x="520" y="350" font-family="Arial" font-size="11" text-anchor="middle">Protein tyrosine</text>
  <text x="520" y="365" font-family="Arial" font-size="11" text-anchor="middle">phosphatase activity</text>
  <text x="520" y="380" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">(GO:0004725)</text>
  
  <!-- Legend -->
  <rect x="570" y="470" width="170" height="80" fill="white" stroke="#666" stroke-width="1" />
  <text x="580" y="485" font-family="Arial" font-size="11" font-weight="bold">Legend:</text>
  
  <rect x="580" y="495" width="10" height="10" fill="none" stroke="#7A7A7A" stroke-width="2" />
  <text x="595" y="503" font-family="Arial" font-size="10">Plasma membrane (GO:0005886)</text>
  
  <rect x="580" y="510" width="10" height="10" fill="#f9f9f9" stroke="#666" stroke-width="1" />
  <text x="595" y="518" font-family="Arial" font-size="10">Cytoplasm (GO:0005737)</text>
  
  <rect x="580" y="525" width="10" height="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <text x="595" y="533" font-family="Arial" font-size="10">BCR complex (GO:0019815)</text>
  
  <rect x="580" y="540" width="10" height="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1" />
  <text x="595" y="548" font-family="Arial" font-size="10">CD72 (UniProtKB:P21854)</text>
</svg>