<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membranes -->
  <ellipse cx="400" cy="400" rx="350" ry="150" fill="#f0f0f0" stroke="#000" stroke-width="2" opacity="0.3"/>
  <text x="400" y="520" font-family="Arial" font-size="16" text-anchor="middle">T Cell</text>
  
  <path d="M650,300 Q 750,350 650,400" fill="none" stroke="#000" stroke-width="2"/>
  <text x="700" y="350" font-family="Arial" font-size="16" text-anchor="middle">Tumor Cell</text>
  
  <!-- Membrane proteins and interactions -->
  <rect x="610" y="340" width="30" height="15" fill="#90EE90" stroke="#000" stroke-width="1.5"/>
  <text x="625" y="325" font-family="Arial" font-size="12" text-anchor="middle">PD-L1</text>
  <text x="625" y="337" font-family="Arial" font-size="9" text-anchor="middle">(CD274)</text>
  
  <rect x="570" y="340" width="30" height="15" fill="#ADD8E6" stroke="#000" stroke-width="1.5"/>
  <text x="585" y="325" font-family="Arial" font-size="12" text-anchor="middle">PD-1</text>
  <text x="585" y="337" font-family="Arial" font-size="9" text-anchor="middle">(PDCD1)</text>
  
  <!-- Binding interaction -->
  <line x1="600" y1="347" x2="610" y2="347" stroke="#000" stroke-width="1.5"/>
  <text x="595" y="375" font-family="Arial" font-size="10" text-anchor="middle">Receptor-ligand interaction</text>
  <text x="595" y="387" font-family="Arial" font-size="10" text-anchor="middle">(Inhibits T cell activation)</text>
  
  <!-- Cytoplasmic pathway -->
  <!-- AMPK activation -->
  <circle cx="300" cy="300" r="22" fill="#FF9999" stroke="#000" stroke-width="1.5"/>
  <text x="300" y="303" font-family="Arial" font-size="12" text-anchor="middle">AMPK</text>
  <text x="300" y="315" font-family="Arial" font-size="9" text-anchor="middle">(PRKAA1)</text>
  
  <!-- Downstream of AMPK -->
  <circle cx="370" cy="350" r="22" fill="#FFC0CB" stroke="#000" stroke-width="1.5"/>
  <text x="370" y="353" font-family="Arial" font-size="12" text-anchor="middle">YWHAG</text>
  
  <!-- UFL1 -->
  <circle cx="450" cy="350" r="22" fill="#FFCC99" stroke="#000" stroke-width="1.5"/>
  <text x="450" y="353" font-family="Arial" font-size="12" text-anchor="middle">UFL1</text>
  
  <!-- Ubiquitin ligase adaptors -->
  <circle cx="380" cy="250" r="22" fill="#C0C0FF" stroke="#000" stroke-width="1.5"/>
  <text x="380" y="253" font-family="Arial" font-size="12" text-anchor="middle">KLHL22</text>
  <text x="380" y="230" font-family="Arial" font-size="9" text-anchor="middle">CUL3 adaptor</text>
  
  <circle cx="520" cy="250" r="22" fill="#C0C0FF" stroke="#000" stroke-width="1.5"/>
  <text x="520" y="253" font-family="Arial" font-size="12" text-anchor="middle">FBXO38</text>
  <text x="520" y="230" font-family="Arial" font-size="9" text-anchor="middle">SCF adaptor</text>
  
  <!-- Ufmylation of PD-1 -->
  <circle cx="520" cy="330" r="17" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
  <text x="520" y="333" font-family="Arial" font-size="10" text-anchor="middle">UFM1</text>
  
  <!-- Connections with improved styles -->
  <!-- AMPK to YWHAG: activation arrow (solid) -->
  <line x1="320" y1="306" x2="353" y2="338" stroke="#FF5555" stroke-width="2.5" marker-end="url(#activationArrow)"/>
  <text x="320" y="325" font-family="Arial" font-size="10" text-anchor="start">Activates</text>
  
  <!-- YWHAG to UFL1: promotion arrow (dashed) -->
  <line x1="392" y1="350" x2="425" y2="350" stroke="#0066CC" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#promotionArrow)"/>
  <text x="408" y="340" font-family="Arial" font-size="10" text-anchor="middle">Promotes</text>
  
  <!-- UFL1 to KLHL22: promotion arrows -->
  <path d="M442,330 C440,300 410,290 390,270" fill="none" stroke="#0066CC" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#promotionArrow)"/>
  <text x="400" y="310" font-family="Arial" font-size="10" text-anchor="start">Promotes</text>
  
  <!-- UFL1 to FBXO38: promotion arrows -->
  <path d="M470,335 C485,310 500,280 510,270" fill="none" stroke="#0066CC" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#promotionArrow)"/>
  <text x="495" y="310" font-family="Arial" font-size="10" text-anchor="start">Promotes</text>
  
  <!-- UFL1 to UFM1: UFM1 ligase activity (solid with label) -->
  <line x1="470" y1="360" x2="505" y2="340" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="385" font-family="Arial" font-size="10" text-anchor="start">UFM1 ligase</text>
  <text x="460" y="397" font-family="Arial" font-size="10" text-anchor="start">activity</text>
  
  <!-- UFM1 to PD-1: ufmylation (solid) -->
  <line x1="535" y1="320" x2="567" y2="339" stroke="#006600" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="535" y="310" font-family="Arial" font-size="10" text-anchor="start">Ufmylation</text>
  
  <!-- KLHL22 to PD-1: degradation (red dashed) -->
  <path d="M380,230 C380,200 520,200 560,330" fill="none" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#degradationArrow)"/>
  <text x="390" y="195" font-family="Arial" font-size="10" text-anchor="start">Proteasomal degradation</text>
  
  <!-- FBXO38 to PD-1: degradation (red dashed) -->
  <path d="M520,230 C520,210 550,270 565,335" fill="none" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#degradationArrow)"/>
  <text x="525" y="195" font-family="Arial" font-size="10" text-anchor="end">SCF-dependent degradation</text>
  
  <!-- Biological processes boxes -->
  <rect x="200" y="150" width="180" height="50" rx="10" ry="10" fill="#F8F8FF" stroke="#000" stroke-width="1.5"/>
  <text x="290" y="175" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Positive regulation of</text>
  <text x="290" y="190" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">T cell immune response</text>
  
  <rect x="420" y="150" width="180" height="50" rx="10" ry="10" fill="#FFF0F5" stroke="#000" stroke-width="1.5"/>
  <text x="510" y="175" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Negative regulation of</text>
  <text x="510" y="190" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">T cell immune response</text>
  
  <!-- Connection to biological processes -->
  <line x1="300" y1="278" x2="290" y2="205" stroke="#000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrowhead)"/>
  <line x1="585" y1="320" x2="510" y2="205" stroke="#000" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrowhead)"/>
  
  <!-- Legend with improved styling -->
  <rect x="630" y="440" width="160" height="150" fill="#FFFFFF" stroke="#000" stroke-width="1.5" rx="5" ry="5"/>
  <text x="710" y="460" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  
  <circle cx="645" cy="480" r="8" fill="#FF9999" stroke="#000" stroke-width="1"/>
  <text x="710" y="483" font-family="Arial" font-size="11">Kinase (AMPK)</text>
  
  <circle cx="645" cy="500" r="8" fill="#FFCC99" stroke="#000" stroke-width="1"/>
  <text x="710" y="503" font-family="Arial" font-size="11">E3 UFM1 ligase (UFL1)</text>
  
  <circle cx="645" cy="520" r="8" fill="#C0C0FF" stroke="#000" stroke-width="1"/>
  <text x="725" y="523" font-family="Arial" font-size="11">Ubiquitin ligase adaptors</text>
  
  <rect x="637" y="535" width="16" height="8" fill="#ADD8E6" stroke="#000" stroke-width="1"/>
  <text x="705" y="538" font-family="Arial" font-size="11">Receptor (PD-1)</text>
  
  <rect x="637" y="555" width="16" height="8" fill="#90EE90" stroke="#000" stroke-width="1"/>
  <text x="705" y="558" font-family="Arial" font-size="11">Ligand (PD-L1)</text>
  
  <line x1="637" y1="575" x2="653" y2="575" stroke="#FF5555" stroke-width="2.5"/>
  <text x="720" y="578" font-family="Arial" font-size="11">Activation</text>
  
  <line x1="637" y1="595" x2="653" y2="595" stroke="#CC0000" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="720" y="598" font-family="Arial" font-size="11">Degradation</text>
  
  <!-- Arrowhead definitions with improved styling -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <marker id="activationArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF5555"/>
    </marker>
    <marker id="promotionArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066CC"/>
    </marker>
    <marker id="degradationArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#CC0000"/>
    </marker>
  </defs>
</svg>