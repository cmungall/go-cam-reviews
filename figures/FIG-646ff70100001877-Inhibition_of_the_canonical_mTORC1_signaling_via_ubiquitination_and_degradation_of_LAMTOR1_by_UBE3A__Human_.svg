<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background with lysosome -->
  <rect x="50" y="50" width="700" height="550" rx="20" ry="20" fill="#f8f9fa" stroke="#d0d0d0" stroke-width="2" />
  <text x="60" y="80" font-family="Arial" font-size="18" fill="#666">Cytoplasm</text>
  
  <!-- Lysosome -->
  <ellipse cx="400" cy="350" rx="180" ry="120" fill="#e6e6fa" stroke="#9370db" stroke-width="2" />
  <text x="400" y="280" font-family="Arial" font-size="16" fill="#666" text-anchor="middle">Lysosome</text>
  
  <!-- Lysosomal membrane -->
  <path d="M 220,350 Q 400,310 580,350 Q 400,390 220,350" fill="none" stroke="#9370db" stroke-width="4" stroke-dasharray="5,3" />
  <text x="400" y="345" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">Lysosomal membrane</text>
  <text x="400" y="362" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">(GO:0005765)</text>
  
  <!-- UBE3A protein -->
  <circle cx="200" cy="150" r="40" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="200" y="155" font-family="Arial" font-size="16" fill="#000" text-anchor="middle">UBE3A</text>
  <text x="200" y="175" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">(Q05086)</text>
  
  <!-- Ubiquitin ligase activity label -->
  <rect x="120" y="80" width="160" height="40" rx="10" ry="10" fill="#ffe6e6" stroke="#cc0000" stroke-width="1" />
  <text x="200" y="105" font-family="Arial" font-size="12" fill="#cc0000" text-anchor="middle">Ubiquitin protein ligase activity</text>
  <text x="200" y="120" font-family="Arial" font-size="10" fill="#cc0000" text-anchor="middle">(GO:0061630)</text>
  
  <!-- LAMTOR1 protein on lysosomal membrane -->
  <rect x="350" y="330" width="100" height="40" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
  <text x="400" y="350" font-family="Arial" font-size="16" fill="#000" text-anchor="middle">LAMTOR1</text>
  <text x="400" y="365" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">(Q6IAA8)</text>
  
  <!-- Role of LAMTOR1 -->
  <rect x="240" y="390" width="160" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#0066cc" stroke-width="1" />
  <text x="320" y="410" font-family="Arial" font-size="11" fill="#0066cc" text-anchor="middle">Membrane adaptor protein</text>
  <text x="320" y="425" font-family="Arial" font-size="10" fill="#0066cc" text-anchor="middle">Anchors Ragulator to lysosome</text>
  
  <!-- Ragulator complex -->
  <rect x="500" y="330" width="120" height="40" rx="10" ry="10" fill="#ccffcc" stroke="#009900" stroke-width="2" />
  <text x="560" y="350" font-family="Arial" font-size="16" fill="#000" text-anchor="middle">Ragulator</text>
  <text x="560" y="365" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">(GO:0071986)</text>
  
  <!-- Role of Ragulator -->
  <rect x="600" y="370" width="140" height="40" rx="5" ry="5" fill="#e6ffe6" stroke="#009900" stroke-width="1" />
  <text x="670" y="390" font-family="Arial" font-size="11" fill="#009900" text-anchor="middle">GEF for Rag GTPases</text>
  <text x="670" y="405" font-family="Arial" font-size="10" fill="#009900" text-anchor="middle">Activates mTORC1 signaling</text>
  
  <!-- mTORC1 complex (implied) -->
  <rect x="500" y="450" width="120" height="40" rx="10" ry="10" fill="#ffcc99" stroke="#ff9933" stroke-width="2" stroke-dasharray="5,3" />
  <text x="560" y="470" font-family="Arial" font-size="16" fill="#000" text-anchor="middle">mTORC1</text>
  <text x="560" y="485" font-family="Arial" font-size="12" fill="#ff6600" text-anchor="middle">*Not in source</text>
  
  <!-- Relationship arrows -->
  <!-- UBE3A ubiquitinates LAMTOR1 -->
  <path d="M 220,190 Q 300,240 350,340" fill="none" stroke="#cc0000" stroke-width="3" stroke-dasharray="none" marker-end="url(#redArrow)" />
  <text x="250" y="235" font-family="Arial" font-size="14" fill="#cc0000" transform="rotate(-30, 250, 235)">Ubiquitinates/degrades</text>
  <text x="250" y="255" font-family="Arial" font-size="12" fill="#cc0000" transform="rotate(-30, 250, 255)">(RO:0002630)</text>
  
  <!-- Add ubiquitin symbols along the path -->
  <circle cx="260" cy="220" r="8" fill="#ffcc00" stroke="#cc9900" stroke-width="1" />
  <text x="260" y="224" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Ub</text>
  
  <circle cx="290" cy="250" r="8" fill="#ffcc00" stroke="#cc9900" stroke-width="1" />
  <text x="290" y="254" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Ub</text>
  
  <circle cx="320" cy="280" r="8" fill="#ffcc00" stroke="#cc9900" stroke-width="1" />
  <text x="320" y="284" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Ub</text>
  
  <!-- LAMTOR1 adaptor function -->
  <path d="M 450,350 Q 475,350 500,350" fill="none" stroke="#0066cc" stroke-width="2.5" marker-end="url(#blueArrow)" />
  <text x="475" y="340" font-family="Arial" font-size="12" font-weight="bold" fill="#0066cc">Adaptor</text>
  <text x="475" y="355" font-family="Arial" font-size="10" fill="#0066cc">(GO:0043495)</text>
  
  <!-- Ragulator activates mTORC1 -->
  <path d="M 560,370 Q 560,410 560,450" fill="none" stroke="#009900" stroke-width="2.5" marker-end="url(#greenArrow)" />
  <text x="575" y="410" font-family="Arial" font-size="14" fill="#009900">Activates</text>
  <text x="575" y="425" font-family="Arial" font-size="12" fill="#009900">(GO:0005085)</text>
  
  <!-- LAMTOR1 affects Ragulator -->
  <path d="M 400,370 Q 430,400 500,370" fill="none" stroke="#0066cc" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#blueArrow)" />
  <text x="430" y="410" font-family="Arial" font-size="12" fill="#0066cc">Positive regulation</text>
  <text x="430" y="425" font-family="Arial" font-size="10" fill="#0066cc">(RO:0002629)</text>
  
  <!-- Title of the pathway -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Inhibition of mTORC1 Signaling via UBE3A-mediated LAMTOR1 Degradation</text>
  
  <!-- Biological process labels -->
  <rect x="50" y="520" width="200" height="25" rx="5" ry="5" fill="#ffffcc" stroke="#cccc00" stroke-width="1" />
  <text x="150" y="536" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Proteasome-mediated degradation</text>
  <text x="150" y="548" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(GO:0043161)</text>
  
  <rect x="270" y="520" width="260" height="25" rx="5" ry="5" fill="#ffffcc" stroke="#cccc00" stroke-width="1" />
  <text x="400" y="536" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Protein localization to lysosome</text>
  <text x="400" y="548" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(GO:0150032)</text>
  
  <rect x="550" y="520" width="200" height="25" rx="5" ry="5" fill="#ffffcc" stroke="#cccc00" stroke-width="1" />
  <text x="650" y="536" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">TORC1 signaling</text>
  <text x="650" y="548" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(GO:1904263)</text>
  
  <!-- Legend -->
  <rect x="50" y="560" width="700" height="30" rx="5" ry="5" fill="#f0f0f0" stroke="#999" stroke-width="1" />
  <text x="60" y="580" font-family="Arial" font-size="14" fill="#333">Legend:</text>
  
  <!-- Ubiquitination arrow -->
  <line x1="120" y1="580" x2="150" y2="580" stroke="#cc0000" stroke-width="3" marker-end="url(#redArrow)" />
  <text x="185" y="585" font-family="Arial" font-size="12" fill="#333">Ubiquitination/degradation</text>
  
  <!-- Adaptor function arrow -->
  <line x1="320" y1="580" x2="350" y2="580" stroke="#0066cc" stroke-width="2.5" marker-end="url(#blueArrow)" />
  <text x="385" y="585" font-family="Arial" font-size="12" fill="#333">Direct interaction</text>
  
  <!-- Positive regulation arrow -->
  <line x1="470" y1="580" x2="500" y2="580" stroke="#0066cc" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#blueArrow)" />
  <text x="535" y="585" font-family="Arial" font-size="12" fill="#333">Positive regulation</text>
  
  <!-- Activation arrow -->
  <line x1="590" y1="580" x2="620" y2="580" stroke="#009900" stroke-width="2.5" marker-end="url(#greenArrow)" />
  <text x="655" y="585" font-family="Arial" font-size="12" fill="#333">Activation</text>
  
  <!-- Arrowhead definitions -->
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000" />
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc" />
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#009900" />
    </marker>
    <marker id="greyArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
</svg>