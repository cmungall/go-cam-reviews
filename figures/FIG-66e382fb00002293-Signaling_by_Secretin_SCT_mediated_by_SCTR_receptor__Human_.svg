<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell components -->
  <rect x="0" y="0" width="800" height="700" fill="#f9f9f9"/>
  
  <!-- Legend -->
  <rect x="550" y="20" width="230" height="180" fill="white" stroke="#333" stroke-width="1"/>
  <text x="565" y="45" font-family="Arial" font-size="16" font-weight="bold">Legend</text>
  <circle cx="575" cy="70" r="10" fill="#c0f5c0"/>
  <text x="595" y="75" font-family="Arial" font-size="14">Hormone (SCT)</text>
  <rect x="565" y="90" width="20" height="20" fill="#f5d0c0" stroke="#333" stroke-width="1"/>
  <text x="595" y="105" font-family="Arial" font-size="14">SCTR Receptor</text>
  <circle cx="575" cy="130" r="10" fill="#c0d0f5"/>
  <text x="595" y="135" font-family="Arial" font-size="14">G protein (GNAS)</text>
  <rect x="565" y="150" width="20" height="20" fill="#f5c0f5" stroke="#333" stroke-width="1"/>
  <text x="595" y="165" font-family="Arial" font-size="14">Adenylate Cyclase (ADCY6)</text>
  <circle cx="575" cy="185" r="6" fill="#f5f5c0"/>
  <text x="595" y="190" font-family="Arial" font-size="14">cAMP</text>
  
  <!-- Cell membrane with improved spacing -->
  <path d="M100,300 L700,300" stroke="#888" stroke-width="8" fill="none"/>
  <text x="350" y="280" font-family="Arial" font-size="14" text-anchor="middle">Plasma Membrane</text>
  
  <!-- Extracellular Space Label - repositioned -->
  <text x="350" y="200" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Extracellular Space</text>
  
  <!-- Cytosol Label - repositioned -->
  <text x="350" y="350" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Cytosol</text>
  
  <!-- Secretin hormone (SCT) -->
  <circle cx="250" cy="220" r="20" fill="#c0f5c0" stroke="#333" stroke-width="1.5"/>
  <text x="250" y="225" font-family="Arial" font-size="14" text-anchor="middle">SCT</text>
  <text x="250" y="190" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Hormone Activity</text>
  
  <!-- SCTR Receptor in plasma membrane -->
  <rect x="300" y="280" width="60" height="40" fill="#f5d0c0" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="305" font-family="Arial" font-size="14" text-anchor="middle">SCTR</text>
  
  <!-- G protein (GNAS) -->
  <circle cx="330" y="400" r="20" fill="#c0d0f5" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="405" font-family="Arial" font-size="14" text-anchor="middle">GNAS</text>
  
  <!-- Adenylate Cyclase (ADCY6) -->
  <rect x="420" y="460" width="70" height="40" fill="#f5c0f5" stroke="#333" stroke-width="1.5"/>
  <text x="455" y="485" font-family="Arial" font-size="14" text-anchor="middle">ADCY6</text>
  
  <!-- cAMP molecules -->
  <circle cx="530" y="500" r="15" fill="#f5f5c0" stroke="#333" stroke-width="1.5"/>
  <text x="530" y="505" font-family="Arial" font-size="14" text-anchor="middle">cAMP</text>
  
  <!-- Binding arrow from SCT to SCTR -->
  <path d="M265,235 Q290,260 300,280" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Activation arrows -->
  <path d="M330,320 Q330,360 330,380" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M350,410 Q385,435 420,460" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M490,480 Q510,490 530,500" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Title - split into two lines with proper spacing -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Signaling by Secretin (SCT)</text>
  <text x="400" y="60" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">mediated by SCTR receptor</text>
  <text x="400" y="90" font-family="Arial" font-size="16" text-anchor="middle">Adenylate cyclase-activating G protein-coupled receptor pathway</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Step labels with improved positioning -->
  <text x="220" y="245" font-family="Arial" font-size="14" text-anchor="end">1. Binding</text>
  <text x="290" y="350" font-family="Arial" font-size="14" text-anchor="end">2. Receptor Activation</text>
  <text x="400" y="425" font-family="Arial" font-size="14">3. G protein activation</text>
  <text x="510" y="450" font-family="Arial" font-size="14">4. cAMP production</text>
  
  <!-- Biological process label - with extra space and split -->
  <rect x="150" y="560" width="500" height="80" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="400" y="590" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">GO:0007189 - Adenylate cyclase-activating</text>
  <text x="400" y="620" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">G protein-coupled receptor signaling pathway</text>
  
  <!-- Subcellular locations -->
  <text x="130" y="220" font-family="Arial" font-size="12" text-anchor="middle">GO:0005615</text>
  <text x="130" y="300" font-family="Arial" font-size="12" text-anchor="middle">GO:0005886</text>
  <text x="130" y="400" font-family="Arial" font-size="12" text-anchor="middle">GO:0005829</text>
</svg>