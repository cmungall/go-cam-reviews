<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with nuclear area -->
  <rect x="0" y="0" width="800" height="650" fill="#f8f8f8" />
  <ellipse cx="400" cy="320" rx="380" ry="280" fill="#f0f7ff" stroke="#cccccc" stroke-width="2" />
  
  <!-- Title - broken into two lines for better visibility -->
  <text x="400" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Phosphorylation-mediated interactions with TOPBP1</text>
  <text x="400" y="55" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">couples TP53BP1 and 9-1-1 in DNA damage checkpoint</text>
  
  <!-- DNA double strand break site -->
  <rect x="150" y="220" width="500" height="30" fill="#fdfdfd" stroke="#333333" stroke-width="2" rx="5" ry="5" />
  <path d="M 400,220 L 400,250" stroke="#ff0000" stroke-width="4" stroke-dasharray="5,3" />
  <text x="400" y="285" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">DNA double-strand break</text>
  <text x="400" y="305" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle">(Site of double-strand break - GO:0035861)</text>
  
  <!-- Protein elements and interactions -->
  <!-- RNF168 and its function -->
  <circle cx="320" cy="160" r="30" fill="#a6d854" stroke="#333333" stroke-width="2" />
  <text x="320" y="165" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">RNF168</text>
  <path d="M 320,190 L 320,220" stroke="#8b2323" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="365" y="210" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#8b2323">H2AK15 ubiquitination</text>
  
  <!-- TP53BP1 binding to ubiquitinated histones -->
  <circle cx="250" cy="350" r="30" fill="#fc8d62" stroke="#333333" stroke-width="2" />
  <text x="250" y="354" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">TP53BP1</text>
  <path d="M 320,220 L 250,320" stroke="#006400" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="5,3" />
  <text x="270" y="270" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#006400">Histone reader</text>
  
  <!-- TOPBP1 in the middle -->
  <rect x="370" y="350" width="60" height="40" fill="#8da0cb" stroke="#333333" stroke-width="2" rx="10" ry="10" />
  <text x="400" y="374" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">TOPBP1</text>
  
  <!-- CSNK2A1 phosphorylating TOPBP1 -->
  <circle cx="510" cy="290" r="30" fill="#e78ac3" stroke="#333333" stroke-width="2" />
  <text x="510" y="294" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">CSNK2A1</text>
  <path d="M 510,320 L 430,350" stroke="#ff4500" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="490" y="340" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ff4500">Phosphorylation</text>
  <circle cx="430" cy="350" r="5" fill="#ff0000" />
  
  <!-- TP53BP1 interaction with TOPBP1 -->
  <path d="M 280,350 L 370,365" stroke="#4169e1" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="325" y="340" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#4169e1">Binding</text>
  
  <!-- ATR kinase at the bottom -->
  <circle cx="400" cy="450" r="30" fill="#fed9a6" stroke="#333333" stroke-width="2" />
  <text x="400" y="454" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">ATR</text>
  <path d="M 400,390 L 400,420" stroke="#9932cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="440" y="410" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#9932cc">Activation</text>
  
  <!-- 9-1-1 complex (implied but mentioned) -->
  <rect x="520" y="380" width="60" height="30" fill="#b3cde3" stroke="#333333" stroke-width="2" rx="5" ry="5" />
  <text x="550" y="400" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">9-1-1</text>
  <text x="550" y="415" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">RAD9A + partners</text>
  <path d="M 520,395 L 430,370" stroke="#4169e1" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="475" y="400" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#4169e1">Binding</text>
  
  <!-- Double-strand break repair process label -->
  <text x="400" y="520" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Double-strand break repair via classical nonhomologous end joining</text>
  <text x="400" y="540" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle">(GO:0097680)</text>
  
  <!-- Legend -->
  <rect x="20" y="560" width="760" height="80" fill="#f8f8f8" stroke="#333333" stroke-width="1" />
  <text x="400" y="575" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">LEGEND</text>
  
  <!-- Left column of legend -->
  <rect x="40" y="585" width="15" height="15" fill="#a6d854" stroke="#333333" stroke-width="1" />
  <text x="60" y="598" font-family="Arial" font-size="13" font-weight="bold">RNF168</text>
  <text x="120" y="598" font-family="Arial" font-size="13">- H2AK15 ubiquitin ligase</text>
  
  <rect x="40" y="605" width="15" height="15" fill="#fc8d62" stroke="#333333" stroke-width="1" />
  <text x="60" y="618" font-family="Arial" font-size="13" font-weight="bold">TP53BP1</text>
  <text x="120" y="618" font-family="Arial" font-size="13">- Histone reader</text>
  
  <!-- Middle column of legend -->
  <rect x="270" y="585" width="15" height="15" fill="#8da0cb" stroke="#333333" stroke-width="1" />
  <text x="290" y="598" font-family="Arial" font-size="13" font-weight="bold">TOPBP1</text>
  <text x="350" y="598" font-family="Arial" font-size="13">- Chromatin-protein adaptor</text>
  
  <rect x="270" y="605" width="15" height="15" fill="#e78ac3" stroke="#333333" stroke-width="1" />
  <text x="290" y="618" font-family="Arial" font-size="13" font-weight="bold">CSNK2A1</text>
  <text x="350" y="618" font-family="Arial" font-size="13">- Protein kinase</text>
  
  <!-- Right column of legend -->
  <rect x="500" y="585" width="15" height="15" fill="#fed9a6" stroke="#333333" stroke-width="1" />
  <text x="520" y="598" font-family="Arial" font-size="13" font-weight="bold">ATR</text>
  <text x="550" y="598" font-family="Arial" font-size="13">- Protein kinase</text>
  
  <rect x="500" y="605" width="15" height="15" fill="#b3cde3" stroke="#333333" stroke-width="1" />
  <text x="520" y="618" font-family="Arial" font-size="13" font-weight="bold">9-1-1</text>
  <text x="555" y="618" font-family="Arial" font-size="13">- Checkpoint clamp</text>
  
  <!-- Interaction type legend -->
  <circle cx="650" y="589" r="5" fill="#ff0000" />
  <text x="660" y="593" font-family="Arial" font-size="13" font-weight="bold">Phosphorylation site</text>
  
  <line x1="650" y1="606" x2="670" y2="606" stroke="#006400" stroke-width="3" stroke-dasharray="5,3" />
  <text x="680" y="609" font-family="Arial" font-size="13" font-weight="bold">Indirect interaction</text>
  
  <line x1="650" y1="623" x2="670" y2="623" stroke="#ff4500" stroke-width="3" />
  <text x="680" y="626" font-family="Arial" font-size="13" font-weight="bold">Phosphorylation</text>
  
  <line x1="650" y1="640" x2="670" y2="640" stroke="#4169e1" stroke-width="3" />
  <text x="680" y="643" font-family="Arial" font-size="13" font-weight="bold">Binding</text>
  
  <!-- Note about missing elements -->
  <text x="400" y="630" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">* The 9-1-1 complex representation includes RAD9A which is in the source, but its partners are implicit.</text>
  
  <!-- Arrowhead marker for arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>
</svg>