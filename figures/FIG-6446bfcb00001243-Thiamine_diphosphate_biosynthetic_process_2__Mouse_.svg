<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Plasma membrane -->
  <rect x="60" y="60" width="680" height="480" rx="45" ry="45" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="5,3"/>
  <text x="400" y="85" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytosol -->
  <rect x="100" y="120" width="600" height="350" rx="20" ry="20" fill="#e6f2ff" stroke="#666" stroke-width="1"/>
  <text x="400" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Cytosol (GO:0005829)</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="400" cy="350" rx="150" ry="80" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <ellipse cx="400" cy="350" rx="140" ry="73" fill="#ffe6e6" stroke="#333" stroke-width="2"/>
  <text x="400" y="320" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Mitochondrial Inner Membrane (GO:0005743)</text>
  <text x="400" y="345" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Mitochondrial Matrix (GO:0005759)</text>
  
  <!-- Slc19a2 transporter -->
  <rect x="160" y="60" width="80" height="30" fill="#4d94ff" stroke="#333" stroke-width="2"/>
  <text x="200" y="80" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Slc19a2</text>
  <text x="200" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Thiamine transporter</text>
  
  <!-- Slc19a3 transporter -->
  <rect x="560" y="60" width="80" height="30" fill="#4d94ff" stroke="#333" stroke-width="2"/>
  <text x="600" y="80" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Slc19a3</text>
  <text x="600" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Thiamine transporter</text>
  
  <!-- Tpk1 enzyme -->
  <circle cx="350" cy="200" r="35" fill="#ff9933" stroke="#333" stroke-width="2"/>
  <text x="350" y="200" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Tpk1</text>
  <text x="350" y="215" font-family="Arial" font-size="10" text-anchor="middle">Thiamine diphosphokinase</text>
  
  <!-- Thtpa enzyme -->
  <circle cx="500" cy="200" r="35" fill="#ff6600" stroke="#333" stroke-width="2"/>
  <text x="500" y="200" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Thtpa</text>
  <text x="500" y="215" font-family="Arial" font-size="10" text-anchor="middle">Thiamine triphosphatase</text>
  
  <!-- Slc25a19 transporter -->
  <rect x="390" y="280" width="80" height="20" fill="#ff4d4d" stroke="#333" stroke-width="2"/>
  <text x="430" y="295" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Slc25a19</text>
  <text x="430" y="310" font-family="Arial" font-size="9" text-anchor="middle">TDP transporter</text>
  
  <!-- Thiamine molecule outside the cell -->
  <circle cx="200" y="30" r="15" fill="#ffdd00" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="34" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">T</text>
  
  <!-- Thiamine molecule inside cytosol from Slc19a2 -->
  <circle cx="200" y="120" r="15" fill="#ffdd00" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="124" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">T</text>
  
  <!-- Thiamine molecule outside the cell for Slc19a3 -->
  <circle cx="600" y="30" r="15" fill="#ffdd00" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="34" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">T</text>
  
  <!-- Thiamine molecule inside cytosol from Slc19a3 -->
  <circle cx="600" y="120" r="15" fill="#ffdd00" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="124" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">T</text>
  
  <!-- Thiamine diphosphate (TDP) in cytosol -->
  <circle cx="350" y="150" r="15" fill="#33cc33" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="154" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">TDP</text>
  
  <!-- Thiamine triphosphate (TTP) in cytosol -->
  <circle cx="500" y="150" r="15" fill="#9933ff" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="154" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">TTP</text>
  
  <!-- Thiamine diphosphate in mitochondria -->
  <circle cx="400" y="380" r="15" fill="#33cc33" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="384" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">TDP</text>
  
  <!-- Reaction arrows -->
  <!-- Slc19a2 transport -->
  <line x1="200" y1="45" x2="200" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Slc19a3 transport -->
  <line x1="600" y1="45" x2="600" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Tpk1 reaction -->
  <line x1="250" y1="150" x2="320" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="120" x2="400" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="200" y1="120" x2="300" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Thtpa reaction -->
  <line x1="390" y1="170" x2="470" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Slc25a19 transport -->
  <line x1="350" y1="230" x2="390" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow labels -->
  <text x="220" y="90" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Transport</text>
  <text x="620" y="90" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Transport</text>
  <text x="300" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Phosphorylation</text>
  <text x="430" y="160" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Dephosphorylation</text>
  <text x="440" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" transform="rotate(-45,440,270)">Transport</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Thiamine Diphosphate Biosynthetic Process (Mouse)</text>
  
  <!-- Legend -->
  <rect x="570" y="430" width="160" height="110" fill="white" stroke="#333" stroke-width="1"/>
  <text x="580" y="450" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  <circle cx="590" y="470" r="8" fill="#ffdd00" stroke="#333" stroke-width="1.5"/>
  <text x="605" y="475" font-family="Arial" font-size="14">T = Thiamine</text>
  <circle cx="590" y="490" r="8" fill="#33cc33" stroke="#333" stroke-width="1.5"/>
  <text x="605" y="495" font-family="Arial" font-size="14">TDP = Thiamine-PP</text>
  <circle cx="590" y="510" r="8" fill="#9933ff" stroke="#333" stroke-width="1.5"/>
  <text x="605" y="515" font-family="Arial" font-size="14">TTP = Thiamine-PPP</text>
  <text x="650" y="530" font-family="Arial" font-size="12" font-style="italic">PP = diphosphate</text>
  <text x="650" y="545" font-family="Arial" font-size="12" font-style="italic">PPP = triphosphate</text>
</svg>