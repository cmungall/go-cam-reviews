<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Membrane -->
  <path d="M 50,250 H 750" stroke="#888888" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="5,5"/>
  <text x="40" y="240" font-family="Arial" font-size="16" fill="#555555">Cell Membrane</text>
  
  <!-- Extracellular Space Label -->
  <text x="65" y="200" font-family="Arial" font-size="18" font-weight="bold" fill="#555555">Extracellular Space</text>
  
  <!-- Cytoplasm Label -->
  <text x="65" y="300" font-family="Arial" font-size="18" font-weight="bold" fill="#555555">Cytoplasm</text>
  
  <!-- IGF1 Ligand -->
  <circle cx="150" cy="150" r="30" fill="#8BA3D2" stroke="#6878A0" stroke-width="2"/>
  <text x="150" y="155" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IGF1</text>
  <text x="150" y="175" font-family="Arial" font-size="12" text-anchor="middle">Igf1 Mmus</text>
  
  <!-- IGF1 Receptor -->
  <rect x="220" y="220" width="70" height="60" fill="#F4AF9A" stroke="#E27D60" stroke-width="2"/>
  <text x="255" y="250" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IGF1R</text>
  <text x="255" y="270" font-family="Arial" font-size="12" text-anchor="middle">Igf1r Mmus</text>
  
  <!-- Receptor Domain Spanning Membrane -->
  <rect x="235" y="220" width="40" height="60" fill="#F0C2B1" stroke="#E27D60" stroke-width="0" rx="2"/>
  
  <!-- ATP/ADP -->
  <ellipse cx="320" cy="330" rx="25" ry="18" fill="#B3E3B5" stroke="#71A374" stroke-width="2"/>
  <text x="320" y="334" font-family="Arial" font-size="12" text-anchor="middle">ATP/ADP</text>
  
  <!-- IRS1 -->
  <rect x="350" y="320" width="60" height="35" fill="#A0D2E5" stroke="#5EAED0" stroke-width="2" rx="5"/>
  <text x="380" y="340" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IRS1</text>
  <text x="380" y="352" font-family="Arial" font-size="10" text-anchor="middle">Irs1 Mmus</text>
  
  <!-- PIK3R1 -->
  <rect x="450" y="320" width="60" height="35" fill="#D8BFD8" stroke="#C3A6C3" stroke-width="2" rx="5"/>
  <text x="480" y="340" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">PIK3R1</text>
  <text x="480" y="352" font-family="Arial" font-size="10" text-anchor="middle">Pik3r1 Mmus</text>
  
  <!-- PIK3CA -->
  <rect x="450" y="380" width="60" height="35" fill="#D8BFD8" stroke="#C3A6C3" stroke-width="2" rx="5"/>
  <text x="480" y="400" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">PIK3CA</text>
  <text x="480" y="412" font-family="Arial" font-size="10" text-anchor="middle">Pik3ca Mmus</text>
  
  <!-- PDPK1 -->
  <rect x="550" y="350" width="60" height="35" fill="#FFD7B5" stroke="#FFBB80" stroke-width="2" rx="5"/>
  <text x="580" y="370" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">PDPK1</text>
  <text x="580" y="382" font-family="Arial" font-size="10" text-anchor="middle">Pdpk1 Mmus</text>
  
  <!-- AKT1 -->
  <rect x="650" y="350" width="60" height="35" fill="#DAE8B5" stroke="#C6D68C" stroke-width="2" rx="5"/>
  <text x="680" y="370" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">AKT1</text>
  <text x="680" y="382" font-family="Arial" font-size="10" text-anchor="middle">Akt1 Mmus</text>
  
  <!-- Binding and Activation Arrows -->
  <!-- IGF1 to Receptor -->
  <path d="M 170,170 L 230,230" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Receptor Auto-phosphorylation -->
  <path d="M 270,280 C 290,310 300,310 320,330" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Receptor to IRS1 -->
  <path d="M 290,250 C 320,275 330,280 350,335" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- IRS1 to PIK3R1 -->
  <path d="M 410,335 L 450,335" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- PIK3R1 to PIK3CA -->
  <path d="M 480,355 L 480,380" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- PIK3CA to PDPK1 -->
  <path d="M 510,390 C 530,390 530,370 550,370" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- PDPK1 to AKT1 -->
  <path d="M 610,367 L 650,367" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phosphorylation Marks -->
  <circle cx="275" cy="280" r="6" fill="#FF4040" stroke="#AA0000" stroke-width="1.5"/>
  <circle cx="360" cy="345" r="6" fill="#FF4040" stroke="#AA0000" stroke-width="1.5"/>
  <circle cx="680" cy="345" r="6" fill="#FF4040" stroke="#AA0000" stroke-width="1.5"/>
  
  <!-- Arrowhead Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
  
  <!-- Pathway Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Insulin-like Growth Factor Receptor Signaling Pathway</text>
  <text x="400" y="65" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">(Mouse - Mus musculus)</text>
  
  <!-- Activity Labels -->
  <text x="170" y="120" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Receptor Ligand</text>
  <text x="170" y="132" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Activity</text>
  
  <text x="255" y="210" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">IGF Receptor</text>
  <text x="255" y="222" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Activity</text>
  
  <text x="380" y="315" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Receptor Adaptor</text>
  <text x="380" y="305" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Activity</text>
  
  <text x="480" y="450" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">PI3K Activity</text>
  <text x="480" y="462" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">(Kinase Activator)</text>
  
  <text x="580" y="400" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">3-Phosphoinositide-</text>
  <text x="580" y="412" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Dependent Kinase</text>
  
  <text x="680" y="400" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Protein Serine</text>
  <text x="680" y="412" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Kinase Activity</text>
  
  <text x="240" y="290" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Protein Tyrosine</text>
  <text x="240" y="302" font-family="Arial" font-size="12" fill="#555555" text-anchor="middle">Kinase Activity</text>
  
  <!-- Auto-phosphorylation Label - Repositioned -->
  <text x="360" y="315" font-family="Arial" font-size="12" fill="#AA0000" text-anchor="middle">Auto-phosphorylation</text>
  
  <!-- Phosphorylation Labels -->
  <text x="360" y="365" font-family="Arial" font-size="12" fill="#AA0000" text-anchor="middle">P</text>
  <text x="680" y="365" font-family="Arial" font-size="12" fill="#AA0000" text-anchor="middle">P</text>
  <text x="275" y="290" font-family="Arial" font-size="12" fill="#AA0000" text-anchor="middle">P</text>
</svg>