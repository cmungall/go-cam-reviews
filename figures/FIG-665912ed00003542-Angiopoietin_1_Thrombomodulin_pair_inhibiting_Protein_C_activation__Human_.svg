<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background representing extracellular space -->
  <rect x="0" y="0" width="800" height="450" fill="#f0f7ff" opacity="0.5"/>
  
  <!-- Plasma Membrane -->
  <rect x="0" y="450" width="800" height="30" fill="#e1b16a" stroke="#333" stroke-width="1"/>
  <text x="20" y="470" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytoplasm -->
  <rect x="0" y="480" width="800" height="120" fill="#ffefd5" opacity="0.5"/>
  <text x="20" y="500" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Cytoplasm</text>
  
  <!-- Extracellular Space Label -->
  <text x="20" y="30" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Extracellular Space (GO:0005615)</text>
  
  <!-- Title of the pathway -->
  <rect x="180" y="50" width="440" height="40" rx="10" ry="10" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="400" y="75" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Angiopoietin-1-Thrombomodulin Pathway</text>
  <text x="400" y="95" font-family="Arial" font-size="16" fill="#333" text-anchor="middle">Negative Regulation of Blood Coagulation</text>
  
  <!-- Angiopoietin-1 (ANGPT1) -->
  <circle cx="180" cy="170" r="45" fill="#add8e6" stroke="#333" stroke-width="2"/>
  <text x="180" y="165" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">ANGPT1</text>
  <text x="180" y="185" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">(Q15389)</text>
  <text x="180" y="205" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">receptor ligand activity</text>
  
  <!-- Thrombomodulin (THBD) in the membrane -->
  <rect x="350" y="400" width="100" height="100" fill="#90ee90" stroke="#333" stroke-width="2" rx="10" ry="10"/>
  <text x="400" y="435" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">THBD</text>
  <text x="400" y="455" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">(P07204)</text>
  <text x="400" y="475" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">signaling receptor activity</text>
  
  <!-- Thrombin (F2) -->
  <circle cx="550" cy="250" r="45" fill="#ffb6c1" stroke="#333" stroke-width="2"/>
  <text x="550" y="245" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Thrombin</text>
  <text x="550" y="265" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">(F2, P00734)</text>
  <text x="550" y="285" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">serine-type endopeptidase</text>
  
  <!-- Protein C (PROC) -->
  <circle cx="650" cy="150" r="45" fill="#f0e68c" stroke="#333" stroke-width="2"/>
  <text x="650" y="145" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Protein C</text>
  <text x="650" y="165" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">(PROC, P04070)</text>
  <text x="650" y="185" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">serine-type endopeptidase</text>
  
  <!-- Arrow from ANGPT1 to THBD -->
  <path d="M 220 180 Q 320 180 380 400" fill="none" stroke="#006400" stroke-width="3" marker-end="url(#greenArrow)"/>
  <rect x="280" y="230" width="120" height="40" fill="white" stroke="#006400" stroke-width="1" rx="5" ry="5"/>
  <text x="340" y="250" font-family="Arial" font-size="14" fill="#006400" text-anchor="middle" font-weight="bold">Activates</text>
  <text x="340" y="267" font-family="Arial" font-size="12" fill="#006400" text-anchor="middle">(RO:0002630)</text>
  
  <!-- Arrow from THBD to Thrombin -->
  <path d="M 450 430 Q 500 350 550 295" fill="none" stroke="#800000" stroke-width="3" marker-end="url(#redArrow)" stroke-dasharray="5,3"/>
  <rect x="465" y="350" width="130" height="40" fill="white" stroke="#800000" stroke-width="1" rx="5" ry="5"/>
  <text x="530" y="370" font-family="Arial" font-size="14" fill="#800000" text-anchor="middle" font-weight="bold">Inhibits</text>
  <text x="530" y="387" font-family="Arial" font-size="12" fill="#800000" text-anchor="middle">(RO:0002413)</text>
  
  <!-- Arrow from Thrombin to Protein C -->
  <path d="M 575 215 Q 600 190 630 190" fill="none" stroke="#800000" stroke-width="3" marker-end="url(#redArrow)" stroke-dasharray="5,3"/>
  <rect x="580" y="170" width="70" height="25" fill="white" stroke="#800000" stroke-width="1" rx="5" ry="5"/>
  <text x="615" y="187" font-family="Arial" font-size="14" fill="#800000" text-anchor="middle" font-weight="bold">Inhibits</text>
  
  <!-- Process description -->
  <rect x="50" y="320" width="250" height="100" fill="#ffffff" stroke="#333" stroke-width="1" rx="10" ry="10"/>
  <text x="175" y="340" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Biological Process</text>
  <text x="175" y="365" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">Negative Regulation of</text>
  <text x="175" y="385" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">Blood Coagulation</text>
  <text x="175" y="405" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">(GO:0030195)</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="greenArrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L13,6 z" fill="#006400"/>
    </marker>
    <marker id="redArrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L13,6 z" fill="#800000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="580" y="490" width="200" height="100" fill="white" stroke="#333" stroke-width="1"/>
  <text x="590" y="510" font-family="Arial" font-size="16" font-weight="bold">Legend</text>
  
  <circle cx="605" cy="530" r="10" fill="#add8e6" stroke="#333" stroke-width="1"/>
  <text x="625" y="535" font-family="Arial" font-size="14">Ligand</text>
  
  <rect x="595" y="545" width="20" height="20" rx="3" ry="3" fill="#90ee90" stroke="#333" stroke-width="1"/>
  <text x="625" y="560" font-family="Arial" font-size="14">Receptor</text>
  
  <circle cx="605" cy="580" r="10" fill="#ffb6c1" stroke="#333" stroke-width="1"/>
  <text x="625" y="585" font-family="Arial" font-size="14">Enzyme</text>
  
  <line x1="680" y1="530" x2="710" y2="530" stroke="#006400" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text x="745" y="535" font-family="Arial" font-size="14">Activation</text>
  
  <line x1="680" y1="560" x2="710" y2="560" stroke="#800000" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#redArrow)"/>
  <text x="745" y="565" font-family="Arial" font-size="14">Inhibition</text>
</svg>