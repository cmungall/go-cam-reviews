<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="370" ry="270" fill="#f8f8f8" stroke="#666" stroke-width="2"/>
  
  <!-- Cell components -->
  <!-- Mitochondrion -->
  <ellipse cx="500" cy="320" rx="150" ry="80" fill="#ffd6cc" stroke="#ff6633" stroke-width="2"/>
  <text x="500" y="310" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Mitochondrial Membrane</text>
  
  <!-- Cytoplasm label -->
  <text x="200" y="150" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Cytoplasm</text>
  
  <!-- Pathway components -->
  <!-- ARRDC4 -->
  <rect x="150" y="250" width="100" height="50" rx="10" ry="10" fill="#a6d5fa" stroke="#3385d6" stroke-width="2"/>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">ARRDC4</text>
  
  <!-- TRIM65 -->
  <rect x="310" y="250" width="100" height="50" rx="10" ry="10" fill="#a6d5fa" stroke="#3385d6" stroke-width="2"/>
  <text x="360" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">TRIM65</text>
  
  <!-- MAVS -->
  <rect x="470" y="250" width="100" height="50" rx="10" ry="10" fill="#a6d5fa" stroke="#3385d6" stroke-width="2"/>
  <text x="520" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">MAVS</text>
  
  <!-- Interferon production box -->
  <rect x="610" y="250" width="120" height="50" rx="10" ry="10" fill="#d6f5d6" stroke="#47b347" stroke-width="2"/>
  <text x="670" y="275" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Interferon-beta</text>
  <text x="670" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Production</text>
  
  <!-- Function labels -->
  <text x="200" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Ubiquitin-like ligase</text>
  <text x="200" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">substrate adaptor</text>
  
  <text x="360" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Ubiquitin protein</text>
  <text x="360" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">ligase activity</text>
  
  <text x="520" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Signaling adaptor</text>
  <text x="520" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">activity</text>
  
  <!-- Arrows -->
  <path d="M250 275 L310 275" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M410 275 L470 275" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M570 275 L610 275" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- K63-ubiquitination indication -->
  <circle cx="430" cy="260" r="15" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
  <text x="430" y="264" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">K63-Ub</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Figure title -->
  <rect x="100" y="20" width="600" height="40" rx="5" ry="5" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
  <text x="400" y="45" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">ARRDC4-mediated activation of MDA5 through K63-ubiquitination by TRIM65</text>
  
  <!-- Additional context -->
  <text x="400" y="400" font-family="Arial" font-size="13" font-style="italic" text-anchor="middle" fill="#666">This pathway contributes to antiviral innate immune response signaling</text>
  
  <!-- Legend -->
  <rect x="50" y="480" width="700" height="100" rx="5" ry="5" fill="#f8f8f8" stroke="#666" stroke-width="1"/>
  <text x="60" y="500" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend:</text>
  
  <!-- Legend items -->
  <rect x="70" y="510" width="20" height="20" fill="#a6d5fa" stroke="#3385d6" stroke-width="1"/>
  <text x="95" y="525" font-family="Arial" font-size="12" fill="#333">Protein</text>
  
  <rect x="170" y="510" width="20" height="20" fill="#d6f5d6" stroke="#47b347" stroke-width="1"/>
  <text x="195" y="525" font-family="Arial" font-size="12" fill="#333">Biological process</text>
  
  <ellipse cx="270" cy="520" rx="10" ry="10" fill="#ffd6cc" stroke="#ff6633" stroke-width="1"/>
  <text x="295" y="525" font-family="Arial" font-size="12" fill="#333">Cell compartment</text>
  
  <circle cx="390" cy="520" r="10" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
  <text x="415" y="525" font-family="Arial" font-size="12" fill="#333">K63-linked ubiquitination</text>
  
  <!-- Note about MDA5 -->
  <text x="60" y="550" font-family="Arial" font-size="12" fill="#666">*Note: MDA5 is implied in the pathway but not explicitly represented in the source GO-CAM model</text>
</svg>