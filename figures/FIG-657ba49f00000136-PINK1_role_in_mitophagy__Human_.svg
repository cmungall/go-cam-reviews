<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>
  
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="230" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Mitochondrion -->
  <ellipse cx="300" cy="250" rx="120" ry="80" fill="#ffcccc" stroke="#993333" stroke-width="2"/>
  <ellipse cx="300" cy="250" rx="100" ry="60" fill="#ffdddd" stroke="#993333" stroke-width="2"/>
  <text x="300" y="330" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Mitochondrion</text>
  
  <!-- Cytoplasm label -->
  <text x="600" y="200" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Cytoplasm</text>
  
  <!-- PINK1 (Q9BXM7) -->
  <rect x="230" y="220" width="80" height="40" rx="5" ry="5" fill="#b3d9ff" stroke="#0066cc" stroke-width="2"/>
  <text x="270" y="245" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">PINK1</text>
  
  <!-- ARHGAP26 (Q9UNA1) -->
  <rect x="380" y="220" width="100" height="40" rx="5" ry="5" fill="#d9b3ff" stroke="#6600cc" stroke-width="2"/>
  <text x="430" y="245" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">ARHGAP26</text>
  
  <!-- ABI2 (Q9NYB9) -->
  <rect x="550" y="280" width="80" height="40" rx="5" ry="5" fill="#b3ffb3" stroke="#339933" stroke-width="2"/>
  <text x="590" y="305" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">ABI2</text>
  
  <!-- Arrows for protein interactions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- PINK1 to ARHGAP26 -->
  <line x1="310" y1="240" x2="380" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ARHGAP26 to ABI2 -->
  <path d="M 480 240 Q 520 240 540 280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Function labels -->
  <text x="270" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#0066cc">Protein serine/threonine kinase</text>
  <text x="430" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#6600cc">Protein-macromolecule adaptor</text>
  <text x="590" y="260" text-anchor="middle" font-family="Arial" font-size="14" fill="#339933">Cytoskeletal anchor</text>
  
  <!-- Mitophagy process label -->
  <rect x="300" y="430" width="200" height="30" rx="15" ry="15" fill="#ffebb3" stroke="#cc9900" stroke-width="2"/>
  <text x="400" y="450" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">MITOPHAGY</text>
  
  <!-- Connecting all to mitophagy process with directional arrows -->
  <defs>
    <marker id="smallArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <path d="M 270 260 Q 270 350 320 430" stroke="#333" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#smallArrow)"/>
  <path d="M 430 260 Q 430 350 400 430" stroke="#333" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#smallArrow)"/>
  <path d="M 590 320 Q 590 380 480 430" stroke="#333" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#smallArrow)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#333">PINK1 Role in Mitophagy (Human)</text>
  
  <!-- Added Notes -->
  <text x="330" y="270" text-anchor="start" font-family="Arial" font-size="12" fill="#0066cc">(Q9BXM7)</text>
  <text x="430" y="270" text-anchor="start" font-family="Arial" font-size="12" fill="#6600cc">(Q9UNA1)</text>
  <text x="590" y="330" text-anchor="middle" font-family="Arial" font-size="12" fill="#339933">(Q9NYB9)</text>
  
  <!-- Legend -->
  <rect x="100" y="470" width="600" height="100" rx="10" ry="10" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="120" y="495" font-family="Arial" font-size="16" font-weight="bold" fill="#333">LEGEND:</text>
  
  <!-- Legend items -->
  <rect x="120" y="505" width="20" height="20" fill="#b3d9ff" stroke="#0066cc" stroke-width="1"/>
  <text x="150" y="520" font-family="Arial" font-size="14" fill="#333">PINK1 - Mitochondrial kinase</text>
  
  <rect x="120" y="535" width="20" height="20" fill="#d9b3ff" stroke="#6600cc" stroke-width="1"/>
  <text x="150" y="550" font-family="Arial" font-size="14" fill="#333">ARHGAP26 - Adapter protein</text>
  
  <rect x="400" y="505" width="20" height="20" fill="#b3ffb3" stroke="#339933" stroke-width="1"/>
  <text x="430" y="520" font-family="Arial" font-size="14" fill="#333">ABI2 - Cytoskeletal regulator</text>
  
  <rect x="400" y="535" width="20" height="20" fill="#ffebb3" stroke="#cc9900" stroke-width="1"/>
  <text x="430" y="550" font-family="Arial" font-size="14" fill="#333">Biological process</text>
</svg>