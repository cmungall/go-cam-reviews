<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background representing liver cell cytosol -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#FFF8DC" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Cell compartment label -->
  <text x="90" y="85" font-family="Arial" font-size="18" font-weight="bold" fill="#8B4513">Liver Cell (Cytosol)</text>
  
  <!-- Glucose-6-phosphate isomerase (Gpi1) -->
  <circle cx="150" cy="200" r="40" fill="#B0E0E6" stroke="#4682B4" stroke-width="2"/>
  <text x="150" y="195" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Gpi1</text>
  <text x="150" y="215" font-family="Arial" font-size="12" text-anchor="middle">(G6P isomerase)</text>
  
  <!-- Protein kinase (Prkaca) -->
  <rect x="400" y="100" width="90" height="70" rx="10" ry="10" fill="#FFB6C1" stroke="#CD5C5C" stroke-width="2"/>
  <text x="445" y="125" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Prkaca</text>
  <text x="445" y="145" font-family="Arial" font-size="12" text-anchor="middle">(Protein kinase)</text>
  
  <!-- Phosphofructokinase-2/fructose-2,6-bisphosphatase (Pfkfb1) -->
  <rect x="400" y="250" width="90" height="70" rx="10" ry="10" fill="#98FB98" stroke="#2E8B57" stroke-width="2"/>
  <text x="445" y="270" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pfkfb1</text>
  <text x="445" y="290" font-family="Arial" font-size="12" text-anchor="middle">(FBPase-2)</text>
  
  <!-- Phosphofructokinase (Pfkl) -->
  <rect x="400" y="400" width="90" height="70" rx="10" ry="10" fill="#FFDAB9" stroke="#FF8C00" stroke-width="2"/>
  <text x="445" y="420" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pfkl</text>
  <text x="445" y="440" font-family="Arial" font-size="12" text-anchor="middle">(PFK)</text>
  
  <!-- Fructose-2,6-bisphosphate molecule -->
  <ellipse cx="250" cy="320" rx="45" ry="25" fill="#F0E68C" stroke="#DAA520" stroke-width="2"/>
  <text x="250" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">F-2,6-BP</text>
  
  <!-- Glucose-6-phosphate molecule -->
  <ellipse cx="150" cy="120" rx="45" ry="25" fill="#F0E68C" stroke="#DAA520" stroke-width="2"/>
  <text x="150" y="120" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">G-6-P</text>

  <!-- Fructose-6-phosphate molecule -->
  <ellipse cx="150" cy="320" rx="45" ry="25" fill="#F0E68C" stroke="#DAA520" stroke-width="2"/>
  <text x="150" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">F-6-P</text>
  
  <!-- Pathway: G-6-P to F-6-P (via Gpi1) -->
  <line x1="150" y1="145" x2="150" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="200" y="155" font-family="Arial" font-size="12" fill="#333333">1. Isomerization</text>
  
  <!-- Pathway: Prkaca inhibits Pfkfb1 -->
  <line x1="445" y1="170" x2="445" y2="250" stroke="#FF0000" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="500" y="210" font-family="Arial" font-size="14" fill="#FF0000">2. Inhibition</text>
  
  <!-- Pathway: Pfkfb1 reduces F-2,6-BP -->
  <line x1="400" y1="285" x2="295" y2="320" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="310" y="280" font-family="Arial" font-size="12" fill="#333333">3. Dephosphorylation</text>
  
  <!-- Pathway: F-2,6-BP activates Pfkl -->
  <line x1="250" y1="345" x2="400" y2="415" stroke="#008000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="280" y="390" font-family="Arial" font-size="14" fill="#008000">4. Activation</text>
  
  <!-- Pathway: F-6-P to F-1,6-BP (via Pfkl) - glycolysis step -->
  <line x1="195" y1="320" x2="400" y2="435" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="260" y="350" font-family="Arial" font-size="12" fill="#333333">5. Phosphorylation</text>
  
  <!-- Pathway: Gpi1 converts G-6-P to F-6-P -->
  <line x1="150" y1="240" x2="150" y2="295" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- Process label -->
  <rect x="550" y="400" width="190" height="60" rx="10" ry="10" fill="#FFE4E1" stroke="#CD5C5C" stroke-width="2"/>
  <text x="645" y="425" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Negative regulation of</text>
  <text x="645" y="445" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">glycolytic process</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="100" width="190" height="160" rx="5" ry="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="645" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="560" y="130" width="15" height="15" rx="2" ry="2" fill="#FFB6C1" stroke="#CD5C5C" stroke-width="1"/>
  <text x="600" y="143" font-family="Arial" font-size="14">Protein Kinase</text>
  
  <rect x="560" y="150" width="15" height="15" rx="2" ry="2" fill="#98FB98" stroke="#2E8B57" stroke-width="1"/>
  <text x="600" y="163" font-family="Arial" font-size="14">FBPase-2</text>
  
  <rect x="560" y="170" width="15" height="15" rx="2" ry="2" fill="#FFDAB9" stroke="#FF8C00" stroke-width="1"/>
  <text x="600" y="183" font-family="Arial" font-size="14">PFK</text>
  
  <circle cx="568" cy="195" r="7.5" fill="#B0E0E6" stroke="#4682B4" stroke-width="1"/>
  <text x="600" y="198" font-family="Arial" font-size="14">G6P Isomerase</text>
  
  <ellipse cx="568" cy="215" rx="7.5" ry="5" fill="#F0E68C" stroke="#DAA520" stroke-width="1"/>
  <text x="600" y="218" font-family="Arial" font-size="14">Metabolite</text>
  
  <line x1="560" y1="235" x2="575" y2="235" stroke="#FF0000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="600" y="238" font-family="Arial" font-size="14">Inhibition</text>
  
  <line x1="560" y1="255" x2="575" y2="255" stroke="#008000" stroke-width="2"/>
  <text x="600" y="258" font-family="Arial" font-size="14">Activation</text>
  
  <!-- Overall pathway description -->
  <rect x="550" y="270" width="190" height="120" rx="5" ry="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="645" y="290" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Pathway Summary</text>
  <text x="645" y="310" font-family="Arial" font-size="12" text-anchor="middle">Prkaca inhibits Pfkfb1,</text>
  <text x="645" y="325" font-family="Arial" font-size="12" text-anchor="middle">reducing F-2,6-BP levels.</text>
  <text x="645" y="340" font-family="Arial" font-size="12" text-anchor="middle">Lower F-2,6-BP results in</text>
  <text x="645" y="355" font-family="Arial" font-size="12" text-anchor="middle">decreased Pfkl activity,</text>
  <text x="645" y="370" font-family="Arial" font-size="12" text-anchor="middle">negatively regulating</text>
  <text x="645" y="385" font-family="Arial" font-size="12" text-anchor="middle">glycolysis.</text>
</svg>