<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Nucleus with DNA damage site -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="70" y="90" font-family="Arial" font-size="18" fill="#333">Nucleus</text>
  
  <!-- Site of double-strand break -->
  <rect x="250" y="150" width="400" height="120" rx="10" ry="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="340" y="135" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Site of Double-Strand Break (GO:0035861)</text>
  
  <!-- DNA with break -->
  <path d="M 270 200 L 370 200 M 430 200 L 530 200 M 270 220 L 370 220 M 430 220 L 530 220" stroke="#333" stroke-width="4"/>
  <path d="M 370 190 L 370 210 M 430 190 L 430 210 M 370 210 L 370 230 M 430 210 L 430 230" stroke="#ff0000" stroke-width="4"/>
  
  <!-- RNF126 with ubiquitin ligase activity -->
  <circle cx="150" cy="300" r="40" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="150" y="300" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" alignment-baseline="middle" fill="#333">RNF126</text>
  <text x="150" y="320" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">Ubiquitin ligase</text>
  
  <!-- MRE11 being ubiquitinated -->
  <circle cx="300" cy="300" r="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="300" y="300" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" alignment-baseline="middle" fill="#333">MRE11</text>
  <text x="300" y="320" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">3'-5' Exonuclease</text>
  
  <!-- Ubiquitination arrows and labels -->
  <path d="M 190 300 L 260 300" stroke="#82b366" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="195" y="270" width="90" height="30" rx="5" ry="5" fill="white" fill-opacity="0.7" stroke="none"/>
  <text x="225" y="282" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">K29/K27-linked</text>
  <text x="225" y="297" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">ubiquitination</text>
  
  <!-- Ubiquitin tags on MRE11 -->
  <circle cx="285" cy="270" r="10" fill="#ffcc99" stroke="#d79b00" stroke-width="1"/>
  <text x="285" y="274" font-family="Arial" font-size="10" text-anchor="middle" alignment-baseline="middle" fill="#333">Ub</text>
  <circle cx="305" cy="260" r="10" fill="#ffcc99" stroke="#d79b00" stroke-width="1"/>
  <text x="305" y="264" font-family="Arial" font-size="10" text-anchor="middle" alignment-baseline="middle" fill="#333">Ub</text>
  
  <!-- Activated MRE11 at break site -->
  <circle cx="400" cy="200" r="35" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="400" y="200" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" alignment-baseline="middle" fill="#333">MRE11</text>
  <text x="400" y="220" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">Active</text>
  
  <!-- MRE11 activation arrow -->
  <path d="M 330 270 C 350 250, 370 230, 370 200" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="325" y="220" width="65" height="20" rx="5" ry="5" fill="white" fill-opacity="0.7" stroke="none"/>
  <text x="350" y="235" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Activation</text>
  
  <!-- EXO1 protein -->
  <circle cx="520" cy="200" r="35" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="520" y="200" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" alignment-baseline="middle" fill="#333">EXO1</text>
  <text x="520" y="220" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">5'-3' Exonuclease</text>
  
  <!-- MRE11 to EXO1 positive regulation -->
  <path d="M 435 200 L 485 200" stroke="#d79b00" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrowhead)"/>
  <rect x="435" y="170" width="65" height="30" rx="5" ry="5" fill="white" fill-opacity="0.7" stroke="none"/>
  <text x="460" y="183" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Positively</text>
  <text x="460" y="198" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">regulates</text>
  
  <!-- DNA resection result -->
  <path d="M 600 180 L 650 180 M 600 200 L 630 200" stroke="#333" stroke-width="2"/>
  <path d="M 580 200 C 590 210, 600 220, 630 220" stroke="#ff9999" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="590" y="150" width="80" height="20" rx="5" ry="5" fill="white" fill-opacity="0.7" stroke="none"/>
  <text x="625" y="165" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">DNA strand</text>
  <rect x="590" y="230" width="80" height="20" rx="5" ry="5" fill="white" fill-opacity="0.7" stroke="none"/>
  <text x="625" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">resection</text>
  
  <!-- Process label -->
  <rect x="100" y="400" width="600" height="80" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="400" y="430" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Double-Strand Break Repair via Homologous Recombination</text>
  <text x="400" y="460" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">(GO:0000724)</text>
  
  <!-- Legend -->
  <rect x="550" y="300" width="180" height="90" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="640" y="315" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <rect x="560" y="325" width="12" height="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="580" y="335" font-family="Arial" font-size="11" fill="#333" text-anchor="start">RNF126 (Ligase)</text>
  
  <rect x="560" y="345" width="12" height="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="580" y="355" font-family="Arial" font-size="11" fill="#333" text-anchor="start">MRE11 (3'-5' Exonuclease)</text>
  
  <rect x="560" y="365" width="12" height="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
  <text x="580" y="375" font-family="Arial" font-size="11" fill="#333" text-anchor="start">EXO1 (5'-3' Exonuclease)</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>