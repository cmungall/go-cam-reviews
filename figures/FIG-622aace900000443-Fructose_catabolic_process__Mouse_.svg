<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline representing cytosol (GO:0005829) -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#888888" stroke-width="2"/>
  <text x="380" y="85" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Fructose Catabolic Process (Mouse)</text>
  
  <!-- Metabolites and reaction paths -->
  <!-- Fructose -->
  <rect x="150" y="150" width="120" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="210" y="175" text-anchor="middle" font-family="Arial" font-size="14">Fructose</text>
  
  <!-- Khk enzyme -->
  <rect x="180" y="220" width="100" height="30" rx="15" ry="15" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="230" y="240" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Khk</text>
  <text x="230" y="255" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">Ketohexokinase</text>
  
  <!-- Reaction label -->
  <text x="285" y="230" text-anchor="start" font-family="Arial" font-size="10">ATP → ADP</text>
  
  <!-- Arrow down -->
  <path d="M 210 190 L 210 220" stroke="#006633" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-green)"/>
  
  <!-- Fructose-1-phosphate -->
  <rect x="150" y="280" width="120" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="210" y="305" text-anchor="middle" font-family="Arial" font-size="14">Fructose-1-P</text>
  
  <!-- Arrow down -->
  <path d="M 210 250 L 210 280" stroke="#006633" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-green)"/>
  
  <!-- Aldob enzyme -->
  <rect x="180" y="350" width="100" height="30" rx="15" ry="15" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="230" y="370" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Aldob</text>
  <text x="230" y="385" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">F1P aldolase</text>
  
  <!-- Arrow down -->
  <path d="M 210 320 L 210 350" stroke="#006633" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-green)"/>
  
  <!-- Split products after Aldob -->
  <!-- Glyceraldehyde -->
  <rect x="100" y="410" width="120" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="160" y="435" text-anchor="middle" font-family="Arial" font-size="14">Glyceraldehyde</text>
  
  <!-- DHAP -->
  <rect x="250" y="410" width="120" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="310" y="435" text-anchor="middle" font-family="Arial" font-size="14">DHAP</text>
  
  <!-- Arrows from Aldob -->
  <path d="M 210 380 L 160 410" stroke="#6600cc" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-purple)"/>
  <path d="M 210 380 L 310 410" stroke="#6600cc" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-purple)"/>
  
  <!-- DHAP to glycolysis (implicit) -->
  <path d="M 370 430 L 450 430" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead-gray)"/>
  <rect x="450" y="410" width="120" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#0066cc" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="510" y="430" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">To Glycolysis</text>
  <text x="510" y="445" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic" fill="#666">(Glyceraldehyde-3P)</text>
  <text x="510" y="460" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic" fill="#666">(Implicit)</text>
  
  <!-- Aldh1a1 and Aldh1a7 enzymes -->
  <rect x="80" y="480" width="100" height="30" rx="15" ry="15" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="130" y="500" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Aldh1a1</text>
  
  <rect x="190" y="480" width="100" height="30" rx="15" ry="15" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="240" y="500" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Aldh1a7</text>
  
  <!-- Descriptions for enzymes -->
  <text x="130" y="515" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">Aldehyde dehydrogenase</text>
  <text x="240" y="515" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">Aldehyde dehydrogenase</text>
  
  <!-- NAD+ cofactor labels -->
  <text x="115" y="465" text-anchor="middle" font-family="Arial" font-size="10">NAD+ → NADH</text>
  <text x="225" y="465" text-anchor="middle" font-family="Arial" font-size="10">NAD+ → NADH</text>
  
  <!-- Arrows to enzymes -->
  <path d="M 160 450 L 130 480" stroke="#990000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-red)"/>
  <path d="M 160 450 L 240 480" stroke="#990000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-red)"/>
  
  <!-- Glycerate -->
  <rect x="150" y="540" width="120" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="210" y="565" text-anchor="middle" font-family="Arial" font-size="14">Glycerate</text>
  
  <!-- Arrows from enzymes to Glycerate -->
  <path d="M 130 510 L 180 540" stroke="#990000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-red)"/>
  <path d="M 240 510 L 210 540" stroke="#990000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-red)"/>
  
  <!-- Glyctk enzyme -->
  <rect x="320" y="540" width="100" height="30" rx="15" ry="15" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="370" y="560" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Glyctk</text>
  <text x="370" y="575" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">Glycerate kinase</text>
  
  <!-- ATP cofactor label -->
  <text x="370" y="525" text-anchor="middle" font-family="Arial" font-size="10">ATP → ADP</text>
  
  <!-- Arrow to Glyctk -->
  <path d="M 270 560 L 320 560" stroke="#0066cc" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-blue)"/>
  
  <!-- Glycerate-3-phosphate -->
  <rect x="450" y="540" width="120" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="510" y="565" text-anchor="middle" font-family="Arial" font-size="14">Glycerate-3P</text>
  
  <!-- Arrow from Glyctk -->
  <path d="M 420 560 L 450 560" stroke="#0066cc" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-blue)"/>
  
  <!-- To glycolysis (implicit) -->
  <path d="M 570 560 L 620 560" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead-gray)"/>
  <text x="625" y="555" text-anchor="start" font-family="Arial" font-size="12" font-style="italic">To Glycolysis</text>
  <text x="625" y="570" text-anchor="start" font-family="Arial" font-size="10" font-style="italic" fill="#666">(2-Phosphoglycerate)</text>
  <text x="625" y="585" text-anchor="start" font-family="Arial" font-size="10" font-style="italic" fill="#666">(Implicit)</text>
  
  <!-- GO-CAM model ID and organism -->
  <text x="60" y="75" font-family="Arial" font-size="10" fill="#666666">GO-CAM Model: gomodel:622aace900000443</text>

  <!-- Arrowhead markers with different colors -->
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006633"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6600cc"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#990000"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="100" width="140" height="210" rx="5" ry="5" fill="white" stroke="#888888" stroke-width="1"/>
  <text x="620" y="120" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <rect x="610" y="130" width="20" height="20" rx="5" ry="5" fill="#e6f2ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="635" y="145" font-family="Arial" font-size="12" textLength="100" lengthAdjust="spacingAndGlyphs">Metabolite</text>
  
  <rect x="610" y="155" width="20" height="20" rx="10" ry="10" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="635" y="170" font-family="Arial" font-size="12" textLength="100" lengthAdjust="spacingAndGlyphs">Enzyme</text>
  
  <line x1="610" y1="190" x2="630" y2="190" stroke="#006633" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <text x="635" y="195" font-family="Arial" font-size="12" textLength="100" lengthAdjust="spacingAndGlyphs">Phosphorylation</text>
  
  <line x1="610" y1="210" x2="630" y2="210" stroke="#6600cc" stroke-width="1.5" marker-end="url(#arrowhead-purple)"/>
  <text x="635" y="215" font-family="Arial" font-size="12" textLength="100" lengthAdjust="spacingAndGlyphs">Aldolase reaction</text>
  
  <line x1="610" y1="230" x2="630" y2="230" stroke="#990000" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <text x="635" y="235" font-family="Arial" font-size="12" textLength="100" lengthAdjust="spacingAndGlyphs">Dehydrogenation</text>
  
  <line x1="610" y1="250" x2="630" y2="250" stroke="#0066cc" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <text x="635" y="255" font-family="Arial" font-size="12" textLength="100" lengthAdjust="spacingAndGlyphs">Kinase reaction</text>
  
  <line x1="610" y1="270" x2="630" y2="270" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead-gray)"/>
  <text x="635" y="275" font-family="Arial" font-size="12" textLength="100" lengthAdjust="spacingAndGlyphs">Implicit step</text>
  
  <text x="610" y="295" font-family="Arial" font-size="12" textLength="125" lengthAdjust="spacingAndGlyphs">GO:0006001</text>
  <text x="635" y="310" font-family="Arial" font-size="10" textLength="100" lengthAdjust="spacingAndGlyphs">Fructose catabolic</text>
  <text x="635" y="325" font-family="Arial" font-size="10" textLength="100" lengthAdjust="spacingAndGlyphs">process</text>
</svg>