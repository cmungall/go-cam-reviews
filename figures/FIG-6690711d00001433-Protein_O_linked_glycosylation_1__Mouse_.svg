<svg width="800" height="680" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - ER membrane -->
  <rect x="50" y="280" width="700" height="40" fill="#FFD580" stroke="#E6A23C" stroke-width="2" rx="5" ry="5"/>
  <text x="400" y="295" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Endoplasmic Reticulum Membrane</text>
  
  <!-- ER Lumen (above membrane) -->
  <rect x="50" y="80" width="700" height="200" fill="#FFF9E6" stroke="#E6A23C" stroke-width="2" rx="5" ry="5" fill-opacity="0.5"/>
  <text x="100" y="110" font-family="Arial" font-size="14" text-anchor="start" dominant-baseline="middle">ER Lumen</text>
  
  <!-- Cytoplasm (below membrane) -->
  <rect x="50" y="320" width="700" height="200" fill="#E6F3FF" stroke="#5DADE2" stroke-width="2" rx="5" ry="5" fill-opacity="0.5"/>
  <text x="100" y="350" font-family="Arial" font-size="14" text-anchor="start" dominant-baseline="middle">Cytoplasm</text>
  
  <!-- Step 1: POMT1/POMT2 complex -->
  <rect x="120" y="260" width="100" height="80" fill="#FF9E9E" stroke="#000000" stroke-width="2" rx="5" ry="5"/>
  <text x="170" y="285" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold">POMT1/POMT2</text>
  <text x="170" y="300" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">complex</text>
  <text x="170" y="315" font-family="Arial" font-size="9" text-anchor="middle" dominant-baseline="middle">(mannosyltransferase)</text>
  
  <!-- Step 2: POMGNT2 -->
  <rect x="280" y="260" width="80" height="80" fill="#9EFF9E" stroke="#000000" stroke-width="2" rx="5" ry="5"/>
  <text x="320" y="290" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold">POMGNT2</text>
  <text x="320" y="310" font-family="Arial" font-size="9" text-anchor="middle" dominant-baseline="middle">(glucosaminyltransferase)</text>
  
  <!-- Step 3: B3GALNT2 -->
  <rect x="420" y="260" width="80" height="80" fill="#9E9EFF" stroke="#000000" stroke-width="2" rx="5" ry="5"/>
  <text x="460" y="290" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B3GALNT2</text>
  <text x="460" y="310" font-family="Arial" font-size="9" text-anchor="middle" dominant-baseline="middle">(galactosaminyltransferase)</text>
  
  <!-- Step 4: POMK -->
  <rect x="560" y="260" width="80" height="80" fill="#FFD700" stroke="#000000" stroke-width="2" rx="5" ry="5"/>
  <text x="600" y="290" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold">POMK</text>
  <text x="600" y="310" font-family="Arial" font-size="9" text-anchor="middle" dominant-baseline="middle">(carbohydrate kinase)</text>
  
  <!-- Substrate 1: Dolichyl D-mannosyl phosphate -->
  <circle cx="120" y="190" r="25" fill="#D9EDF7" stroke="#000000" stroke-width="2"/>
  <text x="120" y="190" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">Dolichyl</text>
  <text x="120" y="205" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">D-mannosyl-P</text>
  
  <!-- Substrate 2: UDP-N-acetyl-alpha-D-glucosamine -->
  <circle cx="280" y="190" r="25" fill="#D9EDF7" stroke="#000000" stroke-width="2"/>
  <text x="280" y="185" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">UDP-</text>
  <text x="280" y="195" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">N-acetyl-</text>
  <text x="280" y="205" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">glucosamine</text>
  
  <!-- Substrate 3: UDP-N-acetyl-D-galactosamine -->
  <circle cx="420" y="190" r="25" fill="#D9EDF7" stroke="#000000" stroke-width="2"/>
  <text x="420" y="185" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">UDP-</text>
  <text x="420" y="195" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">N-acetyl-</text>
  <text x="420" y="205" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">galactosamine</text>
  
  <!-- Substrate 4: ATP -->
  <circle cx="560" y="190" r="25" fill="#D9EDF7" stroke="#000000" stroke-width="2"/>
  <text x="560" y="190" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">ATP</text>
  
  <!-- Product 1: Dolichyl phosphate -->
  <circle cx="170" y="380" r="25" fill="#FCF8E3" stroke="#000000" stroke-width="2"/>
  <text x="170" y="375" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle">Dolichyl</text>
  <text x="170" y="390" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle">phosphate</text>
  
  <!-- Product 2: UDP -->
  <circle cx="280" y="380" r="25" fill="#FCF8E3" stroke="#000000" stroke-width="2"/>
  <text x="280" y="380" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">UDP</text>
  
  <!-- Product 3: UDP -->
  <circle cx="420" y="380" r="25" fill="#FCF8E3" stroke="#000000" stroke-width="2"/>
  <text x="420" y="380" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">UDP</text>
  
  <!-- Product 4: ADP -->
  <circle cx="560" y="380" r="25" fill="#FCF8E3" stroke="#000000" stroke-width="2"/>
  <text x="560" y="380" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">ADP</text>
  
  <!-- Growing glycan chain on DAG1 (not explicitly in GO-CAM but necessary for clarity) -->
  <rect x="240" y="460" width="300" height="30" fill="#D5F5E3" stroke="#58D68D" stroke-width="2" rx="5" ry="5"/>
  <text x="390" y="475" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" font-style="italic">DAG1 (dystroglycan)*</text>
  
  <!-- Growing glycan on target protein -->
  <circle cx="170" y="460" r="8" fill="#EDBB99" stroke="#000000" stroke-width="1"/>
  <text x="170" y="460" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">M</text>
  
  <circle cx="320" y="460" r="8" fill="#D2B4DE" stroke="#000000" stroke-width="1"/>
  <text x="320" y="460" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">G</text>
  
  <circle cx="460" y="460" r="8" fill="#A9CCE3" stroke="#000000" stroke-width="1"/>
  <text x="460" y="460" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">Ga</text>
  
  <circle cx="600" y="460" r="8" fill="#F7DC6F" stroke="#000000" stroke-width="1"/>
  <text x="600" y="460" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">P</text>
  
  <!-- Arrows for substrate entry -->
  <line x1="120" y1="215" x2="120" y2="260" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="215" x2="280" y2="260" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="215" x2="420" y2="260" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="215" x2="560" y2="260" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrows for product release -->
  <line x1="170" y1="340" x2="170" y2="355" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="340" x2="280" y2="355" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="340" x2="420" y2="355" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="340" x2="560" y2="355" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pathway flow arrows -->
  <line x1="220" y1="300" x2="280" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="300" x2="420" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="300" x2="560" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Glycan chain building arrows -->
  <line x1="170" y1="340" x2="170" y2="452" stroke="#000000" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="320" y1="340" x2="320" y2="452" stroke="#000000" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="460" y1="340" x2="460" y2="452" stroke="#000000" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="600" y1="340" x2="600" y2="452" stroke="#000000" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Overall pathway flow arrow -->
  <path d="M 170,500 Q 390,530 600,500" stroke="#FF5733" stroke-width="3" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="10,4"/>
  <text x="390" y="540" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#FF5733">Protein O-linked Glycosylation Pathway</text>
  
  <!-- Enzyme function annotations -->
  <text x="170" y="250" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="#800000">Mannose transfer</text>
  <text x="320" y="250" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="#008000">GlcNAc transfer</text>
  <text x="460" y="250" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="#000080">GalNAc transfer</text>
  <text x="600" y="250" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="#806000">Phosphorylation</text>
  
  <!-- Reaction descriptions -->
  <text x="80" y="145" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">1. POMT1/POMT2 transfers mannose</text>
  <text x="80" y="160" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">   from dolichyl-P-mannose to protein</text>
  
  <text x="240" y="145" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">2. POMGNT2 adds N-acetyl-</text>
  <text x="240" y="160" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">   glucosamine from UDP-GlcNAc</text>
  
  <text x="380" y="145" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">3. B3GALNT2 adds N-acetyl-</text>
  <text x="380" y="160" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">   galactosamine from UDP-GalNAc</text>
  
  <text x="520" y="145" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">4. POMK phosphorylates</text>
  <text x="520" y="160" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">   using ATP → ADP</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Protein O-linked Glycosylation Pathway in Mouse</text>
  
  <!-- Legend -->
  <rect x="550" y="80" width="200" height="150" fill="white" stroke="black" stroke-width="1" rx="5" ry="5" fill-opacity="0.8"/>
  <text x="650" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <rect x="560" y="110" width="15" height="15" fill="#FF9E9E" stroke="#000000" stroke-width="1"/>
  <text x="580" y="122" font-family="Arial" font-size="12" text-anchor="start">POMT1/POMT2 complex</text>
  
  <rect x="560" y="130" width="15" height="15" fill="#9EFF9E" stroke="#000000" stroke-width="1"/>
  <text x="580" y="142" font-family="Arial" font-size="12" text-anchor="start">POMGNT2</text>
  
  <rect x="560" y="150" width="15" height="15" fill="#9E9EFF" stroke="#000000" stroke-width="1"/>
  <text x="580" y="162" font-family="Arial" font-size="12" text-anchor="start">B3GALNT2</text>
  
  <rect x="560" y="170" width="15" height="15" fill="#FFD700" stroke="#000000" stroke-width="1"/>
  <text x="580" y="182" font-family="Arial" font-size="12" text-anchor="start">POMK</text>
  
  <circle cx="567" cy="200" r="7" fill="#D9EDF7" stroke="#000000" stroke-width="1"/>
  <text x="580" y="202" font-family="Arial" font-size="12" text-anchor="start">Substrate</text>
  
  <circle cx="567" cy="220" r="7" fill="#FCF8E3" stroke="#000000" stroke-width="1"/>
  <text x="580" y="222" font-family="Arial" font-size="12" text-anchor="start">Product</text>
  
  <!-- Note about DAG1 -->
  <text x="390" y="580" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">* DAG1 (dystroglycan) is implied as the O-glycosylation target protein but not explicitly in source</text>
  
  <!-- Glycan coding legend -->
  <text x="220" y="600" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Glycan components:</text>
  <circle cx="220" y="615" r="8" fill="#EDBB99" stroke="#000000" stroke-width="1"/>
  <text x="220" y="615" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">M</text>
  <text x="235" y="618" font-family="Arial" font-size="12" text-anchor="start">Mannose</text>
  
  <circle cx="320" y="615" r="8" fill="#D2B4DE" stroke="#000000" stroke-width="1"/>
  <text x="320" y="615" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">G</text>
  <text x="335" y="618" font-family="Arial" font-size="12" text-anchor="start">N-acetylglucosamine</text>
  
  <circle cx="460" y="615" r="8" fill="#A9CCE3" stroke="#000000" stroke-width="1"/>
  <text x="460" y="615" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">Ga</text>
  <text x="475" y="618" font-family="Arial" font-size="12" text-anchor="start">N-acetylgalactosamine</text>
  
  <circle cx="600" y="615" r="8" fill="#F7DC6F" stroke="#000000" stroke-width="1"/>
  <text x="600" y="615" font-family="Arial" font-size="8" text-anchor="middle" dominant-baseline="middle">P</text>
  <text x="615" y="618" font-family="Arial" font-size="12" text-anchor="start">Phosphate group</text>
  
  <!-- Process description -->
  <rect x="50" y="640" width="700" height="30" fill="#F8F9F9" stroke="#ABB2B9" stroke-width="1" rx="5" ry="5"/>
  <text x="400" y="660" font-family="Arial" font-size="12" text-anchor="middle">Sequential enzymatic reactions in protein O-linked glycosylation pathway occurring at the ER membrane</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
</svg>