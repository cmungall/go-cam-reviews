<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" />
  
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#ffffff" stroke="#333333" stroke-width="2" />
  
  <!-- Lysosomal membrane -->
  <ellipse cx="280" cy="250" rx="100" ry="80" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="280" y="210" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Lysosomal membrane</text>
  
  <!-- Cytosolic ribosome -->
  <rect x="500" y="350" width="180" height="100" rx="10" ry="10" fill="#e6f2ff" stroke="#3399ff" stroke-width="2" />
  <text x="590" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Cytosolic ribosome</text>
  
  <!-- Cytoplasm label -->
  <text x="170" y="130" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Cytoplasm</text>
  
  <!-- Insulin signal -->
  <path d="M 50,50 L 150,150" stroke="#ff0000" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="80" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#ff0000" font-weight="bold">Insulin</text>
  
  <!-- Proteins and interactions -->
  
  <!-- AKT1 -->
  <circle cx="150" cy="180" r="25" fill="#c6ebd9" stroke="#339966" stroke-width="2" />
  <text x="150" y="185" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">AKT1</text>
  
  <!-- AKT1S1/PRAS40 -->
  <rect x="230" y="180" width="70" height="40" rx="5" ry="5" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="265" y="198" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">AKT1S1</text>
  <text x="265" y="212" font-family="Arial" font-size="9" text-anchor="middle">(PRAS40)</text>
  
  <!-- mTOR in lysosomal membrane -->
  <circle cx="280" cy="250" r="25" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="280" y="255" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">mTOR</text>
  
  <!-- RPS6KB1 and RPS6KB2 -->
  <circle cx="380" cy="250" r="25" fill="#e6ccff" stroke="#9966ff" stroke-width="2" />
  <text x="380" y="245" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">RPS6KB1</text>
  <text x="380" y="260" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">RPS6KB2</text>
  
  <!-- EIF4EBP1 -->
  <rect x="450" y="180" width="70" height="40" rx="5" ry="5" fill="#cce6ff" stroke="#3399ff" stroke-width="2" />
  <text x="485" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">EIF4EBP1</text>
  
  <!-- RPS6 in ribosome -->
  <circle cx="590" cy="400" r="25" fill="#ffccff" stroke="#cc66cc" stroke-width="2" />
  <text x="590" y="405" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">RPS6</text>
  
  <!-- Arrows for interactions -->
  <!-- Define arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <marker id="inhibition" viewBox="0 0 20 20" refX="0" refY="10"
        markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 0 20" stroke="#333" stroke-width="2" />
    </marker>
  </defs>
  
  <!-- AKT1 phosphorylates AKT1S1 -->
  <path d="M 175,180 L 230,180" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="205" y="170" font-family="Arial" font-size="10" text-anchor="middle">phosphorylates</text>
  <circle cx="215" cy="180" r="5" fill="yellow" stroke="black" stroke-width="1" /> <!-- Phosphorylation mark -->
  
  <!-- AKT1S1 inhibits mTOR -->
  <path d="M 270,220 L 280,225" stroke="#ff0000" stroke-width="2" fill="none" stroke-dasharray="5,2" />
  <text x="240" y="235" font-family="Arial" font-size="10" text-anchor="middle">inhibits</text>
  
  <!-- Phosphorylated AKT1S1 stops inhibiting mTOR -->
  <path d="M 290,220 L 320,230" stroke="green" stroke-width="2" fill="none" />
  <text x="320" y="210" font-family="Arial" font-size="10" text-anchor="middle" fill="green">relieves</text>
  <text x="320" y="222" font-family="Arial" font-size="10" text-anchor="middle" fill="green">inhibition</text>
  
  <!-- mTOR activates RPS6KB1/2 -->
  <path d="M 305,250 L 355,250" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="330" y="240" font-family="Arial" font-size="10" text-anchor="middle">activates</text>
  
  <!-- mTOR phosphorylates EIF4EBP1 -->
  <path d="M 300,235 L 450,200" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="370" y="205" font-family="Arial" font-size="10" text-anchor="middle">phosphorylates</text>
  <circle cx="400" cy="215" r="5" fill="yellow" stroke="black" stroke-width="1" /> <!-- Phosphorylation mark -->
  
  <!-- RPS6KB1/2 phosphorylates RPS6 -->
  <path d="M 405,250 L 565,380" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="470" y="300" font-family="Arial" font-size="10" text-anchor="middle">phosphorylates</text>
  <circle cx="500" cy="330" r="5" fill="yellow" stroke="black" stroke-width="1" /> <!-- Phosphorylation mark -->
  
  <!-- EIF4EBP1 affects translation -->
  <path d="M 520,200 L 600,350" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="570" y="270" font-family="Arial" font-size="10" text-anchor="middle">regulates translation</text>
  
  <!-- Legend -->
  <rect x="600" y="80" width="180" height="210" fill="white" stroke="#333333" stroke-width="1" />
  <text x="690" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="620" y="125" r="8" fill="#c6ebd9" stroke="#339966" stroke-width="1" />
  <text x="690" y="128" font-family="Arial" font-size="12" text-anchor="middle">Kinase</text>
  
  <rect x="612" y="145" width="16" height="16" rx="2" ry="2" fill="#ffe6cc" stroke="#ff9933" stroke-width="1" />
  <text x="690" y="158" font-family="Arial" font-size="12" text-anchor="middle">Regulatory protein</text>
  
  <circle cx="620" y="175" r="5" fill="yellow" stroke="black" stroke-width="1" />
  <text x="690" y="178" font-family="Arial" font-size="12" text-anchor="middle">Phosphorylation</text>
  
  <line x1="610" y1="195" x2="630" y2="195" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,2" />
  <text x="690" y="198" font-family="Arial" font-size="12" text-anchor="middle">Inhibition</text>
  
  <line x1="610" y1="215" x2="630" y2="215" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="690" y="218" font-family="Arial" font-size="12" text-anchor="middle">Activation</text>
  
  <line x1="610" y1="235" x2="630" y2="235" stroke="green" stroke-width="2" />
  <text x="690" y="238" font-family="Arial" font-size="12" text-anchor="middle">Relief of inhibition</text>
  
  <ellipse cx="620" cy="255" rx="10" ry="8" fill="#e6f2ff" stroke="#3399ff" stroke-width="1" />
  <text x="690" y="258" font-family="Arial" font-size="12" text-anchor="middle">Cellular compartment</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Phosphorylation of AKT1S1/PRAS40 in response to insulin,</text>
  <text x="400" y="55" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">relieving AKT1S1/PRAS40 inhibitor activity</text>
  
  <!-- Source/Process labels -->
  <text x="400" y="530" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">TORC1 signaling pathway leading to translation initiation</text>
  <text x="400" y="555" font-family="Arial" font-size="12" text-anchor="middle">All components shown are derived from the source GO-CAM model</text>
</svg>