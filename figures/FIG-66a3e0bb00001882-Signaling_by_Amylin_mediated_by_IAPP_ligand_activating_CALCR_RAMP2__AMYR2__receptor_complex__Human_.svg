<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background - Cell components -->
    <rect x="0" y="0" width="800" height="600" fill="#f9f9f9" />
    
    <!-- Cell compartments -->
    <!-- Extracellular space -->
    <rect x="50" y="50" width="700" height="150" fill="#e6f2ff" rx="10" ry="10" />
    <text x="75" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#555">Extracellular Space (GO:0005615)</text>
    
    <!-- Plasma membrane -->
    <rect x="50" y="200" width="700" height="50" fill="#ffcccc" rx="0" ry="0" />
    <text x="75" y="230" font-family="Arial" font-size="16" font-weight="bold" fill="#555">Plasma Membrane (GO:0005886)</text>
    
    <!-- Cytosol -->
    <rect x="50" y="250" width="700" height="300" fill="#e6ffe6" rx="10" ry="10" />
    <text x="75" y="280" font-family="Arial" font-size="16" font-weight="bold" fill="#555">Cytosol (GO:0005829)</text>
    
    <!-- Molecules and interactions -->
    <!-- IAPP ligand -->
    <circle cx="250" cy="130" r="30" fill="#ffcc66" stroke="#333" stroke-width="2" />
    <text x="250" y="135" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">IAPP</text>
    <text x="250" y="85" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Hormone Activity</text>
    <text x="250" y="100" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(UniProtKB:P10997)</text>
    
    <!-- Receptor complex -->
    <rect x="245" y="190" width="40" height="70" fill="#ff9999" stroke="#333" stroke-width="2" rx="5" ry="5" />
    <text x="265" y="215" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">CALCR</text>
    <text x="265" y="230" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(P30988)</text>
    
    <rect x="285" y="190" width="40" height="70" fill="#cc99ff" stroke="#333" stroke-width="2" rx="5" ry="5" />
    <text x="305" y="215" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">RAMP2</text>
    <text x="305" y="230" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(O60895)</text>
    
    <text x="345" y="205" font-family="Arial" font-size="12" font-weight="bold" text-anchor="left" fill="#333">Amylin Receptor</text>
    <text x="345" y="220" font-family="Arial" font-size="12" text-anchor="left" fill="#333">Activity (GO:0097643)</text>
    
    <!-- G protein -->
    <circle cx="265" cy="350" r="30" fill="#99ccff" stroke="#333" stroke-width="2" />
    <text x="265" y="350" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">GNAS</text>
    <text x="265" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(Q5JWF2)</text>
    <text x="265" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">G protein activity</text>
    
    <!-- Adenylate cyclase -->
    <rect x="345" y="420" width="60" height="45" fill="#99ffcc" stroke="#333" stroke-width="2" rx="5" ry="5" />
    <text x="375" y="440" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">ADCY6</text>
    <text x="375" y="455" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(O43306)</text>
    
    <!-- cAMP -->
    <polygon points="460,430 475,410 490,430 475,450" fill="#ffff99" stroke="#333" stroke-width="2" />
    <text x="475" y="435" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">cAMP</text>
    
    <!-- Process labels -->
    <rect x="465" y="290" width="280" height="40" fill="white" opacity="0.7" rx="5" ry="5" />
    <text x="465" y="305" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">Adenylate Cyclase-Activating G Protein-Coupled</text>
    <text x="465" y="320" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">Receptor Signaling Pathway (GO:0007189)</text>
    
    <rect x="170" y="170" width="240" height="40" fill="white" opacity="0.7" rx="5" ry="5" />
    <text x="170" y="170" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">Amylin Receptor 2 Signaling</text>
    <text x="170" y="185" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">Pathway (GO:0150060)</text>
    
    <!-- Arrows and connections -->
    <line x1="250" y1="160" x2="250" y2="190" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <line x1="265" y1="260" x2="265" y2="320" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <line x1="265" y1="380" x2="345" y2="420" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <line x1="405" y1="430" x2="460" y2="430" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
    
    <!-- Arrowhead marker -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
        </marker>
    </defs>
    
    <!-- Legend -->
    <rect x="550" y="350" width="180" height="180" fill="white" stroke="#333" stroke-width="1" rx="5" ry="5" />
    <text x="640" y="370" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">LEGEND</text>
    
    <!-- Legend items -->
    <circle cx="570" y="390" r="10" fill="#ffcc66" stroke="#333" stroke-width="1" />
    <text x="585" y="395" font-family="Arial" font-size="12" text-anchor="left" fill="#333">Hormone (IAPP)</text>
    
    <rect x="560" y="410" width="20" height="20" fill="#ff9999" stroke="#333" stroke-width="1" rx="2" ry="2" />
    <text x="585" y="425" font-family="Arial" font-size="12" text-anchor="left" fill="#333">Receptor (CALCR)</text>
    
    <rect x="560" y="440" width="20" height="20" fill="#cc99ff" stroke="#333" stroke-width="1" rx="2" ry="2" />
    <text x="585" y="455" font-family="Arial" font-size="12" text-anchor="left" fill="#333">Coreceptor (RAMP2)</text>
    
    <circle cx="570" y="475" r="10" fill="#99ccff" stroke="#333" stroke-width="1" />
    <text x="585" y="480" font-family="Arial" font-size="12" text-anchor="left" fill="#333">G protein (GNAS)</text>
    
    <rect x="560" y="490" width="20" height="20" fill="#99ffcc" stroke="#333" stroke-width="1" rx="2" ry="2" />
    <text x="585" y="505" font-family="Arial" font-size="12" text-anchor="left" fill="#333">Enzyme (ADCY6)</text>
    
    <!-- Journal-style title -->
    <text x="400" y="540" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">
        Signaling by Amylin Mediated by IAPP Ligand Activating CALCR-RAMP2 (AMYR2) Receptor Complex
    </text>
    <text x="400" y="565" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" fill="#333">
        Human Cellular Signaling Pathway
    </text>
</svg>