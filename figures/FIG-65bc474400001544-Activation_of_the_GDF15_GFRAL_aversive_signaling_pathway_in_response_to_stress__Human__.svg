<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
    <!-- Background cellular structures -->
    <!-- Cytoplasm -->
    <rect x="50" y="100" width="700" height="400" rx="20" ry="20" fill="#F0F8FF" stroke="#99CCCC" stroke-width="2"/>
    <text x="400" y="130" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Cytoplasm</text>
    
    <!-- Nucleus -->
    <ellipse cx="200" cy="300" rx="150" ry="120" fill="#E6F3FF" stroke="#6699CC" stroke-width="2"/>
    <text x="200" y="300" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Nucleus</text>
    
    <!-- Plasma Membrane -->
    <path d="M 50 100 Q 400 80 750 100" stroke="#DB7093" stroke-width="4" fill="none"/>
    <path d="M 50 500 Q 400 520 750 500" stroke="#DB7093" stroke-width="4" fill="none"/>
    <text x="400" y="520" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Plasma Membrane</text>
    
    <!-- Extracellular Space -->
    <rect x="50" y="20" width="700" height="80" rx="5" ry="5" fill="#FFEFD5" stroke="#DEB887" stroke-width="2"/>
    <text x="400" y="50" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Extracellular Space</text>
    
    <!-- Pathway Components -->
    <!-- ATF4 in nucleus -->
    <circle cx="140" cy="280" r="35" fill="#9370DB" stroke="#483D8B" stroke-width="2"/>
    <text x="140" y="284" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">ATF4</text>
    <text x="140" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Transcription Factor</text>
    
    <!-- DDIT3 in nucleus -->
    <circle cx="240" cy="330" r="35" fill="#9370DB" stroke="#483D8B" stroke-width="2"/>
    <text x="240" y="334" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">DDIT3</text>
    <text x="240" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Transcription Factor</text>
    
    <!-- GDF15 gene activation arrows -->
    <path d="M 170 280 Q 300 280 330 250" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 240 300 Q 300 280 330 250" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="270" y="265" font-family="Arial" font-size="16" text-anchor="middle">Activates</text>
    
    <!-- GDF15 in cytoplasm -->
    <circle cx="380" cy="250" r="35" fill="#FF6347" stroke="#CD5C5C" stroke-width="2"/>
    <text x="380" y="254" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">GDF15</text>
    <text x="380" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Hormone</text>
    
    <!-- GDF15 secretion to extracellular space -->
    <path d="M 380 215 Q 380 150 380 80" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
    <text x="400" y="150" font-family="Arial" font-size="16" text-anchor="start">Secretion</text>
    
    <!-- GDF15 in extracellular space -->
    <circle cx="380" cy="50" r="25" fill="#FF6347" stroke="#CD5C5C" stroke-width="2"/>
    <text x="380" y="54" font-family="Arial" font-size="16" text-anchor="middle" fill="white" font-weight="bold">GDF15</text>
    
    <!-- GFRAL at plasma membrane -->
    <rect x="500" y="90" width="80" height="30" rx="5" ry="5" fill="#66CDAA" stroke="#3CB371" stroke-width="2"/>
    <text x="540" y="110" font-family="Arial" font-size="16" text-anchor="middle" fill="white" font-weight="bold">GFRAL</text>
    
    <!-- GDF15 binding to GFRAL -->
    <path d="M 405 50 Q 470 70 500 105" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="455" y="70" font-family="Arial" font-size="16" text-anchor="middle">Binds</text>
    
    <!-- RET at plasma membrane -->
    <rect x="620" y="90" width="80" height="30" rx="5" ry="5" fill="#4682B4" stroke="#1E90FF" stroke-width="2"/>
    <text x="660" y="110" font-family="Arial" font-size="16" text-anchor="middle" fill="white" font-weight="bold">RET</text>
    
    <!-- GFRAL activating RET -->
    <path d="M 580 105 L 620 105" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="600" y="95" font-family="Arial" font-size="16" text-anchor="middle">Activates</text>
    
    <!-- GDF15-GFRAL pathway activation -->
    <path d="M 660 120 Q 660 180 660 240" stroke="#000000" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="580" y="240" width="160" height="60" rx="10" ry="10" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
    <text x="660" y="270" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">GDF15-GFRAL</text>
    <text x="660" y="290" font-family="Arial" font-size="16" text-anchor="middle">Signaling Pathway</text>
    
    <!-- Pathway Context -->
    <rect x="90" y="410" width="300" height="70" rx="5" ry="5" fill="#F8F8F8" stroke="#CCCCCC" stroke-width="1"/>
    <text x="240" y="435" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Integrated Stress Response</text>
    <text x="240" y="455" font-family="Arial" font-size="14" text-anchor="middle">Activates aversive signaling</text>
    <text x="240" y="475" font-family="Arial" font-size="14" text-anchor="middle">during cellular stress</text>
    
    <!-- Legend box -->
    <rect x="530" y="330" width="200" height="170" fill="white" stroke="black" stroke-width="1"/>
    <text x="630" y="350" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Legend</text>
    
    <!-- Legend items -->
    <circle cx="550" cy="370" r="10" fill="#9370DB" stroke="#483D8B" stroke-width="1"/>
    <text x="640" y="375" font-family="Arial" font-size="16" text-anchor="start">Transcription Factor</text>
    
    <circle cx="550" cy="400" r="10" fill="#FF6347" stroke="#CD5C5C" stroke-width="1"/>
    <text x="640" y="405" font-family="Arial" font-size="16" text-anchor="start">Hormone</text>
    
    <rect x="540" y="420" width="20" height="10" fill="#66CDAA" stroke="#3CB371" stroke-width="1"/>
    <text x="640" y="430" font-family="Arial" font-size="16" text-anchor="start">Receptor</text>
    
    <rect x="540" y="450" width="20" height="10" fill="#4682B4" stroke="#1E90FF" stroke-width="1"/>
    <text x="640" y="455" font-family="Arial" font-size="16" text-anchor="start">Tyrosine Kinase</text>
    
    <rect x="540" y="480" width="20" height="10" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
    <text x="640" y="485" font-family="Arial" font-size="16" text-anchor="start">Signaling Pathway</text>
    
    <!-- Title -->
    <text x="400" y="580" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Activation of the GDF15-GFRAL Aversive Signaling Pathway in Response to Stress</text>
    <text x="400" y="610" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Human cellular stress response mechanism</text>
    
    <!-- Arrow definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
        </marker>
    </defs>
</svg>