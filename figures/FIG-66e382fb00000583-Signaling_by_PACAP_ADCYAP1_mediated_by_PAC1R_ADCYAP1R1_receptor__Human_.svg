<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background layers -->
  <!-- Extracellular space -->
  <rect x="50" y="80" width="700" height="150" fill="#e6f7ff" opacity="0.7" rx="10" ry="10" />
  <text x="70" y="110" font-family="Arial" font-size="14" fill="#333333">Extracellular Space (GO:0005615)</text>
  
  <!-- Cell membrane -->
  <rect x="50" y="230" width="700" height="50" fill="#ffcc99" opacity="0.7" rx="5" ry="5" />
  <text x="70" y="260" font-family="Arial" font-size="14" fill="#333333">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytosol -->
  <rect x="50" y="280" width="700" height="270" fill="#e6ffe6" opacity="0.7" rx="10" ry="10" />
  <text x="70" y="310" font-family="Arial" font-size="14" fill="#333333">Cytosol (GO:0005829)</text>
  
  <!-- ADCYAP1 (PACAP) in extracellular space -->
  <circle cx="250" cy="160" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="250" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">ADCYAP1</text>
  <text x="250" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">(P18509)</text>
  
  <!-- ADCYAP1R1 (PAC1R) in plasma membrane -->
  <rect x="240" y="225" width="70" height="60" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="10" ry="10" />
  <text x="275" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">ADCYAP1R1</text>
  <text x="275" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">(P41586)</text>
  
  <!-- GNAS (G protein) in cytosol -->
  <circle cx="350" cy="350" r="30" fill="#cc99ff" stroke="#6600cc" stroke-width="2" />
  <text x="350" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">GNAS</text>
  <text x="350" y="370" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">(Q5JWF2)</text>
  
  <!-- ADCY6 (Adenylate cyclase) in cytosol -->
  <rect x="440" y="340" width="70" height="60" fill="#99ff99" stroke="#00cc00" stroke-width="2" rx="5" ry="5" />
  <text x="475" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">ADCY6</text>
  <text x="475" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">(O43306)</text>
  
  <!-- cAMP product -->
  <circle cx="550" cy="430" r="25" fill="#ffff99" stroke="#cccc00" stroke-width="2" />
  <text x="550" y="435" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">cAMP</text>
  
  <!-- Arrows connecting proteins in pathway -->
  <!-- ADCYAP1 to ADCYAP1R1 -->
  <line x1="250" y1="190" x2="260" y2="225" stroke="#333333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="240" y="210" font-family="Arial" font-size="10" fill="#333333">activates</text>
  
  <!-- ADCYAP1R1 to GNAS -->
  <line x1="280" y1="285" x2="330" y2="325" stroke="#333333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="290" y="310" font-family="Arial" font-size="10" fill="#333333">activates</text>
  
  <!-- GNAS to ADCY6 -->
  <line x1="380" y1="350" x2="440" y2="360" stroke="#333333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="390" y="340" font-family="Arial" font-size="10" fill="#333333">activates</text>
  
  <!-- ADCY6 to cAMP -->
  <line x1="490" y1="400" x2="535" y2="415" stroke="#333333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="500" y="420" font-family="Arial" font-size="10" fill="#333333">produces</text>
  
  <!-- Process label -->
  <rect x="100" y="480" width="600" height="30" fill="#f2f2f2" opacity="0.7" rx="5" ry="5" />
  <text x="400" y="500" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Adenylate cyclase-activating G protein-coupled receptor signaling pathway (GO:0007189)</text>
  
  <!-- Legend -->
  <rect x="50" y="530" width="700" height="90" fill="#f9f9f9" stroke="#cccccc" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="550" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Legend</text>
  
  <!-- Protein types -->
  <circle cx="100" cy="570" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="115" y="575" font-family="Arial" font-size="12" fill="#333333">Neuropeptide (ADCYAP1)</text>
  
  <rect x="250" y="560" width="20" height="20" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="3" ry="3" />
  <text x="275" y="575" font-family="Arial" font-size="12" fill="#333333">Receptor (ADCYAP1R1)</text>
  
  <circle cx="400" cy="570" r="10" fill="#cc99ff" stroke="#6600cc" stroke-width="2" />
  <text x="415" y="575" font-family="Arial" font-size="12" fill="#333333">G protein (GNAS)</text>
  
  <rect x="550" y="560" width="20" height="20" fill="#99ff99" stroke="#00cc00" stroke-width="2" rx="3" ry="3" />
  <text x="575" y="575" font-family="Arial" font-size="12" fill="#333333">Enzyme (ADCY6)</text>
  
  <circle cx="100" cy="600" r="10" fill="#ffff99" stroke="#cccc00" stroke-width="2" />
  <text x="115" y="605" font-family="Arial" font-size="12" fill="#333333">Small molecule (cAMP)</text>
  
  <line x1="250" y1="600" x2="280" y2="600" stroke="#333333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="290" y="605" font-family="Arial" font-size="12" fill="#333333">Activation</text>
  
  <rect x="400" y="590" width="150" height="20" fill="#f2f2f2" opacity="0.7" rx="3" ry="3" />
  <text x="475" y="605" font-family="Arial" font-size="12" fill="#333333">Process annotation</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333333">Signaling by PACAP/ADCYAP1 mediated by PAC1R/ADCYAP1R1 receptor (Human)</text>
  <text x="400" y="65" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#666666">GO-CAM model: gomodel:66e382fb00000583</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>
</svg>