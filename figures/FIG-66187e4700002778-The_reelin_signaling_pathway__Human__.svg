<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell and extracellular space -->
  <rect x="0" y="0" width="800" height="600" fill="#f0f0f0"/>
  <rect x="0" y="250" width="800" height="350" fill="#d9eafd" stroke="#666" stroke-width="2"/>
  
  <!-- Cell membrane -->
  <path d="M 0,250 Q 100,230 200,250 Q 300,270 400,250 Q 500,230 600,250 Q 700,270 800,250" 
        fill="none" stroke="#3A7CA5" stroke-width="6"/>
  
  <!-- Labels for compartments -->
  <rect x="20" y="195" width="300" height="30" rx="5" ry="5" fill="rgba(255,255,255,0.7)" stroke="#333" stroke-width="1"/>
  <text x="30" y="217" font-family="Arial" font-size="20" font-weight="bold" fill="#333">Extracellular Space (GO:0005615)</text>
  
  <rect x="20" y="275" width="300" height="30" rx="5" ry="5" fill="rgba(255,255,255,0.7)" stroke="#333" stroke-width="1"/>
  <text x="30" y="297" font-family="Arial" font-size="20" font-weight="bold" fill="#333">Plasma Membrane (GO:0005886)</text>
  
  <rect x="20" y="350" width="240" height="30" rx="5" ry="5" fill="rgba(255,255,255,0.7)" stroke="#333" stroke-width="1"/>
  <text x="30" y="372" font-family="Arial" font-size="20" font-weight="bold" fill="#333">Cytoplasm (GO:0005737)</text>
  
  <!-- Reelin in extracellular space -->
  <circle cx="400" cy="150" r="50" fill="#ff9e9e" stroke="#d14747" stroke-width="3"/>
  <text x="400" y="145" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">RELN</text>
  <text x="400" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">(P78509)</text>
  
  <!-- Reelin Receptor on plasma membrane -->
  <rect x="370" y="230" width="100" height="50" rx="10" ry="10" fill="#a8e6cf" stroke="#41a08a" stroke-width="3"/>
  <text x="420" y="258" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">LRP8</text>
  <text x="420" y="275" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">(Q14114-4)</text>
  
  <!-- FYN in cytoplasm -->
  <rect x="310" y="320" width="90" height="50" rx="5" ry="5" fill="#ffd3b6" stroke="#d18145" stroke-width="3"/>
  <text x="355" y="348" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">FYN</text>
  <text x="355" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">(P06241)</text>
  
  <!-- DAB1 in cytoplasm -->
  <rect x="450" y="400" width="90" height="50" rx="5" ry="5" fill="#dcedc1" stroke="#7ca64a" stroke-width="3"/>
  <text x="495" y="428" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">DAB1</text>
  <text x="495" y="445" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">(O75553)</text>
  
  <!-- Arrows showing the pathway -->
  <!-- Reelin to LRP8 -->
  <line x1="400" y1="200" x2="420" y2="230" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <!-- LRP8 to FYN -->
  <line x1="380" y1="280" x2="355" y2="320" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <!-- FYN to DAB1 -->
  <line x1="390" y1="350" x2="450" y2="400" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Function labels with improved visibility -->
  <rect x="240" y="160" width="180" height="50" rx="5" ry="5" fill="rgba(255,255,255,0.8)" stroke="#333" stroke-width="1"/>
  <text x="330" y="185" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Receptor ligand activity</text>
  <text x="330" y="202" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">GO:0048018</text>
  
  <rect x="490" y="160" width="180" height="50" rx="5" ry="5" fill="rgba(255,255,255,0.8)" stroke="#333" stroke-width="1"/>
  <text x="580" y="185" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Reelin receptor activity</text>
  <text x="580" y="202" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">GO:0038025</text>
  
  <rect x="180" y="320" width="180" height="50" rx="5" ry="5" fill="rgba(255,255,255,0.8)" stroke="#333" stroke-width="1"/>
  <text x="270" y="340" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Protein tyrosine kinase</text>
  <text x="270" y="360" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">activity (GO:0004713)</text>
  
  <rect x="560" y="380" width="180" height="50" rx="5" ry="5" fill="rgba(255,255,255,0.8)" stroke="#333" stroke-width="1"/>
  <text x="650" y="400" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Signaling adaptor</text>
  <text x="650" y="420" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">activity (GO:0035591)</text>
  
  <!-- Overall pathway label -->
  <rect x="180" y="50" width="440" height="50" rx="10" ry="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="400" y="75" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Reelin-mediated Signaling Pathway</text>
  <text x="400" y="95" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">GO:0038026</text>
  
  <!-- Flow direction indicators - adjusted to avoid overlap -->
  <rect x="400" y="200" width="70" height="20" rx="3" ry="3" fill="rgba(255,255,255,0.7)" stroke="none"/>
  <text x="435" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Binding</text>
  
  <rect x="325" y="290" width="85" height="20" rx="3" ry="3" fill="rgba(255,255,255,0.7)" stroke="none"/>
  <text x="367" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Activation</text>
  
  <rect x="400" y="375" width="120" height="20" rx="3" ry="3" fill="rgba(255,255,255,0.7)" stroke="none"/>
  <text x="460" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Phosphorylation</text>
</svg>