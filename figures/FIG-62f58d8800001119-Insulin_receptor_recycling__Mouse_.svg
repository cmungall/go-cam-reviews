<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <rect x="50" y="100" width="700" height="400" rx="20" ry="20" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <path d="M50,140 H750" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Plasma membrane -->
  <rect x="50" y="100" width="700" height="40" rx="5" ry="5" fill="#c4d8ff" stroke="#6c757d" stroke-width="2"/>
  <text x="120" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Plasma Membrane</text>
  
  <!-- Step 1 label -->
  <circle cx="90" cy="95" r="12" fill="#e63946" stroke="#333" stroke-width="1"/>
  <text x="90" y="99" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">1</text>
  
  <!-- Early Endosome -->
  <ellipse cx="250" cy="240" rx="70" ry="50" fill="#b3e0ff" stroke="#5b9bd5" stroke-width="2"/>
  <text x="250" y="235" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Early</text>
  <text x="250" y="255" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Endosome</text>
  
  <!-- Step 2 label -->
  <circle cx="200" cy="200" r="12" fill="#e63946" stroke="#333" stroke-width="1"/>
  <text x="200" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">2</text>
  
  <!-- Late Endosome -->
  <ellipse cx="500" cy="300" rx="80" ry="60" fill="#a3c2f4" stroke="#4472c4" stroke-width="2"/>
  <text x="500" y="295" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Late</text>
  <text x="500" y="315" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Endosome</text>
  
  <!-- Step 3 label -->
  <circle cx="400" cy="270" r="12" fill="#0077b6" stroke="#333" stroke-width="1"/>
  <text x="400" y="274" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">3</text>
  
  <!-- Recycling Endosome -->
  <ellipse cx="250" cy="400" rx="70" ry="50" fill="#d4e5ff" stroke="#5b9bd5" stroke-width="2"/>
  <text x="250" y="395" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Recycling</text>
  <text x="250" y="415" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Endosome</text>
  
  <!-- Step 4 label -->
  <circle cx="350" cy="350" r="12" fill="#2a9d8f" stroke="#333" stroke-width="1"/>
  <text x="350" y="354" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">4</text>
  
  <!-- Step 5 label -->
  <circle cx="180" cy="320" r="12" fill="#2a9d8f" stroke="#333" stroke-width="1"/>
  <text x="180" y="324" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">5</text>
  
  <!-- Insulin and Insulin Receptor -->
  <circle cx="150" cy="85" r="12" fill="#ff8080" stroke="#cc0000" stroke-width="1.5"/>
  <text x="150" y="70" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Insulin</text>
  
  <rect x="130" y="100" width="40" height="40" fill="#ffe699" stroke="#d6b656" stroke-width="1.5"/>
  <text x="150" y="125" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">INSR</text>
  
  <!-- SORL1 -->
  <rect x="200" y="100" width="40" height="40" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="220" y="125" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">SORL1</text>
  
  <!-- V-ATPase complex in endosomes -->
  <g transform="translate(500,300)">
    <!-- V1 domain -->
    <circle cx="0" cy="-30" r="20" fill="#ffcc99" stroke="#d79b00" stroke-width="1.5"/>
    <text x="0" y="-27" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">V1</text>
    
    <!-- V0 domain -->
    <rect x="-20" y="-10" width="40" height="15" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
    <text x="0" y="2" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">V0</text>
    
    <text x="40" y="-20" font-family="Arial" font-size="14" font-weight="bold" fill="#333">V-ATPase</text>
  </g>
  
  <!-- ATP6AP1 -->
  <rect x="600" y="270" width="60" height="25" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="630" y="287" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">ATP6AP1</text>
  
  <!-- IDE -->
  <polygon points="230,220 250,200 270,220 250,240" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="250" y="180" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">IDE</text>
  
  <!-- CTSD -->
  <polygon points="480,280 500,260 520,280 500,300" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="500" y="245" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">CTSD</text>
  
  <!-- PTPN1 -->
  <rect x="200" y="370" width="50" height="25" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="225" y="387" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">PTPN1</text>
  
  <!-- PTPN2 -->
  <rect x="270" y="370" width="50" height="25" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="295" y="387" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">PTPN2</text>
  
  <!-- Pathway arrows with color coding -->
  <!-- Insulin binding and internalization - Red pathway -->
  <path d="M150,85 L150,100" stroke="#e63946" stroke-width="1.2" marker-end="url(#redArrow)"/>
  <path d="M170,120 C200,120 210,180 230,220" stroke="#e63946" stroke-width="1.2" marker-end="url(#redArrow)"/>
  
  <!-- SORL1 interaction - Purple pathway -->
  <path d="M200,120 L170,120" stroke="#6a0dad" stroke-width="1.2" marker-end="url(#purpleArrow)"/>
  
  <!-- Endosome progression - Blue pathway -->
  <path d="M320,240 C380,260 420,270 480,280" stroke="#0077b6" stroke-width="1.2" marker-end="url(#blueArrow)"/>
  
  <!-- Recycling pathway - Green pathway -->
  <path d="M420,300 C350,350 320,380 250,400" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#greenArrow)"/>
  <path d="M180,400 C150,350 130,200 150,140" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#greenArrow)" stroke-dasharray="5,3"/>
  
  <!-- V-ATPase activation - Orange pathway -->
  <path d="M600,280 C570,270 550,270 520,280" stroke="#ff9f1c" stroke-width="1.2" marker-end="url(#orangeArrow)"/>
  
  <!-- PTPNs dephosphorylating insulin receptor - Yellow pathway -->
  <path d="M200,370 C180,300 170,200 150,140" stroke="#ffbf00" stroke-width="1.2" marker-end="url(#yellowArrow)" stroke-dasharray="5,3"/>
  <path d="M270,370 C260,330 210,200 150,140" stroke="#ffbf00" stroke-width="1.2" marker-end="url(#yellowArrow)" stroke-dasharray="5,3"/>
  
  <!-- Markers with colors -->
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e63946"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6a0dad"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0077b6"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2a9d8f"/>
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9f1c"/>
    </marker>
    <marker id="yellowArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffbf00"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Insulin Receptor Recycling Pathway (Mouse)</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="700" height="60" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/>
  <text x="70" y="540" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Legend:</text>
  
  <!-- Legend items for proteins -->
  <circle cx="120" y="560" r="8" fill="#ff8080" stroke="#cc0000" stroke-width="1"/>
  <text x="135" y="564" font-family="Arial" font-size="12" fill="#333">Insulin</text>
  
  <rect x="190" y="552" width="16" height="16" fill="#ffe699" stroke="#d6b656" stroke-width="1"/>
  <text x="215" y="564" font-family="Arial" font-size="12" fill="#333">INSR</text>
  
  <rect x="250" y="552" width="16" height="16" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
  <text x="275" y="564" font-family="Arial" font-size="12" fill="#333">SORL1</text>
  
  <polygon points="310,552 318,560 310,568 302,560" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="330" y="564" font-family="Arial" font-size="12" fill="#333">IDE</text>
  
  <polygon points="365,552 373,560 365,568 357,560" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="385" y="564" font-family="Arial" font-size="12" fill="#333">CTSD</text>
  
  <rect x="420" y="552" width="16" height="16" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="445" y="564" font-family="Arial" font-size="12" fill="#333">PTPNs</text>
  
  <g transform="translate(490, 560) scale(0.5)">
    <circle cx="0" cy="-10" r="16" fill="#ffcc99" stroke="#d79b00" stroke-width="1.5"/>
    <rect x="-16" y="0" width="32" height="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  </g>
  <text x="510" y="564" font-family="Arial" font-size="12" fill="#333">V-ATPase</text>
  
  <rect x="555" y="552" width="16" height="16" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="585" y="564" font-family="Arial" font-size="12" fill="#333">ATP6AP1</text>
  
  <!-- Legend items for pathways -->
  <line x1="630" y1="560" x2="645" y2="560" stroke="#e63946" stroke-width="1.2"/>
  <text x="660" y="564" font-family="Arial" font-size="12" fill="#333">Internalization</text>
  
  <line x1="630" y1="545" x2="645" y2="545" stroke="#2a9d8f" stroke-width="1.2"/>
  <text x="660" y="549" font-family="Arial" font-size="12" fill="#333">Recycling</text>
  
  <line x1="630" y1="530" x2="645" y2="530" stroke="#ffbf00" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="660" y="534" font-family="Arial" font-size="12" fill="#333">Dephosphorylation</text>
</svg>