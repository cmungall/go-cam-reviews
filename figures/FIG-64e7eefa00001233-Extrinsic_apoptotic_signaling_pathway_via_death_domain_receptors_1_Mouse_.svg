<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell components -->
  <rect x="0" y="0" width="800" height="650" fill="#f8f9fa" />
  
  <!-- Extracellular space -->
  <rect x="0" y="0" width="800" height="150" fill="#e6f7ff" opacity="0.5" />
  <text x="20" y="30" font-family="Arial" font-size="14" fill="#333">Extracellular Space</text>
  
  <!-- Plasma membrane -->
  <rect x="0" y="150" width="800" height="50" fill="#ffd591" opacity="0.7" />
  <text x="20" y="180" font-family="Arial" font-size="14" fill="#333">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytosol -->
  <rect x="0" y="200" width="800" height="400" fill="#f6ffed" opacity="0.5" />
  <text x="20" y="230" font-family="Arial" font-size="14" fill="#333">Cytosol (GO:0005829)</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Extrinsic Apoptotic Signaling Pathway via Death Domain Receptors
  </text>
  <text x="400" y="60" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">
    Mouse (Mus musculus) - GO-CAM Model: 64e7eefa00001233
  </text>
  
  <!-- TNF ligand -->
  <circle cx="200" cy="100" r="30" fill="#ff6b6b" stroke="#333" stroke-width="2" />
  <text x="200" y="100" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="white" font-weight="bold">TNF</text>
  <text x="200" y="75" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Tnf</text>
  <text x="200" y="125" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Receptor Ligand</text>
  
  <!-- TNF Receptor -->
  <rect x="180" y="150" width="40" height="50" rx="5" ry="5" fill="#ffa64d" stroke="#333" stroke-width="2" />
  <text x="200" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">TNFR1</text>
  <text x="200" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Tnfrsf1a</text>
  <text x="200" y="195" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">TNF receptor</text>
  
  <!-- Binding arrow from TNF to receptor -->
  <line x1="200" y1="130" x2="200" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- TRADD protein -->
  <rect x="200" y="250" width="60" height="30" rx="5" ry="5" fill="#82c91e" stroke="#333" stroke-width="2" />
  <text x="230" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">TRADD</text>
  <text x="230" y="240" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Tradd</text>
  <text x="230" y="290" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">Signaling adaptor</text>
  
  <!-- Binding arrow from receptor to TRADD -->
  <line x1="200" y1="200" x2="230" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- RIPK1 protein -->
  <rect x="300" y="250" width="60" height="30" rx="5" ry="5" fill="#63b3ed" stroke="#333" stroke-width="2" />
  <text x="330" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">RIPK1</text>
  <text x="330" y="240" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Ripk1</text>
  <text x="330" y="290" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">Protein Kinase</text>
  
  <!-- TRADD to RIPK1 -->
  <line x1="260" y1="265" x2="300" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- FADD protein -->
  <rect x="400" y="250" width="60" height="30" rx="5" ry="5" fill="#9f7aea" stroke="#333" stroke-width="2" />
  <text x="430" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">FADD</text>
  <text x="430" y="240" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Fadd</text>
  <text x="430" y="290" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">Signaling adaptor</text>
  
  <!-- RIPK1 to FADD -->
  <line x1="360" y1="265" x2="400" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- TRADD to FADD (direct path also shown) -->
  <path d="M 260 265 Q 330 220 400 265" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Caspase-8 -->
  <rect x="400" y="330" width="60" height="30" rx="5" ry="5" fill="#e53e3e" stroke="#333" stroke-width="2" />
  <text x="430" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Casp8</text>
  <text x="430" y="370" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">Cysteine-type endopeptidase activator</text>
  
  <!-- FADD to Caspase-8 -->
  <line x1="430" y1="280" x2="430" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Execution phase of apoptosis -->
  <rect x="350" y="450" width="160" height="50" rx="10" ry="10" fill="#805ad5" stroke="#333" stroke-width="2" />
  <text x="430" y="470" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Execution Phase</text>
  <text x="430" y="490" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">of Apoptosis</text>
  
  <!-- Caspase-8 to Apoptosis -->
  <line x1="430" y1="360" x2="430" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Process label -->
  <text x="580" y="430" font-family="Arial" font-size="14" font-style="italic" fill="#333">GO:1900119</text>
  <text x="580" y="450" font-family="Arial" font-size="12" font-style="italic" fill="#333">Positive regulation of execution</text>
  <text x="580" y="465" font-family="Arial" font-size="12" font-style="italic" fill="#333">phase of apoptosis</text>
  
  <!-- Pathway summary box -->
  <rect x="50" y="400" width="260" height="120" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1" fill-opacity="0.9" />
  <text x="55" y="420" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Pathway Summary:</text>
  <text x="55" y="440" font-family="Arial" font-size="10" fill="#333">1. TNF binds to TNFR1 on plasma membrane</text>
  <text x="55" y="455" font-family="Arial" font-size="10" fill="#333">2. TNFR1 recruits TRADD adaptor protein</text>
  <text x="55" y="470" font-family="Arial" font-size="10" fill="#333">3. TRADD recruits RIPK1 and FADD</text>
  <text x="55" y="485" font-family="Arial" font-size="10" fill="#333">4. FADD activates Caspase-8</text>
  <text x="55" y="500" font-family="Arial" font-size="10" fill="#333">5. Caspase-8 triggers apoptosis execution</text>
  
  <!-- Legend -->
  <rect x="50" y="530" width="700" height="100" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1" />
  <text x="60" y="550" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend:</text>
  
  <!-- Legend items -->
  <circle cx="80" cy="570" r="10" fill="#ff6b6b" stroke="#333" stroke-width="1" />
  <text x="100" y="575" font-family="Arial" font-size="12" fill="#333">Ligand (Receptor ligand activity - GO:0048018)</text>
  
  <rect x="80" y="590" width="20" height="20" rx="3" ry="3" fill="#ffa64d" stroke="#333" stroke-width="1" />
  <text x="110" y="605" font-family="Arial" font-size="12" fill="#333">Receptor (TNF receptor activity - GO:0005031)</text>
  
  <rect x="300" y="570" width="20" height="20" rx="3" ry="3" fill="#82c91e" stroke="#333" stroke-width="1" />
  <text x="330" y="585" font-family="Arial" font-size="12" fill="#333">Adaptor protein (Signaling adaptor activity - GO:0035591)</text>
  
  <rect x="300" y="600" width="20" height="20" rx="3" ry="3" fill="#63b3ed" stroke="#333" stroke-width="1" />
  <text x="330" y="615" font-family="Arial" font-size="12" fill="#333">Kinase (Protein kinase activity - GO:0004672)</text>
  
  <rect x="500" y="570" width="20" height="20" rx="3" ry="3" fill="#e53e3e" stroke="#333" stroke-width="1" />
  <text x="530" y="585" font-family="Arial" font-size="12" fill="#333">Caspase (Cysteine-type endopeptidase activator - GO:0008656)</text>
  
  <rect x="500" y="600" width="40" height="20" rx="5" ry="5" fill="#805ad5" stroke="#333" stroke-width="1" />
  <text x="550" y="615" font-family="Arial" font-size="12" fill="#333">Cellular process (Execution phase of apoptosis)</text>
  
  <line x1="600" y1="590" x2="630" y2="590" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="640" y="595" font-family="Arial" font-size="12" fill="#333">Activation/Causality</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>