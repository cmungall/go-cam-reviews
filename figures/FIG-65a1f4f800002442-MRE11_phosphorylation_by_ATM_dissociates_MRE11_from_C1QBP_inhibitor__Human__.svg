<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Nuclear region -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f0f0ff" stroke="#aaaaaa" stroke-width="2" opacity="0.6"/>
  <text x="400" y="90" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#666666">Nucleus</text>
  
  <!-- DNA double strand break site -->
  <rect x="150" y="200" width="500" height="120" rx="5" ry="5" fill="#e6f7ff" stroke="#0066cc" stroke-width="2" opacity="0.7"/>
  <text x="400" y="180" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#0066cc">Site of Double-Strand Break (GO:0035861)</text>
  
  <!-- DNA strands with break -->
  <path d="M200,250 L350,250 M450,250 L600,250" stroke="#333333" stroke-width="6"/>
  <path d="M200,270 L340,270 M460,270 L600,270" stroke="#333333" stroke-width="6"/>
  <text x="400" y="300" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">DNA Double-Strand Break</text>
  
  <!-- Protein interactions -->
  <!-- 1. ATM kinase -->
  <circle cx="250" cy="150" r="35" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="250" y="155" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">ATM</text>
  
  <!-- 2. C1QBP inhibiting MRE11 -->
  <circle cx="150" cy="380" r="30" fill="#99cc99" stroke="#006600" stroke-width="2"/>
  <text x="150" y="385" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">C1QBP</text>
  
  <!-- 3. MRE11 bound to C1QBP -->
  <circle cx="220" cy="380" r="30" fill="#9999ff" stroke="#0000cc" stroke-width="2"/>
  <text x="220" y="385" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">MRE11</text>
  
  <!-- Inhibition line from C1QBP to MRE11 -->
  <line x1="180" y1="380" x2="190" y2="380" stroke="#ff0000" stroke-width="3"/>
  <text x="185" y="360" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff0000">Inhibits</text>
  
  <!-- 4. ATM phosphorylating MRE11 -->
  <path d="M250,185 Q235,265 220,350" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
  <text x="235" y="260" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#cc0000">Phosphorylates</text>
  
  <!-- 5. MRE11 after phosphorylation -->
  <circle cx="400" cy="380" r="30" fill="#9999ff" stroke="#0000cc" stroke-width="2"/>
  <text x="400" y="385" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">MRE11</text>
  <circle cx="420" cy="360" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="420" y="364" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">P</text>
  
  <!-- 6. Arrow showing dissociation -->
  <path d="M250,380 Q325,380 370,380" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="360" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Dissociation</text>
  
  <!-- 7. MRE11 active at break site -->
  <circle cx="400" cy="260" r="30" fill="#9999ff" stroke="#0000cc" stroke-width="2"/>
  <text x="400" y="265" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">MRE11</text>
  <circle cx="420" cy="240" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="420" y="244" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">P</text>
  
  <!-- 8. MRE11 activities -->
  <rect x="510" y="215" width="130" height="85" fill="white" stroke="#0000cc" stroke-width="1" rx="5" ry="5" opacity="0.8"/>
  <text x="540" y="235" font-family="Arial" font-size="15" font-weight="bold" fill="#0000cc">MRE11 Activities:</text>
  <text x="540" y="255" font-family="Arial" font-size="14" fill="#000000">• 3'-5' Exonuclease</text>
  <text x="540" y="275" font-family="Arial" font-size="14" fill="#000000">• Endonuclease</text>
  <text x="540" y="295" font-family="Arial" font-size="14" fill="#000000">• HR Repair</text>
  
  <!-- 9. Arrow showing activity location -->
  <path d="M400,350 Q400,320 400,290" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Process label -->
  <text x="400" y="460" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold" fill="#333333">MRE11 phosphorylation by ATM dissociates MRE11 from C1QBP inhibitor</text>
  <text x="400" y="490" font-family="Arial" font-size="18" text-anchor="middle" fill="#333333">Enabling homologous recombination repair</text>
  
  <!-- Legend -->
  <rect x="580" y="380" width="160" height="130" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="590" y="400" font-family="Arial" font-size="16" font-weight="bold" fill="#000000">Legend</text>
  
  <circle cx="600" y="420" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="620" y="425" font-family="Arial" font-size="14" fill="#000000">ATM kinase</text>
  
  <circle cx="600" y="450" r="10" fill="#99cc99" stroke="#006600" stroke-width="1"/>
  <text x="620" y="455" font-family="Arial" font-size="14" fill="#000000">C1QBP inhibitor</text>
  
  <circle cx="600" y="480" r="10" fill="#9999ff" stroke="#0000cc" stroke-width="1"/>
  <text x="620" y="485" font-family="Arial" font-size="14" fill="#000000">MRE11</text>
  
  <circle cx="690" y="480" r="5" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="700" y="485" font-family="Arial" font-size="14" fill="#000000">P</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cc0000"/>
    </marker>
  </defs>
</svg>