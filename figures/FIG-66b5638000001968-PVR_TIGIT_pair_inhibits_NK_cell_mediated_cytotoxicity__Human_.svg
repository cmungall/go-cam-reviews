<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">PVR-TIGIT Interaction Inhibits NK Cell-Mediated Cytotoxicity</text>
  
  <!-- Target Cell -->
  <ellipse cx="250" cy="250" rx="150" ry="120" fill="#f8f8f8" stroke="#333333" stroke-width="2" />
  <text x="250" y="190" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Target Cell</text>
  
  <!-- NK Cell -->
  <ellipse cx="550" cy="250" rx="150" ry="120" fill="#e6f2ff" stroke="#333333" stroke-width="2" />
  <text x="550" y="190" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">NK Cell</text>
  
  <!-- Cell Membranes -->
  <path d="M100,250 Q250,130 400,250" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,3" />
  <path d="M400,250 Q550,130 700,250" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,3" />
  <path d="M100,250 Q250,370 400,250" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,3" />
  <path d="M400,250 Q550,370 700,250" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,3" />
  
  <!-- PVR on Target Cell Membrane -->
  <rect x="340" y="230" width="60" height="40" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="370" y="255" font-family="Arial" font-size="14" text-anchor="middle">PVR</text>
  <text x="370" y="270" font-family="Arial" font-size="10" text-anchor="middle">P15151</text>
  
  <!-- TIGIT on NK Cell Membrane -->
  <rect x="400" y="230" width="60" height="40" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
  <text x="430" y="255" font-family="Arial" font-size="14" text-anchor="middle">TIGIT</text>
  <text x="430" y="270" font-family="Arial" font-size="10" text-anchor="middle">Q495A1</text>
  
  <!-- Binding Interaction -->
  <line x1="370" y1="250" x2="430" y2="250" stroke="#000000" stroke-width="2" />
  <circle cx="400" cy="250" r="5" fill="#ffcc00" />
  
  <!-- Signaling Cascade -->
  <!-- GRB2 -->
  <rect x="480" y="300" width="60" height="40" rx="5" ry="5" fill="#ccffcc" stroke="#009900" stroke-width="2" />
  <text x="510" y="325" font-family="Arial" font-size="14" text-anchor="middle">GRB2</text>
  <text x="510" y="340" font-family="Arial" font-size="10" text-anchor="middle">P62993</text>
  
  <!-- Arrow from TIGIT to GRB2 -->
  <line x1="430" y1="270" x2="480" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- INPP5D (SHIP1) -->
  <rect x="550" y="350" width="60" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#cc6600" stroke-width="2" />
  <text x="580" y="375" font-family="Arial" font-size="14" text-anchor="middle">INPP5D</text>
  <text x="580" y="390" font-family="Arial" font-size="10" text-anchor="middle">Q92835</text>
  
  <!-- Arrow from GRB2 to INPP5D -->
  <line x1="540" y1="320" x2="570" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- PIK3CB -->
  <rect x="620" y="280" width="60" height="40" rx="5" ry="5" fill="#cc99ff" stroke="#6600cc" stroke-width="2" />
  <text x="650" y="305" font-family="Arial" font-size="14" text-anchor="middle">PIK3CB</text>
  <text x="650" y="320" font-family="Arial" font-size="10" text-anchor="middle">P42338</text>
  
  <!-- Inhibitory Arrow from INPP5D to PIK3CB -->
  <line x1="590" y1="350" x2="630" y2="320" stroke="#ff0000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="585" y1="345" x2="625" y2="315" stroke="#ffffff" stroke-width="2" />
  <line x1="595" y1="355" x2="635" y2="325" stroke="#ffffff" stroke-width="2" />
  
  <!-- Cytotoxicity Function Box -->
  <rect x="600" y="200" width="100" height="50" rx="10" ry="10" fill="#eeeeee" stroke="#666666" stroke-width="2" stroke-dasharray="5,3" />
  <text x="650" y="225" font-family="Arial" font-size="12" text-anchor="middle">NK Cell-Mediated</text>
  <text x="650" y="240" font-family="Arial" font-size="12" text-anchor="middle">Cytotoxicity</text>
  
  <!-- Arrow from PIK3CB to Cytotoxicity -->
  <line x1="650" y1="280" x2="650" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Process Outcome -->
  <rect x="400" y="450" width="200" height="60" rx="10" ry="10" fill="#ffeeee" stroke="#990000" stroke-width="2" />
  <text x="500" y="480" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Negative Regulation of</text>
  <text x="500" y="500" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">NK Cell Cytotoxicity</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Compartment Labels -->
  <text x="150" y="250" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Plasma Membrane</text>
  <text x="550" y="250" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Plasma Membrane</text>
  <text x="550" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Cytoplasm</text>
  
  <!-- Connection to Overall Process -->
  <path d="M650,250 Q600,400 500,450" fill="none" stroke="#990000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  
  <!-- Legend -->
  <rect x="50" y="520" width="700" height="100" rx="10" ry="10" fill="#f9f9f9" stroke="#666666" stroke-width="2" />
  <text x="400" y="540" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">LEGEND</text>
  
  <!-- Protein Color Coding -->
  <rect x="80" y="555" width="20" height="20" fill="#ff9999" stroke="#cc0000" stroke-width="1" />
  <text x="110" y="570" font-family="Arial" font-size="14" text-anchor="start">PVR (Target Cell Receptor Ligand)</text>
  
  <rect x="80" y="585" width="20" height="20" fill="#99ccff" stroke="#0066cc" stroke-width="1" />
  <text x="110" y="600" font-family="Arial" font-size="14" text-anchor="start">TIGIT (NK Cell Signaling Receptor)</text>
  
  <rect x="320" y="555" width="20" height="20" fill="#ccffcc" stroke="#009900" stroke-width="1" />
  <text x="350" y="570" font-family="Arial" font-size="14" text-anchor="start">GRB2 (Adaptor Protein)</text>
  
  <rect x="320" y="585" width="20" height="20" fill="#ffcc99" stroke="#cc6600" stroke-width="1" />
  <text x="350" y="600" font-family="Arial" font-size="14" text-anchor="start">INPP5D (Phosphatase)</text>
  
  <rect x="560" y="555" width="20" height="20" fill="#cc99ff" stroke="#6600cc" stroke-width="1" />
  <text x="590" y="570" font-family="Arial" font-size="14" text-anchor="start">PIK3CB (Kinase)</text>
  
  <!-- Interaction Types -->
  <line x1="560" y1="595" x2="580" y2="595" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="590" y="600" font-family="Arial" font-size="14" text-anchor="start">Activation</text>
  
  <line x1="660" y1="595" x2="680" y2="595" stroke="#ff0000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="690" y="600" font-family="Arial" font-size="14" text-anchor="start">Inhibition</text>
</svg>