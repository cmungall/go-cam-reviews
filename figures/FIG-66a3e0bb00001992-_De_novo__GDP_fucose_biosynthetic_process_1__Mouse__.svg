<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  
  <!-- Cell compartments -->
  <!-- Cytosol -->
  <rect x="70" y="70" width="660" height="350" rx="20" ry="20" fill="#e6f7ff" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="100" y="100" font-family="Arial" font-size="18" font-weight="bold" fill="#444">Cytosol (GO:0005829)</text>
  
  <!-- Golgi apparatus -->
  <path d="M100,450 C150,430 250,470 300,450 C350,430 450,470 500,450 C550,430 650,470 700,450" 
        fill="#fff0cc" stroke="#999" stroke-width="2"/>
  <path d="M100,480 C150,460 250,500 300,480 C350,460 450,500 500,480 C550,460 650,500 700,480" 
        fill="#ffe6b3" stroke="#999" stroke-width="2"/>
  <path d="M100,510 C150,490 250,530 300,510 C350,490 450,530 500,510 C550,490 650,530 700,510" 
        fill="#ffd980" stroke="#999" stroke-width="2"/>
  <text x="340" y="520" font-family="Arial" font-size="18" font-weight="bold" fill="#444">Golgi Apparatus</text>
  
  <!-- Molecules and reactions -->
  <!-- Step 1: GDP-mannose to GDP-4-dehydro-6-deoxy-alpha-D-mannose -->
  <rect x="120" y="200" width="110" height="60" rx="10" ry="10" fill="#c6eaff" stroke="#666" stroke-width="1.5"/>
  <text x="175" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">GDP-mannose</text>
  <text x="175" y="235" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(CHEBI:57527)</text>
  
  <rect x="150" y="150" width="60" height="30" rx="15" ry="15" fill="#ffcccc" stroke="#ff6666" stroke-width="1.5"/>
  <text x="180" y="170" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">Gmds</text>
  
  <line x1="175" y1="180" x2="175" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="310" y="200" width="180" height="60" rx="10" ry="10" fill="#c6eaff" stroke="#666" stroke-width="1.5"/>
  <text x="400" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">GDP-4-dehydro-6-deoxy-</text>
  <text x="400" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">alpha-D-mannose</text>
  <text x="400" y="260" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(CHEBI:57964)</text>
  
  <line x1="230" y1="230" x2="310" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="240" y="180" width="50" height="25" rx="5" ry="5" fill="#e6ffe6" stroke="#666" stroke-width="1.5"/>
  <text x="265" y="197" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">H₂O</text>
  
  <!-- Step 2: GDP-4-dehydro-6-deoxy-alpha-D-mannose to GDP-fucose -->
  <rect x="500" y="150" width="60" height="30" rx="15" ry="15" fill="#ffcccc" stroke="#ff6666" stroke-width="1.5"/>
  <text x="530" y="170" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">Gfus</text>
  
  <line x1="490" y1="230" x2="530" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="570" y="200" width="110" height="60" rx="10" ry="10" fill="#c6eaff" stroke="#666" stroke-width="1.5"/>
  <text x="625" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">GDP-fucose</text>
  <text x="625" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(CHEBI:57273)</text>
  
  <line x1="530" y1="180" x2="570" y2="220" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="450" y="130" width="60" height="25" rx="5" ry="5" fill="#e6ffe6" stroke="#666" stroke-width="1.5"/>
  <text x="480" y="147" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">H⁺</text>
  <text x="480" y="162" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(hydron)</text>
  
  <rect x="530" y="100" width="70" height="25" rx="5" ry="5" fill="#e6ffe6" stroke="#666" stroke-width="1.5"/>
  <text x="565" y="117" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">NADPH</text>
  
  <rect x="600" y="130" width="70" height="25" rx="5" ry="5" fill="#e6ffe6" stroke="#666" stroke-width="1.5"/>
  <text x="635" y="147" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">NADP⁺</text>
  
  <line x1="480" y1="155" x2="500" y2="165" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="565" y1="125" x2="530" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="142" x2="560" y2="160" stroke="#666" stroke-width="2" marker-start="url(#arrowhead)"/>
  
  <!-- Step 3: Transport to Golgi -->
  <line x1="625" y1="260" x2="625" y2="370" stroke="#666" stroke-width="2.5" stroke-dasharray="5,3"/>
  
  <rect x="595" y="370" width="60" height="30" rx="15" ry="15" fill="#ffcccc" stroke="#ff6666" stroke-width="1.5"/>
  <text x="625" y="390" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">Slc35c1</text>
  
  <line x1="625" y1="400" x2="625" y2="440" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="570" y="440" width="110" height="40" rx="10" ry="10" fill="#c6eaff" stroke="#666" stroke-width="1.5"/>
  <text x="625" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">GDP-fucose</text>
  <text x="625" y="480" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(in Golgi lumen)</text>
  
  <!-- Process title -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">
    'De novo' GDP-fucose Biosynthetic Process (Mouse)
  </text>
  
  <!-- Reaction descriptions -->
  <text x="170" y="280" font-family="Arial" font-size="12" fill="#444">GDP-mannose 4,6-dehydratase activity</text>
  <text x="450" y="280" font-family="Arial" font-size="12" fill="#444">GDP-L-fucose synthase activity</text>
  <text x="580" y="410" font-family="Arial" font-size="12" fill="#444" text-anchor="end">GDP-fucose</text>
  <text x="580" y="425" font-family="Arial" font-size="12" fill="#444" text-anchor="end">transmembrane</text>
  <text x="580" y="440" font-family="Arial" font-size="12" fill="#444" text-anchor="end">transporter</text>
  
  <!-- Legend -->
  <rect x="50" y="550" width="700" height="35" fill="#ffffff" stroke="#666" stroke-width="1"/>
  <text x="55" y="570" font-family="Arial" font-size="14" fill="#000">
    Mouse genes: Gmds (MGI:1891112), Gfus (MGI:98857), Slc35c1 (MGI:2443301)
  </text>
  <rect x="400" y="560" width="20" height="15" fill="#ffcccc" stroke="#ff6666" stroke-width="1"/>
  <text x="425" y="570" font-family="Arial" font-size="14" fill="#000">Enzymes</text>
  <rect x="490" y="560" width="20" height="15" fill="#c6eaff" stroke="#666" stroke-width="1"/>
  <text x="515" y="570" font-family="Arial" font-size="14" fill="#000">Metabolites</text>
  <rect x="580" y="560" width="20" height="15" fill="#e6ffe6" stroke="#666" stroke-width="1"/>
  <text x="605" y="570" font-family="Arial" font-size="14" fill="#000">Cofactors</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>