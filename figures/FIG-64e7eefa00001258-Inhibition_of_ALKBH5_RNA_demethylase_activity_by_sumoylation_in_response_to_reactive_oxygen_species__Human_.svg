<svg width="800" height="680" xmlns="http://www.w3.org/2000/svg">
  <!-- Background representing cellular environment -->
  <rect x="0" y="0" width="800" height="680" fill="#f9f9f9" stroke="#cccccc" stroke-width="2"/>
  
  <!-- Cell Membrane -->
  <path d="M 50,50 H 750 V 550 H 50 Z" fill="#ffffff" stroke="#888888" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="60" y="70" font-family="Arial" font-size="16" fill="#333333">Cytoplasm</text>
  
  <!-- Nuclear outline -->
  <ellipse cx="400" cy="350" rx="250" ry="150" fill="#f0f0ff" stroke="#6666aa" stroke-width="2"/>
  <text x="400" y="200" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">Nucleus</text>
  
  <!-- Nuclear Speck -->
  <ellipse cx="400" cy="380" rx="100" ry="60" fill="#e6e6fa" stroke="#6666aa" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="400" y="380" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">Nuclear Speck</text>
  
  <!-- ROS starburst -->
  <g transform="translate(150, 120)">
    <path d="M 0,0 L 15,15 M 0,0 L -15,15 M 0,0 L 15,-15 M 0,0 L -15,-15 M 0,0 L 0,20 M 0,0 L 0,-20 M 0,0 L 20,0 M 0,0 L -20,0" stroke="#ff6666" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="15" fill="#ff6666" fill-opacity="0.3"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">ROS</text>
  </g>
  
  <!-- MAPK8 -->
  <g transform="translate(250, 150)">
    <rect x="-40" y="-20" width="80" height="40" rx="10" ry="10" fill="#aed6f1" stroke="#3498db" stroke-width="2.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">MAPK8</text>
  </g>
  
  <!-- MAPK9 -->
  <g transform="translate(350, 150)">
    <rect x="-40" y="-20" width="80" height="40" rx="10" ry="10" fill="#aed6f1" stroke="#3498db" stroke-width="2.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">MAPK9</text>
  </g>
  
  <!-- PIAS4 -->
  <g transform="translate(300, 250)">
    <rect x="-40" y="-20" width="80" height="40" rx="10" ry="10" fill="#d5f5e3" stroke="#2ecc71" stroke-width="2.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">PIAS4</text>
  </g>
  
  <!-- SENP1 -->
  <g transform="translate(550, 300)">
    <rect x="-40" y="-20" width="80" height="40" rx="10" ry="10" fill="#fadbd8" stroke="#e74c3c" stroke-width="2.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">SENP1</text>
  </g>
  
  <!-- ALKBH5 -->
  <g transform="translate(400, 380)">
    <rect x="-50" y="-25" width="100" height="50" rx="10" ry="10" fill="#ebdef0" stroke="#8e44ad" stroke-width="2.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">ALKBH5</text>
  </g>
  
  <!-- mRNA -->
  <g transform="translate(400, 480)">
    <path d="M -60,0 C -40,15 -20,-15 0,0 C 20,15 40,-15 60,0" fill="none" stroke="#f39c12" stroke-width="2.5"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">mRNA Destabilization</text>
  </g>
  
  <!-- Arrows and connections -->
  <!-- ROS to MAPK8 -->
  <path d="M 165,135 L 200,150" stroke="#444444" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="180" y="135" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Activates</text>
  
  <!-- ROS to MAPK9 -->
  <path d="M 165,135 L 300,150" stroke="#444444" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="240" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Activates</text>
  
  <!-- MAPK8 to PIAS4 -->
  <path d="M 250,170 L 280,230" stroke="#444444" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="240" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Phosphorylates</text>
  
  <!-- MAPK9 to PIAS4 -->
  <path d="M 350,170 L 320,230" stroke="#444444" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="350" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Phosphorylates</text>
  
  <!-- PIAS4 to ALKBH5 (inhibition) -->
  <path d="M 320,270 C 340,320 360,350 380,365" stroke="#444444" stroke-width="2.5" marker-end="url(#inhibition)"/>
  <text x="320" y="320" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Sumoylates</text>
  <text x="320" y="335" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">(Inhibits)</text>
  
  <!-- SENP1 to ALKBH5 (activation) -->
  <path d="M 530,320 C 490,340 450,350 430,365" stroke="#444444" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="480" y="330" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Desumoylates</text>
  <text x="480" y="345" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">(Activates)</text>
  
  <!-- ALKBH5 to mRNA -->
  <path d="M 400,405 L 400,460" stroke="#444444" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="420" y="435" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Demethylates</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444444"/>
    </marker>
    <marker id="inhibition" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#444444" stroke-width="2.5"/>
      <line x1="0" y1="10" x2="10" y2="0" stroke="#444444" stroke-width="2.5"/>
    </marker>
  </defs>
  
  <!-- SUMO tags (to show SUMO modification) -->
  <g transform="translate(370, 335)">
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#fdebd0" stroke="#f39c12" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333333">SUMO</text>
  </g>
  
  <!-- Process labels -->
  <text x="170" y="80" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Cellular Response to ROS</text>
  <text x="450" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Protein Sumoylation</text>
  <text x="520" y="480" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">mRNA Stability Regulation</text>
  
  <!-- Compartment note -->
  <text x="625" y="190" font-family="Arial" font-size="14" font-style="italic" fill="#333333">Note: ALKBH5 functions primarily</text>
  <text x="625" y="210" font-family="Arial" font-size="14" font-style="italic" fill="#333333">in nuclear speck compartments</text>
  <text x="625" y="230" font-family="Arial" font-size="14" font-style="italic" fill="#333333">to regulate mRNA stability</text>
  
  <!-- Title of the figure -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#333333">Inhibition of ALKBH5 RNA Demethylase Activity by Sumoylation in Response to ROS</text>
  
  <!-- Legend -->
  <rect x="50" y="570" width="700" height="100" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5"/>
  <text x="60" y="590" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">Legend:</text>
  
  <!-- Legend items -->
  <rect x="60" y="600" width="18" height="18" fill="#aed6f1" stroke="#3498db" stroke-width="1.5"/>
  <text x="85" y="614" font-family="Arial" font-size="14" fill="#333333">Kinase (MAPK8/9): Protein serine/threonine kinase activity</text>
  
  <rect x="60" y="625" width="18" height="18" fill="#d5f5e3" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="85" y="639" font-family="Arial" font-size="14" fill="#333333">SUMO Ligase (PIAS4): SUMO ligase activity</text>
  
  <rect x="400" y="600" width="18" height="18" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="425" y="614" font-family="Arial" font-size="14" fill="#333333">SUMO Protease (SENP1): SUMO-specific endopeptidase activity</text>
  
  <rect x="400" y="625" width="18" height="18" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="425" y="639" font-family="Arial" font-size="14" fill="#333333">RNA Demethylase (ALKBH5): mRNA N6-methyladenosine dioxygenase activity</text>
  
  <ellipse cx="60" y="650" rx="15" ry="10" fill="#fdebd0" stroke="#f39c12" stroke-width="1.5"/>
  <text x="85" y="654" font-family="Arial" font-size="14" fill="#333333">SUMO modification (inhibits ALKBH5 activity)</text>
  
  <line x1="400" y1="650" x2="420" y2="650" stroke="#444444" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="430" y="654" font-family="Arial" font-size="14" fill="#333333">Activation</text>
  
  <line x1="530" y1="650" x2="550" y2="650" stroke="#444444" stroke-width="2.5" marker-end="url(#inhibition)"/>
  <text x="560" y="654" font-family="Arial" font-size="14" fill="#333333">Inhibition</text>
</svg>