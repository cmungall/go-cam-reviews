<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">SPModule-PGLYRP1/HSP701A Pathway</text>
  
  <!-- Cell Membrane -->
  <path d="M100,350 L700,350 C700,350 720,380 700,410 L100,410 C80,380 100,350 100,350 Z" fill="#d1e6fa" stroke="#2c3e50" stroke-width="2" />
  <text x="400" y="440" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Cell Surface (GO:0009986)</text>
  
  <!-- Extracellular Space Label -->
  <rect x="250" y="280" width="300" height="25" rx="5" ry="5" fill="#f0f0f0" fill-opacity="0.8" stroke="#2c3e50" stroke-width="1" />
  <text x="400" y="297" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Extracellular Space (GO:0005615)</text>
  
  <!-- HSPA1A Protein (P0DMV8) -->
  <circle cx="200" cy="220" r="40" fill="#ff7e5f" stroke="#2c3e50" stroke-width="2" />
  <text x="200" y="215" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff">HSPA1A</text>
  <text x="200" y="233" font-family="Arial" font-size="11" text-anchor="middle" fill="#fff">(P0DMV8)</text>
  <rect x="145" y="240" width="110" height="20" rx="5" ry="5" fill="#fcfcfc" fill-opacity="0.9" stroke="#333" stroke-width="1" />
  <text x="200" y="254" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">receptor ligand activity</text>
  
  <!-- PGLYRP1 Protein (O75594) -->
  <rect x="350" y="180" width="80" height="50" rx="10" ry="10" fill="#64b5f6" stroke="#2c3e50" stroke-width="2" />
  <text x="390" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PGLYRP1</text>
  <text x="390" y="223" font-family="Arial" font-size="11" text-anchor="middle">(O75594)</text>
  <rect x="335" y="145" width="110" height="20" rx="5" ry="5" fill="#fcfcfc" fill-opacity="0.9" stroke="#333" stroke-width="1" />
  <text x="390" y="159" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Hsp70 protein binding</text>
  
  <!-- HSPBP1 Protein (Q9NZL4) -->
  <rect x="500" y="180" width="80" height="50" rx="10" ry="10" fill="#81c784" stroke="#2c3e50" stroke-width="2" />
  <text x="540" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">HSPBP1</text>
  <text x="540" y="223" font-family="Arial" font-size="11" text-anchor="middle">(Q9NZL4)</text>
  <rect x="485" y="145" width="110" height="20" rx="5" ry="5" fill="#fcfcfc" fill-opacity="0.9" stroke="#333" stroke-width="1" />
  <text x="540" y="159" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">molecular sequestering</text>
  
  <!-- TNFRSF1A Receptor (P19438-1) -->
  <path d="M350,380 C350,360 370,350 390,350 C410,350 430,360 430,380" stroke="#2c3e50" stroke-width="3" fill="none" />
  <rect x="350" y="380" width="80" height="30" rx="5" ry="5" fill="#ffb74d" stroke="#2c3e50" stroke-width="2" />
  <text x="390" y="398" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">TNFRSF1A</text>
  <text x="390" y="410" font-family="Arial" font-size="10" text-anchor="middle">(P19438-1)</text>
  <rect x="335" y="415" width="110" height="20" rx="5" ry="5" fill="#fcfcfc" fill-opacity="0.9" stroke="#333" stroke-width="1" />
  <text x="390" y="428" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">TNF receptor activity</text>
  
  <!-- Interaction Arrows -->
  <!-- HSPA1A to TNFRSF1A (RO:0002629 = directly positively regulates) -->
  <path d="M220,255 C220,305 300,335 350,365" stroke="#d32f2f" stroke-width="2.5" fill="none" marker-end="url(#arrowhead_red)" />
  <rect x="250" y="325" width="120" height="20" rx="5" ry="5" fill="#fff" fill-opacity="0.95" stroke="#d32f2f" stroke-width="1" />
  <text x="310" y="338" font-family="Arial" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="bold">activates (RO:0002629)</text>
  
  <!-- PGLYRP1 to HSPA1A (RO:0002629 = directly positively regulates) -->
  <path d="M350,195 C315,185 280,185 240,210" stroke="#d32f2f" stroke-width="2.5" fill="none" marker-end="url(#arrowhead_red)" />
  <rect x="275" y="170" width="90" height="20" rx="5" ry="5" fill="#fff" fill-opacity="0.95" stroke="#d32f2f" stroke-width="1" />
  <text x="320" y="184" font-family="Arial" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="bold">promotes (RO:0002629)</text>
  
  <!-- HSPBP1 to PGLYRP1 (RO:0002630 = directly negatively regulates) -->
  <path d="M500,205 L430,205" stroke="#2e7d32" stroke-width="2.5" fill="none" marker-end="url(#arrowhead_green)" stroke-dasharray="5,3" />
  <rect x="445" y="185" width="40" height="18" rx="5" ry="5" fill="#fff" fill-opacity="0.95" stroke="#2e7d32" stroke-width="1" />
  <text x="465" y="198" font-family="Arial" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="bold">inhibits (RO:0002630)</text>
  
  <!-- Arrowhead Markers -->
  <defs>
    <marker id="arrowhead_red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f" />
    </marker>
    <marker id="arrowhead_green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="580" y="490" width="200" height="95" rx="5" ry="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1" />
  <text x="680" y="510" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="600" y="530" r="8" fill="#ff7e5f" stroke="#2c3e50" stroke-width="1" />
  <text x="680" y="533" font-family="Arial" font-size="12" text-anchor="start">HSPA1A (receptor ligand)</text>
  
  <rect x="592" y="545" width="16" height="10" rx="2" ry="2" fill="#64b5f6" stroke="#2c3e50" stroke-width="1" />
  <text x="680" y="553" font-family="Arial" font-size="12" text-anchor="start">PGLYRP1 (Hsp70 binding)</text>
  
  <rect x="592" y="565" width="16" height="10" rx="2" ry="2" fill="#81c784" stroke="#2c3e50" stroke-width="1" />
  <text x="680" y="573" font-family="Arial" font-size="12" text-anchor="start">HSPBP1 (sequestering)</text>
  
  <rect x="592" y="585" width="16" height="10" rx="2" ry="2" fill="#ffb74d" stroke="#2c3e50" stroke-width="1" />
  <text x="680" y="593" font-family="Arial" font-size="12" text-anchor="start">TNFRSF1A (TNF receptor)</text>
  
  <line x1="600" y1="505" x2="640" y2="505" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrowhead_red)" />
  <text x="680" y="508" font-family="Arial" font-size="11" text-anchor="start">positive regulation</text>
  
  <line x1="600" y1="520" x2="640" y2="520" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead_green)" />
  <text x="680" y="523" font-family="Arial" font-size="11" text-anchor="start">negative regulation</text>
</svg>