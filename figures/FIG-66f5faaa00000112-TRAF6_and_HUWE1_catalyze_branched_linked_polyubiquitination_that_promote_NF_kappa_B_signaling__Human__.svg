<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background with cell membrane and nucleus -->
    <rect width="800" height="600" fill="#f9f9f9" />
    
    <!-- Cell membrane -->
    <path d="M 50 50 h 700 v 500 h -700 Z" fill="#f0f0f0" stroke="#888" stroke-width="3" stroke-dasharray="5,5" />
    <text x="60" y="80" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Cell membrane</text>
    
    <!-- Nucleus -->
    <ellipse cx="650" cy="400" rx="120" ry="100" fill="#e6e6ff" stroke="#888" stroke-width="2" />
    <text x="650" y="400" font-family="Arial" font-size="16" fill="#555" font-weight="bold" text-anchor="middle">Nucleus</text>
    
    <!-- Chromatin in nucleus -->
    <ellipse cx="650" cy="380" rx="80" ry="60" fill="#d9d9f2" stroke="#888" stroke-width="1" stroke-dasharray="3,3" />
    <text x="650" y="385" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">Chromatin</text>
    
    <!-- Cytoplasm label -->
    <text x="250" y="130" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Cytoplasm</text>
    
    <!-- TRAF6 -->
    <rect x="150" y="200" width="80" height="40" rx="5" fill="#ffcccc" stroke="#d46a6a" stroke-width="2" />
    <text x="190" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">TRAF6</text>
    
    <!-- HUWE1 -->
    <rect x="300" y="150" width="80" height="40" rx="5" fill="#ccccff" stroke="#6a6ad4" stroke-width="2" />
    <text x="340" y="175" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">HUWE1</text>
    
    <!-- TAB2 -->
    <rect x="250" y="300" width="80" height="40" rx="5" fill="#ffffcc" stroke="#d4d46a" stroke-width="2" />
    <text x="290" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">TAB2</text>
    
    <!-- MAP3K7 -->
    <rect x="300" y="380" width="80" height="40" rx="5" fill="#ccffcc" stroke="#6ad46a" stroke-width="2" />
    <text x="340" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">MAP3K7</text>
    
    <!-- IKBKB -->
    <rect x="400" y="380" width="80" height="40" rx="5" fill="#ffccff" stroke="#d46ad4" stroke-width="2" />
    <text x="440" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">IKBKB</text>
    
    <!-- NFKBIA -->
    <rect x="500" y="380" width="80" height="40" rx="5" fill="#ccffff" stroke="#6ad4d4" stroke-width="2" />
    <text x="540" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">NFKBIA</text>
    
    <!-- RELA -->
    <rect x="600" y="320" width="80" height="40" rx="5" fill="#e6ccb3" stroke="#b38c66" stroke-width="2" />
    <text x="640" y="345" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">RELA</text>
    
    <!-- NFKB1 -->
    <rect x="670" y="320" width="80" height="40" rx="5" fill="#d9b3cc" stroke="#996680" stroke-width="2" />
    <text x="710" y="345" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">NFKB1</text>
    
    <!-- CYLD -->
    <rect x="150" y="300" width="80" height="40" rx="5" fill="#b3cce6" stroke="#668099" stroke-width="2" />
    <text x="190" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">CYLD</text>
    
    <!-- Arrows and interactions with improved text placement -->
    <!-- TRAF6 to TAB2 -->
    <path d="M 190 240 C 190 270 240 280 250 300" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />
    <rect x="180" y="255" width="90" height="30" fill="#ffffff" opacity="0.8" rx="5" />
    <text x="225" y="273" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">K63-linked</text>
    <text x="225" y="285" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">ubiquitination</text>
    
    <!-- HUWE1 to TAB2 -->
    <path d="M 340 190 C 340 230 320 280 290 300" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />
    <rect x="310" y="220" width="90" height="30" fill="#ffffff" opacity="0.8" rx="5" />
    <text x="355" y="238" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">K48-linked</text>
    <text x="355" y="250" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">ubiquitination</text>
    
    <!-- HUWE1 to CYLD -->
    <path d="M 300 170 C 250 170 180 170 180 300" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <rect x="210" y="150" width="60" height="20" fill="#ffffff" opacity="0.8" rx="5" />
    <text x="240" y="165" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">promotes</text>
    
    <!-- CYLD to TAB2 -->
    <path d="M 230 320 L 250 320" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <rect x="210" y="330" width="80" height="20" fill="#ffffff" opacity="0.8" rx="5" />
    <text x="250" y="345" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">deubiquitinates</text>
    
    <!-- TAB2 to MAP3K7 -->
    <path d="M 290 340 C 290 360 320 360 320 380" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <rect x="285" y="350" width="60" height="20" fill="#ffffff" opacity="0.8" rx="5" />
    <text x="315" y="365" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">activates</text>
    
    <!-- MAP3K7 to IKBKB -->
    <path d="M 380 400 L 400 400" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <rect x="365" y="410" width="80" height="20" fill="#ffffff" opacity="0.8" rx="5" />
    <text x="405" y="425" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">phosphorylates</text>
    
    <!-- IKBKB to NFKBIA -->
    <path d="M 480 400 L 500 400" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <rect x="465" y="410" width="80" height="20" fill="#ffffff" opacity="0.8" rx="5" />
    <text x="505" y="425" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">phosphorylates</text>
    
    <!-- NFKBIA to RELA/NFKB1 -->
    <path d="M 540 380 C 540 350 580 340 600 340" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <path d="M 540 380 C 540 330 640 330 670 340" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <rect x="550" y="350" width="60" height="20" fill="#ffffff" opacity="0.8" rx="5" />
    <text x="580" y="365" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">releases</text>
    
    <!-- RELA/NFKB1 to nucleus -->
    <path d="M 640 360 C 640 380 640 380 640 400" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <path d="M 710 360 C 710 380 710 380 710 400" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <rect x="660" y="370" width="80" height="20" fill="#ffffff" opacity="0.8" rx="5" />
    <text x="700" y="385" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">translocation</text>
    
    <!-- Compartment separators -->
    <path d="M 590 260 v 160" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" />
    <path d="M 450 150 v 280" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" />
    
    <!-- Arrow markers -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
        </marker>
    </defs>
    
    <!-- Legend -->
    <rect x="50" y="480" width="700" height="60" fill="#fff" stroke="#ccc" stroke-width="1" />
    <text x="60" y="500" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend:</text>
    
    <rect x="60" y="510" width="15" height="15" fill="#ffcccc" stroke="#d46a6a" stroke-width="1" />
    <text x="80" y="522" font-family="Arial" font-size="12" fill="#333">E3 Ubiquitin Ligase</text>
    
    <rect x="200" y="510" width="15" height="15" fill="#ccffcc" stroke="#6ad46a" stroke-width="1" />
    <text x="220" y="522" font-family="Arial" font-size="12" fill="#333">Kinase</text>
    
    <rect x="300" y="510" width="15" height="15" fill="#ffffcc" stroke="#d4d46a" stroke-width="1" />
    <text x="320" y="522" font-family="Arial" font-size="12" fill="#333">Adaptor Protein</text>
    
    <rect x="420" y="510" width="15" height="15" fill="#e6ccb3" stroke="#b38c66" stroke-width="1" />
    <text x="440" y="522" font-family="Arial" font-size="12" fill="#333">Transcription Factor</text>
    
    <rect x="560" y="510" width="15" height="15" fill="#b3cce6" stroke="#668099" stroke-width="1" />
    <text x="580" y="522" font-family="Arial" font-size="12" fill="#333">Deubiquitinase</text>
    
    <!-- Title -->
    <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
        TRAF6 and HUWE1 Catalyze Branched-Linked Polyubiquitination that Promotes NF-κB Signaling
    </text>
</svg>