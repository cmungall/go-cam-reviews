<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and compartments -->
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="550" rx="50" ry="50" fill="#f9f9f9" stroke="#888" stroke-width="2" />
  
  <!-- ER membrane -->
  <rect x="100" y="150" width="250" height="120" rx="10" ry="10" fill="#f0e6ff" stroke="#9966cc" stroke-width="2" />
  <text x="120" y="140" font-family="Arial" font-size="14" font-weight="bold">Endoplasmic Reticulum Membrane</text>
  
  <!-- Cytosol -->
  <rect x="100" y="300" width="600" height="100" rx="10" ry="10" fill="#e6f7ff" stroke="#66b2ff" stroke-width="2" />
  <text x="120" y="290" font-family="Arial" font-size="14" font-weight="bold">Cytosol</text>
  
  <!-- Nucleus -->
  <ellipse cx="500" cy="180" rx="120" ry="80" fill="#ffe6e6" stroke="#ff6666" stroke-width="2" />
  <text x="500" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Nucleus</text>
  
  <!-- Mitochondria -->
  <ellipse cx="550" cy="450" rx="150" ry="70" fill="#e6ffe6" stroke="#66cc66" stroke-width="2" />
  <ellipse cx="550" cy="450" rx="130" ry="55" fill="none" stroke="#66cc66" stroke-width="2" />
  <text x="550" y="420" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Mitochondrial Inner Membrane</text>
  
  <!-- Molecules and interactions -->
  <!-- Unfolded proteins in ER (implied, marked as not in source) -->
  <g transform="translate(130,180)">
    <path d="M0,0 C5,5 10,-5 15,0 C20,5 25,-5 30,0 C35,5 40,-5 45,0" fill="none" stroke="#cc3300" stroke-width="2" />
    <text x="10" y="20" font-family="Arial" font-size="10" font-style="italic">Unfolded protein*</text>
  </g>
  
  <!-- Step 1 marker -->
  <circle cx="185" y="160" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="185" y="165" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  
  <!-- EIF2AK3/PERK -->
  <g transform="translate(220,180)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" ry="15" fill="#ffcc99" stroke="#ff9933" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle">EIF2AK3/PERK</text>
    <text x="0" y="25" font-family="Arial" font-size="9" text-anchor="middle" fill="#664400">eIF2α kinase activity</text>
  </g>
  
  <!-- Arrow from unfolded protein to PERK -->
  <path d="M180,180 L210,180" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="185" y="170" font-family="Arial" font-size="9">Activates</text>
  
  <!-- Step 2 marker -->
  <circle cx="220" y="260" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="220" y="265" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  
  <!-- EIF2S1 -->
  <g transform="translate(220,330)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" ry="15" fill="#99ccff" stroke="#3399ff" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle">EIF2S1</text>
    <text x="0" y="25" font-family="Arial" font-size="9" text-anchor="middle" fill="#003366">Translation initiation factor</text>
  </g>
  
  <!-- Arrow from PERK to EIF2S1 -->
  <path d="M220,200 L220,310" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="230" y="255" font-family="Arial" font-size="10">Phosphorylates</text>
  <text x="230" y="270" font-family="Arial" font-size="9">(Inhibits activity)</text>
  
  <!-- Step 3 marker -->
  <circle cx="285" y="310" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="285" y="315" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  
  <!-- ATF4 -->
  <g transform="translate(350,330)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" ry="15" fill="#99ccff" stroke="#3399ff" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle">ATF4</text>
    <text x="0" y="25" font-family="Arial" font-size="9" text-anchor="middle" fill="#003366">Translation enhanced</text>
  </g>
  
  <!-- Arrow from EIF2S1 to ATF4 -->
  <path d="M265,330 L305,330" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="285" y="320" font-family="Arial" font-size="10">Regulates</text>
  
  <!-- Step 4 marker -->
  <circle cx="405" y="260" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="405" y="265" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">4</text>
  
  <!-- ATF4 in nucleus -->
  <g transform="translate(500,180)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" ry="15" fill="#ffb3b3" stroke="#ff6666" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle">ATF4</text>
    <text x="0" y="25" font-family="Arial" font-size="9" text-anchor="middle" fill="#990000">Transcription factor</text>
  </g>
  
  <!-- Arrow from ATF4 cytosol to nucleus -->
  <path d="M370,315 L460,200" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3" />
  <text x="400" y="255" font-family="Arial" font-size="10">Translocation</text>
  
  <!-- Step 5 marker -->
  <circle cx="525" y="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="525" y="205" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">5</text>
  
  <!-- COX7A2L gene in nucleus -->
  <g transform="translate(500,220)">
    <rect x="-60" y="-15" width="120" height="20" rx="5" ry="5" fill="#ffb3b3" stroke="#ff6666" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle">COX7A2L gene</text>
  </g>
  
  <!-- Arrow from ATF4 to COX7A2L gene -->
  <path d="M500,195 L500,205" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="525" y="200" font-family="Arial" font-size="9">Activates transcription</text>
  
  <!-- Step 6 marker -->
  <circle cx="595" y="250" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="595" y="255" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">6</text>
  
  <!-- COX7A2L mRNA (implied, marked as not in source) -->
  <g transform="translate(630,250)">
    <path d="M-20,-5 L20,-5 L20,5 L-20,5 Z" fill="#ffb3b3" stroke="#ff6666" stroke-width="2" />
    <text x="0" y="20" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle">COX7A2L mRNA*</text>
  </g>
  
  <!-- Arrow from gene to mRNA -->
  <path d="M560,220 L610,250" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3" />
  
  <!-- Step 7 marker -->
  <circle cx="630" y="295" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="630" y="300" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">7</text>
  
  <!-- COX7A2L protein in cytosol (implied, marked as not in source) -->
  <g transform="translate(630,330)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" ry="15" fill="#99ccff" stroke="#3399ff" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle">COX7A2L</text>
    <text x="0" y="25" font-family="Arial" font-size="9" text-anchor="middle" fill="#003366">Newly synthesized</text>
  </g>
  
  <!-- Arrow from mRNA to protein -->
  <path d="M630,255 L630,310" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3" />
  <text x="640" y="285" font-family="Arial" font-size="10" font-style="italic">Translation*</text>
  
  <!-- Step 8 marker -->
  <circle cx="605" y="395" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="605" y="400" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">8</text>
  
  <!-- COX7A2L in mitochondria -->
  <g transform="translate(550,450)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" ry="15" fill="#b3ffb3" stroke="#66cc66" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle">COX7A2L</text>
    <text x="0" y="25" font-family="Arial" font-size="9" text-anchor="middle" fill="#006600">Protein adaptor</text>
  </g>
  
  <!-- Arrow from cytosol to mitochondria -->
  <path d="M630,345 L580,430" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3" />
  <text x="615" y="395" font-family="Arial" font-size="10">Import</text>
  
  <!-- Step 9 marker -->
  <circle cx="500" y="490" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="500" y="495" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">9</text>
  
  <!-- Respiratory complexes and supercomplexes -->
  <g transform="translate(470,470)">
    <rect x="-25" y="-12" width="50" height="24" rx="5" ry="5" fill="#b3ffb3" stroke="#66cc66" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="10" text-anchor="middle">Complex III</text>
  </g>
  
  <g transform="translate(630,470)">
    <rect x="-25" y="-12" width="50" height="24" rx="5" ry="5" fill="#b3ffb3" stroke="#66cc66" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="10" text-anchor="middle">Complex IV</text>
  </g>
  
  <!-- Respiratory supercomplex (implied final product) -->
  <g transform="translate(550,500)">
    <rect x="-80" y="-15" width="160" height="25" rx="5" ry="5" fill="#b3ffb3" stroke="#339933" stroke-width="2" stroke-dasharray="none" />
    <text x="0" y="5" font-family="Arial" font-size="10" text-anchor="middle">Respiratory Supercomplex</text>
  </g>
  
  <!-- Arrows to supercomplex -->
  <path d="M470,475 L510,490" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M630,475 L590,490" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M550,465 L550,480" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="490" y="495" font-family="Arial" font-size="9">COX7A2L mediates assembly</text>
  
  <!-- Process labels -->
  <text x="165" y="120" font-family="Arial" font-size="12" font-style="italic">PERK-mediated unfolded protein response</text>
  <text x="500" y="110" font-family="Arial" font-size="12" font-style="italic">Gene regulation</text>
  <text x="550" y="380" font-family="Arial" font-size="12" font-style="italic">Mitochondrial respirasome assembly</text>
  
  <!-- Legend -->
  <rect x="60" y="565" width="680" height="25" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="70" y="580" font-family="Arial" font-size="10" font-style="italic">* Items marked with an asterisk are implied components not explicitly in the source GO-CAM model but necessary for pathway clarity</text>
  
  <!-- Title -->
  <text x="400" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Unfolded Protein Response Activation of EIF2AK3/PERK Promotes Respiratory Supercomplex Formation</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
</svg>