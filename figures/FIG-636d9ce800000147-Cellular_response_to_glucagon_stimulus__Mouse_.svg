<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Cell outline -->
  <rect x="50" y="100" width="700" height="450" rx="20" ry="20" fill="#f5f5f5" stroke="#333333" stroke-width="2" />
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Cellular Response to Glucagon Stimulus (Mouse)</text>
  
  <!-- Plasma membrane -->
  <rect x="50" y="100" width="700" height="80" rx="20" ry="20" fill="#bcdefa" stroke="#333333" stroke-width="2" />
  <text x="80" y="130" font-family="Arial" font-size="16" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytosol -->
  <rect x="50" y="180" width="700" height="370" rx="0" ry="0" fill="#e8f4ea" stroke="none" />
  <text x="80" y="210" font-family="Arial" font-size="16" font-weight="bold">Cytosol</text>
  
  <!-- Glucagon (Gcg) -->
  <circle cx="140" cy="70" r="20" fill="#ff9999" stroke="#333333" stroke-width="2" />
  <text x="140" y="75" font-family="Arial" font-size="12" text-anchor="middle">Gcg</text>
  
  <!-- Glucagon receptor (Gcgr) -->
  <rect x="120" y="100" width="40" height="80" rx="5" ry="5" fill="#99ccff" stroke="#333333" stroke-width="2" />
  <text x="140" y="145" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-90, 140, 145)">Gcgr</text>
  
  <!-- G protein (Gnas) -->
  <circle cx="220" cy="150" r="25" fill="#99cc99" stroke="#333333" stroke-width="2" />
  <text x="220" y="155" font-family="Arial" font-size="12" text-anchor="middle">Gnas</text>
  
  <!-- Adenylate cyclase (Adcy8) -->
  <rect x="300" y="100" width="40" height="80" rx="5" ry="5" fill="#cc99ff" stroke="#333333" stroke-width="2" />
  <text x="320" y="145" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-90, 320, 145)">Adcy8</text>
  
  <!-- cAMP (not in source, but implied) -->
  <circle cx="400" cy="200" r="15" fill="#ffcc66" stroke="#333333" stroke-width="2" />
  <text x="400" y="205" font-family="Arial" font-size="10" text-anchor="middle">cAMP</text>
  
  <!-- PKA regulatory subunit (Prkar1a) -->
  <rect x="350" y="280" width="50" height="30" rx="5" ry="5" fill="#cc99cc" stroke="#333333" stroke-width="2" />
  <text x="375" y="300" font-family="Arial" font-size="12" text-anchor="middle">Prkar1a</text>
  
  <!-- PKA catalytic subunit (Prkaca) -->
  <rect x="450" y="280" width="50" height="30" rx="5" ry="5" fill="#ff9966" stroke="#333333" stroke-width="2" />
  <text x="475" y="300" font-family="Arial" font-size="12" text-anchor="middle">Prkaca</text>
  
  <!-- PKA holoenzyme (not in source, but implied) -->
  <rect x="400" y="250" width="50" height="30" rx="5" ry="5" fill="#cccccc" stroke="#333333" stroke-width="2" stroke-dasharray="5,2" />
  <text x="425" y="270" font-family="Arial" font-size="12" text-anchor="middle">PKA</text>

  <!-- Arrows and interactions -->
  <!-- Glucagon to receptor -->
  <line x1="140" y1="90" x2="140" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Receptor to G protein -->
  <line x1="160" y1="140" x2="195" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="172" y="135" font-family="Arial" font-size="10" fill="#333333">activates</text>
  
  <!-- G protein to Adenylate cyclase -->
  <line x1="245" y1="150" x2="300" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="270" y="140" font-family="Arial" font-size="10" fill="#333333">activates</text>
  
  <!-- Adenylate cyclase to cAMP -->
  <line x1="340" y1="150" x2="390" y2="185" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,2" />
  <text x="360" y="160" font-family="Arial" font-size="10" fill="#666666" font-style="italic">produces</text>
  
  <!-- cAMP to PKA -->
  <line x1="400" y1="215" x2="425" y2="250" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,2" />
  <text x="410" y="240" font-family="Arial" font-size="9" fill="#666666" font-style="italic">binds</text>
  
  <!-- PKA dissociation -->
  <line x1="400" y1="280" x2="375" y2="280" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="450" y1="280" x2="475" y2="280" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="425" y="315" font-family="Arial" font-size="10" fill="#333333">dissociation</text>
  
  <!-- PKA catalytic subunit activation -->
  <path d="M450,310 Q500,340 550,310" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="500" y="350" font-family="Arial" font-size="10" fill="#333333">downstream effects</text>
  <text x="500" y="365" font-family="Arial" font-size="9" fill="#666666" font-style="italic">(glycogen breakdown, gluconeogenesis)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="400" width="180" height="170" rx="5" ry="5" fill="white" stroke="#333333" stroke-width="1" />
  <text x="560" y="420" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="570" cy="440" r="8" fill="#ff9999" stroke="#333333" stroke-width="1" />
  <text x="585" y="445" font-family="Arial" font-size="12">Gcg (Glucagon)</text>
  
  <rect x="562" y="460" width="16" height="16" rx="2" ry="2" fill="#99ccff" stroke="#333333" stroke-width="1" />
  <text x="585" y="472" font-family="Arial" font-size="12">Gcgr (Receptor)</text>
  
  <circle cx="570" cy="490" r="8" fill="#99cc99" stroke="#333333" stroke-width="1" />
  <text x="585" y="495" font-family="Arial" font-size="12">Gnas (G protein)</text>
  
  <rect x="562" y="510" width="16" height="16" rx="2" ry="2" fill="#cc99ff" stroke="#333333" stroke-width="1" />
  <text x="585" y="522" font-family="Arial" font-size="12">Adcy8 (Adenylate cyclase)</text>
  
  <line x1="560" y1="540" x2="580" y2="540" stroke="#333333" stroke-width="1" stroke-dasharray="5,2" />
  <text x="585" y="545" font-family="Arial" font-size="12">Implied component/process</text>

  <line x1="560" y1="560" x2="580" y2="560" stroke="#333333" stroke-width="1" />
  <text x="585" y="565" font-family="Arial" font-size="12">Direct interaction</text>
</svg>