<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and cell boundary -->
  <rect x="0" y="0" width="800" height="650" fill="#f8f8f8" />
  <rect x="20" y="20" width="760" height="580" rx="20" ry="20" fill="#ffffff" stroke="#888888" stroke-width="2" />
  
  <!-- Cell compartment label -->
  <text x="400" y="45" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Title -->
  <text x="400" y="625" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Folate Polyglutamylation Pathway in Saccharomyces cerevisiae</text>
  
  <!-- Pathway components -->
  
  <!-- FOL3 reaction -->
  <rect x="100" y="100" width="140" height="60" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="170" y="125" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">FOL3</text>
  <text x="170" y="145" font-family="Arial" font-size="12" text-anchor="middle">Dihydrofolate synthase</text>
  
  <!-- DFR1 reaction -->
  <rect x="350" y="100" width="140" height="60" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="420" y="125" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">DFR1</text>
  <text x="420" y="145" font-family="Arial" font-size="12" text-anchor="middle">Dihydrofolate reductase</text>
  
  <!-- MET7 reactions -->
  <rect x="600" y="200" width="140" height="60" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="670" y="225" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MET7</text>
  <text x="670" y="245" font-family="Arial" font-size="12" text-anchor="middle">Tetrahydrofolate</text>
  <text x="670" y="260" font-family="Arial" font-size="12" text-anchor="middle">polyglutamate synthase</text>
  
  <!-- SHM1/SHM2 reaction -->
  <rect x="350" y="300" width="140" height="60" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="420" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">SHM1/SHM2</text>
  <text x="420" y="345" font-family="Arial" font-size="12" text-anchor="middle">Glycine hydroxymethyl-</text>
  <text x="420" y="360" font-family="Arial" font-size="12" text-anchor="middle">transferase</text>
  
  <!-- MIS1/ADE3 reaction -->
  <rect x="100" y="300" width="140" height="60" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="170" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MIS1/ADE3</text>
  <text x="170" y="345" font-family="Arial" font-size="12" text-anchor="middle">Formate-tetrahydrofolate</text>
  <text x="170" y="360" font-family="Arial" font-size="12" text-anchor="middle">ligase</text>
  
  <!-- MET12/MET13 reaction -->
  <rect x="350" y="450" width="140" height="60" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="420" y="475" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MET12/MET13</text>
  <text x="420" y="495" font-family="Arial" font-size="12" text-anchor="middle">Methylenetetrahydrofolate</text>
  <text x="420" y="510" font-family="Arial" font-size="12" text-anchor="middle">reductase</text>
  
  <!-- Molecules -->
  <!-- 7,8-dihydropteroate -->
  <ellipse cx="50" y="130" rx="45" ry="20" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="50" y="134" font-family="Arial" font-size="11" text-anchor="middle">7,8-dihydropteroate</text>
  
  <!-- Dihydrofolate -->
  <ellipse cx="260" y="130" rx="45" ry="20" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="260" y="134" font-family="Arial" font-size="11" text-anchor="middle">Dihydrofolate</text>
  
  <!-- Tetrahydrofolate -->
  <ellipse cx="520" y="130" rx="45" ry="20" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="520" y="134" font-family="Arial" font-size="11" text-anchor="middle">Tetrahydrofolate</text>
  
  <!-- Polyglutamylated THF -->
  <ellipse cx="670" y="130" rx="50" ry="20" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="670" y="134" font-family="Arial" font-size="11" text-anchor="middle">THF-Glu(n)</text>
  
  <!-- 5,10-methylene-THF -->
  <ellipse cx="420" y="230" rx="55" ry="20" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="420" y="226" font-family="Arial" font-size="11" text-anchor="middle">5,10-methylene-</text>
  <text x="420" y="238" font-family="Arial" font-size="11" text-anchor="middle">tetrahydrofolate</text>
  
  <!-- 10-formyl-THF -->
  <ellipse cx="170" y="230" rx="50" ry="20" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="170" y="234" font-family="Arial" font-size="11" text-anchor="middle">10-formyl-THF</text>
  
  <!-- 5-methyl-THF -->
  <ellipse cx="420" y="380" rx="45" ry="20" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="420" y="384" font-family="Arial" font-size="11" text-anchor="middle">5-methyl-THF</text>
  
  <!-- Connectors with consistent styles and clear directionality -->
  <!-- FOL3 to Dihydrofolate -->
  <path d="M 170,160 Q 200,160 230,145 T 260,130" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="200" y="170" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- Dihydrofolate to DFR1 -->
  <path d="M 300,130 Q 325,130 350,130" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="325" y="120" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- DFR1 to Tetrahydrofolate -->
  <path d="M 490,130 Q 500,130 520,130" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="505" y="120" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- Tetrahydrofolate to MET7 -->
  <path d="M 520,150 Q 550,180 600,200" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="560" y="180" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- MET7 to Polyglutamylated THF -->
  <path d="M 670,200 Q 670,180 670,150" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="685" y="175" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- Tetrahydrofolate to SHM1/SHM2 -->
  <path d="M 520,150 Q 480,220 420,300" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="470" y="210" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- SHM1/SHM2 to 5,10-methylene-THF -->
  <path d="M 420,300 Q 420,270 420,250" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="435" y="275" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- Tetrahydrofolate to MIS1/ADE3 -->
  <path d="M 520,150 Q 350,180 170,300" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="340" y="200" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- MIS1/ADE3 to 10-formyl-THF -->
  <path d="M 170,300 Q 170,270 170,250" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="185" y="275" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- 5,10-methylene-THF to MET12/MET13 -->
  <path d="M 420,250 Q 420,350 420,450" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="435" y="350" font-family="Arial" font-size="11" text-anchor="middle">→</text>
  
  <!-- MET12/MET13 to 5-methyl-THF -->
  <path d="M 420,450 Q 420,420 420,400" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="435" y="425" font-family="Arial" font-size="11" text-anchor="middle">→</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Cofactors/Substrates in consistent font size -->
  <!-- FOL3 inputs -->
  <rect x="30" y="80" width="120" height="30" rx="5" ry="5" fill="#e6ffe6" stroke="#00cc00" stroke-width="1" opacity="0.8" />
  <text x="90" y="98" font-family="Arial" font-size="11" text-anchor="middle">ATP + L-glutamate</text>
  
  <!-- DFR1 inputs -->
  <rect x="360" y="70" width="60" height="20" rx="5" ry="5" fill="#e6ffe6" stroke="#00cc00" stroke-width="1" opacity="0.8" />
  <text x="390" y="84" font-family="Arial" font-size="11" text-anchor="middle">NADPH</text>
  
  <!-- MET12/MET13 inputs -->
  <rect x="360" y="430" width="60" height="20" rx="5" ry="5" fill="#e6ffe6" stroke="#00cc00" stroke-width="1" opacity="0.8" />
  <text x="390" y="444" font-family="Arial" font-size="11" text-anchor="middle">NADH</text>
  
  <!-- SHM1/SHM2 inputs/outputs -->
  <rect x="275" y="320" width="70" height="35" rx="5" ry="5" fill="#e6ffe6" stroke="#00cc00" stroke-width="1" opacity="0.8" />
  <text x="310" y="335" font-family="Arial" font-size="11" text-anchor="middle">L-serine</text>
  <text x="310" y="350" font-family="Arial" font-size="11" text-anchor="middle">+ H₂O</text>
  
  <rect x="495" y="320" width="60" height="20" rx="5" ry="5" fill="#e6ffe6" stroke="#00cc00" stroke-width="1" opacity="0.8" />
  <text x="525" y="335" font-family="Arial" font-size="11" text-anchor="middle">glycine</text>
  
  <!-- MIS1/ADE3 inputs -->
  <rect x="30" y="320" width="65" height="35" rx="5" ry="5" fill="#e6ffe6" stroke="#00cc00" stroke-width="1" opacity="0.8" />
  <text x="62" y="335" font-family="Arial" font-size="11" text-anchor="middle">formate</text>
  <text x="62" y="350" font-family="Arial" font-size="11" text-anchor="middle">+ ATP</text>
  
  <!-- MET7 inputs -->
  <rect x="600" y="270" width="80" height="35" rx="5" ry="5" fill="#e6ffe6" stroke="#00cc00" stroke-width="1" opacity="0.8" />
  <text x="640" y="285" font-family="Arial" font-size="11" text-anchor="middle">ATP +</text>
  <text x="640" y="300" font-family="Arial" font-size="11" text-anchor="middle">L-glutamate</text>
  
  <!-- Products of FOL3 -->
  <text x="150" y="180" font-family="Arial" font-size="10" text-anchor="middle">ADP + Pi</text>
  
  <!-- Products of DFR1 -->
  <text x="420" y="170" font-family="Arial" font-size="10" text-anchor="middle">NADP⁺</text>
  
  <!-- Products of MET12/MET13 -->
  <text x="420" y="520" font-family="Arial" font-size="10" text-anchor="middle">NAD⁺</text>
  
  <!-- Legend -->
  <rect x="600" y="500" width="150" height="90" fill="white" stroke="#888888" stroke-width="1" />
  <text x="675" y="515" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="610" y="525" width="15" height="15" fill="#e6f2ff" stroke="#0066cc" stroke-width="1" />
  <text x="695" y="537" font-family="Arial" font-size="11" text-anchor="middle">Enzyme/Activity</text>
  
  <ellipse cx="617" cy="552" rx="8" ry="8" fill="#ffe6cc" stroke="#ff9933" stroke-width="1" />
  <text x="695" y="555" font-family="Arial" font-size="11" text-anchor="middle">Folate Metabolite</text>
  
  <rect x="610" y="565" width="15" height="15" fill="#e6ffe6" stroke="#00cc00" stroke-width="1" opacity="0.8" />
  <text x="695" y="577" font-family="Arial" font-size="11" text-anchor="middle">Cofactor/Substrate</text>
</svg>