<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background with endoplasmic reticulum and cytosol -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Endoplasmic reticulum compartment -->
  <rect x="70" y="110" width="660" height="280" rx="10" ry="10" fill="#ffeacc" stroke="#d95f02" stroke-width="1" fill-opacity="0.3"/>
  
  <!-- ER membrane structures -->
  <path d="M100,150 C150,130 200,170 250,150 C300,130 350,170 400,150 C450,130 500,170 550,150 C600,130 650,170 700,150" 
        stroke="#d95f02" stroke-width="3" fill="none"/>
  <path d="M100,200 C150,180 200,220 250,200 C300,180 350,220 400,200 C450,180 500,220 550,200 C600,180 650,220 700,200" 
        stroke="#d95f02" stroke-width="3" fill="none"/>
  <path d="M100,250 C150,230 200,270 250,250 C300,230 350,270 400,250 C450,230 500,270 550,250 C600,230 650,270 700,250" 
        stroke="#d95f02" stroke-width="3" fill="none"/>
  <path d="M100,300 C150,280 200,320 250,300 C300,280 350,320 400,300 C450,280 500,320 550,300 C600,280 650,320 700,300" 
        stroke="#d95f02" stroke-width="3" fill="none"/>
  
  <!-- Cytosol compartment -->
  <rect x="70" y="390" width="660" height="110" rx="10" ry="10" fill="#e5f5e0" stroke="#1b9e77" stroke-width="1" fill-opacity="0.5"/>
  
  <!-- Compartment labels -->
  <rect x="90" y="120" width="180" height="25" rx="5" ry="5" fill="white" stroke="#d95f02" stroke-width="1"/>
  <text x="180" y="137" font-family="Arial" font-size="16" font-weight="bold" fill="#d95f02" text-anchor="middle">Endoplasmic Reticulum</text>
  
  <rect x="90" y="400" width="80" height="25" rx="5" ry="5" fill="white" stroke="#1b9e77" stroke-width="1"/>
  <text x="130" y="417" font-family="Arial" font-size="16" font-weight="bold" fill="#1b9e77" text-anchor="middle">Cytosol</text>
  
  <!-- Title -->
  <text x="400" y="80" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Androgen Biosynthetic Process (Mouse)</text>
  
  <!-- Pathway start: pregn-5-ene-3,20-dione -->
  <ellipse cx="120" y="180" rx="35" ry="25" fill="#fee090" stroke="#333" stroke-width="2"/>
  <text x="120" y="180" font-family="Arial" font-size="11" text-anchor="middle">pregn-5-ene-3,20-dione</text>
  <text x="120" y="190" font-family="Arial" font-size="8" text-anchor="middle" fill="#666">(CHEBI:63837)</text>
  
  <!-- Reaction 1: Hsd3b1 -->
  <line x1="155" y1="180" x2="200" y2="180" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="165" y="150" width="25" height="20" fill="#7fc97f" stroke="#333" stroke-width="1.5"/>
  <text x="177.5" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Hsd3b1</text>
  
  <!-- Enzyme function annotation -->
  <text x="177.5" y="134" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">steroid delta-isomerase</text>
  
  <!-- Cofactors for Hsd3b1 -->
  <rect x="145" y="200" width="70" height="32" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1"/>
  <text x="180" y="212" font-family="Arial" font-size="9" fill="#0571b0" text-anchor="middle">NADPH</text>
  <text x="180" y="222" font-family="Arial" font-size="9" fill="#ca0020" text-anchor="middle">→ NADP⁺</text>
  <text x="180" y="232" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">+ H₂O</text>
  
  <!-- Progesterone -->
  <ellipse cx="235" y="180" rx="35" ry="25" fill="#fee090" stroke="#333" stroke-width="2"/>
  <text x="235" y="180" font-family="Arial" font-size="11" text-anchor="middle">progesterone</text>
  <text x="235" y="190" font-family="Arial" font-size="8" text-anchor="middle" fill="#666">(CHEBI:17026)</text>
  
  <!-- Reaction 2: Cyp17a1 (first step) -->
  <line x1="270" y1="180" x2="315" y2="180" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="280" y="150" width="25" height="20" fill="#7fc97f" stroke="#333" stroke-width="1.5"/>
  <text x="292.5" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Cyp17a1</text>
  
  <!-- Enzyme function annotation -->
  <text x="292.5" y="134" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">steroid 17α-monooxygenase</text>
  
  <!-- Cofactors for Cyp17a1 (first) -->
  <rect x="260" y="200" width="70" height="42" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1"/>
  <text x="295" y="212" font-family="Arial" font-size="9" fill="#0571b0" text-anchor="middle">NADPH</text>
  <text x="295" y="222" font-family="Arial" font-size="9" fill="#ca0020" text-anchor="middle">→ NADP⁺</text>
  <text x="295" y="232" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">+ O₂</text>
  <text x="295" y="242" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">+ H⁺</text>
  
  <!-- 17alpha-hydroxyprogesterone -->
  <ellipse cx="350" y="180" rx="40" ry="25" fill="#fee090" stroke="#333" stroke-width="2"/>
  <text x="350" y="175" font-family="Arial" font-size="10" text-anchor="middle">17α-hydroxy-</text>
  <text x="350" y="185" font-family="Arial" font-size="10" text-anchor="middle">progesterone</text>
  <text x="350" y="195" font-family="Arial" font-size="7" text-anchor="middle" fill="#666">(CHEBI:17252)</text>
  
  <!-- Reaction 3: Cyp17a1 (second step) -->
  <line x1="390" y1="180" x2="435" y2="180" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="400" y="150" width="25" height="20" fill="#7fc97f" stroke="#333" stroke-width="1.5"/>
  <text x="412.5" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Cyp17a1</text>
  
  <!-- Cofactors for Cyp17a1 (second) -->
  <rect x="380" y="200" width="70" height="42" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1"/>
  <text x="415" y="212" font-family="Arial" font-size="9" fill="#0571b0" text-anchor="middle">NADPH</text>
  <text x="415" y="222" font-family="Arial" font-size="9" fill="#ca0020" text-anchor="middle">→ NADP⁺</text>
  <text x="415" y="232" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">+ O₂</text>
  <text x="415" y="242" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">+ H⁺</text>
  
  <!-- Androst-4-ene-3,17-dione -->
  <ellipse cx="475" y="180" rx="40" ry="25" fill="#fee090" stroke="#333" stroke-width="2"/>
  <text x="475" y="175" font-family="Arial" font-size="10" text-anchor="middle">androst-4-ene-</text>
  <text x="475" y="185" font-family="Arial" font-size="10" text-anchor="middle">3,17-dione</text>
  <text x="475" y="195" font-family="Arial" font-size="7" text-anchor="middle" fill="#666">(CHEBI:16422)</text>
  
  <!-- Reaction 4: Hsd17b3 -->
  <line x1="515" y1="180" x2="560" y2="180" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="525" y="150" width="25" height="20" fill="#7fc97f" stroke="#333" stroke-width="1.5"/>
  <text x="537.5" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Hsd17b3</text>
  
  <!-- Enzyme function annotation -->
  <text x="537.5" y="134" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">testosterone dehydrogenase</text>
  
  <!-- Cofactors for Hsd17b3 -->
  <rect x="505" y="200" width="70" height="32" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1"/>
  <text x="540" y="212" font-family="Arial" font-size="9" fill="#0571b0" text-anchor="middle">NADPH</text>
  <text x="540" y="222" font-family="Arial" font-size="9" fill="#ca0020" text-anchor="middle">→ NADP⁺</text>
  <text x="540" y="232" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">+ H⁺</text>
  
  <!-- Testosterone -->
  <ellipse cx="600" y="180" rx="35" ry="25" fill="#fee090" stroke="#333" stroke-width="2"/>
  <text x="600" y="180" font-family="Arial" font-size="11" text-anchor="middle">testosterone</text>
  <text x="600" y="190" font-family="Arial" font-size="8" text-anchor="middle" fill="#666">(CHEBI:17347)</text>
  
  <!-- Branch to Srd5a1 and Srd5a2 -->
  <line x1="600" y1="205" x2="600" y2="240" stroke="#333" stroke-width="3"/>
  <line x1="600" y1="240" x2="500" y2="280" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="240" x2="700" y2="280" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Reaction 5a: Srd5a1 -->
  <rect x="535" y="240" width="25" height="20" fill="#7fc97f" stroke="#333" stroke-width="1.5"/>
  <text x="547.5" y="254" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Srd5a1</text>
  
  <!-- Enzyme function annotation for Srd5a1 -->
  <text x="525" y="260" transform="rotate(-40, 525, 260)" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">3-oxo-5-alpha-steroid</text>
  <text x="515" y="270" transform="rotate(-40, 515, 270)" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">4-dehydrogenase</text>
  
  <!-- Cofactors for Srd5a1 -->
  <rect x="490" y="240" width="40" height="32" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1"/>
  <text x="510" y="252" font-family="Arial" font-size="9" fill="#0571b0" text-anchor="middle">NADPH</text>
  <text x="510" y="262" font-family="Arial" font-size="9" fill="#ca0020" text-anchor="middle">→ NADP⁺</text>
  <text x="510" y="272" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">+ H⁺</text>
  
  <!-- Reaction 5b: Srd5a2 -->
  <rect x="640" y="240" width="25" height="20" fill="#7fc97f" stroke="#333" stroke-width="1.5"/>
  <text x="652.5" y="254" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Srd5a2</text>
  
  <!-- Enzyme function annotation for Srd5a2 -->
  <text x="675" y="260" transform="rotate(40, 675, 260)" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">3-oxo-5-alpha-steroid</text>
  <text x="685" y="270" transform="rotate(40, 685, 270)" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">4-dehydrogenase</text>
  
  <!-- Cofactors for Srd5a2 -->
  <rect x="670" y="240" width="40" height="32" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1"/>
  <text x="690" y="252" font-family="Arial" font-size="9" fill="#0571b0" text-anchor="middle">NADPH</text>
  <text x="690" y="262" font-family="Arial" font-size="9" fill="#ca0020" text-anchor="middle">→ NADP⁺</text>
  <text x="690" y="272" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">+ H⁺</text>
  
  <!-- 17beta-hydroxy-5alpha-androstan-3-one from Srd5a1 -->
  <ellipse cx="500" y="310" rx="40" ry="25" fill="#fee090" stroke="#333" stroke-width="2"/>
  <text x="500" y="305" font-family="Arial" font-size="9" text-anchor="middle">17β-hydroxy-5α-</text>
  <text x="500" y="315" font-family="Arial" font-size="9" text-anchor="middle">androstan-3-one</text>
  <text x="500" y="325" font-family="Arial" font-size="7" text-anchor="middle" fill="#666">(CHEBI:16330)</text>
  
  <!-- 17beta-hydroxy-5alpha-androstan-3-one from Srd5a2 -->
  <ellipse cx="700" y="310" rx="40" ry="25" fill="#fee090" stroke="#333" stroke-width="2"/>
  <text x="700" y="305" font-family="Arial" font-size="9" text-anchor="middle">17β-hydroxy-5α-</text>
  <text x="700" y="315" font-family="Arial" font-size="9" text-anchor="middle">androstan-3-one</text>
  <text x="700" y="325" font-family="Arial" font-size="7" text-anchor="middle" fill="#666">(CHEBI:16330)</text>
  
  <!-- Connection line from both to final step -->
  <line x1="500" y1="335" x2="500" y2="370" stroke="#333" stroke-width="3"/>
  <line x1="700" y1="335" x2="700" y2="370" stroke="#333" stroke-width="3"/>
  <line x1="500" y1="370" x2="700" y2="370" stroke="#333" stroke-width="3"/>
  <line x1="600" y1="370" x2="600" y2="430" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Compartment boundary indication -->
  <line x1="70" y1="390" x2="730" y2="390" stroke="#666" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Reaction 6: Akr1c14 -->
  <rect x="580" y="440" width="40" height="20" fill="#beaed4" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="454" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">Akr1c14</text>
  
  <!-- Enzyme function annotation for Akr1c14 -->
  <text x="600" y="474" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">steroid dehydrogenase</text>
  
  <!-- Cofactors for Akr1c14 -->
  <rect x="630" y="435" width="40" height="32" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1"/>
  <text x="650" y="447" font-family="Arial" font-size="9" fill="#ca0020" text-anchor="middle">NADP⁺</text>
  <text x="650" y="457" font-family="Arial" font-size="9" fill="#0571b0" text-anchor="middle">→ NADPH</text>
  <text x="650" y="467" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">+ H⁺</text>
  
  <!-- Final product: androstane-3alpha,17beta-diol -->
  <ellipse cx="600" y="490" rx="40" ry="25" fill="#fee090" stroke="#333" stroke-width="2"/>
  <text x="600" y="485" font-family="Arial" font-size="10" text-anchor="middle">androstane-3α,</text>
  <text x="600" y="495" font-family="Arial" font-size="10" text-anchor="middle">17β-diol</text>
  <text x="600" y="505" font-family="Arial" font-size="7" text-anchor="middle" fill="#666">(CHEBI:18011)</text>
  
  <!-- Process label -->
  <rect x="250" y="525" width="300" height="25" rx="5" ry="5" fill="#1b9e77" fill-opacity="0.2" stroke="#1b9e77" stroke-width="1"/>
  <text x="400" y="543" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Androgen Biosynthetic Process</text>
  
  <!-- Legend -->
  <rect x="620" y="80" width="120" height="80" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="680" y="95" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">LEGEND</text>
  
  <rect x="630" y="105" width="15" height="10" fill="#7fc97f" stroke="#333" stroke-width="1"/>
  <text x="655" y="113" font-family="Arial" font-size="8" text-anchor="left">ER Enzymes</text>
  
  <rect x="630" y="120" width="15" height="10" fill="#beaed4" stroke="#333" stroke-width="1"/>
  <text x="655" y="128" font-family="Arial" font-size="8" text-anchor="left">Cytosolic Enzymes</text>
  
  <ellipse cx="637" y="138" rx="7" ry="5" fill="#fee090" stroke="#333" stroke-width="1"/>
  <text x="655" y="140" font-family="Arial" font-size="8" text-anchor="left">Metabolites</text>
  
  <text x="655" y="152" font-family="Arial" font-size="8" fill="#0571b0" text-anchor="left">NADPH</text>
  <text x="655" y="162" font-family="Arial" font-size="8" fill="#ca0020" text-anchor="left">NADP⁺</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>