<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Dendritic Cell -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#666" stroke-width="2" opacity="0.8"/>
  <text x="400" y="90" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Dendritic Cell</text>

  <!-- Phagocytic Vesicle -->
  <ellipse cx="250" cy="250" rx="120" ry="80" fill="#e6f2ff" stroke="#3385ff" stroke-width="2"/>
  <text x="250" y="230" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Phagocytic Vesicle</text>

  <!-- Vesicle Membrane -->
  <ellipse cx="250" cy="250" rx="110" ry="70" fill="none" stroke="#3385ff" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="250" y="190" font-family="Arial" font-size="12" text-anchor="middle">Phagocytic Vesicle Membrane</text>

  <!-- Antigen Protein -->
  <rect x="170" y="240" width="60" height="30" rx="5" ry="5" fill="#ffcccc" stroke="#ff6666" stroke-width="2"/>
  <text x="200" y="260" font-family="Arial" font-size="12" text-anchor="middle">Antigen</text>

  <!-- MPEG1 Protein -->
  <rect x="250" y="290" width="80" height="30" rx="15" ry="15" fill="#b3ffb3" stroke="#33cc33" stroke-width="2"/>
  <text x="290" y="310" font-family="Arial" font-size="12" text-anchor="middle">MPEG1</text>
  <text x="290" y="325" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(Q2M385)</text>

  <!-- MPEG1 Forms Pore -->
  <path d="M 280 290 C 270 280, 290 270, 280 260" stroke="#33cc33" stroke-width="2" fill="none"/>
  <path d="M 300 290 C 310 280, 290 270, 300 260" stroke="#33cc33" stroke-width="2" fill="none"/>
  <text x="350" y="285" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Wide pore channel activity</text>

  <!-- LGMN Protein -->
  <rect x="350" y="240" width="80" height="30" rx="15" ry="15" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="390" y="260" font-family="Arial" font-size="12" text-anchor="middle">LGMN</text>
  <text x="390" y="275" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(Q99538)</text>
  <text x="450" y="260" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Cysteine-type endopeptidase</text>

  <!-- Processed Antigen -->
  <rect x="270" y="350" width="70" height="30" rx="5" ry="5" fill="#ffcccc" stroke="#ff6666" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="305" y="370" font-family="Arial" font-size="12" text-anchor="middle">Processed</text>
  <text x="305" y="385" font-family="Arial" font-size="12" text-anchor="middle">Antigen</text>
  
  <!-- Cytosol -->
  <rect x="100" y="400" width="600" height="130" rx="20" ry="20" fill="#fff0e6" stroke="#ffb380" stroke-width="2"/>
  <text x="130" y="420" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Cytosol</text>

  <!-- Tapbp Protein -->
  <rect x="400" y="440" width="80" height="30" rx="15" ry="15" fill="#d9b3ff" stroke="#9933ff" stroke-width="2"/>
  <text x="440" y="460" font-family="Arial" font-size="12" text-anchor="middle">Tapbp</text>
  <text x="440" y="475" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(MGI:1201689)</text>
  <text x="510" y="460" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Peptide antigen binding</text>

  <!-- MHC Class I -->
  <rect x="550" y="440" width="80" height="30" rx="15" ry="15" fill="#ffff99" stroke="#ffcc00" stroke-width="2"/>
  <text x="590" y="460" font-family="Arial" font-size="12" text-anchor="middle">MHC I</text>
  <text x="590" y="475" font-family="Arial" font-size="10" text-anchor="middle" fill="#666" font-style="italic">Not in source</text>

  <!-- Process Labels -->
  <text x="150" y="340" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">Protein maturation</text>

  <text x="500" y="350" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">Antigen processing and presentation</text>
  <text x="500" y="365" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">via MHC class I</text>

  <text x="500" y="510" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">TAP-dependent antigen presentation</text>

  <!-- Arrows -->
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
  
  <!-- LGMN acts on Antigen -->
  <line x1="230" y1="250" x2="350" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- MPEG1 forms pore for antigen transport -->
  <path d="M 300 320 C 300 335, 300 335, 300 350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Processed antigen to Tapbp -->
  <path d="M 305 380 C 305 430, 380 430, 400 440" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Tapbp to MHC I -->
  <line x1="480" y1="455" x2="550" y2="455" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">MPEG1/perforin-2 Pore Formation for Antigen Cross-Presentation</text>

  <!-- Legend -->
  <rect x="50" y="580" width="700" height="60" rx="5" ry="5" fill="#f8f8f8" stroke="#666" stroke-width="1"/>
  <text x="55" y="595" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <!-- Protein Legend -->
  <rect x="60" y="605" width="20" height="20" rx="10" ry="10" fill="#b3ffb3" stroke="#33cc33" stroke-width="2"/>
  <text x="85" y="620" font-family="Arial" font-size="12">MPEG1 (Perforin-2)</text>
  
  <rect x="200" y="605" width="20" height="20" rx="10" ry="10" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="225" y="620" font-family="Arial" font-size="12">LGMN (Legumain)</text>
  
  <rect x="340" y="605" width="20" height="20" rx="10" ry="10" fill="#d9b3ff" stroke="#9933ff" stroke-width="2"/>
  <text x="365" y="620" font-family="Arial" font-size="12">Tapbp (Tapasin)</text>
  
  <rect x="460" y="605" width="20" height="20" rx="5" ry="5" fill="#ffcccc" stroke="#ff6666" stroke-width="2"/>
  <text x="485" y="620" font-family="Arial" font-size="12">Antigen</text>
  
  <rect x="570" y="605" width="20" height="20" rx="10" ry="10" fill="#ffff99" stroke="#ffcc00" stroke-width="2"/>
  <text x="595" y="620" font-family="Arial" font-size="12">MHC I (Not in source)</text>
</svg>