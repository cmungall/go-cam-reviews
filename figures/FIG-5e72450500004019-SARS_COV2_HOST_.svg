<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="10" y="10" width="780" height="580" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Cytoplasm label -->
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Cytoplasm</text>
  
  <!-- Nucleus -->
  <ellipse cx="250" cy="300" rx="150" ry="120" fill="#e6f2ff" stroke="#333" stroke-width="2"/>
  <text x="250" y="300" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Nucleus</text>
  
  <!-- Nuclear pore -->
  <circle cx="250" cy="180" r="15" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="300" y="170" font-family="Arial" font-size="14" text-anchor="middle">Nuclear Pore</text>
  
  <!-- Mitochondria -->
  <ellipse cx="600" cy="250" rx="100" ry="60" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <text x="600" y="250" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Mitochondrial Membrane</text>
  
  <!-- Host proteins -->
  <!-- Pattern recognition receptors -->
  <circle cx="100" cy="120" r="20" fill="#99cc99" stroke="#333" stroke-width="2"/>
  <text x="100" y="125" font-family="Arial" font-size="14" text-anchor="middle">IFIH1</text>
  
  <circle cx="160" cy="120" r="20" fill="#99cc99" stroke="#333" stroke-width="2"/>
  <text x="160" y="125" font-family="Arial" font-size="14" text-anchor="middle">RIG-I</text>
  
  <!-- MAVS -->
  <circle cx="500" cy="250" r="20" fill="#9999ff" stroke="#333" stroke-width="2"/>
  <text x="500" y="255" font-family="Arial" font-size="14" text-anchor="middle">MAVS</text>
  
  <!-- TRAF proteins -->
  <circle cx="430" cy="180" r="20" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="430" y="185" font-family="Arial" font-size="14" text-anchor="middle">TRAF3</text>
  
  <circle cx="430" cy="120" r="20" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="430" y="125" font-family="Arial" font-size="14" text-anchor="middle">TRAF6</text>
  
  <!-- TBK1 -->
  <circle cx="350" cy="150" r="20" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="350" y="155" font-family="Arial" font-size="14" text-anchor="middle">TBK1</text>
  
  <!-- IRF3 -->
  <circle cx="320" cy="220" r="20" fill="#ff99cc" stroke="#333" stroke-width="2"/>
  <text x="320" y="225" font-family="Arial" font-size="14" text-anchor="middle">IRF3</text>
  
  <!-- IRF3 in nucleus -->
  <circle cx="250" cy="250" r="20" fill="#ff99cc" stroke="#333" stroke-width="2"/>
  <text x="250" y="255" font-family="Arial" font-size="14" text-anchor="middle">IRF3</text>
  
  <!-- TRIM25 -->
  <circle cx="230" cy="120" r="20" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="230" y="125" font-family="Arial" font-size="14" text-anchor="middle">TRIM25</text>
  
  <!-- TOMM70 -->
  <circle cx="600" cy="320" r="20" fill="#cccc99" stroke="#333" stroke-width="2"/>
  <text x="600" y="325" font-family="Arial" font-size="14" text-anchor="middle">TOMM70</text>
  
  <!-- Viral proteins -->
  <!-- nsp1 -->
  <rect x="200" y="320" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="217" y="342" font-family="Arial" font-size="14" text-anchor="middle">nsp1</text>
  
  <!-- nsp3 -->
  <rect x="180" y="120" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="197" y="142" font-family="Arial" font-size="14" text-anchor="middle">nsp3</text>
  
  <!-- nsp6 -->
  <rect x="370" y="100" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="387" y="122" font-family="Arial" font-size="14" text-anchor="middle">nsp6</text>
  
  <!-- nsp12 -->
  <rect x="280" y="180" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="297" y="202" font-family="Arial" font-size="14" text-anchor="middle">nsp12</text>
  
  <!-- nsp13 -->
  <rect x="370" y="180" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="387" y="202" font-family="Arial" font-size="14" text-anchor="middle">nsp13</text>
  
  <!-- nsp16 -->
  <rect x="160" y="220" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="177" y="242" font-family="Arial" font-size="14" text-anchor="middle">nsp16</text>
  
  <!-- N protein -->
  <rect x="110" y="180" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="127" y="202" font-family="Arial" font-size="14" text-anchor="middle">N</text>
  
  <!-- M protein -->
  <rect x="470" y="300" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="487" y="322" font-family="Arial" font-size="14" text-anchor="middle">M</text>
  
  <!-- ORF6 -->
  <rect x="220" y="180" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="237" y="202" font-family="Arial" font-size="14" text-anchor="middle">ORF6</text>
  
  <!-- ORF9b -->
  <rect x="550" y="290" width="35" height="35" fill="#ff6666" stroke="#333" stroke-width="2"/>
  <text x="567" y="312" font-family="Arial" font-size="14" text-anchor="middle">ORF9b</text>
  
  <!-- Interaction arrows -->
  <!-- RIG-I/IFIH1 to MAVS -->
  <path d="M160,140 Q300,200 480,250" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M100,140 Q300,220 480,250" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- MAVS to TRAF3/6 -->
  <path d="M480,235 L450,200" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M480,235 L450,140" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- TRAF3/6 to TBK1 -->
  <path d="M410,180 L370,155" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M410,120 L370,140" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- TBK1 to IRF3 -->
  <path d="M335,165 L325,200" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- IRF3 to nucleus -->
  <path d="M310,235 L270,245" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- TRIM25 to RIG-I -->
  <path d="M210,120 L180,120" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- Viral inhibition arrows (red) -->
  <!-- nsp3 to TRIM25 -->
  <path d="M180,120 L210,120" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  
  <!-- nsp6/nsp13 to TBK1 -->
  <path d="M370,120 L355,135" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  <path d="M370,180 L365,165" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  
  <!-- nsp12/ORF6 to IRF3 -->
  <path d="M315,180 L320,200" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  <path d="M255,180 L300,210" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  
  <!-- N protein to TRIM25 -->
  <path d="M145,180 L210,135" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  
  <!-- M protein to MAVS -->
  <path d="M470,300 L490,270" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  
  <!-- ORF9b to TOMM70 -->
  <path d="M550,305 L580,320" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  
  <!-- nsp16 to mRNA export -->
  <text x="190" y="260" font-family="Arial" font-size="14" text-anchor="middle">mRNA export</text>
  <path d="M177,220 L190,240" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  
  <!-- nsp1 to Translation -->
  <text x="265" y="350" font-family="Arial" font-size="14" text-anchor="middle">Translation Repression</text>
  <path d="M235,320 L265,330" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  
  <!-- Process Annotations -->
  <text x="400" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Viral Recognition</text>
  <text x="430" y="220" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Signal Transduction</text>
  <text x="250" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Gene Expression Control</text>
  <text x="600" y="190" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Mitochondrial Targeting</text>
  
  <!-- Legend -->
  <rect x="650" y="390" width="140" height="200" fill="white" stroke="#333" stroke-width="1"/>
  <text x="720" y="410" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Host proteins -->
  <circle cx="670" cy="430" r="10" fill="#99cc99" stroke="#333" stroke-width="1"/>
  <text x="745" y="435" font-family="Arial" font-size="12" text-anchor="start">Pattern recognition receptors</text>
  
  <circle cx="670" cy="450" r="10" fill="#9999ff" stroke="#333" stroke-width="1"/>
  <text x="745" y="455" font-family="Arial" font-size="12" text-anchor="start">Signaling adaptor</text>
  
  <circle cx="670" cy="470" r="10" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="745" y="475" font-family="Arial" font-size="12" text-anchor="start">E3 ubiquitin ligases</text>
  
  <circle cx="670" cy="490" r="10" fill="#cc99ff" stroke="#333" stroke-width="1"/>
  <text x="745" y="495" font-family="Arial" font-size="12" text-anchor="start">Kinase</text>
  
  <circle cx="670" cy="510" r="10" fill="#ff99cc" stroke="#333" stroke-width="1"/>
  <text x="745" y="515" font-family="Arial" font-size="12" text-anchor="start">Transcription factor</text>
  
  <circle cx="670" cy="530" r="10" fill="#cccc99" stroke="#333" stroke-width="1"/>
  <text x="745" y="535" font-family="Arial" font-size="12" text-anchor="start">Mitochondrial adaptor</text>
  
  <!-- Viral proteins -->
  <rect x="665" y="550" width="10" height="10" fill="#ff6666" stroke="#333" stroke-width="1"/>
  <text x="745" y="555" font-family="Arial" font-size="12" text-anchor="start">SARS-CoV-2 proteins</text>
  
  <!-- Arrows -->
  <line x1="660" y1="570" x2="680" y2="570" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="745" y="575" font-family="Arial" font-size="12" text-anchor="start">Activation</text>
  
  <line x1="660" y1="590" x2="680" y2="590" stroke="#ff0000" stroke-width="2.5" marker-end="url(#redarrowhead)"/>
  <text x="745" y="595" font-family="Arial" font-size="12" text-anchor="start">Inhibition</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="redarrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0000"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="580" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">SARS-CoV-2 Suppression of Host Antiviral Innate Immune Response</text>
</svg>