<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f8f8f8" stroke="#999" stroke-width="2" />
  
  <!-- Plasma membrane -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="none" stroke="#666" stroke-width="4" stroke-dasharray="5,3" />
  <!-- Enhanced membrane - additional highlighting -->
  <ellipse cx="400" cy="300" rx="352" ry="252" fill="none" stroke="#8899aa" stroke-width="1" />
  <ellipse cx="400" cy="300" rx="348" ry="248" fill="none" stroke="#8899aa" stroke-width="1" />
  <text x="700" y="300" font-family="Arial" font-size="14" fill="#666" font-weight="bold">Plasma membrane</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="100" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#444">Cytoplasm</text>
  
  <!-- MLST8 -->
  <rect x="300" y="180" width="80" height="40" rx="10" ry="10" fill="#8dd3c7" stroke="#333" stroke-width="2" />
  <text x="340" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MLST8</text>
  
  <!-- MTOR -->
  <rect x="370" y="280" width="80" height="40" rx="10" ry="10" fill="#fb8072" stroke="#333" stroke-width="2" />
  <text x="410" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MTOR</text>
  
  <!-- MAPKAP1 -->
  <rect x="240" y="320" width="80" height="40" rx="10" ry="10" fill="#80b1d3" stroke="#333" stroke-width="2" />
  <text x="280" y="345" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MAPKAP1</text>
  
  <!-- RICTOR -->
  <rect x="480" y="320" width="80" height="40" rx="10" ry="10" fill="#b3de69" stroke="#333" stroke-width="2" />
  <text x="520" y="345" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RICTOR</text>
  
  <!-- PDPK1 -->
  <rect x="370" y="380" width="80" height="40" rx="10" ry="10" fill="#fdb462" stroke="#333" stroke-width="2" />
  <text x="410" y="405" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PDPK1</text>
  
  <!-- AKT1 -->
  <rect x="370" y="480" width="80" height="40" rx="10" ry="10" fill="#bc80bd" stroke="#333" stroke-width="2" />
  <text x="410" y="505" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">AKT1</text>
  
  <!-- MLST8 to MTOR -->
  <line x1="350" y1="220" x2="390" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="355" y="255" font-family="Arial" font-size="12" fill="#333" font-weight="bold">+</text>
  
  <!-- MLST8 to MAPKAP1 -->
  <line x1="320" y1="220" x2="280" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="285" y="260" font-family="Arial" font-size="12" fill="#333" font-weight="bold">+</text>
  
  <!-- MAPKAP1 to MTOR -->
  <line x1="320" y1="330" x2="370" y2="310" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="335" y="330" font-family="Arial" font-size="12" fill="#333" font-weight="bold">+</text>
  
  <!-- RICTOR to MTOR -->
  <line x1="480" y1="330" x2="450" y2="310" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="450" y="330" font-family="Arial" font-size="12" fill="#333" font-weight="bold">+</text>
  
  <!-- MTOR to PDPK1 -->
  <line x1="410" y1="320" x2="410" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="415" y="350" font-family="Arial" font-size="12" fill="#333" font-weight="bold">+</text>
  
  <!-- PDPK1 to AKT1 -->
  <line x1="410" y1="420" x2="410" y2="480" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="415" y="450" font-family="Arial" font-size="12" fill="#333" font-weight="bold">+</text>
  
  <!-- Biological process labels -->
  <rect x="410" y="440" width="130" height="20" rx="5" ry="5" fill="#f9f9f9" stroke="#666" stroke-width="1" />
  <text x="475" y="455" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">PI3K/AKT signaling</text>
  
  <!-- TORC2 signaling area -->
  <path d="M490,270 Q550,250 610,270 Q670,290 610,310 Q550,330 490,310 Z" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="3,2" />
  <rect x="550" y="280" width="120" height="20" rx="5" ry="5" fill="#f9f9f9" stroke="#666" stroke-width="1" />
  <text x="610" y="295" font-family="Arial" font-size="14" fill="#444" font-weight="bold" text-anchor="middle">TORC2 signaling</text>
  
  <!-- Protein function labels -->
  <rect x="455" y="255" width="95" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#666" stroke-width="1" />
  <text x="502" y="266" font-family="Arial" font-size="10" fill="#444" text-anchor="middle">protein ser/thr</text>
  <text x="502" y="278" font-family="Arial" font-size="10" fill="#444" text-anchor="middle">kinase activity</text>
  
  <rect x="240" y="375" width="95" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#666" stroke-width="1" />
  <text x="287" y="386" font-family="Arial" font-size="10" fill="#444" text-anchor="middle">enzyme-substrate</text>
  <text x="287" y="398" font-family="Arial" font-size="10" fill="#444" text-anchor="middle">adaptor activity</text>
  
  <rect x="520" y="375" width="95" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#666" stroke-width="1" />
  <text x="567" y="386" font-family="Arial" font-size="10" fill="#444" text-anchor="middle">enzyme-substrate</text>
  <text x="567" y="398" font-family="Arial" font-size="10" fill="#444" text-anchor="middle">adaptor activity</text>
  
  <rect x="300" y="145" width="110" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#666" stroke-width="1" />
  <text x="355" y="159" font-family="Arial" font-size="10" fill="#444" text-anchor="middle">protein-macromolecule</text>
  <text x="355" y="171" font-family="Arial" font-size="10" fill="#444" text-anchor="middle">adaptor activity</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">mTORC2 Signaling Pathway (Human)</text>
  
  <!-- Legend box -->
  <rect x="600" y="500" width="180" height="80" rx="5" ry="5" fill="#f9f9f9" stroke="#666" stroke-width="1" />
  <text x="690" y="520" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="610" y="530" width="20" height="15" fill="#f9f9f9" stroke="#666" stroke-width="1" />
  <text x="645" y="542" font-family="Arial" font-size="12" fill="#333">Function label</text>
  
  <text x="645" y="562" font-family="Arial" font-size="12" fill="#333">+  Positive regulation</text>
  
  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>