<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Cell membrane -->
  <path d="M 50,300 C 100,200 700,150 750,300 C 700,450 100,400 50,300" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="5,3"/>
  
  <!-- Cytosol label -->
  <text x="150" y="150" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Plasma membrane label -->
  <text x="580" y="250" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Plasma membrane (GO:0005886)</text>
  
  <!-- ZDHHC5 -->
  <rect x="100" y="250" width="80" height="40" rx="5" fill="#8ecae6" stroke="#333" stroke-width="2"/>
  <text x="110" y="275" font-family="Arial" font-weight="bold" font-size="14">ZDHHC5</text>
  
  <!-- ZDHHC9 -->
  <rect x="100" y="330" width="80" height="40" rx="5" fill="#8ecae6" stroke="#333" stroke-width="2"/>
  <text x="110" y="355" font-family="Arial" font-weight="bold" font-size="14">ZDHHC9</text>
  
  <!-- Gsdmd inactive -->
  <rect x="250" y="290" width="80" height="40" rx="5" fill="#90be6d" stroke="#333" stroke-width="2"/>
  <text x="260" y="315" font-family="Arial" font-weight="bold" font-size="14">GSDMD</text>
  
  <!-- Palmitoylation arrows -->
  <path d="M 180,270 L 240,290" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 180,340 L 240,320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="160" y="265" font-family="Arial" font-size="12" fill="#333">Palmitoylation of GSDMD</text>
  <text x="180" y="355" font-family="Arial" font-size="12" fill="#333">GO:0019706</text>
  
  <!-- Casp4 -->
  <rect x="250" y="200" width="80" height="40" rx="5" fill="#f4a261" stroke="#333" stroke-width="2"/>
  <text x="265" y="225" font-family="Arial" font-weight="bold" font-size="14">CASP4</text>
  
  <!-- Cleaved GSDMD -->
  <rect x="380" y="290" width="100" height="40" rx="5" fill="#90be6d" stroke="#333" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="385" y="315" font-family="Arial" font-weight="bold" font-size="14">Cleaved GSDMD</text>
  
  <!-- Cleavage arrow -->
  <path d="M 290,240 L 290,290" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="265" font-family="Arial" font-size="12" fill="#333">Proteolytic cleavage</text>
  <text x="300" y="280" font-family="Arial" font-size="12" fill="#333">GO:0004197</text>
  
  <!-- Active cleaved GSDMD -->
  <path d="M 330,310 L 370,310" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="330" font-family="Arial" font-size="12" fill="#333">Protein maturation (GO:0051604)</text>
  
  <!-- NLRP3 and inflammasome -->
  <rect x="150" y="400" width="80" height="40" rx="5" fill="#e9c46a" stroke="#333" stroke-width="2"/>
  <text x="165" y="425" font-family="Arial" font-weight="bold" font-size="14">NLRP3</text>
  
  <!-- NLRP3 to membrane -->
  <path d="M 190,400 C 190,370 300,370 380,320" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
  <text x="220" y="365" font-family="Arial" font-size="12" fill="#333">Signaling adaptor activity</text>
  <text x="250" y="380" font-family="Arial" font-size="12" fill="#333">GO:0035591</text>
  
  <!-- PIP2 binding -->
  <path d="M 480,290 C 520,260 550,250 600,290" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="250" font-family="Arial" font-size="12" fill="#333">PIP2 binding at membrane</text>
  <text x="500" y="265" font-family="Arial" font-size="12" fill="#333">GO:0005546</text>
  
  <!-- Membrane pore formation -->
  <path d="M 650,270 Q 650,300 650,330" fill="none" stroke="#e76f51" stroke-width="6"/>
  <path d="M 670,270 Q 670,300 670,330" fill="none" stroke="#e76f51" stroke-width="6"/>
  <path d="M 690,270 Q 690,300 690,330" fill="none" stroke="#e76f51" stroke-width="6"/>
  <text x="640" y="355" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Pore formation</text>
  <text x="640" y="370" font-family="Arial" font-size="12" fill="#333">GO:0022829</text>
  
  <!-- Cell death label -->
  <text x="620" y="420" font-family="Arial" font-weight="bold" font-size="18" fill="#e76f51">Pyroptotic Cell Death</text>
  <text x="650" y="440" font-family="Arial" font-size="12" fill="#333">GO:0141201</text>
  
  <!-- Inflammasome complex label -->
  <text x="100" y="470" font-family="Arial" font-size="14" fill="#333" font-weight="bold">NLRP3 Inflammasome Complex</text>
  <text x="130" y="485" font-family="Arial" font-size="12" fill="#333">GO:0044546</text>
  
  <!-- Positive regulation label -->
  <path d="M 200,440 C 300,440 400,430 550,425" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrowhead)"/>
  <text x="250" y="455" font-family="Arial" font-size="12" fill="#333">Positive regulation of pyroptotic response (GO:0140639)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-weight="bold" font-size="20" text-anchor="middle" fill="#333">Gsdmd Palmitoylation by Zdhhc5 and Zdhhc9 Promotes Pyroptosis</text>
  <text x="400" y="55" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic" fill="#333">Mouse Model</text>
  
  <!-- Legend -->
  <rect x="30" y="520" width="740" height="60" rx="5" fill="#f8f9fa" stroke="#333" stroke-width="1"/>
  <text x="40" y="540" font-family="Arial" font-weight="bold" font-size="14" fill="#333">Legend:</text>
  
  <!-- Legend items -->
  <rect x="110" y="530" width="20" height="15" fill="#8ecae6" stroke="#333" stroke-width="1"/>
  <text x="135" y="542" font-family="Arial" font-size="12" fill="#333">Palmitoyl-transferases (ZDHHC5, ZDHHC9)</text>
  
  <rect x="340" y="530" width="20" height="15" fill="#90be6d" stroke="#333" stroke-width="1"/>
  <text x="365" y="542" font-family="Arial" font-size="12" fill="#333">GSDMD and forms</text>
  
  <rect x="480" y="530" width="20" height="15" fill="#f4a261" stroke="#333" stroke-width="1"/>
  <text x="505" y="542" font-family="Arial" font-size="12" fill="#333">CASP4</text>
  
  <rect x="550" y="530" width="20" height="15" fill="#e9c46a" stroke="#333" stroke-width="1"/>
  <text x="575" y="542" font-family="Arial" font-size="12" fill="#333">NLRP3</text>
  
  <line x1="640" y1="537" x2="660" y2="537" stroke="#e76f51" stroke-width="5"/>
  <text x="665" y="542" font-family="Arial" font-size="12" fill="#333">Membrane pores</text>
</svg>