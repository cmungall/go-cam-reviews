<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell components -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" stroke="black" stroke-width="2"/>
  
  <!-- Cell membrane -->
  <path d="M 50 200 Q 400 160 750 200 Q 400 240 50 200" fill="#d1e7dd" stroke="#495057" stroke-width="3"/>
  
  <!-- Extracellular space label -->
  <text x="400" y="130" font-family="Arial" font-size="16" text-anchor="middle" fill="#495057">Extracellular Space (GO:0005615)</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="270" font-family="Arial" font-size="16" text-anchor="middle" fill="#495057">Cytoplasm (GO:0005737)</text>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="450" rx="150" ry="100" fill="#cfe2ff" stroke="#495057" stroke-width="3"/>
  <text x="400" y="460" font-family="Arial" font-size="16" text-anchor="middle" fill="#495057">Nucleus (GO:0005634)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#212529" />
    </marker>
  </defs>
  
  <!-- Molecular Components -->
  <!-- EPO in extracellular space -->
  <circle cx="400" cy="80" r="25" fill="#ff9999" stroke="#495057" stroke-width="2"/>
  <text x="400" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="#212529">EPO</text>
  
  <!-- EPOR in membrane -->
  <rect x="380" y="180" width="40" height="60" rx="5" ry="5" fill="#ffcc99" stroke="#495057" stroke-width="2"/>
  <text x="400" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#212529">EPOR</text>
  
  <!-- JAK2 -->
  <circle cx="400" cy="290" r="20" fill="#99ccff" stroke="#495057" stroke-width="2"/>
  <text x="400" y="295" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">JAK2</text>
  
  <!-- STAT5B in cytoplasm -->
  <rect x="470" y="320" width="50" height="30" rx="5" ry="5" fill="#c3e6cb" stroke="#495057" stroke-width="2"/>
  <text x="495" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">STAT5B</text>
  
  <!-- STAT5B in nucleus -->
  <rect x="410" y="420" width="50" height="30" rx="5" ry="5" fill="#c3e6cb" stroke="#495057" stroke-width="2"/>
  <text x="435" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">STAT5B</text>
  
  <!-- SOCS2 -->
  <polygon points="250,300 270,280 290,300 270,320" fill="#ffeeba" stroke="#495057" stroke-width="2"/>
  <text x="270" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">SOCS2</text>
  
  <!-- CUL5 -->
  <rect x="170" y="350" width="40" height="30" rx="5" ry="5" fill="#fdfdfe" stroke="#495057" stroke-width="2"/>
  <text x="190" y="370" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">CUL5</text>
  
  <!-- RNF7 -->
  <circle cx="320" cy="350" r="20" fill="#d6d8db" stroke="#495057" stroke-width="2"/>
  <text x="320" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">RNF7</text>
  
  <!-- Proteasome (implicit component) - made more detailed -->
  <rect x="230" y="420" width="80" height="40" rx="10" ry="10" fill="#e0e0e0" stroke="#495057" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="240" y="430" width="60" height="20" rx="5" ry="5" fill="#c0c0c0" stroke="#495057" stroke-width="1"/>
  <text x="270" y="445" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#212529">Proteasome</text>
  
  <!-- Arrows and Interactions - reduced overlap -->
  <!-- EPO binds EPOR -->
  <path d="M 400 105 L 400 180" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="150" font-family="Arial" font-size="10" fill="#212529">Binding</text>
  
  <!-- EPOR activates JAK2 -->
  <path d="M 400 240 L 400 270" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="425" y="255" font-family="Arial" font-size="10" fill="#212529">Activation</text>
  
  <!-- JAK2 phosphorylates STAT5B -->
  <path d="M 420 290 L 470 320" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="300" font-family="Arial" font-size="10" fill="#212529">Phosphorylation</text>
  
  <!-- STAT5B translocation to nucleus -->
  <path d="M 495 350 L 435 420" stroke="#212529" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="485" y="390" font-family="Arial" font-size="10" fill="#212529">Translocation</text>
  
  <!-- JAK2 activates SOCS2 (feedback) -->
  <path d="M 380 290 L 290 300" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="330" y="285" font-family="Arial" font-size="10" fill="#212529">Induces</text>
  
  <!-- SOCS2, CUL5, RNF7 complex formation -->
  <path d="M 250 300 L 190 350" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 290 300 L 320 330" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="320" font-family="Arial" font-size="10" fill="#212529">Complex</text>
  <text x="325" y="320" font-family="Arial" font-size="10" fill="#212529">Formation</text>
  
  <!-- ECS complex targets EPOR for ubiquitination - adjusted path for clarity -->
  <path d="M 270 280 C 320 260 350 240 380 230" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="315" y="250" font-family="Arial" font-size="10" fill="#212529">Ubiquitination</text>
  
  <!-- EPOR degradation - adjusted path for clarity -->
  <path d="M 370 210 C 310 260 290 320 270 420" stroke="#212529" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="300" y="340" font-family="Arial" font-size="10" fill="#212529">Degradation</text>
  
  <!-- Legend -->
  <rect x="570" y="380" width="220" height="200" fill="white" stroke="#495057" stroke-width="1"/>
  <text x="680" y="400" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Legend</text>
  
  <circle cx="590" cy="420" r="8" fill="#ff9999" stroke="#495057" stroke-width="1"/>
  <text x="610" y="425" font-family="Arial" font-size="12" fill="#212529">EPO (P01588)</text>
  
  <rect x="585" y="440" width="16" height="16" rx="2" ry="2" fill="#ffcc99" stroke="#495057" stroke-width="1"/>
  <text x="610" y="453" font-family="Arial" font-size="12" fill="#212529">EPOR (P19235)</text>
  
  <circle cx="590" cy="470" r="8" fill="#99ccff" stroke="#495057" stroke-width="1"/>
  <text x="610" y="475" font-family="Arial" font-size="12" fill="#212529">JAK2 (O60674)</text>
  
  <rect x="585" y="490" width="16" height="16" rx="2" ry="2" fill="#c3e6cb" stroke="#495057" stroke-width="1"/>
  <text x="610" y="503" font-family="Arial" font-size="12" fill="#212529">STAT5B (P51692)</text>
  
  <polygon points="582,520 590,512 598,520 590,528" fill="#ffeeba" stroke="#495057" stroke-width="1"/>
  <text x="610" y="525" font-family="Arial" font-size="12" fill="#212529">SOCS2 (O14508)</text>
  
  <rect x="585" y="540" width="16" height="12" rx="2" ry="2" fill="#fdfdfe" stroke="#495057" stroke-width="1"/>
  <text x="610" y="550" font-family="Arial" font-size="12" fill="#212529">CUL5 (Q93034)</text>
  
  <circle cx="590" cy="565" r="8" fill="#d6d8db" stroke="#495057" stroke-width="1"/>
  <text x="610" y="570" font-family="Arial" font-size="12" fill="#212529">RNF7 (Q9UBF6)</text>
  
  <rect x="585" y="585" width="16" height="10" rx="2" ry="2" fill="#e0e0e0" stroke="#495057" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="610" y="590" font-family="Arial" font-size="10" fill="#212529">Proteasome (implicit)</text>
</svg>