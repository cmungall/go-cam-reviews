<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f8f8f8" stroke="#333333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <circle cx="500" cy="320" r="120" fill="#e6e6fa" stroke="#333333" stroke-width="2"/>
  <text x="500" y="250" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Nucleus</text>
  
  <!-- Golgi membrane -->
  <path d="M200,240 C220,220 240,230 260,220 C280,210 300,220 320,210 C340,200 360,210 380,200" stroke="#996633" stroke-width="3" fill="none"/>
  <path d="M200,250 C220,230 240,240 260,230 C280,220 300,230 320,220 C340,210 360,220 380,210" stroke="#996633" stroke-width="3" fill="none"/>
  <path d="M200,260 C220,240 240,250 260,240 C280,230 300,240 320,230 C340,220 360,230 380,220" stroke="#996633" stroke-width="3" fill="none"/>
  <text x="290" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Golgi Membrane</text>
  
  <!-- UL138 protein in Golgi -->
  <rect x="250" y="215" width="80" height="30" rx="5" ry="5" fill="#ff9999" stroke="#333333" stroke-width="1.5"/>
  <text x="290" y="235" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">UL138</text>
  <text x="290" y="247" text-anchor="middle" font-family="Arial" font-size="8">(F5HGQ8)</text>
  
  <!-- WDR48 in cytoplasm -->
  <rect x="350" y="300" width="80" height="30" rx="5" ry="5" fill="#99cc99" stroke="#333333" stroke-width="1.5"/>
  <text x="390" y="320" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">WDR48</text>
  <text x="390" y="332" text-anchor="middle" font-family="Arial" font-size="8">(Q8TAF3)</text>
  
  <!-- USP1 in nucleus -->
  <rect x="450" y="280" width="80" height="30" rx="5" ry="5" fill="#9999ff" stroke="#333333" stroke-width="1.5"/>
  <text x="490" y="300" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">USP1</text>
  <text x="490" y="312" text-anchor="middle" font-family="Arial" font-size="8">(O94782)</text>
  
  <!-- STAT1 in nucleus -->
  <rect x="550" y="340" width="80" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#333333" stroke-width="1.5"/>
  <text x="590" y="360" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">STAT1</text>
  <text x="590" y="372" text-anchor="middle" font-family="Arial" font-size="8">(P42224)</text>
  
  <!-- DNA target region -->
  <path d="M560,390 C570,395 580,390 590,395 C600,400 610,395 620,400" stroke="#333333" stroke-width="2" fill="none"/>
  <path d="M560,400 C570,405 580,400 590,405 C600,410 610,405 620,410" stroke="#333333" stroke-width="2" fill="none"/>
  <text x="590" y="425" text-anchor="middle" font-family="Arial" font-size="10">DNA</text>
  
  <!-- Interactions and arrows -->
  <line x1="290" y1="245" x2="350" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="300" x2="450" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="530" y1="290" x2="550" y2="340" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="370" x2="590" y2="390" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Process labels -->
  <text x="300" y="270" text-anchor="middle" font-family="Arial" font-size="10">Molecular adaptor</text>
  <text x="300" y="282" text-anchor="middle" font-family="Arial" font-size="10">activity</text>
  
  <text x="420" y="270" text-anchor="middle" font-family="Arial" font-size="10">Deubiquitinase</text>
  <text x="420" y="282" text-anchor="middle" font-family="Arial" font-size="10">activator activity</text>
  
  <text x="520" y="330" text-anchor="middle" font-family="Arial" font-size="10">Deubiquitinase</text>
  <text x="520" y="342" text-anchor="middle" font-family="Arial" font-size="10">activity</text>
  
  <text x="660" y="355" text-anchor="middle" font-family="Arial" font-size="10">DNA-binding</text>
  <text x="660" y="367" text-anchor="middle" font-family="Arial" font-size="10">transcription factor</text>
  
  <!-- Interaction labels -->
  <rect x="320" y="265" width="100" height="15" fill="white" fill-opacity="0.8" stroke="none"/>
  <text x="320" y="275" font-family="Arial" font-size="10" font-weight="bold" transform="rotate(-45, 320, 275)">Positively regulates</text>
  
  <rect x="440" y="270" width="60" height="15" fill="white" fill-opacity="0.8" stroke="none"/>
  <text x="440" y="280" font-family="Arial" font-size="10" font-weight="bold" transform="rotate(-15, 440, 280)">Activates</text>
  
  <rect x="540" y="310" width="100" height="15" fill="white" fill-opacity="0.8" stroke="none"/>
  <text x="540" y="320" font-family="Arial" font-size="10" font-weight="bold" transform="rotate(45, 540, 320)">Positively regulates</text>
  
  <rect x="600" y="375" width="40" height="15" fill="white" fill-opacity="0.8" stroke="none"/>
  <text x="610" y="385" font-family="Arial" font-size="10" font-weight="bold">Binds</text>
  
  <!-- Cellular compartment labels -->
  <text x="250" y="400" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm</text>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">HCMV UL138 Sustains STAT1 Activation During Viral Latency</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial" font-size="14">Human Cytomegalovirus (HCMV)</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
  
  <!-- JAK-STAT pathway label -->
  <text x="400" y="520" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">Positive regulation of JAK-STAT signaling pathway (GO:0046427)</text>
  
  <!-- Legend -->
  <rect x="60" y="470" width="280" height="115" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="180" y="485" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
  
  <rect x="70" y="495" width="15" height="15" fill="#ff9999" stroke="#333333" stroke-width="1"/>
  <text x="95" y="507" text-anchor="start" font-family="Arial" font-size="10">Viral protein (HCMV UL138)</text>
  
  <rect x="70" y="515" width="15" height="15" fill="#99cc99" stroke="#333333" stroke-width="1"/>
  <text x="95" y="527" text-anchor="start" font-family="Arial" font-size="10">Human protein in cytoplasm</text>
  
  <rect x="70" y="535" width="15" height="15" fill="#9999ff" stroke="#333333" stroke-width="1"/>
  <text x="95" y="547" text-anchor="start" font-family="Arial" font-size="10">Human protein in nucleus</text>
  
  <rect x="70" y="555" width="15" height="15" fill="#ffcc99" stroke="#333333" stroke-width="1"/>
  <text x="95" y="567" text-anchor="start" font-family="Arial" font-size="10">STAT1 transcription factor</text>
  
  <line x1="200" y1="507" x2="215" y2="507" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="510" text-anchor="start" font-family="Arial" font-size="10">Positive regulation/activation</text>
  
  <text x="70" y="580" text-anchor="start" font-family="Arial" font-size="9" font-style="italic">Note: During viral latency, UL138 enhances STAT1 activation through a cascade involving WDR48 and USP1.</text>
</svg>