<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Cell nucleus -->
  <ellipse cx="300" cy="300" rx="120" ry="100" fill="#e6f2ff" stroke="#333" stroke-width="2"/>
  <text x="300" y="300" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Nucleus</text>
  
  <!-- Golgi apparatus -->
  <path d="M500,200 C530,180 560,200 580,180 C600,160 620,180 640,170 C580,220 540,240 500,200 Z" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <path d="M500,220 C530,200 560,220 580,200 C600,180 620,200 640,190 C580,240 540,260 500,220 Z" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <path d="M500,240 C530,220 560,240 580,220 C600,200 620,220 640,210 C580,260 540,280 500,240 Z" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <text x="570" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Golgi apparatus</text>
  
  <!-- ZDHHC18 protein in Golgi -->
  <circle cx="550" cy="210" r="30" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="550" y="213" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">ZDHHC18</text>
  <text x="550" y="230" text-anchor="middle" font-family="Arial" font-size="11">Palmitoyltransferase</text>
  
  <!-- Cytosol label -->
  <text x="400" y="90" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Cytosol</text>
  
  <!-- cGAS protein in cytosol -->
  <circle cx="450" cy="350" r="35" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="450" y="353" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">cGAS</text>
  <text x="450" y="370" text-anchor="middle" font-family="Arial" font-size="11">DNA sensor</text>
  
  <!-- Double-stranded DNA -->
  <path d="M350,400 C370,380 390,390 410,370 C430,350 450,360 470,340" stroke="#663300" stroke-width="6" fill="none"/>
  <path d="M350,410 C370,390 390,400 410,380 C430,360 450,370 470,350" stroke="#663300" stroke-width="6" fill="none"/>
  <text x="410" y="430" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">dsDNA</text>
  
  <!-- cGAS binding to DNA -->
  <line x1="450" y1="385" x2="420" y2="395" stroke="#333" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="400" y="380" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">DNA binding</text>
  
  <!-- cGAS molecular condensate -->
  <ellipse cx="550" cy="400" rx="65" ry="45" fill="#ccffcc" fill-opacity="0.6" stroke="#009900" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="550" y="395" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Molecular</text>
  <text x="550" y="415" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">condensate</text>
  <line x1="485" y1="370" x2="515" y2="380" stroke="#333" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="520" y="365" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">Scaffold activity</text>
  
  <!-- Palmitoylation arrow from ZDHHC18 to cGAS -->
  <path d="M535,235 C500,280 480,300 470,320" stroke="#ff0000" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <circle cx="500" cy="280" r="18" fill="#ffcc00" stroke="#333" stroke-width="2"/>
  <text x="500" y="285" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">P</text>
  <text x="485" y="240" text-anchor="middle" font-family="Arial" font-size="16" fill="#ff0000" font-weight="bold">Palmitoylation</text>
  
  <!-- cGAS/STING pathway indication -->
  <path d="M550,445 C600,465 650,445 670,485" stroke="#009900" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="625" y="475" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#009900">cGAS/STING pathway</text>
  
  <!-- Negative regulation indication -->
  <path d="M520,260 C490,290 470,310 460,320" stroke="#ff0000" stroke-width="5" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="7,3"/>
  <text x="480" y="300" text-anchor="middle" font-family="Arial" font-size="16" fill="#ff0000" font-weight="bold">Negative regulation</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="20" y="480" width="270" height="110" fill="white" stroke="#333" stroke-width="2"/>
  <text x="30" y="500" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  
  <!-- Proteins -->
  <text x="30" y="520" font-family="Arial" font-size="14" font-weight="bold" text-decoration="underline">Proteins:</text>
  <circle cx="40" cy="535" r="8" fill="#ff9999"/>
  <text x="55" y="540" font-family="Arial" font-size="14">ZDHHC18 (UniProtKB:Q9NUE0)</text>
  <circle cx="40" cy="555" r="8" fill="#99ccff"/>
  <text x="55" y="560" font-family="Arial" font-size="14">cGAS (UniProtKB:Q8N884)</text>
  
  <!-- Cellular components -->
  <text x="30" y="575" font-family="Arial" font-size="14" font-weight="bold" text-decoration="underline">Cellular components:</text>
  <rect x="40" y="582" width="12" height="12" fill="#ffcccc"/>
  <text x="60" y="592" font-family="Arial" font-size="14">Golgi apparatus</text>
  <rect x="165" y="582" width="12" height="12" fill="#e6f2ff"/>
  <text x="185" y="592" font-family="Arial" font-size="14">Nucleus</text>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Regulation of cGAS Activity by ZDHHC18 (Human)</text>
</svg>