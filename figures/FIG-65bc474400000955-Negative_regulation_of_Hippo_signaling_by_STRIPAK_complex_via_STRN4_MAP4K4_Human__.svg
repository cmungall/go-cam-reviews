<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline with cytoplasm and nucleus -->
  <rect x="50" y="100" width="700" height="500" rx="20" ry="20" fill="#f0f0f0" stroke="#888888" stroke-width="2"/>
  <ellipse cx="400" cy="350" rx="200" ry="150" fill="#e6e6fa" stroke="#888888" stroke-width="3"/>
  
  <!-- Labels for cellular compartments -->
  <text x="100" y="130" font-family="Arial" font-size="18" font-weight="bold" fill="#555555">Cytoplasm</text>
  <text x="400" y="300" font-family="Arial" font-size="18" font-weight="bold" fill="#555555" text-anchor="middle">Nucleus</text>
  
  <!-- STRIPAK Complex -->
  <rect x="150" y="230" width="120" height="60" rx="10" ry="10" fill="#a0d6b4" stroke="#2e8b57" stroke-width="3"/>
  <text x="210" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">STRIPAK</text>
  <text x="210" y="285" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Complex</text>
  <text x="210" y="300" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">(STRN4)</text>
  
  <!-- MAP4K4 -->
  <circle cx="320" cy="250" r="35" fill="#ffb347" stroke="#ff8c00" stroke-width="3"/>
  <text x="320" y="255" font-family="Arial" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">MAP4K4</text>
  
  <!-- LATS1 and LATS2 -->
  <circle cx="450" y="200" r="35" fill="#ff7f7f" stroke="#cd5c5c" stroke-width="3"/>
  <text x="450" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">LATS1</text>
  <text x="450" y="215" font-family="Arial" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">LATS2</text>
  
  <!-- YAP1 and WWTR1 in cytoplasm -->
  <circle cx="580" cy="250" r="35" fill="#87cefa" stroke="#4682b4" stroke-width="3"/>
  <text x="580" y="245" font-family="Arial" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">YAP1</text>
  <text x="580" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">WWTR1</text>

  <!-- YAP1 and WWTR1 in nucleus -->
  <circle cx="400" cy="370" r="35" fill="#87cefa" stroke="#4682b4" stroke-width="3"/>
  <text x="400" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">YAP1</text>
  <text x="400" y="385" font-family="Arial" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">WWTR1</text>
  
  <!-- TEAD Transcription Factors -->
  <rect x="470" y="360" width="80" height="40" rx="5" ry="5" fill="#d8bfd8" stroke="#9370db" stroke-width="3"/>
  <text x="510" y="385" font-family="Arial" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">TEAD1-4</text>
  
  <!-- Arrows and Interactions -->
  <!-- STRIPAK to MAP4K4 -->
  <line x1="270" y1="250" x2="285" y2="250" stroke="#ff0000" stroke-width="3" marker-end="url(#arrowhead_red)"/>
  <text x="280" y="230" font-family="Arial" font-size="12" fill="#ff0000" font-weight="bold">Inhibits</text>
  
  <!-- MAP4K4 to LATS1/2 -->
  <line x1="350" y1="230" x2="415" y2="205" stroke="#00aa00" stroke-width="3" marker-end="url(#arrowhead_green)"/>
  <text x="380" y="205" font-family="Arial" font-size="12" fill="#00aa00" font-weight="bold">Activates</text>
  
  <!-- LATS1/2 to YAP1/WWTR1 -->
  <line x1="480" y1="215" x2="545" y2="240" stroke="#00aa00" stroke-width="3" marker-end="url(#arrowhead_green)"/>
  <text x="520" y="220" font-family="Arial" font-size="12" fill="#00aa00" font-weight="bold">Phosphorylates</text>
  
  <!-- YAP1/WWTR1 translocation (blocked) -->
  <path d="M580,285 Q580,325 530,355" stroke="#000000" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="320" x2="570" y2="320" stroke="#ff0000" stroke-width="4"/>
  <circle cx="560" cy="320" r="10" fill="#ff0000" stroke="none"/>
  <text x="610" y="320" font-family="Arial" font-size="12" fill="#ff0000" font-weight="bold">Blocked</text>
  <text x="610" y="335" font-family="Arial" font-size="12" fill="#ff0000" font-weight="bold">Translocation</text>
  
  <!-- YAP1/WWTR1 to TEAD -->
  <line x1="435" y1="370" x2="470" y2="370" stroke="#0000ff" stroke-width="3" marker-end="url(#arrowhead_blue)"/>
  <text x="450" y="360" font-family="Arial" font-size="12" fill="#0000ff" font-weight="bold">Coregulation</text>
  
  <!-- Pathway explanation -->
  <rect x="150" y="180" width="500" height="20" rx="5" ry="5" fill="rgba(255,255,255,0.7)" stroke="none"/>
  <text x="400" y="195" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">STRIPAK complex inhibits MAP4K4, preventing Hippo pathway activation</text>
  
  <rect x="400" y="430" width="275" height="20" rx="5" ry="5" fill="rgba(255,255,255,0.7)" stroke="none"/>
  <text x="535" y="445" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">Transcriptional regulation of target genes</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">Negative regulation of Hippo signaling by STRIPAK complex</text>
  <text x="400" y="75" font-family="Arial" font-size="16" fill="#555555" text-anchor="middle">via STRN4:MAP4K4</text>
  
  <!-- Legend -->
  <rect x="50" y="620" width="700" height="70" rx="5" ry="5" fill="#f9f9f9" stroke="#888888" stroke-width="1"/>
  <text x="400" y="640" font-family="Arial" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Legend</text>
  
  <!-- Legend items -->
  <line x1="70" y1="660" x2="90" y2="660" stroke="#00aa00" stroke-width="3" marker-end="url(#arrowhead_green)"/>
  <text x="100" y="665" font-family="Arial" font-size="12" fill="#333333">Activation</text>
  
  <line x1="170" y1="660" x2="190" y2="660" stroke="#ff0000" stroke-width="3" marker-end="url(#arrowhead_red)"/>
  <text x="200" y="665" font-family="Arial" font-size="12" fill="#333333">Inhibition</text>
  
  <line x1="270" y1="660" x2="290" y2="660" stroke="#0000ff" stroke-width="3" marker-end="url(#arrowhead_blue)"/>
  <text x="300" y="665" font-family="Arial" font-size="12" fill="#333333">Coregulation</text>
  
  <line x1="400" y1="660" x2="420" y2="660" stroke="#000000" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="430" y="665" font-family="Arial" font-size="12" fill="#333333">Translocation</text>
  
  <circle cx="520" y="660" r="10" fill="#a0d6b4" stroke="#2e8b57" stroke-width="2"/>
  <text x="540" y="665" font-family="Arial" font-size="12" fill="#333333">Complex</text>
  
  <circle cx="620" y="660" r="10" fill="#87cefa" stroke="#4682b4" stroke-width="2"/>
  <text x="640" y="665" font-family="Arial" font-size="12" fill="#333333">Protein</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="arrowhead_green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00aa00"/>
    </marker>
    <marker id="arrowhead_red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0000"/>
    </marker>
    <marker id="arrowhead_blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0000ff"/>
    </marker>
  </defs>
</svg>