<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="400" y="90" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Mouse Cytosol (GO:0005829)</text>
  
  <!-- Glycogen molecule -->
  <circle cx="180" cy="200" r="60" fill="#ffd699" stroke="#996633" stroke-width="3"/>
  <text x="180" y="200" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Glycogen</text>
  <text x="180" y="220" font-family="Arial" font-size="14" text-anchor="middle">Substrate</text>
  
  <!-- Phkg2 -->
  <rect x="60" y="350" width="120" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="120" y="380" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Phkg2</text>
  <text x="120" y="400" font-family="Arial" font-size="14" text-anchor="middle">Phosphorylase kinase</text>
  
  <!-- Pygl -->
  <rect x="250" y="350" width="120" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="310" y="380" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Pygl</text>
  <text x="310" y="400" font-family="Arial" font-size="14" text-anchor="middle">Glycogen phosphorylase</text>
  
  <!-- Agl (4-alpha-glucanotransferase) -->
  <rect x="450" y="240" width="120" height="70" rx="10" ry="10" fill="#b3e0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="510" y="265" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Agl</text>
  <text x="510" y="285" font-family="Arial" font-size="13" text-anchor="middle">4-alpha-glucanotransferase</text>
  <text x="510" y="302" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">GO:0004134</text>
  
  <!-- Agl (amylo-alpha-1,6-glucosidase) -->
  <rect x="600" y="240" width="120" height="70" rx="10" ry="10" fill="#b3e0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="660" y="265" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Agl</text>
  <text x="660" y="285" font-family="Arial" font-size="13" text-anchor="middle">amylo-alpha-1,6-glucosidase</text>
  <text x="660" y="302" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">GO:0004135</text>
  
  <!-- Pgm2 -->
  <rect x="450" y="400" width="120" height="70" rx="10" ry="10" fill="#b3e0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="510" y="425" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Pgm2</text>
  <text x="510" y="445" font-family="Arial" font-size="14" text-anchor="middle">Phosphoglucomutase</text>
  <text x="510" y="462" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">GO:0004614</text>
  
  <!-- Pgm1 -->
  <rect x="450" y="480" width="120" height="70" rx="10" ry="10" fill="#b3e0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="510" y="505" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Pgm1</text>
  <text x="510" y="525" font-family="Arial" font-size="14" text-anchor="middle">Phosphoglucomutase</text>
  <text x="510" y="542" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">GO:0004614</text>
  
  <!-- Product: alpha-D-glucose 6-phosphate -->
  <ellipse cx="660" cy="450" rx="70" ry="40" fill="#d9f2d9" stroke="#339933" stroke-width="3"/>
  <text x="660" y="445" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">α-D-glucose</text>
  <text x="660" y="465" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">6-phosphate</text>
  <text x="660" y="482" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">CHEBI:58225</text>
  
  <!-- Activation arrow: Phkg2 to Pygl -->
  <line x1="180" y1="380" x2="250" y2="380" stroke="#ff3333" stroke-width="4" marker-end="url(#arrowheadActivation)"/>
  <text x="215" y="370" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Activates</text>
  <circle cx="215" cy="380" r="12" fill="white" stroke="#333" stroke-width="1"/>
  <text x="215" y="384" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">1</text>
  
  <!-- Arrow: Pygl to glycogen -->
  <line x1="310" y1="350" x2="231" y2="250" stroke="#333" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="290" y="290" font-family="Arial" font-size="16" text-anchor="middle" transform="rotate(-45, 290, 290)" font-weight="bold">Acts on</text>
  <circle cx="270" cy="300" r="12" fill="white" stroke="#333" stroke-width="1"/>
  <text x="270" y="304" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">2</text>
  
  <!-- Arrow: Pygl to Agl (first function) -->
  <line x1="370" y1="360" x2="450" y2="280" stroke="#333" stroke-width="4" marker-end="url(#arrowhead)"/>
  <circle cx="410" cy="320" r="12" fill="white" stroke="#333" stroke-width="1"/>
  <text x="410" y="324" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">3</text>
  
  <!-- Arrow: Agl (first function) to Agl (second function) -->
  <line x1="570" y1="280" x2="600" y2="280" stroke="#333" stroke-width="4" marker-end="url(#arrowhead)"/>
  <circle cx="585" cy="260" r="12" fill="white" stroke="#333" stroke-width="1"/>
  <text x="585" y="264" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">4</text>
  
  <!-- Arrow: Pygl to Pgm2 -->
  <line x1="370" y1="390" x2="450" y2="430" stroke="#333" stroke-width="4" marker-end="url(#arrowhead)"/>
  <circle cx="410" cy="410" r="12" fill="white" stroke="#333" stroke-width="1"/>
  <text x="410" y="414" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">5</text>
  
  <!-- Arrow: Pygl to Pgm1 -->
  <line x1="370" y1="410" x2="450" y2="510" stroke="#333" stroke-width="4" marker-end="url(#arrowhead)"/>
  <circle cx="410" cy="460" r="12" fill="white" stroke="#333" stroke-width="1"/>
  <text x="410" y="464" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">6</text>
  
  <!-- Arrows from Pgm1 and Pgm2 to product -->
  <line x1="570" y1="430" x2="590" y2="450" stroke="#333" stroke-width="4" marker-end="url(#arrowhead)"/>
  <circle cx="580" cy="440" r="12" fill="white" stroke="#333" stroke-width="1"/>
  <text x="580" y="444" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">7</text>
  
  <line x1="570" y1="510" x2="610" y2="470" stroke="#333" stroke-width="4" marker-end="url(#arrowhead)"/>
  <circle cx="590" cy="490" r="12" fill="white" stroke="#333" stroke-width="1"/>
  <text x="590" y="494" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">8</text>
  
  <!-- Process label -->
  <rect x="60" y="120" width="240" height="40" rx="10" ry="10" fill="#ffe6cc" stroke="#ff9933" stroke-width="2"/>
  <text x="180" y="145" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Glycogen Catabolic Process</text>
  <text x="180" y="162" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">GO:0005980</text>
  
  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowheadActivation" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff3333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="580" y="100" width="160" height="120" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="660" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="590" y="130" width="20" height="20" fill="#b3e0ff" stroke="#0066cc" stroke-width="1"/>
  <text x="620" y="145" font-family="Arial" font-size="14" text-anchor="start">Enzymes</text>
  
  <circle cx="600" cy="165" r="10" fill="#ffd699" stroke="#996633" stroke-width="1"/>
  <text x="620" y="170" font-family="Arial" font-size="14" text-anchor="start">Substrate</text>
  
  <ellipse cx="600" cy="190" rx="15" ry="10" fill="#d9f2d9" stroke="#339933" stroke-width="1"/>
  <text x="620" y="195" font-family="Arial" font-size="14" text-anchor="start">Product</text>
  
  <line x1="590" y1="210" x2="610" y2="210" stroke="#ff3333" stroke-width="3"/>
  <text x="620" y="215" font-family="Arial" font-size="14" text-anchor="start">Activation</text>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Glycogen Catabolic Process in Mouse</text>
</svg>