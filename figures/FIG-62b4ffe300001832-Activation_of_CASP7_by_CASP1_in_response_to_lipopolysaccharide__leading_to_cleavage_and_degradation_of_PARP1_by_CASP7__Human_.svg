<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
    <!-- Background and cell outline -->
    <rect x="50" y="50" width="700" height="550" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="3"/>
    
    <!-- Cell compartments -->
    <rect x="100" y="100" width="600" height="320" rx="20" ry="20" fill="#e6f7ff" stroke="#666" stroke-width="3"/>
    <text x="400" y="130" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Cytoplasm (GO:0005737)</text>
    
    <rect x="200" y="280" width="400" height="270" rx="10" ry="10" fill="#ffe6e6" stroke="#666" stroke-width="3"/>
    <text x="400" y="310" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Nucleus (GO:0005634)</text>

    <!-- LPS signal -->
    <path d="M 20,200 L 100,200" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="60" y="180" font-family="Arial" font-size="18" font-weight="bold" fill="#333">LPS</text>
    <text x="60" y="230" font-family="Arial" font-size="14" font-style="italic" fill="#333">GO:0071222</text>
    
    <!-- CASP1 in cytoplasm -->
    <circle cx="150" cy="200" r="45" fill="#add8e6" stroke="#333" stroke-width="3"/>
    <text x="150" y="195" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">CASP1</text>
    <text x="150" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">P29466</text>
    <text x="150" y="160" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">Endopeptidase</text>
    <text x="150" y="175" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">GO:0004197</text>
    
    <!-- CASP7 inactive in cytoplasm -->
    <rect x="250" y="170" width="90" height="50" rx="8" ry="8" fill="#d3d3d3" stroke="#333" stroke-width="3"/>
    <text x="295" y="200" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">pro-CASP7</text>
    <text x="295" y="220" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">P55210</text>
    
    <!-- Arrow from CASP1 to CASP7 -->
    <path d="M 195,200 L 250,200" stroke="#ff6600" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="222" y="185" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ff6600">Activates</text>
    <text x="222" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#ff6600">GO:0051604</text>
    
    <!-- Active CASP7 in cytoplasm -->
    <rect x="370" y="170" width="90" height="50" rx="8" ry="8" fill="#98fb98" stroke="#333" stroke-width="3"/>
    <text x="415" y="200" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">CASP7</text>
    <text x="415" y="220" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">P55210</text>
    
    <path d="M 340,195 L 370,195" stroke="#ff6600" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="355" y="185" font-family="Arial" font-size="14" text-anchor="middle" fill="#ff6600">Maturation</text>
    
    <!-- CASP7 translocation to nucleus -->
    <path d="M 415,220 L 415,350" stroke="#6600cc" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#arrow)"/>
    <text x="440" y="290" font-family="Arial" font-size="16" font-weight="bold" fill="#6600cc">Translocation</text>
    
    <!-- CASP7 in nucleus -->
    <rect x="370" y="350" width="90" height="50" rx="8" ry="8" fill="#98fb98" stroke="#333" stroke-width="3"/>
    <text x="415" y="380" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">CASP7</text>
    <text x="415" y="400" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">P55210</text>
    <text x="415" y="335" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">Endopeptidase</text>
    <text x="415" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">GO:0004197</text>
    
    <!-- PARP1 in nucleus -->
    <polygon points="530,350 570,370 530,390 490,370" fill="#ffb6c1" stroke="#333" stroke-width="3"/>
    <text x="530" y="375" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">PARP1</text>
    <text x="530" y="395" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">P09874</text>
    <text x="530" y="335" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">NAD+ transferase</text>
    <text x="530" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">GO:0003950</text>
    
    <!-- Arrow from CASP7 to PARP1 -->
    <path d="M 460,370 L 490,370" stroke="#cc0000" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="475" y="355" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#cc0000">Cleaves</text>
    <text x="475" y="395" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#cc0000">GO:0030163</text>
    
    <!-- Cleaved/degraded PARP1 -->
    <polygon points="580,450 620,470 580,490 540,470" fill="#ffb6c1" stroke="#333" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>
    <line x1="570" y1="455" x2="590" y2="475" stroke="#333" stroke-width="3"/>
    <line x1="570" y1="475" x2="590" y2="455" stroke="#333" stroke-width="3"/>
    <text x="580" y="510" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Degraded PARP1</text>
    
    <!-- Arrow from PARP1 to degraded PARP1 -->
    <path d="M 530,390 L 560,450" stroke="#cc0000" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="560" y="430" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#cc0000">GO:0070212</text>
    <text x="560" y="420" font-family="Arial" font-size="14" text-anchor="middle" fill="#cc0000">Degradation</text>
    
    <!-- Legend and other annotations -->
    <text x="100" y="530" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Process: Activation of CASP7 by CASP1 in response to LPS, leading to PARP1 cleavage</text>
    <text x="100" y="555" font-family="Arial" font-size="16" fill="#333">Model ID: gomodel:62b4ffe300001832</text>
    <text x="100" y="580" font-family="Arial" font-size="16" fill="#333">Taxon: Human (NCBITaxon:9606)</text>

    <!-- Arrow marker definition -->
    <defs>
        <marker id="arrow" markerWidth="13" markerHeight="13" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,8 L12,4 z" fill="#333"/>
        </marker>
    </defs>
    
    <!-- Color-coded process legend -->
    <rect x="550" y="520" width="20" height="10" fill="#ff6600" />
    <text x="575" y="530" font-family="Arial" font-size="14" fill="#333">Activation/Maturation</text>
    
    <rect x="550" y="540" width="20" height="10" fill="#6600cc" />
    <text x="575" y="550" font-family="Arial" font-size="14" fill="#333">Translocation</text>
    
    <rect x="550" y="560" width="20" height="10" fill="#cc0000" />
    <text x="575" y="570" font-family="Arial" font-size="14" fill="#333">Cleavage/Degradation</text>
</svg>