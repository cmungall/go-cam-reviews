<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Membrane -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  
  <!-- Cell Cytoplasm Label -->
  <text x="100" y="100" font-family="Arial" font-size="18" fill="#333">Host Cell Cytoplasm (GO:0005737)</text>
  
  <!-- Virus (HHV1) -->
  <ellipse cx="150" cy="200" rx="60" ry="45" fill="#ffcccc" stroke="#cc0000" stroke-width="2"/>
  <text x="150" y="200" font-family="Arial" font-size="14" fill="#cc0000" text-anchor="middle">HHV1</text>
  
  <!-- UL37 protein -->
  <rect x="250" y="190" width="100" height="40" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="300" y="215" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">UL37</text>
  <text x="300" y="230" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(P10221)</text>
  
  <!-- RIG-I protein -->
  <rect x="400" y="190" width="100" height="40" rx="5" ry="5" fill="#99ccff" stroke="#3366cc" stroke-width="2"/>
  <text x="450" y="215" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">RIG-I</text>
  <text x="450" y="230" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(O95786)</text>
  
  <!-- TRIM25 protein -->
  <rect x="400" y="300" width="100" height="40" rx="5" ry="5" fill="#99ccff" stroke="#3366cc" stroke-width="2"/>
  <text x="450" y="325" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">TRIM25</text>
  <text x="450" y="340" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(Q14258)</text>
  
  <!-- Mitochondria -->
  <ellipse cx="600" cy="400" rx="120" ry="60" fill="#e6ffe6" stroke="#339933" stroke-width="2"/>
  <path d="M550 370 Q600 350 650 370 Q600 390 550 370" fill="#c6efc6" stroke="#339933" stroke-width="1"/>
  <path d="M550 400 Q600 380 650 400 Q600 420 550 400" fill="#c6efc6" stroke="#339933" stroke-width="1"/>
  <path d="M550 430 Q600 410 650 430 Q600 450 550 430" fill="#c6efc6" stroke="#339933" stroke-width="1"/>
  <text x="600" y="380" font-family="Arial" font-size="14" fill="#339933" text-anchor="middle">Mitochondrial</text>
  <text x="600" y="400" font-family="Arial" font-size="14" fill="#339933" text-anchor="middle">Membrane</text>
  <text x="600" y="420" font-family="Arial" font-size="10" fill="#339933" text-anchor="middle">(GO:0031966)</text>
  
  <!-- MAVS protein -->
  <rect x="600" y="330" width="100" height="40" rx="5" ry="5" fill="#99ccff" stroke="#3366cc" stroke-width="2"/>
  <text x="650" y="355" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">MAVS</text>
  <text x="650" y="370" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(Q7Z434)</text>
  
  <!-- Arrows and interactions -->
  <!-- UL37 inhibition of RIG-I via deamidation -->
  <line x1="350" y1="210" x2="400" y2="210" stroke="#cc0000" stroke-width="3" marker-end="url(#arrowheadRed)"/>
  <text x="375" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#cc0000" text-anchor="middle">Deamidates</text>
  <text x="375" y="175" font-family="Arial" font-size="11" fill="#cc0000" text-anchor="middle">(GO:0050568)</text>
  
  <!-- Normal Pathway Arrows (dashed to show it's inhibited) -->
  <line x1="450" y1="230" x2="450" y2="300" stroke="#3366cc" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowheadBlue)"/>
  <text x="520" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#3366cc" text-anchor="middle">Would Activate</text>
  <text x="520" y="280" font-family="Arial" font-size="11" fill="#3366cc" text-anchor="middle">(RO:0002629)</text>
  
  <line x1="500" y1="320" x2="600" y2="340" stroke="#3366cc" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowheadBlue)"/>
  <text x="550" y="300" font-family="Arial" font-size="14" font-weight="bold" fill="#3366cc" text-anchor="middle">Would Activate</text>
  <text x="550" y="315" font-family="Arial" font-size="11" fill="#3366cc" text-anchor="middle">(RO:0002629)</text>
  
  <!-- Virus to UL37 -->
  <line x1="210" y1="200" x2="250" y2="210" stroke="#cc0000" stroke-width="3" marker-end="url(#arrowheadRed)"/>
  <text x="230" y="185" font-family="Arial" font-size="14" font-weight="bold" fill="#cc0000" text-anchor="middle">Produces</text>
  
  <!-- Pathway labels -->
  <rect x="100" y="480" width="600" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#999966" stroke-width="2"/>
  <text x="400" y="510" font-family="Arial" font-size="16" font-weight="bold" fill="#666633" text-anchor="middle">HHV1-UL37 inhibition of host RIG-I signaling via deamidation</text>
  
  <!-- Legend box -->
  <rect x="580" y="70" width="150" height="185" rx="10" ry="10" fill="white" stroke="#666" stroke-width="1"/>
  <text x="655" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Legend</text>
  
  <!-- Legend items -->
  <rect x="590" y="105" width="20" height="15" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="650" y="117" font-family="Arial" font-size="14" fill="#333">Viral protein</text>
  
  <rect x="590" y="130" width="20" height="15" fill="#99ccff" stroke="#3366cc" stroke-width="1"/>
  <text x="650" y="142" font-family="Arial" font-size="14" fill="#333">Host protein</text>
  
  <line x1="590" y1="160" x2="610" y2="160" stroke="#cc0000" stroke-width="3" marker-end="url(#arrowheadRed)"/>
  <text x="660" y="163" font-family="Arial" font-size="14" fill="#333">Inhibition</text>
  
  <line x1="590" y1="185" x2="610" y2="185" stroke="#3366cc" stroke-width="3" marker-end="url(#arrowheadBlue)"/>
  <text x="660" y="188" font-family="Arial" font-size="14" fill="#333">Activation</text>
  
  <line x1="590" y1="210" x2="610" y2="210" stroke="#3366cc" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowheadBlue)"/>
  <text x="660" y="213" font-family="Arial" font-size="14" fill="#333">Inhibited</text>
  <text x="660" y="228" font-family="Arial" font-size="14" fill="#333">pathway</text>
  
  <!-- RIG-I signaling pathway box -->
  <rect x="350" y="400" width="180" height="60" rx="10" ry="10" fill="#e6f2ff" stroke="#3366cc" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="440" y="430" font-family="Arial" font-size="14" font-weight="bold" fill="#3366cc" text-anchor="middle">Cytoplasmic pattern</text>
  <text x="440" y="450" font-family="Arial" font-size="14" font-weight="bold" fill="#3366cc" text-anchor="middle">recognition signaling</text>
  <text x="440" y="465" font-family="Arial" font-size="11" fill="#3366cc" text-anchor="middle">(GO:0002753)</text>
  
  <!-- Annotated functions -->
  <text x="450" y="170" font-family="Arial" font-size="11" fill="#3366cc">Pattern recognition</text>
  <text x="450" y="182" font-family="Arial" font-size="11" fill="#3366cc">receptor activity (GO:0038187)</text>
  
  <text x="450" y="365" font-family="Arial" font-size="11" fill="#3366cc">Ubiquitin protein ligase</text>
  <text x="450" y="377" font-family="Arial" font-size="11" fill="#3366cc">activity (GO:0061630)</text>
  
  <text x="670" y="315" font-family="Arial" font-size="11" fill="#3366cc">Signaling adaptor</text>
  <text x="670" y="327" font-family="Arial" font-size="11" fill="#3366cc">activity (GO:0035591)</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3366cc"/>
    </marker>
    <marker id="arrowheadRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000"/>
    </marker>
  </defs>
</svg>