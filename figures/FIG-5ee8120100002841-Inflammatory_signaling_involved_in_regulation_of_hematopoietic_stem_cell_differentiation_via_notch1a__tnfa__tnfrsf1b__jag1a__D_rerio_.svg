<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell compartments -->
  <rect width="800" height="600" fill="#f5f5f5" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Inflammatory Signaling in Regulation of Hematopoietic Stem Cell Differentiation</text>
  <text x="400" y="55" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">(Danio rerio)</text>
  
  <!-- Cell Types and Compartments -->
  <!-- Neutrophil -->
  <ellipse cx="200" cy="200" rx="150" ry="100" fill="#daeeff" stroke="#004d99" stroke-width="2.5" />
  <text x="200" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Neutrophil</text>
  
  <!-- Endothelial Cell -->
  <ellipse cx="550" cy="300" rx="150" ry="100" fill="#d6f5d6" stroke="#004d00" stroke-width="2.5" />
  <text x="550" y="230" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Endothelial Cell</text>
  
  <!-- Hematopoietic Stem Cell -->
  <ellipse cx="400" cy="450" rx="150" ry="80" fill="#ffe6cc" stroke="#994c00" stroke-width="2.5" />
  <text x="400" y="425" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Hematopoietic Stem Cell</text>
  <text x="400" y="450" font-family="Arial" font-size="14" text-anchor="middle">Differentiation</text>
  
  <!-- Extracellular Space Label -->
  <rect x="320" y="140" width="160" height="25" rx="10" ry="10" fill="white" fill-opacity="0.8" />
  <text x="400" y="158" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" fill="#333333">Extracellular Space</text>
  
  <!-- Proteins and Interactions -->
  <!-- TNFa -->
  <circle cx="200" cy="200" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2.5" />
  <text x="200" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TNFa</text>
  
  <!-- TNFa secretion -->
  <path d="M 225 220 Q 300 280 350 250" stroke="#cc0000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
  <rect x="240" y="235" width="100" height="40" rx="5" ry="5" fill="white" fill-opacity="0.8" />
  <text x="290" y="253" font-family="Arial" font-size="14" text-anchor="middle" fill="#cc0000">Receptor</text>
  <text x="290" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#cc0000">Ligand</text>
  
  <!-- TNFRSF1b -->
  <rect x="350" y="230" width="80" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#994d00" stroke-width="2.5" />
  <text x="390" y="250" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TNFRSF1b</text>
  
  <!-- Plasma membrane label for TNFRSF1b -->
  <rect x="340" y="200" width="100" height="20" rx="5" ry="5" fill="white" fill-opacity="0.8" />
  <text x="390" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Plasma Membrane</text>
  
  <!-- TNFRSF1b activation -->
  <path d="M 390 260 Q 390 300 390 340" stroke="#994d00" stroke-width="2.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <rect x="395" y="290" width="120" height="20" rx="5" ry="5" fill="white" fill-opacity="0.8" />
  <text x="455" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#994d00">Positively Regulates</text>
  
  <!-- JAG1a -->
  <rect x="480" y="290" width="60" height="30" rx="5" ry="5" fill="#99ccff" stroke="#0052cc" stroke-width="2.5" />
  <text x="510" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">JAG1a</text>
  
  <!-- JAG1a activation -->
  <path d="M 400 340 Q 440 320 480 305" stroke="#0052cc" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
  <rect x="410" y="325" width="60" height="20" rx="5" ry="5" fill="white" fill-opacity="0.8" />
  <text x="440" y="340" font-family="Arial" font-size="14" text-anchor="middle" fill="#0052cc">Activates</text>
  
  <!-- NOTCH1a -->
  <rect x="570" y="320" width="70" height="30" rx="5" ry="5" fill="#cc99ff" stroke="#5200cc" stroke-width="2.5" />
  <text x="605" y="340" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">NOTCH1a</text>
  
  <!-- JAG1a to NOTCH1a -->
  <path d="M 540 305 Q 555 312 570 320" stroke="#5200cc" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
  <rect x="525" y="280" width="50" height="20" rx="5" ry="5" fill="white" fill-opacity="0.8" />
  <text x="550" y="295" font-family="Arial" font-size="14" text-anchor="middle" fill="#5200cc">Binds</text>
  
  <!-- NOTCH1a to HSC -->
  <path d="M 600 350 Q 560 400 450 430" stroke="#5200cc" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
  <rect x="480" y="375" width="100" height="20" rx="5" ry="5" fill="white" fill-opacity="0.8" />
  <text x="530" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="#5200cc">Notch Signaling</text>
  
  <!-- Biological Process Labels -->
  <rect x="290" y="480" width="220" height="35" rx="10" ry="10" fill="#ffffcc" stroke="#666600" stroke-width="2.5" />
  <text x="400" y="505" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#666600">Positive Regulation of HSC Differentiation</text>
  
  <!-- Markers for arrowheads -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="470" width="180" height="120" fill="white" stroke="#333333" stroke-width="1.5" />
  <text x="620" y="490" font-family="Arial" font-size="14" text-anchor="left" font-weight="bold">Legend</text>
  
  <circle cx="620" cy="510" r="7" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="635" y="515" font-family="Arial" font-size="12" text-anchor="left">TNFa (Ligand)</text>
  
  <rect x="610" y="525" width="15" height="10" rx="2" ry="2" fill="#ffcc99" stroke="#994d00" stroke-width="1.5" />
  <text x="635" y="535" font-family="Arial" font-size="12" text-anchor="left">TNFRSF1b (Receptor)</text>
  
  <rect x="610" y="545" width="15" height="10" rx="2" ry="2" fill="#99ccff" stroke="#0052cc" stroke-width="1.5" />
  <text x="635" y="555" font-family="Arial" font-size="12" text-anchor="left">JAG1a (Ligand)</text>
  
  <rect x="610" y="565" width="15" height="10" rx="2" ry="2" fill="#cc99ff" stroke="#5200cc" stroke-width="1.5" />
  <text x="635" y="575" font-family="Arial" font-size="12" text-anchor="left">NOTCH1a (Receptor)</text>
</svg>