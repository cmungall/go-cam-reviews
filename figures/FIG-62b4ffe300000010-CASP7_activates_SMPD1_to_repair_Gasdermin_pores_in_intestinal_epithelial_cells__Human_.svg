<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="100" width="700" height="450" rx="100" ry="100" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
  <text x="400" y="80" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Intestinal Epithelial Cell</text>
  
  <!-- Cytosol label -->
  <text x="400" y="130" font-family="Arial" font-size="20" text-anchor="middle" font-style="italic">Cytosol</text>
  
  <!-- Plasma membrane -->
  <rect x="50" y="270" width="700" height="15" fill="#90ee90" stroke="#333" stroke-width="2"/>
  <text x="90" y="265" font-family="Arial" font-size="18" text-anchor="start">Plasma membrane</text>
  
  <!-- Extracellular space -->
  <text x="400" y="330" font-family="Arial" font-size="20" text-anchor="middle" font-style="italic">Extracellular space</text>
  
  <!-- Step 1: CASP1 activation -->
  <circle cx="150" cy="200" r="30" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="150" y="205" font-family="Arial" font-size="16" text-anchor="middle">CASP1</text>
  <circle cx="125" cy="175" r="15" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="125" y="180" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">1</text>
  
  <!-- Step 2: GSDMD initial state -->
  <circle cx="280" cy="200" r="30" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="280" y="205" font-family="Arial" font-size="16" text-anchor="middle">GSDMD</text>
  <circle cx="255" cy="175" r="15" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="255" y="180" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">2</text>
  
  <!-- Step 3: PIP2 binding to GSDMD -->
  <circle cx="280" cy="240" r="12" fill="#ffcc00" stroke="#333" stroke-width="1"/>
  <text x="280" y="244" font-family="Arial" font-size="12" text-anchor="middle">PIP2</text>
  <circle cx="305" cy="240" r="15" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="305" y="245" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">3</text>
  
  <!-- Step 4: Active GSDMD pores in membrane -->
  <path d="M270,270 L260,290 L280,310 L300,290 L290,270 Z" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <path d="M330,270 L320,290 L340,310 L360,290 L350,270 Z" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <path d="M390,270 L380,290 L400,310 L420,290 L410,270 Z" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <path d="M450,270 L440,290 L460,310 L480,290 L470,270 Z" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="370" y="325" font-family="Arial" font-size="18" text-anchor="middle">GSDMD pores</text>
  <circle cx="245" cy="290" r="15" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="245" y="295" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">4</text>
  
  <!-- Step 5: CASP7 in extracellular space -->
  <circle cx="600" cy="380" r="30" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="600" y="385" font-family="Arial" font-size="16" text-anchor="middle">CASP7</text>
  <circle cx="630" cy="355" r="15" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="630" y="360" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">5</text>
  
  <!-- Step 6: SMPD1 in extracellular space -->
  <circle cx="450" cy="380" r="30" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="450" y="385" font-family="Arial" font-size="16" text-anchor="middle">SMPD1</text>
  <circle cx="420" cy="355" r="15" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="420" y="360" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">6</text>
  
  <!-- Step 7: Ceramide production -->
  <rect x="370" y="440" width="80" height="30" rx="10" ry="10" fill="#ffff99" stroke="#333" stroke-width="2"/>
  <text x="410" y="460" font-family="Arial" font-size="16" text-anchor="middle">Ceramide</text>
  <circle cx="460" cy="430" r="15" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="460" y="435" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">7</text>
  
  <!-- Step 8: GSDMD pore repair -->
  <path d="M350,270 L340,290 L360,310 L380,290 L370,270 Z" fill="#99ccff" stroke="#333" stroke-width="2" opacity="0.5"/>
  <path d="M410,270 L400,290 L420,310 L440,290 L430,270 Z" fill="#99ccff" stroke="#333" stroke-width="2" opacity="0.5"/>
  <text x="390" y="350" font-family="Arial" font-size="18" text-anchor="middle">Pore repair</text>
  <circle cx="390" cy="375" r="15" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="390" y="380" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">8</text>
  
  <!-- Arrows with clearer styling -->
  <!-- CASP1 to GSDMD -->
  <path d="M180,200 L250,200" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead_red)"/>
  <text x="215" y="190" font-family="Arial" font-size="16" text-anchor="middle">activates</text>
  
  <!-- GSDMD to pore formation -->
  <path d="M280,230 L280,260" stroke="#3498db" stroke-width="3" fill="none" marker-end="url(#arrowhead_blue)"/>
  <text x="310" y="250" font-family="Arial" font-size="16" text-anchor="start">forms pores</text>
  
  <!-- CASP7 to SMPD1 -->
  <path d="M570,380 L480,380" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead_red)"/>
  <text x="525" y="370" font-family="Arial" font-size="16" text-anchor="middle">activates</text>
  
  <!-- SMPD1 to Ceramide -->
  <path d="M450,410 L410,440" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrowhead_green)"/>
  <text x="445" y="435" font-family="Arial" font-size="16" text-anchor="middle">produces</text>
  
  <!-- Ceramide to pore repair -->
  <path d="M410,440 L390,350" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrowhead_green)" stroke-dasharray="8,4"/>
  <text x="375" y="405" font-family="Arial" font-size="16" text-anchor="end">repairs</text>
  
  <!-- GSDMD pores to CASP7 secretion -->
  <path d="M480,310 L570,350" stroke="#3498db" stroke-width="3" fill="none" marker-end="url(#arrowhead_blue)" stroke-dasharray="8,4"/>
  <text x="540" y="320" font-family="Arial" font-size="16" text-anchor="middle">enables secretion</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead_red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead_blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowhead_green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Process labels -->
  <text x="150" y="150" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Protein maturation</text>
  <text x="600" y="450" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Pyroptotic inflammatory response</text>
  <text x="200" y="450" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Ceramide biosynthesis</text>
  <text x="600" y="410" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Plasma membrane repair</text>
  
  <!-- Legend -->
  <rect x="50" y="580" width="700" height="100" rx="10" ry="10" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="400" y="600" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <circle cx="80" cy="625" r="10" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="100" y="630" font-family="Arial" font-size="16" text-anchor="start">CASP1 (Caspase-1)</text>
  
  <circle cx="80" cy="655" r="10" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="100" y="660" font-family="Arial" font-size="16" text-anchor="start">GSDMD (Gasdermin D)</text>
  
  <circle cx="250" cy="625" r="10" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="270" y="630" font-family="Arial" font-size="16" text-anchor="start">CASP7 (Caspase-7)</text>
  
  <circle cx="250" cy="655" r="10" fill="#cc99ff" stroke="#333" stroke-width="1"/>
  <text x="270" y="660" font-family="Arial" font-size="16" text-anchor="start">SMPD1 (Acid Sphingomyelinase)</text>
  
  <rect x="420" y="620" width="20" height="10" rx="5" ry="5" fill="#ffff99" stroke="#333" stroke-width="1"/>
  <text x="450" y="625" font-family="Arial" font-size="16" text-anchor="start">Ceramide</text>
  
  <path d="M420,655 L430,645 L440,655 L430,665 Z" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="450" y="660" font-family="Arial" font-size="16" text-anchor="start">GSDMD pore</text>
  
  <line x1="580" y1="625" x2="610" y2="625" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead_red)"/>
  <text x="625" y="630" font-family="Arial" font-size="16" text-anchor="start">Activation</text>
  
  <line x1="580" y1="655" x2="610" y2="655" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead_green)"/>
  <text x="625" y="660" font-family="Arial" font-size="16" text-anchor="start">Production/Repair</text>
</svg>