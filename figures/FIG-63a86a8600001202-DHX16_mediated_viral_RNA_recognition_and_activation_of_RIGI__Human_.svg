<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#999" stroke-width="2" />
  <text x="60" y="80" font-family="Arial" font-size="18" fill="#333">Human Cell</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="110" font-family="Arial" font-size="16" fill="#555" text-anchor="middle" font-weight="bold">Cytoplasm (GO:0005737)</text>
  
  <!-- Viral RNA -->
  <path d="M 150,200 C 170,180 190,220 210,200 C 230,180 250,220 270,200" fill="none" stroke="#CC0000" stroke-width="3" />
  <text x="200" y="170" font-family="Arial" font-size="14" fill="#CC0000" text-anchor="middle" font-weight="bold">Viral RNA</text>
  
  <!-- DHX16 (Step 1) -->
  <rect x="300" y="180" width="100" height="50" rx="10" ry="10" fill="#8ECAE6" stroke="#333" stroke-width="2" />
  <text x="350" y="210" font-family="Arial" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">DHX16</text>
  <text x="350" y="228" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">UniProtKB:O60231</text>
  
  <!-- Arrow from Viral RNA to DHX16 -->
  <line x1="270" y1="200" x2="295" y2="200" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="282" y="185" font-family="Arial" font-size="12" fill="#555">Recognizes</text>
  <text x="282" y="220" font-family="Arial" font-size="10" fill="#777">GO:0038187</text>
  
  <!-- TRIM6 -->
  <rect x="150" y="300" width="100" height="50" rx="10" ry="10" fill="#FB8500" stroke="#333" stroke-width="2" />
  <text x="200" y="330" font-family="Arial" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">TRIM6</text>
  <text x="200" y="345" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">UniProtKB:Q9C030</text>
  
  <!-- Polyubiquitin chains -->
  <g transform="translate(300, 325)">
    <circle cx="0" cy="0" r="10" fill="#FFB703" stroke="#333" />
    <circle cx="15" cy="0" r="10" fill="#FFB703" stroke="#333" />
    <circle cx="30" cy="0" r="10" fill="#FFB703" stroke="#333" />
    <circle cx="45" cy="0" r="10" fill="#FFB703" stroke="#333" />
    <text x="22" y="-15" font-family="Arial" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">Polyubiquitin chains</text>
  </g>
  
  <!-- Arrow from TRIM6 to ubiquitin -->
  <line x1="250" y1="325" x2="295" y2="325" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="272" y="310" font-family="Arial" font-size="10" fill="#777">GO:0061630</text>
  <text x="272" y="345" font-family="Arial" font-size="10" fill="#777">GO:0010994</text>
  
  <!-- DHX16 binding ubiquitin -->
  <rect x="400" y="300" width="100" height="50" rx="10" ry="10" fill="#8ECAE6" stroke="#333" stroke-width="2" />
  <text x="450" y="325" font-family="Arial" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">DHX16</text>
  <text x="450" y="345" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">Ubiquitin binding</text>
  
  <!-- Arrow from ubiquitin to DHX16 -->
  <line x1="350" y1="325" x2="395" y2="325" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="372" y="315" font-family="Arial" font-size="10" fill="#777">GO:0043130</text>
  
  <!-- Arrow from DHX16 (top) to DHX16 (middle) -->
  <path d="M 350,230 L 350,260 L 400,300" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- RIG-I -->
  <rect x="550" y="300" width="100" height="50" rx="10" ry="10" fill="#023047" stroke="#333" stroke-width="2" />
  <text x="600" y="330" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">RIG-I</text>
  <text x="600" y="345" font-family="Arial" font-size="10" fill="#ccc" text-anchor="middle">UniProtKB:O95786</text>
  
  <!-- Arrow from DHX16 to RIG-I -->
  <line x1="500" y1="325" x2="545" y2="325" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="522" y="315" font-family="Arial" font-size="10" fill="#777">GO:0060090</text>
  <text x="522" y="345" font-family="Arial" font-size="12" fill="#555">Adaptor</text>
  
  <!-- Activated RIG-I -->
  <rect x="550" y="400" width="100" height="50" rx="10" ry="10" fill="#023047" stroke="#f00" stroke-width="3" />
  <text x="600" y="425" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Activated RIG-I</text>
  <text x="600" y="442" font-family="Arial" font-size="10" fill="#ccc" text-anchor="middle">GO:0038187</text>
  
  <!-- Arrow from RIG-I to Activated RIG-I -->
  <line x1="600" y1="350" x2="600" y2="395" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- Process Steps Numbers -->
  <circle cx="270" y="180" r="15" fill="#333" />
  <text x="270" y="185" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  
  <circle cx="200" y="280" r="15" fill="#333" />
  <text x="200" y="285" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  
  <circle cx="350" y="300" r="15" fill="#333" />
  <text x="350" y="305" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
  
  <circle cx="520" y="300" r="15" fill="#333" />
  <text x="520" y="305" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
  
  <circle cx="600" y="380" r="15" fill="#333" />
  <text x="600" y="385" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
  
  <!-- Pathway label -->
  <rect x="150" y="480" width="500" height="30" rx="15" ry="15" fill="#e6f2ff" stroke="#333" stroke-width="1" />
  <text x="400" y="500" font-family="Arial" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">Antiviral Innate Immune Response (GO:0140374)</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>