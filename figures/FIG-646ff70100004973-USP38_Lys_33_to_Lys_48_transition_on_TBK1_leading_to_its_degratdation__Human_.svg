<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Cytoplasm -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9"/>
  <text x="40" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Cytoplasm (GO:0005737)</text>
  
  <!-- Cell outline -->
  <rect x="20" y="20" width="760" height="560" rx="50" ry="50" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Title -->
  <rect x="150" y="45" width="500" height="30" rx="5" ry="5" fill="#f0f0f0" stroke="none"/>
  <text x="400" y="67" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">USP38 Lys-33 to Lys-48 transition on TBK1 leading to its degradation</text>
  
  <!-- Proteins and their interactions -->
  <!-- NLRP4 -->
  <circle cx="150" cy="200" r="40" fill="#b3e0ff" stroke="#333" stroke-width="2"/>
  <text x="150" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">NLRP4</text>
  
  <!-- USP38 -->
  <circle cx="300" cy="200" r="40" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="300" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">USP38</text>
  
  <!-- DTX4 -->
  <circle cx="450" cy="200" r="40" fill="#c2f0c2" stroke="#333" stroke-width="2"/>
  <text x="450" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">DTX4</text>
  
  <!-- TBK1 -->
  <circle cx="600" cy="200" r="40" fill="#d9b3ff" stroke="#333" stroke-width="2"/>
  <text x="600" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">TBK1</text>
  
  <!-- Proteasome (implicit - marked as not in source) -->
  <rect x="600" y="350" width="80" height="50" rx="10" ry="10" fill="#ffaaaa" stroke="#333" stroke-width="2"/>
  <text x="640" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">Proteasome</text>
  <text x="640" y="395" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#666">(Not in source data)</text>
  
  <!-- NLRP4 to USP38 interaction (adaptor activity) -->
  <path d="M190 200 L260 200" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="200" y="170" width="50" height="20" rx="10" ry="10" fill="#ffffff" stroke="none"/>
  <text x="225" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">adaptor</text>
  
  <!-- USP38 to TBK1 interaction (K33-linked deubiquitination) -->
  <path d="M340 200 Q 450 130 560 200" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="420" y="115" width="130" height="45" rx="10" ry="10" fill="#ffffcc" stroke="#333" stroke-width="1"/>
  <text x="485" y="138" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">K33-linked</text>
  <text x="485" y="155" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">deubiquitination</text>
  
  <!-- USP38 activity leads to NLRP4 adaptor function for DTX4 - Repositioned -->
  <path d="M300 240 Q 320 280 360 265" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="310" y="265" width="60" height="20" rx="10" ry="10" fill="#ffffff" stroke="none"/>
  <text x="340" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">enables</text>
  
  <!-- NLRP4 to DTX4 interaction (adaptor activity) - Repositioned -->
  <path d="M190 220 Q 320 320 410 220" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="280" y="310" width="60" height="20" rx="10" ry="10" fill="#ffffff" stroke="none"/>
  <text x="310" y="325" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">adaptor</text>
  
  <!-- DTX4 to TBK1 interaction (K48-linked ubiquitination) -->
  <path d="M490 200 L560 200" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="500" y="150" width="130" height="45" rx="10" ry="10" fill="#ffffcc" stroke="#333" stroke-width="1"/>
  <text x="565" y="173" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">K48-linked</text>
  <text x="565" y="190" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">ubiquitination</text>
  
  <!-- TBK1 to Proteasome (degradation) -->
  <path d="M600 240 L600 350" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="605" y="290" width="80" height="20" rx="10" ry="10" fill="#ffffff" stroke="none"/>
  <text x="645" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">degradation</text>

  <!-- Biological Process Annotations - Changed border -->
  <rect x="50" y="450" width="250" height="100" rx="10" ry="10" fill="#e6e6fa" stroke="#333" stroke-width="2" stroke-dasharray="0"/>
  <text x="175" y="470" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Biological Processes:</text>
  <text x="60" y="495" font-family="Arial" font-size="12" fill="#333">• Negative regulation of innate immune</text>
  <text x="65" y="510" font-family="Arial" font-size="12" fill="#333">  response (GO:0045824)</text>
  <text x="60" y="530" font-family="Arial" font-size="12" fill="#333">• Antiviral innate immune response</text>
  <text x="65" y="545" font-family="Arial" font-size="12" fill="#333">  (GO:0140374)</text>
  
  <!-- Molecular Function Annotations - Changed border -->
  <rect x="330" y="450" width="250" height="120" rx="10" ry="10" fill="#e6f2ff" stroke="#333" stroke-width="2" stroke-dasharray="3,1"/>
  <text x="455" y="470" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Molecular Functions:</text>
  <text x="340" y="495" font-family="Arial" font-size="12" fill="#333">• NLRP4: Molecular adaptor activity</text>
  <text x="340" y="515" font-family="Arial" font-size="12" fill="#333">• USP38: Cysteine-type deubiquitinase</text>
  <text x="340" y="535" font-family="Arial" font-size="12" fill="#333">• DTX4: Ubiquitin protein ligase activity</text>
  <text x="340" y="555" font-family="Arial" font-size="12" fill="#333">• TBK1: Protein Ser/Thr kinase activity</text>
    
  <!-- Marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- K33-linked ubiquitin on TBK1 (before deubiquitination) -->
  <circle cx="620" cy="160" r="10" fill="#ffffcc" stroke="#333" stroke-width="1"/>
  <text x="620" y="163" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">K33</text>
  
  <!-- K48-linked ubiquitin on TBK1 (after DTX4 activity) -->
  <circle cx="640" cy="180" r="10" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="640" y="183" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">K48</text>
  
  <!-- Legend for protein colors -->
  <rect x="620" y="450" width="120" height="120" rx="10" ry="10" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="680" y="470" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  <circle cx="635" y="490" r="8" fill="#b3e0ff" stroke="#333" stroke-width="1"/>
  <text x="680" y="495" font-family="Arial" font-size="12" fill="#333">NLRP4</text>
  <circle cx="635" y="510" r="8" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="680" y="515" font-family="Arial" font-size="12" fill="#333">USP38</text>
  <circle cx="635" y="530" r="8" fill="#c2f0c2" stroke="#333" stroke-width="1"/>
  <text x="680" y="535" font-family="Arial" font-size="12" fill="#333">DTX4</text>
  <circle cx="635" y="550" r="8" fill="#d9b3ff" stroke="#333" stroke-width="1"/>
  <text x="680" y="555" font-family="Arial" font-size="12" fill="#333">TBK1</text>
</svg>