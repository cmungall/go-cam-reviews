<svg width="800" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane and compartments -->
  <rect x="50" y="50" width="700" height="800" rx="20" ry="20" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  
  <!-- Endoplasmic reticulum -->
  <path d="M100 550 Q150 500 200 550 Q250 600 300 550 Q350 500 400 550 Q450 600 500 550 Q550 500 600 550" 
        fill="none" stroke="#8a6d3b" stroke-width="3"/>
  <path d="M100 560 Q150 510 200 560 Q250 610 300 560 Q350 510 400 560 Q450 610 500 560 Q550 510 600 560" 
        fill="none" stroke="#8a6d3b" stroke-width="3"/>
  <path d="M100 570 Q150 520 200 570 Q250 620 300 570 Q350 520 400 570 Q450 620 500 570 Q550 520 600 570" 
        fill="none" stroke="#8a6d3b" stroke-width="3"/>
  <text x="350" y="600" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Endoplasmic Reticulum</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="400" cy="250" rx="200" ry="120" fill="#d9ead3" stroke="#274e13" stroke-width="3"/>
  <ellipse cx="400" cy="250" rx="180" ry="100" fill="#d9ead3" stroke="#274e13" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="250" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Mitochondrion</text>
  
  <!-- Cytosol label -->
  <text x="400" y="100" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cytosol</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Gluconeogenesis Pathway (Mouse)</text>
  
  <!-- Pathway components in mitochondria -->
  <!-- Pcx (Pyruvate carboxylase) -->
  <circle cx="300" cy="200" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="300" y="195" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Pcx</text>
  <text x="300" y="210" font-family="Arial" font-size="9" text-anchor="middle">Pyruvate carboxylase</text>
  
  <!-- Got2 (Aspartate aminotransferase) -->
  <circle cx="400" cy="200" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="400" y="195" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Got2</text>
  <text x="400" y="210" font-family="Arial" font-size="9" text-anchor="middle">Asp aminotransferase</text>
  
  <!-- Slc25a12 (Aspartate carrier) -->
  <rect x="475" y="200" width="50" height="25" fill="#a0d6b4" stroke="#333" stroke-width="2" rx="5" ry="5"/>
  <text x="500" y="215" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Slc25a12</text>
  
  <!-- Slc25a13 (Aspartate carrier) -->
  <rect x="475" y="240" width="50" height="25" fill="#a0d6b4" stroke="#333" stroke-width="2" rx="5" ry="5"/>
  <text x="500" y="255" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Slc25a13</text>
  
  <!-- Slc25a11 (Oxoglutarate carrier) -->
  <rect x="475" y="280" width="50" height="25" fill="#a0d6b4" stroke="#333" stroke-width="2" rx="5" ry="5"/>
  <text x="500" y="295" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Slc25a11</text>
  
  <!-- Pathway components in cytosol -->
  <!-- Got1 -->
  <circle cx="600" cy="320" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="600" y="315" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Got1</text>
  <text x="600" y="330" font-family="Arial" font-size="9" text-anchor="middle">Asp aminotransferase</text>
  
  <!-- Pck1 -->
  <circle cx="520" cy="370" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="520" y="365" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Pck1</text>
  <text x="520" y="380" font-family="Arial" font-size="9" text-anchor="middle">PEPCK</text>
  
  <!-- Eno1 -->
  <circle cx="440" cy="420" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="440" y="415" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Eno1</text>
  <text x="440" y="430" font-family="Arial" font-size="9" text-anchor="middle">Enolase</text>
  
  <!-- Pgam1 -->
  <circle cx="360" cy="470" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="360" y="465" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Pgam1</text>
  <text x="360" y="480" font-family="Arial" font-size="9" text-anchor="middle">Phosphoglycerate mutase</text>
  
  <!-- Pgk1 -->
  <circle cx="280" cy="420" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="280" y="415" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Pgk1</text>
  <text x="280" y="430" font-family="Arial" font-size="9" text-anchor="middle">Phosphoglycerate kinase</text>
  
  <!-- Gapdh -->
  <circle cx="200" cy="370" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="200" y="365" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Gapdh</text>
  <text x="200" y="380" font-family="Arial" font-size="9" text-anchor="middle">GAPDH</text>
  
  <!-- Tpi1 -->
  <circle cx="120" cy="420" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="120" y="415" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Tpi1</text>
  <text x="120" y="430" font-family="Arial" font-size="9" text-anchor="middle">Triosephosphate isomerase</text>
  
  <!-- Aldoc -->
  <circle cx="200" cy="470" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="200" y="465" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Aldoc</text>
  <text x="200" y="480" font-family="Arial" font-size="9" text-anchor="middle">Aldolase</text>
  
  <!-- Fbp1 -->
  <circle cx="280" cy="520" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="280" y="515" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Fbp1</text>
  <text x="280" y="530" font-family="Arial" font-size="9" text-anchor="middle">Fructose-1,6-bisphosphatase</text>
  
  <!-- Gpi1 -->
  <circle cx="360" cy="520" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="360" y="515" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Gpi1</text>
  <text x="360" y="530" font-family="Arial" font-size="9" text-anchor="middle">Glucose-6-P isomerase</text>
  
  <!-- Components in ER -->
  <!-- Slc37a4 -->
  <rect x="280" y="580" width="50" height="25" fill="#a0d6b4" stroke="#333" stroke-width="2" rx="5" ry="5"/>
  <text x="305" y="595" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Slc37a4</text>
  
  <!-- G6pc1 -->
  <circle cx="400" cy="580" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="400" y="575" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">G6pc1</text>
  <text x="400" y="590" font-family="Arial" font-size="9" text-anchor="middle">Glucose-6-phosphatase</text>
  
  <!-- G6pc3 -->
  <circle cx="480" cy="580" r="25" fill="#c2e0d9" stroke="#333" stroke-width="2"/>
  <text x="480" y="575" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">G6pc3</text>
  <text x="480" y="590" font-family="Arial" font-size="9" text-anchor="middle">Glucose-6-phosphatase 3</text>
  
  <!-- Pathway arrows with different colors per compartment -->
  <!-- Mitochondrial reactions - Green arrows -->
  <line x1="250" y1="200" x2="275" y2="200" stroke="#006400" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="250" y="190" font-family="Arial" font-size="11" text-anchor="middle">Pyruvate</text>
  
  <line x1="325" y1="200" x2="375" y2="200" stroke="#006400" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="350" y="185" font-family="Arial" font-size="11" text-anchor="middle">Oxaloacetate</text>
  
  <line x1="425" y1="200" x2="475" y2="200" stroke="#006400" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="425" y1="200" x2="475" y2="240" stroke="#006400" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="425" y1="200" x2="475" y2="280" stroke="#006400" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="450" y="175" font-family="Arial" font-size="11" text-anchor="middle">Aspartate</text>
  <text x="450" y="270" font-family="Arial" font-size="11" text-anchor="middle">α-Ketoglutarate</text>
  
  <!-- Transport to cytosol - Purple arrows -->
  <line x1="525" y1="200" x2="600" y2="295" stroke="#800080" stroke-width="2" marker-end="url(#arrowhead-purple)" stroke-dasharray="5,3"/>
  <line x1="525" y1="240" x2="600" y2="295" stroke="#800080" stroke-width="2" marker-end="url(#arrowhead-purple)" stroke-dasharray="5,3"/>
  <line x1="525" y1="280" x2="600" y2="295" stroke="#800080" stroke-width="2" marker-end="url(#arrowhead-purple)" stroke-dasharray="5,3"/>
  
  <!-- Cytosolic reactions - Blue arrows -->
  <line x1="600" y1="345" x2="545" y2="370" stroke="#0000CD" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="575" y="365" font-family="Arial" font-size="11" text-anchor="middle">Oxaloacetate</text>
  
  <line x1="520" y1="395" x2="465" y2="420" stroke="#0000CD" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="500" y="420" font-family="Arial" font-size="11" text-anchor="middle">PEP</text>
  
  <line x1="440" y1="445" x2="385" y2="470" stroke="#0000CD" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="425" y="470" font-family="Arial" font-size="11" text-anchor="middle">2-PG</text>
  
  <line x1="360" y1="445" x2="305" y2="420" stroke="#0000CD" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="345" y="420" font-family="Arial" font-size="11" text-anchor="middle">3-PG</text>
  
  <line x1="280" y1="395" x2="225" y2="370" stroke="#0000CD" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="260" y="370" font-family="Arial" font-size="11" text-anchor="middle">1,3-BPG</text>
  
  <line x1="200" y1="395" x2="145" y2="420" stroke="#0000CD" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="180" y="420" font-family="Arial" font-size="11" text-anchor="middle">G3P</text>
  
  <line x1="120" y1="445" x2="175" y2="470" stroke="#0000CD" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="120" y="460" font-family="Arial" font-size="11" text-anchor="middle">DHAP</text>
  
  <line x1="200" y1="495" x2="255" y2="520" stroke="#0000CD" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="228" y="520" font-family="Arial" font-size="11" text-anchor="middle">F-1,6-BP</text>
  
  <line x1="280" y1="520" x2="335" y2="520" stroke="#0000CD" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="310" y="505" font-family="Arial" font-size="11" text-anchor="middle">F-6-P</text>
  
  <!-- Connection to ER - Orange arrows -->
  <line x1="360" y1="545" x2="330" y2="580" stroke="#FF8C00" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  <text x="355" y="570" font-family="Arial" font-size="11" text-anchor="middle">G-6-P</text>
  
  <line x1="330" y1="580" x2="375" y2="580" stroke="#FF8C00" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  <line x1="330" y1="580" x2="455" y2="580" stroke="#FF8C00" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  
  <!-- Final glucose output arrows -->
  <line x1="400" y1="605" x2="400" y2="650" stroke="#FF0000" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  <line x1="480" y1="605" x2="480" y2="650" stroke="#FF0000" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  
  <!-- Glucose output -->
  <ellipse cx="440" cy="670" rx="60" ry="25" fill="#f9cb9c" stroke="#333" stroke-width="2"/>
  <text x="440" y="675" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Glucose</text>
  
  <!-- Arrow head definitions for different colors -->
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006400"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0000CD"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#800080"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF8C00"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF0000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="640" width="150" height="160" fill="white" stroke="#333" stroke-width="1"/>
  <text x="675" y="655" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="615" y="675" r="10" fill="#c2e0d9" stroke="#333" stroke-width="1"/>
  <text x="675" y="680" font-family="Arial" font-size="12" text-anchor="middle">Enzyme</text>
  
  <rect x="605" y="695" width="20" height="10" fill="#a0d6b4" stroke="#333" stroke-width="1" rx="2" ry="2"/>
  <text x="675" y="700" font-family="Arial" font-size="12" text-anchor="middle">Transporter</text>
  
  <line x1="610" y1="715" x2="640" y2="715" stroke="#006400" stroke-width="1" marker-end="url(#arrowhead-green)"/>
  <text x="675" y="720" font-family="Arial" font-size="12" text-anchor="middle">Mitochondrial reactions</text>
  
  <line x1="610" y1="735" x2="640" y2="735" stroke="#800080" stroke-width="1" marker-end="url(#arrowhead-purple)" stroke-dasharray="5,3"/>
  <text x="675" y="740" font-family="Arial" font-size="12" text-anchor="middle">Transport across membranes</text>
  
  <line x1="610" y1="755" x2="640" y2="755" stroke="#0000CD" stroke-width="1" marker-end="url(#arrowhead-blue)"/>
  <text x="675" y="760" font-family="Arial" font-size="12" text-anchor="middle">Cytosolic reactions</text>
  
  <line x1="610" y1="775" x2="640" y2="775" stroke="#FF8C00" stroke-width="1" marker-end="url(#arrowhead-orange)"/>
  <text x="675" y="780" font-family="Arial" font-size="12" text-anchor="middle">ER reactions</text>
  
  <line x1="610" y1="795" x2="640" y2="795" stroke="#FF0000" stroke-width="1" marker-end="url(#arrowhead-red)"/>
  <text x="675" y="800" font-family="Arial" font-size="12" text-anchor="middle">Glucose release</text>
</svg>