<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  
  <!-- Cell membrane -->
  <path d="M 50 150 L 750 150" stroke="#333" stroke-width="4" fill="none"/>
  
  <!-- Membrane label -->
  <text x="60" y="140" font-family="Arial" font-size="16" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytoplasm label -->
  <text x="60" y="180" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm</text>
  
  <!-- Extracellular label -->
  <text x="60" y="100" font-family="Arial" font-size="16" font-weight="bold">Extracellular Space</text>
  
  <!-- ZDHHC5 in membrane -->
  <rect x="200" y="130" width="80" height="40" rx="5" fill="#8dd3c7" stroke="#333" stroke-width="2"/>
  <text x="205" y="155" font-family="Arial" font-size="15" font-weight="bold">ZDHHC5</text>
  <text x="170" y="120" font-family="Arial" font-size="11">Protein-cysteine S-palmitoyltransferase</text>
  
  <!-- NOD2 initially in cytoplasm -->
  <rect x="350" y="250" width="60" height="30" rx="5" fill="#ffffb3" stroke="#333" stroke-width="2"/>
  <text x="355" y="270" font-family="Arial" font-size="15" font-weight="bold">NOD2</text>
  <text x="330" y="290" font-family="Arial" font-size="11">Cytoplasmic NOD2</text>
  
  <!-- Flow indicator 1 -->
  <text x="250" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#555">①</text>
  
  <!-- Arrow for palmitoylation -->
  <path d="M 280 150 C 320 150, 330 220, 350 250" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="290" y="190" font-family="Arial" font-size="13">Palmitoylation</text>
  
  <!-- NOD2 at membrane after palmitoylation -->
  <rect x="450" y="130" width="60" height="40" rx="5" fill="#ffffb3" stroke="#333" stroke-width="2"/>
  <text x="455" y="155" font-family="Arial" font-size="15" font-weight="bold">NOD2</text>
  <text x="415" y="120" font-family="Arial" font-size="11">Pattern recognition receptor</text>
  
  <!-- Flow indicator 2 -->
  <text x="410" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#555">②</text>
  
  <!-- Arrow for NOD2 movement to membrane -->
  <path d="M 410 250 C 430 200, 440 170, 450 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="420" y="210" font-family="Arial" font-size="13">Localization</text>
  
  <!-- Muramyl dipeptide -->
  <ellipse cx="450" cy="90" rx="40" ry="20" fill="#fbceb1" stroke="#333" stroke-width="1"/>
  <text x="412" y="95" font-family="Arial" font-size="12">Muramyl Dipeptide</text>
  
  <!-- Flow indicator 3 -->
  <text x="470" y="110" font-family="Arial" font-size="14" font-weight="bold" fill="#555">③</text>
  
  <!-- Arrow for MDP binding to NOD2 -->
  <path d="M 450 90 L 480 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="430" y="110" font-family="Arial" font-size="12">Binding</text>
  
  <!-- RIPK2 -->
  <rect x="550" y="200" width="60" height="30" rx="5" fill="#bebada" stroke="#333" stroke-width="2"/>
  <text x="555" y="220" font-family="Arial" font-size="15" font-weight="bold">RIPK2</text>
  <text x="550" y="240" font-family="Arial" font-size="11">Signaling adaptor</text>
  
  <!-- Flow indicator 4 -->
  <text x="520" y="170" font-family="Arial" font-size="14" font-weight="bold" fill="#555">④</text>
  
  <!-- Arrow for NOD2 activating RIPK2 -->
  <path d="M 510 150 C 530 170, 540 190, 550 210" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="520" y="180" font-family="Arial" font-size="13">Activation</text>
  
  <!-- XIAP in cytoplasm -->
  <rect x="470" y="350" width="60" height="30" rx="5" fill="#fb8072" stroke="#333" stroke-width="2"/>
  <text x="480" y="370" font-family="Arial" font-size="15" font-weight="bold">XIAP</text>
  <text x="450" y="390" font-family="Arial" font-size="11">Ubiquitin protein ligase</text>
  
  <!-- Flow indicator 5 -->
  <text x="550" y="300" font-family="Arial" font-size="14" font-weight="bold" fill="#555">⑤</text>
  
  <!-- Arrow for RIPK2 to XIAP -->
  <path d="M 580 230 C 580 280, 530 320, 500 350" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="530" y="290" font-family="Arial" font-size="13">Signaling</text>
  
  <!-- Flow indicator 6 -->
  <text x="600" y="290" font-family="Arial" font-size="14" font-weight="bold" fill="#555">⑥</text>
  
  <!-- Ubiquitination -->
  <path d="M 530 350 C 600 350, 600 250, 610 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="570" y="320" font-family="Arial" font-size="13">K63-linked</text>
  <text x="570" y="335" font-family="Arial" font-size="13">Ubiquitination</text>
  
  <!-- Show ubiquitin tags on RIPK2 -->
  <circle cx="610" cy="200" r="7" fill="#ffed6f" stroke="#333" stroke-width="1"/>
  <circle cx="620" cy="195" r="7" fill="#ffed6f" stroke="#333" stroke-width="1"/>
  <circle cx="630" cy="200" r="7" fill="#ffed6f" stroke="#333" stroke-width="1"/>
  
  <!-- Biological processes annotation -->
  <rect x="90" y="300" width="200" height="100" rx="5" fill="#f8f9fa" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="320" font-family="Arial" font-size="13" font-style="italic">Key Biological Processes:</text>
  <text x="100" y="340" font-family="Arial" font-size="12" font-style="italic">• Protein localization to plasma membrane</text>
  <text x="100" y="360" font-family="Arial" font-size="12" font-style="italic">• Response to muramyl dipeptide</text>
  <text x="100" y="380" font-family="Arial" font-size="12" font-style="italic">• NOD2 signaling pathway</text>
  <text x="100" y="400" font-family="Arial" font-size="12" font-style="italic">• K63-linked ubiquitination</text>
  
  <!-- Legend -->
  <rect x="620" y="400" width="120" height="140" rx="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="630" y="420" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <rect x="630" y="430" width="20" height="10" rx="2" fill="#8dd3c7" stroke="#333" stroke-width="1"/>
  <text x="655" y="440" font-family="Arial" font-size="12">ZDHHC5</text>
  
  <rect x="630" y="450" width="20" height="10" rx="2" fill="#ffffb3" stroke="#333" stroke-width="1"/>
  <text x="655" y="460" font-family="Arial" font-size="12">NOD2</text>
  
  <rect x="630" y="470" width="20" height="10" rx="2" fill="#bebada" stroke="#333" stroke-width="1"/>
  <text x="655" y="480" font-family="Arial" font-size="12">RIPK2</text>
  
  <rect x="630" y="490" width="20" height="10" rx="2" fill="#fb8072" stroke="#333" stroke-width="1"/>
  <text x="655" y="500" font-family="Arial" font-size="12">XIAP</text>
  
  <ellipse cx="640" cy="510" rx="10" ry="5" fill="#fbceb1" stroke="#333" stroke-width="1"/>
  <text x="655" y="520" font-family="Arial" font-size="12">MDP</text>
  
  <circle cx="640" cy="530" r="5" fill="#ffed6f" stroke="#333" stroke-width="1"/>
  <text x="655" y="535" font-family="Arial" font-size="12">Ubiquitin</text>
  
  <!-- Title and Subtitle -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">NOD2 Localization to the Plasma Membrane</text>
  <text x="400" y="55" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle">Palmitoylation by ZDHHC5 and Downstream Signaling</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>