<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">CASP7 activates SMPD1 to repair perforin pores in hepatocytes</text>
  
  <!-- Cell outline - Hepatocyte -->
  <rect x="100" y="100" width="600" height="400" rx="50" ry="50" fill="#e6f2ff" stroke="#2c3e50" stroke-width="2" />
  <text x="120" y="130" font-family="Arial" font-size="16" font-weight="bold">Hepatocyte (CL:0000182)</text>
  
  <!-- Extracellular space label -->
  <text x="120" y="90" font-family="Arial" font-size="16" font-weight="bold">Extracellular space (GO:0005615)</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="160" font-family="Arial" font-size="14" font-style="italic">Cytoplasm (GO:0005737)</text>
  
  <!-- Perforin PRF1 making pores -->
  <circle cx="200" cy="100" r="20" fill="#ff9999" stroke="#993333" stroke-width="2" />
  <text x="200" y="105" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#993333">PRF1</text>
  
  <!-- Perforin pores in membrane -->
  <ellipse cx="200" cy="300" rx="25" ry="10" fill="white" stroke="#2c3e50" stroke-width="2" />
  <ellipse cx="300" cy="300" rx="25" ry="10" fill="white" stroke="#2c3e50" stroke-width="2" />
  <ellipse cx="400" cy="300" rx="25" ry="10" fill="white" stroke="#2c3e50" stroke-width="2" />
  <text x="300" y="285" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Perforin pores</text>
  
  <!-- GZMB -->
  <rect x="250" y="120" width="40" height="40" fill="#99ccff" stroke="#336699" stroke-width="2" rx="5" ry="5" />
  <text x="270" y="145" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#336699">GZMB</text>
  
  <!-- CASP7 -->
  <rect x="350" y="200" width="40" height="40" fill="#99cc99" stroke="#336633" stroke-width="2" rx="5" ry="5" />
  <text x="370" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#336633">CASP7</text>
  
  <!-- SMPD1 -->
  <rect x="450" y="200" width="40" height="40" fill="#ffcc99" stroke="#996633" stroke-width="2" rx="5" ry="5" />
  <text x="470" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#996633">SMPD1</text>
  
  <!-- Ceramide production -->
  <ellipse cx="550" cy="300" rx="40" ry="20" fill="#ffff99" stroke="#999933" stroke-width="2" />
  <text x="550" y="305" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#999933">Ceramide</text>
  
  <!-- Membrane repair process -->
  <path d="M500,320 Q550,350 600,320" stroke="#2c3e50" stroke-width="2" fill="none" />
  <text x="550" y="360" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Membrane repair</text>
  <text x="550" y="375" font-family="Arial" font-size="10" text-anchor="middle">(GO:0001778)</text>
  
  <!-- Arrows for the pathway -->
  <!-- PRF1 to pore formation -->
  <path d="M200,120 L200,270" stroke="#ff0000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="140" y="180" width="120" height="40" fill="white" fill-opacity="0.8" rx="5" ry="5" stroke="#993333" stroke-width="1" />
  <text x="200" y="195" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#993333">Pore formation</text>
  <text x="200" y="210" font-family="Arial" font-size="10" text-anchor="middle">(GO:0022829)</text>
  
  <!-- GZMB to CASP7 activation -->
  <path d="M290,140 L350,200" stroke="#0000ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="290" y="150" width="90" height="40" fill="white" fill-opacity="0.8" rx="5" ry="5" stroke="#336699" stroke-width="1" />
  <text x="335" y="165" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#336699">Proteolysis</text>
  <text x="335" y="180" font-family="Arial" font-size="10" text-anchor="middle">(GO:0004252)</text>
  
  <!-- CASP7 to SMPD1 activation -->
  <path d="M390,220 L450,220" stroke="#00cc00" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="380" y="170" width="80" height="40" fill="white" fill-opacity="0.8" rx="5" ry="5" stroke="#336633" stroke-width="1" />
  <text x="420" y="185" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#336633">Proteolytic</text>
  <text x="420" y="200" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#336633">activation</text>
  <text x="420" y="212" font-family="Arial" font-size="10" text-anchor="middle">(GO:0004197)</text>
  
  <!-- SMPD1 to Ceramide -->
  <path d="M490,220 L530,280" stroke="#996633" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="470" y="230" width="90" height="40" fill="white" fill-opacity="0.8" rx="5" ry="5" stroke="#996633" stroke-width="1" />
  <text x="515" y="245" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#996633">Ceramide</text>
  <text x="515" y="260" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#996633">production</text>
  <text x="515" y="272" font-family="Arial" font-size="10" text-anchor="middle">(GO:0061750)</text>
  
  <!-- Ceramide to membrane repair -->
  <path d="M550,320 L550,335" stroke="#999933" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Process labels -->
  <rect x="130" y="320" width="150" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="205" y="335" font-family="Arial" font-size="12" text-anchor="middle">Protein secretion (GO:0009306)</text>
  
  <rect x="350" y="350" width="200" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="450" y="365" font-family="Arial" font-size="12" text-anchor="middle">Ceramide biosynthesis (GO:0046513)</text>
  
  <!-- Cell death process label -->
  <rect x="130" y="380" width="240" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="250" y="395" font-family="Arial" font-size="12" text-anchor="middle">Granzyme-mediated cell death (GO:0140507)</text>
  
  <!-- Legend -->
  <rect x="100" y="510" width="600" height="80" fill="white" stroke="#2c3e50" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="530" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  
  <!-- Legend items -->
  <rect x="120" y="540" width="15" height="15" fill="#ff9999" stroke="#993333" stroke-width="1" />
  <text x="145" y="553" font-family="Arial" font-size="12">PRF1 (Perforin, UniProtKB:P14222)</text>
  
  <rect x="120" y="565" width="15" height="15" fill="#99ccff" stroke="#336699" stroke-width="1" />
  <text x="145" y="578" font-family="Arial" font-size="12">GZMB (Granzyme B, UniProtKB:P10144)</text>
  
  <rect x="350" y="540" width="15" height="15" fill="#99cc99" stroke="#336633" stroke-width="1" />
  <text x="375" y="553" font-family="Arial" font-size="12">CASP7 (Caspase-7, UniProtKB:P55210)</text>
  
  <rect x="350" y="565" width="15" height="15" fill="#ffcc99" stroke="#996633" stroke-width="1" />
  <text x="375" y="578" font-family="Arial" font-size="12">SMPD1 (Acid Sphingomyelinase, UniProtKB:P17405)</text>
  
  <ellipse cx="570" y="548" rx="15" ry="8" fill="#ffff99" stroke="#999933" stroke-width="1" />
  <text x="595" y="553" font-family="Arial" font-size="12">Ceramide (CHEBI:52639)</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
</svg>