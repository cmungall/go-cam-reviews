<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell representations -->
  <rect x="0" y="0" width="800" height="700" fill="#f8f9fa" />
  
  <!-- Cell membrane -->
  <path d="M100,150 Q400,100 700,150 Q700,400 400,450 Q100,400 100,150" fill="#e6f2ff" stroke="#333" stroke-width="2" />
  <path d="M100,150 Q400,100 700,150" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="5,3" />
  
  <!-- Label the compartments -->
  <text x="400" y="80" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Extracellular Space (GO:0005615)</text>
  <text x="400" y="500" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Cytoplasm (GO:0005737)</text>
  <text x="150" y="130" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Plasma Membrane</text>
  <text x="150" y="150" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">(GO:0005886)</text>
  
  <!-- Cell label -->
  <text x="700" y="180" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Microglial Cell</text>
  <text x="700" y="200" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">(CL:0000129)</text>
  
  <!-- APOE in extracellular space -->
  <circle cx="300" cy="80" r="30" fill="#ff9999" stroke="#333" stroke-width="2" />
  <text x="300" y="85" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">APOE</text>
  <text x="300" y="40" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Receptor ligand activity</text>
  <text x="300" y="120" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">(UniProtKB:P02649)</text>
  
  <!-- TREM2 receptor in membrane -->
  <rect x="280" y="150" width="80" height="40" fill="#99ccff" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="320" y="175" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">TREM2</text>
  <text x="320" y="210" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">(UniProtKB:Q9NZC2)</text>
  
  <!-- TYROBP (DAP12) adaptor protein -->
  <rect x="320" y="250" width="80" height="40" fill="#99ff99" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="360" y="275" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">TYROBP</text>
  <text x="360" y="295" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">(UniProtKB:O43914)</text>
  
  <!-- SYK in cytoplasm -->
  <rect x="320" y="350" width="80" height="40" fill="#cc99ff" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="360" y="375" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">SYK</text>
  <text x="360" y="395" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">(UniProtKB:P43405)</text>
  
  <!-- Arrows and interactions -->
  <path d="M300,110 L300,150" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="340" y="130" font-family="Arial" font-size="14" fill="#333">activates</text>
  
  <path d="M320,190 L320,250" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="280" y="220" font-family="Arial" font-size="14" fill="#333">recruits</text>
  
  <path d="M360,290 L360,350" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="390" y="320" font-family="Arial" font-size="14" fill="#333">activates</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  
  <!-- Process labels -->
  <rect x="450" y="200" width="220" height="70" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="10" ry="10" />
  <text x="560" y="225" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Cellular response to</text>
  <text x="560" y="245" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">lipoprotein particle stimulus</text>
  <text x="560" y="265" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">(GO:0071402)</text>
  
  <rect x="450" y="300" width="220" height="70" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="10" ry="10" />
  <text x="560" y="325" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Cellular response to</text>
  <text x="560" y="345" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">amyloid-beta</text>
  <text x="560" y="365" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">(GO:1904646)</text>
  
  <!-- Molecular function labels -->
  <text x="230" y="175" font-family="Arial" font-size="12" text-anchor="end" fill="#333">Transmembrane signaling</text>
  <text x="230" y="190" font-family="Arial" font-size="12" text-anchor="end" fill="#333">receptor activity (GO:0004888)</text>
  
  <text x="230" y="265" font-family="Arial" font-size="12" text-anchor="end" fill="#333">Protein-macromolecule</text>
  <text x="230" y="280" font-family="Arial" font-size="12" text-anchor="end" fill="#333">adaptor activity (GO:0030674)</text>
  
  <text x="230" y="365" font-family="Arial" font-size="12" text-anchor="end" fill="#333">Protein tyrosine kinase</text>
  <text x="230" y="380" font-family="Arial" font-size="12" text-anchor="end" fill="#333">activity (GO:0004713)</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">TREM2 Activation by APOE in Microglia</text>
  
  <!-- Explanatory note -->
  <rect x="50" y="430" width="700" height="60" fill="white" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="450" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">This diagram illustrates how APOE in the extracellular space activates the TREM2 receptor on microglia,</text>
  <text x="400" y="470" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">leading to TYROBP recruitment and subsequent SYK activation, a pathway involved in</text>
  <text x="400" y="490" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">microglial response to lipoproteins and amyloid-beta in neurodegenerative diseases.</text>
  
  <!-- Legend -->
  <rect x="150" y="520" width="500" height="160" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="10" ry="10" />
  <text x="400" y="540" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <circle cx="180" cy="565" r="10" fill="#ff9999" stroke="#333" stroke-width="1" />
  <text x="200" y="570" font-family="Arial" font-size="14" fill="#333">APOE - Ligand (Apolipoprotein E)</text>
  
  <rect x="180" y="590" width="20" height="15" fill="#99ccff" stroke="#333" stroke-width="1" rx="2" ry="2" />
  <text x="210" y="600" font-family="Arial" font-size="14" fill="#333">TREM2 - Receptor (Triggering receptor expressed on myeloid cells 2)</text>
  
  <rect x="180" y="615" width="20" height="15" fill="#99ff99" stroke="#333" stroke-width="1" rx="2" ry="2" />
  <text x="210" y="625" font-family="Arial" font-size="14" fill="#333">TYROBP - Adaptor protein (DAP12)</text>
  
  <rect x="180" y="640" width="20" height="15" fill="#cc99ff" stroke="#333" stroke-width="1" rx="2" ry="2" />
  <text x="210" y="650" font-family="Arial" font-size="14" fill="#333">SYK - Tyrosine kinase (Spleen tyrosine kinase)</text>
  
  <line x1="350" y1="565" x2="380" y2="565" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="410" y="570" font-family="Arial" font-size="14" fill="#333">Activation/Interaction pathway</text>
  
  <rect x="350" y="590" width="30" height="20" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="410" y="605" font-family="Arial" font-size="14" fill="#333">Biological process</text>
</svg>