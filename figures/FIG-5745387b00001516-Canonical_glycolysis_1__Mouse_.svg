<svg width="800" height="950" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline with cytosol label -->
  <rect x="50" y="50" width="700" height="850" rx="20" ry="20" fill="#f8f9fa" stroke="#333" stroke-width="2" />
  <text x="400" y="80" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Pathway Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Canonical Glycolysis (Mouse) - GO:0061621</text>
  
  <!-- Main pathway - left side -->
  
  <!-- Starting molecule - Glucose -->
  <circle cx="250" cy="130" r="28" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="250" y="135" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Glucose</text>
  
  <!-- Reaction 1: Glucokinase (Hk1) -->
  <rect x="170" y="170" width="160" height="50" rx="10" ry="10" fill="#ffe6cc" stroke="#333" stroke-width="2" />
  <text x="250" y="190" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Hk1 (MGI:96103)</text>
  <text x="250" y="210" font-family="Arial" font-size="14" text-anchor="middle">Glucokinase activity</text>
  <line x1="250" y1="158" x2="250" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Glucose-6-phosphate -->
  <circle cx="250" cy="240" r="25" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="250" y="245" font-family="Arial" font-size="14" text-anchor="middle">Glucose-6P</text>
  <line x1="250" y1="220" x2="250" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Reaction 2: Glucose-6-phosphate isomerase (Gpi1) -->
  <rect x="170" y="280" width="160" height="50" rx="10" ry="10" fill="#ffe6cc" stroke="#333" stroke-width="2" />
  <text x="250" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Gpi1 (MGI:95797)</text>
  <text x="250" y="320" font-family="Arial" font-size="14" text-anchor="middle">G6P isomerase activity</text>
  <line x1="250" y1="265" x2="250" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Fructose-6-phosphate -->
  <circle cx="250" cy="350" r="25" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="250" y="355" font-family="Arial" font-size="14" text-anchor="middle">Fructose-6P</text>
  <line x1="250" y1="330" x2="250" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Reaction 3: 6-phosphofructokinase (Pfkm) -->
  <rect x="170" y="390" width="160" height="50" rx="10" ry="10" fill="#ffe6cc" stroke="#333" stroke-width="2" />
  <text x="250" y="410" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pfkm (MGI:97548)</text>
  <text x="250" y="430" font-family="Arial" font-size="14" text-anchor="middle">6-phosphofructokinase</text>
  <line x1="250" y1="375" x2="250" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Fructose-1,6-bisphosphate -->
  <circle cx="250" cy="460" r="25" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="250" y="465" font-family="Arial" font-size="14" text-anchor="middle">Fructose-1,6P₂</text>
  <line x1="250" y1="440" x2="250" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Reaction 4: Fructose-bisphosphate aldolase (Aldoa) -->
  <rect x="170" y="500" width="160" height="50" rx="10" ry="10" fill="#ffe6cc" stroke="#333" stroke-width="2" />
  <text x="250" y="520" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Aldoa (MGI:87994)</text>
  <text x="250" y="540" font-family="Arial" font-size="14" text-anchor="middle">Fructose-bisP aldolase</text>
  <line x1="250" y1="485" x2="250" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Split path for DHAP and G3P -->
  <circle cx="180" cy="580" r="25" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="180" y="585" font-family="Arial" font-size="14" text-anchor="middle">DHAP</text>
  
  <circle cx="320" cy="580" r="25" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="320" y="585" font-family="Arial" font-size="14" text-anchor="middle">G3P</text>
  
  <line x1="250" y1="550" x2="180" y2="580" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="250" y1="550" x2="320" y2="580" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Main pathway - right side -->
  
  <!-- Reaction 5: Triose-phosphate isomerase (Tpi1) -->
  <rect x="100" y="620" width="160" height="50" rx="10" ry="10" fill="#d5f5e3" stroke="#333" stroke-width="2" />
  <text x="180" y="640" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Tpi1 (MGI:98797)</text>
  <text x="180" y="660" font-family="Arial" font-size="14" text-anchor="middle">Triose-P isomerase</text>
  <line x1="180" y1="605" x2="180" y2="620" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <line x1="180" y1="670" x2="280" y2="695" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,2" />
  <text x="230" y="675" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">isomerization</text>
  
  <!-- Reaction 6: GAPDH -->
  <rect x="240" y="620" width="160" height="50" rx="10" ry="10" fill="#d5f5e3" stroke="#333" stroke-width="2" />
  <text x="320" y="640" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Gapdh (MGI:95640)</text>
  <text x="320" y="660" font-family="Arial" font-size="14" text-anchor="middle">GAPDH activity</text>
  <line x1="320" y1="605" x2="320" y2="620" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- 1,3-Bisphosphoglycerate -->
  <circle cx="320" cy="700" r="25" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="320" y="705" font-family="Arial" font-size="14" text-anchor="middle">1,3-BPG</text>
  <line x1="320" y1="670" x2="320" y2="700" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Continue with second column -->
  
  <!-- Reaction 7: Phosphoglycerate kinase (Pgk1) -->
  <rect x="450" y="170" width="180" height="50" rx="10" ry="10" fill="#d5f5e3" stroke="#333" stroke-width="2" />
  <text x="540" y="190" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pgk1 (MGI:97555)</text>
  <text x="540" y="210" font-family="Arial" font-size="14" text-anchor="middle">Phosphoglycerate kinase</text>
  
  <!-- Connect 1,3-BPG to Pgk1 -->
  <path d="M 345 700 C 420 700, 420 220, 450 195" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="420" y="680" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">continues to</text>
  <text x="420" y="695" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">next step</text>
  
  <!-- 3-Phosphoglycerate -->
  <circle cx="540" cy="240" r="25" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="540" y="245" font-family="Arial" font-size="14" text-anchor="middle">3-PG</text>
  <line x1="540" y1="220" x2="540" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Reaction 8: Phosphoglycerate mutase (Pgam2) -->
  <rect x="450" y="280" width="180" height="50" rx="10" ry="10" fill="#d5f5e3" stroke="#333" stroke-width="2" />
  <text x="540" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pgam2 (MGI:1933118)</text>
  <text x="540" y="320" font-family="Arial" font-size="14" text-anchor="middle">Phosphoglycerate mutase</text>
  <line x1="540" y1="265" x2="540" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- 2-Phosphoglycerate -->
  <circle cx="540" cy="350" r="25" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="540" y="355" font-family="Arial" font-size="14" text-anchor="middle">2-PG</text>
  <line x1="540" y1="330" x2="540" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Reaction 9: Enolase (Eno3) -->
  <rect x="450" y="390" width="180" height="50" rx="10" ry="10" fill="#d5f5e3" stroke="#333" stroke-width="2" />
  <text x="540" y="410" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Eno3 (MGI:95395)</text>
  <text x="540" y="430" font-family="Arial" font-size="14" text-anchor="middle">Phosphopyruvate hydratase</text>
  <line x1="540" y1="375" x2="540" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Phosphoenolpyruvate -->
  <circle cx="540" cy="460" r="25" fill="#c6dcff" stroke="#333" stroke-width="2" />
  <text x="540" y="465" font-family="Arial" font-size="14" text-anchor="middle">PEP</text>
  <line x1="540" y1="440" x2="540" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Reaction 10: Pyruvate kinase (Pkm) -->
  <rect x="450" y="500" width="180" height="50" rx="10" ry="10" fill="#d5f5e3" stroke="#333" stroke-width="2" />
  <text x="540" y="520" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pkm (MGI:97591)</text>
  <text x="540" y="540" font-family="Arial" font-size="14" text-anchor="middle">Pyruvate kinase</text>
  <line x1="540" y1="485" x2="540" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Pyruvate - final product -->
  <circle cx="540" cy="580" r="30" fill="#ffb6c1" stroke="#333" stroke-width="2" />
  <text x="540" y="585" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pyruvate</text>
  <line x1="540" y1="550" x2="540" y2="580" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Additional biochemical details (cofactors, etc.) -->
  <text x="145" y="190" font-family="Arial" font-size="12" text-anchor="end" font-style="italic">+ ATP</text>
  <text x="145" y="210" font-family="Arial" font-size="12" text-anchor="end" font-style="italic">- ADP</text>
  
  <text x="145" y="410" font-family="Arial" font-size="12" text-anchor="end" font-style="italic">+ ATP</text>
  <text x="145" y="430" font-family="Arial" font-size="12" text-anchor="end" font-style="italic">- ADP</text>
  
  <text x="355" y="640" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">+ NAD+, Pi</text>
  <text x="355" y="660" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">- NADH</text>
  
  <text x="590" y="190" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">+ ADP</text>
  <text x="590" y="210" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">- ATP</text>
  
  <text x="590" y="520" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">+ ADP</text>
  <text x="590" y="540" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">- ATP</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="100" y="840" width="600" height="40" fill="#e6e6e6" stroke="#333" stroke-width="1" />
  
  <circle cx="140" cy="860" r="10" fill="#c6dcff" stroke="#333" stroke-width="1" />
  <text x="160" y="865" font-family="Arial" font-size="13">Metabolite</text>
  
  <circle cx="240" cy="860" r="12" fill="#ffb6c1" stroke="#333" stroke-width="1" />
  <text x="260" y="865" font-family="Arial" font-size="13">Final Product</text>
  
  <rect x="330" y="852" width="35" height="16" rx="3" ry="3" fill="#ffe6cc" stroke="#333" stroke-width="1" />
  <text x="375" y="865" font-family="Arial" font-size="13">Initial Enzymes</text>
  
  <rect x="470" y="852" width="35" height="16" rx="3" ry="3" fill="#d5f5e3" stroke="#333" stroke-width="1" />
  <text x="515" y="865" font-family="Arial" font-size="13">Later Enzymes</text>
  
  <line x1="570" y1="860" x2="590" y2="860" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="620" y="865" font-family="Arial" font-size="13">Reaction flow</text>
</svg>