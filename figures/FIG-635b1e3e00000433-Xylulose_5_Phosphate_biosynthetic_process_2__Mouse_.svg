<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  <text x="400" y="80" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Xylulose-5-Phosphate Biosynthetic Process (Mouse)</text>
  
  <!-- Cytosol label -->
  <text x="100" y="110" font-family="Arial" font-size="14" font-style="italic">Cytosol</text>
  
  <!-- Molecules and reactions -->
  
  <!-- Canonical Glycolysis Box -->
  <rect x="100" y="130" width="200" height="120" rx="10" ry="10" fill="#e6f7ff" stroke="#0099cc" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="200" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Canonical Glycolysis</text>
  
  <!-- Glycolysis products -->
  <rect x="120" y="170" width="160" height="30" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
  <text x="200" y="190" font-family="Arial" font-size="12" text-anchor="middle">Glycerone phosphate(2-)</text>
  
  <rect x="120" y="210" width="160" height="30" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
  <text x="200" y="230" font-family="Arial" font-size="12" text-anchor="middle">β-D-fructofuranose 6-phosphate(2-)</text>
  
  <!-- Tpi1 Enzyme -->
  <rect x="350" y="170" width="100" height="40" rx="20" ry="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="400" y="195" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Tpi1</text>
  
  <!-- Gpi1 Enzyme -->
  <rect x="350" y="260" width="100" height="40" rx="20" ry="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="400" y="285" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Gpi1</text>
  
  <!-- Taldo1 Enzyme -->
  <rect x="350" y="350" width="100" height="40" rx="20" ry="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="400" y="375" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Taldo1</text>
  
  <!-- Tkt Enzyme -->
  <rect x="350" y="440" width="100" height="40" rx="20" ry="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="400" y="465" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Tkt</text>
  
  <!-- Intermediate Products -->
  <rect x="550" y="170" width="160" height="30" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
  <text x="630" y="190" font-family="Arial" font-size="12" text-anchor="middle">D-glyceraldehyde 3-phosphate(2-)</text>
  
  <rect x="550" y="260" width="160" height="30" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
  <text x="630" y="280" font-family="Arial" font-size="12" text-anchor="middle">D-erythrose 4-phosphate(2-)</text>
  
  <rect x="550" y="350" width="160" height="30" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
  <text x="630" y="370" font-family="Arial" font-size="12" text-anchor="middle">D-glyceraldehyde 3-phosphate(2-)</text>
  
  <rect x="550" y="400" width="160" height="30" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
  <text x="630" y="420" font-family="Arial" font-size="12" text-anchor="middle">Sedoheptulose 7-phosphate</text>
  
  <!-- Final Products -->
  <rect x="550" y="460" width="160" height="30" rx="5" ry="5" fill="#ffe6cc" stroke="#ff9900" stroke-width="2"/>
  <text x="630" y="480" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">D-xylulose 5-phosphate(2-)</text>
  
  <rect x="550" y="500" width="160" height="30" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
  <text x="630" y="520" font-family="Arial" font-size="12" text-anchor="middle">D-ribofuranose 5-phosphate(2-)</text>
  
  <!-- Xylulose-5-Phosphate Box -->
  <rect x="530" y="440" width="200" height="100" rx="10" ry="10" fill="none" stroke="#ff6600" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="630" y="550" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Xylulose-5-Phosphate</text>
  <text x="630" y="570" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Biosynthetic Process</text>
  
  <!-- Reaction Labels -->
  <text x="315" y="170" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">Triose-phosphate isomerase</text>
  <text x="315" y="260" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">Glucose-6-phosphate isomerase</text>
  <text x="315" y="350" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">Transaldolase</text>
  <text x="315" y="440" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">Transketolase</text>
  
  <!-- Arrows -->
  <!-- Glycolysis to enzymes -->
  <line x1="280" y1="185" x2="350" y2="185" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="225" x2="350" y2="280" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Enzyme reactions -->
  <line x1="450" y1="185" x2="550" y2="185" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="500" y="175" font-family="Arial" font-size="10" text-anchor="middle">converts</text>
  
  <line x1="450" y1="280" x2="550" y2="280" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="500" y="270" font-family="Arial" font-size="10" text-anchor="middle">converts</text>
  
  <!-- Connections between reactions -->
  <line x1="630" y1="200" x2="630" y2="240" stroke="#000" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="630" y1="240" x2="450" y2="240" stroke="#000" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="450" y1="240" x2="450" y2="260" stroke="#000" stroke-width="2" stroke-dasharray="4,2"/>
  
  <line x1="630" y1="290" x2="630" y2="330" stroke="#000" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="630" y1="330" x2="450" y2="330" stroke="#000" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="450" y1="330" x2="450" y2="350" stroke="#000" stroke-width="2" stroke-dasharray="4,2"/>
  
  <line x1="450" y1="390" x2="450" y2="440" stroke="#000" stroke-width="3"/>
  <line x1="450" y1="390" x2="630" y2="390" stroke="#000" stroke-width="3"/>
  <line x1="630" y1="380" x2="630" y2="390" stroke="#000" stroke-width="3"/>
  
  <!-- Transaldolase reaction -->
  <line x1="450" y1="370" x2="550" y2="370" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="370" x2="550" y2="410" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="500" y="360" font-family="Arial" font-size="10" text-anchor="middle">produces</text>
  
  <!-- Final transketolase reaction -->
  <line x1="450" y1="460" x2="550" y2="480" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="460" x2="550" y2="520" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="500" y="450" font-family="Arial" font-size="10" text-anchor="middle">produces</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Reaction annotations -->
  <text x="405" y="155" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">GO:0004807</text>
  <text x="405" y="245" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">GO:0004347</text>
  <text x="405" y="335" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">GO:0004801</text>
  <text x="405" y="425" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">GO:0004802</text>
  
  <!-- Gene product names -->
  <text x="400" y="210" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Tpi1 Mmus</text>
  <text x="400" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Gpi1 Mmus</text>
  <text x="400" y="390" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Taldo1 Mmus</text>
  <text x="400" y="480" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Tkt Mmus</text>
  
  <!-- Legend -->
  <rect x="100" y="490" width="300" height="60" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="110" y="510" font-family="Arial" font-size="12" font-weight="bold">Legend:</text>
  
  <rect x="110" y="520" width="15" height="15" fill="#ffcc99" stroke="#ff9933" stroke-width="1"/>
  <text x="130" y="533" font-family="Arial" font-size="12">Enzyme</text>
  
  <rect x="200" y="520" width="15" height="15" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
  <text x="220" y="533" font-family="Arial" font-size="12">Metabolite</text>
  
  <rect x="300" y="520" width="15" height="15" fill="#ffe6cc" stroke="#ff9900" stroke-width="2"/>
  <text x="320" y="533" font-family="Arial" font-size="12">Target product</text>
  
  <!-- Process annotations -->
  <text x="200" y="120" font-family="Arial" font-size="10" fill="#666666">GO:0061621</text>
  <text x="630" y="435" font-family="Arial" font-size="10" fill="#666666">GO:1901159</text>
</svg>