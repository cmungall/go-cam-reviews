<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Fertilization Complex in Human Sperm-Egg Recognition</text>
  
  <!-- Egg cell (oocyte) -->
  <ellipse cx="600" cy="300" rx="180" ry="220" fill="#ffebcd" stroke="#000" stroke-width="2" />
  <text x="600" y="190" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Egg Cell (Oocyte)</text>
  
  <!-- Sperm cell -->
  <path d="M100,300 Q130,240 180,300 Q130,360 100,300 Z" fill="#b0e0e6" stroke="#000" stroke-width="2" />
  <path d="M30,300 Q50,280 100,300 Q50,320 30,300 Z" fill="#b0e0e6" stroke="#000" stroke-width="2" />
  <text x="120" y="190" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Sperm Cell</text>
  
  <!-- Plasma membranes -->
  <!-- Egg plasma membrane -->
  <ellipse cx="600" cy="300" rx="170" ry="210" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,3" />
  <text x="600" y="520" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Plasma Membrane</text>
  
  <!-- Sperm plasma membrane -->
  <path d="M105,300 Q133,245 178,300 Q133,355 105,300 Z" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,3" />
  <text x="120" y="390" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Plasma Membrane</text>
  
  <!-- IZUMO1 on sperm membrane -->
  <rect x="150" y="280" width="65" height="35" rx="5" fill="#98fb98" stroke="#000" stroke-width="1.5" />
  <text x="182" y="303" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">IZUMO1</text>
  <text x="182" y="260" font-family="Arial" font-size="11" text-anchor="middle" fill="#444" font-weight="bold">Receptor Ligand Activity</text>
  
  <!-- SPACA6 on sperm membrane -->
  <rect x="140" y="330" width="65" height="35" rx="5" fill="#add8e6" stroke="#000" stroke-width="1.5" />
  <text x="172" y="353" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">SPACA6</text>
  <text x="172" y="375" font-family="Arial" font-size="11" text-anchor="middle" fill="#444" font-weight="bold">Adaptor Activity</text>
  
  <!-- TMEM81 on sperm membrane -->
  <rect x="140" y="230" width="65" height="35" rx="5" fill="#add8e6" stroke="#000" stroke-width="1.5" />
  <text x="172" y="253" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">TMEM81</text>
  <text x="172" y="210" font-family="Arial" font-size="11" text-anchor="middle" fill="#444" font-weight="bold">Adaptor Activity</text>
  
  <!-- IZUMO1R on egg membrane -->
  <rect x="430" y="280" width="70" height="35" rx="5" fill="#ffa07a" stroke="#000" stroke-width="1.5" />
  <text x="465" y="303" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">IZUMO1R</text>
  <text x="465" y="323" font-family="Arial" font-size="11" text-anchor="middle" fill="#444" font-weight="bold">Signaling Receptor Activity</text>
  
  <!-- Interaction arrows -->
  <!-- Main interaction between IZUMO1 and IZUMO1R -->
  <path d="M215,295 C280,295 360,295 430,295" fill="none" stroke="#8B0000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="320" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="#8B0000" font-weight="bold">Binding Interaction</text>
  
  <!-- Connection from adaptor proteins to main interaction -->
  <path d="M180,230 L180,280" fill="none" stroke="#4682B4" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowhead)" />
  <text x="205" y="255" font-family="Arial" font-size="10" text-anchor="start" fill="#4682B4" font-weight="bold">Facilitates</text>
  
  <path d="M170,330 L180,315" fill="none" stroke="#4682B4" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowhead)" />
  <text x="190" y="325" font-family="Arial" font-size="10" text-anchor="start" fill="#4682B4" font-weight="bold">Facilitates</text>
  
  <!-- Define arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Process label -->
  <rect x="280" y="225" width="150" height="30" rx="15" fill="#fff" stroke="#000" stroke-width="1.5" />
  <text x="355" y="245" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Sperm-Egg Recognition</text>
  
  <!-- Initial contact label -->
  <text x="320" y="340" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Initial membrane contact point</text>
  <path d="M320,345 L320,315" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrowhead)" />
  
  <!-- Legend -->
  <rect x="50" y="480" width="230" height="100" fill="white" stroke="#000" stroke-width="1.5" />
  <text x="165" y="500" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="70" y="510" width="15" height="15" fill="#98fb98" stroke="#000" stroke-width="1" />
  <text x="95" y="522" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">IZUMO1 - Receptor Ligand</text>
  
  <rect x="70" y="530" width="15" height="15" fill="#add8e6" stroke="#000" stroke-width="1" />
  <text x="95" y="542" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">SPACA6/TMEM81 - Adaptor Proteins</text>
  
  <rect x="70" y="550" width="15" height="15" fill="#ffa07a" stroke="#000" stroke-width="1" />
  <text x="95" y="562" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">IZUMO1R - Signaling Receptor</text>
  
  <line x1="70" y1="570" x2="85" y2="570" stroke="#8B0000" stroke-width="2.5" />
  <text x="95" y="574" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Direct Interaction</text>
  
  <line x1="70" y1="585" x2="85" y2="585" stroke="#4682B4" stroke-width="2" stroke-dasharray="3,2" />
  <text x="95" y="589" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Facilitating Interaction</text>
</svg>