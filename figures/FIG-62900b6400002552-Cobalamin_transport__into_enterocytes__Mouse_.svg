<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#f9f9f9" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Cobalamin Transport into Enterocytes (Mouse)</text>
  
  <!-- Cell Structure -->
  <!-- Extracellular space -->
  <rect x="50" y="100" width="700" height="150" fill="#e6f7ff" stroke="#000" stroke-width="1" />
  <text x="100" y="125" font-family="Arial" font-size="14" font-style="italic">Extracellular Space (GO:0005615)</text>
  
  <!-- Microvillus Membrane -->
  <path d="M50,250 Q60,260 70,250 Q80,240 90,250 Q100,260 110,250 Q120,240 130,250 Q140,260 150,250 
           Q160,240 170,250 Q180,260 190,250 Q200,240 210,250 Q220,260 230,250 Q240,240 250,250 
           Q260,260 270,250 Q280,240 290,250 Q300,260 310,250 Q320,240 330,250 Q340,260 350,250 
           Q360,240 370,250 Q380,260 390,250 Q400,240 410,250 Q420,260 430,250 Q440,240 450,250 
           Q460,260 470,250 Q480,240 490,250 Q500,260 510,250 Q520,240 530,250 Q540,260 550,250 
           Q560,240 570,250 Q580,260 590,250 Q600,240 610,250 Q620,260 630,250 Q640,240 650,250 
           Q660,260 670,250 Q680,240 690,250 Q700,260 710,250 L750,250" 
        stroke="#000" stroke-width="2" fill="none" />
  <text x="200" y="270" font-family="Arial" font-size="14" font-style="italic">Microvillus Membrane (GO:0031528)</text>
  
  <!-- Cell interior -->
  <rect x="50" y="250" width="700" height="300" fill="#fff" stroke="#000" stroke-width="1" />
  <text x="650" y="520" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Enterocyte</text>
  
  <!-- Lysosome -->
  <ellipse cx="400" cy="400" rx="80" ry="50" fill="#ffccf9" stroke="#000" stroke-width="1" />
  <text x="400" y="400" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Lysosome (GO:0005764)</text>
  
  <!-- Cytosol -->
  <text x="180" y="320" font-family="Arial" font-size="14" font-style="italic">Cytosol (GO:0005829)</text>
  
  <!-- Endoplasmic Reticulum -->
  <path d="M550,350 C570,340 600,360 620,350 C640,340 660,360 680,350" stroke="#000" stroke-width="1" fill="none" />
  <path d="M550,360 C570,350 600,370 620,360 C640,350 660,370 680,360" stroke="#000" stroke-width="1" fill="none" />
  <path d="M550,370 C570,360 600,380 620,370 C640,360 660,380 680,370" stroke="#000" stroke-width="1" fill="none" />
  <text x="615" y="390" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">ER (GO:0005783)</text>
  
  <!-- Molecules and Processes -->
  <!-- R-cob(III)alamin and Tcn2 complex -->
  <circle cx="150" cy="170" r="15" fill="#ff9999" stroke="#000" stroke-width="1" />
  <text x="150" y="174" font-family="Arial" font-size="10" text-anchor="middle">B12</text>
  
  <!-- Tcn2 -->
  <rect x="100" y="140" width="60" height="25" rx="5" ry="5" fill="#99ccff" stroke="#000" stroke-width="1" />
  <text x="130" y="157" font-family="Arial" font-size="14" text-anchor="middle">Tcn2</text>
  
  <!-- Proteases -->
  <rect x="200" y="140" width="60" height="25" rx="5" ry="5" fill="#99cc99" stroke="#000" stroke-width="1" />
  <text x="230" y="157" font-family="Arial" font-size="14" text-anchor="middle">Prss1</text>
  
  <rect x="270" y="140" width="60" height="25" rx="5" ry="5" fill="#99cc99" stroke="#000" stroke-width="1" />
  <text x="300" y="157" font-family="Arial" font-size="14" text-anchor="middle">Ctrb1</text>
  
  <rect x="340" y="140" width="60" height="25" rx="5" ry="5" fill="#99cc99" stroke="#000" stroke-width="1" />
  <text x="370" y="157" font-family="Arial" font-size="14" text-anchor="middle">Prss3</text>
  
  <!-- Cblif -->
  <rect x="450" y="170" width="60" height="25" rx="5" ry="5" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="480" y="187" font-family="Arial" font-size="14" text-anchor="middle">Cblif</text>
  
  <!-- Cubn/Amn1 -->
  <rect x="350" y="220" width="60" height="25" rx="5" ry="5" fill="#cc99ff" stroke="#000" stroke-width="1" />
  <text x="380" y="237" font-family="Arial" font-size="14" text-anchor="middle">Cubn</text>
  
  <rect x="450" y="220" width="60" height="25" rx="5" ry="5" fill="#cc99ff" stroke="#000" stroke-width="1" />
  <text x="480" y="237" font-family="Arial" font-size="14" text-anchor="middle">Amn1</text>
  
  <!-- Lmbrd1 -->
  <rect x="350" y="350" width="60" height="25" rx="5" ry="5" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="380" y="367" font-family="Arial" font-size="14" text-anchor="middle">Lmbrd1</text>
  
  <!-- Abcd4 -->
  <rect x="450" y="350" width="60" height="25" rx="5" ry="5" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="480" y="367" font-family="Arial" font-size="14" text-anchor="middle">Abcd4</text>
  
  <!-- Arrows and Process Flow -->
  <!-- Tcn2 binding B12 -->
  <line x1="150" y1="140" x2="150" y2="155" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Protease action -->
  <line x1="230" y1="165" x2="280" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="300" y1="165" x2="300" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="370" y1="165" x2="330" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Cblif binding -->
  <circle cx="300" cy="190" r="15" fill="#ff9999" stroke="#000" stroke-width="1" />
  <text x="300" y="194" font-family="Arial" font-size="10" text-anchor="middle">B12</text>
  <line x1="330" y1="190" x2="450" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Cubn/Amn1 receptor binding -->
  <line x1="480" y1="195" x2="480" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="450" y1="225" x2="410" y2="225" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Endocytosis -->
  <path d="M380,245 C380,280 380,300 380,320" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <circle cx="380" cy="320" r="15" fill="#ff9999" stroke="#000" stroke-width="1" />
  <text x="380" y="324" font-family="Arial" font-size="10" text-anchor="middle">B12</text>
  
  <!-- Lmbrd1 transport -->
  <line x1="380" y1="335" x2="380" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Abcd4 transport -->
  <line x1="410" y1="360" x2="450" y2="360" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Final transport -->
  <line x1="510" y1="360" x2="550" y2="360" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <circle cx="550" cy="360" r="15" fill="#ff9999" stroke="#000" stroke-width="1" />
  <text x="550" y="364" font-family="Arial" font-size="10" text-anchor="middle">B12</text>
  
  <!-- Process labels -->
  <text x="200" y="190" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Proteolytic processing</text>
  <text x="390" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Receptor binding</text>
  <text x="340" y="290" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Endocytosis</text>
  <text x="380" y="380" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Lysosomal export</text>
  <text x="530" y="340" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">ER transport</text>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="560" width="700" height="80" fill="#eee" stroke="#000" stroke-width="1" />
  <text x="400" y="580" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="80" cy="600" r="10" fill="#ff9999" stroke="#000" stroke-width="1" />
  <text x="100" y="605" font-family="Arial" font-size="14" text-anchor="start">B12 = R-cob(III)alamin (CHEBI:140785)</text>
  
  <rect x="260" cy="590" width="40" height="20" rx="5" ry="5" fill="#99ccff" stroke="#000" stroke-width="1" />
  <text x="305" y="605" font-family="Arial" font-size="14" text-anchor="start">Carrier proteins</text>
  
  <rect x="420" y="590" width="40" height="20" rx="5" ry="5" fill="#99cc99" stroke="#000" stroke-width="1" />
  <text x="465" y="605" font-family="Arial" font-size="14" text-anchor="start">Proteases</text>
  
  <rect x="560" y="590" width="40" height="20" rx="5" ry="5" fill="#cc99ff" stroke="#000" stroke-width="1" />
  <text x="605" y="605" font-family="Arial" font-size="14" text-anchor="start">Receptors</text>
  
  <text x="400" y="630" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Process: Cobalamin (vitamin B12) is transported from extracellular space into enterocytes via a multi-step pathway</text>
</svg>