<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell with nucleus -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f0f0f0" stroke="#666" stroke-width="2"/>
  <ellipse cx="400" cy="320" rx="240" ry="180" fill="#e0e8ff" stroke="#666" stroke-width="2.5"/>
  
  <!-- Label for cell components -->
  <text x="150" y="190" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Cytoplasm</text>
  <text x="320" y="200" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Nucleus (GO:0005634)</text>
  
  <!-- Anaphase Promoting Complex (APC) -->
  <rect x="500" y="350" width="120" height="80" rx="10" ry="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2.5"/>
  <text x="512" y="380" font-family="Arial" font-size="16" font-weight="bold" fill="#333">APC</text>
  <text x="510" y="400" font-family="Arial" font-size="12" fill="#666">(GO:0005680)</text>
  
  <!-- CDK1 -->
  <circle cx="240" cy="280" r="45" fill="#b3e0ff" stroke="#0066cc" stroke-width="2.5"/>
  <text x="217" y="285" font-family="Arial" font-size="16" font-weight="bold" fill="#333">CDK1</text>
  <text x="205" y="300" font-family="Arial" font-size="11" fill="#666">(UniProtKB:P06493)</text>
  
  <!-- USP22 -->
  <circle cx="350" cy="350" r="45" fill="#d4edda" stroke="#28a745" stroke-width="2.5"/>
  <text x="325" y="355" font-family="Arial" font-size="16" font-weight="bold" fill="#333">USP22</text>
  <text x="313" y="370" font-family="Arial" font-size="11" fill="#666">(UniProtKB:Q9UPT9)</text>
  
  <!-- CCNB1 -->
  <circle cx="460" cy="280" r="45" fill="#ffeeba" stroke="#ffc107" stroke-width="2.5"/>
  <text x="431" y="285" font-family="Arial" font-size="16" font-weight="bold" fill="#333">CCNB1</text>
  <text x="418" y="300" font-family="Arial" font-size="11" fill="#666">(UniProtKB:P14635)</text>
  
  <!-- CDC20 -->
  <circle cx="550" cy="400" r="35" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5"/>
  <text x="525" y="405" font-family="Arial" font-size="16" font-weight="bold" fill="#333">CDC20</text>
  <text x="513" y="420" font-family="Arial" font-size="11" fill="#666">(UniProtKB:Q12834)</text>
  
  <!-- Arrows and interactions -->
  <!-- CDK1 activates USP22 -->
  <path d="M270 305 L320 330" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="285" y="315" font-family="Arial" font-size="14" font-weight="bold" fill="#0066cc">activates</text>
  <text x="270" y="330" font-family="Arial" font-size="10" fill="#666">(RO:0002629)</text>
  
  <!-- USP22 deubiquitinates CCNB1 -->
  <path d="M375 320 L435 300" stroke="#28a745" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="370" y="300" font-family="Arial" font-size="14" font-weight="bold" fill="#28a745">deubiquitinates</text>
  <text x="385" y="315" font-family="Arial" font-size="10" fill="#666">(RO:0002629)</text>
  
  <!-- CDC20 negatively regulates USP22 -->
  <path d="M525 385 L390 360" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="375" x2="520" y2="385" stroke="#dc3545" stroke-width="3"/>
  <line x1="510" y1="395" x2="520" y2="385" stroke="#dc3545" stroke-width="3"/>
  <text x="420" y="385" font-family="Arial" font-size="14" font-weight="bold" fill="#dc3545">negatively regulates</text>
  <text x="440" y="400" font-family="Arial" font-size="10" fill="#666">(RO:0002409)</text>
  
  <!-- Process labels -->
  <text x="360" y="250" font-family="Arial" font-size="16" font-weight="bold" fill="#333">G2/M Transition</text>
  <text x="350" y="270" font-family="Arial" font-size="12" fill="#666">(GO:0000086)</text>
  
  <text x="340" y="440" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Protein Deubiquitination</text>
  <text x="365" y="460" font-family="Arial" font-size="12" fill="#666">(GO:0016579)</text>
  
  <text x="520" y="470" font-family="Arial" font-size="16" font-weight="bold" fill="#333">APC-dependent</text>
  <text x="520" y="490" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Catabolic Process</text>
  <text x="530" y="510" font-family="Arial" font-size="12" fill="#666">(GO:0031145)</text>
  
  <!-- Legend for molecular functions -->
  <rect x="30" y="500" width="220" height="15" fill="#b3e0ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="260" y="513" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Protein Ser/Thr Kinase (GO:0004674)</text>
  
  <rect x="30" y="520" width="220" height="15" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="260" y="533" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Cysteine-type Deubiquitinase (GO:0004843)</text>
  
  <rect x="30" y="540" width="220" height="15" fill="#ffeeba" stroke="#ffc107" stroke-width="1.5"/>
  <text x="260" y="553" font-family="Arial" font-size="12" font-weight="bold" fill="#333">CDK Activator Activity (GO:0061575)</text>
  
  <rect x="30" y="560" width="220" height="15" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="260" y="573" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Ubiquitin Ligase-Substrate Adaptor (GO:1990756)</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">CDK1-mediated Deubiquitination of CCNB1 by USP22</text>
  <text x="400" y="65" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Leading to G2/M Progression (Human)</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Ubiquitin tag on CCNB1 (before deubiquitination) -->
  <circle cx="485" cy="255" r="15" fill="#8B4513" stroke="#5D2E0C" stroke-width="1.5"/>
  <text x="477" y="260" font-family="Arial" font-size="14" font-weight="bold" fill="white">Ub</text>
</svg>