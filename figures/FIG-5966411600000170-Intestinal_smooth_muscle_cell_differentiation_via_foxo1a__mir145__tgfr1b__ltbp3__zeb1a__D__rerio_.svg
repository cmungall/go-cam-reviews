<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Cell components labels -->
  <rect x="300" y="70" width="200" height="30" rx="5" fill="#f9f9f9" stroke="#888" stroke-width="1"/>
  <text x="400" y="92" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Intestinal Smooth Muscle Cell</text>
  <text x="600" y="100" font-family="Arial" font-size="14">Zebrafish (D. rerio)</text>
  
  <!-- TGF-beta pathway section -->
  <rect x="150" y="150" width="120" height="60" rx="10" fill="#d1e7ff" stroke="#0066cc" stroke-width="2"/>
  <text x="210" y="185" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">tgfbr1b</text>
  
  <rect x="150" y="250" width="120" height="60" rx="10" fill="#d1e7ff" stroke="#0066cc" stroke-width="2"/>
  <text x="210" y="285" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ltbp3</text>
  
  <text x="320" y="210" font-family="Arial" font-size="12" fill="#666" font-style="italic" font-weight="bold">TGF-β signaling pathway</text>
  
  <!-- Direction arrows with proper markers -->
  <path d="M 210 250 L 210 210" fill="none" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="230" font-family="Arial" font-size="12" fill="#333" font-weight="bold">activates</text>
  
  <!-- miRNA section -->
  <rect x="350" y="250" width="120" height="60" rx="10" fill="#ffe6cc" stroke="#ff9933" stroke-width="2"/>
  <text x="410" y="275" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">mir145</text>
  <text x="410" y="295" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">miRNA-mediated silencing</text>
  
  <!-- Connect TGF-β to miRNA -->
  <path d="M 270 180 L 350 250" fill="none" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="200" font-family="Arial" font-size="12" fill="#333" font-weight="bold">activates</text>
  
  <!-- Target genes -->
  <rect x="250" y="400" width="120" height="60" rx="10" fill="#e6ffe6" stroke="#339933" stroke-width="2"/>
  <text x="310" y="435" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">foxo1a</text>
  
  <rect x="450" y="400" width="120" height="60" rx="10" fill="#e6ffe6" stroke="#339933" stroke-width="2"/>
  <text x="510" y="435" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">zeb1a</text>
  
  <!-- Connect miRNA to targets with inhibition markers -->
  <path d="M 380 310 L 320 400" fill="none" stroke="#ff9933" stroke-width="2"/>
  <circle cx="350" cy="355" r="8" fill="white" stroke="#ff9933" stroke-width="2"/>
  <line x1="343" y1="355" x2="357" y2="355" stroke="#ff9933" stroke-width="2"/>
  <text x="330" y="340" font-family="Arial" font-size="12" fill="#333" font-weight="bold">inhibits</text>
  
  <path d="M 440 310 L 500 400" fill="none" stroke="#ff9933" stroke-width="2"/>
  <circle cx="470" cy="355" r="8" fill="white" stroke="#ff9933" stroke-width="2"/>
  <line x1="463" y1="355" x2="477" y2="355" stroke="#ff9933" stroke-width="2"/>
  <text x="480" y="340" font-family="Arial" font-size="12" fill="#333" font-weight="bold">inhibits</text>
  
  <!-- Outcome -->
  <rect x="350" y="500" width="200" height="60" rx="10" fill="#f0e6ff" stroke="#6600cc" stroke-width="2"/>
  <text x="450" y="530" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Intestinal Smooth Muscle</text>
  <text x="450" y="550" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Cell Differentiation</text>
  
  <path d="M 310 460 L 380 500" fill="none" stroke="#339933" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 510 460 L 450 500" fill="none" stroke="#339933" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="550" y="480" width="220" height="100" rx="5" fill="white" stroke="#888" stroke-width="1"/>
  <text x="560" y="500" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  <rect x="560" y="510" width="15" height="15" fill="#d1e7ff" stroke="#0066cc" stroke-width="1"/>
  <text x="580" y="522" font-family="Arial" font-size="13">TGF-β signaling components</text>
  <rect x="560" y="530" width="15" height="15" fill="#ffe6cc" stroke="#ff9933" stroke-width="1"/>
  <text x="580" y="542" font-family="Arial" font-size="13">miRNA</text>
  <rect x="560" y="550" width="15" height="15" fill="#e6ffe6" stroke="#339933" stroke-width="1"/>
  <text x="580" y="562" font-family="Arial" font-size="13">Target genes</text>
  <rect x="560" y="570" width="15" height="15" fill="#f0e6ff" stroke="#6600cc" stroke-width="1"/>
  <text x="580" y="582" font-family="Arial" font-size="13">Cellular outcome</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
</svg>