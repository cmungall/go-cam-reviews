<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">IFNA1-CR2 Role in B-cell ISGs Induction (Human)</text>
  
  <!-- Cell Membrane -->
  <path d="M 100,150 L 700,150 L 700,500 L 100,500 Z" fill="#f9f9f9" stroke="#888888" stroke-width="2" />
  
  <!-- Plasma Membrane -->
  <path d="M 100,180 L 700,180" stroke="#444444" stroke-width="3" />
  <path d="M 100,190 L 700,190" stroke="#666666" stroke-width="2" />
  
  <!-- Extracellular Space Label -->
  <text x="120" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic">Extracellular Space (GO:0005615)</text>
  
  <!-- Cytoplasm Label -->
  <text x="120" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic">Cytoplasm (GO:0005737)</text>
  
  <!-- IFNA1 Protein -->
  <circle cx="250" cy="120" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="250" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">IFNA1</text>
  <text x="250" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">(P01562)</text>
  
  <!-- CR2 Receptor -->
  <rect x="250" y="170" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
  <text x="290" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">CR2</text>
  <text x="290" y="203" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">(P20023)</text>
  
  <!-- MX1 Protein -->
  <rect x="200" y="280" width="80" height="40" rx="10" ry="10" fill="#99ff99" stroke="#009900" stroke-width="2" />
  <text x="240" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">MX1</text>
  <text x="240" y="313" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">(P20591)</text>
  
  <!-- EIF2AK2 Protein -->
  <rect x="400" y="280" width="80" height="40" rx="10" ry="10" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="440" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">EIF2AK2</text>
  <text x="440" y="313" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">(P19525)</text>
  
  <!-- Antiviral Innate Immune Response -->
  <rect x="280" y="400" width="220" height="40" rx="10" ry="10" fill="#ffffcc" stroke="#cccc00" stroke-width="2" />
  <text x="390" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Antiviral Innate Immune Response</text>
  <text x="390" y="437" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">(GO:0140374)</text>
  
  <!-- Connection Lines -->
  <!-- IFNA1 to CR2 -->
  <path d="M 250,150 L 290,170" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="260" y="155" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle">RO:0002629</text>
  
  <!-- CR2 to MX1 -->
  <path d="M 280,210 L 240,280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="255" y="245" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle">RO:0002407</text>
  
  <!-- CR2 to EIF2AK2 -->
  <path d="M 320,210 L 420,280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="380" y="245" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle">RO:0002407</text>
  
  <!-- MX1 to Immune Response -->
  <path d="M 240,320 L 320,400" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- EIF2AK2 to Immune Response -->
  <path d="M 440,320 L 400,400" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Function Labels -->
  <text x="150" y="120" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-style="italic">Cytokine Activity</text>
  <text x="340" y="175" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-style="italic">Transmembrane Signaling Receptor</text>
  <text x="200" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-style="italic">GTPase Activity</text>
  <text x="400" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-style="italic">Kinase Activity</text>
  
  <!-- Process Label -->
  <text x="400" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-style="italic">Type I Interferon-Mediated Signaling Pathway (GO:0060337)</text>
  
  <!-- Legend -->
  <rect x="100" y="520" width="600" height="120" fill="#f8f8f8" stroke="#888888" stroke-width="1" />
  <text x="400" y="540" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">LEGEND</text>
  
  <!-- Legend Items -->
  <circle cx="130" cy="560" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="1" />
  <text x="145" y="564" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start">Cytokine (IFNA1) - Cytokine Activity (GO:0005125)</text>
  
  <rect x="130" y="575" width="20" height="10" rx="2" ry="2" fill="#99ccff" stroke="#0066cc" stroke-width="1" />
  <text x="155" y="584" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start">Receptor (CR2) - Transmembrane Signaling Receptor Activity (GO:0004888)</text>
  
  <rect x="130" y="595" width="20" height="10" rx="3" ry="3" fill="#99ff99" stroke="#009900" stroke-width="1" />
  <text x="155" y="604" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start">Effector (MX1) - GTPase Activity (GO:0003924)</text>
  
  <rect x="130" y="615" width="20" height="10" rx="3" ry="3" fill="#ffcc99" stroke="#ff6600" stroke-width="1" />
  <text x="155" y="624" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start">Effector (EIF2AK2) - Kinase Activity (GO:0016301)</text>
  
  <line x1="420" y1="560" x2="450" y2="560" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="455" y="564" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start">Causal Relationship</text>
  
  <rect x="420" y="575" width="20" height="10" rx="3" ry="3" fill="#ffffcc" stroke="#cccc00" stroke-width="1" />
  <text x="445" y="584" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start">Biological Process</text>
</svg>