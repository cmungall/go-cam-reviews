<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <ellipse cx="400" cy="350" rx="350" ry="220" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">GBP1 GTPase Promotes Assembly of Non-Canonical Inflammasome via LPS Association</text>
  
  <!-- Cytoplasmic vesicle -->
  <ellipse cx="230" cy="280" rx="100" ry="70" fill="#e6f2ff" stroke="#0066cc" stroke-width="2"/>
  <text x="230" y="280" font-family="Arial" font-size="14" text-anchor="middle">Cytoplasmic vesicle</text>
  <text x="230" y="300" font-family="Arial" font-size="13" text-anchor="middle" font-style="italic">(GO:0031410)</text>
  
  <!-- Cytosol -->
  <rect x="400" y="250" width="280" height="180" rx="20" ry="20" fill="#fff0e6" stroke="#cc6600" stroke-width="2"/>
  <text x="540" y="270" font-family="Arial" font-size="14" text-anchor="middle">Cytosol</text>
  <text x="540" y="290" font-family="Arial" font-size="13" text-anchor="middle" font-style="italic">(GO:0005829)</text>
  
  <!-- GBP1 in vesicle with GTPase activity -->
  <rect x="190" y="250" width="60" height="30" rx="5" ry="5" fill="#99cc99" stroke="#006600" stroke-width="2"/>
  <text x="220" y="270" font-family="Arial" font-size="12" text-anchor="middle">GBP1</text>
  
  <!-- GBP1 with LPS binding activity -->
  <rect x="320" y="330" width="60" height="30" rx="5" ry="5" fill="#99cc99" stroke="#006600" stroke-width="2"/>
  <text x="350" y="350" font-family="Arial" font-size="12" text-anchor="middle">GBP1</text>
  
  <!-- LPS molecule -->
  <polygon points="420,330 440,310 460,330 440,350" fill="#ffcc99" stroke="#cc6600" stroke-width="2"/>
  <text x="440" y="333" font-family="Arial" font-size="11" text-anchor="middle">LPS</text>
  
  <!-- CASP4 with lipid binding -->
  <rect x="450" y="330" width="60" height="30" rx="5" ry="5" fill="#9999cc" stroke="#000066" stroke-width="2"/>
  <text x="480" y="350" font-family="Arial" font-size="12" text-anchor="middle">CASP4</text>
  
  <!-- Active CASP4 -->
  <rect x="580" y="330" width="70" height="30" rx="5" ry="5" fill="#cc99cc" stroke="#660066" stroke-width="2"/>
  <text x="615" y="350" font-family="Arial" font-size="12" text-anchor="middle">CASP4*</text>
  
  <!-- Inflammasome complex -->
  <ellipse cx="500" cy="400" rx="80" ry="40" fill="#ffe6e6" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="500" y="395" font-family="Arial" font-size="12" text-anchor="middle">Non-canonical</text>
  <text x="500" y="410" font-family="Arial" font-size="12" text-anchor="middle">inflammasome</text>
  
  <!-- Arrows and process flows -->
  <!-- GTPase activity arrow -->
  <line x1="250" y1="265" x2="310" y2="325" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="270" y="300" font-family="Arial" font-size="11" text-anchor="middle">GTPase activity</text>
  <text x="270" y="312" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">(GO:0003924)</text>
  
  <!-- LPS binding arrow -->
  <line x1="380" y1="330" x2="415" y2="330" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="320" font-family="Arial" font-size="11" text-anchor="middle">LPS binding</text>
  <text x="400" y="308" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">(GO:0001530)</text>
  
  <!-- Lipid binding arrow -->
  <line x1="461" y1="330" x2="445" y2="330" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" transform="rotate(180 453 330)"/>
  <text x="440" y="370" font-family="Arial" font-size="11" text-anchor="middle">Lipid binding</text>
  <text x="440" y="382" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">(GO:0008289)</text>
  
  <!-- Inflammasome assembly arrow -->
  <line x1="480" y1="360" x2="490" y2="380" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="450" y="375" font-family="Arial" font-size="11" text-anchor="start">Assembly</text>
  <text x="450" y="387" font-family="Arial" font-size="11" text-anchor="start" font-style="italic">(GO:0160075)</text>
  
  <!-- CASP4 activation arrow -->
  <line x1="510" y1="345" x2="570" y2="345" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="540" y="335" font-family="Arial" font-size="11" text-anchor="middle">Protein maturation</text>
  <text x="540" y="323" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">(GO:0051604)</text>
  
  <!-- Cytolysis arrow -->
  <line x1="570" y1="400" x2="650" y2="450" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="615" y="430" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Cytolysis</text>
  <text x="615" y="445" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">(GO:0051715)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="620" y="150" width="150" height="150" fill="white" stroke="#333" stroke-width="1"/>
  <text x="695" y="170" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="630" y="180" width="20" height="15" fill="#99cc99" stroke="#006600" stroke-width="1"/>
  <text x="655" y="192" font-family="Arial" font-size="12" text-anchor="start">GBP1 (P32455)</text>
  
  <rect x="630" y="200" width="20" height="15" fill="#9999cc" stroke="#000066" stroke-width="1"/>
  <text x="655" y="212" font-family="Arial" font-size="12" text-anchor="start">CASP4 (P49662)</text>
  
  <rect x="630" y="220" width="20" height="15" fill="#cc99cc" stroke="#660066" stroke-width="1"/>
  <text x="655" y="232" font-family="Arial" font-size="12" text-anchor="start">Active CASP4</text>
  
  <polygon points="630,240 640,235 650,240 640,245" fill="#ffcc99" stroke="#cc6600" stroke-width="1"/>
  <text x="655" y="242" font-family="Arial" font-size="12" text-anchor="start">LPS (CHEBI:58712)</text>
  
  <ellipse cx="640" y="260" rx="15" ry="7" fill="#ffe6e6" stroke="#cc0000" stroke-width="1" stroke-dasharray="3,1"/>
  <text x="655" y="262" font-family="Arial" font-size="12" text-anchor="start">Inflammasome</text>
  
  <!-- Process pathway flow -->
  <path d="M 310 330 Q 380 290 440 300 Q 490 310 570 345" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="435" y="295" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Process flow</text>
  
  <!-- Reference note -->
  <text x="400" y="550" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Based on GO-CAM model: gomodel:65692e7e00000049</text>
</svg>