<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <path d="M 50 150 C 50 80 750 80 750 150 C 750 220 50 220 50 150 Z" fill="#f5f5f5" stroke="#333" stroke-width="3"/>
  
  <!-- Mitochondrial membrane -->
  <path d="M 80 150 C 80 110 720 110 720 150 C 720 190 80 190 80 150 Z" fill="#e6ffe6" stroke="#2d862d" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="400" y="240" font-family="Arial" font-size="18" font-style="italic" font-weight="bold" text-anchor="middle" fill="#2d862d">Mitochondrial membrane</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle">N4BP3 Regulates MAVS Signaling Pathway</text>
  
  <!-- Pathway components -->
  <!-- N4BP3 -->
  <rect x="120" y="140" width="100" height="40" rx="5" ry="5" fill="#8fe3e9" stroke="#333" stroke-width="2"/>
  <text x="170" y="165" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">N4BP3</text>
  
  <!-- NEDD4 -->
  <rect x="300" y="140" width="100" height="40" rx="5" ry="5" fill="#f9c74f" stroke="#333" stroke-width="2"/>
  <text x="350" y="165" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">NEDD4</text>
  
  <!-- MAVS -->
  <rect x="480" y="140" width="100" height="40" rx="5" ry="5" fill="#b8e0d2" stroke="#333" stroke-width="2"/>
  <text x="530" y="165" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">MAVS</text>
  
  <!-- TRAF2 -->
  <rect x="660" y="140" width="100" height="40" rx="5" ry="5" fill="#d0f4de" stroke="#333" stroke-width="2"/>
  <text x="710" y="165" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">TRAF2</text>
  
  <!-- Interactions -->
  <!-- N4BP3 -> NEDD4 -->
  <path d="M 220 160 L 300 160" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="260" y="145" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">protein binding</text>
  
  <!-- NEDD4 -> MAVS -->
  <path d="M 400 160 L 480 160" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="440" y="145" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">ubiquitin ligase</text>
  
  <!-- MAVS -> TRAF2 -->
  <path d="M 580 160 L 660 160" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="620" y="145" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">signaling adaptor</text>
  
  <!-- Function descriptions -->
  <text x="170" y="200" font-family="Arial" font-size="15" text-anchor="middle" fill="#555">GO:0005515</text>
  <text x="350" y="200" font-family="Arial" font-size="15" text-anchor="middle" fill="#555">GO:0061630</text>
  <text x="530" y="200" font-family="Arial" font-size="15" text-anchor="middle" fill="#555">GO:0035591</text>
  <text x="710" y="200" font-family="Arial" font-size="15" text-anchor="middle" fill="#555">GO:0031625</text>
  
  <!-- Downstream effect -->
  <path d="M 710 180 L 710 250 L 400 300" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <rect x="320" y="310" width="160" height="40" rx="15" ry="15" fill="#fde2e4" stroke="#333" stroke-width="2"/>
  <text x="400" y="335" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Innate Immune Response</text>
  <text x="400" y="360" font-family="Arial" font-size="15" font-style="italic" text-anchor="middle" fill="#555">GO:0045087</text>
  
  <!-- Ubiquitination illustration -->
  <circle cx="530" cy="120" r="12" fill="#ff7b00" stroke="#333" stroke-width="1"/>
  <text x="530" y="125" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Ub</text>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>