<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#888888" stroke-width="2" />
  
  <!-- Nucleus -->
  <ellipse cx="450" cy="300" rx="200" ry="180" fill="#e6e6fa" stroke="#888888" stroke-width="2" />
  <text x="450" y="460" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333" font-weight="bold">Nucleus</text>
  
  <!-- Nuclear membrane -->
  <ellipse cx="450" cy="300" rx="200" ry="180" fill="none" stroke="#888888" stroke-width="4" stroke-dasharray="5,5" />
  
  <!-- Cytoplasm label -->
  <text x="200" y="100" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333" font-weight="bold">Cytoplasm</text>
  
  <!-- Chromatin -->
  <path d="M400,250 C420,230 440,240 460,230 C480,220 500,230 520,240" stroke="#9370db" stroke-width="8" fill="none" />
  <text x="460" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#333333" font-weight="bold">Chromatin</text>
  
  <!-- FMDV-3A (P03305) -->
  <circle cx="350" cy="200" r="35" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="350" y="195" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000" font-weight="bold">FMDV-3A</text>
  <text x="350" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#333333">(P03305)</text>
  
  <!-- DDX56 -->
  <rect x="450" y="185" width="70" height="35" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
  <text x="485" y="208" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000" font-weight="bold">DDX56</text>
  
  <!-- IPO5 at nuclear membrane -->
  <rect x="450" y="300" width="70" height="35" rx="5" ry="5" fill="#99ff99" stroke="#009900" stroke-width="2" />
  <text x="485" y="323" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000" font-weight="bold">IPO5</text>
  
  <!-- TBK1 in cytoplasm -->
  <rect x="200" y="300" width="70" height="35" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="235" y="323" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000" font-weight="bold">TBK1</text>
  
  <!-- IRF3 at chromatin -->
  <rect x="520" y="240" width="70" height="35" rx="5" ry="5" fill="#cc99ff" stroke="#6600cc" stroke-width="2" />
  <text x="555" y="263" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000" font-weight="bold">IRF3</text>
  
  <!-- Arrows and interactions -->
  <!-- P03305 -> DDX56 (positive regulation) -->
  <path d="M385,200 L440,200" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowPositive)" />
  <circle cx="410" y="200" r="10" fill="#00cc00" />
  <text x="410" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#ffffff" font-weight="bold">+</text>
  
  <!-- DDX56 -> IPO5 (negative regulation) -->
  <path d="M485,220 L485,290" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowNegative)" />
  <circle cx="485" y="255" r="10" fill="#cc0000" />
  <text x="485" y="260" text-anchor="middle" font-family="Arial" font-size="14" fill="#ffffff" font-weight="bold">-</text>
  
  <!-- TBK1 -> IPO5 (positive regulation) -->
  <path d="M270,315 L440,315" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowPositive)" />
  <circle cx="350" y="315" r="10" fill="#00cc00" />
  <text x="350" y="320" text-anchor="middle" font-family="Arial" font-size="14" fill="#ffffff" font-weight="bold">+</text>
  
  <!-- IPO5 -> IRF3 (positive regulation) -->
  <path d="M520,300 L550,275" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowPositive)" />
  <circle cx="535" y="287" r="10" fill="#00cc00" />
  <text x="535" y="292" text-anchor="middle" font-family="Arial" font-size="14" fill="#ffffff" font-weight="bold">+</text>
  
  <!-- Arrow markers definitions -->
  <defs>
    <marker id="arrowPositive" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 Z" fill="#000000" />
    </marker>
    <marker id="arrowNegative" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 Z" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Functional labels -->
  <text x="350" y="170" text-anchor="middle" font-family="Arial" font-size="13" fill="#666666">molecular adaptor activity</text>
  <text x="485" y="165" text-anchor="middle" font-family="Arial" font-size="13" fill="#666666">protein sequestering activity</text>
  <text x="485" y="350" text-anchor="middle" font-family="Arial" font-size="13" fill="#666666">nuclear import signal receptor</text>
  <text x="235" y="350" text-anchor="middle" font-family="Arial" font-size="13" fill="#666666">protein serine/threonine kinase</text>
  <text x="555" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#666666">DNA-binding transcription factor</text>
  
  <!-- Process labels -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="#000000">FMDV-3A Inhibition of Host IRF3 via DDX56</text>
  <text x="400" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#666666">Suppression of Type I Interferon Production</text>
  
  <!-- Legend -->
  <rect x="570" y="100" width="150" height="125" rx="5" ry="5" fill="#ffffff" stroke="#888888" stroke-width="1" />
  <text x="645" y="120" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000" font-weight="bold">Legend</text>
  
  <circle cx="590" y="140" r="8" fill="#00cc00" />
  <text x="595" y="145" text-anchor="start" font-family="Arial" font-size="12" fill="#000000">Positive regulation</text>
  
  <circle cx="590" y="165" r="8" fill="#cc0000" />
  <text x="595" y="170" text-anchor="start" font-family="Arial" font-size="12" fill="#000000">Negative regulation</text>
  
  <circle cx="590" y="190" r="8" fill="#ff9999" />
  <text x="595" y="195" text-anchor="start" font-family="Arial" font-size="12" fill="#000000">Viral protein</text>
  
  <rect x="582" y="205" width="16" height="16" rx="2" ry="2" fill="#99ccff" stroke="#0066cc" stroke-width="1" />
  <text x="595" y="218" text-anchor="start" font-family="Arial" font-size="12" fill="#000000">Host protein</text>
</svg>