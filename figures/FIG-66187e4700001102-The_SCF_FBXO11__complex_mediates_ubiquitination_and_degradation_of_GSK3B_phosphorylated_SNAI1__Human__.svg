<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell nucleus background -->
  <ellipse cx="400" cy="300" rx="370" ry="270" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
  <text x="400" y="50" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Nuclear SCF(FBXO11) Complex-Mediated SNAI1 Degradation Pathway</text>
  <text x="680" y="90" font-family="Arial" font-size="18" text-anchor="end" font-style="italic">Nucleus</text>
  
  <!-- Proteins and interactions -->
  <!-- GSK3B -->
  <circle cx="200" cy="200" r="40" fill="#b3e0ff" stroke="#000" stroke-width="2"/>
  <text x="200" y="205" font-family="Arial" font-size="18" text-anchor="middle">GSK3B</text>
  
  <!-- SNAI1 -->
  <rect x="320" y="180" width="80" height="40" rx="5" ry="5" fill="#ffcccc" stroke="#000" stroke-width="2"/>
  <text x="360" y="205" font-family="Arial" font-size="18" text-anchor="middle">SNAI1</text>
  
  <!-- Phosphorylated SNAI1 -->
  <rect x="320" y="280" width="80" height="40" rx="5" ry="5" fill="#ffcccc" stroke="#000" stroke-width="2"/>
  <text x="360" y="295" font-family="Arial" font-size="16" text-anchor="middle">SNAI1</text>
  <text x="360" y="310" font-family="Arial" font-size="14" text-anchor="middle">(phospho)</text>
  <circle cx="380" cy="270" r="8" fill="#ffff00" stroke="#000" stroke-width="1"/>
  <text x="380" y="274" font-family="Arial" font-size="10" text-anchor="middle">P</text>
  
  <!-- FBXO11 -->
  <rect x="480" y="280" width="80" height="40" rx="5" ry="5" fill="#d9f2d9" stroke="#000" stroke-width="2"/>
  <text x="520" y="305" font-family="Arial" font-size="18" text-anchor="middle">FBXO11</text>

  <!-- RBX1 -->
  <rect x="400" y="380" width="80" height="40" rx="5" ry="5" fill="#d9d9f2" stroke="#000" stroke-width="2"/>
  <text x="440" y="405" font-family="Arial" font-size="18" text-anchor="middle">RBX1</text>
  
  <!-- SCF Complex (visual representation) -->
  <ellipse cx="440" cy="320" rx="120" ry="80" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="440" y="240" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">SCF Complex</text>
  
  <!-- Ubiquitin -->
  <circle cx="320" cy="380" r="20" fill="#ffd700" stroke="#000" stroke-width="1.5"/>
  <text x="320" y="385" font-family="Arial" font-size="14" text-anchor="middle">Ub</text>
  
  <!-- Degraded SNAI1 -->
  <rect x="240" y="480" width="80" height="40" rx="5" ry="5" fill="#ffcccc" stroke="#000" stroke-width="2" opacity="0.5" stroke-dasharray="3,2"/>
  <text x="280" y="505" font-family="Arial" font-size="18" text-anchor="middle" opacity="0.7">SNAI1</text>
  <line x1="250" y1="470" x2="270" y2="490" stroke="#000" stroke-width="2"/>
  <line x1="250" y1="490" x2="270" y2="470" stroke="#000" stroke-width="2"/>
  <line x1="290" y1="470" x2="310" y2="490" stroke="#000" stroke-width="2"/>
  <line x1="290" y1="490" x2="310" y2="470" stroke="#000" stroke-width="2"/>
  
  <!-- EMT regulation -->
  <rect x="600" y="480" width="120" height="60" rx="10" ry="10" fill="#ffe6cc" stroke="#000" stroke-width="2"/>
  <text x="660" y="505" font-family="Arial" font-size="16" text-anchor="middle">Epithelial to</text>
  <text x="660" y="525" font-family="Arial" font-size="16" text-anchor="middle">Mesenchymal</text>
  <text x="660" y="545" font-family="Arial" font-size="16" text-anchor="middle">Transition</text>
  
  <!-- Arrows and interactions -->
  <!-- GSK3B phosphorylates SNAI1 -->
  <line x1="230" y1="220" x2="310" y2="260" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="230" y="230" width="80" height="20" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="none"/>
  <text x="270" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">phosphorylates</text>
  
  <!-- FBXO11 recognizes phosphorylated SNAI1 -->
  <line x1="410" y1="300" x2="470" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="420" y="270" width="50" height="20" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="none"/>
  <text x="445" y="285" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">adapts</text>
  
  <!-- RBX1 mediates ubiquitination -->
  <path d="M 440,380 C 400,360 360,360 320,380" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="350" y="340" width="80" height="20" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="none"/>
  <text x="390" y="355" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">ubiquitinates</text>
  
  <!-- Ubiquitinated SNAI1 gets degraded -->
  <path d="M 320,400 C 300,430 290,450 280,480" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="260" y="430" width="80" height="20" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="none"/>
  <text x="300" y="445" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">degradation</text>
  
  <!-- Degraded SNAI1 effects on EMT -->
  <path d="M 330,500 C 400,520 500,510 590,500" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <rect x="400" y="520" width="140" height="20" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="none"/>
  <text x="470" y="535" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">negatively regulates</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="20" y="480" width="180" height="110" rx="5" ry="5" fill="#fff" stroke="#000" stroke-width="1" fill-opacity="0.9"/>
  <text x="110" y="500" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="40" cy="525" r="8" fill="#b3e0ff" stroke="#000" stroke-width="1"/>
  <text x="130" y="529" font-family="Arial" font-size="14" text-anchor="middle">Kinase (GSK3B)</text>
  
  <rect x="32" y="545" width="16" height="8" rx="2" ry="2" fill="#ffcccc" stroke="#000" stroke-width="1"/>
  <text x="130" y="549" font-family="Arial" font-size="14" text-anchor="middle">TF (SNAI1)</text>
  
  <rect x="32" y="565" width="16" height="8" rx="2" ry="2" fill="#d9f2d9" stroke="#000" stroke-width="1"/>
  <text x="130" y="569" font-family="Arial" font-size="14" text-anchor="middle">Adaptor (FBXO11)</text>
  
  <rect x="32" y="585" width="16" height="8" rx="2" ry="2" fill="#d9d9f2" stroke="#000" stroke-width="1"/>
  <text x="130" y="589" font-family="Arial" font-size="14" text-anchor="middle">E3 Ligase (RBX1)</text>
</svg>