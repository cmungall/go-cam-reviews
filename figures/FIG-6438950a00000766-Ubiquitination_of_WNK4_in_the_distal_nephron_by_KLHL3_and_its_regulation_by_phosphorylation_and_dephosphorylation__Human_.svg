<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and cell structure -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9" stroke="none" />
  
  <!-- Kidney Distal Convoluted Tubule Cell -->
  <rect x="100" y="150" width="600" height="400" rx="20" ry="20" fill="#e8f4f8" stroke="#2c3e50" stroke-width="3" />
  <text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Kidney Distal Convoluted Tubule Epithelial Cell</text>
  
  <!-- Extracellular space -->
  <rect x="50" y="50" width="700" height="100" rx="10" ry="10" fill="#d1ecf1" stroke="#2c3e50" stroke-width="2" />
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Extracellular Space (GO:0005615)</text>

  <!-- Cell Compartments Labels -->
  <rect x="120" y="170" width="160" height="30" rx="5" ry="5" fill="#b3e0ff" stroke="#2c3e50" stroke-width="1" />
  <text x="200" y="190" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm (GO:0005737)</text>
  
  <rect x="520" y="170" width="160" height="30" rx="5" ry="5" fill="#b3e0ff" stroke="#2c3e50" stroke-width="1" />
  <text x="600" y="190" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Cytosol (GO:0005829)</text>

  <!-- Tight Junction -->
  <rect x="290" y="150" width="20" height="80" fill="#ff9980" stroke="#2c3e50" stroke-width="2" />
  <text x="300" y="245" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Tight Junction</text>
  <text x="300" y="262" text-anchor="middle" font-family="Arial" font-size="14">(GO:0005923)</text>

  <!-- AGT in extracellular space -->
  <circle cx="200" cy="100" r="25" fill="#ffcc99" stroke="#e67300" stroke-width="2" />
  <text x="200" y="105" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">AGT</text>
  
  <!-- Signaling Arrow from AGT to PRKCA -->
  <path d="M 210 120 L 250 170" stroke="#e67300" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <rect x="240" y="140" width="70" height="20" fill="white" stroke="#000000" stroke-width="0.5" />
  <text x="240" y="155" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Activates</text>
  <text x="240" y="170" text-anchor="middle" font-family="Arial" font-size="12">(Hormone activity)</text>

  <!-- PRKCA -->
  <circle cx="280" cy="200" r="25" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
  <text x="280" y="205" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">PRKCA</text>
  
  <!-- Arrow from PRKCA to KLHL3 (phosphorylation) -->
  <path d="M 300 215 C 400 240, 400 280, 445 320" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead)" fill="none" stroke-dasharray="5,3" />
  <rect x="375" y="260" width="105" height="20" fill="white" stroke="#000000" stroke-width="0.5" />
  <text x="375" y="275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Phosphorylates</text>

  <!-- PPP3CA (Calcineurin) -->
  <circle cx="180" cy="300" r="25" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
  <text x="180" y="305" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">PPP3CA</text>
  
  <!-- Arrow from PPP3CA to PRKCA (negative regulation) -->
  <path d="M 200 285 C 240 260, 240 235, 255 215" stroke="#cc0000" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <rect x="215" y="235" width="65" height="20" fill="white" stroke="#000000" stroke-width="0.5" />
  <text x="215" y="250" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Inhibits</text>
  <text x="215" y="265" text-anchor="middle" font-family="Arial" font-size="12">(Dephosphorylates)</text>

  <!-- Ubiquitination Complex -->
  <rect x="350" y="340" width="280" height="150" rx="10" ry="10" fill="#ffe6cc" stroke="#ff9900" stroke-width="2" fill-opacity="0.5" />
  <text x="490" y="360" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Ubiquitin Ligase Complex</text>
  
  <!-- CUL3 -->
  <circle cx="400" cy="400" r="25" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">CUL3</text>
  <text x="400" y="425" text-anchor="middle" font-family="Arial" font-size="12">(Scaffold)</text>

  <!-- KLHL3 -->
  <circle cx="470" cy="400" r="25" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="470" y="405" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">KLHL3</text>
  <text x="470" y="425" text-anchor="middle" font-family="Arial" font-size="12">(Adaptor)</text>

  <!-- RBX1 -->
  <circle cx="540" cy="400" r="25" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="540" y="405" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">RBX1</text>
  <text x="540" y="425" text-anchor="middle" font-family="Arial" font-size="12">(E3 ligase)</text>

  <!-- WNK4 at tight junction -->
  <circle cx="290" cy="300" r="25" fill="#ccffcc" stroke="#009900" stroke-width="2" />
  <text x="290" y="305" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">WNK4</text>
  
  <!-- Arrow from Ubiquitin Complex to WNK4 -->
  <path d="M 370 390 C 340 370, 325 330, 310 320" stroke="#ff6600" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <rect x="310" y="340" width="100" height="24" fill="white" stroke="#000000" stroke-width="0.5" />
  <text x="310" y="357" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Ubiquitinates</text>
  
  <!-- Degradation Symbol -->
  <path d="M 260 320 L 240 350 L 270 350 L 250 380" stroke="#cc0000" stroke-width="3" fill="none" />
  <text x="240" y="400" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Degradation</text>
  <text x="240" y="417" text-anchor="middle" font-family="Arial" font-size="12">(Proteasome-mediated)</text>

  <!-- Process labels -->
  <rect x="600" y="265" width="140" height="60" rx="5" ry="5" fill="white" stroke="#2c3e50" stroke-width="1" fill-opacity="0.8"/>
  <text x="605" y="285" text-anchor="start" font-family="Arial" font-size="14" font-style="italic">Positive regulation of</text>
  <text x="605" y="305" text-anchor="start" font-family="Arial" font-size="14" font-style="italic">angiotensin-activated</text>
  <text x="605" y="325" text-anchor="start" font-family="Arial" font-size="14" font-style="italic">signaling pathway</text>
  
  <rect x="130" y="365" width="140" height="60" rx="5" ry="5" fill="white" stroke="#2c3e50" stroke-width="1" fill-opacity="0.8"/>
  <text x="135" y="385" text-anchor="start" font-family="Arial" font-size="14" font-style="italic">Negative regulation of</text>
  <text x="135" y="405" text-anchor="start" font-family="Arial" font-size="14" font-style="italic">angiotensin-activated</text>
  <text x="135" y="425" text-anchor="start" font-family="Arial" font-size="14" font-style="italic">signaling pathway</text>
  
  <rect x="150" y="460" width="140" height="40" rx="5" ry="5" fill="white" stroke="#2c3e50" stroke-width="1" fill-opacity="0.8"/>
  <text x="155" y="480" text-anchor="start" font-family="Arial" font-size="14" font-style="italic">Regulation of renal</text>
  <text x="155" y="500" text-anchor="start" font-family="Arial" font-size="14" font-style="italic">sodium ion absorption</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="435" width="180" height="135" rx="5" ry="5" fill="white" stroke="#2c3e50" stroke-width="1" />
  <text x="690" y="455" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Legend</text>
  <circle cx="620" cy="475" r="8" fill="#ffcc99" stroke="#e67300" stroke-width="1" />
  <text x="705" y="480" text-anchor="start" font-family="Arial" font-size="14">Hormone/Scaffold/Adaptor</text>
  <circle cx="620" cy="500" r="8" fill="#99ccff" stroke="#0066cc" stroke-width="1" />
  <text x="705" y="505" text-anchor="start" font-family="Arial" font-size="14">Kinase/Phosphatase</text>
  <circle cx="620" cy="525" r="8" fill="#ccffcc" stroke="#009900" stroke-width="1" />
  <text x="705" y="530" text-anchor="start" font-family="Arial" font-size="14">Substrate (WNK4)</text>
  <line x1="615" y1="550" x2="625" y2="550" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,3" />
  <text x="705" y="555" text-anchor="start" font-family="Arial" font-size="14">Phosphorylation</text>
  <line x1="615" y1="575" x2="625" y2="575" stroke="#ff6600" stroke-width="2" />
  <text x="705" y="580" text-anchor="start" font-family="Arial" font-size="14">Protein Interaction</text>
</svg>