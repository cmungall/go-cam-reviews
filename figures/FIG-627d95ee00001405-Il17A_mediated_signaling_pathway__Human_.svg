<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Cell membrane -->
  <path d="M 50 250 C 75 240, 125 260, 150 250 C 175 240, 225 260, 250 250 C 275 240, 325 260, 350 250 C 375 240, 425 260, 450 250 C 475 240, 525 260, 550 250 C 575 240, 625 260, 650 250 C 675 240, 725 260, 750 250" 
        stroke="#8B4513" stroke-width="5" fill="none" />
  <path d="M 50 260 C 75 250, 125 270, 150 260 C 175 250, 225 270, 250 260 C 275 250, 325 270, 350 260 C 375 250, 425 270, 450 260 C 475 250, 525 270, 550 260 C 575 250, 625 270, 650 260 C 675 250, 725 270, 750 260" 
        stroke="#8B4513" stroke-width="5" fill="none" />
  
  <!-- Background labels -->
  <text x="400" y="190" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#555555">Extracellular Space (GO:0005615)</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#555555">Cytoplasm (GO:0005737)</text>
  <text x="620" y="230" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#555555">Plasma Membrane (GO:0005886)</text>
  
  <!-- IL-17A -->
  <circle cx="180" cy="150" r="30" fill="#FF9999" stroke="#000000" stroke-width="2" />
  <text x="180" y="155" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">IL-17A</text>
  
  <!-- SARS-CoV-2 ORF8 -->
  <circle cx="280" cy="150" r="30" fill="#FF6666" stroke="#000000" stroke-width="2" />
  <text x="280" y="155" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">ORF8</text>
  <text x="280" y="170" text-anchor="middle" font-family="Arial" font-size="8">SARS-CoV-2</text>
  
  <!-- IL-17RA Receptor -->
  <rect x="230" y="230" width="50" height="50" fill="#99CCFF" stroke="#000000" stroke-width="2" />
  <text x="255" y="255" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">IL-17RA</text>
  <text x="255" y="270" text-anchor="middle" font-family="Arial" font-size="8">Receptor</text>
  
  <!-- IL-17RC Coreceptor -->
  <rect x="300" y="230" width="50" height="50" fill="#99CCFF" stroke="#000000" stroke-width="2" />
  <text x="325" y="255" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">IL-17RC</text>
  <text x="325" y="270" text-anchor="middle" font-family="Arial" font-size="8">Coreceptor</text>
  
  <!-- TRAF3IP2 -->
  <polygon points="280,320 260,350 300,350" fill="#CCFF99" stroke="#000000" stroke-width="2" />
  <text x="280" y="342" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">TRAF3IP2</text>
  <text x="280" y="355" text-anchor="middle" font-family="Arial" font-size="8">(ACT1)</text>
  
  <!-- TRAF6 -->
  <polygon points="380,370 360,400 400,400" fill="#CCFF99" stroke="#000000" stroke-width="2" />
  <text x="380" y="392" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">TRAF6</text>
  
  <!-- MAP3K7 -->
  <ellipse cx="480" cy="450" rx="40" ry="30" fill="#FFCC99" stroke="#000000" stroke-width="2" />
  <text x="480" y="455" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">MAP3K7</text>
  <text x="480" y="470" text-anchor="middle" font-family="Arial" font-size="8">(TAK1)</text>
  
  <!-- Membrane annotation for receptors -->
  <rect x="230" y="230" width="120" height="10" fill="#8B4513" opacity="0.5" />
  <rect x="230" y="270" width="120" height="10" fill="#8B4513" opacity="0.5" />
  
  <!-- Membrane anchoring for TRAF3IP2 -->
  <rect x="275" y="290" width="10" height="30" fill="#CCFF99" stroke="#000000" stroke-width="1" opacity="0.7" />
  <text x="315" y="310" text-anchor="start" font-family="Arial" font-size="11" fill="#555555">GO:0031234</text>
  
  <!-- Arrows and connections -->
  <!-- IL-17A to IL-17RA -->
  <path d="M 190 175 L 240 230" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="205" y="210" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#000000" transform="rotate(-40, 205, 210)">Activates</text>
  
  <!-- SARS-CoV-2 ORF8 to IL-17RA -->
  <path d="M 270 175 L 255 230" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="255" y="210" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#000000" transform="rotate(65, 255, 210)">Perturbs</text>
  
  <!-- Receptor complex to TRAF3IP2 -->
  <path d="M 280 280 L 280 320" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="312" y="300" text-anchor="start" font-family="Arial" font-size="11" font-weight="bold" fill="#000000">Recruits</text>
  
  <!-- TRAF3IP2 to TRAF6 -->
  <path d="M 290 350 L 370 370" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="330" y="350" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#000000">Ubiquitinates</text>
  
  <!-- TRAF6 to MAP3K7 -->
  <path d="M 390 400 L 460 430" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="425" y="410" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#000000">Ubiquitinates</text>
  
  <!-- Downstream phosphorylation -->
  <path d="M 520 450 C 550 450, 570 430, 580 410" stroke="#000000" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead)" />
  <text x="550" y="420" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#000000">Phosphorylates</text>
  <text x="550" y="435" text-anchor="middle" font-family="Arial" font-size="10" fill="#666666" font-style="italic">Downstream</text>
  <text x="550" y="450" text-anchor="middle" font-family="Arial" font-size="10" fill="#666666" font-style="italic">targets</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="580" y="400" width="200" height="180" fill="#EEEEEE" stroke="#000000" stroke-width="1" />
  <text x="600" y="420" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="600" cy="440" r="10" fill="#FF9999" stroke="#000000" stroke-width="1" />
  <text x="620" y="444" font-family="Arial" font-size="12">Cytokine (IL-17A)</text>
  
  <circle cx="600" cy="465" r="10" fill="#FF6666" stroke="#000000" stroke-width="1" />
  <text x="620" y="469" font-family="Arial" font-size="12">Viral protein (ORF8)</text>
  
  <rect x="590" y="480" width="20" height="20" fill="#99CCFF" stroke="#000000" stroke-width="1" />
  <text x="620" y="494" font-family="Arial" font-size="12">Receptors</text>
  
  <polygon points="600,520 590,535 610,535" fill="#CCFF99" stroke="#000000" stroke-width="1" />
  <text x="620" y="529" font-family="Arial" font-size="12">Adaptors/E3 ligases</text>
  
  <ellipse cx="600" cy="550" rx="10" ry="8" fill="#FFCC99" stroke="#000000" stroke-width="1" />
  <text x="620" y="554" font-family="Arial" font-size="12">Kinase</text>
  
  <line x1="590" y1="565" x2="610" y2="565" stroke="#000000" stroke-width="2" stroke-dasharray="5,3" />
  <text x="620" y="569" font-family="Arial" font-size="12">Implicit pathway</text>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">IL-17A Mediated Signaling Pathway (Human)</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic">With SARS-CoV-2 ORF8 perturbation</text>
</svg>