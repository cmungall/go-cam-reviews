<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with adipocyte cell outline -->
  <rect width="800" height="600" fill="#f9f9f9" />
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#fff4e6" stroke="#ccc" stroke-width="2" />
  
  <!-- Cell compartments -->
  <!-- Plasma membrane -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="none" stroke="#888" stroke-width="4" />
  <!-- Nucleus -->
  <ellipse cx="400" cy="330" rx="150" ry="100" fill="#e6f0ff" stroke="#888" stroke-width="3" />
  <text x="400" y="330" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Nucleus</text>
  
  <!-- Extracellular space label -->
  <text x="130" y="120" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Extracellular Space</text>
  
  <!-- Plasma membrane label -->
  <text x="600" y="230" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cell type label -->
  <text x="400" y="550" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">Adipocyte</text>
  
  <!-- Molecules and interactions -->
  <!-- BMP8B in extracellular space -->
  <circle cx="150" cy="150" r="30" fill="#ffcc99" stroke="#ff9933" stroke-width="2" />
  <text x="150" y="155" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">BMP8B</text>
  <text x="150" y="175" font-family="Arial" font-size="10" text-anchor="middle">cytokine activity</text>
  
  <!-- ACVR1B receptor on membrane -->
  <rect x="300" y="200" width="60" height="30" rx="5" ry="5" fill="#99ccff" stroke="#3366cc" stroke-width="2" />
  <text x="330" y="220" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ACVR1B</text>
  <text x="330" y="245" font-family="Arial" font-size="10" text-anchor="middle">activin receptor</text>
  
  <!-- SMAD2 in nucleus -->
  <rect x="325" y="300" width="60" height="30" rx="5" ry="5" fill="#b3ffb3" stroke="#33cc33" stroke-width="2" />
  <text x="355" y="320" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SMAD2</text>
  
  <!-- SMAD3 in nucleus -->
  <rect x="425" y="300" width="60" height="30" rx="5" ry="5" fill="#b3ffb3" stroke="#33cc33" stroke-width="2" />
  <text x="455" y="320" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SMAD3</text>
  
  <text x="375" y="350" font-family="Arial" font-size="10" text-anchor="middle">DNA-binding transcription activators</text>
  
  <!-- Adipocyte differentiation representation -->
  <rect x="550" y="400" width="120" height="40" rx="10" ry="10" fill="#ffdbdb" stroke="#ff6666" stroke-width="2" />
  <text x="610" y="425" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Adipocyte Differentiation</text>
  
  <!-- Interaction arrows -->
  <!-- BMP8B to receptor -->
  <path d="M180 160 Q 250 170 300 215" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Receptor to SMAD2 -->
  <path d="M350 230 Q 350 260 350 300" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Receptor to SMAD3 -->
  <path d="M350 230 Q 400 260 430 300" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- SMAD2/3 to adipocyte differentiation inhibition -->
  <path d="M385 330 Q 450 380 550 420" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#inhibitarrow)" />
  <text x="465" y="380" font-family="Arial" font-size="12" fill="#ff0000" font-weight="bold">Inhibits</text>
  
  <!-- Process label -->
  <rect x="200" y="80" width="400" height="30" rx="10" ry="10" fill="#ffe6e6" stroke="#ff9999" stroke-width="2" />
  <text x="400" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Negative Regulation of Cell Differentiation</text>
  
  <!-- Define arrowhead markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
    <marker id="inhibitarrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#ff0000" stroke-width="2"/>
      <line x1="0" y1="10" x2="10" y2="0" stroke="#ff0000" stroke-width="2"/>
    </marker>
  </defs>
  
  <!-- Causal associations arrows with simplified labels -->
  <text x="225" y="155" font-family="Arial" font-size="10" transform="rotate(-10, 225, 155)" fill="#333">activates</text>
  <text x="330" y="275" font-family="Arial" font-size="10" transform="rotate(90, 330, 275)" fill="#333">activates</text>
  <text x="400" y="275" font-family="Arial" font-size="10" transform="rotate(45, 400, 275)" fill="#333">activates</text>
  
  <!-- Title of the pathway -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">BMP8B Role in Adipocyte Differentiation Inhibition (Human)</text>
</svg>