<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Cell membrane -->
  <rect x="50" y="300" width="700" height="20" fill="#c9e2f3" stroke="#333" stroke-width="2"/>
  <text x="60" y="315" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Cell membrane</text>
  
  <!-- Labels for compartments -->
  <text x="400" y="280" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Extracellular space (GO:0005615)</text>
  <text x="400" y="380" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Cytoplasm</text>
  
  <!-- Ligands in extracellular space -->
  <!-- PGLYRP1 -->
  <circle cx="200" cy="150" r="30" fill="#9fc5e8" stroke="#333" stroke-width="2"/>
  <text x="200" y="155" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">PGLYRP1</text>
  
  <!-- HMGB1 -->
  <circle cx="300" cy="170" r="30" fill="#9fc5e8" stroke="#333" stroke-width="2"/>
  <text x="300" y="175" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">HMGB1</text>
  
  <!-- HSPA1A -->
  <circle cx="400" cy="150" r="30" fill="#9fc5e8" stroke="#333" stroke-width="2"/>
  <text x="400" y="155" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">HSPA1A</text>
  
  <!-- Soluble TREM1 (decoy receptor) -->
  <path d="M600,200 L620,180 L640,200 L620,220 Z" fill="#d5a6bd" stroke="#333" stroke-width="2"/>
  <text x="620" y="205" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">TREM1</text>
  <text x="620" y="170" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Soluble</text>
  <text x="620" y="233" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(decoy activity)</text>
  
  <!-- TREM1 receptor -->
  <rect x="300" y="260" width="60" height="40" rx="5" ry="5" fill="#d5a6bd" stroke="#333" stroke-width="2"/>
  <text x="330" y="285" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">TREM1</text>
  
  <!-- Membrane-embedded part of TREM1 -->
  <rect x="320" y="300" width="20" height="20" fill="#d5a6bd" stroke="#333" stroke-width="2"/>
  
  <!-- DAP12 (TYROBP) -->
  <rect x="300" y="320" width="60" height="40" rx="5" ry="5" fill="#b6d7a8" stroke="#333" stroke-width="2"/>
  <text x="330" y="345" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">DAP12</text>
  <text x="330" y="358" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(TYROBP)</text>
  
  <!-- SYK -->
  <polygon points="330,400 300,450 360,450" fill="#f9cb9c" stroke="#333" stroke-width="2"/>
  <text x="330" y="435" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">SYK</text>
  <text x="330" y="448" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(kinase)</text>
  
  <!-- Connection lines -->
  <!-- PGLYRP1 to TREM1 -->
  <line x1="210" y1="178" x2="295" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- HMGB1 to TREM1 -->
  <line x1="300" y1="200" x2="300" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- HSPA1A to TREM1 -->
  <line x1="390" y1="178" x2="335" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Soluble TREM1 inhibition -->
  <line x1="590" y1="200" x2="450" y2="180" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#inhibit)"/>
  <line x1="590" y1="200" x2="350" y2="180" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#inhibit)"/>
  <line x1="590" y1="200" x2="250" y2="170" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#inhibit)"/>
  
  <!-- TREM1 to DAP12 -->
  <line x1="330" y1="300" x2="330" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- DAP12 to SYK -->
  <line x1="330" y1="360" x2="330" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Define markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="inhibit" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <circle cx="5" cy="5" r="4" fill="#fff" stroke="#ff0000" stroke-width="1"/>
      <line x1="0" y1="5" x2="10" y2="5" stroke="#ff0000" stroke-width="2"/>
    </marker>
  </defs>
  
  <!-- GO IDs and function names -->
  <rect x="160" y="100" width="80" height="40" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="#666" stroke-width="1"/>
  <text x="200" y="120" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0048018</text>
  <text x="200" y="135" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Receptor ligand</text>
  
  <rect x="260" y="120" width="80" height="40" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="#666" stroke-width="1"/>
  <text x="300" y="140" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0048018</text>
  <text x="300" y="155" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Receptor ligand</text>
  
  <rect x="360" y="100" width="80" height="40" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="#666" stroke-width="1"/>
  <text x="400" y="120" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0048018</text>
  <text x="400" y="135" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Receptor ligand</text>
  
  <rect x="580" y="250" width="80" height="40" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="#666" stroke-width="1"/>
  <text x="620" y="270" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0140319</text>
  <text x="620" y="285" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Receptor decoy</text>
  
  <rect x="370" y="255" width="120" height="40" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="#666" stroke-width="1"/>
  <text x="430" y="270" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0004888</text>
  <text x="430" y="285" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Transmembrane receptor</text>
  
  <rect x="370" y="320" width="110" height="40" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="#666" stroke-width="1"/>
  <text x="425" y="335" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0060090</text>
  <text x="425" y="350" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Molecular adaptor</text>
  
  <rect x="370" y="410" width="100" height="40" fill="#ffffff" fill-opacity="0.8" rx="5" ry="5" stroke="#666" stroke-width="1"/>
  <text x="420" y="425" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0016301</text>
  <text x="420" y="440" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">Kinase activity</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle" fill="#333">TREM1-DAP12 Signaling Pathway</text>
  <text x="400" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">Based on SPModule-TREM1-DAP12 GO-CAM Model</text>
  
  <!-- Labels for protein locations -->
  <text x="730" y="315" font-family="Arial" font-size="14" fill="#333" text-anchor="end">GO:0009986</text>
  <text x="730" y="330" font-family="Arial" font-size="14" fill="#333" text-anchor="end">Cell Surface</text>
  
  <!-- Legend -->
  <rect x="620" y="400" width="150" height="170" fill="#f0f0f0" fill-opacity="0.8" rx="5" ry="5" stroke="#666" stroke-width="1"/>
  <text x="695" y="420" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">LEGEND</text>
  
  <!-- Legend items -->
  <circle cx="640" y="440" r="10" fill="#9fc5e8" stroke="#333" stroke-width="1"/>
  <text x="700" y="445" font-family="Arial" font-size="12" fill="#333">Ligand</text>
  
  <rect x="630" y="460" width="20" height="20" rx="5" ry="5" fill="#d5a6bd" stroke="#333" stroke-width="1"/>
  <text x="700" y="475" font-family="Arial" font-size="12" fill="#333">Receptor</text>
  
  <rect x="630" y="490" width="20" height="20" rx="5" ry="5" fill="#b6d7a8" stroke="#333" stroke-width="1"/>
  <text x="700" y="505" font-family="Arial" font-size="12" fill="#333">Adaptor protein</text>
  
  <polygon points="640,520 630,535 650,535" fill="#f9cb9c" stroke="#333" stroke-width="1"/>
  <text x="700" y="530" font-family="Arial" font-size="12" fill="#333">Kinase</text>
  
  <line x1="630" y1="550" x2="650" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="700" y="555" font-family="Arial" font-size="12" fill="#333">Activation</text>
  
  <line x1="630" y1="570" x2="650" y2="570" stroke="#ff0000" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#inhibit)"/>
  <text x="700" y="575" font-family="Arial" font-size="12" fill="#333">Inhibition</text>
</svg>