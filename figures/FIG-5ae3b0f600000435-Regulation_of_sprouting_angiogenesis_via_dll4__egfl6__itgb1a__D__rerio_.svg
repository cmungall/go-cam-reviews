<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Regulation of Sprouting Angiogenesis via DLL4, EGFL6, ITGB1A (D. rerio)</text>
  
  <!-- Somite Cell -->
  <ellipse cx="200" cy="150" rx="100" ry="70" fill="#e6f7ff" stroke="#0066cc" stroke-width="2" />
  <text x="200" y="140" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Somite Cell</text>
  <text x="200" y="165" font-family="Arial" font-size="12" text-anchor="middle">(ZFA:0000155)</text>
  
  <!-- EGFL6 Protein -->
  <rect x="160" y="220" width="80" height="40" rx="10" ry="10" fill="#ffcccc" stroke="#cc0000" stroke-width="2" />
  <text x="200" y="245" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">EGFL6</text>
  <text x="200" y="270" font-family="Arial" font-size="10" text-anchor="middle">(ZFIN:ZDB-GENE-040718-157)</text>
  
  <!-- EGFL6 Functions -->
  <rect x="60" y="320" width="140" height="30" rx="15" ry="15" fill="#ffe6cc" stroke="#ff9900" stroke-width="2" />
  <text x="130" y="340" font-family="Arial" font-size="12" text-anchor="middle">Receptor Ligand Activity</text>
  <text x="130" y="355" font-family="Arial" font-size="10" text-anchor="middle">(GO:0048018)</text>
  
  <rect x="210" y="320" width="130" height="30" rx="15" ry="15" fill="#ffe6cc" stroke="#ff9900" stroke-width="2" />
  <text x="275" y="340" font-family="Arial" font-size="12" text-anchor="middle">Integrin Binding</text>
  <text x="275" y="355" font-family="Arial" font-size="10" text-anchor="middle">(GO:0005178)</text>
  
  <!-- Endothelial Tip Cell -->
  <ellipse cx="550" cy="250" rx="120" ry="80" fill="#e6ffe6" stroke="#009900" stroke-width="2" />
  <text x="550" y="230" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Endothelial Tip Cell</text>
  <text x="550" y="255" font-family="Arial" font-size="12" text-anchor="middle">(ZFA:0009065)</text>
  <text x="550" y="275" font-family="Arial" font-size="12" text-anchor="middle">(CL:0000423)</text>
  
  <!-- ITGB1A Receptor -->
  <rect x="470" y="330" width="80" height="40" rx="10" ry="10" fill="#ccccff" stroke="#0000cc" stroke-width="2" />
  <text x="510" y="355" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">ITGB1A</text>
  <text x="510" y="380" font-family="Arial" font-size="10" text-anchor="middle">(ZFIN:ZDB-GENE-060803-2)</text>
  <rect x="560" y="335" width="160" height="30" rx="15" ry="15" fill="#e1e1ff" stroke="#0000cc" stroke-width="1" />
  <text x="640" y="355" font-family="Arial" font-size="12" text-anchor="middle">Signaling Receptor Activity</text>
  <text x="640" y="370" font-family="Arial" font-size="10" text-anchor="middle">(GO:0038023)</text>
  
  <!-- DLL4 Protein -->
  <rect x="470" y="430" width="80" height="40" rx="10" ry="10" fill="#ffccff" stroke="#cc00cc" stroke-width="2" />
  <text x="510" y="455" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">DLL4</text>
  <text x="510" y="475" font-family="Arial" font-size="10" text-anchor="middle">(ZFIN:ZDB-GENE-041014-73)</text>
  <rect x="560" y="435" width="120" height="30" rx="15" ry="15" fill="#fcddfc" stroke="#cc00cc" stroke-width="1" />
  <text x="620" y="455" font-family="Arial" font-size="12" text-anchor="middle">Notch Binding</text>
  <text x="620" y="470" font-family="Arial" font-size="10" text-anchor="middle">(GO:0005112)</text>
  
  <!-- Notch Signaling Pathway -->
  <rect x="420" y="510" width="180" height="50" rx="10" ry="10" fill="#e6e6e6" stroke="#666666" stroke-width="2" />
  <text x="510" y="540" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Notch Signaling Pathway</text>
  <text x="510" y="560" font-family="Arial" font-size="10" text-anchor="middle">(GO:0007219)</text>
  
  <!-- Process Outcome -->
  <rect x="170" y="510" width="200" height="60" rx="25" ry="25" fill="#d4f1c5" stroke="#45a049" stroke-width="2" />
  <text x="270" y="535" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Positive Regulation of</text>
  <text x="270" y="555" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Sprouting Angiogenesis</text>
  <text x="270" y="575" font-family="Arial" font-size="10" text-anchor="middle">(GO:0090050, GO:1903672)</text>
  
  <!-- Arrows and connections -->
  <!-- EGFL6 secretion -->
  <line x1="200" y1="220" x2="200" y2="190" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- EGFL6 to functions -->
  <line x1="175" y1="260" x2="130" y2="320" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="225" y1="260" x2="275" y2="320" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- EGFL6 to ITGB1A -->
  <path d="M 240 240 C 350 260, 380 300, 470 350" stroke="#cc0000" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />
  <text x="340" y="280" font-family="Arial" font-size="14" font-style="italic">Binds</text>
  <text x="340" y="300" font-family="Arial" font-size="12">RO:0002629</text>
  <text x="340" y="315" font-family="Arial" font-size="12">(positively regulates)</text>
  
  <!-- ITGB1A to DLL4 -->
  <line x1="510" y1="370" x2="510" y2="430" stroke="#0000cc" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <text x="525" y="400" font-family="Arial" font-size="12" font-style="italic">Activates</text>
  <text x="525" y="415" font-family="Arial" font-size="11">RO:0002305</text>
  
  <!-- DLL4 to Notch Signaling -->
  <line x1="510" y1="470" x2="510" y2="510" stroke="#cc00cc" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Notch Signaling to Angiogenesis -->
  <path d="M 420 535 C 390 535, 370 535, 370 535" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Cell Components Label -->
  <text x="400" y="610" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Part of positive regulation of cell migration involved in sprouting angiogenesis (GO:0090050)</text>
  
  <!-- Legend -->
  <rect x="85" y="610" width="630" height="80" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="95" y="625" font-family="Arial" font-size="11" font-weight="bold">Legend:</text>
  
  <!-- Proteins -->
  <rect x="95" y="630" width="10" height="10" fill="#ffcccc" stroke="#cc0000" stroke-width="1" />
  <text x="110" y="638" font-family="Arial" font-size="10">Protein</text>
  
  <!-- Cells -->
  <rect x="170" y="630" width="10" height="10" fill="#e6f7ff" stroke="#0066cc" stroke-width="1" />
  <text x="185" y="638" font-family="Arial" font-size="10">Cell</text>
  
  <!-- Functions -->
  <rect x="240" y="630" width="10" height="10" fill="#ffe6cc" stroke="#ff9900" stroke-width="1" rx="5" ry="5" />
  <text x="255" y="638" font-family="Arial" font-size="10">Function</text>
  
  <!-- Processes -->
  <rect x="320" y="630" width="10" height="10" fill="#d4f1c5" stroke="#45a049" stroke-width="1" rx="5" ry="5" />
  <text x="335" y="638" font-family="Arial" font-size="10">Process</text>
  
  <!-- Identifier Prefixes -->
  <text x="95" y="655" font-family="Arial" font-size="10" font-weight="bold">Identifier Prefixes:</text>
  <text x="95" y="670" font-family="Arial" font-size="10">GO: Gene Ontology | ZFA: Zebrafish Anatomy | CL: Cell Ontology | RO: Relation Ontology | ZFIN: Zebrafish Information Network</text>
  <text x="95" y="685" font-family="Arial" font-size="10">D. rerio: Danio rerio (Zebrafish)</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
</svg>