<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="2" />
  
  <!-- Lysosome -->
  <ellipse cx="400" cy="350" rx="200" ry="120" fill="#e6e6fa" stroke="#6a5acd" stroke-width="3" />
  <text x="400" y="350" font-family="Arial" font-size="22" text-anchor="middle" fill="#333">Lysosomal Membrane</text>
  
  <!-- DEPDC5 (GATOR1 subunit) -->
  <rect x="330" y="280" width="120" height="60" rx="10" ry="10" fill="#ffd700" stroke="#333" stroke-width="2" />
  <text x="390" y="310" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">DEPDC5</text>
  <text x="390" y="330" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">(GATOR1 complex)</text>
  
  <!-- PIM1 -->
  <rect x="200" y="150" width="80" height="50" rx="10" ry="10" fill="#90ee90" stroke="#333" stroke-width="2" />
  <text x="240" y="180" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">PIM1</text>
  <text x="240" y="198" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">protein kinase</text>
  
  <!-- AKT1 -->
  <rect x="500" y="150" width="80" height="50" rx="10" ry="10" fill="#90ee90" stroke="#333" stroke-width="2" />
  <text x="540" y="180" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">AKT1</text>
  <text x="540" y="198" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">protein kinase</text>
  
  <!-- RRAGC -->
  <rect x="540" y="280" width="80" height="50" rx="10" ry="10" fill="#ffa07a" stroke="#333" stroke-width="2" />
  <text x="580" y="305" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">RRAGC</text>
  <text x="580" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">small GTPase</text>
  
  <!-- GDP -->
  <circle cx="580" cy="360" r="20" fill="#add8e6" stroke="#0000cd" stroke-width="2" />
  <text x="580" y="365" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">GDP</text>
  
  <!-- Label for GDP binding -->
  <text x="630" y="360" font-family="Arial" font-size="14" text-anchor="start" fill="#333" font-style="italic">GDP binding promotes</text>
  <text x="630" y="375" font-family="Arial" font-size="14" text-anchor="start" fill="#333" font-style="italic">mTORC1 activation</text>
  
  <!-- mTORC1 (implied, marked as not in source) -->
  <rect x="400" y="450" width="100" height="50" rx="10" ry="10" fill="#f08080" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <text x="450" y="475" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">mTORC1*</text>
  <text x="450" y="490" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">*implied, not in source</text>
  
  <!-- Process labels -->
  <text x="270" y="235" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-style="italic">Phosphorylation</text>
  <text x="500" y="235" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-style="italic">Phosphorylation</text>
  
  <!-- Arrows and Phosphorylation -->
  <!-- PIM1 to DEPDC5 -->
  <line x1="240" y1="200" x2="350" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <circle cx="320" cy="260" r="10" fill="#ff6347" />
  <text x="320" y="264" font-family="Arial" font-size="14" text-anchor="middle" fill="white">P</text>
  
  <!-- AKT1 to DEPDC5 -->
  <line x1="540" y1="200" x2="430" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <circle cx="480" cy="260" r="10" fill="#ff6347" />
  <text x="480" y="264" font-family="Arial" font-size="14" text-anchor="middle" fill="white">P</text>
  
  <!-- DEPDC5 to mTORC1 -->
  <line x1="390" y1="340" x2="430" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  <circle cx="420" cy="400" r="14" fill="white" stroke="#333" stroke-width="2" />
  <line x1="410" y1="400" x2="430" y2="400" stroke="#333" stroke-width="2" />
  <text x="370" y="400" font-family="Arial" font-size="14" text-anchor="end" fill="#333" font-style="italic">Inhibits mTORC1</text>
  <text x="370" y="415" font-family="Arial" font-size="14" text-anchor="end" fill="#333" font-style="italic">when active</text>
  
  <!-- Label for phosphorylation effect -->
  <text x="300" y="350" font-family="Arial" font-size="14" text-anchor="start" fill="#333" font-style="italic">Phosphorylation inhibits</text>
  <text x="300" y="365" font-family="Arial" font-size="14" text-anchor="start" fill="#333" font-style="italic">DEPDC5 activity</text>
  
  <!-- RRAGC to mTORC1 -->
  <line x1="580" y1="330" x2="470" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <circle cx="520" cy="390" r="14" fill="white" stroke="#333" stroke-width="2" />
  <text x="520" y="395" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">+</text>
  <text x="545" y="375" font-family="Arial" font-size="14" text-anchor="start" fill="#333" font-style="italic">Activates</text>
  <text x="545" y="390" font-family="Arial" font-size="14" text-anchor="start" fill="#333" font-style="italic">mTORC1</text>
  
  <!-- GDP to RRAGC -->
  <line x1="580" y1="340" x2="580" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Legend -->
  <rect x="580" y="70" width="150" height="140" fill="white" stroke="#333" stroke-width="1" />
  <text x="590" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Legend:</text>
  
  <circle cx="600" y="110" r="10" fill="#ff6347" />
  <text x="615" y="115" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Phosphorylation</text>
  
  <rect x="590" y="130" width="20" height="10" fill="#f08080" stroke="#333" stroke-width="1" stroke-dasharray="5,5" />
  <text x="615" y="138" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Implied element</text>
  
  <circle cx="600" y="160" r="14" fill="white" stroke="#333" stroke-width="1" />
  <text x="600" y="165" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">+</text>
  <text x="615" y="165" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Activation</text>
  
  <circle cx="600" y="190" r="14" fill="white" stroke="#333" stroke-width="1" />
  <line x1="590" y1="190" x2="610" y2="190" stroke="#333" stroke-width="1" />
  <text x="615" y="195" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Inhibition</text>
  
  <!-- Biological processes annotation box -->
  <rect x="100" y="70" width="180" height="70" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="110" y="90" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Biological Processes:</text>
  <text x="110" y="110" font-family="Arial" font-size="13" fill="#333">• Positive regulation of TORC1 signaling</text>
  <text x="110" y="130" font-family="Arial" font-size="13" fill="#333">• Negative regulation of TORC1 signaling</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Activation of mTORC1 signaling by phosphorylation of GATOR1 subunit DEPDC5</text>
</svg>