<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f8f8" rx="10" ry="10"/>
  
  <!-- Cell nucleus boundary -->
  <ellipse cx="400" cy="300" rx="370" ry="270" fill="#e6f2ff" stroke="#2c3e50" stroke-width="2" opacity="0.7"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#2c3e50">Nuclear Compartment</text>
  
  <!-- Replication fork region -->
  <rect x="150" y="150" width="500" height="300" rx="20" ry="20" fill="#e8f4ea" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2c3e50">Replication Fork (GO:0005657)</text>
  
  <!-- Chromatin region -->
  <rect x="120" y="120" width="560" height="360" rx="20" ry="20" fill="none" stroke="#8e44ad" stroke-width="2" stroke-dasharray="10,5" opacity="0.6"/>
  <text x="400" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#8e44ad">Chromatin (GO:0000785)</text>
  
  <!-- DNA strand with cross-link -->
  <path d="M 200,300 Q 250,250 300,300 Q 350,350 400,300 Q 450,250 500,300 Q 550,350 600,300" fill="none" stroke="#3498db" stroke-width="4"/>
  
  <!-- DNA damaged site (abasic site with cross-linked protein) -->
  <circle cx="400" cy="300" r="15" fill="#e74c3c"/>
  <path d="M 400,285 L 400,260 L 420,240" stroke="#e74c3c" stroke-width="3" fill="none"/>
  <circle cx="420" cy="240" r="10" fill="#e74c3c"/>
  
  <!-- Label for cross-link with improved readability -->
  <rect x="350" y="250" width="110" height="36" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="#e74c3c" stroke-width="1"/>
  <text x="355" y="270" font-family="Arial" font-size="14" font-weight="bold" fill="#e74c3c">Protein-DNA</text>
  <text x="355" y="285" font-family="Arial" font-size="14" font-weight="bold" fill="#e74c3c">cross-link</text>
  
  <!-- Stage 1: HMCES Binding - with better positioned labels -->
  <circle cx="210" cy="240" r="25" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
  <text x="210" y="245" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">HMCES</text>
  <path d="M 235,240 Q 300,250 380,280" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  
  <!-- Improved label box for stage 1 -->
  <rect x="240" y="200" width="190" height="40" rx="5" ry="5" fill="white" fill-opacity="0.9" stroke="#f39c12" stroke-width="1"/>
  <text x="245" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">1. DNA-(abasic site) binding</text>
  <text x="245" y="235" font-family="Arial" font-size="12" fill="#2c3e50">(GO:0140431)</text>
  
  <!-- Stage 2: HMCES Cross-linking - with better positioned labels -->
  <circle cx="300" cy="350" r="25" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
  <text x="300" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">HMCES</text>
  <path d="M 300,325 Q 340,310 390,300" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Improved label box for stage 2 -->
  <rect x="190" y="380" width="220" height="40" rx="5" ry="5" fill="white" fill-opacity="0.9" stroke="#f39c12" stroke-width="1"/>
  <text x="195" y="400" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">2. Protein-DNA cross-linking</text>
  <text x="195" y="415" font-family="Arial" font-size="12" fill="#2c3e50">(GO:0160129)</text>
  
  <!-- Stage 3: BRIP1/FANCJ Helicase Activity - with better positioned labels -->
  <circle cx="500" cy="350" r="25" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
  <text x="500" y="348" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">BRIP1/</text>
  <text x="500" y="362" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">FANCJ</text>
  <path d="M 480,330 Q 450,310 420,300" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Improved label box for stage 3 -->
  <rect x="430" y="380" width="230" height="40" rx="5" ry="5" fill="white" fill-opacity="0.9" stroke="#27ae60" stroke-width="1"/>
  <text x="435" y="400" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">3. 5'-3' DNA helicase activity</text>
  <text x="435" y="415" font-family="Arial" font-size="12" fill="#2c3e50">(GO:0043139)</text>
  
  <!-- Stage 4: SPRTN Metalloendopeptidase Activity - with better positioned labels -->
  <circle cx="590" cy="240" r="25" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
  <text x="590" y="245" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">SPRTN</text>
  <path d="M 565,240 Q 500,250 420,280" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Improved label box for stage 4 -->
  <rect x="430" y="190" width="240" height="40" rx="5" ry="5" fill="white" fill-opacity="0.9" stroke="#9b59b6" stroke-width="1"/>
  <text x="435" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">4. Metalloendopeptidase activity</text>
  <text x="435" y="225" font-family="Arial" font-size="12" fill="#2c3e50">(GO:0004222)</text>
  
  <!-- Sequential process arrows connecting the proteins -->
  <path d="M 230,260 Q 260,305 280,330" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="315" font-family="Arial" font-size="11" fill="#2c3e50">Step 1→2</text>
  
  <path d="M 325,350 Q 400,350 475,350" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="365" font-family="Arial" font-size="11" fill="#2c3e50">Step 2→3</text>
  
  <path d="M 520,330 Q 550,285 570,265" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="305" font-family="Arial" font-size="11" fill="#2c3e50">Step 3→4</text>
  
  <!-- Repaired DNA illustration -->
  <path d="M 200,450 Q 250,400 300,450 Q 350,500 400,450 Q 450,400 500,450 Q 550,500 600,450" fill="none" stroke="#3498db" stroke-width="4"/>
  <rect x="225" y="460" width="350" height="30" rx="5" ry="5" fill="white" fill-opacity="0.9" stroke="#3498db" stroke-width="1"/>
  <text x="400" y="480" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">Repaired DNA - Cross-link Resolved</text>
  
  <!-- Final repair arrow -->
  <path d="M 590,260 Q 590,350 590,430" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  
  <!-- Biological process label -->
  <rect x="180" y="70" width="440" height="35" rx="15" ry="15" fill="#e67e22" opacity="0.8"/>
  <text x="400" y="93" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">Protein-DNA Covalent Cross-linking Repair (GO:0106300)</text>
  
  <!-- Title -->
  <rect x="125" y="560" width="550" height="35" rx="5" ry="5" fill="#2c3e50" opacity="0.8"/>
  <text x="400" y="583" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">Resolution of Protein-DNA Cross-links by HMCES, BRIP1/FANCJ and SPRTN</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>