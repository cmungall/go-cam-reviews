<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="300" rx="250" ry="180" fill="#e6f2ff" stroke="#333" stroke-width="2"/>
  <text x="400" y="150" font-family="Arial" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">Nucleus</text>
  
  <!-- Chromatin region -->
  <ellipse cx="400" cy="320" rx="180" ry="120" fill="#f0f7ff" stroke="#6684a3" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="230" font-family="Arial" font-size="18" text-anchor="middle" fill="#6684a3" font-weight="bold">Chromatin</text>
  
  <!-- Legend -->
  <rect x="580" y="80" width="210" height="140" fill="white" stroke="#333" stroke-width="1" rx="5" ry="5"/>
  <text x="685" y="100" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  <rect x="600" y="115" width="20" height="20" fill="#e69500" rx="3" ry="3"/>
  <text x="630" y="130" font-family="Arial" font-size="14" text-anchor="start">VDR</text>
  <rect x="600" y="145" width="20" height="20" fill="#9370db" rx="3" ry="3"/>
  <text x="630" y="160" font-family="Arial" font-size="14" text-anchor="start">NCOA3</text>
  <rect x="600" y="175" width="20" height="20" fill="#3cb371" rx="3" ry="3"/>
  <text x="630" y="190" font-family="Arial" font-size="14" text-anchor="start">UBR5</text>
  <circle cx="610" cy="205" r="8" fill="#ffcc00"/>
  <text x="630" y="210" font-family="Arial" font-size="14" text-anchor="start">Calcitriol</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">UBR5-mediated Ubiquitination of Ligand-bound VDR</text>
  <text x="400" y="65" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">When VDR is not associated with Nuclear receptor coactivators (NCOAs)</text>
  
  <!-- VDR with Calcitriol -->
  <rect x="300" y="320" width="60" height="30" fill="#e69500" rx="5" ry="5" stroke="#333" stroke-width="1"/>
  <text x="330" y="340" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">VDR</text>
  <circle cx="310" cy="310" r="12" fill="#ffcc00" stroke="#333" stroke-width="1"/>
  <text x="310" y="315" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">D</text>
  <line x1="310" y1="322" x2="310" y2="320" stroke="#333" stroke-width="2"/>
  
  <!-- UBR5 -->
  <rect x="450" y="320" width="60" height="30" fill="#3cb371" rx="5" ry="5" stroke="#333" stroke-width="1"/>
  <text x="480" y="340" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">UBR5</text>
  
  <!-- NCOA3 -->
  <rect x="300" y="400" width="60" height="30" fill="#9370db" rx="5" ry="5" stroke="#333" stroke-width="1" opacity="0.5"/>
  <text x="330" y="420" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">NCOA3</text>
  <line x1="330" y1="390" x2="330" y2="400" stroke="#333" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="330" y="385" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Not associated</text>
  
  <!-- Ubiquitination Process -->
  <path d="M 380 335 Q 415 335 430 335" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="405" y="325" font-family="Arial" font-size="14" text-anchor="middle">binds</text>
  
  <!-- Ubiquitination Result -->
  <rect x="530" y="370" width="60" height="30" fill="#e69500" rx="5" ry="5" stroke="#333" stroke-width="1" opacity="0.8"/>
  <text x="560" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">VDR</text>
  <circle cx="540" cy="360" r="12" fill="#ffcc00" stroke="#333" stroke-width="1"/>
  <text x="540" y="365" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">D</text>
  
  <!-- Ubiquitin Tags -->
  <circle cx="550" cy="350" r="8" fill="#ff6666" stroke="#333" stroke-width="1"/>
  <text x="550" y="354" font-family="Arial" font-size="10" text-anchor="middle" fill="white" font-weight="bold">Ub</text>
  <circle cx="570" cy="355" r="8" fill="#ff6666" stroke="#333" stroke-width="1"/>
  <text x="570" y="359" font-family="Arial" font-size="10" text-anchor="middle" fill="white" font-weight="bold">Ub</text>
  <circle cx="560" cy="340" r="8" fill="#ff6666" stroke="#333" stroke-width="1"/>
  <text x="560" y="344" font-family="Arial" font-size="10" text-anchor="middle" fill="white" font-weight="bold">Ub</text>
  
  <path d="M 510 335 Q 535 350 540 360" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="335" font-family="Arial" font-size="14" text-anchor="middle">Ubiquitinates</text>
  
  <!-- Degradation pathway -->
  <path d="M 560 400 Q 560 430 560 450" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="625" y="430" font-family="Arial" font-size="14" text-anchor="start">Targeted for degradation</text>
  <text x="625" y="450" font-family="Arial" font-size="14" text-anchor="start">(Nuclear protein quality control)</text>
  
  <!-- Process description -->
  <rect x="20" y="80" width="210" height="130" fill="white" stroke="#333" stroke-width="1" rx="5" ry="5" opacity="0.9"/>
  <text x="125" y="100" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Process Summary</text>
  <text x="30" y="125" font-family="Arial" font-size="14" text-anchor="start">• VDR binds calcitriol</text>
  <text x="30" y="150" font-family="Arial" font-size="14" text-anchor="start">• When NCOA3 is not present</text>
  <text x="30" y="175" font-family="Arial" font-size="14" text-anchor="start">• UBR5 ubiquitinates VDR</text>
  <text x="30" y="200" font-family="Arial" font-size="14" text-anchor="start">• VDR targeted for degradation</text>
  
  <!-- Inhibition Arrow -->
  <path d="M 330 395 Q 370 370 400 355" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="395" y1="355" x2="405" y2="355" stroke="#333" stroke-width="6"/>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>