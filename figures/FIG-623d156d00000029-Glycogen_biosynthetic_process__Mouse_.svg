<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f9f9f9"/>
  
  <!-- Cell Outline -->
  <rect x="50" y="50" width="800" height="600" rx="20" ry="20" fill="#e6f7ff" stroke="#2980b9" stroke-width="2"/>
  
  <!-- Cytosol Label -->
  <text x="420" y="80" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Pathway Title -->
  <text x="450" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Glycogen Biosynthetic Process (Mouse)</text>
  
  <!-- Phosphoglucomutase Activities -->
  <rect x="100" y="150" width="140" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#2980b9" stroke-width="2"/>
  <text x="170" y="170" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Pgm1/Pgm2</text>
  <text x="170" y="190" font-family="Arial" font-size="12" text-anchor="middle">Phosphoglucomutase</text>
  <text x="170" y="205" font-family="Arial" font-size="10" text-anchor="middle">(GO:0004614)</text>
  
  <!-- UTP:glucose-1-phosphate uridylyltransferase -->
  <rect x="340" y="150" width="140" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#2980b9" stroke-width="2"/>
  <text x="410" y="170" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Ugp2</text>
  <text x="410" y="190" font-family="Arial" font-size="12" text-anchor="middle">UTP:glucose-1-P</text>
  <text x="410" y="205" font-family="Arial" font-size="10" text-anchor="middle">(GO:0003983)</text>
  
  <!-- Glycogenin -->
  <rect x="580" y="150" width="140" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#2980b9" stroke-width="2"/>
  <text x="650" y="170" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Gyg1</text>
  <text x="650" y="190" font-family="Arial" font-size="12" text-anchor="middle">Glycogenin</text>
  <text x="650" y="205" font-family="Arial" font-size="10" text-anchor="middle">(GO:0008466)</text>
  
  <!-- Glycogen synthase -->
  <rect x="460" y="300" width="140" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#2980b9" stroke-width="2"/>
  <text x="530" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Gys1/Gys2</text>
  <text x="530" y="340" font-family="Arial" font-size="12" text-anchor="middle">Glycogen synthase</text>
  <text x="530" y="355" font-family="Arial" font-size="10" text-anchor="middle">(GO:0004373)</text>
  
  <!-- Branching enzyme -->
  <rect x="460" y="450" width="140" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#2980b9" stroke-width="2"/>
  <text x="530" y="470" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Gbe1</text>
  <text x="530" y="490" font-family="Arial" font-size="12" text-anchor="middle">Branching enzyme</text>
  <text x="530" y="505" font-family="Arial" font-size="10" text-anchor="middle">(GO:0003844)</text>
  
  <!-- PP1 regulatory subunit -->
  <rect x="700" y="300" width="140" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#2980b9" stroke-width="2"/>
  <text x="770" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Ppp1r3c</text>
  <text x="770" y="340" font-family="Arial" font-size="12" text-anchor="middle">Adaptor activity</text>
  <text x="770" y="355" font-family="Arial" font-size="10" text-anchor="middle">(GO:0060090)</text>
  
  <!-- Laforin -->
  <rect x="220" y="450" width="140" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#2980b9" stroke-width="2"/>
  <text x="290" y="470" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Epm2a</text>
  <text x="290" y="490" font-family="Arial" font-size="12" text-anchor="middle">Carbohydrate phosphatase</text>
  <text x="290" y="505" font-family="Arial" font-size="10" text-anchor="middle">(GO:0019203)</text>
  
  <!-- Malin -->
  <rect x="220" y="550" width="140" height="60" rx="10" ry="10" fill="#b3e0ff" stroke="#2980b9" stroke-width="2"/>
  <text x="290" y="570" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Nhlrc1</text>
  <text x="290" y="590" font-family="Arial" font-size="12" text-anchor="middle">Ubiquitin transferase</text>
  <text x="290" y="605" font-family="Arial" font-size="10" text-anchor="middle">(GO:0004842)</text>
  
  <!-- Glycogen molecule representation -->
  <circle cx="530" y="580" r="50" fill="#ffe6cc" stroke="#e67e22" stroke-width="2"/>
  <text x="530" y="585" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Glycogen</text>
  
  <!-- Connection arrows -->
  <!-- PGM to UGP2 -->
  <line x1="240" y1="180" x2="340" y2="180" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- UGP2 to Glycogenin -->
  <line x1="480" y1="180" x2="580" y2="180" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Glycogenin to GYS -->
  <path d="M 650,210 Q 650,260 530,300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Regulation of GYS by PP1R3C -->
  <path d="M 700,330 Q 650,330 600,330" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- GYS to GBE1 -->
  <line x1="530" y1="360" x2="530" y2="450" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- GBE1 to Glycogen -->
  <line x1="530" y1="510" x2="530" y2="530" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- EPM2A to GYS (regulatory) -->
  <path d="M 290,450 Q 390,400 460,330" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- EPM2A to NHLRC1 -->
  <line x1="290" y1="510" x2="290" y2="550" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- PP1R3C to EPM2A -->
  <path d="M 770,360 Q 600,410 360,450" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- UGP2 to GYS alternative path -->
  <path d="M 410,210 Q 410,260 460,320" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Molecule labels -->
  <text x="290" y="165" font-family="Arial" font-size="10">Glucose-1-P</text>
  <text x="530" y="165" font-family="Arial" font-size="10">UDP-Glucose</text>
  
  <!-- Process descriptions -->
  <rect x="175" y="220" width="150" height="36" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="250" y="234" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Converts Glucose-6-P</text>
  <text x="250" y="248" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">to Glucose-1-P</text>
  
  <rect x="335" y="220" width="150" height="36" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="410" y="234" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Converts Glucose-1-P</text>
  <text x="410" y="248" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">to UDP-Glucose</text>
  
  <rect x="575" y="220" width="150" height="36" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="650" y="234" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Self-glucosylates to</text>
  <text x="650" y="248" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">form glycogen primer</text>
  
  <rect x="605" y="300" width="90" height="36" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="650" y="320" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Activates</text>
  <text x="650" y="334" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">synthase</text>
  
  <rect x="465" y="370" width="130" height="36" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="530" y="384" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Elongates glycogen</text>
  <text x="530" y="398" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">by α-1,4-linkages</text>
  
  <rect x="465" y="520" width="130" height="36" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="530" y="534" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Adds α-1,6-branches</text>
  <text x="530" y="548" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">to glycogen chain</text>
  
  <rect x="360" y="450" width="90" height="36" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="405" y="470" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Regulates</text>
  <text x="405" y="484" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">glycogen quality</text>
  
  <rect x="70" y="450" width="130" height="36" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="135" y="470" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Controls glycogen</text>
  <text x="135" y="484" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">dephosphorylation</text>
  
  <rect x="70" y="550" width="130" height="36" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="135" y="570" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Ubiquitinates proteins</text>
  <text x="135" y="584" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">for degradation</text>
  
  <!-- Process label -->
  <text x="700" y="620" font-family="Arial" font-size="16" font-weight="bold">GO:0005978</text>
  <text x="700" y="640" font-family="Arial" font-size="14">Glycogen biosynthetic process</text>
  
  <!-- Legend -->
  <rect x="50" y="610" width="20" height="10" fill="#b3e0ff" stroke="#2980b9" stroke-width="1"/>
  <text x="75" y="620" font-family="Arial" font-size="12">Protein</text>
  
  <line x1="120" y1="615" x2="140" y2="615" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="160" y="620" font-family="Arial" font-size="12">Direct effect</text>
  
  <line x1="230" y1="615" x2="250" y2="615" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="270" y="620" font-family="Arial" font-size="12">Regulatory effect</text>
  
  <rect x="330" y="610" width="20" height="10" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
  <text x="380" y="620" font-family="Arial" font-size="12">Process annotation</text>
  
  <!-- Glucose-6-P representation (implicit) -->
  <circle cx="100" y="180" r="15" fill="#f2e6ff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="100" y="184" font-family="Arial" font-size="10" text-anchor="middle">G-6-P</text>
  <line x1="115" y1="180" x2="130" y2="180" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="100" y="205" font-family="Arial" font-size="8" fill="#9b59b6" text-anchor="middle">*implicit</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>