<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline with mitochondrion -->
  <rect x="50" y="50" width="700" height="600" rx="20" ry="20" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  <text x="400" y="80" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Iron-Sulfur Cluster Assembly and Export</text>
  <text x="400" y="105" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Schizosaccharomyces pombe (NCBITaxon:4896)</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="300" cy="330" rx="230" ry="180" fill="#ffdddd" stroke="#cc0000" stroke-width="2"/>
  <text x="300" y="190" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Mitochondrion</text>
  
  <!-- Cytosol label -->
  <text x="610" y="190" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Cytosol</text>
  
  <!-- [2Fe-2S] Cluster Assembly Section -->
  <rect x="150" y="220" width="180" height="160" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="1" stroke-dasharray="5,2" opacity="0.7"/>
  <text x="240" y="235" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">[2Fe-2S] Cluster Assembly</text>
  <text x="240" y="252" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0044571)</text>
  
  <!-- [4Fe-4S] Cluster Assembly Section -->
  <rect x="350" y="220" width="180" height="160" rx="10" ry="10" fill="#e6ffe6" stroke="#009933" stroke-width="1" stroke-dasharray="5,2" opacity="0.7"/>
  <text x="440" y="235" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">[4Fe-4S] Cluster Assembly</text>
  <text x="440" y="252" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0044572)</text>
  
  <!-- Cytosolic Assembly Section -->
  <rect x="550" y="220" width="160" height="160" rx="10" ry="10" fill="#fff2e6" stroke="#ff9933" stroke-width="1" stroke-dasharray="5,2" opacity="0.7"/>
  <text x="630" y="235" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cytosolic Assembly</text>
  <text x="630" y="252" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0016226)</text>
  
  <!-- Inner membrane -->
  <path d="M 150,400 Q 300,430 450,400" stroke="#cc0000" stroke-width="2" fill="none"/>
  <text x="300" y="450" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Mitochondrial Inner Membrane</text>
  
  <!-- [2Fe-2S] Assembly Proteins -->
  <circle cx="170" cy="280" r="20" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="170" y="284" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Nfs1</text>
  
  <circle cx="220" cy="280" r="20" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="220" y="284" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Isd11</text>
  
  <circle cx="170" cy="330" r="20" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="170" y="334" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ACP</text>
  <text x="170" y="346" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">SPAC4H3.09</text>
  
  <circle cx="220" cy="330" r="20" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="220" y="334" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Isu1</text>
  
  <circle cx="270" cy="280" r="20" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="270" y="284" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Fxn1</text>
  
  <circle cx="270" cy="330" r="20" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="270" y="334" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Arh1</text>
  
  <circle cx="310" cy="305" r="20" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="310" y="309" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Etp1</text>
  
  <!-- [4Fe-4S] Assembly Proteins -->
  <circle cx="370" cy="280" r="20" fill="#99cc99" stroke="#009933" stroke-width="1.5"/>
  <text x="370" y="284" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Grx5</text>
  
  <circle cx="420" cy="280" r="20" fill="#99cc99" stroke="#009933" stroke-width="1.5"/>
  <text x="420" y="284" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Isa1</text>
  
  <circle cx="470" cy="280" r="20" fill="#99cc99" stroke="#009933" stroke-width="1.5"/>
  <text x="470" y="284" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Isa2</text>
  
  <circle cx="420" cy="330" r="20" fill="#99cc99" stroke="#009933" stroke-width="1.5"/>
  <text x="420" y="334" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Iba57</text>
  
  <circle cx="470" cy="330" r="20" fill="#99cc99" stroke="#009933" stroke-width="1.5"/>
  <text x="470" y="334" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Nfu1</text>
  
  <!-- Chaperone Proteins -->
  <circle cx="220" cy="380" r="20" fill="#ffcc99" stroke="#ff6600" stroke-width="1.5"/>
  <text x="220" y="384" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Jac1</text>
  
  <circle cx="270" cy="380" r="20" fill="#ffcc99" stroke="#ff6600" stroke-width="1.5"/>
  <text x="270" y="384" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Ssc1</text>
  
  <circle cx="320" cy="380" r="20" fill="#ffcc99" stroke="#ff6600" stroke-width="1.5"/>
  <text x="320" y="384" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Mge1</text>
  
  <!-- Export Protein -->
  <rect x="390" y="390" width="40" height="30" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5"/>
  <text x="410" y="410" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Atm1</text>
  
  <!-- Cytosolic Proteins -->
  <circle cx="570" cy="280" r="20" fill="#ffcc99" stroke="#ff6600" stroke-width="1.5"/>
  <text x="570" y="284" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Nbp35</text>
  
  <circle cx="630" cy="280" r="20" fill="#ffcc99" stroke="#ff6600" stroke-width="1.5"/>
  <text x="630" y="280" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">SPAC806</text>
  <text x="630" y="290" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">.02c</text>
  
  <circle cx="570" cy="330" r="20" fill="#ffcc99" stroke="#ff6600" stroke-width="1.5"/>
  <text x="570" y="334" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Tah18</text>
  
  <circle cx="630" cy="330" r="20" fill="#ffcc99" stroke="#ff6600" stroke-width="1.5"/>
  <text x="630" y="334" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Dre2</text>
  
  <circle cx="670" cy="305" r="20" fill="#ffcc99" stroke="#ff6600" stroke-width="1.5"/>
  <text x="670" y="309" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Nar1</text>
  
  <!-- Iron-sulfur cluster icons -->
  <g transform="translate(250, 305) scale(0.5)">
    <circle cx="0" cy="0" r="15" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="10" cy="10" r="15" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <text x="5" y="7" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">[2Fe-2S]</text>
  </g>
  
  <g transform="translate(420, 305) scale(0.5)">
    <circle cx="-10" cy="-10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="10" cy="-10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="-10" cy="10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="10" cy="10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <text x="0" y="5" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">[4Fe-4S]</text>
  </g>
  
  <g transform="translate(600, 305) scale(0.5)">
    <circle cx="-10" cy="-10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="10" cy="-10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="-10" cy="10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="10" cy="10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <text x="0" y="5" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">[4Fe-4S]</text>
  </g>
  
  <!-- Pathway arrows -->
  <path d="M 190,280 L 200,280" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 190,330 L 200,330" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 240,280 L 250,280" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 240,330 L 250,330" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 290,280 L 310,285" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 290,330 L 310,325" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <path d="M 330,305 L 350,292" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 390,280 L 400,280" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 440,280 L 450,280" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 440,330 L 450,330" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Export path -->
  <path d="M 470,310 C 470,340 440,350 410,380 L 410,390" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="440" y="360" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Cluster Export</text>
  
  <path d="M 430,405 L 490,405 C 520,405 540,350 560,320 C 560,290 560,280 550,280" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="500" y="425" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Mitochondrial Export</text>
  
  <!-- Cytosolic pathway -->
  <path d="M 590,280 L 610,280" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 650,280 L 660,295" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 590,330 L 610,330" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 650,330 L 660,315" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Chaperone interactions -->
  <path d="M 220,360 L 230,380" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 270,360 L 270,380" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 290,380 L 300,380" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- ISA complex indicator -->
  <path d="M 420,300 L 470,300" stroke="#009933" stroke-width="2"/>
  <text x="445" y="297" font-family="Arial" font-size="10" text-anchor="middle">ISA Complex</text>
  
  <!-- CIA complex indicator -->
  <path d="M 585,300 L 655,300" stroke="#ff6600" stroke-width="2"/>
  <text x="620" y="297" font-family="Arial" font-size="10" text-anchor="middle">CIA Complex</text>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="150" y="500" width="500" height="130" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="400" y="520" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="180" cy="540" r="10" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="300" y="545" font-family="Arial" font-size="14" text-anchor="left">[2Fe-2S] Assembly Proteins</text>
  
  <circle cx="180" cy="565" r="10" fill="#99cc99" stroke="#009933" stroke-width="1.5"/>
  <text x="300" y="570" font-family="Arial" font-size="14" text-anchor="left">[4Fe-4S] Assembly Proteins</text>
  
  <circle cx="180" cy="590" r="10" fill="#ffcc99" stroke="#ff6600" stroke-width="1.5"/>
  <text x="300" y="595" font-family="Arial" font-size="14" text-anchor="left">Chaperones and Cytosolic Proteins</text>
  
  <rect x="170" cy="615" width="20" height="15" rx="3" ry="3" fill="#ff9999" stroke="#cc0000" stroke-width="1.5"/>
  <text x="300" y="620" font-family="Arial" font-size="14" text-anchor="left">Iron-Sulfur Cluster Exporter (Atm1)</text>
  
  <line x1="450" y1="540" x2="470" y2="540" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="550" y="545" font-family="Arial" font-size="14" text-anchor="left">Pathway Direction</text>
  
  <line x1="450" y1="565" x2="470" y2="565" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="550" y="570" font-family="Arial" font-size="14" text-anchor="left">Cluster Export</text>
  
  <path d="M 450,590 L 470,590" stroke="#ff6600" stroke-width="2"/>
  <text x="550" y="595" font-family="Arial" font-size="14" text-anchor="left">Protein Complex</text>
  
  <g transform="translate(460, 615) scale(0.4)">
    <circle cx="-10" cy="-10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="10" cy="-10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="-10" cy="10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
    <circle cx="10" cy="10" r="12" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
  </g>
  <text x="550" y="620" font-family="Arial" font-size="14" text-anchor="left">Iron-Sulfur Cluster</text>
</svg>