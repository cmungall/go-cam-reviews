<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline with nucleus -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  <text x="400" y="85" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Regulation of Gluconeogenesis by SIRT6, FOXO1, and KAT2A/GCN5 (Human)</text>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="300" rx="280" ry="220" fill="#e6f3ff" stroke="#333" stroke-width="2"/>
  <text x="400" y="170" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Nucleus (GO:0005634)</text>
  
  <!-- SIRT6 -->
  <rect x="180" y="220" width="90" height="45" rx="10" ry="10" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="225" y="248" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">SIRT6</text>
  
  <!-- SIRT1 -->
  <rect x="180" y="330" width="90" height="45" rx="10" ry="10" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="225" y="358" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">SIRT1</text>
  
  <!-- KAT2A -->
  <rect x="350" y="240" width="90" height="45" rx="10" ry="10" fill="#c2f0c2" stroke="#333" stroke-width="2"/>
  <text x="395" y="268" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">KAT2A</text>
  
  <!-- FOXO1 -->
  <rect x="510" y="290" width="90" height="45" rx="10" ry="10" fill="#b3d9ff" stroke="#333" stroke-width="2"/>
  <text x="555" y="318" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">FOXO1</text>
  
  <!-- PPARGC1A -->
  <rect x="350" y="350" width="90" height="45" rx="10" ry="10" fill="#ffb3b3" stroke="#333" stroke-width="2"/>
  <text x="395" y="378" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">PPARGC1A</text>
  
  <!-- Gluconeogenesis process -->
  <ellipse cx="600" y="400" rx="100" ry="45" fill="#ffffcc" stroke="#333" stroke-width="2"/>
  <text x="600" y="405" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold">Gluconeogenesis</text>
  
  <!-- Arrows and Interactions -->
  <!-- SIRT6 -> KAT2A (negative) -->
  <path d="M 270 242 Q 310 235 350 255" fill="none" stroke="#ff0000" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="315" y="230" font-family="Arial" font-size="14" fill="#ff0000" font-weight="bold">inhibits</text>
  
  <!-- KAT2A -> PPARGC1A (negative) -->
  <path d="M 395 285 Q 395 320 395 350" fill="none" stroke="#ff0000" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="410" y="320" font-family="Arial" font-size="14" fill="#ff0000" font-weight="bold">inhibits</text>
  
  <!-- PPARGC1A -> Gluconeogenesis (positive) -->
  <path d="M 440 372 Q 490 385 520 390" fill="none" stroke="#008800" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="470" y="365" font-family="Arial" font-size="14" fill="#008800" font-weight="bold">activates</text>
  
  <!-- FOXO1 -> Gluconeogenesis (positive) -->
  <path d="M 555 335 Q 575 365 580 380" fill="none" stroke="#008800" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="565" y="360" font-family="Arial" font-size="14" fill="#008800" font-weight="bold">activates</text>
  
  <!-- SIRT1 -> FOXO1 (positive) -->
  <path d="M 270 340 Q 390 320 510 310" fill="none" stroke="#008800" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="370" y="300" font-family="Arial" font-size="14" fill="#008800" font-weight="bold">activates</text>
  
  <!-- SIRT6 -> FOXO1 (negative) -->
  <path d="M 270 230 Q 390 240 510 290" fill="none" stroke="#ff0000" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="380" y="225" font-family="Arial" font-size="14" fill="#ff0000" font-weight="bold">inhibits</text>
  
  <!-- SIRT1 -> PPARGC1A (positive) -->
  <path d="M 270 360 Q 310 385 350 375" fill="none" stroke="#008800" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="300" y="395" font-family="Arial" font-size="14" fill="#008800" font-weight="bold">activates</text>
  
  <!-- Nuclear export by SIRT6 -->
  <path d="M 205 220 Q 180 180 150 180" fill="none" stroke="#0000ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="140" y="160" font-family="Arial" font-size="14" fill="#0000ff" font-weight="bold">promotes</text>
  <text x="140" y="176" font-family="Arial" font-size="14" fill="#0000ff" font-weight="bold">nuclear export</text>
  
  <!-- SIRT1 maintenance of nucleus -->
  <path d="M 180 340 Q 150 315 130 260" fill="none" stroke="#0000ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="100" y="270" font-family="Arial" font-size="14" fill="#0000ff" font-weight="bold">maintains</text>
  <text x="100" y="286" font-family="Arial" font-size="14" fill="#0000ff" font-weight="bold">nuclear location</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="13" markerHeight="13" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff0000"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#008800"/>
    </marker>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0000ff"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="170" width="185" height="120" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="560" y="190" font-family="Arial" font-size="16" font-weight="bold">Legend</text>
  
  <rect x="560" y="200" width="15" height="15" fill="#ffcc99" stroke="#333" stroke-width="1.5"/>
  <text x="580" y="212" font-family="Arial" font-size="14">Sirtuin deacetylases</text>
  
  <rect x="560" y="220" width="15" height="15" fill="#c2f0c2" stroke="#333" stroke-width="1.5"/>
  <text x="580" y="232" font-family="Arial" font-size="14">Acetyltransferase</text>
  
  <rect x="560" y="240" width="15" height="15" fill="#b3d9ff" stroke="#333" stroke-width="1.5"/>
  <text x="580" y="252" font-family="Arial" font-size="14">Transcription factor</text>
  
  <rect x="560" y="260" width="15" height="15" fill="#ffb3b3" stroke="#333" stroke-width="1.5"/>
  <text x="580" y="272" font-family="Arial" font-size="14">Coactivator</text>
  
  <line x1="560" y1="285" x2="575" y2="285" stroke="#ff0000" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="580" y="287" font-family="Arial" font-size="14">Inhibition</text>
  
  <line x1="630" y1="285" x2="645" y2="285" stroke="#008800" stroke-width="3"/>
  <text x="650" y="287" font-family="Arial" font-size="14">Activation</text>
</svg>