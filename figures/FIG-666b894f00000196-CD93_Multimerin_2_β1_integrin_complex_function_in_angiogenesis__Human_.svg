<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with light gradient -->
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="650" fill="url(#bg_gradient)" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">CD93/Multimerin-2/β1 integrin complex function in angiogenesis</text>
  
  <!-- Endothelial cell outline -->
  <path d="M100,150 C100,120 750,120 750,150 L750,450 C750,500 100,500 100,450 Z" fill="#e6f7ff" stroke="#0066cc" stroke-width="2" opacity="0.8" />
  <text x="400" y="490" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Endothelial Cell</text>
  
  <!-- Plasma membrane -->
  <path d="M100,150 C100,120 750,120 750,150" fill="none" stroke="#0066cc" stroke-width="4" />
  <text x="130" y="140" font-family="Arial" font-size="16" fill="#0066cc">Plasma Membrane</text>
  
  <!-- Extracellular space -->
  <rect x="100" y="50" width="650" height="70" fill="#f2f2f2" stroke="#999999" stroke-width="1" stroke-dasharray="5,3" rx="5" ry="5" />
  <text x="130" y="70" font-family="Arial" font-size="16" fill="#666666">Extracellular Space</text>
  
  <!-- MMRN2 protein -->
  <circle cx="400" cy="100" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="400" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">MMRN2</text>
  <text x="400" y="83" font-family="Arial" font-size="11" text-anchor="middle" fill="#333333">Receptor Ligand</text>
  <text x="400" y="125" font-family="Arial" font-size="11" text-anchor="middle" fill="#333333">Activity</text>
  
  <!-- CD93 receptor -->
  <rect x="370" y="150" width="60" height="40" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="5" ry="5" />
  <path d="M400,150 L400,130" fill="none" stroke="#0066cc" stroke-width="2" />
  <circle cx="400" cy="150" r="5" fill="#0066cc" />
  <text x="400" y="175" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">CD93</text>
  <text x="400" y="210" font-family="Arial" font-size="11" text-anchor="middle" fill="#333333">Signaling Receptor Activity</text>
  
  <!-- Beta-1 Integrin -->
  <rect x="500" y="150" width="60" height="40" fill="#99ff99" stroke="#009900" stroke-width="2" rx="5" ry="5" />
  <path d="M500,170 L460,170" fill="none" stroke="#009900" stroke-width="2" />
  <circle cx="500" cy="170" r="5" fill="#009900" />
  <text x="530" y="175" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">ITGB1</text>
  <text x="530" y="210" font-family="Arial" font-size="11" text-anchor="middle" fill="#333333">Coreceptor Activity</text>
  
  <!-- Arrow from MMRN2 to CD93 -->
  <path d="M400,130 L400,150" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Arrow from CD93 to Beta-1 Integrin -->
  <path d="M430,170 L460,170" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Angiogenesis process -->
  <rect x="300" y="300" width="200" height="60" fill="#ffffcc" stroke="#999900" stroke-width="2" rx="10" ry="10" />
  <text x="400" y="335" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Angiogenesis</text>
  
  <!-- Arrows from receptors to angiogenesis -->
  <path d="M400,190 L400,300" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <path d="M530,190 L450,300" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>
  
  <!-- Legend box -->
  <rect x="100" y="520" width="600" height="110" fill="white" stroke="#666666" stroke-width="1" rx="5" ry="5" />
  <text x="130" y="545" font-family="Arial" font-size="18" font-weight="bold">Legend</text>
  
  <!-- Protein shapes legend -->
  <circle cx="140" cy="570" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="160" y="575" font-family="Arial" font-size="14">MMRN2 (Receptor Ligand)</text>
  
  <rect x="300" y="560" width="20" height="20" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="2" ry="2" />
  <text x="330" y="575" font-family="Arial" font-size="14">CD93 (Signaling Receptor)</text>
  
  <rect x="500" y="560" width="20" height="20" fill="#99ff99" stroke="#009900" stroke-width="2" rx="2" ry="2" />
  <text x="530" y="575" font-family="Arial" font-size="14">ITGB1 (Coreceptor)</text>
  
  <!-- Arrow legend -->
  <line x1="140" y1="600" x2="190" y2="600" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="200" y="605" font-family="Arial" font-size="14">Direct causal relationship</text>
  
  <line x1="370" y1="600" x2="420" y2="600" stroke="#333333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <text x="430" y="605" font-family="Arial" font-size="14">Participates in biological process</text>
  
  <rect x="140" y="620" width="20" height="20" fill="#ffffcc" stroke="#999900" stroke-width="2" rx="3" ry="3" />
  <text x="170" y="635" font-family="Arial" font-size="14">Biological Process</text>
  
</svg>