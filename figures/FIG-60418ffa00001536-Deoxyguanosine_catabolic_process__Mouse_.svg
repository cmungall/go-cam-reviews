<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
  
  <!-- Cell compartments -->
  <rect x="100" y="100" width="600" height="200" rx="10" ry="10" fill="#e6f2ff" stroke="#99c2ff" stroke-width="2"/>
  <text x="120" y="130" font-family="Arial" font-size="22" font-weight="bold" fill="#333">Cytosol</text>
  
  <rect x="100" y="340" width="600" height="170" rx="10" ry="10" fill="#fff2e6" stroke="#ffcc99" stroke-width="2"/>
  <text x="120" y="370" font-family="Arial" font-size="22" font-weight="bold" fill="#333">Peroxisome</text>
  
  <!-- Pathway molecules and reactions -->
  <!-- Cytosolic pathway -->
  <circle cx="170" cy="180" r="35" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="170" y="175" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Deoxy-</text>
  <text x="170" y="195" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">guanosine</text>
  
  <line x1="205" y1="180" x2="265" y2="180" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="235" y="165" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Pnp</text>
  <text x="235" y="153" font-family="Arial" font-size="12" font-style="italic" fill="#555">GO:0004731</text>
  
  <circle cx="300" cy="180" r="35" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="300" y="185" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold" fill="#333">Guanine</text>
  
  <line x1="335" y1="180" x2="395" y2="180" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="365" y="165" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Gda</text>
  <text x="365" y="153" font-family="Arial" font-size="12" font-style="italic" fill="#555">GO:0008892</text>
  
  <circle cx="430" cy="180" r="35" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="430" y="185" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold" fill="#333">Xanthine</text>
  
  <line x1="465" y1="180" x2="525" y2="180" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="495" y="165" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Xdh</text>
  <text x="495" y="153" font-family="Arial" font-size="12" font-style="italic" fill="#555">GO:0004854</text>
  
  <circle cx="560" cy="180" r="35" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="560" y="175" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold" fill="#333">Uric</text>
  <text x="560" y="195" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold" fill="#333">acid</text>
  
  <!-- Arrow to peroxisome -->
  <line x1="560" y1="215" x2="560" y2="385" stroke="#666" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="584" y="300" font-family="Arial" font-size="15" fill="#333">Transport to peroxisome</text>
  
  <!-- Peroxisomal pathway -->
  <circle cx="560" cy="430" r="35" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="560" y="425" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold" fill="#333">Uric</text>
  <text x="560" y="445" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold" fill="#333">acid</text>
  
  <line x1="525" y1="430" x2="465" y2="430" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="495" y="415" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Uox</text>
  <text x="495" y="403" font-family="Arial" font-size="12" font-style="italic" fill="#555">GO:0004846</text>
  
  <circle cx="430" cy="430" r="35" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="430" y="435" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold" fill="#333">5-HIU</text>
  
  <line x1="395" y1="430" x2="335" y2="430" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="365" y="415" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Urah</text>
  <text x="365" y="403" font-family="Arial" font-size="12" font-style="italic" fill="#555">GO:0033971</text>
  
  <circle cx="300" cy="430" r="35" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="300" y="435" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold" fill="#333">OHCU</text>
  
  <line x1="265" y1="430" x2="205" y2="430" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="235" y="415" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Urad</text>
  <text x="235" y="403" font-family="Arial" font-size="12" font-style="italic" fill="#555">GO:0051997</text>
  
  <circle cx="170" cy="430" r="35" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="170" y="435" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold" fill="#333">Allantoin</text>
  
  <!-- Descriptions -->
  <text x="350" y="130" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">Purine nucleoside phosphorylase → Guanine deaminase → Xanthine dehydrogenase</text>
  <text x="350" y="370" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">Urate oxidase → Hydroxyisourate hydrolase → OHCU decarboxylase</text>
  
  <!-- Title -->
  <text x="400" y="85" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Deoxyguanosine Catabolic Process (Mouse)</text>
  
  <!-- Caption -->
  <text x="400" y="540" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Part of GO:0006161 - deoxyguanosine catabolic process</text>
  
  <!-- Legend -->
  <rect x="620" y="230" width="20" height="20" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="650" y="245" font-family="Arial" font-size="15" fill="#333">Metabolite</text>
  
  <line x1="620" y1="275" x2="640" y2="275" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="650" y="280" font-family="Arial" font-size="15" fill="#333">Enzymatic reaction</text>
  
  <!-- Metabolite full names -->
  <text x="150" y="250" font-family="Arial" font-size="13" fill="#555">5-HIU: 5-hydroxyisourate</text>
  <text x="300" y="250" font-family="Arial" font-size="13" fill="#555">OHCU: 2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline</text>
  
  <!-- Gene product names -->
  <text x="120" y="270" font-family="Arial" font-size="13" fill="#555">Pnp: Purine nucleoside phosphorylase</text>
  <text x="120" y="290" font-family="Arial" font-size="13" fill="#555">Gda: Guanine deaminase</text>
  <text x="350" y="270" font-family="Arial" font-size="13" fill="#555">Xdh: Xanthine dehydrogenase</text>
  <text x="350" y="290" font-family="Arial" font-size="13" fill="#555">Uox: Urate oxidase</text>
  <text x="580" y="270" font-family="Arial" font-size="13" fill="#555">Urah: Hydroxyisourate hydrolase</text>
  <text x="580" y="290" font-family="Arial" font-size="13" fill="#555">Urad: OHCU decarboxylase</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>