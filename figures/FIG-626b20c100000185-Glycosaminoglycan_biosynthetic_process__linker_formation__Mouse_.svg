<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Golgi Apparatus Background -->
  <rect x="50" y="50" width="700" height="550" rx="20" ry="20" fill="#F8E8D8" stroke="#A67C52" stroke-width="2" opacity="0.8"/>
  <text x="400" y="85" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Golgi Apparatus (GO:0005794)</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Glycosaminoglycan Biosynthetic Process, Linker Formation</text>
  <text x="400" y="50" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Mus musculus (Mouse)</text>
  
  <!-- Legend -->
  <rect x="550" y="100" width="180" height="155" rx="5" ry="5" fill="white" stroke="black" stroke-width="1" opacity="0.9"/>
  <text x="640" y="120" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  <circle cx="570" cy="140" r="10" fill="#6BBA70"/>
  <text x="595" y="145" font-family="Arial" font-size="12">Enzymes</text>
  <rect x="560" y="160" width="20" height="10" fill="#F5D76E"/>
  <text x="605" y="170" font-family="Arial" font-size="12">Substrates</text>
  <line x1="560" y1="190" x2="590" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="615" y="195" font-family="Arial" font-size="12">Reaction flow</text>
  <rect x="560" y="210" width="20" height="10" fill="#A9CCE3" stroke="black"/>
  <text x="615" y="215" font-family="Arial" font-size="12">Transporters</text>
  <line x1="560" y1="230" x2="590" y2="230" stroke="black" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="615" y="235" font-family="Arial" font-size="12">Enzyme-substrate interaction</text>
  
  <!-- Define Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Pathway Components -->
  
  <!-- UDP-Xylose Transport -->
  <rect x="100" y="150" width="100" height="50" rx="5" ry="5" fill="#A9CCE3" stroke="black" stroke-width="1.5"/>
  <text x="150" y="170" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Slc35b4</text>
  <text x="150" y="188" font-family="Arial" font-size="11" text-anchor="middle">UDP-xylose</text>
  <text x="150" y="202" font-family="Arial" font-size="11" text-anchor="middle">transporter</text>
  
  <!-- UDP-D-xylose biosynthetic process -->
  <circle cx="240" y="200" r="35" fill="#6BBA70" stroke="black" stroke-width="1.5"/>
  <text x="240" y="190" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Uxs1</text>
  <text x="240" y="205" font-family="Arial" font-size="10" text-anchor="middle">UDP-glucuronate</text>
  <text x="240" y="218" font-family="Arial" font-size="10" text-anchor="middle">decarboxylase</text>
  <text x="240" y="245" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0048040</text>
  
  <!-- Xylosyltransferases -->
  <circle cx="320" y="150" r="35" fill="#6BBA70" stroke="black" stroke-width="1.5"/>
  <text x="320" y="140" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Xylt1</text>
  <text x="320" y="155" font-family="Arial" font-size="10" text-anchor="middle">xylosyltransferase</text>
  <text x="320" y="168" font-family="Arial" font-size="8" text-anchor="middle">transfers xylose to serine</text>
  <text x="320" y="180" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0030158</text>
  
  <circle cx="320" y="250" r="35" fill="#6BBA70" stroke="black" stroke-width="1.5"/>
  <text x="320" y="240" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Xylt2</text>
  <text x="320" y="255" font-family="Arial" font-size="10" text-anchor="middle">xylosyltransferase</text>
  <text x="320" y="268" font-family="Arial" font-size="8" text-anchor="middle">transfers xylose to serine</text>
  <text x="320" y="280" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0030158</text>
  
  <!-- Galactosyltransferase -->
  <circle cx="420" y="200" r="35" fill="#6BBA70" stroke="black" stroke-width="1.5"/>
  <text x="420" y="190" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">B4galt7</text>
  <text x="420" y="205" font-family="Arial" font-size="10" text-anchor="middle">galactosyltransferase</text>
  <text x="420" y="218" font-family="Arial" font-size="8" text-anchor="middle">adds first galactose</text>
  <text x="420" y="230" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0046525</text>
  
  <!-- Second Galactosyltransferase -->
  <circle cx="520" y="200" r="35" fill="#6BBA70" stroke="black" stroke-width="1.5"/>
  <text x="520" y="190" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">B3galt6</text>
  <text x="520" y="205" font-family="Arial" font-size="10" text-anchor="middle">galactosyltransferase</text>
  <text x="520" y="218" font-family="Arial" font-size="8" text-anchor="middle">adds second galactose</text>
  <text x="520" y="230" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0047220</text>
  
  <!-- Glucuronosyltransferases -->
  <circle cx="620" y="150" r="35" fill="#6BBA70" stroke="black" stroke-width="1.5"/>
  <text x="620" y="140" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">B3gat1</text>
  <text x="620" y="155" font-family="Arial" font-size="10" text-anchor="middle">glucuronosyltransferase</text>
  <text x="620" y="168" font-family="Arial" font-size="8" text-anchor="middle">adds glucuronic acid</text>
  <text x="620" y="180" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0015018</text>
  
  <circle cx="620" y="250" r="35" fill="#6BBA70" stroke="black" stroke-width="1.5"/>
  <text x="620" y="240" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">B3gat2</text>
  <text x="620" y="255" font-family="Arial" font-size="10" text-anchor="middle">glucuronosyltransferase</text>
  <text x="620" y="268" font-family="Arial" font-size="8" text-anchor="middle">adds glucuronic acid</text>
  <text x="620" y="280" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0015018</text>
  
  <circle cx="620" y="350" r="35" fill="#6BBA70" stroke="black" stroke-width="1.5"/>
  <text x="620" y="340" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">B3gat3</text>
  <text x="620" y="355" font-family="Arial" font-size="10" text-anchor="middle">glucuronosyltransferase</text>
  <text x="620" y="368" font-family="Arial" font-size="8" text-anchor="middle">adds glucuronic acid</text>
  <text x="620" y="380" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0015018</text>
  
  <!-- Step Labels -->
  <text x="240" y="150" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Step 1: UDP-xylose</text>
  <text x="240" y="165" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">synthesis</text>
  
  <text x="320" y="110" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Step 2: Xylosylation</text>
  
  <text x="420" y="150" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Step 3: First</text>
  <text x="420" y="165" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Galactosylation</text>
  
  <text x="520" y="150" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Step 4: Second</text>
  <text x="520" y="165" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Galactosylation</text>
  
  <text x="680" y="250" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Step 5:</text>
  <text x="680" y="265" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Glucuronylation</text>
  
  <!-- Substrate progression -->
  <rect x="350" y="420" width="90" height="40" rx="5" ry="5" fill="#F5D76E" stroke="black" stroke-width="1"/>
  <text x="395" y="435" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Core protein</text>
  <text x="395" y="450" font-family="Arial" font-size="9" text-anchor="middle">Ser-Gly/Ser-Ala site</text>
  
  <rect x="350" y="490" width="90" height="40" rx="5" ry="5" fill="#F5D76E" stroke="black" stroke-width="1"/>
  <text x="395" y="505" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Xylosylated</text>
  <text x="395" y="520" font-family="Arial" font-size="11" text-anchor="middle">protein</text>
  
  <rect x="450" y="490" width="90" height="40" rx="5" ry="5" fill="#F5D76E" stroke="black" stroke-width="1"/>
  <text x="495" y="505" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Galactosylated</text>
  <text x="495" y="520" font-family="Arial" font-size="11" text-anchor="middle">protein</text>
  
  <rect x="550" y="490" width="90" height="40" rx="5" ry="5" fill="#F5D76E" stroke="black" stroke-width="1"/>
  <text x="595" y="505" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Digalactosylated</text>
  <text x="595" y="520" font-family="Arial" font-size="11" text-anchor="middle">protein</text>
  
  <rect x="650" y="490" width="90" height="40" rx="5" ry="5" fill="#F5D76E" stroke="black" stroke-width="1"/>
  <text x="695" y="505" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Glucuronosylated</text>
  <text x="695" y="520" font-family="Arial" font-size="11" text-anchor="middle">protein</text>
  
  <!-- Process label -->
  <rect x="150" y="550" width="500" height="40" rx="10" ry="10" fill="#E8F8F5" stroke="#138D75" stroke-width="2"/>
  <text x="400" y="575" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Glycosaminoglycan Biosynthetic Process (GO:0006024)</text>
  
  <!-- Connecting pathways -->
  <!-- UDP-Xylose transport to Xylt1/2 -->
  <line x1="200" y1="175" x2="285" y2="150" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="175" x2="290" y2="160" stroke="#999999" stroke-width="1" marker-end="url(#arrowhead)" opacity="0.4"/>
  <text x="220" y="125" font-family="Arial" font-size="9" text-anchor="middle">UDP-xylose</text>

  <line x1="200" y1="200" x2="260" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="230" y="190" font-family="Arial" font-size="9" text-anchor="middle">UDP-glucuronate</text>
  
  <line x1="200" y1="225" x2="285" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="225" x2="290" y2="240" stroke="#999999" stroke-width="1" marker-end="url(#arrowhead)" opacity="0.4"/>
  <text x="220" y="260" font-family="Arial" font-size="9" text-anchor="middle">UDP-xylose</text>
  
  <!-- Xylt1/2 to B4galt7 -->
  <line x1="355" y1="150" x2="385" y2="185" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="355" y1="250" x2="385" y2="215" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- B4galt7 to B3galt6 -->
  <line x1="455" y1="200" x2="485" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- B3galt6 to glucuronosyltransferases -->
  <line x1="555" y1="185" x2="585" y2="160" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="555" y1="200" x2="585" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="555" y1="215" x2="585" y2="350" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Substrate progression -->
  <line x1="395" y1="460" x2="395" y2="490" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="510" x2="450" y2="510" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="510" x2="550" y2="510" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="510" x2="650" y2="510" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Connections from enzymes to substrates -->
  <line x1="320" y1="185" x2="395" y2="420" stroke="black" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="325" y="300" font-family="Arial" font-size="9" text-anchor="middle" transform="rotate(70, 325, 300)">transfers xylose</text>
  
  <line x1="420" y1="235" x2="420" y2="490" stroke="black" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="430" y="350" font-family="Arial" font-size="9" text-anchor="middle" transform="rotate(90, 430, 350)">adds first galactose</text>
  
  <line x1="520" y1="235" x2="520" y2="490" stroke="black" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="530" y="350" font-family="Arial" font-size="9" text-anchor="middle" transform="rotate(90, 530, 350)">adds second galactose</text>
  
  <line x1="620" y1="185" x2="695" y2="490" stroke="black" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="640" y="380" font-family="Arial" font-size="9" text-anchor="middle" transform="rotate(75, 640, 380)">adds glucuronic acid</text>
</svg>