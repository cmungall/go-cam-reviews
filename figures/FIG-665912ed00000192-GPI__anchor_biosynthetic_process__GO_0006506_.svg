<svg width="960" height="750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: ER membrane -->
  <rect x="50" y="150" width="860" height="200" fill="#f5f5dc" stroke="#aaa" stroke-width="2" rx="15" ry="15"/>
  <rect x="50" y="250" width="860" height="100" fill="#ddd" stroke="#aaa" stroke-width="2"/>
  <text x="70" y="180" font-family="Arial" font-size="18" font-weight="bold">ER Lumen</text>
  <text x="70" y="320" font-family="Arial" font-size="18" font-weight="bold">Cytoplasm</text>

  <!-- Title -->
  <text x="480" y="80" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">GPI Anchor Biosynthetic Process in S. pombe</text>
  <text x="480" y="110" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle">GO:0006506</text>

  <!-- Step 1: Phosphatidylinositol Synthesis -->
  <circle cx="150" cy="230" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="233" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">pis1</text>
  <text x="150" y="195" font-family="Arial" font-size="12" text-anchor="middle">PI Synthesis</text>
  <path d="M175 230 L215 230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: First GnT Addition -->
  <rect x="220" y="210" width="70" height="40" fill="#ffbf80" stroke="#333" stroke-width="1.5" rx="5" ry="5"/>
  <text x="255" y="230" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">GPI-GnT</text>
  <text x="255" y="245" font-family="Arial" font-size="10" text-anchor="middle">gpi1,2,3,15</text>
  
  <path d="M290 230 L330 230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Deacetylation -->
  <circle cx="350" cy="230" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="233" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">gpi12</text>
  <text x="350" y="195" font-family="Arial" font-size="11" text-anchor="middle">Deacetylase</text>
  <path d="M375 230 L415 230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Acylation -->
  <circle cx="435" cy="230" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="435" y="233" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">gwt1</text>
  <text x="435" y="195" font-family="Arial" font-size="11" text-anchor="middle">Acyltransferase</text>
  <path d="M460 230 L500 230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: Mannose Addition 1 -->
  <circle cx="520" cy="230" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="233" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">gpi14</text>
  <text x="520" y="195" font-family="Arial" font-size="11" text-anchor="middle">α-Mannosyltransferase</text>
  <path d="M545 230 L585 230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: Mannose Addition 2 -->
  <circle cx="605" cy="230" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="605" y="233" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">gpi18</text>
  <text x="605" y="195" font-family="Arial" font-size="11" text-anchor="middle">α-Mannosyltransferase</text>
  <path d="M630 230 L670 230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Additional mannose transfer steps -->
  <circle cx="690" cy="230" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="690" y="233" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">its8</text>
  <text x="690" y="195" font-family="Arial" font-size="11" text-anchor="middle">Mannosyltransferase</text>
  <path d="M715 230 L735 230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <circle cx="755" cy="230" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="755" y="233" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">gpi10</text>
  <text x="755" y="195" font-family="Arial" font-size="11" text-anchor="middle">Mannosyltransferase</text>
  <path d="M780 230 L800 230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <circle cx="820" cy="230" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="820" y="233" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">smp3</text>
  <text x="820" y="195" font-family="Arial" font-size="11" text-anchor="middle">Mannosyltransferase</text>
  <path d="M820 255 L820 280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Ethanolamine Phosphate Addition -->
  <circle cx="310" cy="300" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="310" y="303" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">gpi7</text>
  <text x="310" y="325" font-family="Arial" font-size="11" text-anchor="middle">EtN-P transferase</text>
  <path d="M335 300 L375 300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <circle cx="400" cy="300" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="303" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">gpi13</text>
  <text x="400" y="325" font-family="Arial" font-size="11" text-anchor="middle">EtN-P transferase</text>
  <path d="M425 300 L465 300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- GPI Lipid Remodeling -->
  <circle cx="490" cy="300" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="490" y="303" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">bst1</text>
  <text x="490" y="325" font-family="Arial" font-size="11" text-anchor="middle">PI deacylase</text>
  <path d="M515 300 L555 300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <circle cx="580" cy="300" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="580" y="303" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">gup1</text>
  <text x="580" y="325" font-family="Arial" font-size="11" text-anchor="middle">O-acyltransferase</text>
  <path d="M605 300 L645 300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Final remodeling -->
  <circle cx="670" cy="300" r="25" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="670" y="303" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">cwh43</text>
  <text x="670" y="325" font-family="Arial" font-size="11" text-anchor="middle">GPI remodeling</text>
  <path d="M695 300 L735 300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- GPI Transfer to Protein -->
  <rect x="740" y="270" width="90" height="60" fill="#ffbf80" stroke="#333" stroke-width="1.5" rx="5" ry="5"/>
  <text x="785" y="295" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">GPI-Transamidase</text>
  <text x="785" y="310" font-family="Arial" font-size="10" text-anchor="middle">gpi8, gpi16, gab1</text>
  <text x="785" y="322" font-family="Arial" font-size="10" text-anchor="middle">gpi17, gaa1</text>
  
  <!-- Regulators -->
  <circle cx="520" cy="160" r="20" fill="#f2a2e8" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="163" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">pga1</text>
  <path d="M520 180 L520 205" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  
  <circle cx="255" cy="160" r="20" fill="#f2a2e8" stroke="#333" stroke-width="1.5"/>
  <text x="255" y="163" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">pig25</text>
  <path d="M255 180 L255 210" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  
  <circle cx="605" cy="160" r="20" fill="#f2a2e8" stroke="#333" stroke-width="1.5"/>
  <text x="605" y="163" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">pbn1</text>
  <path d="M605 180 L605 205" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  
  <!-- DPM Complex -->
  <rect x="150" y="300" width="100" height="40" fill="#c6e2ff" stroke="#333" stroke-width="1.5" rx="5" ry="5"/>
  <text x="200" y="318" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">DPM Complex</text>
  <text x="200" y="332" font-family="Arial" font-size="10" text-anchor="middle">dpm1, dpm2, dpm3</text>
  <path d="M200 300 L200 260 Q 200 250 210 250 L 220 250" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  
  <!-- Structure of GPI Anchor -->
  <rect x="150" y="400" width="660" height="230" fill="#f9f9f9" stroke="#aaa" stroke-width="1" rx="10" ry="10"/>
  <text x="480" y="425" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">GPI Anchor Structure</text>
  
  <!-- Simplified representation of GPI structure -->
  <circle cx="250" cy="490" r="20" fill="#b3e6b3" stroke="#333" stroke-width="1.5"/>
  <text x="250" y="495" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PI</text>
  
  <line x1="270" y1="490" x2="310" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <circle cx="330" cy="490" r="20" fill="#f9c7c7" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="495" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">GlcN</text>
  
  <line x1="350" y1="490" x2="390" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <circle cx="410" cy="490" r="20" fill="#ffcc99" stroke="#333" stroke-width="1.5"/>
  <text x="410" y="495" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Man</text>
  
  <line x1="430" y1="490" x2="470" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <circle cx="490" cy="490" r="20" fill="#ffcc99" stroke="#333" stroke-width="1.5"/>
  <text x="490" y="495" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Man</text>
  
  <line x1="510" y1="490" x2="550" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <circle cx="570" cy="490" r="20" fill="#ffcc99" stroke="#333" stroke-width="1.5"/>
  <text x="570" y="495" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Man</text>
  
  <line x1="570" y1="470" x2="570" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <circle cx="570" cy="430" r="20" fill="#a6c8ff" stroke="#333" stroke-width="1.5"/>
  <text x="570" y="435" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">EtN-P</text>
  
  <!-- Protein Attachment -->
  <line x1="590" y1="490" x2="630" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="640" y="470" width="80" height="40" fill="#d9d9d9" stroke="#333" stroke-width="1.5" rx="5" ry="5"/>
  <text x="680" y="495" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Protein</text>
  
  <!-- Legend -->
  <rect x="150" y="550" width="660" height="70" fill="none" stroke="#aaa" stroke-width="1"/>
  <text x="165" y="575" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  
  <circle cx="220" cy="575" r="12" fill="#9fd8e6" stroke="#333" stroke-width="1.5"/>
  <text x="255" y="580" font-family="Arial" font-size="14">Enzyme</text>
  
  <rect x="290" y="565" width="24" height="20" fill="#ffbf80" stroke="#333" stroke-width="1.5" rx="3" ry="3"/>
  <text x="345" y="580" font-family="Arial" font-size="14">Enzyme Complex</text>
  
  <circle cx="420" cy="575" r="12" fill="#f2a2e8" stroke="#333" stroke-width="1.5"/>
  <text x="455" y="580" font-family="Arial" font-size="14">Regulator</text>
  
  <rect x="500" y="565" width="24" height="20" fill="#ddd" stroke="#aaa" stroke-width="1.5"/>
  <text x="565" y="580" font-family="Arial" font-size="14">ER Membrane</text>
  
  <rect x="610" y="565" width="24" height="20" fill="#f5f5dc" stroke="#aaa" stroke-width="1.5"/>
  <text x="665" y="580" font-family="Arial" font-size="14">ER Lumen</text>
  
  <!-- Molecules Legend - Fixed spacing to avoid overlap -->
  <text x="165" y="605" font-family="Arial" font-size="16" font-weight="bold">Molecule Legend:</text>
  <circle cx="220" cy="605" r="12" fill="#b3e6b3" stroke="#333" stroke-width="1.5"/>
  <text x="245" y="610" font-family="Arial" font-size="14">Phosphatidylinositol (PI)</text>
  
  <circle cx="410" cy="605" r="12" fill="#f9c7c7" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="610" font-family="Arial" font-size="14">N-Acetylglucosamine (GlcN)</text>
  
  <circle cx="165" cy="630" r="12" fill="#ffcc99" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="635" font-family="Arial" font-size="14">Mannose (Man)</text>
  
  <circle cx="290" cy="630" r="12" fill="#a6c8ff" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="635" font-family="Arial" font-size="14">Ethanolamine Phosphate (EtN-P)</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>