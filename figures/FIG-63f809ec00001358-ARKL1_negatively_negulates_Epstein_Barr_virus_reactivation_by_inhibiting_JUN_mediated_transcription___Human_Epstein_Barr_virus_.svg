<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="320" rx="350" ry="250" fill="#f0f0f0" stroke="#888" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="320" rx="250" ry="180" fill="#e6eeff" stroke="#666" stroke-width="2"/>
  
  <!-- Chromatin -->
  <path d="M250,300 C280,270 320,290 350,280 C380,270 410,290 440,280 C470,270 510,290 540,300" 
        fill="none" stroke="#9370DB" stroke-width="10" opacity="0.7"/>
  <text x="320" y="250" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Chromatin (GO:0000785)</text>
  
  <!-- Proteins and interactions -->
  <!-- CSNK2B -->
  <rect x="230" y="300" width="100" height="40" rx="5" fill="#AED6F1" stroke="#3498DB" stroke-width="2"/>
  <text x="240" y="325" font-family="Arial" font-size="14" font-weight="bold" fill="#000">CSNK2B</text>
  
  <!-- ARK2N -->
  <rect x="350" y="370" width="100" height="40" rx="5" fill="#F5CBA7" stroke="#E67E22" stroke-width="2"/>
  <text x="370" y="395" font-family="Arial" font-size="14" font-weight="bold" fill="#000">ARK2N</text>
  
  <!-- JUN -->
  <rect x="470" y="300" width="100" height="40" rx="5" fill="#ABEBC6" stroke="#27AE60" stroke-width="2"/>
  <text x="505" y="325" font-family="Arial" font-size="14" font-weight="bold" fill="#000">JUN</text>
  
  <!-- BZLF1 (EBV) -->
  <rect x="590" y="230" width="100" height="40" rx="5" fill="#D7BDE2" stroke="#8E44AD" stroke-width="2"/>
  <text x="615" y="255" font-family="Arial" font-size="14" font-weight="bold" fill="#000">BZLF1</text>
  
  <!-- Interaction arrows -->
  <!-- CSNK2B to ARK2N -->
  <path d="M330,320 C340,345 340,370 350,380" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="300" y="355" font-family="Arial" font-size="12" font-weight="bold" fill="#000">facilitates</text>
  
  <!-- ARK2N to JUN -->
  <path d="M450,370 C460,340 460,320 470,320" fill="none" stroke="#FF0000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="435" y="340" font-family="Arial" font-size="12" font-weight="bold" fill="#000">inhibits</text>
  
  <!-- JUN to BZLF1 -->
  <path d="M570,300 C580,270 580,250 590,250" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="555" y="270" font-family="Arial" font-size="12" font-weight="bold" fill="#000">activates</text>
  
  <!-- Viral latency and reactivation -->
  <path d="M690,230 C710,210 730,200 750,200" fill="none" stroke="#8E44AD" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="650" y="170" width="150" height="40" rx="5" fill="#f0f0f080" stroke="#8E44AD" stroke-width="1"/>
  <text x="660" y="190" font-family="Arial" font-size="14" font-weight="bold" fill="#000">EBV Reactivation</text>
  <text x="660" y="205" font-family="Arial" font-size="12" fill="#000">(GO:0019046)</text>
  
  <!-- Annotations -->
  <text x="225" y="285" font-family="Arial" font-size="10" fill="#000" font-style="italic">Adaptor protein</text>
  <text x="350" y="360" font-family="Arial" font-size="10" fill="#000" font-style="italic">Transcription corepressor</text>
  <text x="470" y="290" font-family="Arial" font-size="10" fill="#000" font-style="italic">Transcription factor</text>
  <text x="590" y="220" font-family="Arial" font-size="10" fill="#000" font-style="italic">EBV protein</text>
  
  <!-- Legend for function types -->
  <rect x="70" y="460" width="660" height="120" rx="10" fill="#ffffff" stroke="#888" stroke-width="1" opacity="0.9"/>
  <text x="100" y="480" font-family="Arial" font-weight="bold" font-size="16" fill="#000">Legend:</text>
  
  <rect x="100" y="490" width="20" height="10" fill="#AED6F1" stroke="#3498DB" stroke-width="1"/>
  <text x="130" y="500" font-family="Arial" font-size="14" fill="#000">CSNK2B (P67870): Protein-macromolecule adaptor activity (GO:0030674)</text>
  
  <rect x="100" y="510" width="20" height="10" fill="#F5CBA7" stroke="#E67E22" stroke-width="1"/>
  <text x="130" y="520" font-family="Arial" font-size="14" fill="#000">ARK2N (Q96B23): Transcription corepressor activity (GO:0003714)</text>
  
  <rect x="100" y="530" width="20" height="10" fill="#ABEBC6" stroke="#27AE60" stroke-width="1"/>
  <text x="130" y="540" font-family="Arial" font-size="14" fill="#000">JUN (P05412): DNA-binding transcription factor activity (GO:0003700)</text>
  
  <rect x="100" y="550" width="20" height="10" fill="#D7BDE2" stroke="#8E44AD" stroke-width="1"/>
  <text x="130" y="560" font-family="Arial" font-size="14" fill="#000">BZLF1 (P03206): DNA-binding transcription factor activity (GO:0003700)</text>
  
  <!-- Process annotations -->
  <text x="400" y="430" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">Negative regulation of viral life cycle (GO:1903901)</text>
  
  <!-- Title -->
  <rect x="50" y="20" width="700" height="80" rx="10" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="400" y="50" font-family="Arial" font-weight="bold" font-size="22" text-anchor="middle" fill="#000">
    ARKL1 negatively regulates Epstein-Barr virus reactivation
  </text>
  <text x="400" y="80" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic" fill="#000">
    by inhibiting JUN-mediated transcription
  </text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>