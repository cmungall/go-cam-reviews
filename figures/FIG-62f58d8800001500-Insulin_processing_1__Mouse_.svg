<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#666" stroke-width="3"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Pancreatic β Cell</text>
  
  <!-- ER compartment -->
  <path d="M200,150 Q300,100 400,150 Q500,200 600,150 Q650,200 600,250 Q500,300 400,250 Q300,200 200,250 Q150,200 200,150" 
        fill="#dae8fc" stroke="#6c8ebf" stroke-width="3"/>
  <text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Endoplasmic Reticulum Lumen</text>
  
  <!-- Golgi apparatus -->
  <path d="M260,350 Q350,300 440,350 Q530,400 440,450 Q350,400 260,450 Q210,400 260,350" 
        fill="#fff2cc" stroke="#d6b656" stroke-width="3"/>
  <text x="350" y="380" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Golgi</text>
  
  <!-- Secretory granules -->
  <circle cx="600" cy="400" r="70" fill="#f8cecc" stroke="#b85450" stroke-width="3"/>
  <text x="600" y="400" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Secretory</text>
  <text x="600" y="425" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Granule</text>
  
  <!-- ER Proteins -->
  <circle cx="250" cy="180" r="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="250" y="185" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">ERO1B</text>
  
  <circle cx="320" cy="200" r="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="320" y="205" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">P4HB</text>
  
  <circle cx="390" cy="180" r="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="390" y="185" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">HSP90B1</text>
  
  <circle cx="460" cy="200" r="22" fill="#e1d5e7" stroke="#9673a6" stroke-width="2.5"/>
  <text x="460" y="205" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">INS2</text>
  
  <!-- Golgi Proteins -->
  <circle cx="330" cy="350" r="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="330" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">SLC30A5</text>
  <text x="330" y="335" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Zn2+ transport</text>
  
  <!-- Secretory Granule Proteins -->
  <circle cx="550" cy="380" r="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="550" y="385" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">PCSK1</text>
  
  <circle cx="590" cy="430" r="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="590" y="435" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">PCSK2</text>
  
  <circle cx="640" cy="390" r="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">CPE</text>
  
  <circle cx="620" cy="350" r="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="620" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">SLC30A8</text>
  <text x="620" y="330" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Zn2+ transport</text>
  
  <!-- Additional transporter -->
  <circle cx="520" cy="480" r="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="520" y="485" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">SLC30A3</text>
  <text x="520" y="505" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Zn2+ transport</text>
  
  <!-- Membrane boundaries -->
  <path d="M200,150 Q300,100 400,150 Q500,200 600,150" fill="none" stroke="#6c8ebf" stroke-width="3" stroke-dasharray="5,3"/>
  <path d="M260,350 Q350,300 440,350" fill="none" stroke="#d6b656" stroke-width="3" stroke-dasharray="5,3"/>
  
  <!-- Arrows and interactions -->
  <!-- ER protein interactions: Disulfide bond formation pathway -->
  <line x1="270" y1="180" x2="300" y2="195" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="285" y="170" font-family="Arial" font-size="10">disulfide</text>
  <text x="285" y="182" font-family="Arial" font-size="10">oxidoreductase</text>
  
  <line x1="340" y1="200" x2="370" y2="190" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="355" y="180" font-family="Arial" font-size="10">protein folding</text>
  
  <line x1="410" y1="180" x2="438" y2="195" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="425" y="170" font-family="Arial" font-size="10">chaperone</text>
  
  <!-- Transport from ER to Golgi -->
  <path d="M460,220 Q410,270 370,320" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="280" font-family="Arial" font-size="11" font-style="italic">ER to Golgi</text>
  <text x="400" y="293" font-family="Arial" font-size="11" font-style="italic">transport</text>
  
  <!-- Zinc transport in Golgi -->
  <path d="M350,350 Q400,350 450,365" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="395" y="340" font-family="Arial" font-size="10" fill="#555">Zn2+</text>
  
  <!-- Transport from Golgi to Secretory Granule -->
  <path d="M400,380 Q480,400 530,380" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="465" y="375" font-family="Arial" font-size="11" font-style="italic">to secretory</text>
  <text x="465" y="388" font-family="Arial" font-size="11" font-style="italic">granule</text>
  
  <!-- Processing in Secretory Granule -->
  <path d="M550,400 Q570,415 590,410" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="570" y="425" font-family="Arial" font-size="10">endopeptidase</text>
  
  <path d="M610,430 Q625,410 640,410" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="625" y="435" font-family="Arial" font-size="10">carboxypeptidase</text>
  
  <!-- SLC30A8 zinc transport -->
  <path d="M620,370 Q610,390 600,390" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="580" y="370" font-family="Arial" font-size="10" fill="#555">Zn2+</text>
  
  <!-- SLC30A3 interaction -->
  <path d="M520,460 Q540,440 570,430" stroke="#000" stroke-width="2.5" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="530" y="450" font-family="Arial" font-size="10" fill="#555">Zn2+</text>
  
  <!-- Zinc ion symbols -->
  <circle cx="580" cy="380" r="4" fill="#4a86e8" stroke="none"/>
  <circle cx="590" cy="385" r="4" fill="#4a86e8" stroke="none"/>
  <circle cx="600" cy="375" r="4" fill="#4a86e8" stroke="none"/>
  
  <!-- Process annotations -->
  <text x="200" y="120" font-family="Arial" font-size="12" font-style="italic">1. Disulfide bond formation</text>
  <text x="440" y="320" font-family="Arial" font-size="12" font-style="italic">2. Zinc loading</text>
  <text x="550" y="320" font-family="Arial" font-size="12" font-style="italic">3. Proteolytic processing</text>
  
  <!-- Secretion indication -->
  <path d="M650,430 Q700,450 730,430" stroke="#000" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="700" y="470" font-family="Arial" font-size="12" font-style="italic">Mature insulin</text>
  <text x="700" y="485" font-family="Arial" font-size="12" font-style="italic">secretion</text>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="480" width="220" height="100" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="60" y="500" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  <circle cx="70" cy="520" r="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="85" y="525" font-family="Arial" font-size="12">Gene products</text>
  <circle cx="70" cy="540" r="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="85" y="545" font-family="Arial" font-size="12">Insulin (INS2)</text>
  <line x1="60" y1="560" x2="80" y2="560" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="85" y="565" font-family="Arial" font-size="12">Implicit interaction</text>
  <circle cx="70" cy="580" r="4" fill="#4a86e8" stroke="none"/>
  <text x="85" y="585" font-family="Arial" font-size="12">Zinc ions</text>
</svg>