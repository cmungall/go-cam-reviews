<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <path d="M 50,150 C 50,50 750,50 750,150 C 750,450 50,450 50,150 Z" fill="#f8f8f8" stroke="#333" stroke-width="3"/>
  
  <!-- Endoplasmic reticulum -->
  <path d="M 150,200 C 150,180 650,180 650,200 C 650,300 150,300 150,200 Z" fill="#f0f9ff" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="320" y="303" width="160" height="25" fill="white" opacity="0.8" rx="5" ry="5"/>
  <text x="400" y="320" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#0066cc">Endoplasmic Reticulum (ER)</text>
  
  <!-- Cytoplasm label -->
  <rect x="350" y="383" width="100" height="25" fill="white" opacity="0.8" rx="5" ry="5"/>
  <text x="400" y="400" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#555">Cytoplasm</text>
  
  <!-- S. aureus bacteria -->
  <ellipse cx="100" cy="100" rx="30" ry="25" fill="#d9b3ff" stroke="#8800cc" stroke-width="2"/>
  <text x="100" y="75" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">S. aureus</text>
  
  <!-- HlgB protein -->
  <circle cx="150" cy="130" r="18" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="150" y="135" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">HlgB</text>
  
  <!-- AMFR protein in ER membrane -->
  <rect x="200" y="190" width="90" height="30" rx="5" ry="5" fill="#99cc99" stroke="#006600" stroke-width="2"/>
  <text x="245" y="212" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">AMFR</text>
  
  <!-- TAB3 protein -->
  <rect x="350" y="240" width="90" height="30" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="395" y="262" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">TAB3</text>
  
  <!-- MAP3K7 protein -->
  <rect x="500" y="350" width="90" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="545" y="372" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">MAP3K7</text>
  
  <!-- NF-kB complex -->
  <rect x="650" y="350" width="90" height="30" rx="5" ry="5" fill="#ffff99" stroke="#cccc00" stroke-width="2"/>
  <text x="695" y="372" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">NF-κB</text>
  
  <!-- Pathway arrows -->
  <!-- HlgB to AMFR -->
  <path d="M 165,140 L 200,190" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- AMFR to TAB3 -->
  <path d="M 290,205 L 350,240" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- TAB3 to MAP3K7 -->
  <path d="M 440,260 L 500,350" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- MAP3K7 to NF-kB -->
  <path d="M 590,365 L 650,365" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Ubiquitination symbol on TAB3 -->
  <circle cx="380" y="230" r="10" fill="#cc99ff" stroke="#6600cc" stroke-width="1"/>
  <text x="380" y="234" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">Ub</text>
  <text x="410" y="225" text-anchor="start" font-family="Arial" font-size="10" font-weight="bold" fill="#6600cc">K27-linked</text>
  
  <!-- Process descriptions with background -->
  <rect x="120" y="150" width="130" height="35" fill="white" opacity="0.9" rx="5" ry="5"/>
  <text x="125" y="165" text-anchor="start" font-family="Arial" font-size="12" fill="#333">1. HlgB from S. aureus</text>
  <text x="125" y="180" text-anchor="start" font-family="Arial" font-size="12" fill="#333">interacts with host ER</text>
  
  <rect x="210" y="150" width="135" height="35" fill="white" opacity="0.9" rx="5" ry="5"/>
  <text x="215" y="165" text-anchor="start" font-family="Arial" font-size="12" fill="#333">2. AMFR ubiquitin ligase</text>
  <text x="215" y="180" text-anchor="start" font-family="Arial" font-size="12" fill="#333">activity is triggered</text>
  
  <rect x="325" y="195" width="175" height="35" fill="white" opacity="0.9" rx="5" ry="5"/>
  <text x="330" y="210" text-anchor="start" font-family="Arial" font-size="12" fill="#333">3. TAB3 is K27-ubiquitinated</text>
  <text x="330" y="225" text-anchor="start" font-family="Arial" font-size="12" fill="#333">and acts as molecular adaptor</text>
  
  <rect x="425" y="295" width="140" height="35" fill="white" opacity="0.9" rx="5" ry="5"/>
  <text x="430" y="310" text-anchor="start" font-family="Arial" font-size="12" fill="#333">4. TAB3 activates</text>
  <text x="430" y="325" text-anchor="start" font-family="Arial" font-size="12" fill="#333">MAP3K7 in cytoplasm</text>
  
  <rect x="595" y="295" width="140" height="35" fill="white" opacity="0.9" rx="5" ry="5"/>
  <text x="600" y="310" text-anchor="start" font-family="Arial" font-size="12" fill="#333">5. NF-κB activation</text>
  <text x="600" y="325" text-anchor="start" font-family="Arial" font-size="12" fill="#333">via non-canonical pathway</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="480" width="700" height="150" rx="5" ry="5" fill="#f8f8f8" stroke="#333" stroke-width="1"/>
  <text x="60" y="500" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Legend:</text>
  
  <!-- Protein symbols in legend -->
  <circle cx="75" y="525" r="12" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="95" y="530" font-family="Arial" font-size="14" fill="#333">HlgB (Q2FVK1) - Molecular adaptor activity in symbiont-mediated NF-κB perturbation</text>
  
  <rect x="75" y="550" width="18" height="18" rx="3" ry="3" fill="#99cc99" stroke="#006600" stroke-width="2"/>
  <text x="105" y="563" font-family="Arial" font-size="14" fill="#333">AMFR (Q9UKV5) - Ubiquitin protein ligase activity, K27-linked ubiquitination</text>
  
  <rect x="75" y="575" width="18" height="18" rx="3" ry="3" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="105" y="588" font-family="Arial" font-size="14" fill="#333">TAB3 (Q8N5C8) - Molecular adaptor activity in non-canonical NF-κB signaling</text>
  
  <rect x="75" y="600" width="18" height="18" rx="3" ry="3" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="105" y="613" font-family="Arial" font-size="14" fill="#333">MAP3K7 (O43318) - MAP kinase activity in canonical NF-κB signaling</text>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#333">Staphylococcal HlgB Activation of NF-κB via AMFR and TAB3</text>
</svg>