<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <rect x="50" y="320" width="700" height="12" fill="#8BC34A" stroke="black" stroke-width="1" />
  <text x="400" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Neuronal Membrane</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Cacna1a (P/Q-type Calcium Channel) Signaling Pathway</text>
  
  <!-- Neuron cell body -->
  <rect x="50" y="332" width="700" height="348" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="20" ry="20" />
  <text x="400" y="670" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Neuronal Cytoplasm</text>
  
  <!-- Extracellular space -->
  <rect x="50" y="50" width="700" height="270" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="2" rx="20" ry="20" />
  <text x="400" y="80" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Extracellular Space</text>

  <!-- P/Q-type Calcium Channel (CACNA1A) -->
  <rect x="340" y="280" width="120" height="90" fill="#FF9800" stroke="black" stroke-width="2" rx="5" ry="5" />
  <text x="400" y="305" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">CACNA1A</text>
  <text x="400" y="325" font-family="Arial" font-size="14" text-anchor="middle">P/Q-type Ca²⁺</text>
  <text x="400" y="345" font-family="Arial" font-size="14" text-anchor="middle">Channel</text>
  
  <!-- Calcium flow -->
  <path d="M 400 370 L 400 420" stroke="#FF5722" stroke-width="4" stroke-dasharray="5,5" />
  <text x="415" y="400" font-family="Arial" font-size="14" fill="#FF5722" font-weight="bold">Ca²⁺</text>
  <polygon points="400,420 395,410 405,410" fill="#FF5722" />
  
  <!-- Opioid Receptor (OPRM1) -->
  <rect x="170" y="280" width="100" height="90" fill="#9C27B0" stroke="black" stroke-width="2" rx="5" ry="5" />
  <text x="220" y="305" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">OPRM1</text>
  <text x="220" y="325" font-family="Arial" font-size="14" text-anchor="middle">Opioid</text>
  <text x="220" y="345" font-family="Arial" font-size="14" text-anchor="middle">Receptor</text>
  
  <!-- Proenkephalin (PENK) -->
  <ellipse cx="220" cy="180" rx="65" ry="35" fill="#4CAF50" stroke="black" stroke-width="2" />
  <text x="220" y="175" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">PENK</text>
  <text x="220" y="195" font-family="Arial" font-size="14" text-anchor="middle">Proenkephalin</text>
  
  <!-- Proenkephalin to Opioid Receptor -->
  <path d="M 220 215 L 220 280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="180" y="235" width="80" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="220" y="250" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Binding</text>
  
  <!-- Opioid Receptor to CACNA1A -->
  <path d="M 270 325 L 340 325" stroke="#000000" stroke-width="3" marker-end="url(#arrowhead)" />
  <rect x="280" y="300" width="70" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="315" y="315" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Inhibits</text>
  
  <!-- Cysteine Protease CSTL1 -->
  <rect x="90" y="180" width="80" height="50" fill="#FFEB3B" stroke="black" stroke-width="2" />
  <text x="130" y="195" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">CSTL1</text>
  <text x="130" y="215" font-family="Arial" font-size="12" text-anchor="middle">Cysteine Protease</text>
  
  <!-- CSTL1 to PENK -->
  <path d="M 170 200 L 155 200" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="120" y="170" width="90" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="165" y="185" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Processes</text>
  
  <!-- Somatostatin (SST) -->
  <ellipse cx="500" cy="180" rx="65" ry="35" fill="#4CAF50" stroke="black" stroke-width="2" />
  <text x="500" y="175" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">SST</text>
  <text x="500" y="195" font-family="Arial" font-size="14" text-anchor="middle">Somatostatin</text>
  
  <!-- Cholecystokinin (CCK) -->
  <ellipse cx="650" cy="180" rx="65" ry="35" fill="#4CAF50" stroke="black" stroke-width="2" />
  <text x="650" y="175" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">CCK</text>
  <text x="650" y="195" font-family="Arial" font-size="14" text-anchor="middle">Cholecystokinin</text>
  
  <!-- SST to CACNA1A -->
  <path d="M 490 215 L 430 280" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <rect x="425" y="235" width="100" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="475" y="250" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Modulates</text>
  
  <!-- CCK to CACNA1A -->
  <path d="M 620 215 L 440 280" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <rect x="510" y="225" width="100" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="560" y="240" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Modulates</text>
  
  <!-- Calcium binding proteins -->
  <rect x="350" y="450" width="100" height="50" fill="#03A9F4" stroke="black" stroke-width="2" rx="5" ry="5" />
  <text x="400" y="470" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Ca²⁺-binding</text>
  <text x="400" y="490" font-family="Arial" font-size="14" text-anchor="middle">Proteins</text>
  
  <!-- Neurotransmitter release -->
  <ellipse cx="500" cy="550" rx="120" ry="45" fill="#E91E63" stroke="black" stroke-width="2" />
  <text x="500" y="545" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Neurotransmitter</text>
  <text x="500" y="565" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Release</text>
  
  <!-- Calcium to calcium binding proteins -->
  <path d="M 400 420 L 400 450" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="360" y="420" width="80" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="400" y="435" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Activates</text>
  
  <!-- Calcium binding proteins to neurotransmitter release -->
  <path d="M 450 475 L 500 520" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <rect x="445" y="485" width="80" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="485" y="500" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Triggers</text>
  
  <!-- Cell types -->
  <rect x="590" y="380" width="140" height="100" fill="none" stroke="#9E9E9E" stroke-width="1" stroke-dasharray="5,5" />
  <text x="660" y="400" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" font-weight="bold">Cell Types:</text>
  <text x="660" y="425" font-family="Arial" font-size="14" text-anchor="middle">• Purkinje Cells</text>
  <text x="660" y="450" font-family="Arial" font-size="14" text-anchor="middle">• Motor Neurons</text>
  <text x="660" y="475" font-family="Arial" font-size="14" text-anchor="middle">• Granule Cells</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <!-- Beta subunits -->
  <rect x="480" y="305" width="90" height="40" fill="#FFC107" stroke="black" stroke-width="1" />
  <text x="525" y="330" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">β Subunits</text>
  
  <!-- Beta subunits binding -->
  <path d="M 480 325 L 460 325" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="445" y="300" width="60" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="475" y="315" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Binds</text>
  
  <!-- Color Legend -->
  <rect x="60" y="540" width="200" height="120" fill="white" fill-opacity="0.9" stroke="black" stroke-width="1" rx="5" ry="5" />
  <text x="160" y="560" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Color Legend</text>
  
  <rect x="70" y="570" width="15" height="15" fill="#FF9800" />
  <text x="170" y="582" font-family="Arial" font-size="12" text-anchor="middle">Ion Channel (CACNA1A)</text>
  
  <rect x="70" y="590" width="15" height="15" fill="#9C27B0" />
  <text x="170" y="602" font-family="Arial" font-size="12" text-anchor="middle">Receptor (OPRM1)</text>
  
  <rect x="70" y="610" width="15" height="15" fill="#4CAF50" />
  <text x="170" y="622" font-family="Arial" font-size="12" text-anchor="middle">Neuropeptides</text>
  
  <rect x="70" y="630" width="15" height="15" fill="#FFEB3B" />
  <text x="170" y="642" font-family="Arial" font-size="12" text-anchor="middle">Enzymes</text>
  
  <!-- Line thickness note -->
  <text x="110" y="520" font-family="Arial" font-size="12" font-style="italic">Note: Arrow thickness indicates interaction strength</text>
</svg>