<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and compartments -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" />
  
  <!-- Cell outline -->
  <path d="M50,50 L750,50 C765,50 775,60 775,75 L775,500 C775,515 765,525 750,525 L50,525 C35,525 25,515 25,500 L25,75 C25,60 35,50 50,50 Z" 
        fill="#ffffff" stroke="#333333" stroke-width="2" />
  
  <!-- Cytoplasm label -->
  <text x="400" y="80" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#000000">Cytoplasm (GO:0005737)</text>
  
  <!-- Cytosol compartment -->
  <rect x="50" y="100" width="700" height="350" rx="20" ry="20" fill="#e6f3ff" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <text x="400" y="125" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Cytosol (GO:0005829)</text>
  
  <!-- Plasma membrane -->
  <rect x="50" y="450" width="700" height="75" rx="5" ry="5" fill="#ffe6cc" stroke="#666" stroke-width="1" />
  <text x="400" y="475" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Plasma Membrane (GO:0005886)</text>
  
  <!-- UV-B irradiation trigger -->
  <path d="M100,20 L130,40 L70,40 Z" fill="#ffcc00" stroke="#333" stroke-width="1.5" />
  <path d="M85,40 L115,40" stroke="#ffcc00" stroke-width="4" />
  <path d="M80,45 L120,45" stroke="#ffcc00" stroke-width="3" />
  <path d="M75,50 L125,50" stroke="#ffcc00" stroke-width="2" />
  <text x="100" y="15" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">UV-B</text>
  
  <!-- Ribotoxic stress trigger -->
  <rect x="650" y="15" width="100" height="30" rx="15" ry="15" fill="#f8d7da" stroke="#333" stroke-width="1.5" />
  <text x="700" y="35" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Ribotoxic Stress</text>
  
  <!-- MAP3K20 (ZAKalpha) pathway - using a distinct color -->
  <circle cx="400" cy="170" r="35" fill="#a8d08d" stroke="#333" stroke-width="2" />
  <text x="400" y="170" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">MAP3K20</text>
  <text x="400" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(ZAKalpha)</text>
  
  <!-- MAP3K20 autophosphorylation -->
  <path d="M435,155 C470,130 470,180 435,170" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="485" y="155" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Auto-P</text>
  
  <!-- MAP3K20 sensor function -->
  <rect x="300" y="220" width="200" height="25" rx="10" ry="10" fill="#c5e1a5" stroke="#333" stroke-width="1.5" />
  <text x="400" y="237" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Ribosome Sensor Activity</text>
  
  <!-- MAP2K3/6 activation - unique color for this pathway branch -->
  <circle cx="300" cy="280" r="30" fill="#90caf9" stroke="#333" stroke-width="1.5" />
  <text x="300" y="280" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">MAP2K3/</text>
  <text x="300" y="300" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">MAP2K6</text>
  
  <!-- MAPK p38 activation - continue color scheme -->
  <circle cx="200" cy="350" r="30" fill="#90caf9" stroke="#333" stroke-width="1.5" />
  <text x="200" y="350" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">MAPK14</text>
  <text x="200" y="370" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(p38α)</text>
  
  <circle cx="300" cy="350" r="30" fill="#90caf9" stroke="#333" stroke-width="1.5" />
  <text x="300" y="350" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">MAPK11</text>
  <text x="300" y="370" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(p38β)</text>
  
  <!-- NLRP1 - inflammasome pathway with distinct color -->
  <rect x="400" y="330" width="70" height="40" rx="5" ry="5" fill="#ffcc80" stroke="#333" stroke-width="2" />
  <text x="435" y="355" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">NLRP1</text>
  
  <!-- CASP1 activation - continue inflammasome color scheme -->
  <rect x="550" y="330" width="70" height="40" rx="5" ry="5" fill="#ffab91" stroke="#333" stroke-width="2" />
  <text x="585" y="355" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">CASP1</text>
  
  <!-- GSDMD - pyroptosis pathway with reddish tint -->
  <rect x="550" y="400" width="70" height="40" rx="5" ry="5" fill="#ef9a9a" stroke="#333" stroke-width="2" />
  <text x="585" y="425" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">GSDMD</text>
  
  <!-- GSDMD pore in membrane -->
  <circle cx="585" cy="485" r="35" fill="none" stroke="#d32f2f" stroke-width="3" stroke-dasharray="4,2" />
  <path d="M570,475 L600,475 M565,485 L605,485 M570,495 L600,495" stroke="#d32f2f" stroke-width="3" />
  <text x="585" y="520" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">GSDMD pore</text>
  
  <!-- Connection arrows with color coordination -->
  <!-- Triggers to MAP3K20 -->
  <line x1="110" y1="50" x2="380" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="650" y1="40" x2="420" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- MAP3K20 to MAP2K3/6 - p38 pathway in blue -->
  <line x1="380" y1="200" x2="315" y2="255" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowheadBlue)" />
  
  <!-- MAP2K3/6 to MAPK11/14 -->
  <line x1="290" y1="305" x2="300" y2="320" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowheadBlue)" />
  <line x1="275" y1="295" x2="215" y2="325" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowheadBlue)" />
  
  <!-- MAPK to NLRP1 - transition to inflammasome pathway in orange -->
  <path d="M325,365 C350,380 380,380 395,355" stroke="#fb8c00" stroke-width="2.5" marker-end="url(#arrowheadOrange)" fill="none" />
  
  <!-- NLRP1 to CASP1 - inflammasome pathway in orange -->
  <line x1="470" y1="350" x2="550" y2="350" stroke="#fb8c00" stroke-width="2.5" marker-end="url(#arrowheadOrange)" />
  
  <!-- CASP1 to GSDMD - transition to pyroptosis in red -->
  <line x1="585" y1="370" x2="585" y2="400" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrowheadRed)" />
  
  <!-- GSDMD to pore - pyroptosis in red -->
  <line x1="585" y1="440" x2="585" y2="450" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrowheadRed)" />
  
  <!-- Biological process labels -->
  <rect x="50" y="550" width="700" height="30" rx="5" ry="5" fill="#e9ecef" stroke="none" />
  <text x="400" y="570" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Activation of NLRP1 Inflammasome by MAP3K20 (ZAKalpha)</text>
  
  <!-- Legend with enhanced clarity -->
  <rect x="580" y="100" width="170" height="170" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1.5" />
  <text x="665" y="125" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Legend</text>
  
  <circle cx="615" cy="150" r="12" fill="#a8d08d" stroke="#333" stroke-width="1.5" />
  <text x="685" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">MAP3K20 Pathway</text>
  
  <circle cx="615" cy="180" r="12" fill="#90caf9" stroke="#333" stroke-width="1.5" />
  <text x="685" y="185" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">p38 MAPK Pathway</text>
  
  <rect x="603" y="200" width="24" height="16" rx="3" ry="3" fill="#ffcc80" stroke="#333" stroke-width="1.5" />
  <text x="685" y="212" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Inflammasome</text>
  
  <rect x="603" y="230" width="24" height="16" rx="3" ry="3" fill="#ef9a9a" stroke="#333" stroke-width="1.5" />
  <text x="685" y="242" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Pyroptosis</text>
  
  <circle cx="615" cy="260" r="12" fill="none" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,1.5" />
  <text x="685" y="265" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Membrane Pore</text>
  
  <!-- Arrowhead definitions with color matching -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
    </marker>
    <marker id="arrowheadOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb8c00" />
    </marker>
    <marker id="arrowheadRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
  </defs>
</svg>