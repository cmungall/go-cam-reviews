<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Title -->
  <rect width="800" height="600" fill="white"/>
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Retinoid Metabolic Process (Mouse)</text>
  
  <!-- Cellular Compartments -->
  <!-- Extracellular Region -->
  <rect x="50" y="70" width="700" height="100" fill="#E6F3FF" stroke="black" stroke-width="2"/>
  <text x="100" y="90" font-family="Arial" font-size="16" font-weight="bold">Extracellular Region</text>
  
  <!-- Plasma Membrane -->
  <rect x="50" y="170" width="700" height="30" fill="#B3D9FF" stroke="black" stroke-width="2"/>
  <text x="100" y="190" font-family="Arial" font-size="14" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytosol -->
  <rect x="50" y="200" width="700" height="200" fill="#FFEAD6" stroke="black" stroke-width="2"/>
  <text x="100" y="220" font-family="Arial" font-size="16" font-weight="bold">Cytosol</text>
  
  <!-- Endoplasmic Reticulum -->
  <rect x="50" y="400" width="700" height="150" fill="#FFE6E6" stroke="black" stroke-width="2"/>
  <text x="100" y="420" font-family="Arial" font-size="16" font-weight="bold">Endoplasmic Reticulum Membrane</text>
  
  <!-- Molecules and Processes -->
  
  <!-- Extracellular Components -->
  <circle cx="200" cy="120" r="30" fill="#FFD699" stroke="black" stroke-width="2"/>
  <text x="200" y="115" font-family="Arial" font-size="12" text-anchor="middle">Chylomicron</text>
  <text x="200" y="130" font-family="Arial" font-size="10" text-anchor="middle">(atREs)</text>
  
  <!-- LPL -->
  <rect x="200" y="150" width="100" height="30" rx="5" ry="5" fill="#99CCFF" stroke="black" stroke-width="2"/>
  <text x="250" y="165" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Lpl</text>
  <text x="250" y="175" font-family="Arial" font-size="8" text-anchor="middle">(Lipoprotein Lipase)</text>
  
  <!-- LDLR on Plasma Membrane -->
  <rect x="350" y="170" width="90" height="25" rx="5" ry="5" fill="#99CCFF" stroke="black" stroke-width="2"/>
  <text x="395" y="182" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Ldlr</text>
  <text x="395" y="192" font-family="Arial" font-size="7" text-anchor="middle">(LDL Receptor)</text>
  
  <!-- Cytosolic Components -->
  <!-- RBP1 -->
  <rect x="250" y="250" width="80" height="30" rx="5" ry="5" fill="#99CCFF" stroke="black" stroke-width="2"/>
  <text x="290" y="265" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Rbp1</text>
  <text x="290" y="275" font-family="Arial" font-size="8" text-anchor="middle">(Retinol Binding)</text>
  
  <!-- All-trans-retinol -->
  <ellipse cx="350" cy="280" rx="40" ry="20" fill="#FFCC99" stroke="black" stroke-width="2"/>
  <text x="350" y="285" font-family="Arial" font-size="11" text-anchor="middle">All-trans-retinol</text>
  
  <!-- ADH1 -->
  <rect x="450" y="250" width="80" height="30" rx="5" ry="5" fill="#99CCFF" stroke="black" stroke-width="2"/>
  <text x="490" y="265" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Adh1</text>
  <text x="490" y="275" font-family="Arial" font-size="8" text-anchor="middle">(Retinol Dehydrogenase)</text>
  
  <!-- All-trans-retinal -->
  <ellipse cx="550" cy="280" rx="40" ry="20" fill="#FFCC99" stroke="black" stroke-width="2"/>
  <text x="550" y="285" font-family="Arial" font-size="11" text-anchor="middle">All-trans-retinal</text>
  
  <!-- BCO1 -->
  <rect x="650" y="250" width="80" height="30" rx="5" ry="5" fill="#99CCFF" stroke="black" stroke-width="2"/>
  <text x="690" y="265" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Bco1</text>
  <text x="690" y="275" font-family="Arial" font-size="8" text-anchor="middle">(β-carotene Dioxygenase)</text>
  
  <!-- RBP2 -->
  <rect x="550" y="330" width="80" height="30" rx="5" ry="5" fill="#99CCFF" stroke="black" stroke-width="2"/>
  <text x="590" y="345" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Rbp2</text>
  <text x="590" y="355" font-family="Arial" font-size="8" text-anchor="middle">(Adaptor Activity)</text>
  
  <!-- DHRS3 -->
  <rect x="450" y="330" width="80" height="30" rx="5" ry="5" fill="#99CCFF" stroke="black" stroke-width="2"/>
  <text x="490" y="345" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Dhrs3</text>
  <text x="490" y="355" font-family="Arial" font-size="8" text-anchor="middle">(Dehydrogenase/Reductase)</text>
  
  <!-- ER Components -->
  <!-- LRAT -->
  <rect x="350" y="450" width="80" height="30" rx="5" ry="5" fill="#99CCFF" stroke="black" stroke-width="2"/>
  <text x="390" y="465" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Lrat</text>
  <text x="390" y="475" font-family="Arial" font-size="8" text-anchor="middle">(Acyltransferase)</text>
  
  <!-- Retinyl Ester -->
  <ellipse cx="470" cy="480" rx="50" ry="20" fill="#FFCC99" stroke="black" stroke-width="2"/>
  <text x="470" y="485" font-family="Arial" font-size="11" text-anchor="middle">All-trans-retinyl ester</text>
  
  <!-- Metabolic products -->
  <ellipse cx="150" cy="280" rx="35" ry="20" fill="#FFCC99" stroke="black" stroke-width="2"/>
  <text x="150" y="278" font-family="Arial" font-size="9" text-anchor="middle">Diglyceride</text>
  <text x="150" y="288" font-family="Arial" font-size="9" text-anchor="middle">Long-chain FA</text>
  
  <!-- Arrows and Interactions -->
  <!-- LPL hydrolyzing chylomicron - thicker arrow for main pathway -->
  <path d="M 200 150 L 200 150" stroke="#004D99" stroke-width="3" fill="none"/>
  <path d="M 200 120 L 240 150" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  
  <!-- Products from LPL hydrolysis -->
  <path d="M 200 150 L 150 260" stroke="black" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  
  <!-- LDLR receiving from LPL - thicker arrow for main pathway -->
  <path d="M 300 165 L 350 170" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  
  <!-- Retinol to RBP1 - thicker arrow for main pathway -->
  <path d="M 395 195 L 395 230 L 330 250" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  
  <!-- RBP1 binding to retinol - thicker arrow for main pathway -->
  <path d="M 330 265 L 310 280" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  
  <!-- ADH1 converting retinol to retinal - thicker arrow for main pathway -->
  <path d="M 390 280 L 450 265" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  <path d="M 530 265 L 510 280" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  
  <!-- BCO1 producing retinal -->
  <path d="M 650 265 L 590 280" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  
  <!-- RBP2 interacting with retinal -->
  <path d="M 550 300 L 550 330" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  
  <!-- DHRS3 converting retinal back to retinol -->
  <path d="M 480 330 L 510 300" stroke="#5A9E6F" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead_feedback)"/>
  <path d="M 450 320 L 390 290" stroke="#5A9E6F" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead_feedback)"/>
  
  <!-- Retinol to LRAT - thicker arrow for main pathway -->
  <path d="M 350 300 L 350 450" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  
  <!-- LRAT producing retinyl ester - thicker arrow for main pathway -->
  <path d="M 430 465 L 420 480" stroke="#004D99" stroke-width="3" fill="none" marker-end="url(#arrowhead_main)"/>
  
  <!-- Defs for markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
    <marker id="arrowhead_main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004D99"/>
    </marker>
    <marker id="arrowhead_feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5A9E6F"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="580" y="490" width="180" height="100" fill="white" stroke="black" stroke-width="1"/>
  <text x="590" y="505" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
  <rect x="590" y="515" width="20" height="10" fill="#99CCFF" stroke="black" stroke-width="1"/>
  <text x="615" y="523" font-family="Arial" font-size="10">Gene Products/Enzymes</text>
  <ellipse cx="600" cy="535" rx="10" ry="5" fill="#FFCC99" stroke="black" stroke-width="1"/>
  <text x="615" y="538" font-family="Arial" font-size="10">Metabolites</text>
  <line x1="590" y1="550" x2="610" y2="550" stroke="#004D99" stroke-width="3"/>
  <text x="615" y="553" font-family="Arial" font-size="10">Main Pathway</text>
  <line x1="590" y1="565" x2="610" y2="565" stroke="#5A9E6F" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="615" y="568" font-family="Arial" font-size="10">Feedback/Secondary Path</text>
  <text x="590" y="583" font-family="Arial" font-size="8" font-style="italic">*All gene products shown are from mouse (Mus musculus)</text>
</svg>