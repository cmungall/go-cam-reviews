<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell compartments -->
  <!-- Extracellular space -->
  <rect x="0" y="0" width="800" height="200" fill="#e6f7ff" opacity="0.5"/>
  <text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold">Extracellular Space</text>
  
  <!-- Plasma membrane -->
  <path d="M0,200 L800,200" stroke="#666666" stroke-width="5" stroke-dasharray="5,3"/>
  <text x="20" y="225" font-family="Arial" font-size="18" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytoplasm -->
  <rect x="0" y="205" width="800" height="245" fill="#fff2cc" opacity="0.5"/>
  <text x="20" y="240" font-family="Arial" font-size="18" font-weight="bold">Cytoplasm</text>
  
  <!-- Nuclear membrane -->
  <ellipse cx="400" cy="450" rx="200" ry="100" stroke="#666666" stroke-width="3" fill="#fce4ec" opacity="0.5"/>
  <text x="370" y="380" font-family="Arial" font-size="18" font-weight="bold">Nucleus</text>
  
  <!-- Chromatin -->
  <ellipse cx="400" cy="470" rx="150" ry="60" stroke="#333333" stroke-width="1" stroke-dasharray="5,2" fill="#ede7f6" opacity="0.8"/>
  <text x="360" y="470" font-family="Arial" font-size="14" font-weight="bold">Chromatin</text>
  
  <!-- BMP9/GDF2 -->
  <circle cx="200" cy="100" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="200" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">BMP9</text>
  <text x="200" y="125" font-family="Arial" font-size="11" text-anchor="middle">(GDF2)</text>
  
  <!-- ACVR2B - Type II receptor -->
  <rect x="300" y="170" width="60" height="30" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="5" ry="5"/>
  <text x="330" y="190" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">ACVR2B</text>
  <text x="330" y="160" font-family="Arial" font-size="11" text-anchor="middle">Type II receptor</text>
  
  <!-- BMPR2 - Type II receptor -->
  <rect x="400" y="170" width="60" height="30" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="5" ry="5"/>
  <text x="430" y="190" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">BMPR2</text>
  <text x="430" y="160" font-family="Arial" font-size="11" text-anchor="middle">Type II receptor</text>
  
  <!-- ACVRL1 - Type I receptor -->
  <rect x="350" y="220" width="60" height="30" fill="#99ff99" stroke="#006600" stroke-width="2" rx="5" ry="5"/>
  <text x="380" y="240" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">ACVRL1</text>
  <text x="380" y="255" font-family="Arial" font-size="11" text-anchor="middle">Type I receptor</text>
  
  <!-- SMAD1 -->
  <rect x="380" y="300" width="60" height="30" fill="#ffcc99" stroke="#ff6600" stroke-width="2" rx="5" ry="5"/>
  <text x="410" y="320" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">SMAD1</text>
  
  <!-- SMAD1 in nucleus -->
  <rect x="380" y="450" width="60" height="30" fill="#ffcc99" stroke="#ff6600" stroke-width="2" rx="5" ry="5"/>
  <text x="410" y="470" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">SMAD1</text>
  
  <!-- DNA Target Genes -->
  <path d="M460,470 Q500,480 540,470 Q500,460 460,470" stroke="#333333" stroke-width="2" fill="none"/>
  <text x="500" y="450" font-family="Arial" font-size="13" text-anchor="middle">Target Genes</text>
  
  <!-- Arrows -->
  <!-- BMP9 to receptors -->
  <path d="M220,120 Q285,150 330,170" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead1)"/>
  <text x="255" y="135" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">binds</text>
  
  <path d="M220,120 Q370,135 430,170" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead1)"/>
  <text x="325" y="125" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">binds</text>
  
  <!-- Type II to Type I activation -->
  <path d="M330,200 Q350,220 380,220" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
  <path d="M430,200 Q410,220 380,220" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
  <text x="380" y="210" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">activates</text>
  
  <!-- ACVRL1 to SMAD1 -->
  <path d="M380,250 Q410,275 410,300" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead3)"/>
  <text x="420" y="280" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">phosphorylates</text>
  
  <!-- SMAD1 to nucleus -->
  <path d="M410,330 Q410,390 410,450" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead1)"/>
  <text x="425" y="390" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">translocates</text>
  
  <!-- SMAD1 to DNA -->
  <path d="M440,460 Q450,465 460,470" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead3)"/>
  <text x="450" y="455" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">regulates</text>
  
  <!-- Legend -->
  <rect x="570" y="20" width="210" height="230" fill="white" stroke="#666666" stroke-width="1"/>
  <text x="590" y="40" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <!-- Legend Items -->
  <circle cx="590" cy="60" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="610" y="65" font-family="Arial" font-size="12">BMP9/GDF2 - Growth Factor</text>
  
  <rect x="580" y="80" width="20" height="10" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="2" ry="2"/>
  <text x="610" y="90" font-family="Arial" font-size="12">Type II Receptors (ACVR2B, BMPR2)</text>
  
  <rect x="580" y="100" width="20" height="10" fill="#99ff99" stroke="#006600" stroke-width="2" rx="2" ry="2"/>
  <text x="610" y="110" font-family="Arial" font-size="12">Type I Receptor (ACVRL1)</text>
  
  <rect x="580" y="120" width="20" height="10" fill="#ffcc99" stroke="#ff6600" stroke-width="2" rx="2" ry="2"/>
  <text x="610" y="130" font-family="Arial" font-size="12">SMAD1 - Transcription Factor</text>
  
  <line x1="580" y1="145" x2="600" y2="145" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead1)"/>
  <text x="610" y="150" font-family="Arial" font-size="12">Binding/Translocation</text>
  
  <line x1="580" y1="165" x2="600" y2="165" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="610" y="170" font-family="Arial" font-size="12">Activation</text>
  
  <line x1="580" y1="185" x2="600" y2="185" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead3)"/>
  <text x="610" y="190" font-family="Arial" font-size="12">Phosphorylation/Regulation</text>
  
  <text x="590" y="210" font-family="Arial" font-size="11" fill="#666666">BMP9 Signaling Pathway (Human)</text>
  <text x="590" y="225" font-family="Arial" font-size="11" fill="#666666">GO:0030509 - BMP signaling pathway</text>
  <text x="590" y="240" font-family="Arial" font-size="11" fill="#666666">GO-CAM: gomodel:600ced8500002343</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#990000"/>
    </marker>
    <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#009900"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="580" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">BMP9 Signaling Pathway (Human)</text>
</svg>