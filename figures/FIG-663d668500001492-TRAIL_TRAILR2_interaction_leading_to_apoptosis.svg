<svg width="750" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Background -->
  <rect x="50" y="50" width="650" height="500" rx="20" ry="20" fill="#f0f9ff" stroke="#2c3e50" stroke-width="2" />
  
  <!-- Plasma Membrane -->
  <path d="M 50 150 Q 100 140, 150 150 Q 200 160, 250 150 Q 300 140, 350 150 Q 400 160, 450 150 Q 500 140, 550 150 Q 600 160, 650 150 Q 700 140, 700 150 L 700 550 L 50 550 Z" fill="#d6eaf8" stroke="#2c3e50" stroke-width="2" />
  
  <!-- Extracellular Space -->
  <rect x="50" y="50" width="650" height="100" rx="20" ry="20" fill="#e8f8f5" stroke="none" />
  <text x="70" y="80" font-family="Arial" font-size="16" fill="#2c3e50">Extracellular Space (GO:0005615)</text>
  
  <!-- Cytoplasm -->
  <text x="70" y="185" font-family="Arial" font-size="16" fill="#2c3e50">Cytoplasm (GO:0005737)</text>
  
  <!-- TRAIL (TNFSF10) -->
  <circle cx="220" cy="100" r="28" fill="#ff6b6b" stroke="#c0392b" stroke-width="2" />
  <text x="220" y="105" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">TRAIL</text>
  
  <!-- TRAIL Receptor 2 (TNFRSF10B) -->
  <rect x="190" y="150" width="60" height="35" rx="5" ry="5" fill="#3498db" stroke="#2980b9" stroke-width="2" />
  <text x="220" y="173" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">TRAILR2</text>
  
  <!-- Binding Arrow -->
  <line x1="220" y1="128" x2="220" y2="150" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- TRADD -->
  <rect x="190" y="230" width="60" height="35" rx="5" ry="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" />
  <text x="220" y="253" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">TRADD</text>
  
  <!-- FADD -->
  <rect x="190" y="310" width="60" height="35" rx="5" ry="5" fill="#f39c12" stroke="#d35400" stroke-width="2" />
  <text x="220" y="333" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">FADD</text>
  
  <!-- CASP8 -->
  <rect x="190" y="390" width="60" height="35" rx="5" ry="5" fill="#2ecc71" stroke="#27ae60" stroke-width="2" />
  <text x="220" y="413" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">CASP8</text>
  
  <!-- Signaling Arrows -->
  <line x1="220" y1="185" x2="220" y2="230" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="220" y1="265" x2="220" y2="310" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="220" y1="345" x2="220" y2="390" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Apoptosis Indicator -->
  <path d="M 270 425 C 320 410, 350 450, 400 425" stroke="#e74c3c" stroke-width="3" fill="none" stroke-dasharray="5,3" />
  <text x="335" y="460" font-family="Arial" font-size="16" fill="#e74c3c" text-anchor="middle" font-weight="bold">Apoptosis</text>
  
  <!-- Function Labels with connection lines -->
  <text x="380" y="95" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Cytokine Activity (GO:0005125)</text>
  <line x1="248" y1="100" x2="375" y2="95" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="3,2" />
  
  <text x="390" y="165" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Signaling Receptor Activity (GO:0038023)</text>
  <line x1="250" y1="167" x2="385" y2="165" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="3,2" />
  
  <text x="400" y="245" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Protein-macromolecule Adaptor (GO:0030674)</text>
  <line x1="250" y1="247" x2="395" y2="245" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="3,2" />
  
  <text x="400" y="325" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Protein-macromolecule Adaptor (GO:0030674)</text>
  <line x1="250" y1="327" x2="395" y2="325" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="3,2" />
  
  <text x="410" y="405" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">Cysteine-type Endopeptidase (GO:0004197)</text>
  <line x1="250" y1="407" x2="405" y2="405" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="3,2" />
  
  <!-- Title -->
  <text x="375" y="30" font-family="Arial" font-size="22" font-weight="bold" fill="#2c3e50" text-anchor="middle">TRAIL/TRAILR2 Interaction Leading to Apoptosis</text>
  
  <!-- Process label -->
  <text x="375" y="520" font-family="Arial" font-size="16" font-style="italic" fill="#2c3e50" text-anchor="middle" font-weight="bold">TRAIL-activated apoptotic signaling pathway (GO:0036462)</text>

  <!-- Legend -->
  <rect x="520" y="400" width="170" height="130" fill="white" stroke="#2c3e50" stroke-width="1.5" />
  <text x="605" y="420" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">Legend</text>
  
  <circle cx="535" cy="440" r="8" fill="#ff6b6b" stroke="#c0392b" stroke-width="1.5" />
  <text x="590" y="444" font-family="Arial" font-size="12" fill="#2c3e50">TNFSF10/TRAIL</text>
  
  <rect x="527" y="460" width="16" height="12" fill="#3498db" stroke="#2980b9" stroke-width="1.5" />
  <text x="595" y="470" font-family="Arial" font-size="12" fill="#2c3e50">TNFRSF10B/TRAILR2</text>
  
  <rect x="527" y="485" width="16" height="12" fill="#9b59b6" stroke="#8e44ad" stroke-width="1.5" />
  <text x="575" y="495" font-family="Arial" font-size="12" fill="#2c3e50">TRADD</text>
  
  <rect x="527" y="510" width="16" height="12" fill="#f39c12" stroke="#d35400" stroke-width="1.5" />
  <text x="565" y="520" font-family="Arial" font-size="12" fill="#2c3e50">FADD</text>
  
  <rect x="527" y="535" width="16" height="12" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5" />
  <text x="575" y="545" font-family="Arial" font-size="12" fill="#2c3e50">CASP8</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
</svg>