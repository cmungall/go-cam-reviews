<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Plasma membrane -->
  <path d="M50,300 Q400,500 750,300 Q400,100 50,300 Z" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="680" y="180" font-family="Arial" font-size="14" fill="#333">Plasma membrane</text>
  <text x="680" y="200" font-family="Arial" font-size="12" fill="#666">(GO:0005886)</text>
  
  <!-- Cytosol -->
  <text x="400" y="350" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">Cytosol</text>
  <text x="400" y="370" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">(GO:0005829)</text>
  
  <!-- 1. CASP1 with endopeptidase activity -->
  <circle cx="200" cy="350" r="30" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="200" y="350" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">CASP1</text>
  <text x="200" y="370" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">(P29466)</text>
  <text x="200" y="410" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Cysteine-type endopeptidase activity</text>
  <text x="200" y="425" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(GO:0004197)</text>
  
  <!-- 2. GSDMD inactive -->
  <rect x="300" y="340" width="60" height="30" fill="#99ccff" stroke="#333" stroke-width="2" rx="5" ry="5"/>
  <text x="330" y="360" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">GSDMD</text>
  <text x="330" y="375" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">(P57764)</text>
  
  <!-- 3. Arrow from CASP1 to GSDMD -->
  <path d="M240,350 L290,350" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="260" y="340" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Cleaves</text>
  <text x="260" y="380" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Protein maturation</text>
  <text x="260" y="395" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(GO:0051604)</text>
  
  <!-- 4. GSDMD active (cleaved) -->
  <rect x="370" y="280" width="60" height="30" fill="#99ccff" stroke="#333" stroke-width="2" rx="5" ry="5"/>
  <text x="400" y="300" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">GSDMD</text>
  
  <!-- GSDMD binding labels relocated to avoid overlap -->
  <text x="320" y="200" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">PI(4,5)P2 binding</text>
  <text x="320" y="215" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(GO:0005546)</text>
  <path d="M320,220 L350,260" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  
  <text x="500" y="240" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">PI(4)P binding</text>
  <text x="500" y="255" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(GO:0070273)</text>
  <path d="M500,260 L450,280" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- 5. Arrow from inactive to active GSDMD -->
  <path d="M360,340 C 370,320 380,310 370,280" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 6. GSDMD forming pores in membrane -->
  <path d="M450,220 Q480,180 520,220" fill="none" stroke="#99ccff" stroke-width="8"/>
  <text x="480" y="160" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Wide pore</text>
  <text x="480" y="175" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">channel activity</text>
  <text x="480" y="190" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(GO:0022829)</text>
  <path d="M480,195 L485,220" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- 7. Arrow from active GSDMD to pore -->
  <path d="M430,280 C 450,260 450,240 450,220" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 8. NINJ1 -->
  <circle cx="600" cy="250" r="30" fill="#ccff99" stroke="#333" stroke-width="2"/>
  <text x="600" y="250" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">NINJ1</text>
  <text x="600" y="265" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">(Q92982)</text>
  <text x="650" y="310" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Membrane destabilizing</text>
  <text x="650" y="325" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">activity</text>
  <text x="650" y="340" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(GO:0140912)</text>
  <path d="M650,310 L620,270" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- 9. NINJ1 destabilizing membrane -->
  <path d="M570,195 Q600,170 630,195" fill="none" stroke="#ccff99" stroke-width="5" stroke-dasharray="3,2"/>
  
  <!-- 10. Arrow from NINJ1 to membrane destabilization -->
  <path d="M600,220 L600,200" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 11. Inflammatory response and pyroptosis labels -->
  <path d="M550,220 Q530,170 570,130 Q600,100 630,130 Q670,170 650,220" fill="#ffcccc" fill-opacity="0.3" stroke="#ff6666" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="600" y="120" font-family="Arial" font-size="14" fill="#ff3333" text-anchor="middle">Pyroptotic cell death</text>
  <text x="600" y="140" font-family="Arial" font-size="12" fill="#ff3333" text-anchor="middle">(GO:0141201)</text>
  
  <!-- 12. Arrow from GSDMD pore and NINJ1 to pyroptosis -->
  <path d="M520,220 C 530,190 540,180 570,150" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M630,195 C 640,180 640,160 630,150" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 13. Inflammatory response arrow -->
  <path d="M480,220 C 480,150 500,100 580,80" stroke="#ff6666" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
  <text x="520" y="40" font-family="Arial" font-size="14" fill="#ff3333" text-anchor="middle">Positive regulation of</text>
  <text x="520" y="60" font-family="Arial" font-size="14" fill="#ff3333" text-anchor="middle">inflammatory response</text>
  <text x="520" y="80" font-family="Arial" font-size="12" fill="#ff3333" text-anchor="middle">(GO:0050729)</text>
  
  <!-- Legend -->
  <rect x="30" y="50" width="180" height="180" fill="white" stroke="#333" stroke-width="1" rx="5" ry="5" fill-opacity="0.9"/>
  <text x="40" y="70" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend</text>
  
  <circle cx="50" cy="90" r="8" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="65" y="95" font-family="Arial" font-size="12" fill="#333">CASP1 (P29466)</text>
  
  <rect x="40" y="105" width="16" height="8" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="65" y="115" font-family="Arial" font-size="12" fill="#333">GSDMD (P57764)</text>
  
  <circle cx="50" cy="130" r="8" fill="#ccff99" stroke="#333" stroke-width="1"/>
  <text x="65" y="135" font-family="Arial" font-size="12" fill="#333">NINJ1 (Q92982)</text>
  
  <path d="M40,150 L60,150" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="100" y="155" font-family="Arial" font-size="12" fill="#333">Causal relation</text>
  
  <path d="M40,170 L60,170" stroke="#ff6666" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="120" y="175" font-family="Arial" font-size="12" fill="#333">Inflammatory pathway</text>
  
  <path d="M40,190 L60,190" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="105" y="195" font-family="Arial" font-size="12" fill="#333">Functional association</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>