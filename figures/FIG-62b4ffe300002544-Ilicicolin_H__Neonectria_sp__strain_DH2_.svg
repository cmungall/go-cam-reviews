<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Ilicicolin H Biosynthetic Pathway in Neonectria sp. strain DH2</text>
  
  <!-- Starting substrates -->
  <rect x="50" y="120" width="120" height="40" rx="5" fill="#e6f2ff" stroke="#000000" stroke-width="1"/>
  <text x="110" y="145" font-family="Arial" font-size="12" text-anchor="middle">Acetyl-CoA</text>
  
  <rect x="50" y="170" width="120" height="40" rx="5" fill="#e6f2ff" stroke="#000000" stroke-width="1"/>
  <text x="110" y="195" font-family="Arial" font-size="12" text-anchor="middle">Malonyl-CoA</text>
  
  <rect x="50" y="220" width="120" height="40" rx="5" fill="#e6f2ff" stroke="#000000" stroke-width="1"/>
  <text x="110" y="245" font-family="Arial" font-size="12" text-anchor="middle">S-adenosyl-L-methionine</text>

  <rect x="50" y="320" width="120" height="40" rx="5" fill="#e6f2ff" stroke="#000000" stroke-width="1"/>
  <text x="110" y="345" font-family="Arial" font-size="12" text-anchor="middle">L-tyrosine</text>
  
  <!-- Enzyme IliB -->
  <rect x="250" y="150" width="120" height="60" rx="10" fill="#d9f2d9" stroke="#000000" stroke-width="2"/>
  <text x="310" y="175" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IliB</text>
  <text x="310" y="195" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Enoyl-ACP reductase</text>
  
  <!-- Enzyme IliA -->
  <rect x="250" y="320" width="120" height="60" rx="10" fill="#d9f2d9" stroke="#000000" stroke-width="2"/>
  <text x="310" y="345" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IliA</text>
  <text x="310" y="365" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Non-ribosomal peptide</text>
  <text x="310" y="378" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">synthase/Polyketide synthase</text>
  
  <!-- Intermediate Compound 1 -->
  <rect x="450" y="320" width="120" height="40" rx="5" fill="#ffe6cc" stroke="#000000" stroke-width="1"/>
  <text x="510" y="335" font-family="Arial" font-size="12" text-anchor="middle">Intermediate 1</text>
  <text x="510" y="350" font-family="Arial" font-size="10" text-anchor="middle">CHEBI:155890</text>
  
  <!-- Enzyme IliC -->
  <rect x="450" y="230" width="120" height="60" rx="10" fill="#d9f2d9" stroke="#000000" stroke-width="2"/>
  <text x="510" y="255" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IliC</text>
  <text x="510" y="275" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Oxidoreductase</text>
  
  <!-- Intermediate Compound 2 -->
  <rect x="650" y="230" width="120" height="40" rx="5" fill="#ffe6cc" stroke="#000000" stroke-width="1"/>
  <text x="710" y="245" font-family="Arial" font-size="12" text-anchor="middle">Intermediate 2</text>
  <text x="710" y="260" font-family="Arial" font-size="10" text-anchor="middle">CHEBI:155889</text>
  
  <!-- Enzyme IliD -->
  <rect x="650" y="320" width="120" height="60" rx="10" fill="#d9f2d9" stroke="#000000" stroke-width="2"/>
  <text x="710" y="345" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IliD</text>
  <text x="710" y="365" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Cyclase</text>
  
  <!-- Final Product -->
  <ellipse cx="710" cy="440" rx="100" ry="40" fill="#ffcccc" stroke="#000000" stroke-width="2"/>
  <text x="710" y="435" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Ilicicolin H</text>
  <text x="710" y="455" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">CHEBI:77772</text>
  
  <!-- Reaction annotations -->
  <text x="415" y="325" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Polyketide synthesis</text>
  <text x="585" y="235" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Oxidation</text>
  <text x="710" y="295" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Cyclization</text>
  
  <!-- Arrows -->
  <line x1="170" y1="140" x2="240" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="190" x2="240" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="240" x2="240" y2="190" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="310" y1="210" x2="310" y2="310" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="265" font-family="Arial" font-size="12">Regulates</text>
  
  <line x1="170" y1="340" x2="240" y2="340" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="340" x2="440" y2="340" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="510" y1="320" x2="510" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="250" x2="640" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="710" y1="280" x2="710" y2="310" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="710" y1="380" x2="710" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Cell outline (subtle) -->
  <rect x="30" y="90" width="740" height="420" rx="15" fill="none" stroke="#cccccc" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="110" font-family="Arial" font-size="12" fill="#666666">Neonectria sp. strain DH2</text>
  
  <!-- Process label -->
  <rect x="550" y="100" width="170" height="25" rx="5" fill="#e6e6e6" stroke="#666666" stroke-width="1"/>
  <text x="635" y="117" font-family="Arial" font-size="12" text-anchor="middle">GO:0140781 - Ilicicolin H biosynthesis</text>
  
  <!-- Legend -->
  <rect x="50" y="530" width="700" height="90" rx="5" fill="#f9f9f9" stroke="#000000" stroke-width="1"/>
  <text x="400" y="550" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <rect x="70" y="565" width="20" height="20" fill="#e6f2ff" stroke="#000000" stroke-width="1"/>
  <text x="100" y="580" font-family="Arial" font-size="12" text-anchor="start">Substrate</text>
  
  <rect x="200" y="565" width="20" height="20" fill="#d9f2d9" stroke="#000000" stroke-width="1"/>
  <text x="230" y="580" font-family="Arial" font-size="12" text-anchor="start">Enzyme</text>
  
  <rect x="330" y="565" width="20" height="20" fill="#ffe6cc" stroke="#000000" stroke-width="1"/>
  <text x="360" y="580" font-family="Arial" font-size="12" text-anchor="start">Intermediate</text>
  
  <ellipse cx="490" cy="575" rx="10" ry="10" fill="#ffcccc" stroke="#000000" stroke-width="1"/>
  <text x="510" y="580" font-family="Arial" font-size="12" text-anchor="start">Product</text>
  
  <line x1="600" y1="575" x2="630" y2="575" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="640" y="580" font-family="Arial" font-size="12" text-anchor="start">Reaction</text>
  
  <!-- Footnote -->
  <text x="400" y="630" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Data based on biochemical characterization from PMID:31216742</text>
</svg>