<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#666" stroke-width="2" opacity="0.7"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="320" rx="250" ry="180" fill="#e6e6fa" stroke="#666" stroke-width="2" opacity="0.9"/>
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Nucleus (GO:0005634)</text>
  
  <!-- Cytoplasm label -->
  <text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm</text>
  
  <!-- KCTD10 protein binding -->
  <circle cx="240" cy="300" r="40" fill="#90ee90" stroke="#006400" stroke-width="2"/>
  <text x="240" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">KCTD10</text>
  <text x="240" y="320" text-anchor="middle" font-family="Arial" font-size="10">Protein binding</text>
  <text x="240" y="335" text-anchor="middle" font-family="Arial" font-size="10">(GO:0005515)</text>
  
  <!-- TBX5a transcription factor -->
  <rect x="370" y="290" width="100" height="60" rx="10" ry="10" fill="#add8e6" stroke="#00008b" stroke-width="2"/>
  <text x="420" y="315" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">TBX5a</text>
  <text x="420" y="335" text-anchor="middle" font-family="Arial" font-size="10">DNA-binding TF</text>
  <text x="420" y="350" text-anchor="middle" font-family="Arial" font-size="10">(GO:0003700)</text>
  
  <!-- HAS2 -->
  <rect x="550" y="400" width="100" height="60" rx="10" ry="10" fill="#ffb6c1" stroke="#8b0000" stroke-width="2"/>
  <text x="600" y="430" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">HAS2</text>
  <text x="600" y="445" text-anchor="middle" font-family="Arial" font-size="10">Molecular function</text>
  
  <!-- DNA strand -->
  <path d="M 330 400 Q 420 440 580 400" stroke="#333" stroke-width="3" fill="none"/>
  <text x="450" y="470" text-anchor="middle" font-family="Arial" font-size="12">DNA</text>
  
  <!-- Arrows and regulatory interactions -->
  <!-- KCTD10 negatively regulates TBX5a -->
  <path d="M 280 300 L 370 310" stroke="#ff0000" stroke-width="2" fill="none" marker-end="url(#arrowheadRed)"/>
  <circle cx="325" cy="305" r="10" fill="#ffffff" stroke="#ff0000" stroke-width="2"/>
  <line x1="315" y1="305" x2="335" y2="305" stroke="#ff0000" stroke-width="2"/>
  
  <!-- TBX5a positively regulates HAS2 -->
  <path d="M 470 320 L 550 420" stroke="#008000" stroke-width="2" fill="none" marker-end="url(#arrowheadGreen)"/>
  <circle cx="510" cy="370" r="10" fill="#ffffff" stroke="#008000" stroke-width="2"/>
  <text x="510" y="375" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">+</text>
  
  <!-- Biological Processes - Moved to prevent overlap -->
  <rect x="120" y="520" width="150" height="40" rx="5" ry="5" fill="#ffd700" stroke="#8b8000" stroke-width="2"/>
  <text x="195" y="545" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Regionalization</text>
  <text x="195" y="560" text-anchor="middle" font-family="Arial" font-size="10">(GO:0003002)</text>
  
  <rect x="520" y="520" width="220" height="40" rx="5" ry="5" fill="#ffd700" stroke="#8b8000" stroke-width="2"/>
  <text x="630" y="545" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Atrioventricular Canal Development</text>
  <text x="630" y="560" text-anchor="middle" font-family="Arial" font-size="10">(GO:0036302)</text>
  
  <!-- Process connections - Better spaced to avoid overlap -->
  <path d="M 240 340 L 195 520" stroke="#666" stroke-width="1" stroke-dasharray="5,3" fill="none"/>
  <path d="M 420 350 L 195 520" stroke="#666" stroke-width="1" stroke-dasharray="5,3" fill="none"/>
  <path d="M 600 460 L 630 520" stroke="#666" stroke-width="1" stroke-dasharray="5,3" fill="none"/>
  
  <!-- Legend -->
  <rect x="50" y="580" width="700" height="60" rx="5" ry="5" fill="#f0f0f0" stroke="#333" stroke-width="1"/>
  <text x="60" y="600" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <!-- Negative regulation symbol -->
  <circle cx="100" cy="620" r="8" fill="#ffffff" stroke="#ff0000" stroke-width="2"/>
  <line x1="92" y1="620" x2="108" y2="620" stroke="#ff0000" stroke-width="2"/>
  <text x="120" y="625" font-family="Arial" font-size="12">Negative regulation</text>
  
  <!-- Positive regulation symbol -->
  <circle cx="240" cy="620" r="8" fill="#ffffff" stroke="#008000" stroke-width="2"/>
  <text x="240" y="624" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">+</text>
  <text x="260" y="625" font-family="Arial" font-size="12">Positive regulation</text>
  
  <!-- Parts of process -->
  <line x1="350" y1="620" x2="390" y2="620" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="410" y="625" font-family="Arial" font-size="12">Part of biological process</text>
  
  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#008000"/>
    </marker>
    <marker id="arrowheadRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0000"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">KCTD10 in Heart Development (Zebrafish)</text>
</svg>