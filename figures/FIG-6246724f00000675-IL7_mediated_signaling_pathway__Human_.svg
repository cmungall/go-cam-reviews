<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and compartments -->
  <!-- Extracellular space -->
  <rect x="0" y="0" width="800" height="200" fill="#f0f8ff" opacity="0.5"/>
  <text x="40" y="30" font-family="Arial" font-size="16" font-weight="bold">Extracellular Space</text>
  
  <!-- Plasma membrane -->
  <rect x="0" y="200" width="800" height="20" fill="#a0d4b5" opacity="0.8"/>
  <text x="40" y="215" font-family="Arial" font-size="16" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytoplasm -->
  <rect x="0" y="220" width="800" height="230" fill="#ffeedb" opacity="0.5"/>
  <text x="40" y="240" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm</text>
  
  <!-- Nucleus -->
  <rect x="200" y="450" width="400" height="150" rx="200" ry="75" fill="#e6e6fa" opacity="0.7" stroke="#6c59a1" stroke-width="2"/>
  <text x="370" y="520" font-family="Arial" font-size="16" font-weight="bold">Nucleus</text>
  
  <!-- IL7 in extracellular space -->
  <circle cx="400" cy="100" r="30" fill="#ff9999" stroke="#ff0000" stroke-width="2"/>
  <text x="388" y="105" font-family="Arial" font-size="14" font-weight="bold">IL7</text>
  <text x="380" y="75" font-family="Arial" font-size="12">P13232</text>
  
  <!-- IL7 Receptor complex on plasma membrane -->
  <!-- IL7R -->
  <rect x="340" y="180" width="70" height="60" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="355" y="205" font-family="Arial" font-size="14" font-weight="bold">IL7R</text>
  <text x="355" y="225" font-family="Arial" font-size="10">P16871</text>
  
  <!-- IL2RG (coreceptor) -->
  <rect x="410" y="180" width="70" height="60" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="420" y="205" font-family="Arial" font-size="14" font-weight="bold">IL2RG</text>
  <text x="420" y="225" font-family="Arial" font-size="10">P31785</text>
  
  <!-- JAK1 and JAK3 at cytoplasmic side of plasma membrane -->
  <rect x="340" y="240" width="70" height="40" fill="#99ff99" stroke="#009900" stroke-width="2"/>
  <text x="355" y="265" font-family="Arial" font-size="14" font-weight="bold">JAK1</text>
  <text x="355" y="280" font-family="Arial" font-size="10">P23458</text>
  
  <rect x="410" y="240" width="70" height="40" fill="#99ff99" stroke="#009900" stroke-width="2"/>
  <text x="425" y="265" font-family="Arial" font-size="14" font-weight="bold">JAK3</text>
  <text x="425" y="280" font-family="Arial" font-size="10">P52333</text>
  
  <!-- STAT proteins in cytoplasm -->
  <polygon points="320,350 360,350 340,380" fill="#ffb366" stroke="#ff9933" stroke-width="2"/>
  <text x="320" y="345" font-family="Arial" font-size="14" font-weight="bold">STAT5A</text>
  <text x="320" y="360" font-family="Arial" font-size="10">P42229</text>
  
  <polygon points="440,350 480,350 460,380" fill="#cc99ff" stroke="#9933ff" stroke-width="2"/>
  <text x="440" y="345" font-family="Arial" font-size="14" font-weight="bold">STAT1</text>
  <text x="440" y="360" font-family="Arial" font-size="10">P42224</text>
  
  <!-- STAT proteins in nucleus (activated/phosphorylated) -->
  <polygon points="300,500 340,500 320,530" fill="#ffb366" stroke="#ff9933" stroke-width="2"/>
  <text x="295" y="495" font-family="Arial" font-size="14" font-weight="bold">STAT5A</text>
  <text x="275" y="550" font-family="Arial" font-size="12">Transcription Factor</text>
  
  <polygon points="460,500 500,500 480,530" fill="#cc99ff" stroke="#9933ff" stroke-width="2"/>
  <text x="460" y="495" font-family="Arial" font-size="14" font-weight="bold">STAT1</text>
  <text x="440" y="550" font-family="Arial" font-size="12">Transcription Factor</text>
  
  <!-- Binding and signaling arrows -->
  <!-- IL7 binding to receptor -->
  <line x1="400" y1="130" x2="375" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="150" font-family="Arial" font-size="12">Binding</text>
  
  <!-- JAK activation -->
  <line x1="375" y1="240" x2="375" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="445" y1="240" x2="445" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="455" y="260" font-family="Arial" font-size="12">Tyrosine Kinase</text>
  <text x="455" y="275" font-family="Arial" font-size="12">Activity</text>
  
  <!-- STAT phosphorylation -->
  <line x1="375" y1="280" x2="340" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="445" y1="280" x2="460" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="380" y="330" font-family="Arial" font-size="12">Phosphorylation</text>
  
  <!-- STAT nuclear translocation -->
  <line x1="340" y1="380" x2="320" y2="500" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="380" x2="480" y2="500" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="280" y="430" font-family="Arial" font-size="12">Nuclear</text>
  <text x="280" y="445" font-family="Arial" font-size="12">Translocation</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial" font-size="22" font-weight="bold">IL7-Mediated Signaling Pathway (Human)</text>
  
  <!-- Legend -->
  <rect x="580" y="70" width="200" height="170" fill="white" stroke="black" stroke-width="1"/>
  <text x="620" y="90" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="600" cy="110" r="10" fill="#ff9999" stroke="#ff0000" stroke-width="1"/>
  <text x="620" y="115" font-family="Arial" font-size="12">Cytokine</text>
  
  <rect x="590" y="130" width="20" height="15" fill="#99ccff" stroke="#0066cc" stroke-width="1"/>
  <text x="620" y="140" font-family="Arial" font-size="12">Receptor</text>
  
  <rect x="590" y="155" width="20" height="15" fill="#99ff99" stroke="#009900" stroke-width="1"/>
  <text x="620" y="165" font-family="Arial" font-size="12">Tyrosine Kinase</text>
  
  <polygon points="590,180 610,180 600,190" fill="#ffb366" stroke="#ff9933" stroke-width="1"/>
  <text x="620" y="185" font-family="Arial" font-size="12">STAT5A</text>
  
  <polygon points="590,200 610,200 600,210" fill="#cc99ff" stroke="#9933ff" stroke-width="1"/>
  <text x="620" y="205" font-family="Arial" font-size="12">STAT1</text>
  
  <line x1="590" y1="220" x2="610" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="620" y="225" font-family="Arial" font-size="12">Signal Flow</text>
  
  <line x1="590" y1="240" x2="610" y2="240" stroke="#000000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="620" y="245" font-family="Arial" font-size="12">Nuclear Translocation</text>
</svg>