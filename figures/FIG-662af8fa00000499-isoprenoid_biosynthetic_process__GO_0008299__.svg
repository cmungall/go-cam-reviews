<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Isoprenoid Biosynthetic Process in S. pombe</text>
  
  <!-- Cell outline -->
  <rect x="50" y="70" width="700" height="550" rx="20" ry="20" fill="#f8f8f8" stroke="#555555" stroke-width="2" />
  
  <!-- Cytosol label -->
  <text x="400" y="95" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic">Cytosol (GO:0005829)</text>
  
  <!-- ER outline -->
  <rect x="80" y="430" width="250" height="150" rx="10" ry="10" fill="#fff4e6" stroke="#d4a76a" stroke-width="2" />
  <text x="205" y="450" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Endoplasmic Reticulum (GO:0005783)</text>
  
  <!-- Mevalonate Pathway -->
  <!-- Start: Acetyl-CoA -->
  <rect x="100" y="130" width="100" height="40" rx="15" ry="15" fill="#e6f7ff" stroke="#0099cc" stroke-width="1.5" />
  <text x="150" y="155" font-family="Arial" font-size="14" text-anchor="middle">Acetyl-CoA</text>
  
  <!-- Enzyme: erg10 -->
  <rect x="130" y="180" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="150" y="196" font-family="Arial" font-size="12" text-anchor="middle">erg10</text>
  
  <!-- Product: Acetoacetyl-CoA -->
  <rect x="100" y="215" width="100" height="30" rx="15" ry="15" fill="#e6f7ff" stroke="#0099cc" stroke-width="1.5" />
  <text x="150" y="235" font-family="Arial" font-size="13" text-anchor="middle">Acetoacetyl-CoA</text>
  
  <!-- Enzyme: hcs1 -->
  <rect x="130" y="255" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="150" y="271" font-family="Arial" font-size="12" text-anchor="middle">hcs1</text>
  
  <!-- Product: HMG-CoA -->
  <rect x="100" y="290" width="100" height="30" rx="15" ry="15" fill="#e6f7ff" stroke="#0099cc" stroke-width="1.5" />
  <text x="150" y="310" font-family="Arial" font-size="13" text-anchor="middle">HMG-CoA</text>
  
  <!-- Enzyme: hmg1 -->
  <rect x="130" y="330" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="150" y="346" font-family="Arial" font-size="12" text-anchor="middle">hmg1</text>
  
  <!-- Product: Mevalonate -->
  <rect x="100" y="365" width="100" height="30" rx="15" ry="15" fill="#e6f7ff" stroke="#0099cc" stroke-width="1.5" />
  <text x="150" y="385" font-family="Arial" font-size="13" text-anchor="middle">Mevalonate</text>
  
  <!-- Middle Pathway -->
  <!-- Enzyme: erg12 -->
  <rect x="210" y="365" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="230" y="381" font-family="Arial" font-size="12" text-anchor="middle">erg12</text>
  
  <!-- Product: Phosphomevalonate -->
  <rect x="260" y="365" width="120" height="30" rx="15" ry="15" fill="#e6f7ff" stroke="#0099cc" stroke-width="1.5" />
  <text x="320" y="385" font-family="Arial" font-size="13" text-anchor="middle">Phosphomevalonate</text>
  
  <!-- Enzyme: erg8 -->
  <rect x="390" y="365" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="410" y="381" font-family="Arial" font-size="12" text-anchor="middle">erg8</text>
  
  <!-- Product: Diphosphomevalonate -->
  <rect x="440" y="365" width="130" height="30" rx="15" ry="15" fill="#e6f7ff" stroke="#0099cc" stroke-width="1.5" />
  <text x="505" y="385" font-family="Arial" font-size="13" text-anchor="middle">Diphosphomevalonate</text>
  
  <!-- Enzyme: mvd1 -->
  <rect x="505" y="405" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="525" y="421" font-family="Arial" font-size="12" text-anchor="middle">mvd1</text>
  
  <!-- Product: IPP -->
  <rect x="470" y="440" width="110" height="30" rx="15" ry="15" fill="#e6ffee" stroke="#00cc66" stroke-width="1.5" />
  <text x="525" y="455" font-family="Arial" font-size="13" text-anchor="middle">IPP</text>
  <text x="525" y="467" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:16584)</text>
  
  <!-- Enzyme: idi1 -->
  <rect x="590" y="440" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="610" y="456" font-family="Arial" font-size="12" text-anchor="middle">idi1</text>
  
  <!-- Product: DMAPP -->
  <rect x="640" y="440" width="110" height="30" rx="15" ry="15" fill="#e6ffee" stroke="#00cc66" stroke-width="1.5" />
  <text x="695" y="455" font-family="Arial" font-size="13" text-anchor="middle">DMAPP</text>
  <text x="695" y="467" font-family="Arial" font-size="10" text-anchor="middle">(isomer of IPP)</text>
  
  <!-- ER Pathway -->
  <!-- Enzyme: spo9 (ER) -->
  <rect x="120" y="480" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="140" y="496" font-family="Arial" font-size="12" text-anchor="middle">spo9</text>
  
  <!-- Product: GDP -->
  <rect x="100" y="515" width="80" height="30" rx="15" ry="15" fill="#e6ffee" stroke="#00cc66" stroke-width="1.5" />
  <text x="140" y="530" font-family="Arial" font-size="13" text-anchor="middle">GDP</text>
  <text x="140" y="542" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:17211)</text>
  
  <!-- Cytosol Pathway continuation -->
  <!-- Enzyme: fps1 (Cytosol) -->
  <rect x="420" y="500" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="440" y="516" font-family="Arial" font-size="12" text-anchor="middle">fps1</text>
  
  <!-- Product: FPP -->
  <rect x="400" y="535" width="80" height="30" rx="15" ry="15" fill="#e6ffee" stroke="#00cc66" stroke-width="1.5" />
  <text x="440" y="550" font-family="Arial" font-size="13" text-anchor="middle">FPP</text>
  <text x="440" y="562" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:17407)</text>
  
  <!-- Enzyme: erg9 -->
  <rect x="520" y="535" width="40" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="540" y="551" font-family="Arial" font-size="12" text-anchor="middle">erg9</text>
  
  <!-- Product: Squalene -->
  <rect x="600" y="535" width="80" height="30" rx="15" ry="15" fill="#e6ffee" stroke="#00cc66" stroke-width="1.5" />
  <text x="640" y="550" font-family="Arial" font-size="13" text-anchor="middle">Squalene</text>
  
  <!-- Final product: Ergosterol (simplified) -->
  <polygon points="640,575 620,590 640,605 660,590" fill="#ffff99" stroke="#cc9900" stroke-width="1.5" />
  <text x="640" y="593" font-family="Arial" font-size="13" text-anchor="middle">Ergosterol</text>
  
  <!-- Connecting arrows -->
  <!-- Acetyl-CoA to Acetoacetyl-CoA -->
  <path d="M 150,170 L 150,215" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Acetoacetyl-CoA to HMG-CoA -->
  <path d="M 150,245 L 150,290" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- HMG-CoA to Mevalonate -->
  <path d="M 150,320 L 150,365" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Mevalonate to Phosphomevalonate -->
  <path d="M 200,380 L 260,380" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Phosphomevalonate to Diphosphomevalonate -->
  <path d="M 380,380 L 440,380" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Diphosphomevalonate to IPP -->
  <path d="M 505,395 L 505,440" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- IPP to DMAPP -->
  <path d="M 580,455 L 640,455" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- IPP + DMAPP to GDP in ER -->
  <path d="M 525,470 C 525,485 475,495 200,495 C 175,495 175,495 140,515" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="4,2" />
  <path d="M 675,470 C 675,485 600,495 200,495 C 175,495 175,495 140,515" stroke="#555555" stroke-width="1.5" fill="none" stroke-dasharray="4,2" />
  
  <!-- GDP to FPP -->
  <path d="M 180,530 C 250,530 300,520 400,550" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- IPP to FPP (direct) -->
  <path d="M 525,470 C 525,490 500,510 440,535" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- FPP to Squalene -->
  <path d="M 480,550 L 600,550" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Squalene to Ergosterol -->
  <path d="M 640,565 L 640,575" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555" />
    </marker>
  </defs>
  
  <!-- Process labels -->
  <text x="250" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Mevalonate Pathway (GO:0019287)</text>
  <text x="600" y="505" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Ergosterol Biosynthesis (GO:0006696)</text>
  <text x="370" y="340" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Farnesyl Diphosphate Biosynthesis (GO:0045337)</text>
  
  <!-- Legend -->
  <rect x="100" y="635" width="600" height="50" rx="5" ry="5" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1"/>
  <!-- Molecule legend -->
  <rect x="120" y="645" width="20" height="10" rx="5" ry="5" fill="#e6f7ff" stroke="#0099cc" stroke-width="1.5" />
  <text x="150" y="653" font-family="Arial" font-size="12" text-anchor="start">Metabolic Intermediates</text>
  
  <!-- Enzyme legend -->
  <rect x="280" y="645" width="20" height="10" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="1.5" />
  <text x="310" y="653" font-family="Arial" font-size="12" text-anchor="start">Enzymes</text>
  
  <!-- Isoprenoid legend -->
  <rect x="400" y="645" width="20" height="10" rx="5" ry="5" fill="#e6ffee" stroke="#00cc66" stroke-width="1.5" />
  <text x="430" y="653" font-family="Arial" font-size="12" text-anchor="start">Isoprenoid Compounds</text>
  
  <!-- Sterol legend -->
  <polygon points="580,645 575,650 580,655 585,650" fill="#ffff99" stroke="#cc9900" stroke-width="1.5" />
  <text x="600" y="653" font-family="Arial" font-size="12" text-anchor="start">Sterol</text>
  
  <!-- Dotted line legend -->
  <line x1="120" y="670" x2="150" y2="670" stroke="#555555" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="160" y="673" font-family="Arial" font-size="12" text-anchor="start">Transport/Multiple Steps</text>
</svg>