<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Cell Structure -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Cell Compartments -->
  <!-- Nucleus -->
  <ellipse cx="200" cy="200" rx="180" ry="150" fill="#e6f2ff" stroke="#333" stroke-width="2"/>
  <text x="200" y="320" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Nucleus</text>
  
  <!-- Endoplasmic Reticulum -->
  <path d="M380 200 Q450 150 500 200 Q550 250 600 230 Q650 210 700 250" fill="none" stroke="#8a6d3b" stroke-width="3"/>
  <path d="M380 230 Q450 180 500 230 Q550 280 600 260 Q650 240 700 280" fill="none" stroke="#8a6d3b" stroke-width="3"/>
  <path d="M380 260 Q450 210 500 260 Q550 310 600 290 Q650 270 700 310" fill="none" stroke="#8a6d3b" stroke-width="3"/>
  <text x="550" y="320" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Endoplasmic Reticulum</text>
  
  <!-- Cytoplasm - indicated by the area outside nucleus but inside cell -->
  <text x="500" y="400" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Cytoplasm</text>
  
  <!-- Proteasome -->
  <rect x="600" y="400" width="120" height="60" rx="10" ry="10" fill="#d9ead3" stroke="#333" stroke-width="2"/>
  <text x="660" y="436" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Proteasome</text>
  <text x="660" y="452" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Core Complex</text>
  
  <!-- ER Stress -->
  <path d="M50 50 L100 50" stroke="red" stroke-width="4" marker-end="url(#arrowhead-red)"/>
  <text x="75" y="40" font-family="Arial" font-size="16" text-anchor="middle" fill="red" font-weight="bold">ER Stress</text>
  
  <!-- Pathway Components -->
  <!-- XBP1 in Nucleus -->
  <circle cx="150" cy="150" r="30" fill="#b3e0ff" stroke="#333" stroke-width="2"/>
  <text x="150" y="155" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">XBP1</text>
  
  <!-- ASB11 in ER -->
  <circle cx="450" cy="220" r="30" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="450" y="225" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">ASB11</text>
  
  <!-- CUL5 -->
  <circle cx="520" cy="180" r="30" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="520" y="185" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">CUL5</text>
  
  <!-- RNF7 -->
  <circle cx="590" cy="220" r="30" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="590" y="225" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">RNF7</text>
  
  <!-- BIK -->
  <circle cx="520" cy="260" r="30" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="520" y="265" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">BIK</text>
  
  <!-- VCP -->
  <circle cx="520" cy="350" r="30" fill="#99cc99" stroke="#333" stroke-width="2"/>
  <text x="520" y="355" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">VCP</text>
  
  <!-- Ubiquitin Chain on BIK -->
  <circle cx="545" cy="235" r="8" fill="#ffff00" stroke="#333" stroke-width="1"/>
  <circle cx="560" cy="235" r="8" fill="#ffff00" stroke="#333" stroke-width="1"/>
  <circle cx="575" cy="235" r="8" fill="#ffff00" stroke="#333" stroke-width="1"/>
  <text x="560" y="225" font-family="Arial" font-size="12" fill="#333">Ub</text>
  
  <!-- Arrows and Interactions -->
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="red"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006600"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#660066"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc6600"/>
    </marker>
  </defs>
  
  <!-- ER Stress to XBP1 -->
  <path d="M100 50 L130 120" stroke="red" stroke-width="3" marker-end="url(#arrowhead-red)" stroke-dasharray="5,3"/>
  <text x="85" y="90" font-family="Arial" font-size="12" fill="red" font-style="italic">ER stress</text>
  <text x="85" y="105" font-family="Arial" font-size="12" fill="red" font-style="italic">activation</text>
  
  <!-- XBP1 to ASB11 -->
  <path d="M180 150 Q300 100 420 200" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
  <text x="300" y="110" font-family="Arial" font-size="14" fill="#0066cc">Transcriptional</text>
  <text x="300" y="125" font-family="Arial" font-size="14" fill="#0066cc">Regulation</text>
  
  <!-- ASB11, CUL5, RNF7 Complex Formation -->
  <path d="M475 200 L495 185" stroke="#006600" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <path d="M545 185 L565 200" stroke="#006600" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="520" y="150" font-family="Arial" font-size="14" fill="#006600">CRL5(ASB11)</text>
  <text x="520" y="165" font-family="Arial" font-size="14" fill="#006600">Complex</text>
  
  <!-- CRL5 Complex to BIK Ubiquitination -->
  <path d="M520 210 L520 230" stroke="#660066" stroke-width="3" marker-end="url(#arrowhead-purple)"/>
  <text x="460" y="240" font-family="Arial" font-size="14" fill="#660066" font-style="italic">E3 ligase activity</text>
  <text x="575" y="240" font-family="Arial" font-size="14" fill="#660066" font-style="italic">Ubiquitination</text>
  
  <!-- BIK to VCP -->
  <path d="M520 290 L520 320" stroke="#cc6600" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
  <text x="580" y="305" font-family="Arial" font-size="14" fill="#cc6600">VCP recognizes</text>
  <text x="580" y="320" font-family="Arial" font-size="14" fill="#cc6600">ubiquitinated BIK</text>
  
  <!-- VCP to Proteasome -->
  <path d="M545 370 Q575 400 600 420" stroke="#cc6600" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
  <text x="575" y="385" font-family="Arial" font-size="14" fill="#cc6600">Transport to</text>
  <text x="575" y="400" font-family="Arial" font-size="14" fill="#cc6600">proteasome</text>
  
  <!-- Proteasome Degradation -->
  <path d="M660 460 L660 490" stroke="#333" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
  <text x="660" y="510" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">Degradation</text>
  <text x="660" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Endopeptidase activity</text>

  <!-- Process Labels -->
  <rect x="50" y="360" width="180" height="60" rx="5" ry="5" fill="#ffffcc" stroke="#333" stroke-width="1" opacity="0.9"/>
  <text x="140" y="375" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Process Overview:</text>
  <text x="140" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Endoplasmic reticulum unfolded</text>
  <text x="140" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">protein response (GO:0030968)</text>
  <text x="140" y="420" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">controls BIK degradation</text>

  <!-- Legend -->
  <rect x="310" y="470" width="280" height="120" fill="#f0f0f0" stroke="#333" stroke-width="1"/>
  <text x="450" y="485" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <circle cx="330" cy="505" r="8" fill="#b3e0ff" stroke="#333" stroke-width="1"/>
  <text x="450" y="508" font-family="Arial" font-size="12" fill="#333">XBP1 - Transcription Factor (GO:0003700)</text>
  
  <circle cx="330" cy="525" r="8" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="450" y="528" font-family="Arial" font-size="12" fill="#333">ASB11/CUL5/RNF7 - Ubiquitination Complex</text>
  
  <circle cx="330" cy="545" r="8" fill="#cc99ff" stroke="#333" stroke-width="1"/>
  <text x="450" y="548" font-family="Arial" font-size="12" fill="#333">BIK - Target Protein</text>
  
  <circle cx="330" cy="565" r="8" fill="#99cc99" stroke="#333" stroke-width="1"/>
  <text x="450" y="568" font-family="Arial" font-size="12" fill="#333">VCP - Transport Protein (GO:0140036)</text>

  <line x1="330" y1="585" x2="350" y2="585" stroke="red" stroke-width="3"/>
  <text x="450" y="588" font-family="Arial" font-size="12" fill="#333">ER stress signaling pathway</text>
  
  <line x1="420" y1="585" x2="440" y2="585" stroke="#0066cc" stroke-width="3"/>
  <text x="530" y="588" font-family="Arial" font-size="12" fill="#333">Transcriptional regulation</text>
</svg>