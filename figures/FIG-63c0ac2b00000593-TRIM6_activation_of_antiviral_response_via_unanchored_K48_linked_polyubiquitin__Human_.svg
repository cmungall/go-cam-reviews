<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" opacity="0.8"/>
  
  <!-- Nucleus -->
  <ellipse cx="250" cy="350" rx="150" ry="120" fill="#e8f4f8" stroke="#2c3e50" stroke-width="2"/>
  <text x="250" y="350" font-family="Arial" font-size="18" text-anchor="middle" fill="#2c3e50">Nucleus</text>
  
  <!-- Cytoplasm label -->
  <text x="450" y="150" font-family="Arial" font-size="18" text-anchor="middle" fill="#2c3e50">Cytoplasm</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">TRIM6 Activation of Antiviral Response via Unanchored K48-linked Polyubiquitin</text>
  
  <!-- UBE2K Protein -->
  <rect x="150" y="150" width="100" height="50" rx="10" ry="10" fill="#FF9999" stroke="#2c3e50" stroke-width="2"/>
  <text x="200" y="180" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">UBE2K</text>
  
  <!-- TRIM6 Protein -->
  <rect x="350" y="150" width="100" height="50" rx="10" ry="10" fill="#99CCFF" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="180" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">TRIM6</text>
  
  <!-- K48-linked polyubiquitin -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="15" fill="#FFD700" stroke="#2c3e50" stroke-width="1"/>
    <circle cx="20" cy="5" r="15" fill="#FFD700" stroke="#2c3e50" stroke-width="1"/>
    <circle cx="40" cy="0" r="15" fill="#FFD700" stroke="#2c3e50" stroke-width="1"/>
    <text x="20" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">K48-linked polyUb</text>
  </g>
  
  <!-- IKBKE Protein -->
  <rect x="550" y="200" width="100" height="50" rx="10" ry="10" fill="#AAFFAA" stroke="#2c3e50" stroke-width="2"/>
  <text x="600" y="230" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">IKBKE</text>
  
  <!-- STAT1 Protein (inactive) -->
  <rect x="550" y="300" width="100" height="50" rx="10" ry="10" fill="#DDDDDD" stroke="#2c3e50" stroke-width="2"/>
  <text x="600" y="330" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">STAT1</text>
  
  <!-- STAT1 Protein (active in nucleus) -->
  <rect x="200" y="400" width="100" height="50" rx="10" ry="10" fill="#FFAAFF" stroke="#2c3e50" stroke-width="2"/>
  <text x="250" y="430" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">STAT1</text>
  <text x="250" y="448" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">(activated)</text>
  
  <!-- Arrows for pathway -->
  <!-- UBE2K to TRIM6 -->
  <path d="M 250 175 L 350 175" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="300" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">ubiquitin-protein</text>
  <text x="300" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">transferase activity</text>
  
  <!-- TRIM6 to polyUb -->
  <path d="M 400 200 L 400 230" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="440" y="215" font-family="Arial" font-size="12" text-anchor="start" fill="#2c3e50">E3 ligase activity</text>
  
  <!-- polyUb to IKBKE -->
  <path d="M 450 250 L 550 225" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="500" y="235" font-family="Arial" font-size="13" text-anchor="middle" fill="#2c3e50">activates</text>
  
  <!-- IKBKE to STAT1 -->
  <path d="M 600 250 L 600 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="630" y="275" font-family="Arial" font-size="13" text-anchor="middle" fill="#2c3e50">phosphorylates</text>
  
  <!-- STAT1 translocation -->
  <path d="M 550 325 Q 400 375 300 400" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="425" y="365" font-family="Arial" font-size="13" text-anchor="middle" fill="#2c3e50">nuclear translocation</text>
  
  <!-- DNA binding by STAT1 -->
  <path d="M 250 450 C 250 470, 180 470, 180 450" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 180 450 L 180 430" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <path d="M 160 430 L 200 430" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <text x="160" y="420" font-family="Arial" font-size="13" text-anchor="start" fill="#2c3e50">DNA binding</text>
  
  <!-- Process label -->
  <text x="400" y="480" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" fill="#2c3e50">Type I Interferon-Mediated Signaling Pathway</text>
  <text x="400" y="500" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" fill="#2c3e50">Positive Regulation of Antiviral Response</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
</svg>