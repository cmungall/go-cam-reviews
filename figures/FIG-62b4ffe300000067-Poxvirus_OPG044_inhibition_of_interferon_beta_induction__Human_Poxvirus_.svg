<svg width="800" height="620" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <ellipse cx="400" cy="320" rx="350" ry="250" fill="#f0f0f0" stroke="#888888" stroke-width="3"/>
  
  <!-- Nucleus -->
  <ellipse cx="550" cy="320" rx="150" ry="120" fill="#e6e6fa" stroke="#9370db" stroke-width="3"/>
  <text x="550" y="320" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Nucleus</text>
  
  <!-- Cytoplasm label -->
  <text x="300" y="210" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Cytoplasm</text>
  
  <!-- VACWR039 (Poxvirus protein) -->
  <rect x="100" y="320" width="120" height="60" rx="10" ry="10" fill="#ff9999" stroke="#ff0000" stroke-width="2"/>
  <text x="160" y="345" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">VACWR039</text>
  <text x="160" y="365" font-family="Arial" font-size="12" text-anchor="middle">P68466</text>
  <text x="160" y="300" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#cc0000" font-weight="bold">Poxvirus</text>
  
  <!-- DDX3X -->
  <rect x="250" y="320" width="100" height="60" rx="10" ry="10" fill="#b3d9ff" stroke="#0066cc" stroke-width="2"/>
  <text x="300" y="345" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">DDX3X</text>
  <text x="300" y="365" font-family="Arial" font-size="12" text-anchor="middle">O00571</text>
  
  <!-- IKBKE -->
  <rect x="400" y="320" width="100" height="60" rx="10" ry="10" fill="#b3d9ff" stroke="#0066cc" stroke-width="2"/>
  <text x="450" y="345" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IKBKE</text>
  <text x="450" y="365" font-family="Arial" font-size="12" text-anchor="middle">Q14164</text>
  
  <!-- IRF3 -->
  <rect x="450" y="420" width="100" height="60" rx="10" ry="10" fill="#b3d9ff" stroke="#0066cc" stroke-width="2"/>
  <text x="500" y="445" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IRF3</text>
  <text x="500" y="465" font-family="Arial" font-size="12" text-anchor="middle">Q14653-5</text>
  
  <!-- IRF3 in nucleus -->
  <rect x="550" y="250" width="100" height="60" rx="10" ry="10" fill="#b3d9ff" stroke="#0066cc" stroke-width="2"/>
  <text x="600" y="275" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IRF3</text>
  <text x="600" y="295" font-family="Arial" font-size="12" text-anchor="middle">Q14653-5</text>
  
  <!-- IFNB1 gene representation -->
  <rect x="650" y="250" width="40" height="20" fill="#a0a0a0" stroke="#000000" stroke-width="1"/>
  <text x="670" y="265" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">IFNB1</text>
  
  <!-- Inhibition: VACWR039 to DDX3X -->
  <line x1="220" y1="350" x2="250" y2="350" stroke="#ff0000" stroke-width="3"/>
  <circle cx="237" cy="350" r="7" fill="#ffffff" stroke="#ff0000" stroke-width="2"/>
  <line x1="230" y1="350" x2="244" y2="350" stroke="#ff0000" stroke-width="2"/>
  <text x="235" y="340" font-family="Arial" font-size="12" fill="#cc0000" text-anchor="middle">Sequestering</text>
  
  <!-- Activation: DDX3X to IKBKE (inhibited) -->
  <line x1="350" y1="350" x2="400" y2="350" stroke="#888888" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="390,345 400,350 390,355" fill="#888888" stroke="#888888" stroke-width="1"/>
  <text x="375" y="340" font-family="Arial" font-size="12" fill="#666666" text-anchor="middle">Activates</text>
  
  <!-- Activation: IKBKE to IRF3 (inhibited) -->
  <line x1="450" y1="380" x2="480" y2="420" stroke="#888888" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="475,410 480,420 470,415" fill="#888888" stroke="#888888" stroke-width="1"/>
  <text x="470" y="405" font-family="Arial" font-size="12" fill="#666666" text-anchor="middle">Phosphorylates</text>
  
  <!-- IRF3 translocation to nucleus (inhibited) -->
  <line x1="520" y1="420" x2="570" y2="310" stroke="#888888" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="565,320 570,310 575,320" fill="#888888" stroke="#888888" stroke-width="1"/>
  <text x="550" y="380" font-family="Arial" font-size="12" fill="#666666" text-anchor="middle">Translocation</text>
  
  <!-- Activation: IRF3 to IFNB1 (inhibited) -->
  <line x1="650" y1="280" x2="650" y2="260" stroke="#888888" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="645,270 650,260 655,270" fill="#888888" stroke="#888888" stroke-width="1"/>
  <text x="675" y="270" font-family="Arial" font-size="12" fill="#666666" text-anchor="middle">Activates</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="700" height="80" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="70" y="545" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  
  <!-- Legend items -->
  <rect x="70" y="560" width="20" height="20" fill="#ff9999" stroke="#ff0000" stroke-width="1"/>
  <text x="100" y="575" font-family="Arial" font-size="14" font-weight="bold">Viral protein</text>
  
  <rect x="200" y="560" width="20" height="20" fill="#b3d9ff" stroke="#0066cc" stroke-width="1"/>
  <text x="230" y="575" font-family="Arial" font-size="14" font-weight="bold">Human protein</text>
  
  <line x1="330" y1="570" x2="360" y2="570" stroke="#ff0000" stroke-width="2"/>
  <circle cx="345" cy="570" r="5" fill="#ffffff" stroke="#ff0000" stroke-width="2"/>
  <line x1="340" y1="570" x2="350" y2="570" stroke="#ff0000" stroke-width="2"/>
  <text x="370" y="575" font-family="Arial" font-size="14" font-weight="bold">Inhibition</text>
  
  <line x1="450" y1="570" x2="480" y2="570" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="470,565 480,570 470,575" fill="#888888" stroke="#888888" stroke-width="1"/>
  <text x="490" y="575" font-family="Arial" font-size="14" font-weight="bold">Inhibited pathway</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Poxvirus-OPG044 Inhibition of Interferon Beta Induction</text>
  <text x="400" y="80" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle">Viral inhibition of host innate immune response</text>
  
  <!-- Function descriptions -->
  <text x="300" y="290" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Signaling adaptor activity</text>
  <text x="450" y="310" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Protein kinase activity</text>
  <text x="600" y="240" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">DNA-binding transcription activator</text>
  <text x="690" y="240" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">IFNB1 gene</text>
</svg>