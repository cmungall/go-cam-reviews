<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell nucleus background -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f0f4f7" stroke="#666" stroke-width="2" opacity="0.7" />
  <text x="400" y="50" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Nucleus</text>
  
  <!-- DNA double-strand break site -->
  <rect x="250" y="280" width="300" height="40" fill="#e6f0fa" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="400" y="260" font-family="Arial" font-size="14" text-anchor="middle">Site of Double-Strand Break (GO:0035861)</text>
  
  <!-- DNA break representation -->
  <path d="M350,300 L390,300 M410,300 L450,300" stroke="#333" stroke-width="4" />
  <path d="M350,320 L375,320 M425,320 L450,320" stroke="#333" stroke-width="4" />
  
  <!-- ATM Protein -->
  <circle cx="150" cy="150" r="40" fill="#ff9999" stroke="#333" stroke-width="2" />
  <text x="150" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ATM</text>
  <text x="150" y="115" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Q13315</text>
  
  <!-- H2AX Protein -->
  <rect x="300" y="150" width="80" height="40" fill="#99ccff" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="340" y="175" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">H2AX</text>
  <text x="340" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">P16104</text>
  
  <!-- PELI1 Protein -->
  <rect x="500" y="150" width="80" height="40" fill="#99ff99" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="540" y="175" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PELI1</text>
  <text x="540" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Q96FA3</text>
  
  <!-- NBN Protein -->
  <rect x="400" y="400" width="80" height="40" fill="#ffcc99" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="440" y="425" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">NBN</text>
  <text x="440" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">O60934</text>
  
  <!-- ATM to H2AX phosphorylation -->
  <path d="M185,170 L295,170" stroke="#ff0000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="240" y="160" font-family="Arial" font-size="12" text-anchor="middle">H2AXS139 kinase</text>
  <text x="240" y="190" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">GO:0035979</text>
  
  <!-- ATM to PELI1 phosphorylation -->
  <path d="M190,150 C300,100 400,100 495,150" stroke="#ff0000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="340" y="85" font-family="Arial" font-size="12" text-anchor="middle">Ser/Thr kinase</text>
  <text x="340" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">GO:0004674</text>
  
  <!-- H2AX localization to break site -->
  <path d="M340,190 L340,270" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="290" y="230" font-family="Arial" font-size="12" text-anchor="middle">Chromatin-protein</text>
  <text x="290" y="245" font-family="Arial" font-size="12" text-anchor="middle">adaptor activity</text>
  <text x="290" y="215" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">GO:0140463</text>
  
  <!-- PELI1 to break site -->
  <path d="M540,190 L480,270" stroke="#006600" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="560" y="230" font-family="Arial" font-size="12" text-anchor="middle">Ubiquitin protein</text>
  <text x="560" y="245" font-family="Arial" font-size="12" text-anchor="middle">ligase activity</text>
  <text x="560" y="215" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">GO:0061630</text>
  
  <!-- PELI1 ubiquitinates NBN -->
  <path d="M480,320 L440,395" stroke="#006600" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="400" y="360" font-family="Arial" font-size="12" text-anchor="end">K63-linked</text>
  <text x="400" y="375" font-family="Arial" font-size="12" text-anchor="end">ubiquitination</text>
  <text x="400" y="390" font-family="Arial" font-size="10" text-anchor="end" fill="#666">GO:0070534</text>
  
  <!-- NBN promotes HR repair -->
  <path d="M480,420 C550,420 620,380 620,340 L620,320" stroke="#ff9900" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="620" y="380" font-family="Arial" font-size="12" text-anchor="middle">Double-strand break repair</text>
  <text x="620" y="395" font-family="Arial" font-size="12" text-anchor="middle">via homologous recombination</text>
  <text x="620" y="410" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">GO:0000724</text>
  
  <!-- Ubiquitin symbol on NBN -->
  <circle cx="410" y="390" r="10" fill="#006600" stroke="#333" stroke-width="1" />
  <text x="410" y="394" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Ub</text>
  
  <!-- Phosphorylation symbol on H2AX -->
  <circle cx="320" y="140" r="8" fill="#ff0000" stroke="#333" stroke-width="1" />
  <text x="320" y="144" font-family="Arial" font-size="9" text-anchor="middle" fill="white">P</text>
  
  <!-- Phosphorylation symbol on PELI1 -->
  <circle cx="520" y="140" r="8" fill="#ff0000" stroke="#333" stroke-width="1" />
  <text x="520" y="144" font-family="Arial" font-size="9" text-anchor="middle" fill="white">P</text>
  
  <!-- DNA damage response label -->
  <text x="70" y="210" font-family="Arial" font-size="14" font-style="italic" text-anchor="start">DNA damage response</text>
  <text x="70" y="225" font-family="Arial" font-size="10" font-style="italic" text-anchor="start" fill="#666">GO:0006974</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="530" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Ubiquitination of NBN by PELI1 Promotes Double-Strand Break Repair via Homologous Recombination</text>
  <text x="400" y="550" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Human (NCBITaxon:9606)</text>
  
  <!-- Legend -->
  <rect x="40" y="460" width="200" height="110" fill="white" stroke="#666" stroke-width="1" rx="5" ry="5" opacity="0.9"/>
  <text x="140" y="475" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="60" y="490" r="8" fill="#ff0000" stroke="#333" stroke-width="1" />
  <text x="60" y="494" font-family="Arial" font-size="9" text-anchor="middle" fill="white">P</text>
  <text x="120" y="494" font-family="Arial" font-size="12" text-anchor="start">Phosphorylation</text>
  
  <circle cx="60" y="510" r="8" fill="#006600" stroke="#333" stroke-width="1" />
  <text x="60" y="514" font-family="Arial" font-size="9" text-anchor="middle" fill="white">Ub</text>
  <text x="120" y="514" font-family="Arial" font-size="12" text-anchor="start">Ubiquitination</text>
  
  <line x1="60" y1="530" x2="80" y2="530" stroke="#ff0000" stroke-width="2"/>
  <text x="120" y="534" font-family="Arial" font-size="12" text-anchor="start">Kinase activity</text>
  
  <line x1="60" y1="550" x2="80" y2="550" stroke="#006600" stroke-width="2"/>
  <text x="120" y="554" font-family="Arial" font-size="12" text-anchor="start">Ligase activity</text>
</svg>