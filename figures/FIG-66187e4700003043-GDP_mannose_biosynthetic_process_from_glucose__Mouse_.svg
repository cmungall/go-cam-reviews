<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline representing cytosol (GO:0005829) -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f8f8" stroke="#aaaaaa" stroke-width="2" />
  <text x="400" y="90" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">GDP-mannose Biosynthetic Process from Glucose (Mouse)</text>
  
  <!-- Metabolites (circles) -->
  <circle cx="120" cy="250" r="30" fill="#d9f0ff" stroke="#0066cc" stroke-width="2" />
  <text x="120" y="248" text-anchor="middle" font-family="Arial" font-size="13">Glucose</text>
  <text x="120" y="265" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic">CHEBI:4167</text>
  
  <circle cx="240" cy="250" r="30" fill="#d9f0ff" stroke="#0066cc" stroke-width="2" />
  <text x="240" y="243" text-anchor="middle" font-family="Arial" font-size="12">Glucose-6-P</text>
  <text x="240" y="260" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">CHEBI:58225</text>
  
  <circle cx="360" cy="250" r="30" fill="#d9f0ff" stroke="#0066cc" stroke-width="2" />
  <text x="360" y="243" text-anchor="middle" font-family="Arial" font-size="12">Fructose-6-P</text>
  <text x="360" y="260" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">CHEBI:57634</text>
  
  <circle cx="480" cy="250" r="30" fill="#d9f0ff" stroke="#0066cc" stroke-width="2" />
  <text x="480" y="243" text-anchor="middle" font-family="Arial" font-size="12">Mannose-6-P</text>
  <text x="480" y="260" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">CHEBI:17369</text>
  
  <circle cx="600" cy="250" r="30" fill="#d9f0ff" stroke="#0066cc" stroke-width="2" />
  <text x="600" y="243" text-anchor="middle" font-family="Arial" font-size="12">Mannose-1-P</text>
  <text x="600" y="260" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">CHEBI:18205</text>
  
  <circle cx="680" cy="350" r="30" fill="#e6ffcc" stroke="#009900" stroke-width="2" />
  <text x="680" y="343" text-anchor="middle" font-family="Arial" font-size="12">GDP-mannose</text>
  <text x="680" y="360" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">CHEBI:57527</text>
  
  <!-- Additional metabolites -->
  <circle cx="640" cy="400" r="20" fill="#ffe6e6" stroke="#cc0000" stroke-width="1.5" />
  <text x="640" y="400" text-anchor="middle" font-family="Arial" font-size="11">PPi</text>
  <text x="640" y="412" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">CHEBI:33019</text>
  
  <circle cx="550" cy="350" r="20" fill="#fff2cc" stroke="#ff9900" stroke-width="1.5" />
  <text x="550" y="350" text-anchor="middle" font-family="Arial" font-size="11">GTP</text>
  <text x="550" y="362" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">CHEBI:37565</text>
  
  <!-- Enzymes (rectangles) -->
  <rect x="165" y="230" width="70" height="40" rx="10" ry="10" fill="#ffcccc" stroke="#990000" stroke-width="2" />
  <text x="200" y="246" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Hk1</text>
  <text x="200" y="260" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">MGI:96103</text>
  <text x="200" y="273" text-anchor="middle" font-family="Arial" font-size="9">Glucokinase</text>
  
  <rect x="285" y="230" width="70" height="40" rx="10" ry="10" fill="#ffcccc" stroke="#990000" stroke-width="2" />
  <text x="320" y="246" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Gpi1</text>
  <text x="320" y="260" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">MGI:95797</text>
  <text x="320" y="273" text-anchor="middle" font-family="Arial" font-size="9">G6P isomerase</text>
  
  <rect x="405" y="230" width="70" height="40" rx="10" ry="10" fill="#ffcccc" stroke="#990000" stroke-width="2" />
  <text x="440" y="246" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Mpi</text>
  <text x="440" y="260" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">MGI:97075</text>
  <text x="440" y="273" text-anchor="middle" font-family="Arial" font-size="9">M6P isomerase</text>
  
  <rect x="525" y="230" width="70" height="40" rx="10" ry="10" fill="#ffcccc" stroke="#990000" stroke-width="2" />
  <text x="560" y="246" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Pmm2</text>
  <text x="560" y="260" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">MGI:1859214</text>
  <text x="560" y="273" text-anchor="middle" font-family="Arial" font-size="9">Phosphomannomutase</text>
  
  <rect x="600" y="300" width="70" height="40" rx="10" ry="10" fill="#ffcccc" stroke="#990000" stroke-width="2" />
  <text x="635" y="316" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Gmppb</text>
  <text x="635" y="330" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">MGI:2660880</text>
  <text x="635" y="343" text-anchor="middle" font-family="Arial" font-size="8">Guanylyltransferase</text>
  
  <!-- Arrows for the main pathway with gradient coloring -->
  <!-- Glucose to Glucose-6-P -->
  <defs>
    <linearGradient id="arrow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d9f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcccc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <line x1="150" y1="250" x2="165" y2="250" stroke="url(#arrow1)" stroke-width="3" />
  <polygon points="165,250 157,246 157,254" fill="#990000" />
  
  <!-- Glucose-6-P to Fructose-6-P -->
  <defs>
    <linearGradient id="arrow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffcccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d9f0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <line x1="235" y1="250" x2="285" y2="250" stroke="url(#arrow2)" stroke-width="3" />
  <polygon points="285,250 277,246 277,254" fill="#0066cc" />
  
  <!-- Fructose-6-P to Mannose-6-P -->
  <defs>
    <linearGradient id="arrow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d9f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcccc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <line x1="355" y1="250" x2="405" y2="250" stroke="url(#arrow3)" stroke-width="3" />
  <polygon points="405,250 397,246 397,254" fill="#990000" />
  
  <!-- Mannose-6-P to Mannose-1-P -->
  <defs>
    <linearGradient id="arrow4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffcccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d9f0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <line x1="475" y1="250" x2="525" y2="250" stroke="url(#arrow4)" stroke-width="3" />
  <polygon points="525,250 517,246 517,254" fill="#0066cc" />
  
  <!-- Mannose-1-P to Gmppb -->
  <defs>
    <linearGradient id="arrow5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d9f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcccc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <line x1="600" y1="280" x2="600" y2="300" stroke="url(#arrow5)" stroke-width="3" />
  <polygon points="600,300 596,292 604,292" fill="#990000" />
  
  <!-- GTP to Gmppb -->
  <defs>
    <linearGradient id="arrow6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcccc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <line x1="570" y1="350" x2="600" y2="330" stroke="url(#arrow6)" stroke-width="3" />
  <polygon points="600,330 592,334 595,325" fill="#990000" />
  
  <!-- Gmppb to GDP-mannose -->
  <defs>
    <linearGradient id="arrow7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6ffcc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <line x1="650" y1="320" x2="670" y2="330" stroke="url(#arrow7)" stroke-width="3" />
  <polygon points="670,330 662,324 666,334" fill="#009900" />
  
  <!-- Gmppb to PPi -->
  <defs>
    <linearGradient id="arrow8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe6e6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <line x1="640" y1="340" x2="640" y2="380" stroke="url(#arrow8)" stroke-width="2.5" stroke-dasharray="5,3" />
  <polygon points="640,380 636,372 644,372" fill="#cc0000" />
  
  <!-- Process label -->
  <rect x="350" y="450" width="300" height="30" rx="15" ry="15" fill="#eeeeee" stroke="#666666" stroke-width="1" />
  <text x="500" y="470" text-anchor="middle" font-family="Arial" font-size="15" font-style="italic">GDP-mannose biosynthetic process (GO:0009298)</text>
  
  <!-- Reaction steps -->
  <text x="200" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Step 1: Phosphorylation</text>
  <text x="320" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Step 2: Isomerization</text>
  <text x="440" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Step 3: Isomerization</text>
  <text x="560" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Step 4: Phosphomutation</text>
  <text x="635" y="380" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Step 5: Guanylyl transfer</text>
  
  <!-- Legend -->
  <rect x="100" y="500" width="20" height="20" fill="#d9f0ff" stroke="#0066cc" stroke-width="1.5" />
  <text x="125" y="515" font-family="Arial" font-size="13">Substrate/Intermediate</text>
  
  <rect x="250" y="500" width="20" height="20" fill="#e6ffcc" stroke="#009900" stroke-width="1.5" />
  <text x="275" y="515" font-family="Arial" font-size="13">Final Product</text>
  
  <rect x="370" y="500" width="20" height="20" rx="5" ry="5" fill="#ffcccc" stroke="#990000" stroke-width="1.5" />
  <text x="395" y="515" font-family="Arial" font-size="13">Enzyme</text>
  
  <rect x="470" y="500" width="20" height="20" fill="#ffe6e6" stroke="#cc0000" stroke-width="1.5" />
  <text x="495" y="515" font-family="Arial" font-size="13">By-product</text>
  
  <rect x="570" y="500" width="20" height="20" fill="#fff2cc" stroke="#ff9900" stroke-width="1.5" />
  <text x="595" y="515" font-family="Arial" font-size="13">Co-substrate</text>
</svg>