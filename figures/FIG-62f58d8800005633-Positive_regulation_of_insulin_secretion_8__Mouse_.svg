<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Plasma membrane -->
  <path d="M 50 150 Q 400 130 750 150 Q 400 170 50 150" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="60" y="150" font-family="Arial" font-size="12" fill="#333">Plasma membrane (GO:0005886)</text>
  
  <!-- Cytosol label -->
  <text x="400" y="300" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">Cytosol (GO:0005829)</text>
  
  <!-- Extracellular space label -->
  <text x="400" y="100" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">Extracellular space</text>
  
  <!-- Cell type label -->
  <text x="400" y="520" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">Type B pancreatic cell (CL:0000169)</text>
  
  <!-- GIP ligand -->
  <circle cx="200" cy="100" r="20" fill="#ff9999" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="105" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">GIP</text>
  <text x="200" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Receptor ligand</text>
  <text x="200" y="75" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">activity</text>
  
  <!-- GIPR receptor -->
  <rect x="180" y="130" width="40" height="40" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="155" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">GIPR</text>
  <text x="245" y="145" font-family="Arial" font-size="10" fill="#555">Gastric inhibitory peptide</text>
  <text x="245" y="155" font-family="Arial" font-size="10" fill="#555">receptor activity</text>
  
  <!-- G protein (Gnas) -->
  <circle cx="200" cy="200" r="20" fill="#99ff99" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Gnas</text>
  <text x="170" y="185" font-family="Arial" font-size="10" text-anchor="end" fill="#555">Adenylate cyclase</text>
  <text x="170" y="195" font-family="Arial" font-size="10" text-anchor="end" fill="#555">activator activity</text>
  
  <!-- Adenylate cyclase (Adcy8) -->
  <rect x="275" y="200" width="50" height="30" rx="10" ry="10" fill="#ffcc99" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="220" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Adcy8</text>
  <text x="325" y="190" font-family="Arial" font-size="10" fill="#555">Adenylate cyclase</text>
  <text x="325" y="180" font-family="Arial" font-size="10" fill="#555">activity</text>
  
  <!-- ATP -->
  <ellipse cx="260" y="250" rx="25" ry="15" fill="#ffffcc" stroke="#333" stroke-width="1"/>
  <text x="260" y="255" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">ATP</text>
  
  <!-- cAMP + PPi -->
  <ellipse cx="340" y="250" rx="25" ry="15" fill="#ffffcc" stroke="#333" stroke-width="1"/>
  <text x="340" y="255" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">cAMP</text>
  <ellipse cx="380" y="230" rx="20" ry="12" fill="#ffffcc" stroke="#333" stroke-width="1"/>
  <text x="380" y="234" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold" fill="#333">PPi</text>
  
  <!-- Rapgef4 -->
  <polygon points="400,250 440,250 430,290 410,290" fill="#cc99ff" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="270" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Rapgef4</text>
  <text x="460" y="250" font-family="Arial" font-size="10" fill="#555">Guanyl-nucleotide</text>
  <text x="460" y="260" font-family="Arial" font-size="10" fill="#555">exchange factor</text>
  <text x="460" y="270" font-family="Arial" font-size="10" fill="#555">activity</text>
  <text x="460" y="280" font-family="Arial" font-size="10" fill="#555">Protein adaptor</text>
  
  <!-- Rap1b -->
  <circle cx="500" cy="270" r="20" fill="#ff99cc" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="275" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Rap1b</text>
  <text x="500" y="245" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">G protein</text>
  <text x="500" y="255" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">activity</text>
  
  <!-- Rims2 -->
  <rect x="400" y="330" width="40" height="30" rx="5" ry="5" fill="#99ffcc" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Rims2</text>
  <text x="390" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Protein adaptor</text>
  <text x="390" y="375" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">activity</text>
  
  <!-- Rab3a -->
  <circle cx="500" cy="340" r="20" fill="#ccff99" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="345" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Rab3a</text>
  <text x="500" y="370" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Protein adaptor</text>
  <text x="500" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">activity</text>
  
  <!-- Insulin vesicles -->
  <g>
    <ellipse cx="580" cy="340" rx="30" ry="30" fill="#ffffcc" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="580" cy="340" rx="20" ry="20" fill="#ffcc99" stroke="#333" stroke-width="1"/>
    <text x="580" y="345" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">Insulin</text>
  </g>
  
  <!-- Insulin secretion -->
  <path d="M 610 340 Q 660 320 700 270 Q 720 240 720 150" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="660" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#ff0000">Insulin</text>
  <text x="660" y="240" font-family="Arial" font-size="14" font-weight="bold" fill="#ff0000">Secretion</text>
  <text x="660" y="260" font-family="Arial" font-size="10" fill="#ff0000">(GO:0030073)</text>
  
  <!-- Process labels -->
  <text x="280" y="320" font-family="Arial" font-size="12" font-style="italic" fill="#555">Adenylate cyclase-activating G protein-coupled</text>
  <text x="280" y="335" font-family="Arial" font-size="12" font-style="italic" fill="#555">receptor signaling pathway (GO:0007189)</text>
  
  <!-- Arrows connecting the pathway -->
  <!-- GIP to GIPR -->
  <path d="M 200 120 L 200 130" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- GIPR to G protein -->
  <path d="M 200 170 L 200 180" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- G protein to Adenylate cyclase -->
  <path d="M 220 200 L 275 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ATP to Adenylate cyclase -->
  <path d="M 260 235 L 280 230" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Adenylate cyclase to cAMP -->
  <path d="M 325 215 L 340 235" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- cAMP to Rapgef4 -->
  <path d="M 365 250 L 400 260" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Rapgef4 to Rap1b -->
  <path d="M 440 270 L 480 270" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Rap1b to Rims2 -->
  <path d="M 500 290 L 420 330" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Rims2 to Rab3a -->
  <path d="M 440 340 L 480 340" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Rab3a to Insulin vesicles -->
  <path d="M 520 340 L 550 340" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend box -->
  <rect x="50" y="400" width="200" height="130" rx="10" ry="10" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="420" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Legend:</text>
  <circle cx="70" cy="440" r="7" fill="#ff9999"/>
  <text x="85" y="443" font-family="Arial" font-size="11" fill="#333">Ligand (GIP)</text>
  <rect x="60" y="455" width="15" height="15" rx="2" ry="2" fill="#99ccff"/>
  <text x="85" y="467" font-family="Arial" font-size="11" fill="#333">Receptor (GIPR)</text>
  <circle cx="70" cy="485" r="7" fill="#99ff99"/>
  <text x="85" y="488" font-family="Arial" font-size="11" fill="#333">G protein (Gnas)</text>
  <rect x="60" y="495" width="15" height="15" rx="3" ry="3" fill="#ffcc99"/>
  <text x="85" y="507" font-family="Arial" font-size="11" fill="#333">Enzyme (Adcy8)</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Positive Regulation of Insulin Secretion (Mouse)</text>
</svg>