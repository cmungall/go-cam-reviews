<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Perforin Maturation Leading to Granzyme-Mediated Programmed Cell Death</text>
  <text x="400" y="55" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">(Mouse model)</text>
  
  <!-- NK Cell -->
  <ellipse cx="250" cy="250" rx="200" ry="150" fill="#e6f2ff" stroke="#000000" stroke-width="2" />
  <text x="250" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Natural Killer Cell</text>
  
  <!-- Target Cell -->
  <ellipse cx="600" cy="250" rx="150" ry="120" fill="#ffebeb" stroke="#000000" stroke-width="2" />
  <text x="600" y="150" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Target Cell</text>
  
  <!-- Immunological Synapse -->
  <path d="M 400 195 C 430 230, 450 270, 480 305" stroke="#000000" stroke-width="3" fill="none" />
  <path d="M 400 305 C 430 270, 450 230, 480 195" stroke="#000000" stroke-width="3" fill="none" />
  <text x="440" y="350" font-family="Arial" font-size="14" text-anchor="middle">Immunological Synapse</text>
  <line x1="440" y1="345" x2="440" y2="315" stroke="#000000" stroke-width="1" stroke-dasharray="3,2" />
  
  <!-- Fcgr4 Receptor -->
  <rect x="375" y="220" width="30" height="60" fill="#a6d854" stroke="#000000" stroke-width="1.5" rx="5" ry="5" />
  <text x="390" y="210" font-family="Arial" font-size="14" text-anchor="middle">Fcgr4</text>
  <text x="390" y="300" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Immune receptor</text>
  <text x="390" y="312" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">activity</text>
  
  <!-- Perforin in NK Cell -->
  <circle cx="320" cy="250" r="15" fill="#8da0cb" stroke="#000000" stroke-width="1.5" />
  <text x="320" y="254" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Prf1</text>
  <text x="320" y="280" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Ca²⁺ binding</text>
  
  <!-- Granzyme B in NK Cell -->
  <rect x="270" y="240" width="25" height="25" fill="#fc8d62" stroke="#000000" stroke-width="1.5" />
  <text x="282" y="257" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Gzmb</text>
  
  <!-- Perforin Channel -->
  <path d="M 460 250 C 470 240, 485 240, 495 250 C 485 260, 470 260, 460 250 Z" fill="#8da0cb" stroke="#000000" stroke-width="1.5" />
  <text x="477" y="230" font-family="Arial" font-size="11" text-anchor="middle">Pore</text>
  
  <!-- Granzyme B in Target -->
  <rect x="530" y="240" width="25" height="25" fill="#fc8d62" stroke="#000000" stroke-width="1.5" />
  <text x="542" y="257" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Gzmb</text>
  <text x="542" y="280" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Endopeptidase</text>
  <text x="542" y="292" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">activity</text>
  
  <!-- Cell Death Indication -->
  <path d="M 600 250 L 630 280 M 600 250 L 570 280 M 600 250 L 600 280 M 600 250 L 630 220 M 600 250 L 570 220" stroke="#ff0000" stroke-width="1.5" />
  <text x="600" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff0000" font-weight="bold">Programmed</text>
  <text x="600" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff0000" font-weight="bold">Cell Death</text>
  
  <!-- Arrows for the pathway -->
  <!-- Fcgr4 to Perforin -->
  <path d="M 375 250 L 340 250" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="357" y="240" font-family="Arial" font-size="10" text-anchor="middle">activates</text>
  
  <!-- Perforin to Channel -->
  <path d="M 335 250 L 455 250" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="395" y="240" font-family="Arial" font-size="10" text-anchor="middle">forms</text>
  
  <!-- Granzyme B through channel -->
  <path d="M 295 250 C 400 200, 450 200, 525 250" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <text x="415" y="170" font-family="Arial" font-size="10" text-anchor="middle">translocation</text>
  
  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="450" width="700" height="130" fill="#f8f8f8" stroke="#000000" stroke-width="1" />
  <text x="400" y="470" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <circle cx="80" cy="490" r="10" fill="#8da0cb" stroke="#000000" stroke-width="1" />
  <text x="100" y="494" font-family="Arial" font-size="12">Prf1 (Perforin) - Calcium ion binding</text>
  
  <rect x="80" cy="510" width="16" height="16" fill="#fc8d62" stroke="#000000" stroke-width="1" />
  <text x="103" y="522" font-family="Arial" font-size="12">Gzmb (Granzyme B) - Serine-type endopeptidase activity</text>
  
  <rect x="80" cy="530" width="16" height="16" fill="#a6d854" stroke="#000000" stroke-width="1" rx="3" ry="3" />
  <text x="103" y="542" font-family="Arial" font-size="12">Fcgr4 (Fc Receptor) - Immune receptor activity</text>
  
  <line x1="350" y1="490" x2="380" y2="490" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="400" y="494" font-family="Arial" font-size="12">Activation/Causation</text>
  
  <line x1="350" y1="510" x2="380" y2="510" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <text x="400" y="514" font-family="Arial" font-size="12">Translocation</text>
  
  <path d="M 350 535 C 360 525, 370 525, 380 535 C 370 545, 360 545, 350 535 Z" fill="#8da0cb" stroke="#000000" stroke-width="1" />
  <text x="400" y="538" font-family="Arial" font-size="12">Membrane Pore (Wide pore channel activity)</text>
  
  <path d="M 500 490 L 515 505 M 500 490 L 485 505 M 500 490 L 500 505 M 500 490 L 515 475 M 500 490 L 485 475" stroke="#ff0000" stroke-width="1.5" />
  <text x="530" y="494" font-family="Arial" font-size="12">Programmed Cell Death</text>
  
  <text x="80" y="560" font-family="Arial" font-size="11" fill="#666666" font-style="italic">Process: Natural killer cell degranulation → T cell mediated cytotoxicity → Granzyme-mediated programmed cell death</text>
</svg>