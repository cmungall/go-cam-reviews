<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  
  <!-- Cytosol label -->
  <text x="400" y="90" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Cytosol</text>
  
  <!-- Peroxisome -->
  <ellipse cx="400" cy="350" rx="250" ry="150" fill="#e6f2ff" stroke="#0066cc" stroke-width="2"/>
  <text x="400" y="230" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Peroxisome</text>
  
  <!-- Substrate and intermediate molecules - consistent color scheme -->
  <circle cx="150" cy="150" r="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="150" y="155" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Xanthine</text>
  
  <circle cx="280" cy="150" r="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="280" y="155" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Urate</text>
  
  <circle cx="200" cy="350" r="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="200" y="355" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">5-HIU</text>
  
  <circle cx="400" cy="350" r="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="400" y="355" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">OHCU</text>
  
  <circle cx="600" cy="350" r="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="600" y="355" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Allantoin</text>
  
  <!-- Enzymes - consistent color scheme -->
  <rect x="215" y="130" width="50" height="30" rx="5" ry="5" fill="#ff9999" stroke="#cc3333" stroke-width="2"/>
  <text x="240" y="150" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Xdh</text>
  
  <rect x="250" y="330" width="50" height="30" rx="5" ry="5" fill="#ff9999" stroke="#cc3333" stroke-width="2"/>
  <text x="275" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Uox</text>
  
  <rect x="450" y="330" width="50" height="30" rx="5" ry="5" fill="#ff9999" stroke="#cc3333" stroke-width="2"/>
  <text x="475" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Urah</text>
  
  <rect x="525" y="350" width="50" height="30" rx="5" ry="5" fill="#ff9999" stroke="#cc3333" stroke-width="2"/>
  <text x="550" y="370" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Urad</text>
  
  <!-- Enzyme activity labels - more space around them -->
  <rect x="240" y="95" width="160" height="30" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.9"/>
  <text x="240" y="110" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" font-weight="bold">xanthine oxidase/</text>
  <text x="240" y="123" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" font-weight="bold">dehydrogenase activity</text>
  
  <rect x="275" y="290" width="120" height="30" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.9"/>
  <text x="275" y="305" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" font-weight="bold">urate oxidase</text>
  <text x="275" y="318" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" font-weight="bold">activity</text>
  
  <rect x="475" y="290" width="150" height="30" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.9"/>
  <text x="475" y="305" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" font-weight="bold">hydroxyisourate</text>
  <text x="475" y="318" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" font-weight="bold">hydrolase activity</text>
  
  <rect x="550" y="310" width="150" height="30" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.9"/>
  <text x="550" y="325" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" font-weight="bold">OHCU decarboxylase</text>
  <text x="550" y="338" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" font-weight="bold">activity</text>
  
  <!-- Reaction arrows -->
  <line x1="170" y1="150" x2="215" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="265" y1="150" x2="280" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <path d="M280,170 Q280,250 250,330" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <line x1="220" y1="350" x2="250" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="350" x2="380" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="350" x2="450" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="350" x2="525" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="575" y1="350" x2="580" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Gene IDs -->
  <text x="240" y="170" font-family="Arial" font-size="9" text-anchor="middle">MGI:98973</text>
  <text x="275" y="370" font-family="Arial" font-size="9" text-anchor="middle">MGI:98907</text>
  <text x="475" y="370" font-family="Arial" font-size="9" text-anchor="middle">MGI:1916142</text>
  <text x="550" y="390" font-family="Arial" font-size="9" text-anchor="middle">MGI:3647519</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Xanthine Catabolic Process in Mouse</text>
  
  <!-- Transport from cytosol to peroxisome - implicit detail -->
  <path d="M280,170 Q350,200 350,250" stroke="#666" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="340" y="215" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="#666">transport</text>
  <text x="340" y="228" font-family="Arial" font-size="8" text-anchor="middle" font-style="italic" fill="#666">(implicit - not in source)</text>
  
  <!-- Final product label -->
  <text x="600" y="380" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#006600">Final product</text>
  
  <!-- Allantoin chemical structure hint -->
  <text x="600" y="395" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">CHEBI:15676</text>
</svg>