<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9" />
  
  <!-- Cell nucleus outline -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f0f0ff" stroke="#666" stroke-width="2" />
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Nucleus</text>
  
  <!-- Replication fork -->
  <path d="M200,300 Q300,200 400,300 L400,400 Q300,300 200,400 Z" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="300" y="350" text-anchor="middle" font-family="Arial" font-size="14" fill="#0066cc">Replication Fork</text>
  
  <!-- DNA strands -->
  <path d="M400,300 C450,280 500,320 550,300" stroke="#333" stroke-width="3" fill="none" />
  <path d="M400,320 C450,340 500,300 550,320" stroke="#333" stroke-width="3" fill="none" />
  
  <!-- RECQL5 Helicase -->
  <circle cx="380" cy="310" r="30" fill="#ff9966" stroke="#cc6600" stroke-width="2" />
  <text x="380" y="310" text-anchor="middle" font-family="Arial" font-size="12" fill="white">RECQL5</text>
  <text x="380" y="324" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Helicase</text>
  
  <!-- ATP/ADP conversion -->
  <circle cx="300" cy="260" r="15" fill="#66cc99" stroke="#339966" stroke-width="2" />
  <text x="300" y="264" text-anchor="middle" font-family="Arial" font-size="10" fill="white">ATP</text>
  
  <circle cx="460" cy="260" r="15" fill="#6699cc" stroke="#336699" stroke-width="2" />
  <text x="460" y="264" text-anchor="middle" font-family="Arial" font-size="10" fill="white">ADP</text>
  
  <circle cx="500" cy="260" r="12" fill="#cc99cc" stroke="#996699" stroke-width="2" />
  <text x="500" y="264" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Pi</text>
  
  <circle cx="340" cy="260" r="10" fill="#99ccff" stroke="#3399ff" stroke-width="2" />
  <text x="340" y="264" text-anchor="middle" font-family="Arial" font-size="8" fill="white">H₂O</text>
  
  <!-- Arrows for ATP conversion -->
  <path d="M315,260 L325,260" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M355,260 L365,260" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M435,260 L445,260" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M475,260 L488,260" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="380" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Input → Output</text>
  
  <!-- CDK1 -->
  <rect x="250" y="200" width="60" height="25" rx="5" ry="5" fill="#ffcc66" stroke="#cc9933" stroke-width="2" />
  <text x="280" y="217" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">CDK1</text>
  
  <!-- Arrow from CDK1 to RECQL5 -->
  <path d="M280,225 C320,250 340,260 360,290" stroke="#006600" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <text x="310" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#006600">Activates (+)</text>
  
  <!-- MUS81 -->
  <rect x="500" y="350" width="60" height="25" rx="5" ry="5" fill="#ff6666" stroke="#cc3333" stroke-width="2" />
  <text x="530" y="367" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">MUS81</text>
  
  <!-- Arrow from RECQL5 to MUS81 -->
  <path d="M410,320 C450,330 470,350 500,360" stroke="#990000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <circle cx="455" cy="340" r="8" fill="white" stroke="#990000" stroke-width="1.5" />
  <text x="455" y="343" text-anchor="middle" font-family="Arial" font-size="10">⊣</text>
  <text x="455" y="330" text-anchor="middle" font-family="Arial" font-size="10" fill="#990000">Inhibits (-)</text>
  
  <!-- Presynaptic intermediate filament cytoskeleton -->
  <path d="M200,450 C250,430 300,470 350,450 C400,430 450,470 500,450" stroke="#999" stroke-width="3" stroke-dasharray="5,3" fill="none" />
  <text x="350" y="485" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Presynaptic intermediate filament cytoskeleton</text>
  
  <!-- RAD51 -->
  <rect x="320" y="420" width="60" height="25" rx="5" ry="5" fill="#99cc66" stroke="#669933" stroke-width="2" />
  <text x="350" y="437" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">RAD51</text>
  
  <!-- Arrow from RECQL5 to RAD51 -->
  <path d="M380,340 C365,370 350,390 350,420" stroke="#006600" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <text x="345" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="#006600">Activates (+)</text>
  
  <!-- ssDNA near RAD51 -->
  <path d="M290,430 C300,425 310,435 320,430 C330,425 340,435 350,430" stroke="#333" stroke-width="1.5" fill="none" />
  <text x="290" y="420" text-anchor="start" font-family="Arial" font-size="10" fill="#333">ssDNA</text>
  
  <!-- Process label -->
  <text x="400" y="180" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Mitotic DNA-Templated DNA Replication</text>
  
  <!-- Legend -->
  <rect x="580" y="120" width="180" height="130" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1" />
  <text x="670" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
  
  <line x1="590" y1="155" x2="610" y2="155" stroke="#006600" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="670" y="158" text-anchor="start" font-family="Arial" font-size="10">Positive regulation</text>
  
  <line x1="590" y1="175" x2="610" y2="175" stroke="#990000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="670" y="178" text-anchor="start" font-family="Arial" font-size="10">Negative regulation</text>
  
  <rect x="590" y="190" width="15" height="15" fill="#ff9966" />
  <text x="670" y="200" text-anchor="start" font-family="Arial" font-size="10">Protein</text>
  
  <circle cx="597" y="225" r="7" fill="#66cc99" />
  <text x="670" y="228" text-anchor="start" font-family="Arial" font-size="10">Small molecule</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>