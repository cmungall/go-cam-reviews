<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Circadian Rhythm and Hematopoiesis Pathway in D. rerio</text>
  
  <!-- Background cellular compartments -->
  <rect x="50" y="70" width="700" height="480" fill="#f8f8f8" stroke="#cccccc" stroke-width="2" rx="10" ry="10"/>
  <text x="400" y="95" font-family="Arial" font-size="14" text-anchor="middle">Cell</text>
  
  <rect x="100" y="110" width="600" height="380" fill="#edf7ff" stroke="#99ccff" stroke-width="2" rx="10" ry="10"/>
  <text x="400" y="130" font-family="Arial" font-size="14" text-anchor="middle">Nucleus</text>
  
  <!-- Circadian Rhythm Process -->
  <ellipse cx="230" y="190" rx="120" ry="60" fill="#e6ffe6" stroke="#66cc66" stroke-width="2" opacity="0.7"/>
  <text x="230" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Circadian Rhythm</text>
  <text x="230" y="200" font-family="Arial" font-size="12" text-anchor="middle">GO:0042753/GO:0007623</text>
  
  <!-- Hematopoiesis Process -->
  <ellipse cx="560" y="190" rx="120" ry="60" fill="#ffe6e6" stroke="#cc6666" stroke-width="2" opacity="0.7"/>
  <text x="560" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Hemopoiesis</text>
  <text x="560" y="200" font-family="Arial" font-size="12" text-anchor="middle">GO:0030097/GO:1903708</text>
  
  <!-- CLOCK-BMAL Complex -->
  <rect x="120" y="290" width="120" height="40" fill="#b3d9ff" stroke="#0066cc" stroke-width="2" rx="5" ry="5"/>
  <text x="180" y="315" font-family="Arial" font-size="12" text-anchor="middle">CLOCK-BMAL Complex</text>
  <text x="180" y="330" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">(CLOCK/BMAL1B)</text>
  
  <!-- CRY1A -->
  <rect x="70" y="370" width="80" height="30" fill="#ffcc99" stroke="#ff9933" stroke-width="2" rx="5" ry="5"/>
  <text x="110" y="390" font-family="Arial" font-size="12" text-anchor="middle">CRY1A</text>
  
  <!-- EZH2 -->
  <rect x="300" y="250" width="80" height="30" fill="#d9b3ff" stroke="#6600cc" stroke-width="2" rx="5" ry="5"/>
  <text x="340" y="270" font-family="Arial" font-size="12" text-anchor="middle">EZH2</text>
  
  <!-- PER1B -->
  <rect x="220" y="370" width="80" height="30" fill="#ffb3d9" stroke="#cc0066" stroke-width="2" rx="5" ry="5"/>
  <text x="260" y="390" font-family="Arial" font-size="12" text-anchor="middle">PER1B</text>
  
  <!-- RORAA -->
  <rect x="140" y="430" width="80" height="30" fill="#b3ffb3" stroke="#00cc00" stroke-width="2" rx="5" ry="5"/>
  <text x="180" y="450" font-family="Arial" font-size="12" text-anchor="middle">RORAA</text>
  
  <!-- NR1D1 -->
  <rect x="300" y="430" width="80" height="30" fill="#ffff99" stroke="#cccc00" stroke-width="2" rx="5" ry="5"/>
  <text x="340" y="450" font-family="Arial" font-size="12" text-anchor="middle">NR1D1</text>
  
  <!-- MYB -->
  <rect x="470" y="290" width="80" height="30" fill="#ff9999" stroke="#cc0000" stroke-width="2" rx="5" ry="5"/>
  <text x="510" y="310" font-family="Arial" font-size="12" text-anchor="middle">MYB</text>
  
  <!-- LCK -->
  <rect x="580" y="290" width="80" height="30" fill="#99ffff" stroke="#00cccc" stroke-width="2" rx="5" ry="5"/>
  <text x="620" y="310" font-family="Arial" font-size="12" text-anchor="middle">LCK</text>
  
  <!-- Arrows and interactions -->
  <!-- CLOCK-BMAL to PER1B (positive) -->
  <line x1="180" y1="330" x2="235" y2="370" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="195" y="355" font-family="Arial" font-size="10" fill="#009900">+</text>
  
  <!-- EZH2 to CLOCK-BMAL (positive) -->
  <path d="M300 265 Q250 275 180 290" stroke="#009900" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="240" y="270" font-family="Arial" font-size="10" fill="#009900">+</text>
  
  <!-- EZH2 to Hematopoiesis (positive) -->
  <path d="M380 250 Q470 220 560 190" stroke="#009900" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="470" y="210" font-family="Arial" font-size="10" fill="#009900">+</text>
  
  <!-- CRY1A to CLOCK-BMAL (negative) -->
  <line x1="110" y1="370" x2="160" y2="330" stroke="#cc0000" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="125" y="345" font-family="Arial" font-size="10" fill="#cc0000">-</text>
  
  <!-- RORAA to CLOCK-BMAL (positive) -->
  <path d="M180 430 Q165 380 180 330" stroke="#009900" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="160" y="385" font-family="Arial" font-size="10" fill="#009900">+</text>
  
  <!-- NR1D1 to RORAA (negative) -->
  <line x1="300" y1="445" x2="220" y2="445" stroke="#cc0000" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="260" y="435" font-family="Arial" font-size="10" fill="#cc0000">-</text>
  
  <!-- MYB to Hematopoiesis -->
  <path d="M510 290 Q530 240 560 190" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="525" y="245" font-family="Arial" font-size="10">TF activity</text>
  
  <!-- CLOCK-BMAL to Circadian Rhythm -->
  <path d="M180 290 Q195 240 230 190" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="195" y="235" font-family="Arial" font-size="10">regulates</text>
  
  <!-- LCK to Hematopoiesis -->
  <line x1="620" y1="290" x2="590" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="270" font-family="Arial" font-size="10">part of</text>
  
  <!-- Additional EZH2 pathways -->
  <path d="M340 280 Q340 335 260 370" stroke="#009900" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="300" y="335" font-family="Arial" font-size="10" fill="#009900">+</text>
  
  <!-- Positive regulation between circadian rhythm and hematopoiesis -->
  <path d="M350 190 Q400 170 430 190" stroke="#009900" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead-green)"/>
  <text x="390" y="175" font-family="Arial" font-size="10" fill="#009900">+</text>
  
  <!-- Molecular functions labeling -->
  <text x="340" y="245" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">Transcription coactivator</text>
  <text x="110" y="365" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">Transcription corepressor</text>
  <text x="260" y="365" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">Output factor</text>
  <text x="180" y="425" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">Activator</text>
  <text x="340" y="425" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">Repressor</text>
  <text x="510" y="285" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">Transcription factor</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#009900"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="620" y="370" width="130" height="160" fill="white" stroke="black" stroke-width="1"/>
  <text x="685" y="390" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Legend</text>
  
  <line x1="630" y1="405" x2="650" y2="405" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="685" y="410" font-family="Arial" font-size="10" text-anchor="middle">Positive regulation</text>
  
  <line x1="630" y1="425" x2="650" y2="425" stroke="#cc0000" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="685" y="430" font-family="Arial" font-size="10" text-anchor="middle">Negative regulation</text>
  
  <line x1="630" y1="445" x2="650" y2="445" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="685" y="450" font-family="Arial" font-size="10" text-anchor="middle">Association</text>
  
  <line x1="630" y1="465" x2="650" y2="465" stroke="#009900" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-green)"/>
  <text x="685" y="470" font-family="Arial" font-size="10" text-anchor="middle">Indirect regulation</text>
  
  <rect x="630" y="480" width="15" height="10" fill="#e6ffe6" stroke="#66cc66" stroke-width="1"/>
  <text x="685" y="490" font-family="Arial" font-size="10" text-anchor="middle">Biological process</text>
  
  <rect x="630" y="500" width="15" height="10" fill="#b3d9ff" stroke="#0066cc" stroke-width="1"/>
  <text x="685" y="510" font-family="Arial" font-size="10" text-anchor="middle">Protein complex</text>
  
  <rect x="630" y="520" width="15" height="10" fill="#ffcc99" stroke="#ff9933" stroke-width="1"/>
  <text x="685" y="530" font-family="Arial" font-size="10" text-anchor="middle">Protein</text>
</svg>