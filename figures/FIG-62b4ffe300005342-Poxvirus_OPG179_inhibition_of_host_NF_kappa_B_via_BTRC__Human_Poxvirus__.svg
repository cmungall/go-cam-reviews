<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="500" cy="300" rx="150" ry="120" fill="#e6e6fa" stroke="#333" stroke-width="2"/>
  <text x="500" y="300" font-family="Arial" font-size="20" text-anchor="middle">Nucleus</text>
  
  <!-- Cytoplasm label -->
  <text x="300" y="200" font-family="Arial" font-size="20" text-anchor="middle">Cytoplasm</text>
  <text x="300" y="222" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">(GO:0005737)</text>
  
  <!-- Host cell cytoplasm label -->
  <text x="300" y="170" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">Host cell cytoplasm (GO:0030430)</text>
  
  <!-- Chromatin in nucleus -->
  <path d="M 450,320 Q 470,300 490,320 Q 510,340 530,320" stroke="#8A2BE2" stroke-width="3" fill="none"/>
  <path d="M 450,340 Q 470,320 490,340 Q 510,360 530,340" stroke="#8A2BE2" stroke-width="3" fill="none"/>
  <text x="490" y="360" font-family="Arial" font-size="16" text-anchor="middle">Chromatin</text>
  <text x="490" y="378" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">(GO:0000785)</text>
  
  <!-- Viral protein VACWR175 -->
  <rect x="100" y="250" width="120" height="50" rx="10" ry="10" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="160" y="278" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">VACWR175</text>
  <text x="160" y="295" font-family="Arial" font-size="14" text-anchor="middle">(UniProtKB:P31037)</text>
  
  <!-- BTRC -->
  <rect x="300" y="250" width="100" height="50" rx="10" ry="10" fill="#aed581" stroke="#333" stroke-width="2"/>
  <text x="350" y="278" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">BTRC</text>
  <text x="350" y="295" font-family="Arial" font-size="14" text-anchor="middle">(UniProtKB:Q9Y297)</text>
  
  <!-- NFKBIA -->
  <rect x="300" y="350" width="100" height="50" rx="10" ry="10" fill="#80cbc4" stroke="#333" stroke-width="2"/>
  <text x="350" y="378" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">NFKBIA</text>
  <text x="350" y="395" font-family="Arial" font-size="14" text-anchor="middle">(UniProtKB:P25963)</text>
  
  <!-- RELA -->
  <rect x="500" y="250" width="100" height="50" rx="10" ry="10" fill="#ffcc80" stroke="#333" stroke-width="2"/>
  <text x="550" y="278" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">RELA</text>
  <text x="550" y="295" font-family="Arial" font-size="14" text-anchor="middle">(UniProtKB:Q04206)</text>
  
  <!-- Arrows -->
  <!-- VACWR175 inhibits BTRC -->
  <line x1="220" y1="275" x2="290" y2="275" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="255" cy="275" r="10" fill="red" stroke="#333" stroke-width="1"/>
  <text x="255" y="279" font-family="Arial" font-size="14" text-anchor="middle" fill="white">T</text>
  
  <!-- BTRC inhibits NFKBIA -->
  <line x1="350" y1="300" x2="350" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="350" cy="320" r="10" fill="red" stroke="#333" stroke-width="1"/>
  <text x="350" y="324" font-family="Arial" font-size="14" text-anchor="middle" fill="white">T</text>
  
  <!-- NFKBIA inhibits RELA -->
  <line x1="400" y1="375" x2="500" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="450" cy="338" r="10" fill="red" stroke="#333" stroke-width="1"/>
  <text x="450" y="342" font-family="Arial" font-size="14" text-anchor="middle" fill="white">T</text>
  
  <!-- RELA to Chromatin (DNA binding) -->
  <line x1="550" y1="300" x2="550" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="320" font-family="Arial" font-size="14" text-anchor="middle">Binds</text>
  
  <!-- Function labels -->
  <text x="160" y="325" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">Protein sequestering</text>
  <text x="160" y="340" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">(GO:0140311)</text>
  
  <text x="350" y="415" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">Protein sequestering</text>
  <text x="350" y="430" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">(GO:0140311)</text>
  
  <text x="350" y="460" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">Ubiquitin-like ligase-substrate</text>
  <text x="350" y="475" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">adaptor activity (GO:1990756)</text>
  
  <text x="605" y="325" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">DNA-binding TF activity</text>
  <text x="605" y="340" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">(GO:0003700)</text>
  
  <!-- Process labels -->
  <text x="400" y="120" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Poxvirus-OPG179 inhibition of host NF-kappa-B via BTRC</text>
  <text x="400" y="150" font-family="Arial" font-size="16" text-anchor="middle">Symbiont-mediated suppression of host NF-kappaB cascade (GO:0085034)</text>
  <text x="400" y="520" font-family="Arial" font-size="16" text-anchor="middle">Non-canonical NF-kappaB signal transduction (GO:0038061)</text>
  
  <!-- Virus -->
  <path d="M 80,180 Q 100,160 120,180 L 120,220 Q 100,240 80,220 Z" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="100" y="200" font-family="Arial" font-size="16" text-anchor="middle">Poxvirus</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>