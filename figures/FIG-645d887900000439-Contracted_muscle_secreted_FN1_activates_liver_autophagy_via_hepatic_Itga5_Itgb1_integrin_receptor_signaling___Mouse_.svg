<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and title -->
  <rect width="800" height="600" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Contracted-muscle secreted FN1 activates liver autophagy via hepatic</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Itga5:Itgb1 integrin receptor signaling</text>
  
  <!-- Tissue compartments -->
  <!-- Muscle tissue -->
  <rect x="50" y="100" width="200" height="180" rx="10" ry="10" fill="#f8d7da" stroke="#721c24" stroke-width="2"/>
  <text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Contracted Muscle</text>
  
  <!-- Extracellular space -->
  <rect x="250" y="100" width="100" height="180" rx="0" ry="0" fill="#e2f0fa" stroke="#0c5460" stroke-width="2"/>
  <text x="300" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Extracellular Space</text>
  
  <!-- Hepatocyte -->
  <rect x="350" y="100" width="400" height="400" rx="10" ry="10" fill="#d4edda" stroke="#155724" stroke-width="2"/>
  <text x="550" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Hepatocyte</text>
  
  <!-- Cell membrane -->
  <line x1="350" y1="150" x2="750" y2="150" stroke="#155724" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="400" y="145" font-family="Arial" font-size="12">Plasma Membrane</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="170" font-family="Arial" font-size="12">Cytoplasm</text>
  
  <!-- FN1 in muscle -->
  <circle cx="150" cy="180" r="25" fill="#ff9999" stroke="#721c24" stroke-width="2"/>
  <text x="150" y="185" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">FN1</text>
  
  <!-- FN1 secretion -->
  <path d="M175 180 Q 225 180 275 180" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="225" y="170" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Secretion</text>
  
  <!-- FN1 in extracellular space -->
  <circle cx="300" cy="180" r="25" fill="#ff9999" stroke="#721c24" stroke-width="2"/>
  <text x="300" y="185" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">FN1</text>
  
  <!-- Integrin receptor complex -->
  <rect x="370" y="150" width="60" height="30" fill="#66cc99" stroke="#155724" stroke-width="2"/>
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Itga5:Itgb1</text>
  
  <!-- Binding -->
  <path d="M325 180 Q 350 180 370 165" fill="none" stroke="#0056b3" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="340" y="195" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Binding</text>
  
  <!-- Signaling pathway -->
  <!-- IKK kinases -->
  <circle cx="450" cy="220" r="25" fill="#ade8f4" stroke="#0c5460" stroke-width="2"/>
  <text x="450" y="225" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Ikbkb/Chuk</text>
  
  <!-- JNK -->
  <circle cx="550" cy="300" r="25" fill="#ade8f4" stroke="#0c5460" stroke-width="2"/>
  <text x="550" y="305" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Mapk8</text>
  
  <!-- Bcl2 -->
  <circle cx="650" cy="380" r="25" fill="#b5d3e7" stroke="#0c5460" stroke-width="2"/>
  <text x="650" y="385" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Bcl2</text>
  
  <!-- Becn1 -->
  <circle cx="550" cy="450" r="25" fill="#9e9ac8" stroke="#0c5460" stroke-width="2"/>
  <text x="550" y="455" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Becn1</text>
  
  <!-- Pathway connections -->
  <path d="M430 165 Q 440 190 450 195" fill="none" stroke="#0056b3" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M475 220 Q 510 260 530 285" fill="none" stroke="#0056b3" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M575 300 Q 610 340 635 365" fill="none" stroke="#0056b3" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M650 405 Q 600 430 575 445" fill="none" stroke="#d9534f" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="630" y="435" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Negative regulation</text>
  
  <!-- Process labels -->
  <text x="455" y="250" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Integrin-mediated signaling</text>
  <text x="550" y="335" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">JNK activation</text>
  <text x="650" y="415" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Adaptor activity</text>
  <text x="510" y="480" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Autophagy</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="520" width="700" height="60" rx="5" ry="5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/>
  <text x="60" y="540" font-family="Arial" font-size="12" font-weight="bold">Legend:</text>
  
  <circle cx="70" cy="560" r="10" fill="#ff9999" stroke="#721c24" stroke-width="1"/>
  <text x="85" y="565" font-family="Arial" font-size="12">FN1 (Fibronectin)</text>
  
  <rect x="180" y="550" width="20" height="15" fill="#66cc99" stroke="#155724" stroke-width="1"/>
  <text x="205" y="565" font-family="Arial" font-size="12">Integrin receptor</text>
  
  <circle cx="320" cy="560" r="10" fill="#ade8f4" stroke="#0c5460" stroke-width="1"/>
  <text x="335" y="565" font-family="Arial" font-size="12">Kinases</text>
  
  <circle cx="400" cy="560" r="10" fill="#b5d3e7" stroke="#0c5460" stroke-width="1"/>
  <text x="415" y="565" font-family="Arial" font-size="12">Adaptor protein</text>
  
  <circle cx="510" cy="560" r="10" fill="#9e9ac8" stroke="#0c5460" stroke-width="1"/>
  <text x="525" y="565" font-family="Arial" font-size="12">Autophagy protein</text>
  
  <line x1="580" y1="560" x2="610" y2="560" stroke="#0056b3" stroke-width="2.5"/>
  <polygon points="610 560, 620 563.5, 610 567" fill="#0056b3"/>
  <text x="640" y="565" font-family="Arial" font-size="12">Activation</text>
  
  <line x1="680" y1="560" x2="710" y2="560" stroke="#d9534f" stroke-width="2.5"/>
  <polygon points="710 560, 720 563.5, 710 567" fill="#d9534f"/>
  <text x="735" y="565" font-family="Arial" font-size="12">Inhibition</text>
</svg>