<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="550" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">SECTM1-CD7 Interaction Leading to Cytokine Production upon T-cell Activation</text>
  
  <!-- Epithelial cell of thymus -->
  <path d="M100,100 C50,200 50,300 100,400 C150,450 250,450 300,400 C350,300 350,200 300,100 C250,50 150,50 100,100" fill="#d9e6f2" stroke="#2c3e50" stroke-width="3" />
  <text x="200" y="90" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Epithelial Cell of Thymus</text>
  <text x="200" y="110" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">(CL:0002293)</text>
  
  <!-- T cell -->
  <circle cx="600" cy="250" r="150" fill="#ede0d5" stroke="#2c3e50" stroke-width="3" />
  <text x="600" y="125" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">T Cell</text>
  <text x="600" y="145" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">(CL:0000084)</text>
  
  <!-- Extracellular space - light shading -->
  <rect x="350" y="150" width="100" height="200" fill="#f0f0f0" fill-opacity="0.5" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,5" />
  <text x="400" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Extracellular Space</text>
  <text x="400" y="160" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">(GO:0005615)</text>
  
  <!-- SECTM1 on epithelial cell membrane -->
  <rect x="300" y="200" width="60" height="25" rx="5" ry="5" fill="#ff9999" stroke="#800000" stroke-width="2" />
  <text x="330" y="217" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#800000">SECTM1</text>
  
  <!-- CD7 on T cell membrane -->
  <rect x="440" y="200" width="60" height="25" rx="5" ry="5" fill="#99ccff" stroke="#004d99" stroke-width="2" />
  <text x="470" y="217" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#004d99">CD7</text>
  
  <!-- IFNG in extracellular space -->
  <circle cx="400" cy="180" r="20" fill="#ffcc99" stroke="#cc6600" stroke-width="2" />
  <text x="400" y="185" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#cc6600">IFNG</text>
  
  <!-- IL2 in extracellular space -->
  <circle cx="400" cy="320" r="20" fill="#99ff99" stroke="#006600" stroke-width="2" />
  <text x="400" y="325" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#006600">IL2</text>
  
  <!-- Plasma membranes -->
  <path d="M100,100 C50,200 50,300 100,400 C150,450 250,450 300,400 C350,300 350,200 300,100 C250,50 150,50 100,100" fill="none" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,3" />
  <text x="200" y="225" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">Plasma Membrane</text>
  <text x="200" y="240" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">(GO:0005886)</text>
  
  <circle cx="600" cy="250" r="150" fill="none" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,3" />
  <text x="540" y="250" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">Plasma</text>
  <text x="540" y="265" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">Membrane</text>
  <text x="540" y="280" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">(GO:0005886)</text>
  
  <!-- Arrows for the pathway -->
  <!-- IFNG activates SECTM1 -->
  <path d="M385,190 L340,200" stroke="#cc6600" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <text x="355" y="185" font-family="Arial" font-size="11" font-style="italic">activates</text>
  
  <!-- SECTM1-CD7 interaction -->
  <path d="M360,212 L440,212" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <text x="400" y="205" font-family="Arial" font-size="11" font-style="italic">binds</text>
  
  <!-- CD7 leads to IL2 production -->
  <path d="M475,225 Q450,280 410,305" stroke="#004d99" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <text x="455" y="275" font-family="Arial" font-size="11" font-style="italic">induces</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="520" y="420" width="270" height="120" fill="white" stroke="#444444" stroke-width="1" />
  <text x="535" y="440" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <rect x="535" y="450" width="15" height="15" fill="#ff9999" stroke="#800000" stroke-width="1" />
  <text x="555" y="462" font-family="Arial" font-size="12">SECTM1 (Q8WVN6) - Receptor ligand activity</text>
  
  <rect x="535" y="470" width="15" height="15" fill="#99ccff" stroke="#004d99" stroke-width="1" />
  <text x="555" y="482" font-family="Arial" font-size="12">CD7 (P09564) - Transmembrane receptor</text>
  
  <circle cx="542" cy="497" r="7" fill="#ffcc99" stroke="#cc6600" stroke-width="1" />
  <text x="555" y="502" font-family="Arial" font-size="12">IFNG (P01579) - Cytokine activity</text>
  
  <circle cx="542" cy="517" r="7" fill="#99ff99" stroke="#006600" stroke-width="1" />
  <text x="555" y="522" font-family="Arial" font-size="12">IL2 (P60568) - Cytokine activity</text>
  
  <!-- Biological processes annotations -->
  <rect x="120" y="310" width="170" height="70" fill="#f9f9f9" stroke="#aaaaaa" stroke-width="1" rx="5" ry="5" />
  <text x="205" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">GO:0002726</text>
  <text x="205" y="350" font-family="Arial" font-size="12" text-anchor="middle">Positive regulation of</text>
  <text x="205" y="365" font-family="Arial" font-size="12" text-anchor="middle">T cell cytokine production</text>
  
  <rect x="650" y="310" width="170" height="70" fill="#f9f9f9" stroke="#aaaaaa" stroke-width="1" rx="5" ry="5" />
  <text x="735" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">GO:0038110</text>
  <text x="735" y="350" font-family="Arial" font-size="12" text-anchor="middle">Interleukin-2-mediated</text>
  <text x="735" y="365" font-family="Arial" font-size="12" text-anchor="middle">signaling pathway</text>
  
  <rect x="320" y="370" width="160" height="60" fill="#f9f9f9" stroke="#aaaaaa" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="390" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">GO:0060333</text>
  <text x="400" y="410" font-family="Arial" font-size="12" text-anchor="middle">Type II interferon-mediated</text>
  <text x="400" y="425" font-family="Arial" font-size="12" text-anchor="middle">signaling pathway</text>
  
  <!-- Molecular function labels -->
  <text x="330" y="245" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#800000">GO:0048018</text>
  <text x="330" y="257" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#800000">Receptor ligand activity</text>
  
  <text x="470" y="245" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#004d99">GO:0004888</text>
  <text x="470" y="257" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#004d99">Transmembrane signaling</text>
  <text x="470" y="269" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#004d99">receptor activity</text>
  
  <text x="400" y="230" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#cc6600">GO:0005125</text>
  <text x="400" y="242" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#cc6600">Cytokine activity</text>
  
  <text x="400" y="350" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#006600">GO:0005125</text>
  <text x="400" y="362" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#006600">Cytokine activity</text>
</svg>