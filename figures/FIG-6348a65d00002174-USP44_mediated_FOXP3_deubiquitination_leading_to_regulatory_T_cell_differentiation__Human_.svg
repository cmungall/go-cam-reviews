<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background cell with compartments -->
  <rect x="100" y="50" width="600" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#888" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="400" rx="200" ry="150" fill="#e6f2ff" stroke="#000" stroke-width="3"/>
  <text x="400" y="540" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Nucleus</text>
  
  <!-- Extracellular space -->
  <rect x="50" y="100" width="700" height="100" fill="#f0f0f0" stroke="#888" stroke-width="2" rx="10" ry="10"/>
  <text x="160" y="115" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Extracellular Space</text>
  
  <!-- Cell membrane -->
  <path d="M100,200 L700,200" stroke="#888" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="710" y="200" text-anchor="start" font-family="Arial" font-size="14">Cell Membrane</text>
  
  <!-- TGFB1 in extracellular space -->
  <circle cx="250" cy="160" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="250" y="165" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">TGFB1</text>
  
  <!-- TGF-beta receptor (implicit - marked as not in source) -->
  <rect x="250" y="200" width="80" height="30" fill="#ccccff" stroke="#0000cc" stroke-width="2" rx="5" ry="5"/>
  <text x="290" y="220" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">TGFβR*</text>
  
  <!-- USP44 in nucleus -->
  <rect x="300" y="350" width="80" height="40" fill="#99cc99" stroke="#008800" stroke-width="2" rx="5" ry="5"/>
  <text x="340" y="375" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">USP44</text>
  
  <!-- FOXP3 in nucleus -->
  <rect x="500" y="350" width="80" height="40" fill="#ffcc99" stroke="#ff8800" stroke-width="2" rx="5" ry="5"/>
  <text x="540" y="375" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">FOXP3</text>
  
  <!-- Ubiquitin on FOXP3 -->
  <circle cx="500" cy="335" r="10" fill="#ffff00" stroke="#888800" stroke-width="1"/>
  <text x="500" y="339" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Ub</text>
  
  <!-- FOXP3 after deubiquitination -->
  <rect x="500" y="430" width="80" height="40" fill="#ffcc99" stroke="#ff8800" stroke-width="2" rx="5" ry="5"/>
  <text x="540" y="455" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">FOXP3</text>
  <text x="540" y="470" text-anchor="middle" font-family="Arial" font-size="10">(active)</text>
  
  <!-- Arrows for pathway -->
  <!-- TGFB1 to TGF-beta receptor -->
  <path d="M250,190 L250,200" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="230" y="195" text-anchor="end" font-family="Arial" font-size="12">Cytokine activity</text>
  
  <!-- TGF-beta receptor signaling to USP44 -->
  <path d="M290,230 C290,280 290,310 300,350" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="245" y="280" text-anchor="middle" font-family="Arial" font-size="12">TGFβ signaling</text>
  <text x="245" y="294" text-anchor="middle" font-family="Arial" font-size="12">pathway</text>
  
  <!-- USP44 to FOXP3 -->
  <path d="M380,370 L500,370" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="440" y="360" text-anchor="middle" font-family="Arial" font-size="12">Deubiquitinase</text>
  <text x="440" y="372" text-anchor="middle" font-family="Arial" font-size="12">activity</text>
  
  <!-- FOXP3 activation -->
  <path d="M540,390 L540,430" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="560" y="410" text-anchor="start" font-family="Arial" font-size="12">Deubiquitination</text>
  
  <!-- DNA binding and T cell differentiation -->
  <path d="M540,470 C540,490 440,500 400,500" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="480" y="515" text-anchor="middle" font-family="Arial" font-size="12">DNA-binding</text>
  <text x="480" y="527" text-anchor="middle" font-family="Arial" font-size="12">transcription factor</text>
  <text x="480" y="539" text-anchor="middle" font-family="Arial" font-size="12">activity</text>
  
  <!-- Final outcome -->
  <rect x="200" y="480" width="120" height="40" fill="#ffcc99" stroke="#ff8800" stroke-width="2" rx="10" ry="10"/>
  <text x="260" y="505" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Regulatory T cell</text>
  <text x="260" y="517" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">differentiation</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="50" width="150" height="70" fill="white" stroke="#888" stroke-width="1"/>
  <text x="610" y="70" font-family="Arial" font-size="12" font-weight="bold">Legend:</text>
  
  <rect x="610" y="80" width="20" height="10" fill="#ccccff" stroke="#0000cc" stroke-width="1"/>
  <text x="635" y="90" font-family="Arial" font-size="10">* Not in source</text>
  
  <circle cx="620" cy="105" r="7" fill="#ffff00" stroke="#888800" stroke-width="1"/>
  <text x="635" y="108" font-family="Arial" font-size="10">Ubiquitin</text>
</svg>