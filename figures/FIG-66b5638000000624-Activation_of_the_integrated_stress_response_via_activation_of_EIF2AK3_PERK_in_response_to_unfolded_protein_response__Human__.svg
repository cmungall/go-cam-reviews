<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="200" cy="300" rx="100" ry="120" fill="#E6F3FF" stroke="#333" stroke-width="2"/>
  <text x="200" y="300" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Nucleus</text>
  
  <!-- ER with membrane -->
  <path d="M320 150 Q 400 100 480 150 Q 550 200 630 150" fill="#FFE6E6" stroke="#333" stroke-width="1"/>
  <path d="M320 170 Q 400 120 480 170 Q 550 220 630 170" fill="none" stroke="#333" stroke-width="2"/>
  <text x="475" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">ER membrane</text>
  <text x="475" y="100" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">ER lumen</text>
  
  <!-- PERK protein in ER membrane -->
  <rect x="450" y="150" width="30" height="60" fill="#FF9999" stroke="#333" stroke-width="2"/>
  <text x="465" y="185" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">PERK</text>
  <text x="465" y="200" font-family="Arial" font-size="10" text-anchor="middle">(EIF2AK3)</text>
  
  <!-- Unfolded protein -->
  <path d="M520 110 Q 530 90 540 110 Q 550 130 560 110" fill="none" stroke="#FF6666" stroke-width="2"/>
  <text x="540" y="90" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Unfolded Protein</text>
  
  <!-- Activation arrow from unfolded protein to PERK -->
  <path d="M530 120 L 475 155" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="125" font-family="Arial" font-size="12" text-anchor="middle">Activates</text>
  
  <!-- Cytosol label -->
  <text x="500" y="300" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Cytosol</text>
  
  <!-- EIF2S1 protein -->
  <circle cx="400" cy="250" r="30" fill="#99CCFF" stroke="#333" stroke-width="2"/>
  <text x="400" y="245" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">EIF2S1</text>
  <text x="400" y="260" font-family="Arial" font-size="10" text-anchor="middle">Translation</text>
  <text x="400" y="275" font-family="Arial" font-size="10" text-anchor="middle">Initiation Factor</text>
  
  <!-- Phosphorylation arrow -->
  <path d="M450 200 L 410 230" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="420" cy="220" r="8" fill="#FFCC00" stroke="#333" stroke-width="1"/>
  <text x="420" y="223" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">P</text>
  <text x="440" y="205" font-family="Arial" font-size="12" text-anchor="middle">Phosphorylates</text>
  
  <!-- Inactive EIF2S1 -->
  <circle cx="340" cy="300" r="30" fill="#99CCFF" stroke="#333" stroke-width="2" stroke-dasharray="5,2"/>
  <line x1="320" y1="280" x2="360" y2="320" stroke="#CC0000" stroke-width="2"/>
  <text x="340" y="295" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">EIF2S1</text>
  <text x="340" y="310" font-family="Arial" font-size="10" text-anchor="middle">(Inhibited)</text>
  
  <!-- Inhibition arrow -->
  <path d="M380 260 L 355 285" fill="none" stroke="#CC0000" stroke-width="2" marker-end="url(#inhibit)"/>
  <text x="390" y="280" font-family="Arial" font-size="12" text-anchor="middle">Inhibits</text>
  
  <!-- ATF4 protein in cytosol -->
  <rect x="280" y="350" width="30" height="30" fill="#99FF99" stroke="#333" stroke-width="2"/>
  <text x="295" y="370" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">ATF4</text>
  
  <!-- ATF4 translation arrow -->
  <path d="M320 300 L 295 350" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="330" font-family="Arial" font-size="12" text-anchor="middle">Enables selective</text>
  <text x="335" y="345" font-family="Arial" font-size="12" text-anchor="middle">translation</text>
  
  <!-- ATF4 in nucleus -->
  <rect x="150" y="290" width="30" height="30" fill="#99FF99" stroke="#333" stroke-width="2"/>
  <text x="165" y="310" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">ATF4</text>
  
  <!-- ATF4 translocation arrow -->
  <path d="M280 360 Q 250 360 200 330 L 180 315" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="375" font-family="Arial" font-size="12" text-anchor="middle">Translocates</text>
  <text x="240" y="390" font-family="Arial" font-size="12" text-anchor="middle">to nucleus</text>
  
  <!-- DNA in nucleus -->
  <path d="M130 350 Q 165 330 200 350 Q 235 370 270 350" fill="none" stroke="#333" stroke-width="2"/>
  <text x="200" y="380" font-family="Arial" font-size="14" text-anchor="middle">DNA</text>
  
  <!-- ATF4 binding to DNA -->
  <path d="M165 320 L 165 350" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="340" font-family="Arial" font-size="12" text-anchor="middle">Binds DNA</text>
  <text x="200" y="420" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle">Gene expression</text>
  
  <!-- Process labels -->
  <text x="400" y="500" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">PERK-mediated Unfolded Protein Response</text>
  <text x="180" y="450" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Integrated Stress Response</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="inhibit" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <line x1="0" y1="0" x2="12" y2="12" stroke="#CC0000" stroke-width="2"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="580" y="350" width="150" height="150" fill="white" stroke="#333" stroke-width="1"/>
  <text x="655" y="370" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  
  <rect x="590" y="380" width="15" height="15" fill="#FF9999" stroke="#333" stroke-width="1"/>
  <text x="660" y="392" font-family="Arial" font-size="12">PERK/EIF2AK3</text>
  
  <circle cx="597" cy="410" r="7" fill="#99CCFF" stroke="#333" stroke-width="1"/>
  <text x="660" y="413" font-family="Arial" font-size="12">EIF2S1</text>
  
  <rect x="590" y="425" width="15" height="15" fill="#99FF99" stroke="#333" stroke-width="1"/>
  <text x="650" y="437" font-family="Arial" font-size="12">ATF4</text>
  
  <circle cx="597" cy="455" r="7" fill="#FFCC00" stroke="#333" stroke-width="1"/>
  <text x="660" y="458" font-family="Arial" font-size="12">Phosphorylation</text>
  
  <line x1="585" y1="475" x2="595" y2="485" stroke="#CC0000" stroke-width="2"/>
  <text x="650" y="480" font-family="Arial" font-size="12">Inhibition</text>
</svg>