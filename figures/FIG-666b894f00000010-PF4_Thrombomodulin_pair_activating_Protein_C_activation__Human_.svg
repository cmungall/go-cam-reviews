<svg width="800" height="550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and compartments -->
  <rect x="0" y="0" width="800" height="550" fill="#f9f9f9" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">PF4-Thrombomodulin Pathway Activating Protein C (Human)</text>
  
  <!-- Extracellular space label -->
  <rect x="50" y="60" width="700" height="190" fill="#EFF7FF" stroke="#8FA4C8" stroke-width="1" stroke-dasharray="5,3" />
  <text x="700" y="80" font-family="Arial" font-size="16" text-anchor="end" font-style="italic">Extracellular Space</text>
  
  <!-- Plasma membrane -->
  <rect x="50" y="250" width="700" height="20" fill="#8FA4C8" stroke="#666" stroke-width="1" />
  <text x="700" y="240" font-family="Arial" font-size="16" text-anchor="end" font-style="italic">Plasma Membrane</text>
  
  <!-- Cytoplasm label -->
  <rect x="50" y="270" width="700" height="100" fill="#FFF5EE" stroke="#8FA4C8" stroke-width="1" stroke-dasharray="5,3" />
  <text x="700" y="290" font-family="Arial" font-size="16" text-anchor="end" font-style="italic">Cytoplasm</text>
  
  <!-- Cell type label -->
  <text x="150" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Endothelial Cell</text>
  
  <!-- PF4 protein -->
  <circle cx="150" cy="120" r="30" fill="#FFD700" stroke="#000" stroke-width="2" />
  <text x="150" y="125" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">PF4</text>
  <text x="150" y="140" font-family="Arial" font-size="11" text-anchor="middle">(P02776)</text>
  
  <!-- Thrombomodulin receptor -->
  <rect x="300" y="220" width="60" height="60" fill="#90EE90" stroke="#000" stroke-width="2" />
  <text x="330" y="245" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">THBD</text>
  <text x="330" y="260" font-family="Arial" font-size="11" text-anchor="middle">(P07204)</text>
  
  <!-- Thrombin -->
  <circle cx="450" cy="150" r="30" fill="#FF6347" stroke="#000" stroke-width="2" />
  <text x="450" y="155" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">F2</text>
  <text x="450" y="170" font-family="Arial" font-size="11" text-anchor="middle">(P00734)</text>
  
  <!-- Protein C -->
  <circle cx="600" cy="150" r="30" fill="#87CEFA" stroke="#000" stroke-width="2" />
  <text x="600" y="155" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">PROC</text>
  <text x="600" y="170" font-family="Arial" font-size="11" text-anchor="middle">(P04070)</text>
  
  <!-- Activated Protein C -->
  <circle cx="600" cy="80" r="30" fill="#1E90FF" stroke="#000" stroke-width="2" />
  <text x="600" y="85" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">APC</text>
  <text x="600" y="100" font-family="Arial" font-size="11" text-anchor="middle">(Activated)</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowPositive" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006400" />
    </marker>
    <marker id="arrowNegative" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B0000" />
    </marker>
    <marker id="arrowNeutral" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Arrows and interactions -->
  <!-- PF4 to Thrombomodulin -->
  <path d="M180 120 Q 250 120 300 240" fill="none" stroke="#006400" stroke-width="2" marker-end="url(#arrowPositive)" />
  <rect x="210" y="100" width="100" height="36" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="260" y="120" font-family="Arial" font-size="12" text-anchor="middle" fill="#006400">RO:0002629</text>
  <text x="260" y="132" font-family="Arial" font-size="11" text-anchor="middle" fill="#006400">positively regulates</text>
  
  <!-- Thrombomodulin to Thrombin -->
  <path d="M360 240 Q 400 200 450 180" fill="none" stroke="#8B0000" stroke-width="2" marker-end="url(#arrowNegative)" />
  <rect x="375" y="190" width="100" height="36" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="425" y="210" font-family="Arial" font-size="12" text-anchor="middle" fill="#8B0000">RO:0002413</text>
  <text x="425" y="222" font-family="Arial" font-size="11" text-anchor="middle" fill="#8B0000">negatively regulates</text>
  
  <!-- Thrombin to Protein C -->
  <path d="M480 150 L 570 150" fill="none" stroke="#006400" stroke-width="2" marker-end="url(#arrowPositive)" />
  <rect x="495" y="120" width="100" height="36" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="545" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="#006400">RO:0002629</text>
  <text x="545" y="152" font-family="Arial" font-size="11" text-anchor="middle" fill="#006400">positively regulates</text>
  
  <!-- Protein C to Activated Protein C -->
  <path d="M600 120 L 600 80" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowNeutral)" stroke-dasharray="5,3" />
  <text x="615" y="100" font-family="Arial" font-size="11" fill="#666">activation*</text>
  
  <!-- Process label -->
  <rect x="300" y="400" width="200" height="40" fill="#E6E6FA" stroke="#666" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="420" font-family="Arial" font-size="14" text-anchor="middle">GO:0030195</text>
  <text x="400" y="435" font-family="Arial" font-size="12" text-anchor="middle">Negative regulation of blood coagulation</text>
  
  <!-- Function labels -->
  <rect x="100" y="70" width="100" height="30" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="150" y="85" font-family="Arial" font-size="11" text-anchor="middle">GO:0048018</text>
  <text x="150" y="97" font-family="Arial" font-size="11" text-anchor="middle">Receptor ligand activity</text>
  
  <rect x="280" y="290" width="100" height="30" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="330" y="305" font-family="Arial" font-size="11" text-anchor="middle">GO:0038023</text>
  <text x="330" y="317" font-family="Arial" font-size="11" text-anchor="middle">Signaling receptor activity</text>
  
  <rect x="400" y="100" width="100" height="30" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="450" y="115" font-family="Arial" font-size="11" text-anchor="middle">GO:0004252</text>
  <text x="450" y="127" font-family="Arial" font-size="11" text-anchor="middle">Serine-type endopeptidase</text>
  
  <rect x="550" y="100" width="100" height="30" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="600" y="115" font-family="Arial" font-size="11" text-anchor="middle">GO:0004252</text>
  <text x="600" y="127" font-family="Arial" font-size="11" text-anchor="middle">Serine-type endopeptidase</text>
  
  <!-- Legend -->
  <rect x="50" y="470" width="700" height="60" fill="#f0f0f0" stroke="#666" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="485" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <line x1="70" y1="500" x2="120" y2="500" stroke="#006400" stroke-width="2" marker-end="url(#arrowPositive)" />
  <text x="180" y="505" font-family="Arial" font-size="12">Positive regulation</text>
  
  <line x1="250" y1="500" x2="300" y2="500" stroke="#8B0000" stroke-width="2" marker-end="url(#arrowNegative)" />
  <text x="360" y="505" font-family="Arial" font-size="12">Negative regulation</text>
  
  <line x1="430" y1="500" x2="480" y2="500" stroke="#666" stroke-width="2" marker-end="url(#arrowNeutral)" stroke-dasharray="5,3" />
  <text x="530" y="505" font-family="Arial" font-size="12">Implicit relationship (not in source)</text>
  
  <!-- Note about additions -->
  <text x="400" y="530" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="#666">*Activated Protein C (APC) representation added for clarity but not explicitly in source GO-CAM</text>
</svg>