<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with soft gradient -->
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9f9f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker definition -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
  </defs>
  
  <!-- Background rectangle -->
  <rect x="0" y="0" width="800" height="600" fill="url(#bg_gradient)" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Ascorbic Acid Biosynthetic Pathway (Mouse)</text>
  
  <!-- Cell compartment outline (liver cell) -->
  <rect x="70" y="80" width="660" height="400" rx="20" ry="20" fill="#FFFDF0" stroke="#A9A9A9" stroke-width="2" stroke-dasharray="5,5" />
  <text x="120" y="100" font-family="Arial" font-size="18" font-style="italic" font-weight="bold" fill="#8B4513">Liver Cell</text>
  
  <!-- Substrate: β-D-glucose 1-phosphate -->
  <rect x="90" y="120" width="120" height="60" rx="10" ry="10" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2" />
  <text x="150" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">β-D-glucose 1-phosphate</text>
  <text x="150" y="170" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">CHEBI:16218</text>
  
  <!-- Reaction 1: Ugp2 -->
  <rect x="270" y="120" width="150" height="60" rx="10" ry="10" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" />
  <text x="345" y="145" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Ugp2</text>
  <text x="345" y="165" font-family="Arial" font-size="12" text-anchor="middle">UTP-monosaccharide-1-phosphate</text>
  <text x="345" y="177" font-family="Arial" font-size="12" text-anchor="middle">uridylyltransferase activity</text>
  
  <!-- Reaction 2: Ugdh -->
  <rect x="480" y="120" width="150" height="60" rx="10" ry="10" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" />
  <text x="555" y="145" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Ugdh</text>
  <text x="555" y="165" font-family="Arial" font-size="12" text-anchor="middle">UDP-glucose</text>
  <text x="555" y="177" font-family="Arial" font-size="12" text-anchor="middle">6-dehydrogenase activity</text>
  
  <!-- Reaction 3: Ugt1a6a -->
  <rect x="570" y="220" width="150" height="60" rx="10" ry="10" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" />
  <text x="645" y="245" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Ugt1a6a</text>
  <text x="645" y="265" font-family="Arial" font-size="12" text-anchor="middle">alpha-glucuronidase</text>
  <text x="645" y="277" font-family="Arial" font-size="12" text-anchor="middle">activity</text>
  
  <!-- Reaction 4: Akr1b1 -->
  <rect x="480" y="320" width="150" height="60" rx="10" ry="10" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" />
  <text x="555" y="345" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Akr1b1</text>
  <text x="555" y="365" font-family="Arial" font-size="12" text-anchor="middle">L-glucuronate reductase</text>
  <text x="555" y="377" font-family="Arial" font-size="12" text-anchor="middle">activity</text>
  
  <!-- Reaction 5: Rgn -->
  <rect x="270" y="320" width="150" height="60" rx="10" ry="10" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" />
  <text x="345" y="345" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Rgn</text>
  <text x="345" y="365" font-family="Arial" font-size="12" text-anchor="middle">gluconolactonase</text>
  <text x="345" y="377" font-family="Arial" font-size="12" text-anchor="middle">activity</text>
  
  <!-- Reaction 6: Gulo -->
  <rect x="90" y="320" width="150" height="60" rx="10" ry="10" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" />
  <text x="165" y="345" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Gulo</text>
  <text x="165" y="365" font-family="Arial" font-size="12" text-anchor="middle">L-gulonolactone oxidase</text>
  <text x="165" y="377" font-family="Arial" font-size="12" text-anchor="middle">activity</text>
  
  <!-- Product: L-ascorbate -->
  <rect x="90" y="420" width="120" height="60" rx="10" ry="10" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" />
  <text x="150" y="450" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">L-ascorbate</text>
  <text x="150" y="470" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(Vitamin C)</text>
  <text x="150" y="485" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">CHEBI:38290</text>
  
  <!-- Intermediate metabolites (implied) with curved connectors -->
  <!-- UDP-glucose -->
  <rect x="345" y="90" width="80" height="25" rx="5" ry="5" fill="#FCF3CF" stroke="#D4AC0D" stroke-width="1" stroke-dasharray="3,1"/>
  <text x="385" y="107" font-family="Arial" font-size="12" text-anchor="middle" fill="#777">UDP-glucose</text>
  <line x1="345" y1="120" x2="345" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- UDP-glucuronate -->
  <rect x="555" y="90" width="110" height="25" rx="5" ry="5" fill="#FCF3CF" stroke="#D4AC0D" stroke-width="1" stroke-dasharray="3,1"/>
  <text x="610" y="107" font-family="Arial" font-size="12" text-anchor="middle" fill="#777">UDP-glucuronate</text>
  
  <!-- Glucuronate -->
  <rect x="715" y="220" width="80" height="25" rx="5" ry="5" fill="#FCF3CF" stroke="#D4AC0D" stroke-width="1" stroke-dasharray="3,1"/>
  <text x="755" y="237" font-family="Arial" font-size="12" text-anchor="middle" fill="#777">Glucuronate</text>
  
  <!-- L-gulonate -->
  <rect x="555" y="290" width="80" height="25" rx="5" ry="5" fill="#FCF3CF" stroke="#D4AC0D" stroke-width="1" stroke-dasharray="3,1"/>
  <text x="595" y="307" font-family="Arial" font-size="12" text-anchor="middle" fill="#777">L-gulonate</text>
  
  <!-- L-gulonolactone -->
  <rect x="345" y="290" width="110" height="25" rx="5" ry="5" fill="#FCF3CF" stroke="#D4AC0D" stroke-width="1" stroke-dasharray="3,1"/>
  <text x="400" y="307" font-family="Arial" font-size="12" text-anchor="middle" fill="#777">L-gulonolactone</text>
  
  <!-- Arrows connecting reactions -->
  <line x1="210" y1="150" x2="270" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="420" y1="150" x2="480" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="630" y1="150" x2="680" y2="150" stroke="#555" stroke-width="1.5" />
  <line x1="680" y1="150" x2="680" y2="220" stroke="#555" stroke-width="1.5" />
  <line x1="680" y1="220" x2="720" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <line x1="570" y1="250" x2="520" y2="250" stroke="#555" stroke-width="1.5" />
  <line x1="520" y1="250" x2="520" y2="320" stroke="#555" stroke-width="1.5" />
  <line x1="520" y1="320" x2="480" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <line x1="480" y1="350" x2="420" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="270" y1="350" x2="240" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="150" y1="380" x2="150" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Legend -->
  <rect x="70" y="500" width="660" height="90" rx="5" ry="5" fill="#f8f8f8" stroke="#ddd" stroke-width="1" />
  <text x="400" y="520" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
  
  <!-- Legend items -->
  <rect x="90" y="530" width="20" height="20" fill="#D6EAF8" stroke="#2E86C1" stroke-width="1" />
  <text x="120" y="545" font-family="Arial" font-size="14" text-anchor="start">Substrate</text>
  
  <rect x="200" y="530" width="20" height="20" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" />
  <text x="230" y="545" font-family="Arial" font-size="14" text-anchor="start">Enzyme/Molecular Function</text>
  
  <rect x="450" y="530" width="20" height="20" fill="#FADBD8" stroke="#E74C3C" stroke-width="1" />
  <text x="480" y="545" font-family="Arial" font-size="14" text-anchor="start">Final Product (Vitamin C)</text>
  
  <rect x="90" y="560" width="20" height="20" fill="#FCF3CF" stroke="#D4AC0D" stroke-width="1" stroke-dasharray="3,1"/>
  <text x="120" y="575" font-family="Arial" font-size="14" text-anchor="start">Intermediate Metabolites</text>
  <text x="350" y="575" font-family="Arial" font-size="12" fill="#777" font-style="italic" text-anchor="start">(implied but not explicitly in the GO-CAM model)</text>
  
  <!-- Overall pathway label -->
  <text x="400" y="490" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" text-anchor="middle">Part of biosynthetic process (GO:0009058)</text>
</svg>