<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background cellular components -->
  <!-- Cell Membrane -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#F8F8F8" stroke="#444444" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="200" cy="400" rx="120" ry="100" fill="#E6F2FF" stroke="#444444" stroke-width="2"/>
  <text x="200" y="400" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Nucleus</text>
  
  <!-- ER Membrane -->
  <path d="M400,200 Q500,150 600,200 Q650,220 700,180" stroke="#FF9999" stroke-width="3" fill="none"/>
  <text x="550" y="160" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">ER Membrane</text>

  <!-- Golgi Apparatus -->
  <path d="M350,250 Q450,270 550,250 Q650,230 750,270" stroke="#99CCFF" stroke-width="3" fill="none"/>
  <path d="M350,270 Q450,290 550,270 Q650,250 750,290" stroke="#99CCFF" stroke-width="3" fill="none"/>
  <path d="M350,290 Q450,310 550,290 Q650,270 750,310" stroke="#99CCFF" stroke-width="3" fill="none"/>
  <text x="550" y="250" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Golgi Membrane</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="350" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm</text>
  
  <!-- Proteins and interactions -->
  <!-- Step 1: INSIG1 sequestering SREBF2-SCAP in ER -->
  <rect cx="550" cy="200" x="530" y="180" width="40" height="40" rx="5" ry="5" fill="#FFC0CB" stroke="#000000" stroke-width="1.5"/>
  <text x="550" y="204" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">INSIG1</text>
  <text x="600" y="190" font-family="Arial" font-size="10" font-style="italic">Sequesters SREBF2-SCAP</text>
  
  <rect cx="480" cy="200" x="450" y="180" width="60" height="40" rx="5" ry="5" fill="#FFFF99" stroke="#000000" stroke-width="1.5"/>
  <text x="480" y="196" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">SREBF2</text>
  <text x="480" y="208" text-anchor="middle" font-family="Arial" font-size="10">SCAP</text>
  
  <path d="M510,200 L530,200" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="520" y="190" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">1</text>
  
  <!-- Step 2: PAQR3 anchoring SREBF2-SCAP to Golgi -->
  <rect cx="480" cy="270" x="450" y="250" width="60" height="40" rx="5" ry="5" fill="#FFFF99" stroke="#000000" stroke-width="1.5"/>
  <text x="480" y="266" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">SREBF2</text>
  <text x="480" y="278" text-anchor="middle" font-family="Arial" font-size="10">SCAP</text>
  
  <polygon points="550,250 570,270 550,290 530,270" fill="#9370DB" stroke="#000000" stroke-width="1.5"/>
  <text x="550" y="274" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">PAQR3</text>
  <text x="600" y="270" font-family="Arial" font-size="10" font-style="italic">Anchors complex to Golgi</text>
  
  <path d="M510,270 L530,270" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="520" y="260" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">2</text>
  
  <!-- Step 3: MBTPS2 cleaving SREBF2 -->
  <circle cx="400" cy="270" r="20" fill="#32CD32" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="274" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">MBTPS2</text>
  <text x="400" y="300" font-family="Arial" font-size="10" font-style="italic">Metalloendopeptidase</text>
  
  <path d="M420,270 L450,270" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="435" y="260" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">3</text>
  
  <!-- Step 4: Cleaved SREBF2 in cytoplasm -->
  <rect cx="350" cy="350" x="330" y="330" width="40" height="40" rx="5" ry="5" fill="#FFFF99" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="354" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">SREBF2</text>
  <text x="350" y="380" font-family="Arial" font-size="10" font-style="italic">Cleaved form</text>
  
  <path d="M390,285 L360,330" stroke="#000000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: KPNB1 importing SREBF2 into nucleus -->
  <ellipse cx="270" cy="350" rx="25" ry="20" fill="#FF7F50" stroke="#000000" stroke-width="1.5"/>
  <text x="270" y="354" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">KPNB1</text>
  <text x="270" y="380" font-family="Arial" font-size="10" font-style="italic">Nuclear importer</text>
  
  <path d="M295,350 L330,350" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="312" y="340" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">4</text>
  
  <!-- Step 6: SREBF2 in nucleus -->
  <rect cx="200" cy="350" x="180" y="330" width="40" height="40" rx="5" ry="5" fill="#FFFF99" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="354" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">SREBF2</text>
  <text x="150" y="340" font-family="Arial" font-size="10" font-style="italic">Transcription factor</text>
  
  <path d="M245,350 L180,350" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="212" y="340" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">5</text>
  
  <!-- Step 7: SREBF2 binding to DNA to activate cholesterol biosynthesis -->
  <rect x="170" y="420" width="60" height="20" fill="#87CEEB" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="434" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">DNA</text>
  
  <path d="M200,370 L200,420" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="395" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">6</text>
  
  <!-- Cholesterol output -->
  <path d="M170,470 L230,470 L220,490 L180,490 Z" fill="#FFD700" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="483" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Cholesterol</text>
  <text x="260" y="480" font-family="Arial" font-size="10" font-style="italic">Increased biosynthesis</text>
  
  <path d="M200,440 L200,470" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="455" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">7</text>
  
  <!-- Arrow from ER to Golgi -->
  <path d="M480,220 Q480,245 480,250" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Positive Regulation of Cholesterol Biosynthesis by PAQR3</text>
  
  <!-- Legend -->
  <rect x="50" y="560" width="700" height="80" rx="10" ry="10" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
  <text x="400" y="575" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <rect x="60" y="585" width="20" height="15" fill="#FFFF99" stroke="#000000" stroke-width="1"/>
  <text x="88" y="598" font-family="Arial" font-size="13">SREBF2/SCAP - Sterol regulatory element-binding protein 2 & SCAP complex</text>
  
  <rect x="60" y="605" width="20" height="15" fill="#FFC0CB" stroke="#000000" stroke-width="1"/>
  <text x="88" y="618" font-family="Arial" font-size="13">INSIG1 - Insulin-induced gene 1 protein</text>
  
  <polygon points="270,585 290,592 270,600 250,592" fill="#9370DB" stroke="#000000" stroke-width="1" transform="scale(0.75)" x="-140" y="20"/>
  <text x="88" y="638" font-family="Arial" font-size="13">PAQR3 - Progestin and adipoQ receptor family member 3</text>
  
  <circle cx="350" cy="592" r="8" fill="#32CD32" stroke="#000000" stroke-width="1" transform="translate(-290, 20)"/>
  <text x="388" y="618" font-family="Arial" font-size="13">MBTPS2 - Membrane-bound transcription factor site-2 protease</text>
  
  <ellipse cx="440" cy="592" rx="10" ry="8" fill="#FF7F50" stroke="#000000" stroke-width="1" transform="translate(-90, 20)"/>
  <text x="388" y="638" font-family="Arial" font-size="13">KPNB1 - Importin subunit beta-1</text>
  
  <rect x="500" y="585" width="20" height="15" fill="#87CEEB" stroke="#000000" stroke-width="1"/>
  <text x="528" y="598" font-family="Arial" font-size="13">DNA - Target genes for cholesterol biosynthesis</text>
  
  <path d="M580,585 L610,585 L605,600 L585,600 Z" fill="#FFD700" stroke="#000000" stroke-width="1" transform="scale(0.75)"/>
  <text x="618" y="598" font-family="Arial" font-size="13">Cholesterol - End product of pathway</text>
  
  <text x="528" y="618" font-family="Arial" font-size="13">1-7: Sequential steps in cholesterol biosynthesis pathway</text>
</svg>