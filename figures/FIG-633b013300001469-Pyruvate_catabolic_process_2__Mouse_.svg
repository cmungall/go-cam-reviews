<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="600" rx="20" ry="20" fill="#f9f9f9" stroke="#888" stroke-width="2" />
  
  <!-- Mitochondrion -->
  <ellipse cx="400" cy="350" rx="300" ry="200" fill="#ffe3e3" stroke="#444" stroke-width="2" />
  
  <!-- Mitochondrial outer membrane -->
  <ellipse cx="400" cy="350" rx="300" ry="200" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="none" />
  
  <!-- Mitochondrial inner membrane -->
  <ellipse cx="400" cy="350" rx="260" ry="160" fill="#ffddb3" stroke="#444" stroke-width="3" />
  
  <!-- Matrix label -->
  <text x="400" y="250" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Mitochondrial Matrix</text>
  <text x="400" y="270" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0005759)</text>
  
  <!-- Intermembrane space label -->
  <text x="275" y="350" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#444">Intermembrane</text>
  <text x="275" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#444">Space</text>
  <text x="275" y="390" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="#444">(GO:0005758)</text>
  
  <!-- Cytosol label -->
  <text x="120" y="100" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cytosol</text>
  <text x="120" y="120" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0005829)</text>
  
  <!-- Pyruvate in cytosol -->
  <circle cx="150" cy="180" r="20" fill="#a1c5ff" stroke="#000" stroke-width="1.5" />
  <text x="150" y="185" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Pyruvate</text>
  
  <!-- VDAC1 in outer membrane -->
  <rect x="240" y="300" width="80" height="30" rx="15" ry="15" fill="#ff9f9f" stroke="#000" stroke-width="1.5" />
  <text x="280" y="320" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">VDAC1</text>
  
  <!-- VDAC1 annotation -->
  <text x="180" y="285" font-family="Arial" font-size="11" text-anchor="start" fill="#444">Voltage-gated anion</text>
  <text x="180" y="297" font-family="Arial" font-size="11" text-anchor="start" fill="#444">channel activity</text>
  <text x="180" y="309" font-family="Arial" font-size="9" text-anchor="start" font-style="italic" fill="#444">(GO:0008308)</text>
  
  <!-- MPC1/MPC2 in inner membrane -->
  <rect x="305" y="360" width="80" height="30" rx="15" ry="15" fill="#b3d9ff" stroke="#000" stroke-width="1.5" />
  <text x="345" y="375" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">MPC1/2</text>
  
  <!-- MPC1/2 annotation -->
  <text x="390" y="340" font-family="Arial" font-size="11" text-anchor="start" fill="#444">Pyruvate transmembrane</text>
  <text x="390" y="352" font-family="Arial" font-size="11" text-anchor="start" fill="#444">transporter activity</text>
  <text x="390" y="364" font-family="Arial" font-size="9" text-anchor="start" font-style="italic" fill="#444">(GO:0050833)</text>
  
  <!-- Pyruvate in intermembrane space -->
  <circle cx="220" y="350" r="15" fill="#a1c5ff" stroke="#000" stroke-width="1.5" />
  <text x="220" y="355" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Pyruvate</text>
  
  <!-- Pyruvate in matrix -->
  <circle cx="380" y="410" r="15" fill="#a1c5ff" stroke="#000" stroke-width="1.5" />
  <text x="380" y="415" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Pyruvate</text>
  
  <!-- PDH Complex -->
  <rect x="430" y="350" width="160" height="100" rx="10" ry="10" fill="#ffdb99" stroke="#000" stroke-width="2" />
  <text x="510" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PDH Complex</text>
  <text x="510" y="385" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(GO:0045254)</text>
  
  <!-- Components inside PDH Complex -->
  <circle cx="460" y="410" r="15" fill="#ffd280" stroke="#000" stroke-width="1" />
  <text x="460" y="414" font-family="Arial" font-size="9" text-anchor="middle">PDHA1/2</text>
  
  <circle cx="495" y="410" r="15" fill="#ffd280" stroke="#000" stroke-width="1" />
  <text x="495" y="414" font-family="Arial" font-size="9" text-anchor="middle">PDHB</text>
  
  <circle cx="530" y="410" r="15" fill="#ffd280" stroke="#000" stroke-width="1" />
  <text x="530" y="414" font-family="Arial" font-size="9" text-anchor="middle">DLAT</text>
  
  <circle cx="565" y="410" r="15" fill="#ffd280" stroke="#000" stroke-width="1" />
  <text x="565" y="414" font-family="Arial" font-size="9" text-anchor="middle">DLD</text>
  
  <circle cx="510" y="435" r="15" fill="#ffd280" stroke="#000" stroke-width="1" />
  <text x="510" y="439" font-family="Arial" font-size="9" text-anchor="middle">PDHX</text>
  
  <!-- PDH Component annotations -->
  <text x="450" y="455" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">Pyruvate</text>
  <text x="450" y="464" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">decarboxylase</text>
  <text x="450" y="473" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">(GO:0004737)</text>
  
  <text x="530" y="455" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">Acetyl-</text>
  <text x="530" y="464" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">transferase</text>
  <text x="530" y="473" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">(GO:0016407)</text>
  
  <text x="565" y="455" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">Dihydrolipoyl</text>
  <text x="565" y="464" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">dehydrogenase</text>
  <text x="565" y="473" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">(GO:0004148)</text>
  
  <text x="510" y="455" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">Molecular</text>
  <text x="510" y="464" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">adaptor</text>
  <text x="510" y="473" font-family="Arial" font-size="9" text-anchor="middle" fill="#444">(GO:0060090)</text>
  
  <!-- Acetyl-CoA product -->
  <circle cx="630" y="400" r="20" fill="#98fb98" stroke="#000" stroke-width="1.5" />
  <text x="630" y="397" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Acetyl-</text>
  <text x="630" y="407" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">CoA</text>
  
  <!-- Arrows -->
  <!-- Pyruvate transport -->
  <path d="M170 180 L220 300" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M240 330 L220 350" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M235 350 L300 360" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M385 360 L380 395" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Pyruvate to PDH -->
  <path d="M395 410 L430 410" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- PDH to Acetyl-CoA -->
  <path d="M590 400 L610 400" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Process label -->
  <text x="400" y="500" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Acetyl-CoA Biosynthetic Process from Pyruvate</text>
  <text x="400" y="520" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0006086)</text>
  
  <!-- PDH complex overall function -->
  <text x="620" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="#444">Pyruvate dehydrogenase (NAD+) activity</text>
  <text x="620" y="465" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="#444">(GO:0034604)</text>
  
  <!-- Legend -->
  <rect x="50" y="550" width="700" height="80" rx="5" ry="5" fill="#f0f0f0" stroke="#444" stroke-width="1" />
  <text x="400" y="570" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <circle cx="100" cy="590" r="10" fill="#a1c5ff" stroke="#000" stroke-width="1" />
  <text x="120" y="595" font-family="Arial" font-size="12" text-anchor="start">Pyruvate</text>
  
  <circle cx="200" cy="590" r="10" fill="#98fb98" stroke="#000" stroke-width="1" />
  <text x="220" y="595" font-family="Arial" font-size="12" text-anchor="start">Acetyl-CoA</text>
  
  <rect x="300" y="580" width="20" height="20" rx="10" ry="10" fill="#ff9f9f" stroke="#000" stroke-width="1" />
  <text x="330" y="595" font-family="Arial" font-size="12" text-anchor="start">Transporter</text>
  
  <rect x="450" y="580" width="20" height="20" rx="3" ry="3" fill="#ffdb99" stroke="#000" stroke-width="1" />
  <text x="480" y="595" font-family="Arial" font-size="12" text-anchor="start">Enzyme Complex</text>
  
  <circle cx="600" cy="590" r="10" fill="#ffd280" stroke="#000" stroke-width="1" />
  <text x="620" y="595" font-family="Arial" font-size="12" text-anchor="start">Protein</text>
  
  <line x1="675" y1="585" x2="695" y2="585" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="700" y="590" font-family="Arial" font-size="12" text-anchor="start">Pathway flow</text>
</svg>