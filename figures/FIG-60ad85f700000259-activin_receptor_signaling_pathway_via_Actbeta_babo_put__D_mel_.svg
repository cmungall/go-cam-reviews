<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Cell membrane -->
  <path d="M 100,150 L 700,150 L 700,500 L 100,500 Z" fill="#f9f9f9" stroke="#333333" stroke-width="2" />
  <path d="M 100,150 L 700,150" stroke="#333333" stroke-width="4" stroke-dasharray="5,3" />
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="380" rx="150" ry="80" fill="#e6f2ff" stroke="#333333" stroke-width="2" />
  
  <!-- Compartment Labels -->
  <text x="400" y="130" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Extracellular Space</text>
  <text x="400" y="180" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Plasma Membrane</text>
  <text x="400" y="250" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Cytoplasm</text>
  <text x="400" y="380" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Nucleus</text>
  
  <!-- Actbeta in extracellular space -->
  <circle cx="400" cy="90" r="25" fill="#ff9999" stroke="#333333" stroke-width="2" />
  <text x="400" y="95" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Actbeta</text>
  
  <!-- Receptors on membrane -->
  <rect x="340" y="140" width="50" height="20" fill="#99ccff" stroke="#333333" stroke-width="2" />
  <text x="365" y="155" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Babo</text>
  
  <rect x="410" y="140" width="50" height="20" fill="#99ccff" stroke="#333333" stroke-width="2" />
  <text x="435" y="155" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Put</text>
  
  <!-- Smox in cytoplasm -->
  <rect x="340" y="280" width="50" height="30" rx="5" ry="5" fill="#99ff99" stroke="#333333" stroke-width="2" />
  <text x="365" y="300" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Smox</text>
  
  <!-- Med in cytoplasm -->
  <rect x="410" y="280" width="50" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#333333" stroke-width="2" />
  <text x="435" y="300" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Med</text>
  
  <!-- Smox in nucleus -->
  <rect x="340" y="370" width="50" height="30" rx="5" ry="5" fill="#99ff99" stroke="#333333" stroke-width="2" />
  <text x="365" y="390" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Smox</text>
  
  <!-- Med in nucleus -->
  <rect x="410" y="370" width="50" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#333333" stroke-width="2" />
  <text x="435" y="390" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Med</text>
  
  <!-- DNA in nucleus -->
  <path d="M 300,420 Q 400,400 500,420" stroke="#333333" stroke-width="3" fill="none" />
  <text x="400" y="440" font-family="Arial" font-size="14" text-anchor="middle">DNA</text>
  
  <!-- Arrows for signaling cascade -->
  <!-- Actbeta to receptors -->
  <path d="M 400,115 L 400,140" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Receptors to Smox activation -->
  <path d="M 390,160 L 390,280" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Smox/Med to nucleus -->
  <path d="M 365,310 L 365,370" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 435,310 L 435,370" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Smox/Med to DNA -->
  <path d="M 365,400 L 365,420 L 400,420" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 435,400 L 435,420 L 400,420" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>
  
  <!-- Annotations of molecular functions -->
  <text x="440" y="90" font-family="Arial" font-size="14" text-anchor="start" font-style="italic">cytokine activity</text>
  <text x="470" y="150" font-family="Arial" font-size="14" text-anchor="start" font-style="italic">activin receptor activity</text>
  <text x="470" y="280" font-family="Arial" font-size="14" text-anchor="start" font-style="italic">co-SMAD binding</text>
  <text x="500" y="370" font-family="Arial" font-size="14" text-anchor="start" font-style="italic">transcription factor activity</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Activin Receptor Signaling Pathway in Drosophila melanogaster</text>
  
  <!-- Legend -->
  <rect x="550" y="500" width="230" height="90" fill="#ffffff" stroke="#333333" stroke-width="1" />
  <text x="560" y="520" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  <circle cx="570" cy="540" r="8" fill="#ff9999" stroke="#333333" stroke-width="1" />
  <text x="585" y="545" font-family="Arial" font-size="14">Actbeta (Cytokine)</text>
  <rect x="570" y="555" width="15" height="10" fill="#99ccff" stroke="#333333" stroke-width="1" />
  <text x="590" y="565" font-family="Arial" font-size="14">Babo/Put (Receptors)</text>
  <rect x="570" y="575" width="15" height="10" rx="2" ry="2" fill="#99ff99" stroke="#333333" stroke-width="1" />
  <text x="590" y="585" font-family="Arial" font-size="14">Smox (TF)</text>
  <rect x="670" y="555" width="15" height="10" rx="2" ry="2" fill="#ffcc99" stroke="#333333" stroke-width="1" />
  <text x="690" y="565" font-family="Arial" font-size="14">Med (TF Activator)</text>
</svg>