<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Pancreatic Beta Cell -->
  <rect x="0" y="0" width="800" height="650" fill="#f9f9f9" />
  
  <!-- Cell Outline -->
  <rect x="50" y="100" width="700" height="500" rx="50" ry="50" fill="#e6f7ff" stroke="#2980b9" stroke-width="2" />
  
  <!-- Cell Membrane - Plasma Membrane (GO:0005886) -->
  <rect x="50" y="100" width="700" height="500" rx="50" ry="50" fill="none" stroke="#2980b9" stroke-width="8" stroke-dasharray="5,5" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Positive Regulation of Insulin Secretion in Mouse Pancreatic Beta Cells</text>
  <text x="400" y="70" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Type B pancreatic cell (CL:0000169)</text>
  
  <!-- G protein-coupled receptor (Ffar2) in plasma membrane -->
  <rect x="100" y="100" width="60" height="40" fill="#f39c12" stroke="#e67e22" stroke-width="2" />
  <text x="130" y="125" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Ffar2</text>
  <text x="130" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">GPCR</text>
  
  <!-- Acetate ligand (implicit) -->
  <circle cx="60" cy="120" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2" />
  <text x="60" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="white">SCFAs</text>
  <text x="60" y="90" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50" font-style="italic">(Acetate)</text>
  <text x="60" y="150" font-family="Arial" font-size="8" text-anchor="middle" fill="#2c3e50" font-style="italic">(implicit)</text>
  
  <!-- G proteins (Gna11 and Gnaq) -->
  <ellipse cx="200" cy="150" rx="30" ry="20" fill="#3498db" stroke="#2980b9" stroke-width="2" />
  <text x="200" y="155" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Gna11</text>
  
  <ellipse cx="250" cy="150" rx="30" ry="20" fill="#3498db" stroke="#2980b9" stroke-width="2" />
  <text x="250" y="155" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Gnaq</text>
  
  <!-- PLC (Plcb1) -->
  <rect x="320" y="200" width="60" height="40" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5" ry="5" />
  <text x="350" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Plcb1</text>
  
  <!-- PIP2 substrate -->
  <circle cx="250" cy="250" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2" />
  <text x="250" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="white">PIP2</text>
  
  <!-- H2O substrate -->
  <circle cx="250" cy="300" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2" />
  <text x="250" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="white">H2O</text>
  
  <!-- DAG and IP3 products -->
  <circle cx="450" cy="250" r="25" fill="#16a085" stroke="#1abc9c" stroke-width="2" />
  <text x="450" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="white">DAG</text>
  <text x="450" y="260" font-family="Arial" font-size="10" text-anchor="middle" fill="white">(Diacylglycerol)</text>
  
  <circle cx="450" cy="330" r="25" fill="#27ae60" stroke="#2ecc71" stroke-width="2" />
  <text x="450" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="white">IP3</text>
  <text x="450" y="340" font-family="Arial" font-size="10" text-anchor="middle" fill="white">(Inositol trisphosphate)</text>
  
  <!-- IP3 Receptor (Itpr1) -->
  <rect x="450" y="400" width="70" height="40" fill="#f1c40f" stroke="#f39c12" stroke-width="2" />
  <text x="485" y="425" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Itpr1</text>
  
  <!-- ER Calcium Store (implicit) -->
  <rect x="300" y="450" width="200" height="80" rx="20" ry="20" fill="#bdc3c7" stroke="#95a5a6" stroke-width="2" />
  <text x="400" y="495" font-family="Arial" font-size="16" text-anchor="middle" fill="#34495e">ER Ca²⁺ Store</text>
  <text x="400" y="515" font-family="Arial" font-size="12" text-anchor="middle" fill="#34495e" font-style="italic">(implicit - not in source)</text>
  
  <!-- Calcium Release -->
  <circle cx="500" cy="550" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2" />
  <text x="500" y="555" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Ca²⁺</text>
  
  <!-- Insulin Secretion (endpoint) -->
  <polygon points="600,550 650,550 625,600" fill="#2ecc71" stroke="#27ae60" stroke-width="2" />
  <text x="625" y="575" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Insulin</text>
  <text x="625" y="610" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50" font-style="italic">GO:0030073</text>
  
  <!-- Arrows for pathway direction - consistent style -->
  <!-- Acetate to Ffar2 -->
  <line x1="75" y1="120" x2="100" y2="120" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="88" y="115" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">binds</text>
  
  <!-- Ffar2 to G proteins -->
  <line x1="160" y1="120" x2="180" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="160" y1="120" x2="230" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="190" y="125" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">activates</text>
  
  <!-- G proteins to PLC -->
  <line x1="220" y1="165" x2="320" y2="200" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="270" y1="165" x2="320" y2="200" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="290" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">activates</text>
  
  <!-- PIP2 and H2O to PLC -->
  <line x1="275" y1="250" x2="320" y2="220" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="265" y1="290" x2="320" y2="230" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="295" y="245" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">substrates</text>
  
  <!-- PLC to DAG and IP3 -->
  <line x1="380" y1="210" x2="425" y2="250" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="380" y1="220" x2="425" y2="325" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="390" y="240" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">hydrolyzes</text>
  
  <!-- IP3 to IP3R -->
  <line x1="450" y1="355" x2="450" y2="400" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="465" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">binds</text>
  
  <!-- IP3R to Calcium Release -->
  <line x1="485" y1="440" x2="500" y2="530" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="460" y="485" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">releases</text>
  
  <!-- Calcium to Insulin Secretion -->
  <line x1="520" y1="550" x2="600" y2="560" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="560" y="545" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">triggers</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="120" width="180" height="280" rx="10" ry="10" fill="#ffffff" stroke="#2c3e50" stroke-width="1" />
  <text x="640" y="140" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend Items -->
  <!-- GPCR -->
  <rect x="560" y="150" width="20" height="15" fill="#f39c12" stroke="#e67e22" stroke-width="1" />
  <text x="585" y="163" font-family="Arial" font-size="14" text-anchor="start">Ffar2 (GPCR)</text>
  
  <!-- G proteins -->
  <ellipse cx="570" cy="180" rx="10" ry="7" fill="#3498db" stroke="#2980b9" stroke-width="1" />
  <text x="585" y="183" font-family="Arial" font-size="14" text-anchor="start">G proteins</text>
  
  <!-- PLC -->
  <rect x="560" y="195" width="20" height="15" fill="#9b59b6" stroke="#8e44ad" stroke-width="1" rx="2" ry="2" />
  <text x="585" y="208" font-family="Arial" font-size="14" text-anchor="start">Plcb1 (PLC)</text>
  
  <!-- Substrates -->
  <circle cx="570" cy="225" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="1" />
  <text x="585" y="228" font-family="Arial" font-size="14" text-anchor="start">Substrates</text>
  
  <!-- Products -->
  <circle cx="570" cy="245" r="8" fill="#16a085" stroke="#1abc9c" stroke-width="1" />
  <text x="585" y="248" font-family="Arial" font-size="14" text-anchor="start">Products</text>
  
  <!-- IP3 product -->
  <circle cx="570" cy="265" r="8" fill="#27ae60" stroke="#2ecc71" stroke-width="1" />
  <text x="585" y="268" font-family="Arial" font-size="14" text-anchor="start">IP3</text>
  
  <!-- IP3 Receptor -->
  <rect x="560" y="285" width="20" height="15" fill="#f1c40f" stroke="#f39c12" stroke-width="1" />
  <text x="585" y="298" font-family="Arial" font-size="14" text-anchor="start">Itpr1 (IP3R)</text>
  
  <!-- Calcium -->
  <circle cx="570" cy="315" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="1" />
  <text x="585" y="318" font-family="Arial" font-size="14" text-anchor="start">Ca²⁺</text>
  
  <!-- Insulin -->
  <polygon points="560,335 580,335 570,350" fill="#2ecc71" stroke="#27ae60" stroke-width="1" />
  <text x="585" y="343" font-family="Arial" font-size="14" text-anchor="start">Insulin</text>
  
  <!-- ER Store (implicit) -->
  <rect x="560" y="365" width="20" height="15" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1" rx="2" ry="2" />
  <text x="585" y="378" font-family="Arial" font-size="14" text-anchor="start">Implicit element</text>
  
  <!-- Pathway Name -->
  <text x="400" y="630" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">
    Phospholipase C-activating G protein-coupled receptor signaling pathway (GO:0007200)
  </text>
</svg>