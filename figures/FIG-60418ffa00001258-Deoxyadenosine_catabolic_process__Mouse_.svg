<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane outline -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f8f8f8" stroke="#888" stroke-width="2"/>
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Deoxyadenosine Catabolic Process (Mouse)</text>
  
  <!-- Cytosol -->
  <rect x="70" y="100" width="660" height="200" rx="15" ry="15" fill="#e6f3ff" stroke="#6699cc" stroke-width="2"/>
  <text x="400" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cytosol</text>
  
  <!-- Peroxisome -->
  <rect x="70" y="330" width="660" height="200" rx="15" ry="15" fill="#ffe6e6" stroke="#cc6666" stroke-width="2"/>
  <text x="400" y="350" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Peroxisome</text>
  
  <!-- Molecules and Reactions in Cytosol -->
  <!-- Substrate - Deoxyadenosine -->
  <rect x="80" y="170" width="80" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="120" y="190" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">2'-Deoxyadenosine</text>
  
  <!-- Ada -->
  <circle cx="200" cy="185" r="30" fill="#aed6f1" stroke="#3498db" stroke-width="2"/>
  <text x="200" y="185" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Ada</text>
  <text x="200" y="200" font-family="Arial" font-size="10" text-anchor="middle">GO:0046936</text>
  
  <!-- 2'-Deoxyinosine -->
  <rect x="240" y="170" width="80" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="280" y="190" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">2'-Deoxyinosine</text>
  
  <!-- Pnp -->
  <circle cx="360" cy="185" r="30" fill="#aed6f1" stroke="#3498db" stroke-width="2"/>
  <text x="360" y="185" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Pnp</text>
  <text x="360" y="200" font-family="Arial" font-size="10" text-anchor="middle">GO:0004731</text>
  
  <!-- Hypoxanthine -->
  <rect x="400" y="170" width="80" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="440" y="190" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Hypoxanthine</text>
  
  <!-- Xdh (hypoxanthine activity) -->
  <circle cx="520" cy="185" r="30" fill="#aed6f1" stroke="#3498db" stroke-width="2"/>
  <text x="520" y="185" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Xdh</text>
  <text x="520" y="200" font-family="Arial" font-size="9" text-anchor="middle">GO:0070674/5</text>
  
  <!-- Xanthine -->
  <rect x="560" y="170" width="80" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="190" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Xanthine</text>
  
  <!-- Xdh (xanthine activity) -->
  <circle cx="680" cy="185" r="30" fill="#aed6f1" stroke="#3498db" stroke-width="2"/>
  <text x="680" y="185" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Xdh</text>
  <text x="680" y="200" font-family="Arial" font-size="9" text-anchor="middle">GO:0004854/5</text>
  
  <!-- Urate in cytosol -->
  <rect x="630" y="240" width="60" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="660" y="260" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Urate</text>
  
  <!-- Molecules and Reactions in Peroxisome -->
  <!-- Urate in peroxisome -->
  <rect x="100" y="420" width="60" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="130" y="440" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Urate</text>
  
  <!-- Uox -->
  <circle cx="200" cy="435" r="30" fill="#f5b7b1" stroke="#e74c3c" stroke-width="2"/>
  <text x="200" y="435" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Uox</text>
  <text x="200" y="450" font-family="Arial" font-size="10" text-anchor="middle">GO:0004846</text>
  
  <!-- Hydroxyisourate -->
  <rect x="240" y="420" width="80" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="280" y="440" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Hydroxyisourate</text>
  
  <!-- Urah -->
  <circle cx="360" cy="435" r="30" fill="#f5b7b1" stroke="#e74c3c" stroke-width="2"/>
  <text x="360" y="435" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Urah</text>
  <text x="360" y="450" font-family="Arial" font-size="10" text-anchor="middle">GO:0033971</text>
  
  <!-- OHCU -->
  <rect x="400" y="420" width="80" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="440" y="435" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">OHCU</text>
  <text x="440" y="448" font-family="Arial" font-size="8" text-anchor="middle">(2-oxo-4-hydroxy-4-carboxy-5-</text>
  <text x="440" y="456" font-family="Arial" font-size="8" text-anchor="middle">ureidoimidazoline)</text>
  
  <!-- Urad -->
  <circle cx="520" cy="435" r="30" fill="#f5b7b1" stroke="#e74c3c" stroke-width="2"/>
  <text x="520" y="435" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Urad</text>
  <text x="520" y="450" font-family="Arial" font-size="10" text-anchor="middle">GO:0051997</text>
  
  <!-- Allantoin (product) -->
  <rect x="560" y="420" width="80" height="30" rx="5" ry="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" stroke-dasharray="none"/>
  <text x="600" y="440" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Allantoin</text>
  
  <!-- Connecting arrows -->
  <!-- Cytosol pathway -->
  <path d="M160,185 L170,185" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M230,185 L240,185" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M320,185 L330,185" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M390,185 L400,185" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M480,185 L490,185" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M550,185 L560,185" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M640,185 L650,185" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M680,215 L680,235 L660,235" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Connection between cytosol and peroxisome -->
  <path d="M630,270 Q 400,350 160,420" stroke="#000" stroke-width="2.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="320" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Transport to peroxisome</text>
  
  <!-- Peroxisome pathway -->
  <path d="M160,435 L170,435" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M230,435 L240,435" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M320,435 L330,435" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M390,435 L400,435" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M480,435 L490,435" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M550,435 L560,435" stroke="#000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Process label -->
  <text x="400" y="550" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">GO:0006157 - deoxyadenosine catabolic process</text>
  
  <!-- Legend -->
  <rect x="80" y="480" width="15" height="15" fill="#aed6f1" stroke="#3498db" stroke-width="1" rx="7.5" ry="7.5"/>
  <text x="100" y="492" font-family="Arial" font-size="11" text-anchor="start">Enzyme (cytosolic)</text>
  
  <rect x="200" y="480" width="15" height="15" fill="#f5b7b1" stroke="#e74c3c" stroke-width="1" rx="7.5" ry="7.5"/>
  <text x="220" y="492" font-family="Arial" font-size="11" text-anchor="start">Enzyme (peroxisomal)</text>
  
  <rect x="350" y="480" width="15" height="15" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="370" y="492" font-family="Arial" font-size="11" text-anchor="start">Metabolite</text>
  
  <line x1="480" y1="488" x2="520" y2="488" stroke="#000" stroke-width="2.5" stroke-dasharray="5,5"/>
  <text x="540" y="492" font-family="Arial" font-size="11" text-anchor="start">Transport</text>
</svg>