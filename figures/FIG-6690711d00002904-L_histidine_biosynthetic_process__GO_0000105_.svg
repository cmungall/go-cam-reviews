<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">L-histidine Biosynthetic Process in S. pombe</text>
  
  <!-- Cytosol background -->
  <rect x="50" y="60" width="700" height="620" rx="20" ry="20" fill="#f0f9ff" stroke="#a0c0e0" stroke-width="2"/>
  <text x="100" y="90" font-family="Arial" font-size="18" fill="#205080">Cytosol (GO:0005829)</text>
  
  <!-- Pathway elements -->
  <!-- Starting substrate -->
  <rect x="150" y="130" width="150" height="45" rx="10" ry="10" fill="#e6f2ff" stroke="#4682b4" stroke-width="1.5"/>
  <text x="225" y="160" font-family="Arial" font-size="14" text-anchor="middle">PRPP + ATP</text>
  
  <!-- Arrow 1 -->
  <path d="M 225,175 L 225,205" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- His1 enzyme -->
  <rect x="140" y="205" width="170" height="50" rx="5" ry="5" fill="#ffcccc" stroke="#cc6666" stroke-width="1.5"/>
  <text x="225" y="230" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">His1</text>
  <text x="225" y="245" font-family="Arial" font-size="10" text-anchor="middle">ATP phosphoribosyltransferase</text>
  
  <!-- Arrow 2 -->
  <path d="M 225,255 L 225,285" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Intermediate 1 -->
  <rect x="140" y="285" width="170" height="35" rx="10" ry="10" fill="#e6f2ff" stroke="#4682b4" stroke-width="1.5"/>
  <text x="225" y="308" font-family="Arial" font-size="12" text-anchor="middle">1-(5-phospho-β-D-ribosyl)-ATP</text>
  
  <!-- Arrow 3 -->
  <path d="M 225,320 L 225,350" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- His7 enzyme -->
  <rect x="140" y="350" width="170" height="55" rx="5" ry="5" fill="#ffcccc" stroke="#cc6666" stroke-width="1.5"/>
  <text x="225" y="370" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">His7</text>
  <text x="225" y="385" font-family="Arial" font-size="10" text-anchor="middle">Phosphoribosyl-ATP</text>
  <text x="225" y="397" font-family="Arial" font-size="10" text-anchor="middle">diphosphatase/cyclohydrolase</text>
  
  <!-- Arrow 4 to the right -->
  <path d="M 310,380 L 350,380 L 390,380" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- His6 enzyme -->
  <rect x="390" y="350" width="170" height="55" rx="5" ry="5" fill="#ffcccc" stroke="#cc6666" stroke-width="1.5"/>
  <text x="475" y="370" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">His6</text>
  <text x="475" y="385" font-family="Arial" font-size="10" text-anchor="middle">PRFAR isomerase</text>
  
  <!-- Arrow 5 down -->
  <path d="M 475,405 L 475,435" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- His4 enzyme -->
  <rect x="390" y="435" width="170" height="55" rx="5" ry="5" fill="#ffcccc" stroke="#cc6666" stroke-width="1.5"/>
  <text x="475" y="455" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">His4</text>
  <text x="475" y="470" font-family="Arial" font-size="10" text-anchor="middle">Imidazoleglycerol-phosphate</text>
  <text x="475" y="482" font-family="Arial" font-size="10" text-anchor="middle">synthase</text>
  
  <!-- Arrow 6 to the left -->
  <path d="M 390,460 L 350,460 L 310,460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- His5 enzyme -->
  <rect x="140" y="435" width="170" height="55" rx="5" ry="5" fill="#ffcccc" stroke="#cc6666" stroke-width="1.5"/>
  <text x="225" y="455" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">His5</text>
  <text x="225" y="470" font-family="Arial" font-size="10" text-anchor="middle">Imidazoleglycerol-phosphate</text>
  <text x="225" y="482" font-family="Arial" font-size="10" text-anchor="middle">dehydratase</text>
  
  <!-- Arrow 7 down -->
  <path d="M 225,490 L 225,520" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- His3 enzyme -->
  <rect x="140" y="520" width="170" height="55" rx="5" ry="5" fill="#ffcccc" stroke="#cc6666" stroke-width="1.5"/>
  <text x="225" y="540" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">His3</text>
  <text x="225" y="555" font-family="Arial" font-size="10" text-anchor="middle">Histidinol-phosphate</text>
  <text x="225" y="567" font-family="Arial" font-size="10" text-anchor="middle">transaminase</text>
  
  <!-- Arrow 8 to the right -->
  <path d="M 310,545 L 350,545 L 390,545" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- SPCC1672.01 enzyme -->
  <rect x="390" y="520" width="170" height="55" rx="5" ry="5" fill="#ffcccc" stroke="#cc6666" stroke-width="1.5"/>
  <text x="475" y="540" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">SPCC1672.01</text>
  <text x="475" y="555" font-family="Arial" font-size="10" text-anchor="middle">Histidinol-phosphatase</text>
  
  <!-- Arrow 9 down -->
  <path d="M 475,575 L 475,605" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- His2 enzyme -->
  <rect x="390" y="605" width="170" height="55" rx="5" ry="5" fill="#ffcccc" stroke="#cc6666" stroke-width="1.5"/>
  <text x="475" y="625" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">His2</text>
  <text x="475" y="640" font-family="Arial" font-size="10" text-anchor="middle">Histidinol dehydrogenase</text>
  
  <!-- Final Product -->
  <rect x="590" y="610" width="140" height="45" rx="10" ry="10" fill="#e6ffec" stroke="#66cc99" stroke-width="2"/>
  <text x="660" y="638" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">L-histidine</text>
  
  <!-- Arrow to final product -->
  <path d="M 560,632 L 590,632" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Intermediates - subtle text labels -->
  <text x="350" y="360" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Phosphoribosyl-AMP</text>
  <text x="350" y="440" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Imidazole glycerol phosphate</text>
  <text x="350" y="525" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Histidinol phosphate</text>
  <text x="475" y="595" font-family="Arial" font-size="11" fill="#666666" text-anchor="middle">Histidinol</text>
  
  <!-- Definitions for markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Note about the pathway -->
  <rect x="580" y="120" width="150" height="70" rx="5" ry="5" fill="#ffffcc" stroke="#ddddaa" stroke-width="1"/>
  <text x="655" y="140" font-family="Arial" font-size="12" text-anchor="middle">L-histidine biosynthetic</text>
  <text x="655" y="155" font-family="Arial" font-size="12" text-anchor="middle">process (GO:0000105)</text>
  <text x="655" y="180" font-family="Arial" font-size="12" text-anchor="middle">in S. pombe</text>
  
  <!-- Legend -->
  <rect x="580" y="210" width="150" height="85" rx="5" ry="5" fill="white" stroke="#dddddd" stroke-width="1"/>
  <text x="655" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">LEGEND</text>
  
  <rect x="590" y="235" width="20" height="10" fill="#ffcccc" stroke="#cc6666" stroke-width="1"/>
  <text x="655" y="243" font-family="Arial" font-size="10" text-anchor="middle">Enzymes</text>
  
  <rect x="590" y="255" width="20" height="10" fill="#e6f2ff" stroke="#4682b4" stroke-width="1"/>
  <text x="655" y="263" font-family="Arial" font-size="10" text-anchor="middle">Substrates/Intermediates</text>
  
  <rect x="590" y="275" width="20" height="10" fill="#e6ffec" stroke="#66cc99" stroke-width="1"/>
  <text x="655" y="283" font-family="Arial" font-size="10" text-anchor="middle">Final Product</text>
</svg>