<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#666666" stroke-width="2"/>
  <text x="400" y="90" font-family="Arial" font-size="26" text-anchor="middle" font-weight="bold">AMP Salvage Pathway (Mouse)</text>
  
  <!-- Molecules and Reactions -->
  <!-- Adenosine -->
  <circle cx="150" cy="200" r="45" fill="#d1e7dd" stroke="#0a5d36" stroke-width="2.5"/>
  <text x="150" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Adenosine</text>
  
  <!-- Reaction 1: Ada (Adenosine deaminase) -->
  <line x1="195" y1="200" x2="255" y2="200" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="195" y="160" width="60" height="30" rx="5" ry="5" fill="#e6bccd" stroke="#8b0a50" stroke-width="2"/>
  <text x="225" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Ada</text>
  
  <!-- Inosine -->
  <circle cx="300" cy="200" r="45" fill="#d1e7dd" stroke="#0a5d36" stroke-width="2.5"/>
  <text x="300" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Inosine</text>
  
  <!-- Reaction 2: Pnp (Purine-nucleoside phosphorylase) -->
  <line x1="345" y1="200" x2="405" y2="200" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="345" y="160" width="60" height="30" rx="5" ry="5" fill="#e6bccd" stroke="#8b0a50" stroke-width="2"/>
  <text x="375" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Pnp</text>
  
  <!-- Hypoxanthine -->
  <circle cx="450" cy="200" r="45" fill="#d1e7dd" stroke="#0a5d36" stroke-width="2.5"/>
  <text x="450" y="195" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Hypoxanthine</text>
  
  <!-- Reaction 3: Hprt1 (Hypoxanthine phosphoribosyltransferase) -->
  <line x1="450" y1="245" x2="450" y2="305" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="390" y="260" width="60" height="30" rx="5" ry="5" fill="#e6bccd" stroke="#8b0a50" stroke-width="2"/>
  <text x="420" y="280" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Hprt1</text>
  
  <!-- IMP -->
  <circle cx="450" cy="350" r="45" fill="#d1e7dd" stroke="#0a5d36" stroke-width="2.5"/>
  <text x="450" y="355" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IMP</text>
  
  <!-- Reaction 4: Adss1 (Adenylosuccinate synthase) -->
  <line x1="450" y1="395" x2="450" y2="455" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="390" y="410" width="60" height="30" rx="5" ry="5" fill="#e6bccd" stroke="#8b0a50" stroke-width="2"/>
  <text x="420" y="430" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Adss1</text>
  
  <!-- Adenylosuccinate -->
  <circle cx="450" cy="500" r="45" fill="#d1e7dd" stroke="#0a5d36" stroke-width="2.5"/>
  <text x="450" y="493" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Adenylo-</text>
  <text x="450" y="510" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">succinate</text>
  
  <!-- Reaction 5: Adsl (Adenylosuccinate lyase) -->
  <line x1="495" y1="500" x2="555" y2="500" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="495" y="460" width="60" height="30" rx="5" ry="5" fill="#e6bccd" stroke="#8b0a50" stroke-width="2"/>
  <text x="525" y="480" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Adsl</text>
  
  <!-- AMP -->
  <circle cx="600" cy="500" r="45" fill="#9ec5fe" stroke="#073985" stroke-width="3"/>
  <text x="600" y="505" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">AMP</text>
  
  <!-- Process label -->
  <rect x="550" y="300" width="150" height="40" rx="8" ry="8" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
  <text x="625" y="325" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">AMP Salvage</text>
  
  <!-- Legend -->
  <rect x="550" y="100" width="160" height="140" rx="8" ry="8" fill="white" stroke="#666" stroke-width="1.5"/>
  <text x="630" y="125" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="575" cy="150" r="10" fill="#d1e7dd" stroke="#0a5d36" stroke-width="2.5"/>
  <text x="650" y="155" font-family="Arial" font-size="13" text-anchor="middle">Intermediate</text>
  
  <circle cx="575" cy="180" r="10" fill="#9ec5fe" stroke="#073985" stroke-width="2.5"/>
  <text x="650" y="185" font-family="Arial" font-size="13" text-anchor="middle">Final Product</text>
  
  <rect x="565" y="200" width="20" height="20" rx="3" ry="3" fill="#e6bccd" stroke="#8b0a50" stroke-width="2"/>
  <text x="650" y="215" font-family="Arial" font-size="13" text-anchor="middle">Enzyme</text>

  <!-- GO:0044209 reference -->
  <text x="650" y="510" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">GO:0044209</text>
  
  <!-- Arrow definition for marker-end -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>