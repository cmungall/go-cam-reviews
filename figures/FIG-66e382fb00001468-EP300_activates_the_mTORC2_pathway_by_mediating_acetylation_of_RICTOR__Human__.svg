<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="70" ry="50" fill="#f9f9f9" stroke="#666" stroke-width="2" />
  
  <!-- Plasma membrane -->
  <path d="M 50 250 L 750 250" stroke="#666" stroke-width="4" stroke-dasharray="5,3" />
  <text x="60" y="240" font-family="Arial" font-size="14" fill="#333">Plasma membrane</text>
  
  <!-- EP300 -->
  <circle cx="150" cy="150" r="40" fill="#91C4F8" stroke="#333" stroke-width="2" />
  <text x="150" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">EP300</text>
  <text x="150" y="120" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(Acetyltransferase)</text>

  <!-- RICTOR -->
  <rect x="250" y="200" width="90" height="40" rx="10" ry="10" fill="#F8C491" stroke="#333" stroke-width="2" />
  <text x="295" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">RICTOR</text>
  
  <!-- mTOR -->
  <rect x="350" y="260" width="80" height="40" rx="10" ry="10" fill="#C491F8" stroke="#333" stroke-width="2" />
  <text x="390" y="285" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">mTOR</text>
  
  <!-- mTORC2 label -->
  <path d="M 280 260 L 400 260" stroke="#999" stroke-width="1" stroke-dasharray="2,2" />
  <text x="350" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">mTORC2 complex</text>
  
  <!-- PDK1 -->
  <ellipse cx="500" cy="350" rx="40" ry="30" fill="#91F8C4" stroke="#333" stroke-width="2" />
  <text x="500" y="355" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">PDK1</text>
  
  <!-- AKT1 -->
  <ellipse cx="650" cy="420" rx="40" ry="30" fill="#F891C4" stroke="#333" stroke-width="2" />
  <text x="650" y="425" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">AKT1</text>
  
  <!-- Arrows and interactions -->
  <!-- EP300 to RICTOR (acetylation) -->
  <path d="M 180 175 L 240 200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="200" y="180" font-family="Arial" font-size="12" fill="#333">Acetylates</text>
  <circle cx="230" r="8" cy="195" fill="#FFC107" stroke="#333" stroke-width="1" />
  <text x="230" y="198" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Ac</text>
  
  <!-- RICTOR to mTOR (adaptor) -->
  <path d="M 330 230 L 360 260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="320" y="240" font-family="Arial" font-size="12" fill="#333">Adapts</text>
  
  <!-- mTOR to PDK1 (phosphorylation) -->
  <path d="M 430 280 L 470 330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="430" y="315" font-family="Arial" font-size="12" fill="#333">Phosphorylates</text>
  <circle cx="455" cy="310" r="8" fill="#FF5722" stroke="#333" stroke-width="1" />
  <text x="455" y="313" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">P</text>
  
  <!-- PDK1 to AKT1 (phosphorylation) -->
  <path d="M 540 360 L 610 400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="560" y="370" font-family="Arial" font-size="12" fill="#333">Phosphorylates</text>
  <circle cx="585" cy="385" r="8" fill="#FF5722" stroke="#333" stroke-width="1" />
  <text x="585" y="388" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">P</text>
  
  <!-- Biological processes labels with arrows -->
  <rect x="600" y="450" width="180" height="50" rx="10" ry="10" fill="#E8E8E8" stroke="#666" stroke-width="1" />
  <text x="690" y="478" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PI3K/AKT signaling</text>
  <path d="M 690 490 L 690 510" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <rect x="320" y="350" width="180" height="40" rx="10" ry="10" fill="#E8E8E8" stroke="#666" stroke-width="1" />
  <text x="410" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">TORC2 signaling</text>
  <path d="M 410 385 L 410 400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Title -->
  <text x="400" y="80" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">EP300 activates mTORC2 pathway via RICTOR acetylation</text>
  
  <!-- Legend -->
  <rect x="550" y="100" width="180" height="120" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1" />
  <text x="640" y="120" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <circle cx="570" cy="140" r="8" fill="#FFC107" stroke="#333" stroke-width="1" />
  <text x="570" y="143" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Ac</text>
  <text x="650" y="145" font-family="Arial" font-size="12" fill="#333">Acetylation</text>
  
  <circle cx="570" cy="165" r="8" fill="#FF5722" stroke="#333" stroke-width="1" />
  <text x="570" y="168" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">P</text>
  <text x="650" y="170" font-family="Arial" font-size="12" fill="#333">Phosphorylation</text>
  
  <rect x="560" y="185" width="20" height="20" rx="5" ry="5" fill="#E8E8E8" stroke="#666" stroke-width="1" />
  <text x="650" y="200" font-family="Arial" font-size="12" fill="#333">Signaling pathway</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>