<svg width="600" height="520" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell components -->
  <rect x="0" y="0" width="600" height="520" fill="#f9f9f9" stroke="black" stroke-width="2"/>
  
  <!-- Extracellular Space -->
  <rect x="0" y="0" width="600" height="150" fill="#e6f7ff" stroke="black" stroke-width="1"/>
  <text x="20" y="30" font-family="Arial" font-size="14" font-weight="bold">Extracellular Space (GO:0005615)</text>
  
  <!-- Plasma Membrane -->
  <rect x="0" y="150" width="600" height="50" fill="#ffcccc" stroke="black" stroke-width="1"/>
  <text x="20" y="180" font-family="Arial" font-size="14" font-weight="bold">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytosol -->
  <rect x="0" y="200" width="600" height="320" fill="#e6ffe6" stroke="black" stroke-width="1"/>
  <text x="20" y="230" font-family="Arial" font-size="14" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- VIP Molecule -->
  <circle cx="200" cy="80" r="25" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="200" y="85" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">VIP</text>
  <text x="200" y="100" font-family="Arial" font-size="10" text-anchor="middle">(P01282)</text>
  <text x="200" y="115" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">Neuropeptide</text>
  <text x="200" y="125" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">hormone activity</text>
  
  <!-- VIPR1 Receptor in membrane -->
  <rect x="180" y="150" width="40" height="50" fill="#9999ff" stroke="#0000cc" stroke-width="2"/>
  <text x="200" y="175" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">VIPR1</text>
  <text x="200" y="190" font-family="Arial" font-size="10" text-anchor="middle">(P32241)</text>
  
  <!-- G Protein (GNAS) -->
  <circle cx="200" cy="270" r="28" fill="#99ffcc" stroke="#00cc66" stroke-width="2"/>
  <text x="200" y="270" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">GNAS</text>
  <text x="200" y="285" font-family="Arial" font-size="10" text-anchor="middle">(Q5JWF2)</text>
  
  <!-- Inactive and Active states for G protein -->
  <circle cx="160" cy="270" r="12" fill="#dddddd" stroke="#666666" stroke-width="1"/>
  <text x="160" y="274" font-family="Arial" font-size="10" text-anchor="middle">GDP</text>
  
  <circle cx="240" cy="270" r="12" fill="#ffff00" stroke="#666666" stroke-width="1"/>
  <text x="240" y="274" font-family="Arial" font-size="10" text-anchor="middle">GTP</text>
  
  <!-- Adenylate Cyclase (ADCY6) -->
  <rect x="320" y="240" width="50" height="50" rx="10" ry="10" fill="#ffff99" stroke="#cccc00" stroke-width="2"/>
  <text x="345" y="265" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">ADCY6</text>
  <text x="345" y="280" font-family="Arial" font-size="10" text-anchor="middle">(O43306)</text>
  
  <!-- ATP Molecule -->
  <ellipse cx="400" cy="240" rx="25" ry="15" fill="#ccccff" stroke="#6666cc" stroke-width="2"/>
  <text x="400" y="244" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">ATP</text>
  
  <!-- Cyclic AMP -->
  <polygon points="430,290 450,270 470,290 450,310" fill="#ff99ff" stroke="#cc00cc" stroke-width="2"/>
  <text x="450" y="295" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">cAMP</text>
  <text x="450" y="320" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(CHEBI:17489)</text>
  
  <!-- Signaling pathway flow indicator -->
  <path d="M 120,80 L 550,290" stroke="#666666" stroke-width="1" stroke-dasharray="5,3" fill="none"/>
  <polygon points="550,290 535,285 540,275" fill="#666666"/>
  <text x="320" y="160" font-family="Arial" font-size="12" font-style="italic" fill="#666666" text-anchor="middle">Signaling Flow</text>
  
  <!-- Arrows connecting the components -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- VIP to VIPR1 -->
  <line x1="200" y1="105" x2="200" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="135" font-family="Arial" font-size="10" text-anchor="start">VIP binding</text>
  
  <!-- VIPR1 to GNAS -->
  <line x1="200" y1="200" x2="200" y2="242" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="225" font-family="Arial" font-size="10" text-anchor="start">Receptor activation</text>
  
  <!-- GNAS to ADCY6 -->
  <line x1="228" y1="270" x2="320" y2="270" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="240" y="260" font-family="Arial" font-size="11" text-anchor="start">G protein activation</text>
  
  <!-- ATP to ADCY6 -->
  <line x1="400" y1="255" x2="365" y2="265" stroke="black" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
  <text x="375" y="250" font-family="Arial" font-size="10" text-anchor="middle">Substrate</text>
  
  <!-- ADCY6 to cAMP -->
  <line x1="370" y1="265" x2="430" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="385" y="290" font-family="Arial" font-size="11" text-anchor="start">ATP → cAMP</text>
  
  <!-- Process Label -->
  <rect x="120" y="350" width="360" height="30" rx="15" ry="15" fill="#ffffcc" stroke="#999900" stroke-width="1"/>
  <text x="300" y="370" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Adenylate cyclase-activating GPCR signaling pathway</text>
  <text x="300" y="390" font-family="Arial" font-size="12" text-anchor="middle">(GO:0007189)</text>
  
  <!-- Title -->
  <text x="300" y="440" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Signaling by Vasoactive Intestinal Peptide/VIP</text>
  <text x="300" y="460" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">mediated by VIPR1 receptor (Human)</text>
  
  <!-- Molecular functions annotations -->
  <text x="20" y="410" font-family="Arial" font-size="11" fill="#666666">VIP: Neuropeptide hormone activity (GO:0005184)</text>
  <text x="20" y="425" font-family="Arial" font-size="11" fill="#666666">VIPR1: Vasoactive intestinal polypeptide receptor activity (GO:0004999)</text>
  <text x="20" y="440" font-family="Arial" font-size="11" fill="#666666">GNAS: G protein activity (GO:0003925)</text>
  <text x="20" y="455" font-family="Arial" font-size="11" fill="#666666">ADCY6: Adenylate cyclase activity (GO:0004016)</text>
</svg>