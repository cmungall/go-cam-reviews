<svg width="800" height="680" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="680" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Notch Signaling Pathway in Drosophila melanogaster</text>
  
  <!-- Cell 1 (Sending Cell) -->
  <rect x="100" y="100" width="250" height="400" rx="20" ry="20" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="225" y="130" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Sending Cell</text>
  
  <!-- Cell 2 (Receiving Cell) -->
  <rect x="450" y="100" width="250" height="400" rx="20" ry="20" fill="#fff2e6" stroke="#ff9933" stroke-width="2" />
  <text x="575" y="130" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Receiving Cell</text>
  
  <!-- Cell Membranes -->
  <line x1="350" y1="100" x2="350" y2="500" stroke="#0066cc" stroke-width="5" />
  <line x1="450" y1="100" x2="450" y2="500" stroke="#ff9933" stroke-width="5" />
  
  <!-- Delta Ligand in Sending Cell -->
  <rect x="300" y="250" width="50" height="30" fill="#99ccff" stroke="#000000" stroke-width="1" />
  <text x="325" y="270" font-family="Arial" font-size="14" text-anchor="middle">Delta</text>
  <text x="325" y="285" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle">(FBgn0000463)</text>
  
  <!-- Notch Receptor in Receiving Cell -->
  <rect x="450" y="250" width="50" height="30" fill="#ffcc99" stroke="#000000" stroke-width="1" />
  <text x="475" y="270" font-family="Arial" font-size="14" text-anchor="middle">Notch</text>
  <text x="475" y="285" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle">(FBgn0004647)</text>
  
  <!-- Binding Arrow -->
  <line x1="350" y1="265" x2="450" y2="265" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" />
  <text x="400" y="230" font-family="Arial" font-size="14" text-anchor="middle">Receptor-ligand</text>
  <text x="400" y="248" font-family="Arial" font-size="14" text-anchor="middle">interaction</text>
  
  <!-- Kuzbanian -->
  <ellipse cx="520" y="290" rx="25" ry="15" fill="#ff9966" stroke="#000000" stroke-width="1" />
  <text x="520" y="294" font-family="Arial" font-size="14" text-anchor="middle">Kuz</text>
  <text x="520" y="310" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle">(FBgn0259984)</text>
  
  <!-- First Cleavage - Kuzbanian -->
  <path d="M 520,310 L 520,320 L 500,320 L 500,280" stroke="#000000" stroke-width="2" fill="none" />
  <polygon points="500,280 495,290 505,290" fill="#000000" />
  <text x="490" y="340" font-family="Arial" font-size="12" text-anchor="middle">Metalloendopeptidase</text>
  <text x="490" y="355" font-family="Arial" font-size="12" text-anchor="middle">cleavage</text>
  
  <!-- Presenilin -->
  <ellipse cx="570" y="370" rx="25" ry="15" fill="#cc99ff" stroke="#000000" stroke-width="1" />
  <text x="570" y="374" font-family="Arial" font-size="14" text-anchor="middle">Psn</text>
  <text x="570" y="390" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle">(FBgn0284421)</text>
  
  <!-- Second Cleavage - Presenilin -->
  <path d="M 570,390 L 570,400 L 540,400 L 540,360" stroke="#000000" stroke-width="2" fill="none" />
  <polygon points="540,360 535,370 545,370" fill="#000000" />
  <text x="525" y="415" font-family="Arial" font-size="12" text-anchor="middle">Endopeptidase</text>
  <text x="525" y="430" font-family="Arial" font-size="12" text-anchor="middle">cleavage</text>
  
  <!-- Notch Intracellular Domain (NICD) -->
  <rect x="510" y="430" width="40" height="25" fill="#ffcc99" stroke="#000000" stroke-width="1" />
  <text x="530" y="447" font-family="Arial" font-size="14" text-anchor="middle">NICD</text>
  
  <!-- Nucleus -->
  <ellipse cx="600" y="465" rx="60" ry="40" fill="#ffffcc" stroke="#000000" stroke-width="2" />
  <text x="600" y="470" font-family="Arial" font-size="16" text-anchor="middle">Nucleus</text>
  
  <!-- NICD Translocation to Nucleus -->
  <path d="M 550,437 Q 570,447 585,455" stroke="#000000" stroke-width="2" fill="none" />
  <polygon points="585,455 575,448 580,458" fill="#000000" />
  <text x="560" y="425" font-family="Arial" font-size="14" text-anchor="middle">Translocation</text>
  
  <!-- Transcriptional Activation -->
  <rect x="580" y="445" width="40" height="20" fill="#ffaaaa" stroke="#000000" stroke-width="1" />
  <text x="600" y="459" font-family="Arial" font-size="14" text-anchor="middle">Genes</text>
  
  <!-- NICD as Transcription Coactivator -->
  <path d="M 580,455 C 590,435 610,435 620,455" stroke="#00cc00" stroke-width="2" fill="none" />
  <text x="600" y="410" font-family="Arial" font-size="14" text-anchor="middle">Transcription</text>
  <text x="600" y="428" font-family="Arial" font-size="14" text-anchor="middle">coactivator</text>
  
  <!-- Process Steps Numbering -->
  <circle cx="380" y="265" r="15" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="380" y="270" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">1</text>
  
  <circle cx="510" y="300" r="15" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="510" y="305" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">2</text>
  
  <circle cx="560" y="380" r="15" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="560" y="385" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">3</text>
  
  <circle cx="550" y="450" r="15" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="550" y="455" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">4</text>
  
  <circle cx="600" y="435" r="15" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="600" y="440" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">5</text>
  
  <!-- Legend -->
  <rect x="100" y="520" width="600" height="140" rx="10" ry="10" fill="#f5f5f5" stroke="#333333" stroke-width="1" />
  <text x="120" y="545" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  
  <!-- Legend items -->
  <rect x="120" y="560" width="20" height="20" fill="#99ccff" stroke="#000000" stroke-width="1" />
  <text x="150" y="575" font-family="Arial" font-size="14">Delta (Ligand)</text>
  
  <rect x="350" y="560" width="20" height="20" fill="#ffcc99" stroke="#000000" stroke-width="1" />
  <text x="380" y="575" font-family="Arial" font-size="14">Notch (Receptor)</text>
  
  <ellipse cx="120" cy="600" rx="10" ry="10" fill="#ff9966" stroke="#000000" stroke-width="1" />
  <text x="175" y="605" font-family="Arial" font-size="14">Kuz (Metalloendopeptidase)</text>
  
  <ellipse cx="350" cy="600" rx="10" ry="10" fill="#cc99ff" stroke="#000000" stroke-width="1" />
  <text x="400" y="605" font-family="Arial" font-size="14">Psn (Endopeptidase)</text>
  
  <rect x="120" y="625" width="20" height="20" fill="#ffcc99" stroke="#000000" stroke-width="1" />
  <text x="185" y="640" font-family="Arial" font-size="14">NICD (Notch Intracellular Domain)</text>
  
  <rect x="350" y="625" width="20" height="20" fill="#ffffcc" stroke="#000000" stroke-width="1" />
  <text x="380" y="640" font-family="Arial" font-size="14">Nucleus</text>
  
  <circle cx="500" y="600" r="15" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="500" y="605" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">1</text>
  <text x="580" y="605" font-family="Arial" font-size="14">Process steps</text>
  
  <text x="590" y="640" font-family="Arial" font-size="14" font-weight="bold" text-anchor="end">GO:0007219</text>
  <text x="590" y="658" font-family="Arial" font-size="14" font-style="italic" text-anchor="end">Notch signaling pathway</text>
</svg>