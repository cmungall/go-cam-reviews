<svg width="800" height="550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Cellular components -->
  <rect x="0" y="0" width="800" height="550" fill="#f8f9fa" />
  
  <!-- ER membrane -->
  <rect x="50" y="200" width="700" height="40" fill="#b3d9ff" stroke="#0066cc" stroke-width="2" opacity="0.7" />
  <text x="60" y="225" font-family="Arial" font-size="14" fill="#000">Endoplasmic Reticulum Membrane (GO:0005789)</text>
  
  <!-- Cytoplasm -->
  <rect x="50" y="240" width="700" height="220" fill="#e6f2ff" opacity="0.5" />
  <text x="60" y="260" font-family="Arial" font-size="14" fill="#000">Cytoplasm</text>
  
  <!-- ER Lumen -->
  <rect x="50" y="40" width="700" height="160" fill="#ffe6cc" opacity="0.5" />
  <text x="60" y="60" font-family="Arial" font-size="14" fill="#000">ER Lumen</text>
  
  <!-- TAP1 and TAP2 complex -->
  <rect x="300" y="180" width="140" height="80" rx="10" ry="10" fill="#9fd8e6" stroke="#0066cc" stroke-width="2" />
  <text x="320" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#000">TAP1/TAP2</text>
  <text x="310" y="230" font-family="Arial" font-size="10" fill="#000">ABC-type peptide</text>
  <text x="310" y="245" font-family="Arial" font-size="10" fill="#000">antigen transporter</text>
  
  <!-- TAPBP (Tapasin) -->
  <rect x="200" y="150" width="80" height="40" rx="5" ry="5" fill="#a1d490" stroke="#006600" stroke-width="2" />
  <text x="210" y="170" font-family="Arial" font-size="12" font-weight="bold" fill="#000">TAPBP</text>
  <text x="205" y="185" font-family="Arial" font-size="8" fill="#000">Molecular adaptor</text>
  
  <!-- Viral protein ICP47 -->
  <polygon points="370,300 400,320 370,340 340,320" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="345" y="325" font-family="Arial" font-size="12" font-weight="bold" fill="#000">ICP47</text>
  
  <!-- Peptide antigen in cytoplasm -->
  <circle cx="200" cy="320" r="15" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="180" y="350" font-family="Arial" font-size="12" fill="#000">Peptide antigen</text>
  
  <!-- Peptide antigen in ER (transported) -->
  <circle cx="420" cy="120" r="15" fill="#ffcc99" stroke="#ff6600" stroke-width="2" opacity="0.5" />
  <text x="400" y="150" font-family="Arial" font-size="12" fill="#000" opacity="0.5">Peptide antigen</text>
  
  <!-- MHC class I -->
  <rect x="500" y="120" width="80" height="40" rx="5" ry="5" fill="#d4a1e0" stroke="#663399" stroke-width="2" opacity="0.7" />
  <text x="510" y="140" font-family="Arial" font-size="12" fill="#000">MHC class I</text>
  <text x="505" y="155" font-family="Arial" font-size="8" fill="#000">Peptide presenter</text>
  
  <!-- ICP47 molecular sequestering visualization -->
  <ellipse cx="370" cy="270" rx="45" ry="20" fill="none" stroke="#cc0000" stroke-width="1" stroke-dasharray="5,3" opacity="0.7" />
  <text x="335" y="274" font-family="Arial" font-size="10" fill="#cc0000">Sequestering</text>
  
  <!-- Arrows and interactions -->
  <!-- TAPBP to TAP1/TAP2 (positive regulation) -->
  <line x1="250" y1="170" x2="300" y2="190" stroke="#006600" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="255" y="165" font-family="Arial" font-size="10" fill="#006600">Positive regulation</text>
  
  <!-- ICP47 to TAP1/TAP2 (inhibition) -->
  <line x1="370" y1="300" x2="370" y2="260" stroke="#cc0000" stroke-width="2" marker-end="url(#arrowRed)" />
  <text x="380" y="285" font-family="Arial" font-size="10" fill="#cc0000">Inhibits</text>
  
  <!-- Peptide transport (normal pathway) -->
  <path d="M 210,310 Q 270,270 300,230" stroke="#0066cc" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrowBlue)" />
  <text x="220" y="280" font-family="Arial" font-size="10" fill="#0066cc">Transport</text>
  
  <!-- TAP to ER lumen (normal pathway) -->
  <path d="M 370,180 Q 380,150 420,120" stroke="#0066cc" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrowBlue)" />
  
  <!-- Peptide to MHC (normal pathway) -->
  <path d="M 435,120 Q 460,120 500,130" stroke="#0066cc" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrowBlue)" />
  <text x="450" y="110" font-family="Arial" font-size="10" fill="#0066cc">Assembly</text>
  
  <!-- Blocked pathway indication -->
  <line x1="370" y1="200" x2="370" y2="150" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="360" y1="160" x2="380" y2="140" stroke="#cc0000" stroke-width="2" />
  <line x1="380" y1="160" x2="360" y2="140" stroke="#cc0000" stroke-width="2" />
  
  <!-- Process labels -->
  <text x="100" y="100" font-family="Arial" font-size="12" font-weight="bold" fill="#0066cc">Normal: Peptide Antigen Assembly with MHC class I</text>
  <text x="100" y="430" font-family="Arial" font-size="12" font-weight="bold" fill="#cc0000">Viral Inhibition: ICP47 Blocks Peptide Transport</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0066cc" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#006600" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cc0000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="300" width="200" height="200" fill="white" stroke="black" stroke-width="1" />
  <text x="560" y="320" font-family="Arial" font-size="14" font-weight="bold" fill="#000">Legend</text>
  
  <!-- Legend items -->
  <rect x="560" y="330" width="20" height="10" fill="#9fd8e6" stroke="#0066cc" stroke-width="1" />
  <text x="585" y="340" font-family="Arial" font-size="10" fill="#000">TAP1/TAP2 - Peptide transporters</text>
  
  <rect x="560" y="350" width="20" height="10" fill="#a1d490" stroke="#006600" stroke-width="1" />
  <text x="585" y="360" font-family="Arial" font-size="10" fill="#000">TAPBP - Molecular adaptor</text>
  
  <polygon points="560,370 570,375 560,380 550,375" fill="#ff9999" stroke="#cc0000" stroke-width="1" />
  <text x="585" y="380" font-family="Arial" font-size="10" fill="#000">ICP47 - Viral inhibitor (HHV1)</text>
  
  <circle cx="570" cy="395" r="5" fill="#ffcc99" stroke="#ff6600" stroke-width="1" />
  <text x="585" y="400" font-family="Arial" font-size="10" fill="#000">Peptide antigen - Transport substrate</text>
  
  <rect x="560" y="410" width="20" height="10" fill="#d4a1e0" stroke="#663399" stroke-width="1" />
  <text x="585" y="420" font-family="Arial" font-size="10" fill="#000">MHC class I - Antigen presenter</text>
  
  <line x1="560" y1="435" x2="580" y2="435" stroke="#006600" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="585" y="440" font-family="Arial" font-size="10" fill="#000">Positive regulation</text>
  
  <line x1="560" y1="455" x2="580" y2="455" stroke="#cc0000" stroke-width="2" marker-end="url(#arrowRed)" />
  <text x="585" y="460" font-family="Arial" font-size="10" fill="#000">Inhibition</text>
  
  <line x1="560" y1="475" x2="580" y2="475" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="585" y="480" font-family="Arial" font-size="10" fill="#000">Transport/Process flow</text>
  
  <line x1="560" y1="495" x2="580" y2="495" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3" />
  <text x="585" y="500" font-family="Arial" font-size="10" fill="#000">Blocked pathway</text>
  
  <!-- Title -->
  <text x="50" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#000">HHV1-ICP47 Inhibition of MHC Class I Peptide Antigen Assembly</text>
</svg>