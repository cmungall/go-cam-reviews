<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell outline -->
  <rect width="800" height="600" fill="#f9f9f9" />
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="none" stroke="#cccccc" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Golgi apparatus -->
  <g transform="translate(600, 250)">
    <path d="M0,0 C20,-15 40,-20 60,-15 C80,-10 90,0 100,10 C110,20 115,30 110,40 C105,50 90,55 70,50 C50,45 40,35 30,25 C20,15 10,5 0,0 Z" fill="#f0d0a0" stroke="#a08060" stroke-width="2" />
    <path d="M-10,10 C10,-5 30,-10 50,-5 C70,0 80,10 90,20 C100,30 105,40 100,50 C95,60 80,65 60,60 C40,55 30,45 20,35 C10,25 0,15 -10,10 Z" fill="#e0c090" stroke="#a08060" stroke-width="2" />
    <path d="M-20,20 C0,5 20,0 40,5 C60,10 70,20 80,30 C90,40 95,50 90,60 C85,70 70,75 50,70 C30,65 20,55 10,45 C0,35 -10,25 -20,20 Z" fill="#d0b080" stroke="#a08060" stroke-width="2" />
    <text x="40" y="80" font-family="Arial" font-size="16" fill="#000000" text-anchor="middle">Golgi</text>
  </g>
  
  <!-- Early Endosome -->
  <g transform="translate(200, 300)">
    <ellipse cx="0" cy="0" rx="120" ry="100" fill="#c0e0ff" stroke="#6080c0" stroke-width="2" />
    <text x="0" y="0" font-family="Arial" font-size="16" fill="#000000" text-anchor="middle">Early Endosome</text>
    <text x="0" y="25" font-family="Arial" font-size="14" fill="#000000" text-anchor="middle">Membrane</text>
    
    <!-- Early Endosome Membrane Detail -->
    <rect x="-90" y="-70" width="180" height="40" rx="20" ry="20" fill="#a0c0e0" stroke="#6080c0" stroke-width="2" />
    <text x="0" y="-45" font-family="Arial" font-size="14" fill="#000000" text-anchor="middle">Early Endosome Membrane</text>
  </g>
  
  <!-- Transport Vesicle -->
  <g transform="translate(380, 280)">
    <circle cx="0" cy="0" r="30" fill="#d0e0ff" stroke="#6080c0" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" fill="#000000" text-anchor="middle">Transport</text>
    <text x="0" y="22" font-family="Arial" font-size="12" fill="#000000" text-anchor="middle">Vesicle</text>
  </g>
  
  <!-- Proteins -->
  <!-- ARL8B -->
  <g transform="translate(140, 230)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" ry="18" fill="#ff9090" stroke="#c06060" stroke-width="2" />
    <text x="0" y="6" font-family="Arial" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">ARL8B</text>
    <text x="0" y="-25" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">GTPase activity</text>
  </g>
  
  <!-- RUFY1 -->
  <g transform="translate(230, 230)">
    <rect x="-35" y="-18" width="70" height="36" rx="5" ry="5" fill="#90ff90" stroke="#60c060" stroke-width="2" />
    <text x="0" y="6" font-family="Arial" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">RUFY1</text>
    <text x="0" y="-25" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">Adaptor protein</text>
  </g>
  
  <!-- RAB4B -->
  <g transform="translate(300, 200)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" ry="18" fill="#9090ff" stroke="#6060c0" stroke-width="2" />
    <text x="0" y="6" font-family="Arial" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">RAB4B</text>
    <text x="0" y="-25" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">GTPase activity</text>
  </g>
  
  <!-- RAB14 -->
  <g transform="translate(300, 260)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" ry="18" fill="#9090ff" stroke="#6060c0" stroke-width="2" />
    <text x="0" y="6" font-family="Arial" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">RAB14</text>
    <text x="0" y="-25" font-family="Arial" font-size="11" fill="#333333" text-anchor="middle">GTPase activity</text>
  </g>
  
  <!-- Arrows and interactions -->
  <!-- ARL8B to RUFY1 -->
  <path d="M175,230 L195,230" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="185" y="218" font-family="Arial" font-size="12" fill="#000000" text-anchor="middle">Activates</text>
  
  <!-- RUFY1 to RAB4B -->
  <path d="M265,225 L275,225 Q285,225 285,215 L285,205 L265,205" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="285" y="220" font-family="Arial" font-size="12" fill="#000000" text-anchor="middle">Adaptor function</text>
  
  <!-- RUFY1 to RAB14 -->
  <path d="M265,235 L275,235 Q285,235 285,245 L285,255 L265,255" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- RAB proteins to vesicle -->
  <path d="M335,200 L355,210 L370,235" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M335,260 L355,250 L370,245" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="355" y="232" font-family="Arial" font-size="12" fill="#000000" text-anchor="middle">Vesicle</text>
  <text x="355" y="246" font-family="Arial" font-size="12" fill="#000000" text-anchor="middle">Fusion</text>
  
  <!-- Transport arrow -->
  <path d="M410,280 Q450,280 500,270 T590,250" stroke="#000000" stroke-width="4" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <text x="500" y="245" font-family="Arial" font-size="14" fill="#000000" text-anchor="middle">Transport to Golgi</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">RUFY1 Mediates Early Endosome to Golgi Transport</text>
  <text x="400" y="70" font-family="Arial" font-size="16" fill="#444444" text-anchor="middle">Human Cellular Pathway</text>
  
  <!-- Legend -->
  <g transform="translate(650, 450)">
    <rect x="-80" y="-20" width="160" height="130" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="0" y="0" font-family="Arial" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Legend</text>
    
    <!-- ARL8B -->
    <rect x="-70" y="10" width="30" height="15" rx="7.5" ry="7.5" fill="#ff9090" stroke="#c06060" stroke-width="1" />
    <text x="-15" y="22" font-family="Arial" font-size="12" fill="#000000">GTPase</text>
    
    <!-- RUFY1 -->
    <rect x="-70" y="35" width="30" height="15" rx="2.5" ry="2.5" fill="#90ff90" stroke="#60c060" stroke-width="1" />
    <text x="-15" y="47" font-family="Arial" font-size="12" fill="#000000">Adaptor protein</text>
    
    <!-- RAB -->
    <rect x="-70" y="60" width="30" height="15" rx="7.5" ry="7.5" fill="#9090ff" stroke="#6060c0" stroke-width="1" />
    <text x="-15" y="72" font-family="Arial" font-size="12" fill="#000000">RAB GTPases</text>
    
    <!-- Vesicle -->
    <circle cx="-55" cy="95" r="10" fill="#d0e0ff" stroke="#6080c0" stroke-width="1" />
    <text x="-15" y="98" font-family="Arial" font-size="12" fill="#000000">Transport vesicle</text>
  </g>
  
  <!-- Process description -->
  <text x="220" y="430" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Endosomal Vesicle Fusion</text>
  
  <text x="530" y="340" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">Protein Localization</text>
  <text x="530" y="355" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">to Golgi</text>
  
  <!-- Source note -->
  <text x="400" y="565" font-family="Arial" font-size="12" font-style="italic" fill="#666666" text-anchor="middle">GO-CAM: RUFY1 mediates early endosome to Golgi transport (Human)</text>
</svg>