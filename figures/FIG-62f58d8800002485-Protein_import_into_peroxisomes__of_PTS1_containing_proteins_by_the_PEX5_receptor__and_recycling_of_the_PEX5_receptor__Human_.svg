<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and cell outline -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f8f8" />
  
  <!-- Cell compartments -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f0f0f0" stroke="#666" stroke-width="2" />
  <text x="400" y="80" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Cytosol</text>
  
  <!-- Peroxisome -->
  <ellipse cx="400" cy="350" rx="200" ry="150" fill="#d1e7dd" stroke="#2a9d8f" stroke-width="3" />
  <text x="400" y="230" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Peroxisome</text>
  
  <!-- Peroxisomal membrane -->
  <path d="M200 350 C 250 300, 550 300, 600 350 C 550 400, 250 400, 200 350" fill="#89c2d9" stroke="#2a9d8f" stroke-width="3" fill-opacity="0.7" />
  <text x="400" y="275" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Peroxisomal Membrane</text>
  
  <!-- Docking complex -->
  <circle cx="350" cy="350" r="15" fill="#3a86ff" stroke="#333" stroke-width="1" />
  <text x="350" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="white">PEX14</text>
  <circle cx="380" cy="350" r="15" fill="#3a86ff" stroke="#333" stroke-width="1" />
  <text x="380" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="white">PEX13</text>
  
  <!-- RING complex -->
  <circle cx="450" cy="350" r="15" fill="#fb5607" stroke="#333" stroke-width="1" />
  <text x="450" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="white">PEX2</text>
  <circle cx="480" cy="350" r="15" fill="#fb5607" stroke="#333" stroke-width="1" />
  <text x="480" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="white">PEX10</text>
  <circle cx="510" cy="350" r="15" fill="#fb5607" stroke="#333" stroke-width="1" />
  <text x="510" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="white">PEX12</text>
  
  <!-- AAA ATPase complex -->
  <circle cx="280" cy="350" r="15" fill="#8338ec" stroke="#333" stroke-width="1" />
  <text x="280" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="white">PEX1</text>
  <circle cx="250" cy="350" r="15" fill="#8338ec" stroke="#333" stroke-width="1" />
  <text x="250" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="white">PEX6</text>
  <circle cx="220" cy="350" r="15" fill="#8338ec" stroke="#333" stroke-width="1" />
  <text x="220" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="white">PEX26</text>
  
  <!-- Step 1: PEX5 with cargo in cytosol -->
  <circle cx="150" cy="150" r="20" fill="#ff006e" stroke="#333" stroke-width="2" />
  <text x="150" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="white">PEX5</text>
  <rect x="170" y="135" width="30" height="30" fill="#ffbe0b" stroke="#333" stroke-width="1" />
  <text x="185" y="155" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PTS1</text>
  <text x="150" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">1. Cargo binding</text>
  
  <!-- Step 1 to 2 arrow -->
  <path d="M200 150 L280 170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Step 2: Docking at peroxisomal membrane -->
  <circle cx="300" cy="170" r="20" fill="#ff006e" stroke="#333" stroke-width="2" />
  <text x="300" y="175" font-family="Arial" font-size="14" text-anchor="middle" fill="white">PEX5</text>
  <rect x="320" y="155" width="30" height="30" fill="#ffbe0b" stroke="#333" stroke-width="1" />
  <text x="335" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PTS1</text>
  <text x="300" y="130" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">2. Docking</text>
  
  <!-- Step 2 to 3 arrow -->
  <path d="M300 190 L355 310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Step 3: Cargo translocation -->
  <rect x="400" y="400" width="30" height="30" fill="#ffbe0b" stroke="#333" stroke-width="1" />
  <text x="415" y="420" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PTS1</text>
  <text x="400" y="455" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">3. Cargo translocation</text>
  
  <!-- Step 3 arrow (translocation) -->
  <path d="M345 345 L400 400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" stroke-dasharray="5,3" />
  
  <!-- Step 4: PEX5 ubiquitination -->
  <circle cx="400" cy="320" r="20" fill="#ff006e" stroke="#333" stroke-width="2" />
  <text x="400" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="white">PEX5</text>
  <circle cx="420" cy="305" r="10" fill="#ff9e00" stroke="#333" stroke-width="1" />
  <text x="420" y="308" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Ub</text>
  <text x="500" y="300" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">4. Ubiquitination</text>
  
  <!-- Step 4 arrow -->
  <path d="M480 350 L420 320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Step 5: PEX5 extraction -->
  <circle cx="250" cy="250" r="20" fill="#ff006e" stroke="#333" stroke-width="2" />
  <text x="250" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="white">PEX5</text>
  <circle cx="270" cy="235" r="10" fill="#ff9e00" stroke="#333" stroke-width="1" />
  <text x="270" y="238" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Ub</text>
  <text x="160" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">5. Extraction</text>
  
  <!-- Step 5 arrows -->
  <path d="M250 330 L250 270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <path d="M380 320 L270 250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Step 6: Deubiquitination -->
  <circle cx="600" cy="150" r="20" fill="#ff006e" stroke="#333" stroke-width="2" />
  <text x="600" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="white">PEX5</text>
  <circle cx="550" cy="150" r="16" fill="#06d6a0" stroke="#333" stroke-width="1" />
  <text x="550" y="155" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">USP9X</text>
  <text x="600" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">6. Deubiquitination</text>
  
  <!-- Step 6 arrow -->
  <path d="M270 235 L550 150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Step 7: Recycling -->
  <path d="M580 170 L170 170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" stroke-dasharray="5,3" />
  <text x="375" y="195" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">7. Receptor recycling</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Protein Import into Peroxisomes via PEX5 Receptor</text>
  
  <!-- Legend -->
  <rect x="600" y="450" width="140" height="90" fill="white" stroke="#333" stroke-width="1" />
  <text x="670" y="470" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <circle cx="615" y="490" r="8" fill="#ff006e" />
  <text x="675" y="495" font-family="Arial" font-size="12" text-anchor="start" fill="#333">PEX5 receptor</text>
  
  <rect x="610" y="505" width="16" height="16" fill="#ffbe0b" />
  <text x="675" y="515" font-family="Arial" font-size="12" text-anchor="start" fill="#333">PTS1 cargo</text>
  
  <circle cx="615" y="530" r="8" fill="#3a86ff" />
  <text x="675" y="535" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Docking complex</text>
  
  <circle cx="615" y="550" r="8" fill="#fb5607" />
  <text x="675" y="555" font-family="Arial" font-size="12" text-anchor="start" fill="#333">RING complex</text>
  
  <circle cx="615" y="570" r="8" fill="#8338ec" />
  <text x="675" y="575" font-family="Arial" font-size="12" text-anchor="start" fill="#333">AAA ATPase complex</text>
</svg>