<svg width="850" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="10" y="10" width="830" height="680" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  
  <!-- Cell nucleus -->
  <ellipse cx="425" cy="330" rx="380" ry="280" fill="#eef6ff" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="425" y="100" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Nucleus</text>
  
  <!-- Title -->
  <text x="425" y="50" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">dTMP Biosynthetic Process (Mouse)</text>
  
  <!-- Pathway elements -->
  
  <!-- UDP to dUDP conversion -->
  <rect x="100" y="220" width="120" height="80" rx="10" ry="10" fill="#d1e6ff" stroke="#333" stroke-width="2"/>
  <text x="160" y="250" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">RNR Complex</text>
  <text x="160" y="270" text-anchor="middle" font-family="Arial" font-size="14">(GO:0036175)</text>
  <text x="160" y="290" text-anchor="middle" font-family="Arial" font-size="14">Rrm1, Rrm2</text>
  
  <!-- Function annotations -->
  <text x="160" y="190" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">Converts UDP to dUDP</text>
  
  <!-- Molecules -->
  <circle cx="50" cy="260" r="25" fill="#ffeeaa" stroke="#333" stroke-width="2"/>
  <text x="50" y="265" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">UDP</text>
  
  <circle cx="270" cy="260" r="25" fill="#ffeeaa" stroke="#333" stroke-width="2"/>
  <text x="270" y="265" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">dUDP</text>
  
  <circle cx="270" cy="400" r="25" fill="#ffeeaa" stroke="#333" stroke-width="2"/>
  <text x="270" y="405" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">dUTP</text>
  
  <circle cx="410" cy="500" r="25" fill="#ffeeaa" stroke="#333" stroke-width="2"/>
  <text x="410" y="505" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">dUMP</text>
  
  <circle cx="550" cy="500" r="25" fill="#ffeeaa" stroke="#333" stroke-width="2"/>
  <text x="550" y="505" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">dTMP</text>

  <!-- NMEs -->
  <rect x="270" y="310" width="120" height="60" rx="10" ry="10" fill="#d1e6ff" stroke="#333" stroke-width="2"/>
  <text x="330" y="335" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Nme1/2/3</text>
  <text x="330" y="355" text-anchor="middle" font-family="Arial" font-size="14">(GO:0004550)</text>
  
  <text x="385" y="315" text-anchor="start" font-family="Arial" font-size="12" font-style="italic">Converts dUDP to dUTP</text>
  
  <!-- Dut -->
  <rect x="340" y="420" width="140" height="60" rx="10" ry="10" fill="#d1e6ff" stroke="#333" stroke-width="2"/>
  <text x="410" y="445" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Dut</text>
  <text x="410" y="465" text-anchor="middle" font-family="Arial" font-size="14">(GO:0004170)</text>
  
  <text x="480" y="430" text-anchor="start" font-family="Arial" font-size="12" font-style="italic">dUTP diphosphatase</text>
  
  <!-- Tyms -->
  <rect x="480" y="420" width="140" height="60" rx="10" ry="10" fill="#d1e6ff" stroke="#333" stroke-width="2"/>
  <text x="550" y="445" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Tyms</text>
  <text x="550" y="465" text-anchor="middle" font-family="Arial" font-size="14">(GO:0004799)</text>
  
  <text x="550" y="410" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">Thymidylate synthase</text>
  
  <!-- SHMT -->
  <rect x="650" y="280" width="120" height="80" rx="10" ry="10" fill="#d1e6ff" stroke="#333" stroke-width="2"/>
  <text x="710" y="310" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Shmt1/2</text>
  <text x="710" y="330" text-anchor="middle" font-family="Arial" font-size="14">(GO:0004372)</text>
  <text x="710" y="350" text-anchor="middle" font-family="Arial" font-size="12">Tetrahydrofolate cycle</text>
  
  <text x="710" y="270" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">Glycine hydroxymethyltransferase</text>
  
  <!-- DHFR -->
  <rect x="650" y="400" width="120" height="60" rx="10" ry="10" fill="#d1e6ff" stroke="#333" stroke-width="2"/>
  <text x="710" y="425" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Dhfr</text>
  <text x="710" y="445" text-anchor="middle" font-family="Arial" font-size="14">(GO:0004146)</text>
  
  <text x="710" y="390" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">Dihydrofolate reductase</text>
  
  <!-- Arrows -->
  <path d="M75 260 L100 260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M220 260 L245 260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M270 285 L270 310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M270 370 L270 375" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M295 400 L340 420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M410 480 L410 475" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M435 500 L525 500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- SHMT and DHFR connections -->
  <path d="M650 320 L620 320 L620 430 L650 430" stroke="#333" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M770 430 L790 430 L790 320 L770 320" stroke="#333" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Connect SHMT and DHFR to Tyms -->
  <path d="M620 430 L550 480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="4,2"/>
  <path d="M710 460 L710 500 L575 500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="4,2"/>
  
  <!-- Marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="40" y="600" width="770" height="70" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="50" y="620" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  
  <rect x="50" y="630" width="20" height="20" fill="#d1e6ff" stroke="#333" stroke-width="1"/>
  <text x="80" y="645" font-family="Arial" font-size="14">Enzyme/Protein</text>
  
  <circle cx="150" cy="640" r="10" fill="#ffeeaa" stroke="#333" stroke-width="1"/>
  <text x="170" y="645" font-family="Arial" font-size="14">Metabolite</text>
  
  <line x1="220" y1="640" x2="250" y2="640" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="280" y="645" font-family="Arial" font-size="14">Reaction</text>
  
  <line x1="330" y1="640" x2="360" y2="640" stroke="#333" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="390" y="645" font-family="Arial" font-size="14">Regulatory relationship</text>
  
  <ellipse cx="480" cy="640" rx="15" ry="10" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="515" y="645" font-family="Arial" font-size="14">Cellular compartment</text>
</svg>