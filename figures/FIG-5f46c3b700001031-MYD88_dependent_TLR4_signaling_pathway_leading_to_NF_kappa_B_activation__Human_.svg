<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell structures -->
  <rect x="0" y="0" width="800" height="700" fill="#f0f9ff" stroke="none" />
  
  <!-- Cell membrane -->
  <path d="M50,220 Q400,170 750,220 Q400,270 50,220" fill="#d1e8ff" stroke="#333" stroke-width="3" />
  
  <!-- Extracellular space label -->
  <text x="400" y="120" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Extracellular Space (GO:0005615)</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="300" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Cytoplasm (GO:0005737)</text>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="550" rx="150" ry="90" fill="#d4e5ff" stroke="#333" stroke-width="3" />
  <text x="400" y="550" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Nucleus (GO:0005634)</text>
  
  <!-- LPS molecule -->
  <circle cx="200" cy="150" r="20" fill="#ff9999" stroke="#333" stroke-width="2" />
  <text x="200" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">LPS</text>
  
  <!-- LBP protein -->
  <rect x="270" y="130" width="60" height="30" rx="8" fill="#99ccff" stroke="#333" stroke-width="2" />
  <text x="300" y="152" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">LBP</text>
  
  <!-- CD14 protein -->
  <rect x="350" y="180" width="60" height="30" rx="8" fill="#99ccff" stroke="#333" stroke-width="2" />
  <text x="380" y="200" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CD14</text>
  
  <!-- TLR4 receptor in membrane -->
  <rect x="420" y="205" width="60" height="40" rx="8" fill="#99ff99" stroke="#333" stroke-width="2" />
  <text x="450" y="230" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TLR4</text>
  
  <!-- TIRAP -->
  <circle cx="430" cy="280" r="20" fill="#ffcc99" stroke="#333" stroke-width="2" />
  <text x="430" y="285" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TIRAP</text>
  
  <!-- MYD88 -->
  <circle cx="480" cy="310" r="20" fill="#ffcc99" stroke="#333" stroke-width="2" />
  <text x="480" y="315" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MYD88</text>
  
  <!-- IRAK4 -->
  <circle cx="480" cy="360" r="20" fill="#cc66ff" stroke="#333" stroke-width="2" />
  <text x="480" y="365" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IRAK4</text>
  
  <!-- IRAK2 -->
  <circle cx="480" cy="410" r="20" fill="#cc66ff" stroke="#333" stroke-width="2" />
  <text x="480" y="415" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IRAK2</text>
  
  <!-- TRAF6 -->
  <circle cx="480" cy="460" r="20" fill="#ff66cc" stroke="#333" stroke-width="2" />
  <text x="480" y="465" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TRAF6</text>
  
  <!-- ECSIT -->
  <circle cx="540" cy="460" r="20" fill="#ff99cc" stroke="#333" stroke-width="2" />
  <text x="540" y="465" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ECSIT</text>
  
  <!-- MAP3K7 -->
  <circle cx="600" cy="460" r="20" fill="#cc66ff" stroke="#333" stroke-width="2" />
  <text x="600" y="465" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MAP3K7</text>
  
  <!-- CHUK (IKKα) -->
  <circle cx="660" cy="460" r="20" fill="#cc66ff" stroke="#333" stroke-width="2" />
  <text x="660" y="465" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CHUK</text>
  
  <!-- NFKBIA (IκBα) -->
  <rect x="310" y="480" width="70" height="35" rx="8" fill="#bbbbff" stroke="#333" stroke-width="2" />
  <text x="345" y="502" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">NFKBIA</text>
  
  <!-- RELA (p65) -->
  <rect x="390" y="480" width="70" height="35" rx="8" fill="#ffbbbb" stroke="#333" stroke-width="2" />
  <text x="425" y="502" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RELA</text>
  
  <!-- RELA in nucleus -->
  <rect x="365" y="540" width="70" height="35" rx="8" fill="#ffbbbb" stroke="#333" stroke-width="2" />
  <text x="400" y="562" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RELA</text>
  
  <!-- Process annotations -->
  <text x="240" y="180" font-family="Arial" font-size="12" text-anchor="middle">LPS binding</text>
  <text x="380" y="240" font-family="Arial" font-size="12" text-anchor="middle">LPS presentation</text>
  <text x="520" y="250" font-family="Arial" font-size="12" text-anchor="middle">Receptor activation</text>
  <text x="570" y="310" font-family="Arial" font-size="12" text-anchor="middle">Adaptor recruitment</text>
  <text x="570" y="370" font-family="Arial" font-size="12" text-anchor="middle">Kinase activation</text>
  <text x="570" y="420" font-family="Arial" font-size="12" text-anchor="middle">Signaling cascade</text>
  <text x="570" y="500" font-family="Arial" font-size="12" text-anchor="middle">IκB kinase activation</text>
  <text x="300" y="530" font-family="Arial" font-size="12" text-anchor="middle">IκBα degradation</text>
  <text x="480" y="520" font-family="Arial" font-size="12" text-anchor="middle">NF-κB translocation</text>
  
  <!-- Signaling arrows -->
  <!-- LPS to LBP -->
  <path d="M220,150 L270,145" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- LBP to CD14 -->
  <path d="M330,145 C340,155 345,170 350,180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- CD14 to TLR4 -->
  <path d="M410,190 L420,210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- TLR4 to TIRAP -->
  <path d="M445,245 L435,260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- TIRAP to MYD88 -->
  <path d="M445,290 L465,300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- MYD88 to IRAK4 -->
  <path d="M480,330 L480,340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- IRAK4 to IRAK2 -->
  <path d="M480,380 L480,390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- IRAK2 to TRAF6 -->
  <path d="M480,430 L480,440" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- TRAF6 to ECSIT -->
  <path d="M500,460 L520,460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- ECSIT to MAP3K7 -->
  <path d="M560,460 L580,460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- MAP3K7 to CHUK -->
  <path d="M620,460 L640,460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- CHUK to NFKBIA-RELA complex -->
  <path d="M650,480 C600,490 550,500 460,495" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- NFKBIA degradation (dotted) -->
  <path d="M310,500 L280,520" stroke="#333" stroke-width="2" stroke-dasharray="5,3" />
  <text x="260" y="540" font-family="Arial" font-size="12">degraded</text>
  
  <!-- RELA translocation to nucleus -->
  <path d="M425,515 C425,525 410,530 400,540" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Process labels for additional clarity -->
  <text x="670" y="415" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Ubiquitination</text>
  <text x="680" y="490" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Phosphorylation</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">MYD88-dependent TLR4 Signaling Pathway</text>
  <text x="400" y="70" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Leading to NF-κB Activation in Human Cells</text>
  
  <!-- Legend -->
  <rect x="600" y="550" width="180" height="140" fill="#ffffff" stroke="#333" stroke-width="2" rx="5" />
  <text x="690" y="570" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="620" cy="590" r="10" fill="#ff9999" stroke="#333" stroke-width="2" />
  <text x="635" y="594" font-family="Arial" font-size="12" dominant-baseline="middle" text-anchor="start">LPS molecule</text>
  
  <rect x="615" y="610" width="20" height="16" rx="3" fill="#99ccff" stroke="#333" stroke-width="2" />
  <text x="645" y="618" font-family="Arial" font-size="12" dominant-baseline="middle" text-anchor="start">Binding proteins</text>
  
  <rect x="615" y="630" width="20" height="16" rx="3" fill="#99ff99" stroke="#333" stroke-width="2" />
  <text x="645" y="638" font-family="Arial" font-size="12" dominant-baseline="middle" text-anchor="start">Receptor</text>
  
  <circle cx="620" cy="655" r="10" fill="#ffcc99" stroke="#333" stroke-width="2" />
  <text x="645" y="658" font-family="Arial" font-size="12" dominant-baseline="middle" text-anchor="start">Adaptor proteins</text>
  
  <circle cx="620" cy="675" r="10" fill="#cc66ff" stroke="#333" stroke-width="2" />
  <text x="645" y="678" font-family="Arial" font-size="12" dominant-baseline="middle" text-anchor="start">Kinases</text>
</svg>