<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Cell Shapes -->
  <!-- NK Cell -->
  <ellipse cx="250" cy="300" rx="200" ry="240" fill="#e6f2ff" stroke="#3333cc" stroke-width="2"/>
  <text x="140" y="120" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#000080">Natural Killer Cell</text>
  
  <!-- Target Cell -->
  <ellipse cx="600" cy="300" rx="170" ry="200" fill="#ffebeb" stroke="#cc3333" stroke-width="2"/>
  <text x="600" y="120" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#800000">Target Cell</text>
  
  <!-- Cell components -->
  <!-- NK Cell nucleus -->
  <ellipse cx="200" cy="270" rx="70" ry="90" fill="#c6d9ec" stroke="#666699" stroke-width="1.5"/>
  <text x="200" y="270" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000">Nucleus</text>
  
  <!-- Target Cell nucleus -->
  <ellipse cx="600" cy="230" rx="60" ry="80" fill="#f7c6c6" stroke="#996666" stroke-width="1.5"/>
  <text x="600" y="230" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000">Nucleus</text>
  
  <!-- Immunological Synapse -->
  <path d="M 440 300 C 460 320, 420 350, 440 370" stroke="#333333" stroke-width="2.5" fill="none" stroke-dasharray="7,4"/>
  <rect x="385" y="405" width="110" height="40" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="440" y="425" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Immunological Synapse</text>
  <text x="440" y="440" font-family="Arial" font-size="10" text-anchor="middle">(GO:0001772)</text>
  
  <!-- NK Cell Plasma Membrane Label -->
  <rect x="225" y="165" width="110" height="35" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="280" y="185" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Plasma Membrane</text>
  <text x="280" y="200" font-family="Arial" font-size="10" text-anchor="middle">(GO:0005886)</text>
  
  <!-- Target Cell Cytoplasm Label -->
  <rect x="545" y="340" width="110" height="35" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="600" y="360" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Cytoplasm</text>
  <text x="600" y="375" font-family="Arial" font-size="10" text-anchor="middle">(GO:0005737)</text>
  
  <!-- FCGR3A Receptor in NK cell membrane -->
  <rect x="370" y="260" width="40" height="15" fill="#99ccff" stroke="#000000" stroke-width="1.5"/>
  <rect x="350" y="225" width="80" height="45" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="390" y="240" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">FCGR3A</text>
  <text x="390" y="255" font-family="Arial" font-size="10" text-anchor="middle">(P08637)</text>
  <text x="390" y="270" font-family="Arial" font-size="10" text-anchor="middle">Immune receptor</text>
  
  <!-- Perforin in immunological synapse -->
  <circle cx="420" cy="330" r="15" fill="#ffcc00" stroke="#000000" stroke-width="1.5"/>
  <rect x="350" y="365" width="80" height="45" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="390" y="380" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PRF1</text>
  <text x="390" y="395" font-family="Arial" font-size="10" text-anchor="middle">Ca²⁺ binding</text>
  <text x="390" y="410" font-family="Arial" font-size="10" text-anchor="middle">(GO:0005509)</text>
  <text x="420" y="334" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">PRF1</text>
  
  <!-- Perforin pore in target cell membrane -->
  <circle cx="460" cy="320" r="10" fill="white" stroke="#ff9900" stroke-width="3"/>
  <rect x="475" y="335" width="80" height="35" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="515" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">PRF1 pore</text>
  <text x="515" y="365" font-family="Arial" font-size="10" text-anchor="middle">(GO:0022829)</text>
  
  <!-- Granzyme B in target cell -->
  <rect x="530" y="300" width="25" height="25" fill="#ff6666" stroke="#000000" stroke-width="1.5"/>
  <rect x="530" y="250" width="80" height="45" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="570" y="265" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">GZMB</text>
  <text x="570" y="280" font-family="Arial" font-size="10" text-anchor="middle">Endopeptidase</text>
  <text x="570" y="295" font-family="Arial" font-size="10" text-anchor="middle">(GO:0004252)</text>
  <text x="542" y="316" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">GZMB</text>
  
  <!-- Process Arrows with more space for labels -->
  <!-- FCGR3A to degranulation -->
  <path d="M 410 270 C 430 280, 450 320, 420 330" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead1)"/>
  <rect x="415" y="275" width="100" height="45" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="465" y="290" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">NK cell</text>
  <text x="465" y="305" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">degranulation</text>
  <text x="465" y="320" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">(GO:0043320)</text>
  
  <!-- Perforin to pore formation -->
  <path d="M 435 330 L 455 320" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Pore to Granzyme transport -->
  <path d="M 468 320 L 525 312" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead3)"/>
  <rect x="440" y="275" width="110" height="45" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="495" y="290" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Protein</text>
  <text x="495" y="305" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">transmembrane</text>
  <text x="495" y="320" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">(GO:0071806)</text>
  
  <!-- Granzyme to cell death -->
  <path d="M 550 312 C 570 310, 580 290, 580 260" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead4)"/>
  <rect x="600" y="300" width="120" height="50" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="660" y="315" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Granzyme-mediated</text>
  <text x="660" y="330" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">programmed cell</text>
  <text x="660" y="345" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">death signaling</text>
  <text x="660" y="360" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">(GO:0140507)</text>
  
  <!-- T Cell Mediated Cytotoxicity Process Label -->
  <rect x="240" y="460" width="220" height="40" fill="#eaeaea" stroke="#666666" stroke-width="1" rx="10" ry="10"/>
  <text x="350" y="480" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">T Cell Mediated Cytotoxicity</text>
  <text x="350" y="495" font-family="Arial" font-size="10" text-anchor="middle">(GO:0001913)</text>
  
  <!-- Marker definitions -->
  <defs>
    <marker id="arrowhead1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="arrowhead4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Legend with clean spacing -->
  <rect x="50" y="480" width="180" height="110" fill="#f5f5f5" stroke="#666666" stroke-width="1" rx="10" ry="10"/>
  <text x="140" y="500" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  
  <rect x="70" y="515" width="15" height="15" fill="#99ccff" stroke="#000000" stroke-width="1.5"/>
  <text x="95" y="528" font-family="Arial" font-size="12" text-anchor="start">FCGR3A (P08637)</text>
  
  <circle cx="77" cy="545" r="7.5" fill="#ffcc00" stroke="#000000" stroke-width="1.5"/>
  <text x="95" y="548" font-family="Arial" font-size="12" text-anchor="start">PRF1 (P14222)</text>
  
  <rect x="70" y="560" width="15" height="15" fill="#ff6666" stroke="#000000" stroke-width="1.5"/>
  <text x="95" y="573" font-family="Arial" font-size="12" text-anchor="start">GZMB (P10144)</text>
  
  <circle cx="77" cy="585" r="7.5" fill="white" stroke="#ff9900" stroke-width="3"/>
  <text x="95" y="589" font-family="Arial" font-size="12" text-anchor="start">PRF1 pore</text>
  
  <!-- Title -->
  <rect x="100" y="15" width="600" height="70" fill="#f0f0f0" stroke="#999999" stroke-width="1" rx="10" ry="10"/>
  <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Perforin Maturation Leading to Granzyme-Mediated</text>
  <text x="400" y="65" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Programmed Cell Death Signaling Pathway (Human)</text>
</svg>