<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background with cytoplasm -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="70" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Cytoplasm</text>
  
  <!-- Phagophore Assembly Site (PAS) -->
  <ellipse cx="480" cy="300" rx="250" ry="150" fill="#e6f2ff" stroke="#333" stroke-dasharray="5,3" stroke-width="2"/>
  <text x="480" y="180" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Phagophore Assembly Site</text>
  
  <!-- Autophagosome Membrane -->
  <path d="M600,350 C650,320 680,380 630,420 C580,450 540,440 530,400 C520,360 550,330 600,350 Z" fill="#d1e7dd" stroke="#333" stroke-width="2"/>
  <text x="590" y="390" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Autophagosome Membrane</text>
  
  <!-- Proteins and activities -->
  <!-- ATM -->
  <circle cx="120" cy="150" r="30" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="120" y="155" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">ATM</text>
  
  <!-- CHK2 -->
  <circle cx="220" cy="220" r="30" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="220" y="225" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">CHK2</text>
  
  <!-- TRIM32 -->
  <circle cx="320" cy="290" r="30" fill="#ffff99" stroke="#333" stroke-width="2"/>
  <text x="320" y="295" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">TRIM32</text>
  
  <!-- ATG7 -->
  <circle cx="420" cy="290" r="30" fill="#ccff99" stroke="#333" stroke-width="2"/>
  <text x="420" y="295" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">ATG7</text>
  
  <!-- Two activities of ATG7 -->
  <rect x="350" y="350" width="70" height="35" rx="5" ry="5" fill="#99ffcc" stroke="#333" stroke-width="2"/>
  <text x="385" y="372" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Atg12 activating</text>
  
  <rect x="450" y="350" width="70" height="35" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="485" y="372" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Atg8 activating</text>
  
  <!-- MAP1LC3B -->
  <circle cx="550" cy="400" r="30" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="550" y="396" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">MAP1</text>
  <text x="550" y="410" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">LC3B</text>
  
  <!-- Arrows and connections -->
  <!-- ATM to CHK2 -->
  <path d="M145,170 L195,200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="170" y="175" font-family="Arial" font-size="12" font-weight="bold" fill="#333">activates</text>
  <text x="145" y="195" font-family="Arial" font-size="10" fill="#666">Protein kinase</text>
  
  <!-- CHK2 to TRIM32 -->
  <path d="M245,240 L295,270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="270" y="245" font-family="Arial" font-size="12" font-weight="bold" fill="#333">activates</text>
  <text x="240" y="260" font-family="Arial" font-size="10" fill="#666">Protein kinase</text>
  
  <!-- TRIM32 to ATG7 -->
  <path d="M350,290 L390,290" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="280" font-family="Arial" font-size="12" font-weight="bold" fill="#333">ubiquitinates</text>
  <text x="345" y="310" font-family="Arial" font-size="10" fill="#666">K63-linked</text>
  
  <!-- ATG7 to its two activities -->
  <path d="M410,320 L385,350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M430,320 L465,350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ATG7 activities to MAP1LC3B -->
  <path d="M420,385 L520,390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M520,385 L520,390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="470" y="405" font-family="Arial" font-size="10" fill="#666">Lipidation process</text>
  
  <!-- MAP1LC3B to membrane -->
  <path d="M580,400 L610,400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="600" y="420" font-family="Arial" font-size="12" font-weight="bold" fill="#333">binds PE</text>
  
  <!-- Process labels -->
  <text x="120" y="100" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Cellular Response to Stress</text>
  <text x="400" y="470" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Autophagosome Assembly</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Atg7-mediated Autophagosome Assembly via ATM-CHK2-TRIM32 Axis</text>
  
  <!-- Legend -->
  <rect x="60" y="480" width="680" height="60" rx="5" ry="5" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="70" y="500" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend:</text>
  
  <!-- Legend items -->
  <circle cx="100" cy="520" r="8" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="110" y="525" font-family="Arial" font-size="12" fill="#333">Kinase</text>
  
  <circle cx="180" cy="520" r="8" fill="#ffff99" stroke="#333" stroke-width="1"/>
  <text x="190" y="525" font-family="Arial" font-size="12" fill="#333">E3 Ubiquitin Ligase</text>
  
  <circle cx="320" cy="520" r="8" fill="#ccff99" stroke="#333" stroke-width="1"/>
  <text x="330" y="525" font-family="Arial" font-size="12" fill="#333">E1-like Enzyme</text>
  
  <rect x="430" y="515" width="16" height="10" rx="2" ry="2" fill="#99ffcc" stroke="#333" stroke-width="1"/>
  <text x="450" y="525" font-family="Arial" font-size="12" fill="#333">Enzymatic Activity</text>
  
  <circle cx="540" cy="520" r="8" fill="#cc99ff" stroke="#333" stroke-width="1"/>
  <text x="550" y="525" font-family="Arial" font-size="12" fill="#333">Ubiquitin-like Protein</text>
  
  <path d="M650,520 L670,520" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="680" y="525" font-family="Arial" font-size="12" fill="#333">Causal Relationship</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>