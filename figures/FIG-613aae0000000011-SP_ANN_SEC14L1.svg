<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f9fa" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Background for cytoplasm -->
  <rect x="60" y="60" width="680" height="480" rx="45" ry="45" fill="#f5f8fa" fill-opacity="0.7"/>
  
  <!-- Cell components labels -->
  <text x="400" y="90" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Cytoplasm</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="400" cy="420" rx="200" ry="100" fill="#ffe0b2" stroke="#e65100" stroke-width="3"/>
  <ellipse cx="400" cy="420" rx="180" ry="80" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  
  <!-- Mitochondrial membrane label with improved position and background -->
  <rect x="320" y="330" width="160" height="25" rx="5" ry="5" fill="white" fill-opacity="0.9"/>
  <text x="400" y="350" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#e65100">Mitochondrial Membrane</text>
  
  <!-- Proteins -->
  <!-- RIG-I in cytoplasm -->
  <circle cx="200" cy="200" r="40" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="200" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">RIG-I</text>
  <text x="200" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">(O95786)</text>
  
  <!-- SEC14L1 in cytoplasm -->
  <rect x="520" y="180" width="80" height="40" rx="10" ry="10" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="560" y="200" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">SEC14L1</text>
  <text x="560" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">(Q92503)</text>
  
  <!-- MAVS at mitochondrial membrane -->
  <rect x="350" y="420" width="100" height="40" rx="10" ry="10" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="400" y="440" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">MAVS</text>
  <text x="400" y="460" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">(Q7Z434)</text>
  
  <!-- Interactions -->
  <!-- RIG-I to MAVS (binding) -->
  <path d="M225 230 C 290 310, 310 380, 350 420" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <!-- Label background for better readability -->
  <rect x="250" y="305" width="120" height="40" rx="5" ry="5" fill="white" fill-opacity="0.8"/>
  <text x="270" y="320" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">RIG-I binding</text>
  <text x="270" y="340" font-family="Arial" font-size="12" fill="#2c3e50">(GO:0039552)</text>
  
  <!-- SEC14L1 to MAVS (negative regulation) -->
  <path d="M 520 200 C 470 250, 430 350, 420 420" stroke="#e53935" stroke-width="3" fill="none" stroke-dasharray="5,5" marker-end="url(#inhibition)"/>
  <!-- Label background for better readability -->
  <rect x="465" y="285" width="110" height="40" rx="5" ry="5" fill="white" fill-opacity="0.8"/>
  <text x="490" y="300" font-family="Arial" font-size="14" font-weight="bold" fill="#e53935">Sequestering</text>
  <text x="490" y="320" font-family="Arial" font-size="12" fill="#e53935">(GO:0140311)</text>
  
  <!-- MAVS molecular adaptor activity -->
  <path d="M 450 430 C 500 430, 550 450, 580 480" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <!-- Label background for better readability -->
  <rect x="520" y="485" width="220" height="40" rx="5" ry="5" fill="white" fill-opacity="0.8"/>
  <text x="580" y="500" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">Molecular adaptor activity</text>
  <text x="580" y="520" font-family="Arial" font-size="12" fill="#2c3e50">(GO:0060090)</text>
  
  <!-- RIG-I activity -->
  <!-- Label background for better readability -->
  <rect x="60" y="125" width="160" height="60" rx="5" ry="5" fill="white" fill-opacity="0.8"/>
  <text x="110" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">Pattern recognition</text>
  <text x="110" y="160" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">receptor activity</text>
  <text x="110" y="180" font-family="Arial" font-size="12" fill="#2c3e50">(GO:0038187)</text>
  
  <!-- Flow direction arrows -->
  <path d="M 240 160 L 170 120" stroke="#666" stroke-width="2" fill="none" marker-end="url(#directional)"/>
  <path d="M 560 160 L 560 120" stroke="#666" stroke-width="2" fill="none" marker-end="url(#directional)"/>
  <path d="M 480 480 L 480 520" stroke="#666" stroke-width="2" fill="none" marker-end="url(#directional)"/>
  
  <!-- Arrowheads definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="inhibition" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <circle cx="6" cy="6" r="5" fill="white" stroke="#e53935" stroke-width="2"/>
    </marker>
    <marker id="directional" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="580" y="60" width="150" height="140" rx="5" ry="5" fill="white" stroke="#2c3e50" stroke-width="1"/>
  <text x="655" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Legend</text>
  
  <circle cx="600" y="100" r="8" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="670" y="105" font-family="Arial" font-size="14" fill="#2c3e50">RIG-I</text>
  
  <rect x="592" y="115" width="16" height="10" rx="2" ry="2" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="670" y="125" font-family="Arial" font-size="14" fill="#2c3e50">MAVS</text>
  
  <rect x="592" y="135" width="16" height="10" rx="2" ry="2" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="670" y="145" font-family="Arial" font-size="14" fill="#2c3e50">SEC14L1</text>
  
  <line x1="590" y1="155" x2="610" y2="155" stroke="#e53935" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="670" y="160" font-family="Arial" font-size="14" fill="#2c3e50">Inhibition</text>
  
  <line x1="590" y1="175" x2="610" y2="175" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="610 175, 615 172, 610 169" fill="#2c3e50"/>
  <text x="670" y="180" font-family="Arial" font-size="14" fill="#2c3e50">Activation</text>
</svg>