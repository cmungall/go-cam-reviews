<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#888" stroke-width="2" opacity="0.7"/>
  <text x="70" y="85" font-family="Arial" font-size="18" font-weight="bold">Mouse Cell</text>
  
  <!-- Title -->
  <text x="400" y="80" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Inosine Catabolic Process (Mouse)</text>
  
  <!-- Cytosol compartment -->
  <rect x="100" y="100" width="600" height="250" rx="20" ry="20" fill="#e6f2ff" stroke="#666" stroke-width="1.5" opacity="0.8"/>
  <text x="120" y="125" font-family="Arial" font-size="16" font-weight="bold">Cytosol</text>
  
  <!-- Peroxisome compartment -->
  <rect x="220" y="370" width="400" height="150" rx="20" ry="20" fill="#ffe6cc" stroke="#666" stroke-width="1.5" opacity="0.8"/>
  <text x="240" y="395" font-family="Arial" font-size="16" font-weight="bold">Peroxisome</text>
  
  <!-- Pathway components -->
  <!-- Inosine -->
  <circle cx="150" cy="200" r="30" fill="#b3e6cc" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Inosine</text>
  
  <!-- Pnp -->
  <rect x="220" y="180" width="100" height="40" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1.5"/>
  <text x="270" y="205" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pnp</text>
  <text x="270" y="220" font-family="Arial" font-size="12" text-anchor="middle">purine-nucleoside</text>
  <text x="270" y="235" font-family="Arial" font-size="12" text-anchor="middle">phosphorylase</text>
  
  <!-- Hypoxanthine -->
  <circle cx="360" cy="200" r="30" fill="#b3e6cc" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="195" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Hypoxanthine</text>
  
  <!-- Xdh for hypoxanthine -->
  <rect x="430" y="180" width="100" height="40" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="205" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Xdh</text>
  <text x="480" y="220" font-family="Arial" font-size="12" text-anchor="middle">hypoxanthine</text>
  <text x="480" y="235" font-family="Arial" font-size="12" text-anchor="middle">oxidase</text>
  
  <!-- Xanthine -->
  <circle cx="570" cy="200" r="30" fill="#b3e6cc" stroke="#333" stroke-width="1.5"/>
  <text x="570" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Xanthine</text>
  
  <!-- Xdh for xanthine -->
  <rect x="500" y="275" width="100" height="40" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1.5"/>
  <text x="550" y="295" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Xdh</text>
  <text x="550" y="310" font-family="Arial" font-size="12" text-anchor="middle">xanthine oxidase</text>
  
  <!-- Urate -->
  <circle cx="390" cy="300" r="30" fill="#b3e6cc" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Urate</text>
  
  <!-- Transport arrow to peroxisome -->
  <path d="M 390 330 Q 390 350 390 370" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="410" y="350" font-family="Arial" font-size="12" font-style="italic">Transport</text>
  
  <!-- Uox -->
  <rect x="350" y="390" width="80" height="40" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="410" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Uox</text>
  <text x="390" y="425" font-family="Arial" font-size="12" text-anchor="middle">urate oxidase</text>
  
  <!-- HIU -->
  <circle cx="280" cy="440" r="25" fill="#b3e6cc" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="435" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">HIU</text>
  <text x="280" y="450" font-family="Arial" font-size="9" text-anchor="middle">(hydroxyisourate)</text>
  
  <!-- Urah -->
  <rect x="230" y="480" width="80" height="35" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1.5"/>
  <text x="270" y="495" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Urah</text>
  <text x="270" y="510" font-family="Arial" font-size="10" text-anchor="middle">hydroxyisourate hydrolase</text>
  
  <!-- OHCU -->
  <circle cx="380" cy="480" r="25" fill="#b3e6cc" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="475" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">OHCU</text>
  <text x="380" y="490" font-family="Arial" font-size="8" text-anchor="middle">(2-oxo-4-hydroxy-4-carboxy-</text>
  <text x="380" y="500" font-family="Arial" font-size="8" text-anchor="middle">5-ureidoimidazoline)</text>
  
  <!-- Urad -->
  <rect x="450" y="470" width="80" height="35" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1.5"/>
  <text x="490" y="485" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Urad</text>
  <text x="490" y="500" font-family="Arial" font-size="10" text-anchor="middle">OHCU decarboxylase</text>
  
  <!-- Allantoin -->
  <circle cx="570" cy="440" r="30" fill="#b3e6cc" stroke="#333" stroke-width="1.5"/>
  <text x="570" y="445" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Allantoin</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <line x1="180" y1="200" x2="220" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="200" x2="330" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="200" x2="430" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="530" y1="200" x2="540" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="230" x2="570" y2="245" stroke="#333" stroke-width="2"/>
  <line x1="570" y1="245" x2="550" y2="275" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="295" x2="420" y2="295" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="410" x2="305" y2="430" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="465" x2="280" y2="480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="310" y1="495" x2="355" y2="485" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="405" y1="480" x2="450" y2="485" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="530" y1="485" x2="550" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="600" y="475" width="160" height="85" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="610" y="495" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  <rect x="610" y="505" width="20" height="10" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="635" y="515" font-family="Arial" font-size="12">Enzyme/Gene Product</text>
  <circle cx="620" cy="535" r="8" fill="#b3e6cc" stroke="#333" stroke-width="1"/>
  <text x="635" y="540" font-family="Arial" font-size="12">Metabolite</text>
  <line x1="610" y1="555" x2="630" y2="555" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="635" y="560" font-family="Arial" font-size="12">Transport</text>
</svg>