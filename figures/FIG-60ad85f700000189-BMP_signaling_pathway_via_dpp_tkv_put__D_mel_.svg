<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background layers representing cellular compartments -->
  <rect x="0" y="0" width="800" height="650" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">BMP Signaling Pathway via dpp-tkv/put in Drosophila melanogaster</text>
  
  <!-- Extracellular space -->
  <rect x="50" y="50" width="700" height="100" fill="#e6f2ff" stroke="#a9c4eb" stroke-width="2" rx="5" />
  <text x="120" y="75" font-family="Arial" font-size="14" text-anchor="middle" fill="#666" font-weight="bold">Extracellular Space</text>
  
  <!-- Plasma membrane -->
  <rect x="50" y="150" width="700" height="40" fill="#ffcccc" stroke="#ff9999" stroke-width="2" />
  <text x="120" y="175" font-family="Arial" font-size="14" text-anchor="middle" fill="#666" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytosol -->
  <rect x="50" y="190" width="700" height="200" fill="#e6ffe6" stroke="#b3d9b3" stroke-width="2" />
  <text x="90" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="#666" font-weight="bold">Cytosol</text>
  
  <!-- Nucleus -->
  <rect x="150" y="400" width="500" height="180" fill="#ffe6ff" stroke="#d9b3d9" stroke-width="2" rx="10" />
  <text x="200" y="420" font-family="Arial" font-size="14" text-anchor="middle" fill="#666" font-weight="bold">Nucleus</text>
  
  <!-- Molecules and Interactions -->
  
  <!-- Dpp in extracellular space -->
  <circle cx="400" cy="110" r="25" fill="#ff9966" stroke="#cc6600" stroke-width="2" />
  <text x="400" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Dpp</text>
  <text x="400" y="95" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(FBgn0000490)</text>
  
  <!-- Receptors in plasma membrane -->
  <!-- Put -->
  <rect x="350" y="150" width="40" height="50" fill="#ff6666" stroke="#990000" stroke-width="2" />
  <text x="370" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Put</text>
  <text x="370" y="195" font-family="Arial" font-size="8" text-anchor="middle" fill="white">(FBgn0003169)</text>
  
  <!-- Tkv -->
  <rect x="420" y="150" width="40" height="50" fill="#ff6666" stroke="#990000" stroke-width="2" />
  <text x="440" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Tkv</text>
  <text x="440" y="195" font-family="Arial" font-size="8" text-anchor="middle" fill="white">(FBgn0003716)</text>
  
  <!-- Mad in cytosol -->
  <circle cx="300" cy="250" r="25" fill="#6699cc" stroke="#336699" stroke-width="2" />
  <text x="300" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Mad</text>
  <text x="300" y="270" font-family="Arial" font-size="8" text-anchor="middle" fill="white">(FBgn0011648)</text>
  
  <!-- Med in cytosol -->
  <circle cx="400" cy="280" r="25" fill="#6699cc" stroke="#336699" stroke-width="2" />
  <text x="400" y="285" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Med</text>
  <text x="400" y="300" font-family="Arial" font-size="8" text-anchor="middle" fill="white">(FBgn0288966)</text>
  
  <!-- Dad inhibitor -->
  <polygon points="500,250 525,230 550,250 525,270" fill="#cc99ff" stroke="#9933ff" stroke-width="2" />
  <text x="525" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Dad</text>
  <text x="525" y="270" font-family="Arial" font-size="8" text-anchor="middle" fill="white">(FBgn0020493)</text>
  
  <!-- Mad in nucleus -->
  <circle cx="300" cy="480" r="25" fill="#6699cc" stroke="#336699" stroke-width="2" />
  <text x="300" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Mad</text>
  <text x="300" y="500" font-family="Arial" font-size="8" text-anchor="middle" fill="white">(FBgn0011648)</text>
  
  <!-- Med in nucleus -->
  <circle cx="400" cy="480" r="25" fill="#6699cc" stroke="#336699" stroke-width="2" />
  <text x="400" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Med</text>
  <text x="400" y="500" font-family="Arial" font-size="8" text-anchor="middle" fill="white">(FBgn0288966)</text>
  
  <!-- DNA binding site -->
  <rect x="250" y="540" width="200" height="15" fill="#a6a6a6" stroke="#808080" stroke-width="2" rx="2" />
  <text x="350" y="535" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">DNA binding site</text>
  
  <!-- Functional labels -->
  <text x="400" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-style="italic">receptor ligand activity</text>
  <text x="390" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-style="italic">(GO:0048018)</text>
  
  <text x="440" y="135" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-style="italic">BMP receptor activity</text>
  <text x="440" y="145" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-style="italic">(GO:0098821)</text>
  
  <text x="300" y="530" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-style="italic">transcription activator</text>
  <text x="300" y="542" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-style="italic">(GO:0001228)</text>
  
  <!-- Arrows for pathway -->
  <!-- Dpp to receptors -->
  <line x1="400" y1="135" x2="390" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Put to Tkv -->
  <line x1="390" y1="175" x2="420" y2="175" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Tkv to Mad -->
  <line x1="430" y1="200" x2="320" y2="230" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Mad to Med interaction -->
  <line x1="320" y1="260" x2="380" y2="275" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="350" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-style="italic">co-SMAD binding</text>
  <text x="350" y="262" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-style="italic">(GO:0070410)</text>
  
  <!-- Dad inhibiting Mad -->
  <line x1="500" y1="250" x2="330" y2="250" stroke="#f00" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#inhibitmark)" />
  <text x="415" y="235" font-family="Arial" font-size="10" text-anchor="middle" fill="#f00" font-style="italic">inhibits</text>
  <text x="415" y="247" font-family="Arial" font-size="10" text-anchor="middle" fill="#f00" font-style="italic">(GO:0030514)</text>
  
  <!-- Mad moving to nucleus -->
  <line x1="300" y1="275" x2="300" y2="455" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="280" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">translocation</text>
  
  <!-- Med moving to nucleus -->
  <line x1="400" y1="305" x2="400" y2="455" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="420" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">translocation</text>
  
  <!-- Mad and Med to DNA -->
  <line x1="310" y1="500" x2="330" y2="530" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="390" y1="500" x2="370" y2="530" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Overall pathway label -->
  <text x="650" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">BMP signaling pathway</text>
  <text x="650" y="295" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(GO:0030509)</text>
  
  <!-- Markers definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
    <marker id="inhibitmark" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#f00" stroke-width="2" />
      <line x1="0" y1="10" x2="10" y2="0" stroke="#f00" stroke-width="2" />
    </marker>
  </defs>
</svg>