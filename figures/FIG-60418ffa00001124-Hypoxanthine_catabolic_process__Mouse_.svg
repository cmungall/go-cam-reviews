<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Compartments -->
  <!-- Cytosol -->
  <rect x="100" y="150" width="600" height="280" rx="20" ry="20" fill="#f0f4ff" stroke="#aabae0" stroke-width="2"/>
  <text x="120" y="180" font-family="Arial" font-size="18" fill="#555">Cytosol (GO:0005829)</text>
  
  <!-- Peroxisome -->
  <ellipse cx="400" cy="510" rx="280" ry="80" fill="#fff2e6" stroke="#ffb366" stroke-width="2"/>
  <text x="290" y="470" font-family="Arial" font-size="18" fill="#555">Peroxisome (GO:0005777)</text>
  
  <!-- Labels for Xdh activities in cytosol -->
  <!-- Hypoxanthine → Xanthine pathway (top) -->
  <rect x="150" y="220" width="180" height="50" rx="10" ry="10" fill="#d9ebff" stroke="#75b5ff" stroke-width="2"/>
  <text x="160" y="248" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Xdh (MGI:98973)</text>
  <text x="160" y="264" font-family="Arial" font-size="12" fill="#555">Hypoxanthine dehydrogenase</text>
  
  <rect x="150" y="290" width="180" height="50" rx="10" ry="10" fill="#d9ebff" stroke="#75b5ff" stroke-width="2"/>
  <text x="160" y="318" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Xdh (MGI:98973)</text>
  <text x="160" y="334" font-family="Arial" font-size="12" fill="#555">Hypoxanthine oxidase</text>
  
  <!-- Substrate-Product -->
  <rect x="110" y="250" width="30" height="30" rx="15" ry="15" fill="#e6ffe6" stroke="#66cc66" stroke-width="1.5"/>
  <text x="70" y="260" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Hypoxanthine</text>
  <path d="M340 245 L380 245" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Xanthine → Urate pathway (middle) -->
  <rect x="390" y="220" width="180" height="50" rx="10" ry="10" fill="#d9ebff" stroke="#75b5ff" stroke-width="2"/>
  <text x="400" y="248" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Xdh (MGI:98973)</text>
  <text x="400" y="264" font-family="Arial" font-size="12" fill="#555">Xanthine dehydrogenase</text>
  
  <rect x="390" y="290" width="180" height="50" rx="10" ry="10" fill="#d9ebff" stroke="#75b5ff" stroke-width="2"/>
  <text x="400" y="318" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Xdh (MGI:98973)</text>
  <text x="400" y="334" font-family="Arial" font-size="12" fill="#555">Xanthine oxidase</text>
  
  <!-- Substrate-Product -->
  <rect x="400" y="200" width="30" height="30" rx="15" ry="15" fill="#e6ffe6" stroke="#66cc66" stroke-width="1.5"/>
  <text x="435" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Xanthine</text>
  <path d="M580 245 L620 245" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Transport between cytosol and peroxisome -->
  <rect x="630" y="230" width="30" height="30" rx="15" ry="15" fill="#e6ffe6" stroke="#66cc66" stroke-width="1.5"/>
  <text x="665" y="248" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Urate</text>
  <path d="M645 260 L645 460" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="650" y="370" font-family="Arial" font-size="13" fill="#555" transform="rotate(90 650,370)">Transport to peroxisome</text>
  
  <!-- Peroxisome reactions -->
  <!-- Urate oxidase -->
  <rect x="200" y="500" width="150" height="50" rx="10" ry="10" fill="#ffe6cc" stroke="#ff9933" stroke-width="2"/>
  <text x="215" y="528" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Uox (MGI:98907)</text>
  <text x="208" y="544" font-family="Arial" font-size="12" fill="#555">Urate oxidase</text>
  
  <!-- Hydroxyisourate hydrolase -->
  <rect x="380" y="500" width="150" height="50" rx="10" ry="10" fill="#ffe6cc" stroke="#ff9933" stroke-width="2"/>
  <text x="395" y="528" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Urah (MGI:1916142)</text>
  <text x="390" y="544" font-family="Arial" font-size="12" fill="#555">Hydroxyisourate hydrolase</text>
  
  <!-- OHCU decarboxylase -->
  <rect x="560" y="500" width="150" height="50" rx="10" ry="10" fill="#ffe6cc" stroke="#ff9933" stroke-width="2"/>
  <text x="575" y="528" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Urad (MGI:3647519)</text>
  <text x="570" y="544" font-family="Arial" font-size="12" fill="#555">OHCU decarboxylase</text>
  
  <!-- Substrate-Product arrows -->
  <rect x="170" y="500" width="30" height="30" rx="15" ry="15" fill="#e6ffe6" stroke="#66cc66" stroke-width="1.5"/>
  <text x="130" y="515" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Urate</text>
  <path d="M350 525 L380 525" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="352" y="480" width="30" height="30" rx="15" ry="15" fill="#e6ffe6" stroke="#66cc66" stroke-width="1.5"/>
  <text x="352" y="470" font-family="Arial" font-size="14" font-weight="bold" fill="#555">5-HIU</text>
  <path d="M530 525 L560 525" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="532" y="480" width="30" height="30" rx="15" ry="15" fill="#e6ffe6" stroke="#66cc66" stroke-width="1.5"/>
  <text x="532" y="470" font-family="Arial" font-size="14" font-weight="bold" fill="#555">OHCU</text>
  <path d="M710 525 L740 525" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="740" y="510" width="30" height="30" rx="15" ry="15" fill="#e6ffe6" stroke="#66cc66" stroke-width="1.5"/>
  <text x="772" y="528" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Allantoin</text>
  <text x="772" y="544" font-family="Arial" font-size="12" fill="#555">(CHEBI:15676)</text>
  
  <!-- Process Label -->
  <text x="250" y="40" font-family="Arial" font-size="22" font-weight="bold" fill="#333">Hypoxanthine Catabolic Process (GO:0009114)</text>
  <text x="350" y="65" font-family="Arial" font-size="16" fill="#555">Mouse (NCBITaxon:10090)</text>
  
  <!-- Legend -->
  <rect x="100" y="80" width="600" height="50" rx="5" ry="5" fill="#f9f9f9" stroke="#cccccc" stroke-width="1.5"/>
  <text x="110" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend:</text>
  
  <rect x="180" y="90" width="20" height="20" rx="10" ry="10" fill="#e6ffe6" stroke="#66cc66" stroke-width="1.5"/>
  <text x="205" y="105" font-family="Arial" font-size="14" fill="#333">Metabolite</text>
  
  <rect x="300" y="90" width="40" height="20" rx="5" ry="5" fill="#d9ebff" stroke="#75b5ff" stroke-width="1.5"/>
  <text x="345" y="105" font-family="Arial" font-size="14" fill="#333">Cytosolic enzyme</text>
  
  <rect x="480" y="90" width="40" height="20" rx="5" ry="5" fill="#ffe6cc" stroke="#ff9933" stroke-width="1.5"/>
  <text x="525" y="105" font-family="Arial" font-size="14" fill="#333">Peroxisomal enzyme</text>
  
  <line x1="620" y1="100" x2="640" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="650" y="105" font-family="Arial" font-size="14" fill="#333">Reaction flow</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>