<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" />
  
  <!-- Mitochondrion -->
  <ellipse cx="250" cy="200" rx="150" ry="100" fill="#ffeaa7" stroke="#e17055" stroke-width="2" />
  <ellipse cx="250" cy="200" rx="130" ry="80" fill="#fdcb6e" stroke="#e17055" stroke-width="2" />
  <text x="250" y="110" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Mitochondrion</text>
  
  <!-- Cytosol label -->
  <text x="550" y="110" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Cytosol</text>
  
  <!-- Mitochondrial Matrix label -->
  <text x="250" y="170" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Mitochondrial Matrix</text>
  <text x="250" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e17055">Mitochondrial Inner Membrane</text>
  
  <!-- Enzymes and pathway nodes -->
  <!-- Mitochondrial enzymes -->
  <circle cx="200" cy="180" r="30" fill="#74b9ff" stroke="#0984e3" stroke-width="2" />
  <text x="200" y="175" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Pcx</text>
  <text x="200" y="190" text-anchor="middle" font-family="Arial" font-size="10">Pyruvate Carboxylase</text>
  
  <circle cx="300" cy="180" r="30" fill="#74b9ff" stroke="#0984e3" stroke-width="2" />
  <text x="300" y="175" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Mdh2</text>
  <text x="300" y="190" text-anchor="middle" font-family="Arial" font-size="10">Malate Dehydrogenase</text>
  
  <!-- Membrane transporter -->
  <rect x="240" y="230" width="50" height="35" rx="5" ry="5" fill="#55efc4" stroke="#00b894" stroke-width="2" />
  <text x="265" y="245" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Slc25a10</text>
  <text x="265" y="260" text-anchor="middle" font-family="Arial" font-size="10">Malate Transporter</text>
  
  <!-- Cytosolic enzymes - arranged in pathway order -->
  <circle cx="400" cy="320" r="30" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2" />
  <text x="400" y="315" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Mdh1</text>
  <text x="400" y="330" text-anchor="middle" font-family="Arial" font-size="10">Malate Dehydrogenase</text>
  
  <circle cx="500" cy="320" r="30" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2" />
  <text x="500" y="315" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Pck1</text>
  <text x="500" y="330" text-anchor="middle" font-family="Arial" font-size="10">PEPCK</text>
  
  <circle cx="600" cy="320" r="30" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2" />
  <text x="600" y="315" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Eno1</text>
  <text x="600" y="330" text-anchor="middle" font-family="Arial" font-size="10">Enolase</text>
  
  <circle cx="600" cy="400" r="30" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2" />
  <text x="600" y="395" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Pgam1</text>
  <text x="600" y="410" text-anchor="middle" font-family="Arial" font-size="10">Phosphoglycerate Mutase</text>
  
  <circle cx="500" cy="400" r="30" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2" />
  <text x="500" y="395" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Pgk1</text>
  <text x="500" y="410" text-anchor="middle" font-family="Arial" font-size="10">Phosphoglycerate Kinase</text>
  
  <circle cx="400" cy="400" r="30" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2" />
  <text x="400" y="395" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Gapdh</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial" font-size="10">GAPDH</text>
  
  <circle cx="300" cy="400" r="30" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2" />
  <text x="300" y="395" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Tpi1</text>
  <text x="300" y="410" text-anchor="middle" font-family="Arial" font-size="10">Triose-P Isomerase</text>
  
  <circle cx="200" cy="400" r="30" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2" />
  <text x="200" y="395" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Gpd1</text>
  <text x="200" y="410" text-anchor="middle" font-family="Arial" font-size="10">Glycerol-3-P Dehydrogenase</text>
  
  <!-- Metabolites/substrates -->
  <text x="150" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">Pyruvate</text>
  <text x="250" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">Oxaloacetate</text>
  <text x="350" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">Malate</text>
  <text x="350" y="300" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">Malate</text>
  <text x="450" y="290" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">Oxaloacetate</text>
  <text x="550" y="290" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">PEP</text>
  <text x="650" y="290" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">2-PG</text>
  <text x="650" y="370" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">3-PG</text>
  <text x="550" y="370" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">1,3-BPG</text>
  <text x="450" y="370" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">G3P</text>
  <text x="350" y="370" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">DHAP</text>
  <text x="250" y="370" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">Glycerol-3-P</text>
  
  <!-- Pathway arrows -->
  <line x1="230" y1="180" x2="270" y2="180" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="300" y1="210" x2="275" y2="230" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="250" y1="265" x2="230" y2="290" stroke="#2c3e50" stroke-width="2" />
  <line x1="230" y1="290" x2="370" y2="320" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="430" y1="320" x2="470" y2="320" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="530" y1="320" x2="570" y2="320" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="600" y1="350" x2="600" y2="370" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="570" y1="400" x2="530" y2="400" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="470" y1="400" x2="430" y2="400" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="370" y1="400" x2="330" y2="400" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="270" y1="400" x2="230" y2="400" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Title and model reference -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Glyceraldehyde-3-phosphate Biosynthetic Process in Mouse</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial" font-size="14">GO-CAM: gomodel:6494e2e900002018</text>
  
  <!-- Final product label -->
  <text x="160" y="440" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#d63031">Glyceraldehyde-3-phosphate</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="470" width="150" height="130" rx="5" ry="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1" />
  <text x="675" y="490" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="620" cy="515" r="10" fill="#74b9ff" stroke="#0984e3" stroke-width="1" />
  <text x="690" y="519" text-anchor="middle" font-family="Arial" font-size="12">Mitochondrial Enzymes</text>
  
  <rect x="610" y="535" width="20" height="14" rx="2" ry="2" fill="#55efc4" stroke="#00b894" stroke-width="1" />
  <text x="690" y="544" text-anchor="middle" font-family="Arial" font-size="12">Transporter</text>
  
  <circle cx="620" cy="565" r="10" fill="#a29bfe" stroke="#6c5ce7" stroke-width="1" />
  <text x="690" y="569" text-anchor="middle" font-family="Arial" font-size="12">Cytosolic Enzymes</text>
  
  <line x1="610" y1="585" x2="630" y2="585" stroke="#2c3e50" stroke-width="1" marker-end="url(#arrowhead)" />
  <text x="690" y="589" text-anchor="middle" font-family="Arial" font-size="12">Reaction Direction</text>
  
  <text x="675" y="609" text-anchor="middle" font-family="Arial" font-size="12" fill="#d63031">Metabolites</text>
  
  <!-- Abbreviations -->
  <text x="80" y="490" text-anchor="start" font-family="Arial" font-size="10">Abbreviations:</text>
  <text x="80" y="505" text-anchor="start" font-family="Arial" font-size="10">PEP: Phosphoenolpyruvate</text>
  <text x="80" y="520" text-anchor="start" font-family="Arial" font-size="10">2-PG: 2-Phosphoglycerate</text>
  <text x="80" y="535" text-anchor="start" font-family="Arial" font-size="10">3-PG: 3-Phosphoglycerate</text>
  <text x="220" y="505" text-anchor="start" font-family="Arial" font-size="10">1,3-BPG: 1,3-Bisphosphoglycerate</text>
  <text x="220" y="520" text-anchor="start" font-family="Arial" font-size="10">G3P: Glyceraldehyde-3-phosphate</text>
  <text x="220" y="535" text-anchor="start" font-family="Arial" font-size="10">DHAP: Dihydroxyacetone phosphate</text>
</svg>