<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="550" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="2" />
  
  <!-- Cytosol label -->
  <text x="400" y="90" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Cytosol (GO:0005829)</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="600" cy="400" rx="100" ry="70" fill="#ffd6cc" stroke="#cc6600" stroke-width="2" />
  <text x="600" y="380" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Mitochondrion</text>
  <text x="600" y="405" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">(GO:0005739)</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">dUMP Catabolic Process (Mouse)</text>
  
  <!-- Pathway Components -->
  <!-- Metabolites represented as rounded rectangles - all uniform size -->
  <rect x="150" y="200" width="90" height="45" rx="10" ry="10" fill="white" stroke="#333" stroke-width="2" />
  <text x="195" y="225" font-family="Arial" font-size="14" text-anchor="middle">dUMP</text>
  
  <rect x="300" y="200" width="90" height="45" rx="10" ry="10" fill="white" stroke="#333" stroke-width="2" />
  <text x="345" y="225" font-family="Arial" font-size="14" text-anchor="middle">dUrd</text>
  
  <rect x="450" y="200" width="90" height="45" rx="10" ry="10" fill="white" stroke="#333" stroke-width="2" />
  <text x="495" y="225" font-family="Arial" font-size="14" text-anchor="middle">Uracil</text>
  
  <rect x="450" y="300" width="90" height="45" rx="10" ry="10" fill="white" stroke="#333" stroke-width="2" />
  <text x="495" y="325" font-family="Arial" font-size="14" text-anchor="middle">DHU</text>
  
  <rect x="450" y="400" width="90" height="45" rx="10" ry="10" fill="white" stroke="#333" stroke-width="2" />
  <text x="495" y="420" font-family="Arial" font-size="14" text-anchor="middle">β-ureido-</text>
  <text x="495" y="440" font-family="Arial" font-size="14" text-anchor="middle">propionate</text>
  
  <rect x="600" y="450" width="90" height="45" rx="10" ry="10" fill="white" stroke="#333" stroke-width="2" />
  <text x="645" y="475" font-family="Arial" font-size="14" text-anchor="middle">β-alanine</text>
  
  <!-- Enzymes represented as ellipses - all uniform size -->
  <ellipse cx="240" cy="200" rx="40" ry="25" fill="#d4ebf2" stroke="#336699" stroke-width="2" />
  <text x="240" y="205" font-family="Arial" font-size="14" text-anchor="middle">Nt5c/Nt5c3</text>
  
  <ellipse cx="375" cy="200" rx="40" ry="25" fill="#d4ebf2" stroke="#336699" stroke-width="2" />
  <text x="375" y="205" font-family="Arial" font-size="14" text-anchor="middle">Upp1</text>
  
  <ellipse cx="450" cy="250" rx="40" ry="25" fill="#d4ebf2" stroke="#336699" stroke-width="2" />
  <text x="450" y="255" font-family="Arial" font-size="14" text-anchor="middle">Dpyd</text>
  
  <ellipse cx="450" cy="350" rx="40" ry="25" fill="#d4ebf2" stroke="#336699" stroke-width="2" />
  <text x="450" y="355" font-family="Arial" font-size="14" text-anchor="middle">Dpys</text>
  
  <ellipse cx="525" cy="425" rx="40" ry="25" fill="#d4ebf2" stroke="#336699" stroke-width="2" />
  <text x="525" y="430" font-family="Arial" font-size="14" text-anchor="middle">Upb1</text>
  
  <ellipse cx="600" cy="350" rx="40" ry="25" fill="#ffc299" stroke="#cc6600" stroke-width="2" />
  <text x="600" y="355" font-family="Arial" font-size="14" text-anchor="middle">Agxt2</text>
  
  <!-- Arrows with consistent styling -->
  <!-- Define arrowhead marker first to ensure consistency -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <path d="M240 200 L290 200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M390 200 L440 200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M495 245 L495 290" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M495 345 L495 390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M540 425 L590 425 Q 610 425 620 440 L 640 450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Additional arrows that represent enzyme actions -->
  <line x1="240" y1="225" x2="240" y2="260" stroke="#336699" stroke-width="1.5" stroke-dasharray="4,2" />
  <line x1="375" y1="225" x2="375" y2="260" stroke="#336699" stroke-width="1.5" stroke-dasharray="4,2" />
  <line x1="450" y1="275" x2="450" y2="290" stroke="#336699" stroke-width="1.5" stroke-dasharray="4,2" />
  <line x1="450" y1="375" x2="450" y2="390" stroke="#336699" stroke-width="1.5" stroke-dasharray="4,2" />
  <line x1="525" y1="450" x2="525" y2="490" stroke="#336699" stroke-width="1.5" stroke-dasharray="4,2" />
  <line x1="600" y1="375" x2="600" y2="440" stroke="#cc6600" stroke-width="1.5" stroke-dasharray="4,2" />
  
  <!-- Gene labels with GO molecular function - consistently aligned -->
  <text x="100" y="290" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Nt5c (GO:0008253, 5'-nucleotidase activity)</text>
  <text x="100" y="310" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Nt5c3 (GO:0008253, 5'-nucleotidase activity)</text>
  <text x="100" y="330" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Upp1 (GO:0047847, deoxyuridine phosphorylase)</text>
  <text x="100" y="350" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Dpyd (GO:0017113, dihydropyrimidine dehydrogenase)</text>
  <text x="100" y="370" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Dpys (GO:0004157, dihydropyrimidinase)</text>
  <text x="100" y="390" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Upb1 (GO:0003837, beta-ureidopropionase)</text>
  <text x="100" y="410" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Agxt2 (GO:0016223, beta-alanine:pyruvate transaminase)</text>
  
  <!-- Process label -->
  <text x="400" y="570" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">GO:0046079 - dUMP catabolic process</text>
  
  <!-- Legend for identifying source data -->
  <rect x="100" y="520" width="15" height="15" fill="#d4ebf2" stroke="#336699" stroke-width="1" />
  <text x="125" y="533" font-family="Arial" font-size="12" text-anchor="start">Cytosolic Enzyme</text>
  
  <rect x="250" y="520" width="15" height="15" fill="#ffc299" stroke="#cc6600" stroke-width="1" />
  <text x="275" y="533" font-family="Arial" font-size="12" text-anchor="start">Mitochondrial Enzyme</text>
  
  <line x1="400" y1="520" x2="430" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="440" y="533" font-family="Arial" font-size="12" text-anchor="start">Metabolic Flow</text>
  
  <line x1="550" y1="520" x2="580" y2="520" stroke="#336699" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="590" y="533" font-family="Arial" font-size="12" text-anchor="start">Enzyme Action</text>
</svg>