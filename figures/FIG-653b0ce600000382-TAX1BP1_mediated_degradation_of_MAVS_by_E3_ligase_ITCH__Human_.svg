<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with mitochondrion outline -->
  <ellipse cx="400" cy="300" rx="380" ry="250" fill="#f9f7e8" stroke="#555" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="80" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">TAX1BP1-mediated degradation of MAVS by E3 ligase ITCH (Human)</text>
  <text x="690" y="560" font-family="Arial" font-size="16" text-anchor="end" font-style="italic">Mitochondrion (GO:0005739)</text>
  
  <!-- MAVS protein -->
  <rect x="180" y="250" width="120" height="60" rx="10" ry="10" fill="#a8d5ba" stroke="#333" stroke-width="2"/>
  <text x="240" y="282" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">MAVS</text>
  <text x="240" y="302" font-family="Arial" font-size="12" text-anchor="middle">(Q7Z434)</text>
  
  <!-- TAX1BP1 protein -->
  <rect x="400" y="180" width="120" height="60" rx="10" ry="10" fill="#ffccaa" stroke="#333" stroke-width="2"/>
  <text x="460" y="212" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">TAX1BP1</text>
  <text x="460" y="232" font-family="Arial" font-size="12" text-anchor="middle">(Q86VP1)</text>
  
  <!-- ITCH protein -->
  <rect x="400" y="320" width="120" height="60" rx="10" ry="10" fill="#ffaaaa" stroke="#333" stroke-width="2"/>
  <text x="460" y="352" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ITCH</text>
  <text x="460" y="372" font-family="Arial" font-size="12" text-anchor="middle">(Q96J02)</text>
  
  <!-- TRAF3IP3 protein -->
  <rect x="620" y="250" width="120" height="60" rx="10" ry="10" fill="#aaccff" stroke="#333" stroke-width="2"/>
  <text x="680" y="282" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">TRAF3IP3</text>
  <text x="680" y="302" font-family="Arial" font-size="12" text-anchor="middle">(Q9Y228)</text>
  
  <!-- Connection arrows and labels -->
  <!-- MAVS to TRAF3IP3 -->
  <path d="M300 280 Q460 280 620 280" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="none"/>
  <rect x="420" y="250" width="80" height="26" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="460" y="268" font-family="Arial" font-size="14" text-anchor="middle">signals</text>
  <rect x="420" y="280" width="80" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="460" y="295" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">RO:0002629</text>
  
  <!-- TAX1BP1 to ITCH -->
  <path d="M460 240 L460 320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="none"/>
  <rect x="470" y="270" width="60" height="26" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="500" y="288" font-family="Arial" font-size="14" text-anchor="middle">adapts</text>
  <rect x="470" y="300" width="80" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="510" y="315" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">RO:0002413</text>
  
  <!-- ITCH to MAVS -->
  <path d="M400 350 Q320 350 240 310" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="none"/>
  <rect x="270" y="320" width="100" height="26" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="320" y="338" font-family="Arial" font-size="14" text-anchor="middle">ubiquitinates</text>
  <rect x="280" y="345" width="80" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="320" y="360" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">RO:0002630</text>
  
  <!-- Ubiquitination tag -->
  <g transform="translate(200, 235)">
    <circle cx="0" cy="0" r="15" fill="#ffdd44" stroke="#333" stroke-width="1"/>
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Ub</text>
  </g>
  <rect x="155" y="210" width="90" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="200" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">K48-linked</text>
  
  <!-- Process annotation -->
  <rect x="50" y="430" width="700" height="80" rx="5" ry="5" fill="#eeeeee" stroke="#777" stroke-width="1"/>
  <text x="60" y="450" font-family="Arial" font-size="16" font-weight="bold">Biological Process:</text>
  <text x="60" y="470" font-family="Arial" font-size="14">- Cytoplasmic pattern recognition receptor signaling pathway (GO:0002753)</text>
  <text x="60" y="490" font-family="Arial" font-size="14">- Negative regulation of cytoplasmic pattern recognition receptor signaling pathway (GO:0039532)</text>
  <text x="60" y="510" font-family="Arial" font-size="14">- Protein K48-linked ubiquitination (GO:0070936)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="530" width="700" height="50" rx="5" ry="5" fill="#f8f8f8" stroke="#777" stroke-width="1"/>
  <text x="60" y="550" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  <rect x="130" y="540" width="20" height="10" fill="#a8d5ba" stroke="#333" stroke-width="1"/>
  <text x="155" y="550" font-family="Arial" font-size="14">MAVS - Signaling adaptor activity (GO:0035591)</text>
  <rect x="380" y="540" width="20" height="10" fill="#ffccaa" stroke="#333" stroke-width="1"/>
  <text x="405" y="550" font-family="Arial" font-size="14">TAX1BP1 - Protein-macromolecule adaptor activity (GO:0030674)</text>
  <rect x="130" y="560" width="20" height="10" fill="#ffaaaa" stroke="#333" stroke-width="1"/>
  <text x="155" y="570" font-family="Arial" font-size="14">ITCH - Ubiquitin protein ligase activity (GO:0061630)</text>
  <rect x="380" y="560" width="20" height="10" fill="#aaccff" stroke="#333" stroke-width="1"/>
  <text x="405" y="570" font-family="Arial" font-size="14">TRAF3IP3 - Molecular adaptor activity (GO:0060090)</text>
</svg>