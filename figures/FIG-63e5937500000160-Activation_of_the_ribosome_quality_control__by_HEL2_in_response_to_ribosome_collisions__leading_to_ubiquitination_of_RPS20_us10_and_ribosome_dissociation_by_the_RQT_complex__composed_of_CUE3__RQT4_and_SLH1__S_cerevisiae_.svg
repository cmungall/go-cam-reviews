<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with slight gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <!-- Protein shapes -->
    <symbol id="hel2-protein" viewBox="0 0 60 40">
      <ellipse cx="30" cy="20" rx="28" ry="18" fill="#6c9bd1" stroke="#2c5282" stroke-width="2"/>
      <text x="30" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="white">HEL2</text>
    </symbol>
    
    <symbol id="cue3-protein" viewBox="0 0 60 40">
      <ellipse cx="30" cy="20" rx="28" ry="18" fill="#8fb06c" stroke="#455c35" stroke-width="2"/>
      <text x="30" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="white">CUE3</text>
    </symbol>
    
    <symbol id="rqt4-protein" viewBox="0 0 60 40">
      <ellipse cx="30" cy="20" rx="28" ry="18" fill="#d39e50" stroke="#8c5c0f" stroke-width="2"/>
      <text x="30" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="white">RQT4</text>
    </symbol>
    
    <symbol id="slh1-protein" viewBox="0 0 60 40">
      <ellipse cx="30" cy="20" rx="28" ry="18" fill="#c767ad" stroke="#742c5a" stroke-width="2"/>
      <text x="30" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="white">SLH1</text>
    </symbol>
    
    <symbol id="ribosome" viewBox="0 0 100 60">
      <ellipse cx="50" cy="30" rx="48" ry="28" fill="#f0d58f" stroke="#b89b53" stroke-width="2"/>
      <ellipse cx="35" cy="30" rx="15" ry="20" fill="#e6c46c" stroke="#b89b53" stroke-width="1"/>
      <ellipse cx="65" cy="30" rx="20" ry="25" fill="#e6c46c" stroke="#b89b53" stroke-width="1"/>
      <text x="50" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#5e4a1a">Ribosome</text>
    </symbol>
    
    <symbol id="stalled-ribosome" viewBox="0 0 100 60">
      <ellipse cx="50" cy="30" rx="48" ry="28" fill="#f0d58f" stroke="#b89b53" stroke-width="2"/>
      <ellipse cx="35" cy="30" rx="15" ry="20" fill="#e6c46c" stroke="#b89b53" stroke-width="1"/>
      <ellipse cx="65" cy="30" rx="20" ry="25" fill="#e6c46c" stroke="#b89b53" stroke-width="1"/>
      <text x="50" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#5e4a1a">Stalled Ribosome</text>
    </symbol>
    
    <symbol id="ubiquitin" viewBox="0 0 30 30">
      <circle cx="15" cy="15" r="13" fill="#e74c3c" stroke="#992213" stroke-width="1.5"/>
      <text x="15" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Ub</text>
    </symbol>
    
    <symbol id="rps20" viewBox="0 0 50 30">
      <rect x="5" y="5" width="40" height="20" rx="5" ry="5" fill="#3498db" stroke="#2166a0" stroke-width="1.5"/>
      <text x="25" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="white">RPS20</text>
    </symbol>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg-gradient)"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Ribosome Quality Control Pathway in S. cerevisiae</text>
  
  <!-- Step 1: Collided/Stalled Ribosomes -->
  <g transform="translate(120, 120)">
    <use href="#ribosome" width="100" height="60"/>
    <use href="#ribosome" width="100" height="60" x="60" y="0"/>
    
    <text x="75" y="-20" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">1</text>
    <text x="75" y="95" font-family="Arial" font-size="14" text-anchor="middle">Ribosome Collision</text>
  </g>
  
  <!-- Step 2: HEL2 Detection -->
  <g transform="translate(350, 120)">
    <use href="#stalled-ribosome" width="100" height="60"/>
    <use href="#hel2-protein" width="60" height="40" x="60" y="-35"/>
    
    <text x="60" y="-55" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">2</text>
    <text x="60" y="95" font-family="Arial" font-size="14" text-anchor="middle">HEL2 Sensor Activity</text>
    <text x="60" y="115" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0170011)</text>
  </g>
  
  <!-- Arrow from 1 to 2 -->
  <line x1="230" y1="150" x2="320" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Ubiquitination -->
  <g transform="translate(550, 120)">
    <use href="#stalled-ribosome" width="100" height="60"/>
    <use href="#rps20" width="50" height="30" x="30" y="-20"/>
    <use href="#ubiquitin" width="30" height="30" x="30" y="-35"/>
    <use href="#ubiquitin" width="30" height="30" x="45" y="-35"/>
    <use href="#ubiquitin" width="30" height="30" x="60" y="-35"/>
    <use href="#hel2-protein" width="60" height="40" x="90" y="-20"/>
    
    <text x="60" y="-55" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">3</text>
    <text x="60" y="95" font-family="Arial" font-size="14" text-anchor="middle">K63-linked Ubiquitination of RPS20</text>
    <text x="60" y="115" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0070534)</text>
  </g>
  
  <!-- Arrow from 2 to 3 -->
  <line x1="450" y1="150" x2="520" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: CUE3/RQT4 Recognition -->
  <g transform="translate(250, 280)">
    <use href="#stalled-ribosome" width="100" height="60"/>
    <use href="#rps20" width="50" height="30" x="30" y="-20"/>
    <use href="#ubiquitin" width="30" height="30" x="30" y="-35"/>
    <use href="#ubiquitin" width="30" height="30" x="45" y="-35"/>
    <use href="#ubiquitin" width="30" height="30" x="60" y="-35"/>
    
    <use href="#cue3-protein" width="60" height="40" x="110" y="-20"/>
    <use href="#rqt4-protein" width="60" height="40" x="110" y="30"/>
    
    <text x="60" y="-55" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">4</text>
    <text x="60" y="95" font-family="Arial" font-size="14" text-anchor="middle">K63-Ub Recognition</text>
    <text x="60" y="115" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0070530)</text>
  </g>
  
  <!-- Arrow from 3 to 4 -->
  <path d="M 600,190 Q 550,240 350,280" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: SLH1 Activity -->
  <g transform="translate(550, 280)">
    <use href="#slh1-protein" width="60" height="40" x="30" y="0"/>
    <use href="#cue3-protein" width="60" height="40" x="0" y="-35"/>
    <use href="#rqt4-protein" width="60" height="40" x="60" y="-35"/>
    
    <text x="60" y="-55" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">5</text>
    <text x="60" y="65" font-family="Arial" font-size="14" text-anchor="middle">RQT Complex Formation</text>
  </g>
  
  <!-- Arrow from 4 to 5 -->
  <line x1="350" y1="310" x2="520" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: Ribosome Dissociation -->
  <g transform="translate(400, 430)">
    <use href="#ribosome" width="80" height="48" x="-80" y="0"/>
    <use href="#ribosome" width="80" height="48" x="60" y="0"/>
    <use href="#slh1-protein" width="60" height="40" x="10" y="-50"/>
    
    <text x="30" y="-70" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">6</text>
    <text x="30" y="80" font-family="Arial" font-size="14" text-anchor="middle">Ribosome Disassembly</text>
    <text x="30" y="100" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0032790)</text>
  </g>
  
  <!-- Arrow from 5 to 6 -->
  <path d="M 580,340 Q 530,380 430,420" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Process Annotation -->
  <rect x="20" y="530" width="760" height="50" rx="5" ry="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="400" y="560" font-family="Arial" font-size="16" text-anchor="middle">Rescue of Stalled Ribosome (GO:0072344)</text>
  
  <!-- Legend -->
  <g transform="translate(650, 450)">
    <rect x="0" y="0" width="130" height="120" rx="5" ry="5" fill="white" stroke="#dee2e6" stroke-width="1.5"/>
    <text x="65" y="20" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
    
    <!-- HEL2 -->
    <rect x="10" y="30" width="15" height="15" fill="#6c9bd1" stroke="#2c5282" stroke-width="1"/>
    <text x="35" y="42" font-family="Arial" font-size="14">HEL2</text>
    
    <!-- CUE3 -->
    <rect x="10" y="50" width="15" height="15" fill="#8fb06c" stroke="#455c35" stroke-width="1"/>
    <text x="35" y="62" font-family="Arial" font-size="14">CUE3</text>
    
    <!-- RQT4 -->
    <rect x="10" y="70" width="15" height="15" fill="#d39e50" stroke="#8c5c0f" stroke-width="1"/>
    <text x="35" y="82" font-family="Arial" font-size="14">RQT4</text>
    
    <!-- SLH1 -->
    <rect x="10" y="90" width="15" height="15" fill="#c767ad" stroke="#742c5a" stroke-width="1"/>
    <text x="35" y="102" font-family="Arial" font-size="14">SLH1</text>
    
    <!-- Ubiquitin -->
    <circle cx="80" cy="37" r="7" fill="#e74c3c" stroke="#992213" stroke-width="1"/>
    <text x="100" y="42" font-family="Arial" font-size="14">Ubiquitin</text>
    
    <!-- RPS20 -->
    <rect x="70" y="60" width="20" height="10" rx="2" ry="2" fill="#3498db" stroke="#2166a0" stroke-width="1"/>
    <text x="105" y="68" font-family="Arial" font-size="14">RPS20</text>
  </g>
</svg>