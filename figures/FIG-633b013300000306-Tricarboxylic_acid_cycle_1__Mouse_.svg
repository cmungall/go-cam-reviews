<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Mitochondrial background -->
  <ellipse cx="400" cy="400" rx="370" ry="330" fill="#fef8e8" stroke="#8a6d3b" stroke-width="3" />
  <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Tricarboxylic Acid Cycle (Mouse)</text>
  <text x="400" y="80" font-family="Arial" font-size="18" font-style="italic" text-anchor="middle">Mitochondrial Matrix</text>

  <!-- TCA Cycle - Metabolites and Reactions -->
  <!-- Metabolites are positioned in a circle, enzymes are placed between them -->
  
  <!-- Citrate (CIT) -->
  <circle cx="400" cy="150" r="25" fill="#e6f7ff" stroke="#0077b6" stroke-width="2" />
  <text x="400" y="155" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">CIT</text>
  
  <!-- Aconitase (Aco2) -->
  <rect x="465" y="180" width="80" height="40" rx="10" fill="#90e0ef" stroke="#0077b6" stroke-width="2" />
  <text x="505" y="205" font-family="Arial" font-size="13" text-anchor="middle">Aco2</text>
  <text x="505" y="220" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Aconitate hydratase</text>
  
  <!-- Isocitrate (ISCIT) -->
  <circle cx="530" cy="250" r="25" fill="#e6f7ff" stroke="#0077b6" stroke-width="2" />
  <text x="530" y="255" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">ISCIT</text>
  
  <!-- Isocitrate dehydrogenase complex (NAD+) -->
  <rect x="550" y="290" width="105" height="60" rx="10" fill="#48cae4" stroke="#0077b6" stroke-width="2" />
  <text x="602" y="315" font-family="Arial" font-size="13" text-anchor="middle">IDH Complex</text>
  <text x="602" y="330" font-family="Arial" font-size="10" text-anchor="middle">Idh3a, Idh3b, Idh3g</text>
  <text x="602" y="345" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">NAD+ → NADH</text>
  
  <!-- 2-Oxoglutarate (2OG) -->
  <circle cx="550" cy="380" r="25" fill="#e6f7ff" stroke="#0077b6" stroke-width="2" />
  <text x="550" y="385" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">2OG</text>
  
  <!-- Oxoglutarate dehydrogenase complex -->
  <rect x="470" y="430" width="105" height="60" rx="10" fill="#00b4d8" stroke="#0077b6" stroke-width="2" />
  <text x="522" y="455" font-family="Arial" font-size="13" text-anchor="middle">OGDH Complex</text>
  <text x="522" y="470" font-family="Arial" font-size="10" text-anchor="middle">Ogdh, Dld, Dlst</text>
  <text x="522" y="485" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">NAD+ → NADH</text>
  
  <!-- Succinyl-CoA (SUCC-CoA) -->
  <circle cx="400" cy="500" r="25" fill="#e6f7ff" stroke="#0077b6" stroke-width="2" />
  <text x="400" y="505" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">SUCC-CoA</text>
  
  <!-- Succinate-CoA ligase complex (GDP-forming) -->
  <rect x="320" y="550" width="105" height="60" rx="10" fill="#0096c7" stroke="#0077b6" stroke-width="2" />
  <text x="372" y="575" font-family="Arial" font-size="12" text-anchor="middle">Succ-CoA Ligase</text>
  <text x="372" y="590" font-family="Arial" font-size="10" text-anchor="middle">Suclg1, Suclg2</text>
  <text x="372" y="605" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">GDP → GTP</text>
  
  <!-- Succinate-CoA ligase complex (ADP-forming) -->
  <rect x="195" y="550" width="105" height="60" rx="10" fill="#0096c7" stroke="#0077b6" stroke-width="2" />
  <text x="248" y="575" font-family="Arial" font-size="12" text-anchor="middle">Succ-CoA Ligase</text>
  <text x="248" y="590" font-family="Arial" font-size="10" text-anchor="middle">Suclg1, Sucla2</text>
  <text x="248" y="605" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">ADP → ATP</text>
  
  <!-- Succinate (SUCCA) -->
  <circle cx="250" cy="500" r="25" fill="#e6f7ff" stroke="#0077b6" stroke-width="2" />
  <text x="250" y="505" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">SUCCA</text>
  
  <!-- Succinate dehydrogenase complex (Complex II) -->
  <rect x="170" y="430" width="105" height="60" rx="10" fill="#0077b6" stroke="#0077b6" stroke-width="2" />
  <text x="222" y="455" font-family="Arial" font-size="13" text-anchor="middle" fill="white">Complex II</text>
  <text x="222" y="470" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Sdha, Sdhb, Sdhc, Sdhd</text>
  <text x="222" y="485" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="white">SDH</text>
  
  <!-- Fumarate (FUMA) -->
  <circle cx="200" cy="380" r="25" fill="#e6f7ff" stroke="#0077b6" stroke-width="2" />
  <text x="200" y="385" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">FUMA</text>
  
  <!-- Fumarase (Fh1) -->
  <rect x="170" y="310" width="80" height="40" rx="10" fill="#90e0ef" stroke="#0077b6" stroke-width="2" />
  <text x="210" y="335" font-family="Arial" font-size="13" text-anchor="middle">Fh1</text>
  <text x="210" y="350" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Fumarase</text>
  
  <!-- Malate (MAL) -->
  <circle cx="250" cy="250" r="25" fill="#e6f7ff" stroke="#0077b6" stroke-width="2" />
  <text x="250" y="255" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">MAL</text>
  
  <!-- Malate dehydrogenase (Mdh2) -->
  <rect x="280" y="180" width="80" height="40" rx="10" fill="#90e0ef" stroke="#0077b6" stroke-width="2" />
  <text x="320" y="205" font-family="Arial" font-size="13" text-anchor="middle">Mdh2</text>
  <text x="320" y="220" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Malate dehydrogenase</text>
  
  <!-- Oxaloacetate (OA) -->
  <circle cx="340" cy="150" r="25" fill="#e6f7ff" stroke="#0077b6" stroke-width="2" />
  <text x="340" y="155" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">OA</text>
  
  <!-- Citrate synthase (Cs) -->
  <rect x="370" y="100" width="80" height="40" rx="10" fill="#90e0ef" stroke="#0077b6" stroke-width="2" />
  <text x="410" y="125" font-family="Arial" font-size="13" text-anchor="middle">Cs</text>
  <text x="410" y="140" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Citrate synthase</text>
  
  <!-- Acetyl-CoA -->
  <circle cx="480" cy="100" r="25" fill="#ffddd2" stroke="#e29578" stroke-width="2" />
  <text x="480" y="105" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Ac-CoA</text>
  
  <!-- Sirt3 regulation -->
  <rect x="100" y="240" width="80" height="40" rx="10" fill="#ffccd5" stroke="#e63946" stroke-width="2" />
  <text x="140" y="265" font-family="Arial" font-size="13" text-anchor="middle">Sirt3</text>
  <text x="140" y="280" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Deacetylase</text>
  
  <!-- Cofactors labels -->
  <rect x="610" y="130" width="160" height="115" fill="white" stroke="#0077b6" stroke-width="1" rx="5" opacity="0.9" />
  <text x="690" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#0077b6" text-anchor="middle">Cofactors</text>
  <text x="620" y="175" font-family="Arial" font-size="13" fill="#0077b6">• NAD+/NADH</text>
  <text x="620" y="195" font-family="Arial" font-size="13" fill="#0077b6">• CoA</text>
  <text x="620" y="215" font-family="Arial" font-size="13" fill="#0077b6">• GDP/GTP</text>
  <text x="620" y="235" font-family="Arial" font-size="13" fill="#0077b6">• ADP/ATP</text>
  
  <!-- Arrows and connections -->
  <!-- Citrate to Isocitrate -->
  <path d="M 420 170 Q 470 210 510 235" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Isocitrate to 2-Oxoglutarate -->
  <path d="M 540 270 Q 550 320 550 355" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- 2-Oxoglutarate to Succinyl-CoA -->
  <path d="M 535 400 Q 490 450 420 485" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Succinyl-CoA to Succinate -->
  <path d="M 375 500 L 275 500" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Succinate to Fumarate -->
  <path d="M 240 480 Q 220 440 210 405" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Fumarate to Malate -->
  <path d="M 210 355 Q 230 310 235 275" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Malate to Oxaloacetate -->
  <path d="M 270 235 Q 300 200 320 170" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Oxaloacetate + Acetyl-CoA to Citrate -->
  <path d="M 360 135 Q 380 125 380 150" fill="none" stroke="#0077b6" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 460 115 Q 430 125 415 130" fill="none" stroke="#e29578" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Sirt3 to Succinate dehydrogenase -->
  <path d="M 170 260 Q 180 280 190 330 Q 200 380 210 410" fill="none" stroke="#e63946" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <text x="150" y="340" font-family="Arial" font-size="11" fill="#e63946">Activates</text>
  
  <!-- Markers for arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0077b6" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="600" width="180" height="180" fill="white" stroke="#333" stroke-width="1" opacity="0.9" />
  <text x="690" y="620" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">Legend</text>
  
  <circle cx="620" cy="645" r="12" fill="#e6f7ff" stroke="#0077b6" stroke-width="2" />
  <text x="638" y="650" font-family="Arial" font-size="13" text-anchor="start">Metabolites</text>
  
  <rect x="610" y="665" width="22" height="22" rx="5" fill="#90e0ef" stroke="#0077b6" stroke-width="2" />
  <text x="638" y="680" font-family="Arial" font-size="13" text-anchor="start">Single enzymes</text>
  
  <rect x="610" y="695" width="22" height="22" rx="5" fill="#0096c7" stroke="#0077b6" stroke-width="2" />
  <text x="638" y="710" font-family="Arial" font-size="13" text-anchor="start">Enzyme complexes</text>
  
  <circle cx="620" cy="730" r="12" fill="#ffddd2" stroke="#e29578" stroke-width="2" />
  <text x="638" y="735" font-family="Arial" font-size="13" text-anchor="start">External inputs</text>
  <line x1="700" y1="735" x2="730" y2="735" stroke="#e29578" stroke-width="2" />
  <polygon points="730 735, 740 739, 740 731" fill="#e29578" />
  
  <rect x="610" y="750" width="22" height="22" rx="5" fill="#ffccd5" stroke="#e63946" stroke-width="2" />
  <text x="638" y="765" font-family="Arial" font-size="13" text-anchor="start">Regulators</text>
  <line x1="700" y1="765" x2="730" y2="765" stroke="#e63946" stroke-width="2" stroke-dasharray="5,3" />
  <polygon points="730 765, 740 769, 740 761" fill="#e63946" />
</svg>