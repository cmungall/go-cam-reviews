<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background - Mitochondrion cross-section -->
    <rect x="50" y="50" width="700" height="500" rx="100" ry="100" fill="#fffaf0" stroke="#666" stroke-width="2"/>
    
    <!-- Mitochondrial membranes -->
    <!-- Outer membrane -->
    <path d="M100 150 Q 400 100 700 150" fill="none" stroke="#444" stroke-width="3"/>
    <text x="400" y="125" font-family="Arial" font-size="14" text-anchor="middle">Outer Membrane</text>
    
    <!-- Inner membrane -->
    <path d="M100 250 Q 200 270 300 250 Q 400 230 500 250 Q 600 270 700 250" fill="none" stroke="#222" stroke-width="4"/>
    <text x="400" y="290" font-family="Arial" font-size="14" text-anchor="middle">Inner Membrane</text>
    
    <!-- Label compartments -->
    <text x="400" y="200" font-family="Arial" font-size="16" text-anchor="middle">Intermembrane Space</text>
    <text x="400" y="400" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Mitochondrial Matrix</text>
    
    <!-- Draw Uniplex Complex -->
    <!-- MCU -->
    <rect x="350" y="220" width="60" height="60" rx="5" ry="5" fill="#97c2fc" stroke="#2b7ce9" stroke-width="2"/>
    <text x="380" y="255" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MCU</text>
    
    <!-- SMDT1/EMRE -->
    <rect x="410" y="240" width="60" height="20" rx="5" ry="5" fill="#ffb6c1" stroke="#ff6b81" stroke-width="2"/>
    <text x="440" y="255" font-family="Arial" font-size="12" text-anchor="middle">SMDT1</text>
    
    <!-- MICU1 -->
    <rect x="330" y="180" width="60" height="30" rx="10" ry="10" fill="#98fb98" stroke="#3cb371" stroke-width="2"/>
    <text x="360" y="200" font-family="Arial" font-size="12" text-anchor="middle">MICU1</text>
    
    <!-- MICU2 -->
    <rect x="410" y="180" width="60" height="30" rx="10" ry="10" fill="#98fb98" stroke="#3cb371" stroke-width="2"/>
    <text x="440" y="200" font-family="Arial" font-size="12" text-anchor="middle">MICU2</text>
    
    <!-- MCUB -->
    <rect x="260" y="230" width="60" height="40" rx="5" ry="5" fill="#ff8c69" stroke="#e25822" stroke-width="2"/>
    <text x="290" y="255" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MCUB</text>
    
    <!-- Connecting lines -->
    <line x1="360" y1="210" x2="360" y2="220" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="210" x2="440" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="410" y1="250" x2="410" y2="250" stroke="#333" stroke-width="2"/>
    
    <!-- Inhibition arrow from MCUB to MCU -->
    <line x1="320" y1="250" x2="345" y2="250" stroke="#e25822" stroke-width="3"/>
    <polygon points="340,250 345,245 350,250 345,255" fill="#e25822" stroke="#e25822" stroke-width="1"/>
    <line x1="342" y1="245" x2="348" y2="255" stroke="#e25822" stroke-width="2.5"/>
    
    <!-- Calcium ions -->
    <circle cx="390" cy="180" r="8" fill="#ffa500" stroke="#ff8c00" stroke-width="1.5"/>
    <text x="390" y="183" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ca2+</text>
    
    <circle cx="420" cy="170" r="8" fill="#ffa500" stroke="#ff8c00" stroke-width="1.5"/>
    <text x="420" y="173" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ca2+</text>
    
    <circle cx="380" cy="350" r="8" fill="#ffa500" stroke="#ff8c00" stroke-width="1.5"/>
    <text x="380" y="353" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ca2+</text>
    
    <!-- Calcium flow arrow -->
    <path d="M 390 190 C 400 260, 395 280, 385 340" fill="none" stroke="#ffa500" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="385,340 380,335 385,345 390,335" fill="#ffa500" stroke="#ffa500"/>
    
    <!-- Inhibition annotation -->
    <text x="290" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Inhibits</text>
    
    <!-- Sensing annotation -->
    <text x="460" y="170" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Ca2+ sensing</text>
    <path d="M 460 173 C 450 175, 410 175, 390 179" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    
    <!-- Regulatory arrows from MICU1/MICU2 to MCU -->
    <path d="M 360 210 C 360 215, 360 215, 360 220" fill="none" stroke="#3cb371" stroke-width="2"/>
    <polygon points="360,220 355,215 360,225 365,215" fill="#3cb371" stroke="#3cb371"/>
    
    <path d="M 440 210 C 440 215, 415 215, 390 220" fill="none" stroke="#3cb371" stroke-width="2"/>
    <polygon points="390,220 385,215 390,225 395,215" fill="#3cb371" stroke="#3cb371"/>

    <!-- Prevention of calcium overload annotation -->
    <text x="470" y="350" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Prevents calcium overload</text>
    <path d="M 420 350 C 415 320, 410 290, 390 280" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M 420 350 L 310 290" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Title -->
    <text x="400" y="80" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">MCUB Inhibition of Mitochondrial Calcium Uptake</text>
    
    <!-- Legend -->
    <rect x="550" y="110" width="180" height="140" rx="10" ry="10" fill="white" stroke="#666" stroke-width="1"/>
    <text x="640" y="130" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
    
    <!-- MCU legend -->
    <rect x="560" y="140" width="20" height="20" fill="#97c2fc" stroke="#2b7ce9" stroke-width="1"/>
    <text x="590" y="155" font-family="Arial" font-size="12" text-anchor="start">MCU</text>
    
    <!-- SMDT1 legend -->
    <rect x="560" y="165" width="20" height="10" fill="#ffb6c1" stroke="#ff6b81" stroke-width="1"/>
    <text x="590" y="175" font-family="Arial" font-size="12" text-anchor="start">SMDT1/EMRE</text>
    
    <!-- MICU legend -->
    <rect x="560" y="190" width="20" height="15" rx="5" ry="5" fill="#98fb98" stroke="#3cb371" stroke-width="1"/>
    <text x="590" y="200" font-family="Arial" font-size="12" text-anchor="start">MICU1/2</text>
    
    <!-- MCUB legend -->
    <rect x="560" y="215" width="20" height="15" fill="#ff8c69" stroke="#e25822" stroke-width="1"/>
    <text x="590" y="225" font-family="Arial" font-size="12" text-anchor="start">MCUB</text>
    
    <!-- Calcium ion legend -->
    <circle cx="570" y="240" r="5" fill="#ffa500" stroke="#ff8c00" stroke-width="1"/>
    <text x="590" y="245" font-family="Arial" font-size="12" text-anchor="start">Ca2+</text>
</svg>