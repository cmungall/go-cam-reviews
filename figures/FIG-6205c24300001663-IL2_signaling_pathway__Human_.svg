<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell components -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2" />
  <rect x="50" y="50" width="700" height="100" rx="20" ry="20" fill="#e6f3ff" stroke="#666" stroke-width="2" />
  <text x="400" y="100" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Extracellular Space</text>
  
  <!-- Plasma Membrane -->
  <rect x="50" y="150" width="700" height="25" fill="#ffcc99" stroke="#666" stroke-width="2" />
  <text x="400" y="168" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Plasma Membrane</text>
  
  <!-- Cytoplasm -->
  <text x="400" y="210" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Cytoplasm</text>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="400" rx="150" ry="100" fill="#ffe6cc" stroke="#666" stroke-width="2" />
  <text x="400" y="400" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Nucleus</text>
  
  <!-- IL-2 Pathway Components -->
  <!-- IL-2 in extracellular space -->
  <circle cx="250" cy="100" r="25" fill="#8dd3c7" stroke="#333" stroke-width="2" />
  <text x="250" y="100" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">IL-2</text>
  <text x="250" y="115" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(P60568)</text>
  
  <!-- Receptor complex on membrane -->
  <rect x="200" y="150" width="30" height="25" fill="#fb8072" stroke="#333" stroke-width="2" />
  <text x="215" y="167" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">IL-2RA</text>
  <text x="215" y="178" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P01589)</text>
  
  <rect x="250" y="150" width="30" height="25" fill="#80b1d3" stroke="#333" stroke-width="2" />
  <text x="265" y="167" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">IL-2RB</text>
  <text x="265" y="178" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P14784)</text>
  
  <rect x="300" y="150" width="30" height="25" fill="#bebada" stroke="#333" stroke-width="2" />
  <text x="315" y="167" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">IL-2RG</text>
  <text x="315" y="178" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P31785)</text>
  
  <!-- JAK proteins -->
  <rect x="250" y="200" width="30" height="25" fill="#b3de69" stroke="#333" stroke-width="2" />
  <text x="265" y="217" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">JAK1</text>
  <text x="265" y="228" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P23458)</text>
  
  <rect x="300" y="200" width="30" height="25" fill="#fdb462" stroke="#333" stroke-width="2" />
  <text x="315" y="217" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">JAK3</text>
  <text x="315" y="228" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P52333)</text>
  
  <!-- STAT proteins -->
  <polygon points="270,260 290,260 280,280" fill="#bc80bd" stroke="#333" stroke-width="2" />
  <text x="280" y="270" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">STAT5A</text>
  <text x="280" y="290" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P42229)</text>
  
  <polygon points="320,260 340,260 330,280" fill="#ffed6f" stroke="#333" stroke-width="2" />
  <text x="330" y="270" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">STAT3</text>
  <text x="330" y="290" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P40763)</text>
  
  <!-- STAT proteins in nucleus -->
  <polygon points="370,380 390,380 380,400" fill="#bc80bd" stroke="#333" stroke-width="2" />
  <text x="380" y="390" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">STAT5A</text>
  <text x="380" y="410" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P42229)</text>
  
  <polygon points="420,380 440,380 430,400" fill="#ffed6f" stroke="#333" stroke-width="2" />
  <text x="430" y="390" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">STAT3</text>
  <text x="430" y="410" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P40763)</text>
  
  <!-- Pathway connections -->
  <!-- IL-2 to receptor -->
  <path d="M250,125 Q250,140 250,150" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />
  <text x="270" y="140" font-family="Arial" font-size="11" fill="#333">1. Binding</text>
  
  <!-- Receptor to JAK activation -->
  <path d="M265,175 Q265,185 265,200" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />
  <path d="M315,175 Q315,185 315,200" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />
  <text x="350" y="190" font-family="Arial" font-size="11" fill="#333">2. Receptor activation</text>
  
  <!-- JAK to STAT activation -->
  <path d="M265,225 Q265,240 280,260" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />
  <path d="M315,225 Q315,240 330,260" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />
  <text x="350" y="245" font-family="Arial" font-size="11" fill="#333">3. JAK phosphorylation</text>
  
  <!-- STAT translocation to nucleus -->
  <path d="M280,280 Q330,330 380,380" stroke="#333" stroke-width="3" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  <path d="M330,280 Q380,330 430,380" stroke="#333" stroke-width="3" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  <text x="400" y="330" font-family="Arial" font-size="11" fill="#333">4. STAT translocation</text>
  
  <!-- DNA binding in nucleus -->
  <path d="M380,400 Q390,420 400,430" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M430,400 Q420,420 410,430" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="370" y="430" width="70" height="10" fill="#d3d3d3" stroke="#333" stroke-width="1" />
  <text x="405" y="450" font-family="Arial" font-size="11" fill="#333">5. Gene regulation</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">IL-2 Signaling Pathway (Human)</text>
  
  <!-- Legend -->
  <rect x="550" y="200" width="180" height="190" fill="#fff" stroke="#666" stroke-width="1" />
  <text x="640" y="220" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <circle cx="570" cy="240" r="10" fill="#8dd3c7" stroke="#333" stroke-width="1" />
  <text x="590" y="245" font-family="Arial" font-size="12" fill="#333">Cytokine</text>
  
  <rect x="560" y="260" width="20" height="15" fill="#fb8072" stroke="#333" stroke-width="1" />
  <text x="590" y="270" font-family="Arial" font-size="12" fill="#333">Receptor</text>
  
  <rect x="560" y="285" width="20" height="15" fill="#b3de69" stroke="#333" stroke-width="1" />
  <text x="590" y="295" font-family="Arial" font-size="12" fill="#333">Kinase</text>
  
  <polygon points="560,315 580,315 570,330" fill="#bc80bd" stroke="#333" stroke-width="1" />
  <text x="600" y="325" font-family="Arial" font-size="12" fill="#333">Transcription Factor</text>
  
  <line x1="560" y1="345" x2="580" y2="345" stroke="#333" stroke-width="3" />
  <text x="600" y="350" font-family="Arial" font-size="12" fill="#333">Activation</text>
  
  <line x1="560" y1="365" x2="580" y2="365" stroke="#333" stroke-width="3" stroke-dasharray="5,5" />
  <text x="610" y="370" font-family="Arial" font-size="12" fill="#333">Translocation</text>
</svg>