<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and cell compartments -->
  <rect x="50" y="50" width="700" height="500" fill="#f9f9f9" stroke="#666" stroke-width="2" rx="20" ry="20"/>
  
  <!-- Cell compartments -->
  <!-- Cytosol -->
  <rect x="75" y="75" width="650" height="300" fill="#e6f2ff" stroke="#999" stroke-width="1" rx="10" ry="10"/>
  <text x="100" y="100" font-family="Arial" font-size="16" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Nucleus -->
  <ellipse cx="650" cy="200" rx="120" ry="80" fill="#e6ffe6" stroke="#999" stroke-width="1"/>
  <text x="620" y="180" font-family="Arial" font-size="16" font-weight="bold">Nucleus</text>
  <text x="620" y="200" font-family="Arial" font-size="14">(GO:0005634)</text>
  
  <!-- ER Membrane -->
  <rect x="100" y="400" width="600" height="125" fill="#ffe6e6" stroke="#999" stroke-width="1" rx="5" ry="5"/>
  <text x="350" y="420" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Endoplasmic Reticulum Membrane</text>
  <text x="350" y="440" font-family="Arial" font-size="14" text-anchor="middle">(GO:0005789)</text>
  
  <!-- Proteins and interactions -->
  <!-- AKT1 (in cytosol) -->
  <circle cx="150" cy="200" r="40" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="150" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">AKT1</text>
  <text x="150" y="215" font-family="Arial" font-size="12" text-anchor="middle">(P31749)</text>
  
  <!-- EIF2AK3/PERK (in ER membrane) -->
  <rect x="250" y="450" width="80" height="50" fill="#ff9999" stroke="#ff6666" stroke-width="2" rx="10" ry="10"/>
  <text x="290" y="475" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">PERK</text>
  <text x="290" y="490" font-family="Arial" font-size="12" text-anchor="middle">(Q9NZJ5)</text>
  
  <!-- EIF2S1 (in cytosol) -->
  <rect x="400" y="200" width="80" height="50" fill="#99ccff" stroke="#3399ff" stroke-width="2" rx="10" ry="10"/>
  <text x="440" y="225" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">eIF2α</text>
  <text x="440" y="240" font-family="Arial" font-size="12" text-anchor="middle">(P05198)</text>
  
  <!-- ATF4 (in nucleus) -->
  <rect x="640" y="200" width="70" height="40" fill="#99ff99" stroke="#66cc66" stroke-width="2" rx="5" ry="5"/>
  <text x="675" y="225" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">ATF4</text>
  <text x="675" y="240" font-family="Arial" font-size="12" text-anchor="middle">(P18848)</text>
  
  <!-- Interactions -->
  <!-- AKT1 inhibits PERK -->
  <line x1="173" y1="233" x2="260" y2="445" stroke="#ff0000" stroke-width="2" marker-end="url(#redArrow)"/>
  <text x="195" y="340" font-family="Arial" font-size="14" fill="#ff0000" transform="rotate(-65, 195, 340)">Inhibits</text>
  <text x="215" y="360" font-family="Arial" font-size="12" fill="#666666" transform="rotate(-65, 215, 360)">GO:1903898</text>
  
  <!-- PERK phosphorylates EIF2S1 -->
  <line x1="325" y1="450" x2="410" y2="255" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="335" font-family="Arial" font-size="14" transform="rotate(-65, 350, 335)">Phosphorylates</text>
  <text x="380" y="345" font-family="Arial" font-size="12" fill="#666666" transform="rotate(-65, 370, 345)">GO:0004694</text>
  <circle cx="410" cy="255" r="5" fill="#ff0000"/> <!-- Phosphorylation mark -->
  
  <!-- EIF2S1 activates ATF4 -->
  <line x1="480" y1="220" x2="635" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="210" font-family="Arial" font-size="14">Activates</text>
  <text x="555" y="240" font-family="Arial" font-size="12" fill="#666666">GO:0006413</text>
  
  <!-- Process labels -->
  <text x="340" y="150" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle">PERK-mediated unfolded protein response</text>
  <text x="340" y="165" font-family="Arial" font-size="12" fill="#666666" text-anchor="middle">(GO:0036499)</text>
  
  <!-- DNA-binding transcription factor activity -->
  <text x="655" y="165" font-family="Arial" font-size="12" fill="#666666" text-anchor="middle">DNA-binding TF activity</text>
  <text x="655" y="180" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">(GO:0003700)</text>
  
  <!-- Markers for arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff0000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="550" width="700" height="30" fill="white" stroke="#666" stroke-width="1"/>
  <text x="60" y="570" font-family="Arial" font-size="14">Legend: </text>
  <text x="120" y="570" font-family="Arial" font-size="14">
    <tspan fill="#ff9933">●</tspan> AKT1/PKB kinase | 
    <tspan fill="#ff6666">■</tspan> PERK/EIF2AK3 kinase | 
    <tspan fill="#3399ff">■</tspan> eIF2α | 
    <tspan fill="#66cc66">■</tspan> ATF4 transcription factor | 
    <tspan fill="#000000">→</tspan> Activates | 
    <tspan fill="#ff0000">→</tspan> Inhibits
  </text>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">AKT1 Inhibition of PERK-Mediated Unfolded Protein Response</text>
</svg>