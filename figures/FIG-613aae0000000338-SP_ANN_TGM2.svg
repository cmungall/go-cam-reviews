<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
    <!-- Cell Outline -->
    <ellipse cx="400" cy="320" rx="380" ry="300" fill="#f8f8f8" stroke="#666" stroke-width="2"/>
    
    <!-- Nucleus -->
    <ellipse cx="400" cy="350" rx="250" ry="210" fill="#e6e6fa" stroke="#666" stroke-width="2"/>
    <text x="400" y="150" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm</text>
    <text x="400" y="350" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Nucleus</text>
    
    <!-- Nuclear Pore -->
    <rect x="380" y="140" width="40" height="40" fill="#d4e6ff" stroke="#3366cc" stroke-width="2" rx="5"/>
    <text x="400" y="125" text-anchor="middle" font-family="Arial" font-size="14">Nuclear Pore</text>
    <text x="400" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#222">GO:0005643</text>
    
    <!-- KPNA4 -->
    <rect x="280" y="200" width="60" height="30" fill="#ff9999" stroke="#cc3333" stroke-width="2" rx="5"/>
    <text x="310" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">KPNA4</text>
    <text x="310" y="235" text-anchor="middle" font-family="Arial" font-size="8" fill="#444">O00629</text>
    
    <!-- TGM2 -->
    <rect x="480" y="200" width="60" height="30" fill="#99cc99" stroke="#339933" stroke-width="2" rx="5"/>
    <text x="510" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">TGM2</text>
    <text x="510" y="235" text-anchor="middle" font-family="Arial" font-size="8" fill="#444">P21980</text>

    <!-- Histone H3C1 -->
    <rect x="400" y="430" width="60" height="30" fill="#99ccff" stroke="#3366cc" stroke-width="2" rx="5"/>
    <text x="430" y="450" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">H3C1</text>
    <text x="430" y="465" text-anchor="middle" font-family="Arial" font-size="8" fill="#444">P68431</text>
    
    <!-- Nucleosome -->
    <ellipse cx="430" cy="400" rx="90" ry="75" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="430" y="320" text-anchor="middle" font-family="Arial" font-size="14">Nucleosome</text>
    <text x="430" y="335" text-anchor="middle" font-family="Arial" font-size="10" fill="#222">GO:0000786</text>
    
    <!-- Serotonin -->
    <ellipse cx="560" cy="350" rx="25" ry="25" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
    <text x="560" y="355" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">5-HT</text>
    <text x="560" y="370" text-anchor="middle" font-family="Arial" font-size="8" fill="#444">CHEBI:28790</text>
    
    <!-- Dopamine -->
    <ellipse cx="280" cy="350" rx="25" ry="25" fill="#ffff99" stroke="#cccc00" stroke-width="2"/>
    <text x="280" y="355" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">DA</text>
    <text x="280" y="370" text-anchor="middle" font-family="Arial" font-size="8" fill="#444">CHEBI:18243</text>
    
    <!-- Activity arrows -->
    <!-- KPNA4 import of TGM2 -->
    <path d="M 340 200 L 380 160" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="340" y="175" font-family="Arial" font-size="12" font-style="italic" fill="#000">Nuclear import</text>
    <text x="340" y="190" font-family="Arial" font-size="10" fill="#666">GO:0061608</text>
    
    <!-- TGM2 to nucleosome activities -->
    <path d="M 510 230 L 510 280 L 460 340" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="530" y="260" font-family="Arial" font-size="12" font-style="italic" fill="#000">Histone modification</text>
    
    <!-- Serotonylation -->
    <path d="M 535 350 L 480 390" fill="none" stroke="#ff6600" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="535" y="375" font-family="Arial" font-size="12" font-style="italic" fill="#ff6600">Serotonyltransferase</text>
    <text x="535" y="390" font-family="Arial" font-size="10" fill="#ff6600">GO:0120295</text>
    
    <!-- Dopaminylation -->
    <path d="M 305 350 L 370 390" fill="none" stroke="#cccc00" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="300" y="375" font-family="Arial" font-size="12" font-style="italic" fill="#cccc00">Dopaminyltransferase</text>
    <text x="300" y="390" font-family="Arial" font-size="10" fill="#cccc00">GO:0120297</text>
    
    <!-- H3C1 binding after modification -->
    <path d="M 470 400 L 500 410 L 470 430" fill="none" stroke="#3366cc" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="510" y="420" font-family="Arial" font-size="12" font-style="italic" fill="#3366cc">Protein binding</text>
    <text x="510" y="435" font-family="Arial" font-size="10" fill="#3366cc">GO:0005515</text>
    
    <!-- Step labels -->
    <text x="310" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Step 1</text>
    <text x="530" y="235" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Step 2</text>
    <text x="535" y="355" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Step 3a</text>
    <text x="300" y="355" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Step 3b</text>
    <text x="480" y="450" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Step 4</text>
    
    <!-- Arrowhead marker definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
        </marker>
    </defs>
    
    <!-- Title -->
    <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">TGM2-Mediated Histone Modification with Serotonin and Dopamine</text>
    <text x="400" y="65" text-anchor="middle" font-family="Arial" font-size="14">GO-CAM: SP-ANN_TGM2 (gomodel:613aae0000000338)</text>
    
    <!-- Legend -->
    <rect x="50" y="520" width="700" height="100" fill="#f0f0f0" stroke="#888" stroke-width="1" rx="5"/>
    <text x="400" y="540" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
    
    <!-- Legend items -->
    <rect x="70" y="550" width="20" height="15" fill="#ff9999" stroke="#cc3333" stroke-width="1" rx="2"/>
    <text x="100" y="562" font-family="Arial" font-size="12">Importin (KPNA4)</text>
    
    <rect x="200" y="550" width="20" height="15" fill="#99cc99" stroke="#339933" stroke-width="1" rx="2"/>
    <text x="230" y="562" font-family="Arial" font-size="12">TGM2 enzyme</text>
    
    <rect x="330" y="550" width="20" height="15" fill="#99ccff" stroke="#3366cc" stroke-width="1" rx="2"/>
    <text x="360" y="562" font-family="Arial" font-size="12">Histone (H3C1)</text>
    
    <circle cx="500" cy="557" r="8" fill="#ffcc99" stroke="#ff6600" stroke-width="1"/>
    <text x="520" y="562" font-family="Arial" font-size="12">Serotonin</text>
    
    <circle cx="600" cy="557" r="8" fill="#ffff99" stroke="#cccc00" stroke-width="1"/>
    <text x="620" y="562" font-family="Arial" font-size="12">Dopamine</text>
    
    <line x1="70" y1="585" x2="90" y2="585" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="130" y="590" font-family="Arial" font-size="12">Activity/Pathway</text>
    
    <line x1="220" y1="585" x2="240" y2="585" stroke="#ff6600" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="280" y="590" font-family="Arial" font-size="12">Serotonylation</text>
    
    <line x1="370" y1="585" x2="390" y2="585" stroke="#cccc00" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="430" y="590" font-family="Arial" font-size="12">Dopaminylation</text>
    
    <line x1="510" y1="585" x2="530" y2="585" stroke="#3366cc" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="570" y="590" font-family="Arial" font-size="12">Protein binding</text>
</svg>