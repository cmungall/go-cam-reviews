<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f8f8" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">USP44-mediated deubiquitination of CDC20 controlling anaphase initiation</text>
  
  <!-- Cell outline -->
  <ellipse cx="400" cy="320" rx="350" ry="240" fill="#f0f0ff" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Mitotic spindle region -->
  <ellipse cx="400" cy="220" rx="200" ry="100" fill="#e6ffe6" stroke="#006600" stroke-width="2"/>
  <text x="400" y="190" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic">Mitotic Spindle</text>
  <text x="400" y="215" font-family="Arial" font-size="16" text-anchor="middle">(GO:0072686)</text>
  
  <!-- APC/C Complex -->
  <rect x="250" y="300" width="300" height="180" rx="10" ry="10" fill="#ffe6e6" stroke="#990000" stroke-width="2"/>
  <text x="400" y="330" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic">Anaphase-Promoting Complex</text>
  <text x="400" y="355" font-family="Arial" font-size="16" text-anchor="middle">(GO:0005680)</text>
  
  <!-- Proteins and interactions -->
  <!-- USP44 -->
  <circle cx="230" cy="220" r="45" fill="#b3ccff" stroke="#000080" stroke-width="2"/>
  <text x="230" y="215" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">USP44</text>
  <text x="230" y="235" font-family="Arial" font-size="14" text-anchor="middle">Deubiquitinase</text>
  
  <!-- CDC20 -->
  <circle cx="400" cy="270" r="45" fill="#ffcccc" stroke="#800000" stroke-width="2"/>
  <text x="400" y="265" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">CDC20</text>
  <text x="400" y="285" font-family="Arial" font-size="14" text-anchor="middle">APC/C activator</text>
  
  <!-- UBE2C -->
  <circle cx="300" cy="400" r="45" fill="#ffffb3" stroke="#808000" stroke-width="2"/>
  <text x="300" y="395" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">UBE2C</text>
  <text x="300" y="415" font-family="Arial" font-size="14" text-anchor="middle">E2 enzyme</text>
  
  <!-- ANAPC11 -->
  <circle cx="500" cy="400" r="45" fill="#ffccb3" stroke="#804000" stroke-width="2"/>
  <text x="500" y="395" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">ANAPC11</text>
  <text x="500" y="415" font-family="Arial" font-size="14" text-anchor="middle">E3 ligase</text>
  
  <!-- Arrows and interactions -->
  <!-- USP44 inhibits CDC20 ubiquitination -->
  <path d="M 275 220 L 355 255" stroke="#006600" stroke-width="3" fill="none" marker-end="url(#negative-marker)"/>
  <text x="315" y="225" font-family="Arial" font-size="16" fill="#006600" font-style="italic">Deubiquitinates</text>
  
  <!-- UBE2C activates CDC20 -->
  <path d="M 325 365 L 365 315" stroke="#990000" stroke-width="3" fill="none" marker-end="url(#positive-marker)"/>
  <text x="325" y="350" font-family="Arial" font-size="16" fill="#990000" font-style="italic">Ubiquitinates</text>
  
  <!-- CDC20 activates ANAPC11 -->
  <path d="M 435 290 L 475 355" stroke="#990000" stroke-width="3" fill="none" marker-end="url(#positive-marker)"/>
  <text x="475" y="330" font-family="Arial" font-size="16" fill="#990000" font-style="italic">Activates</text>
  
  <!-- ANAPC11 leads to anaphase initiation -->
  <path d="M 545 400 L 610 400" stroke="#990000" stroke-width="3" fill="none" marker-end="url(#arrow-marker)"/>
  <text x="640" y="405" font-family="Arial" font-size="16" fill="#990000" font-weight="bold">Anaphase Initiation</text>
  
  <!-- Biological Process Boxes -->
  <rect x="160" y="130" width="200" height="60" rx="10" ry="10" fill="#d9f0ff" stroke="#004080" stroke-width="2"/>
  <text x="260" y="155" font-family="Arial" font-size="14" text-anchor="middle">Negative regulation of mitotic</text>
  <text x="260" y="175" font-family="Arial" font-size="14" text-anchor="middle">metaphase/anaphase transition</text>
  <text x="260" y="195" font-family="Arial" font-size="12" text-anchor="middle">(GO:0045841)</text>
  
  <rect x="430" y="470" width="200" height="60" rx="10" ry="10" fill="#ffe6cc" stroke="#804000" stroke-width="2"/>
  <text x="530" y="495" font-family="Arial" font-size="14" text-anchor="middle">Positive regulation of mitotic</text>
  <text x="530" y="515" font-family="Arial" font-size="14" text-anchor="middle">metaphase/anaphase transition</text>
  <text x="530" y="535" font-family="Arial" font-size="12" text-anchor="middle">(GO:0045842)</text>
  
  <!-- Connectors to biological processes -->
  <path d="M 230 190 L 230 175" stroke="#004080" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  <path d="M 500 445 L 520 470" stroke="#804000" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  
  <!-- Markers for arrows -->
  <defs>
    <marker id="arrow-marker" markerWidth="13" markerHeight="13" refX="9" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 Z" fill="#990000"/>
    </marker>
    <marker id="positive-marker" markerWidth="13" markerHeight="13" refX="9" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 Z" fill="#990000"/>
    </marker>
    <marker id="negative-marker" markerWidth="13" markerHeight="13" refX="9" refY="6" orient="auto">
      <rect x="0" y="0" width="12" height="12" fill="#006600"/>
    </marker>
  </defs>
  
  <!-- Cell label -->
  <text x="150" y="530" font-family="Arial" font-size="18" fill="#666666">Human Cell (mitosis)</text>
  
  <!-- Legend -->
  <rect x="620" y="100" width="160" height="200" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1"/>
  <text x="700" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="640" y="145" r="12" fill="#b3ccff" stroke="#000080" stroke-width="1"/>
  <text x="710" y="150" font-family="Arial" font-size="14">Deubiquitinase</text>
  
  <circle cx="640" y="175" r="12" fill="#ffcccc" stroke="#800000" stroke-width="1"/>
  <text x="710" y="180" font-family="Arial" font-size="14">APC/C activator</text>
  
  <circle cx="640" y="205" r="12" fill="#ffffb3" stroke="#808000" stroke-width="1"/>
  <text x="710" y="210" font-family="Arial" font-size="14">E2 enzyme</text>
  
  <circle cx="640" y="235" r="12" fill="#ffccb3" stroke="#804000" stroke-width="1"/>
  <text x="710" y="240" font-family="Arial" font-size="14">E3 ligase</text>
  
  <line x1="630" y1="265" x2="650" y2="265" stroke="#006600" stroke-width="3" marker-end="url(#negative-marker)"/>
  <text x="710" y="270" font-family="Arial" font-size="14">Inhibition</text>
  
  <line x1="630" y1="295" x2="650" y2="295" stroke="#990000" stroke-width="3" marker-end="url(#positive-marker)"/>
  <text x="710" y="300" font-family="Arial" font-size="14">Activation</text>
  
  <!-- Ubiquitin Tag Symbols -->
  <circle cx="430" cy="255" r="12" fill="gold" stroke="#aa8800" stroke-width="1"/>
  <text x="430" y="260" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Ub</text>
  
  <!-- Chromosome separation (Metaphase to Anaphase) -->
  <g transform="translate(670, 450)">
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="#d9d9d9" stroke="#666" stroke-width="1"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#333" stroke-width="2"/>
    <line x1="-25" y1="5" x2="-5" y2="5" stroke="#333" stroke-width="2"/>
    <line x1="5" y1="5" x2="25" y2="5" stroke="#333" stroke-width="2"/>
    <text x="0" y="30" font-family="Arial" font-size="12" text-anchor="middle">Chromosomes</text>
  </g>
</svg>