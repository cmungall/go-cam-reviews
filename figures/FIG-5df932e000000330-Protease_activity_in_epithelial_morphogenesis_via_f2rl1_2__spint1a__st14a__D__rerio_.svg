<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane and compartments -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
  <text x="400" y="35" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Zebrafish Epithelial Morphogenesis Pathway</text>
  
  <!-- Cell layers -->
  <rect x="100" y="100" width="600" height="150" rx="10" ry="10" fill="#e6f7ff" stroke="#333" stroke-width="1"/>
  <text x="400" y="125" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Epidermal Superficial Stratum (ZFA:0001179)</text>
  
  <rect x="100" y="300" width="600" height="150" rx="10" ry="10" fill="#d9f2e6" stroke="#333" stroke-width="1"/>
  <text x="400" y="325" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Epidermal Basal Stratum (ZFA:0001180)</text>
  
  <!-- Protein nodes -->
  <rect x="150" y="180" width="100" height="40" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <text x="200" y="205" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">spint1a</text>
  
  <rect x="350" y="180" width="100" height="40" rx="5" ry="5" fill="#ccccff" stroke="#333" stroke-width="2"/>
  <text x="400" y="205" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">st14a</text>
  
  <rect x="550" y="180" width="100" height="40" rx="5" ry="5" fill="#ccffcc" stroke="#333" stroke-width="2"/>
  <text x="600" y="205" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">f2rl1.2</text>
  
  <!-- Function labels -->
  <rect x="150" y="230" width="100" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
  <text x="200" y="250" font-family="Arial" font-size="14" text-anchor="middle">Peptidase inhibitor</text>
  
  <rect x="350" y="230" width="100" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
  <text x="400" y="250" font-family="Arial" font-size="14" text-anchor="middle">Peptidase activity</text>
  
  <rect x="550" y="230" width="100" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
  <text x="600" y="250" font-family="Arial" font-size="14" text-anchor="middle">Molecular function</text>
  
  <!-- Process label -->
  <rect x="350" y="350" width="100" height="40" rx="5" ry="5" fill="#ffffcc" stroke="#333" stroke-width="1"/>
  <text x="400" y="375" font-family="Arial" font-size="16" text-anchor="middle">Protein processing</text>
  
  <rect x="550" y="350" width="100" height="40" rx="5" ry="5" fill="#ffe6cc" stroke="#333" stroke-width="1"/>
  <text x="600" y="375" font-family="Arial" font-size="16" text-anchor="middle">Epithelial morphogenesis</text>
  
  <!-- Arrows for relationships -->
  <!-- spint1a inhibits st14a -->
  <line x1="250" y1="200" x2="340" y2="200" stroke="#ff0000" stroke-width="3" marker-end="url(#inhibit)"/>
  
  <!-- st14a activates f2rl1.2 -->
  <line x1="450" y1="200" x2="540" y2="200" stroke="#0000ff" stroke-width="3" marker-end="url(#activate)"/>
  
  <!-- st14a participates in protein processing -->
  <line x1="400" y1="230" x2="400" y2="350" stroke="#333" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- f2rl1.2 participates in epithelial morphogenesis -->
  <line x1="600" y1="230" x2="600" y2="350" stroke="#333" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="activate" viewBox="0 0 10 10" refX="9" refY="5" 
        markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0000ff"/>
    </marker>
    <marker id="inhibit" viewBox="0 0 10 10" refX="9" refY="5" 
        markerWidth="8" markerHeight="8" orient="auto">
      <line x1="0" y1="0" x2="0" y2="10" stroke-width="3" stroke="#ff0000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="580" y="470" width="170" height="85" fill="white" stroke="#333" stroke-width="1"/>
  <text x="590" y="490" font-family="Arial" font-size="16" font-weight="bold">Legend</text>
  
  <line x1="590" y1="505" x2="630" y2="505" stroke="#ff0000" stroke-width="3" marker-end="url(#inhibit)"/>
  <text x="640" y="510" font-family="Arial" font-size="16">Inhibits</text>
  
  <line x1="590" y1="525" x2="630" y2="525" stroke="#0000ff" stroke-width="3" marker-end="url(#activate)"/>
  <text x="640" y="530" font-family="Arial" font-size="16">Activates</text>
  
  <line x1="590" y1="545" x2="630" y2="545" stroke="#333" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="640" y="550" font-family="Arial" font-size="16">Part of</text>
</svg>