<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell compartments -->
  <!-- Extracellular space -->
  <rect x="50" y="50" width="700" height="150" fill="#e6f7ff" stroke="#a3d2e6" stroke-width="2" rx="10" ry="10"/>
  <text x="70" y="80" font-family="Arial" font-size="16" fill="#555555">Extracellular Space</text>
  
  <!-- Cell membrane -->
  <rect x="50" y="200" width="700" height="80" fill="#ffd6cc" stroke="#ff8566" stroke-width="2" rx="5" ry="5"/>
  <text x="70" y="225" font-family="Arial" font-size="16" fill="#555555">Plasma Membrane</text>
  
  <!-- Cytoplasm -->
  <rect x="50" y="280" width="700" height="170" fill="#e6ffcc" stroke="#b3e699" stroke-width="2" rx="10" ry="10"/>
  <text x="70" y="305" font-family="Arial" font-size="16" fill="#555555">Cytoplasm</text>
  
  <!-- Nucleus -->
  <rect x="50" y="450" width="700" height="100" fill="#e6ccff" stroke="#c299ff" stroke-width="2" rx="10" ry="10"/>
  <text x="70" y="475" font-family="Arial" font-size="16" fill="#555555">Nucleus</text>
  
  <!-- TGFB1 in extracellular space -->
  <circle cx="200" cy="130" r="30" fill="#ff9933" stroke="#cc6600" stroke-width="2"/>
  <text x="200" y="135" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">TGFB1</text>
  
  <!-- TGFBR2 in membrane -->
  <rect x="300" y="210" width="60" height="30" fill="#99ccff" stroke="#3399ff" stroke-width="2" rx="5" ry="5"/>
  <text x="330" y="230" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">TGFBR2</text>
  
  <!-- TGFBR1 in membrane -->
  <rect x="400" y="210" width="60" height="30" fill="#99ccff" stroke="#3399ff" stroke-width="2" rx="5" ry="5"/>
  <text x="430" y="230" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">TGFBR1</text>
  
  <!-- SMAD2 in cytoplasm -->
  <circle cx="400" cy="350" r="30" fill="#99cc00" stroke="#669900" stroke-width="2"/>
  <text x="400" y="355" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">SMAD2</text>
  
  <!-- SMAD2 in nucleus -->
  <circle cx="400" cy="500" r="30" fill="#99cc00" stroke="#669900" stroke-width="2"/>
  <text x="400" y="505" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">SMAD2</text>
  
  <!-- DNA in nucleus -->
  <rect x="500" y="490" width="100" height="20" fill="#ff99cc" stroke="#ff3399" stroke-width="2" rx="5" ry="5"/>
  <text x="550" y="505" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">DNA</text>
  
  <!-- Arrows -->
  <!-- TGFB1 to TGFBR2 -->
  <line x1="220" y1="150" x2="300" y2="210" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- TGFBR2 to TGFBR1 -->
  <line x1="360" y1="225" x2="400" y2="225" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- TGFBR1 to SMAD2 in cytoplasm -->
  <path d="M460,240 Q470,350 430,350" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- SMAD2 translocation to nucleus -->
  <line x1="400" y1="380" x2="400" y2="470" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- SMAD2 to DNA -->
  <line x1="430" y1="500" x2="500" y2="500" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
  
  <!-- Labels for molecular functions -->
  <text x="220" y="110" font-family="Arial" font-size="14" fill="#666666" text-anchor="middle">Cytokine Activity</text>
  <text x="330" y="200" font-family="Arial" font-size="14" fill="#666666" text-anchor="middle">Type II Receptor</text>
  <text x="430" y="200" font-family="Arial" font-size="14" fill="#666666" text-anchor="middle">Type I Receptor</text>
  
  <!-- Activation label with arrow -->
  <text x="470" y="350" font-family="Arial" font-size="14" fill="#666666">Activated</text>
  <line x1="470" y1="355" x2="440" y2="355" stroke="#666666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <text x="600" y="505" font-family="Arial" font-size="14" fill="#666666" text-anchor="middle">Transcription Factor Activity</text>
  
  <!-- Legend -->
  <rect x="50" y="570" width="700" height="60" fill="#f5f5f5" stroke="#cccccc" stroke-width="2" rx="5" ry="5"/>
  <text x="400" y="590" font-family="Arial" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Legend</text>
  
  <!-- Legend items -->
  <!-- Cytokine -->
  <circle cx="100" cy="610" r="10" fill="#ff9933" stroke="#cc6600" stroke-width="2"/>
  <text x="120" y="615" font-family="Arial" font-size="14" fill="#333333">Cytokine (TGFB1)</text>
  
  <!-- Receptor -->
  <rect x="250" y="605" width="20" height="10" fill="#99ccff" stroke="#3399ff" stroke-width="2" rx="2" ry="2"/>
  <text x="280" y="615" font-family="Arial" font-size="14" fill="#333333">Receptor (TGFBR1/2)</text>
  
  <!-- Transcription factor -->
  <circle cx="420" cy="610" r="10" fill="#99cc00" stroke="#669900" stroke-width="2"/>
  <text x="440" y="615" font-family="Arial" font-size="14" fill="#333333">Transcription Factor (SMAD2)</text>
  
  <!-- DNA -->
  <rect x="600" y="605" width="30" height="10" fill="#ff99cc" stroke="#ff3399" stroke-width="2" rx="2" ry="2"/>
  <text x="640" y="615" font-family="Arial" font-size="14" fill="#333333">DNA</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle">TGFB1-Mediated Signaling Pathway (Human)</text>
</svg>