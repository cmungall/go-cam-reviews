<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Phosphorylation of MRE11 by PLK1 and CK2 inhibits double-strand break repair</text>
  <text x="400" y="65" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">via homologous recombination</text>
  
  <!-- Cell Nucleus -->
  <ellipse cx="400" cy="320" rx="350" ry="230" fill="#f0f8ff" stroke="#b0c4de" stroke-width="2" opacity="0.7" />
  <text x="200" y="130" font-family="Arial" font-size="16" text-anchor="middle">Nucleus</text>
  
  <!-- Timeline arrows at top -->
  <line x1="150" y1="100" x2="650" y2="100" stroke="#333333" stroke-width="3" />
  <polygon points="650,100 640,95 640,105" fill="#333333" />
  
  <!-- Timeline steps -->
  <text x="175" y="120" font-family="Arial" font-size="12" text-anchor="middle">1. DNA Damage</text>
  <text x="300" y="120" font-family="Arial" font-size="12" text-anchor="middle">2. Kinase Activation</text>
  <text x="450" y="120" font-family="Arial" font-size="12" text-anchor="middle">3. MRE11 Phosphorylation</text>
  <text x="600" y="120" font-family="Arial" font-size="12" text-anchor="middle">4. HR Inhibition</text>
  
  <!-- DNA Double Strand Break - more detailed -->
  <path d="M250,320 C260,310 270,330 280,320" stroke="#8a2be2" stroke-width="5" fill="none" />
  <path d="M250,330 C260,320 270,340 280,330" stroke="#8a2be2" stroke-width="5" fill="none" />
  
  <path d="M520,320 C510,310 500,330 490,320" stroke="#8a2be2" stroke-width="5" fill="none" />
  <path d="M520,330 C510,320 500,340 490,330" stroke="#8a2be2" stroke-width="5" fill="none" />
  
  <rect x="340" y="300" width="120" height="50" rx="5" ry="5" fill="#ffffdd" stroke="#ddddaa" stroke-width="1" opacity="0.7" />
  <text x="400" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" fill="#663300">Double-Strand Break Site</text>
  <text x="400" y="345" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#663300">(GO:0035861)</text>
  
  <!-- MRE11 at DSB site - detailed with domains -->
  <circle cx="400" cy="290" r="40" fill="#ff9999" stroke="#ff6666" stroke-width="3" />
  <text x="400" y="285" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">MRE11</text>
  <text x="400" y="305" font-family="Arial" font-size="10" text-anchor="middle">(P49959)</text>
  
  <!-- MRE11 Activity Labels -->
  <text x="360" y="280" font-family="Arial" font-size="10" text-anchor="middle" fill="#990000">Exonuclease</text>
  <text x="440" y="280" font-family="Arial" font-size="10" text-anchor="middle" fill="#990000">Endonuclease</text>
  
  <!-- PLK1 -->
  <rect x="180" y="200" width="70" height="40" rx="10" ry="10" fill="#99ccff" stroke="#6699cc" stroke-width="3" />
  <text x="215" y="225" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">PLK1</text>
  <text x="215" y="240" font-family="Arial" font-size="10" text-anchor="middle">(P53350)</text>
  
  <!-- CK2 (CSNK2A1) -->
  <rect x="320" y="200" width="70" height="40" rx="10" ry="10" fill="#99cccc" stroke="#669999" stroke-width="3" />
  <text x="355" y="225" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CK2</text>
  <text x="355" y="240" font-family="Arial" font-size="10" text-anchor="middle">(P68400)</text>
  
  <!-- Arrow from PLK1 to CK2 -->
  <path d="M250,220 L320,220" stroke="#000000" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="285" y="210" font-family="Arial" font-size="12" text-anchor="middle">activates</text>
  <text x="285" y="225" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(RO:0002413)</text>
  
  <!-- Phosphorylation sites -->
  <circle cx="380" cy="260" r="8" fill="#ffff00" stroke="#999900" stroke-width="1" />
  <text x="380" y="255" font-family="Arial" font-size="10" text-anchor="middle">P</text>
  
  <circle cx="420" cy="260" r="8" fill="#ffff00" stroke="#999900" stroke-width="1" />
  <text x="420" y="255" font-family="Arial" font-size="10" text-anchor="middle">P</text>
  
  <!-- Arrow from CK2 to MRE11 -->
  <path d="M355,240 L380,260" stroke="#000000" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M355,240 L420,260" stroke="#000000" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="330" y="255" font-family="Arial" font-size="12" text-anchor="start">phosphorylates</text>
  <text x="330" y="270" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">(GO:0004674)</text>
  
  <!-- Inhibition markers -->
  <line x1="360" y1="290" x2="325" y2="320" stroke="#ff0000" stroke-width="3" stroke-dasharray="5,3" />
  <text x="320" y="335" font-family="Arial" font-size="10" text-anchor="middle" fill="#ff0000">Exonuclease</text>
  <text x="320" y="347" font-family="Arial" font-size="10" text-anchor="middle" fill="#ff0000">Inhibition</text>
  <text x="320" y="359" font-family="Arial" font-size="8" text-anchor="middle" fill="#ff0000">(GO:0008296)</text>
  
  <line x1="440" y1="290" x2="475" y2="320" stroke="#ff0000" stroke-width="3" stroke-dasharray="5,3" />
  <text x="480" y="335" font-family="Arial" font-size="10" text-anchor="middle" fill="#ff0000">Endonuclease</text>
  <text x="480" y="347" font-family="Arial" font-size="10" text-anchor="middle" fill="#ff0000">Inhibition</text>
  <text x="480" y="359" font-family="Arial" font-size="8" text-anchor="middle" fill="#ff0000">(GO:0004520)</text>
  
  <!-- HR Inhibition -->
  <path d="M400,330 L400,390" stroke="#ff0000" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#inhibitmark)" />
  <text x="460" y="370" font-family="Arial" font-size="12" text-anchor="start" fill="#ff0000">Negative Regulation</text>
  <text x="460" y="385" font-family="Arial" font-size="10" text-anchor="start" fill="#ff0000" font-style="italic">(RO:0002630)</text>
  <text x="460" y="400" font-family="Arial" font-size="10" text-anchor="start" fill="#ff0000" font-style="italic">(GO:2000042)</text>
  
  <!-- Biological Process -->
  <rect x="300" y="430" width="200" height="60" rx="10" ry="10" fill="#ccff99" stroke="#99cc66" stroke-width="3" />
  <text x="400" y="455" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Double-Strand Break Repair</text>
  <text x="400" y="475" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">via Homologous Recombination</text>
  <text x="400" y="490" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(GO:0000724)</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
    <marker id="inhibitmark" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <line x1="0" y1="0" x2="12" y2="12" stroke="#ff0000" stroke-width="2" />
      <line x1="0" y1="12" x2="12" y2="0" stroke="#ff0000" stroke-width="2" />
    </marker>
  </defs>
  
  <!-- Legend - repositioned and resized -->
  <rect x="585" y="170" width="190" height="210" fill="#ffffff" stroke="#000000" stroke-width="1.5" opacity="0.9" />
  <text x="680" y="190" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <circle cx="605" y="210" r="10" fill="#ff9999" stroke="#ff6666" stroke-width="1.5" />
  <text x="620" y="215" font-family="Arial" font-size="12" text-anchor="start">MRE11 (P49959)</text>
  
  <rect x="595" y="230" width="20" height="15" fill="#99ccff" stroke="#6699cc" stroke-width="1.5" />
  <text x="620" y="242" font-family="Arial" font-size="12" text-anchor="start">PLK1 (P53350)</text>
  
  <rect x="595" y="255" width="20" height="15" fill="#99cccc" stroke="#669999" stroke-width="1.5" />
  <text x="620" y="267" font-family="Arial" font-size="12" text-anchor="start">CK2 (P68400)</text>
  
  <circle cx="605" y="285" r="8" fill="#ffff00" stroke="#999900" stroke-width="1.5" />
  <text x="605" y="280" font-family="Arial" font-size="10" text-anchor="middle">P</text>
  <text x="620" y="290" font-family="Arial" font-size="12" text-anchor="start">Phosphorylation Site</text>
  
  <line x1="595" y1="310" x2="615" y2="310" stroke="#ff0000" stroke-width="3" stroke-dasharray="5,3" />
  <text x="620" y="315" font-family="Arial" font-size="12" text-anchor="start">Inhibition</text>
  
  <path d="M595,335 L615,335" stroke="#000000" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="620" y="340" font-family="Arial" font-size="12" text-anchor="start">Activation</text>
  
  <text x="605" y="365" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">(GO:XXXXX)</text>
  <text x="620" y="365" font-family="Arial" font-size="12" text-anchor="start">Gene Ontology ID</text>
</svg>