<svg width="800" height="680" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell representation -->
  <rect x="0" y="0" width="800" height="680" fill="#f8f9fa" />
  
  <!-- Cell membrane -->
  <path d="M 50,280 C 50,150 750,150 750,280 C 750,420 50,420 50,280 Z" fill="#e6f2ff" stroke="#333" stroke-width="2" />
  
  <!-- Membrane lipid bilayer representation -->
  <path d="M 50,280 C 50,150 750,150 750,280 C 750,420 50,420 50,280 Z" fill="none" stroke="#0066cc" stroke-width="5" stroke-opacity="0.7" />
  
  <!-- Extracellular label -->
  <text x="400" y="120" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Extracellular Space (GO:0005615)</text>
  
  <!-- Intracellular label -->
  <text x="400" y="350" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Intracellular</text>
  
  <!-- Plasma membrane label -->
  <text x="100" y="280" font-family="Arial" font-size="18" text-anchor="start" fill="#0066cc">Plasma Membrane</text>
  <text x="100" y="300" font-family="Arial" font-size="16" text-anchor="start" fill="#0066cc">(GO:0005886)</text>
  
  <!-- ADAM17 Metallopeptidase -->
  <rect x="150" y="260" width="120" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#994c00" stroke-width="2" />
  <text x="210" y="285" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Adam17</text>
  
  <!-- AREG (ligand precursor) -->
  <rect x="350" y="260" width="120" height="40" rx="5" ry="5" fill="#b3ffb3" stroke="#006600" stroke-width="2" />
  <text x="410" y="285" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Areg</text>
  
  <!-- Mature AREG ligand -->
  <circle cx="410" cy="200" r="25" fill="#66ff66" stroke="#006600" stroke-width="2" />
  <text x="410" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Areg</text>
  
  <!-- EGFR Receptor -->
  <rect x="550" y="250" width="120" height="60" rx="5" ry="5" fill="#ffb3b3" stroke="#990000" stroke-width="2" />
  <text x="610" y="285" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Egfr</text>
  
  <!-- Process arrows and labels -->
  <!-- ADAM17 to AREG cleavage -->
  <line x1="270" y1="280" x2="350" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="310" y="265" font-family="Arial" font-size="15" text-anchor="middle" fill="#333">cleaves</text>
  
  <!-- AREG processing to active ligand -->
  <line x1="410" y1="260" x2="410" y2="225" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="450" y="245" font-family="Arial" font-size="15" text-anchor="start" fill="#333">processing</text>
  
  <!-- AREG binding to EGFR -->
  <line x1="435" y1="200" x2="560" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="490" y="210" font-family="Arial" font-size="15" text-anchor="middle" fill="#333">binds and activates</text>
  
  <!-- EGFR activated state -->
  <circle cx="610" cy="190" r="20" fill="#ff6666" stroke="#990000" stroke-width="2" />
  <text x="610" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">P</text>
  <text x="610" y="160" font-family="Arial" font-size="15" text-anchor="middle" fill="#333">activated EGFR</text>
  
  <!-- Process labels and GO terms -->
  <text x="400" y="470" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">Epidermal Growth Factor Receptor Signaling Pathway</text>
  <text x="400" y="495" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic" fill="#333">(GO:0007173)</text>
  
  <!-- Protein functions -->
  <text x="150" y="320" font-family="Arial" font-size="14" text-anchor="start" fill="#333">metallopeptidase activity</text>
  <text x="150" y="338" font-family="Arial" font-size="12" text-anchor="start" font-style="italic" fill="#333">(GO:0008237)</text>
  
  <text x="350" y="320" font-family="Arial" font-size="14" text-anchor="start" fill="#333">receptor ligand activity</text>
  <text x="350" y="338" font-family="Arial" font-size="12" text-anchor="start" font-style="italic" fill="#333">(GO:0048018)</text>
  
  <text x="550" y="330" font-family="Arial" font-size="14" text-anchor="start" fill="#333">tyrosine kinase activity</text>
  <text x="550" y="348" font-family="Arial" font-size="12" text-anchor="start" font-style="italic" fill="#333">(GO:0004714)</text>
  
  <text x="150" y="365" font-family="Arial" font-size="14" text-anchor="start" fill="#333">signaling receptor ligand</text>
  <text x="150" y="382" font-family="Arial" font-size="14" text-anchor="start" fill="#333">precursor processing</text>
  <text x="150" y="400" font-family="Arial" font-size="12" text-anchor="start" font-style="italic" fill="#333">(GO:0140448)</text>

  <!-- Legend -->
  <rect x="50" y="520" width="700" height="140" rx="5" ry="5" fill="#f0f0f0" stroke="#333" stroke-width="1" />
  <text x="60" y="540" font-family="Arial" font-size="18" font-weight="bold" text-anchor="start" fill="#333">Legend:</text>
  
  <!-- Protein symbols -->
  <rect x="60" y="555" width="30" height="20" rx="3" ry="3" fill="#ffcc99" stroke="#994c00" stroke-width="2" />
  <text x="100" y="570" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Adam17 (MGI:1096335) - Metallopeptidase</text>
  
  <rect x="60" y="585" width="30" height="20" rx="3" ry="3" fill="#b3ffb3" stroke="#006600" stroke-width="2" />
  <text x="100" y="600" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Areg (MGI:88068) - EGF Receptor Ligand Precursor</text>
  
  <circle cx="75" y="620" r="10" fill="#66ff66" stroke="#006600" stroke-width="2" />
  <text x="100" y="625" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Processed active Areg ligand</text>
  
  <rect x="350" y="555" width="30" height="20" rx="3" ry="3" fill="#ffb3b3" stroke="#990000" stroke-width="2" />
  <text x="390" y="570" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Egfr (MGI:95294) - EGF Receptor</text>
  
  <circle cx="365" y="590" r="10" fill="#ff6666" stroke="#990000" stroke-width="2" />
  <text x="365" y="590" font-family="Arial" font-size="12" text-anchor="middle" fill="#fff">P</text>
  <text x="390" y="595" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Phosphorylated (activated) receptor</text>
  
  <line x1="350" y1="625" x2="380" y2="625" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="390" y="630" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Causal relationship (positive regulation)</text>
  
  <text x="60" y="650" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Interactions:</text>
  <text x="150" y="650" font-family="Arial" font-size="15" text-anchor="start" fill="#333">Adam17 cleaves Areg → Active Areg binds and activates Egfr → Signaling cascade</text>
  
  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>