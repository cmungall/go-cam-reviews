<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Cell outline -->
    <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
    
    <!-- Lysosome -->
    <ellipse cx="400" cy="250" rx="130" ry="90" fill="#e6e6fa" stroke="#9370db" stroke-width="3"/>
    <text x="400" y="250" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Lysosomal Membrane</text>
    
    <!-- Cytosolic ribosome -->
    <rect x="600" y="400" width="120" height="60" rx="10" ry="10" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
    <text x="660" y="430" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Cytosolic Ribosome</text>
    
    <!-- mTOR Pathway Components -->
    <!-- RHEB -->
    <circle cx="400" cy="200" r="30" fill="#ffd700" stroke="#333" stroke-width="2"/>
    <text x="400" y="200" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">RHEB</text>
    
    <!-- mTOR -->
    <rect x="340" y="270" width="70" height="35" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
    <text x="375" y="292" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">mTOR</text>
    
    <!-- TSC2 -->
    <rect x="270" y="190" width="60" height="35" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
    <text x="300" y="212" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">TSC2</text>
    
    <!-- RNF152 -->
    <rect x="180" y="150" width="70" height="35" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
    <text x="215" y="172" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">RNF152</text>
    
    <!-- USP4 -->
    <rect x="470" y="150" width="60" height="35" rx="5" ry="5" fill="#99ffcc" stroke="#009966" stroke-width="2"/>
    <text x="500" y="172" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">USP4</text>
    
    <!-- AKT1 -->
    <rect x="540" y="80" width="60" height="35" rx="5" ry="5" fill="#cc99ff" stroke="#6600cc" stroke-width="2"/>
    <text x="570" y="102" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">AKT1</text>
    
    <!-- RPS6KB1 and RPS6KB2 -->
    <rect x="430" y="330" width="80" height="35" rx="5" ry="5" fill="#ccff99" stroke="#66cc00" stroke-width="2"/>
    <text x="470" y="352" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">RPS6KB1/2</text>
    
    <!-- RPS6 -->
    <rect x="550" y="370" width="60" height="35" rx="5" ry="5" fill="#ffffcc" stroke="#cccc00" stroke-width="2"/>
    <text x="580" y="392" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">RPS6</text>
    
    <!-- EIF4EBP1 -->
    <rect x="270" y="330" width="80" height="35" rx="5" ry="5" fill="#ffccff" stroke="#cc00cc" stroke-width="2"/>
    <text x="310" y="352" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">EIF4EBP1</text>
    
    <!-- Connections/Arrows -->
    <!-- RNF152 to RHEB (ubiquitination) -->
    <path d="M250 165 Q 320 150 380 185" fill="none" stroke="#0066cc" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="300" y="145" font-family="Arial" font-size="12" font-weight="bold" fill="#0066cc">Ubiquitination</text>
    
    <!-- USP4 to RHEB (deubiquitination) -->
    <path d="M470 165 Q 430 150 430 175" fill="none" stroke="#009966" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="455" y="135" font-family="Arial" font-size="12" font-weight="bold" fill="#009966">Deubiquitination</text>
    
    <!-- AKT1 to USP4 (regulation) -->
    <path d="M540 100 L 510 150" fill="none" stroke="#6600cc" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="510" y="120" font-family="Arial" font-size="12" font-weight="bold" fill="#6600cc">Activates</text>
    
    <!-- TSC2 to RHEB (negative regulation) -->
    <path d="M330 207 L 370 200" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="330" y="185" font-family="Arial" font-size="12" font-weight="bold" fill="#ff0000">Inhibits</text>
    
    <!-- RHEB to mTOR (activation) -->
    <path d="M395 230 L 375 270" fill="none" stroke="#008000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="370" y="245" font-family="Arial" font-size="12" font-weight="bold" fill="#008000">Activates</text>
    
    <!-- mTOR to RPS6KB1/2 (activation) -->
    <path d="M410 305 L 440 330" fill="none" stroke="#008000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="415" y="318" font-family="Arial" font-size="12" font-weight="bold" fill="#008000">Activates</text>
    
    <!-- mTOR to EIF4EBP1 (regulation) -->
    <path d="M340 305 L 320 330" fill="none" stroke="#008000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="300" y="318" font-family="Arial" font-size="12" font-weight="bold" fill="#008000">Inhibits</text>
    
    <!-- RPS6KB1/2 to RPS6 (activation) -->
    <path d="M510 345 L 550 370" fill="none" stroke="#008000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="520" y="350" font-family="Arial" font-size="12" font-weight="bold" fill="#008000">Activates</text>
    
    <!-- RPS6 to Ribosome (promotes translation) -->
    <path d="M610 387 L 650 400" fill="none" stroke="#008000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="635" y="380" font-family="Arial" font-size="12" font-weight="bold" fill="#008000">Translation</text>
    
    <!-- Arrow definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" />
        </marker>
    </defs>
    
    <!-- Title -->
    <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Regulation of mTORC1 Signaling via RHEB Ubiquitination</text>
    <text x="400" y="55" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle">Canonical pathway controlling translation initiation</text>
    
    <!-- Legend -->
    <rect x="20" y="490" width="240" height="100" fill="#ffffff" stroke="#333333" stroke-width="1"/>
    <text x="30" y="510" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
    <line x1="30" y1="530" x2="60" y2="530" stroke="#008000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="70" y="535" font-family="Arial" font-size="12" font-weight="bold">Activation</text>
    <line x1="30" y1="550" x2="60" y2="550" stroke="#ff0000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="70" y="555" font-family="Arial" font-size="12" font-weight="bold">Inhibition</text>
    <line x1="30" y1="570" x2="60" y2="570" stroke="#0066cc" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="70" y="575" font-family="Arial" font-size="12" font-weight="bold">Ubiquitination</text>
    <line x1="30" y1="590" x2="60" y2="590" stroke="#009966" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="70" y="595" font-family="Arial" font-size="12" font-weight="bold">Deubiquitination</text>
</svg>