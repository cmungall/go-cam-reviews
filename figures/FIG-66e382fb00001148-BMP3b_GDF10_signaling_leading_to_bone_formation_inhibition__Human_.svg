<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell components -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9"/>
  
  <!-- Cell outline -->
  <path d="M100,150 Q400,50 700,150 Q750,300 700,450 Q400,550 100,450 Q50,300 100,150 Z" 
        fill="#f8f8ff" stroke="#333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="350" rx="150" ry="120" fill="#e6e6fa" stroke="#333" stroke-width="2"/>
  <text x="400" y="350" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Nucleus</text>
  <text x="400" y="375" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">(GO:0005634)</text>
  
  <!-- Labels -->
  <text x="400" y="50" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">BMP3b/GDF10 Signaling Pathway</text>
  <text x="400" y="75" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Negative Regulation of Ossification (GO:0030279)</text>
  
  <!-- Extracellular Space Label -->
  <text x="400" y="130" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Extracellular Space (GO:0005615)</text>
  
  <!-- Plasma Membrane Label -->
  <text x="150" y="190" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Plasma Membrane</text>
  <text x="150" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">(GO:0005886)</text>
  
  <!-- Cytoplasm Label -->
  <text x="600" y="230" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Cytoplasm</text>
  
  <!-- GDF10 Ligand -->
  <circle cx="400" cy="110" r="35" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="400" y="110" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GDF10</text>
  <text x="400" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(P55107)</text>
  
  <!-- Receptors (different colors for clarity) -->
  <!-- ACVR2A Receptor -->
  <rect x="330" y="170" width="60" height="30" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="360" y="185" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">ACVR2A</text>
  <text x="360" y="197" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">(P27037)</text>
  
  <!-- ACVR1B Receptor -->
  <rect x="410" y="170" width="60" height="30" rx="5" ry="5" fill="#7fbfff" stroke="#333" stroke-width="2"/>
  <text x="440" y="185" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">ACVR1B</text>
  <text x="440" y="197" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">(P36896)</text>
  
  <!-- SMAD Transcription Factors -->
  <!-- SMAD2 -->
  <rect x="320" y="330" width="60" height="30" rx="5" ry="5" fill="#99ff99" stroke="#333" stroke-width="2"/>
  <text x="350" y="347" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">SMAD2</text>
  <text x="350" y="359" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">(Q15796)</text>
  
  <!-- SMAD3 -->
  <rect x="420" y="330" width="60" height="30" rx="5" ry="5" fill="#66cc66" stroke="#333" stroke-width="2"/>
  <text x="450" y="347" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">SMAD3</text>
  <text x="450" y="359" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">(P84022)</text>
  
  <!-- DNA -->
  <path d="M320,400 Q370,385 420,400 Q470,415 520,400" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M320,410 Q370,395 420,410 Q470,425 520,410" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Target Genes -->
  <rect x="370" y="430" width="100" height="25" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="420" y="447" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Target Genes</text>
  
  <!-- Bone Formation Box -->
  <rect x="340" y="480" width="160" height="40" rx="10" ry="10" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <text x="420" y="505" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Bone Formation ↓</text>
  
  <!-- Pathway Arrows -->
  <!-- GDF10 to Receptors -->
  <path d="M400,145 L400,170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Receptors to SMADs -->
  <path d="M370,200 C370,250 350,300 350,330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M430,200 C430,250 450,300 450,330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- SMADs to DNA -->
  <path d="M350,360 L350,400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M450,360 L450,400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- DNA to Target Genes -->
  <path d="M420,410 L420,430" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Target Genes to Bone Formation -->
  <path d="M420,455 L420,480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Function Labels -->
  <text x="280" y="110" font-family="Arial" font-size="12" text-anchor="end" fill="#666">Cytokine Activity</text>
  <text x="280" y="125" font-family="Arial" font-size="10" text-anchor="end" fill="#666">(GO:0005125)</text>
  
  <text x="270" y="190" font-family="Arial" font-size="12" text-anchor="end" fill="#666">Type I Receptor</text>
  <text x="270" y="205" font-family="Arial" font-size="10" text-anchor="end" fill="#666">(GO:0016361)</text>
  
  <text x="530" y="340" font-family="Arial" font-size="12" text-anchor="start" fill="#666">DNA-binding TF Activity</text>
  <text x="530" y="355" font-family="Arial" font-size="10" text-anchor="start" fill="#666">(GO:0001228)</text>
  
  <!-- Color code for compartments -->
  <rect x="20" y="525" width="15" height="15" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="45" y="537" font-family="Arial" font-size="12" fill="#333">Extracellular Signaling Molecule</text>
  
  <rect x="20" y="550" width="15" height="15" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="45" y="562" font-family="Arial" font-size="12" fill="#333">Membrane Receptors</text>
  
  <rect x="20" y="575" width="15" height="15" fill="#99ff99" stroke="#333" stroke-width="1"/>
  <text x="45" y="587" font-family="Arial" font-size="12" fill="#333">Nuclear Transcription Factors</text>
  
  <rect x="300" y="525" width="15" height="15" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="325" y="537" font-family="Arial" font-size="12" fill="#333">Gene Expression</text>
  
  <rect x="300" y="550" width="15" height="15" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="325" y="562" font-family="Arial" font-size="12" fill="#333">Biological Output</text>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>