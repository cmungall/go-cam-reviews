<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="520" cy="310" rx="180" ry="160" fill="#e6f2ff" stroke="#333" stroke-width="2"/>
  <text x="520" y="210" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Nucleus</text>
  
  <!-- Cytoplasm label -->
  <text x="240" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cytoplasm</text>
  
  <!-- TRIM55 in cytoplasm -->
  <rect x="120" y="240" width="120" height="60" rx="10" ry="10" fill="#ffe6cc" stroke="#ff9933" stroke-width="2"/>
  <text x="180" y="274" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TRIM55</text>
  <text x="180" y="290" font-family="Arial" font-size="10" text-anchor="middle">(UniProtKB:Q9BYV6)</text>
  
  <!-- TRIM21 in cytoplasm -->
  <rect x="120" y="340" width="120" height="60" rx="10" ry="10" fill="#ffe6cc" stroke="#ff9933" stroke-width="2"/>
  <text x="180" y="374" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TRIM21</text>
  <text x="180" y="390" font-family="Arial" font-size="10" text-anchor="middle">(UniProtKB:P19474)</text>
  
  <!-- VCP in cytoplasm - hexagon shape -->
  <polygon points="320,290 380,270 440,290 440,330 380,350 320,330" fill="#e6ffcc" stroke="#66cc00" stroke-width="2"/>
  <text x="380" y="314" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">VCP</text>
  <text x="380" y="330" font-family="Arial" font-size="10" text-anchor="middle">(UniProtKB:P55072)</text>
  
  <!-- NFKB2 in nucleus - rounded rectangle -->
  <rect x="520" y="320" width="120" height="60" rx="10" ry="10" fill="#ccccff" stroke="#6666ff" stroke-width="2"/>
  <text x="580" y="354" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">NFKB2</text>
  <text x="580" y="370" font-family="Arial" font-size="10" text-anchor="middle">(UniProtKB:Q00653)</text>
  
  <!-- Process Descriptions and Arrows -->
  <!-- TRIM55 to VCP (K48 ubiquitination) -->
  <path d="M240 270 C280 270, 290 280, 320 300" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="280" cy="270" r="22" fill="#ffcccc" stroke="#ff6666" stroke-width="1.5"/>
  <text x="280" y="265" font-family="Arial" font-size="10" text-anchor="middle">K48-Ub</text>
  <text x="280" y="278" font-family="Arial" font-size="10" text-anchor="middle">ligase</text>
  
  <!-- Ubiquitin chain symbol for K48 -->
  <circle cx="260" cy="255" r="5" fill="#ff6666" stroke="none"/>
  <circle cx="270" cy="250" r="5" fill="#ff6666" stroke="none"/>
  <circle cx="280" cy="245" r="5" fill="#ff6666" stroke="none"/>
  <line x1="260" y1="255" x2="270" y2="250" stroke="#ff6666" stroke-width="1.5"/>
  <line x1="270" y1="250" x2="280" y2="245" stroke="#ff6666" stroke-width="1.5"/>

  <!-- TRIM55 adapter function to TRIM21 -->
  <path d="M180 300 L180 340" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <polygon points="200,310 230,315 230,325 200,330" fill="#ffeecc" stroke="#ffcc66" stroke-width="1.5"/>
  <text x="215" y="323" font-family="Arial" font-size="10" text-anchor="middle">Adaptor</text>

  <!-- TRIM21 to VCP (K63 ubiquitination) -->
  <path d="M240 370 C280 370, 290 350, 330 330" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="280" cy="360" r="22" fill="#ffcccc" stroke="#ff6666" stroke-width="1.5"/>
  <text x="280" y="355" font-family="Arial" font-size="10" text-anchor="middle">K63-Ub</text>
  <text x="280" y="368" font-family="Arial" font-size="10" text-anchor="middle">ligase</text>
  
  <!-- Ubiquitin chain symbol for K63 - different orientation -->
  <circle cx="260" cy="345" r="5" fill="#ff6666" stroke="none"/>
  <circle cx="260" cy="335" r="5" fill="#ff6666" stroke="none"/>
  <circle cx="260" cy="325" r="5" fill="#ff6666" stroke="none"/>
  <line x1="260" y1="345" x2="260" y2="335" stroke="#ff6666" stroke-width="1.5"/>
  <line x1="260" y1="335" x2="260" y2="325" stroke="#ff6666" stroke-width="1.5"/>

  <!-- VCP to NFKB2 (negative regulation) -->
  <path d="M440 310 C480 310, 490 320, 520 340" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowheadInhibit)"/>
  <rect x="465" y="300" width="30" height="20" rx="10" ry="10" fill="#e6ffcc" stroke="#66cc00" stroke-width="1"/>
  <line x1="470" y1="310" x2="490" y2="310" stroke="red" stroke-width="2"/>

  <!-- NFKB2 Transcription Activity -->
  <path d="M580 320 C580 280, 580 260, 580 240" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <polygon points="545,240 580,220 615,240 615,265 580,285 545,265" fill="#ccccff" stroke="#6666ff" stroke-width="1.5"/>
  <text x="580" y="245" font-family="Arial" font-size="10" text-anchor="middle">Transcription</text>
  <text x="580" y="258" font-family="Arial" font-size="10" text-anchor="middle">Activator</text>
  <text x="580" y="271" font-family="Arial" font-size="10" text-anchor="middle">(DNA-binding)</text>
  
  <!-- DNA Symbol -->
  <path d="M540 230 C550 225, 560 235, 570 230 C580 225, 590 235, 600 230" fill="none" stroke="#6666ff" stroke-width="2"/>
  <path d="M540 225 C550 220, 560 230, 570 225 C580 220, 590 230, 600 225" fill="none" stroke="#6666ff" stroke-width="2"/>

  <!-- Signaling pathway labels -->
  <rect x="570" y="400" width="140" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#6666ff" stroke-width="1" opacity="0.7"/>
  <text x="640" y="415" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Canonical NF-κB</text>
  <text x="640" y="430" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">signal transduction</text>
  
  <rect x="230" y="440" width="160" height="40" rx="5" ry="5" fill="#ffe6cc" stroke="#ff9933" stroke-width="1" opacity="0.7"/>
  <text x="310" y="455" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Non-canonical NF-κB</text>
  <text x="310" y="470" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">signal transduction</text>

  <!-- Legend -->
  <rect x="20" y="460" width="160" height="120" fill="white" stroke="#333" stroke-width="1"/>
  <text x="100" y="480" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="30" y="490" width="20" height="10" rx="5" ry="5" fill="#ffe6cc" stroke="#ff9933" stroke-width="1"/>
  <text x="60" y="500" font-family="Arial" font-size="10" text-anchor="start">TRIM proteins</text>
  
  <polygon points="30,510 40,515 50,510 50,525 40,530 30,525" fill="#e6ffcc" stroke="#66cc00" stroke-width="1"/>
  <text x="60" y="520" font-family="Arial" font-size="10" text-anchor="start">VCP</text>
  
  <rect x="30" y="535" width="20" height="10" rx="5" ry="5" fill="#ccccff" stroke="#6666ff" stroke-width="1"/>
  <text x="60" y="545" font-family="Arial" font-size="10" text-anchor="start">NFKB2</text>
  
  <circle cx="35" cy="560" r="5" fill="#ffcccc" stroke="#ff6666" stroke-width="1"/>
  <text x="60" y="565" font-family="Arial" font-size="10" text-anchor="start">Ubiquitination</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <marker id="arrowheadInhibit" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <line x1="0" y1="0" x2="10" y2="10" stroke="red" stroke-width="2"/>
      <line x1="0" y1="10" x2="10" y2="0" stroke="red" stroke-width="2"/>
    </marker>
  </defs>
</svg>