<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with compartments -->
  <rect x="50" y="50" width="700" height="300" fill="#E6F7FF" stroke="#0066CC" stroke-width="2" rx="20" ry="20"/>
  <rect x="50" y="350" width="700" height="200" fill="#FFECE6" stroke="#CC6600" stroke-width="2" rx="20" ry="20"/>
  
  <!-- Compartment labels -->
  <text x="380" y="80" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Cytosol</text>
  <text x="380" y="380" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Peroxisome</text>
  
  <!-- Metabolites -->
  <rect x="100" y="150" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5" ry="5"/>
  <text x="140" y="175" font-family="Arial" font-size="16" text-anchor="middle">dGMP</text>
  
  <rect x="240" y="150" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5" ry="5"/>
  <text x="280" y="165" font-family="Arial" font-size="12" text-anchor="middle">Deoxy-</text>
  <text x="280" y="180" font-family="Arial" font-size="12" text-anchor="middle">guanosine</text>
  
  <rect x="380" y="150" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5" ry="5"/>
  <text x="420" y="175" font-family="Arial" font-size="16" text-anchor="middle">Guanine</text>
  
  <rect x="520" y="150" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5" ry="5"/>
  <text x="560" y="175" font-family="Arial" font-size="16" text-anchor="middle">Xanthine</text>
  
  <rect x="520" y="250" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5" ry="5"/>
  <text x="560" y="275" font-family="Arial" font-size="16" text-anchor="middle">Uric acid</text>
  
  <rect x="520" y="450" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5" ry="5"/>
  <text x="560" y="465" font-family="Arial" font-size="12" text-anchor="middle">Hydroxy-</text>
  <text x="560" y="480" font-family="Arial" font-size="12" text-anchor="middle">isourate</text>
  
  <rect x="380" y="450" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5" ry="5"/>
  <text x="420" y="475" font-family="Arial" font-size="16" text-anchor="middle">OHCU</text>
  
  <rect x="240" y="450" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5" ry="5"/>
  <text x="280" y="475" font-family="Arial" font-size="16" text-anchor="middle">Allantoin</text>
  
  <!-- Reaction arrows -->
  <line x1="180" y1="170" x2="240" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="170" x2="380" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="170" x2="520" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="190" x2="560" y2="250" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="290" x2="560" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="470" x2="460" y2="470" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="470" x2="320" y2="470" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Enzymes -->
  <ellipse cx="210" cy="140" rx="50" ry="22" fill="#FFFF99" stroke="black" stroke-width="1.5"/>
  <text x="210" y="138" font-family="Arial" font-size="13" text-anchor="middle">Nt5c/Nt5c1a/</text>
  <text x="210" y="152" font-family="Arial" font-size="13" text-anchor="middle">Nt5c2</text>
  
  <ellipse cx="350" cy="140" rx="40" ry="20" fill="#FFFF99" stroke="black" stroke-width="1.5"/>
  <text x="350" y="145" font-family="Arial" font-size="15" text-anchor="middle">Pnp</text>
  
  <ellipse cx="490" cy="140" rx="40" ry="20" fill="#FFFF99" stroke="black" stroke-width="1.5"/>
  <text x="490" y="145" font-family="Arial" font-size="15" text-anchor="middle">Gda</text>
  
  <ellipse cx="580" cy="220" rx="40" ry="20" fill="#FFFF99" stroke="black" stroke-width="1.5"/>
  <text x="580" y="225" font-family="Arial" font-size="15" text-anchor="middle">Xdh</text>
  
  <ellipse cx="580" cy="430" rx="40" ry="20" fill="#FFFF99" stroke="black" stroke-width="1.5"/>
  <text x="580" y="435" font-family="Arial" font-size="15" text-anchor="middle">Uox</text>
  
  <ellipse cx="490" cy="430" rx="40" ry="20" fill="#FFFF99" stroke="black" stroke-width="1.5"/>
  <text x="490" y="435" font-family="Arial" font-size="15" text-anchor="middle">Urah</text>
  
  <ellipse cx="350" cy="430" rx="40" ry="20" fill="#FFFF99" stroke="black" stroke-width="1.5"/>
  <text x="350" y="435" font-family="Arial" font-size="15" text-anchor="middle">Urad</text>
  
  <ellipse cx="280" cy="220" rx="40" ry="20" fill="#FFFF99" stroke="black" stroke-width="1.5" opacity="0.6"/>
  <text x="280" y="225" font-family="Arial" font-size="15" text-anchor="middle" font-style="italic">Dnph1*</text>
  <line x1="280" y1="170" x2="280" y2="200" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- Annotations -->
  <text x="160" y="200" font-family="Arial" font-size="11" fill="#666666">5'-nucleotidase</text>
  <text x="350" y="115" font-family="Arial" font-size="11" fill="#666666">purine-nucleoside phosphorylase</text>
  <text x="490" y="115" font-family="Arial" font-size="11" fill="#666666">guanine deaminase</text>
  <text x="615" y="220" font-family="Arial" font-size="11" fill="#666666">xanthine oxidase/</text>
  <text x="615" y="235" font-family="Arial" font-size="11" fill="#666666">dehydrogenase</text>
  <text x="615" y="435" font-family="Arial" font-size="11" fill="#666666">urate oxidase</text>
  <text x="420" y="405" font-family="Arial" font-size="11" fill="#666666">hydroxyisourate hydrolase</text>
  <text x="315" y="405" font-family="Arial" font-size="11" fill="#666666">OHCU decarboxylase</text>
  
  <!-- Legend -->
  <rect x="600" y="100" width="140" height="140" fill="white" stroke="black" stroke-width="1" rx="5" ry="5"/>
  <text x="670" y="120" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
  
  <rect x="610" y="130" width="20" height="15" fill="white" stroke="black" stroke-width="1"/>
  <text x="655" y="142" font-family="Arial" font-size="14">Metabolite</text>
  
  <ellipse cx="620" cy="165" rx="10" ry="7" fill="#FFFF99" stroke="black" stroke-width="1"/>
  <text x="655" y="168" font-family="Arial" font-size="14">Enzyme</text>
  
  <ellipse cx="620" cy="185" rx="10" ry="7" fill="#FFFF99" stroke="black" stroke-width="1" opacity="0.6"/>
  <text x="675" y="188" font-family="Arial" font-size="14" font-style="italic">Not in source data</text>
  
  <line x1="610" y1="205" x2="630" y2="205" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="670" y="210" font-family="Arial" font-size="14">Reaction</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">dGMP Catabolic Process to Allantoin (Mouse)</text>
  
  <!-- Note about OHCU -->
  <text x="380" y="490" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">OHCU = 2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline</text>
</svg>