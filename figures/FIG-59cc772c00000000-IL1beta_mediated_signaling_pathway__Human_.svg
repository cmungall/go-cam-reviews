<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and cell components -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9"/>
  
  <!-- Extracellular space -->
  <rect x="0" y="0" width="800" height="150" fill="#e6f7ff" opacity="0.5"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold">Extracellular Region</text>
  
  <!-- Plasma membrane -->
  <rect x="0" y="150" width="800" height="30" fill="#a8dadc" stroke="#457b9d" stroke-width="1"/>
  <text x="20" y="170" font-family="Arial" font-size="16" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytoplasm -->
  <rect x="0" y="180" width="800" height="420" fill="#f1faee" opacity="0.5"/>
  <text x="20" y="200" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm</text>
  
  <!-- Cytosol region -->
  <rect x="50" y="220" width="200" height="150" fill="#e5e5e5" rx="10" ry="10" opacity="0.5" stroke="#888" stroke-width="1" stroke-dasharray="5,2"/>
  <text x="80" y="240" font-family="Arial" font-size="16" font-weight="bold">Cytosol</text>
  
  <!-- IL1B Cytokine -->
  <circle cx="300" cy="80" r="30" fill="#ff9e9e" stroke="#e63946" stroke-width="2"/>
  <text x="300" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">IL1B</text>
  <text x="300" y="95" font-family="Arial" font-size="11" text-anchor="middle">(P01584)</text>
  <text x="300" y="110" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" font-weight="bold">cytokine activity</text>
  
  <!-- CASP1 -->
  <rect x="100" y="280" width="100" height="40" rx="5" ry="5" fill="#ffd166" stroke="#e76f51" stroke-width="2"/>
  <text x="150" y="295" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">CASP1</text>
  <text x="150" y="310" font-family="Arial" font-size="11" text-anchor="middle">(P29466)</text>
  <text x="150" y="325" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" font-weight="bold">endopeptidase activity</text>
  
  <!-- IL1R1 Receptor -->
  <rect x="280" y="130" width="80" height="40" rx="5" ry="5" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
  <text x="320" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">IL1R1</text>
  <text x="320" y="160" font-family="Arial" font-size="11" text-anchor="middle">(P14778)</text>
  <text x="320" y="175" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" font-weight="bold">receptor activity</text>
  
  <!-- IL1RAP Co-receptor -->
  <rect x="370" y="130" width="80" height="40" rx="5" ry="5" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
  <text x="410" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">IL1RAP</text>
  <text x="410" y="160" font-family="Arial" font-size="11" text-anchor="middle">(Q9NPH3)</text>
  <text x="410" y="175" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" font-weight="bold">coreceptor activity</text>
  
  <!-- TOLLIP -->
  <polygon points="350,220 380,200 410,220 380,240" fill="#b5e48c" stroke="#588157" stroke-width="2"/>
  <text x="380" y="215" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">TOLLIP</text>
  <text x="380" y="230" font-family="Arial" font-size="11" text-anchor="middle">(Q9H0E2)</text>
  <text x="380" y="245" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" font-weight="bold">adaptor activity</text>
  
  <!-- MYD88 -->
  <polygon points="450,220 480,200 510,220 480,240" fill="#b5e48c" stroke="#588157" stroke-width="2"/>
  <text x="480" y="215" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">MYD88</text>
  <text x="480" y="230" font-family="Arial" font-size="11" text-anchor="middle">(Q99836)</text>
  <text x="480" y="245" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" font-weight="bold">adaptor activity</text>
  
  <!-- IRAK4 -->
  <ellipse cx="580" cy="250" rx="40" ry="30" fill="#b392ac" stroke="#6d597a" stroke-width="2"/>
  <text x="580" y="245" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">IRAK4</text>
  <text x="580" y="260" font-family="Arial" font-size="11" text-anchor="middle">(Q9NWZ3)</text>
  <text x="580" y="275" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" font-weight="bold">kinase activity</text>
  
  <!-- IRAK1 -->
  <ellipse cx="580" cy="350" rx="40" ry="30" fill="#b392ac" stroke="#6d597a" stroke-width="2"/>
  <text x="580" y="345" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">IRAK1</text>
  <text x="580" y="360" font-family="Arial" font-size="11" text-anchor="middle">(P51617)</text>
  <text x="580" y="375" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" font-weight="bold">kinase activity</text>
  
  <!-- MAP3K7 -->
  <ellipse cx="580" cy="450" rx="40" ry="30" fill="#b392ac" stroke="#6d597a" stroke-width="2"/>
  <text x="580" y="445" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">MAP3K7</text>
  <text x="580" y="460" font-family="Arial" font-size="11" text-anchor="middle">(O43318)</text>
  <text x="580" y="475" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" font-weight="bold">kinase activity</text>
  
  <!-- Activation arrows -->
  <!-- CASP1 to IL1B -->
  <path d="M180,270 Q250,170 280,110" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="190" font-family="Arial" font-size="12" font-weight="bold" fill="#333" transform="rotate(-30, 220, 190)">activates</text>
  
  <!-- IL1B to IL1R1 -->
  <path d="M300,110 L320,130" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="290" y="125" font-family="Arial" font-size="12" font-weight="bold" fill="#333">binds</text>
  
  <!-- IL1R1 to IL1RAP -->
  <path d="M360,150 L370,150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="365" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="#333">associates</text>
  
  <!-- Receptor complex to TOLLIP -->
  <path d="M370,170 L370,200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="345" y="190" font-family="Arial" font-size="12" font-weight="bold" fill="#333">activates</text>
  
  <!-- Receptor complex to MYD88 -->
  <path d="M450,170 Q465,180 470,200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="430" y="190" font-family="Arial" font-size="12" font-weight="bold" fill="#333">activates</text>
  
  <!-- MYD88 to IRAK4 -->
  <path d="M510,220 Q540,230 550,240" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="520" y="220" font-family="Arial" font-size="12" font-weight="bold" fill="#333">activates</text>
  
  <!-- IRAK4 to IRAK1 -->
  <path d="M580,280 L580,320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="590" y="305" font-family="Arial" font-size="12" font-weight="bold" fill="#333">activates</text>
  
  <!-- IRAK1 to MAP3K7 -->
  <path d="M580,380 L580,420" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="590" y="405" font-family="Arial" font-size="12" font-weight="bold" fill="#333">activates</text>
  
  <!-- TOLLIP to IRAK1 -->
  <path d="M410,220 Q500,290 550,340" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="290" font-family="Arial" font-size="12" font-weight="bold" fill="#333">regulates</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="20" width="180" height="140" fill="white" stroke="#333" stroke-width="1"/>
  <text x="610" y="40" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="620" cy="60" r="10" fill="#ff9e9e" stroke="#e63946" stroke-width="2"/>
  <text x="635" y="65" font-family="Arial" font-size="12" font-weight="bold">Cytokine</text>
  
  <rect x="610" y="80" width="20" height="10" rx="2" ry="2" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
  <text x="635" y="90" font-family="Arial" font-size="12" font-weight="bold">Receptor</text>
  
  <polygon points="610,105 620,95 630,105 620,115" fill="#b5e48c" stroke="#588157" stroke-width="2"/>
  <text x="635" y="110" font-family="Arial" font-size="12" font-weight="bold">Adaptor</text>
  
  <ellipse cx="620" cy="130" rx="10" ry="8" fill="#b392ac" stroke="#6d597a" stroke-width="2"/>
  <text x="635" y="135" font-family="Arial" font-size="12" font-weight="bold">Kinase</text>
  
  <rect x="610" y="145" width="20" height="10" rx="2" ry="2" fill="#ffd166" stroke="#e76f51" stroke-width="2"/>
  <text x="635" y="155" font-family="Arial" font-size="12" font-weight="bold">Protease</text>
  
  <!-- Title -->
  <text x="400" y="570" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">IL1β-mediated Signaling Pathway (Human)</text>
  <text x="400" y="590" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" font-style="italic">Interleukin-1 signaling cascade from receptor binding to downstream kinase activation</text>
</svg>