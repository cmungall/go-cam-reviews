<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and cellular compartments -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" />
  
  <!-- Extracellular space -->
  <rect x="50" y="50" width="700" height="150" fill="#e6f7ff" rx="5" ry="5" stroke="#a0c8e0" stroke-width="2" />
  <text x="60" y="70" font-family="Arial" font-size="16" font-weight="bold" fill="#555">Extracellular Space (GO:0005615)</text>
  
  <!-- Plasma membrane -->
  <rect x="50" y="200" width="700" height="60" fill="#ffd591" rx="0" ry="0" stroke="#d9a45f" stroke-width="2" />
  <text x="60" y="220" font-family="Arial" font-size="16" font-weight="bold" fill="#555">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytoplasm -->
  <rect x="50" y="260" width="700" height="290" fill="#e6ffe6" rx="5" ry="5" stroke="#b3d9b3" stroke-width="2" />
  <text x="60" y="280" font-family="Arial" font-size="16" font-weight="bold" fill="#555">Cytoplasm (GO:0005737)</text>
  
  <!-- Cytosol region -->
  <rect x="150" y="320" width="500" height="200" fill="#f0fff0" rx="5" ry="5" stroke="#b3d9b3" stroke-dasharray="5,5" stroke-width="2" />
  <text x="160" y="340" font-family="Arial" font-size="16" font-weight="bold" fill="#555">Cytosol (GO:0005829)</text>
  
  <!-- Eiger (ligand) -->
  <circle cx="250" cy="130" r="35" fill="#ff9999" stroke="#cc0000" stroke-width="2.5" />
  <text x="250" y="130" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">Egr</text>
  <text x="250" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(FBgn0033483)</text>
  
  <!-- Grindelwald (receptor) -->
  <rect x="220" y="200" width="60" height="80" fill="#ff99cc" stroke="#cc0066" stroke-width="2.5" />
  <text x="250" y="235" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">Grnd</text>
  <text x="250" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(FBgn0032682)</text>
  
  <!-- Traf6 -->
  <polygon points="250,300 280,325 250,350 220,325" fill="#99ccff" stroke="#0066cc" stroke-width="2.5" />
  <text x="250" y="330" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">Traf6</text>
  <text x="250" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(FBgn0265464)</text>
  
  <!-- Tab2 -->
  <rect x="330" y="370" width="70" height="45" fill="#cccc99" stroke="#999966" stroke-width="2.5" />
  <text x="365" y="395" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">Tab2</text>
  <text x="365" y="410" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(FBgn0086358)</text>
  
  <!-- Msn -->
  <ellipse cx="490" cy="350" rx="40" ry="25" fill="#cc99ff" stroke="#6600cc" stroke-width="2.5" />
  <text x="490" y="355" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">Msn</text>
  <text x="490" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(FBgn0010909)</text>
  
  <!-- Tak1 -->
  <ellipse cx="450" cy="430" rx="40" ry="25" fill="#cc99ff" stroke="#6600cc" stroke-width="2.5" />
  <text x="450" y="435" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">Tak1</text>
  <text x="450" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(FBgn0026323)</text>
  
  <!-- Hep -->
  <ellipse cx="490" cy="480" rx="40" ry="25" fill="#cc99ff" stroke="#6600cc" stroke-width="2.5" />
  <text x="490" y="485" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">Hep</text>
  <text x="490" y="505" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(FBgn0010303)</text>
  
  <!-- Bsk -->
  <ellipse cx="550" cy="510" rx="40" ry="25" fill="#cc99ff" stroke="#6600cc" stroke-width="2.5" />
  <text x="550" y="515" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">Bsk</text>
  <text x="550" y="535" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(FBgn0000229)</text>
  
  <!-- Connection arrows - all consistent thickness -->
  <!-- Eiger to Grindelwald -->
  <line x1="250" y1="165" x2="250" y2="200" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- Grindelwald to Traf6 -->
  <line x1="250" y1="280" x2="250" y2="300" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- Traf6 to Tab2 -->
  <line x1="280" y1="325" x2="330" y2="370" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- Traf6 to Msn -->
  <line x1="280" y1="325" x2="450" y2="350" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- Tab2 to Tak1 -->
  <line x1="400" y1="395" x2="425" y2="415" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- Msn to Tak1 -->
  <line x1="490" y1="375" x2="470" y2="405" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- Tak1 to Hep -->
  <line x1="465" y1="455" x2="480" y2="465" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- Hep to Bsk -->
  <line x1="520" y1="490" x2="535" y2="500" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- Function annotations -->
  <text x="250" y="110" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" fill="#666">Receptor ligand activity</text>
  <text x="190" y="230" font-family="Arial" font-size="11" text-anchor="end" font-style="italic" fill="#666">TNF receptor</text>
  <text x="190" y="325" font-family="Arial" font-size="11" text-anchor="end" font-style="italic" fill="#666">TNF receptor binding</text>
  <text x="310" y="385" font-family="Arial" font-size="11" text-anchor="end" font-style="italic" fill="#666">Signaling adaptor</text>
  <text x="440" y="335" font-family="Arial" font-size="11" text-anchor="end" font-style="italic" fill="#666">JNKKKK activity</text>
  <text x="400" y="445" font-family="Arial" font-size="11" text-anchor="end" font-style="italic" fill="#666">JNKKK activity</text>
  <text x="440" y="485" font-family="Arial" font-size="11" text-anchor="end" font-style="italic" fill="#666">JNK kinase activity</text>
  <text x="500" y="525" font-family="Arial" font-size="11" text-anchor="end" font-style="italic" fill="#666">JNK activity</text>
  
  <!-- Legend with activities -->
  <rect x="580" y="50" width="160" height="180" fill="white" stroke="#999" stroke-width="1.5" />
  <text x="590" y="70" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend</text>
  <circle cx="600" cy="90" r="7" fill="#ff9999" />
  <text x="615" y="94" font-family="Arial" font-size="12" fill="#333">Receptor ligand activity</text>
  <rect x="593" y="105" width="14" height="14" fill="#ff99cc" />
  <text x="615" y="114" font-family="Arial" font-size="12" fill="#333">TNF receptor activity</text>
  <polygon points="593,130 607,130 600,144" fill="#99ccff" />
  <text x="615" y="138" font-family="Arial" font-size="12" fill="#333">TNF receptor binding</text>
  <rect x="593" y="155" width="14" height="14" fill="#cccc99" />
  <text x="615" y="164" font-family="Arial" font-size="12" fill="#333">Signaling adaptor</text>
  <ellipse cx="600" cy="185" rx="7" ry="7" fill="#cc99ff" />
  <text x="615" y="189" font-family="Arial" font-size="12" fill="#333">Kinase activity</text>
  
  <!-- Pathway Name -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Tumor Necrosis Factor-Mediated Signaling Pathway via Grnd-Egr (D. melanogaster)</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
</svg>