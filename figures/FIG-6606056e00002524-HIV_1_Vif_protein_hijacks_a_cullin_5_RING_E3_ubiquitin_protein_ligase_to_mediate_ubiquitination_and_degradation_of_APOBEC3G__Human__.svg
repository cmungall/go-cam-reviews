<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background representing Host Cell -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f0f9ff" stroke="#aad4f0" stroke-width="2"/>
  <text x="400" y="580" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Host Cell Cytoplasm</text>
  
  <!-- Section 1: Neddylation Process -->
  <rect x="100" y="100" width="200" height="120" rx="10" ry="10" fill="#e6ffe6" stroke="#90c490" stroke-width="2"/>
  <text x="200" y="130" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Protein Neddylation</text>
  
  <circle cx="150" cy="170" r="25" fill="#c9e1f9" stroke="#4a86e8" stroke-width="2"/>
  <text x="150" y="175" text-anchor="middle" font-family="Arial" font-size="12">UBE2F</text>
  
  <circle cx="250" cy="170" r="25" fill="#c9e1f9" stroke="#4a86e8" stroke-width="2"/>
  <text x="250" y="175" text-anchor="middle" font-family="Arial" font-size="12">RNF7</text>
  
  <path d="M175 170 L225 170" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="200" y="160" text-anchor="middle" font-family="Arial" font-size="10">NEDD8 transfer</text>
  
  <!-- Section 2: E3 Ligase Complex Formation -->
  <rect x="350" y="100" width="350" height="180" rx="10" ry="10" fill="#fff0e6" stroke="#e6b8af" stroke-width="2"/>
  <text x="525" y="130" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">E3 Ligase Complex</text>
  
  <rect x="400" y="150" width="70" height="40" rx="5" ry="5" fill="#ffcccc" stroke="#cc0000" stroke-width="2"/>
  <text x="435" y="175" text-anchor="middle" font-family="Arial" font-size="12">CUL5</text>
  
  <circle cx="520" cy="170" r="25" fill="#f9c9c9" stroke="#e06666" stroke-width="2"/>
  <text x="520" y="175" text-anchor="middle" font-family="Arial" font-size="12">RNF7</text>
  
  <circle cx="600" cy="170" r="25" fill="#f9d9c9" stroke="#e69138" stroke-width="2"/>
  <text x="600" y="175" text-anchor="middle" font-family="Arial" font-size="12">ARIH2</text>
  
  <path d="M300 170 L380 170" stroke="#90c490" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="340" y="160" text-anchor="middle" font-family="Arial" font-size="10">Neddylation</text>
  
  <circle cx="435" cy="230" r="25" fill="#d2bdff" stroke="#8e7cc3" stroke-width="2"/>
  <text x="435" y="235" text-anchor="middle" font-family="Arial" font-size="12">HIV-1 Vif</text>
  
  <path d="M435 190 L435 205" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="465" y="200" text-anchor="middle" font-family="Arial" font-size="10">adaptor</text>
  
  <!-- Section 3: Target Protein -->
  <rect x="150" y="320" width="160" height="100" rx="10" ry="10" fill="#e6f9ff" stroke="#76a5af" stroke-width="2"/>
  <text x="230" y="345" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Host Defense</text>
  
  <circle cx="230" cy="380" r="30" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="230" y="385" text-anchor="middle" font-family="Arial" font-size="12">APOBEC3G</text>
  
  <path d="M435 255 L320 340" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="280" text-anchor="middle" font-family="Arial" font-size="10">targets</text>
  
  <!-- Section 4: Ubiquitination and Degradation -->
  <rect x="400" y="320" width="250" height="150" rx="10" ry="10" fill="#ffe6e6" stroke="#cc4125" stroke-width="2"/>
  <text x="525" y="345" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Ubiquitination &amp; Degradation</text>
  
  <circle cx="450" cy="380" r="30" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="450" y="385" text-anchor="middle" font-family="Arial" font-size="12">APOBEC3G</text>
  
  <path d="M260 380 L390 380" stroke="#e69138" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="370" text-anchor="middle" font-family="Arial" font-size="10">recruitment</text>
  
  <circle cx="520" cy="380" r="30" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="520" y="373" text-anchor="middle" font-family="Arial" font-size="10">APOBEC3G</text>
  <text x="520" y="383" text-anchor="middle" font-family="Arial" font-size="8">Ub</text>
  <text x="520" y="393" text-anchor="middle" font-family="Arial" font-size="8">Ub</text>
  
  <path d="M480 380 L490 380" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="485" y="370" text-anchor="middle" font-family="Arial" font-size="10">E3 ligase</text>
  
  <rect x="580" y="360" width="40" height="40" fill="#cccccc" stroke="#666666" stroke-width="2"/>
  <text x="600" y="385" text-anchor="middle" font-family="Arial" font-size="12">26S</text>
  
  <path d="M550 380 L580 380" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="565" y="370" text-anchor="middle" font-family="Arial" font-size="10">to proteasome</text>
  
  <path d="M600 400 L600 430" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="600" y="450" text-anchor="middle" font-family="Arial" font-size="10">degradation</text>
  
  <!-- Connection between E3 Ligase Complex and Ubiquitination -->
  <path d="M520 195 L520 290" stroke="#e06666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="540" y="240" text-anchor="start" font-family="Arial" font-size="10">RNF7 activity</text>
  
  <path d="M600 195 L570 320" stroke="#e69138" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="610" y="240" text-anchor="start" font-family="Arial" font-size="10">ARIH2 activity</text>
  
  <!-- Viral infection indicator -->
  <path d="M50 50 L80 20" stroke="#ff0000" stroke-width="2"/>
  <circle cx="90" cy="15" r="15" fill="#ff9999" stroke="#ff0000" stroke-width="2"/>
  <text x="90" y="19" text-anchor="middle" font-family="Arial" font-size="10">HIV-1</text>
  
  <!-- Additional information box -->
  <rect x="100" y="450" width="210" height="80" rx="5" ry="5" fill="#ffffff" stroke="#666666" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="205" y="470" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Normal Function of APOBEC3G:</text>
  <text x="205" y="490" text-anchor="middle" font-family="Arial" font-size="10">Cytidine deaminase activity</text>
  <text x="205" y="510" text-anchor="middle" font-family="Arial" font-size="10">Part of innate immune response</text>
  <text x="205" y="525" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">(Suppressed by HIV-1 Vif)</text>
  
  <!-- Legend -->
  <rect x="400" y="450" width="250" height="80" rx="5" ry="5" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <text x="525" y="470" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
  
  <rect x="410" y="480" width="10" height="10" fill="#c9e1f9" stroke="#4a86e8" stroke-width="1"/>
  <text x="505" y="490" text-anchor="middle" font-family="Arial" font-size="10">Neddylation machinery</text>
  
  <rect x="410" y="500" width="10" height="10" fill="#d2bdff" stroke="#8e7cc3" stroke-width="1"/>
  <text x="505" y="510" text-anchor="middle" font-family="Arial" font-size="10">Viral components</text>
  
  <rect x="410" y="520" width="10" height="10" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1"/>
  <text x="505" y="530" text-anchor="middle" font-family="Arial" font-size="10">Host defense proteins</text>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">HIV-1 Vif-mediated Degradation of APOBEC3G</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>
</svg>