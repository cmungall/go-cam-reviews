<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">SARS-CoV-2 Viral Lifecycle</text>
  
  <!-- Host Cell Outline -->
  <path d="M100,100 Q400,50 700,100 Q750,300 700,500 Q400,550 100,500 Q50,300 100,100" 
        fill="#f8f8ff" stroke="#666" stroke-width="3"/>
  
  <!-- Cell Compartments -->
  <!-- Cytoplasm label -->
  <text x="400" y="140" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Cytoplasm</text>
  
  <!-- Endosome -->
  <ellipse cx="240" cy="220" rx="70" ry="45" fill="#e1d5e7" stroke="#9673a6" stroke-width="2.5"/>
  <text x="240" y="225" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Endosome</text>
  
  <!-- Endoplasmic Reticulum -->
  <path d="M150,320 Q300,340 450,320 Q500,370 450,420 Q300,440 150,420 Q100,370 150,320" 
        fill="#dae8fc" stroke="#6c8ebf" stroke-width="2.5"/>
  <text x="300" y="375" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ER</text>
  
  <!-- ERGIC -->
  <path d="M450,260 Q550,280 650,260 Q680,310 650,360 Q550,380 450,360 Q420,310 450,260" 
        fill="#d5e8d4" stroke="#82b366" stroke-width="2.5"/>
  <text x="550" y="315" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ERGIC</text>
  
  <!-- DMV (Double Membrane Vesicle) -->
  <ellipse cx="300" cy="480" rx="80" ry="55" fill="#ffe6cc" stroke="#d79b00" stroke-width="2.5"/>
  <ellipse cx="300" cy="480" rx="65" ry="40" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="300" y="485" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">DMV</text>
  
  <!-- 1. VIRUS ENTRY SECTION -->
  <!-- Virus approaching cell -->
  <circle cx="80" cy="150" r="18" fill="#ff9999" stroke="#cc0000" stroke-width="3"/>
  <path d="M74,150 L86,150 M80,144 L80,156" stroke="#ffffff" stroke-width="2.5"/>
  <text x="80" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">SARS-CoV-2</text>
  
  <!-- ACE2 Receptor -->
  <rect x="130" y="140" width="70" height="25" rx="8" ry="8" fill="#ffffcc" stroke="#d6b656" stroke-width="2.5"/>
  <text x="165" y="158" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ACE2</text>
  
  <!-- Binding Arrow -->
  <path d="M100,150 L130,150" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="115" y="140" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Binding</text>
  
  <!-- TMPRSS2 -->
  <rect x="130" y="100" width="80" height="25" rx="8" ry="8" fill="#ccffcc" stroke="#6aa84f" stroke-width="2.5"/>
  <text x="170" y="118" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TMPRSS2</text>
  <path d="M170,125 L170,140" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Furin -->
  <rect x="40" y="100" width="60" height="25" rx="8" ry="8" fill="#d9ead3" stroke="#6aa84f" stroke-width="2.5"/>
  <text x="70" y="118" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">FURIN</text>
  <path d="M70,125 L70,150" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Endocytosis Arrow -->
  <path d="M200,150 Q220,180 240,200" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Endocytosis</text>
  
  <!-- 2. MEMBRANE FUSION -->
  <!-- Fusion arrow from endosome -->
  <path d="M240,265 Q270,300 300,320" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="290" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">S2 Fusion</text>
  
  <!-- 3. TRANSLATION SECTION -->
  <path d="M320,320 L370,320" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Translation</text>
  
  <!-- Polyprotein -->
  <rect x="370" y="305" width="120" height="30" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2.5"/>
  <text x="430" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Polyproteins</text>
  
  <!-- Proteolysis -->
  <path d="M490,320 L540,320" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Proteolysis</text>
  
  <!-- NSPs -->
  <rect x="540" y="305" width="120" height="30" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2.5"/>
  <text x="600" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">nsps (3-16)</text>
  
  <!-- 4. REPLICATION COMPLEX -->
  <path d="M550,335 Q450,400 350,480" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="410" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">DMV Formation</text>
  
  <!-- Replication Process -->
  <rect x="265" y="445" width="70" height="25" rx="5" ry="5" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="300" y="463" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">RNA Replication</text>
  
  <!-- Key Replication Proteins (now in a clearer layout) -->
  <rect x="235" y="475" width="40" height="20" rx="4" ry="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="255" y="490" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">nsp12</text>
  
  <rect x="285" y="475" width="40" height="20" rx="4" ry="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="305" y="490" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">nsp13</text>
  
  <rect x="235" y="500" width="40" height="20" rx="4" ry="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="255" y="515" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">nsp14</text>
  
  <rect x="285" y="500" width="40" height="20" rx="4" ry="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="305" y="515" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">nsp16</text>
  
  <!-- 5. ASSEMBLY SECTION -->
  <path d="M350,480 Q450,420 550,360" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="440" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Genomic RNA</text>
  
  <!-- Structural Proteins -->
  <rect x="550" y="200" width="140" height="25" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="620" y="218" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Structural Proteins</text>
  
  <!-- Individual structural proteins in clearer layout -->
  <rect x="530" y="230" width="30" height="20" rx="4" ry="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="545" y="245" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">S</text>
  
  <rect x="570" y="230" width="30" height="20" rx="4" ry="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="585" y="245" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">E</text>
  
  <rect x="610" y="230" width="30" height="20" rx="4" ry="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="625" y="245" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">M</text>
  
  <rect x="650" y="230" width="30" height="20" rx="4" ry="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="665" y="245" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">N</text>
  
  <!-- Assembly Arrow -->
  <path d="M600,250 L600,280" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="270" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Assembly</text>
  
  <!-- 6. NEW VIRION -->
  <circle cx="600" cy="340" r="18" fill="#ff9999" stroke="#cc0000" stroke-width="3"/>
  <path d="M594,340 L606,340 M600,334 L600,346" stroke="#ffffff" stroke-width="2.5"/>
  <text x="600" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">New Virion</text>
  
  <!-- Exocytosis -->
  <path d="M618,340 Q650,340 680,270" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Exocytosis</text>
  
  <!-- Released Virion -->
  <circle cx="700" cy="230" r="18" fill="#ff9999" stroke="#cc0000" stroke-width="3"/>
  <path d="M694,230 L706,230 M700,224 L700,236" stroke="#ffffff" stroke-width="2.5"/>
  <text x="700" y="260" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Released Virion</text>
  
  <!-- HOST FACTOR SECTION with clearer positioning -->
  <!-- CH25H pathway -->
  <rect x="350" y="140" width="70" height="25" rx="8" ry="8" fill="#ffcccc" stroke="#cc0000" stroke-width="2.5"/>
  <text x="385" y="158" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CH25H</text>
  
  <rect x="450" y="140" width="70" height="25" rx="8" ry="8" fill="#ffcccc" stroke="#cc0000" stroke-width="2.5"/>
  <text x="485" y="158" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ACAT1</text>
  
  <path d="M420,150 L450,150" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M485,165 Q400,200 240,220" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="380" y="200" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#cc0000">Inhibits Fusion</text>
  
  <!-- PAIP1 -->
  <rect x="450" y="200" width="70" height="25" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2.5"/>
  <text x="485" y="218" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PAIP1</text>
  <path d="M450,210 Q400,250 370,320" stroke="#009900" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="250" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#009900">Enhances Translation</text>
  
  <!-- Process Labels with Flow Numbers -->
  <circle cx="40" cy="150" r="14" fill="#333333" stroke="#000000" stroke-width="1.5"/>
  <text x="40" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">1</text>
  <text x="40" y="180" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Entry</text>
  
  <circle cx="200" cy="270" r="14" fill="#333333" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="275" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">2</text>
  <text x="200" y="295" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Fusion</text>
  
  <circle cx="360" cy="280" r="14" fill="#333333" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="285" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">3</text>
  <text x="360" y="305" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Translation</text>
  
  <circle cx="200" cy="480" r="14" fill="#333333" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="485" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">4</text>
  <text x="200" y="505" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Replication</text>
  
  <circle cx="500" cy="380" r="14" fill="#333333" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="385" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">5</text>
  <text x="500" y="405" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Assembly</text>
  
  <circle cx="650" cy="370" r="14" fill="#333333" stroke="#000000" stroke-width="1.5"/>
  <text x="650" y="375" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">6</text>
  <text x="650" y="395" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Release</text>
  
  <!-- Define arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
  </defs>
  
  <!-- Legend with clear spacing -->
  <rect x="620" y="420" width="170" height="170" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="705" y="445" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="630" y="455" width="20" height="20" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="715" y="470" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SARS-CoV-2 Virion</text>
  
  <rect x="630" y="485" width="20" height="20" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="715" y="500" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Viral Proteins</text>
  
  <rect x="630" y="515" width="20" height="20" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="715" y="530" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Non-structural Proteins</text>
  
  <rect x="630" y="545" width="20" height="20" fill="#ffffcc" stroke="#d6b656" stroke-width="2"/>
  <text x="715" y="560" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Host Receptors</text>
  
  <line x1="630" y1="575" x2="660" y2="575" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="715" y="580" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Inhibition</text>
</svg>