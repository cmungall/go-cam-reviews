<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  
  <!-- Plasma membrane -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="none" stroke="#333" stroke-width="3"/>
  <text x="680" y="300" font-family="Arial" font-size="16" fill="#333">Plasma membrane</text>
  <text x="680" y="320" font-family="Arial" font-size="14" font-style="italic" fill="#333">(GO:0005886)</text>
  
  <!-- Cytoplasm -->
  <text x="400" y="150" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Cytoplasm</text>
  <text x="400" y="170" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#333">(GO:0005737)</text>
  
  <!-- dsDNA in cytoplasm -->
  <path d="M 200,250 Q 215,240 230,250 Q 245,260 260,250 Q 275,240 290,250" fill="none" stroke="#1E88E5" stroke-width="4"/>
  <path d="M 200,270 Q 215,260 230,270 Q 245,280 260,270 Q 275,260 290,270" fill="none" stroke="#1E88E5" stroke-width="4"/>
  <text x="245" y="230" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Cytosolic dsDNA</text>
  
  <!-- AIM2 -->
  <rect x="300" y="240" width="80" height="40" rx="5" ry="5" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="340" y="265" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">AIM2</text>
  <text x="340" y="290" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">(MGI:MGI:2686159)</text>
  
  <!-- Arrow from dsDNA to AIM2 -->
  <path d="M 290,260 L 300,260" fill="none" stroke="#1E88E5" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="295" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">binds</text>
  <text x="295" y="240" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#333">(GO:0003690)</text>
  
  <!-- ASC/PYCARD -->
  <rect x="420" y="240" width="80" height="40" rx="5" ry="5" fill="#8BC34A" stroke="#333" stroke-width="2"/>
  <text x="460" y="265" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">ASC</text>
  <text x="460" y="280" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">(Pycard)</text>
  <text x="460" y="290" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">* Not in source</text>
  
  <!-- Arrow from AIM2 to ASC -->
  <path d="M 380,260 L 420,260" fill="none" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PRR activity</text>
  <text x="400" y="240" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#333">(GO:0038187)</text>
  
  <!-- Inflammasome complex -->
  <ellipse cx="400" cy="350" rx="100" ry="60" fill="#FFECB3" stroke="#E65100" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="330" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">AIM2 Inflammasome Complex</text>
  <text x="400" y="345" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">(GO:0140970)</text>
  
  <!-- Caspase-1 inactive -->
  <rect x="360" y="360" width="80" height="40" rx="5" ry="5" fill="#E1BEE7" stroke="#333" stroke-width="2"/>
  <text x="400" y="385" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Pro-Casp1</text>
  <text x="400" y="400" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">(MGI:MGI:96544)</text>
  
  <!-- Activation arrow for Caspase-1 -->
  <path d="M 380,400 C 380,430 420,430 420,400" fill="none" stroke="#8BC34A" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Activation</text>
  <text x="400" y="450" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#333">(GO:0140608)</text>
  
  <!-- Caspase-1 active -->
  <rect x="360" y="470" width="80" height="40" rx="5" ry="5" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="400" y="495" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Casp1</text>
  <text x="400" y="510" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="white">(Active)</text>
  
  <!-- Pro-Gasdermin D -->
  <rect x="500" y="470" width="80" height="40" rx="5" ry="5" fill="#E1BEE7" stroke="#333" stroke-width="2"/>
  <text x="540" y="495" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Pro-GSDMD</text>
  <text x="540" y="510" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333">(MGI:MGI:1916396)</text>
  
  <!-- Arrow from Caspase-1 to Gasdermin D -->
  <path d="M 440,490 L 500,490" fill="none" stroke="#9C27B0" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="470" y="480" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Cleaves</text>
  <text x="470" y="470" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#333">(GO:0004197)</text>
  
  <!-- Active Gasdermin D N-terminal domain -->
  <rect x="580" y="380" width="100" height="40" rx="5" ry="5" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="630" y="400" font-family="Arial" font-size="16" text-anchor="middle" fill="white">GSDMD-N</text>
  <text x="630" y="415" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="white">(Active)</text>
  
  <!-- Arrow showing cleavage -->
  <path d="M 540,470 C 540,440 630,440 630,420" fill="none" stroke="#9C27B0" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="600" y="435" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Maturation</text>
  <text x="600" y="445" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#333">(GO:0051604)</text>
  
  <!-- Gasdermin D pores in membrane -->
  <circle cx="600" cy="280" r="15" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <circle cx="600" cy="280" r="8" fill="white"/>
  <circle cx="640" cy="260" r="15" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <circle cx="640" cy="260" r="8" fill="white"/>
  <circle cx="680" cy="240" r="15" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <circle cx="680" cy="240" r="8" fill="white"/>
  
  <!-- Arrow from active GSDMD to pores -->
  <path d="M 630,380 C 630,350 630,320 620,300" fill="none" stroke="#9C27B0" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="645" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Forms pores</text>
  <text x="645" y="350" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#333">(GO:0022829)</text>
  
  <!-- PIP2 binding -->
  <path d="M 590,300 L 610,300" fill="none" stroke="#F44336" stroke-width="3"/>
  <text x="600" y="315" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">PIP2 binding</text>
  <text x="600" y="325" font-family="Arial" font-size="10" font-style="italic" text-anchor="middle" fill="#333">(GO:0005546)</text>
  
  <!-- Inflammatory response label -->
  <rect x="590" y="180" width="200" height="45" rx="5" ry="5" fill="white" fill-opacity="0.7" stroke="#F44336" stroke-width="2"/>
  <text x="660" y="200" font-family="Arial" font-size="16" fill="#F44336" font-weight="bold" text-anchor="middle">Pyroptotic</text>
  <text x="670" y="220" font-family="Arial" font-size="16" fill="#F44336" font-weight="bold" text-anchor="middle">Inflammatory Response</text>
  <text x="670" y="235" font-family="Arial" font-size="12" font-style="italic" fill="#F44336" text-anchor="middle">(GO:0050729)</text>
  
  <!-- Legend for processes -->
  <rect x="50" y="500" width="15" height="15" fill="#FF9800" stroke="#333" stroke-width="1"/>
  <text x="75" y="512" font-family="Arial" font-size="14" fill="#333">AIM2</text>
  
  <rect x="50" y="525" width="15" height="15" fill="#8BC34A" stroke="#333" stroke-width="1"/>
  <text x="75" y="537" font-family="Arial" font-size="14" fill="#333">ASC/PYCARD</text>
  
  <rect x="50" y="550" width="15" height="15" fill="#9C27B0" stroke="#333" stroke-width="1"/>
  <text x="75" y="562" font-family="Arial" font-size="14" fill="#333">Active enzymes</text>
  
  <rect x="200" y="500" width="15" height="15" fill="#E1BEE7" stroke="#333" stroke-width="1"/>
  <text x="225" y="512" font-family="Arial" font-size="14" fill="#333">Inactive precursors</text>
  
  <path d="M 200,525 L 215,525" stroke="#1E88E5" stroke-width="4"/>
  <text x="240" y="529" font-family="Arial" font-size="14" fill="#333">dsDNA</text>
  
  <circle cx="207" cy="550" r="7" fill="#9C27B0" stroke="#333" stroke-width="1"/>
  <circle cx="207" cy="550" r="4" fill="white"/>
  <text x="230" y="554" font-family="Arial" font-size="14" fill="#333">Membrane pore</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>