<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" />
  
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#ffffff" stroke="#aaaaaa" stroke-width="2" />
  
  <!-- Cytosol label -->
  <text x="70" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">Cytosol (GO:0005829)</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">Xylulose-5-Phosphate Biosynthetic Process (Mouse)</text>
  
  <!-- Canonical Glycolysis Box -->
  <rect x="100" y="100" width="250" height="200" rx="10" ry="10" fill="#e6f3ff" stroke="#4d94ff" stroke-width="2" stroke-dasharray="5,3" />
  <text x="225" y="120" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0066cc">Canonical Glycolysis (GO:0061621)</text>
  
  <!-- Xylulose-5-P Biosynthesis Box -->
  <rect x="380" y="100" width="350" height="350" rx="10" ry="10" fill="#fff2e6" stroke="#ff9933" stroke-width="2" stroke-dasharray="5,3" />
  <text x="555" y="120" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#cc6600">Xylulose-5-P Biosynthetic Process (GO:1901159)</text>
  
  <!-- Brief description under title -->
  <text x="400" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#666666">Enzymatic conversion from glycolysis intermediates to xylulose-5-phosphate via transketolase and transaldolase</text>
  
  <!-- Molecules and Enzymes -->
  <!-- Glycolysis pathway -->
  <circle cx="140" cy="180" r="30" fill="#d4f0d4" stroke="#2d862d" stroke-width="2" />
  <text x="140" y="180" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">Glycerone-P</text>
  <text x="140" y="192" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic" fill="#666666">CHEBI:57642</text>
  
  <circle cx="250" cy="180" r="30" fill="#d4f0d4" stroke="#2d862d" stroke-width="2" />
  <text x="250" y="174" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">D-Glyceraldehyde</text>
  <text x="250" y="186" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">3-phosphate</text>
  <text x="250" y="198" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic" fill="#666666">CHEBI:59776</text>
  
  <circle cx="140" cy="270" r="30" fill="#d4f0d4" stroke="#2d862d" stroke-width="2" />
  <text x="140" y="264" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">β-D-Fructofuranose</text>
  <text x="140" y="276" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">6-phosphate</text>
  <text x="140" y="288" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic" fill="#666666">CHEBI:57634</text>
  
  <!-- Xylulose pathway molecules -->
  <circle cx="480" cy="180" r="30" fill="#ffe6cc" stroke="#cc7a00" stroke-width="2" />
  <text x="480" y="174" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">D-Xylulose</text>
  <text x="480" y="186" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">5-phosphate</text>
  <text x="480" y="198" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic" fill="#666666">CHEBI:57737</text>
  
  <circle cx="580" cy="270" r="30" fill="#ffe6cc" stroke="#cc7a00" stroke-width="2" />
  <text x="580" y="264" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">D-Erythrose</text>
  <text x="580" y="276" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">4-phosphate</text>
  <text x="580" y="288" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic" fill="#666666">CHEBI:16897</text>
  
  <circle cx="480" cy="360" r="30" fill="#ffe6cc" stroke="#cc7a00" stroke-width="2" />
  <text x="480" y="354" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">Sedoheptulose</text>
  <text x="480" y="366" font-family="Arial" font-size="11" text-anchor="middle" fill="#000000">7-phosphate</text>
  <text x="480" y="378" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic" fill="#666666">CHEBI:15721</text>
  
  <!-- Enzymes with improved text placement -->
  <rect x="195" y="180" width="55" height="30" rx="5" ry="5" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="222" y="198" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#990000">Tpi1</text>
  
  <rect x="140" y="220" width="55" height="30" rx="5" ry="5" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="167" y="240" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#990000">Gpi1</text>
  
  <rect x="365" y="180" width="55" height="30" rx="5" ry="5" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="392" y="198" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#990000">Tkt</text>
  
  <rect x="530" y="315" width="55" height="30" rx="5" ry="5" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="557" y="335" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#990000">Taldo1</text>
  
  <!-- Enzyme labels with function -->
  <text x="222" y="157" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Triose-phosphate</text>
  <text x="222" y="169" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">isomerase</text>
  
  <text x="167" y="205" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Glucose-6-phosphate</text>
  <text x="167" y="217" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">isomerase</text>
  
  <text x="392" y="157" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Transketolase</text>
  <text x="392" y="169" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">(2C transfer)</text>
  
  <text x="557" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Transaldolase</text>
  <text x="557" y="312" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">(3C transfer)</text>
  
  <!-- Arrows -->
  <path d="M170 180 L185 180" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M250 210 L250 230 L140 230 L140 240" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M170 270 L280 270 L280 180 L315 180" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M280 180 L345 180" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M420 180 L450 180" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M480 210 L480 240 L580 240 L580 240" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M480 210 L480 330" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M580 300 L580 315 L557 315" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M480 390 L480 420 L580 420 L580 300" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M530 315 L500 315 L500 390" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="60" y="480" width="680" height="60" rx="5" ry="5" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" />
  <text x="70" y="495" font-family="Arial" font-size="12" font-weight="bold" fill="#333333">Legend:</text>
  
  <circle cx="90" cy="510" r="10" fill="#d4f0d4" stroke="#2d862d" stroke-width="2" />
  <text x="110" y="514" font-family="Arial" font-size="11" fill="#333333">Glycolysis metabolites</text>
  
  <circle cx="240" cy="510" r="10" fill="#ffe6cc" stroke="#cc7a00" stroke-width="2" />
  <text x="260" y="514" font-family="Arial" font-size="11" fill="#333333">Xylulose pathway metabolites</text>
  
  <rect x="400" y="505" width="25" height="15" rx="3" ry="3" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="435" y="514" font-family="Arial" font-size="11" fill="#333333">Enzymes</text>
  
  <line x1="480" y1="510" x2="520" y2="510" stroke="#666666" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="530" y="514" font-family="Arial" font-size="11" fill="#333333">Reaction direction</text>
  
  <rect x="580" y="505" width="25" height="15" rx="3" ry="3" fill="#fff2e6" stroke="#ff9933" stroke-width="2" stroke-dasharray="5,3" />
  <text x="615" y="514" font-family="Arial" font-size="11" fill="#333333">Cellular process</text>
</svg>