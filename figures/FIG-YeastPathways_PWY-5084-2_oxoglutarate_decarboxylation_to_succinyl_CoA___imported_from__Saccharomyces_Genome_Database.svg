<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Mitochondrion background -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f9e8d9" stroke="#8b4513" stroke-width="3" opacity="0.8"/>
  <text x="395" y="100" font-family="Arial" font-size="22" text-anchor="middle" fill="#8b4513" font-weight="bold">Mitochondrion</text>
  <text x="395" y="125" font-family="Arial" font-size="16" text-anchor="middle" fill="#8b4513">(GO:0005739)</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">2-Oxoglutarate Decarboxylation to Succinyl-CoA</text>
  <text x="400" y="80" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Saccharomyces cerevisiae</text>
  
  <!-- Reaction 1: KGD1 -->
  <rect x="150" y="250" width="120" height="60" rx="10" ry="10" fill="#b8e6c9" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="210" y="285" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">KGD1</text>
  <text x="210" y="305" font-family="Arial" font-size="12" text-anchor="middle">(SGD:S000001387)</text>
  
  <!-- Reaction 2: KGD2 -->
  <rect x="350" y="250" width="120" height="60" rx="10" ry="10" fill="#c9e1f9" stroke="#2171b5" stroke-width="2.5"/>
  <text x="410" y="285" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">KGD2</text>
  <text x="410" y="305" font-family="Arial" font-size="12" text-anchor="middle">(SGD:S000002555)</text>
  
  <!-- Reaction 3: LPD1 -->
  <rect x="550" y="250" width="120" height="60" rx="10" ry="10" fill="#fed9a6" stroke="#e6550d" stroke-width="2.5"/>
  <text x="610" y="285" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">LPD1</text>
  <text x="610" y="305" font-family="Arial" font-size="12" text-anchor="middle">(SGD:S000001876)</text>
  
  <!-- Substrates and Products -->
  <!-- 2-oxoglutarate -->
  <ellipse cx="80" y="280" rx="60" ry="30" fill="#d9edf7" stroke="#31708f" stroke-width="2"/>
  <text x="80" y="275" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">2-oxoglutarate</text>
  <text x="80" y="290" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:16810)</text>
  
  <!-- Intermediate (implied) -->
  <ellipse cx="280" y="280" rx="50" ry="25" fill="#fcf8e3" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="280" y="275" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Intermediate</text>
  <text x="280" y="290" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(implicit)</text>
  
  <!-- CoA -->
  <ellipse cx="350" y="380" rx="40" ry="25" fill="#d9edf7" stroke="#31708f" stroke-width="2"/>
  <text x="350" y="380" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CoA</text>
  <text x="350" y="395" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:57287)</text>
  
  <!-- Succinyl-CoA -->
  <ellipse cx="480" y="280" rx="60" ry="30" fill="#d9edf7" stroke="#31708f" stroke-width="2"/>
  <text x="480" y="275" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Succinyl-CoA</text>
  <text x="480" y="290" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:57292)</text>
  
  <!-- NAD+ -->
  <ellipse cx="550" y="380" rx="40" ry="25" fill="#d9edf7" stroke="#31708f" stroke-width="2"/>
  <text x="550" y="380" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">NAD+</text>
  <text x="550" y="395" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:57540)</text>
  
  <!-- NADH -->
  <ellipse cx="670" y="380" rx="40" ry="25" fill="#d9edf7" stroke="#31708f" stroke-width="2"/>
  <text x="670" y="380" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">NADH</text>
  <text x="670" y="395" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:57945)</text>
  
  <!-- CO2 -->
  <ellipse cx="215" y="180" rx="35" ry="25" fill="#d9edf7" stroke="#31708f" stroke-width="2"/>
  <text x="215" y="185" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CO₂</text>
  <text x="215" y="200" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:16526)</text>
  
  <!-- H+ -->
  <ellipse cx="150" y="180" rx="30" ry="20" fill="#d9edf7" stroke="#31708f" stroke-width="2"/>
  <text x="150" y="185" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">H+</text>
  <text x="150" y="200" font-family="Arial" font-size="10" text-anchor="middle">(CHEBI:15378)</text>
  
  <!-- Reaction arrows with enhanced visibility -->
  <!-- 2-oxoglutarate to KGD1 -->
  <line x1="140" y1="280" x2="150" y2="280" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- KGD1 to Intermediate -->
  <line x1="270" y1="280" x2="230" y2="280" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Intermediate to KGD2 -->
  <line x1="330" y1="280" x2="350" y2="280" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- CoA to KGD2 -->
  <line x1="350" y1="355" x2="350" y2="310" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- KGD2 to Succinyl-CoA -->
  <line x1="470" y1="280" x2="420" y2="280" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- NAD+ to LPD1 -->
  <line x1="550" y1="355" x2="550" y2="310" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- LPD1 to NADH -->
  <line x1="670" y1="355" x2="670" y2="310" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- KGD1 to CO2 + H+ -->
  <path d="M210 250 Q210 200 215 180" fill="none" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M180 250 Q160 220 150 180" fill="none" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Reaction step labels -->
  <rect x="105" y="220" width="70" height="25" rx="5" ry="5" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="140" y="237" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Step 1</text>
  
  <rect x="305" y="220" width="70" height="25" rx="5" ry="5" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="340" y="237" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Step 2</text>
  
  <rect x="505" y="220" width="70" height="25" rx="5" ry="5" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="540" y="237" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Step 3</text>
  
  <!-- Process label -->
  <rect x="260" y="430" width="280" height="30" rx="15" ry="15" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="400" y="450" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic">Cellular Respiration (GO:0045333)</text>
  
  <!-- Enzymatic functions with enhanced visibility -->
  <text x="210" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold" font-style="italic">Oxoglutarate dehydrogenase activity</text>
  <text x="210" y="240" font-family="Arial" font-size="9" text-anchor="middle" fill="#333" font-style="italic">(GO:0004591)</text>
  
  <text x="410" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold" font-style="italic">Dihydrolipoyllysine-residue</text>
  <text x="410" y="240" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold" font-style="italic">succinyltransferase activity</text>
  <text x="410" y="255" font-family="Arial" font-size="9" text-anchor="middle" fill="#333" font-style="italic">(GO:0004149)</text>
  
  <text x="610" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold" font-style="italic">Dihydrolipoyl dehydrogenase activity</text>
  <text x="610" y="240" font-family="Arial" font-size="9" text-anchor="middle" fill="#333" font-style="italic">(GO:0004148)</text>
  
  <!-- Causal flow with enhanced visibility -->
  <path d="M535 270 Q550 270 570 270" fill="none" stroke="#d62728" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#redArrowhead)"/>
  <path d="M335 270 Q350 270 370 270" fill="none" stroke="#d62728" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#redArrowhead)"/>
  
  <!-- Reaction annotations -->
  <rect x="140" y="320" width="140" height="45" rx="5" ry="5" fill="rgba(255,255,255,0.7)" stroke="#2e8b57" stroke-width="1"/>
  <text x="210" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Decarboxylation</text>
  <text x="210" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">Releases CO₂ + H+</text>
  
  <rect x="340" y="320" width="140" height="45" rx="5" ry="5" fill="rgba(255,255,255,0.7)" stroke="#2171b5" stroke-width="1"/>
  <text x="410" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">CoA Transfer</text>
  <text x="410" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">Forms Succinyl-CoA</text>
  
  <rect x="540" y="320" width="140" height="45" rx="5" ry="5" fill="rgba(255,255,255,0.7)" stroke="#e6550d" stroke-width="1"/>
  <text x="610" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">NAD+ Regeneration</text>
  <text x="610" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">Oxidation-Reduction</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <marker id="redArrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d62728"/>
    </marker>
  </defs>
</svg>