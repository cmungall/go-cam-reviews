<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="80" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#333">Cell membrane</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="90" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Cytoplasm (GO:0005737)</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="550" cy="300" rx="150" ry="100" fill="#FFDDDD" stroke="#D88" stroke-width="3"/>
  <ellipse cx="550" cy="300" rx="140" ry="90" fill="#FFEEEE" stroke="#D88" stroke-width="3"/>
  <text x="550" y="225" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Mitochondrion</text>
  <text x="550" y="250" font-family="Arial" font-size="18" font-style="italic" text-anchor="middle" fill="#333">Outer membrane (GO:0005741)</text>
  
  <!-- dsRNA -->
  <path d="M120,200 C140,180 140,160 120,140 C100,120 60,120 40,140 C20,160 20,180 40,200 C60,220 100,220 120,200 Z" fill="#AADDFF" stroke="#66AADD" stroke-width="3"/>
  <text x="80" y="170" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">dsRNA</text>
  <text x="80" y="190" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">(CHEBI:67208)</text>
  
  <!-- IFIH1 inactive -->
  <rect x="200" y="170" width="80" height="40" rx="10" ry="10" fill="#AAFFAA" stroke="#66AA66" stroke-width="3"/>
  <text x="240" y="192" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">IFIH1</text>
  <text x="240" y="208" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Q9BYX4</text>
  
  <!-- PPP1CA -->
  <rect x="200" y="300" width="80" height="40" rx="10" ry="10" fill="#FFFFAA" stroke="#DDDD66" stroke-width="3"/>
  <text x="240" y="322" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">PPP1CA</text>
  <text x="240" y="338" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">P62136</text>
  
  <!-- IFIH1 active -->
  <rect x="350" y="170" width="80" height="40" rx="10" ry="10" fill="#AAFFAA" stroke="#66AA66" stroke-width="3"/>
  <text x="390" y="192" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">IFIH1*</text>
  <text x="390" y="208" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Q9BYX4</text>
  
  <!-- ATP label -->
  <ellipse cx="390" cy="145" rx="25" ry="15" fill="#FFE6CC" stroke="#D79B00" stroke-width="2"/>
  <text x="390" y="150" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">ATP</text>
  
  <!-- MAVS -->
  <rect x="480" y="300" width="80" height="40" rx="10" ry="10" fill="#FFCCAA" stroke="#DD8866" stroke-width="3"/>
  <text x="520" y="322" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">MAVS</text>
  <text x="520" y="338" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Q7Z434</text>
  
  <!-- MAVS signaling -->
  <rect x="620" y="300" width="80" height="40" rx="10" ry="10" fill="#FFCCAA" stroke="#DD8866" stroke-width="3"/>
  <text x="660" y="322" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">MAVS*</text>
  <text x="660" y="338" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Q7Z434</text>
  
  <!-- Arrows -->
  <!-- dsRNA recognition by IFIH1 -->
  <path d="M120,170 L190,170" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="130" y="130" width="70" height="36" rx="5" ry="5" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1" fill-opacity="0.9"/>
  <text x="165" y="148" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Recognition</text>
  <text x="165" y="162" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#333">GO:0038187</text>
  
  <!-- IFIH1 activation of PPP1CA -->
  <path d="M240,210 L240,290" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="245" y="240" width="70" height="36" rx="5" ry="5" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1" fill-opacity="0.9"/>
  <text x="280" y="258" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Activates</text>
  <text x="280" y="272" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#333">RO:0002413</text>
  
  <!-- PPP1CA regulation of IFIH1 -->
  <path d="M280,320 C320,320 320,190 340,190" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="290" y="240" width="95" height="50" rx="5" ry="5" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1" fill-opacity="0.9"/>
  <text x="337" y="258" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Positively regulates</text>
  <text x="337" y="272" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#333">RO:0002629</text>
  <text x="337" y="286" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#333">Phosphatase activity</text>
  
  <!-- IFIH1 regulation of MAVS -->
  <path d="M430,190 C460,190 460,300 470,300" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="405" y="230" width="95" height="50" rx="5" ry="5" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1" fill-opacity="0.9"/>
  <text x="452" y="248" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Positively regulates</text>
  <text x="452" y="262" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#333">RO:0002629</text>
  <text x="452" y="276" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#333">Protein binding</text>
  
  <!-- MAVS oligomerization -->
  <path d="M560,320 L610,320" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="555" y="350" width="65" height="36" rx="5" ry="5" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1" fill-opacity="0.9"/>
  <text x="587" y="368" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Signaling</text>
  <text x="587" y="382" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#333">GO:0035591</text>
  
  <!-- Marker definitions -->
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L12,4 z" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="500" width="700" height="50" fill="#EEEEEE" stroke="#888" stroke-width="1"/>
  <text x="60" y="525" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Legend: </text>
  
  <rect x="140" y="515" width="20" height="15" fill="#AAFFAA" stroke="#66AA66" stroke-width="1"/>
  <text x="170" y="527" font-family="Arial" font-size="16" fill="#333">IFIH1</text>
  
  <rect x="220" y="515" width="20" height="15" fill="#FFFFAA" stroke="#DDDD66" stroke-width="1"/>
  <text x="250" y="527" font-family="Arial" font-size="16" fill="#333">PPP1CA</text>
  
  <rect x="320" y="515" width="20" height="15" fill="#FFCCAA" stroke="#DD8866" stroke-width="1"/>
  <text x="350" y="527" font-family="Arial" font-size="16" fill="#333">MAVS</text>
  
  <path d="M410,522 C415,517 415,512 410,507 C405,502 395,502 390,507 C385,512 385,517 390,522 C395,527 405,527 410,522 Z" fill="#AADDFF" stroke="#66AADD" stroke-width="1"/>
  <text x="430" y="527" font-family="Arial" font-size="16" fill="#333">dsRNA</text>
  
  <ellipse cx="480" cy="517" rx="15" ry="10" fill="#FFE6CC" stroke="#D79B00" stroke-width="1"/>
  <text x="505" y="527" font-family="Arial" font-size="16" fill="#333">ATP</text>
  
  <text x="575" y="527" font-family="Arial" font-size="16" fill="#333">* = activated form</text>
  
  <text x="60" y="545" font-family="Arial" font-size="14" font-style="italic" fill="#333">Arrow direction indicates regulation or activation. All components from the original GO-CAM model.</text>
</svg>