<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="600" rx="50" ry="50" fill="#f8f8f8" stroke="#666" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="650" cy="450" rx="120" ry="100" fill="#e6e6fa" stroke="#666" stroke-width="2"/>
  <text x="650" y="450" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold">Nucleus</text>
  
  <!-- Chromatin -->
  <path d="M600,400 Q620,380 640,400 Q660,420 680,400 Q700,380 720,400" fill="none" stroke="#8a2be2" stroke-width="3"/>
  <rect x="610" y="367" width="80" height="18" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
  <text x="650" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000" font-weight="bold">Chromatin</text>
  
  <!-- Plasma membrane -->
  <path d="M50,100 L750,100" stroke="#666" stroke-width="3" stroke-dasharray="5,3"/>
  <rect x="50" y="77" width="130" height="18" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
  <text x="115" y="90" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold">Plasma membrane</text>
  
  <!-- Cytoplasm label -->
  <rect x="150" y="137" width="90" height="18" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
  <text x="195" y="150" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold">Cytoplasm</text>
  
  <!-- Cytosol label -->
  <rect x="310" y="187" width="80" height="18" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
  <text x="350" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold">Cytosol</text>
  
  <!-- MDP and NAGK -->
  <circle cx="120" cy="80" r="15" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="120" y="83" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">MDP</text>
  <rect x="120" y="120" width="60" height="30" rx="5" ry="5" fill="#ccffcc" stroke="#339933" stroke-width="2"/>
  <text x="150" y="140" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">NAGK</text>
  <path d="M120,95 L120,120" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- NOD2 at the plasma membrane -->
  <rect x="200" y="75" width="60" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="230" y="95" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">NOD2</text>
  <path d="M180,80 L200,88" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- RIPK2 -->
  <rect x="200" y="150" width="60" height="30" rx="5" ry="5" fill="#99ccff" stroke="#3366cc" stroke-width="2"/>
  <text x="230" y="170" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">RIPK2</text>
  <path d="M230,105 L230,150" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- XIAP -->
  <rect x="300" y="150" width="60" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="330" y="170" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">XIAP</text>
  <path d="M260,165 L300,165" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Ubiquitination annotation -->
  <text x="370" y="165" font-family="Arial" font-size="10" text-anchor="start" fill="#666">K63-linked ubiquitination</text>
  
  <!-- RNF31 -->
  <rect x="300" y="220" width="60" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="330" y="240" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">RNF31</text>
  <path d="M330,180 L330,220" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Linear ubiquitination annotation -->
  <text x="370" y="220" font-family="Arial" font-size="10" text-anchor="start" fill="#666">Linear polyubiquitination</text>
  
  <!-- TAB2/TAB3 -->
  <rect x="400" y="220" width="60" height="30" rx="5" ry="5" fill="#ccffcc" stroke="#339933" stroke-width="2"/>
  <text x="430" y="235" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">TAB2/</text>
  <text x="430" y="245" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">TAB3</text>
  <path d="M360,235 L400,235" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Polyubiquitin binding annotation -->
  <text x="470" y="235" font-family="Arial" font-size="10" text-anchor="start" fill="#666">K63-polyUb binding</text>
  
  <!-- IKBKG -->
  <rect x="300" y="290" width="60" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="330" y="310" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">IKBKG</text>
  <path d="M330,250 L330,290" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- MAP3K7 -->
  <rect x="400" y="290" width="60" height="30" rx="5" ry="5" fill="#ff99cc" stroke="#cc3366" stroke-width="2"/>
  <text x="430" y="310" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">MAP3K7</text>
  <path d="M430,250 L430,290" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- NF-kB pathway -->
  <rect x="350" y="350" width="60" height="30" rx="5" ry="5" fill="#ff99cc" stroke="#cc3366" stroke-width="2"/>
  <text x="380" y="370" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">IKBKB</text>
  <path d="M380,320 L380,350" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="350" y="410" width="60" height="30" rx="5" ry="5" fill="#ccffcc" stroke="#339933" stroke-width="2"/>
  <text x="380" y="430" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">NFKBIA</text>
  <path d="M380,380 L380,410" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- NFKBIA sequestering annotation -->
  <text x="290" y="430" font-family="Arial" font-size="10" text-anchor="end" fill="#666">Sequestering</text>
  
  <rect x="450" y="410" width="60" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="470" y="425" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">NFKB1/</text>
  <text x="470" y="435" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">RELA</text>
  <path d="M410,425 L450,425" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <path d="M480,440 Q550,500 600,440" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="530" y="510" font-family="Arial" font-size="10" fill="#666">Nuclear translocation</text>
  
  <!-- Transcription factor annotation -->
  <text x="600" y="430" font-family="Arial" font-size="10" fill="#666">DNA binding</text>
  
  <!-- MAPK pathway -->
  <rect x="500" y="290" width="60" height="30" rx="5" ry="5" fill="#ff99cc" stroke="#cc3366" stroke-width="2"/>
  <text x="530" y="310" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">MAP2K6</text>
  <path d="M460,305 L500,305" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <rect x="500" y="350" width="60" height="30" rx="5" ry="5" fill="#ff99cc" stroke="#cc3366" stroke-width="2"/>
  <text x="530" y="365" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">MAPK11/</text>
  <text x="530" y="375" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">MAPK14</text>
  <path d="M530,320 L530,350" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- p38MAPK cascade annotation -->
  <text x="570" y="350" font-family="Arial" font-size="10" fill="#666">p38MAPK cascade</text>
  
  <!-- Legend -->
  <rect x="60" y="550" width="680" height="80" rx="10" ry="10" fill="white" stroke="#666" stroke-width="1"/>
  <text x="70" y="570" font-family="Arial" font-size="12" font-weight="bold">Legend:</text>
  
  <rect x="70" y="580" width="15" height="15" fill="#ffcc99" stroke="#ff6600" stroke-width="1"/>
  <text x="95" y="592" font-family="Arial" font-size="12">Receptors/Adaptors</text>
  
  <rect x="220" y="580" width="15" height="15" fill="#99ccff" stroke="#3366cc" stroke-width="1"/>
  <text x="245" y="592" font-family="Arial" font-size="12">Signaling proteins</text>
  
  <rect x="370" y="580" width="15" height="15" fill="#ff99cc" stroke="#cc3366" stroke-width="1"/>
  <text x="395" y="592" font-family="Arial" font-size="12">Kinases</text>
  
  <rect x="460" y="580" width="15" height="15" fill="#ccffcc" stroke="#339933" stroke-width="1"/>
  <text x="485" y="592" font-family="Arial" font-size="12">Regulatory proteins</text>
  
  <circle cx="550" cy="587" r="7" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="565" y="592" font-family="Arial" font-size="12">MDP</text>
  
  <text x="70" y="615" font-family="Arial" font-size="12" font-weight="bold">Pathway:</text>
  <text x="130" y="615" font-family="Arial" font-size="12">NOD2 signaling in response to MDP leading to NF-κB and p38MAPK activation</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
</svg>