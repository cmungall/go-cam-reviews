<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Cell outline (Distal convoluted tubule epithelial cell) -->
  <rect x="100" y="50" width="600" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Cell Label -->
  <text x="400" y="40" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Kidney Distal Convoluted Tubule Epithelial Cell</text>
  
  <!-- Apical and Basolateral membrane labels -->
  <text x="70" y="250" font-family="Arial" font-size="14" text-anchor="end" transform="rotate(-90, 70, 250)">Apical Membrane</text>
  <text x="730" y="250" font-family="Arial" font-size="14" text-anchor="start" transform="rotate(90, 730, 250)">Basolateral Membrane</text>
  
  <!-- Lumen and Interstitial space labels -->
  <text x="50" y="250" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Lumen</text>
  <text x="750" y="250" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Interstitial Space</text>
  
  <!-- Tight Junction -->
  <rect x="100" y="150" width="30" height="80" fill="#ffcc88" stroke="#333" stroke-width="2"/>
  <text x="115" y="200" font-family="Arial" font-size="10" text-anchor="middle" transform="rotate(-90, 115, 200)">Tight Junction</text>
  
  <!-- WNK4 at Tight Junction -->
  <circle cx="130" cy="180" r="25" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="130" y="184" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">WNK4</text>
  <text x="130" y="155" font-family="Arial" font-size="10" text-anchor="middle">Kinase</text>
  
  <!-- STK39 in cytoplasm -->
  <circle cx="280" cy="200" r="25" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="280" y="204" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">STK39</text>
  <text x="280" y="175" font-family="Arial" font-size="10" text-anchor="middle">Kinase</text>
  
  <!-- OXSR1 in cytoplasm -->
  <circle cx="280" cy="300" r="25" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="280" y="304" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">OXSR1</text>
  <text x="280" y="275" font-family="Arial" font-size="10" text-anchor="middle">Kinase</text>
  
  <!-- SLC12A3 at plasma membrane -->
  <rect x="100" y="400" width="50" height="80" rx="10" ry="10" fill="#99ff99" stroke="#333" stroke-width="2"/>
  <text x="125" y="430" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SLC12A3</text>
  <text x="125" y="450" font-family="Arial" font-size="10" text-anchor="middle">Na+:Cl-</text>
  <text x="125" y="465" font-family="Arial" font-size="10" text-anchor="middle">symporter</text>
  
  <!-- Cytoplasm Label -->
  <text x="400" y="350" font-family="Arial" font-size="16" text-anchor="middle" fill="#999999">Cytoplasm</text>
  
  <!-- Plasma Membrane Label -->
  <text x="400" y="530" font-family="Arial" font-size="14" text-anchor="middle" fill="#666666">Plasma Membrane</text>
  
  <!-- Arrows showing phosphorylation with process annotation -->
  <!-- WNK4 to STK39 -->
  <path d="M155 180 Q220 180 250 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="195" y="170" font-family="Arial" font-size="10" text-anchor="middle">phosphorylation</text>
  
  <!-- WNK4 to OXSR1 -->
  <path d="M155 190 Q220 240 250 300" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="195" y="240" font-family="Arial" font-size="10" text-anchor="middle">phosphorylation</text>
  
  <!-- STK39 to SLC12A3 -->
  <path d="M270 225 Q200 320 140 400" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="320" font-family="Arial" font-size="10" text-anchor="middle">phosphorylation</text>
  
  <!-- OXSR1 to SLC12A3 -->
  <path d="M255 310 Q200 360 140 400" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="190" y="375" font-family="Arial" font-size="10" text-anchor="middle">phosphorylation</text>
  
  <!-- Biological process bubble -->
  <ellipse cx="550" cy="250" rx="120" ry="40" fill="#ffffcc" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="550" y="255" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Renal Sodium Ion</text>
  <text x="550" y="275" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Absorption</text>
  
  <!-- Sodium and Chloride ions -->
  <circle cx="50" cy="420" r="10" fill="#3366ff" stroke="#333"/>
  <text x="50" y="424" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Na+</text>
  <circle cx="50" cy="450" r="10" fill="#66cc33" stroke="#333"/>
  <text x="50" y="454" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Cl-</text>
  <path d="M70 430 L90 430" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow head definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- P markers for phosphorylation -->
  <circle cx="260" cy="190" r="8" fill="#ff0000" stroke="#333"/>
  <text x="260" y="194" font-family="Arial" font-size="10" text-anchor="middle" fill="white" font-weight="bold">P</text>
  
  <circle cx="260" cy="290" r="8" fill="#ff0000" stroke="#333"/>
  <text x="260" y="294" font-family="Arial" font-size="10" text-anchor="middle" fill="white" font-weight="bold">P</text>
  
  <circle cx="150" cy="410" r="8" fill="#ff0000" stroke="#333"/>
  <text x="150" y="414" font-family="Arial" font-size="10" text-anchor="middle" fill="white" font-weight="bold">P</text>
  
  <!-- Functional effect annotation -->
  <text x="165" y="480" font-family="Arial" font-size="10" text-anchor="start">Increased Na+:Cl- </text>
  <text x="165" y="493" font-family="Arial" font-size="10" text-anchor="start">transport activity</text>
  <path d="M150 450 Q160 470 165 480" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,1"/>
  
  <!-- Title -->
  <text x="400" y="580" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Regulation of Ion Transport in the Distal Nephron by WNK4</text>
  
  <!-- Legend -->
  <rect x="150" y="595" width="500" height="50" rx="5" ry="5" fill="#f8f8f8" stroke="#333" stroke-width="1"/>
  
  <!-- Legend title -->
  <text x="400" y="610" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <!-- Kinases -->
  <circle cx="180" cy="625" r="8" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="195" y="629" font-family="Arial" font-size="10" text-anchor="start">WNK4</text>
  
  <circle cx="235" cy="625" r="8" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="250" y="629" font-family="Arial" font-size="10" text-anchor="start">OXSR1/STK39</text>
  
  <rect x="305" cy="620" width="16" height="10" rx="3" ry="3" fill="#99ff99" stroke="#333" stroke-width="1"/>
  <text x="330" y="629" font-family="Arial" font-size="10" text-anchor="start">SLC12A3</text>
  
  <circle cx="380" cy="625" r="5" fill="#ff0000" stroke="#333" stroke-width="1"/>
  <text x="380" y="627" font-family="Arial" font-size="7" text-anchor="middle" fill="white" font-weight="bold">P</text>
  <text x="395" y="629" font-family="Arial" font-size="10" text-anchor="start">Phosphorylation</text>
  
  <circle cx="475" cy="625" r="5" fill="#3366ff" stroke="#333" stroke-width="1"/>
  <text x="475" y="627" font-family="Arial" font-size="7" text-anchor="middle" fill="white" font-weight="bold">Na+</text>
  <circle cx="495" cy="625" r="5" fill="#66cc33" stroke="#333" stroke-width="1"/>
  <text x="495" y="627" font-family="Arial" font-size="7" text-anchor="middle" fill="white" font-weight="bold">Cl-</text>
  <text x="515" y="629" font-family="Arial" font-size="10" text-anchor="start">Ions</text>
  
  <rect x="550" cy="620" width="20" height="10" fill="#ffcc88" stroke="#333" stroke-width="1"/>
  <text x="580" y="629" font-family="Arial" font-size="10" text-anchor="start">Tight Junction</text>
</svg>