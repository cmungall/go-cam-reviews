<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#f8f8f8" />
  
  <!-- Cell outline -->
  <rect x="50" y="100" width="700" height="450" rx="50" ry="50" fill="#ffffff" stroke="#333333" stroke-width="2" />
  
  <!-- Cytosol label -->
  <text x="400" y="130" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">Cytosol</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="400" cy="350" rx="300" ry="150" fill="#ffe6cc" stroke="#333333" stroke-width="2" />
  <ellipse cx="400" cy="350" rx="270" ry="130" fill="#fff2e6" stroke="#333333" stroke-width="2" />
  
  <!-- Mitochondrion label -->
  <text x="400" y="215" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">Mitochondrion</text>
  
  <!-- Inner membrane label -->
  <text x="400" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Mitochondrial Inner Membrane</text>
  
  <!-- Cytosolic reactions -->
  <!-- SPBC36.06c (spo9) -->
  <rect x="150" y="160" width="120" height="40" rx="5" ry="5" fill="#d9ead3" stroke="#333333" stroke-width="1.5" />
  <text x="210" y="182" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">spo9</text>
  <text x="210" y="197" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">geranyltranstransferase</text>
  
  <!-- SPAC6F12.13c (fps1) -->
  <rect x="350" y="160" width="120" height="40" rx="5" ry="5" fill="#d9ead3" stroke="#333333" stroke-width="1.5" />
  <text x="410" y="182" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">fps1</text>
  <text x="410" y="197" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">geranyltranstransferase</text>
  
  <!-- Farnesyl diphosphate -->
  <ellipse cx="550" cy="180" rx="70" ry="25" fill="#c9daf8" stroke="#333333" stroke-width="1.5" />
  <text x="550" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Farnesyl diphosphate</text>
  
  <!-- Arrows between cytosol reactions -->
  <path d="M 270 180 L 350 180" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 470 180 L 480 180" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Mitochondrial reactions -->
  <!-- SPBPJ4664.01 (dps1) and SPAC19G12.12 (dlp1) -->
  <rect x="130" y="300" width="120" height="40" rx="5" ry="5" fill="#d9d2e9" stroke="#333333" stroke-width="1.5" />
  <text x="190" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">dps1/dlp1</text>
  <text x="190" y="335" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">decaprenyl-PP synthase</text>
  
  <!-- SPAC56F8.04c (ppt1) -->
  <rect x="290" y="300" width="120" height="40" rx="5" ry="5" fill="#d9d2e9" stroke="#333333" stroke-width="1.5" />
  <text x="350" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">ppt1</text>
  <text x="350" y="335" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">4-HB polyprenyltransferase</text>
  
  <!-- SPBC146.12 (coq6) -->
  <rect x="450" y="300" width="120" height="40" rx="5" ry="5" fill="#d9d2e9" stroke="#333333" stroke-width="1.5" />
  <text x="510" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">coq6</text>
  <text x="510" y="335" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">oxygenase</text>
  
  <!-- SPCC162.05 (coq3) -->
  <rect x="350" y="375" width="120" height="40" rx="5" ry="5" fill="#d9d2e9" stroke="#333333" stroke-width="1.5" />
  <text x="410" y="395" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">coq3</text>
  <text x="410" y="410" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">O-methyltransferase</text>
  
  <!-- SPCC4G3.04c (coq5) -->
  <rect x="230" y="375" width="120" height="40" rx="5" ry="5" fill="#d9d2e9" stroke="#333333" stroke-width="1.5" />
  <text x="290" y="395" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">coq5</text>
  <text x="290" y="410" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">C-methyltransferase</text>
  
  <!-- SPBC337.15c (coq7) -->
  <rect x="350" y="440" width="120" height="40" rx="5" ry="5" fill="#d9d2e9" stroke="#333333" stroke-width="1.5" />
  <text x="410" y="460" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">coq7</text>
  <text x="410" y="475" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">hydroxylase</text>
  
  <!-- SPAC1556.03 (azr1) -->
  <rect x="500" y="440" width="120" height="40" rx="5" ry="5" fill="#d9d2e9" stroke="#333333" stroke-width="1.5" />
  <text x="560" y="460" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">azr1</text>
  <text x="560" y="475" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">phosphatase</text>
  
  <!-- SPCC16A11.07 (coq10) -->
  <rect x="600" y="350" width="120" height="40" rx="5" ry="5" fill="#d9d2e9" stroke="#333333" stroke-width="1.5" />
  <text x="660" y="370" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">coq10</text>
  <text x="660" y="385" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">molecular carrier</text>
  
  <!-- Coenzyme Q10 -->
  <ellipse cx="660" cy="450" rx="40" ry="25" fill="#f9cb9c" stroke="#333333" stroke-width="2" />
  <text x="660" y="455" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Coenzyme Q10</text>
  
  <!-- Arrows between mitochondrial reactions -->
  <path d="M 550 180 C 550 220, 550 260, 550 290 C 550 290, 190 290, 190 300" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 250 320 L 290 320" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 410 320 L 450 320" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 510 340 C 510 360, 410 360, 410 375" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 350 395 L 330 395" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 230 395 C 220 395, 220 440, 350 440" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 410 480 C 410 500, 620 500, 660 475" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 560 440 C 560 420, 410 420, 410 440" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 660 450 C 660 400, 660 390, 660 390" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="60" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333333">Ubiquinone Metabolic Process in S. pombe</text>
  <text x="400" y="85" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#333333">A GO-CAM pathway visualization</text>
  
  <!-- Legend -->
  <rect x="50" y="570" width="700" height="70" rx="5" ry="5" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
  <text x="400" y="585" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">LEGEND</text>
  
  <!-- Legend items -->
  <rect x="70" y="595" width="20" height="20" fill="#d9ead3" stroke="#333333" stroke-width="1" />
  <text x="100" y="610" font-family="Arial" font-size="12" fill="#333333">Cytosolic Enzyme</text>
  
  <rect x="200" y="595" width="20" height="20" fill="#d9d2e9" stroke="#333333" stroke-width="1" />
  <text x="230" y="610" font-family="Arial" font-size="12" fill="#333333">Mitochondrial Enzyme</text>
  
  <ellipse cx="320" cy="605" rx="10" ry="10" fill="#c9daf8" stroke="#333333" stroke-width="1" />
  <text x="350" y="610" font-family="Arial" font-size="12" fill="#333333">Substrate</text>
  
  <ellipse cx="420" cy="605" rx="10" ry="10" fill="#f9cb9c" stroke="#333333" stroke-width="1" />
  <text x="460" y="610" font-family="Arial" font-size="12" fill="#333333">Final Product</text>
  
  <line x1="500" y1="605" x2="520" y2="605" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="550" y="610" font-family="Arial" font-size="12" fill="#333333">Reaction Flow</text>
  
  <rect x="600" y="595" width="20" height="20" fill="#ffe6cc" stroke="#333333" stroke-width="1" />
  <text x="640" y="610" font-family="Arial" font-size="12" fill="#333333">Mitochondrion</text>
</svg>