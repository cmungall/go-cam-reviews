<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">
    The CRL5(ASB9) complex mediates ubiquitination and degradation of CKB
  </text>
  
  <!-- Cytoplasm area -->
  <ellipse cx="400" cy="320" rx="360" ry="240" fill="#e6f2ff" stroke="#aac" stroke-width="2" />
  <text x="400" y="130" font-family="Arial" font-size="16" text-anchor="middle">Cytoplasm</text>
  
  <!-- Linear pathway flow -->
  <!-- Step 1: Neddylation process -->
  <rect x="120" y="200" width="100" height="50" rx="10" ry="10" fill="#d4f0c4" stroke="#090" stroke-width="2" />
  <text x="170" y="225" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RNF7</text>
  <text x="170" y="245" font-family="Arial" font-size="12" text-anchor="middle">NEDD8 ligase</text>
  <text x="170" y="185" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0061663</text>
  
  <path d="M 220 225 L 260 225" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="240" y="215" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Neddylation</text>
  
  <rect x="270" y="200" width="100" height="50" rx="10" ry="10" fill="#d4f0c4" stroke="#090" stroke-width="2" />
  <text x="320" y="225" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RNF7~N8</text>
  <text x="320" y="245" font-family="Arial" font-size="12" text-anchor="middle">Neddylated RNF7</text>
  
  <!-- Step 2: Complex Formation -->
  <path d="M 320 250 L 320 300" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="335" y="280" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Complex</text>
  <text x="335" y="295" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Formation</text>
  
  <!-- Complex Components -->
  <rect x="120" y="300" width="100" height="50" rx="10" ry="10" fill="#ffcccc" stroke="#c00" stroke-width="2" />
  <text x="170" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CUL5</text>
  <text x="170" y="345" font-family="Arial" font-size="12" text-anchor="middle">Scaffold</text>
  <text x="170" y="285" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0160072</text>
  
  <rect x="120" y="380" width="100" height="50" rx="10" ry="10" fill="#c4d4f0" stroke="#00c" stroke-width="2" />
  <text x="170" y="405" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ASB9</text>
  <text x="170" y="425" font-family="Arial" font-size="12" text-anchor="middle">Substrate adaptor</text>
  <text x="170" y="365" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:1990756</text>
  
  <path d="M 220 325 L 270 325" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 220 405 L 270 405" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- CRL5 Complex -->
  <ellipse cx="320" cy="350" rx="70" ry="50" fill="#f0e4c4" stroke="#666" stroke-width="2" />
  <text x="320" y="345" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CRL5(ASB9)</text>
  <text x="320" y="365" font-family="Arial" font-size="14" text-anchor="middle">E3 Ubiquitin</text>
  <text x="320" y="385" font-family="Arial" font-size="14" text-anchor="middle">Ligase Complex</text>
  
  <!-- Step 3: Ubiquitination process -->
  <path d="M 390 350 L 440 350" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="415" y="340" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Target</text>
  
  <!-- ARIH2 role -->
  <rect x="400" y="250" width="100" height="50" rx="10" ry="10" fill="#e4c4f0" stroke="#909" stroke-width="2" />
  <text x="450" y="275" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ARIH2</text>
  <text x="450" y="295" font-family="Arial" font-size="12" text-anchor="middle">E3 Ubiquitin ligase</text>
  <text x="450" y="235" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0061630</text>
  
  <path d="M 450 300 L 450 350 L 430 350" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="470" y="325" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Assists</text>
  
  <!-- CKB Substrate -->
  <rect x="450" y="350" width="100" height="50" rx="10" ry="10" fill="#f0c4d4" stroke="#c09" stroke-width="2" />
  <text x="500" y="375" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CKB</text>
  <text x="500" y="395" font-family="Arial" font-size="12" text-anchor="middle">Creatine kinase B</text>
  <text x="500" y="335" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0004111</text>
  
  <!-- Ubiquitination indication -->
  <circle cx="530" y="420" r="15" fill="#ffcc00" stroke="#996600" stroke-width="2" />
  <text x="530" y="425" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Ub</text>
  <path d="M 500 400 L 530 420" stroke="#996600" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="430" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Ubiquitination</text>
  
  <!-- Step 4: Degradation pathway -->
  <path d="M 550 375 L 600 375" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="575" y="365" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Degradation</text>
  
  <!-- Proteasome -->
  <rect x="600" y="350" width="80" height="60" fill="#f4f4f4" stroke="#666" stroke-width="2" />
  <rect x="605" y="355" width="70" height="50" fill="#eee" stroke="#666" stroke-width="1" />
  <text x="640" y="380" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">26S</text>
  <text x="640" y="400" font-family="Arial" font-size="12" text-anchor="middle">Proteasome</text>
  <text x="640" y="335" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0043161</text>
  
  <!-- Step 5: Effect on Phosphocreatine pathway -->
  <rect x="450" y="450" width="140" height="50" rx="10" ry="10" fill="#c4f0d4" stroke="#396" stroke-width="2" />
  <text x="520" y="475" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Phosphocreatine</text>
  <text x="520" y="495" font-family="Arial" font-size="12" text-anchor="middle">biosynthesis</text>
  <text x="520" y="435" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">GO:0046314</text>
  
  <path d="M 500 400 L 500 450" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="465" y="425" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Regulates</text>
  
  <!-- Legend -->
  <rect x="50" y="500" width="220" height="80" fill="white" stroke="#aaa" stroke-width="1" rx="5" ry="5" />
  <text x="60" y="520" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <rect x="60" y="530" width="15" height="15" fill="#d4f0c4" stroke="#090" stroke-width="1" />
  <text x="85" y="542" font-family="Arial" font-size="12">NEDD8 pathway</text>
  
  <rect x="60" y="550" width="15" height="15" fill="#f0e4c4" stroke="#666" stroke-width="1" />
  <text x="85" y="562" font-family="Arial" font-size="12">E3 ligase complex</text>
  
  <rect x="170" y="530" width="15" height="15" fill="#f0c4d4" stroke="#c09" stroke-width="1" />
  <text x="195" y="542" font-family="Arial" font-size="12">Substrate (CKB)</text>
  
  <rect x="170" y="550" width="15" height="15" fill="#c4f0d4" stroke="#396" stroke-width="1" />
  <text x="195" y="562" font-family="Arial" font-size="12">Cellular process</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
  </defs>
</svg>