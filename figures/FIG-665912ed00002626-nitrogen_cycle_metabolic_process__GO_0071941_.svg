<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="0" y="0" width="800" height="800" fill="#f9f9f9" stroke="#333" stroke-width="2" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Nitrogen Cycle Metabolic Process in S. pombe</text>
  
  <!-- Urea Cycle Section -->
  <ellipse cx="280" cy="250" rx="220" ry="140" fill="#e6f7ff" stroke="#333" stroke-width="2" stroke-dasharray="5,3" />
  <text x="280" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Urea Cycle (GO:0000050)</text>
  
  <!-- Urea Metabolism Section -->
  <ellipse cx="500" cy="500" rx="180" ry="140" fill="#e6ffe6" stroke="#333" stroke-width="2" stroke-dasharray="5,3" />
  <text x="500" y="380" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Urea Metabolism (GO:0019627)</text>
  
  <!-- Key Notes -->
  <rect x="10" y="710" width="780" height="80" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1.5" opacity="0.9" />
  <text x="400" y="730" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Key Pathway Interactions</text>
  <text x="400" y="750" font-family="Arial" font-size="11" text-anchor="middle">The urea cycle (orange) produces urea and connects with urea metabolism pathways (green) that release NH₄⁺.</text>
  <text x="400" y="770" font-family="Arial" font-size="11" text-anchor="middle">Multiple enzymes catalyze the conversion of agmatine to urea. Ure2, Ure4, Ure6, and Ure7 form a urease complex that breaks down urea.</text>
  
  <!-- Molecules and Reactions -->
  
  <!-- Carbamoyl Phosphate Synthesis -->
  <rect x="120" y="200" width="120" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="1.5" />
  <text x="180" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Carbamoyl Phosphate</text>
  
  <!-- arg4 and arg5 -->
  <rect x="120" y="160" width="50" height="20" rx="10" ry="10" fill="#ff9900" stroke="#333" stroke-width="1" />
  <text x="145" y="175" font-family="Arial" font-size="10" text-anchor="middle">arg4</text>
  
  <rect x="180" y="160" width="50" height="20" rx="10" ry="10" fill="#ff9900" stroke="#333" stroke-width="1" />
  <text x="205" y="175" font-family="Arial" font-size="10" text-anchor="middle">arg5</text>
  
  <!-- Ornithine Carbamoyltransferase -->
  <rect x="310" y="200" width="110" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="1.5" />
  <text x="365" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Citrulline</text>
  
  <!-- arg3 -->
  <rect x="280" y="160" width="50" height="20" rx="10" ry="10" fill="#ff9900" stroke="#333" stroke-width="1" />
  <text x="305" y="175" font-family="Arial" font-size="10" text-anchor="middle">arg3</text>
  
  <!-- Argininosuccinate Synthase -->
  <rect x="310" y="290" width="110" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="1.5" />
  <text x="365" y="315" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Argininosuccinate</text>
  
  <!-- arg12 -->
  <rect x="370" y="250" width="50" height="20" rx="10" ry="10" fill="#ff9900" stroke="#333" stroke-width="1" />
  <text x="395" y="265" font-family="Arial" font-size="10" text-anchor="middle">arg12</text>
  
  <!-- Argininosuccinate Lyase -->
  <rect x="200" y="290" width="80" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="1.5" />
  <text x="240" y="315" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Arginine</text>
  
  <!-- arg7 and arg41 -->
  <rect x="240" y="250" width="50" height="20" rx="10" ry="10" fill="#ff9900" stroke="#333" stroke-width="1" />
  <text x="265" y="265" font-family="Arial" font-size="10" text-anchor="middle">arg7</text>
  
  <rect x="180" y="250" width="50" height="20" rx="10" ry="10" fill="#ff9900" stroke="#333" stroke-width="1" />
  <text x="205" y="265" font-family="Arial" font-size="10" text-anchor="middle">arg41</text>
  
  <!-- Arginase -->
  <rect x="120" y="290" width="50" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="1.5" />
  <text x="145" y="315" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Urea</text>
  
  <!-- aru1 and car1 -->
  <rect x="90" y="340" width="50" height="20" rx="10" ry="10" fill="#ff9900" stroke="#333" stroke-width="1" />
  <text x="115" y="355" font-family="Arial" font-size="10" text-anchor="middle">aru1</text>
  
  <rect x="150" y="340" width="50" height="20" rx="10" ry="10" fill="#ff9900" stroke="#333" stroke-width="1" />
  <text x="175" y="355" font-family="Arial" font-size="10" text-anchor="middle">car1</text>
  
  <!-- Urease Section -->
  <rect x="500" y="450" width="80" height="40" rx="5" ry="5" fill="#ccffcc" stroke="#333" stroke-width="1.5" />
  <text x="540" y="475" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">NH₄⁺</text>
  
  <!-- ure2, ure4, ure6, ure7 -->
  <rect x="440" y="500" width="50" height="20" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="465" y="515" font-family="Arial" font-size="10" text-anchor="middle">ure2</text>
  
  <rect x="500" y="500" width="50" height="20" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="525" y="515" font-family="Arial" font-size="10" text-anchor="middle">ure4</text>
  
  <rect x="440" y="530" width="50" height="20" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="465" y="545" font-family="Arial" font-size="10" text-anchor="middle">ure6</text>
  
  <rect x="500" y="530" width="50" height="20" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="525" y="545" font-family="Arial" font-size="10" text-anchor="middle">ure7</text>
  
  <!-- Purine Degradation -->
  <rect x="600" y="500" width="80" height="40" rx="5" ry="5" fill="#ccffcc" stroke="#333" stroke-width="1.5" />
  <text x="640" y="525" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Uric Acid</text>
  
  <!-- uro1 -->
  <rect x="615" y="550" width="50" height="20" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="640" y="565" font-family="Arial" font-size="10" text-anchor="middle">uro1</text>
  
  <!-- Allantoicase -->
  <rect x="500" y="580" width="80" height="40" rx="5" ry="5" fill="#ccffcc" stroke="#333" stroke-width="1.5" />
  <text x="540" y="605" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Allantoin</text>
  
  <!-- dal2 -->
  <rect x="515" y="630" width="50" height="20" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="540" y="645" font-family="Arial" font-size="10" text-anchor="middle">dal2</text>
  
  <!-- Agmatinase -->
  <rect x="370" y="580" width="80" height="40" rx="5" ry="5" fill="#ccffcc" stroke="#333" stroke-width="1.5" />
  <text x="410" y="605" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Agmatine</text>
  
  <!-- agm1, agm2, agm3 -->
  <rect x="340" y="630" width="40" height="20" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="360" y="645" font-family="Arial" font-size="10" text-anchor="middle">agm1</text>
  
  <rect x="390" y="630" width="40" height="20" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="410" y="645" font-family="Arial" font-size="10" text-anchor="middle">agm2</text>
  
  <rect x="365" y="660" width="40" height="20" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="385" y="675" font-family="Arial" font-size="10" text-anchor="middle">agm3</text>
  
  <!-- Connector Lines -->
  <!-- Urea Cycle Connections -->
  <path d="M240 220 L310 220" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M365 240 L365 290" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M310 310 L280 310" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M200 310 L170 310" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M120 330 Q 60 350 60 240 Q 60 180 120 200" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  
  <!-- Connections to Urea Metabolism -->
  <path d="M170 310 L450 450" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <path d="M580 470 L600 500" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M600 540 L540 580" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M500 600 L450 600" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M370 600 L200 330" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  
  <!-- Fumarate byproduct -->
  <rect x="350" y="340" width="80" height="25" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="1" />
  <text x="390" y="358" font-family="Arial" font-size="11" text-anchor="middle">Fumarate</text>
  <path d="M310 330 L350 350" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3,2" />
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="620" y="130" width="160" height="220" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1" />
  <text x="700" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="630" y="170" width="20" height="15" rx="3" ry="3" fill="#ffcc99" stroke="#333" stroke-width="1" />
  <text x="660" y="182" font-family="Arial" font-size="11" text-anchor="start">Urea Cycle Metabolite</text>
  
  <rect x="630" y="195" width="20" height="15" rx="3" ry="3" fill="#ccffcc" stroke="#333" stroke-width="1" />
  <text x="660" y="207" font-family="Arial" font-size="11" text-anchor="start">Urea Metabolism</text>
  
  <rect x="630" y="220" width="20" height="15" rx="10" ry="10" fill="#ff9900" stroke="#333" stroke-width="1" />
  <text x="660" y="232" font-family="Arial" font-size="11" text-anchor="start">Urea Cycle Enzymes</text>
  
  <rect x="630" y="245" width="20" height="15" rx="10" ry="10" fill="#33cc33" stroke="#333" stroke-width="1" />
  <text x="660" y="257" font-family="Arial" font-size="11" text-anchor="start">Urea Metabolism Enzymes</text>
  
  <line x1="630" y1="275" x2="650" y2="275" stroke="#333" stroke-width="3" />
  <text x="660" y="278" font-family="Arial" font-size="11" text-anchor="start">Direct Conversion</text>
  
  <line x1="630" y1="295" x2="650" y2="295" stroke="#333" stroke-width="3" stroke-dasharray="5,3" />
  <text x="660" y="298" font-family="Arial" font-size="11" text-anchor="start">Multi-step Process</text>
  
  <ellipse cx="640" cy="320" rx="15" ry="10" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,3" />
  <text x="660" y="323" font-family="Arial" font-size="11" text-anchor="start">Process Group</text>
</svg>