<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline (Astrocyte) -->
  <path d="M50,200 C30,300 30,450 100,550 C200,650 400,600 550,550 C650,500 750,400 750,300 C750,200 650,100 550,100 C450,80 250,100 50,200 Z" 
        fill="#f2f9ff" stroke="#6495ED" stroke-width="3"/>
  
  <!-- Cell compartments -->
  <!-- Nucleus -->
  <ellipse cx="350" cy="350" rx="150" ry="120" fill="#e6f3ff" stroke="#4682B4" stroke-width="2.5"/>
  <text x="350" y="350" font-family="Arial" font-size="16" text-anchor="middle">Nucleus</text>
  
  <!-- Endoplasmic Reticulum -->
  <path d="M500,250 Q520,230 540,250 Q560,270 580,250 Q600,230 620,250 Q640,270 660,250 Q680,230 700,250 
           L700,300 Q680,320 660,300 Q640,280 620,300 Q600,320 580,300 Q560,280 540,300 Q520,320 500,300 Z" 
        fill="#FAFAD2" stroke="#DAA520" stroke-width="2"/>
  <text x="600" y="280" font-family="Arial" font-size="14" text-anchor="middle">ER</text>
  
  <!-- Golgi Apparatus -->
  <path d="M500,350 Q530,340 550,350 Q570,360 590,350 Q610,340 630,350 
           Q650,360 670,350 L670,400 Q650,410 630,400 Q610,390 590,400 
           Q570,410 550,400 Q530,390 500,400 Z" 
        fill="#FFE4E1" stroke="#CD5C5C" stroke-width="2"/>
  <text x="590" y="380" font-family="Arial" font-size="14" text-anchor="middle">Golgi</text>

  <!-- ATM in nucleus -->
  <circle cx="250" cy="300" r="25" fill="#9FE2BF" stroke="#20B2AA" stroke-width="2"/>
  <text x="250" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ATM</text>
  
  <!-- MBTPS1 in ER membrane -->
  <rect x="560" y="250" width="70" height="30" rx="10" ry="10" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
  <text x="595" y="270" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">MBTPS1</text>
  
  <!-- MBTPS2 in Golgi membrane -->
  <rect x="560" y="370" width="70" height="30" rx="10" ry="10" fill="#FFA07A" stroke="#CD5C5C" stroke-width="2"/>
  <text x="595" y="390" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">MBTPS2</text>
  
  <!-- CREB3L1 initially in ER -->
  <rect x="500" y="250" width="40" height="30" rx="5" ry="5" fill="#87CEFA" stroke="#4169E1" stroke-width="2"/>
  <text x="520" y="270" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">CREB3L1</text>
  
  <!-- Cleaved CREB3L1 in nucleus -->
  <rect x="350" y="300" width="60" height="30" rx="5" ry="5" fill="#87CEFA" stroke="#4169E1" stroke-width="2"/>
  <text x="380" y="320" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">CREB3L1</text>
  
  <!-- CDKN1A/p21 in nucleus -->
  <rect x="350" y="400" width="60" height="30" rx="5" ry="5" fill="#FF99CC" stroke="#C71585" stroke-width="2"/>
  <text x="380" y="420" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">CDKN1A</text>
  <text x="380" y="435" font-family="Arial" font-size="10" text-anchor="middle">(p21)</text>

  <!-- Pathway arrows -->
  <!-- ATM phosphorylating CREB3L1 -->
  <path d="M275,300 Q400,280 500,265" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="275" font-family="Arial" font-size="12" text-anchor="middle">phosphorylation</text>
  
  <!-- CREB3L1 processing pathway -->
  <path d="M540,265 Q550,265 560,265" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- CREB3L1 transport to Golgi -->
  <path d="M520,280 Q520,330 550,370" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- CREB3L1 cleavage by MBTPS2 -->
  <path d="M550,370 Q560,370 560,370" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Cleaved CREB3L1 to nucleus -->
  <path d="M550,385 Q470,385 410,330" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="480" y="400" font-family="Arial" font-size="12" text-anchor="middle">translocation</text>
  
  <!-- CREB3L1 activating CDKN1A -->
  <path d="M380,330 Q380,365 380,400" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="365" font-family="Arial" font-size="12" text-anchor="middle">activation</text>

  <!-- DNA damage checkpoint -->
  <path d="M350,450 Q350,470 350,490" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="350" y="510" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Mitotic G2 DNA damage checkpoint</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">
    p53-independent mitotic G2 DNA damage checkpoint signaling 
  </text>
  <text x="400" y="70" font-family="Arial" font-size="18" text-anchor="middle">
    mediated by CREB3L1 in astrocytes (Mouse)
  </text>
  
  <!-- Legend -->
  <rect x="50" y="585" width="700" height="55" rx="10" ry="10" fill="#f8f8f8" stroke="#333" stroke-width="1"/>
  <text x="400" y="605" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <circle cx="100" cy="625" r="8" fill="#9FE2BF" stroke="#20B2AA" stroke-width="1"/>
  <text x="115" y="630" font-family="Arial" font-size="12">ATM: Protein kinase that initiates DNA damage response</text>
  
  <rect x="420" y="617" width="16" height="10" rx="3" ry="3" fill="#87CEFA" stroke="#4169E1" stroke-width="1"/>
  <text x="445" y="630" font-family="Arial" font-size="12">CREB3L1: Transcription factor</text>
  
  <rect x="100" y="647" width="16" height="10" rx="3" ry="3" fill="#FFD700" stroke="#B8860B" stroke-width="1"/>
  <text x="125" y="660" font-family="Arial" font-size="12">MBTPS1/MBTPS2: Proteases that cleave CREB3L1</text>
  
  <rect x="400" y="647" width="16" height="10" rx="3" ry="3" fill="#FF99CC" stroke="#C71585" stroke-width="1"/>
  <text x="425" y="660" font-family="Arial" font-size="12">CDKN1A/p21: Cyclin-dependent kinase inhibitor</text>
  
  <line x1="600" y1="625" x2="620" y2="625" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="650" y="630" font-family="Arial" font-size="12">Causal relation</text>
</svg>