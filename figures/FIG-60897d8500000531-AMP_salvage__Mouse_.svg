<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background cell outline -->
  <rect x="50" y="50" width="700" height="520" rx="50" ry="50" fill="#f8f9fa" stroke="#ccc" stroke-width="2" opacity="0.6"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">AMP Salvage Pathway (Mouse)</text>
  
  <!-- Molecules and Enzymes -->
  
  <!-- Hypoxanthine -->
  <circle cx="150" cy="150" r="40" fill="#c6e2ff" stroke="#333" stroke-width="2"/>
  <text x="150" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Hypoxanthine</text>
  
  <!-- Hprt1 enzyme -->
  <rect x="220" y="120" width="100" height="60" rx="15" ry="15" fill="#ffd700" stroke="#333" stroke-width="2"/>
  <text x="270" y="150" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Hprt1</text>
  <text x="270" y="170" font-family="Arial" font-size="11" text-anchor="middle">HPRT activity</text>
  
  <!-- Adenine -->
  <circle cx="150" cy="300" r="40" fill="#c6e2ff" stroke="#333" stroke-width="2"/>
  <text x="150" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Adenine</text>
  
  <!-- Aprt enzyme -->
  <rect x="220" y="270" width="100" height="60" rx="15" ry="15" fill="#ffd700" stroke="#333" stroke-width="2"/>
  <text x="270" y="300" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Aprt</text>
  <text x="270" y="320" font-family="Arial" font-size="11" text-anchor="middle">APRT activity</text>
  
  <!-- Adenosine -->
  <circle cx="150" cy="450" r="40" fill="#c6e2ff" stroke="#333" stroke-width="2"/>
  <text x="150" y="455" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Adenosine</text>
  
  <!-- Adk enzyme -->
  <rect x="220" y="420" width="100" height="60" rx="15" ry="15" fill="#ffd700" stroke="#333" stroke-width="2"/>
  <text x="270" y="450" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Adk</text>
  <text x="270" y="470" font-family="Arial" font-size="11" text-anchor="middle">ADK activity</text>
  
  <!-- AMP -->
  <circle cx="400" cy="300" r="45" fill="#ffb6c1" stroke="#333" stroke-width="2"/>
  <text x="400" y="295" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">AMP</text>
  <text x="400" y="315" font-family="Arial" font-size="11" text-anchor="middle">(adenosine 5'-</text>
  <text x="400" y="328" font-family="Arial" font-size="11" text-anchor="middle">monophosphate)</text>
  
  <!-- Adenylosuccinate -->
  <circle cx="580" cy="300" r="45" fill="#98fb98" stroke="#333" stroke-width="2"/>
  <text x="580" y="295" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Adenyl-</text>
  <text x="580" y="315" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">succinate</text>
  
  <!-- Adss1 enzyme -->
  <rect x="480" y="200" width="100" height="60" rx="15" ry="15" fill="#ffd700" stroke="#333" stroke-width="2"/>
  <text x="530" y="230" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Adss1</text>
  <text x="530" y="250" font-family="Arial" font-size="11" text-anchor="middle">ASS activity</text>
  
  <!-- Adss2 enzyme -->
  <rect x="480" y="350" width="100" height="60" rx="15" ry="15" fill="#ffd700" stroke="#333" stroke-width="2"/>
  <text x="530" y="380" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Adss2</text>
  <text x="530" y="400" font-family="Arial" font-size="11" text-anchor="middle">ASS activity</text>
  
  <!-- Adsl enzyme -->
  <rect x="660" y="270" width="100" height="60" rx="15" ry="15" fill="#ffd700" stroke="#333" stroke-width="2"/>
  <text x="710" y="300" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Adsl</text>
  <text x="710" y="320" font-family="Arial" font-size="11" text-anchor="middle">ASL activity</text>
  
  <!-- Connecting arrows -->
  <!-- Hypoxanthine to AMP via Hprt1 -->
  <path d="M190 150 L220 150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M320 150 L360 270" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Adenine to AMP via Aprt -->
  <path d="M190 300 L220 300" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M320 300 L355 300" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Adenosine to AMP via Adk -->
  <path d="M190 450 L220 450" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M320 450 L380 340" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- AMP to Adenylosuccinate via Adss1 -->
  <path d="M445 280 L480 240" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M580 255 L580 255" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- AMP to Adenylosuccinate via Adss2 -->
  <path d="M445 320 L480 360" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M580 350 L580 345" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Adss1/2 to Adenylosuccinate -->
  <path d="M580 230 L580 255" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M580 380 L580 345" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Adenylosuccinate to AMP via Adsl -->
  <path d="M625 300 L660 300" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M760 300 C 770 300, 770 150, 600 150 C 500 150, 450 250, 445 300" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Process label -->
  <rect x="350" y="520" width="250" height="30" fill="#e6f7ff" stroke="#333" stroke-width="1" rx="10" ry="10"/>
  <text x="475" y="540" font-family="Arial" font-size="16" text-anchor="middle">AMP Salvage (GO:0044209)</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="280" height="130" fill="white" stroke="#ccc" stroke-width="1" rx="5" ry="5"/>
  <text x="60" y="540" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <circle cx="80" cy="560" r="10" fill="#c6e2ff" stroke="#333" stroke-width="1"/>
  <text x="100" y="565" font-family="Arial" font-size="14">Substrate</text>
  
  <circle cx="80" cy="585" r="10" fill="#ffb6c1" stroke="#333" stroke-width="1"/>
  <text x="100" y="590" font-family="Arial" font-size="14">AMP (Product)</text>
  
  <circle cx="80" cy="610" r="10" fill="#98fb98" stroke="#333" stroke-width="1"/>
  <text x="100" y="615" font-family="Arial" font-size="14">Intermediate</text>
  
  <rect x="180" y="550" width="20" height="20" rx="5" ry="5" fill="#ffd700" stroke="#333" stroke-width="1"/>
  <text x="210" y="565" font-family="Arial" font-size="14">Enzyme</text>
  
  <line x1="180" y1="585" x2="210" y2="585" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="590" font-family="Arial" font-size="14">Reaction</text>
  
  <line x1="180" y1="610" x2="210" y2="610" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="225" y="615" font-family="Arial" font-size="14">Feedback</text>
  
  <!-- Enzyme abbreviations -->
  <text x="60" y="635" font-family="Arial" font-size="12">HPRT: Hypoxanthine phosphoribosyltransferase</text>
  <text x="60" y="650" font-family="Arial" font-size="12">APRT: Adenine phosphoribosyltransferase</text>
  <text x="60" y="665" font-family="Arial" font-size="12">ADK: Adenosine kinase</text>
  <text x="60" y="680" font-family="Arial" font-size="12">ASS: Adenylosuccinate synthase</text>
  <text x="60" y="695" font-family="Arial" font-size="12">ASL: Adenylosuccinate lyase</text>
</svg>