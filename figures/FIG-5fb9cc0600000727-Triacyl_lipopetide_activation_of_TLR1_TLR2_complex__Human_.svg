<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with light blue for extracellular space, light tan for cell -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9" />
  <rect x="0" y="250" width="800" height="350" fill="#fff4e6" />
  
  <!-- Cell membrane -->
  <path d="M0,250 Q400,270 800,250 Q400,230 0,250 Z" fill="#c4e7d4" stroke="#2c3e50" stroke-width="2" />
  
  <!-- Plasma membrane raft -->
  <path d="M350,240 Q450,260 550,240 Q450,220 350,240 Z" fill="#9edbf9" stroke="#2c3e50" stroke-width="2" />
  <text x="450" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Plasma membrane raft</text>
  
  <!-- Extracellular Space Label -->
  <text x="400" y="50" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Extracellular Space</text>
  
  <!-- Cytoplasm Label -->
  <text x="400" y="290" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Cytoplasm</text>
  
  <!-- LBP Protein -->
  <circle cx="200" cy="120" r="25" fill="#f5c842" stroke="#333" stroke-width="2" />
  <text x="200" y="120" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">LBP</text>
  <text x="200" y="135" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">(P18428)</text>
  <text x="200" y="85" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">Molecular</text>
  <text x="200" y="98" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">carrier activity</text>
  
  <!-- CD14 Protein -->
  <circle cx="300" cy="180" r="25" fill="#f5c842" stroke="#333" stroke-width="2" />
  <text x="300" y="180" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">CD14</text>
  <text x="300" y="195" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">(P08571)</text>
  <text x="300" y="155" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">Molecular</text>
  <text x="300" y="168" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">carrier activity</text>
  
  <!-- Triacyl lipopeptide -->
  <polygon points="250,140 240,150 260,150" fill="#e74c3c" stroke="#333" stroke-width="1" />
  <text x="250" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Triacyl</text>
  <text x="250" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">lipopeptide</text>
  <text x="250" y="183" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(CHEBI:60192)</text>
  
  <!-- TLR1-TLR2 Complex in membrane -->
  <rect x="400" y="220" width="40" height="60" rx="5" ry="5" fill="#5dade2" stroke="#333" stroke-width="2" />
  <rect x="440" y="220" width="40" height="60" rx="5" ry="5" fill="#5dade2" stroke="#333" stroke-width="2" />
  <text x="420" y="240" font-family="Arial" font-size="12" text-anchor="middle" fill="white">TLR1</text>
  <text x="420" y="252" font-family="Arial" font-size="9" text-anchor="middle" fill="white">(Q15399)</text>
  <text x="460" y="240" font-family="Arial" font-size="12" text-anchor="middle" fill="white">TLR2</text>
  <text x="460" y="252" font-family="Arial" font-size="9" text-anchor="middle" fill="white">(O60603)</text>
  <text x="430" y="200" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Transmembrane signaling</text>
  <text x="430" y="210" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">receptor activity</text>
  
  <!-- TIRAP Adaptor -->
  <rect x="420" y="320" width="40" height="30" rx="5" ry="5" fill="#f39c12" stroke="#333" stroke-width="2" />
  <text x="440" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">TIRAP</text>
  <text x="440" y="345" font-family="Arial" font-size="9" text-anchor="middle" fill="#333">(P58753)</text>
  <text x="440" y="360" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Protein-macromolecule</text>
  <text x="440" y="370" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">adaptor activity</text>
  
  <!-- Binding arrows -->
  <!-- LBP to triacyl lipopeptide -->
  <path d="M220,130 L240,140" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- CD14 to triacyl lipopeptide -->
  <path d="M280,170 L260,150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- triacyl lipopeptide to TLR1-TLR2 -->
  <path d="M260,150 C300,180 350,200 400,240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- TLR1-TLR2 to TIRAP -->
  <path d="M440,280 L440,320" stroke="#333" stroke-width="3" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)" />
  <text x="455" y="300" font-family="Arial" font-size="12" fill="#333">Signal</text>
  
  <!-- Process Label -->
  <text x="600" y="330" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#333">TLR1:TLR2 signaling pathway</text>
  <text x="600" y="350" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#333">(GO:0038123)</text>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="580" y="50" width="200" height="180" rx="10" ry="10" fill="white" stroke="#333" stroke-width="1" />
  <text x="680" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <circle cx="600" cy="90" r="10" fill="#f5c842" stroke="#333" stroke-width="1" />
  <text x="620" y="95" font-family="Arial" font-size="13" fill="#333">LBP/CD14 - Carrier proteins</text>
  
  <polygon points="600,115 595,120 605,120" fill="#e74c3c" stroke="#333" stroke-width="1" />
  <text x="640" y="120" font-family="Arial" font-size="13" fill="#333">Triacyl lipopeptide</text>
  
  <rect x="590" y="135" width="20" height="15" rx="2" ry="2" fill="#5dade2" stroke="#333" stroke-width="1" />
  <text x="650" y="145" font-family="Arial" font-size="13" fill="#333">TLR1-TLR2 complex</text>
  
  <rect x="590" y="160" width="20" height="15" rx="2" ry="2" fill="#f39c12" stroke="#333" stroke-width="1" />
  <text x="660" y="170" font-family="Arial" font-size="13" fill="#333">TIRAP adaptor protein</text>
  
  <line x1="590" y1="185" x2="610" y2="185" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <text x="665" y="190" font-family="Arial" font-size="13" fill="#333">Signaling pathway</text>
  
  <path d="M590,205 L610,205" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="660" y="210" font-family="Arial" font-size="13" fill="#333">Molecular interaction</text>
  
  <!-- Pathway Title -->
  <text x="400" y="25" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Triacyl Lipopeptide Activation of TLR1-TLR2 Complex (Human)</text>
</svg>