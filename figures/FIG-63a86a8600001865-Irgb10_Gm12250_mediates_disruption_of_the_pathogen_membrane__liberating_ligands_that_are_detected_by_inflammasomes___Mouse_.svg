<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#ffffff" />
  
  <!-- Cell boundaries -->
  <rect x="50" y="50" width="700" height="500" rx="20" fill="#f0f0f0" stroke="#000000" stroke-width="2" fill-opacity="0.3" />
  <text x="60" y="80" font-family="Arial" font-size="16" font-weight="bold">Host Cell</text>
  
  <!-- Pathogen boundaries -->
  <ellipse cx="400" cy="350" rx="180" ry="120" fill="#e6e6fa" stroke="#000000" stroke-width="2" fill-opacity="0.8" />
  <text x="380" y="250" font-family="Arial" font-size="16" font-weight="bold">Pathogen</text>
  
  <!-- Pathogen membrane -->
  <ellipse cx="400" cy="350" rx="160" ry="100" fill="none" stroke="#800080" stroke-width="3" stroke-dasharray="5,3" />
  <text x="345" y="350" font-family="Arial" font-size="12" fill="#800080">Pathogen Membrane</text>
  
  <!-- Host cytoplasm label -->
  <text x="150" y="150" font-family="Arial" font-size="16" fill="#333333">Host Cytoplasm</text>
  
  <!-- GTPases acting on pathogen membrane -->
  <circle cx="320" cy="280" r="25" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="320" y="280" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">Gbp5</text>
  <text x="320" y="295" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">GTPase</text>
  
  <circle cx="400" cy="260" r="25" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="400" y="260" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">Gbp2</text>
  <text x="400" y="275" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">GTPase</text>
  
  <circle cx="480" cy="280" r="25" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="480" y="280" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">Gm12250</text>
  <text x="480" y="295" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">GTPase</text>
  
  <!-- Membrane destabilization -->
  <path d="M 480 305 L 480 340" stroke="#ff0000" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="500" y="330" font-family="Arial" font-size="14" fill="#ff0000">Membrane</text>
  <text x="500" y="345" font-family="Arial" font-size="14" fill="#ff0000">Destabilization</text>
  
  <!-- Arrows from other GTPases to Gm12250 -->
  <path d="M 345 280 L 455 280" stroke="#666666" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="4,2" />
  <path d="M 400 285 L 455 290" stroke="#666666" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="4,2" />
  <text x="380" y="310" font-family="Arial" font-size="12" fill="#666666">Positively regulates</text>
  
  <!-- Disrupted membrane releases bacterial components -->
  <circle cx="350" cy="400" r="15" fill="#0066cc" stroke="#003366" stroke-width="1.5" />
  <text x="350" y="400" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="white">DNA</text>
  
  <polygon points="430,390 450,400 430,410" fill="#ccff99" stroke="#339900" stroke-width="1.5" />
  <text x="480" y="405" font-family="Arial" font-size="12" fill="#339900">Lipid A</text>
  
  <!-- Released bacterial components moving to cytoplasm -->
  <path d="M 350 420 L 300 470" stroke="#0066cc" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <path d="M 430 420 L 500 470" stroke="#339900" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  
  <!-- Inflammasome components in cytoplasm -->
  <rect x="260" y="470" width="80" height="30" rx="5" fill="#ff99cc" stroke="#cc0066" stroke-width="2" />
  <text x="300" y="490" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle">AIM2</text>
  
  <rect x="460" y="470" width="80" height="30" rx="5" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
  <text x="500" y="490" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle">Caspase-4</text>
  
  <!-- Inflammasome assembly -->
  <path d="M 300 500 L 300 520 L 350 550" stroke="#cc0066" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M 500 500 L 500 520 L 450 550" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  
  <!-- Two types of inflammasomes -->
  <ellipse cx="350" cy="550" rx="60" ry="25" fill="#ffcccc" stroke="#990000" stroke-width="2" />
  <text x="350" y="550" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">AIM2</text>
  <text x="350" y="565" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">Inflammasome</text>
  
  <ellipse cx="450" cy="550" rx="60" ry="25" fill="#e6f9ff" stroke="#0066cc" stroke-width="2" />
  <text x="450" y="550" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">Non-canonical</text>
  <text x="450" y="565" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">Inflammasome</text>
  
  <!-- Labels for binding activities -->
  <text x="230" y="460" font-family="Arial" font-size="12" fill="#333333">DNA binding</text>
  <text x="540" y="460" font-family="Arial" font-size="12" fill="#333333">Lipid A binding</text>
  
  <!-- Process flow arrows -->
  <path d="M 700 180 L 680 180" stroke="#000000" stroke-width="2" marker-start="url(#arrowhead)" />
  <text x="690" y="170" font-family="Arial" font-size="14" text-anchor="end">Process Flow</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Irgb10/Gm12250-Mediated Inflammasome Activation Pathway</text>
  
  <!-- Legend -->
  <rect x="50" y="570" width="700" height="70" rx="5" fill="#f9f9f9" stroke="#333333" stroke-width="1" />
  <text x="70" y="590" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  
  <!-- Legend items -->
  <circle cx="90" cy="610" r="10" fill="#ffcc99" stroke="#ff6600" stroke-width="1" />
  <text x="110" y="615" font-family="Arial" font-size="14">GTPase</text>
  
  <rect x="170" y="600" width="20" height="20" rx="3" fill="#ff99cc" stroke="#cc0066" stroke-width="1" />
  <text x="200" y="615" font-family="Arial" font-size="14">DNA Sensor</text>
  
  <rect x="290" y="600" width="20" height="20" rx="3" fill="#99ccff" stroke="#0066cc" stroke-width="1" />
  <text x="320" y="615" font-family="Arial" font-size="14">Lipid Sensor</text>
  
  <line x1="410" y1="610" x2="450" y2="610" stroke="#666666" stroke-width="2" stroke-dasharray="4,2" />
  <text x="470" y="615" font-family="Arial" font-size="14">Positive Regulation</text>
  
  <line x1="560" y1="610" x2="600" y2="610" stroke="#ff0000" stroke-width="2" />
  <text x="620" y="615" font-family="Arial" font-size="14">Direct Activity</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
</svg>