<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">ERBB2-ERBB4 Signaling Pathway (Mouse)</text>
  
  <!-- Cell membrane -->
  <path d="M 50,200 L 750,200" stroke="#888888" stroke-width="10" stroke-linecap="round" fill="none"/>
  <text x="60" y="190" font-family="Arial" font-size="16" font-weight="bold">Plasma Membrane</text>
  
  <!-- Extracellular Space Label -->
  <text x="60" y="150" font-family="Arial" font-size="16" font-weight="bold">Extracellular Space</text>
  
  <!-- Cytoplasmic Space Label -->
  <text x="60" y="250" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm</text>
  
  <!-- ADAM10 -->
  <circle cx="150" cy="200" r="25" fill="#8dd3c7" stroke="#333" stroke-width="2"/>
  <text x="150" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ADAM10</text>
  
  <!-- ADAM17 -->
  <circle cx="250" cy="200" r="25" fill="#8dd3c7" stroke="#333" stroke-width="2"/>
  <text x="250" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ADAM17</text>
  
  <!-- BACE1 -->
  <circle cx="350" cy="200" r="25" fill="#8dd3c7" stroke="#333" stroke-width="2"/>
  <text x="350" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">BACE1</text>
  
  <!-- NRG1 precursor -->
  <rect x="250" y="280" width="100" height="40" rx="5" fill="#ffffb3" stroke="#333" stroke-width="2"/>
  <text x="300" y="305" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">NRG1 precursor</text>
  
  <!-- Arrows from metalloproteases to NRG1 precursor -->
  <path d="M 150,225 Q 200,260 250,295" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250,225 Q 270,260 280,280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350,225 Q 330,260 320,280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Mature NRG1 -->
  <rect x="250" y="120" width="100" height="40" rx="5" fill="#ffffb3" stroke="#333" stroke-width="2"/>
  <text x="300" y="145" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">NRG1</text>
  
  <!-- Arrow from NRG1 precursor to mature NRG1 -->
  <path d="M 300,280 Q 300,240 300,160" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="330" y="230" font-family="Arial" font-size="12" text-anchor="middle">cleavage</text>
  
  <!-- ERBB4 receptor -->
  <rect x="500" y="180" width="50" height="40" rx="5" fill="#bebada" stroke="#333" stroke-width="2"/>
  <text x="525" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ERBB4</text>
  
  <!-- ERBB2 receptor -->
  <rect x="560" y="180" width="50" height="40" rx="5" fill="#bebada" stroke="#333" stroke-width="2"/>
  <text x="585" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ERBB2</text>
  
  <!-- Arrow from NRG1 to ERBB4 -->
  <path d="M 350,140 Q 425,140 500,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="425" y="125" font-family="Arial" font-size="12" text-anchor="middle">receptor binding</text>
  
  <!-- Receptor dimerization -->
  <path d="M 550,200 L 560,200" stroke="#333" stroke-width="3" fill="none"/>
  
  <!-- Activated receptor complex -->
  <rect x="530" y="250" width="50" height="40" rx="5" fill="#fb8072" stroke="#333" stroke-width="2"/>
  <text x="555" y="270" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">activated</text>
  <text x="555" y="282" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">complex</text>
  
  <!-- Arrow showing receptor activation -->
  <path d="M 530,220 Q 530,235 530,250" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="500" y="235" font-family="Arial" font-size="12" text-anchor="middle">activation</text>
  
  <!-- Downstream signaling -->
  <path d="M 555,290 L 555,340" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="555" y="360" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ERBB2-ERBB4 Signaling</text>
  
  <!-- Tyrosine kinase activity -->
  <text x="620" y="300" font-family="Arial" font-size="12" text-anchor="middle">Protein tyrosine</text>
  <text x="620" y="312" font-family="Arial" font-size="12" text-anchor="middle">kinase activity</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Molecular functions boxes -->
  <rect x="100" y="430" width="30" height="15" fill="#8dd3c7" stroke="#333" stroke-width="1"/>
  <text x="140" y="442" font-family="Arial" font-size="14" text-anchor="start">Metallopeptidase/Endopeptidase (ADAM10, ADAM17, BACE1)</text>
  
  <rect x="100" y="455" width="30" height="15" fill="#ffffb3" stroke="#333" stroke-width="1"/>
  <text x="140" y="467" font-family="Arial" font-size="14" text-anchor="start">Receptor Ligand (NRG1)</text>
  
  <rect x="100" y="480" width="30" height="15" fill="#bebada" stroke="#333" stroke-width="1"/>
  <text x="140" y="492" font-family="Arial" font-size="14" text-anchor="start">Receptor (ERBB2, ERBB4)</text>
  
  <rect x="100" y="505" width="30" height="15" fill="#fb8072" stroke="#333" stroke-width="1"/>
  <text x="140" y="517" font-family="Arial" font-size="14" text-anchor="start">Activated Complex</text>
  
  <!-- Arrow legend -->
  <line x1="500" y="430" x2="530" y2="430" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="540" y="434" font-family="Arial" font-size="14" text-anchor="start">Process direction</text>
  
  <line x1="500" y="455" x2="530" y2="455" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="540" y="459" font-family="Arial" font-size="14" text-anchor="start">Downstream signaling</text>
  
  <!-- Processes -->
  <text x="400" y="550" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Processes:</text>
  <text x="400" y="575" font-family="Arial" font-size="14" text-anchor="middle">Signaling Receptor Ligand Precursor Processing → ERBB2-ERBB4 Signaling Pathway</text>
  
  <!-- Reference note -->
  <text x="400" y="610" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Based on GO-CAM model gomodel:61b2b68300000203</text>
  <text x="400" y="630" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">ERBB2-ERBB4 signaling pathway 3 (Mouse)</text>
</svg>