<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell compartments -->
  <rect x="50" y="50" width="700" height="700" rx="20" ry="20" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Cell compartments -->
  <!-- Mitochondrion -->
  <ellipse cx="400" cy="400" rx="300" ry="250" fill="#FFE8E0" stroke="#993333" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="400" y="180" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#993333">Mitochondrion</text>
  
  <!-- Mitochondrial inner membrane -->
  <ellipse cx="400" cy="410" rx="250" ry="200" fill="#FFD6CC" stroke="#CC3333" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="400" y="250" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#CC3333">Mitochondrial inner membrane</text>
  
  <!-- Cytosol -->
  <rect x="70" y="70" width="660" height="660" rx="15" ry="15" fill="none" stroke="#336699" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="130" y="100" font-family="Arial" font-size="16" font-weight="bold" fill="#336699">Cytosol</text>
  
  <!-- TCA Cycle Circle with direction indicator -->
  <circle cx="400" cy="400" r="170" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Cycle direction arrow -->
  <path d="M400 230 Q420 240 435 255" stroke="#555" stroke-width="3" fill="none" marker-end="url(#cyclearrow)" stroke-dasharray="none"/>
  
  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">TCA Cycle in Saccharomyces cerevisiae</text>
  <text x="400" y="110" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic">Tricarboxylic Acid Cycle - Aerobic Respiration</text>
  
  <!-- Metabolites and Reactions -->
  <!-- Acetyl-CoA -->
  <circle cx="400" cy="230" r="28" fill="#FFFFCC" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="235" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Acetyl-CoA</text>
  
  <!-- Oxaloacetate -->
  <circle cx="280" cy="280" r="28" fill="#CCFFCC" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="285" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Oxaloacetate</text>
  
  <!-- Citrate -->
  <circle cx="280" cy="400" r="28" fill="#CCFFFF" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="405" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Citrate</text>
  
  <!-- cis-Aconitate -->
  <circle cx="320" cy="500" r="28" fill="#CCCCFF" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="505" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">cis-Aconitate</text>
  
  <!-- Isocitrate -->
  <circle cx="400" cy="550" r="28" fill="#FFCCFF" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="555" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Isocitrate</text>
  
  <!-- α-Ketoglutarate -->
  <circle cx="500" cy="530" r="28" fill="#FFCCCC" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="535" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">α-Ketoglutarate</text>
  
  <!-- Succinyl-CoA -->
  <circle cx="570" cy="470" r="28" fill="#FFDDCC" stroke="#333" stroke-width="1.5"/>
  <text x="570" y="475" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Succinyl-CoA</text>
  
  <!-- Succinate -->
  <circle cx="600" cy="380" r="28" fill="#FFEEDD" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="385" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Succinate</text>
  
  <!-- Fumarate -->
  <circle cx="570" cy="290" r="28" fill="#FFEEDD" stroke="#333" stroke-width="1.5"/>
  <text x="570" y="295" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Fumarate</text>
  
  <!-- Malate -->
  <circle cx="480" cy="240" r="28" fill="#DDEEFF" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="245" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Malate</text>
  
  <!-- Pyruvate -->
  <circle cx="180" cy="280" r="28" fill="#FFCC99" stroke="#333" stroke-width="1.5"/>
  <text x="180" y="285" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Pyruvate</text>
  
  <!-- Enhanced Reaction Arrows with larger arrowheads -->
  <!-- Pyruvate to Oxaloacetate -->
  <path d="M205 280 L255 280" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Acetyl-CoA + Oxaloacetate to Citrate -->
  <path d="M280 305 L280 375" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M380 250 L310 290" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Citrate to cis-Aconitate -->
  <path d="M290 425 L310 475" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- cis-Aconitate to Isocitrate -->
  <path d="M345 510 L375 535" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Isocitrate to α-Ketoglutarate -->
  <path d="M425 550 L475 535" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- α-Ketoglutarate to Succinyl-CoA -->
  <path d="M525 525 L550 490" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Succinyl-CoA to Succinate -->
  <path d="M580 445 L595 405" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Succinate to Fumarate -->
  <path d="M595 355 L580 315" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Fumarate to Malate -->
  <path d="M545 280 L505 250" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Malate to Oxaloacetate -->
  <path d="M455 240 L305 265" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Enzymes with colored background matching their function types -->
  <!-- Pyruvate Carboxylase (cytosol) - Carboxylases -->
  <rect x="170" y="310" width="120" height="35" rx="15" ry="15" fill="#E6F0FF" stroke="#336699" stroke-width="1.5"/>
  <text x="230" y="330" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Pyruvate Carboxylase</text>
  <text x="230" y="342" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">PYC1, PYC2</text>
  
  <!-- Citrate Synthase (mitochondrion) - Transferases -->
  <rect x="310" y="320" width="120" height="35" rx="15" ry="15" fill="#FFE8E0" stroke="#993333" stroke-width="1.5"/>
  <text x="370" y="340" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Citrate Synthase</text>
  <text x="370" y="352" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">CIT1, CIT2, CIT3</text>
  
  <!-- Aconitase (cytosol/mitochondrion) - Hydratases --> 
  <rect x="350" y="430" width="120" height="35" rx="15" ry="15" fill="#F0E8FF" stroke="#8866CC" stroke-width="1.5"/>
  <text x="410" y="450" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Aconitase</text>
  <text x="410" y="462" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">ACO1, ACO2</text>
  
  <!-- Isocitrate Dehydrogenase (mitochondrion) - Oxidoreductases -->
  <rect x="450" y="480" width="140" height="35" rx="15" ry="15" fill="#D6F0D6" stroke="#339933" stroke-width="1.5"/>
  <text x="520" y="500" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Isocitrate Dehydrogenase</text>
  <text x="520" y="512" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">IDH1, IDH2</text>
  
  <!-- α-Ketoglutarate Dehydrogenase (mitochondrion) - Oxidoreductases -->
  <rect x="520" y="400" width="160" height="35" rx="15" ry="15" fill="#D6F0D6" stroke="#339933" stroke-width="1.5"/>
  <text x="600" y="420" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">α-Ketoglutarate Dehydrogenase</text>
  <text x="600" y="432" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">KGD1, KGD2, KGD4, LPD1</text>
  
  <!-- Succinate-CoA Ligase (mitochondrion) - Ligases -->
  <rect x="640" y="430" width="120" height="35" rx="15" ry="15" fill="#F0D6D6" stroke="#993333" stroke-width="1.5"/>
  <text x="700" y="450" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Succinate-CoA Ligase</text>
  <text x="700" y="462" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">LSC1, LSC2</text>
  
  <!-- Succinate Dehydrogenase (inner mitochondrial membrane) - Oxidoreductases -->
  <rect x="620" y="320" width="150" height="35" rx="15" ry="15" fill="#D6F0D6" stroke="#339933" stroke-width="1.5"/>
  <text x="695" y="340" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Succinate Dehydrogenase</text>
  <text x="695" y="352" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">SDH1-4, SDH9</text>
  
  <!-- Fumarase (mitochondrion) - Hydratases -->
  <rect x="500" y="280" width="100" height="35" rx="15" ry="15" fill="#F0E8FF" stroke="#8866CC" stroke-width="1.5"/>
  <text x="550" y="300" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Fumarase</text>
  <text x="550" y="312" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">FUM1</text>
  
  <!-- Malate Dehydrogenase (mitochondrion) - Oxidoreductases -->
  <rect x="350" y="200" width="130" height="35" rx="15" ry="15" fill="#D6F0D6" stroke="#339933" stroke-width="1.5"/>
  <text x="415" y="220" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Malate Dehydrogenase</text>
  <text x="415" y="232" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">MDH1, MAE1</text>
  
  <!-- Cofactors with more prominent display -->
  <!-- NAD+/NADH and other cofactors indicators -->
  <rect x="500" y="240" width="90" height="18" rx="9" ry="9" fill="#FFFFFF" stroke="#666" stroke-width="1"/>
  <text x="545" y="253" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">NAD+ → NADH</text>
  
  <rect x="440" y="560" width="90" height="18" rx="9" ry="9" fill="#FFFFFF" stroke="#666" stroke-width="1"/>
  <text x="485" y="573" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">NAD+ → NADH</text>
  
  <rect x="500" y="440" width="90" height="18" rx="9" ry="9" fill="#FFFFFF" stroke="#666" stroke-width="1"/>
  <text x="545" y="453" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">NAD+ → NADH</text>
  
  <rect x="620" y="358" width="70" height="18" rx="9" ry="9" fill="#FFFFFF" stroke="#666" stroke-width="1"/>
  <text x="655" y="371" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Q → QH₂</text>
  
  <!-- CO2 released indicators -->
  <rect x="435" y="545" width="40" height="18" rx="9" ry="9" fill="#FFFFFF" stroke="#666" stroke-width="1"/>
  <text x="455" y="558" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">CO₂</text>
  
  <rect x="520" y="500" width="40" height="18" rx="9" ry="9" fill="#FFFFFF" stroke="#666" stroke-width="1"/>
  <text x="540" y="513" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">CO₂</text>
  
  <!-- CoA indicators -->
  <rect x="500" y="500" width="40" height="18" rx="9" ry="9" fill="#FFFFFF" stroke="#666" stroke-width="1"/>
  <text x="520" y="513" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">CoA</text>
  
  <rect x="580" y="430" width="80" height="18" rx="9" ry="9" fill="#FFFFFF" stroke="#666" stroke-width="1"/>
  <text x="620" y="443" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">CoA → ATP</text>
  
  <!-- Legend with enhanced clarity -->
  <rect x="620" y="90" width="150" height="200" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="630" y="110" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="640" cy="130" r="8" fill="#CCFFCC" stroke="black" stroke-width="1.5"/>
  <text x="660" y="135" font-family="Arial" font-size="12">Metabolites</text>
  
  <!-- Enzyme class colors in legend -->
  <rect x="630" y="148" width="20" height="12" rx="5" ry="5" fill="#D6F0D6" stroke="#339933" stroke-width="1.5"/>
  <text x="675" y="158" font-family="Arial" font-size="12">Oxidoreductases</text>
  
  <rect x="630" y="170" width="20" height="12" rx="5" ry="5" fill="#FFE8E0" stroke="#993333" stroke-width="1.5"/>
  <text x="675" y="180" font-family="Arial" font-size="12">Transferases</text>
  
  <rect x="630" y="192" width="20" height="12" rx="5" ry="5" fill="#F0E8FF" stroke="#8866CC" stroke-width="1.5"/>
  <text x="675" y="202" font-family="Arial" font-size="12">Hydratases</text>
  
  <rect x="630" y="214" width="20" height="12" rx="5" ry="5" fill="#F0D6D6" stroke="#993333" stroke-width="1.5"/>
  <text x="675" y="224" font-family="Arial" font-size="12">Ligases</text>
  
  <rect x="630" y="236" width="20" height="12" rx="5" ry="5" fill="#E6F0FF" stroke="#336699" stroke-width="1.5"/>
  <text x="675" y="246" font-family="Arial" font-size="12">Carboxylases</text>
  
  <line x1="630" y1="265" x2="650" y2="265" stroke="#CC3333" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="681" y="268" font-family="Arial" font-size="12">Inner membrane</text>
  
  <!-- Aerobic Respiration Label -->
  <rect x="250" y="640" width="300" height="30" rx="15" ry="15" fill="#EEEEFF" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="661" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Aerobic Respiration</text>
  
  <!-- Yeast context note -->
  <rect x="90" y="680" width="620" height="50" rx="10" ry="10" fill="#FFFFF0" stroke="#999" stroke-width="1"/>
  <text x="400" y="700" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">Note: In S. cerevisiae, TCA cycle enzymes show compartmentalization between mitochondria and cytosol,</text>
  <text x="400" y="718" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">with specialized isoforms facilitating adaptation to different growth conditions and metabolic demands.</text>
  
  <!-- Arrows definition with larger arrowheads -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#333"/>
    </marker>
    <marker id="cyclearrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#555"/>
    </marker>
  </defs>
</svg>