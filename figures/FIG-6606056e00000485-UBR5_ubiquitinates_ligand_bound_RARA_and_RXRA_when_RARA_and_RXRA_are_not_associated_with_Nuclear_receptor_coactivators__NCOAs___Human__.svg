<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell nucleus background -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f0f0ff" stroke="#666" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Nucleus</text>
  
  <!-- Chromatin regions -->
  <path d="M200,200 C230,180 270,220 300,200 S330,160 360,180 S390,220 420,200 S450,160 480,180" 
        fill="none" stroke="#8866aa" stroke-width="4"/>
  <path d="M250,300 C280,280 320,320 350,300 S380,260 410,280 S440,320 470,300 S500,260 530,280" 
        fill="none" stroke="#8866aa" stroke-width="4"/>
  <text x="250" y="170" font-family="Arial" font-size="14" font-weight="bold">Chromatin (GO:0000785)</text>
  
  <!-- Proteins and interactions -->
  <!-- RARA -->
  <rect x="280" y="220" width="60" height="30" rx="5" fill="#66aaff" stroke="#000" stroke-width="1.5"/>
  <text x="310" y="240" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">RARA</text>
  
  <!-- RXRA -->
  <rect x="390" y="220" width="60" height="30" rx="5" fill="#66aaff" stroke="#000" stroke-width="1.5"/>
  <text x="420" y="240" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">RXRA</text>
  
  <!-- UBR5 -->
  <rect x="335" y="320" width="60" height="30" rx="5" fill="#ff8866" stroke="#000" stroke-width="1.5"/>
  <text x="365" y="340" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">UBR5</text>
  
  <!-- NCOA3 -->
  <rect x="335" y="150" width="60" height="30" rx="5" fill="#66cc99" stroke="#000" stroke-width="1.5"/>
  <text x="365" y="170" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">NCOA3</text>
  
  <!-- Retinoic acid ligand -->
  <circle cx="230" cy="230" r="15" fill="#ffcc00" stroke="#000" stroke-width="1.5"/>
  <text x="230" y="234" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">RA</text>
  
  <!-- Arrows and interactions -->
  <!-- Ligand binding to RARA -->
  <line x1="245" y1="230" x2="280" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="255" y="220" font-family="Arial" font-size="10">Binding</text>
  
  <!-- NCOA3 interaction with receptors -->
  <line x1="350" y1="180" x2="310" y2="220" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <line x1="380" y1="180" x2="420" y2="220" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="310" y="200" font-family="Arial" font-size="10" fill="#009900">Coactivator</text>
  <text x="400" y="200" font-family="Arial" font-size="10" fill="#009900">binding</text>
  
  <!-- UBR5 ubiquitination of receptors -->
  <line x1="335" y1="320" x2="300" y2="250" stroke="#f00" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="290" font-family="Arial" font-size="10" fill="#f00">Ubiquitination</text>
  <line x1="395" y1="320" x2="430" y2="250" stroke="#f00" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="425" y="290" font-family="Arial" font-size="10" fill="#f00">Ubiquitination</text>
  
  <!-- Ubiquitin symbols -->
  <circle cx="290" cy="270" r="10" fill="#ff0" stroke="#000"/>
  <text x="290" y="273" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">Ub</text>
  <circle cx="440" cy="270" r="10" fill="#ff0" stroke="#000"/>
  <text x="440" y="273" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">Ub</text>
  
  <!-- RARA-RXRA dimerization -->
  <line x1="340" y1="235" x2="390" y2="235" stroke="#000" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="365" y="250" font-family="Arial" font-size="10">Dimerization</text>
  
  <!-- Process labels -->
  <rect x="520" y="200" width="250" height="65" rx="5" fill="#f8f8f8" stroke="#aaa"/>
  <text x="535" y="220" font-family="Arial" font-size="12" font-style="italic">Retinoic acid receptor</text>
  <text x="535" y="235" font-family="Arial" font-size="12" font-style="italic">signaling pathway</text>
  <text x="535" y="250" font-family="Arial" font-size="12" font-style="italic">(GO:0048384)</text>
  
  <rect x="520" y="280" width="250" height="80" rx="5" fill="#f8f8f8" stroke="#aaa"/>
  <text x="535" y="300" font-family="Arial" font-size="12" font-style="italic">Nuclear protein quality</text>
  <text x="535" y="315" font-family="Arial" font-size="12" font-style="italic">control by ubiquitin-</text>
  <text x="535" y="330" font-family="Arial" font-size="12" font-style="italic">proteasome system</text>
  <text x="535" y="345" font-family="Arial" font-size="12" font-style="italic">(GO:0071630)</text>
  
  <!-- Sequence explanation box -->
  <rect x="100" y="380" width="280" height="170" rx="5" fill="#f8f8f8" stroke="#aaa"/>
  <text x="110" y="400" font-family="Arial" font-size="14" font-weight="bold">Pathway Sequence:</text>
  <text x="110" y="420" font-family="Arial" font-size="12">1. Retinoic acid (RA) binds to RARA</text>
  <text x="110" y="440" font-family="Arial" font-size="12">2. RARA forms heterodimer with RXRA</text>
  <text x="110" y="460" font-family="Arial" font-size="12">3. In normal signaling, NCOA3 binds to receptors</text>
  <text x="110" y="480" font-family="Arial" font-size="12">   as a coactivator for transcription</text>
  <text x="110" y="500" font-family="Arial" font-size="12">4. When NCOA3 is NOT bound to receptors:</text>
  <text x="110" y="520" font-family="Arial" font-size="12">   • UBR5 ubiquitinates both RARA and RXRA</text>
  <text x="110" y="540" font-family="Arial" font-size="12">   • This leads to receptor degradation via</text>
  <text x="110" y="560" font-family="Arial" font-size="12">     the ubiquitin-proteasome system</text>
  
  <!-- Gene labels with UniProt IDs -->
  <rect x="390" y="380" width="200" height="110" rx="5" fill="#f8f8f8" stroke="#aaa"/>
  <text x="400" y="400" font-family="Arial" font-size="14" font-weight="bold">Proteins:</text>
  <text x="400" y="420" font-family="Arial" font-size="12">RARA (UniProtKB:P10276)</text>
  <text x="400" y="440" font-family="Arial" font-size="12">RXRA (UniProtKB:P19793)</text>
  <text x="400" y="460" font-family="Arial" font-size="12">UBR5 (UniProtKB:O95071)</text>
  <text x="400" y="480" font-family="Arial" font-size="12">NCOA3 (UniProtKB:Q9Y6Q9)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="380" width="180" height="200" rx="5" fill="#f8f8f8" stroke="#aaa"/>
  <text x="610" y="400" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <rect x="610" y="410" width="15" height="15" fill="#66aaff" stroke="#000"/>
  <text x="635" y="422" font-family="Arial" font-size="12">Nuclear Receptors</text>
  
  <rect x="610" y="430" width="15" height="15" fill="#66cc99" stroke="#000"/>
  <text x="635" y="442" font-family="Arial" font-size="12">Coactivator</text>
  
  <rect x="610" y="450" width="15" height="15" fill="#ff8866" stroke="#000"/>
  <text x="635" y="462" font-family="Arial" font-size="12">Ubiquitin Ligase</text>
  
  <circle cx="617" cy="475" r="7" fill="#ffcc00" stroke="#000"/>
  <text x="635" y="480" font-family="Arial" font-size="12">Retinoic Acid</text>
  
  <circle cx="617" cy="495" r="7" fill="#ff0" stroke="#000"/>
  <text x="635" y="500" font-family="Arial" font-size="12">Ubiquitin</text>
  
  <line x1="610" y1="515" x2="625" y2="515" stroke="#f00" stroke-width="2"/>
  <text x="635" y="520" font-family="Arial" font-size="12">Ubiquitination</text>
  
  <line x1="610" y1="535" x2="625" y2="535" stroke="#009900" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="635" y="540" font-family="Arial" font-size="12">Coactivator Binding</text>
  
  <line x1="610" y1="555" x2="625" y2="555" stroke="#000" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="635" y="560" font-family="Arial" font-size="12">Dimerization</text>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">UBR5 Ubiquitination of RARA/RXRA in the Absence of Coactivator Binding</text>
</svg>