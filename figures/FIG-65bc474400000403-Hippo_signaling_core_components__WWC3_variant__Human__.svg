<svg width="850" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline with cytoplasm and nucleus -->
  <rect x="50" y="50" width="750" height="550" rx="50" ry="50" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <ellipse cx="400" cy="420" rx="210" ry="110" fill="#e6f3ff" stroke="#333" stroke-width="2"/>
  
  <!-- Cell compartment labels -->
  <text x="100" y="100" font-family="Arial" font-size="20" font-weight="bold" fill="#333">Cytoplasm</text>
  <text x="400" y="420" font-family="Arial" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Nucleus</text>
  
  <!-- Proteins in cytoplasm -->
  <!-- WWC3 -->
  <rect x="100" y="150" width="90" height="45" rx="8" ry="8" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <text x="145" y="177" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">WWC3</text>
  <text x="145" y="205" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Signaling adaptor</text>
  
  <!-- SAV1 -->
  <rect x="250" y="150" width="90" height="45" rx="8" ry="8" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <text x="295" y="177" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">SAV1</text>
  <text x="295" y="205" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Kinase activator</text>
  
  <!-- STK3/4 -->
  <rect x="175" y="250" width="90" height="45" rx="8" ry="8" fill="#ccffcc" stroke="#333" stroke-width="2"/>
  <text x="220" y="275" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">STK3/4</text>
  <text x="220" y="295" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Ser/Thr kinase</text>
  
  <!-- MOB1A/B -->
  <rect x="325" y="250" width="90" height="45" rx="8" ry="8" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <text x="370" y="275" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">MOB1A/B</text>
  <text x="370" y="295" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Kinase activator</text>
  
  <!-- LATS1/2 -->
  <rect x="250" y="320" width="90" height="45" rx="8" ry="8" fill="#ccffcc" stroke="#333" stroke-width="2"/>
  <text x="295" y="345" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">LATS1/2</text>
  <text x="295" y="365" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Ser/Thr kinase</text>
  
  <!-- YAP1 & WWTR1 cytoplasmic (phosphorylated) -->
  <rect x="175" y="400" width="90" height="45" rx="8" ry="8" fill="#ccccff" stroke="#333" stroke-width="2"/>
  <text x="220" y="425" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">YAP1-P</text>
  <text x="220" y="445" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Inactive</text>
  
  <rect x="325" y="400" width="90" height="45" rx="8" ry="8" fill="#ccccff" stroke="#333" stroke-width="2"/>
  <text x="370" y="425" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">WWTR1-P</text>
  <text x="370" y="445" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Inactive</text>
  
  <!-- Proteins in nucleus -->
  <!-- YAP1 & WWTR1 nuclear (active) -->
  <rect x="325" y="380" width="90" height="45" rx="8" ry="8" fill="#ccccff" stroke="#333" stroke-width="2"/>
  <text x="370" y="405" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">YAP1</text>
  <text x="370" y="425" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Coregulator</text>
  
  <rect x="475" y="380" width="90" height="45" rx="8" ry="8" fill="#ccccff" stroke="#333" stroke-width="2"/>
  <text x="520" y="405" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">WWTR1</text>
  <text x="520" y="425" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Coregulator</text>
  
  <!-- TEAD (not in original but added as implied transcription factor target) -->
  <rect x="400" y="470" width="90" height="45" rx="8" ry="8" fill="#ffcc99" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="445" y="495" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">TEAD</text>
  <text x="445" y="515" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Transcription factor</text>
  
  <!-- Arrows for signaling cascade -->
  <!-- WWC3 to STK3/4 -->
  <path d="M145 195 L180 250" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="150" y="225" font-family="Arial" font-size="12" fill="#333">activates</text>
  
  <!-- SAV1 to STK3/4 -->
  <path d="M295 195 L240 250" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="275" y="225" font-family="Arial" font-size="12" fill="#333">activates</text>
  
  <!-- STK3/4 to LATS1/2 -->
  <path d="M220 295 L255 320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="315" font-family="Arial" font-size="12" fill="#333">phosphorylates</text>
  
  <!-- MOB1A/B to LATS1/2 -->
  <path d="M370 295 L335 320" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="315" font-family="Arial" font-size="12" fill="#333">activates</text>
  
  <!-- LATS1/2 to YAP1 -->
  <path d="M275 365 L230 400" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="235" y="385" font-family="Arial" font-size="12" fill="#333">phosphorylates</text>
  
  <!-- LATS1/2 to WWTR1 -->
  <path d="M315 365 L350 400" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="385" font-family="Arial" font-size="12" fill="#333">phosphorylates</text>
  
  <!-- STK3/4 to MOB1A/B -->
  <path d="M265 272 L325 272" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="290" y="260" font-family="Arial" font-size="12" fill="#333">activates</text>
  
  <!-- YAP1 & WWTR1 translocation (dashed line) -->
  <path d="M220 400 L325 390" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="265" y="385" font-family="Arial" font-size="12" fill="#333" font-style="italic">translocation</text>
  
  <path d="M370 400 L475 390" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="415" y="385" font-family="Arial" font-size="12" fill="#333" font-style="italic">translocation</text>
  
  <!-- YAP1 & WWTR1 to TEAD (implied interaction) -->
  <path d="M370 425 L410 470" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="385" y="455" font-family="Arial" font-size="12" fill="#333" font-style="italic">binds</text>
  
  <path d="M520 425 L480 470" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="505" y="455" font-family="Arial" font-size="12" fill="#333" font-style="italic">binds</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="100" width="200" height="175" fill="white" stroke="#333" stroke-width="1"/>
  <text x="560" y="125" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Legend</text>
  
  <rect x="560" y="135" width="20" height="15" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="590" y="147" font-family="Arial" font-size="14" fill="#333">Adaptor protein</text>
  
  <rect x="560" y="160" width="20" height="15" fill="#ccffcc" stroke="#333" stroke-width="1"/>
  <text x="590" y="172" font-family="Arial" font-size="14" fill="#333">Kinase</text>
  
  <rect x="560" y="185" width="20" height="15" fill="#ccccff" stroke="#333" stroke-width="1"/>
  <text x="590" y="197" font-family="Arial" font-size="14" fill="#333">Transcription regulator</text>
  
  <rect x="560" y="210" width="20" height="15" fill="#ffcc99" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="590" y="222" font-family="Arial" font-size="14" fill="#333">Not in source data</text>
  
  <line x1="560" y1="235" x2="580" y2="235" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="590" y="240" font-family="Arial" font-size="14" fill="#333">Translocation</text>
  
  <line x1="560" y1="257" x2="580" y2="257" stroke="#333" stroke-width="2"/>
  <text x="590" y="262" font-family="Arial" font-size="14" fill="#333">Direct interaction</text>
  
  <!-- Title -->
  <text x="425" y="30" font-family="Arial" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Hippo Signaling Pathway (WWC3 Variant)</text>
</svg>