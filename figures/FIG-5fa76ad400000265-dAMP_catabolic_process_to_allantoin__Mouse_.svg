<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Cell representation -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f8f8" stroke="#888888" stroke-width="2" />
  
  <!-- Cytosol label -->
  <text x="400" y="90" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#555555">Cytosol (GO:0005829)</text>
  
  <!-- Peroxisome -->
  <ellipse cx="400" cy="400" rx="180" ry="110" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="400" y="330" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#0066cc">Peroxisome (GO:0005777)</text>
  
  <!-- Pathway Components -->
  <!-- dAMP -> dAdo -->
  <circle cx="120" cy="180" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="120" y="185" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">dAMP</text>
  
  <line x1="150" y1="180" x2="195" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="145" y="145" width="55" height="30" fill="#ccffcc" stroke="#66cc66" stroke-width="1" rx="5" ry="5" />
  <text x="172" y="165" font-family="Arial" font-size="14" text-anchor="middle">Nt5c1a</text>
  <text x="172" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#444444" font-style="italic">5'-nucleotidase</text>
  
  <circle cx="240" cy="180" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="240" y="185" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">dAdo</text>
  
  <!-- dAdo -> dIno -->
  <line x1="270" y1="180" x2="315" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="265" y="145" width="55" height="30" fill="#ccffcc" stroke="#66cc66" stroke-width="1" rx="5" ry="5" />
  <text x="292" y="165" font-family="Arial" font-size="14" text-anchor="middle">Ada</text>
  <text x="292" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#444444" font-style="italic">deaminase</text>
  
  <circle cx="360" cy="180" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="360" y="185" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">dIno</text>
  
  <!-- dIno -> Hx -->
  <line x1="390" y1="180" x2="435" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="385" y="145" width="55" height="30" fill="#ccffcc" stroke="#66cc66" stroke-width="1" rx="5" ry="5" />
  <text x="412" y="165" font-family="Arial" font-size="14" text-anchor="middle">Pnp</text>
  <text x="412" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#444444" font-style="italic">phosphorylase</text>
  
  <circle cx="480" cy="180" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="480" y="185" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Hx</text>
  
  <!-- Hx -> Xan -->
  <line x1="510" y1="180" x2="555" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="505" y="145" width="55" height="30" fill="#ccffcc" stroke="#66cc66" stroke-width="1" rx="5" ry="5" />
  <text x="532" y="165" font-family="Arial" font-size="14" text-anchor="middle">Xdh</text>
  <text x="532" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#444444" font-style="italic">oxidase/dehydrogenase</text>
  
  <circle cx="600" cy="180" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="600" y="185" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Xan</text>
  
  <!-- Xan -> Urate -->
  <line x1="630" y1="180" x2="675" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="625" y="145" width="55" height="30" fill="#ccffcc" stroke="#66cc66" stroke-width="1" rx="5" ry="5" />
  <text x="652" y="165" font-family="Arial" font-size="14" text-anchor="middle">Xdh</text>
  <text x="652" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#444444" font-style="italic">oxidase/dehydrogenase</text>
  
  <circle cx="720" cy="180" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="720" y="185" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Urate</text>
  
  <!-- Transport to peroxisome (implicit) -->
  <line x1="720" y1="210" x2="620" y2="320" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  <rect x="640" y="240" width="80" height="40" fill="#ffffcc" stroke="#cccc66" stroke-width="1" rx="5" ry="5" opacity="0.8" />
  <text x="680" y="260" font-family="Arial" font-size="14" text-anchor="middle" fill="#666633">Transport</text>
  <text x="680" y="275" font-family="Arial" font-size="12" text-anchor="middle" fill="#666633" font-style="italic">(implicit)</text>
  
  <!-- Peroxisomal pathway -->
  <circle cx="620" cy="380" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="620" y="385" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Urate</text>
  
  <!-- Urate -> HIU -->
  <line x1="590" y1="380" x2="545" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="540" y="345" width="55" height="30" fill="#ccffcc" stroke="#66cc66" stroke-width="1" rx="5" ry="5" />
  <text x="567" y="365" font-family="Arial" font-size="14" text-anchor="middle">Uox</text>
  <text x="567" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#444444" font-style="italic">urate oxidase</text>
  
  <circle cx="500" cy="380" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="500" y="385" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">HIU</text>
  
  <!-- HIU -> OHCU -->
  <line x1="470" y1="380" x2="425" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="420" y="345" width="55" height="30" fill="#ccffcc" stroke="#66cc66" stroke-width="1" rx="5" ry="5" />
  <text x="447" y="365" font-family="Arial" font-size="14" text-anchor="middle">Urah</text>
  <text x="447" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#444444" font-style="italic">hydrolase</text>
  
  <circle cx="380" cy="380" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="380" y="385" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">OHCU</text>
  
  <!-- OHCU -> Allantoin -->
  <line x1="350" y1="380" x2="305" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="300" y="345" width="55" height="30" fill="#ccffcc" stroke="#66cc66" stroke-width="1" rx="5" ry="5" />
  <text x="327" y="365" font-family="Arial" font-size="14" text-anchor="middle">Urad</text>
  <text x="327" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#444444" font-style="italic">decarboxylase</text>
  
  <circle cx="260" cy="380" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="260" y="385" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Allantoin</text>
  
  <!-- Metabolite full names -->
  <text x="120" y="220" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">2'-deoxyadenosine</text>
  <text x="120" y="232" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">5'-monophosphate</text>
  <text x="240" y="220" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">2'-deoxyadenosine</text>
  <text x="360" y="220" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">2'-deoxyinosine</text>
  <text x="480" y="220" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">hypoxanthine</text>
  <text x="600" y="220" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">xanthine</text>
  <text x="720" y="220" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">uric acid</text>
  <text x="500" y="420" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">5-hydroxyisourate</text>
  <text x="380" y="420" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">2-oxo-4-hydroxy-</text>
  <text x="380" y="432" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">4-carboxy-5-</text>
  <text x="380" y="444" font-family="Arial" font-size="11" text-anchor="middle" fill="#444444">ureidoimidazoline</text>

  <!-- Title -->
  <text x="400" y="530" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">dAMP Catabolic Process to Allantoin (Mouse)</text>
  
  <!-- Definitions for markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="75" y="450" width="180" height="120" fill="white" stroke="#888888" stroke-width="1" rx="10" ry="10" />
  <text x="165" y="470" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
  
  <circle cx="100" cy="490" r="15" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
  <text x="175" y="495" font-family="Arial" font-size="14" text-anchor="middle">Metabolite</text>
  
  <rect x="85" y="510" width="30" height="20" fill="#ccffcc" stroke="#66cc66" stroke-width="1" rx="5" ry="5" />
  <text x="175" y="525" font-family="Arial" font-size="14" text-anchor="middle">Enzyme</text>
  
  <rect x="85" y="540" width="30" height="20" fill="#ffffcc" stroke="#cccc66" stroke-width="1" rx="5" ry="5" />
  <text x="175" y="555" font-family="Arial" font-size="14" text-anchor="middle">Implicit Process</text>
  
  <line x1="85" y1="575" x2="115" y2="575" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" />
  <text x="175" y="580" font-family="Arial" font-size="14" text-anchor="middle">Implicit Step</text>
</svg>