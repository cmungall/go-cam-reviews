<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f8f8" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Activation of ALK and LTK by ALKAL1 and ALKAL2 Cytokines (Human)</text>
  
  <!-- Cell membrane -->
  <path d="M100,300 L700,300 L700,500 L100,500 Z" fill="#e6f2ff" stroke="#999" stroke-width="1" />
  <path d="M100,300 L700,300" stroke="#3377cc" stroke-width="8" />
  
  <!-- Extracellular Space Label -->
  <text x="150" y="270" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Extracellular Space (GO:0005615)</text>
  
  <!-- Plasma Membrane Label -->
  <text x="150" y="325" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytoplasm Label -->
  <text x="150" y="360" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Cytoplasm</text>
  
  <!-- ALKAL1 Cytokine -->
  <circle cx="250" cy="200" r="40" fill="#f5a742" stroke="#333" stroke-width="2" />
  <text x="250" y="195" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ALKAL1</text>
  <text x="250" y="215" font-family="Arial" font-size="12" text-anchor="middle">(Q6UXT8)</text>
  
  <!-- ALKAL2 Cytokine -->
  <circle cx="550" cy="200" r="40" fill="#f5a742" stroke="#333" stroke-width="2" />
  <text x="550" y="195" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ALKAL2</text>
  <text x="550" y="215" font-family="Arial" font-size="12" text-anchor="middle">(Q6UX46)</text>
  
  <!-- ALK Receptor -->
  <rect x="350" y="270" width="100" height="100" fill="#6baed6" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="400" y="320" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">ALK</text>
  <text x="400" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="white">(Q9UM73)</text>
  
  <!-- LTK Receptor -->
  <rect x="500" y="270" width="100" height="100" fill="#9ecae1" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="550" y="320" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">LTK</text>
  <text x="550" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="white">(P29376)</text>
  
  <!-- Heparin -->
  <ellipse cx="300" cy="250" rx="40" ry="20" fill="#a1d99b" stroke="#333" stroke-width="2" />
  <text x="300" y="255" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Heparin</text>
  
  <!-- RTK Function Labels -->
  <text x="400" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">Transmembrane RTK Activity</text>
  <text x="400" y="395" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">(GO:0004714)</text>
  
  <text x="550" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">Transmembrane RTK Activity</text>
  <text x="550" y="395" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">(GO:0004714)</text>
  
  <!-- Cytokine Function Labels -->
  <text x="250" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">Cytokine Activity</text>
  <text x="250" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">(GO:0005125)</text>
  
  <text x="550" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">Cytokine Activity</text>
  <text x="550" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">(GO:0005125)</text>
  
  <!-- Heparin binding function -->
  <text x="290" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">Heparin Binding</text>
  <text x="290" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">(GO:0008201)</text>
  
  <!-- Connection lines -->
  <!-- ALKAL1 to ALK -->
  <line x1="275" y1="230" x2="375" y2="270" stroke="#ff5733" stroke-width="4" marker-end="url(#arrow)" />
  <text x="315" y="240" font-family="Arial" font-size="14" fill="#333" font-weight="bold">activates</text>
  
  <!-- ALKAL1 to LTK -->
  <line x1="280" y1="215" x2="500" y2="280" stroke="#ff5733" stroke-width="4" marker-end="url(#arrow)" />
  
  <!-- ALKAL2 to ALK -->
  <line x1="520" y1="215" x2="425" y2="270" stroke="#ff5733" stroke-width="4" marker-end="url(#arrow)" />
  <text x="460" y="230" font-family="Arial" font-size="14" fill="#333" font-weight="bold">activates</text>
  
  <!-- ALKAL2 to LTK -->
  <line x1="550" y1="240" x2="550" y2="270" stroke="#ff5733" stroke-width="4" marker-end="url(#arrow)" />
  
  <!-- Heparin to ALK -->
  <line x1="330" y1="260" x2="350" y2="290" stroke="#333" stroke-width="3" stroke-dasharray="5,3" />
  <text x="320" y="285" font-family="Arial" font-size="14" fill="#333" font-weight="bold">binds</text>
  
  <!-- Cell surface receptor RTK signaling pathway -->
  <text x="400" y="450" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic" font-weight="bold">Cell Surface Receptor Protein Tyrosine Kinase Signaling Pathway</text>
  <text x="400" y="475" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">(GO:0007169)</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#ff5733" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="480" width="220" height="110" fill="white" stroke="#333" stroke-width="2" />
  <text x="660" y="500" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="570" cy="520" r="12" fill="#f5a742" stroke="#333" stroke-width="1" />
  <text x="605" y="525" font-family="Arial" font-size="14" text-anchor="start">Cytokines</text>
  
  <rect x="560" y="535" width="22" height="22" fill="#6baed6" stroke="#333" stroke-width="1" />
  <text x="605" y="550" font-family="Arial" font-size="14" text-anchor="start">Receptor Tyrosine Kinases</text>
  
  <ellipse cx="570" cy="565" rx="12" ry="6" fill="#a1d99b" stroke="#333" stroke-width="1" />
  <text x="605" y="570" font-family="Arial" font-size="14" text-anchor="start">Heparin</text>
  
  <line x1="560" y1="585" x2="580" y2="585" stroke="#ff5733" stroke-width="3" marker-end="url(#arrow)" />
  <text x="605" y="590" font-family="Arial" font-size="14" text-anchor="start">Activation</text>
</svg>