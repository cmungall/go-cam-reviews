<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and compartments -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" />
  
  <!-- Extracellular space -->
  <rect x="50" y="50" width="700" height="120" fill="#e3f2fd" rx="5" ry="5" />
  <text x="60" y="70" font-family="Arial" font-size="14" fill="#1565c0">Extracellular Space</text>
  
  <!-- Plasma membrane -->
  <rect x="50" y="170" width="700" height="80" fill="#bbdefb" rx="0" ry="0" />
  <text x="60" y="190" font-family="Arial" font-size="14" fill="#1565c0">Plasma Membrane</text>
  
  <!-- Cytoplasm -->
  <rect x="50" y="250" width="700" height="300" fill="#e8f5e9" rx="5" ry="5" />
  <text x="60" y="270" font-family="Arial" font-size="14" fill="#2e7d32">Cytoplasm</text>
  
  <!-- Cortical Plate label -->
  <text x="400" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Cortical Plate of Developing Cerebral Cortex</text>
  
  <!-- REELIN pathway -->
  <!-- RELN protein -->
  <circle cx="150" cy="120" r="30" fill="#ffcc80" stroke="#e65100" stroke-width="2" />
  <text x="150" y="125" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">RELN</text>
  
  <!-- LRP8 receptor -->
  <rect x="140" y="170" width="100" height="80" fill="#90caf9" stroke="#1565c0" stroke-width="2" rx="5" ry="5" />
  <text x="190" y="210" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">LRP8</text>
  <text x="190" y="230" font-family="Arial" font-size="10" text-anchor="middle">Reelin Receptor</text>
  
  <!-- FYN kinase -->
  <polygon points="190,280 220,320 160,320" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2" />
  <text x="190" y="310" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">FYN</text>
  <text x="190" y="325" font-family="Arial" font-size="10" text-anchor="middle">Tyrosine Kinase</text>
  
  <!-- DAB1 adaptor -->
  <rect x="290" y="320" width="80" height="40" fill="#fff59d" stroke="#f57f17" stroke-width="2" rx="5" ry="5" />
  <text x="330" y="345" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">DAB1</text>
  <text x="330" y="360" font-family="Arial" font-size="9" text-anchor="middle">Signaling Adaptor</text>
  
  <!-- Phosphorylated DAB1 -->
  <rect x="290" y="400" width="80" height="40" fill="#fff59d" stroke="#f57f17" stroke-width="2" rx="5" ry="5" />
  <text x="330" y="425" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">DAB1-P</text>
  <circle cx="350" cy="400" r="8" fill="#ff5252" />
  <text x="350" y="403" font-family="Arial" font-size="10" fill="white" text-anchor="middle">P</text>
  
  <!-- ECS Complex -->
  <rect x="480" y="380" width="200" height="120" fill="#e1bee7" stroke="#6a1b9a" stroke-width="2" rx="10" ry="10" />
  <text x="580" y="400" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ECS Complex</text>
  <text x="580" y="415" font-family="Arial" font-size="10" text-anchor="middle">Ubiquitination machinery</text>
  
  <!-- SOCS7 -->
  <circle cx="520" cy="440" r="25" fill="#ce93d8" stroke="#6a1b9a" stroke-width="2" />
  <text x="520" y="445" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">SOCS7</text>
  <text x="520" y="460" font-family="Arial" font-size="8" text-anchor="middle">substrate adaptor</text>
  
  <!-- RNF7 -->
  <circle cx="580" cy="440" r="25" fill="#ce93d8" stroke="#6a1b9a" stroke-width="2" />
  <text x="580" y="445" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RNF7</text>
  <text x="580" y="460" font-family="Arial" font-size="8" text-anchor="middle">ubiquitin ligase</text>
  
  <!-- CUL5 -->
  <circle cx="640" cy="440" r="25" fill="#ce93d8" stroke="#6a1b9a" stroke-width="2" />
  <text x="640" y="445" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CUL5</text>
  <text x="640" y="460" font-family="Arial" font-size="8" text-anchor="middle">scaffold</text>
  
  <!-- Proteasome -->
  <rect x="480" y="520" width="120" height="20" fill="#ef9a9a" stroke="#b71c1c" stroke-width="2" />
  <rect x="500" y="510" width="80" height="20" fill="#ef9a9a" stroke="#b71c1c" stroke-width="2" />
  <rect x="520" y="500" width="40" height="20" fill="#ef9a9a" stroke="#b71c1c" stroke-width="2" />
  <text x="540" y="545" font-family="Arial" font-size="12" text-anchor="middle">Proteasome</text>
  
  <!-- Arrows and interactions -->
  <!-- RELN to LRP8 -->
  <line x1="150" y1="150" x2="170" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- LRP8 to FYN -->
  <line x1="190" y1="250" x2="190" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- FYN to DAB1 -->
  <line x1="220" y1="320" x2="290" y2="340" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- DAB1 to phosphorylated DAB1 -->
  <line x1="330" y1="360" x2="330" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- DAB1-P to ECS Complex -->
  <line x1="370" y1="420" x2="480" y2="440" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- ECS to proteasome -->
  <line x1="580" y1="500" x2="580" y2="520" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Ubiquitin label near the pathway between DAB1-P and ECS -->
  <path d="M 410,430 Q 430,435 425,445" stroke="#000000" stroke-width="1" stroke-dasharray="3,1" fill="none" />
  <circle cx="410" cy="430" r="10" fill="#ffeb3b" stroke="#f9a825" stroke-width="1" />
  <text x="410" y="434" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ub</text>
  
  <!-- Degradation symbol -->
  <line x1="400" y1="480" x2="460" y2="520" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="460" y1="480" x2="400" y2="520" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3" />
  <text x="430" y="510" font-family="Arial" font-size="10" fill="#b71c1c">Degradation</text>
  
  <!-- DAB1 inhibition of reelin signaling -->
  <path d="M 430,440 Q 480,380 400,300 Q 300,250 250,250" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#inhibitionArrow)" fill="none" />
  <text x="320" y="290" font-family="Arial" font-size="10" fill="#b71c1c" transform="rotate(-30, 320, 290)">Inhibitory feedback</text>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
    <marker id="inhibitionArrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#ff0000" stroke-width="2" />
      <line x1="0" y1="10" x2="10" y2="0" stroke="#ff0000" stroke-width="2" />
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="600" y="50" width="140" height="130" fill="white" stroke="black" stroke-width="1" />
  <text x="610" y="70" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
  
  <circle cx="620" cy="90" r="5" fill="#ffcc80" stroke="#e65100" stroke-width="1" />
  <text x="630" y="94" font-family="Arial" font-size="10">Ligand</text>
  
  <rect x="610" y="105" width="10" height="10" fill="#90caf9" stroke="#1565c0" stroke-width="1" />
  <text x="630" y="114" font-family="Arial" font-size="10">Receptor</text>
  
  <polygon points="615,125 620,130 610,130" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1" />
  <text x="630" y="130" font-family="Arial" font-size="10">Kinase</text>
  
  <circle cx="615" cy="140" r="5" fill="#ce93d8" stroke="#6a1b9a" stroke-width="1" />
  <text x="630" y="144" font-family="Arial" font-size="10">Complex components</text>
  
  <rect x="610" y="155" width="10" height="10" fill="#e3f2fd" stroke="none" />
  <rect x="610" y="170" width="10" height="10" fill="#bbdefb" stroke="none" />
  <rect x="610" y="185" width="10" height="10" fill="#e8f5e9" stroke="none" />
  <text x="630" y="164" font-family="Arial" font-size="10">Extracellular Space</text>
  <text x="630" y="179" font-family="Arial" font-size="10">Plasma Membrane</text>
  <text x="630" y="194" font-family="Arial" font-size="10">Cytoplasm</text>
</svg>