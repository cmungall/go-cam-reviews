<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <path d="M50,180 Q400,80 750,180 Q400,280 50,180" stroke="#8B4513" stroke-width="10" fill="#FFFAF0" fill-opacity="0.3"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Phosphatidylinositol/Inositol Phosphate Biosynthetic Process</text>
  <text x="400" y="55" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">S. pombe</text>
  
  <!-- External myo-inositol -->
  <circle cx="100" cy="150" r="25" fill="#B0E0E6" stroke="#000000" stroke-width="1"/>
  <text x="100" y="150" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">myo-inositol</text>
  <text x="100" y="162" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(external)</text>
  
  <!-- itr2 importer -->
  <rect x="150" y="160" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="180" y="180" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">itr2</text>
  
  <!-- Label for itr2 function -->
  <text x="180" y="145" font-family="Arial" font-size="10" text-anchor="middle">myo-inositol</text>
  <text x="180" y="155" font-family="Arial" font-size="10" text-anchor="middle">symporter</text>
  
  <!-- Arrow from external to itr2 -->
  <path d="M125,150 L150,170" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Internal myo-inositol -->
  <circle cx="250" cy="220" r="25" fill="#B0E0E6" stroke="#000000" stroke-width="1"/>
  <text x="250" y="220" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">myo-inositol</text>
  <text x="250" y="232" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(internal)</text>
  
  <!-- Arrow from itr2 to internal -->
  <path d="M210,180 L230,205" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- pis1 -->
  <rect x="320" y="220" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="350" y="240" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">pis1</text>
  
  <!-- Label for pis1 function -->
  <text x="350" y="205" font-family="Arial" font-size="10" text-anchor="middle">CDP-DAG-inositol</text>
  <text x="350" y="215" font-family="Arial" font-size="10" text-anchor="middle">phosphatidyltransferase</text>
  
  <!-- Arrow from internal to pis1 -->
  <path d="M275,220 L320,235" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- PtdIns (PI) -->
  <circle cx="420" cy="260" r="25" fill="#FFD700" stroke="#000000" stroke-width="1"/>
  <text x="420" y="260" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">PtdIns</text>
  <text x="420" y="272" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(PI)</text>
  
  <!-- Arrow from pis1 to PI -->
  <path d="M380,235 L400,250" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- efr3 -->
  <rect x="370" y="320" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="400" y="340" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">efr3</text>
  
  <!-- Label for efr3 function -->
  <text x="400" y="310" font-family="Arial" font-size="10" text-anchor="middle">protein-membrane</text>
  <text x="400" y="320" font-family="Arial" font-size="10" text-anchor="middle">adaptor</text>
  
  <!-- stt4 -->
  <rect x="470" y="320" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="500" y="340" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">stt4</text>
  
  <!-- Label for stt4 function -->
  <text x="500" y="310" font-family="Arial" font-size="10" text-anchor="middle">PI 4-kinase</text>
  
  <!-- Arrow from efr3 to stt4 -->
  <path d="M430,335 L470,335" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from PI to stt4 -->
  <path d="M435,280 L480,320" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- PI4P -->
  <circle cx="570" cy="320" r="25" fill="#FFD700" stroke="#000000" stroke-width="1"/>
  <text x="570" y="320" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">PI4P</text>
  
  <!-- Arrow from stt4 to PI4P -->
  <path d="M530,335 L545,325" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- its3 -->
  <rect x="570" y="380" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="600" y="400" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">its3</text>
  
  <!-- Label for its3 function -->
  <text x="600" y="370" font-family="Arial" font-size="10" text-anchor="middle">PI3P 4-kinase</text>
  
  <!-- Arrow from PI4P to its3 -->
  <path d="M570,345 L590,380" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- PI(4,5)P2 -->
  <circle cx="670" cy="380" r="25" fill="#FFD700" stroke="#000000" stroke-width="1"/>
  <text x="670" y="380" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">PI(4,5)P2</text>
  
  <!-- Arrow from its3 to PI(4,5)P2 -->
  <path d="M630,395 L645,385" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- plc1 -->
  <rect x="580" y="440" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="610" y="460" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">plc1</text>
  
  <!-- Label for plc1 function -->
  <text x="610" y="430" font-family="Arial" font-size="10" text-anchor="middle">PI phospholipase C</text>
  
  <!-- Arrow from PI(4,5)P2 to plc1 -->
  <path d="M665,405 L620,440" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- IP3 -->
  <circle cx="490" y="450" r="25" fill="#FF6347" stroke="#000000" stroke-width="1"/>
  <text x="490" y="450" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">IP3</text>
  
  <!-- Arrow from plc1 to IP3 -->
  <path d="M580,455 L515,450" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- arg82 -->
  <rect x="400" y="490" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="430" y="510" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">arg82</text>
  
  <!-- Label for arg82 function -->
  <text x="430" y="480" font-family="Arial" font-size="10" text-anchor="middle">IP3 3-kinase</text>
  
  <!-- Arrow from IP3 to arg82 -->
  <path d="M475,470 L435,490" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- IP4 -->
  <circle cx="320" y="490" r="25" fill="#FF6347" stroke="#000000" stroke-width="1"/>
  <text x="320" y="490" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">IP4</text>
  
  <!-- Arrow from arg82 to IP4 -->
  <path d="M400,505 L345,495" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- ipk1 -->
  <rect x="230" y="490" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="260" y="510" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">ipk1</text>
  
  <!-- Label for ipk1 function -->
  <text x="260" y="480" font-family="Arial" font-size="10" text-anchor="middle">IP5 2-kinase</text>
  
  <!-- Arrow from IP4 to ipk1 -->
  <path d="M295,490 L270,490" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- IP6 -->
  <circle cx="150" y="490" r="25" fill="#FF6347" stroke="#000000" stroke-width="1"/>
  <text x="150" y="490" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">IP6</text>
  
  <!-- Arrow from ipk1 to IP6 -->
  <path d="M230,505 L175,495" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- kcs1 -->
  <rect x="110" y="550" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="140" y="570" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">kcs1</text>
  
  <!-- Label for kcs1 function -->
  <text x="140" y="540" font-family="Arial" font-size="10" text-anchor="middle">IP6 kinase</text>
  
  <!-- Arrow from IP6 to kcs1 -->
  <path d="M145,515 L135,550" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- IP7 -->
  <circle cx="190" y="590" r="25" fill="#FF6347" stroke="#000000" stroke-width="1"/>
  <text x="190" y="590" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">IP7</text>
  
  <!-- Arrow from kcs1 to IP7 -->
  <path d="M160,565 L175,580" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- asp1 -->
  <rect x="270" y="590" width="60" height="30" fill="#90EE90" stroke="#000000" stroke-width="1" rx="5" ry="5"/>
  <text x="300" y="610" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">asp1</text>
  
  <!-- Label for asp1 function -->
  <text x="300" y="580" font-family="Arial" font-size="10" text-anchor="middle">IP6/IP7 kinase</text>
  
  <!-- Arrow from IP6 to asp1 (optional pathway) -->
  <path d="M175,495 L260,590" stroke="#000000" stroke-width="1.5" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Arrow from IP7 to asp1 -->
  <path d="M215,590 L270,605" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- IP8 -->
  <circle cx="350" y="590" r="25" fill="#FF6347" stroke="#000000" stroke-width="1"/>
  <text x="350" y="590" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">IP8</text>
  
  <!-- Arrow from asp1 to IP8 -->
  <path d="M330,605 L335,595" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="620" y="490" width="160" height="140" fill="white" stroke="black" stroke-width="1"/>
  <text x="700" y="510" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="640" y="530" r="10" fill="#B0E0E6" stroke="#000000" stroke-width="1"/>
  <text x="700" y="535" font-family="Arial" font-size="12" text-anchor="middle">myo-inositol</text>
  
  <circle cx="640" y="555" r="10" fill="#FFD700" stroke="#000000" stroke-width="1"/>
  <text x="700" y="560" font-family="Arial" font-size="12" text-anchor="middle">phosphatidylinositols</text>
  
  <circle cx="640" y="580" r="10" fill="#FF6347" stroke="#000000" stroke-width="1"/>
  <text x="700" y="585" font-family="Arial" font-size="12" text-anchor="middle">inositol phosphates</text>
  
  <rect x="630" y="595" width="20" height="10" fill="#90EE90" stroke="#000000" stroke-width="1" rx="2" ry="2"/>
  <text x="700" y="600" font-family="Arial" font-size="12" text-anchor="middle">enzymes</text>
  
  <path d="M640,615 L670,615" stroke="#000000" stroke-width="1.5" fill="none" stroke-dasharray="5,5"/>
  <text x="700" y="620" font-family="Arial" font-size="12" text-anchor="middle">alternative pathway</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Pathway labels -->
  <text x="400" y="130" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#8B4513">PHOSPHATIDYLINOSITOL PATHWAY</text>
  <line x1="150" y1="135" x2="650" y2="135" stroke="#8B4513" stroke-width="1" stroke-dasharray="2,2"/>
  
  <text x="400" y="420" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#8B4513">INOSITOL PHOSPHATE PATHWAY</text>
  <line x1="150" y1="425" x2="650" y2="425" stroke="#8B4513" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Membrane label -->
  <text x="65" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#8B4513" font-weight="bold">Plasma</text>
  <text x="65" y="195" font-family="Arial" font-size="12" text-anchor="middle" fill="#8B4513" font-weight="bold">Membrane</text>
</svg>