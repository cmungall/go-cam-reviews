<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">LGALS1-CD69 Pathway in Negative Regulation of T-helper 17 Cell Lineage</text>
  
  <!-- Dendritic Cell -->
  <ellipse cx="250" cy="300" rx="150" ry="180" fill="#e6f2ff" stroke="#2c3e50" stroke-width="2" />
  <text x="250" y="450" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Dendritic Cell</text>
  
  <!-- T Cell -->
  <ellipse cx="550" cy="300" rx="150" ry="180" fill="#ffebcc" stroke="#2c3e50" stroke-width="2" />
  <text x="550" y="450" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">T Cell</text>
  
  <!-- Cell membranes -->
  <path d="M 100,300 A 150,180 0 0 1 250,120 A 150,180 0 0 1 400,300" fill="none" stroke="#2c3e50" stroke-width="2.5" />
  <path d="M 400,300 A 150,180 0 0 1 250,480 A 150,180 0 0 1 100,300" fill="none" stroke="#2c3e50" stroke-width="2.5" />
  <path d="M 400,300 A 150,180 0 0 1 550,120 A 150,180 0 0 1 700,300" fill="none" stroke="#2c3e50" stroke-width="2.5" />
  <path d="M 700,300 A 150,180 0 0 1 550,480 A 150,180 0 0 1 400,300" fill="none" stroke="#2c3e50" stroke-width="2.5" />
  
  <!-- T Cell Nucleus -->
  <circle cx="550" cy="300" r="50" fill="#ffce99" stroke="#2c3e50" stroke-width="1.5" />
  <text x="550" y="300" font-family="Arial" font-size="12" text-anchor="middle">Nucleus</text>
  
  <!-- LGALS1 (Galectin-1) -->
  <rect x="220" y="200" width="80" height="30" rx="5" fill="#4caf50" stroke="#2c3e50" stroke-width="1.5" />
  <text x="260" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="white">LGALS1</text>
  
  <!-- CD69 Receptor -->
  <rect x="490" y="200" width="60" height="30" rx="5" fill="#2196f3" stroke="#2c3e50" stroke-width="1.5" />
  <text x="520" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="white">CD69</text>
  
  <!-- JAK3 -->
  <rect x="500" y="260" width="60" height="30" rx="5" fill="#9c27b0" stroke="#2c3e50" stroke-width="1.5" />
  <text x="530" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="white">JAK3</text>
  
  <!-- STAT5A in cytoplasm -->
  <rect x="580" y="260" width="70" height="30" rx="5" fill="#ff9800" stroke="#2c3e50" stroke-width="1.5" />
  <text x="615" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="white">STAT5A</text>
  
  <!-- STAT5A in nucleus -->
  <rect x="550" y="330" width="70" height="30" rx="5" fill="#ff9800" stroke="#2c3e50" stroke-width="1.5" />
  <text x="585" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="white">STAT5A</text>
  
  <!-- Binding arrow from LGALS1 to CD69 -->
  <line x1="300" y1="215" x2="490" y2="215" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="395" y="200" font-family="Arial" font-size="12" text-anchor="middle">Receptor-ligand binding</text>
  
  <!-- Activation arrow from CD69 to JAK3 -->
  <line x1="520" y1="230" x2="520" y2="260" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="475" y="245" font-family="Arial" font-size="11" text-anchor="middle">Activates</text>
  
  <!-- JAK3 to STAT5A phosphorylation -->
  <line x1="560" y1="275" x2="580" y2="275" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="570" y="260" font-family="Arial" font-size="11" text-anchor="middle">Phosphorylates</text>
  
  <!-- STAT5A translocation to nucleus -->
  <line x1="615" y1="290" x2="585" y2="330" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="625" y="310" font-family="Arial" font-size="11" text-anchor="middle">Translocates</text>
  
  <!-- Negative regulation annotation -->
  <rect x="300" y="500" width="200" height="30" rx="5" fill="#e74c3c" stroke="#2c3e50" stroke-width="1.5" />
  <text x="400" y="520" font-family="Arial" font-size="12" text-anchor="middle" font="bold" fill="white">Negative regulation of Th17 commitment</text>
  
  <!-- Arrow from STAT5A to biological process -->
  <path d="M 585,360 Q 585,430 400,500" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  
  <!-- Plasma membrane labels -->
  <text x="170" y="220" font-family="Arial" font-size="11" text-anchor="middle">Plasma membrane</text>
  <text x="650" y="220" font-family="Arial" font-size="11" text-anchor="middle">Plasma membrane</text>
  
  <!-- Subcellular localization -->
  <text x="460" y="275" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">Cytoplasmic side of</text>
  <text x="460" y="287" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">plasma membrane</text>
  
  <!-- Legend -->
  <rect x="20" y="520" width="200" height="70" rx="5" fill="white" stroke="#2c3e50" stroke-width="1" />
  <text x="120" y="535" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Legend</text>
  
  <rect x="30" y="545" width="15" height="15" fill="#4caf50" />
  <text x="52" y="558" font-family="Arial" font-size="11" text-anchor="start">LGALS1 (Galectin-1)</text>
  
  <rect x="30" y="565" width="15" height="15" fill="#2196f3" />
  <text x="52" y="578" font-family="Arial" font-size="11" text-anchor="start">CD69</text>
  
  <rect x="120" y="545" width="15" height="15" fill="#9c27b0" />
  <text x="142" y="558" font-family="Arial" font-size="11" text-anchor="start">JAK3</text>
  
  <rect x="120" y="565" width="15" height="15" fill="#ff9800" />
  <text x="142" y="578" font-family="Arial" font-size="11" text-anchor="start">STAT5A</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
</svg>