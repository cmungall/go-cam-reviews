<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell with nucleus -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f0f0f0" stroke="#888" stroke-width="2"/>
  <ellipse cx="400" cy="300" rx="250" ry="180" fill="#e0e8ff" stroke="#666" stroke-width="2"/>
  
  <!-- Labels for cell compartments -->
  <text x="150" y="150" font-family="Arial" font-size="18" font-weight="bold" fill="#666">Cytoplasm</text>
  <text x="400" y="160" font-family="Arial" font-size="18" font-weight="bold" fill="#666" text-anchor="middle">Nucleus</text>
  
  <!-- Proteins and interactions -->
  <!-- UL145 (viral protein) -->
  <rect x="280" y="250" width="60" height="30" rx="5" fill="#ff9999" stroke="#c00" stroke-width="2"/>
  <text x="310" y="270" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">UL145</text>
  
  <!-- DDB1 -->
  <rect x="400" y="280" width="60" height="30" rx="5" fill="#99cc99" stroke="#060" stroke-width="2"/>
  <text x="430" y="300" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">DDB1</text>
  
  <!-- CUL4A -->
  <rect x="480" y="320" width="60" height="30" rx="5" fill="#99cc99" stroke="#060" stroke-width="2"/>
  <text x="510" y="340" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">CUL4A</text>
  
  <!-- RBX1 -->
  <rect x="550" y="350" width="60" height="30" rx="5" fill="#99cc99" stroke="#060" stroke-width="2"/>
  <text x="580" y="370" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">RBX1</text>
  
  <!-- STAT2 -->
  <rect x="320" y="400" width="60" height="30" rx="5" fill="#99ccff" stroke="#006" stroke-width="2"/>
  <text x="350" y="420" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">STAT2</text>
  
  <!-- Action arrows -->
  <!-- UL145 promotes DDB1 function -->
  <path d="M340 265 L400 280" stroke="#c00" stroke-width="2.5" fill="none" marker-end="url(#arrowhead_promote)"/>
  <text x="360" y="260" font-family="Arial" font-size="14" fill="#c00" font-weight="bold">promotes</text>
  
  <!-- DDB1 to CUL4A binding -->
  <path d="M460 295 L480 320" stroke="#060" stroke-width="2.5" fill="none" marker-end="url(#arrowhead_bind)" stroke-dasharray="0"/>
  <text x="460" y="300" font-family="Arial" font-size="14" fill="#060" font-weight="bold">binds</text>
  
  <!-- CUL4A to RBX1 binding -->
  <path d="M540 335 L550 350" stroke="#060" stroke-width="2.5" fill="none" marker-end="url(#arrowhead_bind)" stroke-dasharray="0"/>
  <text x="540" y="330" font-family="Arial" font-size="14" fill="#060" font-weight="bold">binds</text>
  
  <!-- Ubiquitination complex to STAT2 -->
  <path d="M530 380 C 490 430, 400 440, 380 400" stroke="#c00" stroke-width="2.5" fill="none" marker-end="url(#arrowhead_ubq)" stroke-dasharray="5,3"/>
  <text x="460" y="430" font-family="Arial" font-size="14" fill="#c00" font-weight="bold">ubiquitinates</text>
  
  <!-- STAT2 degradation representation -->
  <path d="M320 430 L280 450" stroke="#c00" stroke-width="2.5" fill="none" marker-end="url(#arrowhead_degrade)" stroke-dasharray="5,3"/>
  <text x="270" y="465" font-family="Arial" font-size="14" fill="#c00" font-weight="bold">degradation</text>
  
  <!-- STAT2 function -->
  <rect x="200" y="350" width="120" height="40" rx="5" fill="#e6e6ff" stroke="#006" stroke-width="1.5"/>
  <text x="260" y="370" font-family="Arial" font-size="14" fill="#006" text-anchor="middle" font-weight="bold">Type I Interferon</text>
  <text x="260" y="385" font-family="Arial" font-size="14" fill="#006" text-anchor="middle" font-weight="bold">Signaling</text>
  
  <path d="M320 400 L270 390" stroke="#006" stroke-width="2.5" fill="none" marker-end="url(#arrowhead_activate)" stroke-dasharray="0"/>
  <text x="290" y="390" font-family="Arial" font-size="14" fill="#006" font-weight="bold">activates</text>
  
  <!-- Inhibition sign -->
  <line x1="290" y1="440" x2="250" y2="390" stroke="#c00" stroke-width="3" stroke-linecap="round"/>
  <circle cx="270" cy="415" r="15" fill="none" stroke="#c00" stroke-width="2.5"/>
  <text x="225" y="410" font-family="Arial" font-size="14" fill="#c00" font-weight="bold">inhibits</text>
  
  <!-- E3 Ubiquitin ligase complex label -->
  <path d="M520 300 C 580 310, 585 320, 540 360" stroke="#060" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <text x="585" y="330" font-family="Arial" font-size="14" fill="#060" font-weight="bold">E3 Ubiquitin</text>
  <text x="585" y="345" font-family="Arial" font-size="14" fill="#060" font-weight="bold">Ligase Complex</text>
  
  <!-- HCMV label -->
  <text x="240" y="240" font-family="Arial" font-size="14" fill="#c00" font-weight="bold">HCMV Viral</text>
  <text x="240" y="255" font-family="Arial" font-size="14" fill="#c00" font-weight="bold">Protein</text>
  
  <!-- Antiviral mechanism label -->
  <text x="140" y="335" font-family="Arial" font-size="14" fill="#006" font-weight="bold">Host Antiviral</text>
  <text x="140" y="350" font-family="Arial" font-size="14" fill="#006" font-weight="bold">Response</text>
  
  <!-- Title of the diagram -->
  <text x="400" y="50" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#000">HCMV-UL145 Inhibition of STAT2 via DDB1/CUL4A</text>
  <text x="400" y="80" font-family="Arial" font-size="18" text-anchor="middle" fill="#666">Human Cytomegalovirus Immune Evasion Mechanism</text>
  
  <!-- Abbreviation explanations -->
  <text x="400" y="530" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#666">HCMV: Human Cytomegalovirus; UL145: Unique Long 145 viral gene product;</text>
  <text x="400" y="550" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#666">STAT2: Signal Transducer and Activator of Transcription 2</text>
  
  <!-- Arrowhead definitions -->
  <defs>
    <marker id="arrowhead_promote" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c00"/>
    </marker>
    <marker id="arrowhead_bind" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#060"/>
    </marker>
    <marker id="arrowhead_ubq" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c00"/>
    </marker>
    <marker id="arrowhead_degrade" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c00"/>
    </marker>
    <marker id="arrowhead_activate" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="605" y="100" width="180" height="190" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="695" y="125" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
  
  <rect x="620" y="135" width="20" height="15" rx="3" fill="#ff9999" stroke="#c00" stroke-width="1.5"/>
  <text x="655" y="147" font-family="Arial" font-size="14" text-anchor="left">Viral protein</text>
  
  <rect x="620" y="160" width="20" height="15" rx="3" fill="#99cc99" stroke="#060" stroke-width="1.5"/>
  <text x="655" y="172" font-family="Arial" font-size="14" text-anchor="left">E3 ligase components</text>
  
  <rect x="620" y="185" width="20" height="15" rx="3" fill="#99ccff" stroke="#006" stroke-width="1.5"/>
  <text x="655" y="197" font-family="Arial" font-size="14" text-anchor="left">Transcription factor</text>
  
  <rect x="620" y="210" width="20" height="15" rx="3" fill="#e6e6ff" stroke="#006" stroke-width="1.5"/>
  <text x="655" y="222" font-family="Arial" font-size="14" text-anchor="left">Signaling pathway</text>
  
  <line x1="620" y1="235" x2="640" y2="235" stroke="#c00" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="655" y="240" font-family="Arial" font-size="14" text-anchor="left">Ubiquitination</text>
  
  <line x1="620" y1="255" x2="640" y2="255" stroke="#060" stroke-width="2.5" stroke-dasharray="0"/>
  <text x="655" y="260" font-family="Arial" font-size="14" text-anchor="left">Binding interaction</text>
  
  <circle cx="630" y="275" r="10" fill="none" stroke="#c00" stroke-width="2"/>
  <text x="655" y="280" font-family="Arial" font-size="14" text-anchor="left">Inhibition</text>
</svg>