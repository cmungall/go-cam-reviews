<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Protein Import into Peroxisomes of PTS1-containing Proteins (S. cerevisiae)</text>
  
  <!-- Cytosol background -->
  <rect x="50" y="80" width="700" height="220" fill="#e6f7ff" rx="5" ry="5"/>
  <text x="100" y="110" font-family="Arial" font-size="16" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Peroxisome -->
  <ellipse cx="400" cy="420" rx="300" ry="150" fill="#ffe6cc" stroke="#ff9933" stroke-width="3"/>
  <text x="400" y="320" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Peroxisomal Membrane (GO:0005778)</text>
  
  <!-- Peroxisomal matrix -->
  <ellipse cx="400" cy="430" rx="250" ry="110" fill="#fff2cc" stroke="#d6b656" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="400" y="430" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Peroxisomal Matrix (GO:0005782)</text>
  
  <!-- Step 1: PEX5 binding cargo in cytosol -->
  <circle cx="150" cy="180" r="20" fill="#66b3ff" stroke="#004080" stroke-width="2"/>
  <text x="150" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="white">PEX5</text>
  <polygon points="180,170 200,180 180,190" fill="#ff8080" stroke="#990000" stroke-width="1"/>
  <text x="190" y="165" font-family="Arial" font-size="12" text-anchor="middle">PTS1</text>
  <text x="150" y="220" font-family="Arial" font-size="14" text-anchor="middle">PTS1 binding</text>
  <text x="150" y="238" font-family="Arial" font-size="14" text-anchor="middle">(GO:0005052)</text>
  
  <!-- Arrow 1 -->
  <path d="M 220,180 Q 250,150 280,180" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="250" y="155" font-family="Arial" font-size="12" fill="#0066cc">1</text>
  
  <!-- Step 2: PEX5-cargo complex docking -->
  <circle cx="300" cy="180" r="20" fill="#66b3ff" stroke="#004080" stroke-width="2"/>
  <polygon points="285,170 315,170 315,190 285,190" fill="#ff8080" stroke="#990000" stroke-width="1"/>
  <text x="300" y="230" font-family="Arial" font-size="14" text-anchor="middle">Docking via PEX14</text>
  <text x="300" y="248" font-family="Arial" font-size="14" text-anchor="middle">(GO:0016560)</text>
  
  <!-- Arrow 2 -->
  <path d="M 320,200 Q 350,230 370,270" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="350" y="240" font-family="Arial" font-size="12" fill="#0066cc">2</text>
  
  <!-- Step 3: Translocation through membrane -->
  <rect x="350" y="290" width="40" height="30" fill="#99cc00" stroke="#4d6600" stroke-width="2"/>
  <text x="370" y="310" font-family="Arial" font-size="10" text-anchor="middle" fill="white">CPX</text>
  <text x="370" y="350" font-family="Arial" font-size="14" text-anchor="middle">Translocation</text>
  <text x="370" y="368" font-family="Arial" font-size="14" text-anchor="middle">(GO:0016561)</text>
  
  <!-- Arrow 3 -->
  <path d="M 390,320 Q 410,360 430,390" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="410" y="360" font-family="Arial" font-size="12" fill="#0066cc">3</text>
  
  <!-- Step 4: Cargo Release -->
  <circle cx="450" cy="410" r="20" fill="#66b3ff" stroke="#004080" stroke-width="2"/>
  <polygon points="470,400 490,410 470,420" fill="#ff8080" stroke="#990000" stroke-width="1"/>
  <text x="450" y="470" font-family="Arial" font-size="14" text-anchor="middle">Substrate Release</text>
  <text x="450" y="488" font-family="Arial" font-size="14" text-anchor="middle">(GO:0044721)</text>
  
  <!-- Arrow 4 -->
  <path d="M 470,410 Q 490,410 510,410" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="490" y="400" font-family="Arial" font-size="12" fill="#0066cc">4</text>
  
  <!-- Step 5: PEX5 Ubiquitination -->
  <circle cx="530" cy="410" r="20" fill="#66b3ff" stroke="#004080" stroke-width="2"/>
  <text x="530" y="415" font-family="Arial" font-size="12" text-anchor="middle" fill="white">PEX5</text>
  <text x="550" y="400" font-family="Arial" font-size="12" text-anchor="middle" fill="#7030a0">Ub</text>
  <text x="530" y="470" font-family="Arial" font-size="14" text-anchor="middle">Ubiquitination via PEX2</text>
  <text x="530" y="488" font-family="Arial" font-size="14" text-anchor="middle">(GO:0006513)</text>
  
  <!-- Arrow 5 -->
  <path d="M 550,410 Q 580,410 600,380" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="580" y="405" font-family="Arial" font-size="12" fill="#0066cc">5</text>
  
  <!-- Step 6: PEX5 Extraction and recycling -->
  <circle cx="620" cy="350" r="20" fill="#66b3ff" stroke="#004080" stroke-width="2"/>
  <text x="620" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="white">PEX5</text>
  <text x="640" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#7030a0">Ub</text>
  <text x="650" y="380" font-family="Arial" font-size="14" text-anchor="middle">Extraction/Recycling</text>
  <text x="650" y="398" font-family="Arial" font-size="14" text-anchor="middle">(GO:0016562)</text>
  
  <!-- Arrow 6 - Recycling back to cytosol -->
  <path d="M 630,330 Q 640,250 600,210" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="630" y="270" font-family="Arial" font-size="12" fill="#0066cc">6</text>
  
  <!-- PTS1 cargo in matrix -->
  <polygon points="520,430 540,440 520,450" fill="#ff8080" stroke="#990000" stroke-width="1"/>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="80" width="140" height="170" fill="white" stroke="#666" stroke-width="1"/>
  <text x="670" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="620" cy="120" r="10" fill="#66b3ff" stroke="#004080" stroke-width="2"/>
  <text x="680" y="125" font-family="Arial" font-size="12">PEX5</text>
  
  <polygon points="615,140 625,145 615,150" fill="#ff8080" stroke="#990000" stroke-width="1"/>
  <text x="670" y="148" font-family="Arial" font-size="12">PTS1 Cargo</text>
  
  <rect x="610" y="160" width="20" height="15" fill="#99cc00" stroke="#4d6600" stroke-width="2"/>
  <text x="675" y="172" font-family="Arial" font-size="12">Membrane Complex</text>
  
  <text x="620" y="192" font-family="Arial" font-size="12" fill="#7030a0">Ub</text>
  <text x="665" y="192" font-family="Arial" font-size="12">Ubiquitin</text>

  <path d="M 610,210 L 630,210" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="675" y="215" font-family="Arial" font-size="12">Process Flow</text>
</svg>