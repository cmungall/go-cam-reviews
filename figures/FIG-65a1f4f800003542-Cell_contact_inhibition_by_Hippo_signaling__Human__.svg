<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Membrane -->
  <rect x="50" y="100" width="700" height="450" rx="50" ry="50" fill="#f9f9f9" stroke="#888" stroke-width="3"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="400" rx="150" ry="100" fill="#e6f2ff" stroke="#6666ff" stroke-width="3"/>
  <text x="400" y="410" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">Nucleus</text>
  
  <!-- Cell-cell contact at membrane -->
  <path d="M50,150 Q30,170 50,190 Q70,210 50,230" stroke="#888" stroke-width="3" fill="none"/>
  <path d="M20,150 Q0,170 20,190 Q40,210 20,230" stroke="#888" stroke-width="3" fill="none"/>
  <text x="80" y="180" font-family="Arial" font-size="14" fill="#333">Cell-cell contact</text>
  
  <!-- Cytoplasm label -->
  <text x="200" y="150" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Cytoplasm</text>
  
  <!-- Pathway elements -->
  <!-- NF2 and WWC2 -->
  <circle cx="100" cy="250" r="25" fill="#80c1ff" stroke="#333" stroke-width="2"/>
  <text x="100" y="254" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">NF2</text>
  
  <circle cx="180" cy="250" r="25" fill="#80c1ff" stroke="#333" stroke-width="2"/>
  <text x="180" y="254" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">WWC2</text>
  
  <!-- SAV1 -->
  <circle cx="250" cy="250" r="25" fill="#ff9980" stroke="#333" stroke-width="2"/>
  <text x="250" y="254" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">SAV1</text>
  
  <!-- STK3 -->
  <circle cx="330" cy="250" r="25" fill="#ffcc80" stroke="#333" stroke-width="2"/>
  <text x="330" y="254" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">STK3</text>
  
  <!-- LATS2 -->
  <circle cx="410" cy="250" r="25" fill="#ffcc80" stroke="#333" stroke-width="2"/>
  <text x="410" y="254" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">LATS2</text>
  
  <!-- YAP1 in cytoplasm -->
  <circle cx="500" cy="250" r="25" fill="#b3ff99" stroke="#333" stroke-width="2"/>
  <text x="500" y="254" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">YAP1</text>
  <circle cx="510" cy="240" r="5" fill="#ff6666" stroke="none"/>
  <text x="510" y="240" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">P</text>
  
  <!-- YWHAB -->
  <circle cx="580" cy="250" r="25" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="580" y="254" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">YWHAB</text>
  
  <!-- YAP1-YWHAB complex -->
  <circle cx="540" cy="330" r="30" fill="#e6e6e6" stroke="#333" stroke-width="2"/>
  <text x="540" y="325" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">YAP1</text>
  <text x="540" y="340" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">YWHAB</text>
  
  <!-- YAP1 in nucleus -->
  <circle cx="400" cy="350" r="25" fill="#b3ff99" stroke="#333" stroke-width="2"/>
  <text x="400" y="354" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">YAP1</text>
  
  <!-- Connecting arrows - all with consistent styling -->
  <!-- NF2 to SAV1 -->
  <path d="M125,250 L225,250" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="170" y="240" font-family="Arial" font-size="12" fill="#333">+</text>
  
  <!-- WWC2 to STK3 -->
  <path d="M205,250 L305,250" stroke="#333" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="255" y="240" font-family="Arial" font-size="12" fill="#333">+</text>
  
  <!-- SAV1 to STK3 -->
  <path d="M275,250 L305,250" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="290" y="240" font-family="Arial" font-size="12" fill="#333">+</text>
  
  <!-- STK3 to LATS2 -->
  <path d="M355,250 L385,250" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="370" y="240" font-family="Arial" font-size="12" fill="#333">+</text>
  
  <!-- LATS2 to YAP1 (phosphorylation) -->
  <path d="M435,250 L475,250" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="455" y="240" font-family="Arial" font-size="12" fill="#333">P</text>
  
  <!-- YAP1 to YWHAB -->
  <path d="M525,250 L555,250" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- YAP1 and YWHAB to complex -->
  <path d="M530,275 L535,305" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M570,275 L555,305" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- YAP1 to nucleus -->
  <path d="M475,260 Q430,300 400,325" stroke="#333" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="440" y="300" font-family="Arial" font-size="12" fill="#333">translocation</text>
  
  <!-- Process labels with background boxes to improve legibility -->
  <rect x="120" y="290" width="210" height="25" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="125" y="308" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Hippo Signaling (GO:0035329)</text>
  
  <rect x="500" y="380" width="240" height="25" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="505" y="398" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Cytoplasmic Sequestering (GO:0051220)</text>
  
  <rect x="300" y="460" width="270" height="25" fill="white" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="305" y="478" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Transcription Coregulation (GO:0003712)</text>
  
  <!-- Title -->
  <rect x="150" y="50" width="500" height="40" fill="#fff" stroke="#333" stroke-width="1" rx="10" ry="10"/>
  <text x="400" y="75" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Cell Contact Inhibition by Hippo Signaling (Human)</text>
  
  <!-- Legend for protein functions -->
  <rect x="580" y="120" width="150" height="125" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="590" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend</text>
  
  <circle cx="600" cy="160" r="8" fill="#80c1ff" stroke="#333" stroke-width="1"/>
  <text x="615" y="165" font-family="Arial" font-size="12" fill="#333">Adaptor</text>
  
  <circle cx="600" cy="180" r="8" fill="#ff9980" stroke="#333" stroke-width="1"/>
  <text x="615" y="185" font-family="Arial" font-size="12" fill="#333">Kinase activator</text>
  
  <circle cx="600" cy="200" r="8" fill="#ffcc80" stroke="#333" stroke-width="1"/>
  <text x="615" y="205" font-family="Arial" font-size="12" fill="#333">Kinase</text>
  
  <circle cx="600" cy="220" r="8" fill="#b3ff99" stroke="#333" stroke-width="1"/>
  <text x="615" y="225" font-family="Arial" font-size="12" fill="#333">Coregulator</text>
  
  <circle cx="600" cy="240" r="8" fill="#cc99ff" stroke="#333" stroke-width="1"/>
  <text x="615" y="245" font-family="Arial" font-size="12" fill="#333">Sequestering</text>
  
  <!-- Note about GO terms -->
  <rect x="50" y="520" width="240" height="20" fill="#fff" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="55" y="535" font-family="Arial" font-size="10" fill="#333">GO: Gene Ontology terms for biological processes</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>