<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">
    Signaling by Calcitonin via CALCR-RAMP2 (AMYR2) Receptor Complex
  </text>
  
  <!-- Cell Membrane -->
  <rect x="100" y="200" width="600" height="40" fill="#e6e6e6" stroke="#000000" stroke-width="2" />
  <text x="130" y="225" font-family="Arial" font-size="16">Plasma membrane (GO:0005886)</text>
  
  <!-- Extracellular Space -->
  <rect x="100" y="80" width="600" height="120" fill="#f2f9ff" stroke="#000000" stroke-width="1" stroke-dasharray="5,5" />
  <text x="120" y="105" font-family="Arial" font-size="16" font-style="italic">Extracellular space (GO:0005615)</text>
  
  <!-- Cytosol -->
  <rect x="100" y="240" width="600" height="280" fill="#f9f9f9" stroke="#000000" stroke-width="1" stroke-dasharray="5,5" />
  <text x="120" y="265" font-family="Arial" font-size="16" font-style="italic">Cytosol (GO:0005829)</text>
  
  <!-- CALCA -->
  <circle cx="300" cy="140" r="30" fill="#ff9999" stroke="#000000" stroke-width="2" />
  <text x="300" y="143" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CALCA</text>
  <text x="300" y="160" font-family="Arial" font-size="12" text-anchor="middle">(P01258)</text>
  
  <!-- Receptor Complex -->
  <rect x="270" y="180" width="60" height="80" rx="5" ry="5" fill="#99ccff" stroke="#000000" stroke-width="2" />
  <text x="300" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CALCR</text>
  <text x="300" y="225" font-family="Arial" font-size="12" text-anchor="middle">(P30988)</text>
  
  <rect x="350" y="190" width="50" height="60" rx="5" ry="5" fill="#9999ff" stroke="#000000" stroke-width="2" />
  <text x="375" y="220" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RAMP2</text>
  <text x="375" y="237" font-family="Arial" font-size="12" text-anchor="middle">(O60895)</text>
  
  <!-- G protein -->
  <circle cx="300" cy="300" r="35" fill="#ffcc99" stroke="#000000" stroke-width="2" />
  <text x="300" y="295" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">G protein</text>
  <text x="300" y="315" font-family="Arial" font-size="14" text-anchor="middle">GNAS</text>
  <text x="300" y="332" font-family="Arial" font-size="12" text-anchor="middle">(Q5JWF2)</text>
  
  <!-- Adenylate cyclase -->
  <rect x="270" y="360" width="70" height="70" rx="10" ry="10" fill="#99ff99" stroke="#000000" stroke-width="2" />
  <text x="305" y="380" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ADCY6</text>
  <text x="305" y="400" font-family="Arial" font-size="12" text-anchor="middle">(O43306)</text>
  <text x="305" y="417" font-family="Arial" font-size="12" text-anchor="middle">adenylate cyclase</text>
  
  <!-- cAMP -->
  <circle cx="300" cy="480" r="28" fill="#ffff99" stroke="#000000" stroke-width="2" />
  <text x="300" y="485" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">cAMP</text>
  
  <!-- Define arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Arrows with numbered steps -->
  <line x1="300" y1="170" x2="300" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <circle cx="315" y="175" r="12" fill="white" stroke="black" stroke-width="1"/>
  <text x="315" y="179" font-family="Arial" font-size="14" text-anchor="middle">1</text>
  
  <line x1="325" y1="220" x2="345" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <circle cx="335" y="205" r="12" fill="white" stroke="black" stroke-width="1"/>
  <text x="335" y="209" font-family="Arial" font-size="14" text-anchor="middle">2</text>
  
  <line x1="300" y1="260" x2="300" y2="265" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <circle cx="315" y="262" r="12" fill="white" stroke="black" stroke-width="1"/>
  <text x="315" y="266" font-family="Arial" font-size="14" text-anchor="middle">3</text>
  
  <line x1="300" y1="335" x2="300" y2="360" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <circle cx="315" y="347" r="12" fill="white" stroke="black" stroke-width="1"/>
  <text x="315" y="351" font-family="Arial" font-size="14" text-anchor="middle">4</text>
  
  <line x1="300" y1="430" x2="300" y2="452" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <circle cx="315" y="441" r="12" fill="white" stroke="black" stroke-width="1"/>
  <text x="315" y="445" font-family="Arial" font-size="14" text-anchor="middle">5</text>
  
  <!-- Process labels -->
  <text x="410" y="150" font-family="Arial" font-size="14">1. Hormone activity (GO:0005179)</text>
  <text x="410" y="215" font-family="Arial" font-size="14">2. Calcitonin receptor activity (GO:0097642)</text>
  <text x="410" y="240" font-family="Arial" font-size="14">   Coreceptor activity (GO:0015026)</text>
  <text x="410" y="305" font-family="Arial" font-size="14">3. G protein activity (GO:0003925)</text>
  <text x="410" y="390" font-family="Arial" font-size="14">4. Adenylate cyclase activity (GO:0004016)</text>
  <text x="410" y="480" font-family="Arial" font-size="14">5. Cyclic AMP (CHEBI:17489)</text>
  
  <!-- Pathway name -->
  <text x="400" y="530" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">
    Adenylate cyclase-activating G protein-coupled receptor signaling pathway (GO:0007189)
  </text>
  <text x="400" y="555" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">
    Amylin receptor 2 signaling pathway (GO:0150060)
  </text>
  
  <!-- Legend -->
  <rect x="100" y="570" width="600" height="70" fill="#f5f5f5" stroke="#000000" stroke-width="1"/>
  <text x="110" y="590" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  
  <circle cx="140" cy="610" r="10" fill="#ff9999" stroke="#000000" stroke-width="1"/>
  <text x="155" y="615" font-family="Arial" font-size="14">Hormone</text>
  
  <rect x="220" y="600" width="20" height="20" rx="3" ry="3" fill="#99ccff" stroke="#000000" stroke-width="1"/>
  <text x="245" y="615" font-family="Arial" font-size="14">Receptor</text>
  
  <rect x="320" y="600" width="20" height="20" rx="3" ry="3" fill="#9999ff" stroke="#000000" stroke-width="1"/>
  <text x="345" y="615" font-family="Arial" font-size="14">Coreceptor</text>
  
  <circle cx="420" cy="610" r="10" fill="#ffcc99" stroke="#000000" stroke-width="1"/>
  <text x="435" y="615" font-family="Arial" font-size="14">G protein</text>
  
  <rect x="500" y="600" width="20" height="20" rx="5" ry="5" fill="#99ff99" stroke="#000000" stroke-width="1"/>
  <text x="525" y="615" font-family="Arial" font-size="14">Enzyme</text>
  
  <circle cx="590" cy="610" r="10" fill="#ffff99" stroke="#000000" stroke-width="1"/>
  <text x="605" y="615" font-family="Arial" font-size="14">Second messenger</text>
</svg>