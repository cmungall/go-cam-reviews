<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="2" opacity="0.8"/>
  <text x="400" y="85" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Human Cell</text>

  <!-- Cytoplasm label -->
  <text x="400" y="115" font-family="Arial" font-size="16" text-anchor="middle" fill="#555">Cytoplasm (GO:0005737)</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="600" cy="350" rx="120" ry="80" fill="#f5deb3" stroke="#333" stroke-width="2" opacity="0.8"/>
  <path d="M530 330 Q600 310 670 330 Q600 370 530 330" fill="#e6c9a8" stroke="#333" stroke-width="1"/>
  <text x="600" y="290" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Mitochondrial Membrane</text>
  <text x="600" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">(GO:0031966)</text>

  <!-- Proteins and their interactions -->
  <!-- NT5C2 -->
  <circle cx="160" cy="200" r="35" fill="#b3d9ff" stroke="#333" stroke-width="2"/>
  <text x="160" y="203" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">NT5C2</text>
  <text x="160" y="223" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">(P49902)</text>
  
  <!-- TRIM22 -->
  <circle cx="160" cy="380" r="35" fill="#ffb3b3" stroke="#333" stroke-width="2"/>
  <text x="160" y="383" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">TRIM22</text>
  <text x="160" y="403" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">(Q8IYM9)</text>
  
  <!-- RIGI -->
  <rect x="300" y="280" width="70" height="40" rx="10" ry="10" fill="#b3ffb3" stroke="#333" stroke-width="2"/>
  <text x="335" y="305" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">RIGI</text>
  <text x="335" y="320" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">(O95786)</text>
  
  <!-- MAVS -->
  <rect x="550" y="350" width="70" height="40" rx="10" ry="10" fill="#ffffb3" stroke="#333" stroke-width="2"/>
  <text x="585" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">MAVS</text>
  <text x="585" y="390" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">(Q7Z434)</text>
  
  <!-- Pathway arrows and labels -->
  <!-- NT5C2 to RIGI (inhibition) -->
  <path d="M195 200 C240 200 280 270 300 280" fill="none" stroke="#ff0000" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="230" y="230" font-family="Arial" font-size="13" fill="#333" transform="rotate(-15, 230, 230)">K48-linked</text>
  <text x="230" y="245" font-family="Arial" font-size="13" fill="#333" transform="rotate(-15, 230, 245)">ubiquitination</text>
  <text x="230" y="260" font-family="Arial" font-size="13" font-weight="bold" fill="#ff0000" transform="rotate(-15, 230, 260)">INHIBITS</text>
  
  <!-- TRIM22 to RIGI (activation) -->
  <path d="M195 380 C240 380 280 310 300 300" fill="none" stroke="#00aa00" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="230" y="350" font-family="Arial" font-size="13" fill="#333" transform="rotate(15, 230, 350)">K63-linked</text>
  <text x="230" y="365" font-family="Arial" font-size="13" fill="#333" transform="rotate(15, 230, 365)">ubiquitination</text>
  <text x="230" y="380" font-family="Arial" font-size="13" font-weight="bold" fill="#00aa00" transform="rotate(15, 230, 380)">ACTIVATES</text>
  
  <!-- RIGI to MAVS -->
  <path d="M370 300 C430 300 480 350 550 360" fill="none" stroke="#00aa00" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="440" y="320" font-family="Arial" font-size="13" font-weight="bold" fill="#00aa00">ACTIVATES</text>
  <text x="440" y="335" font-family="Arial" font-size="13" fill="#333">signaling</text>
  
  <!-- Process label -->
  <rect x="300" y="450" width="200" height="60" rx="15" ry="15" fill="#e6e6ff" stroke="#333" stroke-width="1"/>
  <text x="400" y="475" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Antiviral Innate</text>
  <text x="400" y="495" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Immune Response</text>
  <text x="400" y="510" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">(GO:0140374)</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00aa00"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff0000"/>
    </marker>
  </defs>
  
  <!-- Legends for molecular functions -->
  <text x="80" y="470" font-family="Arial" font-size="13" fill="#333">NT5C2: E3 ubiquitin ligase activity (GO:0061630)</text>
  <text x="80" y="490" font-family="Arial" font-size="13" fill="#333">TRIM22: E3 ubiquitin ligase activity (GO:0061630)</text>
  <text x="80" y="510" font-family="Arial" font-size="13" fill="#333">RIGI: Pattern recognition receptor activity (GO:0038187)</text>
  <text x="80" y="530" font-family="Arial" font-size="13" fill="#333">MAVS: Signaling adaptor activity (GO:0035591)</text>
</svg>