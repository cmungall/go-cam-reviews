<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Background -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="400" y="90" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Glycogen Catabolic Process (Drosophila melanogaster)</text>
  
  <!-- Cytosol Label -->
  <rect x="70" y="120" width="120" height="30" rx="5" ry="5" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
  <text x="130" y="140" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Cytosol (GO:0005829)</text>
  
  <!-- Molecules and Enzymes -->
  <!-- Glycogen -->
  <polygon points="150,250 170,230 190,230 210,250 190,270 170,270" fill="#ffd699" stroke="#333" stroke-width="2"/>
  <text x="180" y="255" font-family="Arial" font-size="16" text-anchor="middle">Glycogen</text>
  <text x="180" y="275" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(CHEBI:28087)</text>
  
  <!-- Glyp enzyme -->
  <rect x="250" y="220" width="120" height="60" rx="15" ry="15" fill="#b3e0a7" stroke="#333" stroke-width="2"/>
  <text x="310" y="245" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Glyp</text>
  <text x="310" y="265" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(FB:FBgn0004507)</text>
  <text x="310" y="280" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">glycogen phosphorylase</text>
  
  <!-- Alpha-D-glucose 1-phosphate -->
  <circle cx="430" cy="250" r="40" fill="#c8dbff" stroke="#333" stroke-width="2"/>
  <text x="430" y="240" font-family="Arial" font-size="14" text-anchor="middle">α-D-glucose</text>
  <text x="430" y="260" font-family="Arial" font-size="14" text-anchor="middle">1-phosphate</text>
  <text x="430" y="275" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(CHEBI:58601)</text>
  
  <!-- Agl enzyme (top function) -->
  <rect x="380" y="330" width="120" height="60" rx="15" ry="15" fill="#b3e0a7" stroke="#333" stroke-width="2"/>
  <text x="440" y="350" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Agl</text>
  <text x="440" y="370" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(FB:FBgn0034618)</text>
  <text x="440" y="385" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">4-α-glucanotransferase</text>
  
  <!-- Agl enzyme (bottom function) -->
  <rect x="530" y="330" width="120" height="60" rx="15" ry="15" fill="#b3e0a7" stroke="#333" stroke-width="2"/>
  <text x="590" y="350" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Agl</text>
  <text x="590" y="370" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(FB:FBgn0034618)</text>
  <text x="590" y="385" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">amylo-α-1,6-glucosidase</text>
  
  <!-- D-glucopyranose -->
  <circle cx="590" cy="250" r="40" fill="#c8dbff" stroke="#333" stroke-width="2"/>
  <text x="590" y="250" font-family="Arial" font-size="14" text-anchor="middle">D-glucopyranose</text>
  <text x="590" y="270" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(CHEBI:4167)</text>
  
  <!-- Pgm1 enzyme -->
  <rect x="530" y="420" width="120" height="60" rx="15" ry="15" fill="#b3e0a7" stroke="#333" stroke-width="2"/>
  <text x="590" y="440" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pgm1</text>
  <text x="590" y="460" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(FB:FBgn0003076)</text>
  <text x="590" y="475" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">phosphoglucomutase</text>
  
  <!-- Alpha-D-glucose 6-phosphate -->
  <circle cx="430" cy="450" r="40" fill="#c8dbff" stroke="#333" stroke-width="2"/>
  <text x="430" y="440" font-family="Arial" font-size="14" text-anchor="middle">α-D-glucose</text>
  <text x="430" y="460" font-family="Arial" font-size="14" text-anchor="middle">6-phosphate</text>
  <text x="430" y="475" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(CHEBI:58225)</text>
  
  <!-- Process box -->
  <rect x="150" y="500" width="500" height="40" rx="10" ry="10" fill="#e6e6fa" stroke="#333" stroke-width="2"/>
  <text x="400" y="525" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic">Glycogen Catabolic Process (GO:0005980)</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Glycogen to Glyp -->
  <line x1="210" y1="250" x2="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Glyp to Alpha-D-glucose 1-phosphate -->
  <line x1="370" y1="250" x2="390" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Alpha-D-glucose 1-phosphate to Agl -->
  <line x1="430" y1="290" x2="430" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Agl to D-glucopyranose -->
  <line x1="590" y1="330" x2="590" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- D-glucopyranose to Pgm1 (conceptual relationship arrow) -->
  <path d="M 590,290 Q 650,350 590,420" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Agl (first function) to Agl (second function) -->
  <path d="M 500,360 Q 515,360 530,360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Pgm1 to Alpha-D-glucose 6-phosphate -->
  <line x1="530" y1="450" x2="470" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Alpha-D-glucose 1-phosphate to Pgm1 -->
  <path d="M 430,290 Q 380,370 530,440" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Legend -->
  <rect x="570" y="110" width="160" height="130" fill="white" stroke="#333" stroke-width="1"/>
  <text x="650" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="580" y="140" width="20" height="20" fill="#b3e0a7" stroke="#333" stroke-width="1"/>
  <text x="615" y="155" font-family="Arial" font-size="14" text-anchor="start">Enzyme</text>
  
  <circle cx="590" cy="175" r="10" fill="#c8dbff" stroke="#333" stroke-width="1"/>
  <text x="615" y="180" font-family="Arial" font-size="14" text-anchor="start">Metabolite</text>
  
  <polygon points="580,195 590,185 600,185 610,195 600,205 590,205" fill="#ffd699" stroke="#333" stroke-width="1"/>
  <text x="625" y="200" font-family="Arial" font-size="14" text-anchor="start">Glycogen</text>
  
  <line x1="580" y1="215" x2="600" y2="215" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="625" y="220" font-family="Arial" font-size="14" text-anchor="start">Reaction</text>
  
  <line x1="580" y1="235" x2="600" y2="235" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="625" y="240" font-family="Arial" font-size="14" text-anchor="start">Indirect</text>
</svg>