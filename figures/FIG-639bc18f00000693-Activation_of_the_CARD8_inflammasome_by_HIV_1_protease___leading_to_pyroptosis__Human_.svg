<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  
  <!-- Plasma membrane -->
  <path d="M 50,350 H 750" stroke="#333" stroke-width="4" fill="none"/>
  <text x="60" y="370" font-family="Arial" font-size="14" fill="#333">Plasma membrane (GO:0005886)</text>
  
  <!-- Cytoplasm label -->
  <text x="60" y="320" font-family="Arial" font-size="14" fill="#333">Cytoplasm (GO:0005737)</text>
  
  <!-- Cytosol label -->
  <text x="60" y="290" font-family="Arial" font-size="14" fill="#333">Cytosol (GO:0005829)</text>
  
  <!-- HIV-1 protease -->
  <circle cx="200" cy="150" r="40" fill="#FF9999" stroke="#333" stroke-width="2"/>
  <text x="200" y="145" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#333">HIV-1 protease</text>
  <text x="200" y="165" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333">P04585</text>
  <text x="200" y="180" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="#333">GO:0004190</text>
  
  <!-- CARD8 -->
  <rect x="300" y="220" width="80" height="40" rx="5" ry="5" fill="#99CCFF" stroke="#333" stroke-width="2"/>
  <text x="340" y="240" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#333">CARD8</text>
  <text x="340" y="255" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333">Q9Y2G2</text>
  
  <!-- CARD8 Inflammasome -->
  <circle cx="450" y="250" r="40" fill="#99CCFF" stroke="#333" stroke-width="2"/>
  <text x="450" y="245" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#333">CARD8</text>
  <text x="450" y="265" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333">Inflammasome</text>
  
  <!-- Caspase-1 inactive -->
  <rect x="550" y="200" width="80" height="40" rx="5" ry="5" fill="#FFCC99" stroke="#333" stroke-width="2"/>
  <text x="590" y="220" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#333">Pro-Caspase-1</text>
  <text x="590" y="235" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333">P29466</text>
  
  <!-- Caspase-1 active -->
  <rect x="550" y="280" width="80" height="40" rx="5" ry="5" fill="#FF9966" stroke="#333" stroke-width="2"/>
  <text x="590" y="300" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#333">Active Caspase-1</text>
  <text x="590" y="315" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333">P29466</text>
  
  <!-- GSDMD inactive -->
  <ellipse cx="450" cy="350" rx="40" ry="20" fill="#CCFF99" stroke="#333" stroke-width="2"/>
  <text x="450" y="355" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#333">GSDMD</text>
  
  <!-- GSDMD cleaved -->
  <path d="M 400,400 A 40,20 0 0 1 500,400" fill="#CCFF99" stroke="#333" stroke-width="2"/>
  <text x="450" y="410" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#333">N-GSDMD</text>
  <text x="450" y="425" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333">P57764</text>
  
  <!-- GSDMD pores -->
  <circle cx="350" y="450" r="15" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="400" y="450" r="15" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="450" y="450" r="15" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="500" y="450" r="15" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="550" y="450" r="15" fill="none" stroke="#333" stroke-width="2"/>
  <text x="450" y="480" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">GSDMD Pores (GO:0022829)</text>
  
  <!-- Pyroptosis -->
  <text x="400" y="520" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#FF0000">Pyroptotic Cell Death (GO:0141201)</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Pathway arrows -->
  <path d="M 230,170 L 290,220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="240" y="185" font-family="Arial" font-size="12" fill="#333">Cleaves</text>
  <text x="230" y="200" font-family="Arial" font-size="10" fill="#333">(Aspartic-type endopeptidase)</text>
  
  <path d="M 380,240 L 410,250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="385" y="225" font-family="Arial" font-size="12" fill="#333">Assembles</text>
  <text x="375" y="240" font-family="Arial" font-size="10" fill="#333">(GO:0140633)</text>
  
  <path d="M 490,250 L 540,240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="505" y="235" font-family="Arial" font-size="12" fill="#333">Activates</text>
  <text x="495" y="250" font-family="Arial" font-size="10" fill="#333">(GO:0140608)</text>
  
  <path d="M 590,240 L 590,280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="605" y="260" font-family="Arial" font-size="12" fill="#333">Maturation</text>
  <text x="600" y="275" font-family="Arial" font-size="10" fill="#333">(GO:0051604)</text>
  
  <path d="M 550,300 L 490,340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="505" y="330" font-family="Arial" font-size="12" fill="#333">Cleaves</text>
  <text x="495" y="345" font-family="Arial" font-size="10" fill="#333">(GO:0004197)</text>
  
  <path d="M 450,370 L 450,390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="415" y="380" font-family="Arial" font-size="12" fill="#333">Cleavage</text>
  
  <path d="M 450,430 C 450,440 450,445 450,450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="470" y="440" font-family="Arial" font-size="12" fill="#333">Forms pores</text>
  <text x="475" y="455" font-family="Arial" font-size="10" fill="#333">(PI(4,5)P2 binding, GO:0005546)</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Activation of the CARD8 inflammasome by HIV-1 protease, leading to pyroptosis</text>
  
  <!-- Legend -->
  <rect x="580" y="80" width="160" height="105" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="620" y="95" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="610" y="110" r="5" fill="#FF9999"/>
  <text x="620" y="114" font-family="Arial" font-size="12">HIV-1 protease</text>
  
  <rect x="605" y="125" width="10" height="10" fill="#99CCFF"/>
  <text x="620" y="134" font-family="Arial" font-size="12">CARD8 proteins</text>
  
  <rect x="605" y="145" width="10" height="10" fill="#FFCC99"/>
  <text x="620" y="154" font-family="Arial" font-size="12">Pro-Caspase-1</text>
  
  <rect x="605" y="165" width="10" height="10" fill="#CCFF99"/>
  <text x="620" y="174" font-family="Arial" font-size="12">GSDMD</text>
</svg>