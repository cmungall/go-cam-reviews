<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Title -->
  <rect width="800" height="650" fill="white" />
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">CARD9 Regulation by TRIM62/USP15 (Human)</text>
  
  <!-- Cell Outline -->
  <rect x="50" y="70" width="700" height="510" rx="30" ry="30" fill="#f9f9f9" stroke="#333" stroke-width="2" />
  
  <!-- Plasma Membrane -->
  <rect x="50" y="70" width="700" height="60" rx="30" ry="30" fill="#D6EAF8" stroke="#333" stroke-width="2" />
  <text x="400" y="105" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytoplasm Label -->
  <text x="400" y="160" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Cytoplasm (GO:0005737)</text>
  
  <!-- CLEC7A (Pattern Recognition Receptor) -->
  <circle cx="150" cy="100" r="25" fill="#AED6F1" stroke="#333" stroke-width="2" />
  <text x="150" y="102" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">CLEC7A</text>
  <text x="150" y="115" font-family="Arial" font-size="8" text-anchor="middle">Pattern recognition</text>
  <text x="150" y="125" font-family="Arial" font-size="8" text-anchor="middle">receptor</text>

  <!-- CARD9 -->
  <rect x="270" y="250" width="80" height="40" rx="5" ry="5" fill="#F5CBA7" stroke="#333" stroke-width="2" />
  <text x="310" y="270" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">CARD9</text>
  <text x="310" y="282" font-family="Arial" font-size="8" text-anchor="middle">Signaling adaptor</text>
  
  <!-- Ubiquitinated CARD9 -->
  <rect x="270" y="350" width="80" height="40" rx="5" ry="5" fill="#F5CBA7" stroke="#333" stroke-width="2" />
  <text x="310" y="365" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">CARD9</text>
  <text x="310" y="378" font-family="Arial" font-size="8" text-anchor="middle">(K27-Ubiquitinated)</text>
  
  <!-- BCL10 -->
  <rect x="400" y="250" width="80" height="40" rx="5" ry="5" fill="#D5F5E3" stroke="#333" stroke-width="2" />
  <text x="440" y="270" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">BCL10</text>
  <text x="440" y="282" font-family="Arial" font-size="8" text-anchor="middle">Protein adaptor</text>
  
  <!-- MALT1 -->
  <rect x="530" y="250" width="80" height="40" rx="5" ry="5" fill="#FADBD8" stroke="#333" stroke-width="2" />
  <text x="570" y="270" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">MALT1</text>
  <text x="570" y="282" font-family="Arial" font-size="8" text-anchor="middle">Endopeptidase</text>
  
  <!-- TRIM62 -->
  <ellipse cx="200" y="350" rx="40" ry="25" fill="#D2B4DE" stroke="#333" stroke-width="2" />
  <text x="200" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">TRIM62</text>
  <text x="200" y="362" font-family="Arial" font-size="8" text-anchor="middle">E3 Ubiquitin ligase</text>
  
  <!-- USP15 -->
  <ellipse cx="400" y="350" rx="40" ry="25" fill="#AED6F1" stroke="#333" stroke-width="2" />
  <text x="400" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">USP15</text>
  <text x="400" y="362" font-family="Arial" font-size="8" text-anchor="middle">Deubiquitinase</text>
  
  <!-- NF-kappaB activation -->
  <polygon points="440,450 500,450 520,480 480,510 420,480" fill="#F9E79F" stroke="#333" stroke-width="2" />
  <text x="470" y="470" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">NF-κB</text>
  <text x="470" y="485" font-family="Arial" font-size="10" text-anchor="middle">activation</text>
  <text x="470" y="500" font-family="Arial" font-size="8" text-anchor="middle">GO:0043123</text>
  
  <!-- Arrows and Interactions -->
  <!-- CLEC7A to CARD9 -->
  <path d="M150,125 Q150,200 270,250" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="180" y="175" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Activates</text>
  <text x="180" y="187" font-family="Arial" font-size="9" text-anchor="middle">GO:0038187</text>
  
  <!-- CARD9 to BCL10 -->
  <path d="M350,270 L400,270" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="375" y="255" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Adaptor</text>
  <text x="375" y="267" font-family="Arial" font-size="9" text-anchor="middle">GO:0035591</text>
  
  <!-- BCL10 to MALT1 -->
  <path d="M480,270 L530,270" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="505" y="255" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Recruits</text>
  <text x="505" y="267" font-family="Arial" font-size="9" text-anchor="middle">GO:0030674</text>
  
  <!-- TRIM62 to CARD9 (ubiquitination) -->
  <path d="M240,350 L270,365" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="255" y="330" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Ubiquitinates</text>
  <text x="255" y="342" font-family="Arial" font-size="9" text-anchor="middle">GO:0061630</text>
  
  <!-- USP15 to CARD9 (deubiquitination) -->
  <path d="M360,350 L350,365" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="355" y="330" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Deubiquitinates</text>
  <text x="355" y="342" font-family="Arial" font-size="9" text-anchor="middle">GO:0004843</text>
  
  <!-- CARD9 to BCL10/MALT1 to NF-kappaB -->
  <path d="M310,390 Q310,430 440,470" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="360" y="425" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Positive regulation</text>
  <text x="360" y="437" font-family="Arial" font-size="9" text-anchor="middle">of NF-κB signaling</text>
  
  <!-- MALT1 to NF-kappaB -->
  <path d="M570,290 Q570,380 500,450" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="545" y="350" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Cleaves targets</text>
  <text x="545" y="363" font-family="Arial" font-size="9" text-anchor="middle">GO:0004175</text>
  
  <!-- Inhibitory arrow from ubiquitinated CARD9 -->
  <path d="M310,390 Q350,410 395,410 Q440,410 470,450" fill="none" stroke="red" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowhead_inhibit)" />
  <text x="390" y="395" font-family="Arial" font-size="10" text-anchor="middle" fill="red">Impaired signaling</text>
  
  <!-- Balance arrow between TRIM62 and USP15 -->
  <path d="M225,325 Q300,310 375,325" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="3,2" />
  <text x="300" y="310" font-family="Arial" font-size="10" text-anchor="middle">Regulatory balance</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead_inhibit" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="red" />
    </marker>
  </defs>
  
  <!-- Signal flow direction arrow -->
  <path d="M150,520 L620,520" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="10,4" marker-end="url(#arrowhead)" />
  <text x="380" y="540" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Signal Progression</text>
  
  <!-- Legend -->
  <rect x="600" y="100" width="140" height="240" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1" />
  <text x="670" y="120" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="620" y="140" r="10" fill="#AED6F1" stroke="#333" stroke-width="1" />
  <text x="685" y="144" font-family="Arial" font-size="11" text-anchor="middle">Pattern recognition receptor</text>
  
  <rect x="610" y="160" width="20" height="15" rx="3" ry="3" fill="#F5CBA7" stroke="#333" stroke-width="1" />
  <text x="680" y="170" font-family="Arial" font-size="11" text-anchor="middle">Signaling adaptor</text>
  
  <rect x="610" y="185" width="20" height="15" rx="3" ry="3" fill="#D5F5E3" stroke="#333" stroke-width="1" />
  <text x="680" y="195" font-family="Arial" font-size="11" text-anchor="middle">Protein adaptor</text>
  
  <ellipse cx="620" y="215" rx="10" ry="7" fill="#D2B4DE" stroke="#333" stroke-width="1" />
  <text x="680" y="218" font-family="Arial" font-size="11" text-anchor="middle">Ubiquitin ligase</text>
  
  <ellipse cx="620" y="240" rx="10" ry="7" fill="#AED6F1" stroke="#333" stroke-width="1" />
  <text x="680" y="243" font-family="Arial" font-size="11" text-anchor="middle">Deubiquitinase</text>
  
  <rect x="610" y="260" width="20" height="15" rx="3" ry="3" fill="#FADBD8" stroke="#333" stroke-width="1" />
  <text x="680" y="270" font-family="Arial" font-size="11" text-anchor="middle">Endopeptidase</text>
  
  <polygon points="610,285 630,285 635,295 620,305 605,295" fill="#F9E79F" stroke="#333" stroke-width="1" />
  <text x="680" y="295" font-family="Arial" font-size="11" text-anchor="middle">Transcription factor activation</text>
  
  <line x1="610" y1="315" x2="630" y2="315" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="680" y="318" font-family="Arial" font-size="11" text-anchor="middle">Activation</text>
  
  <line x1="610" y1="335" x2="630" y2="335" stroke="red" stroke-width="3" stroke-dasharray="5,3" />
  <text x="680" y="338" font-family="Arial" font-size="11" text-anchor="middle">Inhibition</text>
</svg>