<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">GMP Catabolic Process to Allantoin (Mouse)</text>
  
  <!-- Cytosol compartment -->
  <rect x="70" y="100" width="660" height="250" rx="15" ry="15" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="100" y="130" font-family="Arial" font-size="16" font-weight="bold" fill="#0066cc">Cytosol</text>
  
  <!-- Peroxisome compartment -->
  <rect x="70" y="380" width="660" height="150" rx="15" ry="15" fill="#ffe6e6" stroke="#cc0000" stroke-width="2"/>
  <text x="100" y="410" font-family="Arial" font-size="16" font-weight="bold" fill="#cc0000">Peroxisome</text>
  
  <!-- Pathway molecules and enzymes in Cytosol -->
  <!-- GMP -->
  <rect x="100" y="180" width="80" height="40" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="140" y="205" font-family="Arial" font-size="14" text-anchor="middle">GMP</text>
  
  <!-- Arrow 1 -->
  <line x1="180" y1="200" x2="220" y2="200" stroke="#333" stroke-width="2"/>
  <polygon points="220,200 215,195 215,205" fill="#333"/>
  
  <!-- Nt5c2 -->
  <ellipse cx="200" cy="170" rx="40" ry="20" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="200" y="175" font-family="Arial" font-size="14" text-anchor="middle">Nt5c2</text>
  
  <!-- Guanosine -->
  <rect x="230" y="180" width="80" height="40" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="270" y="205" font-family="Arial" font-size="12" text-anchor="middle">Guanosine</text>
  
  <!-- Arrow 2 -->
  <line x1="310" y1="200" x2="350" y2="200" stroke="#333" stroke-width="2"/>
  <polygon points="350,200 345,195 345,205" fill="#333"/>
  
  <!-- Pnp -->
  <ellipse cx="330" cy="170" rx="40" ry="20" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="330" y="175" font-family="Arial" font-size="14" text-anchor="middle">Pnp</text>
  
  <!-- Guanine -->
  <rect x="360" y="180" width="80" height="40" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="400" y="205" font-family="Arial" font-size="14" text-anchor="middle">Guanine</text>
  
  <!-- Arrow 3 -->
  <line x1="440" y1="200" x2="480" y2="200" stroke="#333" stroke-width="2"/>
  <polygon points="480,200 475,195 475,205" fill="#333"/>
  
  <!-- Gda -->
  <ellipse cx="460" cy="170" rx="40" ry="20" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="460" y="175" font-family="Arial" font-size="14" text-anchor="middle">Gda</text>
  
  <!-- Xanthine -->
  <rect x="490" y="180" width="80" height="40" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="530" y="205" font-family="Arial" font-size="14" text-anchor="middle">Xanthine</text>
  
  <!-- Arrow 4 -->
  <line x1="570" y1="200" x2="610" y2="200" stroke="#333" stroke-width="2"/>
  <polygon points="610,200 605,195 605,205" fill="#333"/>
  
  <!-- Xdh (two forms shown) -->
  <ellipse cx="590" cy="170" rx="40" ry="20" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="590" y="175" font-family="Arial" font-size="14" text-anchor="middle">Xdh</text>
  <text x="590" y="150" font-family="Arial" font-size="10" text-anchor="middle">(dehydrogenase/oxidase)</text>
  
  <!-- Uric Acid -->
  <rect x="620" y="180" width="80" height="40" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="660" y="205" font-family="Arial" font-size="14" text-anchor="middle">Uric Acid</text>
  
  <!-- Transport arrow to peroxisome -->
  <line x1="660" y1="220" x2="660" y2="320" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="660,320 655,315 665,315" fill="#333"/>
  <text x="680" y="270" font-family="Arial" font-size="12" font-style="italic">Transport</text>
  
  <!-- Pathway molecules and enzymes in Peroxisome -->
  <!-- Uric Acid in peroxisome -->
  <rect x="170" y="440" width="80" height="40" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="210" y="465" font-family="Arial" font-size="14" text-anchor="middle">Uric Acid</text>
  
  <!-- Arrow 5 -->
  <line x1="250" y1="460" x2="290" y2="460" stroke="#333" stroke-width="2"/>
  <polygon points="290,460 285,455 285,465" fill="#333"/>
  
  <!-- Uox -->
  <ellipse cx="270" cy="430" rx="40" ry="20" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="270" y="435" font-family="Arial" font-size="14" text-anchor="middle">Uox</text>
  
  <!-- 5-HIU -->
  <rect x="300" y="440" width="100" height="40" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="350" y="465" font-family="Arial" font-size="12" text-anchor="middle">5-Hydroxyisourate</text>
  
  <!-- Arrow 6 -->
  <line x1="400" y1="460" x2="440" y2="460" stroke="#333" stroke-width="2"/>
  <polygon points="440,460 435,455 435,465" fill="#333"/>
  
  <!-- Urah -->
  <ellipse cx="420" cy="430" rx="40" ry="20" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="420" y="435" font-family="Arial" font-size="14" text-anchor="middle">Urah</text>
  
  <!-- OHCU -->
  <rect x="450" y="440" width="100" height="40" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="500" y="460" font-family="Arial" font-size="12" text-anchor="middle">OHCU</text>
  <text x="500" y="475" font-family="Arial" font-size="8" text-anchor="middle">(2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline)</text>
  
  <!-- Arrow 7 -->
  <line x1="550" y1="460" x2="590" y2="460" stroke="#333" stroke-width="2"/>
  <polygon points="590,460 585,455 585,465" fill="#333"/>
  
  <!-- Urad -->
  <ellipse cx="570" cy="430" rx="40" ry="20" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="570" y="435" font-family="Arial" font-size="14" text-anchor="middle">Urad</text>
  
  <!-- Allantoin -->
  <rect x="600" y="440" width="80" height="40" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="640" y="465" font-family="Arial" font-size="14" text-anchor="middle">Allantoin</text>
  
  <!-- Legend -->
  <rect x="100" y="560" width="600" height="60" rx="5" ry="5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/>
  <text x="110" y="575" font-family="Arial" font-size="12" font-weight="bold">Legend:</text>
  
  <!-- Enzyme symbol -->
  <ellipse cx="130" cy="595" rx="20" ry="10" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="170" y="599" font-family="Arial" font-size="12">Enzyme</text>
  
  <!-- Metabolite symbol -->
  <rect x="220" y="585" width="40" height="20" rx="5" ry="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="290" y="599" font-family="Arial" font-size="12">Metabolite</text>
  
  <!-- Subcellular compartments -->
  <rect x="340" y="590" width="20" height="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="599" font-family="Arial" font-size="12">Cytosol</text>
  
  <rect x="450" y="590" width="20" height="10" fill="#ffe6e6" stroke="#cc0000" stroke-width="2"/>
  <text x="510" y="599" font-family="Arial" font-size="12">Peroxisome</text>
</svg>