<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Cell nucleus background -->
    <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Cell Nucleus</text>

    <!-- DNA double-strand break site -->
    <rect x="280" y="200" width="240" height="80" rx="10" ry="10" fill="#e6f2ff" stroke="#000" stroke-width="2"/>
    <text x="400" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Site of Double-Strand Break</text>
    
    <!-- DNA strand with break -->
    <path d="M 300 240 L 350 240 M 370 240 L 430 240 M 450 240 L 500 240" stroke="#4682b4" stroke-width="4"/>
    <path d="M 300 260 L 350 260 M 370 260 L 430 260 M 450 260 L 500 260" stroke="#4682b4" stroke-width="4"/>
    <path d="M 350 240 L 350 230 C 350 225, 360 225, 360 230 L 360 240" stroke="#ff0000" stroke-width="2" fill="none"/>
    <path d="M 370 240 L 370 230 C 370 225, 360 225, 360 230 L 360 240" stroke="#ff0000" stroke-width="2" fill="none"/>
    <path d="M 430 240 L 430 230 C 430 225, 440 225, 440 230 L 440 240" stroke="#ff0000" stroke-width="2" fill="none"/>
    <path d="M 450 240 L 450 230 C 450 225, 440 225, 440 230 L 440 240" stroke="#ff0000" stroke-width="2" fill="none"/>
    <path d="M 350 260 L 350 270 C 350 275, 360 275, 360 270 L 360 260" stroke="#ff0000" stroke-width="2" fill="none"/>
    <path d="M 370 260 L 370 270 C 370 275, 360 275, 360 270 L 360 260" stroke="#ff0000" stroke-width="2" fill="none"/>
    <path d="M 430 260 L 430 270 C 430 275, 440 275, 440 270 L 440 260" stroke="#ff0000" stroke-width="2" fill="none"/>
    <path d="M 450 260 L 450 270 C 450 275, 440 275, 440 270 L 440 260" stroke="#ff0000" stroke-width="2" fill="none"/>

    <!-- Initial DNA damage response -->
    <circle cx="200" cy="150" r="40" fill="#ff9999" stroke="#000" stroke-width="2"/>
    <text x="200" y="155" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">ATM</text>
    <text x="200" y="120" text-anchor="middle" font-family="Arial" font-size="12">DNA damage response</text>
    <text x="200" y="170" text-anchor="middle" font-family="Arial" font-size="10">Ser/Thr kinase</text>
    
    <!-- Arrow from ATM to CREBBP (Phosphorylation) -->
    <path d="M 230 175 C 260 190, 260 190, 290 190" stroke="#0066cc" stroke-width="2" fill="none" stroke-dasharray="5,2" marker-end="url(#phosphoArrow)"/>
    <text x="250" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#0066cc">Phosphorylates</text>
    
    <!-- CREBBP -->
    <rect x="290" y="170" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#000" stroke-width="2"/>
    <text x="330" y="195" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">CREBBP</text>
    <text x="330" y="165" text-anchor="middle" font-family="Arial" font-size="10">Lactyltransferase</text>
    
    <!-- KAT5 -->
    <rect x="430" y="170" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#000" stroke-width="2"/>
    <text x="470" y="195" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">KAT5</text>
    <text x="470" y="165" text-anchor="middle" font-family="Arial" font-size="10">Lactyltransferase</text>
    
    <!-- Arrow from ATM to KAT5 (Phosphorylation) -->
    <path d="M 230 140 C 350 120, 400 130, 430 170" stroke="#0066cc" stroke-width="2" fill="none" stroke-dasharray="5,2" marker-end="url(#phosphoArrow)"/>
    <text x="330" y="130" text-anchor="middle" font-family="Arial" font-size="10" fill="#0066cc">Phosphorylates</text>
    
    <!-- MRE11 at the damage site -->
    <circle cx="320" cy="280" r="30" fill="#ffcc99" stroke="#000" stroke-width="2"/>
    <text x="320" y="285" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">MRE11</text>
    <text x="320" y="300" text-anchor="middle" font-family="Arial" font-size="10">Endo/Exonuclease</text>
    
    <!-- NBN at the damage site -->
    <circle cx="480" cy="280" r="30" fill="#ffcc99" stroke="#000" stroke-width="2"/>
    <text x="480" y="285" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">NBN</text>
    <text x="480" y="300" text-anchor="middle" font-family="Arial" font-size="10">Chromatin-adaptor</text>
    
    <!-- Arrow from CREBBP to MRE11 showing lactylation -->
    <path d="M 320 210 L 320 250" stroke="#ff6600" stroke-width="2" fill="none" marker-end="url(#lactylArrow)"/>
    <text x="300" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#ff6600">Lactylation</text>
    
    <!-- Arrow from KAT5 to NBN showing lactylation -->
    <path d="M 480 210 L 480 250" stroke="#ff6600" stroke-width="2" fill="none" marker-end="url(#lactylArrow)"/>
    <text x="460" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#ff6600">Lactylation</text>
    
    <!-- MRE11 complex -->
    <path d="M 350 300 C 370 320, 430 320, 450 300" stroke="#996633" stroke-width="2" fill="none"/>
    <text x="400" y="335" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">MRE11 Complex</text>
    
    <!-- Arrow from MRE11 complex to ATM showing activation -->
    <path d="M 350 290 C 300 350, 200 350, 180 190" stroke="#009900" stroke-width="2" fill="none" marker-end="url(#activateArrow)"/>
    <text x="250" y="350" text-anchor="middle" font-family="Arial" font-size="10" fill="#009900">Activates</text>
    
    <!-- Downstream repair processes -->
    <rect x="320" y="380" width="160" height="60" rx="10" ry="10" fill="#ccffcc" stroke="#000" stroke-width="2"/>
    <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Double-Strand Break</text>
    <text x="400" y="425" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Repair via HR</text>
    
    <!-- Arrow from MRE11 complex to repair -->
    <path d="M 400 335 L 400 380" stroke="#009900" stroke-width="2" fill="none" marker-end="url(#activateArrow)"/>
    <text x="420" y="360" text-anchor="middle" font-family="Arial" font-size="10" fill="#009900">Promotes</text>
    
    <!-- DNA processing -->
    <rect x="180" y="400" width="120" height="40" rx="5" ry="5" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
    <text x="240" y="425" text-anchor="middle" font-family="Arial" font-size="12">DNA Processing</text>
    
    <!-- Arrow from MRE11 to DNA processing -->
    <path d="M 300 300 C 280 320, 240 360, 240 400" stroke="#990099" stroke-width="2" fill="none" marker-end="url(#catalyzeArrow)"/>
    <text x="265" y="360" text-anchor="middle" font-family="Arial" font-size="10" fill="#990099">Exonuclease</text>
    <text x="245" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#990099">activity</text>
    
    <!-- Protein localization -->
    <rect x="500" y="400" width="120" height="40" rx="5" ry="5" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
    <text x="560" y="425" text-anchor="middle" font-family="Arial" font-size="12">Protein Localization</text>
    
    <!-- Arrow from NBN to protein localization -->
    <path d="M 500 300 C 520 320, 560 360, 560 400" stroke="#663399" stroke-width="2" fill="none" marker-end="url(#localizeArrow)"/>
    <text x="570" y="360" text-anchor="middle" font-family="Arial" font-size="10" fill="#663399">Recruits</text>
    
    <!-- Legend -->
    <rect x="580" y="100" width="180" height="190" rx="5" ry="5" fill="white" stroke="#000" stroke-width="1"/>
    <text x="670" y="120" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
    <!-- Phosphorylation -->
    <line x1="590" y1="135" x2="620" y2="135" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,2"/>
    <polygon points="620,135 615,132 615,138" fill="#0066cc"/>
    <text x="680" y="140" font-family="Arial" font-size="10" fill="#0066cc">Phosphorylation</text>
    <text x="680" y="150" font-family="Arial" font-size="8" fill="#0066cc">(Addition of phosphate group)</text>
    <!-- Lactylation -->
    <line x1="590" y1="165" x2="620" y2="165" stroke="#ff6600" stroke-width="2"/>
    <polygon points="620,165 615,162 615,168" fill="#ff6600"/>
    <text x="680" y="170" font-family="Arial" font-size="10" fill="#ff6600">Lactylation</text>
    <text x="680" y="180" font-family="Arial" font-size="8" fill="#ff6600">(Addition of lactyl group)</text>
    <!-- Activation -->
    <line x1="590" y1="195" x2="620" y2="195" stroke="#009900" stroke-width="2"/>
    <polygon points="620,195 615,192 615,198" fill="#009900"/>
    <text x="680" y="200" font-family="Arial" font-size="10" fill="#009900">Activation</text>
    <text x="680" y="210" font-family="Arial" font-size="8" fill="#009900">(Stimulation of activity)</text>
    <!-- Catalysis -->
    <line x1="590" y1="225" x2="620" y2="225" stroke="#990099" stroke-width="2"/>
    <polygon points="620,225 615,222 615,228" fill="#990099"/>
    <text x="680" y="230" font-family="Arial" font-size="10" fill="#990099">Catalysis</text>
    <text x="680" y="240" font-family="Arial" font-size="8" fill="#990099">(Enzymatic reaction)</text>
    <!-- Recruitment -->
    <line x1="590" y1="255" x2="620" y2="255" stroke="#663399" stroke-width="2"/>
    <polygon points="620,255 615,252 615,258" fill="#663399"/>
    <text x="680" y="260" font-family="Arial" font-size="10" fill="#663399">Recruitment</text>
    <text x="680" y="270" font-family="Arial" font-size="8" fill="#663399">(Protein localization)</text>
    
    <!-- Defs for markers -->
    <defs>
        <marker id="phosphoArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#0066cc"/>
        </marker>
        <marker id="lactylArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#ff6600"/>
        </marker>
        <marker id="activateArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#009900"/>
        </marker>
        <marker id="catalyzeArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#990099"/>
        </marker>
        <marker id="localizeArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#663399"/>
        </marker>
    </defs>
</svg>