<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and cell structures -->
  <!-- Gut lumen -->
  <rect x="0" y="0" width="800" height="200" fill="#f9e7d2" opacity="0.5"/>
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold">Gut Lumen</text>
  
  <!-- Intestinal epithelial cell -->
  <rect x="0" y="200" width="800" height="400" fill="#e6f2ff" opacity="0.5"/>
  <text x="20" y="230" font-family="Arial" font-size="16" font-weight="bold">Intestinal Epithelial Cell (CL:0002563)</text>
  
  <!-- Nucleus -->
  <ellipse cx="500" cy="450" rx="150" ry="100" fill="#d9d9f3" stroke="#9999cc" stroke-width="2"/>
  <text x="480" y="440" font-family="Arial" font-size="16" font-weight="bold">Nucleus</text>
  <text x="456" y="460" font-family="Arial" font-size="12">(GO:0005634)</text>
  
  <!-- Apical membrane -->
  <path d="M0,200 Q400,180 800,200" stroke="#333" stroke-width="3" fill="none"/>
  <text x="350" y="170" font-family="Arial" font-size="12">Apical Membrane (GO:0016324)</text>
  
  <!-- E. coli -->
  <ellipse cx="200" cy="100" rx="70" ry="40" fill="#ffcccc" stroke="#cc9999" stroke-width="2"/>
  <text x="165" y="105" font-family="Arial" font-size="14" font-weight="bold">E. coli K-12</text>
  
  <!-- Molecules and interactions -->
  <!-- Color coding: 
       - Small molecules: #a8ddb5 (green)
       - Proteins: #fdcdac (orange)
       - Processes: #b3e2cd (light green)
  -->
  
  <!-- Tryptophan -->
  <rect x="80" y="90" width="70" height="30" rx="10" ry="10" fill="#a8ddb5" stroke="#333" stroke-width="1"/>
  <text x="85" y="110" font-family="Arial" font-size="12">L-Tryptophan</text>
  
  <!-- Tryptophanase -->
  <rect x="170" y="50" width="90" height="30" rx="5" ry="5" fill="#fdcdac" stroke="#333" stroke-width="1"/>
  <text x="174" y="70" font-family="Arial" font-size="12">Tryptophanase</text>
  <text x="180" y="85" font-family="Arial" font-size="10">(P0A853)</text>
  
  <!-- Indole -->
  <rect x="280" y="90" width="60" height="30" rx="10" ry="10" fill="#a8ddb5" stroke="#333" stroke-width="1"/>
  <text x="290" y="110" font-family="Arial" font-size="12">Indole</text>
  
  <!-- AHR -->
  <rect x="300" y="250" width="60" height="30" rx="5" ry="5" fill="#fdcdac" stroke="#333" stroke-width="1"/>
  <text x="310" y="270" font-family="Arial" font-size="12">AHR</text>
  <text x="300" y="285" font-family="Arial" font-size="10">(P35869)</text>
  
  <!-- ARNT -->
  <rect x="400" y="350" width="60" height="30" rx="5" ry="5" fill="#fdcdac" stroke="#333" stroke-width="1"/>
  <text x="410" y="370" font-family="Arial" font-size="12">ARNT</text>
  <text x="405" y="385" font-family="Arial" font-size="10">(P27540)</text>
  
  <!-- AHR-ARNT Complex -->
  <rect x="450" y="410" width="120" height="30" rx="5" ry="5" fill="#fdcdac" stroke="#333" stroke-width="1"/>
  <text x="457" y="430" font-family="Arial" font-size="12">AHR-ARNT Complex</text>
  
  <!-- IL10RA -->
  <rect x="260" y="190" width="70" height="30" rx="5" ry="5" fill="#fdcdac" stroke="#333" stroke-width="1"/>
  <text x="265" y="210" font-family="Arial" font-size="12">IL10RA</text>
  <text x="270" y="225" font-family="Arial" font-size="10">(Q13651)</text>
  
  <!-- Negative regulation of inflammatory response -->
  <rect x="140" y="300" width="170" height="40" rx="5" ry="5" fill="#b3e2cd" stroke="#333" stroke-width="1"/>
  <text x="150" y="320" font-family="Arial" font-size="12">Negative regulation of</text>
  <text x="150" y="335" font-family="Arial" font-size="12">inflammatory response</text>
  
  <!-- Intestinal epithelial structure maintenance -->
  <rect x="140" y="380" width="170" height="40" rx="5" ry="5" fill="#b3e2cd" stroke="#333" stroke-width="1"/>
  <text x="160" y="400" font-family="Arial" font-size="12">Intestinal epithelial</text>
  <text x="160" y="415" font-family="Arial" font-size="12">structure maintenance</text>
  
  <!-- Flow arrows -->
  <!-- Tryptophan to Indole conversion -->
  <path d="M150,105 L170,105" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M215,80 L215,90" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="180" y="115" font-family="Arial" font-size="10" font-style="italic">GO:0009034</text>
  <path d="M240,105 L280,105" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Indole to AHR -->
  <path d="M310,120 L320,250" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="290" y="180" font-family="Arial" font-size="10" font-style="italic">GO:0071219</text>
  
  <!-- AHR to complex -->
  <path d="M360,265 C400,300 400,330 400,350" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="380" y="310" font-family="Arial" font-size="10" font-style="italic">GO:0004879</text>
  
  <!-- ARNT to complex -->
  <path d="M430,380 L450,410" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="435" y="405" font-family="Arial" font-size="10" font-style="italic">GO:0003700</text>
  
  <!-- Complex regulates IL10RA -->
  <path d="M520,410 C450,320 380,250 330,220" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="400" y="290" font-family="Arial" font-size="10" font-style="italic">RO:0002407</text>
  
  <!-- IL10RA to negative regulation -->
  <path d="M270,220 L220,300" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="240" y="265" font-family="Arial" font-size="10" font-style="italic">GO:0004920</text>
  
  <!-- Negative regulation to structure maintenance -->
  <path d="M225,340 L225,380" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="230" y="365" font-family="Arial" font-size="10" font-style="italic">GO:0050728</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Gut Microbiota Tryptophan Metabolism</text>
  <text x="400" y="65" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Regulation of Intestinal Epithelial Cell Homeostasis by Indole-AhR</text>
  
  <!-- Legend -->
  <rect x="600" y="100" width="180" height="140" fill="white" stroke="#333" stroke-width="1"/>
  <text x="610" y="120" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <rect x="610" y="130" width="20" height="15" rx="5" ry="5" fill="#a8ddb5" stroke="#333" stroke-width="1"/>
  <text x="635" y="142" font-family="Arial" font-size="12">Small molecules</text>
  
  <rect x="610" y="155" width="20" height="15" rx="5" ry="5" fill="#fdcdac" stroke="#333" stroke-width="1"/>
  <text x="635" y="167" font-family="Arial" font-size="12">Proteins</text>
  
  <rect x="610" y="180" width="20" height="15" rx="5" ry="5" fill="#b3e2cd" stroke="#333" stroke-width="1"/>
  <text x="635" y="192" font-family="Arial" font-size="12">Biological processes</text>
  
  <text x="610" y="215" font-family="Arial" font-size="11">AHR = Aryl hydrocarbon receptor</text>
  <text x="610" y="230" font-family="Arial" font-size="11">ARNT = AHR nuclear translocator</text>
  <text x="610" y="245" font-family="Arial" font-size="11">IL10RA = Interleukin-10 receptor α</text>
</svg>