<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">
    No-Go Decay (NGD) Pathway in S. cerevisiae
  </text>
  
  <!-- Cytoplasm background -->
  <rect x="50" y="60" width="700" height="500" rx="20" ry="20" fill="#f0f7ff" stroke="#ccc" stroke-width="1.5" />
  <text x="70" y="90" font-family="Arial" font-size="18" fill="#555">Cytoplasm</text>
  
  <!-- 1. Ribosome collision and stalled translation -->
  <g id="stalled-ribosomes">
    <!-- mRNA -->
    <path d="M 100 200 C 140 180, 180 220, 220 200 C 260 180, 300 220, 340 200 C 380 180, 420 220, 460 200 C 500 180, 540 220, 580 200" 
          stroke="#333" fill="none" stroke-width="3.5"/>
    
    <!-- Collided Ribosomes -->
    <circle cx="250" cy="200" r="35" fill="#aad4ff" stroke="#333" stroke-width="1.5" />
    <circle cx="320" cy="200" r="35" fill="#aad4ff" stroke="#333" stroke-width="1.5" />
    <text x="250" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Ribosome</text>
    <text x="320" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Ribosome</text>
    
    <!-- Label -->
    <text x="250" y="140" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Collided Ribosomes</text>
    <text x="250" y="160" font-family="Arial" font-size="14" text-anchor="middle">GO:0022626</text>
    
    <!-- Arrow pointing to next step -->
    <path d="M 370 230 L 400 260" stroke="#d62728" stroke-width="3" marker-end="url(#arrowhead)" />
  </g>
  
  <!-- 2. HEL2 sensing and ubiquitination -->
  <g id="hel2-action">
    <!-- HEL2 protein -->
    <rect x="400" y="240" width="70" height="40" rx="8" ry="8" fill="#ff9e6d" stroke="#333" stroke-width="1.5" />
    <text x="435" y="265" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">HEL2</text>
    
    <!-- Sensing function -->
    <path d="M 435 240 L 360 210" stroke="#333" stroke-dasharray="5" stroke-width="2" />
    <text x="390" y="220" font-family="Arial" font-size="14" fill="#444" text-anchor="middle">senses</text>
    <text x="390" y="238" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">GO:0170011</text>
    
    <!-- Ubiquitination -->
    <path d="M 470 260 L 510 260" stroke="#1f77b4" stroke-width="3" marker-end="url(#arrowhead)" />
    <text x="490" y="245" font-family="Arial" font-size="14" fill="#444" text-anchor="middle">ubiquitinates</text>
    <text x="490" y="262" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">GO:0061630</text>
    
    <!-- RPS7 protein -->
    <rect x="530" y="240" width="70" height="40" rx="8" ry="8" fill="#aad4ff" stroke="#333" stroke-width="1.5" />
    <text x="565" y="265" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">RPS7</text>
    
    <!-- Ubiquitin tags -->
    <circle cx="540" cy="235" r="10" fill="#ffcc00" stroke="#333" stroke-width="1" />
    <text x="540" y="239" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ub</text>
    <circle cx="555" cy="230" r="10" fill="#ffcc00" stroke="#333" stroke-width="1" />
    <text x="555" y="234" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ub</text>
    <circle cx="570" cy="235" r="10" fill="#ffcc00" stroke="#333" stroke-width="1" />
    <text x="570" y="239" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ub</text>
    
    <text x="565" y="210" font-family="Arial" font-size="14" fill="#444" text-anchor="middle">K63-linked Ub</text>
    <text x="565" y="190" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">GO:0070534</text>
    
    <!-- Arrow pointing to next step -->
    <path d="M 565 280 L 565 320" stroke="#2ca02c" stroke-width="3" marker-end="url(#arrowhead)" />
  </g>
  
  <!-- 3. MOT2 action -->
  <g id="mot2-action">
    <!-- MOT2 protein -->
    <rect x="400" y="320" width="70" height="40" rx="8" ry="8" fill="#8fc976" stroke="#333" stroke-width="1.5" />
    <text x="435" y="345" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">MOT2</text>
    
    <!-- Ubiquitination action -->
    <path d="M 470 340 L 510 340" stroke="#1f77b4" stroke-width="3" marker-end="url(#arrowhead)" />
    <text x="490" y="325" font-family="Arial" font-size="14" fill="#444" text-anchor="middle">monoubiquitinates</text>
    <text x="490" y="355" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">GO:0061630</text>
    
    <!-- HEL2 target -->
    <rect x="530" y="320" width="70" height="40" rx="8" ry="8" fill="#ff9e6d" stroke="#333" stroke-width="1.5" />
    <text x="565" y="345" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">HEL2</text>
    
    <!-- Ubiquitin tag -->
    <circle cx="545" cy="315" r="10" fill="#ffcc00" stroke="#333" stroke-width="1" />
    <text x="545" y="319" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ub</text>
    
    <text x="620" y="340" font-family="Arial" font-size="14" fill="#444">GO:0006513</text>
    
    <!-- Arrow pointing to next step -->
    <path d="M 565 360 L 565 400" stroke="#2ca02c" stroke-width="3" marker-end="url(#arrowhead)" />
  </g>
  
  <!-- 4. CUE2 recruitment and mRNA cleavage -->
  <g id="cue2-action">
    <!-- CUE2 protein -->
    <rect x="530" y="400" width="70" height="40" rx="8" ry="8" fill="#e18adc" stroke="#333" stroke-width="1.5" />
    <text x="565" y="425" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CUE2</text>
    
    <!-- Binding action -->
    <text x="480" y="420" font-family="Arial" font-size="14" fill="#444" text-anchor="middle">binds</text>
    <text x="480" y="438" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">GO:0070530</text>
    
    <!-- Arrow pointing to mRNA -->
    <path d="M 530 420 L 380 420" stroke="#9467bd" stroke-width="3" marker-end="url(#arrowhead)" />
    
    <!-- mRNA -->
    <path d="M 100 420 C 140 400, 180 440, 220 420 C 260 400, 300 440, 340 420" 
          stroke="#333" fill="none" stroke-width="3.5"/>
          
    <!-- Cleaved mRNA -->
    <line x1="340" y1="420" x2="380" y2="420" stroke="#333" stroke-width="3.5" stroke-dasharray="5,3" />
    
    <!-- Endonuclease action -->
    <text x="340" y="390" font-family="Arial" font-size="14" fill="#444" text-anchor="middle">cleaves</text>
    <text x="340" y="408" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">GO:0004521</text>
    
    <!-- No-Go Decay label -->
    <text x="250" y="470" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Nuclear-transcribed mRNA catabolic process, no-go decay</text>
    <text x="250" y="490" font-family="Arial" font-size="14" fill="#444" text-anchor="middle">GO:0070966</text>
  </g>
  
  <!-- Legend -->
  <rect x="600" y="430" width="150" height="120" fill="white" stroke="#333" stroke-width="1.5" rx="5" ry="5" />
  <text x="675" y="450" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <rect x="610" y="460" width="15" height="15" fill="#ff9e6d" stroke="#333" stroke-width="1" />
  <text x="635" y="472" font-family="Arial" font-size="14" text-anchor="start">HEL2</text>
  
  <rect x="610" y="480" width="15" height="15" fill="#aad4ff" stroke="#333" stroke-width="1" />
  <text x="635" y="492" font-family="Arial" font-size="14" text-anchor="start">RPS7/Ribosome</text>
  
  <rect x="610" y="500" width="15" height="15" fill="#8fc976" stroke="#333" stroke-width="1" />
  <text x="635" y="512" font-family="Arial" font-size="14" text-anchor="start">MOT2</text>
  
  <rect x="610" y="520" width="15" height="15" fill="#e18adc" stroke="#333" stroke-width="1" />
  <text x="635" y="532" font-family="Arial" font-size="14" text-anchor="start">CUE2</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>