<svg width="800" height="750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Nuclear region -->
  <ellipse cx="400" cy="375" rx="380" ry="340" fill="#f6f6ff" stroke="#666" stroke-width="2"/>
  <text x="400" y="60" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Silent Mating-Type Cassette Heterochromatin Assembly</text>
  <text x="400" y="85" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic">S. pombe (fission yeast)</text>

  <!-- Mating-type region heterochromatin -->
  <rect x="300" y="300" width="200" height="100" rx="10" ry="10" fill="#d0d0ff" stroke="#000" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Mating-type Region</text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Heterochromatin</text>
  <text x="400" y="385" text-anchor="middle" font-family="Arial" font-size="12">(GO:0031934)</text>

  <!-- SHREC Complex -->
  <rect x="100" y="220" width="140" height="90" rx="10" ry="10" fill="#a8d1e0" stroke="#000" stroke-width="2"/>
  <text x="170" y="245" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">SHREC Complex</text>
  <text x="170" y="265" text-anchor="middle" font-family="Arial" font-size="12">(GO:0070824)</text>
  <text x="170" y="285" text-anchor="middle" font-family="Arial" font-size="13">Clr1, Clr2, Clr3, Mit1</text>

  <!-- CLRC Complex -->
  <rect x="550" y="220" width="140" height="90" rx="10" ry="10" fill="#bbd5a8" stroke="#000" stroke-width="2"/>
  <text x="620" y="245" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">CLRC Complex</text>
  <text x="620" y="265" text-anchor="middle" font-family="Arial" font-size="12">(GO:0043494)</text>
  <text x="620" y="285" text-anchor="middle" font-family="Arial" font-size="13">Rik1, Raf1, Raf2, Cul4, Clr4</text>

  <!-- RITS Complex -->
  <rect x="200" y="450" width="140" height="80" rx="10" ry="10" fill="#e0b8b8" stroke="#000" stroke-width="2"/>
  <text x="270" y="475" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">RITS Complex</text>
  <text x="270" y="495" text-anchor="middle" font-family="Arial" font-size="12">(GO:0030958)</text>
  <text x="270" y="515" text-anchor="middle" font-family="Arial" font-size="13">Chp1, Ago1, Tas3</text>

  <!-- ARC Complex -->
  <rect x="400" y="500" width="140" height="80" rx="10" ry="10" fill="#d5cba8" stroke="#000" stroke-width="2"/>
  <text x="470" y="525" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">ARC Complex</text>
  <text x="470" y="545" text-anchor="middle" font-family="Arial" font-size="12">(GO:0033167)</text>
  <text x="470" y="565" text-anchor="middle" font-family="Arial" font-size="13">Arb1</text>

  <!-- RDRC Complex -->
  <rect x="540" y="420" width="140" height="80" rx="10" ry="10" fill="#c8a8d5" stroke="#000" stroke-width="2"/>
  <text x="610" y="445" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">RDRC Complex</text>
  <text x="610" y="465" text-anchor="middle" font-family="Arial" font-size="12">(GO:0031380)</text>
  <text x="610" y="485" text-anchor="middle" font-family="Arial" font-size="13">Rdp1, Hrr1</text>

  <!-- FACT Complex -->
  <rect x="400" y="180" width="140" height="80" rx="10" ry="10" fill="#d5a8c8" stroke="#000" stroke-width="2"/>
  <text x="470" y="205" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">FACT Complex</text>
  <text x="470" y="225" text-anchor="middle" font-family="Arial" font-size="12">(GO:0035101)</text>
  <text x="470" y="245" text-anchor="middle" font-family="Arial" font-size="13">Spt16, Pob3</text>

  <!-- Other key proteins -->
  <circle cx="170" y="380" r="40" fill="#f0d59a" stroke="#000" stroke-width="2"/>
  <text x="170" y="375" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Swi6</text>
  <text x="170" y="395" text-anchor="middle" font-family="Arial" font-size="12">(HP1 homolog)</text>
  
  <circle cx="320" y="190" r="40" fill="#98c4c9" stroke="#000" stroke-width="2"/>
  <text x="320" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Sir2</text>
  <text x="320" y="205" text-anchor="middle" font-family="Arial" font-size="12">(HDAC)</text>
  
  <circle cx="650" y="350" r="40" fill="#a3c285" stroke="#000" stroke-width="2"/>
  <text x="650" y="345" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Dcr1</text>
  <text x="650" y="365" text-anchor="middle" font-family="Arial" font-size="12">(Dicer)</text>

  <circle cx="90" y="350" r="40" fill="#f09a9a" stroke="#000" stroke-width="2"/>
  <text x="90" y="345" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Chp2</text>
  <text x="90" y="365" text-anchor="middle" font-family="Arial" font-size="12">(HP1 homolog)</text>

  <circle cx="110" y="100" r="40" fill="#a8a8e0" stroke="#000" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Atf1-Pcr1</text>
  <text x="110" y="115" text-anchor="middle" font-family="Arial" font-size="12">(TF complex)</text>
  
  <circle cx="200" y="120" r="40" fill="#a8d5c8" stroke="#000" stroke-width="2"/>
  <text x="200" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Sty1</text>
  <text x="200" y="135" text-anchor="middle" font-family="Arial" font-size="12">(MAPK)</text>
  
  <circle cx="110" y="170" r="40" fill="#c8d5a8" stroke="#000" stroke-width="2"/>
  <text x="110" y="165" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Wis1</text>
  <text x="110" y="185" text-anchor="middle" font-family="Arial" font-size="12">(MAPKK)</text>
  
  <circle cx="150" y="560" r="40" fill="#e0b8d5" stroke="#000" stroke-width="2"/>
  <text x="150" y="555" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Stc1</text>
  <text x="150" y="575" text-anchor="middle" font-family="Arial" font-size="12">(Adaptor)</text>
  
  <circle cx="250" y="120" r="40" fill="#d5e0a8" stroke="#000" stroke-width="2"/>
  <text x="250" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Lsd1/Lsd2</text>
  <text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="12">(Demethylases)</text>

  <!-- Connections and Arrows -->
  <!-- SHREC to heterochromatin -->
  <path d="M 220 260 L 295 320" fill="none" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- CLRC to heterochromatin -->
  <path d="M 580 270 L 505 320" fill="none" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Clr4 in CLRC to heterochromatin with H3K9me label -->
  <path d="M 620 290 L 500 340" fill="none" stroke="#408000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="520" y="290" width="115" height="22" fill="white" fill-opacity="0.8" rx="4" ry="4"/>
  <text x="575" y="307" font-family="Arial" font-size="12" text-anchor="middle">H3K9 methylation</text>
  
  <!-- RITS to heterochromatin -->
  <path d="M 300 450 L 350 400" fill="none" stroke="#000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- RDRC to RITS -->
  <path d="M 540 460 L 340 465" fill="none" stroke="#800040" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="400" y="440" width="100" height="22" fill="white" fill-opacity="0.8" rx="4" ry="4"/>
  <text x="450" y="457" font-family="Arial" font-size="12" text-anchor="middle">siRNA production</text>
  
  <!-- Dcr1 to RITS -->
  <path d="M 615 365 L 340 450" fill="none" stroke="#800040" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- ARC to RITS -->
  <path d="M 400 510 L 340 490" fill="none" stroke="#800040" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Stc1 connections -->
  <path d="M 175 530 L 240 510" fill="none" stroke="#004080" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 150 520 L 170 420" fill="none" stroke="#004080" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 180 535 L 330 390" fill="none" stroke="#004080" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- MAPK pathway -->
  <path d="M 130 155 L 160 140" fill="none" stroke="#804000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 170 135 L 125 110" fill="none" stroke="#804000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Atf1-Pcr1 to heterochromatin -->
  <path d="M 140 125 L 295 300" fill="none" stroke="#408000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Swi6 to heterochromatin -->
  <path d="M 200 360 L 295 350" fill="none" stroke="#408000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="235" y="340" width="60" height="22" fill="white" fill-opacity="0.8" rx="4" ry="4"/>
  <text x="265" y="357" font-family="Arial" font-size="12" text-anchor="middle">Binding</text>
  
  <!-- Chp2 to heterochromatin -->
  <path d="M 130 350 L 295 340" fill="none" stroke="#408000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Sir2 to heterochromatin -->
  <path d="M 320 230 L 350 300" fill="none" stroke="#800040" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="290" y="255" width="130" height="22" fill="white" fill-opacity="0.8" rx="4" ry="4"/>
  <text x="355" y="272" font-family="Arial" font-size="12" text-anchor="middle">H3K9 deacetylation</text>
  
  <!-- FACT to heterochromatin -->
  <path d="M 470 260 L 420 300" fill="none" stroke="#408000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="410" y="260" width="120" height="22" fill="white" fill-opacity="0.8" rx="4" ry="4"/>
  <text x="470" y="277" font-family="Arial" font-size="12" text-anchor="middle">Histone chaperone</text>
  
  <!-- Lsd1/Lsd2 to Sir2 -->
  <path d="M 280 145 L 310 170" fill="none" stroke="#800040" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="250" y="130" width="150" height="22" fill="white" fill-opacity="0.8" rx="4" ry="4"/>
  <text x="325" y="147" font-family="Arial" font-size="12" text-anchor="middle">H3K9 demethylation</text>

  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="20" y="630" width="760" height="100" rx="5" ry="5" fill="#f8f8f8" stroke="#888" stroke-width="1"/>
  <text x="400" y="650" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Legend</text>
  
  <rect x="40" y="665" width="20" height="15" rx="3" ry="3" fill="#a8d1e0" stroke="#000" stroke-width="1"/>
  <text x="70" y="678" font-family="Arial" font-size="14" text-anchor="start">SHREC Complex</text>
  
  <rect x="180" y="665" width="20" height="15" rx="3" ry="3" fill="#bbd5a8" stroke="#000" stroke-width="1"/>
  <text x="210" y="678" font-family="Arial" font-size="14" text-anchor="start">CLRC Complex</text>
  
  <rect x="320" y="665" width="20" height="15" rx="3" ry="3" fill="#e0b8b8" stroke="#000" stroke-width="1"/>
  <text x="350" y="678" font-family="Arial" font-size="14" text-anchor="start">RITS Complex</text>
  
  <rect x="440" y="665" width="20" height="15" rx="3" ry="3" fill="#d5cba8" stroke="#000" stroke-width="1"/>
  <text x="470" y="678" font-family="Arial" font-size="14" text-anchor="start">ARC Complex</text>
  
  <rect x="560" y="665" width="20" height="15" rx="3" ry="3" fill="#c8a8d5" stroke="#000" stroke-width="1"/>
  <text x="590" y="678" font-family="Arial" font-size="14" text-anchor="start">RDRC Complex</text>
  
  <rect x="680" y="665" width="20" height="15" rx="3" ry="3" fill="#d5a8c8" stroke="#000" stroke-width="1"/>
  <text x="710" y="678" font-family="Arial" font-size="14" text-anchor="start">FACT Complex</text>
  
  <circle cx="50" y="700" r="8" fill="#f0d59a" stroke="#000" stroke-width="1"/>
  <text x="70" y="705" font-family="Arial" font-size="14" text-anchor="start">Key Proteins</text>
  
  <line x1="140" y1="700" x2="170" y2="700" stroke="#408000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="230" y="705" font-family="Arial" font-size="14" text-anchor="start">Activates/Promotes</text>
  
  <line x1="320" y1="700" x2="350" y2="700" stroke="#800040" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="410" y="705" font-family="Arial" font-size="14" text-anchor="start">Enzymatic Modification</text>
  
  <line x1="540" y1="700" x2="570" y2="700" stroke="#004080" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="630" y="705" font-family="Arial" font-size="14" text-anchor="start">Molecular Bridging</text>
  
  <rect x="50" y="720" width="700" height="25" rx="3" ry="3" fill="#f0f0f0" stroke="#888" stroke-width="1"/>
  <text x="400" y="737" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Note: This pathway depicts silent mating-type cassette heterochromatin assembly in S. pombe (GO:0030466)</text>
</svg>