<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Nucleus Background -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f0f8ff" stroke="#666" stroke-width="2"/>
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Cell Nucleus</text>
  
  <!-- DNA Double-Strand Break Site -->
  <rect x="200" y="240" width="400" height="120" rx="10" ry="10" fill="#e6ffe6" stroke="#333" stroke-width="2"/>
  <text x="400" y="228" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Site of Double-Strand Break (GO:0035861)</text>
  
  <!-- DNA Strands with Break -->
  <path d="M 250 300 L 350 300 M 450 300 L 550 300" stroke="#333" stroke-width="6"/>
  <path d="M 250 320 L 350 320 M 450 320 L 550 320" stroke="#333" stroke-width="6"/>
  <text x="400" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="red" font-weight="bold">Double-Strand Break</text>
  
  <!-- SKP2 -->
  <circle cx="150" cy="180" r="40" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="150" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">SKP2</text>
  
  <!-- Ubiquitination Process -->
  <path d="M 180 200 Q 220 220 240 240" stroke="#ff6600" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-ubiq)"/>
  <text x="220" y="210" font-family="Arial" font-size="12" fill="#333" stroke="#ffffff" stroke-width="0.5">K63-linked</text>
  <text x="220" y="225" font-family="Arial" font-size="12" fill="#333" stroke="#ffffff" stroke-width="0.5">ubiquitination</text>
  
  <!-- NBN -->
  <rect x="250" y="250" width="60" height="30" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="280" y="270" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">NBN</text>
  
  <!-- Ubiquitin Tags -->
  <circle cx="270" cy="240" r="8" fill="#ffcc00" stroke="#333" stroke-width="1"/>
  <text x="270" y="244" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Ub</text>
  <circle cx="285" cy="235" r="8" fill="#ffcc00" stroke="#333" stroke-width="1"/>
  <text x="285" y="239" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Ub</text>
  
  <!-- MRE11 Complex -->
  <rect x="350" y="250" width="100" height="40" rx="5" ry="5" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="400" y="275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">MRE11 Complex</text>
  
  <!-- NBN to MRE11 Interaction -->
  <path d="M 310 265 L 350 265" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead-adapter)"/>
  <text x="330" y="256" font-family="Arial" font-size="11" fill="#333" stroke="#ffffff" stroke-width="0.5">adapts</text>
  
  <!-- ATM -->
  <rect x="500" y="250" width="60" height="30" rx="5" ry="5" fill="#99ff99" stroke="#333" stroke-width="2"/>
  <text x="530" y="270" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">ATM</text>
  
  <!-- MRE11 to ATM Activation -->
  <path d="M 450 270 L 500 265" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead-activate)"/>
  <text x="475" y="256" font-family="Arial" font-size="11" fill="#333" stroke="#ffffff" stroke-width="0.5">activates</text>
  
  <!-- ATM Phosphorylation Targets -->
  <path d="M 530 280 Q 530 340 480 380" stroke="#006600" stroke-width="2" marker-end="url(#arrowhead-phospho)"/>
  <text x="510" y="350" font-family="Arial" font-size="11" fill="#333" stroke="#ffffff" stroke-width="0.5">phosphorylates</text>
  <text x="510" y="365" font-family="Arial" font-size="11" fill="#333" stroke="#ffffff" stroke-width="0.5">substrates</text>
  
  <!-- Homologous Recombination Outcome -->
  <rect x="300" y="380" width="200" height="40" rx="10" ry="10" fill="#ffeecc" stroke="#333" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">DNA Repair via HR</text>
  
  <!-- Arrowhead Marker Definitions -->
  <defs>
    <marker id="arrowhead-ubiq" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6600"/>
    </marker>
    <marker id="arrowhead-adapter" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc"/>
    </marker>
    <marker id="arrowhead-activate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#009900"/>
    </marker>
    <marker id="arrowhead-phospho" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006600"/>
    </marker>
  </defs>
  
  <!-- Process Labels -->
  <text x="150" y="130" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">GO:1990756</text>
  <text x="150" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">ubiquitin-like ligase-</text>
  <text x="150" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">substrate adaptor activity</text>
  
  <text x="280" y="210" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">GO:0140463</text>
  <text x="280" y="225" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">chromatin-protein</text>
  <text x="280" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">adaptor activity</text>
  
  <text x="400" y="370" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">GO:0000729</text>
  <text x="400" y="385" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">DNA double-strand</text>
  <text x="400" y="400" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">break processing</text>
  
  <text x="530" y="220" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">GO:0004674</text>
  <text x="530" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">protein ser/thr</text>
  <text x="530" y="250" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">kinase activity</text>
  
  <text x="400" y="315" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">GO:0043539</text>
  <text x="400" y="330" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">protein ser/thr kinase</text>
  <text x="400" y="345" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">activator activity</text>

  <!-- Figure Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">SKP2-Mediated NBN Ubiquitination Promotes</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Homologous Recombination Repair</text>
  
  <!-- Legend -->
  <rect x="580" y="440" width="210" height="150" rx="5" ry="5" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="685" y="460" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <!-- Legend Items -->
  <circle cx="600" cy="480" r="10" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="620" y="485" font-family="Arial" font-size="12" text-anchor="start">SKP2 protein</text>
  
  <rect x="590" y="500" width="20" height="15" rx="3" ry="3" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="620" y="512" font-family="Arial" font-size="12" text-anchor="start">NBN protein</text>
  
  <rect x="590" y="525" width="20" height="15" rx="3" ry="3" fill="#cc99ff" stroke="#333" stroke-width="1"/>
  <text x="620" y="537" font-family="Arial" font-size="12" text-anchor="start">MRE11 complex</text>
  
  <rect x="590" y="550" width="20" height="15" rx="3" ry="3" fill="#99ff99" stroke="#333" stroke-width="1"/>
  <text x="620" y="562" font-family="Arial" font-size="12" text-anchor="start">ATM protein</text>
  
  <path d="M 590 575 L 610 575" stroke="#ff6600" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="620" y="579" font-family="Arial" font-size="12" text-anchor="start">Ubiquitination</text>
  
  <circle cx="600" cy="595" r="8" fill="#ffcc00" stroke="#333" stroke-width="1"/>
  <text x="600" y="599" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Ub</text>
  <text x="620" y="599" font-family="Arial" font-size="12" text-anchor="start">Ubiquitin tag</text>
</svg>