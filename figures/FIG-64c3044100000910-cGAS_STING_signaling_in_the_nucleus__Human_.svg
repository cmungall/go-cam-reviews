<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline with nucleus -->
  <ellipse cx="400" cy="300" rx="390" ry="290" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="200" rx="180" ry="120" fill="#e6f2ff" stroke="#666" stroke-width="2"/>
  <text x="400" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Nucleus (GO:0005634)</text>
  
  <!-- Cytosol label -->
  <text x="400" y="465" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- ER membrane -->
  <path d="M 200,370 Q 400,350 600,370 Q 400,390 200,370" fill="#ffe6cc" stroke="#666" stroke-width="2"/>
  <text x="400" y="350" font-family="Arial" font-size="14" text-anchor="middle" fill="white" stroke="#666" stroke-width="0.5">ER Membrane (GO:0005789)</text>

  <!-- ER-Golgi intermediate compartment membrane -->
  <path d="M 220,430 Q 400,410 580,430 Q 400,450 220,430" fill="#fff2cc" stroke="#666" stroke-width="2"/>
  <text x="195" y="415" font-family="Arial" font-size="12" text-anchor="start">ER-Golgi Intermediate</text>
  <text x="195" y="430" font-family="Arial" font-size="12" text-anchor="start">Compartment Membrane (GO:0033116)</text>
  
  <!-- DNA in nucleus -->
  <path d="M 330,200 Q 360,180 390,200 Q 420,220 450,200 Q 480,180 510,200" fill="none" stroke="#0066cc" stroke-width="3"/>
  <text x="420" y="170" font-family="Arial" font-size="14" text-anchor="middle">dsDNA</text>
  
  <!-- cGAS binding to DNA -->
  <circle cx="400" cy="200" r="25" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="400" y="205" font-family="Arial" font-size="12" text-anchor="middle">cGAS</text>
  
  <!-- cGAS nucleosome binding -->
  <rect x="320" y="140" width="40" height="20" fill="#b3d9ff" stroke="#0066cc" stroke-width="1" rx="5" ry="5"/>
  <text x="340" y="155" font-family="Arial" font-size="10" text-anchor="middle">Nucleosome</text>
  <path d="M 350,160 L 380,180" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="290" y="155" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">Nucleosome binding</text>
  <text x="290" y="170" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">(GO:0031491)</text>
  
  <!-- cGAS condensate formation -->
  <circle cx="460" cy="230" r="35" fill="#99ccff" stroke="#0066cc" stroke-width="2" fill-opacity="0.6"/>
  <circle cx="480" cy="210" r="20" fill="#99ccff" stroke="#0066cc" stroke-width="2" fill-opacity="0.6"/>
  <circle cx="470" cy="250" r="15" fill="#99ccff" stroke="#0066cc" stroke-width="2" fill-opacity="0.6"/>
  <text x="540" y="220" font-family="Arial" font-size="12" text-anchor="start">cGAS condensate</text>
  <text x="540" y="235" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">(GO:0140693)</text>
  
  <!-- cGAMP synthesis -->
  <circle cx="550" cy="270" r="15" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
  <text x="550" y="275" font-family="Arial" font-size="10" text-anchor="middle">cGAMP</text>
  <path d="M 490,250 L 535,265" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="525" y="250" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Synthesis</text>
  <text x="525" y="265" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(GO:0061501)</text>
  
  <!-- cGAMP movement to ER -->
  <path d="M 550,285 Q 520,325 440,360" fill="none" stroke="#ff9933" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  
  <!-- STING1 in ER membrane -->
  <rect x="380" y="360" width="60" height="20" fill="#ff9966" stroke="#cc6600" stroke-width="2" rx="10" ry="10"/>
  <text x="410" y="375" font-family="Arial" font-size="12" text-anchor="middle">STING1</text>
  
  <!-- STING1 in ERGIC membrane -->
  <rect x="380" y="420" width="60" height="20" fill="#ff9966" stroke="#cc6600" stroke-width="2" rx="10" ry="10"/>
  <text x="410" y="435" font-family="Arial" font-size="12" text-anchor="middle">STING1</text>
  
  <!-- cGAMP binding to STING -->
  <path d="M 440,360 L 470,360" fill="none" stroke="#ff9933" stroke-width="1.5"/>
  <circle cx="480" cy="360" r="10" fill="#ffcc99" stroke="#ff9933" stroke-width="1.5"/>
  <text x="510" y="345" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">cGAMP binding</text>
  <text x="510" y="360" font-family="Arial" font-size="10" text-anchor="start" font-style="italic">(GO:0061507)</text>
  
  <!-- STING1 movement to ERGIC -->
  <path d="M 410,380 L 410,420" fill="none" stroke="#cc6600" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="435" y="400" font-family="Arial" font-size="10" text-anchor="start">Translocation</text>
  
  <!-- TBK1 in cytosol -->
  <circle cx="300" cy="470" r="20" fill="#99cc99" stroke="#339933" stroke-width="2"/>
  <text x="300" y="475" font-family="Arial" font-size="12" text-anchor="middle">TBK1</text>
  
  <!-- STING1 signals to TBK1 -->
  <path d="M 380,430 L 320,465" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="430" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">Signaling adaptor</text>
  <text x="330" y="445" font-family="Arial" font-size="10" text-anchor="end" font-style="italic">(GO:0035591)</text>
  
  <!-- TBK1 activation -->
  <path d="M 280,485 L 220,510" fill="none" stroke="#339933" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="535" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Activation of innate</text>
  <text x="225" y="550" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">immune response</text>
  <text x="225" y="565" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0002218)</text>
  
  <!-- TBK1 regulation of interferon -->
  <path d="M 320,485 L 380,510" fill="none" stroke="#339933" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="535" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Positive regulation of</text>
  <text x="450" y="550" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">type I interferon production</text>
  <text x="450" y="565" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(GO:0032481)</text>
  
  <!-- Pathway title -->
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">cGAS-STING Signaling in the Nucleus (Human)</text>
  <text x="400" y="65" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">cGAS/STING Signaling Pathway (GO:0140896)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Gene/protein legend box -->
  <rect x="620" y="130" width="160" height="100" fill="#f9f9f9" stroke="#666" stroke-width="1" rx="5" ry="5"/>
  <text x="700" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Proteins</text>
  <circle cx="640" cy="170" r="8" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="650" y="175" font-family="Arial" font-size="12" x-anchor="start" dominant-baseline="middle">cGAS (Q8N884)</text>
  <rect x="632" cy="190" width="16" height="8" fill="#ff9966" stroke="#cc6600" stroke-width="1.5" rx="3" ry="3"/>
  <text x="650" y="195" font-family="Arial" font-size="12" x-anchor="start" dominant-baseline="middle">STING1 (Q86WV6)</text>
  <circle cx="640" cy="215" r="8" fill="#99cc99" stroke="#339933" stroke-width="1.5"/>
  <text x="650" y="215" font-family="Arial" font-size="12" x-anchor="start" dominant-baseline="middle">TBK1 (Q9UHD2)</text>
  
  <!-- Arrow legend -->
  <rect x="620" y="240" width="160" height="100" fill="#f9f9f9" stroke="#666" stroke-width="1" rx="5" ry="5"/>
  <text x="700" y="260" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Arrows</text>
  <path d="M 630,280 L 660,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="285" font-family="Arial" font-size="12" text-anchor="start">Activation/Production</text>
  <path d="M 630,310 L 660,310" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="700" y="315" font-family="Arial" font-size="12" text-anchor="start">Translocation</text>
</svg>