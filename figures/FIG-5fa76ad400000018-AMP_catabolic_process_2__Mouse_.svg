<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Cell membrane -->
  <path d="M100,150 L700,150 L700,450 L100,450 Z" fill="#f0f8ff" stroke="#888888" stroke-width="2" />
  
  <!-- Plasma membrane -->
  <path d="M100,150 L700,150" stroke="#404040" stroke-width="6" />
  <path d="M100,450 L700,450" stroke="#404040" stroke-width="6" />
  <path d="M100,150 L100,450" stroke="#404040" stroke-width="6" />
  <path d="M700,150 L700,450" stroke="#404040" stroke-width="6" />
  
  <!-- External environment label -->
  <text x="390" y="130" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#000000">Extracellular Space</text>
  
  <!-- Cytosol label -->
  <text x="390" y="470" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#000000">Cytosol</text>
  
  <!-- ENTPD1 protein -->
  <rect x="180" y="120" width="100" height="50" rx="10" ry="10" fill="#ff9999" stroke="#800000" stroke-width="2" />
  <text x="230" y="150" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">ENTPD1</text>
  
  <!-- NT5E protein -->
  <rect x="380" y="120" width="100" height="50" rx="10" ry="10" fill="#ff9999" stroke="#800000" stroke-width="2" />
  <text x="430" y="150" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">NT5E</text>
  
  <!-- SLC29A1 transporter -->
  <rect x="280" y="380" width="100" height="60" rx="10" ry="10" fill="#99ccff" stroke="#0055aa" stroke-width="2" />
  <text x="330" y="415" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">SLC29A1</text>
  
  <!-- SLC29A2 transporter -->
  <rect x="480" y="380" width="100" height="60" rx="10" ry="10" fill="#99ccff" stroke="#0055aa" stroke-width="2" />
  <text x="530" y="415" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">SLC29A2</text>
  
  <!-- AMPD3 protein -->
  <rect x="150" y="350" width="100" height="50" rx="10" ry="10" fill="#99cc99" stroke="#006600" stroke-width="2" />
  <text x="200" y="380" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">AMPD3</text>
  <text x="200" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">(AMP deaminase)</text>
  
  <!-- ADP molecule -->
  <circle cx="180" r="25" cy="220" fill="#ffcc66" stroke="#cc9900" stroke-width="2" />
  <text x="180" y="225" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">ADP</text>
  
  <!-- AMP molecule -->
  <circle cx="330" r="25" cy="220" fill="#ffcc66" stroke="#cc9900" stroke-width="2" />
  <text x="330" y="225" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">AMP</text>
  
  <!-- Adenosine molecule -->
  <circle cx="480" r="25" cy="220" fill="#ffcc66" stroke="#cc9900" stroke-width="2" />
  <text x="480" y="225" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Adenosine</text>
  
  <!-- Arrows for reactions -->
  <!-- ADP to AMP -->
  <path d="M205,220 L305,220" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="255" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">Converts</text>
  
  <!-- Connection from ENTPD1 to reaction -->
  <path d="M230,170 L230,220" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />
  <text x="250" y="195" text-anchor="start" font-family="Arial" font-size="12" fill="#000000">Catalyzes</text>
  
  <!-- AMP to Adenosine -->
  <path d="M355,220 L455,220" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="405" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">Converts</text>
  
  <!-- Connection from NT5E to reaction -->
  <path d="M430,170 L430,220" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />
  <text x="450" y="195" text-anchor="start" font-family="Arial" font-size="12" fill="#000000">Catalyzes</text>
  
  <!-- SLC29A1 transporter action -->
  <path d="M330,245 L330,380" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="350" y="300" text-anchor="start" font-family="Arial" font-size="14" fill="#000000">Transports</text>
  
  <!-- SLC29A2 transporter action -->
  <path d="M480,245 L480,380" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="500" y="300" text-anchor="start" font-family="Arial" font-size="14" fill="#000000">Transports</text>
  
  <!-- AMPD3 action -->
  <path d="M280,220 L200,350" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />
  <text x="230" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">Processes</text>
  
  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="100" y="500" width="600" height="80" fill="#f8f8f8" stroke="#888888" stroke-width="1" />
  <text x="120" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Legend:</text>
  
  <rect x="120" y="530" width="20" height="20" fill="#ff9999" stroke="#800000" stroke-width="1" />
  <text x="150" y="545" font-family="Arial" font-size="12" fill="#000000">Extracellular Enzymes</text>
  
  <rect x="290" y="530" width="20" height="20" fill="#99ccff" stroke="#0055aa" stroke-width="1" />
  <text x="320" y="545" font-family="Arial" font-size="12" fill="#000000">Transporters</text>
  
  <rect x="430" y="530" width="20" height="20" fill="#99cc99" stroke="#006600" stroke-width="1" />
  <text x="460" y="545" font-family="Arial" font-size="12" fill="#000000">Cytosolic enzymes</text>
  
  <circle cx="550" y="540" r="10" fill="#ffcc66" stroke="#cc9900" stroke-width="1" />
  <text x="570" y="545" font-family="Arial" font-size="12" fill="#000000">Metabolites</text>
  
  <line x1="120" y1="560" x2="150" y2="560" stroke="#000000" stroke-width="2" />
  <text x="160" y="565" font-family="Arial" font-size="12" fill="#000000">Direct effect</text>
  
  <line x1="290" y1="560" x2="320" y2="560" stroke="#000000" stroke-width="2" stroke-dasharray="4,2" />
  <text x="330" y="565" font-family="Arial" font-size="12" fill="#000000">Regulatory/catalytic effect</text>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#000000">AMP Catabolic Process (Mouse)</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="16" fill="#000000">GO-CAM Pathway Representation</text>
</svg>