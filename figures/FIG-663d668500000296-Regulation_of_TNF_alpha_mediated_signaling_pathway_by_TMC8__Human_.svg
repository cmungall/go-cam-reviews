<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Cell membrane with more biological detail -->
    <path d="M 50,300 L 750,300" stroke="#888888" stroke-width="15" stroke-linecap="round" fill="none" stroke-dasharray="15,10"/>
    <path d="M 50,290 L 750,290" stroke="#AAAAAA" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Background colors for compartments -->
    <rect x="50" y="100" width="700" height="190" fill="#E6F3FF" opacity="0.3" rx="20" ry="20"/>
    <rect x="50" y="310" width="700" height="190" fill="#FFF2E6" opacity="0.3" rx="20" ry="20"/>
    
    <!-- Compartment labels -->
    <text x="70" y="130" font-family="Arial" font-size="18" font-weight="bold" fill="#444444">Extracellular Space</text>
    <text x="70" y="340" font-family="Arial" font-size="18" font-weight="bold" fill="#444444">Cytoplasm</text>
    
    <!-- TNF ligand -->
    <circle cx="200" cy="200" r="35" fill="#FF9999" stroke="#CC0000" stroke-width="2"/>
    <text x="200" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">TNF</text>
    <text x="200" y="225" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">P01375</text>
    
    <!-- TNF function label -->
    <rect x="150" y="150" width="100" height="30" rx="15" ry="15" fill="#FFFFFF" stroke="#CC0000" stroke-width="1" opacity="0.9"/>
    <text x="200" y="170" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold" fill="#000000">Receptor Ligand</text>
    <text x="200" y="182" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">GO:0048018</text>
    
    <!-- TNFRSF1A receptor spanning the membrane -->
    <rect x="300" y="250" width="70" height="100" rx="10" ry="10" fill="#99CCFF" stroke="#0066CC" stroke-width="2"/>
    <text x="335" y="290" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">TNFRSF1A</text>
    <text x="335" y="240" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">P19438</text>
    
    <!-- TNFRSF1A function label -->
    <rect x="300" y="310" width="70" height="30" rx="15" ry="15" fill="#FFFFFF" stroke="#0066CC" stroke-width="1" opacity="0.9"/>
    <text x="335" y="325" font-family="Arial" font-size="8" text-anchor="middle" font-weight="bold" fill="#000000">Signaling Receptor</text>
    <text x="335" y="335" font-family="Arial" font-size="7" text-anchor="middle" fill="#666666">GO:0038023</text>
    
    <!-- TRADD -->
    <rect x="400" y="350" width="70" height="50" rx="5" ry="5" fill="#FFCC99" stroke="#FF6600" stroke-width="2"/>
    <text x="435" y="375" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">TRADD</text>
    <text x="435" y="395" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Q15628</text>
    
    <!-- TRADD function label -->
    <rect x="400" y="410" width="70" height="30" rx="15" ry="15" fill="#FFFFFF" stroke="#FF6600" stroke-width="1" opacity="0.9"/>
    <text x="435" y="425" font-family="Arial" font-size="8" text-anchor="middle" font-weight="bold" fill="#000000">Signaling Adaptor</text>
    <text x="435" y="435" font-family="Arial" font-size="7" text-anchor="middle" fill="#666666">GO:0035591</text>
    
    <!-- TRAF2 -->
    <rect x="530" y="420" width="70" height="50" rx="5" ry="5" fill="#99FF99" stroke="#00CC00" stroke-width="2"/>
    <text x="565" y="445" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">TRAF2</text>
    <text x="565" y="465" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Q12933</text>
    
    <!-- TRAF2 function label -->
    <rect x="530" y="480" width="70" height="30" rx="15" ry="15" fill="#FFFFFF" stroke="#00CC00" stroke-width="1" opacity="0.9"/>
    <text x="565" y="495" font-family="Arial" font-size="8" text-anchor="middle" font-weight="bold" fill="#000000">Signaling Adaptor</text>
    <text x="565" y="505" font-family="Arial" font-size="7" text-anchor="middle" fill="#666666">GO:0035591</text>
    
    <!-- TMC8 -->
    <rect x="300" y="450" width="70" height="50" rx="5" ry="5" fill="#CC99FF" stroke="#6600CC" stroke-width="2"/>
    <text x="335" y="475" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">TMC8</text>
    <text x="335" y="495" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Q8IU68</text>
    
    <!-- TMC8 function label -->
    <rect x="240" y="460" width="90" height="30" rx="15" ry="15" fill="#FFFFFF" stroke="#6600CC" stroke-width="1" opacity="0.9"/>
    <text x="285" y="475" font-family="Arial" font-size="8" text-anchor="middle" font-weight="bold" fill="#000000">Protein Sequestering</text>
    <text x="285" y="485" font-family="Arial" font-size="7" text-anchor="middle" fill="#666666">GO:0140311</text>
    
    <!-- Signaling arrows -->
    <!-- TNF to Receptor -->
    <path d="M 235,200 L 295,275" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="240" y="215" width="60" height="20" fill="#FFFFFF" opacity="0.8" rx="5" ry="5"/>
    <text x="270" y="230" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">activates</text>
    
    <!-- Receptor to TRADD -->
    <path d="M 370,325 L 400,350" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="350" y="325" width="50" height="20" fill="#FFFFFF" opacity="0.8" rx="5" ry="5"/>
    <text x="375" y="340" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">signals</text>
    
    <!-- TRADD to TRAF2 -->
    <path d="M 470,375 L 530,425" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="480" y="385" width="60" height="20" fill="#FFFFFF" opacity="0.8" rx="5" ry="5"/>
    <text x="510" y="400" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">activates</text>
    
    <!-- TMC8 to TRADD (inhibition) - made more prominent -->
    <path d="M 350,450 L 400,400" stroke="#FF0000" stroke-width="4" fill="none" marker-end="url(#inhibition)"/>
    <rect x="345" y="415" width="60" height="20" fill="#FFFFFF" opacity="0.8" rx="5" ry="5"/>
    <text x="375" y="430" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#FF0000">inhibits</text>
    
    <!-- Process label -->
    <rect x="175" y="40" width="450" height="40" rx="20" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1" opacity="0.9"/>
    <text x="400" y="65" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#000000">TNF-alpha-mediated Signaling Pathway</text>
    <text x="400" y="95" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#6600CC">Regulation by TMC8</text>
    
    <!-- Main process label (GO:0033209) -->
    <rect x="600" y="170" width="120" height="50" rx="10" ry="10" fill="#FFFFE6" stroke="#888800" stroke-width="2"/>
    <text x="660" y="190" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">TNF-mediated</text>
    <text x="660" y="205" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Signaling Pathway</text>
    <text x="660" y="215" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">GO:0033209</text>
    
    <!-- TMC8 process label (GO:0010803) -->
    <rect x="600" y="380" width="120" height="50" rx="10" ry="10" fill="#FFFFE6" stroke="#888800" stroke-width="2"/>
    <text x="660" y="400" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Regulation of TNF</text>
    <text x="660" y="415" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Signaling Pathway</text>
    <text x="660" y="430" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">GO:0010803</text>
    
    <!-- Legend -->
    <rect x="50" y="520" width="700" height="70" rx="10" ry="10" fill="#F8F8F8" stroke="#444444" stroke-width="1"/>
    <text x="65" y="540" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Legend:</text>
    
    <!-- Protein Legend -->
    <rect x="65" y="550" width="20" height="20" fill="#FF9999" stroke="#CC0000" stroke-width="1"/>
    <text x="90" y="565" font-family="Arial" font-size="12" fill="#000000">Ligand (TNF)</text>
    
    <rect x="165" y="550" width="20" height="20" fill="#99CCFF" stroke="#0066CC" stroke-width="1"/>
    <text x="190" y="565" font-family="Arial" font-size="12" fill="#000000">Receptor (TNFRSF1A)</text>
    
    <rect x="300" y="550" width="20" height="20" fill="#FFCC99" stroke="#FF6600" stroke-width="1"/>
    <text x="325" y="565" font-family="Arial" font-size="12" fill="#000000">Adaptor (TRADD)</text>
    
    <rect x="405" y="550" width="20" height="20" fill="#99FF99" stroke="#00CC00" stroke-width="1"/>
    <text x="430" y="565" font-family="Arial" font-size="12" fill="#000000">Adaptor (TRAF2)</text>
    
    <rect x="510" y="550" width="20" height="20" fill="#CC99FF" stroke="#6600CC" stroke-width="1"/>
    <text x="535" y="565" font-family="Arial" font-size="12" fill="#000000">Regulator (TMC8)</text>
    
    <!-- Arrows Legend -->
    <line x1="605" y1="560" x2="625" y2="560" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="655" y="565" font-family="Arial" font-size="12" fill="#000000">Activation</text>
    
    <line x1="685" y1="560" x2="705" y2="560" stroke="#FF0000" stroke-width="4" marker-end="url(#inhibition)"/>
    <text x="730" y="565" font-family="Arial" font-size="12" fill="#FF0000">Inhibition</text>
    
    <!-- Arrowhead definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
        </marker>
        <marker id="inhibition" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
            <circle cx="6" cy="6" r="5" fill="#FFFFFF" stroke="#FF0000" stroke-width="1.5"/>
            <line x1="2" y1="6" x2="10" y2="6" stroke="#FF0000" stroke-width="1.5"/>
        </marker>
    </defs>
</svg>