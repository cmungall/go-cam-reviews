<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell nucleus background -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f0f8ff" stroke="#6495ed" stroke-width="2"/>
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Nucleus (GO:0005634)</text>
  
  <!-- DNA damage site -->
  <rect x="200" y="220" width="400" height="60" rx="10" ry="10" fill="#ffe4e1" stroke="#ff6347" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Site of DNA Damage (GO:0090734)</text>
  
  <!-- DNA helix with damage -->
  <path d="M 220,250 Q 250,230 280,250 Q 310,270 340,250 Q 370,230 400,250 Q 430,270 460,250 Q 490,230 520,250 Q 550,270 580,250" stroke="#000" fill="none" stroke-width="2"/>
  <path d="M 220,250 Q 250,270 280,250 Q 310,230 340,250 Q 370,270 400,250 Q 430,230 460,250 Q 490,270 520,250 Q 550,230 580,250" stroke="#000" fill="none" stroke-width="2"/>
  <path d="M 400,230 L 400,270" stroke="#ff0000" stroke-width="4"/>
  <text x="400" y="285" text-anchor="middle" font-family="Arial" font-size="14">Damaged DNA</text>
  
  <!-- PARP1 binding to damaged DNA -->
  <circle cx="400" cy="230" r="25" fill="#ff9999" stroke="#ff0000" stroke-width="2"/>
  <text x="400" y="235" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">PARP1</text>
  <text x="280" y="320" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">Damaged DNA binding (GO:0003684)</text>
  
  <!-- PARP1 auto-ADP-ribosylation -->
  <circle cx="320" cy="180" r="25" fill="#ff9999" stroke="#ff0000" stroke-width="2"/>
  <text x="320" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">PARP1</text>
  <path d="M 320,155 L 300,135 L 310,125 L 330,145 Z" fill="#ffd700" stroke="#daa520" stroke-width="1"/>
  <path d="M 320,155 L 340,135 L 350,145 L 330,165 Z" fill="#ffd700" stroke="#daa520" stroke-width="1"/>
  <text x="320" y="110" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">Auto-ADP-ribosylation</text>
  <text x="320" y="130" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">(GO:0070213)</text>
  <path d="M 380,215 L 335,180" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="345" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="#800000">Step 1</text>
  
  <!-- HPF1 interacting with PARP1 -->
  <circle cx="240" cy="180" r="25" fill="#add8e6" stroke="#4682b4" stroke-width="2"/>
  <text x="240" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">HPF1</text>
  <text x="240" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">Adaptor activity</text>
  <text x="240" y="160" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">(GO:0140768)</text>
  <path d="M 265,180 L 295,180" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#800000">Step 2</text>
  
  <!-- PARP1 histone modification -->
  <circle cx="480" cy="180" r="25" fill="#ff9999" stroke="#ff0000" stroke-width="2"/>
  <text x="480" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">PARP1</text>
  <rect x="510" y="165" width="30" height="30" fill="#d3d3d3" stroke="#808080" stroke-width="1"/>
  <text x="525" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">H</text>
  <path d="M 510,165 L 530,145 L 550,165" fill="none" stroke="#ffd700" stroke-width="2"/>
  <!-- Added directional arrow for ADP-ribosylation -->
  <path d="M 495,170 L 510,155" stroke="#ffd700" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="155" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">Histone ADP-ribosylation</text>
  <text x="570" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">(GO:0140816, GO:0140817)</text>
  <path d="M 420,215 L 465,195" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <path d="M 345,180 L 455,180" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#800000">Step 3</text>
  
  <!-- CHD1L recruitment -->
  <circle cx="480" cy="350" r="25" fill="#98fb98" stroke="#228b22" stroke-width="2"/>
  <text x="480" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">CHD1L</text>
  <text x="480" y="390" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">ADP-ribose binding</text>
  <text x="480" y="410" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">(GO:0160004)</text>
  <path d="M 480,180 L 480,325" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="250" text-anchor="middle" font-family="Arial" font-size="12" fill="#800000">Step 4</text>
  
  <!-- Chromatin remodeling by CHD1L -->
  <circle cx="600" cy="350" r="25" fill="#98fb98" stroke="#228b22" stroke-width="2"/>
  <text x="600" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">CHD1L</text>
  <path d="M 580,320 Q 600,300 620,320 Q 640,340 660,320" stroke="#808080" fill="none" stroke-width="2"/>
  <path d="M 580,370 Q 600,390 620,370 Q 640,350 660,370" stroke="#808080" fill="none" stroke-width="2"/>
  <path d="M 620,320 L 640,350" stroke="#808080" stroke-width="2"/>
  <!-- Added chromatin movement direction indicators -->
  <path d="M 610,310 L 625,310" stroke="#808080" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 610,380 L 625,380" stroke="#808080" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="650" y="385" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">Chromatin remodeler activity</text>
  <text x="650" y="405" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">(GO:0140658)</text>
  <path d="M 505,350 L 575,350" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="340" text-anchor="middle" font-family="Arial" font-size="12" fill="#800000">Step 5</text>

  <!-- Added note about CHD1L role -->
  <text x="640" y="435" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic" fill="#228b22">CHD1L facilitates DNA repair by remodeling</text>
  <text x="640" y="455" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic" fill="#228b22">chromatin to allow repair machinery access</text>

  <!-- DNA repair process label -->
  <text x="400" y="450" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#800000">DNA Repair Process (GO:0006281)</text>

  <!-- Arrows and markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="40" y="460" width="720" height="120" rx="10" ry="10" fill="white" stroke="black" stroke-width="1"/>
  <text x="50" y="480" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  
  <circle cx="70" cy="500" r="10" fill="#ff9999" stroke="#ff0000" stroke-width="2"/>
  <text x="85" y="505" font-family="Arial" font-size="14" text-anchor="start">PARP1 (UniProtKB:P09874)</text>
  
  <circle cx="70" cy="525" r="10" fill="#add8e6" stroke="#4682b4" stroke-width="2"/>
  <text x="85" y="530" font-family="Arial" font-size="14" text-anchor="start">HPF1 (UniProtKB:Q9NWY4)</text>
  
  <circle cx="70" cy="550" r="10" fill="#98fb98" stroke="#228b22" stroke-width="2"/>
  <text x="85" y="555" font-family="Arial" font-size="14" text-anchor="start">CHD1L (UniProtKB:Q86WJ1-5)</text>
  
  <rect x="250" y="495" width="15" height="15" fill="#d3d3d3" stroke="#808080" stroke-width="1"/>
  <text x="270" y="505" font-family="Arial" font-size="14" text-anchor="start">Histone</text>
  
  <path d="M 250,520 L 265,535" stroke="#ffd700" stroke-width="2"/>
  <text x="270" y="530" font-family="Arial" font-size="14" text-anchor="start">ADP-ribosylation</text>
  
  <path d="M 250,545 L 265,545" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="550" font-family="Arial" font-size="14" text-anchor="start">Causal relationship</text>
  
  <path d="M 400,495 L 415,495" stroke="#ff0000" stroke-width="3"/>
  <text x="420" y="500" font-family="Arial" font-size="14" text-anchor="start">DNA damage</text>
  
  <rect x="400" y="515" width="15" height="15" rx="5" ry="5" fill="#ffe4e1" stroke="#ff6347" stroke-width="1"/>
  <text x="420" y="525" font-family="Arial" font-size="14" text-anchor="start">Site of DNA damage</text>
  
  <ellipse cx="407" cy="545" rx="15" ry="10" fill="none" stroke="#6495ed" stroke-width="1"/>
  <text x="420" y="550" font-family="Arial" font-size="14" text-anchor="start">Nucleus</text>
  
  <text x="550" y="525" font-family="Arial" font-size="14" text-anchor="start" fill="#800000">Steps 1-5: Sequential process in pathway</text>
</svg>