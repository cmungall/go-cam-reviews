<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with nucleus and cytoplasm -->
  <rect width="800" height="600" fill="#f8f8f8" rx="10" ry="10" />
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="350" rx="300" ry="200" fill="#e6f2ff" stroke="#666" stroke-width="2" />
  <text x="400" y="540" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Nucleus</text>
  
  <!-- Strap protein and its functions -->
  <circle cx="400" cy="300" r="45" fill="#ffcc99" stroke="#ff9933" stroke-width="2" />
  <text x="400" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Strap</text>
  <text x="400" y="320" font-family="Arial" font-size="11" text-anchor="middle">(MGI:1329037)</text>
  
  <!-- U2 snRNP binding function -->
  <rect x="240" y="200" width="120" height="60" rx="10" ry="10" fill="#ccffcc" stroke="#339933" stroke-width="2" />
  <text x="300" y="230" font-family="Arial" font-size="14" text-anchor="middle">U2 snRNP binding</text>
  <text x="300" y="248" font-family="Arial" font-size="11" text-anchor="middle">(GO:1990447)</text>
  
  <!-- mRNA binding function -->
  <rect x="520" y="200" width="120" height="60" rx="10" ry="10" fill="#ccffcc" stroke="#339933" stroke-width="2" />
  <text x="580" y="230" font-family="Arial" font-size="14" text-anchor="middle">mRNA binding</text>
  <text x="580" y="248" font-family="Arial" font-size="11" text-anchor="middle">(GO:0003729)</text>
  
  <!-- Protein-RNA complex assembly -->
  <rect x="240" y="350" width="120" height="60" rx="10" ry="10" fill="#ffccff" stroke="#cc66cc" stroke-width="2" />
  <text x="300" y="375" font-family="Arial" font-size="14" text-anchor="middle">Protein-RNA</text>
  <text x="300" y="393" font-family="Arial" font-size="14" text-anchor="middle">complex assembly</text>
  <text x="300" y="408" font-family="Arial" font-size="11" text-anchor="middle">(GO:0022618)</text>
  
  <!-- Alternative mRNA splicing -->
  <rect x="520" y="350" width="120" height="60" rx="10" ry="10" fill="#ffccff" stroke="#cc66cc" stroke-width="2" />
  <text x="580" y="375" font-family="Arial" font-size="14" text-anchor="middle">Alternative mRNA</text>
  <text x="580" y="393" font-family="Arial" font-size="14" text-anchor="middle">splicing</text>
  <text x="580" y="408" font-family="Arial" font-size="11" text-anchor="middle">(GO:0000380)</text>
  
  <!-- Transcription factors -->
  <circle cx="300" cy="450" r="35" fill="#ff9999" stroke="#cc3333" stroke-width="2" />
  <text x="300" y="445" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Sp1</text>
  <text x="300" y="463" font-family="Arial" font-size="11" text-anchor="middle">(MGI:98372)</text>
  
  <circle cx="500" cy="450" r="35" fill="#ff9999" stroke="#cc3333" stroke-width="2" />
  <text x="500" y="445" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Klf9</text>
  <text x="500" y="463" font-family="Arial" font-size="11" text-anchor="middle">(MGI:1333856)</text>
  
  <!-- Cyp26a1 and retinoic acid catabolism -->
  <rect x="380" y="100" width="110" height="50" rx="10" ry="10" fill="#99ccff" stroke="#3366cc" stroke-width="2" />
  <text x="435" y="125" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Cyp26a1</text>
  <text x="435" y="143" font-family="Arial" font-size="11" text-anchor="middle">(MGI:1096359)</text>
  
  <rect x="300" y="20" width="200" height="60" rx="10" ry="10" fill="#ffff99" stroke="#cc9900" stroke-width="2" />
  <text x="400" y="45" font-family="Arial" font-size="14" text-anchor="middle">Retinoic acid</text>
  <text x="400" y="63" font-family="Arial" font-size="14" text-anchor="middle">catabolic process</text>
  <text x="400" y="78" font-family="Arial" font-size="11" text-anchor="middle">(GO:0034653)</text>
  
  <!-- Connections between components -->
  <!-- Strap to functions -->
  <line x1="375" y1="265" x2="320" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="425" y1="265" x2="480" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="375" y1="335" x2="320" y2="370" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="425" y1="335" x2="480" y2="370" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Negative regulation of transcription factors -->
  <line x1="380" y1="340" x2="320" y2="415" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#inhibition)" />
  <line x1="420" y1="340" x2="480" y2="415" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#inhibition)" />
  
  <!-- Transcription factors to Cyp26a1 -->
  <line x1="325" y1="425" x2="390" y2="150" stroke="#006600" stroke-width="2" marker-end="url(#activation)" />
  <line x1="475" y1="425" x2="420" y2="150" stroke="#006600" stroke-width="2" marker-end="url(#activation)" />
  
  <!-- Cyp26a1 to retinoic acid catabolism -->
  <line x1="400" y1="100" x2="400" y2="80" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Markers for arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#666"/>
    </marker>
    <marker id="activation" viewBox="0 0 10 10" refX="9" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#006600"/>
    </marker>
    <marker id="inhibition" viewBox="0 0 10 10" refX="5" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#cc0000" stroke-width="2"/>
    </marker>
  </defs>
  
  <!-- Legend - improved with better spacing and larger text -->
  <rect x="590" y="460" width="190" height="130" fill="white" stroke="#333" stroke-width="1" />
  <text x="600" y="480" font-family="Arial" font-size="13" font-weight="bold">Legend:</text>
  
  <circle cx="610" cy="500" r="5" fill="#ffcc99" stroke="#ff9933" stroke-width="1" />
  <text x="625" y="504" font-family="Arial" font-size="12">Protein</text>
  
  <rect x="600" y="515" width="10" height="10" rx="3" ry="3" fill="#ccffcc" stroke="#339933" stroke-width="1" />
  <text x="625" y="524" font-family="Arial" font-size="12">Molecular Function</text>
  
  <rect x="600" y="535" width="10" height="10" rx="3" ry="3" fill="#ffccff" stroke="#cc66cc" stroke-width="1" />
  <text x="625" y="544" font-family="Arial" font-size="12">Biological Process</text>

  <rect x="600" y="555" width="10" height="10" rx="3" ry="3" fill="#99ccff" stroke="#3366cc" stroke-width="1" />
  <text x="625" y="564" font-family="Arial" font-size="12">Enzyme</text>

  <line x1="600" y1="575" x2="620" y2="575" stroke="#006600" stroke-width="2" marker-end="url(#activation)" />
  <text x="625" y="579" font-family="Arial" font-size="12">Positive regulation</text>
  
  <line x1="600" y1="595" x2="620" y2="595" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#inhibition)" />
  <text x="625" y="599" font-family="Arial" font-size="12">Negative regulation</text>
  
  <text x="400" y="580" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Strap in alternative splicing (mouse)</text>
</svg>