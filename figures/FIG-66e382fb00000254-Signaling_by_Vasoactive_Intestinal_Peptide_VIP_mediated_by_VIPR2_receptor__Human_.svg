<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="630" fill="#ffffff" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Signaling by Vasoactive Intestinal Peptide/VIP mediated by VIPR2 receptor (Human)</text>
  
  <!-- Description -->
  <text x="400" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">
    VIP binding to VIPR2 triggers G protein activation, leading to adenylate cyclase activation and cAMP production
  </text>
  
  <!-- Cell membrane -->
  <rect x="100" y="150" width="600" height="30" fill="#D5E8D4" stroke="#82B366" stroke-width="2" />
  <text x="120" y="170" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Plasma Membrane (GO:0005886)</text>
  
  <!-- Extracellular space -->
  <rect x="100" y="70" width="600" height="80" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1" opacity="0.5" />
  <text x="120" y="90" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Extracellular Space (GO:0005615)</text>
  
  <!-- Cytosol -->
  <rect x="100" y="180" width="600" height="370" fill="#FFF2CC" stroke="#D6B656" stroke-width="1" opacity="0.5" />
  <text x="120" y="200" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Cytosol (GO:0005829)</text>
  
  <!-- VIP Hormone -->
  <circle cx="250" y="115" r="30" fill="#FF9999" stroke="#CC0000" stroke-width="2" />
  <text x="250" y="115" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">VIP</text>
  <text x="250" y="130" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">(P01282)</text>
  
  <!-- VIPR2 Receptor -->
  <rect x="220" y="150" width="60" height="30" fill="#C3ABD0" stroke="#9673A6" stroke-width="2" />
  <text x="250" y="170" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">VIPR2</text>
  <text x="250" y="187" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">(P41587)</text>
  
  <!-- G protein (GNAS) -->
  <polygon points="250,230 270,250 250,270 230,250" fill="#FFCC99" stroke="#FF9933" stroke-width="2" />
  <text x="250" y="252" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">GNAS</text>
  <text x="250" y="270" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">(Q5JWF2)</text>
  
  <!-- Adenylate cyclase -->
  <rect x="215" y="320" width="70" height="40" rx="15" ry="15" fill="#B1DDF0" stroke="#6BAED6" stroke-width="2" />
  <text x="250" y="340" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">ADCY6</text>
  <text x="250" y="355" font-family="Arial" font-size="11" text-anchor="middle" fill="#000">(O43306)</text>
  
  <!-- cAMP molecule -->
  <circle cx="250" y="420" r="25" fill="#99CC99" stroke="#009900" stroke-width="2" />
  <text x="250" y="425" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">cAMP</text>
  
  <!-- Arrows with labels -->
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
  </marker>
  
  <!-- VIP to VIPR2 -->
  <line x1="250" y1="145" x2="250" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="265" y="148" font-family="Arial" font-size="12" fill="#000">binds</text>
  
  <!-- VIPR2 to G protein -->
  <line x1="250" y1="180" x2="250" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="265" y="205" font-family="Arial" font-size="12" fill="#000">activates</text>
  
  <!-- G protein to Adenylate cyclase -->
  <line x1="250" y1="270" x2="250" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="265" y="295" font-family="Arial" font-size="12" fill="#000">activates</text>
  
  <!-- Adenylate cyclase to cAMP -->
  <line x1="250" y1="360" x2="250" y2="395" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="265" y="380" font-family="Arial" font-size="12" fill="#000">produces</text>
  
  <!-- Process label -->
  <rect x="450" y="230" width="220" height="80" rx="10" ry="10" fill="#FFFFFF" stroke="#999999" stroke-width="1" stroke-dasharray="5,2" />
  <text x="560" y="255" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">Adenylate cyclase-activating</text>
  <text x="560" y="275" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">G protein-coupled receptor</text>
  <text x="560" y="295" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">signaling pathway</text>
  <text x="560" y="315" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">(GO:0007189)</text>
  
  <!-- Labels for activities -->
  <text x="350" y="105" font-family="Arial" font-size="12" fill="#000" text-anchor="start" font-weight="bold">Neuropeptide hormone activity</text>
  <text x="350" y="120" font-family="Arial" font-size="11" fill="#333" text-anchor="start">(GO:0005184)</text>
  
  <text x="350" y="160" font-family="Arial" font-size="12" fill="#000" text-anchor="start" font-weight="bold">VIP receptor activity</text>
  <text x="350" y="175" font-family="Arial" font-size="11" fill="#333" text-anchor="start">(GO:0004999)</text>
  
  <text x="350" y="240" font-family="Arial" font-size="12" fill="#000" text-anchor="start" font-weight="bold">G protein activity</text>
  <text x="350" y="255" font-family="Arial" font-size="11" fill="#333" text-anchor="start">(GO:0003925)</text>
  
  <text x="350" y="330" font-family="Arial" font-size="12" fill="#000" text-anchor="start" font-weight="bold">Adenylate cyclase activity</text>
  <text x="350" y="345" font-family="Arial" font-size="11" fill="#333" text-anchor="start">(GO:0004016)</text>
  
  <text x="350" y="420" font-family="Arial" font-size="12" fill="#000" text-anchor="start" font-weight="bold">3',5'-cyclic AMP</text>
  <text x="350" y="435" font-family="Arial" font-size="11" fill="#333" text-anchor="start">(CHEBI:17489)</text>
  
  <!-- cAMP function note -->
  <text x="350" y="455" font-family="Arial" font-size="11" fill="#333" text-anchor="start">Second messenger that activates</text>
  <text x="350" y="470" font-family="Arial" font-size="11" fill="#333" text-anchor="start">downstream signaling cascades</text>
  
  <!-- Legend -->
  <rect x="100" y="560" width="600" height="60" rx="5" ry="5" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1" />
  <text x="110" y="575" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Legend:</text>
  <text x="110" y="592" font-family="Arial" font-size="11" fill="#333">GO - Gene Ontology terms (cellular components, molecular functions, biological processes)</text>
  <text x="110" y="610" font-family="Arial" font-size="11" fill="#333">UniProtKB identifiers (e.g., P41587) refer to specific human proteins in the UniProt database</text>
</svg>