<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#ffffff" />
  
  <!-- Cell components -->
  <!-- Cytosol -->
  <rect x="50" y="50" width="700" height="450" rx="20" ry="20" fill="#f2f9ff" stroke="#aaccdd" stroke-width="2" />
  <text x="80" y="80" font-family="Arial" font-size="16" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="650" cy="400" rx="100" ry="70" fill="#ffe6e6" stroke="#dd9999" stroke-width="2" />
  <text x="650" y="400" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Mitochondrion</text>
  <text x="650" y="420" font-family="Arial" font-size="12" text-anchor="middle">(GO:0005739)</text>
  
  <!-- Pathway Elements -->
  <!-- Starting substrate -->
  <rect x="100" y="150" width="80" height="40" rx="5" ry="5" fill="#c6eaff" stroke="#333333" stroke-width="1" />
  <text x="140" y="175" font-family="Arial" font-size="14" text-anchor="middle">dTMP</text>
  
  <!-- Enzyme 1: Nt5c and Nt5c3 (GO:0008253) -->
  <rect x="100" y="220" width="80" height="50" rx="10" ry="10" fill="#ffe0bd" stroke="#333333" stroke-width="1" />
  <text x="140" y="240" font-family="Arial" font-size="12" text-anchor="middle">Nt5c / Nt5c3</text>
  <text x="140" y="255" font-family="Arial" font-size="10" text-anchor="middle">5'-nucleotidase</text>
  <text x="140" y="265" font-family="Arial" font-size="8" text-anchor="middle">(GO:0008253)</text>
  
  <!-- Product 1: dThd (Thymidine) -->
  <rect x="250" y="150" width="80" height="40" rx="5" ry="5" fill="#c6eaff" stroke="#333333" stroke-width="1" />
  <text x="290" y="170" font-family="Arial" font-size="14" text-anchor="middle">dThd</text>
  <text x="290" y="185" font-family="Arial" font-size="10" text-anchor="middle">(Thymidine)</text>
  
  <!-- Enzyme 2: Tymp & Upp1 (GO:0009032) -->
  <rect x="250" y="220" width="80" height="50" rx="10" ry="10" fill="#ffe0bd" stroke="#333333" stroke-width="1" />
  <text x="290" y="240" font-family="Arial" font-size="12" text-anchor="middle">Tymp / Upp1</text>
  <text x="290" y="255" font-family="Arial" font-size="9" text-anchor="middle">Thymidine phosphorylase</text>
  <text x="290" y="265" font-family="Arial" font-size="8" text-anchor="middle">(GO:0009032)</text>
  
  <!-- Product 2: Thymine -->
  <rect x="400" y="150" width="80" height="40" rx="5" ry="5" fill="#c6eaff" stroke="#333333" stroke-width="1" />
  <text x="440" y="175" font-family="Arial" font-size="14" text-anchor="middle">Thymine</text>
  
  <!-- Enzyme 3: Dpyd (GO:0017113) -->
  <rect x="400" y="220" width="80" height="50" rx="10" ry="10" fill="#ffe0bd" stroke="#333333" stroke-width="1" />
  <text x="440" y="240" font-family="Arial" font-size="12" text-anchor="middle">Dpyd</text>
  <text x="440" y="255" font-family="Arial" font-size="9" text-anchor="middle">Dihydropyrimidine</text>
  <text x="440" y="265" font-family="Arial" font-size="9" text-anchor="middle">dehydrogenase</text>
  <text x="440" y="275" font-family="Arial" font-size="8" text-anchor="middle">(GO:0017113)</text>
  
  <!-- Product 3: Dihydrothymine -->
  <rect x="550" y="150" width="80" height="40" rx="5" ry="5" fill="#c6eaff" stroke="#333333" stroke-width="1" />
  <text x="590" y="175" font-family="Arial" font-size="14" text-anchor="middle">Dihydrothymine</text>
  
  <!-- Enzyme 4: Dpys (GO:0004157) -->
  <rect x="550" y="220" width="80" height="50" rx="10" ry="10" fill="#ffe0bd" stroke="#333333" stroke-width="1" />
  <text x="590" y="240" font-family="Arial" font-size="12" text-anchor="middle">Dpys</text>
  <text x="590" y="255" font-family="Arial" font-size="9" text-anchor="middle">Dihydropyrimidinase</text>
  <text x="590" y="265" font-family="Arial" font-size="8" text-anchor="middle">(GO:0004157)</text>
  
  <!-- Product 4: N-carbamoyl-β-alanine -->
  <rect x="400" y="300" width="80" height="40" rx="5" ry="5" fill="#c6eaff" stroke="#333333" stroke-width="1" />
  <text x="440" y="320" font-family="Arial" font-size="12" text-anchor="middle">N-carbamoyl</text>
  <text x="440" y="335" font-family="Arial" font-size="12" text-anchor="middle">β-alanine</text>
  
  <!-- Enzyme 5: Upb1 (GO:0003837) -->
  <rect x="400" y="370" width="80" height="50" rx="10" ry="10" fill="#ffe0bd" stroke="#333333" stroke-width="1" />
  <text x="440" y="390" font-family="Arial" font-size="12" text-anchor="middle">Upb1</text>
  <text x="440" y="405" font-family="Arial" font-size="9" text-anchor="middle">β-ureidopropionase</text>
  <text x="440" y="415" font-family="Arial" font-size="8" text-anchor="middle">(GO:0003837)</text>
  
  <!-- Product 5: β-alanine -->
  <rect x="550" y="300" width="80" height="40" rx="5" ry="5" fill="#c6eaff" stroke="#333333" stroke-width="1" />
  <text x="590" y="325" font-family="Arial" font-size="14" text-anchor="middle">β-alanine</text>
  
  <!-- Enzyme 6: Agxt2 (GO:0047305) in mitochondrion -->
  <rect x="600" y="370" width="80" height="50" rx="10" ry="10" fill="#ffb8b8" stroke="#333333" stroke-width="1" />
  <text x="640" y="390" font-family="Arial" font-size="12" text-anchor="middle">Agxt2</text>
  <text x="640" y="405" font-family="Arial" font-size="9" text-anchor="middle">Transaminase</text>
  <text x="640" y="415" font-family="Arial" font-size="8" text-anchor="middle">(GO:0047305)</text>
  
  <!-- Final Product: Malonate semialdehyde -->
  <rect x="600" y="440" width="80" height="40" rx="5" ry="5" fill="#c6eaff" stroke="#333333" stroke-width="1" />
  <text x="640" y="455" font-family="Arial" font-size="12" text-anchor="middle">Malonate</text>
  <text x="640" y="470" font-family="Arial" font-size="12" text-anchor="middle">semialdehyde</text>
  
  <!-- Arrows -->
  <line x1="140" y1="190" x2="140" y2="220" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="180" y1="240" x2="250" y2="240" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="290" y1="190" x2="290" y2="220" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="330" y1="240" x2="400" y2="240" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="440" y1="190" x2="440" y2="220" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="480" y1="240" x2="550" y2="240" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="590" y1="190" x2="590" y2="220" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="590" y1="270" x2="480" y2="300" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="440" y1="340" x2="440" y2="370" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="480" y1="390" x2="550" y2="320" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="590" y1="340" x2="640" y2="370" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="640" y1="420" x2="640" y2="440" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)" />
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">dTMP Catabolic Process (GO:0046074) in Mouse</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="700" height="110" rx="5" ry="5" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" />
  <text x="60" y="540" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <!-- Enzyme symbol -->
  <rect x="130" y="530" width="30" height="20" rx="10" ry="10" fill="#ffe0bd" stroke="#333333" stroke-width="1" />
  <text x="170" y="545" font-family="Arial" font-size="12">Enzyme</text>
  
  <!-- Metabolite symbol -->
  <rect x="230" y="530" width="30" height="20" rx="5" ry="5" fill="#c6eaff" stroke="#333333" stroke-width="1" />
  <text x="270" y="545" font-family="Arial" font-size="12">Metabolite</text>
  
  <!-- Mitochondrial enzyme symbol -->
  <rect x="330" y="530" width="30" height="20" rx="10" ry="10" fill="#ffb8b8" stroke="#333333" stroke-width="1" />
  <text x="420" y="545" font-family="Arial" font-size="12">Mitochondrial Enzyme</text>
  
  <!-- Process label -->
  <text x="520" y="545" font-family="Arial" font-size="12" font-style="italic">Part of: dTMP catabolic process</text>
  
  <!-- Abbreviations -->
  <text x="60" y="570" font-family="Arial" font-size="12" font-weight="bold">Abbreviations:</text>
  <text x="60" y="590" font-family="Arial" font-size="12">dTMP - Deoxythymidine monophosphate</text>
  <text x="60" y="610" font-family="Arial" font-size="12">dThd - Thymidine (deoxythymidine)</text>
  <text x="330" y="590" font-family="Arial" font-size="12">Mmus - Mus musculus (house mouse)</text>
  <text x="330" y="610" font-family="Arial" font-size="12">GO - Gene Ontology</text>
</svg>