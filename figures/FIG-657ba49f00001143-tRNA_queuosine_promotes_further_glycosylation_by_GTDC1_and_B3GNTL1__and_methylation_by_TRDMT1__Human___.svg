<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Cytoplasm -->
  <rect x="0" y="0" width="800" height="650" rx="20" ry="20" fill="#f5f9ff" stroke="#aac" stroke-width="2"/>
  <text x="40" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#445">Cytoplasm</text>
  
  <!-- tRNA molecules -->
  <!-- Initial tRNA -->
  <path d="M100,280 C110,250 140,230 140,200 C140,170 110,150 100,120 L120,120 C130,150 160,170 160,200 C160,230 130,250 120,280 Z" 
        fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="95" y="310" font-family="Arial" font-size="16" font-weight="bold" fill="#333">tRNA</text>
  
  <!-- tRNA with queuosine -->
  <path d="M300,280 C310,250 340,230 340,200 C340,170 310,150 300,120 L320,120 C330,150 360,170 360,200 C360,230 330,250 320,280 Z" 
        fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <circle cx="320" cy="220" r="12" fill="#ff9900" stroke="#cc7700" stroke-width="1.5"/>
  <text x="320" cy="220" font-family="Arial" font-size="10" fill="black" text-anchor="middle">Q</text>
  <text x="270" y="310" font-family="Arial" font-size="16" font-weight="bold" fill="#333">tRNA-Q</text>
  
  <!-- tRNA with mannose modified queuosine -->
  <path d="M500,200 C510,170 540,150 540,120 C540,90 510,70 500,40 L520,40 C530,70 560,90 560,120 C560,150 530,170 520,200 Z" 
        fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <circle cx="520" cy="140" r="12" fill="#ff9900" stroke="#cc7700" stroke-width="1.5"/>
  <circle cx="540" cy="120" r="8" fill="#9d6" stroke="#090" stroke-width="1.5"/>
  <text x="475" y="230" font-family="Arial" font-size="16" font-weight="bold" fill="#333">tRNA-Q-mannose</text>
  
  <!-- tRNA with galactose modified queuosine -->
  <path d="M500,400 C510,370 540,350 540,320 C540,290 510,270 500,240 L520,240 C530,270 560,290 560,320 C560,350 530,370 520,400 Z" 
        fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <circle cx="520" cy="340" r="12" fill="#ff9900" stroke="#cc7700" stroke-width="1.5"/>
  <circle cx="540" cy="320" r="8" fill="#f8c" stroke="#c05" stroke-width="1.5"/>
  <text x="465" y="430" font-family="Arial" font-size="16" font-weight="bold" fill="#333">tRNA-Q-galactose</text>
  
  <!-- tRNA with methylated cytidine -->
  <path d="M700,280 C710,250 740,230 740,200 C740,170 710,150 700,120 L720,120 C730,150 760,170 760,200 C760,230 730,250 720,280 Z" 
        fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <circle cx="720" cy="220" r="12" fill="#ff9900" stroke="#cc7700" stroke-width="1.5"/>
  <text x="715" cy="220" font-family="Arial" font-size="10" fill="black" text-anchor="middle">Q</text>
  <circle cx="720" cy="170" r="9" fill="#aaf" stroke="#55a" stroke-width="1.5"/>
  <text x="720" cy="173" font-family="Arial" font-size="11" fill="white" text-anchor="middle">CH₃</text>
  <text x="670" y="310" font-family="Arial" font-size="16" font-weight="bold" fill="#333">tRNA-Q-methyl</text>
  
  <!-- Proteins and arrows -->
  <!-- QTRT1 + QTRT2 complex -->
  <rect x="170" y="180" width="80" height="45" rx="10" ry="10" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="180" y="210" font-family="Arial" font-size="16" font-weight="bold" fill="#333">QTRT1</text>
  <rect x="170" y="135" width="80" height="45" rx="10" ry="10" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="180" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#333">QTRT2</text>
  <line x1="155" y1="180" x2="170" y2="180" stroke="#555" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="155" y1="140" x2="170" y2="140" stroke="#555" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Arrow from tRNA to tRNA-Q -->
  <path d="M180,200 L270,200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="180" y="160" width="120" height="40" rx="5" ry="5" fill="rgba(255,255,255,0.85)" stroke="#ddd" stroke-width="1"/>
  <text x="190" y="180" font-family="Arial" font-size="12" fill="#333">Transglycosylation</text>
  <text x="190" y="195" font-family="Arial" font-size="10" fill="#555">Replaces guanine at position 34 with queuine</text>
  
  <!-- GTDC1 protein -->
  <rect x="370" y="100" width="80" height="45" rx="10" ry="10" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="380" y="130" font-family="Arial" font-size="16" font-weight="bold" fill="#333">GTDC1</text>
  
  <!-- Arrow from tRNA-Q to mannose-modified -->
  <path d="M370,120 L460,120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="380" y="80" width="100" height="40" rx="5" ry="5" fill="rgba(255,255,255,0.85)" stroke="#ddd" stroke-width="1"/>
  <text x="390" y="100" font-family="Arial" font-size="12" fill="#333">Mannosylation</text>
  <text x="390" y="115" font-family="Arial" font-size="10" fill="#555">Adds mannose to Q34</text>
  
  <!-- B3GNTL1 protein -->
  <rect x="370" y="300" width="80" height="45" rx="10" ry="10" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="370" y="330" font-family="Arial" font-size="16" font-weight="bold" fill="#333">B3GNTL1</text>
  
  <!-- Arrow from tRNA-Q to galactose-modified -->
  <path d="M370,320 L460,320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="380" y="280" width="100" height="40" rx="5" ry="5" fill="rgba(255,255,255,0.85)" stroke="#ddd" stroke-width="1"/>
  <text x="390" y="300" font-family="Arial" font-size="12" fill="#333">Galactosylation</text>
  <text x="390" y="315" font-family="Arial" font-size="10" fill="#555">Adds galactose to Q34</text>
  
  <!-- TRDMT1 protein -->
  <rect x="600" y="180" width="80" height="45" rx="10" ry="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="605" y="210" font-family="Arial" font-size="16" font-weight="bold" fill="#333">TRDMT1</text>
  
  <!-- Arrow from tRNA-Q to methylated -->
  <path d="M380,200 C450,200 520,200 600,200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="450" y="160" width="100" height="40" rx="5" ry="5" fill="rgba(255,255,255,0.85)" stroke="#ddd" stroke-width="1"/>
  <text x="460" y="180" font-family="Arial" font-size="12" fill="#333">Methylation</text>
  <text x="460" y="195" font-family="Arial" font-size="10" fill="#555">Methylates cytidine at position 5</text>
  
  <!-- Define marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">tRNA Queuosine Modification Pathway in Human Cells</text>
  
  <!-- Diagram legend -->
  <rect x="40" y="500" width="720" height="130" rx="5" ry="5" fill="#fff" stroke="#ddd" stroke-width="1"/>
  
  <!-- Legend header -->
  <text x="50" y="520" font-family="Arial" font-size="16" font-weight="bold" fill="#333">PATHWAY LEGEND</text>
  
  <!-- Legend symbols -->
  <rect x="50" y="530" width="15" height="15" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="75" y="543" font-family="Arial" font-size="14" fill="#333">Transglycosylase enzymes (QTRT1/QTRT2)</text>
  
  <rect x="50" y="550" width="15" height="15" fill="#cfe2ff" stroke="#0d6efd" stroke-width="1"/>
  <text x="75" y="563" font-family="Arial" font-size="14" fill="#333">Glycosyltransferase enzymes (GTDC1, B3GNTL1)</text>
  
  <rect x="50" y="570" width="15" height="15" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="75" y="583" font-family="Arial" font-size="14" fill="#333">Methyltransferase enzyme (TRDMT1)</text>
  
  <path d="M50,595 C52,590 57,585 57,580 C57,575 52,570 50,565 L53,565 C55,570 60,575 60,580 C60,585 55,590 53,595 Z" 
        fill="#d1e7dd" stroke="#198754" stroke-width="1.5" />
  <text x="75" y="603" font-family="Arial" font-size="14" fill="#333">tRNA molecules (substrate and products)</text>
  
  <circle cx="57" cy="615" r="7" fill="#ff9900" stroke="#cc7700" stroke-width="1"/>
  <text x="75" y="620" font-family="Arial" font-size="14" fill="#333">Queuosine (Q) modification at position 34</text>
  
  <!-- Explanation paragraph -->
  <text x="400" y="550" font-family="Arial" font-size="14" fill="#333">
    <tspan x="400" dy="0">QTRT1/QTRT2 form a complex catalyzing the exchange of guanine with queuine at position 34 </tspan>
    <tspan x="400" dy="20">of tRNA. GTDC1 adds mannose to the queuosine, while B3GNTL1 adds galactose.</tspan>
    <tspan x="400" dy="20">TRDMT1 methylates cytidine at position 5 of queuosine-modified tRNA. All these</tspan>
    <tspan x="400" dy="20">reactions occur in the cytoplasmic compartment of human cells.</tspan>
  </text>
</svg>