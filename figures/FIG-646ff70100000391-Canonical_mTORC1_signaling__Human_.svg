<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="10" y="10" width="780" height="680" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  
  <!-- Lysosomal membrane -->
  <ellipse cx="400" cy="200" rx="250" ry="120" fill="#FFE4B5" stroke="#8B4513" stroke-width="3"/>
  <text x="400" y="200" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#8B4513">Lysosomal Membrane (GO:0005765)</text>
  
  <!-- Cytosolic ribosome -->
  <rect x="550" y="450" width="150" height="100" rx="10" ry="10" fill="#D3D3D3" stroke="#555" stroke-width="2"/>
  <text x="625" y="505" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Cytosolic Ribosome (GO:0022626)</text>
  
  <!-- Ragulator complex -->
  <rect x="250" y="150" width="100" height="40" rx="5" ry="5" fill="#ADD8E6" stroke="#4682B4" stroke-width="2"/>
  <text x="300" y="175" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Ragulator (GO:0071986)</text>
  
  <!-- LAMTOR1 -->
  <rect x="195" y="100" width="80" height="30" rx="5" ry="5" fill="#B0C4DE" stroke="#4682B4" stroke-width="2"/>
  <text x="235" y="120" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">LAMTOR1</text>
  
  <!-- Rag GTPases -->
  <circle cx="400" cy="170" r="40" fill="#98FB98" stroke="#2E8B57" stroke-width="2"/>
  <text x="400" y="165" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Rag GTPases</text>
  <text x="400" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">RRAGA/RRAGC</text>
  
  <!-- RHEB -->
  <circle cx="500" cy="170" r="30" fill="#FFA07A" stroke="#CD5C5C" stroke-width="2"/>
  <text x="500" y="175" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">RHEB</text>
  
  <!-- mTORC1 -->
  <rect x="450" y="250" width="100" height="50" rx="10" ry="10" fill="#FF6347" stroke="#8B0000" stroke-width="3"/>
  <text x="500" y="280" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="white">mTORC1</text>
  
  <!-- RPTOR -->
  <rect x="375" y="260" width="60" height="30" rx="5" ry="5" fill="#FA8072" stroke="#8B0000" stroke-width="2"/>
  <text x="405" y="280" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">RPTOR</text>
  
  <!-- S6K (RPS6KB1/2) -->
  <rect x="400" y="350" width="80" height="40" rx="5" ry="5" fill="#9370DB" stroke="#483D8B" stroke-width="2"/>
  <text x="440" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">S6K</text>
  <text x="440" y="385" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">(RPS6KB1/2)</text>
  
  <!-- 4E-BP1 -->
  <rect x="520" y="350" width="80" height="40" rx="5" ry="5" fill="#9370DB" stroke="#483D8B" stroke-width="2"/>
  <text x="560" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">4E-BP1</text>
  <text x="560" y="385" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">(EIF4EBP1)</text>
  
  <!-- RPS6 -->
  <rect x="400" y="450" width="80" height="40" rx="5" ry="5" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
  <text x="440" y="475" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">RPS6</text>
  
  <!-- eIF4E (implicit) -->
  <rect x="520" y="450" width="80" height="40" rx="5" ry="5" fill="#FFD700" stroke="#B8860B" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="560" y="475" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">eIF4E*</text>
  
  <!-- Arrows and interactions -->
  <!-- LAMTOR1 to Ragulator -->
  <path d="M235 130 L270 150" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="240" y="145" font-family="Arial" font-size="12" font-weight="bold" fill="#666">Adaptor</text>
  
  <!-- Ragulator to Rag GTPases -->
  <path d="M350 170 L360 170" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="355" y="160" font-family="Arial" font-size="12" font-weight="bold" fill="#666">GEF</text>
  
  <!-- Rag GTPases to mTORC1 -->
  <path d="M430 200 L460 250" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="435" y="235" font-family="Arial" font-size="12" font-weight="bold" fill="#666">Recruit</text>
  
  <!-- RHEB to mTORC1 -->
  <path d="M500 200 L500 250" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="510" y="225" font-family="Arial" font-size="12" font-weight="bold" fill="#666">Activate</text>
  
  <!-- mTORC1 to S6K -->
  <path d="M480 300 L440 350" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="445" y="330" font-family="Arial" font-size="12" font-weight="bold" fill="#666">Phosphorylate</text>
  
  <!-- mTORC1 to 4E-BP1 -->
  <path d="M520 300 L560 350" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="550" y="330" font-family="Arial" font-size="12" font-weight="bold" fill="#666">Phosphorylate</text>
  
  <!-- S6K to RPS6 -->
  <path d="M440 390 L440 450" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="445" y="420" font-family="Arial" font-size="12" font-weight="bold" fill="#666">Phosphorylate</text>
  
  <!-- 4E-BP1 to eIF4E -->
  <path d="M560 390 L560 450" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="565" y="420" font-family="Arial" font-size="12" font-weight="bold" fill="#666">Release</text>
  
  <!-- Add annotation for 4E-BP1 -->
  <text x="580" y="410" font-family="Arial" font-size="11" fill="#666" font-style="italic">Phosphorylation relieves</text>
  <text x="580" y="422" font-family="Arial" font-size="11" fill="#666" font-style="italic">inhibition of eIF4E</text>
  
  <!-- Add arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Add annotation for pathway significance -->
  <rect x="100" y="315" width="160" height="60" rx="5" ry="5" fill="#FFFFFF" stroke="#666" stroke-width="1" opacity="0.9"/>
  <text x="180" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">Nutrient sensing pathway</text>
  <text x="180" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">leading to regulation of</text>
  <text x="180" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-style="italic">protein synthesis</text>
  
  <!-- Legend -->
  <rect x="20" y="600" width="760" height="80" rx="5" ry="5" fill="white" stroke="#666" stroke-width="1"/>
  <text x="30" y="620" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Legend:</text>
  
  <rect x="30" y="630" width="20" height="20" fill="#ADD8E6" stroke="#4682B4" stroke-width="2"/>
  <text x="55" y="645" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Protein Complex</text>
  
  <circle cx="170" cy="640" r="10" fill="#98FB98" stroke="#2E8B57" stroke-width="2"/>
  <text x="185" y="645" font-family="Arial" font-size="14" font-weight="bold" fill="#333">GTPase</text>
  
  <rect x="260" y="630" width="20" height="20" fill="#9370DB" stroke="#483D8B" stroke-width="2"/>
  <text x="285" y="645" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Kinase</text>
  
  <rect x="350" y="630" width="20" height="20" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
  <text x="375" y="645" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Substrate</text>
  
  <rect x="450" y="630" width="20" height="20" fill="white" stroke="#666" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="475" y="645" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Implicit (not in source)</text>
  
  <text x="30" y="670" font-family="Arial" font-size="13" font-style="italic" fill="#333">* eIF4E is implied but not explicitly in the source model - when 4E-BP1 is phosphorylated, it releases eIF4E which then promotes translation initiation</text>
  
  <!-- Title -->
  <rect x="200" y="20" width="400" height="40" rx="5" ry="5" fill="#FFFFFF" stroke="#333" stroke-width="1"/>
  <text x="400" y="45" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Canonical mTORC1 Signaling (Human)</text>
</svg>