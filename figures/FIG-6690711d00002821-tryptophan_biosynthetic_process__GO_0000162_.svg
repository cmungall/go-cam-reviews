<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
    <!-- Cell outline with cytosol -->
    <rect x="50" y="50" width="700" height="520" rx="50" ry="50" fill="#f0f9ff" stroke="#666" stroke-width="2"/>
    <text x="400" y="90" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">S. pombe Cell</text>
    <text x="120" y="90" font-family="Arial" font-size="16" text-anchor="start" font-style="italic">Cytosol (GO:0005829)</text>
    
    <!-- Tryptophan Biosynthetic Pathway Title -->
    <text x="400" y="40" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Tryptophan Biosynthetic Process (GO:0000162)</text>
    
    <!-- Pathway Steps with color coding -->
    <!-- Step 1: Anthranilate synthase -->
    <rect x="100" y="150" width="160" height="70" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2"/>
    <text x="180" y="175" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Anthranilate synthase</text>
    <text x="180" y="195" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">trp3 (SPCC1442.09)</text>
    <text x="180" y="210" font-family="Arial" font-size="12" text-anchor="middle">GO:0004049</text>
    
    <!-- Step 2: Anthranilate phosphoribosyltransferase -->
    <rect x="100" y="280" width="160" height="70" rx="10" ry="10" fill="#e6ffe6" stroke="#009933" stroke-width="2"/>
    <text x="180" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Anthranilate</text>
    <text x="180" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">phosphoribosyltransferase</text>
    <text x="180" y="335" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">trp4 (SPBC16G5.08)</text>
    <text x="180" y="350" font-family="Arial" font-size="12" text-anchor="middle">GO:0004048</text>
    
    <!-- Step 3: Phosphoribosylanthranilate isomerase -->
    <rect x="340" y="280" width="160" height="70" rx="10" ry="10" fill="#fff2e6" stroke="#ff9933" stroke-width="2"/>
    <text x="420" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Phosphoribosylanthranilate</text>
    <text x="420" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">isomerase</text>
    <text x="420" y="335" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">trp1 (SPBC1539.09c)</text>
    <text x="420" y="350" font-family="Arial" font-size="12" text-anchor="middle">GO:0004640</text>
    
    <!-- Step 4: Indole-3-glycerol-phosphate lyase -->
    <rect x="340" y="410" width="160" height="70" rx="10" ry="10" fill="#ffe6e6" stroke="#cc0000" stroke-width="2"/>
    <text x="420" y="435" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Indole-3-glycerol-</text>
    <text x="420" y="450" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">phosphate lyase</text>
    <text x="420" y="465" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">trp1 (SPBC1539.09c)</text>
    <text x="420" y="480" font-family="Arial" font-size="12" text-anchor="middle">GO:0033984</text>
    
    <!-- Step 5: Tryptophan synthase -->
    <rect x="580" y="410" width="160" height="70" rx="10" ry="10" fill="#f2e6ff" stroke="#6600cc" stroke-width="2"/>
    <text x="660" y="435" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Tryptophan synthase</text>
    <text x="660" y="455" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">trp2 (SPAC19A8.15)</text>
    <text x="660" y="470" font-family="Arial" font-size="12" text-anchor="middle">GO:0004834</text>
    
    <!-- Arrows for pathway direction -->
    <path d="M180 220 L180 280" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <path d="M260 315 L340 315" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <path d="M420 350 L420 410" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <path d="M500 445 L580 445" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    
    <!-- Substrates and Products -->
    <!-- Chorismate and Glutamine input -->
    <ellipse cx="80" cy="150" rx="45" ry="25" fill="#dfd" stroke="#060" stroke-width="1.5"/>
    <text x="80" y="145" font-family="Arial" font-size="12" text-anchor="middle">Chorismate</text>
    <text x="80" y="160" font-family="Arial" font-size="12" text-anchor="middle">CHEBI:29748</text>
    
    <ellipse cx="80" cy="200" rx="45" ry="25" fill="#dfd" stroke="#060" stroke-width="1.5"/>
    <text x="80" y="195" font-family="Arial" font-size="12" text-anchor="middle">L-glutamine</text>
    <text x="80" y="210" font-family="Arial" font-size="12" text-anchor="middle">CHEBI:18050</text>
    
    <!-- Arrows from substrates -->
    <path d="M120 150 L140 150" stroke="#060" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <path d="M120 200 L140 185" stroke="#060" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- Final products -->
    <ellipse cx="660" cy="520" rx="55" ry="25" fill="#fdd" stroke="#900" stroke-width="1.5"/>
    <text x="660" y="515" font-family="Arial" font-size="12" text-anchor="middle">Tryptophan</text>
    <text x="660" y="530" font-family="Arial" font-size="12" text-anchor="middle">CHEBI:27897</text>
    
    <ellipse cx="550" cy="520" rx="65" ry="25" fill="#fdd" stroke="#900" stroke-width="1.5"/>
    <text x="550" y="515" font-family="Arial" font-size="12" text-anchor="middle">Glyceraldehyde</text>
    <text x="550" y="530" font-family="Arial" font-size="12" text-anchor="middle">3-phosphate CHEBI:17138</text>
    
    <!-- Arrows to final products -->
    <path d="M660 480 L660 495" stroke="#900" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <path d="M630 480 L550 495" stroke="#900" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- Legend -->
    <rect x="100" y="570" width="600" height="60" rx="5" ry="5" fill="#f9f9f9" stroke="#333" stroke-width="1"/>
    <text x="400" y="585" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Enzyme Color Legend</text>
    
    <rect x="120" y="595" width="20" height="20" rx="3" ry="3" fill="#e6f2ff" stroke="#0066cc" stroke-width="1"/>
    <text x="150" y="610" font-family="Arial" font-size="12" text-anchor="start">Anthranilate synthase</text>
    
    <rect x="250" y="595" width="20" height="20" rx="3" ry="3" fill="#e6ffe6" stroke="#009933" stroke-width="1"/>
    <text x="280" y="610" font-family="Arial" font-size="12" text-anchor="start">Anthranilate phosphoribosyltransferase</text>
    
    <rect x="500" y="595" width="20" height="20" rx="3" ry="3" fill="#fff2e6" stroke="#ff9933" stroke-width="1"/>
    <text x="530" y="610" font-family="Arial" font-size="12" text-anchor="start">Phosphoribosylanthranilate isomerase</text>
    
    <rect x="120" y="620" width="20" height="20" rx="3" ry="3" fill="#ffe6e6" stroke="#cc0000" stroke-width="1"/>
    <text x="150" y="635" font-family="Arial" font-size="12" text-anchor="start">Indole-3-glycerol-phosphate lyase</text>
    
    <rect x="370" y="620" width="20" height="20" rx="3" ry="3" fill="#f2e6ff" stroke="#6600cc" stroke-width="1"/>
    <text x="400" y="635" font-family="Arial" font-size="12" text-anchor="start">Tryptophan synthase</text>
    
    <!-- Arrow definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
        </marker>
    </defs>
</svg>