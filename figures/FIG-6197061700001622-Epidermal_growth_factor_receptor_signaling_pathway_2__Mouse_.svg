<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell boundary -->
  <rect x="50" y="100" width="700" height="400" fill="#f8f9fa" stroke="#333" stroke-width="2" rx="20" ry="20" />
  
  <!-- Plasma membrane -->
  <path d="M 50,100 L 750,100" stroke="#333" stroke-width="5" fill="none" />
  <text x="60" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Plasma membrane (GO:0005886)</text>
  
  <!-- Extracellular space -->
  <rect x="50" y="20" width="700" height="80" fill="#e6f2ff" stroke="none" />
  <text x="60" y="40" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Extracellular space (GO:0005615)</text>
  
  <!-- ADAM17 -->
  <circle cx="200" cy="100" r="30" fill="#f9c74f" stroke="#333" stroke-width="2" />
  <text x="200" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">ADAM17</text>
  <text x="200" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Metallodipeptidase</text>
  <text x="200" y="58" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Activity</text>
  
  <!-- MEP1A -->
  <circle cx="350" cy="100" r="30" fill="#f9c74f" stroke="#333" stroke-width="2" />
  <text x="350" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">MEP1A</text>
  <text x="350" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Metallodipeptidase</text>
  <text x="350" y="58" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Activity</text>
  
  <!-- EGFR -->
  <rect x="500" y="75" width="100" height="50" fill="#90be6d" stroke="#333" stroke-width="2" rx="5" ry="5" />
  <text x="550" y="105" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">EGFR</text>
  <text x="550" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Tyrosine Kinase</text>
  <text x="550" y="58" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Activity</text>
  
  <!-- TGFα precursor -->
  <polygon points="200,140 235,140 235,170 217,182 200,170" fill="#f94144" stroke="#333" stroke-width="2" />
  <text x="217" y="160" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">TGFα</text>
  <text x="217" y="172" font-family="Arial" font-size="10" text-anchor="middle" fill="white">precursor</text>
  
  <!-- Another TGFα precursor -->
  <polygon points="350,140 385,140 385,170 367,182 350,170" fill="#f94144" stroke="#333" stroke-width="2" />
  <text x="367" y="160" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">TGFα</text>
  <text x="367" y="172" font-family="Arial" font-size="10" text-anchor="middle" fill="white">precursor</text>
  
  <!-- Mature TGFα -->
  <circle cx="300" cy="60" r="20" fill="#f94144" stroke="#333" stroke-width="2" />
  <text x="300" y="65" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">TGFα</text>
  
  <!-- Arrows for processing with labels -->
  <!-- ADAM17 to TGFα precursor -->
  <path d="M 200,130 L 200,140" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="160" y="125" width="80" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="200" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Cleaves</text>
  
  <!-- MEP1A to TGFα precursor -->
  <path d="M 350,130 L 350,140" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="310" y="125" width="80" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="350" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Cleaves</text>
  
  <!-- Arrow for TGFα release from ADAM17 -->
  <path d="M 220,140 C 250,120 270,80 300,60" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="240" y="100" width="80" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="280" y="115" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Releases</text>
  
  <!-- Arrow for TGFα release from MEP1A -->
  <path d="M 360,140 C 340,120 330,80 300,60" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="320" y="100" width="80" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="360" y="115" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Releases</text>
  
  <!-- Arrow for EGFR activation -->
  <path d="M 320,60 C 380,40 450,40 500,80" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="390" y="50" width="80" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="430" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Activates</text>
  
  <!-- EGFR Signaling Pathway -->
  <path d="M 550,125 L 550,175 C 550,205 580,215 600,235" stroke="#333" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead)" />
  <rect x="510" y="235" width="180" height="40" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="600" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">EGFR Signaling Pathway</text>
  <text x="600" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(GO:0007173)</text>
  
  <!-- Process Labels -->
  <rect x="150" y="190" width="180" height="60" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="240" y="205" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Signaling receptor ligand</text>
  <text x="240" y="225" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">precursor processing</text>
  <text x="240" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(GO:0140448)</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="350" width="180" height="130" fill="white" stroke="#333" stroke-width="1" />
  <text x="560" y="370" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend</text>
  
  <circle cx="570" cy="390" r="10" fill="#f9c74f" stroke="#333" stroke-width="1" />
  <text x="590" y="395" font-family="Arial" font-size="12" fill="#333">Metallodipeptidases</text>
  
  <rect x="560" y="410" width="20" height="15" fill="#90be6d" stroke="#333" stroke-width="1" rx="3" ry="3" />
  <text x="590" y="422" font-family="Arial" font-size="12" fill="#333">Receptor kinase</text>
  
  <circle cx="570" cy="440" r="8" fill="#f94144" stroke="#333" stroke-width="1" />
  <text x="590" y="443" font-family="Arial" font-size="12" fill="#333">Mature ligand</text>
  
  <polygon points="560,455 580,455 580,470 570,475 560,470" fill="#f94144" stroke="#333" stroke-width="1" />
  <text x="600" y="465" font-family="Arial" font-size="12" fill="#333">Ligand precursor</text>
</svg>