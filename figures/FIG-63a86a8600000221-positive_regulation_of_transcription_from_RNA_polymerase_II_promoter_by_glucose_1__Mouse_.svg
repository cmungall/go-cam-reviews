<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="350" cy="300" rx="200" ry="150" fill="#e6f3ff" stroke="#333" stroke-width="2"/>
  <text x="350" y="460" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#000">Nucleus</text>
  
  <!-- Cytosol label -->
  <text x="600" y="200" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#000">Cytosol</text>
  
  <!-- Hepatocyte label -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="22" fill="#000">Mouse Hepatocyte</text>
  
  <!-- SIK2 in cytosol -->
  <circle cx="550" cy="150" r="35" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="550" y="145" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#000">Sik2</text>
  <text x="550" y="165" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">protein serine kinase</text>
  
  <!-- Pklr in cytosol -->
  <rect x="600" y="300" width="90" height="45" rx="5" ry="5" fill="#99cc99" stroke="#333" stroke-width="2"/>
  <text x="645" y="320" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#000">Pklr</text>
  <text x="645" y="335" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">pyruvate kinase</text>
  
  <!-- Glycolysis process -->
  <rect x="590" y="380" width="110" height="35" rx="15" ry="15" fill="#d9ead3" stroke="#333" stroke-width="2"/>
  <text x="645" y="403" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000">Glycolysis</text>
  
  <!-- Kat2b in nucleus -->
  <circle cx="200" cy="250" r="40" fill="#9999ff" stroke="#333" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#000">Kat2b</text>
  <text x="200" y="265" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">acetyltransferase</text>
  
  <!-- Mlxipl in nucleus -->
  <rect x="300" y="230" width="80" height="45" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="340" y="255" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#000">Mlxipl</text>
  <text x="340" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">transcription activator</text>
  
  <!-- Mlx in nucleus -->
  <rect x="410" y="230" width="80" height="45" rx="5" ry="5" fill="#ccccff" stroke="#333" stroke-width="2"/>
  <text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#000">Mlx</text>
  <text x="450" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">transcription factor</text>
  
  <!-- Mlx-Mlxipl complex -->
  <ellipse cx="370" cy="330" rx="70" ry="35" fill="#d9d2e9" stroke="#333" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="370" y="325" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000">Mlx-Mlxipl</text>
  <text x="370" y="345" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">Transcription Complex</text>
  
  <!-- Arrows and regulatory connections -->
  <!-- Sik2 negatively regulates Kat2b -->
  <line x1="520" y1="170" x2="235" y2="235" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowheadRed)"/>
  <text x="370" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ff0000">Inhibits</text>
  
  <!-- Sik2 negatively regulates Pklr -->
  <line x1="550" y1="185" x2="610" y2="295" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowheadRed)"/>
  <text x="570" y="240" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ff0000">Inhibits</text>
  
  <!-- Kat2b positively regulates Mlxipl -->
  <line x1="240" y1="250" x2="295" y2="250" stroke="#00cc00" stroke-width="2" marker-end="url(#arrowheadGreen)"/>
  <text x="265" y="235" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#00cc00">Activates</text>
  
  <!-- Mlxipl and Mlx interaction -->
  <line x1="380" y1="250" x2="410" y2="250" stroke="#0000cc" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#arrowheadBlue)"/>
  <text x="395" y="235" text-anchor="middle" font-family="Arial" font-size="12" fill="#0000cc">Binds</text>
  
  <!-- Mlxipl-Mlx complex positively regulates Pklr -->
  <path d="M 425,330 Q 500,350 590,320" fill="none" stroke="#00cc00" stroke-width="2" marker-end="url(#arrowheadGreen)"/>
  <text x="500" y="360" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#00cc00">Activates</text>
  
  <!-- Pklr involved in Glycolysis -->
  <line x1="645" y1="345" x2="645" y2="380" stroke="#000" stroke-width="2" marker-end="url(#arrowheadBlack)"/>
  <text x="680" y="365" text-anchor="middle" font-family="Arial" font-size="12" fill="#000">participates in</text>
  
  <!-- Glucose molecule near title - simplified icon -->
  <circle cx="170" y="540" r="12" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="170" y="545" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">G</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00cc00"/>
    </marker>
    <marker id="arrowheadRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0000"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0000cc"/>
    </marker>
    <marker id="arrowheadBlack" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Glucose regulation title -->
  <text x="400" y="540" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="#000">Glucose-Mediated Regulation of RNA Polymerase II Transcription</text>
  
  <!-- Legend -->
  <rect x="60" y="470" width="280" height="120" rx="5" ry="5" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="200" y="490" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#000">Legend</text>
  
  <circle cx="80" cy="510" r="8" fill="#ff9999"/>
  <text x="95" y="515" font-family="Arial" font-size="12" fill="#000">Protein Kinase</text>
  
  <circle cx="80" cy="535" r="8" fill="#9999ff"/>
  <text x="95" y="540" font-family="Arial" font-size="12" fill="#000">Acetyltransferase</text>
  
  <rect x="72" y="555" width="16" height="10" fill="#ffcc99"/>
  <text x="95" y="565" font-family="Arial" font-size="12" fill="#000">Transcription Factor</text>
  
  <rect x="72" y="575" width="16" height="10" fill="#99cc99"/>
  <text x="95" y="585" font-family="Arial" font-size="12" fill="#000">Enzyme</text>
  
  <line x1="180" y1="510" x2="200" y2="510" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowheadRed)"/>
  <text x="225" y="515" font-family="Arial" font-size="12" fill="#000">Inhibition</text>
  
  <line x1="180" y1="535" x2="200" y2="535" stroke="#00cc00" stroke-width="2" marker-end="url(#arrowheadGreen)"/>
  <text x="225" y="540" font-family="Arial" font-size="12" fill="#000">Activation</text>
  
  <line x1="180" y1="560" x2="200" y2="560" stroke="#0000cc" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#arrowheadBlue)"/>
  <text x="240" y="565" font-family="Arial" font-size="12" fill="#000">Protein Interaction</text>
  
  <line x1="180" y1="585" x2="200" y2="585" stroke="#000" stroke-width="2" marker-end="url(#arrowheadBlack)"/>
  <text x="245" y="590" font-family="Arial" font-size="12" fill="#000">Process Participation</text>
</svg>