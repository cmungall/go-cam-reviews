<?xml version="1.0" encoding="UTF-8"?>
<svg width="750" height="550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and title -->
  <rect width="750" height="550" fill="white" />
  <text x="375" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">XBP-1 as a Cell-Nonautonomous Regulator of Stress Resistance and Longevity</text>
  
  <!-- Neuron Cell -->
  <ellipse cx="250" cy="200" rx="200" ry="140" fill="#E8F4F8" stroke="#2C3E50" stroke-width="2" />
  <text x="250" y="100" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Neuron</text>
  
  <!-- Neuronal Cell Body -->
  <circle cx="220" cy="170" r="70" fill="#D6EAF8" stroke="#2C3E50" stroke-width="1.5" />
  <text x="220" y="150" font-family="Arial" font-size="13" text-anchor="middle">Neuronal Cell Body</text>
  
  <!-- IRE-1 in Neuronal Cell Body -->
  <rect x="185" y="170" width="70" height="30" rx="5" ry="5" fill="#85C1E9" stroke="#2C3E50" stroke-width="1.5" />
  <text x="220" y="190" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">IRE-1</text>
  <text x="220" y="205" font-family="Arial" font-size="10" text-anchor="middle" fill="#7F8C8D">(RNA endonuclease)</text>
  
  <!-- XBP-1 in Neuron -->
  <rect x="300" y="170" width="70" height="30" rx="5" ry="5" fill="#F5B041" stroke="#2C3E50" stroke-width="1.5" />
  <text x="335" y="190" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">XBP-1</text>
  <text x="335" y="205" font-family="Arial" font-size="10" text-anchor="middle" fill="#7F8C8D">(TF)</text>
  
  <!-- UPR process -->
  <rect x="250" y="220" width="100" height="25" rx="12" ry="12" fill="#D5F5E3" stroke="#2C3E50" stroke-width="1" />
  <text x="300" y="236" font-family="Arial" font-size="11" text-anchor="middle">IRE1-mediated UPR</text>
  
  <!-- Presynaptic Active Zone -->
  <rect x="320" y="250" width="100" height="30" rx="5" ry="5" fill="#D6EAF8" stroke="#2C3E50" stroke-width="1.5" />
  <text x="370" y="270" font-family="Arial" font-size="11" text-anchor="middle">Presynaptic Active Zone</text>
  
  <!-- UNC-13 -->
  <rect x="335" y="290" width="70" height="30" rx="5" ry="5" fill="#AED6F1" stroke="#2C3E50" stroke-width="1.5" />
  <text x="370" y="310" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">UNC-13</text>
  <text x="370" y="325" font-family="Arial" font-size="10" text-anchor="middle" fill="#7F8C8D">(syntaxin-1 binding)</text>
  
  <!-- Synaptic Process -->
  <rect x="330" y="350" width="110" height="25" rx="12" ry="12" fill="#D5F5E3" stroke="#2C3E50" stroke-width="1" />
  <text x="385" y="366" font-family="Arial" font-size="11" text-anchor="middle">Synaptic Vesicle Exocytosis</text>
  
  <!-- Intestinal Cell -->
  <path d="M470,140 Q550,100 630,140 Q700,200 630,260 Q550,300 470,260 Q400,200 470,140 Z" fill="#FADBD8" stroke="#2C3E50" stroke-width="2" />
  <text x="550" y="110" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Intestine</text>
  
  <!-- IRE-1 in Intestine -->
  <rect x="480" y="180" width="70" height="30" rx="5" ry="5" fill="#85C1E9" stroke="#2C3E50" stroke-width="1.5" />
  <text x="515" y="200" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">IRE-1</text>
  <text x="515" y="215" font-family="Arial" font-size="10" text-anchor="middle" fill="#7F8C8D">(RNA endonuclease)</text>
  
  <!-- XBP-1 in Intestine -->
  <rect x="580" y="180" width="70" height="30" rx="5" ry="5" fill="#F5B041" stroke="#2C3E50" stroke-width="1.5" />
  <text x="615" y="200" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">XBP-1</text>
  <text x="615" y="215" font-family="Arial" font-size="10" text-anchor="middle" fill="#7F8C8D">(TF)</text>
  
  <!-- Cell-cell signaling and longevity -->
  <rect x="500" y="270" width="150" height="40" rx="5" ry="5" fill="#FCF3CF" stroke="#2C3E50" stroke-width="1.5" />
  <text x="575" y="290" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Cell-cell signaling</text>
  <text x="575" y="305" font-family="Arial" font-size="12" text-anchor="middle">Stress resistance &amp; Longevity</text>
  
  <!-- Arrows -->
  <!-- Neuron pathway -->
  <path d="M255,185 L300,185" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <path d="M335,200 L335,220" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <path d="M335,245 L335,260" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <path d="M370,280 L370,290" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <path d="M370,320 L370,350" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Intestine pathway -->
  <path d="M550,195 L580,195" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <path d="M615,210 L615,270" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Cell-cell communication arrow and label -->
  <ellipse cx="440" y="170" rx="55" ry="25" fill="#FDEBD0" stroke="#2C3E50" stroke-width="1" stroke-dasharray="5,3" opacity="0.7" />
  <path d="M410,200 Q460,150 480,195" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none" />
  <text x="440" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="#2C3E50" font-weight="bold">Cell-nonautonomous</text>
  <text x="440" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="#2C3E50" font-weight="bold">regulation</text>
  
  <!-- Legend -->
  <rect x="50" y="420" width="650" height="100" rx="5" ry="5" fill="#F8F9F9" stroke="#2C3E50" stroke-width="1" />
  <text x="375" y="440" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  
  <!-- Legend items - Now aligned -->
  <rect x="70" y="450" width="20" height="20" fill="#85C1E9" stroke="#2C3E50" stroke-width="1" />
  <text x="100" y="465" font-family="Arial" font-size="12" text-anchor="start">IRE-1 (WBGene00002147) - RNA endonuclease activity</text>
  
  <rect x="70" y="480" width="20" height="20" fill="#F5B041" stroke="#2C3E50" stroke-width="1" />
  <text x="100" y="495" font-family="Arial" font-size="12" text-anchor="start">XBP-1 (WBGene00006959) - Transcription factor</text>
  
  <rect x="370" y="450" width="20" height="20" fill="#AED6F1" stroke="#2C3E50" stroke-width="1" />
  <text x="400" y="465" font-family="Arial" font-size="12" text-anchor="start">UNC-13 (WBGene00006752) - Syntaxin-1 binding</text>
  
  <rect x="370" y="480" width="20" height="20" fill="#D5F5E3" stroke="#2C3E50" stroke-width="1" rx="10" ry="10" />
  <text x="400" y="495" font-family="Arial" font-size="12" text-anchor="start">Biological processes</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50" />
    </marker>
  </defs>
</svg>