<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Non-canonical Inflammasome Pathway Leading to Blood-Brain Barrier Breakdown</text>
  
  <!-- Cell outline representing brain endothelial cell -->
  <rect x="50" y="80" width="700" height="450" rx="20" ry="20" fill="#f0f4ff" stroke="#000" stroke-width="2" />
  
  <!-- Label for cell -->
  <text x="400" y="100" font-family="Arial" font-size="16" text-anchor="middle">Brain Endothelial Cell</text>
  
  <!-- Blood-brain barrier representation at top -->
  <rect x="50" y="80" width="700" height="20" fill="#ff9999" stroke="#000" stroke-width="2" />
  <text x="400" y="70" font-family="Arial" font-size="14" text-anchor="middle">Blood-Brain Barrier</text>
  
  <!-- Cytosol label -->
  <rect x="80" y="120" width="80" height="25" rx="5" ry="5" fill="#e6f5f9" stroke="#000" stroke-width="1" />
  <text x="120" y="137" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Cytosol</text>
  
  <!-- Step 1: CASP4 binding to lipid A -->
  <circle cx="150" cy="200" r="25" fill="#8dd3c7" stroke="#000" stroke-width="2" />
  <text x="150" y="203" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">CASP4</text>
  <text x="150" y="183" font-family="Arial" font-size="9" text-anchor="middle">P49662</text>
  
  <polygon points="200,200 225,180 225,220" fill="#fb8072" stroke="#000" stroke-width="2" />
  <text x="225" y="202" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Lipid A</text>
  
  <path d="M175,200 L200,200" stroke="#000" stroke-width="2" stroke-dasharray="5,3" />
  <text x="188" y="190" font-family="Arial" font-size="10">binds</text>
  
  <!-- Step 2: CASP4 self-cleaving -->
  <circle cx="300" cy="200" r="25" fill="#8dd3c7" stroke="#000" stroke-width="2" />
  <text x="300" y="203" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">CASP4</text>
  <text x="300" y="215" font-family="Arial" font-size="10" text-anchor="middle">active</text>
  
  <path d="M250,200 L275,200" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="262" y="190" font-family="Arial" font-size="10">self-cleaves</text>
  
  <!-- Step 3: CASP4 cleaving GSDMD -->
  <rect x="250" y="300" width="50" height="30" fill="#b3cde3" stroke="#000" stroke-width="2" />
  <text x="275" y="320" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">GSDMD</text>
  <text x="275" y="290" font-family="Arial" font-size="9" text-anchor="middle">P57764</text>
  <text x="275" y="335" font-family="Arial" font-size="10" text-anchor="middle">inactive</text>
  
  <path d="M300,225 L300,285" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="313" y="255" font-family="Arial" font-size="10">cleaves</text>
  
  <!-- Step 4: GSDMD binding to PIP2 -->
  <rect x="400" y="300" width="50" height="30" fill="#b3cde3" stroke="#000" stroke-width="2" />
  <text x="425" y="320" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">GSDMD</text>
  <text x="425" y="335" font-family="Arial" font-size="10" text-anchor="middle">active</text>
  
  <path d="M300,315 L375,315" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Plasma membrane label and representation -->
  <rect x="80" y="380" width="130" height="25" rx="5" ry="5" fill="#e6f5f9" stroke="#000" stroke-width="1" />
  <text x="145" y="397" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Plasma Membrane</text>
  
  <rect x="100" y="410" width="600" height="15" fill="#fdb462" stroke="#000" stroke-width="2" />
  
  <!-- PIP2 in membrane -->
  <circle cx="425" cy="417" r="8" fill="#ffffb3" stroke="#000" stroke-width="1" />
  <text x="425" y="420" font-family="Arial" font-size="8" text-anchor="middle">PIP2</text>
  
  <path d="M425,330 L425,409" stroke="#000" stroke-width="2" stroke-dasharray="5,3" />
  <text x="438" y="370" font-family="Arial" font-size="10">binds</text>
  
  <!-- Step 5: GSDMD forming pores -->
  <ellipse cx="550" cy="417" rx="30" ry="15" fill="none" stroke="#000" stroke-width="2" />
  <ellipse cx="550" cy="417" rx="15" ry="7.5" fill="white" stroke="#000" stroke-width="2" />
  <text x="550" y="445" font-family="Arial" font-size="12" text-anchor="middle">GSDMD Pore</text>
  
  <path d="M450,417 L520,417" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="485" y="405" font-family="Arial" font-size="10">forms pores</text>
  
  <!-- Result: Breakdown and pyroptosis -->
  <text x="600" y="500" font-family="Arial" font-size="14" font-weight="bold">Blood-Brain Barrier Breakdown</text>
  <path d="M550,435 L580,480" stroke="red" stroke-width="2.5" marker-end="url(#redArrow)" />
  
  <text x="250" y="500" font-family="Arial" font-size="14" font-weight="bold">Pyroptotic Cell Death</text>
  <path d="M550,435 L300,480" stroke="red" stroke-width="2.5" marker-end="url(#redArrow)" />
  
  <!-- Process labels -->
  <rect x="120" y="130" width="150" height="30" rx="10" ry="10" fill="#d9f2de" stroke="#000" stroke-width="1" opacity="0.9" />
  <text x="195" y="150" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">1. LPS Recognition</text>
  
  <rect x="270" y="130" width="150" height="30" rx="10" ry="10" fill="#d9f2de" stroke="#000" stroke-width="1" opacity="0.9" />
  <text x="345" y="150" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">2. CASP4 Activation</text>
  
  <rect x="220" y="250" width="150" height="30" rx="10" ry="10" fill="#d9f2de" stroke="#000" stroke-width="1" opacity="0.9" />
  <text x="295" y="270" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">3. GSDMD Cleavage</text>
  
  <rect x="370" y="250" width="150" height="30" rx="10" ry="10" fill="#d9f2de" stroke="#000" stroke-width="1" opacity="0.9" />
  <text x="445" y="270" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">4. Membrane Targeting</text>
  
  <rect x="500" y="370" width="150" height="30" rx="10" ry="10" fill="#d9f2de" stroke="#000" stroke-width="1" opacity="0.9" />
  <text x="575" y="390" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">5. Pore Formation</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="red" />
    </marker>
  </defs>
</svg>