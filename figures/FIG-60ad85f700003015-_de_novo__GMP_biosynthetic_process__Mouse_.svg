<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline representing cytosol -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2" stroke-dasharray="5,5" />
  <text x="400" y="90" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">De novo GMP Biosynthetic Process (Mouse)</text>
  <text x="120" y="130" font-family="Arial" font-size="16" font-style="italic" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- Starting point -->
  <circle cx="120" cy="200" r="15" fill="#ffcc99" stroke="#000" stroke-width="1.5" />
  <text x="120" y="205" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">PRPP</text>
  
  <!-- Pathway elements -->
  <!-- Ppat -->
  <rect x="170" y="180" width="80" height="40" rx="8" ry="8" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="210" y="205" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Ppat</text>
  <text x="210" y="173" font-family="Arial" font-size="10" text-anchor="middle">MGI:2387203</text>
  <text x="210" y="233" font-family="Arial" font-size="9" text-anchor="middle">Amidophosphoribosyltransferase</text>
  
  <!-- First intermediate metabolite -->
  <circle cx="280" cy="200" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="280" y="205" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">5-PRA</text>
  
  <!-- Gart first activity -->
  <rect x="310" y="180" width="80" height="40" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="350" y="205" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Gart</text>
  <text x="350" y="173" font-family="Arial" font-size="10" text-anchor="middle">MGI:95654</text>
  <text x="350" y="233" font-family="Arial" font-size="9" text-anchor="middle">Phosphoribosylamine-glycine ligase</text>
  
  <!-- Second intermediate metabolite -->
  <circle cx="420" cy="200" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="420" y="205" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">GAR</text>
  
  <!-- Gart second activity -->
  <rect x="460" y="180" width="80" height="40" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="500" y="205" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Gart</text>
  <text x="500" y="173" font-family="Arial" font-size="10" text-anchor="middle">MGI:95654</text>
  <text x="500" y="233" font-family="Arial" font-size="9" text-anchor="middle">Phosphoribosylglycinamide formyltransferase</text>
  
  <!-- Third intermediate metabolite -->
  <circle cx="570" cy="200" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="570" y="205" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">FGAR</text>
  
  <!-- Pfas -->
  <rect x="610" y="180" width="80" height="40" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" />
  <text x="650" y="205" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Pfas</text>
  <text x="650" y="173" font-family="Arial" font-size="10" text-anchor="middle">MGI:2684864</text>
  <text x="650" y="233" font-family="Arial" font-size="9" text-anchor="middle">Phosphoribosylformylglycinamidine synthase</text>
  
  <!-- Fourth intermediate metabolite -->
  <circle cx="680" cy="240" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="680" y="245" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">FGAM</text>
  
  <!-- Gart third activity -->
  <rect x="610" y="280" width="80" height="40" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="650" y="305" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Gart</text>
  <text x="650" y="273" font-family="Arial" font-size="10" text-anchor="middle">MGI:95654</text>
  <text x="650" y="333" font-family="Arial" font-size="9" text-anchor="middle">Phosphoribosylformylglycinamidine cyclo-ligase</text>
  
  <!-- Fifth intermediate metabolite -->
  <circle cx="570" cy="300" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="570" y="305" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">AIR</text>
  
  <!-- Paics first activity -->
  <rect x="460" y="280" width="80" height="40" rx="8" ry="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
  <text x="500" y="305" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Paics</text>
  <text x="500" y="273" font-family="Arial" font-size="10" text-anchor="middle">MGI:1914304</text>
  <text x="500" y="333" font-family="Arial" font-size="9" text-anchor="middle">Phosphoribosylaminoimidazole carboxylase</text>
  
  <!-- Sixth intermediate metabolite -->
  <circle cx="420" cy="300" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="420" y="305" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">CAIR</text>
  
  <!-- Paics second activity -->
  <rect x="310" y="280" width="80" height="40" rx="8" ry="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
  <text x="350" y="305" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Paics</text>
  <text x="350" y="273" font-family="Arial" font-size="10" text-anchor="middle">MGI:1914304</text>
  <text x="350" y="333" font-family="Arial" font-size="9" text-anchor="middle">SAICAR synthase</text>
  
  <!-- Seventh intermediate metabolite -->
  <circle cx="270" cy="300" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="270" y="305" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">SAICAR</text>
  
  <!-- Adsl -->
  <rect x="170" y="280" width="80" height="40" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
  <text x="210" y="305" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Adsl</text>
  <text x="210" y="273" font-family="Arial" font-size="10" text-anchor="middle">MGI:103202</text>
  <text x="210" y="333" font-family="Arial" font-size="9" text-anchor="middle">Adenylosuccinate lyase</text>
  
  <!-- Eighth intermediate metabolite -->
  <circle cx="120" cy="300" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="120" y="305" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">AICAR</text>
  
  <!-- Atic first activity -->
  <rect x="170" y="380" width="80" height="40" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="2" />
  <text x="210" y="405" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Atic</text>
  <text x="210" y="373" font-family="Arial" font-size="10" text-anchor="middle">MGI:1351352</text>
  <text x="210" y="433" font-family="Arial" font-size="9" text-anchor="middle">AICAR formyltransferase</text>
  
  <!-- Ninth intermediate metabolite -->
  <circle cx="270" cy="400" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="270" y="405" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">FAICAR</text>
  
  <!-- Atic second activity -->
  <rect x="310" y="380" width="80" height="40" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="2" />
  <text x="350" y="405" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Atic</text>
  <text x="350" y="373" font-family="Arial" font-size="10" text-anchor="middle">MGI:1351352</text>
  <text x="350" y="433" font-family="Arial" font-size="9" text-anchor="middle">IMP cyclohydrolase</text>
  
  <!-- Tenth intermediate metabolite -->
  <circle cx="420" cy="400" r="15" fill="#ffcc99" stroke="#000" stroke-width="1.5" />
  <text x="420" y="405" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">IMP</text>
  
  <!-- Impdh1/2 -->
  <rect x="460" y="380" width="80" height="40" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="500" y="395" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Impdh1/2</text>
  <text x="500" y="373" font-family="Arial" font-size="9" text-anchor="middle">MGI:96567/109367</text>
  <text x="500" y="433" font-family="Arial" font-size="9" text-anchor="middle">IMP dehydrogenase</text>
  
  <!-- Eleventh intermediate metabolite -->
  <circle cx="570" cy="400" r="10" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="570" y="405" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">XMP</text>
  
  <!-- Gmps -->
  <rect x="610" y="380" width="80" height="40" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2" />
  <text x="650" y="405" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Gmps</text>
  <text x="650" y="373" font-family="Arial" font-size="10" text-anchor="middle">MGI:2448526</text>
  <text x="650" y="433" font-family="Arial" font-size="9" text-anchor="middle">GMP synthase</text>
  
  <!-- Final product -->
  <circle cx="710" cy="400" r="15" fill="#ffcc99" stroke="#000" stroke-width="2" />
  <text x="710" y="405" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">GMP</text>
  
