  <line x1="430" y1="200" x2="460" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="540" y1="200" x2="560" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="580" y1="200" x2="610" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="680" y1="220" x2="680" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="680" y1="250" x2="650" y2="280" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="610" y1="300" x2="580" y2="300" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="560" y1="300" x2="540" y2="300" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="460" y1="300" x2="430" y2="300" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="410" y1="300" x2="390" y2="300" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="310" y1="300" x2="280" y2="300" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="260" y1="300" x2="250" y2="300" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="170" y1="300" x2="130" y2="300" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="120" y1="310" x2="120" y2="370" stroke="#000" stroke-width="1.5" />
  <line x1="120" y1="370" x2="170" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="250" y1="400" x2="260" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="280" y1="400" x2="310" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="390" y1="400" x2="405" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="435" y1="400" x2="460" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="540" y1="400" x2="560" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="580" y1="400" x2="610" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="690" y1="400" x2="695" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Legend -->
  <rect x="80" y="470" width="640" height="60" rx="5" ry="5" fill="#f8f8f8" stroke="#666" stroke-width="1" />
  <text x="100" y="495" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  <circle cx="170" y="495" r="8" fill="#ffcc99" stroke="#000" stroke-width="1" />
  <text x="190" y="499" font-family="Arial" font-size="12">Metabolites</text>
  <rect x="270" y="487" width="16" height="16" rx="3" ry="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1" />
