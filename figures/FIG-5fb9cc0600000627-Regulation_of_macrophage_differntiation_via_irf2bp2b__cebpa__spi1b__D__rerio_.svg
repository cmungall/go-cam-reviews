<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="300" rx="200" ry="180" fill="#e6f3ff" stroke="#333" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Regulation of Macrophage Differentiation in D. rerio</text>
  
  <!-- Gene products -->
  <rect x="300" y="180" width="80" height="40" rx="5" fill="#c6eaff" stroke="#333" stroke-width="2"/>
  <text x="340" y="205" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">cebpa</text>
  
  <rect x="500" y="180" width="80" height="40" rx="5" fill="#ffcccb" stroke="#333" stroke-width="2"/>
  <text x="540" y="205" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">irf2bp2b</text>
  
  <rect x="400" y="330" width="80" height="40" rx="5" fill="#d1e7dd" stroke="#333" stroke-width="2"/>
  <text x="440" y="355" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">spi1b</text>
  
  <!-- Process: Macrophage differentiation -->
  <rect x="370" y="450" width="150" height="60" rx="10" fill="#f5e6cc" stroke="#333" stroke-width="2"/>
  <text x="445" y="480" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Macrophage</text>
  <text x="445" y="500" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Differentiation</text>
  
  <!-- Negative Regulation process -->
  <rect x="140" y="320" width="150" height="60" rx="10" fill="#ffe6e6" stroke="#333" stroke-width="2"/>
  <text x="215" y="345" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Negative Regulation</text>
  <text x="215" y="370" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">of Macrophage Diff.</text>
  
  <!-- Interactions and arrows -->
  <!-- cebpa activates itself (DNA binding site) -->
  <path d="M300,200 Q270,160 290,180" fill="none" stroke="#008000" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- cebpa activates transcription -->
  <path d="M340,220 Q340,270 345,320" fill="none" stroke="#008000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="320" y="270" font-family="Arial" font-size="16" fill="#008000" font-weight="bold">activates</text>
  
  <!-- irf2bp2b represses -->
  <path d="M500,200 Q460,240 280,320" fill="none" stroke="#dd0000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="380" y="230" font-family="Arial" font-size="16" fill="#dd0000" font-weight="bold">represses</text>
  
  <!-- irf2bp2b negatively regulates transcription -->
  <path d="M540,220 Q520,270 470,330" fill="none" stroke="#dd0000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="530" y="270" font-family="Arial" font-size="16" fill="#dd0000" font-weight="bold">represses</text>
  
  <!-- Regulation from Neg. Reg. to Macrophage Diff -->
  <path d="M280,345 Q320,400 370,470" fill="none" stroke="#dd0000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="320" y="410" font-family="Arial" font-size="16" fill="#dd0000" font-weight="bold">inhibits</text>
  
  <!-- spi1b to Macrophage Differentiation -->
  <path d="M440,370 Q440,410 440,450" fill="none" stroke="#006699" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="460" y="410" font-family="Arial" font-size="16" fill="#006699" font-weight="bold">required for</text>
  
  <!-- DNA binding sites (simplified representation) -->
  <rect x="290" y="240" width="100" height="25" rx="2" fill="#f0f0f0" stroke="#333" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="340" y="257" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">DNA binding</text>
  
  <rect x="490" y="240" width="100" height="25" rx="2" fill="#f0f0f0" stroke="#333" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="540" y="257" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">DNA binding</text>
  
  <!-- Cytoplasm label -->
  <text x="160" y="140" font-family="Arial" font-size="18" fill="#666" font-weight="bold">Cytoplasm</text>
  
  <!-- Nucleus label -->
  <text x="380" y="150" font-family="Arial" font-size="18" fill="#666" font-weight="bold">Nucleus</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="570" y="490" width="220" height="100" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="590" y="515" font-family="Arial" font-size="16" font-weight="bold">Legend:</text>
  
  <rect x="590" y="530" width="20" height="12" fill="#c6eaff" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="540" font-family="Arial" font-size="14">Transcriptional Activator</text>
  
  <rect x="590" y="550" width="20" height="12" fill="#ffcccb" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="560" font-family="Arial" font-size="14">Transcriptional Repressor</text>
  
  <rect x="590" y="570" width="20" height="12" fill="#d1e7dd" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="580" font-family="Arial" font-size="14">Gene Product</text>
  
  <line x1="700" y1="535" x2="735" y2="535" stroke="#008000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="745" y="540" font-family="Arial" font-size="14">Activation</text>
  
  <line x1="700" y1="560" x2="735" y2="560" stroke="#dd0000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="745" y="565" font-family="Arial" font-size="14">Repression</text>
</svg>