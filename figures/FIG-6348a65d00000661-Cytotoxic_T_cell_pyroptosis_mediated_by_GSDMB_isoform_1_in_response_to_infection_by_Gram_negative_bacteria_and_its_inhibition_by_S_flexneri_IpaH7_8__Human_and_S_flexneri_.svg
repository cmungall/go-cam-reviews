<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f8f8" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Cytotoxic T Cell Pyroptosis Mediated by GSDMB Isoform 1 and Its Inhibition by S. flexneri IpaH7.8</text>
  
  <!-- Host Cell (Cytotoxic T Cell) -->
  <ellipse cx="350" cy="300" rx="200" ry="180" fill="#e6f2ff" stroke="#2c3e50" stroke-width="2"/>
  <text x="350" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Cytotoxic T Cell</text>
  
  <!-- Plasma Membrane -->
  <path d="M150,300 C200,250 300,220 350,220 C400,220 500,250 550,300 C500,350 400,380 350,380 C300,380 200,350 150,300" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <text x="190" y="205" font-family="Arial" font-size="12" fill="#2c3e50" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytoplasm Label -->
  <text x="350" y="270" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold" text-anchor="middle">Cytoplasm</text>
  
  <!-- Bacterial Cell (S. flexneri) -->
  <ellipse cx="650" cy="200" rx="80" ry="50" fill="#ffd7b5" stroke="#e74c3c" stroke-width="2"/>
  <text x="650" y="200" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">S. flexneri</text>
  
  <!-- PRF1 forming pores -->
  <circle cx="210" cy="290" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
  <text x="210" y="293" font-family="Arial" font-size="10" text-anchor="middle" fill="white">PRF1</text>
  <text x="210" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="#3498db" font-weight="bold">PRF1 Pore</text>
  
  <!-- GZMA entering through pore -->
  <circle cx="240" cy="300" r="12" fill="#9b59b6" stroke="#2c3e50" stroke-width="1"/>
  <text x="240" y="303" font-family="Arial" font-size="9" text-anchor="middle" fill="white">GZMA</text>
  
  <!-- GSDMB-1 (inactive) -->
  <rect x="290" y="320" width="60" height="30" rx="5" ry="5" fill="#f1c40f" stroke="#2c3e50" stroke-width="1"/>
  <text x="320" y="340" font-family="Arial" font-size="10" text-anchor="middle">GSDMB-1</text>
  
  <!-- 1. Pore Formation by PRF1 -->
  <rect x="140" y="230" width="120" height="20" rx="5" ry="5" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="200" y="245" font-family="Arial" font-size="10" text-anchor="middle" fill="#3498db" font-weight="bold">1. Pore Formation</text>

  <!-- Arrow from GZMA to GSDMB -->
  <path d="M250,310 L290,330" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="270" y="315" font-family="Arial" font-size="9" fill="#2c3e50" font-weight="bold">Cleaves</text>
  
  <!-- 2. GZMA Entry -->
  <rect x="210" y="330" width="100" height="20" rx="5" ry="5" fill="white" stroke="#9b59b6" stroke-width="1"/>
  <text x="260" y="345" font-family="Arial" font-size="10" text-anchor="middle" fill="#9b59b6" font-weight="bold">2. GZMA Entry</text>
  
  <!-- Activated GSDMB-1 -->
  <rect x="380" y="320" width="60" height="30" rx="5" ry="5" fill="#e67e22" stroke="#2c3e50" stroke-width="1"/>
  <text x="410" y="340" font-family="Arial" font-size="10" text-anchor="middle">GSDMB-1</text>
  <text x="410" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#e74c3c" font-weight="bold">Activated</text>
  
  <!-- Arrow from inactive to active GSDMB -->
  <path d="M350,335 L380,335" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 3. GSDMB-1 Activation -->
  <rect x="320" y="380" width="90" height="20" rx="5" ry="5" fill="white" stroke="#e67e22" stroke-width="1"/>
  <text x="365" y="395" font-family="Arial" font-size="10" text-anchor="middle" fill="#e67e22" font-weight="bold">3. Activation</text>
  
  <!-- GSDMB-1 forming pores -->
  <path d="M450,350 C470,360 490,340 510,350" fill="none" stroke="#e67e22" stroke-width="3"/>
  
  <!-- 5. Pore Formation by GSDMB-1 -->
  <rect x="480" y="350" width="100" height="20" rx="5" ry="5" fill="white" stroke="#e67e22" stroke-width="1"/>
  <text x="530" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#e67e22" font-weight="bold">5. Pore Formation</text>
  
  <!-- Cardiolipin -->
  <ellipse cx="490" cy="280" rx="15" ry="5" fill="#27ae60" stroke="#2c3e50" stroke-width="1"/>
  <text x="490" y="260" font-family="Arial" font-size="10" text-anchor="middle" fill="#27ae60" font-weight="bold">Cardiolipin</text>
  
  <!-- Arrow from GSDMB to Cardiolipin -->
  <path d="M440,320 L475,280" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="440" y="295" font-family="Arial" font-size="9" fill="#2c3e50" font-weight="bold">Binds</text>
  
  <!-- 4. Cardiolipin Binding -->
  <rect x="500" y="240" width="120" height="20" rx="5" ry="5" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="255" font-family="Arial" font-size="10" text-anchor="middle" fill="#27ae60" font-weight="bold">4. Cardiolipin Binding</text>
  
  <!-- Pyroptosis Indicator -->
  <path d="M500,380 L520,370 L540,390 L560,365 L580,385" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="540" y="420" font-family="Arial" font-size="12" font-weight="bold" fill="#e74c3c" text-anchor="middle">Pyroptosis</text>
  
  <!-- 6. Cell Death -->
  <rect x="520" y="395" width="100" height="20" rx="5" ry="5" fill="white" stroke="#e74c3c" stroke-width="1"/>
  <text x="570" y="410" font-family="Arial" font-size="10" text-anchor="middle" fill="#e74c3c" font-weight="bold">6. Cell Death</text>
  
  <!-- IpaH7.8 from S. flexneri -->
  <circle cx="650" cy="270" r="15" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
  <text x="650" y="273" font-family="Arial" font-size="9" text-anchor="middle" fill="white">IpaH7.8</text>
  
  <!-- Ubiquitination process -->
  <path d="M650,285 L580,330 L450,330" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="550" y="310" font-family="Arial" font-size="10" fill="#e74c3c" font-weight="bold">Ubiquitination</text>
  <text x="550" y="355" font-family="Arial" font-size="10" fill="#e74c3c" font-weight="bold">Inhibits</text>
  
  <!-- 7. Bacterial Inhibition -->
  <rect x="620" y="300" width="120" height="20" rx="5" ry="5" fill="white" stroke="#e74c3c" stroke-width="1"/>
  <text x="680" y="315" font-family="Arial" font-size="10" text-anchor="middle" fill="#e74c3c" font-weight="bold">7. GSDMB-1 Inhibition</text>
  
  <!-- Legend -->
  <rect x="60" y="450" width="680" height="110" rx="5" ry="5" fill="white" stroke="#2c3e50" stroke-width="1"/>
  <text x="70" y="470" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <!-- PRF1 -->
  <circle cx="90" y="490" r="10" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
  <text x="110" y="495" font-family="Arial" font-size="12">PRF1 (P14222) - Forms pores in plasma membrane (GO:0022829)</text>
  
  <!-- GZMA -->
  <circle cx="90" y="515" r="10" fill="#9b59b6" stroke="#2c3e50" stroke-width="1"/>
  <text x="110" y="520" font-family="Arial" font-size="12">GZMA (P12544) - Serine-type endopeptidase (GO:0004252)</text>
  
  <!-- GSDMB-1 -->
  <rect x="80" y="530" width="20" height="15" rx="3" ry="3" fill="#f1c40f" stroke="#2c3e50" stroke-width="1"/>
  <text x="110" y="542" font-family="Arial" font-size="12">GSDMB-1 (Q8TAX9-1) - Forms pores (GO:0022829) upon cardiolipin binding (GO:1901612)</text>
  
  <!-- IpaH7.8 -->
  <circle cx="390" y="490" r="10" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
  <text x="410" y="495" font-family="Arial" font-size="12">IpaH7.8 (P18014) - Ubiquitin protein ligase (GO:0061630)</text>
  
  <!-- Cardiolipin -->
  <ellipse cx="390" y="515" rx="12" ry="4" fill="#27ae60" stroke="#2c3e50" stroke-width="1"/>
  <text x="410" y="520" font-family="Arial" font-size="12">Cardiolipin - Lipid in membrane bound by activated GSDMB-1</text>
  
  <!-- Pyroptosis -->
  <path d="M380,540 L400,530 L420,545" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="435" y="542" font-family="Arial" font-size="12">Pyroptosis - Cytotoxic T cell pyroptotic cell death (GO:1902483)</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>