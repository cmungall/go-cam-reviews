<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Cell Components -->
  <rect width="800" height="600" fill="#f9f9f9" rx="5" ry="5"/>
  
  <!-- Cell Membrane -->
  <path d="M50,50 L750,50 L750,550 L50,550 Z" fill="#f8f8f8" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Title -->
  <text x="100" y="35" font-family="Arial" font-size="18" font-weight="bold" fill="#000">Regulation of mTORC1 Signaling via Ubiquitination and Degradation of CASTOR1</text>
  
  <!-- Cytosol Label -->
  <rect x="55" y="60" width="120" height="25" rx="5" ry="5" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
  <text x="65" y="78" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Cytosol (GO:0005829)</text>
  
  <!-- Lysosomal Membrane -->
  <ellipse cx="250" cy="430" rx="120" ry="80" fill="#d9e6f2" stroke="#0066cc" stroke-width="2"/>
  <text x="190" y="425" font-family="Arial" font-size="14" font-weight="bold" fill="#0066cc">Lysosomal Membrane</text>
  <text x="200" y="445" font-family="Arial" font-size="12" fill="#0066cc">(GO:0005765)</text>
  
  <!-- Amino Acid Starvation Indicator -->
  <rect x="600" y="80" width="130" height="60" rx="10" ry="10" fill="#ffe6e6" stroke="#cc0000" stroke-width="1"/>
  <text x="620" y="110" font-family="Arial" font-size="12" font-weight="bold" fill="#990000">Amino Acid</text>
  <text x="620" y="130" font-family="Arial" font-size="12" font-weight="bold" fill="#990000">Starvation</text>
  
  <!-- CASTOR1 Protein -->
  <rect x="200" y="150" width="100" height="40" rx="5" ry="5" fill="#a3c2c2" stroke="#006666" stroke-width="2"/>
  <text x="220" y="175" font-family="Arial" font-size="14" font-weight="bold" fill="#006666">CASTOR1</text>
  
  <!-- Arginine -->
  <circle cx="120" cy="170" r="25" fill="#ffcccc" stroke="#cc3333" stroke-width="2"/>
  <text x="100" y="175" font-family="Arial" font-size="12" font-weight="bold" fill="#990000">Arginine</text>
  
  <!-- Arginine binding to CASTOR1 -->
  <path d="M145,170 L195,170" stroke="#990000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="145" y="155" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Binding</text>
  <text x="145" y="190" font-family="Arial" font-size="9" fill="#333">GO:0034618</text>
  
  <!-- AKT1 Protein -->
  <rect x="400" y="80" width="80" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#cc6600" stroke-width="2"/>
  <text x="420" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#cc6600">AKT1</text>
  
  <!-- RNF167 Protein -->
  <rect x="400" y="180" width="80" height="40" rx="5" ry="5" fill="#c2d6a3" stroke="#336600" stroke-width="2"/>
  <text x="410" y="205" font-family="Arial" font-size="14" font-weight="bold" fill="#336600">RNF167</text>
  
  <!-- WDR24 Protein -->
  <rect x="250" y="380" width="80" height="40" rx="5" ry="5" fill="#d1c2ee" stroke="#660099" stroke-width="2"/>
  <text x="260" y="405" font-family="Arial" font-size="14" font-weight="bold" fill="#660099">WDR24</text>
  
  <!-- AKT1 phosphorylates RNF167 -->
  <path d="M440,120 C440,140 440,160 440,180" stroke="#ff6600" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none"/>
  <circle cx="440" cy="150" r="5" fill="#ff6600" stroke="none"/>
  <text x="450" y="140" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Phosphorylation</text>
  <text x="450" y="155" font-family="Arial" font-size="9" fill="#333">GO:0004674</text>
  
  <!-- RNF167 ubiquitinates CASTOR1 -->
  <path d="M400,200 C350,200 340,190 305,170" stroke="#339900" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="330" y="220" font-family="Arial" font-size="10" font-weight="bold" fill="#336633">K29-linked Ubiquitination</text>
  <text x="350" y="235" font-family="Arial" font-size="9" fill="#336633">GO:0035519</text>
  
  <!-- CASTOR1 protein sequestering -->
  <path d="M225,150 C225,130 225,115 225,100" stroke="#006666" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="150" y="120" font-family="Arial" font-size="10" font-weight="bold" fill="#333">Protein sequestering</text>
  <text x="150" y="135" font-family="Arial" font-size="9" fill="#333">GO:0140311</text>
  
  <!-- CASTOR1 degradation pathway -->
  <path d="M250,190 C250,240 250,290 250,340" stroke="#cc0000" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="260" y="270" font-family="Arial" font-size="12" font-weight="bold" fill="#cc0000">Degradation</text>
  
  <!-- WDR24 ubiquitin ligase activity -->
  <path d="M290,380 C300,360 310,340 310,320" stroke="#660099" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="320" y="340" font-family="Arial" font-size="10" font-weight="bold" fill="#660099">K6-linked</text>
  <text x="320" y="355" font-family="Arial" font-size="10" font-weight="bold" fill="#660099">Ubiquitination</text>
  <text x="320" y="370" font-family="Arial" font-size="9" fill="#660099">GO:0085020</text>
  
  <!-- mTORC1 Regulation -->
  <rect x="550" y="250" width="100" height="50" rx="10" ry="10" fill="#cce5ff" stroke="#0033cc" stroke-width="2.5"/>
  <text x="570" y="280" font-family="Arial" font-size="16" font-weight="bold" fill="#0033cc">mTORC1</text>
  
  <!-- CASTOR1 negatively regulates mTORC1 -->
  <path d="M300,170 C400,190 450,220 545,250" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none"/>
  <text x="380" y="200" font-family="Arial" font-size="10" font-weight="bold" fill="#cc0000">Negative regulation</text>
  <text x="390" y="215" font-family="Arial" font-size="9" fill="#cc0000">GO:1904262</text>
  
  <!-- RNF167 positively regulates mTORC1 via CASTOR1 degradation -->
  <path d="M480,200 C500,220 520,230 550,250" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="480" y="220" font-family="Arial" font-size="10" font-weight="bold" fill="#009900">Positive regulation</text>
  <text x="490" y="235" font-family="Arial" font-size="9" fill="#009900">GO:1904263</text>
  
  <!-- Cell response note -->
  <rect x="550" y="350" width="180" height="60" rx="5" ry="5" fill="#f2f2f2" stroke="#333" stroke-width="1"/>
  <text x="560" y="370" font-family="Arial" font-size="11" fill="#333">When arginine levels increase,</text>
  <text x="560" y="385" font-family="Arial" font-size="11" fill="#333">CASTOR1 binds arginine, </text>
  <text x="560" y="400" font-family="Arial" font-size="11" fill="#333">allowing mTORC1 activation</text>
  
  <!-- Legend -->
  <rect x="550" y="450" width="200" height="130" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="570" y="470" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend</text>
  
  <line x1="560" y1="485" x2="580" y2="485" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="590" y="490" font-family="Arial" font-size="11" fill="#333">Negative regulation</text>
  
  <line x1="560" y1="505" x2="580" y2="505" stroke="#009900" stroke-width="2"/>
  <text x="590" y="510" font-family="Arial" font-size="11" fill="#333">Positive regulation</text>
  
  <line x1="560" y1="525" x2="580" y2="525" stroke="#ff6600" stroke-width="2.5"/>
  <circle cx="570" y="525" r="3" fill="#ff6600" stroke="none"/>
  <text x="590" y="530" font-family="Arial" font-size="11" fill="#333">Phosphorylation</text>
  
  <line x1="560" y1="545" x2="580" y2="545" stroke="#339900" stroke-width="2.5"/>
  <text x="590" y="550" font-family="Arial" font-size="11" fill="#333">Ubiquitination</text>
  
  <line x1="560" y1="565" x2="580" y2="565" stroke="#cc0000" stroke-width="2.5"/>
  <text x="590" y="570" font-family="Arial" font-size="11" fill="#333">Degradation</text>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>