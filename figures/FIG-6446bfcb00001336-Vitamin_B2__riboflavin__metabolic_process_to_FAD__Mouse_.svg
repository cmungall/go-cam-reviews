<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell components -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9"/>
  
  <!-- Extracellular space -->
  <rect x="0" y="0" width="800" height="150" fill="#e6f7ff" opacity="0.7"/>
  <text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold">Extracellular Region</text>
  
  <!-- Cell membrane -->
  <path d="M0,150 L800,150" stroke="#666" stroke-width="6" fill="none"/>
  <text x="20" y="175" font-family="Arial" font-size="18" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytosol -->
  <rect x="0" y="155" width="800" height="445" fill="#f0f0f0" opacity="0.5"/>
  <text x="20" y="200" font-family="Arial" font-size="18" font-weight="bold">Cytosol</text>
  
  <!-- Riboflavin in extracellular space -->
  <circle cx="400" cy="80" r="30" fill="#ffcc00" stroke="#e6b800" stroke-width="2"/>
  <text x="400" y="85" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Riboflavin</text>
  <text x="400" y="105" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">(CHEBI:57986)</text>
  
  <!-- Transporters in cell membrane -->
  <rect x="320" y="130" width="80" height="40" fill="#ff9999" stroke="#333" stroke-width="2" rx="10"/>
  <text x="360" y="155" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Slc52a3</text>
  <text x="360" y="170" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(MGI:1916948)</text>
  
  <rect x="460" y="130" width="80" height="40" fill="#ff9999" stroke="#333" stroke-width="2" rx="10"/>
  <text x="500" y="155" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Slc52a2</text>
  <text x="500" y="170" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(MGI:1289288)</text>
  
  <!-- Transport function label -->
  <text x="160" y="110" font-family="Arial" font-size="16" font-weight="bold" text-anchor="end">Riboflavin Transport</text>
  <text x="160" y="130" font-family="Arial" font-size="13" text-anchor="end" fill="#666">(GO:0032217)</text>
  
  <!-- Transport arrows -->
  <path d="M400,110 L360,130" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M400,110 L500,130" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Riboflavin in cytosol -->
  <circle cx="400" cy="220" r="30" fill="#ffcc00" stroke="#e6b800" stroke-width="2"/>
  <text x="400" y="225" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Riboflavin</text>
  
  <!-- Transport outcome arrows with direction indicators -->
  <path d="M360,170 L400,195" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="370" y="190" font-family="Arial" font-size="12" fill="#333">Import</text>
  
  <path d="M500,170 L400,195" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="460" y="190" font-family="Arial" font-size="12" fill="#333">Import</text>
  
  <!-- Rfk enzyme -->
  <rect x="300" y="280" width="80" height="40" fill="#99ccff" stroke="#333" stroke-width="2" rx="10"/>
  <text x="340" y="305" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Rfk</text>
  <text x="340" y="320" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(MGI:1914688)</text>
  
  <!-- Rfk reaction background -->
  <rect x="280" y="250" width="220" height="80" rx="10" fill="#ebf5ff" stroke="#bed6e3" stroke-width="1" opacity="0.5"/>
  
  <!-- Riboflavin to Rfk arrow -->
  <path d="M400,250 L340,280" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- FMN intermediate -->
  <circle cx="450" cy="350" r="30" fill="#99ff99" stroke="#66cc66" stroke-width="2"/>
  <text x="450" y="355" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">FMN</text>
  
  <!-- Phosphorylation label -->
  <text x="600" y="280" font-family="Arial" font-size="16" font-weight="bold">Phosphorylation</text>
  <text x="600" y="300" font-family="Arial" font-size="13" fill="#666">GO:0008531</text>
  
  <!-- Rfk to FMN arrow -->
  <path d="M380,320 L430,335" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="405" y="340" font-family="Arial" font-size="12" fill="#333">ATP → ADP + Pi</text>
  
  <!-- Flad1 enzyme -->
  <rect x="300" y="400" width="80" height="40" fill="#99ccff" stroke="#333" stroke-width="2" rx="10"/>
  <text x="340" y="425" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Flad1</text>
  <text x="340" y="440" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">(MGI:2443030)</text>
  
  <!-- Flad1 reaction background -->
  <rect x="280" y="370" width="220" height="80" rx="10" fill="#f7ebff" stroke="#ded2e6" stroke-width="1" opacity="0.5"/>
  
  <!-- Adenylylation label -->
  <text x="600" y="420" font-family="Arial" font-size="16" font-weight="bold">Adenylylation</text>
  <text x="600" y="440" font-family="Arial" font-size="13" fill="#666">GO:0003919</text>
  
  <!-- FMN to Flad1 arrow -->
  <path d="M430,370 L340,400" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- FAD product -->
  <circle cx="450" cy="480" r="30" fill="#ff99ff" stroke="#ff66ff" stroke-width="2"/>
  <text x="450" y="485" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">FAD</text>
  <text x="450" y="500" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">(CHEBI:16238)</text>
  
  <!-- Flad1 to FAD arrow -->
  <path d="M380,430 L430,465" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="405" y="460" font-family="Arial" font-size="12" fill="#333">ATP → PPi</text>
  
  <!-- Biosynthetic Process label -->
  <text x="650" y="180" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Biosynthetic Process</text>
  <text x="650" y="200" font-family="Arial" font-size="13" fill="#666">(GO:0009058)</text>
  
  <!-- Title -->
  <text x="400" y="560" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Vitamin B2 (Riboflavin) Metabolic Pathway to FAD in Mouse</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
</svg>