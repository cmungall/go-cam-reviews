<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background cell with ER membrane -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f8f9fa" stroke="#aaaaaa" stroke-width="2"/>
  <text x="400" y="35" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Androgen Biosynthesis Pathway (Mouse)</text>
  
  <!-- ER Membrane - simplified -->
  <rect x="100" y="150" width="600" height="12" fill="#7a5195" rx="2" ry="2"/>
  <text x="400" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Endoplasmic Reticulum Membrane (GO:0005789)</text>
  
  <!-- Molecules and Reactions -->
  <!-- Pregnenolone to 17α-Hydroxypregnenolone -->
  <circle cx="150" cy="250" r="28" fill="#ffa600" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="255" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Pregnenolone</text>
  
  <line x1="178" y1="250" x2="222" y2="250" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="185" y="220" width="35" height="20" fill="#ef5675" rx="5" ry="5"/>
  <text x="202" y="233" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Cyp17a1</text>
  
  <circle cx="250" cy="250" r="28" fill="#ffa600" stroke="#333333" stroke-width="1.5"/>
  <text x="250" y="247" font-family="Arial" font-size="9" text-anchor="middle">17α-Hydroxy-</text>
  <text x="250" y="258" font-family="Arial" font-size="9" text-anchor="middle">pregnenolone</text>
  
  <!-- 17α-Hydroxypregnenolone to DHEA -->
  <line x1="278" y1="250" x2="322" y2="250" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="285" y="220" width="35" height="20" fill="#ef5675" rx="5" ry="5"/>
  <text x="302" y="233" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Cyp17a1</text>
  
  <circle cx="350" cy="250" r="28" fill="#ffa600" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="255" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">DHEA</text>
  
  <!-- DHEA to Androstenedione -->
  <line x1="350" y1="278" x2="350" y2="322" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="315" y="290" width="35" height="20" fill="#ef5675" rx="5" ry="5"/>
  <text x="332" y="303" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Hsd3b1</text>
  
  <circle cx="350" cy="350" r="28" fill="#ffa600" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="347" font-family="Arial" font-size="9" text-anchor="middle">Androst-4-ene</text>
  <text x="350" y="359" font-family="Arial" font-size="9" text-anchor="middle">3,17-dione</text>
  
  <!-- Androstenedione to Testosterone -->
  <line x1="378" y1="350" x2="422" y2="350" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="385" y="320" width="35" height="20" fill="#ef5675" rx="5" ry="5"/>
  <text x="402" y="333" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Hsd17b3</text>
  
  <circle cx="450" cy="350" r="28" fill="#ffa600" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="355" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Testosterone</text>
  
  <!-- Testosterone to DHT (via Srd5a1 and Srd5a2) -->
  <line x1="450" y1="378" x2="450" y2="422" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="415" y="390" width="35" height="20" fill="#ef5675" rx="5" ry="5"/>
  <text x="432" y="403" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Srd5a1</text>
  
  <rect x="460" y="390" width="35" height="20" fill="#ef5675" rx="5" ry="5"/>
  <text x="477" y="403" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Srd5a2</text>
  
  <circle cx="450" cy="450" r="28" fill="#ffa600" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="445" font-family="Arial" font-size="9" text-anchor="middle">17β-hydroxy-5α</text>
  <text x="450" y="457" font-family="Arial" font-size="9" text-anchor="middle">androstan-3-one</text>
  <text x="450" y="470" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">(DHT)</text>
  
  <!-- Alternative pathway: Pregnenolone to Progesterone -->
  <line x1="150" y1="278" x2="150" y2="322" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="115" y="290" width="35" height="20" fill="#ef5675" rx="5" ry="5"/>
  <text x="132" y="303" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Hsd3b1</text>
  
  <circle cx="150" cy="350" r="28" fill="#ffa600" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="355" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Progesterone</text>
  
  <!-- Progesterone to 17α-Hydroxyprogesterone -->
  <line x1="178" y1="350" x2="222" y2="350" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="185" y="320" width="35" height="20" fill="#ef5675" rx="5" ry="5"/>
  <text x="202" y="333" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Cyp17a1</text>
  
  <circle cx="250" cy="350" r="28" fill="#ffa600" stroke="#333333" stroke-width="1.5"/>
  <text x="250" y="347" font-family="Arial" font-size="9" text-anchor="middle">17α-Hydroxy-</text>
  <text x="250" y="359" font-family="Arial" font-size="9" text-anchor="middle">progesterone</text>
  
  <!-- Cofactors and molecules -->
  <rect x="165" y="225" width="55" height="15" fill="#ffffff" stroke="#dddddd" rx="2" ry="2"/>
  <text x="192" y="235" font-family="Arial" font-size="9" fill="#000000">+O₂, NADPH</text>
  
  <rect x="265" y="225" width="55" height="15" fill="#ffffff" stroke="#dddddd" rx="2" ry="2"/>
  <text x="292" y="235" font-family="Arial" font-size="9" fill="#000000">+O₂, NADPH</text>
  
  <rect x="355" y="285" width="40" height="15" fill="#ffffff" stroke="#dddddd" rx="2" ry="2"/>
  <text x="375" y="295" font-family="Arial" font-size="9" fill="#000000">+NAD⁺</text>
  
  <rect x="375" y="335" width="45" height="15" fill="#ffffff" stroke="#dddddd" rx="2" ry="2"/>
  <text x="397" y="345" font-family="Arial" font-size="9" fill="#000000">+NADPH</text>
  
  <rect x="495" y="395" width="45" height="15" fill="#ffffff" stroke="#dddddd" rx="2" ry="2"/>
  <text x="517" y="405" font-family="Arial" font-size="9" fill="#000000">+NADPH</text>
  
  <!-- Legend -->
  <rect x="550" y="200" width="180" height="180" fill="white" stroke="#aaaaaa" stroke-width="1" rx="5" ry="5"/>
  <text x="640" y="220" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="570" cy="245" r="10" fill="#ffa600" stroke="#333333" stroke-width="1"/>
  <text x="630" y="250" font-family="Arial" font-size="12" text-anchor="middle">Steroid molecule</text>
  
  <rect x="560" y="265" width="20" height="15" fill="#ef5675" rx="3" ry="3"/>
  <text x="630" y="278" font-family="Arial" font-size="12" text-anchor="middle">Enzyme</text>
  
  <rect x="560" y="295" width="20" height="5" fill="#7a5195" rx="1" ry="1"/>
  <text x="645" y="300" font-family="Arial" font-size="12" text-anchor="middle">ER membrane</text>
  
  <rect x="560" y="315" width="20" height="15" fill="#ffffff" stroke="#dddddd" rx="2" ry="2"/>
  <text x="630" y="325" font-family="Arial" font-size="12" text-anchor="middle">Cofactor</text>
  
  <text x="640" y="350" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">Androgen biosynthetic</text>
  <text x="640" y="365" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">process (GO:0006702)</text>
  
  <!-- Title for cofactors -->
  <text x="640" y="500" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Key Enzymes and Genes:</text>
  <text x="640" y="520" font-family="Arial" font-size="12" text-anchor="middle">Cyp17a1 (Steroid 17-alpha-monooxygenase)</text>
  <text x="640" y="535" font-family="Arial" font-size="12" text-anchor="middle">Hsd3b1 (Steroid delta-isomerase)</text>
  <text x="640" y="550" font-family="Arial" font-size="12" text-anchor="middle">Hsd17b3 (Testosterone dehydrogenase)</text>
  <text x="640" y="565" font-family="Arial" font-size="12" text-anchor="middle">Srd5a1/2 (3-oxo-5-alpha-steroid 4-dehydrogenase)</text>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
</svg>