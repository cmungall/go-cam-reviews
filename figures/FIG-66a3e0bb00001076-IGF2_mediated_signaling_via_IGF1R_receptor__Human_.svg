<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background with cell compartments -->
    <!-- Extracellular Space -->
    <rect x="0" y="0" width="800" height="250" fill="#e6f7ff" opacity="0.6"/>
    <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold">Extracellular Space (GO:0005615)</text>
    
    <!-- Plasma Membrane -->
    <rect x="0" y="250" width="800" height="50" fill="#b3d9ff" opacity="0.8"/>
    <text x="20" y="280" font-family="Arial" font-size="16" font-weight="bold">Plasma Membrane (GO:0005886)</text>
    
    <!-- Cytoplasm -->
    <rect x="0" y="300" width="800" height="300" fill="#ffe6cc" opacity="0.6"/>
    <text x="20" y="330" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm (GO:0005737)</text>
    
    <!-- IGF2 Growth Factor -->
    <circle cx="400" cy="150" r="30" fill="#ff9966" stroke="#cc6600" stroke-width="2"/>
    <text x="400" y="155" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">IGF2</text>
    <text x="400" y="175" font-family="Arial" font-size="10" text-anchor="middle">P01344</text>
    
    <!-- Growth Factor Activity Label -->
    <rect x="450" y="120" width="180" height="30" rx="15" ry="15" fill="white" stroke="#666" stroke-width="1" opacity="0.9"/>
    <text x="540" y="140" font-family="Arial" font-size="12" text-anchor="middle">Growth Factor Activity (GO:0008083)</text>
    <line x1="430" y1="150" x2="450" y2="135" stroke="#666" stroke-width="1" stroke-dasharray="4"/>
    
    <!-- IGF1R Receptor on Membrane -->
    <rect x="350" y="230" width="100" height="70" rx="15" ry="15" fill="#6699cc" stroke="#336699" stroke-width="2"/>
    <text x="400" y="265" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">IGF1R</text>
    <text x="400" y="285" font-family="Arial" font-size="10" text-anchor="middle">P08069</text>
    
    <!-- IGF1R Activity Label -->
    <rect x="470" y="240" width="200" height="30" rx="15" ry="15" fill="white" stroke="#666" stroke-width="1" opacity="0.9"/>
    <text x="570" y="260" font-family="Arial" font-size="12" text-anchor="middle">IGF Receptor Activity (GO:0005010)</text>
    <line x1="450" y1="260" x2="470" y2="255" stroke="#666" stroke-width="1" stroke-dasharray="4"/>
    
    <!-- Binding/Activation Arrow -->
    <line x1="400" y1="180" x2="400" y2="230" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Receptor Downstream Signaling -->
    <!-- IRS1 Adaptor -->
    <rect x="300" y="370" width="80" height="50" rx="10" ry="10" fill="#99cc99" stroke="#669966" stroke-width="2"/>
    <text x="340" y="395" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">IRS1</text>
    <text x="340" y="410" font-family="Arial" font-size="10" text-anchor="middle">P35568</text>
    
    <!-- IRS2 Adaptor -->
    <rect x="420" y="370" width="80" height="50" rx="10" ry="10" fill="#99cc99" stroke="#669966" stroke-width="2"/>
    <text x="460" y="395" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">IRS2</text>
    <text x="460" y="410" font-family="Arial" font-size="10" text-anchor="middle">Q9Y4H2</text>
    
    <!-- Adaptor Activity Labels -->
    <rect x="220" y="430" width="170" height="30" rx="15" ry="15" fill="white" stroke="#666" stroke-width="1" opacity="0.9"/>
    <text x="305" y="450" font-family="Arial" font-size="12" text-anchor="middle">Signaling Adaptor Activity</text>
    <text x="305" y="465" font-family="Arial" font-size="10" text-anchor="middle">(GO:0035591)</text>
    <line x1="300" y1="420" x2="290" y2="430" stroke="#666" stroke-width="1" stroke-dasharray="4"/>
    
    <rect x="410" y="430" width="170" height="30" rx="15" ry="15" fill="white" stroke="#666" stroke-width="1" opacity="0.9"/>
    <text x="495" y="450" font-family="Arial" font-size="12" text-anchor="middle">Signaling Adaptor Activity</text>
    <text x="495" y="465" font-family="Arial" font-size="10" text-anchor="middle">(GO:0035591)</text>
    <line x1="460" y1="420" x2="470" y2="430" stroke="#666" stroke-width="1" stroke-dasharray="4"/>
    
    <!-- Signaling Arrows -->
    <line x1="380" y1="300" x2="340" y2="370" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="420" y1="300" x2="460" y2="370" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Overall Process Label -->
    <rect x="250" y="500" width="300" height="40" rx="20" ry="20" fill="#ffcccc" stroke="#ff9999" stroke-width="2"/>
    <text x="400" y="525" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Insulin-like Growth Factor Receptor Signaling Pathway</text>
    <text x="400" y="540" font-family="Arial" font-size="10" text-anchor="middle">(GO:0048009)</text>
    
    <!-- Arrow Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
        </marker>
    </defs>
    
    <!-- Title -->
    <text x="400" y="590" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">IGF2-Mediated Signaling via IGF1R Receptor (Human)</text>
</svg>