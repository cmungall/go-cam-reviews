<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell compartments -->
  <!-- Extracellular Space -->
  <rect x="0" y="0" width="800" height="200" fill="#e6f7ff" opacity="0.5"/>
  <text x="20" y="30" font-family="Arial" font-size="18" fill="#666" font-weight="bold">Extracellular Space</text>
  
  <!-- Plasma Membrane -->
  <path d="M 0,200 L 800,200" stroke="#333" stroke-width="3" fill="none"/>
  <path d="M 0,215 L 800,215" stroke="#333" stroke-width="3" fill="none"/>
  <text x="20" y="230" font-family="Arial" font-size="18" fill="#666" font-weight="bold">Plasma Membrane</text>
  
  <!-- Cytoplasm -->
  <rect x="0" y="215" width="800" height="235" fill="#f0f9e8" opacity="0.5"/>
  <text x="20" y="240" font-family="Arial" font-size="18" fill="#666" font-weight="bold">Cytoplasm</text>
  
  <!-- Nuclear Membrane -->
  <ellipse cx="400" cy="500" rx="200" ry="80" stroke="#333" stroke-width="3" fill="#f9f3d5" opacity="0.7"/>
  <text x="370" y="500" font-family="Arial" font-size="18" fill="#666" font-weight="bold">Nucleus</text>
  
  <!-- IL-9 Molecule (IL-9 cytokine) -->
  <circle cx="200" cy="100" r="30" fill="#ff7f0e" stroke="#333" stroke-width="2"/>
  <text x="185" y="105" font-family="Arial" font-size="18" font-weight="bold" fill="white">IL-9</text>
  
  <!-- Receptor Complex on Plasma Membrane -->
  <!-- IL-9R -->
  <rect x="180" y="180" width="40" height="50" rx="5" ry="5" fill="#1f77b4" stroke="#333" stroke-width="2"/>
  <text x="182" y="210" font-family="Arial" font-size="16" fill="white">IL9R</text>
  
  <!-- IL-2RG -->
  <rect x="220" y="180" width="40" height="50" rx="5" ry="5" fill="#2ca02c" stroke="#333" stroke-width="2"/>
  <text x="220" y="210" font-family="Arial" font-size="16" fill="white">IL2RG</text>
  
  <!-- Binding arrow from IL-9 to receptor -->
  <path d="M 200,130 L 200,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- JAK1 and JAK3 at the cytoplasmic side of plasma membrane -->
  <polygon points="170,225 210,225 210,255 190,265 170,255" fill="#d62728" stroke="#333" stroke-width="2"/>
  <text x="175" y="245" font-family="Arial" font-size="16" fill="white">JAK1</text>
  
  <polygon points="230,225 270,225 270,255 250,265 230,255" fill="#9467bd" stroke="#333" stroke-width="2"/>
  <text x="235" y="245" font-family="Arial" font-size="16" fill="white">JAK3</text>
  
  <!-- Activation arrows from receptor to JAKs -->
  <path d="M 190,230 L 190,225" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250,230 L 250,225" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- STATs in cytoplasm -->
  <circle cx="300" cy="300" r="25" fill="#8c564b" stroke="#333" stroke-width="2"/>
  <text x="280" y="305" font-family="Arial" font-size="16" fill="white">STAT1</text>
  
  <circle cx="400" cy="300" r="25" fill="#e377c2" stroke="#333" stroke-width="2"/>
  <text x="380" y="305" font-family="Arial" font-size="16" fill="white">STAT3</text>
  
  <circle cx="500" cy="300" r="25" fill="#7f7f7f" stroke="#333" stroke-width="2"/>
  <text x="480" y="305" font-family="Arial" font-size="16" fill="white">STAT5A</text>
  
  <!-- Activation arrows from JAKs to STATs -->
  <path d="M 210,255 C 250,270 280,280 300,275" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 210,255 C 300,270 350,280 400,275" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 270,255 C 350,270 450,280 500,275" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- STAT translocation to nucleus -->
  <path d="M 300,325 C 300,380 300,420 320,460" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  
  <path d="M 400,325 C 400,380 400,420 400,460" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  
  <path d="M 500,325 C 500,380 500,420 480,460" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  
  <!-- STATs in nucleus -->
  <circle cx="320" cy="500" r="25" fill="#8c564b" stroke="#333" stroke-width="2"/>
  <text x="300" y="505" font-family="Arial" font-size="16" fill="white">STAT1</text>
  
  <circle cx="400" cy="500" r="25" fill="#e377c2" stroke="#333" stroke-width="2"/>
  <text x="380" y="505" font-family="Arial" font-size="16" fill="white">STAT3</text>
  
  <circle cx="480" cy="500" r="25" fill="#7f7f7f" stroke="#333" stroke-width="2"/>
  <text x="460" y="505" font-family="Arial" font-size="16" fill="white">STAT5A</text>
  
  <!-- DNA in nucleus -->
  <path d="M 250,530 C 300,550 350,520 400,535 C 450,550 500,520 550,535" stroke="#333" stroke-width="4" fill="none"/>
  
  <!-- STATs binding to DNA -->
  <path d="M 320,525 L 320,535" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400,525 L 400,535" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 480,525 L 480,535" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Gene Expression Label -->
  <text x="400" y="560" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Gene Regulation</text>
  
  <!-- Phosphorylation indicators -->
  <circle cx="300" cy="280" r="5" fill="yellow" stroke="#333" stroke-width="1"/>
  <circle cx="400" cy="280" r="5" fill="yellow" stroke="#333" stroke-width="1"/>
  <circle cx="500" cy="280" r="5" fill="yellow" stroke="#333" stroke-width="1"/>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="580" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">IL-9-Mediated Signaling Pathway (Human)</text>
</svg>