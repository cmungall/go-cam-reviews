<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell outline -->
  <rect width="800" height="600" fill="#f9f9f9" rx="20" ry="20" />
  <path d="M 50,100 Q 400,50 750,100 Q 800,300 750,500 Q 400,550 50,500 Q 0,300 50,100" fill="#f0f0f0" stroke="#888" stroke-width="2" opacity="0.8" />
  
  <!-- Cell compartments -->
  <!-- Cytoplasm - implied as the general cell background -->
  <text x="120" y="120" font-family="Arial" font-size="20" font-weight="bold" fill="#555">Cytoplasm (GO:0005737)</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="200" cy="250" rx="100" ry="70" fill="#ffdddd" stroke="#ff8888" stroke-width="2" />
  <path d="M 150,230 Q 200,260 250,230 M 150,250 Q 200,280 250,250 M 150,270 Q 200,300 250,270" stroke="#ff8888" stroke-width="1.5" fill="none" />
  <text x="200" y="230" font-family="Arial" font-size="20" font-weight="bold" fill="#555" text-anchor="middle">Mitochondrion</text>
  <text x="200" y="252" font-family="Arial" font-size="14" fill="#777" text-anchor="middle">(GO:0005739)</text>
  
  <!-- Plasma Membrane -->
  <path d="M 50,100 Q 400,50 750,100 Q 800,300 750,500 Q 400,550 50,500 Q 0,300 50,100" fill="none" stroke="#444" stroke-width="4" />
  <text x="650" y="120" font-family="Arial" font-size="20" font-weight="bold" fill="#555">Plasma Membrane (GO:0005886)</text>
  
  <!-- Protein 1: TRIM21 (UniProtKB:P19474) in cytoplasm -->
  <rect x="120" y="350" width="130" height="70" rx="15" fill="#b3e0ff" stroke="#0066cc" stroke-width="2" />
  <text x="185" y="383" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">TRIM21</text>
  <text x="185" y="402" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">Ubiquitin protein ligase</text>
  <text x="185" y="418" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">activity (GO:0061630)</text>
  
  <!-- Protein 2: IFI27/Isg12a (UniProtKB:P40305) in mitochondrion -->
  <rect x="180" y="180" width="130" height="70" rx="15" fill="#d9f2d9" stroke="#339933" stroke-width="2" />
  <text x="245" y="210" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">IFI27/Isg12a</text>
  <text x="245" y="230" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">Molecular adaptor</text>
  <text x="245" y="246" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">activity (GO:0060090)</text>
  
  <!-- Protein 3: CASP3 (UniProtKB:P42574) in cytoplasm -->
  <rect x="400" y="330" width="150" height="80" rx="15" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="475" y="363" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">CASP3</text>
  <text x="475" y="383" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">Cysteine-type endopeptidase</text>
  <text x="475" y="399" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">activity (GO:0004197)</text>
  
  <!-- Protein 4: GSDME (UniProtKB:O60443) in plasma membrane -->
  <rect x="600" y="180" width="150" height="80" rx="15" fill="#e6ccff" stroke="#8833cc" stroke-width="2" />
  <text x="675" y="213" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">GSDME</text>
  <text x="675" y="233" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">Wide pore channel</text>
  <text x="675" y="249" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">activity (GO:0022829)</text>
  
  <!-- Connections between proteins -->
  <!-- TRIM21 -> IFI27 (K6-linked ubiquitination) -->
  <path d="M 180,350 Q 160,280 190,250" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <rect x="95" y="285" width="140" height="40" rx="10" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="165" y="305" font-family="Arial" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">K6-linked ubiquitination</text>
  <text x="165" y="320" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">(GO:0085020)</text>
  
  <!-- IFI27 -> CASP3 -->
  <path d="M 310,220 Q 360,270 400,350" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <rect x="320" y="260" width="160" height="30" rx="10" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="400" y="280" font-family="Arial" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Positively regulates</text>
  
  <!-- CASP3 -> GSDME -->
  <path d="M 550,330 Q 590,275 600,230" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <rect x="540" y="265" width="160" height="30" rx="10" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="620" y="285" font-family="Arial" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Positively regulates</text>
  
  <!-- Overall process label -->
  <rect x="250" y="30" width="300" height="40" rx="10" fill="#f0f0f0" stroke="#444" stroke-width="1" />
  <text x="400" y="55" font-family="Arial" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Pyroptotic Inflammatory Response</text>
  <text x="400" y="75" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">(GO:0070269)</text>
  
  <!-- Pore formation in the membrane -->
  <circle cx="670" cy="100" r="20" fill="none" stroke="#8833cc" stroke-width="2" />
  <path d="M 670,180 Q 670,140 670,100" fill="none" stroke="#8833cc" stroke-width="2" stroke-dasharray="5,3" />
  <text x="700" y="100" font-family="Arial" font-size="15" font-weight="bold" fill="#8833cc">Pore formation</text>
  
  <!-- Result of pyroptosis - cell content release -->
  <path d="M 670,100 Q 690,80 710,70 M 670,100 Q 650,80 630,70" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3,2" />
  <text x="710" y="70" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Cell content</text>
  <text x="710" y="88" font-family="Arial" font-size="15" fill="#333">release</text>
  
  <!-- Legend -->
  <rect x="50" y="510" width="700" height="80" rx="10" fill="#ffffff" stroke="#888" stroke-width="1" />
  <text x="400" y="530" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">LEGEND</text>
  
  <!-- Protein color samples -->
  <rect x="70" y="545" width="20" height="20" fill="#b3e0ff" stroke="#0066cc" stroke-width="1" />
  <text x="105" y="560" font-family="Arial" font-size="14" fill="#333">TRIM21 (P19474)</text>
  
  <rect x="220" y="545" width="20" height="20" fill="#d9f2d9" stroke="#339933" stroke-width="1" />
  <text x="265" y="560" font-family="Arial" font-size="14" fill="#333">IFI27/Isg12a (P40305)</text>
  
  <rect x="390" y="545" width="20" height="20" fill="#ffe6cc" stroke="#ff9933" stroke-width="1" />
  <text x="425" y="560" font-family="Arial" font-size="14" fill="#333">CASP3 (P42574)</text>
  
  <rect x="510" y="545" width="20" height="20" fill="#e6ccff" stroke="#8833cc" stroke-width="1" />
  <text x="545" y="560" font-family="Arial" font-size="14" fill="#333">GSDME (O60443)</text>
  
  <!-- Arrow symbol for legend -->
  <path d="M 70,575 L 90,575" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="140" y="580" font-family="Arial" font-size="14" fill="#333">Positive regulation</text>
  
  <circle cx="270" y="575" r="8" fill="none" stroke="#8833cc" stroke-width="1.5" />
  <text x="330" y="580" font-family="Arial" font-size="14" fill="#333">Pore formation</text>
  
  <rect x="410" y="570" width="80" height="15" fill="#f0f0f0" stroke="#444" stroke-width="1" />
  <text x="500" y="580" font-family="Arial" font-size="14" fill="#333">Cellular compartment</text>
  
  <!-- Define the arrowhead -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>