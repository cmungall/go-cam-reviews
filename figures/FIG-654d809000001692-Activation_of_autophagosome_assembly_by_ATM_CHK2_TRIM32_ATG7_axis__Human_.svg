<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background with slight gradient -->
    <defs>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="800" height="600" fill="url(#bg-gradient)" />
    
    <!-- Cell outline -->
    <ellipse cx="400" cy="350" rx="350" ry="220" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- Oxidative stress symbol -->
    <g transform="translate(100,100)">
        <circle cx="0" cy="0" r="30" fill="#ffccd5" stroke="#ff758f" stroke-width="2" />
        <text x="0" y="5" font-family="Arial" font-size="13" text-anchor="middle" fill="#212529" font-weight="bold">Oxidative</text>
        <text x="0" y="20" font-family="Arial" font-size="13" text-anchor="middle" fill="#212529" font-weight="bold">Stress</text>
    </g>
    <path d="M130,130 L190,160" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- ATM Protein -->
    <g transform="translate(220,160)">
        <rect x="-50" y="-30" width="100" height="60" rx="10" ry="10" fill="#8ecae6" stroke="#023e8a" stroke-width="2" />
        <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">ATM</text>
        <text x="0" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">Ser/Thr kinase</text>
    </g>
    
    <!-- Phosphorylation symbol -->
    <path d="M270,190 L330,190" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)" />
    <circle cx="300" cy="180" r="12" fill="#FFD700" stroke="#DAA520" stroke-width="1.5"/>
    <text x="300" y="185" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">P</text>
    
    <!-- CHEK2 Protein -->
    <g transform="translate(380,190)">
        <rect x="-50" y="-30" width="100" height="60" rx="10" ry="10" fill="#8ecae6" stroke="#023e8a" stroke-width="2" />
        <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">CHK2</text>
        <text x="0" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">Ser kinase</text>
    </g>
    <path d="M420,220 L470,270" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- Autophagosome membrane -->
    <path d="M350,350 C400,270 600,270 650,350 C700,430 550,480 500,450 C450,480 300,430 350,350 Z" fill="#f8f9fa" stroke="#495057" stroke-width="2" fill-opacity="0.6" />
    <path d="M370,350 C410,290 590,290 630,350 C670,410 550,450 500,425 C450,450 330,410 370,350 Z" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="3,3" />
    <text x="500" y="365" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">Autophagosome</text>
    
    <!-- TRIM32 Protein -->
    <g transform="translate(500,280)">
        <rect x="-50" y="-30" width="100" height="60" rx="10" ry="10" fill="#ffd166" stroke="#ef476f" stroke-width="2" />
        <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">TRIM32</text>
        <text x="0" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">E3 Ubiquitin ligase</text>
    </g>
    
    <!-- Ubiquitination symbol -->
    <path d="M540,310 L580,330" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)" />
    <rect x="540" y="302" width="30" height="20" rx="5" ry="5" fill="#9D4EDD" stroke="#7B2CBF" stroke-width="1.5"/>
    <text x="555" y="317" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Ub-K63</text>
    
    <!-- ATG7 Protein -->
    <g transform="translate(600,330)">
        <rect x="-50" y="-30" width="100" height="60" rx="10" ry="10" fill="#06d6a0" stroke="#073b4c" stroke-width="2" />
        <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">ATG7</text>
        <text x="0" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#212529">Atg12 activating enzyme</text>
    </g>
    
    <!-- Autophagosome assembly process -->
    <g transform="translate(600,430)">
        <ellipse cx="0" cy="0" rx="90" ry="40" fill="#e9ecef" stroke="#495057" stroke-width="2" stroke-dasharray="3,2" />
        <text x="0" y="-8" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Autophagosome</text>
        <text x="0" y="15" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Assembly</text>
    </g>
    <path d="M600,360 L600,390" stroke="#212529" stroke-width="2" marker-end="url(#arrowhead)" />

    <!-- Key signaling events labels -->
    <text x="150" y="75" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">Response to Oxidative Stress</text>
    <text x="500" y="220" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">K63-linked ubiquitination</text>
    
    <!-- Title -->
    <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">Activation of Autophagosome Assembly by ATM-CHK2-TRIM32-ATG7 Axis</text>
    
    <!-- Arrowhead marker -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#212529" />
        </marker>
    </defs>
</svg>