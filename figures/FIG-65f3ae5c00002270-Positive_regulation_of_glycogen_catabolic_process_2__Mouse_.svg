<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Cytosol -->
  <rect x="50" y="100" width="700" height="500" rx="20" ry="20" fill="#f0f8ff" stroke="#aaccee" stroke-width="2"/>
  <text x="70" y="130" font-family="Arial" font-size="18" font-weight="bold" fill="#555">Cytosol (GO:0005829)</text>
  
  <!-- Glycogen Molecule -->
  <circle cx="250" cy="200" r="40" fill="#d9b38c" stroke="#a58258" stroke-width="2"/>
  <text x="250" y="205" font-family="Arial" font-size="16" fill="#000" text-anchor="middle">Glycogen</text>
  
  <!-- Enzymes and Activities -->
  <!-- Phkg1 -->
  <rect x="100" y="320" width="120" height="60" rx="10" ry="10" fill="#a7c7e7" stroke="#6699cc" stroke-width="2"/>
  <text x="160" y="345" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">Phkg1</text>
  <text x="160" y="365" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">phosphorylase kinase</text>
  <text x="160" y="380" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">activity</text>
  
  <!-- Pygb -->
  <rect x="250" y="300" width="120" height="60" rx="10" ry="10" fill="#a7e7c7" stroke="#66cc99" stroke-width="2"/>
  <text x="310" y="325" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">Pygb</text>
  <text x="310" y="345" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">glycogen phosphorylase</text>
  <text x="310" y="360" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">activity</text>
  
  <!-- Agl (4-alpha-glucanotransferase) -->
  <rect x="150" y="430" width="120" height="60" rx="10" ry="10" fill="#e7c7a7" stroke="#cc9966" stroke-width="2"/>
  <text x="210" y="455" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">Agl</text>
  <text x="210" y="475" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">4-alpha-glucanotransferase</text>
  <text x="210" y="490" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">activity</text>
  
  <!-- Agl (amylo-alpha-1,6-glucosidase) -->
  <rect x="150" y="530" width="120" height="60" rx="10" ry="10" fill="#e7c7a7" stroke="#cc9966" stroke-width="2"/>
  <text x="210" y="555" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">Agl</text>
  <text x="210" y="575" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">amylo-alpha-1,6-glucosidase</text>
  <text x="210" y="590" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">activity</text>
  
  <!-- Pgm1 -->
  <rect x="330" y="430" width="120" height="60" rx="10" ry="10" fill="#c7a7e7" stroke="#9966cc" stroke-width="2"/>
  <text x="390" y="455" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">Pgm1</text>
  <text x="390" y="475" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">phosphoglucomutase</text>
  <text x="390" y="490" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">activity</text>
  
  <!-- Pgm2 -->
  <rect x="500" y="430" width="120" height="60" rx="10" ry="10" fill="#e7a7c7" stroke="#cc6699" stroke-width="2"/>
  <text x="560" y="455" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">Pgm2</text>
  <text x="560" y="475" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">phosphoglucomutase</text>
  <text x="560" y="490" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">activity</text>
  
  <!-- Output Product -->
  <rect x="400" y="530" width="150" height="40" rx="5" ry="5" fill="#fcf7bb" stroke="#e6dc6d" stroke-width="2"/>
  <text x="475" y="555" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">α-D-glucose 6-phosphate</text>
  
  <!-- Connection arrows -->
  <!-- Glycogen -> Pygb -->
  <line x1="250" y1="240" x2="290" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="260" y="280" font-family="Arial" font-size="14" fill="#333">substrate</text>
  
  <!-- Phkg1 -> Pygb -->
  <line x1="220" y1="330" x2="250" y2="330" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="235" y="320" font-family="Arial" font-size="16" font-weight="bold" fill="#333">+</text>
  
  <!-- Pygb -> Agl -->
  <line x1="290" y1="360" x2="240" y2="430" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pygb -> Pgm1 -->
  <line x1="310" y1="360" x2="370" y2="430" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pygb -> Pgm2 -->
  <line x1="330" y1="330" x2="530" y2="430" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Agl -> Agl -->
  <line x1="210" y1="490" x2="210" y2="530" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pgm1 -> Output -->
  <line x1="390" y1="490" x2="440" y2="530" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pgm2 -> Output -->
  <line x1="560" y1="490" x2="510" y2="530" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Process name -->
  <text x="400" y="35" font-family="Arial" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Positive Regulation of Glycogen Catabolic Process (Mouse)</text>
  <text x="400" y="60" font-family="Arial" font-size="16" fill="#666" text-anchor="middle">GO-CAM Model: gomodel:65f3ae5c00002270</text>
  
  <!-- Brief explanation -->
  <text x="400" y="85" font-family="Arial" font-size="14" font-style="italic" fill="#555" text-anchor="middle">Enzymatic pathway for glycogen breakdown regulated by phosphorylase kinase</text>
  
  <!-- Legend -->
  <rect x="580" y="120" width="160" height="150" rx="5" ry="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="660" y="140" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Legend</text>
  
  <!-- Legend Items -->
  <rect x="590" y="150" width="20" height="15" fill="#a7c7e7" stroke="#6699cc" stroke-width="1"/>
  <text x="620" y="162" font-family="Arial" font-size="14" fill="#333" text-anchor="start">Kinase</text>
  
  <rect x="590" y="175" width="20" height="15" fill="#a7e7c7" stroke="#66cc99" stroke-width="1"/>
  <text x="620" y="187" font-family="Arial" font-size="14" fill="#333" text-anchor="start">Phosphorylase</text>
  
  <rect x="590" y="200" width="20" height="15" fill="#e7c7a7" stroke="#cc9966" stroke-width="1"/>
  <text x="620" y="212" font-family="Arial" font-size="14" fill="#333" text-anchor="start">Transferase</text>
  
  <rect x="590" y="225" width="20" height="15" fill="#c7a7e7" stroke="#9966cc" stroke-width="1"/>
  <text x="620" y="237" font-family="Arial" font-size="14" fill="#333" text-anchor="start">Mutase</text>
  
  <rect x="590" y="250" width="20" height="15" fill="#fcf7bb" stroke="#e6dc6d" stroke-width="1"/>
  <text x="620" y="262" font-family="Arial" font-size="14" fill="#333" text-anchor="start">Product</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Process annotation -->
  <text x="600" y="310" font-family="Arial" font-size="14" font-style="italic" fill="#555" text-anchor="middle">RO:0002413 = directly positively regulates</text>
  <text x="600" y="330" font-family="Arial" font-size="14" font-style="italic" fill="#555" text-anchor="middle">RO:0002629 = directly positively regulates</text>
</svg>