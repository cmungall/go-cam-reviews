<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell components -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Cell membrane -->
  <path d="M50,200 Q400,170 750,200 Q400,230 50,200" fill="#e1ebf2" stroke="#333" stroke-width="2" />
  <path d="M50,200 Q400,170 750,200" fill="none" stroke="#333" stroke-width="4" />
  
  <!-- Extracellular space label -->
  <text x="400" y="150" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">Extracellular Space</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="250" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">Cytoplasm</text>
  
  <!-- IGF2 Ligand -->
  <circle cx="250" cy="120" r="25" fill="#b3d9ff" stroke="#333" stroke-width="2" />
  <text x="250" y="125" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">IGF2</text>
  
  <!-- IGF1R Receptor -->
  <rect x="220" y="185" width="60" height="30" fill="#ff9999" stroke="#333" stroke-width="2" />
  <rect x="220" y="215" width="60" height="30" fill="#ffb366" stroke="#333" stroke-width="2" />
  <text x="250" y="205" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">IGF1R</text>
  
  <!-- Arrow from IGF2 to IGF1R -->
  <path d="M250,145 L250,185" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="260" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Binding</text>
  
  <!-- IRS1 -->
  <rect x="220" y="280" width="60" height="30" rx="5" ry="5" fill="#b3ffb3" stroke="#333" stroke-width="2" />
  <text x="250" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">IRS1</text>
  
  <!-- Arrow from IGF1R to IRS1 -->
  <path d="M250,245 L250,280" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="262" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#333">P</text>
  <circle cx="262" cy="265" r="10" fill="#ffff99" stroke="#333" stroke-width="1" />
  
  <!-- PIK3R1 -->
  <rect x="350" y="280" width="60" height="30" rx="5" ry="5" fill="#d9b3ff" stroke="#333" stroke-width="2" />
  <text x="380" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">PIK3R1</text>
  
  <!-- Arrow from IRS1 to PIK3R1 -->
  <path d="M280,295 L350,295" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="315" y="285" font-family="Arial" font-size="14" fill="#333">Activation</text>
  
  <!-- PIK3CA -->
  <rect x="350" y="330" width="60" height="30" rx="5" ry="5" fill="#d9b3ff" stroke="#333" stroke-width="2" />
  <text x="380" y="350" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">PIK3CA</text>
  
  <!-- Connection between PIK3R1 and PIK3CA -->
  <path d="M380,310 L380,330" fill="none" stroke="#333" stroke-width="2" />
  <text x="400" y="325" font-family="Arial" font-size="14" fill="#333">Complex</text>
  
  <!-- PDPK1 -->
  <rect x="450" y="380" width="60" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="2" />
  <text x="480" y="400" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">PDPK1</text>
  
  <!-- Arrow from PIK3CA to PDPK1 -->
  <path d="M410,345 Q430,365 450,395" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="440" y="365" font-family="Arial" font-size="14" fill="#333">Activation</text>
  
  <!-- AKT1 -->
  <rect x="550" y="430" width="60" height="30" rx="5" ry="5" fill="#ff99cc" stroke="#333" stroke-width="2" />
  <text x="580" y="450" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">AKT1</text>
  
  <!-- Arrow from PDPK1 to AKT1 -->
  <path d="M510,395 Q530,415 550,445" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="535" y="420" font-family="Arial" font-size="14" font-weight="bold" fill="#333">P</text>
  <circle cx="535" cy="420" r="10" fill="#ffff99" stroke="#333" stroke-width="1" />
  
  <!-- ATP and ADP -->
  <ellipse cx="180" cy="210" rx="25" ry="15" fill="#ffffb3" stroke="#333" stroke-width="2" />
  <text x="180" y="215" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">ATP</text>
  
  <ellipse cx="320" cy="240" rx="25" ry="15" fill="#ffffb3" stroke="#333" stroke-width="2" />
  <text x="320" y="245" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">ADP</text>
  
  <!-- Arrow from ATP to IGF1R -->
  <path d="M205,210 L220,210" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Arrow from IGF1R to ADP -->
  <path d="M280,225 L295,240" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Function labels -->
  <g>
    <rect x="120" y="330" width="160" height="20" fill="#ffffff" opacity="0.8" />
    <text x="200" y="345" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Receptor tyrosine kinase</text>
  </g>
  
  <g>
    <rect x="290" y="355" width="160" height="20" fill="#ffffff" opacity="0.8" />
    <text x="370" y="370" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">PI3K kinase complex</text>
  </g>
  
  <g>
    <rect x="420" y="420" width="160" height="20" fill="#ffffff" opacity="0.8" />
    <text x="500" y="435" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">3-phosphoinositide kinase</text>
  </g>
  
  <g>
    <rect x="520" y="470" width="160" height="20" fill="#ffffff" opacity="0.8" />
    <text x="600" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Protein serine kinase</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Insulin-like Growth Factor Receptor Signaling Pathway (Mouse)</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>