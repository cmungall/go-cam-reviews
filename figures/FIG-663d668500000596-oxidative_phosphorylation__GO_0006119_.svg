<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Mitochondrion cross-section -->
  <defs>
    <linearGradient id="matrixGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e0ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="membraneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a6a6a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#737373;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="imSpaceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe6cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd9b3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Oxidative Phosphorylation Pathway in S. pombe</text>
  
  <!-- Mitochondrial matrix background -->
  <rect x="50" y="100" width="700" height="400" rx="20" ry="20" fill="url(#matrixGradient)" />
  
  <!-- Mitochondrial inner membrane -->
  <path d="M 50 300 
           C 100 280, 150 320, 200 280 
           C 250 240, 300 330, 350 290 
           C 400 250, 450 320, 500 280 
           C 550 240, 600 330, 650 290 
           C 700 250, 750 320, 750 300" 
        stroke="url(#membraneGradient)" stroke-width="15" fill="none" />
  
  <!-- Intermembrane space label -->
  <text x="90" y="250" font-family="Arial" font-size="16" font-weight="bold" fill="#994d00">Intermembrane Space</text>
  <text x="90" y="270" font-family="Arial" font-size="12" fill="#994d00">(GO:0005758)</text>
  
  <!-- Matrix label -->
  <text x="90" y="350" font-family="Arial" font-size="16" font-weight="bold" fill="#006699">Mitochondrial Matrix</text>
  <text x="90" y="370" font-family="Arial" font-size="12" fill="#006699">(GO:0005759)</text>
  
  <!-- Inner membrane label -->
  <text x="350" y="280" font-family="Arial" font-size="14" font-weight="bold" fill="#4d4d4d">Inner Membrane</text>
  <text x="350" y="297" font-family="Arial" font-size="10" fill="#4d4d4d">(GO:0005743)</text>
  
  <!-- NADH Dehydrogenase (NDI1) - Complex I -->
  <rect x="140" y="330" width="70" height="60" rx="5" ry="5" fill="#FF9999" stroke="#CC0000" stroke-width="2" />
  <text x="175" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">NADH Dehydrogenase</text>
  <text x="175" y="365" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">(NDI1)</text>
  <text x="175" y="380" font-family="Arial" font-size="10" text-anchor="middle">SPBC947.15c</text>
  
  <!-- Function description for Complex I -->
  <text x="175" y="410" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">NADH to ubiquinone</text>
  <text x="175" y="425" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">electron transfer</text>
  
  <!-- Succinate dehydrogenase - Complex II -->
  <g transform="translate(240, 285)">
    <rect x="0" y="0" width="90" height="65" rx="5" ry="5" fill="#FFCC99" stroke="#FF8C00" stroke-width="2" />
    <text x="45" y="20" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Complex II</text>
    <text x="45" y="35" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">SDH Complex</text>
    <text x="45" y="50" font-family="Arial" font-size="10" text-anchor="middle">SDH1, SDH2, SDH3</text>
    <text x="45" y="63" font-family="Arial" font-size="10" text-anchor="middle">TIM18</text>
  </g>
  
  <!-- Function description for Complex II -->
  <text x="285" y="370" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Electron transfer</text>
  <text x="285" y="385" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">activity</text>
  
  <!-- Cytochrome bc1 - Complex III -->
  <g transform="translate(380, 285)">
    <rect x="0" y="0" width="100" height="85" rx="5" ry="5" fill="#99CC99" stroke="#009900" stroke-width="2" />
    <text x="50" y="20" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Complex III</text>
    <text x="50" y="35" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Cytochrome bc1</text>
    <text x="50" y="50" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">COB1, CYT1, QCR2, RIP1</text>
    <text x="50" y="63" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">QCR6, QCR7, QCR8, QCR9</text>
    <text x="50" y="76" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">QCR10</text>
  </g>
  
  <!-- Function description for Complex III -->
  <text x="430" y="390" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Ubiquinol-cytochrome c</text>
  <text x="430" y="403" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">reductase activity</text>
  
  <!-- Cytochrome c -->
  <circle cx="520" y="235" r="25" fill="#FFFF99" stroke="#CCCC00" stroke-width="2" />
  <text x="520" y="233" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Cytochrome c</text>
  <text x="520" y="248" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">(CYC1)</text>
  <text x="520" y="263" font-family="Arial" font-size="9" text-anchor="middle">SPCC191.07</text>
  
  <!-- Cytochrome c oxidase - Complex IV -->
  <g transform="translate(560, 285)">
    <rect x="0" y="0" width="110" height="95" rx="5" ry="5" fill="#9999CC" stroke="#0000CC" stroke-width="2" />
    <text x="55" y="20" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Complex IV</text>
    <text x="55" y="35" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Cytochrome c Oxidase</text>
    <text x="55" y="50" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">COX1, COX2, COX3, COX4, COX5</text>
    <text x="55" y="62" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">COX6, COX7, COX8, COX9</text>
    <text x="55" y="74" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">RCF2, COX12, COX13</text>
  </g>
  
  <!-- Function description for Complex IV -->
  <text x="615" y="400" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Cytochrome-c oxidase</text>
  <text x="615" y="413" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">activity</text>
  
  <!-- Electron flow arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF0000" />
    </marker>
  </defs>
  
  <!-- NADH to Ubiquinone (Complex II) -->
  <path d="M 210 350 L 240 330" stroke="#FF0000" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <text x="225" y="360" font-family="Arial" font-size="10" fill="#FF0000" font-weight="bold">e⁻</text>
  
  <!-- Complex II to Complex III -->
  <path d="M 330 320 L 380 320" stroke="#FF0000" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <text x="355" y="315" font-family="Arial" font-size="10" fill="#FF0000" font-weight="bold">e⁻</text>
  
  <!-- Complex III to Cytochrome c -->
  <path d="M 480 310 L 510 255" stroke="#FF0000" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <text x="485" y="280" font-family="Arial" font-size="10" fill="#FF0000" font-weight="bold">e⁻</text>
  
  <!-- Cytochrome c to Complex IV -->
  <path d="M 540 240 L 560 300" stroke="#FF0000" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <text x="535" y="280" font-family="Arial" font-size="10" fill="#FF0000" font-weight="bold">e⁻</text>
  
  <!-- O2 and H2O -->
  <text x="690" y="320" font-family="Arial" font-size="16" font-weight="bold">O₂</text>
  <path d="M 670 320 L 685 320" stroke="#0000FF" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  
  <text x="690" y="350" font-family="Arial" font-size="16" font-weight="bold">H₂O</text>
  <path d="M 690 350 L 710 350" stroke="#0000FF" stroke-width="2" fill="none" />
  <text x="685" y="370" font-family="Arial" font-size="10" font-style="italic">Final product</text>
  
  <!-- Legend -->
  <rect x="580" y="450" width="180" height="135" rx="5" ry="5" fill="white" stroke="black" stroke-width="1" opacity="0.9" />
  <text x="670" y="470" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="590" y="480" width="18" height="18" fill="#FF9999" stroke="#CC0000" stroke-width="1" />
  <text x="615" y="493" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">NADH Dehydrogenase</text>
  
  <rect x="590" y="505" width="18" height="18" fill="#FFCC99" stroke="#FF8C00" stroke-width="1" />
  <text x="615" y="518" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Complex II</text>
  
  <rect x="590" y="530" width="18" height="18" fill="#99CC99" stroke="#009900" stroke-width="1" />
  <text x="615" y="543" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Complex III</text>
  
  <circle cx="599" cy="560" r="9" fill="#FFFF99" stroke="#CCCC00" stroke-width="1" />
  <text x="615" y="564" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Cytochrome c</text>
  
  <rect x="590" y="575" width="18" height="18" fill="#9999CC" stroke="#0000CC" stroke-width="1" />
  <text x="615" y="588" font-family="Arial" font-size="12" text-anchor="start" font-weight="bold">Complex IV</text>
  
  <!-- Process title -->
  <text x="400" y="475" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" font-style="italic">Oxidative Phosphorylation (GO:0006119)</text>
</svg>