<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Cell membrane outline -->
  <path d="M50,50 L750,50 L750,550 L50,550 Z" fill="#f8f8f8" stroke="#888888" stroke-width="2"/>
  
  <!-- Lysosomal membrane -->
  <ellipse cx="400" cy="300" rx="200" ry="150" fill="#FFF5E6" stroke="#FF9966" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="400" y="170" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">Lysosomal Membrane (GO:0005765)</text>
  
  <!-- Nutrient signal -->
  <path d="M50,150 L150,150" stroke="#0066CC" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="100" y="140" font-family="Arial" font-size="14" text-anchor="middle" fill="#0066CC">Nutrients</text>
  
  <!-- MTOR Complex (TORC1) in lysosomal membrane -->
  <circle cx="220" cy="250" r="45" fill="#FFD700" stroke="#333333" stroke-width="2"/>
  <text x="220" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">MTOR</text>
  <text x="220" y="275" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(P42345)</text>
  
  <!-- DEPTOR -->
  <rect x="320" y="230" width="90" height="45" rx="5" ry="5" fill="#99CCFF" stroke="#333333" stroke-width="2"/>
  <text x="365" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">DEPTOR</text>
  <text x="365" y="275" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(Q8TB45)</text>
  
  <!-- MTOR phosphorylation of DEPTOR -->
  <path d="M265,250 L320,250" stroke="#FF0000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="290" cy="240" r="12" fill="#FF0000" stroke="#333333" stroke-width="1"/>
  <text x="290" y="244" font-family="Arial" font-size="10" text-anchor="middle" fill="white">P</text>
  <text x="290" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Phosphorylation</text>
  
  <!-- CSNK1A1 -->
  <rect x="320" y="340" width="90" height="45" rx="5" ry="5" fill="#99CCFF" stroke="#333333" stroke-width="2"/>
  <text x="365" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">CSNK1A1</text>
  <text x="365" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(P48729)</text>
  
  <!-- CSNK1A1 phosphorylation of DEPTOR -->
  <path d="M365,340 L365,275" stroke="#FF0000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="350" cy="300" r="12" fill="#FF0000" stroke="#333333" stroke-width="1"/>
  <text x="350" y="304" font-family="Arial" font-size="10" text-anchor="middle" fill="white">P</text>
  
  <!-- RPS6KB1 -->
  <rect x="210" y="340" width="90" height="45" rx="5" ry="5" fill="#99CCFF" stroke="#333333" stroke-width="2"/>
  <text x="255" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">RPS6KB1</text>
  <text x="255" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(P23443)</text>
  
  <!-- RPS6KB1 phosphorylation of DEPTOR -->
  <path d="M270,340 L340,275" stroke="#FF0000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="305" cy="300" r="12" fill="#FF0000" stroke="#333333" stroke-width="1"/>
  <text x="305" y="304" font-family="Arial" font-size="10" text-anchor="middle" fill="white">P</text>
  
  <!-- Phosphorylated DEPTOR -->
  <rect x="450" y="230" width="90" height="45" rx="5" ry="5" fill="#99CCFF" stroke="#333333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="495" y="248" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">DEPTOR</text>
  <text x="495" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(phosphorylated)</text>
  <circle cx="470" cy="240" r="9" fill="#FF0000" stroke="#333333" stroke-width="1"/>
  <text x="470" y="244" font-family="Arial" font-size="9" text-anchor="middle" fill="white">P</text>
  <circle cx="485" cy="240" r="9" fill="#FF0000" stroke="#333333" stroke-width="1"/>
  <text x="485" y="244" font-family="Arial" font-size="9" text-anchor="middle" fill="white">P</text>
  <circle cx="500" cy="240" r="9" fill="#FF0000" stroke="#333333" stroke-width="1"/>
  <text x="500" y="244" font-family="Arial" font-size="9" text-anchor="middle" fill="white">P</text>
  
  <!-- SCF(BTRC) Complex -->
  <path d="M500,340 L600,340 L600,410 L500,410 Z" fill="#FFCC99" stroke="#333333" stroke-width="2"/>
  <text x="550" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">SCF(BTRC) Complex</text>
  <text x="550" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">CUL1 (Q13616)</text>
  <text x="550" y="395" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">RBX1 (P62877)</text>
  <text x="550" y="410" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">BTRC (Q9Y297)</text>
  
  <!-- SCF(BTRC) ubiquitination of DEPTOR -->
  <path d="M550,340 L495,275" stroke="#6600CC" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="520" cy="300" r="12" fill="#6600CC" stroke="#333333" stroke-width="1"/>
  <text x="520" y="304" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Ub</text>
  <text x="540" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Ubiquitination</text>
  
  <!-- Ubiquitinated DEPTOR -->
  <rect x="580" y="230" width="90" height="45" rx="5" ry="5" fill="#99CCFF" stroke="#333333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="625" y="248" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">DEPTOR</text>
  <text x="625" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(ubiquitinated)</text>
  <circle cx="600" cy="240" r="9" fill="#6600CC" stroke="#333333" stroke-width="1"/>
  <text x="600" y="244" font-family="Arial" font-size="9" text-anchor="middle" fill="white">Ub</text>
  <circle cx="615" cy="240" r="9" fill="#6600CC" stroke="#333333" stroke-width="1"/>
  <text x="615" y="244" font-family="Arial" font-size="9" text-anchor="middle" fill="white">Ub</text>
  <circle cx="630" cy="240" r="9" fill="#6600CC" stroke="#333333" stroke-width="1"/>
  <text x="630" y="244" font-family="Arial" font-size="9" text-anchor="middle" fill="white">Ub</text>
  
  <!-- Degradation -->
  <path d="M670,230 L710,200 L750,230 L710,260 Z" fill="#FF6666" stroke="#333333" stroke-width="2"/>
  <text x="710" y="238" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Degradation</text>
  <path d="M670,250 L690,250" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Process Labels -->
  <text x="400" y="85" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333333">Phosphorylation of DEPTOR in response to nutrients leads to</text>
  <text x="400" y="115" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333333">its ubiquitination and degradation by the SCF(BTRC) complex</text>
  
  <!-- TORC1 signaling label -->
  <text x="220" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">TORC1 signaling</text>
  <text x="220" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#333333">(GO:0038202)</text>
  
  <!-- Functional inhibition arrow -->
  <path d="M320,250 L240,250" stroke="#0000FF" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="235" y1="240" x2="245" y2="260" stroke="#0000FF" stroke-width="3"/>
  <text x="285" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#0000FF">Inhibits</text>
  
  <!-- ULK1 (Not directly shown in the GO-CAM but mentioned) -->
  <rect x="150" y="420" width="90" height="45" rx="5" ry="5" fill="#FFE6CC" stroke="#333333" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="195" y="445" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">ULK1</text>
  <text x="195" y="465" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(O75385)</text>
  
  <!-- MTOR inhibition of ULK1 -->
  <path d="M220,295 L195,420" stroke="#0000FF" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="190" y1="410" x2="200" y2="430" stroke="#0000FF" stroke-width="3"/>
  <text x="195" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#0000FF">Inhibits Autophagy</text>
  
  <!-- Legend -->
  <rect x="50" y="480" width="700" height="60" fill="#EEEEEE" stroke="#333333" stroke-width="1"/>
  <text x="60" y="500" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Legend:</text>
  
  <circle cx="80" y="520" r="10" fill="#FFD700" stroke="#333333" stroke-width="1"/>
  <text x="100" y="525" font-family="Arial" font-size="12" fill="#333333">MTOR kinase</text>
  
  <rect x="180" y="515" width="20" height="12" fill="#99CCFF" stroke="#333333" stroke-width="1"/>
  <text x="210" y="525" font-family="Arial" font-size="12" fill="#333333">Proteins</text>
  
  <rect x="280" y="515" width="20" height="12" fill="#FFCC99" stroke="#333333" stroke-width="1"/>
  <text x="320" y="525" font-family="Arial" font-size="12" fill="#333333">Protein Complex</text>
  
  <circle cx="370" y="520" r="10" fill="#FF0000" stroke="#333333" stroke-width="1"/>
  <text x="370" y="524" font-family="Arial" font-size="9" text-anchor="middle" fill="white">P</text>
  <text x="400" y="525" font-family="Arial" font-size="12" fill="#333333">Phosphorylation</text>
  
  <circle cx="460" y="520" r="10" fill="#6600CC" stroke="#333333" stroke-width="1"/>
  <text x="460" y="524" font-family="Arial" font-size="9" text-anchor="middle" fill="white">Ub</text>
  <text x="490" y="525" font-family="Arial" font-size="12" fill="#333333">Ubiquitination</text>
  
  <line x1="530" y1="520" x2="560" y2="520" stroke="#0000FF" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="555" y1="515" x2="565" y2="525" stroke="#0000FF" stroke-width="3"/>
  <text x="590" y="525" font-family="Arial" font-size="12" fill="#333333">Inhibition</text>
  
  <rect x="630" y="515" width="20" height="12" fill="#FFE6CC" stroke="#333333" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="675" y="525" font-family="Arial" font-size="12" fill="#333333">Element Not in Source</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>