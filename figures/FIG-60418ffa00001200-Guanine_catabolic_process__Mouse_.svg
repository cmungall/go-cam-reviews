<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="580" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Cytosol label -->
  <rect x="300" y="65" width="200" height="35" rx="10" ry="10" fill="#f9f9f9" stroke="#555" stroke-width="1" opacity="0.7"/>
  <text x="400" y="90" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold" fill="#555">Cytosol (GO:0005829)</text>
  
  <!-- Peroxisome -->
  <ellipse cx="400" cy="370" rx="220" ry="170" fill="#e6f2ff" stroke="#3366cc" stroke-width="2"/>
  <rect x="300" y="230" width="200" height="35" rx="10" ry="10" fill="#e6f2ff" stroke="#3366cc" stroke-width="1" opacity="0.7"/>
  <text x="400" y="255" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold" fill="#3366cc">Peroxisome (GO:0005777)</text>
  
  <!-- Molecules and Reactions -->
  <!-- Guanine to Xanthine (Cytosol) -->
  <rect x="100" y="150" width="100" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="180" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Guanine</text>
  
  <polygon points="225,175 245,165 245,185" fill="#333"/>
  <line x1="200" y1="175" x2="245" y2="175" stroke="#333" stroke-width="2.5"/>
  
  <rect x="260" y="150" width="100" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#333" stroke-width="1.5"/>
  <text x="310" y="180" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Xanthine</text>
  
  <rect x="150" y="100" width="100" height="35" rx="17" ry="17" fill="#ffcccc" stroke="#993333" stroke-width="1.5"/>
  <text x="200" y="123" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Gda</text>
  
  <!-- Xanthine to Urate (Transition to Peroxisome) -->
  <polygon points="385,175 405,165 405,185" fill="#333"/>
  <line x1="360" y1="175" x2="405" y2="175" stroke="#333" stroke-width="2.5"/>
  
  <rect x="420" y="150" width="100" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="180" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Urate</text>
  
  <rect x="310" y="100" width="160" height="35" rx="17" ry="17" fill="#ffcccc" stroke="#993333" stroke-width="1.5"/>
  <text x="390" y="123" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Xdh</text>
  
  <!-- Inside Peroxisome -->
  <!-- Urate to 5-HIU -->
  <polygon points="485,210 495,230 475,230" fill="#333"/>
  <line x1="470" y1="200" x2="485" y2="230" stroke="#333" stroke-width="2.5"/>
  
  <rect x="420" y="240" width="100" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="270" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">5-HIU</text>
  
  <rect x="520" y="210" width="100" height="35" rx="17" ry="17" fill="#ffcccc" stroke="#993333" stroke-width="1.5"/>
  <text x="570" y="233" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Uox</text>
  
  <!-- 5-HIU to OHCU -->
  <polygon points="470,300 480,320 460,320" fill="#333"/>
  <line x1="470" y1="290" x2="470" y2="320" stroke="#333" stroke-width="2.5"/>
  
  <rect x="420" y="330" width="100" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="360" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">OHCU</text>
  
  <rect x="530" y="310" width="110" height="35" rx="17" ry="17" fill="#ffcccc" stroke="#993333" stroke-width="1.5"/>
  <text x="585" y="333" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Urah</text>
  
  <!-- OHCU to Allantoin -->
  <polygon points="470,390 480,410 460,410" fill="#333"/>
  <line x1="470" y1="380" x2="470" y2="410" stroke="#333" stroke-width="2.5"/>
  
  <rect x="420" y="420" width="100" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="450" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Allantoin</text>
  
  <rect x="530" y="400" width="110" height="35" rx="17" ry="17" fill="#ffcccc" stroke="#993333" stroke-width="1.5"/>
  <text x="585" y="423" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Urad</text>
  
  <!-- Pathway label -->
  <text x="400" y="520" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle">Guanine Catabolic Process (Mouse)</text>
  <text x="400" y="550" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic">Purine degradation pathway leading to allantoin formation</text>
  
  <!-- Activity labels -->
  <text x="200" y="85" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">guanine deaminase</text>
  <text x="390" y="85" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">xanthine oxidase/dehydrogenase</text>
  <text x="570" y="195" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">urate oxidase</text>
  <text x="585" y="295" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">hydroxyisourate hydrolase</text>
  <text x="585" y="385" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">OHCU decarboxylase</text>
  
  <!-- Chemical structure annotations -->
  <text x="90" y="205" font-family="Arial" font-size="12" font-style="italic">C₅H₅N₅O</text>
  <text x="250" y="205" font-family="Arial" font-size="12" font-style="italic">C₅H₄N₄O₂</text>
  <text x="410" y="205" font-family="Arial" font-size="12" font-style="italic">C₅H₄N₄O₃</text>
  <text x="410" y="295" font-family="Arial" font-size="12" font-style="italic">C₅H₄N₄O₄</text>
  <text x="410" y="385" font-family="Arial" font-size="12" font-style="italic">C₅H₄N₄O₅</text>
  <text x="410" y="475" font-family="Arial" font-size="12" font-style="italic">C₄H₆N₄O₃</text>
  
  <!-- Gene IDs -->
  <text x="200" y="145" font-family="Arial" font-size="10" fill="#999999" text-anchor="middle">MGI:95678</text>
  <text x="390" y="145" font-family="Arial" font-size="10" fill="#999999" text-anchor="middle">MGI:98973</text>
  <text x="570" y="255" font-family="Arial" font-size="10" fill="#999999" text-anchor="middle">MGI:98907</text>
  <text x="585" y="355" font-family="Arial" font-size="10" fill="#999999" text-anchor="middle">MGI:1916142</text>
  <text x="585" y="445" font-family="Arial" font-size="10" fill="#999999" text-anchor="middle">MGI:3647519</text>
  
  <!-- Legend -->
  <rect x="100" y="590" width="25" height="25" fill="#ffffcc" stroke="#333" stroke-width="1.5"/>
  <text x="135" y="608" font-family="Arial" font-size="16" font-weight="bold">Metabolite</text>
  
  <rect x="250" y="590" width="45" height="25" rx="12" ry="12" fill="#ffcccc" stroke="#993333" stroke-width="1.5"/>
  <text x="305" y="608" font-family="Arial" font-size="16" font-weight="bold">Enzyme</text>
  
  <rect x="400" y="590" width="25" height="25" fill="#f9f9f9" stroke="#333" stroke-width="1.5"/>
  <text x="435" y="608" font-family="Arial" font-size="16" font-weight="bold">Cytosol</text>
  
  <rect x="550" y="590" width="25" height="25" fill="#e6f2ff" stroke="#3366cc" stroke-width="1.5"/>
  <text x="585" y="608" font-family="Arial" font-size="16" font-weight="bold">Peroxisome</text>
</svg>