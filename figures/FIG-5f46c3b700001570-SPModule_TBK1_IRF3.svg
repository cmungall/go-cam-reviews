<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="22" fill="#333">TBK1-IRF3 Signaling Pathway</text>

  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="550" rx="20" ry="20" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  
  <!-- Nuclear membrane -->
  <ellipse cx="400" cy="380" rx="200" ry="150" fill="#e6f2ff" stroke="#333" stroke-width="2"/>
  <text x="400" y="540" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Nucleus (GO:0005634)</text>
  
  <!-- Cytoplasm label with different background -->
  <rect x="50" y="50" width="700" height="180" rx="0" ry="0" fill="#fff2e6" fill-opacity="0.3" stroke="none"/>
  <text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Cytoplasm (GO:0005737)</text>
  
  <!-- TBK1 in cytoplasm -->
  <circle cx="200" cy="200" r="30" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="200" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">TBK1</text>
  <text x="200" y="160" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Protein kinase activity</text>
  <text x="200" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(GO:0004674)</text>
  
  <!-- IRF3 in cytoplasm -->
  <rect x="340" y="180" width="60" height="40" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="370" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IRF3</text>
  
  <!-- TBK1 phosphorylating IRF3 -->
  <line x1="230" y1="200" x2="340" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="290" cy="190" r="10" fill="#ff0" stroke="#333" stroke-width="1"/>
  <text x="290" y="194" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">P</text>
  
  <!-- IRF3 homodimer in cytoplasm -->
  <g transform="translate(450, 250)">
    <rect x="0" y="0" width="50" height="35" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
    <rect x="10" y="10" width="50" height="35" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
    <text x="35" y="30" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IRF3</text>
    <text x="35" y="-15" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Homodimerization</text>
    <text x="35" y="-30" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(GO:0042803)</text>
  </g>
  
  <!-- Arrow from IRF3 to IRF3 homodimer -->
  <path d="M 400,220 Q 420,250 450,270" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow for nuclear translocation -->
  <path d="M 490,300 Q 450,350 400,380" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="470" y="340" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Nuclear</text>
  <text x="470" y="355" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">translocation</text>
  
  <!-- IRF3 dimer in nucleus binding DNA -->
  <g transform="translate(350, 370)">
    <rect x="0" y="0" width="50" height="35" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
    <rect x="10" y="10" width="50" height="35" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
    <text x="35" y="30" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IRF3</text>
  </g>
  
  <!-- CREBBP/EP300 coactivator (implied from model) -->
  <g transform="translate(520, 390)">
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="#adeba3" fill-opacity="0.8" stroke="#333" stroke-width="2" stroke-dasharray="5,2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">CREBBP/</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">EP300</text>
    <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic" fill="#666">*Implied from model</text>
  </g>
  
  <!-- Protein binding interaction (GO:0005515) -->
  <path d="M 410,390 Q 440,385 480,390" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="435" y="375" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Protein binding</text>
  <text x="435" y="360" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(GO:0005515)</text>
  
  <!-- DNA binding -->
  <path d="M 300,450 C 320,440 340,460 360,450 C 380,440 400,460 420,450 C 440,440 460,460 480,450" stroke="#333" stroke-width="3" fill="none"/>
  <text x="390" y="475" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">DNA binding (GO:0043565)</text>
  
  <!-- Transcription activation arrow -->
  <line x1="390" y1="480" x2="390" y2="510" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="480" y="495" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Transcription activator</text>
  <text x="480" y="510" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">activity (GO:0001216)</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>