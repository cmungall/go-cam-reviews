<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Background -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Nuclear Membrane -->
  <ellipse cx="400" cy="300" rx="250" ry="180" fill="#e6f3ff" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="140" font-family="Arial" font-size="14" text-anchor="middle">Nucleus</text>
  
  <!-- DNA with damage -->
  <path d="M200,250 C250,220 300,280 350,250 C400,220 450,280 500,250 C550,220 600,280 650,250" stroke="#8844aa" stroke-width="4" fill="none"/>
  <circle cx="425" cy="250" r="15" fill="yellow" stroke="red" stroke-width="2"/>
  <text x="425" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="red" font-weight="bold">DNA damage</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">KAT5 involvement in nucleotide excision repair (Human)</text>
  
  <!-- Proteins -->
  <!-- KAT5 -->
  <circle cx="200" cy="150" r="25" fill="#ff9966" stroke="#333" stroke-width="2"/>
  <text x="200" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">KAT5</text>
  
  <!-- SIRT1 -->
  <circle cx="600" cy="150" r="25" fill="#66ccff" stroke="#333" stroke-width="2"/>
  <text x="600" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">SIRT1</text>
  
  <!-- ERCC4 (XPF) -->
  <rect x="375" y="350" width="50" height="30" rx="5" ry="5" fill="#99cc66" stroke="#333" stroke-width="2"/>
  <text x="400" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ERCC4</text>
  
  <!-- ERCC1 -->
  <rect x="475" y="350" width="50" height="30" rx="5" ry="5" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="500" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ERCC1</text>
  
  <!-- ERCC4-ERCC1 complex -->
  <rect x="375" y="400" width="150" height="40" rx="5" ry="5" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="450" y="425" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ERCC4-ERCC1 complex</text>
  
  <!-- Arrows and Interactions -->
  <!-- KAT5 to ERCC4 -->
  <path d="M210,175 C220,250 300,300 370,350" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="250" y="250" font-family="Arial" font-size="14" fill="#333" transform="rotate(-35, 250, 250)">Acetylates ERCC4</text>
  
  <!-- SIRT1 to ERCC4 -->
  <path d="M590,175 C580,250 500,300 430,350" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="520" y="250" font-family="Arial" font-size="14" fill="#333" transform="rotate(35, 520, 250)">Deacetylates ERCC4</text>
  
  <!-- ERCC4 binding ERCC1 -->
  <line x1="425" y1="365" x2="475" y2="365" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="450" y="355" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Binds</text>
  
  <!-- ERCC4 to DNA cut -->
  <path d="M425,400 C425,430 425,450 425,470 C425,490 425,510 425,250" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="460" y="475" font-family="Arial" font-size="14" fill="#333">Endonuclease activity</text>
  <text x="460" y="495" font-family="Arial" font-size="14" fill="#333">repairs DNA damage</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Process Label -->
  <rect x="530" y="450" width="160" height="30" rx="5" ry="5" fill="#ffffcc" stroke="#333" stroke-width="1"/>
  <text x="610" y="470" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Nucleotide-excision repair</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="700" height="80" rx="5" ry="5" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="60" y="540" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <circle cx="70" cy="560" r="10" fill="#ff9966" stroke="#333" stroke-width="1"/>
  <text x="85" y="565" font-family="Arial" font-size="12">KAT5 (Q92993) - peptide-lysine-N-acetyltransferase activity (GO:0061733)</text>
  
  <circle cx="70" cy="585" r="10" fill="#66ccff" stroke="#333" stroke-width="1"/>
  <text x="85" y="590" font-family="Arial" font-size="12">SIRT1 (Q96EB6) - NAD-dependent protein lysine deacetylase activity (GO:0034979)</text>
  
  <rect x="350" y="560" width="20" height="10" rx="2" ry="2" fill="#99cc66" stroke="#333" stroke-width="1"/>
  <text x="375" y="565" font-family="Arial" font-size="12">ERCC4 (Q92889-2) - single-stranded DNA endodeoxyribonuclease activity (GO:0000014)</text>
  
  <rect x="350" y="585" width="20" height="10" rx="2" ry="2" fill="#cc99ff" stroke="#333" stroke-width="1"/>
  <text x="375" y="590" font-family="Arial" font-size="12">ERCC1 (P07992) - part of ERCC4-ERCC1 complex (GO:0070522) [implied from data]</text>
</svg>