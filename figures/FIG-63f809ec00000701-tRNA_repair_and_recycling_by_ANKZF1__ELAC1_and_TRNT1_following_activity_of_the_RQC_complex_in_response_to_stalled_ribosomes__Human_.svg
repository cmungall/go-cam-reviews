<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9f9f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-gradient)" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">tRNA Repair and Recycling Pathway Following RQC Activity</text>
  
  <!-- Cytosolic area outline -->
  <rect x="50" y="70" width="700" height="480" rx="20" ry="20" fill="#f8f8ff" stroke="#aaa" stroke-width="1" stroke-dasharray="5,5" />
  <text x="400" y="95" font-family="Arial" font-size="18" text-anchor="middle">Cytosol</text>
  
  <!-- 1. Stalled Ribosome with NEMF -->
  <g transform="translate(150, 200)">
    <!-- Ribosome (cytosolic ribosome - GO:0022626) -->
    <ellipse cx="0" cy="0" rx="60" ry="30" fill="#b0c4de" stroke="#000" stroke-width="1.5" />
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Stalled Ribosome</text>
    
    <!-- NEMF protein binding to aminoacyl-tRNA -->
    <rect x="45" y="-15" width="40" height="20" rx="5" ry="5" fill="#ff9999" stroke="#000" stroke-width="1" />
    <text x="65" y="-2" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">NEMF</text>
    
    <!-- tRNA being bound -->
    <path d="M 70,5 Q 90,15 90,35 Q 90,55 75,60" fill="none" stroke="#9370db" stroke-width="2" />
    <text x="90" y="40" font-family="Arial" font-size="12" text-anchor="middle">Ala-tRNA</text>
    
    <!-- Process label -->
    <text x="0" y="50" font-family="Arial" font-size="13" text-anchor="middle">CAT tailing</text>
    <text x="0" y="65" font-family="Arial" font-size="13" text-anchor="middle">(GO:0140708)</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 250,200 L 320,200" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="285" y="190" font-family="Arial" font-size="13" fill="#666" text-anchor="middle">Step 1</text>
  
  <!-- 2. ANKZF1 RNA endonuclease activity -->
  <g transform="translate(400, 200)">
    <!-- tRNA precursor -->
    <path d="M -30,0 Q -10,20 10,0 Q 30,-20 50,0" fill="none" stroke="#9370db" stroke-width="2" />
    
    <!-- ANKZF1 protein -->
    <rect x="-20" y="-30" width="60" height="25" rx="5" ry="5" fill="#90ee90" stroke="#000" stroke-width="1" />
    <text x="10" y="-15" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ANKZF1</text>
    
    <!-- Cutting action -->
    <path d="M 10,-5 L 10,15" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="2,2" />
    
    <!-- Process label -->
    <text x="10" y="50" font-family="Arial" font-size="13" text-anchor="middle">RNA endonuclease activity</text>
    <text x="10" y="65" font-family="Arial" font-size="13" text-anchor="middle">(GO:0004521)</text>
    <text x="10" y="80" font-family="Arial" font-size="13" text-anchor="middle">Rescue of stalled ribosome</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 450,200 L 520,200" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="485" y="190" font-family="Arial" font-size="13" fill="#666" text-anchor="middle">Step 2</text>
  
  <!-- 3. ELAC1 tRNA processing -->
  <g transform="translate(600, 200)">
    <!-- tRNA precursor being processed -->
    <path d="M -30,0 Q -20,15 0,15 Q 20,15 30,0" fill="none" stroke="#9370db" stroke-width="2" />
    
    <!-- ELAC1 protein -->
    <rect x="-15" y="-30" width="50" height="25" rx="5" ry="5" fill="#add8e6" stroke="#000" stroke-width="1" />
    <text x="10" y="-15" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ELAC1</text>
    
    <!-- Processing action -->
    <path d="M 10,-5 L 10,15" fill="none" stroke="#ff0000" stroke-width="2" />
    
    <!-- Process label -->
    <text x="10" y="50" font-family="Arial" font-size="13" text-anchor="middle">tRNA 3'-end processing</text>
    <text x="10" y="65" font-family="Arial" font-size="13" text-anchor="middle">(GO:0042780)</text>
  </g>
  
  <!-- Curved arrow down -->
  <path d="M 600,250 Q 600,300 500,350" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="570" y="310" font-family="Arial" font-size="13" fill="#666" text-anchor="middle">Step 3</text>
  
  <!-- 4. TRNT1 CCA addition -->
  <g transform="translate(400, 380)">
    <!-- Processed tRNA -->
    <path d="M -30,0 Q -10,15 10,15 Q 30,15 50,0" fill="none" stroke="#9370db" stroke-width="2" />
    
    <!-- TRNT1 protein -->
    <rect x="-15" y="-30" width="50" height="25" rx="5" ry="5" fill="#ffd700" stroke="#000" stroke-width="1" />
    <text x="10" y="-15" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">TRNT1</text>
    
    <!-- CCA addition -->
    <text x="55" y="20" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">CCA</text>
    <path d="M 35,15 L 55,20" fill="none" stroke="#00ff00" stroke-width="2" />
    
    <!-- Process label -->
    <text x="10" y="50" font-family="Arial" font-size="13" text-anchor="middle">tRNA 3'-terminal CCA addition</text>
    <text x="10" y="65" font-family="Arial" font-size="13" text-anchor="middle">(GO:0001680)</text>
  </g>
  
  <!-- Final arrow back to ribosome pool -->
  <path d="M 350,380 Q 250,380 200,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="5,3" />
  <text x="250" y="350" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">Recycled tRNA</text>
  <text x="280" y="370" font-family="Arial" font-size="13" fill="#666" text-anchor="middle">Step 4</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="500" width="700" height="45" rx="5" ry="5" fill="#fff" stroke="#000" stroke-width="1" />
  <text x="60" y="525" font-family="Arial" font-size="15" font-weight="bold">Legend:</text>
  
  <rect x="130" y="515" width="15" height="15" fill="#b0c4de" stroke="#000" stroke-width="1" />
  <text x="150" y="527" font-family="Arial" font-size="14">Ribosome</text>
  
  <rect x="220" y="515" width="15" height="15" fill="#ff9999" stroke="#000" stroke-width="1" />
  <text x="240" y="527" font-family="Arial" font-size="14">NEMF</text>
  
  <rect x="300" y="515" width="15" height="15" fill="#90ee90" stroke="#000" stroke-width="1" />
  <text x="320" y="527" font-family="Arial" font-size="14">ANKZF1</text>
  
  <rect x="400" y="515" width="15" height="15" fill="#add8e6" stroke="#000" stroke-width="1" />
  <text x="420" y="527" font-family="Arial" font-size="14">ELAC1</text>
  
  <rect x="480" y="515" width="15" height="15" fill="#ffd700" stroke="#000" stroke-width="1" />
  <text x="500" y="527" font-family="Arial" font-size="14">TRNT1</text>
  
  <path d="M 550,522 Q 560,517 570,522" fill="none" stroke="#9370db" stroke-width="2" />
  <text x="590" y="527" font-family="Arial" font-size="14">tRNA</text>
  
  <text x="640" y="527" font-family="Arial" font-size="14">→ Process Flow</text>
</svg>