  <circle cx="570" y="165" r="10" fill="#ffb703" stroke="#333" stroke-width="1"/>
  <text x="660" y="170" font-family="Arial" font-size="12" text-anchor="middle">S100A4 - S100 calcium binding protein</text>
  
  <rect x="560" y="185" width="20" height="10" rx="2" fill="#219ebc" stroke="#333" stroke-width="1"/>
