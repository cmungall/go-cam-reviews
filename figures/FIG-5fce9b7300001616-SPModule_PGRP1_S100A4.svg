  <rect x="560" y="255" width="20" height="10" fill="#f8f9fa" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="660" y="265" font-family="Arial" font-size="12" text-anchor="middle">Cell membrane/compartment</text>
  
  <!-- Source info -->
  <text x="400" y="570" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Source: gomodel:5fce9b7300001616 (SPModule-PGRP1-S100A4)</text>
