<svg width="700" height="550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="700" height="550" fill="#f8f8f8" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Poxvirus-OPG204 Inhibition of Type I Interferon Signaling</text>
  
  <!-- Extracellular space label -->
  <text x="350" y="60" font-family="Arial" font-size="14" text-anchor="middle">Extracellular Space (GO:0005615)</text>
  
  <!-- Cell representation -->
  <rect x="100" y="150" width="500" height="300" fill="#e6f2ff" rx="50" ry="50" stroke="#0066cc" stroke-width="2"/>
  <text x="350" y="440" font-family="Arial" font-size="14" text-anchor="middle">Cell Membrane (GO:0016020)</text>
  
  <!-- VACWR200 protein -->
  <circle cx="180" cy="120" r="40" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="180" y="120" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">VACWR200</text>
  <text x="180" y="135" font-family="Arial" font-size="10" text-anchor="middle">(P25213)</text>
  <text x="180" y="95" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Receptor decoy</text>
  <text x="180" y="150" font-family="Arial" font-size="8" text-anchor="middle" fill="#660000">Poxvirus</text>
  
  <!-- IFNA2 cytokine -->
  <circle cx="350" cy="120" r="35" fill="#99cc99" stroke="#006600" stroke-width="2"/>
  <text x="350" y="115" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">IFNA2</text>
  <text x="350" y="130" font-family="Arial" font-size="10" text-anchor="middle">(P01563)</text>
  <text x="350" y="95" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Cytokine</text>
  <text x="350" y="145" font-family="Arial" font-size="8" text-anchor="middle" fill="#003300">Human</text>
  
  <!-- Type I interferon receptors -->
  <rect x="250" y="210" width="80" height="40" fill="#9999ff" stroke="#0000cc" stroke-width="2" rx="5" ry="5"/>
  <text x="290" y="230" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">IFNAR1</text>
  <text x="290" y="245" font-family="Arial" font-size="10" text-anchor="middle">(P17181)</text>
  
  <rect x="400" y="210" width="80" height="40" fill="#9999ff" stroke="#0000cc" stroke-width="2" rx="5" ry="5"/>
  <text x="440" y="230" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">IFNAR2</text>
  <text x="440" y="245" font-family="Arial" font-size="10" text-anchor="middle">(P48551)</text>
  
  <!-- Lines and arrows -->
  <!-- VACWR200 inhibits IFNA2 -->
  <line x1="215" y1="120" x2="310" y2="120" stroke="#cc0000" stroke-width="2"/>
  <polygon points="310,120 300,115 300,125" fill="#cc0000"/>
  <text x="260" y="110" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc0000">Inhibits</text>
  
  <!-- IFNA2 activates IFNAR1 -->
  <line x1="340" y1="150" x2="300" y2="200" stroke="#006600" stroke-width="2"/>
  <polygon points="300,200 300,190 290,195" fill="#006600"/>
  <text x="305" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#006600">Activates</text>
  
  <!-- IFNA2 activates IFNAR2 -->
  <line x1="360" y1="150" x2="430" y2="200" stroke="#006600" stroke-width="2"/>
  <polygon points="430,200 430,190 440,195" fill="#006600"/>
  <text x="410" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#006600">Activates</text>
  
  <!-- Process labels -->
  <rect x="200" y="270" width="300" height="40" fill="#cce6ff" stroke="#0066cc" stroke-width="1" rx="10" ry="10"/>
  <text x="350" y="295" font-family="Arial" font-size="11" text-anchor="middle">Type I Interferon-Mediated Signaling Pathway</text>
  <text x="350" y="310" font-family="Arial" font-size="9" text-anchor="middle">(GO:0060337)</text>
  
  <rect x="140" y="320" width="310" height="40" fill="#ffcccc" stroke="#cc0000" stroke-width="1" rx="10" ry="10"/>
  <text x="295" y="345" font-family="Arial" font-size="10" text-anchor="middle">Symbiont-Mediated Suppression of Host Type I</text>
  <text x="295" y="355" font-family="Arial" font-size="10" text-anchor="middle">Interferon-Mediated Signaling Pathway (GO:0039502)</text>
  
  <!-- Explanatory notes -->
  <rect x="140" y="370" width="420" height="50" fill="#f0f0f0" stroke="#666666" stroke-width="1" rx="5" ry="5"/>
  <text x="350" y="385" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Mechanism: Poxvirus VACWR200 acts as a decoy receptor that</text>
  <text x="350" y="400" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">binds and sequesters IFNA2, preventing activation of cellular</text>
  <text x="350" y="415" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">receptors IFNAR1/2 and downstream antiviral responses</text>
  
  <!-- Legend -->
  <rect x="500" y="60" width="180" height="120" fill="white" stroke="black" stroke-width="1"/>
  <text x="590" y="75" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="520" cy="90" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="595" y="95" font-family="Arial" font-size="10" text-anchor="middle">Poxvirus protein</text>
  
  <circle cx="520" cy="110" r="10" fill="#99cc99" stroke="#006600" stroke-width="1"/>
  <text x="595" y="115" font-family="Arial" font-size="10" text-anchor="middle">Human cytokine</text>
  
  <rect x="510" y="125" width="20" height="15" fill="#9999ff" stroke="#0000cc" stroke-width="1"/>
  <text x="595" y="135" font-family="Arial" font-size="10" text-anchor="middle">Human receptor</text>
  
  <line x1="520" y1="150" x2="540" y2="150" stroke="#cc0000" stroke-width="2"/>
  <polygon points="540,150 535,145 535,155" fill="#cc0000"/>
  <text x="595" y="155" font-family="Arial" font-size="10" text-anchor="middle">Inhibition (RO:0002630)</text>
  
  <line x1="520" y1="170" x2="540" y2="170" stroke="#006600" stroke-width="2"/>
  <polygon points="540,170 535,165 535,175" fill="#006600"/>
  <text x="595" y="175" font-family="Arial" font-size="10" text-anchor="middle">Activation (RO:0002629)</text>
</svg>