<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Cell membrane -->
  <path d="M50,200 C50,180 750,180 750,200 C750,220 50,220 50,200" stroke="#333333" stroke-width="3" fill="#E8F4F8" />
  
  <!-- Extracellular space label -->
  <text x="400" y="160" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">Extracellular Space (GO:0005615)</text>
  
  <!-- Cytosol label -->
  <text x="400" y="450" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">Cytosol (GO:0005829)</text>
  
  <!-- ADM Ligand -->
  <circle cx="200" cy="140" r="25" fill="#FF9999" stroke="#333333" stroke-width="2" />
  <text x="200" y="145" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">ADM</text>
  <text x="200" y="105" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(P35318)</text>
  <text x="200" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Hormone activity</text>
  <text x="200" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(GO:0005179)</text>
  
  <!-- CALCRL-RAMP3 Receptor Complex -->
  <rect x="350" y="180" width="120" height="40" rx="5" ry="5" fill="#99CCFF" stroke="#333333" stroke-width="2" />
  <text x="410" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">CALCRL-RAMP3</text>
  <text x="365" y="238" font-family="Arial" font-size="12" text-anchor="start" fill="#333333">CALCRL (Q16602)</text>
  <text x="365" y="254" font-family="Arial" font-size="12" text-anchor="start" fill="#333333">RAMP3 (O60896)</text>
  <text x="365" y="270" font-family="Arial" font-size="12" text-anchor="start" fill="#333333">Receptor complex (GO:0001605)</text>

  <!-- G Protein -->
  <polygon points="410,300 430,330 390,330" fill="#FFCC99" stroke="#333333" stroke-width="2" />
  <text x="410" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">GNAS</text>
  <text x="410" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(Q5JWF2)</text>
  <text x="410" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">G protein activity</text>
  <text x="410" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(GO:0003925)</text>
  
  <!-- Adenylate Cyclase -->
  <rect x="530" y="380" width="120" height="40" rx="20" ry="20" fill="#99FF99" stroke="#333333" stroke-width="2" />
  <text x="590" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">ADCY6</text>
  <text x="590" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(O43306)</text>
  <text x="590" y="445" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Adenylate cyclase activity</text>
  <text x="590" y="460" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(GO:0004016)</text>
  
  <!-- cAMP -->
  <circle cx="590" cy="520" r="25" fill="#FFFF99" stroke="#333333" stroke-width="2" />
  <text x="590" y="525" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">cAMP</text>
  <text x="590" y="540" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(CHEBI:17489)</text>
  
  <!-- Pathway arrows -->
  <polygon points="230,140 345,180 340,190 235,150" fill="#333333" />
  <polygon points="410,225 410,295 400,290 400,230" fill="#333333" />
  <polygon points="430,330 525,380 520,390 425,340" fill="#333333" />
  <polygon points="590,425 590,490 580,485 580,425" fill="#333333" />
  
  <!-- Pathway labels -->
  <text x="300" y="310" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333" transform="rotate(-30,300,310)">Receptor activation</text>
  <text x="470" y="350" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333" transform="rotate(30,470,350)">G protein activation</text>
  <text x="630" y="470" font-family="Arial" font-size="15" text-anchor="middle" fill="#333333">cAMP production</text>
  
  <!-- Overall pathway labels -->
  <text x="400" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333333">Adrenomedullin Signaling Pathway (GO:1990410)</text>
  <text x="400" y="55" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">via CALCRL-RAMP3 Receptor Complex</text>
  <text x="400" y="555" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">Adenylate cyclase-activating G protein-coupled receptor signaling (GO:0007189)</text>
</svg>