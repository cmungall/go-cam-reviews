<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
  
  <!-- Cell nucleus -->
  <ellipse cx="250" cy="250" rx="100" ry="80" fill="#d9eaf9" stroke="#333" stroke-width="2"/>
  <text x="250" y="250" font-family="Arial" font-size="18" text-anchor="middle">Nucleus</text>
  
  <!-- P-body structure (normally formed) -->
  <g id="normal-pbody" opacity="0.4">
    <ellipse cx="550" cy="350" rx="70" ry="50" fill="#e6c9a8" stroke="#996633" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="550" y="345" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">P-body</text>
    <text x="550" y="365" font-family="Arial" font-size="12" text-anchor="middle">(inhibited formation)</text>
  </g>
  
  <!-- P-body function note -->
  <text x="550" y="310" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#666666">Normal function: mRNA</text>
  <text x="550" y="325" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic" fill="#666666">degradation and storage</text>
  
  <!-- KSHV Virus -->
  <ellipse cx="50" cy="250" rx="40" ry="30" fill="#ffcccc" stroke="#cc0000" stroke-width="2"/>
  <text x="50" y="250" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">KSHV</text>
  <text x="50" y="270" font-family="Arial" font-size="12" text-anchor="middle">Virus</text>
  
  <!-- Molecules and interactions -->
  
  <!-- ORF57 (Viral Protein) -->
  <circle cx="150" cy="400" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="3"/>
  <text x="150" y="400" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ORF57</text>
  <text x="150" y="420" font-family="Arial" font-size="12" text-anchor="middle">(viral)</text>
  
  <!-- TNRC6A -->
  <rect x="300" y="380" width="80" height="40" rx="10" fill="#99cc99" stroke="#006600" stroke-width="3"/>
  <text x="340" y="405" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TNRC6A</text>
  
  <!-- AGO2 -->
  <rect x="460" y="380" width="60" height="40" rx="10" fill="#9999ff" stroke="#0000cc" stroke-width="3"/>
  <text x="490" y="405" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">AGO2</text>
  
  <!-- Host cell cytoplasm label -->
  <text x="400" y="180" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic">Host Cell Cytoplasm</text>
  
  <!-- Viral entry arrow -->
  <path d="M 85,265 Q 100,320 120,380" fill="none" stroke="#cc0000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="110" y="320" font-family="Arial" font-size="14" fill="#cc0000" font-weight="bold">Viral Entry</text>
  <text x="110" y="340" font-family="Arial" font-size="12" fill="#cc0000">Protein sequestering</text>
  <text x="110" y="355" font-family="Arial" font-size="12" fill="#cc0000">activity</text>
  
  <!-- Interaction arrows -->
  <path d="M 180,400 Q 240,410 290,400" fill="none" stroke="#cc3300" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="230" y="425" font-family="Arial" font-size="14" fill="#cc3300" font-weight="bold">Sequesters</text>
  <text x="230" y="445" font-family="Arial" font-size="12" fill="#cc3300">(RO:0012010)</text>
  
  <path d="M 380,400 Q 420,430 450,400" fill="none" stroke="#006633" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="415" y="445" font-family="Arial" font-size="14" fill="#006633" font-weight="bold">Normally enables</text>
  <text x="415" y="465" font-family="Arial" font-size="12" fill="#006633">(Protein-macromolecule</text>
  <text x="415" y="480" font-family="Arial" font-size="12" fill="#006633">adaptor activity)</text>
  <text x="415" y="495" font-family="Arial" font-size="12" fill="#006633">(RO:0002629)</text>
  
  <path d="M 520,380 Q 540,360 545,350" fill="none" stroke="#000099" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="560" y="370" font-family="Arial" font-size="12" fill="#000099" font-weight="bold">RNA endonuclease</text>
  <text x="560" y="385" font-family="Arial" font-size="12" fill="#000099">activity</text>
  
  <!-- Process label -->
  <rect x="415" y="300" width="130" height="40" rx="10" fill="#ffffcc" stroke="#cccc00" stroke-width="2"/>
  <text x="480" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">P-body assembly</text>
  <text x="480" y="335" font-family="Arial" font-size="12" text-anchor="middle">(GO:0033962)</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="100" width="180" height="190" fill="white" stroke="#333" stroke-width="1"/>
  <text x="690" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="620" cy="140" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="670" y="145" font-family="Arial" font-size="14" text-anchor="start">Viral protein</text>
  
  <rect x="610" y="160" width="20" height="15" rx="3" fill="#99cc99" stroke="#006600" stroke-width="2"/>
  <text x="670" y="172" font-family="Arial" font-size="14" text-anchor="start">Host adaptor</text>
  
  <rect x="610" y="185" width="20" height="15" rx="3" fill="#9999ff" stroke="#0000cc" stroke-width="2"/>
  <text x="670" y="197" font-family="Arial" font-size="14" text-anchor="start">Host enzyme</text>
  
  <line x1="610" y1="210" x2="640" y2="210" stroke="#333" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="670" y="215" font-family="Arial" font-size="14" text-anchor="start">Inhibited pathway</text>
  
  <rect x="610" y="230" width="20" height="15" rx="3" fill="#ffffcc" stroke="#cccc00" stroke-width="2"/>
  <text x="670" y="242" font-family="Arial" font-size="14" text-anchor="start">Biological process</text>
  
  <line x1="610" y1="255" x2="640" y2="255" stroke="#cc3300" stroke-width="2"/>
  <text x="670" y="260" font-family="Arial" font-size="14" text-anchor="start">Active pathway</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">KSHV-ORF57 Inhibition of Host P-body Formation</text>
  <text x="400" y="75" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">(Human-HHV8 interaction)</text>
  
  <!-- Annotation notes -->
  <text x="100" y="500" font-family="Arial" font-size="12" text-anchor="start" font-style="italic" fill="#555">Viral mechanism: ORF57 from KSHV binds to and sequesters TNRC6A, preventing it from</text>
  <text x="100" y="515" font-family="Arial" font-size="12" text-anchor="start" font-style="italic" fill="#555">enabling AGO2's RNA endonuclease activity, thereby inhibiting P-body assembly</text>
  <text x="100" y="530" font-family="Arial" font-size="12" text-anchor="start" font-style="italic" fill="#555">and promoting viral life cycle.</text>
</svg>