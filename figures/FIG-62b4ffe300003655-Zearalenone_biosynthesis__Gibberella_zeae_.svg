<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Zearalenone Biosynthesis Pathway in Gibberella zeae</text>
  
  <!-- Substrate molecules -->
  <rect x="50" y="150" width="120" height="60" rx="10" ry="10" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="110" y="185" font-family="Arial" font-size="14" text-anchor="middle">Acetyl-CoA</text>
  
  <rect x="50" y="250" width="120" height="60" rx="10" ry="10" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="110" y="285" font-family="Arial" font-size="14" text-anchor="middle">Malonyl-CoA</text>
  
  <!-- Enzymes and processes -->
  <rect x="250" y="200" width="120" height="60" rx="10" ry="10" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="310" y="225" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ZEA2</text>
  <text x="310" y="245" font-family="Arial" font-size="12" text-anchor="middle">Polyketide</text>
  <text x="310" y="260" font-family="Arial" font-size="12" text-anchor="middle">synthase activity</text>
  
  <!-- Intermediate molecule -->
  <rect x="380" y="140" width="120" height="40" rx="8" ry="8" fill="#e2e3e5" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="440" y="165" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Polyketide</text>
  <text x="440" y="180" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">intermediate*</text>
  
  <rect x="450" y="200" width="120" height="60" rx="10" ry="10" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="510" y="225" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ZEA1</text>
  <text x="510" y="245" font-family="Arial" font-size="12" text-anchor="middle">Catalytic</text>
  <text x="510" y="260" font-family="Arial" font-size="12" text-anchor="middle">activity</text>
  
  <!-- Intermediate molecule -->
  <rect x="580" y="140" width="120" height="40" rx="8" ry="8" fill="#e2e3e5" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="640" y="165" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Modified</text>
  <text x="640" y="180" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">intermediate*</text>
  
  <rect x="650" y="200" width="120" height="60" rx="10" ry="10" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="710" y="225" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ZEB1</text>
  <text x="710" y="245" font-family="Arial" font-size="12" text-anchor="middle">Oxidoreductase</text>
  <text x="710" y="260" font-family="Arial" font-size="12" text-anchor="middle">activity</text>
  
  <!-- Product -->
  <rect x="650" y="350" width="120" height="60" rx="10" ry="10" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="710" y="385" font-family="Arial" font-size="14" text-anchor="middle">Zearalenone</text>
  
  <!-- Transcription regulator -->
  <rect x="450" y="350" width="120" height="60" rx="10" ry="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="510" y="375" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ZEB2</text>
  <text x="510" y="395" font-family="Arial" font-size="12" text-anchor="middle">Transcriptional</text>
  <text x="510" y="410" font-family="Arial" font-size="12" text-anchor="middle">activator</text>
  
  <!-- Reaction process title -->
  <rect x="250" y="100" width="300" height="40" rx="5" ry="5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/>
  <text x="400" y="125" font-family="Arial" font-size="16" text-anchor="middle">Zearalenone biosynthetic process</text>
  
  <!-- Arrows connecting substrates to enzymes -->
  <line x1="170" y1="180" x2="250" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="280" x2="250" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrows between enzymes and intermediates -->
  <line x1="370" y1="210" x2="400" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="180" x2="480" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="210" x2="600" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="180" x2="680" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow to product -->
  <line x1="710" y1="260" x2="710" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Regulatory arrows -->
  <path d="M 510 350 C 510 300, 430 300, 310 290" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowheadRegulatory)" fill="none"/>
  <path d="M 510 350 C 510 300, 510 300, 510 270" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowheadRegulatory)" fill="none"/>
  <path d="M 510 350 C 510 300, 590 300, 710 270" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowheadRegulatory)" fill="none"/>
  
  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowheadRegulatory" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="450" width="700" height="120" rx="5" ry="5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1"/>
  <text x="60" y="470" font-family="Arial" font-size="16" font-weight="bold">Legend</text>
  
  <!-- Legend items -->
  <rect x="60" y="480" width="20" height="20" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="90" y="495" font-family="Arial" font-size="12">Substrate molecules</text>
  
  <rect x="60" y="510" width="20" height="20" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="90" y="525" font-family="Arial" font-size="12">Enzymes</text>
  
  <rect x="60" y="540" width="20" height="20" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="90" y="555" font-family="Arial" font-size="12">Transcriptional regulator</text>
  
  <rect x="250" y="480" width="20" height="20" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="280" y="495" font-family="Arial" font-size="12">Final product</text>
  
  <rect x="250" y="510" width="20" height="20" fill="#e2e3e5" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="280" y="525" font-family="Arial" font-size="12">Intermediate* (not in source)</text>
  
  <line x1="250" y1="545" x2="290" y2="545" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="550" font-family="Arial" font-size="12">Catalytic conversion</text>
  
  <line x1="250" y1="570" x2="290" y2="570" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowheadRegulatory)"/>
  <text x="300" y="575" font-family="Arial" font-size="12">Regulatory activation</text>
  
  <text x="450" y="490" font-family="Arial" font-size="12">ZEA2: Polyketide synthase</text>
  <text x="450" y="510" font-family="Arial" font-size="12">ZEA1: Catalytic enzyme</text>
  <text x="450" y="530" font-family="Arial" font-size="12">ZEB1: Oxidoreductase</text>
  <text x="450" y="550" font-family="Arial" font-size="12">ZEB2: Transcriptional activator</text>
  
  <text x="60" y="590" font-family="Arial" font-size="10" font-style="italic">* Intermediate molecules shown for clarity but not explicitly mentioned in the source data</text>
</svg>