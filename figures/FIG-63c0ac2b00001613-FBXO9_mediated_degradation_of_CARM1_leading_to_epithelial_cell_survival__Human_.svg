<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background - Epithelial Cell -->
    <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f9fa" stroke="#333" stroke-width="2" />
    <text x="400" y="90" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Epithelial Cell</text>
    
    <!-- Cell Membrane -->
    <path d="M50,100 Q150,80 250,100 T450,100 T650,100 T750,100" stroke="#333" stroke-width="2" fill="none" />
    
    <!-- SCF Complex Components -->
    <circle cx="200" cy="200" r="25" fill="#6baed6" stroke="#333" stroke-width="2" />
    <text x="200" y="205" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">CUL1</text>
    
    <circle cx="150" cy="180" r="25" fill="#9ecae1" stroke="#333" stroke-width="2" />
    <text x="150" y="185" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">SKP1</text>
    
    <circle cx="250" cy="180" r="25" fill="#4292c6" stroke="#333" stroke-width="2" />
    <text x="250" y="185" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">RBX1</text>
    
    <circle cx="150" cy="230" r="25" fill="#f16913" stroke="#333" stroke-width="2" />
    <text x="150" y="235" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">FBXO9</text>
    
    <!-- SCF Complex Label -->
    <text x="200" y="150" font-family="Arial" font-size="17" text-anchor="middle" font-weight="bold">SCF Ubiquitin Ligase Complex</text>
    
    <!-- CARM1 -->
    <circle cx="350" cy="250" r="30" fill="#31a354" stroke="#333" stroke-width="2" />
    <text x="350" y="255" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">CARM1</text>
    <text x="350" y="275" font-family="Arial" font-size="11" text-anchor="middle">Protein Methyltransferase</text>
    
    <!-- Ubiquitin Tags -->
    <circle cx="330" cy="220" r="8" fill="#fb8072" stroke="#333" stroke-width="1" />
    <text x="330" y="223" font-family="Arial" font-size="8" text-anchor="middle" font-weight="bold">Ub</text>
    <circle cx="345" cy="215" r="8" fill="#fb8072" stroke="#333" stroke-width="1" />
    <text x="345" y="218" font-family="Arial" font-size="8" text-anchor="middle" font-weight="bold">Ub</text>
    <circle cx="360" cy="220" r="8" fill="#fb8072" stroke="#333" stroke-width="1" />
    <text x="360" y="223" font-family="Arial" font-size="8" text-anchor="middle" font-weight="bold">Ub</text>
    
    <!-- Caspase-3 -->
    <rect x="500" y="300" width="60" height="35" rx="5" ry="5" fill="#9467bd" stroke="#333" stroke-width="2" />
    <text x="530" y="323" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">CASP3</text>
    
    <!-- Proteasome -->
    <rect x="350" y="350" width="80" height="40" rx="10" ry="10" fill="#969696" stroke="#333" stroke-width="2" />
    <text x="390" y="375" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">Proteasome</text>
    
    <!-- Apoptosis Process -->
    <rect x="500" y="400" width="100" height="40" rx="5" ry="5" fill="#e31a1c" stroke="#333" stroke-width="2" />
    <text x="550" y="425" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">Apoptosis</text>
    
    <!-- Cell Survival Outcome -->
    <rect x="650" y="300" width="100" height="40" rx="5" ry="5" fill="#1f78b4" stroke="#333" stroke-width="2" />
    <text x="700" y="325" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">Cell Survival</text>
    
    <!-- Arrows and Interactions -->
    <!-- SCF to CARM1 (ubiquitination) -->
    <line x1="200" y1="230" x2="320" y2="250" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <text x="250" y="230" font-family="Arial" font-size="13" text-anchor="middle">Ubiquitination</text>
    
    <!-- CARM1 to Proteasome (degradation) -->
    <line x1="350" y1="280" x2="350" y2="350" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <text x="380" y="315" font-family="Arial" font-size="13" text-anchor="middle">Degradation</text>
    
    <!-- CARM1 would normally activate Caspase-3 (now inhibited) -->
    <path d="M 380 250 L 460 250 L 460 300 L 500 300" stroke="#333" stroke-width="2.5" fill="none" />
    <!-- T-bar for inhibition -->
    <line x1="450" y1="300" x2="470" y2="300" stroke="#333" stroke-width="5" />
    <text x="425" y="240" font-family="Arial" font-size="13" text-anchor="middle">Inhibited</text>
    
    <!-- Caspase-3 would normally promote Apoptosis (now inhibited) -->
    <path d="M 530 335 L 530 370 L 530 400" stroke="#333" stroke-width="2.5" fill="none" />
    <!-- T-bar for inhibition -->
    <line x1="520" y1="390" x2="540" y2="390" stroke="#333" stroke-width="5" />
    <text x="565" y="370" font-family="Arial" font-size="13" text-anchor="middle">Inhibited</text>
    
    <!-- Inhibition of Apoptosis leads to Cell Survival -->
    <path d="M 600 420 L 630 420 L 630 320 L 650 320" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" />
    <text x="620" y="450" font-family="Arial" font-size="13" text-anchor="middle">Promotes</text>
    
    <!-- Arrow Markers Definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
        </marker>
    </defs>
    
    <!-- Legend -->
    <rect x="50" y="470" width="700" height="80" rx="5" ry="5" fill="#ffffff" stroke="#333" stroke-width="1" />
    <text x="60" y="490" font-family="Arial" font-size="15" font-weight="bold">Legend:</text>
    
    <circle cx="80" cy="510" r="10" fill="#6baed6" stroke="#333" stroke-width="1" />
    <text x="100" y="515" font-family="Arial" font-size="13">SCF Complex Components (CUL1, SKP1, RBX1)</text>
    
    <circle cx="80" cy="535" r="10" fill="#f16913" stroke="#333" stroke-width="1" />
    <text x="100" y="540" font-family="Arial" font-size="13">FBXO9 (F-box substrate adaptor)</text>
    
    <circle cx="310" cy="510" r="10" fill="#31a354" stroke="#333" stroke-width="1" />
    <text x="330" y="515" font-family="Arial" font-size="13">CARM1 (Protein Methyltransferase)</text>
    
    <rect x="310" y="525" width="20" height="15" rx="3" ry="3" fill="#9467bd" stroke="#333" stroke-width="1" />
    <text x="340" y="537" font-family="Arial" font-size="13">CASP3 (Caspase-3)</text>
    
    <circle cx="500" cy="510" r="8" fill="#fb8072" stroke="#333" stroke-width="1" />
    <text x="500" y="513" font-family="Arial" font-size="8" text-anchor="middle" font-weight="bold">Ub</text>
    <text x="530" y="515" font-family="Arial" font-size="13">Ubiquitin</text>
    
    <rect x="500" y="525" width="20" height="15" rx="3" ry="3" fill="#1f78b4" stroke="#333" stroke-width="1" />
    <text x="530" y="537" font-family="Arial" font-size="13">Cell Survival</text>
    
    <line x1="620" y1="510" x2="640" y2="510" stroke="#333" stroke-width="2.5" />
    <line x1="630" y1="505" x2="650" y2="505" stroke="#333" stroke-width="5" transform="rotate(90,640,505)" />
    <text x="670" y="515" font-family="Arial" font-size="13">Inhibition (T-bar)</text>
    
    <line x1="620" y1="535" x2="640" y2="535" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <text x="670" y="537" font-family="Arial" font-size="13">Promotion</text>
</svg>