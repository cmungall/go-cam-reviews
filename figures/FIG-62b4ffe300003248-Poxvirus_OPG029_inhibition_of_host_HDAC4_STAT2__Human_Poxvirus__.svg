<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f8f8f8" stroke="#666" stroke-width="3"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="320" rx="150" ry="120" fill="#e6e6fa" stroke="#666" stroke-width="2"/>
  <text x="400" y="320" font-family="Arial" font-size="20" text-anchor="middle">Nucleus</text>
  
  <!-- Chromatin in nucleus -->
  <path d="M330,290 Q340,270 350,280 Q360,290 370,280 Q380,270 390,280 Q400,290 410,280 Q420,270 430,280 Q440,290 450,280" 
        fill="none" stroke="#8a2be2" stroke-width="8" opacity="0.6"/>
  <text x="390" y="255" font-family="Arial" font-size="14" text-anchor="middle">Chromatin</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="150" font-family="Arial" font-size="20" text-anchor="middle">Cytoplasm</text>
  
  <!-- JAK1 -->
  <circle cx="250" cy="200" r="40" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="250" y="195" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">JAK1</text>
  <text x="250" y="215" font-family="Arial" font-size="12" text-anchor="middle">(P23458)</text>
  
  <!-- HDAC4 -->
  <circle cx="390" cy="290" r="30" fill="#99cc99" stroke="#333" stroke-width="2"/>
  <text x="390" y="285" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">HDAC4</text>
  <text x="390" y="300" font-family="Arial" font-size="10" text-anchor="middle">(P56524)</text>
  
  <!-- STAT2 -->
  <rect x="470" y="280" width="60" height="40" rx="5" ry="5" fill="#9999ff" stroke="#333" stroke-width="2"/>
  <text x="500" y="295" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">STAT2</text>
  <text x="500" y="310" font-family="Arial" font-size="10" text-anchor="middle">(P52630)</text>
  
  <!-- VACWR022 Poxvirus protein -->
  <polygon points="550,180 570,150 590,180 570,210" fill="#ffcc66" stroke="#333" stroke-width="2"/>
  <text x="570" y="183" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">VACWR022</text>
  <text x="570" y="198" font-family="Arial" font-size="10" text-anchor="middle">(P17362)</text>
  
  <!-- Arrows and relationships -->
  <!-- JAK1 to STAT2 (positive regulation) -->
  <line x1="290" y1="200" x2="460" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="375" cy="240" r="12" fill="#66cc66" stroke="#333" stroke-width="1.5"/>
  <text x="375" y="244" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">+</text>
  
  <!-- HDAC4 to STAT2 (positive regulation) -->
  <line x1="420" y1="290" x2="460" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="440" cy="290" r="10" fill="#66cc66" stroke="#333" stroke-width="1.5"/>
  <text x="440" y="294" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">+</text>
  
  <!-- VACWR022 to STAT2 (negative regulation) -->
  <line x1="570" y1="210" x2="520" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="545" y="240" width="20" height="20" fill="#ff6666" stroke="#333" stroke-width="1.5"/>
  <text x="555" y="254" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">-</text>
  
  <!-- VACWR022 to HDAC4 (negative regulation) -->
  <line x1="550" y1="180" x2="420" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="485" y="225" width="20" height="20" fill="#ff6666" stroke="#333" stroke-width="1.5"/>
  <text x="495" y="239" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">-</text>
  
  <!-- Poxvirus entry indication -->
  <path d="M700,100 Q650,150 700,200" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,5"/>
  <polygon points="700,100 710,110 690,110" fill="#ff6600" stroke="#ff6600" stroke-width="1"/>
  <text x="720" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Poxvirus</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Pathway label -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">
    Poxvirus-OPG029 Inhibition of Host HDAC4_STAT2 Pathway
  </text>
  
  <!-- Process labels -->
  <rect x="50" y="40" width="220" height="30" rx="15" ry="15" fill="#ddddff" stroke="#666" stroke-width="1.5"/>
  <text x="160" y="62" font-family="Arial" font-size="14" text-anchor="middle">Type I Interferon Signaling</text>
  
  <!-- Activities labels -->
  <text x="250" y="170" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Protein tyrosine</text>
  <text x="250" y="182" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">kinase activity</text>
  
  <text x="390" y="265" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Molecular</text>
  <text x="390" y="277" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">adaptor activity</text>
  
  <text x="500" y="330" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">DNA-binding transcription</text>
  <text x="500" y="342" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">factor activity</text>
  
  <text x="570" y="125" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Protein</text>
  <text x="570" y="137" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">sequestering activity</text>
  
  <!-- Viral process label -->
  <rect x="550" y="50" width="220" height="40" rx="15" ry="15" fill="#ffdddd" stroke="#666" stroke-width="1.5"/>
  <text x="660" y="65" font-family="Arial" font-size="12" text-anchor="middle">Symbiont-mediated suppression of</text>
  <text x="660" y="80" font-family="Arial" font-size="12" text-anchor="middle">host type I interferon signaling</text>
  
  <!-- Legend -->
  <rect x="50" y="550" width="700" height="80" rx="10" ry="10" fill="#f9f9f9" stroke="#333" stroke-width="1"/>
  <text x="400" y="570" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
  
  <!-- Protein symbols -->
  <circle cx="80" cy="590" r="10" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="100" y="595" font-family="Arial" font-size="14" text-anchor="start">Human JAK1</text>
  
  <circle cx="180" cy="590" r="10" fill="#99cc99" stroke="#333" stroke-width="1"/>
  <text x="200" y="595" font-family="Arial" font-size="14" text-anchor="start">Human HDAC4</text>
  
  <rect x="280" y="585" width="15" height="10" rx="2" ry="2" fill="#9999ff" stroke="#333" stroke-width="1"/>
  <text x="305" y="595" font-family="Arial" font-size="14" text-anchor="start">Human STAT2</text>
  
  <polygon points="390,590 395,585 400,590 395,595" fill="#ffcc66" stroke="#333" stroke-width="1"/>
  <text x="410" y="595" font-family="Arial" font-size="14" text-anchor="start">Poxvirus VACWR022</text>
  
  <!-- Regulation symbols -->
  <circle cx="520" cy="590" r="8" fill="#66cc66" stroke="#333" stroke-width="1"/>
  <text x="520" y="595" font-family="Arial" font-size="14" dx="15" text-anchor="start">Positive regulation</text>
  
  <rect x="650" cy="590" width="15" height="15" fill="#ff6666" stroke="#333" stroke-width="1"/>
  <text x="675" y="595" font-family="Arial" font-size="14" text-anchor="start">Negative regulation</text>
</svg>