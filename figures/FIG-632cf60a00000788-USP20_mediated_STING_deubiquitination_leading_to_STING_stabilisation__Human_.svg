<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="500" fill="#f9f9f9" rx="10" ry="10"/>
    
    <!-- Cell outline -->
    <ellipse cx="400" cy="250" rx="350" ry="220" fill="#f0f0f0" stroke="#333" stroke-width="2" opacity="0.8"/>
    
    <!-- ER membrane -->
    <path d="M180,280 Q400,350 620,280" stroke="#8A6E64" stroke-width="8" fill="none"/>
    <path d="M180,290 Q400,360 620,290" stroke="#B58E7E" stroke-width="4" fill="none"/>
    <text x="300" y="325" font-family="Arial" font-size="16" fill="#333" font-style="italic">Endoplasmic Reticulum Membrane</text>
    
    <!-- Cytoplasm label -->
    <text x="400" y="180" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-style="italic">Cytoplasm</text>
    
    <!-- USP18 Protein - using hexagon shape -->
    <polygon points="180,150 220,130 260,150 260,190 220,210 180,190" fill="#A8D5BA" stroke="#333" stroke-width="2"/>
    <text x="220" y="170" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">USP18</text>
    <text x="220" y="190" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">molecular adaptor</text>
    
    <!-- USP20 Protein - using rounded rectangle -->
    <rect x="350" y="130" width="100" height="60" rx="15" ry="15" fill="#FAD5A5" stroke="#333" stroke-width="2"/>
    <text x="400" y="165" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">USP20</text>
    <text x="400" y="185" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">deubiquitinase</text>
    
    <!-- STING1 Protein - using oval shape -->
    <ellipse cx="570" cy="250" rx="60" ry="30" fill="#B5D8EB" stroke="#333" stroke-width="2"/>
    <text x="570" y="245" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">STING1</text>
    <text x="570" y="265" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">cGAMP binding</text>
    
    <!-- Arrows -->
    <path d="M260,170 L350,160" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M450,160 Q500,170 520,250" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Positive regulation markers -->
    <circle cx="315" y="165" r="15" fill="#7FD47F" stroke="#333" stroke-width="1.5"/>
    <text x="315" y="170" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">+</text>
    <text x="315" y="145" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Recruits/activates</text>
    
    <circle cx="490" y="210" r="15" fill="#7FD47F" stroke="#333" stroke-width="1.5"/>
    <text x="490" y="215" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">+</text>
    <text x="490" y="190" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Stabilizes</text>
    
    <!-- Ubiquitin and deubiquitination representation -->
    <g transform="translate(460, 230)">
        <circle cx="0" cy="0" r="10" fill="#F5D742" stroke="#333" stroke-width="1.5"/>
        <circle cx="12" cy="-6" r="10" fill="#F5D742" stroke="#333" stroke-width="1.5"/>
        <circle cx="-6" cy="-12" r="10" fill="#F5D742" stroke="#333" stroke-width="1.5"/>
        <line x1="24" y1="0" x2="40" y2="0" stroke="#E74C3C" stroke-width="3"/>
        <line x1="32" y1="-8" x2="32" y2="8" stroke="#E74C3C" stroke-width="3"/>
        <text x="0" y="40" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">Ubiquitin removal</text>
    </g>
    
    <!-- cGAMP representation -->
    <ellipse cx="550" cy="330" rx="30" ry="18" fill="#EDBB99" stroke="#333" stroke-width="1.5"/>
    <text x="550" y="335" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">cGAMP</text>
    <path d="M550,310 L550,330" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Process annotation -->
    <rect x="100" y="70" width="250" height="40" rx="5" ry="5" fill="#E8F4F9" stroke="#333" stroke-width="1" opacity="0.8"/>
    <text x="225" y="95" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">Step 1: USP18 recruits USP20</text>
    
    <rect x="400" y="70" width="300" height="40" rx="5" ry="5" fill="#E8F4F9" stroke="#333" stroke-width="1" opacity="0.8"/>
    <text x="550" y="95" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">Step 2: USP20 removes ubiquitin from STING1</text>
    
    <rect x="570" y="310" width="220" height="40" rx="5" ry="5" fill="#E8F4F9" stroke="#333" stroke-width="1" opacity="0.8"/>
    <text x="680" y="335" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">Step 3: Stabilized STING1 binds cGAMP</text>
    
    <!-- Title -->
    <text x="400" y="30" font-family="Arial" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">USP20-mediated STING Deubiquitination Pathway</text>
    <text x="400" y="55" font-family="Arial" font-size="16" fill="#333" text-anchor="middle">Part of antiviral innate immune response</text>
    
    <!-- Legend -->
    <rect x="600" y="360" width="180" height="125" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
    <text x="690" y="380" font-family="Arial" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">Legend</text>
    
    <!-- Using distinctive shapes in the legend -->
    <polygon points="610,392 620,387 630,392 630,402 620,407 610,402" fill="#A8D5BA" stroke="#333" stroke-width="1"/>
    <text x="635" y="400" font-family="Arial" font-size="12" fill="#333" text-anchor="start">USP18</text>
    
    <rect x="610" y="410" width="20" height="12" rx="3" ry="3" fill="#FAD5A5" stroke="#333" stroke-width="1"/>
    <text x="635" y="420" font-family="Arial" font-size="12" fill="#333" text-anchor="start">USP20</text>
    
    <ellipse cx="620" cy="430" rx="12" ry="6" fill="#B5D8EB" stroke="#333" stroke-width="1"/>
    <text x="635" y="433" font-family="Arial" font-size="12" fill="#333" text-anchor="start">STING1</text>
    
    <circle cx="620" y="445" r="6" fill="#7FD47F" stroke="#333" stroke-width="1"/>
    <text x="620" y="448" font-family="Arial" font-size="8" fill="white" text-anchor="middle" font-weight="bold">+</text>
    <text x="635" y="448" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Positive regulation</text>
    
    <ellipse cx="620" cy="463" rx="8" ry="5" fill="#EDBB99" stroke="#333" stroke-width="1"/>
    <text x="635" y="465" font-family="Arial" font-size="12" fill="#333" text-anchor="start">cGAMP</text>
    
    <g transform="translate(610, 475) scale(0.4)">
        <circle cx="0" cy="0" r="10" fill="#F5D742" stroke="#333" stroke-width="1.5"/>
        <circle cx="12" cy="-6" r="10" fill="#F5D742" stroke="#333" stroke-width="1.5"/>
    </g>
    <text x="635" y="480" font-family="Arial" font-size="12" fill="#333" text-anchor="start">Ubiquitin</text>
    
    <!-- Arrowhead marker definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
        </marker>
    </defs>
</svg>