<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Cell outline -->
  <rect width="800" height="600" fill="#ffffff" />
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f9f9f9" stroke="#666666" stroke-width="2" />
  
  <!-- Nucleus -->
  <ellipse cx="300" cy="300" rx="150" ry="120" fill="#e6f2ff" stroke="#333333" stroke-width="2" />
  <text x="300" y="450" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Nucleus</text>
  
  <!-- Cytosol label -->
  <text x="550" y="450" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Cytosol</text>
  
  <!-- Cell Type Label -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Mouse Hepatocyte</text>
  
  <!-- Title -->
  <text x="400" y="580" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Positive regulation of transcription from RNA polymerase II promoter by glucose</text>
  
  <!-- Nuclear proteins -->
  <!-- Ogt -->
  <rect x="180" y="250" width="80" height="40" rx="10" ry="10" fill="#ffcccc" stroke="#cc0000" stroke-width="2" />
  <text x="220" y="275" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Ogt</text>
  <text x="220" y="230" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">O-GlcNAc transferase</text>
  
  <!-- Mlx -->
  <rect x="330" y="250" width="80" height="40" rx="10" ry="10" fill="#ccffcc" stroke="#00cc00" stroke-width="2" />
  <text x="370" y="275" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Mlx</text>
  <text x="370" y="230" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">TF binding</text>
  
  <!-- Mlxipl -->
  <rect x="250" y="340" width="80" height="40" rx="10" ry="10" fill="#ccccff" stroke="#0000cc" stroke-width="2" />
  <text x="290" y="365" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Mlxipl</text>
  <text x="290" y="390" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">DNA-binding TF activator</text>
  
  <!-- Cytosolic enzymes -->
  <!-- Acaca -->
  <rect x="450" y="240" width="80" height="40" rx="10" ry="10" fill="#ffffcc" stroke="#cccc00" stroke-width="2" />
  <text x="490" y="265" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Acaca</text>
  <text x="490" y="290" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">acetyl-CoA carboxylase</text>
  
  <!-- Fasn -->
  <rect x="550" y="330" width="80" height="40" rx="10" ry="10" fill="#ffccff" stroke="#cc00cc" stroke-width="2" />
  <text x="590" y="355" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Fasn</text>
  <text x="590" y="380" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">fatty acid synthase</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="positiveReg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000" />
    </marker>
    <marker id="binding" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00cc00" />
    </marker>
    <marker id="activation" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0000cc" />
    </marker>
    <marker id="input" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ad7d2a" />
    </marker>
  </defs>
  
  <!-- Arrows and interactions -->
  <!-- Ogt to Mlxipl -->
  <path d="M220 290 L 270 340" stroke="#cc0000" stroke-width="2.5" fill="none" marker-end="url(#positiveReg)" />
  <text x="205" y="320" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">positively</text>
  <text x="205" y="335" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">regulates</text>
  
  <!-- Mlx to Mlxipl -->
  <path d="M370 290 L 310 340" stroke="#00cc00" stroke-width="2.5" fill="none" marker-end="url(#binding)" />
  <text x="355" y="320" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">binds</text>
  
  <!-- Mlxipl to Acaca -->
  <path d="M330 350 L 450 260" stroke="#0000cc" stroke-width="2.5" fill="none" marker-end="url(#activation)" />
  <text x="380" y="290" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">activates</text>
  
  <!-- Mlxipl to Fasn -->
  <path d="M330 360 L 550 350" stroke="#0000cc" stroke-width="2.5" fill="none" marker-end="url(#activation)" />
  <text x="430" y="380" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">activates</text>

  <!-- Lipid synthesis process circle -->
  <ellipse cx="520" cy="390" rx="100" ry="35" fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="5,3" />
  <text x="520" y="395" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#666666">Lipid Biosynthesis</text>
  
  <!-- Glucose input -->
  <polygon points="80,270 110,250 140,270 110,290" fill="#f9e7b0" stroke="#ad7d2a" stroke-width="2.5" />
  <text x="110" y="275" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Glucose</text>
  <path d="M140 270 L 180 270" stroke="#ad7d2a" stroke-width="2.5" fill="none" marker-end="url(#input)" />
  <text x="160" y="250" font-family="Arial" font-size="14" font-weight="bold" fill="#ad7d2a">stimulus</text>
  
  <!-- Legend -->
  <rect x="50" y="460" width="700" height="80" rx="10" ry="10" fill="#f0f0f0" stroke="#666666" stroke-width="1.5"/>
  <text x="400" y="480" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">LEGEND</text>
  
  <!-- Legend items -->
  <rect x="70" y="490" width="20" height="10" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="100" y="500" font-family="Arial" font-size="14" font-weight="bold">Ogt (O-GlcNAc transferase)</text>
  
  <rect x="230" y="490" width="20" height="10" fill="#ccffcc" stroke="#00cc00" stroke-width="1.5"/>
  <text x="260" y="500" font-family="Arial" font-size="14" font-weight="bold">Mlx (TF binding)</text>
  
  <rect x="370" y="490" width="20" height="10" fill="#ccccff" stroke="#0000cc" stroke-width="1.5"/>
  <text x="400" y="500" font-family="Arial" font-size="14" font-weight="bold">Mlxipl (TF activator)</text>
  
  <rect x="510" y="490" width="20" height="10" fill="#ffffcc" stroke="#cccc00" stroke-width="1.5"/>
  <text x="540" y="500" font-family="Arial" font-size="14" font-weight="bold">Acaca</text>
  
  <rect x="590" y="490" width="20" height="10" fill="#ffccff" stroke="#cc00cc" stroke-width="1.5"/>
  <text x="620" y="500" font-family="Arial" font-size="14" font-weight="bold">Fasn</text>
  
  <line x1="70" y1="520" x2="90" y2="520" stroke="#cc0000" stroke-width="2.5" marker-end="url(#positiveReg)"/>
  <text x="125" y="525" font-family="Arial" font-size="14" font-weight="bold">Positive regulation</text>
  
  <line x1="230" y1="520" x2="250" y2="520" stroke="#00cc00" stroke-width="2.5" marker-end="url(#binding)"/>
  <text x="290" y="525" font-family="Arial" font-size="14" font-weight="bold">Binding</text>
  
  <line x1="370" y1="520" x2="390" y2="520" stroke="#0000cc" stroke-width="2.5" marker-end="url(#activation)"/>
  <text x="430" y="525" font-family="Arial" font-size="14" font-weight="bold">Activation</text>
  
  <polygon points="510,515 520,510 530,515 520,520" fill="#f9e7b0" stroke="#ad7d2a" stroke-width="1.5"/>
  <text x="580" y="525" font-family="Arial" font-size="14" font-weight="bold">Glucose (Input/Stimulus)</text>
</svg>