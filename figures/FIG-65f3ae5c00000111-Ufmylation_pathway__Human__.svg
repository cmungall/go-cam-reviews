<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Cytosol -->
  <rect x="0" y="0" width="800" height="650" fill="#f5f8fc" />
  <text x="730" y="630" font-family="Arial" font-size="16" fill="#666">Cytosol</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Human Ufmylation Pathway</text>
  
  <!-- UFM1 Protein -->
  <rect x="100" y="120" width="100" height="50" rx="10" fill="#a1d4ff" stroke="#0066cc" stroke-width="2" />
  <text x="150" y="150" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">UFM1</text>
  <text x="150" y="110" font-family="Arial" font-size="12" text-anchor="middle">(inactive)</text>
  
  <!-- UFSP1 Protein -->
  <rect x="280" y="100" width="120" height="60" rx="10" fill="#ffcc99" stroke="#ff9933" stroke-width="2" />
  <text x="340" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">UFSP1</text>
  <text x="340" y="150" font-family="Arial" font-size="10" text-anchor="middle">cysteine-type peptidase</text>
  
  <!-- Arrow from UFM1 to UFSP1 -->
  <path d="M200 145 L280 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- UFM1 Processed -->
  <rect x="280" y="200" width="100" height="50" rx="10" fill="#a1d4ff" stroke="#0066cc" stroke-width="2" />
  <text x="330" y="230" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">UFM1</text>
  <text x="330" y="190" font-family="Arial" font-size="12" text-anchor="middle">(processed)</text>
  
  <!-- Arrow from UFSP1 to UFM1 Processed -->
  <path d="M340 160 L330 200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- UBA5 Protein -->
  <rect x="280" y="300" width="120" height="60" rx="10" fill="#99cc99" stroke="#339933" stroke-width="2" />
  <text x="340" y="330" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">UBA5</text>
  <text x="340" y="350" font-family="Arial" font-size="10" text-anchor="middle">UFM1 activating enzyme</text>
  
  <!-- Arrow from UFM1 Processed to UBA5 -->
  <path d="M330 250 L330 300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Activated UFM1 -->
  <rect x="450" y="300" width="100" height="50" rx="10" fill="#a1d4ff" stroke="#0066cc" stroke-width="2" />
  <text x="500" y="330" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">UFM1</text>
  <text x="500" y="290" font-family="Arial" font-size="12" text-anchor="middle">(activated)</text>
  
  <!-- Arrow from UBA5 to Activated UFM1 -->
  <path d="M400 330 L450 330" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- UFC1 Protein -->
  <rect x="450" y="400" width="120" height="60" rx="10" fill="#cc99cc" stroke="#993399" stroke-width="2" />
  <text x="510" y="430" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">UFC1</text>
  <text x="510" y="450" font-family="Arial" font-size="10" text-anchor="middle">UFM1 conjugating enzyme</text>
  
  <!-- Arrow from Activated UFM1 to UFC1 -->
  <path d="M500 350 L500 400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Conjugated UFM1 -->
  <rect x="620" y="400" width="100" height="50" rx="10" fill="#a1d4ff" stroke="#0066cc" stroke-width="2" />
  <text x="670" y="430" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">UFM1</text>
  <text x="670" y="390" font-family="Arial" font-size="12" text-anchor="middle">(conjugated)</text>
  
  <!-- Arrow from UFC1 to Conjugated UFM1 -->
  <path d="M570 430 L620 430" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- UFL1 Protein -->
  <rect x="500" y="500" width="120" height="60" rx="10" fill="#ff9999" stroke="#cc3333" stroke-width="2" />
  <text x="560" y="530" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">UFL1</text>
  <text x="560" y="550" font-family="Arial" font-size="10" text-anchor="middle">UFM1 ligase</text>
  
  <!-- Arrow from Conjugated UFM1 to UFL1 -->
  <path d="M670 450 L610 500" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Target Protein -->
  <rect x="320" y="510" width="100" height="50" rx="10" fill="#e6e6e6" stroke="#666" stroke-width="2" />
  <text x="370" y="540" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Target</text>
  <text x="370" y="500" font-family="Arial" font-size="12" text-anchor="middle">(substrate)</text>
  
  <!-- Arrow from Target Protein to UFL1 -->
  <path d="M420 530 L500 530" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Ufmylated Protein -->
  <rect x="150" y="500" width="100" height="60" rx="10" fill="#e6e6e6" stroke="#666" stroke-width="2" />
  <text x="200" y="530" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Target</text>
  <text x="200" y="550" font-family="Arial" font-size="12" text-anchor="middle">Ufmylated</text>
  
  <!-- UFM1 icon on the ufmylated protein -->
  <circle cx="170" cy="520" r="12" fill="#a1d4ff" stroke="#0066cc" stroke-width="2" />
  <text x="170" y="524" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">U</text>
  
  <!-- Arrow from UFL1 to Ufmylated Protein -->
  <path d="M500 530 L250 530" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Process labels -->
  <text x="230" y="125" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">1. Maturation</text>
  <text x="380" y="280" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">2. Activation</text>
  <text x="530" y="380" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">3. Conjugation</text>
  <text x="400" y="480" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">4. Ligation</text>
  
  <!-- Biological Process Label -->
  <text x="400" y="70" font-family="Arial" font-size="18" font-style="italic" text-anchor="middle" fill="#444">Protein Ufmylation (GO:0071569)</text>
  
  <!-- Process significance explanations -->
  <text x="195" y="170" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">UFSP1 cleaves UFM1 precursor</text>
  <text x="195" y="182" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">to expose C-terminal glycine</text>
  
  <text x="390" y="270" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">UBA5 adenylates UFM1,</text>
  <text x="390" y="282" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">preparing it for conjugation</text>
  
  <text x="580" y="370" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">UFC1 forms thioester bond</text>
  <text x="580" y="382" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">with UFM1</text>
  
  <text x="430" y="470" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">UFL1 transfers UFM1</text>
  <text x="430" y="482" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">to lysine residue of target protein</text>
  
  <!-- Legend -->
  <rect x="50" y="580" width="700" height="40" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1" />
  <text x="60" y="605" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <!-- Protein Types -->
  <rect x="130" y="590" width="20" height="20" fill="#a1d4ff" stroke="#0066cc" stroke-width="2" />
  <text x="155" y="605" font-family="Arial" font-size="12">UFM1</text>
  
  <rect x="215" y="590" width="20" height="20" fill="#ffcc99" stroke="#ff9933" stroke-width="2" />
  <text x="240" y="605" font-family="Arial" font-size="12">UFSP1</text>
  
  <rect x="300" y="590" width="20" height="20" fill="#99cc99" stroke="#339933" stroke-width="2" />
  <text x="325" y="605" font-family="Arial" font-size="12">UBA5</text>
  
  <rect x="385" y="590" width="20" height="20" fill="#cc99cc" stroke="#993399" stroke-width="2" />
  <text x="410" y="605" font-family="Arial" font-size="12">UFC1</text>
  
  <rect x="470" y="590" width="20" height="20" fill="#ff9999" stroke="#cc3333" stroke-width="2" />
  <text x="495" y="605" font-family="Arial" font-size="12">UFL1</text>
  
  <rect x="555" y="590" width="20" height="20" fill="#e6e6e6" stroke="#666" stroke-width="2" />
  <text x="580" y="605" font-family="Arial" font-size="12">Target Protein</text>
  
  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>