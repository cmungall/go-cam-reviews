<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">GRIM1 Activation of GRID1 via GNAQ in Dopamine Neurons</text>
  
  <!-- Cell membrane outlines -->
  <!-- Presynaptic terminal -->
  <path d="M100,150 Q150,100 200,150 Q250,200 300,150 Q350,100 400,150" fill="#e6f2ff" stroke="#0066cc" stroke-width="2"/>
  <text x="250" y="120" font-family="Arial" font-size="14" text-anchor="middle">Presynaptic Terminal</text>
  
  <!-- Synaptic cleft -->
  <rect x="100" y="150" width="600" height="50" fill="#f2f2f2" stroke="#999999" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="400" y="180" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Synaptic Cleft (GO:0043083)</text>
  
  <!-- Postsynaptic density -->
  <path d="M100,200 Q150,250 200,200 Q250,150 300,200 Q350,250 400,200 Q450,150 500,200 Q550,250 600,200 Q650,150 700,200" fill="#fff0e6" stroke="#cc6600" stroke-width="2"/>
  
  <!-- Postsynaptic neuron -->
  <path d="M100,200 v250 h600 v-250" fill="#fff0e6" stroke="#cc6600" stroke-width="2"/>
  <text x="250" y="430" font-family="Arial" font-size="14" text-anchor="middle">Dopaminergic Neuron (CL:0000700)</text>
  <text x="250" y="450" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">(Postsynaptic)</text>
  
  <!-- Postsynaptic density label -->
  <text x="400" y="220" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Postsynaptic Density Membrane (GO:0098839)</text>

  <!-- Overall signal flow direction -->
  <path d="M390,60 q100,30 150,100" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="10,5" marker-end="url(#arrowhead)"/>
  <text x="450" y="70" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Signal Flow</text>
  
  <!-- Molecules in diagram -->
  
  <!-- GRIM1 in presynaptic terminal -->
  <rect x="170" y="120" width="60" height="30" rx="5" ry="5" fill="#ccffcc" stroke="#006600" stroke-width="2"/>
  <text x="200" y="140" font-family="Arial" font-size="12" text-anchor="middle">GRIM1</text>
  <text x="200" y="100" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Synaptic signaling via neuropeptide</text>
  <text x="200" y="112" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(GO:0099538)</text>
  
  <!-- Glutamate in synaptic cleft -->
  <circle cx="180" cy="175" r="15" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="180" y="178" font-family="Arial" font-size="10" text-anchor="middle">Glu</text>
  <text x="180" y="195" font-family="Arial" font-size="8" text-anchor="middle">CHEBI:29985</text>
  
  <!-- GRID1 receptor in membrane -->
  <rect x="220" y="190" width="60" height="30" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="250" y="210" font-family="Arial" font-size="12" text-anchor="middle">GRID1</text>
  <text x="250" y="226" font-family="Arial" font-size="8" text-anchor="middle">UniProtKB:Q9ULK0</text>
  <text x="250" y="170" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:1904315 (ion channel activity)</text>
  
  <!-- Arrow from glutamate to GRID1 -->
  <line x1="195" y1="175" x2="220" y2="190" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from GRIM1 to GRID1 -->
  <path d="M200,150 Q210,170 220,190" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="225" y="160" font-family="Arial" font-size="10" text-anchor="middle">activates</text>
  <text x="225" y="172" font-family="Arial" font-size="9" text-anchor="middle">GO:0099530</text>
  
  <!-- GNAQ (G protein) -->
  <rect x="320" y="250" width="60" height="30" rx="15" ry="15" fill="#ffcc99" stroke="#cc6600" stroke-width="2"/>
  <text x="350" y="270" font-family="Arial" font-size="12" text-anchor="middle">GNAQ</text>
  <text x="350" y="286" font-family="Arial" font-size="8" text-anchor="middle">UniProtKB:P50148</text>
  <text x="350" y="298" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0003925 (G protein activity)</text>
  
  <!-- Arrow from GRID1 to GNAQ -->
  <path d="M280,210 Q300,230 320,250" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="290" y="230" font-family="Arial" font-size="10" text-anchor="middle">activates</text>
  
  <!-- PLCB3 -->
  <rect x="420" y="300" width="60" height="30" rx="5" ry="5" fill="#ffff99" stroke="#cccc00" stroke-width="2"/>
  <text x="450" y="320" font-family="Arial" font-size="12" text-anchor="middle">PLCB3</text>
  <text x="450" y="336" font-family="Arial" font-size="8" text-anchor="middle">UniProtKB:Q01970</text>
  <text x="450" y="348" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0004435 (phospholipase C activity)</text>
  
  <!-- Arrow from GNAQ to PLCB3 -->
  <path d="M380,265 Q400,285 420,300" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="390" y="280" font-family="Arial" font-size="10" text-anchor="middle">activates</text>
  
  <!-- IP3 and DAG -->
  <circle cx="530" cy="330" r="20" fill="#ff99cc" stroke="#cc0066" stroke-width="1.5"/>
  <text x="530" y="334" font-family="Arial" font-size="10" text-anchor="middle">IP3</text>
  <text x="530" y="346" font-family="Arial" font-size="9" text-anchor="middle">CHEBI:203600</text>
  <text x="530" y="358" font-family="Arial" font-size="9" text-anchor="middle">Ca²⁺ release</text>
  
  <circle cx="590" cy="330" r="20" fill="#cc99ff" stroke="#6600cc" stroke-width="1.5"/>
  <text x="590" y="334" font-family="Arial" font-size="10" text-anchor="middle">DAG</text>
  <text x="590" y="346" font-family="Arial" font-size="9" text-anchor="middle">CHEBI:17815</text>
  <text x="590" y="358" font-family="Arial" font-size="9" text-anchor="middle">Activates PKC</text>
  
  <!-- Arrow from PLCB3 to molecules -->
  <path d="M480,315 Q505,315 510,320" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="500" y="310" font-family="Arial" font-size="10" text-anchor="middle">produces</text>
  
  <!-- PRKCG -->
  <rect x="560" y="380" width="60" height="30" rx="5" ry="5" fill="#99ff99" stroke="#009900" stroke-width="2"/>
  <text x="590" y="400" font-family="Arial" font-size="12" text-anchor="middle">PRKCG</text>
  <text x="590" y="416" font-family="Arial" font-size="8" text-anchor="middle">UniProtKB:P05129</text>
  <text x="590" y="428" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">GO:0004698 (kinase activity)</text>
  
  <!-- Arrow from DAG to PRKCG -->
  <path d="M590,350 v20" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from PRKCG back to GRID1 -->
  <path d="M560,395 Q400,400 300,300 Q270,250 250,220" stroke="#000000" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="400" y="380" font-family="Arial" font-size="10" text-anchor="middle">regulates</text>
  <text x="400" y="392" font-family="Arial" font-size="9" text-anchor="middle">(RO:0002407)</text>
  
  <!-- Labels for cell components -->
  <text x="500" y="370" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">GO:0099524 (Postsynaptic Cytosol)</text>
  
  <!-- Process label -->
  <text x="650" y="240" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">GO:0007200</text>
  <text x="650" y="255" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Phospholipase C-activating G protein-coupled</text>
  <text x="650" y="270" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">receptor signaling pathway</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="450" width="180" height="140" fill="white" stroke="black" stroke-width="1"/>
  <text x="690" y="470" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="610" y="480" width="20" height="20" fill="#ccffcc" stroke="#006600" stroke-width="1"/>
  <text x="640" y="495" font-family="Arial" font-size="12" text-anchor="start">GRIM1</text>
  
  <rect x="610" y="505" width="20" height="20" fill="#99ccff" stroke="#0066cc" stroke-width="1"/>
  <text x="640" y="520" font-family="Arial" font-size="12" text-anchor="start">GRID1 Receptor</text>
  
  <rect x="610" y="530" width="20" height="20" rx="10" ry="10" fill="#ffcc99" stroke="#cc6600" stroke-width="1"/>
  <text x="640" y="545" font-family="Arial" font-size="12" text-anchor="start">G protein (GNAQ)</text>
  
  <rect x="610" y="555" width="20" height="20" fill="#ffff99" stroke="#cccc00" stroke-width="1"/>
  <text x="640" y="570" font-family="Arial" font-size="12" text-anchor="start">Enzyme (PLCB3)</text>
  
  <circle cx="620" cy="590" r="10" fill="#ff99cc" stroke="#cc0066" stroke-width="1"/>
  <text x="640" y="595" font-family="Arial" font-size="12" text-anchor="start">Second messenger</text>
</svg>