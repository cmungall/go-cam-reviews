<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Cell -->
  <rect width="800" height="600" fill="#f9f9f9" />
  
  <!-- Cell Membrane -->
  <path d="M100,150 Q400,100 700,150 Q700,400 400,450 Q100,400 100,150" fill="#e6f7ff" stroke="#0066cc" stroke-width="2" />
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="350" rx="120" ry="80" fill="#d9e6ff" stroke="#0033cc" stroke-width="2" />
  
  <!-- Apical plasma membrane (highlighted region) -->
  <path d="M150,150 Q400,120 650,150" fill="none" stroke="#ff6600" stroke-width="4" stroke-dasharray="5,3" />
  <text x="180" y="130" font-family="Arial" font-size="14" fill="#333">Apical Plasma Membrane (GO:0016324)</text>
  
  <!-- Extracellular region -->
  <rect x="150" y="20" width="500" height="100" fill="none" stroke="none" />
  <text x="290" y="50" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Extracellular Region (GO:0005576)</text>
  
  <!-- Upd2 cytokine -->
  <circle cx="400" cy="80" r="25" fill="#ffcc99" stroke="#ff6600" stroke-width="2" />
  <text x="400" y="85" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Upd2</text>
  <text x="400" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(FBgn0030904)</text>
  
  <!-- Dome receptor -->
  <rect x="370" y="140" width="60" height="30" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="5" ry="5" />
  <text x="400" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Dome</text>
  <text x="400" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(FBgn0043903)</text>
  
  <!-- Hop (JAK) -->
  <rect x="370" y="200" width="60" height="30" fill="#99cc99" stroke="#006600" stroke-width="2" rx="5" ry="5" />
  <text x="400" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Hop</text>
  <text x="400" y="235" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(FBgn0004864)</text>
  
  <!-- Stat92E -->
  <polygon points="380,270 420,270 410,290 390,290" fill="#cc99cc" stroke="#660066" stroke-width="2" />
  <text x="400" y="283" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Stat92E</text>
  <text x="400" y="298" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(FBgn0016917)</text>
  
  <!-- Stat92E in nucleus -->
  <polygon points="380,340 420,340 410,360 390,360" fill="#cc99cc" stroke="#660066" stroke-width="2" />
  <text x="400" y="353" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Stat92E</text>
  <text x="400" y="368" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(FBgn0016917)</text>
  
  <!-- DNA in nucleus -->
  <path d="M320,380 Q400,360 480,380" fill="none" stroke="#333" stroke-width="2" />
  
  <!-- Arrows and interactions -->
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
  </marker>
  
  <!-- Upd2 to Dome interaction -->
  <line x1="400" y1="105" x2="400" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Dome to Hop interaction -->
  <line x1="400" y1="170" x2="400" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Hop to Stat92E interaction -->
  <line x1="400" y1="230" x2="400" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Stat92E translocation to nucleus -->
  <line x1="400" y1="290" x2="400" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,3" />
  
  <!-- Stat92E to DNA interaction -->
  <line x1="400" y1="360" x2="400" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Labels for pathway components -->
  <text x="250" y="80" font-family="Arial" font-size="12" fill="#333">Cytokine Activity (GO:0005125)</text>
  <text x="500" y="160" font-family="Arial" font-size="12" fill="#333">Cytokine Receptor Activity (GO:0004896)</text>
  <text x="500" y="220" font-family="Arial" font-size="12" fill="#333">Tyrosine Kinase Activity (GO:0004715)</text>
  <text x="500" y="283" font-family="Arial" font-size="12" fill="#333">Cytoplasmic Side (GO:0009898)</text>
  <text x="500" y="353" font-family="Arial" font-size="12" fill="#333">Transcription Activator (GO:0001228)</text>
  
  <!-- JAK-STAT Pathway Title -->
  <text x="400" y="500" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Receptor Signaling Pathway via JAK-STAT via upd2-dome (D. melanogaster)</text>
  <text x="400" y="530" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Cell Surface Receptor Signaling Pathway via JAK-STAT (GO:0007259)</text>
  
  <!-- Nucleus label -->
  <text x="400" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Nucleus (GO:0005634)</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="240" height="70" fill="white" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="60" y="540" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Legend:</text>
  
  <!-- Legend items -->
  <circle cx="70" cy="555" r="8" fill="#ffcc99" stroke="#ff6600" stroke-width="1" />
  <text x="85" y="559" font-family="Arial" font-size="12" fill="#333">Cytokine (Upd2)</text>
  
  <rect x="160" y="547" width="16" height="16" fill="#99ccff" stroke="#0066cc" stroke-width="1" rx="2" ry="2" />
  <text x="183" y="559" font-family="Arial" font-size="12" fill="#333">Receptor (Dome)</text>
  
  <rect x="70" y="575" width="16" height="16" fill="#99cc99" stroke="#006600" stroke-width="1" rx="2" ry="2" />
  <text x="93" y="587" font-family="Arial" font-size="12" fill="#333">Kinase (Hop)</text>
  
  <polygon points="160,575 176,575 172,583 164,583" fill="#cc99cc" stroke="#660066" stroke-width="1" />
  <text x="183" y="587" font-family="Arial" font-size="12" fill="#333">Transcription Factor (Stat92E)</text>
</svg>