<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
 <rect x="50" y="50" width="700" height="550" fill="#E5ECF6" stroke="#000" />
 <text x="100" y="90" font-family="Arial" font-size="14">Site of double-strand break (GO:0035861)</text>
 <circle cx="250" cy="150" r="30" fill="#FFC0CB" stroke="#000" />
 <text x="220" y="155" font-family="Arial" font-size="12">RNF168 (GO:0140858)</text>
 <line x1="280" y1="150" x2="320" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
 <circle cx="350" cy="220" r="30" fill="#F0E68C" stroke="#000" />
 <text x="320" y="225" font-family="Arial" font-size="12">TP53BP1 (GO:0061649)</text>
 <line x1="380" y1="220" x2="420" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
 <circle cx="450" cy="290" r="30" fill="#98FB98" stroke="#000" />
 <text x="420" y="295" font-family="Arial" font-size="12">MBTD1 (GO:0035064)</text>
 <line x1="480" y1="290" x2="520" y2="360" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
 <circle cx="550" cy="360" r="30" fill="#AFEEEE" stroke="#000" />
 <text x="520" y="365" font-family="Arial" font-size="12">EPC1 (GO:0140463)</text>

 <!-- Additional relationships -->
 <line x1="250" y1="150" x2="200" y2="250" stroke="#000" stroke-width="2" style="stroke-dasharray:4;" marker-end="url(#arrowhead)" />
 <circle cx="150" cy="250" r="30" fill="#D3D3D3" stroke="#000" />
 <text x="120" y="255" font-family="Arial" font-size="12">KAT5 (GO:0043998)</text>
 <line x1="150" y1="250" x2="50" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
 <text x="20" y="355" font-family="Arial" font-size="12">DSB repair (GO:0000724)</text>
 <line x1="250" y1="150" x2="550" y2="450" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
 <circle cx="590" cy="450" r="30" fill="#F8F8FF" stroke="#000" />
 <text x="560" y="455" font-family="Arial" font-size="12">PIAS4 (GO:0061665)</text>
 <text x="80" y="600" font-family="Arial" font-size="14">KAT5 involvement in DNA repair via homologous recombination (Human)</text>

 <!-- Marker definition for arrows -->
 <defs>
     <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
         <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
     </marker>
 </defs>

 <!-- Legend -->
 <rect x="600" y="600" width="130" height="100" fill="#ffffff" stroke="#000" />
 <text x="610" y="620" font-family="Arial" font-size="12">Legend:</text>
 <line x1="610" y1="640" x2="650" y2="640" stroke="#000" stroke-width="2" />
 <text x="660" y="645" font-family="Arial" font-size="12">Solid Line: Interaction</text>
 <line x1="610" y1="670" x2="650" y2="670" stroke="#000" stroke-width="2" style="stroke-dasharray:4;" />
 <text x="660" y="675" font-family="Arial" font-size="12">Dashed Line: Alternative</text>
</svg>