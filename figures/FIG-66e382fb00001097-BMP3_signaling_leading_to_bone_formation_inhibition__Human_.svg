<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">BMP3 Signaling Pathway Leading to Bone Formation Inhibition</text>
  
  <!-- Cell membrane -->
  <path d="M 100,200 L 700,200 L 700,500 L 100,500 Z" fill="#f8f8f8" stroke="#000000" stroke-width="2" />
  <path d="M 100,200 L 700,200" stroke="#000000" stroke-width="3" stroke-dasharray="5,3" />
  
  <!-- Extracellular space background -->
  <rect x="100" y="100" width="600" height="100" fill="#e6f9ff" opacity="0.5"/>
  
  <!-- Compartment labels -->
  <text x="140" y="125" font-family="Arial" font-size="14" font-style="italic" font-weight="bold">Extracellular Space</text>
  <text x="140" y="230" font-family="Arial" font-size="14" font-style="italic" font-weight="bold">Cytoplasm</text>
  
  <!-- Phase Labels -->
  <text x="180" y="85" font-family="Arial" font-size="14" font-weight="bold">1. Ligand-Receptor Binding</text>
  <text x="320" y="260" font-family="Arial" font-size="14" font-weight="bold">2. Signal Transduction</text>
  <text x="400" y="330" font-family="Arial" font-size="14" font-weight="bold">3. Nuclear Translocation</text>
  <text x="500" y="380" font-family="Arial" font-size="14" font-weight="bold">4. Transcriptional Regulation</text>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="400" rx="130" ry="70" fill="#e6e6fa" stroke="#000000" stroke-width="2" />
  <text x="400" y="370" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" font-weight="bold">Nucleus</text>
  
  <!-- BMP3 ligand -->
  <circle cx="250" cy="150" r="25" fill="#a6d854" stroke="#000000" stroke-width="2" />
  <text x="250" y="155" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">BMP3</text>
  
  <!-- Receptor Complex -->
  <rect x="220" y="190" width="60" height="20" fill="#fdae61" stroke="#000000" stroke-width="2" rx="5" ry="5" />
  <text x="250" y="205" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ACVR2B</text>
  
  <rect x="220" y="210" width="60" height="20" fill="#abd9e9" stroke="#000000" stroke-width="2" rx="5" ry="5" />
  <text x="250" y="225" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ACVR1B</text>
  
  <!-- Arrow from BMP3 to receptor -->
  <path d="M 250,175 L 250,190" stroke="#00796b" stroke-width="2.5" marker-end="url(#arrowhead1)" />
  <text x="265" y="185" font-family="Arial" font-size="12" fill="#00796b" font-weight="bold">binding</text>
  
  <!-- SMAD proteins in cytoplasm -->
  <circle cx="320" cy="290" r="20" fill="#f46d43" stroke="#000000" stroke-width="2" />
  <text x="320" y="295" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SMAD2</text>
  
  <circle cx="380" cy="290" r="20" fill="#fee090" stroke="#000000" stroke-width="2" />
  <text x="380" y="295" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SMAD3</text>
  
  <!-- Arrow from receptor to SMADs -->
  <path d="M 250,230 Q 300,260 320,270" stroke="#d81b60" stroke-width="2.5" fill="none" marker-end="url(#arrowhead2)" />
  <path d="M 250,230 Q 320,260 380,270" stroke="#d81b60" stroke-width="2.5" fill="none" marker-end="url(#arrowhead2)" />
  <text x="285" y="240" font-family="Arial" font-size="12" fill="#d81b60" font-weight="bold">activation</text>
  
  <!-- SMADs in nucleus -->
  <circle cx="350" cy="380" r="20" fill="#f46d43" stroke="#000000" stroke-width="2" />
  <text x="350" y="385" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SMAD2</text>
  
  <circle cx="430" cy="380" r="20" fill="#fee090" stroke="#000000" stroke-width="2" />
  <text x="430" y="385" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SMAD3</text>
  
  <!-- Arrows from cytoplasmic SMADs to nuclear SMADs -->
  <path d="M 320,310 Q 335,345 350,360" stroke="#3949ab" stroke-width="2.5" fill="none" marker-end="url(#arrowhead3)" />
  <path d="M 380,310 Q 405,345 430,360" stroke="#3949ab" stroke-width="2.5" fill="none" marker-end="url(#arrowhead3)" />
  <text x="360" y="340" font-family="Arial" font-size="12" fill="#3949ab" font-weight="bold">translocation</text>
  
  <!-- DNA in nucleus -->
  <path d="M 320,420 Q 390,400 460,420" stroke="#000000" stroke-width="3" fill="none" />
  <text x="390" y="430" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">DNA</text>
  
  <!-- Arrow from SMADs to DNA -->
  <line x1="350" y1="400" x2="350" y2="415" stroke="#4527a0" stroke-width="2.5" marker-end="url(#arrowhead4)" />
  <line x1="430" y1="400" x2="430" y2="415" stroke="#4527a0" stroke-width="2.5" marker-end="url(#arrowhead4)" />
  <text x="390" y="410" font-family="Arial" font-size="12" fill="#4527a0" font-weight="bold">transcription activation</text>
  
  <!-- Bone formation inhibition output -->
  <path d="M 500,420 L 600,420" stroke="#b71c1c" stroke-width="2.5" marker-end="url(#arrowhead5)" />
  <rect x="520" y="390" width="140" height="50" rx="15" ry="15" fill="#d73027" stroke="#000000" stroke-width="2" />
  <text x="590" y="415" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Negative Regulation</text>
  <text x="590" y="435" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">of Ossification</text>
  
  <!-- Legend -->
  <rect x="520" y="490" width="260" height="100" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="540" y="510" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <circle cx="550" y="530" r="8" fill="#a6d854" stroke="#000000" stroke-width="1"/>
  <text x="570" y="535" font-family="Arial" font-size="12">BMP3 (Cytokine)</text>
  
  <rect x="540" y="545" width="16" height="8" fill="#fdae61" stroke="#000000" stroke-width="1" rx="2" ry="2"/>
  <text x="570" y="552" font-family="Arial" font-size="12">ACVR2B (Type II Receptor)</text>
  
  <rect x="540" y="560" width="16" height="8" fill="#abd9e9" stroke="#000000" stroke-width="1" rx="2" ry="2"/>
  <text x="570" y="567" font-family="Arial" font-size="12">ACVR1B (Type I Receptor)</text>
  
  <circle cx="550" y="580" r="8" fill="#f46d43" stroke="#000000" stroke-width="1"/>
  <text x="570" y="583" font-family="Arial" font-size="12">SMAD2 (Transcription Factor)</text>
  
  <circle cx="550" y="600" r="8" fill="#fee090" stroke="#000000" stroke-width="1"/>
  <text x="570" y="603" font-family="Arial" font-size="12">SMAD3 (Transcription Factor)</text>
  
  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowhead1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00796b" />
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d81b60" />
    </marker>
    <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3949ab" />
    </marker>
    <marker id="arrowhead4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4527a0" />
    </marker>
    <marker id="arrowhead5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b71c1c" />
    </marker>
  </defs>
</svg>