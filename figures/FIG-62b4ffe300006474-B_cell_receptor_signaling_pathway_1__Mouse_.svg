<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Cell -->
  <rect x="0" y="0" width="800" height="700" fill="#ffffff" />
  <ellipse cx="400" cy="250" rx="350" ry="200" fill="#f8f8ff" stroke="#6a6a6a" stroke-width="1" stroke-dasharray="5,3" />
  
  <!-- Cell membrane -->
  <path d="M 100 150 C 100 100, 700 100, 700 150 C 700 200, 100 200, 100 150" fill="#E6F2FF" stroke="#000000" stroke-width="2" />
  <path d="M 100 150 C 100 100, 700 100, 700 150" fill="none" stroke="#000000" stroke-width="4" stroke-dasharray="5,5" />
  
  <!-- B-cell receptor complex -->
  <rect x="320" y="120" width="160" height="60" rx="10" ry="10" fill="#FFA07A" stroke="#000000" stroke-width="2" />
  <text x="400" y="145" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">B-cell Receptor Complex</text>
  <rect x="340" y="150" width="50" height="25" rx="5" ry="5" fill="#FF8C69" stroke="#000000" stroke-width="1" />
  <text x="365" y="167" font-family="Arial" font-size="12" text-anchor="middle">CD79a</text>
  <rect x="410" y="150" width="50" height="25" rx="5" ry="5" fill="#FF8C69" stroke="#000000" stroke-width="1" />
  <text x="435" y="167" font-family="Arial" font-size="12" text-anchor="middle">CD79b</text>
  
  <!-- Syk -->
  <ellipse cx="400" cy="250" rx="50" ry="30" fill="#98FB98" stroke="#000000" stroke-width="2" />
  <text x="400" y="245" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Syk</text>
  <text x="400" y="265" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Protein tyrosine kinase</text>
  
  <!-- mSHC1 -->
  <rect x="320" y="320" width="160" height="50" rx="10" ry="10" fill="#ADD8E6" stroke="#000000" stroke-width="2" />
  <text x="400" y="340" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">mSHC1/isop52Shc</text>
  <text x="400" y="360" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Protein-macromolecule adaptor</text>
  
  <!-- Grb2 -->
  <rect x="320" y="410" width="160" height="50" rx="10" ry="10" fill="#FFFFE0" stroke="#000000" stroke-width="2" />
  <text x="400" y="430" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Grb2</text>
  <text x="400" y="450" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">GEF adaptor activity</text>
  
  <!-- Sos1/Sos2 -->
  <g>
    <rect x="220" y="500" width="160" height="50" rx="10" ry="10" fill="#D8BFD8" stroke="#000000" stroke-width="2" />
    <text x="300" y="520" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Sos1</text>
    <text x="300" y="540" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">GEF activity</text>
  </g>
  
  <g>
    <rect x="420" y="500" width="160" height="50" rx="10" ry="10" fill="#D8BFD8" stroke="#000000" stroke-width="2" />
    <text x="500" y="520" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Sos2</text>
    <text x="500" y="540" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">GEF activity</text>
  </g>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <line x1="400" y1="180" x2="400" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="400" y1="280" x2="400" y2="320" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="400" y1="370" x2="400" y2="410" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="350" y1="460" x2="300" y2="500" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="450" y1="460" x2="500" y2="500" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">B Cell Receptor Signaling Pathway (Mouse)</text>
  
  <!-- Labels -->
  <text x="160" y="150" font-family="Arial" font-size="14" text-anchor="middle">B Cell Membrane</text>
  <text x="650" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">GO:0050853</text>
  <text x="650" y="170" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">B cell receptor signaling pathway</text>
  
  <!-- Legend -->
  <rect x="100" y="580" width="600" height="100" rx="10" ry="10" fill="#f9f9f9" stroke="#000000" stroke-width="1" />
  <text x="120" y="600" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  <text x="120" y="620" font-family="Arial" font-size="12">GEF - Guanyl-nucleotide Exchange Factor</text>
  <text x="120" y="640" font-family="Arial" font-size="12">CD79a, CD79b - B cell receptor components with transmembrane signaling receptor activity</text>
  <text x="120" y="660" font-family="Arial" font-size="12">Syk - Spleen tyrosine kinase | Grb2 - Growth factor receptor-bound protein 2 | Sos1/2 - Son of sevenless homolog 1/2</text>
  <text x="400" y="680" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">All components shown are present in the GO-CAM model</text>
</svg>