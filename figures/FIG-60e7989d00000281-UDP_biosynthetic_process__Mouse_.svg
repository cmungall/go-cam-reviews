<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with slight gradient -->
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eaecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg_gradient)" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">UDP Biosynthetic Process (Mouse)</text>
  
  <!-- Cell outline -->
  <ellipse cx="400" cy="320" rx="370" ry="230" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Pathway components -->
  <!-- Metabolites are rounded rectangles, enzymes are colored ovals with protein names -->
  
  <!-- Substrate: Carbamoyl phosphate -->
  <rect x="80" y="180" width="120" height="50" rx="15" ry="15" fill="#d1e7dd" stroke="#198754" stroke-width="2" />
  <text x="140" y="210" font-family="Arial" font-size="12" text-anchor="middle">Carbamoyl phosphate</text>
  
  <!-- Enzyme 1: CAD (carbamoyl-phosphate synthase) -->
  <ellipse cx="140" y="90" rx="90" ry="35" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2" />
  <text x="140" y="90" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CAD</text>
  <text x="140" y="110" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">carbamoyl-phosphate synthase</text>
  
  <!-- Arrow -->
  <line x1="140" y1="125" x2="140" y2="179" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Metabolite: Carbamoyl-aspartate -->
  <rect x="240" y="180" width="120" height="50" rx="15" ry="15" fill="#d1e7dd" stroke="#198754" stroke-width="2" />
  <text x="300" y="210" font-family="Arial" font-size="12" text-anchor="middle">Carbamoyl-aspartate</text>
  
  <!-- Enzyme 2: CAD (aspartate carbamoyltransferase) -->
  <ellipse cx="300" y="90" rx="90" ry="35" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2" />
  <text x="300" y="90" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CAD</text>
  <text x="300" y="110" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">aspartate carbamoyltransferase</text>
  
  <!-- Arrow -->
  <line x1="200" y1="205" x2="239" y2="205" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Metabolite: Dihydroorotate -->
  <rect x="400" y="180" width="120" height="50" rx="15" ry="15" fill="#d1e7dd" stroke="#198754" stroke-width="2" />
  <text x="460" y="210" font-family="Arial" font-size="12" text-anchor="middle">Dihydroorotate</text>
  
  <!-- Enzyme 3: CAD (dihydroorotase) -->
  <ellipse cx="460" y="90" rx="90" ry="35" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2" />
  <text x="460" y="90" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CAD</text>
  <text x="460" y="110" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">dihydroorotase</text>
  
  <!-- Arrow -->
  <line x1="360" y1="205" x2="399" y2="205" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Metabolite: Orotate -->
  <rect x="400" y="280" width="120" height="50" rx="15" ry="15" fill="#d1e7dd" stroke="#198754" stroke-width="2" />
  <text x="460" y="310" font-family="Arial" font-size="12" text-anchor="middle">Orotate</text>
  
  <!-- Enzyme 4: DHODH -->
  <ellipse cx="580" y="230" rx="90" ry="35" fill="#f8d7da" stroke="#dc3545" stroke-width="2" />
  <text x="580" y="230" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">DHODH</text>
  <text x="580" y="250" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">dihydroorotate dehydrogenase</text>
  
  <!-- Arrow with curve -->
  <path d="M 520 205 Q 560 205 580 230" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 580 265 Q 540 280 520 280" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Metabolite: OMP -->
  <rect x="400" y="380" width="120" height="50" rx="15" ry="15" fill="#d1e7dd" stroke="#198754" stroke-width="2" />
  <text x="460" y="400" font-family="Arial" font-size="12" text-anchor="middle">Orotidine-5'-monophosphate</text>
  <text x="460" y="415" font-family="Arial" font-size="12" text-anchor="middle">(OMP)</text>
  
  <!-- Enzyme 5: UMPS (orotate phosphoribosyltransferase) -->
  <ellipse cx="260" y="330" rx="100" ry="35" fill="#fff3cd" stroke="#ffc107" stroke-width="2" />
  <text x="260" y="330" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">UMPS</text>
  <text x="260" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">orotate phosphoribosyltransferase</text>
  
  <!-- Arrow with curve -->
  <path d="M 400 305 Q 340 320 260 330" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 260 365 Q 300 380 399 380" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Metabolite: UMP -->
  <rect x="400" y="480" width="120" height="50" rx="15" ry="15" fill="#d1e7dd" stroke="#198754" stroke-width="2" />
  <text x="460" y="500" font-family="Arial" font-size="12" text-anchor="middle">Uridine-5'-monophosphate</text>
  <text x="460" y="515" font-family="Arial" font-size="12" text-anchor="middle">(UMP)</text>
  
  <!-- Enzyme 6: UMPS (orotidine-5'-phosphate decarboxylase) -->
  <ellipse cx="260" y="430" rx="100" ry="35" fill="#fff3cd" stroke="#ffc107" stroke-width="2" />
  <text x="260" y="430" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">UMPS</text>
  <text x="260" y="450" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">orotidine-5'-phosphate decarboxylase</text>
  
  <!-- Arrow with curve -->
  <path d="M 400 405 Q 340 405 260 430" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 260 465 Q 300 480 399 480" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- End Product: UDP -->
  <rect x="600" y="480" width="120" height="50" rx="15" ry="15" fill="#d1e7dd" stroke="#198754" stroke-width="2" />
  <text x="660" y="510" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">UDP</text>
  
  <!-- Enzyme 7: CMPK1 -->
  <ellipse cx="530" y="560" rx="90" ry="35" fill="#e2e3e5" stroke="#6c757d" stroke-width="2" />
  <text x="530" y="560" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CMPK1</text>
  <text x="530" y="580" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">UMP kinase</text>
  
  <!-- Arrow with curve -->
  <path d="M 520 505 Q 530 530 530 525" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 580 560 Q 620 540 650 530" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444" />
    </marker>
  </defs>
  
  <!-- Note about reaction location -->
  <rect x="625" y="110" width="150" height="80" rx="10" ry="10" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="700" y="130" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Cellular Compartment</text>
  <text x="700" y="150" font-family="Arial" font-size="10" text-anchor="middle">Cytoplasm</text>
  <text x="700" y="170" font-family="Arial" font-size="10" text-anchor="middle">UDP Biosynthetic Process</text>
  
  <!-- Legend -->
  <rect x="50" y="510" width="200" height="80" rx="5" ry="5" fill="white" stroke="#6c757d" stroke-width="1" />
  <text x="150" y="525" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Gene product colors -->
  <rect x="60" y="535" width="15" height="15" fill="#cfe2ff" stroke="#0d6efd" stroke-width="1" />
  <text x="170" y="547" font-family="Arial" font-size="11" text-anchor="start">CAD (carbamoyl-phosphate synthetase,</text>
  <text x="170" y="560" font-family="Arial" font-size="11" text-anchor="start">aspartate carbamoyltransferase, dihydroorotase)</text>
  
  <rect x="60" y="570" width="15" height="15" fill="#f8d7da" stroke="#dc3545" stroke-width="1" />
  <text x="170" y="580" font-family="Arial" font-size="11" text-anchor="start">DHODH (dihydroorotate dehydrogenase)</text>
  
  <rect x="260" y="535" width="15" height="15" fill="#fff3cd" stroke="#ffc107" stroke-width="1" />
  <text x="370" y="547" font-family="Arial" font-size="11" text-anchor="start">UMPS (orotate phosphoribosyltransferase,</text>
  <text x="370" y="560" font-family="Arial" font-size="11" text-anchor="start">orotidine-5'-phosphate decarboxylase)</text>
  
  <rect x="260" y="570" width="15" height="15" fill="#e2e3e5" stroke="#6c757d" stroke-width="1" />
  <text x="370" y="580" font-family="Arial" font-size="11" text-anchor="start">CMPK1 (UMP kinase)</text>
</svg>