<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">IL5-Mediated Signaling Pathway (Human)</text>
  
  <!-- Cell Compartments -->
  <!-- Extracellular Space -->
  <rect x="50" y="70" width="700" height="180" fill="#e6f7ff" stroke="#aaa" stroke-width="2" rx="5" />
  <text x="400" y="90" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Extracellular Space (GO:0005615)</text>
  
  <!-- Eosinophil Cell -->
  <rect x="100" y="250" width="600" height="320" fill="#fff" stroke="#444" stroke-width="3" rx="100" />
  <text x="400" y="270" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Eosinophil (CL:0000771)</text>
  
  <!-- Cell Membrane -->
  <rect x="100" y="250" width="600" height="15" fill="#9cd3d9" stroke="#444" stroke-width="1" rx="5" />
  <text x="170" y="261" font-family="Arial" font-size="14" text-anchor="middle">Plasma Membrane (GO:0005886)</text>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="450" rx="120" ry="80" fill="#e6e6fa" stroke="#444" stroke-width="2" />
  <text x="400" y="450" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Nucleus (GO:0005634)</text>
  
  <!-- Molecules and interactions -->
  <!-- IL5 -->
  <circle cx="300" cy="150" r="35" fill="#ff9999" stroke="#444" stroke-width="2" />
  <text x="300" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">IL5</text>
  <text x="300" y="165" font-family="Arial" font-size="12" text-anchor="middle">P05113</text>
  
  <!-- IL5RA -->
  <rect x="270" y="240" width="60" height="35" fill="#99cc99" stroke="#444" stroke-width="2" rx="5" />
  <text x="300" y="260" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">IL5RA</text>
  <text x="300" y="272" font-family="Arial" font-size="10" text-anchor="middle">Q01344</text>
  
  <!-- CSF2RB -->
  <rect x="340" y="240" width="60" height="35" fill="#99cc99" stroke="#444" stroke-width="2" rx="5" />
  <text x="370" y="260" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">CSF2RB</text>
  <text x="370" y="272" font-family="Arial" font-size="10" text-anchor="middle">P32927</text>
  
  <!-- IL5 binding to receptor -->
  <line x1="300" y1="185" x2="300" y2="240" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="250" y="210" font-family="Arial" font-size="14" text-anchor="end">Binding</text>
  
  <!-- JAK2 -->
  <rect x="270" y="310" width="60" height="30" fill="#9999ff" stroke="#444" stroke-width="2" rx="5" />
  <text x="300" y="326" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">JAK2</text>
  <text x="300" y="336" font-family="Arial" font-size="10" text-anchor="middle">O60674</text>
  
  <!-- LYN -->
  <rect x="350" y="310" width="60" height="30" fill="#9999ff" stroke="#444" stroke-width="2" rx="5" />
  <text x="380" y="326" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">LYN</text>
  <text x="380" y="336" font-family="Arial" font-size="10" text-anchor="middle">P07948</text>
  
  <!-- Receptor to kinases -->
  <line x1="300" y1="275" x2="300" y2="310" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <line x1="370" y1="275" x2="380" y2="310" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="330" y="295" font-family="Arial" font-size="14" text-anchor="middle">Activation</text>
  
  <!-- STAT5A -->
  <rect x="320" y="370" width="70" height="30" fill="#cc99ff" stroke="#444" stroke-width="2" rx="5" />
  <text x="355" y="386" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">STAT5A</text>
  <text x="355" y="396" font-family="Arial" font-size="10" text-anchor="middle">P42229</text>
  
  <!-- Phosphorylated STAT5A -->
  <rect x="400" y="420" width="80" height="30" fill="#cc99ff" stroke="#444" stroke-width="2" rx="5" />
  <text x="440" y="436" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">STAT5A-P</text>
  <text x="440" y="446" font-family="Arial" font-size="10" text-anchor="middle">P42229</text>
  
  <!-- Kinases to STAT5A -->
  <line x1="300" y1="340" x2="320" y2="370" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <line x1="380" y1="340" x2="355" y2="370" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="275" y="355" font-family="Arial" font-size="14">Phosphorylation</text>
  
  <!-- STAT5A movement -->
  <path d="M390,385 C420,395 430,410 440,420" fill="none" stroke="#228B22" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-dasharray="5,3" />
  <text x="425" y="395" font-family="Arial" font-size="14" fill="#228B22">Translocation</text>
  
  <!-- DNA -->
  <path d="M340,470 Q370,450 400,470 Q430,490 460,470 Q430,450 400,430 Q370,410 340,430 Q370,450 340,470" fill="none" stroke="#000" stroke-width="2.5" />
  <text x="400" y="490" font-family="Arial" font-size="14" text-anchor="middle">DNA</text>
  
  <!-- STAT5A to DNA -->
  <line x1="440" y1="450" x2="400" y2="460" stroke="#000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="425" y="480" font-family="Arial" font-size="14" text-anchor="middle">TF activity</text>

  <!-- Function Labels -->
  <text x="170" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Cytokine activity</text>
  <text x="320" y="225" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">IL5 receptor activity</text>
  <text x="370" y="285" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Coreceptor activity</text>
  <text x="235" y="345" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Protein tyrosine</text>
  <text x="235" y="358" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">kinase activity</text>
  <text x="525" y="430" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">DNA-binding TF activity</text>
  
  <!-- Label for the entire pathway -->
  <text x="400" y="560" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" font-weight="bold">IL5-mediated signaling pathway (GO:0038043)</text>
  
  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="80" width="140" height="160" fill="#fff" stroke="#000" stroke-width="1" rx="5" />
  <text x="670" y="100" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
  
  <circle cx="620" y="120" r="10" fill="#ff9999" stroke="#444" stroke-width="1" />
  <text x="670" y="124" font-family="Arial" font-size="14" text-anchor="middle">Cytokine</text>
  
  <rect x="610" y="140" width="20" height="12" fill="#99cc99" stroke="#444" stroke-width="1" rx="2" />
  <text x="670" y="148" font-family="Arial" font-size="14" text-anchor="middle">Receptor</text>
  
  <rect x="610" y="165" width="20" height="12" fill="#9999ff" stroke="#444" stroke-width="1" rx="2" />
  <text x="670" y="173" font-family="Arial" font-size="14" text-anchor="middle">Kinase</text>
  
  <rect x="610" y="190" width="20" height="12" fill="#cc99ff" stroke="#444" stroke-width="1" rx="2" />
  <text x="670" y="198" font-family="Arial" font-size="14" text-anchor="middle">Transcription Factor</text>
  
  <line x1="610" y1="215" x2="630" y2="215" stroke="#228B22" stroke-width="2" stroke-dasharray="5,3" />
  <text x="670" y="218" font-family="Arial" font-size="14" fill="#228B22" text-anchor="middle">Translocation</text>
</svg>