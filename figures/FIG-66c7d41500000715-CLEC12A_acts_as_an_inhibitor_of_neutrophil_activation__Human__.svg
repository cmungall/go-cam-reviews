<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell outline -->
  <ellipse cx="400" cy="350" rx="350" ry="200" fill="#f0f9ff" stroke="#7da7d9" stroke-width="3" opacity="0.8"/>
  
  <!-- Cell title -->
  <text x="400" y="530" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Neutrophil (CL:0000775)</text>
  
  <!-- Plasma membrane -->
  <path d="M 100,350 C 100,250 700,250 700,350 C 700,450 100,450 100,350" fill="none" stroke="#3273a8" stroke-width="5" stroke-dasharray="5,3"/>
  <text x="400" y="240" font-family="Arial" font-size="16" text-anchor="middle">Plasma membrane (GO:0005886)</text>
  
  <!-- CLEC12A receptor -->
  <rect x="310" y="250" width="180" height="45" rx="15" fill="#a6d854" stroke="#000" stroke-width="2"/>
  <text x="400" y="275" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CLEC12A</text>
  <text x="400" y="293" font-family="Arial" font-size="12" text-anchor="middle">(Q5QGZ9)</text>
  
  <!-- SRC -->
  <rect x="310" y="330" width="180" height="45" rx="5" fill="#fc8d62" stroke="#000" stroke-width="2"/>
  <text x="400" y="355" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">SRC</text>
  <text x="400" y="373" font-family="Arial" font-size="12" text-anchor="middle">(P12931)</text>
  
  <!-- PTPN6 (SHP-1) -->
  <rect x="160" y="400" width="180" height="45" rx="5" fill="#8da0cb" stroke="#000" stroke-width="2"/>
  <text x="250" y="425" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">PTPN6/SHP-1</text>
  <text x="250" y="443" font-family="Arial" font-size="12" text-anchor="middle">(P29350)</text>
  
  <!-- PTPN11 (SHP-2) -->
  <rect x="460" y="400" width="180" height="45" rx="5" fill="#8da0cb" stroke="#000" stroke-width="2"/>
  <text x="550" y="425" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">PTPN11/SHP-2</text>
  <text x="550" y="443" font-family="Arial" font-size="12" text-anchor="middle">(Q06124)</text>
  
  <!-- SYK -->
  <rect x="310" y="470" width="180" height="45" rx="5" fill="#fc8d62" stroke="#000" stroke-width="2"/>
  <text x="400" y="495" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">SYK</text>
  <text x="400" y="513" font-family="Arial" font-size="12" text-anchor="middle">(P43405)</text>
  
  <!-- Activity labels -->
  <text x="400" y="315" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">transmembrane signaling receptor activity</text>
  <text x="400" y="390" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">protein tyrosine kinase activity</text>
  <text x="250" y="460" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">protein tyrosine phosphatase activity</text>
  <text x="550" y="460" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">protein tyrosine phosphatase activity</text>
  <text x="400" y="530" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">protein tyrosine kinase activity</text>
  
  <!-- Arrows for connections -->
  <!-- CLEC12A to SRC (inhibitory) -->
  <line x1="400" y1="295" x2="400" y2="330" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#inhibitArrow)"/>
  
  <!-- SRC to PTPN6 (activating) -->
  <path d="M 345,375 C 310,380 290,390 270,400" stroke="#1976d2" stroke-width="3" fill="none" marker-end="url(#activateArrow)"/>
  
  <!-- SRC to PTPN11 (activating) -->
  <path d="M 455,375 C 490,380 510,390 530,400" stroke="#1976d2" stroke-width="3" fill="none" marker-end="url(#activateArrow)"/>
  
  <!-- PTPN6 to SYK (inhibitory) -->
  <path d="M 270,445 C 300,455 320,460 345,470" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,3" fill="none" marker-end="url(#inhibitArrow)"/>
  
  <!-- PTPN11 to SYK (inhibitory) -->
  <path d="M 530,445 C 500,455 480,460 455,470" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,3" fill="none" marker-end="url(#inhibitArrow)"/>
  
  <!-- Arrowhead markers -->
  <defs>
    <marker id="activateArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12 2,6" fill="#1976d2"/>
    </marker>
    <marker id="inhibitArrow" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#d32f2f" stroke-width="2"/>
      <polygon points="0,0 12,6 0,12 2,6" fill="#d32f2f"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="620" y="60" width="160" height="170" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <text x="700" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
  
  <!-- Legend items -->
  <rect x="630" y="90" width="25" height="15" fill="#a6d854" stroke="#000" stroke-width="1"/>
  <text x="660" y="102" font-family="Arial" font-size="13" text-anchor="start">Receptor</text>
  
  <rect x="630" y="115" width="25" height="15" fill="#fc8d62" stroke="#000" stroke-width="1"/>
  <text x="660" y="127" font-family="Arial" font-size="13" text-anchor="start">Kinase</text>
  
  <rect x="630" y="140" width="25" height="15" fill="#8da0cb" stroke="#000" stroke-width="1"/>
  <text x="660" y="152" font-family="Arial" font-size="13" text-anchor="start">Phosphatase</text>
  
  <line x1="630" y1="170" x2="655" y2="170" stroke="#1976d2" stroke-width="3" marker-end="url(#activateArrow)"/>
  <text x="660" y="175" font-family="Arial" font-size="13" text-anchor="start">Activation</text>
  
  <line x1="630" y1="195" x2="655" y2="195" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#inhibitArrow)"/>
  <text x="660" y="200" font-family="Arial" font-size="13" text-anchor="start">Inhibition</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">CLEC12A Acts as an Inhibitor of Neutrophil Activation</text>
  
  <!-- Process labels -->
  <text x="400" y="570" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic" fill="#d81b60">Negative regulation of neutrophil activation (GO:1902564)</text>
  <text x="180" y="100" font-family="Arial" font-size="16" text-anchor="start" font-style="italic" fill="#1b5e20">Neutrophil activation involved in immune response (GO:0002283)</text>
</svg>