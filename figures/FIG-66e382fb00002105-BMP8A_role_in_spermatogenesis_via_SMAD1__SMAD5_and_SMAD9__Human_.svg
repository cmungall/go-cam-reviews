<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and cell outline -->
  <rect width="800" height="600" fill="#f9f9f9" />
  <ellipse cx="400" cy="350" rx="350" ry="220" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" opacity="0.6" />
  
  <!-- Cell compartments -->
  <rect x="100" y="50" width="600" height="120" rx="20" ry="20" fill="#F2F7FA" stroke="#6699cc" stroke-width="2" opacity="0.8" />
  <text x="400" y="100" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Extracellular Space</text>
  
  <ellipse cx="400" cy="350" rx="280" ry="170" fill="#ddf0dd" stroke="#339933" stroke-width="2" stroke-dasharray="5,3" opacity="0.6" />
  <text x="180" y="250" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Plasma Membrane</text>
  
  <ellipse cx="400" cy="380" rx="150" ry="100" fill="#ffd6cc" stroke="#cc6600" stroke-width="2" opacity="0.7" />
  <text x="400" y="380" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Nucleus</text>
  
  <!-- Molecules and interactions -->
  <!-- BMP8A in extracellular space -->
  <circle cx="400" cy="140" r="25" fill="#ff9966" stroke="#cc6600" stroke-width="2" />
  <text x="400" y="145" font-family="Arial" font-size="14" text-anchor="middle" fill="white">BMP8A</text>
  <text x="400" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">(Q7Z5Y6)</text>
  
  <!-- BMPR2 receptor -->
  <rect x="360" y="240" width="50" height="30" rx="5" ry="5" fill="#6699cc" stroke="#003366" stroke-width="2" />
  <text x="385" y="260" font-family="Arial" font-size="12" text-anchor="middle" fill="white">BMPR2</text>
  <text x="385" y="275" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(Q13873)</text>
  
  <!-- BMPR1A receptor -->
  <rect x="420" y="240" width="50" height="30" rx="5" ry="5" fill="#6699cc" stroke="#003366" stroke-width="2" />
  <text x="445" y="260" font-family="Arial" font-size="12" text-anchor="middle" fill="white">BMPR1A</text>
  <text x="445" y="275" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(P36894)</text>
  
  <!-- SMAD proteins -->
  <polygon points="350,310 370,310 360,330" fill="#9933cc" stroke="#660099" stroke-width="2" />
  <text x="360" y="325" font-family="Arial" font-size="10" text-anchor="middle" fill="white">SMAD1</text>
  <text x="360" y="340" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(Q15797)</text>
  
  <polygon points="390,310 410,310 400,330" fill="#9933cc" stroke="#660099" stroke-width="2" />
  <text x="400" y="325" font-family="Arial" font-size="10" text-anchor="middle" fill="white">SMAD5</text>
  <text x="400" y="340" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(Q99717)</text>
  
  <polygon points="430,310 450,310 440,330" fill="#9933cc" stroke="#660099" stroke-width="2" />
  <text x="440" y="325" font-family="Arial" font-size="10" text-anchor="middle" fill="white">SMAD9</text>
  <text x="440" y="340" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(O15198)</text>
  
  <!-- Transcription activity in nucleus -->
  <polygon points="360,380 380,380 390,400 350,400" fill="#cc66cc" stroke="#993399" stroke-width="2" />
  <text x="370" y="395" font-family="Arial" font-size="10" text-anchor="middle" fill="white">SMAD1</text>
  
  <polygon points="400,380 420,380 430,400 390,400" fill="#cc66cc" stroke="#993399" stroke-width="2" />
  <text x="410" y="395" font-family="Arial" font-size="10" text-anchor="middle" fill="white">SMAD5</text>
  
  <polygon points="440,380 460,380 470,400 430,400" fill="#cc66cc" stroke="#993399" stroke-width="2" />
  <text x="450" y="395" font-family="Arial" font-size="10" text-anchor="middle" fill="white">SMAD9</text>
  
  <!-- DNA binding representation -->
  <path d="M 320 430 C 350 420, 380 440, 410 430 C 440 420, 470 440, 500 430" stroke="#333333" stroke-width="3" fill="none" />
  <path d="M 320 440 C 350 430, 380 450, 410 440 C 440 430, 470 450, 500 440" stroke="#333333" stroke-width="3" fill="none" />
  
  <!-- Arrows for signaling cascade -->
  <line x1="400" y1="165" x2="400" y2="235" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="390" y1="270" x2="390" y2="305" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="365" y1="340" x2="365" y2="375" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="400" y1="340" x2="400" y2="375" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="440" y1="340" x2="440" y2="375" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Title and labels -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">BMP8A Role in Spermatogenesis via SMAD Signaling</text>
  <text x="400" y="490" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Transcriptional Regulation of Spermatogenesis</text>
  
  <text x="650" y="570" font-family="Arial" font-size="14" fill="#666">Human (Homo sapiens)</text>
  
  <!-- Cell type label -->
  <text x="150" y="500" font-family="Arial" font-size="16" font-style="italic" fill="#333">Spermatocyte</text>
  
  <!-- Process annotations -->
  <text x="150" y="200" font-family="Arial" font-size="12" fill="#555">Cytokine Activity</text>
  <text x="600" y="260" font-family="Arial" font-size="12" fill="#555">BMP Signaling Pathway</text>
  <text x="600" y="400" font-family="Arial" font-size="12" fill="#555">DNA-binding TF Activity</text>
  
  <!-- Legend box -->
  <rect x="580" y="480" width="200" height="120" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1" opacity="0.9" />
  <text x="680" y="500" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <!-- Legend items -->
  <circle cx="600" y="520" r="6" fill="#ff9966" stroke="#cc6600" stroke-width="1" />
  <text x="615" y="524" font-family="Arial" font-size="12" fill="#333">Cytokine</text>
  
  <rect x="600" y="535" width="12" height="8" rx="2" ry="2" fill="#6699cc" stroke="#003366" stroke-width="1" />
  <text x="620" y="542" font-family="Arial" font-size="12" fill="#333">Receptor</text>
  
  <polygon points="596,555 604,555 600,563" fill="#9933cc" stroke="#660099" stroke-width="1" />
  <text x="620" y="560" font-family="Arial" font-size="12" fill="#333">SMAD Protein</text>
  
  <line x1="590" y1="575" x2="610" y2="575" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="630" y="578" font-family="Arial" font-size="12" fill="#333">Signaling Direction</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
</svg>