<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#ffffff" />
    
    <!-- Cellular Compartments -->
    <!-- Extracellular Space -->
    <rect x="50" y="50" width="700" height="150" fill="#e6f7ff" stroke="#000000" stroke-width="1" />
    <text x="60" y="75" font-family="Arial" font-size="16" font-weight="bold">Extracellular Space (GO:0005615)</text>
    
    <!-- Plasma Membrane -->
    <rect x="50" y="200" width="700" height="100" fill="#ffe6cc" stroke="#000000" stroke-width="2" />
    <text x="60" y="225" font-family="Arial" font-size="16" font-weight="bold">Plasma Membrane (GO:0005886)</text>
    
    <!-- Cytosol -->
    <rect x="50" y="300" width="700" height="250" fill="#e6ffe6" stroke="#000000" stroke-width="1" />
    <text x="60" y="325" font-family="Arial" font-size="16" font-weight="bold">Cytosol (GO:0005829)</text>
    
    <!-- ADM Hormone -->
    <circle cx="200" cy="125" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
    <text x="200" y="125" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle">ADM</text>
    <text x="200" y="145" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">(P35318)</text>
    <text x="200" y="165" font-family="Arial" font-size="9" font-style="italic" text-anchor="middle">Hormone activity</text>
    
    <!-- CALCRL-RAMP2 Receptor Complex -->
    <rect x="350" y="200" width="160" height="80" rx="10" ry="10" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
    <line x1="410" y1="200" x2="410" y2="280" stroke="#000000" stroke-width="1" stroke-dasharray="4" />
    <text x="370" y="230" font-family="Arial" font-size="14" text-anchor="middle">CALCRL</text>
    <text x="370" y="245" font-family="Arial" font-size="10" text-anchor="middle">(Q16602)</text>
    <text x="370" y="260" font-family="Arial" font-size="9" font-style="italic" text-anchor="middle">Receptor</text>
    
    <text x="450" y="230" font-family="Arial" font-size="14" text-anchor="middle">RAMP2</text>
    <text x="450" y="245" font-family="Arial" font-size="10" text-anchor="middle">(O60895)</text>
    <text x="450" y="260" font-family="Arial" font-size="9" font-style="italic" text-anchor="middle">Coreceptor</text>
    
    <!-- G Protein -->
    <polygon points="430,370 400,410 430,450 460,410" fill="#cc99ff" stroke="#6600cc" stroke-width="2" />
    <text x="430" y="410" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle">GNAS</text>
    <text x="430" y="425" font-family="Arial" font-size="10" text-anchor="middle">(Q5JWF2)</text>
    <text x="430" y="460" font-family="Arial" font-size="9" font-style="italic" text-anchor="middle">G protein activity</text>
    
    <!-- Adenylate Cyclase -->
    <rect x="570" y="390" width="120" height="60" rx="30" ry="30" fill="#99ff99" stroke="#009900" stroke-width="2" />
    <text x="630" y="415" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle">ADCY6</text>
    <text x="630" y="430" font-family="Arial" font-size="10" text-anchor="middle">(O43306)</text>
    <text x="630" y="465" font-family="Arial" font-size="9" font-style="italic" text-anchor="middle">Adenylate cyclase</text>
    
    <!-- cAMP -->
    <circle cx="630" y="510" r="20" fill="#ffff99" stroke="#999900" stroke-width="2" />
    <text x="630" y="510" font-family="Arial" font-size="14" text-anchor="middle" dominant-baseline="middle">cAMP</text>
    <text x="630" y="530" font-family="Arial" font-size="9" font-style="italic" text-anchor="middle">(CHEBI:17489)</text>
    
    <!-- Pathway Arrows -->
    <!-- ADM to Receptor -->
    <path d="M 230,125 Q 290,125 350,210" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- Receptor to G Protein -->
    <path d="M 430,280 Q 430,325 430,370" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- G Protein to Adenylate Cyclase -->
    <path d="M 460,410 Q 515,410 570,410" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- Adenylate Cyclase to cAMP -->
    <path d="M 630,450 Q 630,480 630,490" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- Arrowhead Marker -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
        </marker>
    </defs>
    
    <!-- Compact Pathway Labels -->
    <text x="290" y="110" font-family="Arial" font-size="12" text-anchor="middle">Hormone activity</text>
    <text x="430" y="330" font-family="Arial" font-size="12" text-anchor="middle">Receptor activity</text>
    <text x="515" y="390" font-family="Arial" font-size="12" text-anchor="middle">G protein activity</text>
    
    <!-- Pathway Title -->
    <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Adrenomedullin Signaling Pathway</text>
    
    <!-- Process Labels - Simplified -->
    <text x="650" y="355" font-family="Arial" font-size="12" font-style="italic">Adenylate cyclase-activating GPCR</text>
    <text x="650" y="370" font-family="Arial" font-size="12" font-style="italic">signaling (GO:0007189)</text>
    
    <text x="200" y="190" font-family="Arial" font-size="12" font-style="italic">Adrenomedullin receptor signaling (GO:1990410)</text>
    
    <!-- Legend -->
    <rect x="60" y="520" width="300" height="60" fill="#f0f0f0" stroke="#000000" stroke-width="1" rx="5" ry="5" />
    <text x="70" y="535" font-family="Arial" font-size="14" font-weight="bold">Pathway Legend:</text>
    <text x="70" y="555" font-family="Arial" font-size="13">ADM activates CALCRL-RAMP2 → G protein → Adenylate cyclase → cAMP</text>
    <text x="70" y="570" font-family="Arial" font-size="13">All components shown are from the source GO-CAM model</text>
</svg>