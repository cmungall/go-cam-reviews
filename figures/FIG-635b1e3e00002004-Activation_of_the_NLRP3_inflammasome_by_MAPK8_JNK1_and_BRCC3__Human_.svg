<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <rect x="50" y="50" width="700" height="500" rx="100" ry="100" fill="#f9f9f9" stroke="#888888" stroke-width="2" />
  <path d="M 50 150 Q 400 190, 750 150" stroke="#888888" stroke-width="2" fill="none" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Activation of the NLRP3 Inflammasome by MAPK8/JNK1 and BRCC3 (Human)</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="125" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle">Cytoplasm</text>
  
  <!-- Microtubule organizing center (MTOC) -->
  <ellipse cx="250" cy="320" rx="100" ry="70" fill="#e6f2ff" stroke="#4682B4" stroke-width="2" />
  <text x="250" y="320" font-family="Arial" font-size="14" text-anchor="middle">Microtubule</text>
  <text x="250" y="340" font-family="Arial" font-size="14" text-anchor="middle">Organizing Center</text>
  
  <!-- Membrane region -->
  <rect x="100" y="130" width="600" height="60" rx="10" ry="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
  <text x="400" y="165" font-family="Arial" font-size="14" text-anchor="middle">Membrane</text>
  
  <!-- MAPK8/JNK1 (enzyme - rectangle with rounded corners) -->
  <rect x="120" y="220" width="60" height="40" rx="10" ry="10" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="150" y="242" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">MAPK8/</text>
  <text x="150" y="255" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">JNK1</text>
  
  <!-- BRCC3 (enzyme - rectangle with rounded corners) -->
  <rect x="220" y="220" width="60" height="40" rx="10" ry="10" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
  <text x="250" y="245" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">BRCC3</text>
  
  <!-- NLRP3 at MTOC (scaffold protein - oval) -->
  <ellipse cx="350" cy="320" rx="40" ry="30" fill="#99ff99" stroke="#009900" stroke-width="2" />
  <text x="350" y="325" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">NLRP3</text>
  
  <!-- NLRP3 at membrane (scaffold protein - oval) -->
  <ellipse cx="500" cy="165" rx="40" ry="25" fill="#99ff99" stroke="#009900" stroke-width="2" />
  <text x="500" y="170" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">NLRP3</text>
  
  <!-- NLRP3 inflammasome complex (complex shape) -->
  <path d="M 600,290 
           a 40,30 0 1,1 0,60 
           a 40,30 0 1,1 0,-60
           z" fill="#ffcc99" stroke="#ff9933" stroke-width="3" />
  <ellipse cx="585" cy="310" rx="15" ry="15" fill="#99ff99" stroke="#009900" stroke-width="1.5" />
  <text x="585" y="315" font-family="Arial" font-size="10" text-anchor="middle">NLRP3</text>
  <ellipse cx="615" cy="310" rx="15" ry="15" fill="#ffaa77" stroke="#ff7733" stroke-width="1.5" />
  <text x="615" y="315" font-family="Arial" font-size="10" text-anchor="middle">ASC</text>
  <text x="600" y="345" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Inflammasome</text>
  <text x="600" y="365" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">(ASC not in source model)</text>
  
  <!-- Reaction arrows and labels -->
  <!-- MAPK8 to BRCC3 -->
  <line x1="180" y1="240" x2="220" y2="240" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="200" y="230" font-family="Arial" font-size="12" text-anchor="middle">Phosphorylates</text>
  
  <!-- BRCC3 to NLRP3 at MTOC -->
  <line x1="275" y1="255" x2="325" y2="305" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="315" y="275" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-45, 315, 275)">K63-deubiquitinates</text>
  
  <!-- NLRP3 at MTOC to NLRP3 at membrane -->
  <line x1="385" y1="305" x2="470" y2="185" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="430" y="250" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-25, 430, 250)">Signaling adaptor</text>
  <text x="440" y="265" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-25, 440, 265)">activity</text>
  
  <!-- NLRP3 at membrane to NLRP3 inflammasome complex -->
  <line x1="535" y1="175" x2="580" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="560" y="230" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-55, 560, 230)">PI4P binding</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="450" width="700" height="100" rx="5" ry="5" fill="#f0f0f0" stroke="#888888" stroke-width="1" />
  <text x="60" y="470" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <rect x="60" y="480" width="20" height="15" rx="5" ry="5" fill="#ff9999" stroke="#cc0000" stroke-width="2" />
  <text x="85" y="492" font-family="Arial" font-size="12">MAPK8/JNK1 (P45983) - Protein serine/threonine kinase activity</text>
  
  <rect x="60" y="505" width="20" height="15" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2" />
  <text x="85" y="517" font-family="Arial" font-size="12">BRCC3 (P46736) - K63-linked deubiquitinase activity</text>
  
  <ellipse cx="70" cy="535" rx="15" ry="10" fill="#99ff99" stroke="#009900" stroke-width="2" />
  <text x="95" y="538" font-family="Arial" font-size="12">NLRP3 (Q96P20) - Signaling adaptor and PI4P binding activities</text>
  
  <path d="M 400,535 
           a 20,15 0 1,1 0,0.1 
           z" fill="#ffcc99" stroke="#ff9933" stroke-width="2" />
  <text x="425" y="538" font-family="Arial" font-size="12">NLRP3 Inflammasome Complex - Assembly outcome</text>
  
  <text x="420" y="517" font-family="Arial" font-size="12">PI4P = Phosphatidylinositol-4-phosphate</text>
  
  <text x="60" y="560" font-family="Arial" font-size="10" font-style="italic">Note: ASC (PYCARD) is shown in the inflammasome complex for clarity but is not explicitly in the GO-CAM source model</text>
</svg>