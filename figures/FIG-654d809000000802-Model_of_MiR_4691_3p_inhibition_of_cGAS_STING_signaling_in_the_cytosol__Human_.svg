<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f8f8" stroke="#666" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="200" cy="150" rx="100" ry="80" fill="#e6f3fa" stroke="#666" stroke-width="2"/>
  <text x="200" y="150" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Nucleus</text>
  
  <!-- ER membrane -->
  <path d="M300,300 Q400,250 500,300 Q600,350 700,300" fill="none" stroke="#ff9980" stroke-width="4"/>
  <text x="500" y="270" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ER membrane</text>
  
  <!-- ER-Golgi intermediate compartment membrane -->
  <path d="M350,350 Q450,320 550,350 Q650,380 750,350" fill="none" stroke="#ffcc99" stroke-width="4"/>
  <text x="550" y="390" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ER-Golgi intermediate compartment</text>
  
  <!-- Cytosol label -->
  <text x="400" y="100" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Cytosol</text>
  
  <!-- cGAS-DNA interaction -->
  <circle cx="300" cy="200" r="25" fill="#b3d9ff" stroke="#333" stroke-width="2"/>
  <text x="300" y="205" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">cGAS</text>
  
  <!-- DNA -->
  <path d="M240,180 Q270,160 300,180 Q330,200 360,180" fill="none" stroke="#333" stroke-width="3"/>
  <text x="240" y="170" font-family="Arial" font-size="12" text-anchor="middle">dsDNA</text>
  
  <!-- cGAS activity -->
  <ellipse cx="370" cy="220" rx="20" ry="15" fill="#ffd480" stroke="#333" stroke-width="1.5"/>
  <text x="370" y="224" font-family="Arial" font-size="11" text-anchor="middle">cGAMP</text>
  
  <!-- Arrow from cGAS to cGAMP -->
  <path d="M325,210 L355,218" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- STING in ER membrane -->
  <rect x="450" cy="300" width="50" height="30" fill="#99cc99" stroke="#333" stroke-width="2" y="285"/>
  <text x="475" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">STING1</text>
  
  <!-- Arrow from cGAMP to STING -->
  <path d="M385,225 Q410,250 440,290" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="410" y="245" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">binding</text>
  
  <!-- STING in ERGIC -->
  <rect x="500" y="335" width="50" height="30" fill="#99cc99" stroke="#333" stroke-width="2"/>
  <text x="525" y="355" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">STING1</text>
  
  <!-- Arrow from STING ER to STING ERGIC -->
  <path d="M485,315 L500,335" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="500" y="330" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">translocation</text>
  
  <!-- TBK1 -->
  <rect x="600" y="335" width="50" height="30" fill="#ff99cc" stroke="#333" stroke-width="2"/>
  <text x="625" y="355" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TBK1</text>
  
  <!-- Arrow from STING to TBK1 -->
  <path d="M550,350 L600,350" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="575" y="345" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">activates</text>
  
  <!-- IRF3 -->
  <circle cx="650" cy="400" r="25" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="650" y="405" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IRF3</text>
  
  <!-- Arrow from TBK1 to IRF3 -->
  <path d="M625,365 L650,375" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="630" y="380" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">phosphorylates</text>
  
  <!-- IRF3 in nucleus -->
  <circle cx="250" cy="150" r="25" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="250" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IRF3</text>
  
  <!-- Arrow from IRF3 to nucleus -->
  <path d="M625,400 Q500,450 300,200" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="500" y="440" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">translocation</text>
  
  <!-- NF-κB complex -->
  <circle cx="150" cy="150" r="25" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="150" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">NF-κB</text>
  
  <!-- Arrow from STING to NF-κB -->
  <path d="M500,350 Q300,450 150,175" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="300" y="420" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">activates</text>
  
  <!-- miR-4691-3p -->
  <polygon points="150,250 130,280 170,280" fill="#ffff99" stroke="#333" stroke-width="2"/>
  <text x="150" y="270" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">miR-4691-3p</text>
  
  <!-- Inhibition arrow from miR to STING -->
  <path d="M170,270 Q300,290 450,300" fill="none" stroke="#ff3333" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#inhibition)"/>
  <text x="300" y="275" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#ff3333">INHIBITS</text>
  
  <!-- Legend -->
  <rect x="560" y="100" width="160" height="150" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="640" y="120" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="580" cy="140" r="8" fill="#b3d9ff"/>
  <text x="640" y="144" font-family="Arial" font-size="12" text-anchor="start">cGAS (DNA binding)</text>
  
  <rect x="572" y="155" width="16" height="10" fill="#99cc99"/>
  <text x="640" y="164" font-family="Arial" font-size="12" text-anchor="start">STING1 (cGAMP binding)</text>
  
  <rect x="572" y="175" width="16" height="10" fill="#ff99cc"/>
  <text x="640" y="184" font-family="Arial" font-size="12" text-anchor="start">TBK1 (kinase)</text>
  
  <circle cx="580" cy="195" r="8" fill="#cc99ff"/>
  <text x="640" y="199" font-family="Arial" font-size="12" text-anchor="start">IRF3 (TF)</text>
  
  <circle cx="580" cy="215" r="8" fill="#ffcc99"/>
  <text x="640" y="219" font-family="Arial" font-size="12" text-anchor="start">NF-κB (TF)</text>
  
  <polygon points="580,235 575,245 585,245" fill="#ffff99"/>
  <text x="640" y="239" font-family="Arial" font-size="12" text-anchor="start">miR-4691-3p (inhibitor)</text>
  
  <text x="400" y="530" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic" font-weight="bold">MiR-4691-3p inhibition of cGAS-STING signaling in the cytosol</text>
  
  <!-- Flow directions -->
  <path d="M150,180 L150,200" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M250,180 L250,200" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="180" y="195" font-family="Arial" font-size="12" text-anchor="middle">Gene expression</text>
  
  <!-- Arrow heads definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="inhibition" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <line x1="0" y1="0" x2="12" y2="12" stroke="#ff3333" stroke-width="2.5"/>
      <line x1="0" y1="12" x2="12" y2="0" stroke="#ff3333" stroke-width="2.5"/>
    </marker>
  </defs>
</svg>