<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
    <!-- Background - Hypodermis Cell -->
    <rect x="50" y="50" width="700" height="540" rx="20" ry="20" fill="#f4f4f9" stroke="#333" stroke-width="2"/>
    <text x="400" y="85" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">C. elegans Hypodermis</text>
    
    <!-- Cell membrane -->
    <path d="M 50,150 H 750" stroke="#333" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="70" y="140" font-family="Arial" font-size="14">Cell membrane</text>
    
    <!-- Extracellular space -->
    <text x="400" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Extracellular space (Fungal interaction)</text>
    
    <!-- Initial signal - Fungal detection -->
    <path d="M 150,100 L 150,140" stroke="#ff6b6b" stroke-width="3" marker-end="url(#arrowhead)"/>
    <rect x="80" y="90" width="110" height="25" fill="#ffffff" stroke="none" rx="5" ry="5" fill-opacity="0.8"/>
    <text x="135" y="110" font-family="Arial" font-size="16" fill="#ff6b6b" font-weight="bold" text-anchor="middle">Fungal signal</text>
    
    <!-- G protein complex -->
    <rect x="120" y="160" width="60" height="40" rx="10" ry="10" fill="#c8e6c9" stroke="#333" stroke-width="2"/>
    <text x="150" y="185" font-family="Arial" font-size="14" text-anchor="middle">GPA-12</text>
    
    <!-- Adaptor proteins -->
    <rect x="220" y="160" width="60" height="40" rx="10" ry="10" fill="#c8e6c9" stroke="#333" stroke-width="2"/>
    <text x="250" y="185" font-family="Arial" font-size="14" text-anchor="middle">RACK-1</text>
    
    <rect x="320" y="160" width="60" height="40" rx="10" ry="10" fill="#c8e6c9" stroke="#333" stroke-width="2"/>
    <text x="350" y="185" font-family="Arial" font-size="14" text-anchor="middle">PKC-3</text>
    
    <!-- PLC proteins -->
    <rect x="120" y="240" width="60" height="40" rx="10" ry="10" fill="#bbdefb" stroke="#333" stroke-width="2"/>
    <text x="150" y="265" font-family="Arial" font-size="14" text-anchor="middle">PLC-3</text>
    
    <rect x="220" y="240" width="60" height="40" rx="10" ry="10" fill="#bbdefb" stroke="#333" stroke-width="2"/>
    <text x="250" y="265" font-family="Arial" font-size="14" text-anchor="middle">EGL-8</text>
    
    <!-- TPA -->
    <rect x="320" y="240" width="60" height="40" rx="10" ry="10" fill="#ffcc80" stroke="#333" stroke-width="2"/>
    <text x="350" y="265" font-family="Arial" font-size="14" text-anchor="middle">TPA-1</text>
    
    <!-- MAPK Cascade components -->
    <rect x="220" y="320" width="60" height="40" rx="10" ry="10" fill="#d1c4e9" stroke="#333" stroke-width="2"/>
    <text x="250" y="345" font-family="Arial" font-size="14" text-anchor="middle">TIR-1</text>
    
    <!-- NSY-1 (MAPKKK) -->
    <rect x="220" y="400" width="60" height="40" rx="10" ry="10" fill="#e1bee7" stroke="#333" stroke-width="2"/>
    <text x="250" y="425" font-family="Arial" font-size="14" text-anchor="middle">NSY-1</text>
    
    <!-- SEK-1 (MAPKK) -->
    <rect x="320" y="400" width="60" height="40" rx="10" ry="10" fill="#e1bee7" stroke="#333" stroke-width="2"/>
    <text x="350" y="425" font-family="Arial" font-size="14" text-anchor="middle">SEK-1</text>
    
    <!-- PMK-1 (MAPK) -->
    <rect x="420" y="400" width="60" height="40" rx="10" ry="10" fill="#e1bee7" stroke="#333" stroke-width="2"/>
    <text x="450" y="425" font-family="Arial" font-size="14" text-anchor="middle">PMK-1</text>
    
    <!-- Effector -->
    <ellipse cx="450" cy="480" rx="80" ry="40" fill="#ffcdd2" stroke="#333" stroke-width="2"/>
    <text x="450" y="485" font-family="Arial" font-size="14" text-anchor="middle">NLP-29 antimicrobial peptide</text>
    
    <!-- Arrows -->
    <!-- Define arrowhead marker -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
        </marker>
    </defs>
    
    <!-- Connecting arrows -->
    <path d="M 150,200 L 150,240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 250,200 L 250,240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 350,200 L 350,240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <path d="M 180,180 L 220,180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 280,180 L 320,180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <path d="M 180,260 L 220,260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 280,260 L 320,260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <path d="M 350,280 L 350,300 L 250,300 L 250,320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <path d="M 250,360 L 250,400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 280,420 L 320,420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 380,420 L 420,420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 450,440 L 450,460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- MAPK cascade label -->
    <rect x="470" y="370" width="140" height="70" fill="#f8f8f8" stroke="#333" stroke-width="1" rx="10" ry="10" fill-opacity="0.9"/>
    <text x="540" y="405" font-family="Arial" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">MAPK Cascade</text>
    
    <!-- Final output - Antifungal response -->
    <rect x="500" y="460" width="230" height="40" fill="#f8f8f8" stroke="#333" stroke-width="1" rx="10" ry="10" fill-opacity="0.9"/>
    <text x="615" y="485" font-family="Arial" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">Antifungal Immune Response</text>
    
    <!-- Title -->
    <text x="400" y="35" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Antifungal Innate Immune Response via MAPK Cascade</text>
    
    <!-- Legend -->
    <rect x="50" y="600" width="700" height="40" fill="#f8f8f8" stroke="#333" stroke-width="1" rx="5" ry="5"/>
    <rect x="60" y="610" width="20" height="20" fill="#c8e6c9" stroke="#333" stroke-width="1"/>
    <text x="85" y="625" font-family="Arial" font-size="12">Membrane/Receptor proteins</text>
    
    <rect x="210" y="610" width="20" height="20" fill="#bbdefb" stroke="#333" stroke-width="1"/>
    <text x="235" y="625" font-family="Arial" font-size="12">Phospholipases</text>
    
    <rect x="320" y="610" width="20" height="20" fill="#ffcc80" stroke="#333" stroke-width="1"/>
    <text x="345" y="625" font-family="Arial" font-size="12">Adaptor proteins</text>
    
    <rect x="440" y="610" width="20" height="20" fill="#e1bee7" stroke="#333" stroke-width="1"/>
    <text x="465" y="625" font-family="Arial" font-size="12">MAPK components</text>
    
    <rect x="570" y="610" width="20" height="20" fill="#ffcdd2" stroke="#333" stroke-width="1"/>
    <text x="595" y="625" font-family="Arial" font-size="12">Effector proteins</text>
    
    <!-- Summary box -->
    <rect x="50" y="520" width="700" height="70" fill="#f8f8f8" stroke="#333" stroke-width="1" rx="10" ry="10"/>
    <text x="400" y="540" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Pathway Summary</text>
    <text x="400" y="560" font-family="Arial" font-size="12" text-anchor="middle">Fungal signals trigger a cascade through GPA-12 and membrane proteins, activating phospholipases,</text>
    <text x="400" y="575" font-family="Arial" font-size="12" text-anchor="middle">which leads to TIR-1 activation and the MAPK cascade (NSY-1 → SEK-1 → PMK-1), ultimately inducing</text>
    <text x="400" y="590" font-family="Arial" font-size="12" text-anchor="middle">NLP-29 antimicrobial peptide expression as part of the C. elegans antifungal immune response.</text>
</svg>