<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle grid -->
  <rect width="800" height="700" fill="#ffffff" />
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
  </pattern>
  <rect width="800" height="700" fill="url(#grid)" />
  
  <!-- Cell-like background -->
  <ellipse cx="400" cy="350" rx="380" ry="300" fill="#f9f9ff" stroke="#ccccdd" stroke-width="2" stroke-dasharray="5,3" opacity="0.7" />
  
  <!-- Title and Subtitle -->
  <text x="400" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333333">GMP Salvage Pathway in Mouse</text>
  <text x="400" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#555555">From Adenosine to GMP</text>
  
  <!-- Metabolites (hexagons) -->
  <polygon points="140,160 170,180 170,220 140,240 110,220 110,180" fill="#e1f0fa" stroke="#3498db" stroke-width="2" />
  <text x="140" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Adenosine</text>
  
  <polygon points="300,160 330,180 330,220 300,240 270,220 270,180" fill="#e1f0fa" stroke="#3498db" stroke-width="2" />
  <text x="300" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">AMP</text>
  
  <polygon points="460,160 490,180 490,220 460,240 430,220 430,180" fill="#e1f0fa" stroke="#3498db" stroke-width="2" />
  <text x="460" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">IMP</text>
  
  <polygon points="620,160 650,180 650,220 620,240 590,220 590,180" fill="#e1f0fa" stroke="#3498db" stroke-width="2" />
  <text x="620" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">XMP</text>
  
  <polygon points="620,360 650,380 650,420 620,440 590,420 590,380" fill="#e1f0fa" stroke="#3498db" stroke-width="2" />
  <text x="620" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">GMP</text>
  
  <!-- Reaction arrows with chemical details -->
  <line x1="175" y1="200" x2="265" y2="200" stroke="#555555" stroke-width="2.5" />
  <polygon points="260,195 270,200 260,205" fill="#555555" />
  <text x="220" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#777777">+ ATP</text>
  
  <line x1="335" y1="200" x2="425" y2="200" stroke="#555555" stroke-width="2.5" />
  <polygon points="420,195 430,200 420,205" fill="#555555" />
  <text x="380" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#777777">- NH₃</text>
  
  <line x1="495" y1="200" x2="585" y2="200" stroke="#555555" stroke-width="2.5" />
  <polygon points="580,195 590,200 580,205" fill="#555555" />
  <text x="540" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#777777">+ NAD⁺</text>
  
  <line x1="620" y1="245" x2="620" y2="355" stroke="#555555" stroke-width="2.5" />
  <polygon points="615,350 620,360 625,350" fill="#555555" />
  <text x="645" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#777777">+ ATP + Glutamine</text>
  
  <!-- Enzymes (rounded rectangles with gradient) -->
  <defs>
    <linearGradient id="enzymeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9e7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8c471;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect x="170" y="120" width="100" height="45" rx="10" ry="10" fill="url(#enzymeGradient)" stroke="#e67e22" stroke-width="2" />
  <text x="220" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Adk</text>
  <text x="220" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">adenosine kinase</text>
  <text x="220" y="175" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-style="italic" fill="#666666">MGI:87930</text>
  
  <rect x="330" y="120" width="100" height="45" rx="10" ry="10" fill="url(#enzymeGradient)" stroke="#e67e22" stroke-width="2" />
  <text x="380" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Ampd1/2/3</text>
  <text x="380" y="155" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-style="italic" fill="#666666">MGI:88015/88016/1096344</text>
  <text x="380" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">AMP deaminase</text>
  
  <rect x="490" y="120" width="100" height="45" rx="10" ry="10" fill="url(#enzymeGradient)" stroke="#e67e22" stroke-width="2" />
  <text x="540" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Impdh1/2</text>
  <text x="540" y="155" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-style="italic" fill="#666666">MGI:96567/109367</text>
  <text x="540" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">IMP dehydrogenase</text>
  
  <rect x="670" y="350" width="100" height="45" rx="10" ry="10" fill="url(#enzymeGradient)" stroke="#e67e22" stroke-width="2" />
  <text x="720" y="377" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">Gmps</text>
  <text x="720" y="391" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-style="italic" fill="#666666">MGI:2448526</text>
  <text x="720" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">GMP synthase</text>
  
  <!-- Process label -->
  <rect x="280" y="500" width="240" height="35" rx="8" ry="8" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5" />
  <text x="400" y="523" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#333333">GO:0032263 - GMP salvage</text>
  
  <!-- Reaction descriptions -->
  <text x="220" y="240" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#555555">Phosphorylation of adenosine</text>
  <text x="380" y="240" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#555555">Deamination of AMP</text>
  <text x="540" y="240" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#555555">Oxidation of IMP</text>
  <text x="570" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#555555">Amination of XMP</text>
  
  <!-- Process description -->
  <rect x="50" y="450" width="220" height="130" rx="5" ry="5" fill="#f8f9f9" stroke="#666666" stroke-width="1" />
  <text x="160" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">GMP Salvage Overview:</text>
  <text x="160" y="490" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">Pathway for recycling adenosine</text>
  <text x="160" y="505" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">to synthesize GMP without</text>
  <text x="160" y="520" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">requiring de novo synthesis.</text>
  <text x="160" y="535" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">Energy efficient process that</text>
  <text x="160" y="550" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">conserves cellular resources</text>
  <text x="160" y="565" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#555555">and maintains nucleotide balance.</text>
  
  <!-- Legend -->
  <rect x="550" y="560" width="220" height="110" fill="#f9f9f9" stroke="#666666" stroke-width="1" rx="5" ry="5" />
  <text x="560" y="580" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#333333">Legend:</text>
  
  <polygon points="580,600 590,605 590,615 580,620 570,615 570,605" fill="#e1f0fa" stroke="#3498db" stroke-width="1.5" />
  <text x="600" y="613" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#333333">Metabolite</text>
  
  <rect x="570" y="630" width="20" height="15" rx="4" ry="4" fill="url(#enzymeGradient)" stroke="#e67e22" stroke-width="1.5" />
  <text x="600" y="642" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#333333">Enzyme</text>
  
  <line x1="560" y1="660" x2="590" y2="660" stroke="#555555" stroke-width="2" />
  <polygon points="585,657 595,660 585,663" fill="#555555" />
  <text x="600" y="664" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#333333">Reaction with cofactors</text>
</svg>