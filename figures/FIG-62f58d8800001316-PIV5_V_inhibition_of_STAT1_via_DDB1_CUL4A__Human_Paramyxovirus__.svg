<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9" rx="10" ry="10"/>
  
  <!-- Cell components -->
  <rect x="50" y="100" width="700" height="450" fill="#e6f2ff" stroke="#666" stroke-width="2" rx="20" ry="20"/>
  <rect x="100" y="200" width="600" height="200" fill="#e8f8e8" stroke="#666" stroke-width="2" rx="10" ry="10"/>
  
  <!-- Labels for cell components -->
  <text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Cytoplasm</text>
  <text x="400" y="220" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Nucleus</text>
  
  <!-- Virus component -->
  <ellipse cx="100" cy="80" rx="70" ry="30" fill="#ffeeee" stroke="#cc6666" stroke-width="2"/>
  <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Paramyxovirus</text>
  
  <!-- Pathway Components -->
  
  <!-- PIV5-V Protein -->
  <circle cx="200" cy="350" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="200" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">PIV5-V</text>
  
  <!-- DDB1 -->
  <rect x="300" y="330" width="60" height="40" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="5" ry="5"/>
  <text x="330" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">DDB1</text>
  
  <!-- CUL4A -->
  <rect x="400" y="330" width="60" height="40" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="5" ry="5"/>
  <text x="430" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">CUL4A</text>
  
  <!-- RBX1 -->
  <rect x="500" y="330" width="60" height="40" fill="#99ccff" stroke="#0066cc" stroke-width="2" rx="5" ry="5"/>
  <text x="530" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">RBX1</text>
  
  <!-- STAT1 in cytoplasm -->
  <polygon points="600,350 620,330 640,350 620,370" fill="#99ff99" stroke="#009900" stroke-width="2"/>
  <text x="620" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">STAT1</text>
  
  <!-- STAT1 in nucleus -->
  <polygon points="300,280 320,260 340,280 320,300" fill="#99ff99" stroke="#009900" stroke-width="2"/>
  <text x="320" y="285" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">STAT1</text>
  
  <!-- Ubiquitin tag -->
  <circle cx="640" cy="310" r="15" fill="#ffcc00" stroke="#996600" stroke-width="2"/>
  <text x="640" y="315" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Ub</text>
  
  <!-- DNA in nucleus -->
  <rect x="400" y="270" width="100" height="20" fill="#e0e0e0" stroke="#444444" stroke-width="2" rx="2" ry="2"/>
  <text x="450" y="285" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">DNA</text>
  
  <!-- Connection lines with improved visibility and arrows -->
  <line x1="100" y1="110" x2="180" y2="330" stroke="#8866aa" stroke-width="2.5" stroke-dasharray="8,4"/>
  
  <!-- Step 1 to 2 arrow -->
  <line x1="230" y1="350" x2="290" y2="350" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2 to 3 arrow -->
  <line x1="360" y1="350" x2="390" y2="350" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3 to 4 arrow -->
  <line x1="460" y1="350" x2="490" y2="350" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4 to 5 arrow -->
  <line x1="560" y1="350" x2="590" y2="350" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- Ubiquitination arrow -->
  <line x1="550" y1="330" x2="620" y2="310" stroke="#8866aa" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowhead-indirect)"/>
  
  <!-- X on STAT1 in nucleus to show inhibition -->
  <line x1="290" y1="250" x2="350" y2="310" stroke="#ff0000" stroke-width="3.5"/>
  <line x1="290" y1="310" x2="350" y2="250" stroke="#ff0000" stroke-width="3.5"/>
  
  <!-- Arrow from RBX1 to STAT1 inhibition in nucleus -->
  <path d="M 530,310 Q 450,250 350,260" stroke="#8866aa" stroke-width="2.5" stroke-dasharray="8,4" fill="none" marker-end="url(#arrowhead-indirect)"/>
  
  <!-- Arrow showing degradation pathway -->
  <path d="M 650,370 Q 680,400 700,450" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="700" y="470" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Degradation</text>
  
  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-indirect" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8866aa"/>
    </marker>
  </defs>
  
  <!-- Type I Interferon pathway label - improved spacing -->
  <text x="450" y="240" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Type I Interferon-mediated</text>
  <text x="450" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">signaling pathway</text>
  
  <!-- Ubiquitin ligase activity label -->
  <text x="480" y="400" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Ubiquitin protein ligase activity</text>
  
  <!-- Process step labels with higher contrast and uniform size -->
  <text x="200" y="400" text-anchor="middle" font-family="Arial" font-size="13" fill="#000000">1. Viral adaptor</text>
  <text x="330" y="400" text-anchor="middle" font-family="Arial" font-size="13" fill="#000000">2. Complex formation</text>
  <text x="530" y="400" text-anchor="middle" font-family="Arial" font-size="13" fill="#000000">3. Ubiquitination</text>
  <text x="650" y="400" text-anchor="middle" font-family="Arial" font-size="13" fill="#000000">4. Target degradation</text>
  
  <!-- DNA binding inhibition explanation -->
  <text x="450" y="310" text-anchor="middle" font-family="Arial" font-size="13" fill="#000000">5. Inhibition of DNA-binding</text>
  <text x="450" y="325" text-anchor="middle" font-family="Arial" font-size="13" fill="#000000">transcription factor activity</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="700" height="70" fill="white" stroke="#666" stroke-width="1" rx="5" ry="5"/>
  <text x="60" y="540" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <!-- Legend items with improved spacing and consistency -->
  <circle cx="80" cy="560" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="100" y="565" font-family="Arial" font-size="12">Viral protein (P/V)</text>
  
  <rect x="200" y="550" width="20" height="20" fill="#99ccff" stroke="#0066cc" stroke-width="1"/>
  <text x="230" y="565" font-family="Arial" font-size="12">Human proteins</text>
  
  <polygon points="310,560 320,550 330,560 320,570" fill="#99ff99" stroke="#009900" stroke-width="1"/>
  <text x="355" y="565" font-family="Arial" font-size="12">STAT proteins</text>
  
  <circle cx="400" cy="560" r="8" fill="#ffcc00" stroke="#996600" stroke-width="1"/>
  <text x="420" y="565" font-family="Arial" font-size="12">Ubiquitin</text>
  
  <line x1="460" y1="555" x2="480" y2="565" stroke="#ff0000" stroke-width="2"/>
  <line x1="460" y1="565" x2="480" y2="555" stroke="#ff0000" stroke-width="2"/>
  <text x="500" y="565" font-family="Arial" font-size="12">Inhibition</text>
  
  <line x1="550" y1="560" x2="580" y2="560" stroke="#8866aa" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="610" y="565" font-family="Arial" font-size="12">Indirect effect</text>
  
  <rect x="650" y="550" width="20" height="20" fill="#e0e0e0" stroke="#444444" stroke-width="1"/>
  <text x="680" y="565" font-family="Arial" font-size="12">DNA</text>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">PIV5-V Inhibition of STAT1 via DDB1/CUL4A Complex</text>
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic">Viral Evasion of Type I Interferon Response</text>
</svg>