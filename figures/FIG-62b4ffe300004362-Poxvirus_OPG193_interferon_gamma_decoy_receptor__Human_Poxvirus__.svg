<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Poxvirus-OPG193 Interferon Gamma Decoy Receptor Pathway</text>
  
  <!-- Cell plasma membrane -->
  <rect x="100" y="200" width="600" height="350" rx="40" ry="40" fill="#e6f7ff" stroke="#0099cc" stroke-width="3"/>
  <text x="400" y="540" font-family="Arial" font-size="14" text-anchor="middle">Cell (GO:0005886 plasma membrane)</text>
  
  <!-- Extracellular space -->
  <rect x="50" y="50" width="700" height="150" rx="10" ry="10" fill="#f0f0f0" stroke="#999999" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="70" font-family="Arial" font-size="14" text-anchor="middle">Extracellular Space (GO:0005615)</text>
  
  <!-- IFNG Cytokine -->
  <circle cx="250" cy="120" r="25" fill="#ffcccc" stroke="#cc0000" stroke-width="2"/>
  <text x="250" y="125" font-family="Arial" font-size="12" text-anchor="middle">IFNG</text>
  <text x="250" y="165" font-family="Arial" font-size="10" text-anchor="middle">P01579</text>
  <text x="250" y="180" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Cytokine activity</text>
  
  <!-- Viral decoy receptor -->
  <polygon points="550,120 575,95 600,120 575,145" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="575" y="125" font-family="Arial" font-size="12" text-anchor="middle">OPG193</text>
  <text x="575" y="165" font-family="Arial" font-size="10" text-anchor="middle">P24770</text>
  <text x="575" y="180" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Receptor decoy</text>
  
  <!-- IFNGR1 Receptor -->
  <rect x="200" y="200" width="80" height="40" fill="#ccffcc" stroke="#009900" stroke-width="2"/>
  <text x="240" y="225" font-family="Arial" font-size="12" text-anchor="middle">IFNGR1</text>
  <text x="240" y="250" font-family="Arial" font-size="10" text-anchor="middle">P15260</text>
  
  <!-- IFNGR2 Receptor -->
  <rect x="320" y="200" width="80" height="40" fill="#ccffcc" stroke="#009900" stroke-width="2"/>
  <text x="360" y="225" font-family="Arial" font-size="12" text-anchor="middle">IFNGR2</text>
  <text x="360" y="250" font-family="Arial" font-size="10" text-anchor="middle">P38484</text>
  
  <!-- JAK kinases (implicit) -->
  <rect x="240" y="280" width="120" height="40" fill="#ccccff" stroke="#0000cc" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="300" y="305" font-family="Arial" font-size="12" text-anchor="middle">JAK1/JAK2*</text>
  <text x="300" y="330" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">*Implicit - not in source</text>
  
  <!-- Interactions with improved arrows -->
  <!-- Normal pathway -->
  <path d="M250,145 Q250,175 240,200" fill="none" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#009900">activates</text>
  
  <!-- Viral inhibition -->
  <path d="M550,120 Q410,75 285,115" fill="none" stroke="#cc0000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc0000">negatively regulates</text>
  <text x="410" y="80" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc0000">(GO:0052170)</text>
  
  <!-- Signal transduction -->
  <path d="M240,240 Q260,260 270,280" fill="none" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M360,240 Q340,260 330,280" fill="none" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <path d="M300,320 Q300,350 300,380" fill="none" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="220" y="380" width="160" height="40" rx="10" ry="10" fill="#ffffcc" stroke="#999900" stroke-width="2"/>
  <text x="300" y="405" font-family="Arial" font-size="12" text-anchor="middle">Type III IFN Signaling</text>
  <text x="300" y="420" font-family="Arial" font-size="10" text-anchor="middle">(GO:0038196)</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Enhanced Legend -->
  <rect x="580" y="430" width="170" height="130" fill="white" stroke="#666666" stroke-width="1"/>
  <text x="665" y="450" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="595" y="470" r="8" fill="#ffcccc" stroke="#cc0000" stroke-width="1"/>
  <text x="665" y="475" font-family="Arial" font-size="12" text-anchor="middle">Cytokine (IFNG)</text>
  
  <polygon points="595,495 603,487 611,495 603,503" fill="#ffcc99" stroke="#ff6600" stroke-width="1"/>
  <text x="665" y="500" font-family="Arial" font-size="12" text-anchor="middle">Viral Decoy Receptor</text>
  
  <rect x="587" y="515" width="16" height="10" fill="#ccffcc" stroke="#009900" stroke-width="1"/>
  <text x="665" y="520" font-family="Arial" font-size="12" text-anchor="middle">IFN Receptors</text>
  
  <rect x="587" y="535" width="16" height="10" fill="#ccccff" stroke="#0000cc" stroke-width="1" stroke-dasharray="2,1"/>
  <text x="665" y="540" font-family="Arial" font-size="12" text-anchor="middle">Implicit Proteins</text>
  
  <!-- Additional pathway annotations -->
  <path d="M 520,430 L 550,430" stroke="#009900" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="665" y="435" font-family="Arial" font-size="12" text-anchor="middle">Activation</text>
  
  <path d="M 520,455 L 550,455" stroke="#cc0000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="665" y="460" font-family="Arial" font-size="12" text-anchor="middle">Inhibition</text>
</svg>