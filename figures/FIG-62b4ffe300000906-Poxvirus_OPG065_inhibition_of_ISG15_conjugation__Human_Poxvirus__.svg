<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" />
  <text x="400" y="90" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Human Cell Cytoplasm (GO:0005737)</text>
  
  <!-- ISG15 Conjugation Pathway -->
  <!-- UBA7 (P41226) -->
  <rect x="150" y="180" width="120" height="60" rx="10" ry="10" fill="#85c1e9" stroke="#2c3e50" stroke-width="2" />
  <text x="210" y="215" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">UBA7</text>
  <text x="210" y="235" font-family="Arial" font-size="10" text-anchor="middle">(ISG15 activating enzyme)</text>
  
  <!-- UBE2L6 (O14933) -->
  <rect x="350" y="180" width="120" height="60" rx="10" ry="10" fill="#85c1e9" stroke="#2c3e50" stroke-width="2" />
  <text x="410" y="215" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">UBE2L6</text>
  <text x="410" y="235" font-family="Arial" font-size="10" text-anchor="middle">(ISG15 transferase)</text>
  
  <!-- HERC5 (Q9UII4) -->
  <rect x="550" y="180" width="120" height="60" rx="10" ry="10" fill="#85c1e9" stroke="#2c3e50" stroke-width="2" />
  <text x="610" y="215" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">HERC5</text>
  <text x="610" y="235" font-family="Arial" font-size="10" text-anchor="middle">(ISG15 transferase)</text>
  
  <!-- ISG15 -->
  <circle cx="210" y="320" r="40" fill="#fad7a0" stroke="#2c3e50" stroke-width="2" />
  <text x="210" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ISG15</text>
  <text x="210" y="345" font-family="Arial" font-size="10" text-anchor="middle">(Protein tag)</text>
  
  <!-- Target Proteins (implied, not in source) -->
  <rect x="550" y="300" width="120" height="60" rx="10" ry="10" fill="#d5dbdb" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5" />
  <text x="610" y="335" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Target Proteins</text>
  <text x="610" y="355" font-family="Arial" font-size="10" text-anchor="middle" fill="#e74c3c">(implied, not in source)</text>
  
  <!-- Poxvirus Protein -->
  <rect x="300" y="400" width="120" height="60" rx="10" ry="10" fill="#f1948a" stroke="#2c3e50" stroke-width="2" />
  <text x="360" y="435" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">VACWR059</text>
  <text x="360" y="455" font-family="Arial" font-size="10" text-anchor="middle">(Poxvirus protein)</text>
  
  <!-- Arrows for the pathway -->
  <!-- UBA7 to UBE2L6 -->
  <path d="M270,210 L350,210" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="310" y="200" font-family="Arial" font-size="12" text-anchor="middle">ISG15 activation</text>
  
  <!-- UBE2L6 to HERC5 -->
  <path d="M470,210 L550,210" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="510" y="200" font-family="Arial" font-size="12" text-anchor="middle">ISG15 transfer</text>
  
  <!-- HERC5 to conjugation -->
  <path d="M610,240 L610,300" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="640" y="270" font-family="Arial" font-size="12" text-anchor="start">ISG15 conjugation</text>
  
  <!-- ISG15 participation in pathway -->
  <path d="M210,280 Q350,280 550,300" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="350" y="270" font-family="Arial" font-size="12" text-anchor="middle">ISG15 recruitment</text>
  
  <!-- VACWR059 inhibition of ISG15 -->
  <path d="M360,400 L250,350" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#inhibition)" />
  <text x="300" y="390" font-family="Arial" font-size="12" fill="#e74c3c">Inhibits/Sequesters</text>
  
  <!-- ISG15 Process Label -->
  <rect x="320" y="120" width="160" height="30" rx="15" ry="15" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1" />
  <text x="400" y="140" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">ISG15-protein conjugation</text>
  <text x="400" y="155" font-family="Arial" font-size="8" text-anchor="middle">(GO:0032020)</text>
  
  <!-- Markers for arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
    <marker id="inhibition" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#e74c3c" stroke-width="2" />
      <line x1="0" y1="10" x2="10" y2="0" stroke="#e74c3c" stroke-width="2" />
    </marker>
  </defs>
  
  <!-- Caption -->
  <text x="400" y="530" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Poxvirus-OPG065 inhibition of ISG15 conjugation in human cells</text>
  
  <!-- Legend -->
  <rect x="50" y="550" width="700" height="40" fill="none" stroke="none" />
  <rect x="60" y="560" width="15" height="15" fill="#85c1e9" stroke="#2c3e50" stroke-width="1" />
  <text x="85" y="572" font-family="Arial" font-size="12">Human enzymes</text>
  
  <rect x="200" y="560" width="15" height="15" fill="#fad7a0" stroke="#2c3e50" stroke-width="1" />
  <text x="225" y="572" font-family="Arial" font-size="12">ISG15 protein tag</text>
  
  <rect x="340" y="560" width="15" height="15" fill="#f1948a" stroke="#2c3e50" stroke-width="1" />
  <text x="365" y="572" font-family="Arial" font-size="12">Viral protein</text>
  
  <line x1="440" y1="567" x2="470" y2="567" stroke="#2980b9" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="495" y="572" font-family="Arial" font-size="12">Enzymatic process</text>
  
  <line x1="560" y1="567" x2="590" y2="567" stroke="#e74c3c" stroke-width="2" marker-end="url(#inhibition)" />
  <text x="615" y="572" font-family="Arial" font-size="12">Inhibition</text>
  
  <rect x="660" y="560" width="15" height="15" fill="#d5dbdb" stroke="#2c3e50" stroke-width="1" stroke-dasharray="5,5" />
  <text x="710" y="572" font-family="Arial" font-size="12">Implied (not in source)</text>
</svg>