<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Cell outline -->
    <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f9fa" stroke="#2c3e50" stroke-width="3"/>
    
    <!-- Cell nucleus -->
    <ellipse cx="250" cy="200" rx="120" ry="90" fill="#e6f2ff" stroke="#2c3e50" stroke-width="2"/>
    <text x="250" y="200" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">Nucleus</text>
    
    <!-- Mitochondria -->
    <ellipse cx="500" cy="420" rx="80" ry="40" fill="#ffecb3" stroke="#2c3e50" stroke-width="2"/>
    <path d="M440,410 Q500,380 560,410 Q500,440 440,410" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="500" y="425" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">Mitochondrion</text>
    
    <!-- Viral entry -->
    <text x="400" y="90" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#d35400">HHV1 Infection</text>
    <path d="M400,100 L400,150" stroke="#d35400" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- US3 Protein -->
    <rect x="370" y="150" width="60" height="30" rx="5" ry="5" fill="#ff9999" stroke="#2c3e50" stroke-width="2"/>
    <text x="400" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">US3</text>
    <text x="400" y="185" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">(P04413)</text>
    
    <!-- US3 to RIG-I -->
    <path d="M400,180 L400,240" stroke="#d35400" stroke-width="3" marker-end="url(#inhibit)"/>
    <text x="430" y="210" font-family="Arial" font-size="12" fill="#d35400">Inhibits</text>
    <text x="430" y="225" font-family="Arial" font-size="10" fill="#2c3e50">Protein kinase</text>
    <text x="430" y="238" font-family="Arial" font-size="10" fill="#2c3e50">(GO:0004674)</text>
    
    <!-- RIG-I Protein -->
    <rect x="370" y="240" width="60" height="30" rx="5" ry="5" fill="#99ccff" stroke="#2c3e50" stroke-width="2"/>
    <text x="400" y="260" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">RIG-I</text>
    <text x="400" y="275" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">(O95786)</text>
    
    <!-- RIG-I description -->
    <text x="320" y="260" font-family="Arial" font-size="10" text-anchor="end" fill="#2c3e50">Pattern recognition</text>
    <text x="320" y="273" font-family="Arial" font-size="10" text-anchor="end" fill="#2c3e50">receptor</text>
    <text x="320" y="286" font-family="Arial" font-size="10" text-anchor="end" fill="#2c3e50">(GO:0038187)</text>
    
    <!-- RIGI to TRIM25 -->
    <path d="M400,270 L400,330" stroke="#27ae60" stroke-width="3" marker-end="url(#activate)"/>
    <text x="430" y="300" font-family="Arial" font-size="12" fill="#2c3e50">Activates</text>
    
    <!-- TRIM25 Protein -->
    <rect x="370" y="330" width="60" height="30" rx="5" ry="5" fill="#99ccff" stroke="#2c3e50" stroke-width="2"/>
    <text x="400" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">TRIM25</text>
    <text x="400" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">(Q14258)</text>
    
    <!-- TRIM25 description -->
    <text x="320" y="350" font-family="Arial" font-size="10" text-anchor="end" fill="#2c3e50">Ubiquitin protein</text>
    <text x="320" y="363" font-family="Arial" font-size="10" text-anchor="end" fill="#2c3e50">ligase activity</text>
    <text x="320" y="376" font-family="Arial" font-size="10" text-anchor="end" fill="#2c3e50">(GO:0061630)</text>
    
    <!-- TRIM25 to MAVS -->
    <path d="M400,360 L450,400 L500,400" stroke="#27ae60" stroke-width="3" marker-end="url(#activate)"/>
    <text x="450" y="380" font-family="Arial" font-size="12" fill="#2c3e50">Activates</text>
    
    <!-- MAVS Protein -->
    <rect x="470" y="370" width="60" height="30" rx="5" ry="5" fill="#99ccff" stroke="#2c3e50" stroke-width="2"/>
    <text x="500" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">MAVS</text>
    <text x="500" y="405" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">(Q7Z434)</text>
    
    <!-- MAVS description -->
    <text x="580" y="385" font-family="Arial" font-size="11" fill="#2c3e50">Signaling adaptor activity</text>
    <text x="580" y="398" font-family="Arial" font-size="11" fill="#2c3e50">(GO:0035591)</text>
    
    <!-- Downstream signaling -->
    <path d="M530,385 L590,385 L590,500" stroke="#2c3e50" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
    <text x="610" y="450" font-family="Arial" font-size="12" fill="#2c3e50">Downstream</text>
    <text x="610" y="465" font-family="Arial" font-size="12" fill="#2c3e50">signaling</text>
    
    <!-- Process label -->
    <rect x="100" y="480" width="250" height="50" rx="10" ry="10" fill="#e8f8f5" stroke="#2c3e50" stroke-width="2"/>
    <text x="225" y="510" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">Cytoplasmic pattern recognition</text>
    <text x="225" y="525" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">receptor signaling pathway (GO:0002753)</text>
    
    <!-- Viral process label -->
    <rect x="500" y="480" width="220" height="50" rx="10" ry="10" fill="#fadbd8" stroke="#d35400" stroke-width="2"/>
    <text x="610" y="510" font-family="Arial" font-size="12" text-anchor="middle" fill="#d35400">Symbiont-mediated suppression of host</text>
    <text x="610" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#d35400">RIG-I signaling pathway (GO:0039540)</text>
    
    <!-- Markers -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
        </marker>
        <marker id="activate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
        </marker>
        <marker id="inhibit" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
            <line x1="0" y1="0" x2="10" y2="10" stroke="#d35400" stroke-width="2"/>
            <line x1="0" y1="10" x2="10" y2="0" stroke="#d35400" stroke-width="2"/>
        </marker>
    </defs>
    
    <!-- Legend -->
    <rect x="600" y="100" width="140" height="180" rx="5" ry="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
    <text x="670" y="120" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Legend</text>
    
    <rect x="610" y="130" width="20" height="20" fill="#ff9999" stroke="#2c3e50" stroke-width="1"/>
    <text x="640" y="145" font-family="Arial" font-size="14" fill="#2c3e50">Viral protein</text>
    
    <rect x="610" y="160" width="20" height="20" fill="#99ccff" stroke="#2c3e50" stroke-width="1"/>
    <text x="640" y="175" font-family="Arial" font-size="14" fill="#2c3e50">Host protein</text>
    
    <line x1="610" y1="195" x2="630" y2="195" stroke="#27ae60" stroke-width="3" marker-end="url(#activate)"/>
    <text x="640" y="200" font-family="Arial" font-size="14" fill="#2c3e50">Activation</text>
    
    <line x1="610" y1="215" x2="630" y2="235" stroke="#d35400" stroke-width="2"/>
    <line x1="610" y1="235" x2="630" y2="215" stroke="#d35400" stroke-width="2"/>
    <text x="640" y="225" font-family="Arial" font-size="14" fill="#2c3e50">Inhibition</text>
    
    <line x1="610" y1="245" x2="630" y2="245" stroke="#2c3e50" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="640" y="250" font-family="Arial" font-size="14" fill="#2c3e50">Pathway</text>
    
    <text x="670" y="270" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic" fill="#2c3e50">Cell location labels shown in blue</text>
</svg>