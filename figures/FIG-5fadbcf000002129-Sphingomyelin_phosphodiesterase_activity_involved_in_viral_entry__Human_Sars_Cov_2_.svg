<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f8f8" stroke="#000" stroke-width="2"/>
  
  <!-- Cell components -->
  <!-- Plasma membrane -->
  <rect x="50" y="50" width="700" height="30" rx="15" ry="15" fill="#b3d9ff" stroke="#000" stroke-width="2"/>
  <text x="400" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Plasma Membrane (GO:0005886)</text>
  
  <!-- Extracellular space -->
  <rect x="50" y="10" width="700" height="40" rx="5" ry="5" fill="#e6f2ff" stroke="#000" stroke-width="1"/>
  <text x="400" y="35" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Extracellular Space (GO:0005615)</text>
  
  <!-- Lysosome -->
  <ellipse cx="300" cy="300" rx="120" ry="90" fill="#ffcccc" stroke="#000" stroke-width="2"/>
  <text x="300" y="290" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Lysosome</text>
  <text x="300" y="310" font-family="Arial" font-size="14" text-anchor="middle">(GO:0005764)</text>
  
  <!-- Molecules and Processes -->
  <!-- SMPD1 in lysosome -->
  <circle cx="240" cy="280" r="30" fill="#ff9999" stroke="#000" stroke-width="2"/>
  <text x="240" y="285" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">SMPD1</text>
  
  <!-- SMPD1 in extracellular space -->
  <circle cx="180" cy="30" r="25" fill="#ff9999" stroke="#000" stroke-width="2"/>
  <text x="180" y="35" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">SMPD1</text>
  
  <!-- NPC2 in lysosome -->
  <circle cx="370" cy="330" r="30" fill="#99ccff" stroke="#000" stroke-width="2"/>
  <text x="370" y="335" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">NPC2</text>
  
  <!-- ACE2 in plasma membrane -->
  <rect x="500" y="55" width="60" height="40" rx="8" ry="8" fill="#99ff99" stroke="#000" stroke-width="2"/>
  <text x="530" y="80" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">ACE2</text>
  
  <!-- SARS-CoV-2 virus -->
  <circle cx="600" cy="30" r="20" fill="#ff6666" stroke="#000" stroke-width="2"/>
  <path d="M590,25 L610,25 M600,15 L600,35 M595,20 L605,30 M595,30 L605,20" stroke="#000" stroke-width="1"/>
  <text x="600" y="60" font-family="Arial" font-size="14" text-anchor="middle">SARS-CoV-2</text>
  
  <!-- Ceramide biosynthetic process -->
  <rect x="150" y="400" width="140" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#000" stroke-width="2"/>
  <text x="220" y="425" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Ceramide Biosynthesis</text>
  <text x="220" y="445" font-family="Arial" font-size="12" text-anchor="middle">(GO:0046513)</text>
  
  <!-- Cholesterol efflux -->
  <rect x="400" y="400" width="140" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#000" stroke-width="2"/>
  <text x="470" y="425" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Cholesterol Efflux</text>
  <text x="470" y="445" font-family="Arial" font-size="12" text-anchor="middle">(GO:0033344)</text>
  
  <!-- Process arrows -->
  <!-- SMPD1 catalysis arrow to ceramide biosynthesis -->
  <path d="M240,310 L220,400" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="160" y="340" width="120" height="50" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.8"/>
  <text x="220" y="360" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Sphingomyelin</text>
  <text x="220" y="375" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">phosphodiesterase</text>
  <text x="220" y="390" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">activity (GO:0004767)</text>
  
  <!-- Extracellular SMPD1 catalysis -->
  <path d="M180,55 L180,100" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="210" y="65" width="120" height="55" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.8"/>
  <text x="270" y="80" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Sphingomyelin</text>
  <text x="270" y="95" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">phosphodiesterase</text>
  <text x="270" y="110" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">activity (GO:0004767)</text>
  
  <!-- NPC2 catalysis arrow to cholesterol efflux -->
  <path d="M380,360 L430,400" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="340" y="365" width="110" height="30" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.8"/>
  <text x="395" y="380" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Cholesterol transfer</text>
  <text x="395" y="395" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">activity (GO:0120020)</text>
  
  <!-- SMPD1 positive regulation of NPC2 -->
  <path d="M270,280 L340,320" stroke="#00cc00" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,2"/>
  <rect x="275" y="280" width="70" height="30" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.8"/>
  <text x="310" y="295" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">positively</text>
  <text x="310" y="310" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">regulates</text>
  
  <!-- SMPD1 positive regulation of ACE2 -->
  <path d="M240,250 C300,150 400,100 500,80" stroke="#00cc00" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,2"/>
  <rect x="330" y="130" width="100" height="30" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.8"/>
  <text x="380" y="150" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">positively regulates</text>
  
  <!-- ACE2 virus receptor activity -->
  <path d="M560,55 L580,40" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="570" y="80" width="100" height="30" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.8"/>
  <text x="620" y="95" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Virus receptor</text>
  <text x="620" y="110" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">activity (GO:0001618)</text>
  
  <!-- Viral entry process -->
  <path d="M600,50 L600,80" stroke="#ff0000" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="620" y="55" width="120" height="50" rx="5" ry="5" fill="#ffffff" stroke="none" fill-opacity="0.8"/>
  <text x="680" y="70" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Symbiont entry</text>
  <text x="680" y="85" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">into host cell</text>
  <text x="680" y="100" font-family="Arial" font-size="10" text-anchor="middle">(GO:0046718)</text>
  
  <!-- Legend -->
  <rect x="600" y="450" width="140" height="90" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <text x="670" y="470" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  
  <circle cx="620" y="490" r="10" fill="#ff9999" stroke="#000" stroke-width="1"/>
  <text x="690" y="495" font-family="Arial" font-size="12" text-anchor="middle">SMPD1 (P17405)</text>
  
  <circle cx="620" y="515" r="10" fill="#99ccff" stroke="#000" stroke-width="1"/>
  <text x="690" y="520" font-family="Arial" font-size="12" text-anchor="middle">NPC2 (P61916)</text>
  
  <rect x="610" y="530" width="20" height="15" fill="#99ff99" stroke="#000" stroke-width="1"/>
  <text x="690" y="540" font-family="Arial" font-size="12" text-anchor="middle">ACE2 (Q9BYF1)</text>
  
  <!-- Diagram title -->
  <rect x="50" y="500" width="540" height="50" rx="5" ry="5" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <text x="320" y="520" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Sphingomyelin phosphodiesterase activity involved in</text>
  <text x="320" y="540" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">SARS-CoV-2 viral entry into human cells</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
</svg>