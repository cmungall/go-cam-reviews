<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane and compartments -->
  <rect x="50" y="150" width="700" height="400" rx="20" ry="20" fill="#F8F8F8" stroke="#888888" stroke-width="2"/>
  <path d="M50,250 L750,250" stroke="#888888" stroke-width="4" stroke-dasharray="5,5"/>
  <rect x="200" y="400" width="200" height="120" rx="10" ry="10" fill="#E6F0FA" stroke="#6890B7" stroke-width="2"/>
  
  <!-- Labels for cellular compartments -->
  <text x="70" y="210" font-family="Arial" font-size="14" fill="#555555">Extracellular Space</text>
  <text x="70" y="280" font-family="Arial" font-size="14" fill="#555555">Plasma Membrane</text>
  <text x="70" y="320" font-family="Arial" font-size="14" fill="#555555">Cytoplasm</text>
  <text x="280" y="430" font-family="Arial" font-size="14" fill="#555555">Nucleus</text>
  
  <!-- IL6 Cytokine -->
  <circle cx="150" cy="180" r="15" fill="#FF6347" stroke="#D32F2F" stroke-width="2"/>
  <text x="150" y="185" font-family="Arial" font-size="12" fill="white" font-weight="bold" text-anchor="middle">IL6</text>
  <text x="150" y="210" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">Cytokine activity</text>
  <text x="150" y="225" font-family="Arial" font-size="9" fill="#555555" text-anchor="middle">(P05231)</text>
  
  <!-- IL6R Receptor (soluble) -->
  <path d="M220,190 Q240,170 260,190" stroke="#4682B4" stroke-width="3" fill="none"/>
  <rect x="220" y="180" width="40" height="15" rx="3" ry="3" fill="#4682B4" stroke="#36648B" stroke-width="2"/>
  <text x="240" y="191" font-family="Arial" font-size="10" fill="white" text-anchor="middle">IL6R</text>
  <text x="240" y="210" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">Cytokine receptor</text>
  <text x="240" y="225" font-family="Arial" font-size="9" fill="#555555" text-anchor="middle">(P08887-2)</text>
  
  <!-- IL6 binding to IL6R -->
  <path d="M165,180 L220,185" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="190" y="170" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">1. IL6 binds IL6R</text>
  
  <!-- IL6:IL6R complex -->
  <circle cx="280" cy="180" r="15" fill="#FF6347" stroke="#D32F2F" stroke-width="2"/>
  <path d="M280,165 Q300,145 320,165" stroke="#4682B4" stroke-width="3" fill="none"/>
  <text x="280" y="185" font-family="Arial" font-size="10" fill="white" text-anchor="middle">IL6:IL6R</text>
  
  <!-- IL6ST at membrane -->
  <rect x="320" y="230" width="40" height="40" rx="5" ry="5" fill="#6A9655" stroke="#4F6F3F" stroke-width="2"/>
  <text x="340" y="255" font-family="Arial" font-size="10" fill="white" text-anchor="middle">IL6ST</text>
  <text x="340" y="280" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">Activator</text>
  <text x="340" y="295" font-family="Arial" font-size="9" fill="#555555" text-anchor="middle">(P40189)</text>
  
  <!-- IL6:IL6R binding to IL6ST -->
  <path d="M290,195 L330,230" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="320" y="210" font-family="Arial" font-size="10" fill="#666666" text-anchor="middle">2. Complex binds IL6ST</text>
  
  <!-- JAK1 at cytoplasmic side -->
  <rect x="320" y="280" width="40" height="25" rx="3" ry="3" fill="#7B68EE" stroke="#483D8B" stroke-width="2"/>
  <text x="340" y="297" font-family="Arial" font-size="10" fill="white" text-anchor="middle">JAK1</text>
  <text x="340" y="315" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">Kinase</text>
  <text x="340" y="330" font-family="Arial" font-size="9" fill="#555555" text-anchor="middle">(P23458)</text>
  
  <!-- IL6ST activating JAK1 -->
  <path d="M340,270 L340,280" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="370" y="275" font-family="Arial" font-size="10" fill="#666666" text-anchor="start">3. IL6ST activates JAK1</text>
  
  <!-- STAT3 in cytoplasm -->
  <polygon points="320,350 360,350 350,380 330,380" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  <text x="340" y="368" font-family="Arial" font-size="10" fill="white" text-anchor="middle">STAT3</text>
  <text x="340" y="395" font-family="Arial" font-size="9" fill="#555555" text-anchor="middle">(P40763)</text>
  
  <!-- JAK1 activating STAT3 -->
  <path d="M340,305 L340,345" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="370" y="335" font-family="Arial" font-size="10" fill="#666666" text-anchor="start">4. JAK1 phosphorylates STAT3</text>
  
  <!-- STAT3 in nucleus -->
  <polygon points="280,440 320,440 310,470 290,470" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  <text x="300" y="458" font-family="Arial" font-size="10" fill="white" text-anchor="middle">STAT3</text>
  <text x="300" y="485" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">Transcription factor</text>
  
  <!-- STAT3 translocation to nucleus -->
  <path d="M340,385 C340,400 320,420 300,440" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="360" y="410" font-family="Arial" font-size="10" fill="#666666" text-anchor="start">5. STAT3 translocates to nucleus</text>
  
  <!-- SOCS3 inhibition -->
  <rect x="400" y="330" width="40" height="25" rx="3" ry="3" fill="#DC143C" stroke="#8B0000" stroke-width="2"/>
  <text x="420" y="347" font-family="Arial" font-size="10" fill="white" text-anchor="middle">SOCS3</text>
  <text x="420" y="365" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">Kinase inhibitor</text>
  <text x="420" y="380" font-family="Arial" font-size="9" fill="#555555" text-anchor="middle">(O14543)</text>
  
  <!-- STAT3 inducing SOCS3 expression -->
  <path d="M320,455 C350,455 400,400 400,355" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="430" y="455" font-family="Arial" font-size="10" fill="#666666" text-anchor="start">6. STAT3 induces SOCS3 expression</text>
  
  <!-- SOCS3 inhibiting JAK1 -->
  <path d="M400,335 L360,295" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="395" y1="330" x2="365" y2="300" stroke="#DC143C" stroke-width="3"/>
  <text x="430" y="315" font-family="Arial" font-size="10" fill="#666666" text-anchor="start">7. SOCS3 inhibits JAK1 (negative feedback)</text>
  
  <!-- Pathway label -->
  <text x="400" y="50" font-family="Arial" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">IL6:sIL6R Trans-signaling Pathway (Human)</text>
  <text x="400" y="80" font-family="Arial" font-size="14" fill="#666666" text-anchor="middle">GO-CAM Model: gomodel:5f46c3b700002685</text>
  <text x="400" y="100" font-family="Arial" font-size="14" fill="#666666" text-anchor="middle">GO:0070102 - interleukin-6-mediated signaling pathway</text>
  <text x="400" y="120" font-family="Arial" font-size="14" fill="#666666" text-anchor="middle">GO:0007259 - JAK-STAT signaling pathway</text>
  
  <!-- Legend -->
  <rect x="100" y="580" width="600" height="100" rx="5" ry="5" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/>
  <text x="400" y="600" font-family="Arial" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Legend</text>
  
  <!-- Legend items -->
  <circle cx="130" cy="625" r="10" fill="#FF6347" stroke="#D32F2F" stroke-width="2"/>
  <text x="150" y="630" font-family="Arial" font-size="12" fill="#333333">IL6 - Cytokine</text>
  
  <rect x="230" y="615" width="30" height="15" rx="3" ry="3" fill="#4682B4" stroke="#36648B" stroke-width="2"/>
  <text x="280" y="630" font-family="Arial" font-size="12" fill="#333333">IL6R - Receptor</text>
  
  <rect x="350" y="615" width="30" height="25" rx="5" ry="5" fill="#6A9655" stroke="#4F6F3F" stroke-width="2"/>
  <text x="400" y="630" font-family="Arial" font-size="12" fill="#333333">IL6ST - Activator</text>
  
  <rect x="470" y="615" width="30" height="20" rx="3" ry="3" fill="#7B68EE" stroke="#483D8B" stroke-width="2"/>
  <text x="520" y="630" font-family="Arial" font-size="12" fill="#333333">JAK1 - Kinase</text>
  
  <polygon points="130,655 160,655 150,675 140,675" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  <text x="180" y="670" font-family="Arial" font-size="12" fill="#333333">STAT3 - Transcription Factor</text>
  
  <rect x="280" y="655" width="30" height="20" rx="3" ry="3" fill="#DC143C" stroke="#8B0000" stroke-width="2"/>
  <text x="330" y="670" font-family="Arial" font-size="12" fill="#333333">SOCS3 - Inhibitor</text>
  
  <path d="M450,665 L500,665" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="520" y="670" font-family="Arial" font-size="12" fill="#333333">Activation/Signaling direction</text>
  
  <path d="M450,685 L500,685" stroke="#DC143C" stroke-width="3"/>
  <text x="550" y="690" font-family="Arial" font-size="12" fill="#333333">Inhibition</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
</svg>