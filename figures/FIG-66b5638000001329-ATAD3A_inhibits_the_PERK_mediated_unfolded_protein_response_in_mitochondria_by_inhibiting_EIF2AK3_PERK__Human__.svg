<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="200" cy="300" rx="120" ry="100" fill="#e6f7ff" stroke="#333" stroke-width="2"/>
  <text x="200" y="300" font-family="Arial" font-size="16" text-anchor="middle">Nucleus</text>
  
  <!-- Mitochondrion -->
  <ellipse cx="550" cy="200" rx="100" ry="50" fill="#ffcccc" stroke="#333" stroke-width="2"/>
  <text x="550" y="200" font-family="Arial" font-size="16" text-anchor="middle">Mitochondrion</text>
  
  <!-- ER/MAM -->
  <path d="M 450 200 C 480 230, 520 250, 550 260 C 580 270, 620 260, 650 250" stroke="#ff9966" stroke-width="4" fill="none"/>
  <text x="500" y="280" font-family="Arial" font-size="14" text-anchor="middle">MAM</text>

  <!-- Cytosol label -->
  <text x="400" y="130" font-family="Arial" font-size="16" text-anchor="middle">Cytosol</text>
  
  <!-- ATAD3A inhibiting PERK -->
  <rect x="500" y="230" width="80" height="30" rx="5" ry="5" fill="#99cc99" stroke="#333" stroke-width="1.5"/>
  <text x="540" y="250" font-family="Arial" font-size="14" text-anchor="middle">ATAD3A</text>
  
  <rect x="400" y="230" width="80" height="30" rx="5" ry="5" fill="#ff9999" stroke="#333" stroke-width="1.5"/>
  <text x="440" y="250" font-family="Arial" font-size="14" text-anchor="middle">PERK</text>

  <!-- Inhibition arrow -->
  <line x1="500" y1="245" x2="480" y2="245" stroke="#cc0000" stroke-width="2" stroke-dasharray="4,0"/>
  <polygon points="480,245 485,240 485,250" fill="#cc0000"/>
  <text x="490" y="235" font-family="Arial" font-size="12" text-anchor="middle" fill="#cc0000">inhibits</text>
    
  <!-- PERK phosphorylating EIF2S1 -->
  <rect x="300" y="330" width="80" height="30" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="350" font-family="Arial" font-size="14" text-anchor="middle">EIF2S1</text>
  
  <!-- Dashed arrow to show inhibited process -->
  <line x1="420" y1="260" x2="370" y2="330" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="370,330 375,320 365,325" fill="#0066cc"/>
  <circle cx="380" cy="315" r="8" fill="#ffcc00" stroke="#333" stroke-width="1"/>
  <text x="380" y="315" font-family="Arial" font-size="10" text-anchor="middle">P</text>
  <text x="430" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#0066cc">phosphorylates</text>
  
  <!-- EIF2S1 function and regulation -->
  <text x="340" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="#006600">Translation</text>
  <text x="340" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#006600">initiation</text>
  
  <line x1="300" y1="345" x2="250" y2="345" stroke="#006600" stroke-width="2"/>
  <polygon points="250,345 260,340 260,350" fill="#006600"/>
  
  <!-- ATF4 in nucleus -->
  <rect x="160" y="330" width="80" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="350" font-family="Arial" font-size="14" text-anchor="middle">ATF4</text>
  
  <text x="200" y="370" font-family="Arial" font-size="12" text-anchor="middle" fill="#990000">Transcription</text>
  <text x="200" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="#990000">factor activity</text>
  
  <!-- Pathway labels -->
  <text x="400" y="480" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">PERK-mediated Unfolded Protein Response</text>
  <text x="400" y="500" font-family="Arial" font-size="16" text-anchor="middle">Inhibition by ATAD3A in Mitochondria</text>
  
  <!-- Legend -->
  <rect x="600" y="400" width="170" height="180" fill="white" stroke="#333" stroke-width="1"/>
  <text x="685" y="420" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
  
  <rect x="620" y="430" width="20" height="20" fill="#99cc99" stroke="#333" stroke-width="1"/>
  <text x="650" y="445" font-family="Arial" font-size="14" text-anchor="start">ATAD3A</text>
  
  <rect x="620" y="455" width="20" height="20" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="650" y="470" font-family="Arial" font-size="14" text-anchor="start">PERK/EIF2AK3</text>
  
  <rect x="620" y="480" width="20" height="20" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="650" y="495" font-family="Arial" font-size="14" text-anchor="start">EIF2S1</text>
  
  <rect x="620" y="505" width="20" height="20" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="650" y="520" font-family="Arial" font-size="14" text-anchor="start">ATF4</text>

  <!-- Color code for interactions in legend -->
  <line x1="620" y1="535" x2="640" y2="535" stroke="#cc0000" stroke-width="2"/>
  <text x="650" y="540" font-family="Arial" font-size="14" text-anchor="start">Inhibition</text>
  
  <line x1="620" y1="555" x2="640" y2="555" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="650" y="560" font-family="Arial" font-size="14" text-anchor="start">Phosphorylation</text>
  
  <line x1="620" y1="575" x2="640" y2="575" stroke="#006600" stroke-width="2"/>
  <text x="650" y="580" font-family="Arial" font-size="14" text-anchor="start">Activation</text>
</svg>