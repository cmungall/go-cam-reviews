<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Title -->
  <rect width="800" height="600" fill="white"/>
  <text x="400" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Inhibition of Canonical mTORC1 Signaling via Phosphorylation of RPTOR by TBK1</text>
  
  <!-- Cell Outline -->
  <rect x="100" y="80" width="600" height="450" rx="20" ry="20" fill="#f8f9fa" stroke="#888888" stroke-width="2"/>
  <text x="120" y="110" font-family="Arial" font-size="14" font-style="italic">Human Cell</text>
  
  <!-- Lysosomal Membrane -->
  <ellipse cx="400" cy="300" rx="200" ry="120" fill="#fce8d6" stroke="#e09e5a" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="400" y="220" font-family="Arial" font-size="14" font-style="italic" font-weight="bold" text-anchor="middle">Lysosomal Membrane (GO:0005765)</text>
  
  <!-- TBK1 Protein -->
  <circle cx="200" cy="180" r="40" fill="#b3e0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="200" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">TBK1</text>
  <text x="200" y="198" font-family="Arial" font-size="10" text-anchor="middle">(Q9UHD2)</text>
  
  <!-- RPTOR Protein -->
  <rect x="330" y="280" width="80" height="40" rx="10" ry="10" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="370" y="305" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">RPTOR</text>
  <text x="370" y="320" font-family="Arial" font-size="10" text-anchor="middle">(Q8N122)</text>
  
  <!-- mTOR Protein -->
  <rect x="430" y="280" width="80" height="40" rx="10" ry="10" fill="#c2f0c2" stroke="#339933" stroke-width="2"/>
  <text x="470" y="305" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">mTOR</text>
  <text x="470" y="320" font-family="Arial" font-size="10" text-anchor="middle">(P42345)</text>
  
  <!-- RHEB Protein -->
  <circle cx="600" cy="180" r="40" fill="#d9b3ff" stroke="#6600cc" stroke-width="2"/>
  <text x="600" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">RHEB</text>
  <text x="600" y="198" font-family="Arial" font-size="10" text-anchor="middle">(Q15382)</text>
  
  <!-- mTORC1 Complex Label -->
  <path d="M 320 260 Q 370 240 460 240 Q 500 240 510 260" fill="none" stroke="#339933" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">mTORC1 Complex</text>
  
  <!-- Phosphorylation Arrow from TBK1 to RPTOR - Enhanced -->
  <path d="M 230 210 Q 300 250 330 280" fill="none" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>
  <circle cx="320" cy="270" r="12" fill="yellow" stroke="black" stroke-width="1.5"/>
  <text x="320" y="274" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">P</text>
  <text x="270" y="250" font-family="Arial" font-size="14" fill="#0066cc" font-weight="bold" text-anchor="middle">Phosphorylates</text>
  <text x="270" y="270" font-family="Arial" font-size="12" fill="#0066cc" text-anchor="middle">(GO:0004674)</text>
  
  <!-- Activation Arrow from RHEB to mTORC1 -->
  <path d="M 570 210 Q 500 250 470 280" fill="none" stroke="#6600cc" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="520" y="250" font-family="Arial" font-size="14" fill="#6600cc" font-weight="bold" text-anchor="middle">Activates</text>
  <text x="520" y="270" font-family="Arial" font-size="12" fill="#6600cc" text-anchor="middle">(GO:0043539)</text>
  
  <!-- Inhibitory Effect on Signaling -->
  <path d="M 370 330 Q 370 380 500 380" fill="none" stroke="red" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#inhibitmarker)"/>
  <text x="420" y="400" font-family="Arial" font-size="14" fill="red" font-weight="bold" text-anchor="middle">Negative Regulation of TORC1 Signaling</text>
  <text x="420" y="420" font-family="Arial" font-size="12" fill="red" text-anchor="middle">(GO:1904262)</text>
  
  <!-- Activation Effect on Signaling -->
  <path d="M 470 330 Q 470 360 500 380" fill="none" stroke="green" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="530" y="365" font-family="Arial" font-size="14" fill="green" font-weight="bold" text-anchor="middle">TORC1 Signaling</text>
  <text x="530" y="385" font-family="Arial" font-size="12" fill="green" text-anchor="middle">(GO:0038202)</text>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
    <marker id="inhibitmarker" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <line x1="0" y1="0" x2="12" y2="12" stroke="red" stroke-width="2.5"/>
      <line x1="0" y1="12" x2="12" y2="0" stroke="red" stroke-width="2.5"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="450" width="180" height="160" fill="white" stroke="black" stroke-width="1"/>
  <text x="690" y="470" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  
  <circle cx="620" cy="490" r="8" fill="#b3e0ff" stroke="#0066cc" stroke-width="1"/>
  <text x="635" y="495" font-family="Arial" font-size="12" text-anchor="start">TBK1 (Kinase)</text>
  
  <rect x="615" y="510" width="15" height="15" rx="3" ry="3" fill="#ffcc99" stroke="#ff6600" stroke-width="1"/>
  <text x="635" y="522" font-family="Arial" font-size="12" text-anchor="start">RPTOR (Adaptor)</text>
  
  <rect x="615" y="535" width="15" height="15" rx="3" ry="3" fill="#c2f0c2" stroke="#339933" stroke-width="1"/>
  <text x="635" y="548" font-family="Arial" font-size="12" text-anchor="start">mTOR (Kinase)</text>
  
  <circle cx="620" cy="565" r="8" fill="#d9b3ff" stroke="#6600cc" stroke-width="1"/>
  <text x="635" y="570" font-family="Arial" font-size="12" text-anchor="start">RHEB (Activator)</text>
  
  <circle cx="620" cy="590" r="8" fill="yellow" stroke="black" stroke-width="1"/>
  <text x="620" y="593" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">P</text>
  <text x="635" y="595" font-family="Arial" font-size="12" text-anchor="start">Phosphorylation</text>
</svg>