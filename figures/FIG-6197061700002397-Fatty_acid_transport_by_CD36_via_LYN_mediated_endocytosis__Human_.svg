<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#f9f9f9"/>
  
  <!-- Cell membrane -->
  <path d="M100,200 Q400,150 700,200 Q400,250 100,200" fill="#e6f2ff" stroke="#0066cc" stroke-width="3"/>
  <path d="M100,350 Q400,400 700,350 Q400,300 100,350" fill="#fffaf0" stroke="#0066cc" stroke-width="3"/>
  
  <!-- Label for membrane -->
  <text x="720" y="270" font-family="Arial" font-size="14" fill="black">Plasma Membrane</text>
  <line x1="700" y1="270" x2="650" y2="250" stroke="black" stroke-width="1"/>
  
  <!-- Extracellular space label -->
  <text x="400" y="120" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">Extracellular Space</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="480" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">Cytoplasm</text>

  <!-- Fatty acid -->
  <ellipse cx="220" cy="140" rx="15" ry="8" fill="#ffcc99" stroke="#ff9966" stroke-width="2"/>
  <text x="220" y="115" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Fatty Acid</text>
  <text x="220" y="95" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">(CHEBI:35366)</text>
  
  <!-- CD36 receptor -->
  <rect x="200" y="190" width="40" height="25" rx="5" ry="5" fill="#9999ff" stroke="#6666cc" stroke-width="2"/>
  <text x="220" y="207" font-family="Arial" font-size="12" text-anchor="middle" fill="white">CD36</text>
  <text x="220" y="232" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">(P16671)</text>
  <text x="220" y="247" font-family="Arial" font-size="9" text-anchor="middle" fill="#666666">Cargo receptor</text>
  
  <!-- LYN kinase -->
  <rect x="300" y="300" width="40" height="25" rx="5" ry="5" fill="#99cc99" stroke="#669966" stroke-width="2"/>
  <text x="320" y="317" font-family="Arial" font-size="12" text-anchor="middle" fill="white">LYN</text>
  <text x="320" y="342" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">(P07948)</text>
  <text x="320" y="357" font-family="Arial" font-size="9" text-anchor="middle" fill="#666666">Protein tyrosine kinase</text>
  
  <!-- ZDHHC5 -->
  <rect x="400" y="300" width="60" height="25" rx="5" ry="5" fill="#ff9999" stroke="#cc6666" stroke-width="2"/>
  <text x="430" y="317" font-family="Arial" font-size="12" text-anchor="middle" fill="white">ZDHHC5</text>
  <text x="430" y="342" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">(Q9C0B5)</text>
  <text x="430" y="357" font-family="Arial" font-size="9" text-anchor="middle" fill="#666666">Palmitoyltransferase</text>
  
  <!-- LYPLA1 -->
  <rect x="500" y="300" width="60" height="25" rx="5" ry="5" fill="#ffcc66" stroke="#cc9933" stroke-width="2"/>
  <text x="530" y="317" font-family="Arial" font-size="12" text-anchor="middle" fill="white">LYPLA1</text>
  <text x="530" y="342" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">(O75608)</text>
  <text x="530" y="357" font-family="Arial" font-size="9" text-anchor="middle" fill="#666666">Palmitoyl hydrolase</text>
  
  <!-- Arrows and process flow -->
  <!-- Fatty acid binding to CD36 -->
  <line x1="220" y1="150" x2="220" y2="185" stroke="#ff6600" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="245" y="170" font-family="Arial" font-size="10" fill="#666666">binding</text>
  
  <!-- CD36 activating LYN -->
  <path d="M225,215 Q255,260 295,300" stroke="#6666cc" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="245" y="270" font-family="Arial" font-size="10" fill="#666666">activates</text>
  
  <!-- LYN activating ZDHHC5 -->
  <line x1="345" y1="312" x2="395" y2="312" stroke="#669966" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="300" font-family="Arial" font-size="10" fill="#666666">activates</text>
  
  <!-- ZDHHC5 to LYPLA1 -->
  <line x1="465" y1="312" x2="495" y2="312" stroke="#cc6666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="480" y="300" font-family="Arial" font-size="10" fill="#666666">regulates</text>
  
  <!-- Endocytosis process (clearer representation) -->
  <path d="M250,215 Q300,230 320,260 Q340,290 370,300" stroke="#cc00cc" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#purpleArrow)"/>
  <text x="290" y="235" font-family="Arial" font-size="10" fill="#cc00cc">endocytosis</text>

  <!-- Fatty acid transport into cell -->
  <path d="M530,325 Q530,380 400,420 Q270,380 270,325" stroke="#ff9966" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  <text x="400" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff6600">Fatty Acid Transport</text>
  <text x="400" y="445" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">(GO:0015908)</text>
  
  <!-- Endocytosis vesicle (implied, not in source) -->
  <ellipse cx="400" y="350" rx="30" ry="20" fill="#fffaf0" stroke="#cc00cc" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="390" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc00cc">Endocytic vesicle</text>
  <text x="400" y="405" font-family="Arial" font-size="8" text-anchor="middle" fill="#999999">(implied, not in source)</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc00cc"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333333">Fatty Acid Transport by CD36 via LYN-mediated Endocytosis</text>
  <text x="400" y="65" font-family="Arial" font-size="16" text-anchor="middle" fill="#666666">Human (Homo sapiens)</text>
  
  <!-- Color-coded legend -->
  <rect x="150" y="520" width="500" height="150" fill="#ffffff" stroke="#999999" stroke-width="1" rx="5" ry="5"/>
  <text x="400" y="540" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">Legend</text>
  
  <!-- Legend items -->
  <!-- Proteins -->
  <rect x="170" y="560" width="20" height="15" rx="3" ry="3" fill="#9999ff" stroke="#6666cc" stroke-width="1"/>
  <text x="200" y="572" font-family="Arial" font-size="12" fill="#333333">CD36 (Cargo receptor)</text>
  
  <rect x="170" y="585" width="20" height="15" rx="3" ry="3" fill="#99cc99" stroke="#669966" stroke-width="1"/>
  <text x="200" y="597" font-family="Arial" font-size="12" fill="#333333">LYN (Protein tyrosine kinase)</text>
  
  <rect x="170" y="610" width="20" height="15" rx="3" ry="3" fill="#ff9999" stroke="#cc6666" stroke-width="1"/>
  <text x="200" y="622" font-family="Arial" font-size="12" fill="#333333">ZDHHC5 (Palmitoyltransferase)</text>
  
  <rect x="170" y="635" width="20" height="15" rx="3" ry="3" fill="#ffcc66" stroke="#cc9933" stroke-width="1"/>
  <text x="200" y="647" font-family="Arial" font-size="12" fill="#333333">LYPLA1 (Palmitoyl hydrolase)</text>
  
  <!-- Metabolites -->
  <ellipse cx="400" y="567" rx="10" ry="5" fill="#ffcc99" stroke="#ff9966" stroke-width="1"/>
  <text x="430" y="572" font-family="Arial" font-size="12" fill="#333333">Fatty Acid</text>
  
  <!-- Processes -->
  <line x1="380" y1="597" x2="420" y2="597" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="430" y="597" font-family="Arial" font-size="12" fill="#333333">Direct activation/regulation</text>
  
  <line x1="380" y1="622" x2="420" y2="622" stroke="#cc00cc" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#purpleArrow)"/>
  <text x="430" y="622" font-family="Arial" font-size="12" fill="#333333">Endocytosis process</text>
  
  <line x1="380" y1="647" x2="420" y2="647" stroke="#ff9966" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="430" y="647" font-family="Arial" font-size="12" fill="#333333">Fatty acid transport</text>
</svg>