<svg width="800" height="550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="550" fill="#f9f9f9"/>
  
  <!-- Mitochondrial membranes -->
  <path d="M 50,150 C 150,130 250,170 350,150 C 450,130 550,170 650,150 C 750,130 800,150 800,150 L 800,200 C 700,220 600,180 500,200 C 400,220 300,180 200,200 C 100,220 50,200 50,200 Z" fill="#d9edf7" stroke="#333" stroke-width="1"/>
  <path d="M 50,250 C 150,230 250,270 350,250 C 450,230 550,270 650,250 C 750,230 800,250 800,250 L 800,300 C 700,320 600,280 500,300 C 400,320 300,280 200,300 C 100,320 50,300 50,300 Z" fill="#e6f5ff" stroke="#333" stroke-width="2"/>
  
  <!-- Text labels for compartments -->
  <rect x="250" y="105" width="300" height="22" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="400" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Mitochondrial Intermembrane Space (IMS)</text>
  
  <rect x="250" y="325" width="300" height="22" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="400" y="340" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Mitochondrial Matrix</text>
  
  <rect x="50" y="265" width="100" height="35" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="100" y="280" font-family="Arial" font-size="14" text-anchor="middle">Mitochondrial</text>
  <text x="100" y="300" font-family="Arial" font-size="14" text-anchor="middle">Inner Membrane</text>
  
  <!-- AFG3L2-SPG7 complex (m-AAA protease) -->
  <circle cx="150" cy="275" r="30" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="150" y="270" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">AFG3L2</text>
  <text x="150" y="285" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SPG7</text>
  <text x="150" y="315" font-family="Arial" font-size="10" text-anchor="middle">m-AAA protease</text>
  
  <!-- SMDT1/EMRE protein -->
  <rect x="260" y="260" width="60" height="30" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="290" y="280" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SMDT1</text>
  
  <!-- Cleaved SMDT1/EMRE fragments -->
  <rect x="270" y="360" width="25" height="15" fill="#99ccff" stroke="#333" stroke-width="1" stroke-dasharray="5,2"/>
  <rect x="305" y="360" width="25" height="15" fill="#99ccff" stroke="#333" stroke-width="1" stroke-dasharray="5,2"/>
  <text x="300" y="390" font-family="Arial" font-size="11" text-anchor="middle">Cleaved SMDT1</text>
  <text x="300" y="405" font-family="Arial" font-size="11" text-anchor="middle">(Inactive)</text>
  
  <!-- MCU protein -->
  <rect x="400" y="245" width="60" height="60" fill="#99cc99" stroke="#333" stroke-width="2"/>
  <text x="430" y="280" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">MCU</text>
  
  <!-- MICU1 and MICU2 sensors -->
  <polygon points="380,180 420,180 430,200 410,210 390,200" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <rect x="385" y="185" width="40" height="15" fill="#ffcc99" fill-opacity="0.9" stroke="none"/>
  <text x="405" y="197" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">MICU1</text>
  
  <polygon points="440,180 480,180 490,200 470,210 450,200" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <rect x="445" y="185" width="40" height="15" fill="#ffcc99" fill-opacity="0.9" stroke="none"/>
  <text x="465" y="197" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">MICU2</text>
  
  <!-- Functional MCU Complex (Left) -->
  <g id="functional-state">
    <rect x="120" y="215" width="140" height="25" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
    <text x="190" y="230" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Functional State</text>
    
    <!-- Calcium ions -->
    <circle cx="390" cy="170" r="10" fill="#ffff00" stroke="#333" stroke-width="1.5"/>
    <text x="390" y="174" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ca²⁺</text>
    
    <circle cx="440" cy="170" r="10" fill="#ffff00" stroke="#333" stroke-width="1.5"/>
    <text x="440" y="174" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ca²⁺</text>
    
    <circle cx="430" cy="370" r="10" fill="#ffff00" stroke="#333" stroke-width="1.5"/>
    <text x="430" y="374" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ca²⁺</text>
    
    <!-- Calcium flow through MCU -->
    <path d="M 430,210 L 430,245" stroke="#0066cc" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowhead-blue)"/>
    <path d="M 430,305 L 430,360" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
    <rect x="435" y="315" width="70" height="20" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
    <text x="470" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#0066cc">Ca²⁺ flow</text>
  </g>

  <!-- Dysfunctional State (Right) -->
  <g id="dysfunction-state">
    <rect x="510" y="215" width="140" height="25" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
    <text x="580" y="230" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">After Cleavage</text>
    
    <!-- Cleaved SMDT1 no longer facilitating MCU function -->
    <rect x="550" y="260" width="60" height="30" fill="#99ccff" stroke="#333" stroke-width="2" stroke-dasharray="5,2"/>
    <text x="580" y="278" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Cleaved</text>
    <text x="580" y="290" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">SMDT1</text>
    
    <!-- Dysfunctional MCU (not permitting calcium flow) -->
    <rect x="650" y="245" width="60" height="60" fill="#99cc99" stroke="#333" stroke-width="2" stroke-dasharray="5,2"/>
    <text x="680" y="280" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">MCU</text>
    <text x="680" y="295" font-family="Arial" font-size="10" text-anchor="middle">(Inactive)</text>
    
    <!-- Blocked calcium flow -->
    <path d="M 680,210 L 680,245" stroke="#cc0000" stroke-width="3" stroke-dasharray="5,3"/>
    <path d="M 676,215 L 684,225" stroke="#cc0000" stroke-width="3"/>
    <path d="M 676,225 L 684,215" stroke="#cc0000" stroke-width="3"/>
    <rect x="685" y="215" width="65" height="20" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
    <text x="718" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#cc0000" font-weight="bold">Blocked</text>
    
    <!-- Calcium ions (only in IMS, not flowing to matrix) -->
    <circle cx="660" cy="170" r="10" fill="#ffff00" stroke="#333" stroke-width="1.5"/>
    <text x="660" y="174" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ca²⁺</text>
    
    <circle cx="700" cy="170" r="10" fill="#ffff00" stroke="#333" stroke-width="1.5"/>
    <text x="700" y="174" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Ca²⁺</text>
  </g>
  
  <!-- Arrows for protein interactions -->
  <!-- m-AAA protease cleaving SMDT1 -->
  <path d="M 180,275 L 250,275" stroke="#993333" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
  <rect x="185" y="255" width="60" height="20" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="215" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#993333" font-weight="bold">Cleaves</text>
  <rect x="185" y="285" width="60" height="20" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="215" y="300" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">Proteolysis</text>
  
  <!-- SMDT1 as adaptor to MCU -->
  <path d="M 320,275 L 390,275" stroke="#006699" stroke-width="2.5" marker-end="url(#arrowhead-blue)"/>
  <rect x="325" y="250" width="60" height="20" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="355" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#006699" font-weight="bold">Adaptor</text>
  
  <!-- MICU1/MICU2 regulation of MCU -->
  <path d="M 410,210 L 410,245" stroke="#cc0000" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-red)"/>
  <path d="M 450,210 L 450,245" stroke="#cc0000" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-red)"/>
  <rect x="350" y="215" width="50" height="20" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="375" y="230" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc0000" font-weight="bold">Inhibits</text>
  
  <!-- Consequence arrow from SMDT1 cleavage to dysfunctional MCU -->
  <path d="M 300,390 C 400,420 500,420 600,390" stroke="#333" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <rect x="380" y="425" width="140" height="20" fill="#f9f9f9" fill-opacity="0.8" rx="5" ry="5"/>
  <text x="450" y="440" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Leads to MCU dysfunction</text>
  
  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <rect x="100" y="25" width="600" height="50" fill="#f9f9f9" fill-opacity="0.9" rx="10" ry="10"/>
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Inhibition of SMDT1/EMRE and MCU following cleavage by the m-AAA protease complex</text>
  <text x="400" y="65" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Regulation of calcium import into mitochondria</text>
  
  <!-- Legend -->
  <rect x="600" y="420" width="180" height="120" fill="white" stroke="#333" stroke-width="1"/>
  <text x="690" y="440" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="620" y="460" r="10" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="695" y="465" font-family="Arial" font-size="12" text-anchor="start">m-AAA protease</text>
  
  <rect x="610" y="480" width="20" height="15" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="695" y="490" font-family="Arial" font-size="12" text-anchor="start">SMDT1 (Adaptor)</text>
  
  <rect x="610" y="500" width="20" height="15" fill="#99cc99" stroke="#333" stroke-width="1"/>
  <text x="695" y="510" font-family="Arial" font-size="12" text-anchor="start">MCU (Ca²⁺ channel)</text>
  
  <polygon points="610,520 630,520 635,530 625,535 615,530" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="695" y="530" font-family="Arial" font-size="12" text-anchor="start">MICU1/2 (Ca²⁺ sensors)</text>
  
  <circle cx="620" y="545" r="8" fill="#ffff00" stroke="#333" stroke-width="1"/>
  <text x="695" y="550" font-family="Arial" font-size="12" text-anchor="start">Calcium ions (Ca²⁺)</text>
</svg>