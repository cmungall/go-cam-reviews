<svg width="850" height="700" xmlns="http://www.w3.org/2000/svg">
    <!-- Background and cellular compartments -->
    <!-- Extracellular Space -->
    <rect x="0" y="0" width="850" height="200" fill="#e6f7ff" stroke="#a8d1e0" stroke-width="2" />
    <text x="20" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#555">Extracellular Region</text>
    
    <!-- Plasma Membrane -->
    <path d="M0,200 L850,200" stroke="#88aadd" stroke-width="6" stroke-linecap="round" stroke-dasharray="2,4" />
    <text x="20" y="225" font-family="Arial" font-size="18" font-weight="bold" fill="#555">Plasma Membrane</text>

    <!-- Cytosol -->
    <rect x="0" y="200" width="850" height="250" fill="#eef9ee" stroke="#c8e6c9" stroke-width="2" />
    <text x="20" y="250" font-family="Arial" font-size="20" font-weight="bold" fill="#555">Cytosol</text>
    
    <!-- ER Membrane -->
    <path d="M100,350 Q 250,310 400,350 Q 550,390 700,350 Q 850,310 950,350" stroke="#e8924c" stroke-width="5" fill="none" />
    <text x="400" y="320" font-family="Arial" font-size="18" font-weight="bold" fill="#555" text-anchor="middle">ER Membrane</text>
    
    <!-- Title -->
    <text x="425" y="485" font-family="Arial" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Retinoid Metabolic Process in Mouse</text>
    
    <!-- Molecules and Proteins -->
    
    <!-- 1. Retinyl Palmitate in Extracellular Space -->
    <circle cx="180" cy="100" r="35" fill="#ffcc88" stroke="#e8924c" stroke-width="2" />
    <text x="180" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Retinyl</text>
    <text x="180" y="118" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Palmitate</text>
    
    <!-- 2. Clps (Enzyme Activator) -->
    <rect x="280" y="50" width="90" height="45" rx="10" fill="#a1d4e5" stroke="#4a90d9" stroke-width="2" />
    <text x="325" y="78" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Clps</text>
    <text x="325" y="35" font-family="Arial" font-size="12" fill="#555" font-style="italic" text-anchor="middle">enzyme activator</text>
    
    <!-- 3. Pnlip (Retinyl-palmitate esterase) -->
    <rect x="280" y="130" width="90" height="45" rx="10" fill="#a1d4e5" stroke="#4a90d9" stroke-width="2" />
    <text x="325" y="158" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Pnlip</text>
    <text x="325" y="185" font-family="Arial" font-size="12" fill="#555" font-style="italic" text-anchor="middle">retinyl-palmitate esterase</text>

    <!-- 4. Retinol in Extracellular Space -->
    <circle cx="420" cy="100" r="35" fill="#ffee99" stroke="#e8b84c" stroke-width="2" />
    <text x="420" y="105" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Retinol</text>

    <!-- 5. Lpl (Lipoprotein Lipase) -->
    <rect x="520" y="100" width="90" height="45" rx="10" fill="#a1d4e5" stroke="#4a90d9" stroke-width="2" />
    <text x="565" y="128" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Lpl</text>
    <text x="565" y="155" font-family="Arial" font-size="12" fill="#555" font-style="italic" text-anchor="middle">lipoprotein lipase</text>
    
    <!-- 6. Chylomicron -->
    <ellipse cx="670" cy="100" rx="65" ry="40" fill="#ffe0b2" stroke="#ffb74d" stroke-width="2" />
    <text x="670" y="105" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Chylomicron</text>
    
    <!-- 7. Ldlr (LDL Receptor) in Plasma Membrane -->
    <rect x="240" y="180" width="90" height="45" rx="10" fill="#c5e1a5" stroke="#7cb342" stroke-width="2" />
    <text x="285" y="208" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Ldlr</text>
    <text x="285" y="235" font-family="Arial" font-size="12" fill="#555" font-style="italic" text-anchor="middle">LDL receptor</text>
    
    <!-- 8. Rbp2 (Retinol Binding Protein) in Cytosol -->
    <rect x="400" y="270" width="90" height="45" rx="10" fill="#c5e1a5" stroke="#7cb342" stroke-width="2" />
    <text x="445" y="298" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Rbp2</text>
    <text x="445" y="255" font-family="Arial" font-size="12" fill="#555" font-style="italic" text-anchor="middle">molecular carrier</text>
    
    <!-- 9. Retinol in Cytosol -->
    <circle cx="300" y="270" r="35" fill="#ffee99" stroke="#e8b84c" stroke-width="2" />
    <text x="300" y="275" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Retinol</text>
    
    <!-- 10. Lrat (in ER membrane) -->
    <rect x="450" y="350" width="90" height="45" rx="10" fill="#ffab91" stroke="#ff7043" stroke-width="2" />
    <text x="495" y="378" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Lrat</text>
    <text x="495" y="405" font-family="Arial" font-size="12" fill="#555" font-style="italic" text-anchor="middle">acyltransferase</text>
    
    <!-- 11. Retsat (in ER membrane) -->
    <rect x="240" y="350" width="90" height="45" rx="10" fill="#ffab91" stroke="#ff7043" stroke-width="2" />
    <text x="285" y="378" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Retsat</text>
    <text x="285" y="405" font-family="Arial" font-size="12" fill="#555" font-style="italic" text-anchor="middle">retinol 13,14-reductase</text>
    
    <!-- 12. Retinyl Ester in ER -->
    <circle cx="600" y="390" r="35" fill="#ffcc88" stroke="#e8924c" stroke-width="2" />
    <text x="600" y="388" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Retinyl</text>
    <text x="600" y="408" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Ester</text>
    
    <!-- Arrows and Pathway Flow -->
    <!-- Clps activates Pnlip -->
    <path d="M325,95 L325,130" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    <text x="340" y="115" font-family="Arial" font-size="13" fill="#555" font-weight="bold">activates</text>
    
    <!-- Retinyl Palmitate to Pnlip -->
    <path d="M215,100 L280,143" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    
    <!-- Pnlip converts Retinyl Palmitate to Retinol -->
    <path d="M370,143 C390,125 400,115 420,100" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    <text x="390" y="135" font-family="Arial" font-size="13" fill="#555" font-weight="bold">hydrolysis</text>
    
    <!-- Lpl affects Chylomicron -->
    <path d="M610,122 L605,122" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    <text x="635" y="85" font-family="Arial" font-size="13" fill="#555" font-weight="bold">remodeling</text>
    
    <!-- Retinol enters cell via Ldlr -->
    <path d="M420,135 C370,160 340,180 295,180" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    <text x="370" y="165" font-family="Arial" font-size="13" fill="#555" font-weight="bold">uptake</text>
    
    <!-- Ldlr allows Retinol to enter cytosol -->
    <path d="M285,225 L285,235" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    <text x="250" y="255" font-family="Arial" font-size="13" fill="#555" font-weight="bold">internalization</text>
    
    <!-- Rbp2 binds to Retinol -->
    <path d="M335,270 L400,285" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    <text x="365" y="265" font-family="Arial" font-size="13" fill="#555" font-weight="bold">binds</text>
    
    <!-- Rbp2-Retinol complex to Lrat -->
    <path d="M445,315 C460,335 480,340 495,350" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    <text x="480" y="330" font-family="Arial" font-size="13" fill="#555" font-weight="bold">transport</text>
    
    <!-- Lrat converts to Retinyl Ester -->
    <path d="M540,370 C560,380 580,385 600,390" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    <text x="550" y="365" font-family="Arial" font-size="13" fill="#555" font-weight="bold">esterification</text>
    
    <!-- Retsat pathway -->
    <path d="M285,315 L285,350" stroke="#666" stroke-width="2.5" marker-end="url(#arrowhead)" fill="none" />
    <text x="230" y="333" font-family="Arial" font-size="13" fill="#555" font-weight="bold">reduction</text>
    
    <!-- Markers definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
        </marker>
    </defs>
    
    <!-- Legend -->
    <rect x="40" y="510" width="770" height="170" fill="white" stroke="#ccc" stroke-width="2" rx="5" />
    <text x="60" y="535" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Legend</text>
    
    <!-- Legend items -->
    <circle cx="80" y="560" r="12" fill="#ffee99" stroke="#e8b84c" stroke-width="2" />
    <text x="105" y="565" font-family="Arial" font-size="16" fill="#333">Retinol (all-trans-retinol)</text>
    
    <circle cx="80" y="590" r="12" fill="#ffcc88" stroke="#e8924c" stroke-width="2" />
    <text x="105" y="595" font-family="Arial" font-size="16" fill="#333">Retinyl Ester/Palmitate (storage form of retinol)</text>
    
    <rect x="68" y="610" width="24" height="18" rx="5" fill="#a1d4e5" stroke="#4a90d9" stroke-width="2" />
    <text x="105" y="625" font-family="Arial" font-size="16" fill="#333">Extracellular Proteins</text>
    
    <rect x="68" y="640" width="24" height="18" rx="5" fill="#c5e1a5" stroke="#7cb342" stroke-width="2" />
    <text x="105" y="655" font-family="Arial" font-size="16" fill="#333">Cytosolic Proteins</text>
    
    <rect x="68" y="670" width="24" height="18" rx="5" fill="#ffab91" stroke="#ff7043" stroke-width="2" />
    <text x="105" y="685" font-family="Arial" font-size="16" fill="#333">ER Membrane Proteins</text>
    
    <rect x="350" y="610" width="440" height="70" fill="#f9f9f9" stroke="#eaeaea" stroke-width="1" rx="5" />
    <text x="360" y="630" font-family="Arial" font-size="14" fill="#444">Gene products: Rbp2 (retinol carrier), Lrat (esterifies retinol), Ldlr (LDL receptor),</text>
    <text x="360" y="650" font-family="Arial" font-size="14" fill="#444">Pnlip (retinyl-palmitate esterase), Lpl (lipoprotein lipase), Clps (activates Pnlip),</text>
    <text x="360" y="670" font-family="Arial" font-size="14" fill="#444">Retsat (reduces retinol)</text>
</svg>