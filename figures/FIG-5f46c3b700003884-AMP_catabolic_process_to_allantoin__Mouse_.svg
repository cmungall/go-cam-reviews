<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="white"/>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Cell compartments -->
  <!-- Cytosol -->
  <rect x="50" y="80" width="700" height="350" rx="20" ry="20" fill="#E6F3FF" stroke="#90C4FF" stroke-width="2"/>
  <text x="80" y="110" font-family="Arial" font-size="16" font-weight="bold">Cytosol</text>
  
  <!-- Peroxisome -->
  <rect x="100" y="460" width="600" height="200" rx="20" ry="20" fill="#FFF0E6" stroke="#FFB490" stroke-width="2"/>
  <text x="130" y="490" font-family="Arial" font-size="16" font-weight="bold">Peroxisome</text>
  
  <!-- Molecules and reactions in cytosol -->
  <!-- AMP -->
  <rect x="120" y="180" width="70" height="30" rx="15" ry="15" fill="#D1E7FF" stroke="#7CB9E8" stroke-width="2"/>
  <text x="135" y="200" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">AMP</text>
  
  <!-- Arrow 1 -->
  <line x1="190" y1="195" x2="230" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="180" y="175" font-family="Arial" font-size="12" fill="#000000">Nt5c1b, Nt5c1a</text>
  <text x="190" y="160" font-family="Arial" font-size="10" font-style="italic" fill="#000000">5'-nucleotidase</text>
  
  <!-- Adenosine -->
  <rect x="230" y="180" width="90" height="30" rx="15" ry="15" fill="#D1E7FF" stroke="#7CB9E8" stroke-width="2"/>
  <text x="240" y="200" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Adenosine</text>
  
  <!-- Arrow 2 -->
  <line x1="320" y1="195" x2="360" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="330" y="175" font-family="Arial" font-size="12" fill="#000000">Ada</text>
  <text x="315" y="160" font-family="Arial" font-size="10" font-style="italic" fill="#000000">adenosine deaminase</text>
  
  <!-- Inosine -->
  <rect x="360" y="180" width="70" height="30" rx="15" ry="15" fill="#D1E7FF" stroke="#7CB9E8" stroke-width="2"/>
  <text x="370" y="200" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Inosine</text>
  
  <!-- Arrow 3 -->
  <line x1="430" y1="195" x2="470" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="435" y="175" font-family="Arial" font-size="12" fill="#000000">Pnp</text>
  <text x="415" y="160" font-family="Arial" font-size="10" font-style="italic" fill="#000000">purine-nucleoside phosphorylase</text>
  
  <!-- Hypoxanthine -->
  <rect x="470" y="180" width="100" height="30" rx="15" ry="15" fill="#D1E7FF" stroke="#7CB9E8" stroke-width="2"/>
  <text x="480" y="200" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Hypoxanthine</text>
  
  <!-- Arrow 4 -->
  <line x1="520" y1="210" x2="520" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="230" font-family="Arial" font-size="12" fill="#000000">Xdh</text>
  <text x="530" y="245" font-family="Arial" font-size="10" font-style="italic" fill="#000000">hypoxanthine dehydrogenase/oxidase</text>
  
  <!-- Xanthine -->
  <rect x="470" y="250" width="100" height="30" rx="15" ry="15" fill="#D1E7FF" stroke="#7CB9E8" stroke-width="2"/>
  <text x="490" y="270" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Xanthine</text>
  
  <!-- Arrow 5 -->
  <line x1="520" y1="280" x2="520" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="300" font-family="Arial" font-size="12" fill="#000000">Xdh</text>
  <text x="530" y="315" font-family="Arial" font-size="10" font-style="italic" fill="#000000">xanthine oxidase</text>
  
  <!-- Urate -->
  <rect x="470" y="320" width="100" height="30" rx="15" ry="15" fill="#D1E7FF" stroke="#7CB9E8" stroke-width="2"/>
  <text x="500" y="340" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Urate</text>
  
  <!-- Transport to peroxisome (dashed arrow) -->
  <line x1="520" y1="350" x2="520" y2="460" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="530" y="400" font-family="Arial" font-size="12" font-style="italic" fill="#000000">Transport</text>
  <text x="530" y="415" font-family="Arial" font-size="10" fill="#666">(not in source)</text>
  
  <!-- Molecules and reactions in peroxisome -->
  <!-- Urate in peroxisome -->
  <rect x="470" y="460" width="100" height="30" rx="15" ry="15" fill="#FFD1B3" stroke="#FF9966" stroke-width="2"/>
  <text x="500" y="480" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Urate</text>
  
  <!-- Arrow 6 -->
  <line x1="520" y1="490" x2="520" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="510" font-family="Arial" font-size="12" fill="#000000">Uox</text>
  <text x="530" y="525" font-family="Arial" font-size="10" font-style="italic" fill="#000000">urate oxidase</text>
  
  <!-- 5-hydroxyisourate -->
  <rect x="450" y="530" width="140" height="30" rx="15" ry="15" fill="#FFD1B3" stroke="#FF9966" stroke-width="2"/>
  <text x="460" y="550" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">5-hydroxyisourate</text>
  
  <!-- Arrow 7 -->
  <line x1="520" y1="560" x2="520" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="580" font-family="Arial" font-size="12" fill="#000000">Urah</text>
  <text x="530" y="595" font-family="Arial" font-size="10" font-style="italic" fill="#000000">hydroxyisourate hydrolase</text>
  
  <!-- OHCU (2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline) - with abbreviation -->
  <rect x="470" y="600" width="100" height="40" rx="15" ry="15" fill="#FFD1B3" stroke="#FF9966" stroke-width="2"/>
  <text x="495" y="615" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">OHCU</text>
  <text x="485" y="630" font-family="Arial" font-size="9" fill="#000000">2-oxo-4-hydroxy-4-carboxy-</text>
  <text x="485" y="640" font-family="Arial" font-size="9" fill="#000000">5-ureidoimidazoline</text>
  
  <!-- Final arrow -->
  <line x1="570" y1="620" x2="610" y2="620" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="580" y="605" font-family="Arial" font-size="12" fill="#000000">Urad</text>
  <text x="580" y="590" font-family="Arial" font-size="10" font-style="italic" fill="#000000">decarboxylase</text>
  
  <!-- Allantoin -->
  <rect x="610" y="600" width="80" height="40" rx="15" ry="15" fill="#FFD1B3" stroke="#FF9966" stroke-width="2"/>
  <text x="625" y="625" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Allantoin</text>
  
  <!-- Figure title -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">AMP Catabolic Process to Allantoin (Mouse)</text>
  
  <!-- Legend -->
  <rect x="600" y="100" width="140" height="135" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="620" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">Legend</text>
  
  <rect x="610" y="130" width="20" height="15" rx="5" ry="5" fill="#D1E7FF" stroke="#7CB9E8" stroke-width="1"/>
  <text x="635" y="142" font-family="Arial" font-size="12" fill="#000000">Cytosolic metabolite</text>
  
  <rect x="610" y="155" width="20" height="15" rx="5" ry="5" fill="#FFD1B3" stroke="#FF9966" stroke-width="1"/>
  <text x="635" y="167" font-family="Arial" font-size="12" fill="#000000">Peroxisomal metabolite</text>
  
  <line x1="610" y1="180" x2="630" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="635" y="182" font-family="Arial" font-size="12" fill="#000000">Enzymatic reaction</text>
  
  <line x1="610" y1="195" x2="630" y2="195" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="635" y="197" font-family="Arial" font-size="12" fill="#000000">Implied transport</text>
  
  <rect x="610" y="210" width="20" height="15" rx="0" ry="0" fill="white" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="635" y="222" font-family="Arial" font-size="12" fill="#666">Not in source model</text>
</svg>