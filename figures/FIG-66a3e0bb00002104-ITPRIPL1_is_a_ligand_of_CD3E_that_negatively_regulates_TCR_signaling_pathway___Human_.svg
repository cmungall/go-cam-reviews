<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#e6f2ff" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Plasma membrane -->
  <ellipse cx="400" cy="300" rx="320" ry="220" fill="none" stroke="#2c3e50" stroke-width="8" stroke-dasharray="5,3"/>
  <text x="700" y="300" font-family="Arial" font-size="18" fill="#2c3e50">Plasma membrane</text>
  <line x1="650" y1="300" x2="620" y2="300" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Cytoplasm label -->
  <text x="400" y="170" font-family="Arial" font-size="18" fill="#2c3e50" text-anchor="middle">Cytoplasm</text>
  
  <!-- T cell label -->
  <text x="400" y="80" font-family="Arial" font-size="24" font-weight="bold" fill="#2c3e50" text-anchor="middle">T Cell</text>
  
  <!-- ITPRIPL1 (outside the cell) -->
  <circle cx="200" cy="50" r="40" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="200" y="55" font-family="Arial" font-size="16" font-weight="bold" fill="black" text-anchor="middle">ITPRIPL1</text>
  <text x="200" y="75" font-family="Arial" font-size="12" fill="black" text-anchor="middle">(Q6GPH6)</text>
  
  <!-- T cell receptor complex -->
  <rect x="350" y="520" width="100" height="40" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="400" y="545" font-family="Arial" font-size="16" font-weight="bold" fill="black" text-anchor="middle">TCR complex</text>
  
  <!-- CD3E on membrane -->
  <rect x="380" y="460" width="60" height="30" rx="5" ry="5" fill="#99ff99" stroke="#009900" stroke-width="2"/>
  <text x="410" y="480" font-family="Arial" font-size="16" font-weight="bold" fill="black" text-anchor="middle">CD3E</text>
  
  <!-- LCK in cytoplasm -->
  <rect x="380" y="400" width="60" height="30" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="410" y="420" font-family="Arial" font-size="16" font-weight="bold" fill="black" text-anchor="middle">LCK</text>
  
  <!-- ZAP70 in cytoplasm -->
  <rect x="380" y="340" width="60" height="30" rx="5" ry="5" fill="#cc99ff" stroke="#6600cc" stroke-width="2"/>
  <text x="410" y="360" font-family="Arial" font-size="16" font-weight="bold" fill="black" text-anchor="middle">ZAP70</text>
  
  <!-- NCK1 in cytoplasm -->
  <rect x="280" y="430" width="60" height="30" rx="5" ry="5" fill="#ffff99" stroke="#cccc00" stroke-width="2"/>
  <text x="310" y="450" font-family="Arial" font-size="16" font-weight="bold" fill="black" text-anchor="middle">NCK1</text>
  
  <!-- LAT in membrane -->
  <rect x="380" y="280" width="60" height="30" rx="5" ry="5" fill="#99ffff" stroke="#00cccc" stroke-width="2"/>
  <text x="410" y="300" font-family="Arial" font-size="16" font-weight="bold" fill="black" text-anchor="middle">LAT</text>
  
  <!-- MAPK cascade (implied/filled in) -->
  <rect x="380" y="220" width="80" height="30" rx="5" ry="5" fill="#dddddd" stroke="#999999" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="420" y="240" font-family="Arial" font-size="16" font-weight="bold" fill="#666666" text-anchor="middle">MAPK</text>
  <text x="470" y="230" font-family="Arial" font-size="12" fill="#666666" font-style="italic">(implied)</text>
  
  <!-- Arrows and interactions -->
  <!-- ITPRIPL1 to CD3E -->
  <path d="M 220 85 L 390 450" fill="none" stroke="#cc0000" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="300" y="250" font-family="Arial" font-size="14" fill="#cc0000" transform="rotate(-45, 300, 250)">Ligand binding</text>
  
  <!-- TCR to CD3E -->
  <path d="M 400 520 L 410 490" fill="none" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowBlue)"/>
  
  <!-- CD3E to LCK -->
  <path d="M 410 460 L 410 430" fill="none" stroke="#009900" stroke-width="3" marker-end="url(#arrowGreen)"/>
  
  <!-- LCK to ZAP70 -->
  <path d="M 410 400 L 410 370" fill="none" stroke="#ff6600" stroke-width="3" marker-end="url(#arrowOrange)"/>
  
  <!-- ZAP70 to LAT -->
  <path d="M 410 340 L 410 310" fill="none" stroke="#6600cc" stroke-width="3" marker-end="url(#arrowPurple)"/>
  
  <!-- LAT to MAPK -->
  <path d="M 410 280 L 410 250" fill="none" stroke="#00cccc" stroke-width="3" marker-end="url(#arrowCyan)"/>
  
  <!-- NCK1 to CD3E (inhibitory) -->
  <path d="M 310 430 L 380 460" fill="none" stroke="#cccc00" stroke-width="3" marker-end="url(#arrowYellow)"/>
  <text x="320" y="440" font-family="Arial" font-size="14" fill="#cccc00">Sequestering</text>
  
  <!-- ITPRIPL1 to NCK1 -->
  <path d="M 200 90 L 280 430" fill="none" stroke="#cc0000" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="180" y="250" font-family="Arial" font-size="14" fill="#cc0000" transform="rotate(-75, 180, 250)">Negative regulation</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cc0000"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0066cc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#009900"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff6600"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6600cc"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00cccc"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cccc00"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    ITPRIPL1 Negatively Regulates TCR Signaling Pathway
  </text>
  
  <!-- Legend -->
  <rect x="10" y="420" width="210" height="170" fill="white" stroke="#2c3e50" stroke-width="1"/>
  <text x="115" y="440" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">Legend</text>
  
  <!-- Legend items -->
  <circle cx="30" y="465" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="50" y="470" font-family="Arial" font-size="14" fill="#2c3e50">ITPRIPL1 - Receptor ligand</text>
  
  <rect x="20" y="485" width="20" height="14" rx="2" ry="2" fill="#99ff99" stroke="#009900" stroke-width="1"/>
  <text x="50" y="497" font-family="Arial" font-size="14" fill="#2c3e50">CD3E - Transmembrane receptor</text>
  
  <rect x="20" y="510" width="20" height="14" rx="2" ry="2" fill="#ffcc99" stroke="#ff6600" stroke-width="1"/>
  <text x="50" y="522" font-family="Arial" font-size="14" fill="#2c3e50">LCK - Tyrosine kinase</text>
  
  <rect x="20" y="535" width="20" height="14" rx="2" ry="2" fill="#cc99ff" stroke="#6600cc" stroke-width="1"/>
  <text x="50" y="547" font-family="Arial" font-size="14" fill="#2c3e50">ZAP70 - Tyrosine kinase</text>
  
  <rect x="20" y="560" width="20" height="14" rx="2" ry="2" fill="#ffff99" stroke="#cccc00" stroke-width="1"/>
  <text x="50" y="572" font-family="Arial" font-size="14" fill="#2c3e50">NCK1 - Protein sequestering</text>
</svg>