<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Skeletal Muscle Acetylcholine-Gated Channel Clustering (Mouse)</text>
  
  <!-- Cell Compartments -->
  <!-- Extracellular Space -->
  <rect x="50" y="100" width="700" height="150" fill="#e6f7ff" stroke="#aad4e6" stroke-width="2" rx="10"/>
  <text x="100" y="125" font-family="Arial" font-size="16" font-style="italic">Extracellular Space (GO:0005615)</text>
  
  <!-- Muscle Fiber Cell -->
  <rect x="50" y="250" width="700" height="340" fill="#f2e6ff" stroke="#d4aacc" stroke-width="2" rx="10"/>
  <text x="100" y="275" font-family="Arial" font-size="16" font-style="italic">Skeletal Muscle Fiber (CL:0008002)</text>
  
  <!-- Postsynaptic Membrane -->
  <rect x="100" y="300" width="600" height="230" fill="#ffe6e6" stroke="#e6aaa4" stroke-width="2" rx="5"/>
  <text x="150" y="325" font-family="Arial" font-size="16" font-style="italic">Postsynaptic Membrane (GO:0045211)</text>
  
  <!-- Protein Representations -->
  <!-- Agrin (MGI:MGI:87961) in extracellular space -->
  <circle cx="200" cy="175" r="30" fill="#ff9999" stroke="#cc7777" stroke-width="2"/>
  <text x="200" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Agrin</text>
  
  <!-- LRP4 (MGI:MGI:2442252) at membrane -->
  <rect x="180" y="285" width="60" height="30" fill="#99cc99" stroke="#77aa77" stroke-width="2" rx="5"/>
  <text x="210" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">LRP4</text>
  
  <!-- MuSK (MGI:MGI:103581) at postsynaptic membrane -->
  <rect x="300" y="285" width="60" height="30" fill="#9999ff" stroke="#7777cc" stroke-width="2" rx="5"/>
  <text x="330" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MuSK</text>
  
  <!-- DOK7 (MGI:MGI:3584043) -->
  <polygon points="330,360 360,340 360,380" fill="#ffcc99" stroke="#e6aa77" stroke-width="2"/>
  <text x="345" y="365" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">DOK7</text>
  
  <!-- CRK (MGI:MGI:88508) -->
  <ellipse cx="410" cy="400" rx="25" ry="20" fill="#cc99ff" stroke="#aa77e6" stroke-width="2"/>
  <text x="410" y="405" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CRK</text>
  
  <!-- CRKL (MGI:MGI:104686) -->
  <ellipse cx="450" cy="430" rx="25" ry="20" fill="#cc99ff" stroke="#aa77e6" stroke-width="2"/>
  <text x="450" y="435" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CRKL</text>
  
  <!-- FNTA (MGI:MGI:104683) -->
  <rect x="480" y="385" width="60" height="30" fill="#99ccff" stroke="#77aae6" stroke-width="2" rx="5"/>
  <text x="510" y="405" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">FNTA</text>
  
  <!-- FARP1 (MGI:MGI:2446173) -->
  <rect x="540" y="440" width="60" height="30" fill="#ff99cc" stroke="#e677aa" stroke-width="2" rx="5"/>
  <text x="570" y="460" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">FARP1</text>
  
  <!-- RAC1 (MGI:MGI:97845) -->
  <circle cx="610" cy="360" r="25" fill="#ffff99" stroke="#e6e677" stroke-width="2"/>
  <text x="610" y="365" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RAC1</text>
  
  <!-- RAPSN (MGI:MGI:99422) -->
  <rect x="450" y="330" width="70" height="30" fill="#ffcc66" stroke="#e6aa44" stroke-width="2" rx="5"/>
  <text x="485" y="350" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RAPSN</text>
  
  <!-- Acetylcholine Receptors (not explicitly in GO-CAM but needed) -->
  <g transform="translate(560,310)">
    <rect x="-25" y="-15" width="50" height="25" fill="#ffb3e6" stroke="#ff80c0" stroke-width="2" rx="3"/>
    <rect x="-20" y="-10" width="40" height="15" fill="#ffffff" stroke="none"/>
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">AChR</text>
  </g>
  <g transform="translate(490,290)">
    <rect x="-25" y="-15" width="50" height="25" fill="#ffb3e6" stroke="#ff80c0" stroke-width="2" rx="3"/>
    <rect x="-20" y="-10" width="40" height="15" fill="#ffffff" stroke="none"/>
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">AChR</text>
  </g>
  <g transform="translate(530,290)">
    <rect x="-25" y="-15" width="50" height="25" fill="#ffb3e6" stroke="#ff80c0" stroke-width="2" rx="3"/>
    <rect x="-20" y="-10" width="40" height="15" fill="#ffffff" stroke="none"/>
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">AChR</text>
  </g>
  
  <!-- Arrows and Interactions -->
  <!-- Agrin -> LRP4 -->
  <line x1="200" y1="205" x2="210" y2="285" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="170" y="245" font-family="Arial" font-size="13" transform="rotate(-75, 170, 245)">Receptor ligand</text>
  
  <!-- LRP4 -> MuSK -->
  <line x1="240" y1="300" x2="300" y2="300" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="270" y="285" font-family="Arial" font-size="13">Co-receptor</text>
  
  <!-- MuSK -> DOK7 -->
  <line x1="330" y1="315" x2="330" y2="340" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="345" y="330" font-family="Arial" font-size="13">Phosphorylates</text>
  
  <!-- DOK7 -> CRK/CRKL -->
  <line x1="360" y1="360" x2="395" y2="385" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="370" x2="430" y2="420" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="380" y="375" font-family="Arial" font-size="13">Recruits</text>
  
  <!-- CRK/CRKL -> FNTA -->
  <line x1="435" y1="400" x2="480" y2="400" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="475" y1="425" x2="490" y2="415" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="460" y="385" font-family="Arial" font-size="13">Activates</text>
  
  <!-- CRK -> FARP1 -->
  <line x1="430" y1="410" x2="540" y2="440" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="470" y="420" font-family="Arial" font-size="13">Activates</text>
  
  <!-- FNTA -> RAC1 -->
  <line x1="540" y1="385" x2="585" y2="365" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="550" y="365" font-family="Arial" font-size="13">GGTase</text>
  
  <!-- FARP1 -> RAC1 -->
  <line x1="600" y1="440" x2="610" y2="385" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="620" y="415" font-family="Arial" font-size="13">GEF</text>
  
  <!-- RAC1 -> Clustering -->
  <path d="M 610 335 C 610 315 540 300 520 300" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="570" y="315" font-family="Arial" font-size="13">Promotes clustering</text>
  
  <!-- MuSK -> RAPSN -->
  <line x1="360" y1="300" x2="450" y2="330" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="390" y="310" font-family="Arial" font-size="13">Activates</text>
  
  <!-- RAPSN -> AChR -->
  <line x1="510" y1="330" x2="540" y2="300" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="525" y="315" font-family="Arial" font-size="13">Adaptor</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="550" width="700" height="90" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="60" y="570" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <!-- Legend items -->
  <circle cx="90" cy="590" r="15" fill="#ff9999" stroke="#cc7777" stroke-width="2"/>
  <text x="115" y="595" font-family="Arial" font-size="14">Secreted ligand</text>
  
  <rect x="200" y="575" width="30" height="30" fill="#99cc99" stroke="#77aa77" stroke-width="2" rx="3"/>
  <text x="240" y="595" font-family="Arial" font-size="14">Receptor</text>
  
  <rect x="300" y="575" width="30" height="30" fill="#9999ff" stroke="#7777cc" stroke-width="2" rx="3"/>
  <text x="340" y="595" font-family="Arial" font-size="14">Kinase</text>
  
  <polygon points="380,590 400,575 400,605" fill="#ffcc99" stroke="#e6aa77" stroke-width="2"/>
  <text x="425" y="595" font-family="Arial" font-size="14">Adaptor</text>
  
  <circle cx="475" cy="590" r="15" fill="#ffff99" stroke="#e6e677" stroke-width="2"/>
  <text x="500" y="595" font-family="Arial" font-size="14">G-protein</text>
  
  <rect x="570" y="575" width="30" height="30" fill="#ffb3e6" stroke="#ff80c0" stroke-width="2" rx="3"/>
  <text x="610" y="595" font-family="Arial" font-size="14">AChR (not in source)</text>
  
  <!-- Process descriptions -->
  <text x="60" y="620" font-family="Arial" font-size="13">
    <tspan x="60" dy="0">Process: Skeletal muscle acetylcholine receptor clustering at the neuromuscular junction involves</tspan>
    <tspan x="60" dy="18">Agrin signaling through LRP4/MuSK, leading to RAC1 activation and receptor organization.</tspan>
  </text>
</svg>