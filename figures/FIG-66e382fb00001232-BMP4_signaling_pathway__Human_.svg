<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with cell compartments -->
  <rect x="0" y="0" width="800" height="600" fill="#f9f9f9" />
  
  <!-- Extracellular space -->
  <rect x="0" y="0" width="800" height="200" fill="#e6f7ff" />
  <text x="40" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Extracellular Space (GO:0005615)</text>
  
  <!-- Cell membrane -->
  <path d="M 0,200 H 800" stroke="#666" stroke-width="3" fill="none" />
  <text x="40" y="220" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytoplasm -->
  <rect x="0" y="200" width="800" height="240" fill="#f0f5e6" />
  <text x="40" y="240" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Cytoplasm</text>
  
  <!-- Nuclear membrane and nucleus -->
  <ellipse cx="400" cy="500" rx="200" ry="80" fill="#ffe6cc" stroke="#666" stroke-width="2" />
  <text x="370" y="500" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Nucleus (GO:0005634)</text>
  
  <!-- BMP4 in extracellular space -->
  <circle cx="250" cy="100" r="25" fill="#ff9999" stroke="#333" stroke-width="2" />
  <text x="250" y="105" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">BMP4</text>
  <text x="250" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Cytokine activity</text>
  <text x="250" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(UniProtKB:P12644)</text>
  
  <!-- Receptor complex on membrane -->
  <rect x="240" y="175" width="40" height="50" fill="#99ccff" stroke="#333" stroke-width="2" />
  <text x="260" y="195" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">BMPR2</text>
  <text x="260" y="208" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(Type II)</text>
  <text x="260" y="220" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(UniProtKB:Q13873)</text>
  
  <rect x="290" y="175" width="40" height="50" fill="#99ccff" stroke="#333" stroke-width="2" />
  <text x="310" y="195" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">BMPR1A</text>
  <text x="310" y="208" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(Type I)</text>
  <text x="310" y="220" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(UniProtKB:P36894)</text>
  
  <!-- SMAD proteins in cytoplasm -->
  <circle cx="260" cy="300" r="20" fill="#99ff99" stroke="#333" stroke-width="2" />
  <text x="260" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">SMAD1</text>
  <text x="260" y="320" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(UniProtKB:Q15797)</text>
  
  <circle cx="320" cy="300" r="20" fill="#99ff99" stroke="#333" stroke-width="2" />
  <text x="320" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">SMAD5</text>
  <text x="320" y="320" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(UniProtKB:Q99717)</text>
  
  <circle cx="380" cy="300" r="20" fill="#99ff99" stroke="#333" stroke-width="2" />
  <text x="380" y="305" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">SMAD9</text>
  <text x="380" y="320" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">(UniProtKB:O15198)</text>
  
  <!-- SMAD proteins in nucleus -->
  <circle cx="320" cy="480" r="20" fill="#ff99ff" stroke="#333" stroke-width="2" />
  <text x="320" y="485" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">SMAD1</text>
  
  <circle cx="380" cy="480" r="20" fill="#ff99ff" stroke="#333" stroke-width="2" />
  <text x="380" y="485" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">SMAD5</text>
  
  <circle cx="440" cy="480" r="20" fill="#ff99ff" stroke="#333" stroke-width="2" />
  <text x="440" y="485" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">SMAD9</text>
  
  <rect x="320" y="510" width="120" height="20" fill="#ffffcc" stroke="#333" stroke-width="1" />
  <text x="380" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">DNA-binding TF activity</text>
  
  <!-- Pathway arrows and annotations -->
  <!-- BMP4 to receptor -->
  <path d="M 250,125 L 260,175" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="200" y="145" width="90" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="245" y="160" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Ligand binding</text>
  
  <!-- BMPR2 to BMPR1A (activation) -->
  <path d="M 280,200 L 290,200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="255" y="175" width="70" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="290" y="190" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Activation</text>
  
  <!-- BMPR1A to SMADs (phosphorylation) -->
  <path d="M 310,225 L 310,250 L 260,280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 310,225 L 310,250 L 320,280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 310,225 L 310,250 L 380,280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <rect x="340" y="250" width="110" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="395" y="265" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Phosphorylation</text>
  
  <!-- Phosphorylation marks on cytoplasmic SMADs -->
  <circle cx="270" cy="290" r="6" fill="#ffcc00" stroke="#333" stroke-width="1" />
  <text x="270" y="293" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">P</text>
  
  <circle cx="330" cy="290" r="6" fill="#ffcc00" stroke="#333" stroke-width="1" />
  <text x="330" y="293" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">P</text>
  
  <circle cx="390" cy="290" r="6" fill="#ffcc00" stroke="#333" stroke-width="1" />
  <text x="390" y="293" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">P</text>
  
  <!-- SMADs translocation to nucleus -->
  <path d="M 260,320 L 260,420 L 320,460" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  <path d="M 320,320 L 320,380 L 380,460" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  <path d="M 380,320 L 380,400 L 440,460" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  
  <rect x="400" y="365" width="150" height="25" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="475" y="385" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Nuclear translocation</text>
  
  <!-- Phosphorylation marks on nuclear SMADs -->
  <circle cx="330" cy="470" r="6" fill="#ffcc00" stroke="#333" stroke-width="1" />
  <text x="330" y="473" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">P</text>
  
  <circle cx="390" cy="470" r="6" fill="#ffcc00" stroke="#333" stroke-width="1" />
  <text x="390" y="473" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">P</text>
  
  <circle cx="450" cy="470" r="6" fill="#ffcc00" stroke="#333" stroke-width="1" />
  <text x="450" y="473" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">P</text>
  
  <!-- DNA binding -->
  <path d="M 380,535 L 380,550" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="335" y="550" width="90" height="15" fill="#ccccff" stroke="#333" stroke-width="1" />
  <text x="380" y="562" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">TARGET GENES</text>
  
  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Pathway label -->
  <rect x="600" y="20" width="180" height="30" fill="#ffffcc" stroke="#333" stroke-width="1" />
  <text x="690" y="40" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">BMP Signaling Pathway</text>
  <text x="690" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">(GO:0030509)</text>
  
  <!-- Legend -->
  <rect x="600" y="70" width="180" height="270" fill="white" stroke="#333" stroke-width="1" />
  <text x="620" y="90" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Legend:</text>
  
  <circle cx="620" cy="110" r="10" fill="#ff9999" stroke="#333" stroke-width="1" />
  <text x="640" y="115" font-family="Arial" font-size="12" fill="#333">BMP4 (Cytokine)</text>
  
  <rect x="610" y="130" width="20" height="20" fill="#99ccff" stroke="#333" stroke-width="1" />
  <text x="640" y="145" font-family="Arial" font-size="12" fill="#333">BMP Receptors</text>
  
  <circle cx="620" cy="170" r="10" fill="#99ff99" stroke="#333" stroke-width="1" />
  <text x="650" y="175" font-family="Arial" font-size="12" fill="#333">Cytoplasmic SMADs</text>
  
  <circle cx="620" cy="200" r="10" fill="#ff99ff" stroke="#333" stroke-width="1" />
  <text x="650" y="205" font-family="Arial" font-size="12" fill="#333">Nuclear SMADs (TFs)</text>
  
  <circle cx="620" cy="230" r="6" fill="#ffcc00" stroke="#333" stroke-width="1" />
  <text x="620" y="233" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">P</text>
  <text x="650" y="235" font-family="Arial" font-size="12" fill="#333">Phosphorylation</text>
  
  <line x1="610" y1="260" x2="630" y2="260" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <text x="650" y="265" font-family="Arial" font-size="12" fill="#333">SMAD translocation</text>
  
  <rect x="610" y="285" width="20" height="10" fill="#ccccff" stroke="#333" stroke-width="1" />
  <text x="650" y="293" font-family="Arial" font-size="12" fill="#333">Target DNA</text>
  
  <text x="620" y="315" font-family="Arial" font-size="10" font-style="italic" fill="#666">* All components shown are part of</text>
  <text x="620" y="330" font-family="Arial" font-size="10" font-style="italic" fill="#666">  the original GO-CAM model</text>
</svg>