<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline and nuclear membrane -->
  <ellipse cx="400" cy="250" rx="380" ry="230" fill="#f8f8f8" stroke="#666" stroke-width="2"/>
  <ellipse cx="400" cy="270" rx="300" ry="180" fill="#eef6ff" stroke="#333" stroke-width="3" stroke-dasharray="5,3"/>
  
  <!-- Label for cell -->
  <text x="140" y="50" font-family="Arial" font-size="16" fill="#444">Human Cell</text>
  
  <!-- Label for nucleus -->
  <text x="400" y="120" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Nucleus (GO:0005634)</text>
  
  <!-- AARS1 protein -->
  <circle cx="280" cy="230" r="40" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="280" y="230" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">AARS1</text>
  <text x="280" y="248" font-family="Arial" font-size="12" text-anchor="middle">(P49588)</text>
  
  <!-- Lactylation activity label -->
  <text x="280" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-style="italic">Peptide lactyltransferase</text>
  <text x="280" y="295" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-style="italic">activity (GO:0141207)</text>
  
  <!-- YAP1 protein -->
  <rect x="450" y="180" width="60" height="40" rx="8" ry="8" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="480" y="203" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">YAP1</text>
  <text x="480" y="218" font-family="Arial" font-size="12" text-anchor="middle">(P46937)</text>
  
  <!-- TEAD1 protein -->
  <rect x="450" y="310" width="70" height="40" rx="8" ry="8" fill="#99ff99" stroke="#333" stroke-width="2"/>
  <text x="485" y="333" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">TEAD1</text>
  <text x="485" y="348" font-family="Arial" font-size="12" text-anchor="middle">(P28347)</text>
  
  <!-- DNA strand -->
  <path d="M 600,330 Q 620,310 640,330 Q 660,350 680,330" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 600,350 Q 620,370 640,350 Q 660,330 680,350" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Lactylation arrows from AARS1 - with distinct style -->
  <path d="M 320,230 Q 370,210 445,200" fill="none" stroke="#ff0000" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#arrowheadRed)"/>
  <text x="370" y="198" font-family="Arial" font-size="12" fill="#ff0000" text-anchor="middle">Lactylation</text>
  
  <path d="M 320,240 Q 370,280 445,330" fill="none" stroke="#ff0000" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#arrowheadRed)"/>
  <text x="370" y="290" font-family="Arial" font-size="12" fill="#ff0000" text-anchor="middle">Lactylation</text>
  
  <!-- YAP1 to TEAD1 arrow - with distinct style -->
  <path d="M 480,220 Q 480,265 480,310" fill="none" stroke="#0000ff" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#arrowheadBlue)"/>
  <text x="500" y="265" font-family="Arial" font-size="12" fill="#0000ff" text-anchor="start">Positive regulation</text>
  
  <!-- TEAD1 to DNA arrow - with distinct style -->
  <path d="M 520,330 Q 550,330 600,330" fill="none" stroke="#009900" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#arrowheadGreen)"/>
  <text x="540" y="320" font-family="Arial" font-size="12" fill="#009900" text-anchor="middle">Binds DNA</text>
  
  <!-- YAP1 role label -->
  <text x="410" y="160" font-family="Arial" font-size="14" fill="#0066cc" text-anchor="start">Transcription coregulator</text>
  <text x="410" y="175" font-family="Arial" font-size="14" fill="#0066cc" text-anchor="start">(GO:0003712)</text>
  
  <!-- TEAD1 role label -->
  <text x="600" y="300" font-family="Arial" font-size="14" fill="#009900" text-anchor="middle">DNA-binding TF</text>
  <text x="600" y="315" font-family="Arial" font-size="14" fill="#009900" text-anchor="middle">(GO:0003700)</text>
  
  <!-- Lactylation tags -->
  <circle cx="465" y="175" r="8" fill="#ff6666" stroke="#333"/>
  <text x="465" y="178" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="white">L</text>
  
  <circle cx="470" y="305" r="8" fill="#ff6666" stroke="#333"/>
  <text x="470" y="308" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="white">L</text>
  
  <!-- Hippo signaling pathway label -->
  <rect x="580" y="380" width="180" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#333" stroke-width="2"/>
  <text x="670" y="400" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Hippo Signaling</text>
  <text x="670" y="415" font-family="Arial" font-size="12" text-anchor="middle">Hippo signaling (GO:0035329)</text>
  <text x="670" y="430" font-family="Arial" font-size="12" text-anchor="middle">Positive regulation (GO:0035332)</text>
  
  <!-- Arrowhead marker definitions with different colors -->
  <defs>
    <marker id="arrowheadRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0000"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0000ff"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#009900"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">AARS1-mediated Lactylation of YAP1 and TEAD1 in Hippo Signaling</text>
  
  <!-- Legend -->
  <rect x="50" y="380" width="180" height="90" rx="10" ry="10" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="140" y="395" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  
  <line x1="60" y1="410" x2="90" y2="410" stroke="#ff0000" stroke-width="2"/>
  <text x="95" y="415" font-family="Arial" font-size="12" text-anchor="start">Lactylation</text>
  
  <line x1="60" y1="430" x2="90" y2="430" stroke="#0000ff" stroke-width="2"/>
  <text x="95" y1="435" font-family="Arial" font-size="12" text-anchor="start">Positive regulation</text>
  
  <line x1="60" y1="450" x2="90" y2="450" stroke="#009900" stroke-width="2"/>
  <text x="95" y1="455" font-family="Arial" font-size="12" text-anchor="start">DNA binding</text>
  
  <circle cx="70" y1="470" r="8" fill="#ff6666" stroke="#333"/>
  <text x="70" y="473" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="white">L</text>
  <text x="95" y="475" font-family="Arial" font-size="12" text-anchor="start">Lactyl group</text>
</svg>