<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane and compartments -->
  <rect x="50" y="150" width="700" height="400" rx="20" ry="20" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <path d="M50,250 H750" stroke="#333" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="60" y="280" font-family="Arial" font-size="16">Cytoplasm</text>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="450" rx="150" ry="80" fill="#e6f2ff" stroke="#333" stroke-width="2"/>
  <text x="370" y="455" font-family="Arial" font-size="16">Nucleus</text>
  
  <!-- Extracellular space label -->
  <text x="60" y="180" font-family="Arial" font-size="16">Extracellular Space</text>
  
  <!-- TSLP molecule -->
  <circle cx="200" cy="200" r="25" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="177" y="205" font-family="Arial" font-size="14" font-weight="bold">TSLP</text>
  <text x="165" y="220" font-family="Arial" font-size="10">(Q969D9)</text>
  
  <!-- Receptor complex -->
  <rect x="350" y="235" width="40" height="30" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="355" y="254" font-family="Arial" font-size="12" font-weight="bold">IL7R</text>
  <text x="350" y="270" font-family="Arial" font-size="8">(P16871)</text>
  
  <rect x="390" y="235" width="40" height="30" fill="#99ff99" stroke="#333" stroke-width="2"/>
  <text x="393" y="254" font-family="Arial" font-size="12" font-weight="bold">CRLF2</text>
  <text x="390" y="270" font-family="Arial" font-size="8">(Q9HC73)</text>
  
  <!-- Cell membrane -->
  <path d="M50,250 H750" stroke="#333" stroke-width="3"/>
  
  <!-- JAK1 and JAK2 -->
  <rect x="350" y="290" width="35" height="25" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="352" y="307" font-family="Arial" font-size="12" font-weight="bold">JAK1</text>
  <text x="350" y="320" font-family="Arial" font-size="8">(P23458)</text>
  
  <rect x="395" y="290" width="35" height="25" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="397" y="307" font-family="Arial" font-size="12" font-weight="bold">JAK2</text>
  <text x="395" y="320" font-family="Arial" font-size="8">(O60674)</text>
  
  <!-- STAT5A -->
  <polygon points="370,350 390,350 400,370 380,370" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="360" y="365" font-family="Arial" font-size="12" font-weight="bold">STAT5A</text>
  <text x="360" y="378" font-family="Arial" font-size="8">(P42229)</text>
  
  <!-- Phosphorylated STAT5A -->
  <polygon points="370,420 390,420 400,440 380,440" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="360" y="435" font-family="Arial" font-size="12" font-weight="bold">STAT5A-P</text>
  <text x="372" y="410" font-family="Arial" font-size="12">P</text>
  <circle cx="380" cy="410" r="10" fill="#ffff99" stroke="#333" stroke-width="1"/>
  
  <!-- STAT5A in nucleus -->
  <polygon points="400,460 420,460 430,480 410,480" fill="#cc99ff" stroke="#333" stroke-width="2"/>
  <text x="390" y="475" font-family="Arial" font-size="12" font-weight="bold">STAT5A-P</text>
  <text x="402" y="450" font-family="Arial" font-size="12">P</text>
  <circle cx="410" cy="450" r="10" fill="#ffff99" stroke="#333" stroke-width="1"/>
  
  <!-- DNA binding -->
  <path d="M380,500 Q400,515 420,500 Q440,485 460,500" stroke="#333" stroke-width="2" fill="none"/>
  <text x="400" y="520" font-family="Arial" font-size="14">DNA</text>
  
  <!-- Arrows and interactions -->
  <!-- TSLP binding to receptor -->
  <path d="M230,200 L340,240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- JAK activation -->
  <path d="M370,265 L365,285" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M410,265 L415,285" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- STAT5A phosphorylation -->
  <path d="M380,320 L380,345" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- STAT5A translocation -->
  <path d="M385,375 L385,415" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M385,445 C385,445 390,450 410,455" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- DNA binding -->
  <path d="M415,485 L415,500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Title -->
  <text x="130" y="40" font-family="Arial" font-size="24" font-weight="bold">TSLP-mediated Signaling Pathway (Human)</text>
  <text x="220" y="70" font-family="Arial" font-size="16">Cytokine-mediated signaling pathway (GO:0019221)</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="100" width="180" height="125" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="560" y="120" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="570" cy="140" r="10" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="585" y="145" font-family="Arial" font-size="12">Cytokine (TSLP)</text>
  
  <rect x="560" y="155" width="20" height="15" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="585" y="167" font-family="Arial" font-size="12">Receptor (IL7R)</text>
  
  <rect x="560" y="175" width="20" height="15" fill="#99ff99" stroke="#333" stroke-width="1"/>
  <text x="585" y="187" font-family="Arial" font-size="12">Coreceptor (CRLF2)</text>
  
  <rect x="560" y="195" width="20" height="15" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="585" y="207" font-family="Arial" font-size="12">Kinases (JAK1/2)</text>
  
  <polygon points="560,210 575,210 580,225 565,225" fill="#cc99ff" stroke="#333" stroke-width="1"/>
  <text x="585" y="223" font-family="Arial" font-size="12">Transcription Factor</text>
</svg>