<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="100" width="700" height="450" rx="20" ry="20" fill="#f0f9ff" stroke="#a0c0d0" stroke-width="2"/>
  
  <!-- Plasma membrane -->
  <path d="M 50,120 H 750" stroke="#a0c0d0" stroke-width="5" stroke-linecap="round" stroke-dasharray="5,3"/>
  <text x="60" y="110" font-family="Arial" font-size="12" fill="#505050">Plasma Membrane (GO:0005886)</text>
  
  <!-- Extracellular space -->
  <rect x="50" y="50" width="700" height="70" rx="5" ry="5" fill="#e6f5fd" stroke="#a0c0d0" stroke-width="1"/>
  <text x="60" y="70" font-family="Arial" font-size="12" fill="#505050">Extracellular Space (GO:0005615)</text>
  
  <!-- Insulin ligands -->
  <circle cx="250" cy="90" r="15" fill="#ff9966" stroke="#e67300" stroke-width="2"/>
  <text x="250" y="93" font-family="Arial" font-size="10" fill="black" text-anchor="middle">Ins1</text>
  
  <circle cx="300" cy="90" r="15" fill="#ff9966" stroke="#e67300" stroke-width="2"/>
  <text x="300" y="93" font-family="Arial" font-size="10" fill="black" text-anchor="middle">Ins2</text>
  
  <!-- Insulin receptor -->
  <path d="M 270,120 V 150 L 280,165 L 290,150 V 120" fill="#66b3ff" stroke="#004d99" stroke-width="2"/>
  <rect x="240" y="165" width="100" height="25" rx="5" ry="5" fill="#66b3ff" stroke="#004d99" stroke-width="2"/>
  <text x="290" y="182" font-family="Arial" font-size="12" fill="black" text-anchor="middle">Insr</text>
  
  <!-- Receptor activation -->
  <path d="M 270,90 L 270,120" stroke="#e67300" stroke-width="2" stroke-dasharray="5,2"/>
  <path d="M 300,90 L 290,120" stroke="#e67300" stroke-width="2" stroke-dasharray="5,2"/>
  
  <!-- SHC1 adaptor -->
  <rect x="290" y="220" width="60" height="25" rx="5" ry="5" fill="#c299ff" stroke="#6600cc" stroke-width="2"/>
  <text x="320" y="237" font-family="Arial" font-size="12" fill="black" text-anchor="middle">SHC1</text>
  
  <!-- Grb2 adaptor -->
  <rect x="290" y="280" width="60" height="25" rx="5" ry="5" fill="#c299ff" stroke="#6600cc" stroke-width="2"/>
  <text x="320" y="297" font-family="Arial" font-size="12" fill="black" text-anchor="middle">Grb2</text>
  
  <!-- Sos1 GEF -->
  <rect x="290" y="340" width="60" height="25" rx="5" ry="5" fill="#99e699" stroke="#009900" stroke-width="2"/>
  <text x="320" y="357" font-family="Arial" font-size="12" fill="black" text-anchor="middle">Sos1</text>
  
  <!-- Hras GTPase -->
  <rect x="290" y="400" width="60" height="25" rx="5" ry="5" fill="#99e699" stroke="#009900" stroke-width="2"/>
  <text x="320" y="417" font-family="Arial" font-size="12" fill="black" text-anchor="middle">Hras</text>
  
  <!-- Raf1 kinase -->
  <rect x="410" y="280" width="60" height="25" rx="5" ry="5" fill="#ff99cc" stroke="#ff0066" stroke-width="2"/>
  <text x="440" y="297" font-family="Arial" font-size="12" fill="black" text-anchor="middle">Raf1</text>
  
  <!-- Map2k1 kinase -->
  <rect x="410" y="340" width="60" height="25" rx="5" ry="5" fill="#ff99cc" stroke="#ff0066" stroke-width="2"/>
  <text x="440" y="357" font-family="Arial" font-size="12" fill="black" text-anchor="middle">Map2k1</text>
  
  <!-- Mapk1 kinase -->
  <rect x="530" y="310" width="60" height="25" rx="5" ry="5" fill="#ff99cc" stroke="#ff0066" stroke-width="2"/>
  <text x="560" y="327" font-family="Arial" font-size="12" fill="black" text-anchor="middle">Mapk1</text>
  
  <!-- Mapk3 kinase -->
  <rect x="530" y="370" width="60" height="25" rx="5" ry="5" fill="#ff99cc" stroke="#ff0066" stroke-width="2"/>
  <text x="560" y="387" font-family="Arial" font-size="12" fill="black" text-anchor="middle">Mapk3</text>
  
  <!-- Signaling arrows -->
  <path d="M 290,190 L 320,220" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 320,245 L 320,280" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 320,305 L 320,340" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 320,365 L 320,400" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 350,400 L 410,280" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 440,305 L 440,340" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 470,340 L 530,310" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 470,350 L 530,370" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#000066">
    Insulin Receptor Signaling Pathway (Mouse)
  </text>
  
  <!-- Labels for functional domains -->
  <text x="380" y="170" font-family="Arial" font-size="12" fill="#004d99">Receptor Tyrosine Kinase</text>
  <text x="380" y="225" font-family="Arial" font-size="12" fill="#6600cc">Adaptor Protein</text>
  <text x="380" y="345" font-family="Arial" font-size="12" fill="#009900">GEF Activity</text>
  <text x="490" y="290" font-family="Arial" font-size="12" fill="#ff0066">Kinase Activity</text>
  
  <!-- GO terms labels -->
  <text x="100" y="195" font-family="Arial" font-size="10" fill="#505050">GO:0005009 (insulin receptor activity)</text>
  <text x="100" y="455" font-family="Arial" font-size="12" font-weight="bold" fill="#505050">GO:0008286 (insulin receptor signaling pathway)</text>
  <text x="100" y="230" font-family="Arial" font-size="10" fill="#505050">GO:0004713 (protein tyrosine kinase activity)</text>
  <text x="480" y="410" font-family="Arial" font-size="10" fill="#505050">GO:0004707 (MAP kinase activity)</text>
  <text x="410" y="380" font-family="Arial" font-size="10" fill="#505050">GO:0004708 (MAP kinase kinase activity)</text>
  
  <!-- Legend -->
  <rect x="610" y="450" width="130" height="90" fill="white" stroke="#a0c0d0" stroke-width="1"/>
  <text x="620" y="465" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
  
  <rect x="620" y="475" width="15" height="10" fill="#ff9966" stroke="#e67300" stroke-width="1"/>
  <text x="640" y="483" font-family="Arial" font-size="10">Ligands</text>
  
  <rect x="620" y="490" width="15" height="10" fill="#66b3ff" stroke="#004d99" stroke-width="1"/>
  <text x="640" y="498" font-family="Arial" font-size="10">Receptors</text>
  
  <rect x="620" y="505" width="15" height="10" fill="#c299ff" stroke="#6600cc" stroke-width="1"/>
  <text x="640" y="513" font-family="Arial" font-size="10">Adaptor Proteins</text>
  
  <rect x="620" y="520" width="15" height="10" fill="#99e699" stroke="#009900" stroke-width="1"/>
  <text x="640" y="528" font-family="Arial" font-size="10">GEF Proteins</text>
  
  <rect x="620" y="535" width="15" height="10" fill="#ff99cc" stroke="#ff0066" stroke-width="1"/>
  <text x="640" y="543" font-family="Arial" font-size="10">Kinases</text>
</svg>