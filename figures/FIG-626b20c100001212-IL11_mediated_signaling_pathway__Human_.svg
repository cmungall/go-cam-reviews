<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9" rx="10" ry="10"/>
  
  <!-- Cell Compartments -->
  <!-- Extracellular Space -->
  <rect x="50" y="50" width="700" height="150" fill="#e6f2ff" rx="5" ry="5" stroke="#000" stroke-width="1"/>
  <text x="70" y="75" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Extracellular Space</text>
  
  <!-- Plasma Membrane -->
  <rect x="50" y="200" width="700" height="40" fill="#ffccaa" rx="0" ry="0" stroke="#000" stroke-width="1"/>
  <text x="70" y="225" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Plasma Membrane</text>
  
  <!-- Cytoplasm -->
  <rect x="50" y="240" width="700" height="200" fill="#e6ffe6" rx="0" ry="0" stroke="#000" stroke-width="1"/>
  <text x="70" y="265" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Cytoplasm</text>
  
  <!-- Nucleus -->
  <rect x="250" y="450" width="300" height="120" fill="#ffe6e6" rx="150" ry="60" stroke="#000" stroke-width="1"/>
  <text x="370" y="510" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Nucleus</text>
  
  <!-- Pathway Components -->
  <!-- IL11 -->
  <circle cx="250" cy="120" r="30" fill="#ff9999" stroke="#000" stroke-width="2"/>
  <text x="250" y="125" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">IL11</text>
  
  <!-- IL11RA -->
  <rect x="200" y="200" width="80" height="40" fill="#99ccff" stroke="#000" stroke-width="2"/>
  <text x="240" y="225" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">IL11RA</text>
  
  <!-- IL6ST -->
  <rect x="310" y="200" width="80" height="40" fill="#99ccff" stroke="#000" stroke-width="2"/>
  <text x="350" y="225" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">IL6ST</text>
  
  <!-- JAK1 -->
  <polygon points="265,280 275,260 285,280 275,300" fill="#ffcc99" stroke="#000" stroke-width="2"/>
  <text x="275" y="320" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">JAK1</text>
  
  <!-- STAT3 in cytoplasm -->
  <polygon points="365,320 385,320 395,340 375,360 355,340" fill="#cc99ff" stroke="#000" stroke-width="2"/>
  <text x="375" y="385" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">STAT3</text>
  
  <!-- STAT3 in nucleus -->
  <polygon points="365,480 385,480 395,500 375,520 355,500" fill="#cc99ff" stroke="#000" stroke-width="2"/>
  <text x="375" y="545" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">STAT3</text>
  
  <!-- DNA binding -->
  <rect x="340" y="550" width="70" height="10" fill="#663399" stroke="none"/>
  <text x="375" y="575" font-family="Arial" font-size="14" fill="#000" text-anchor="middle">DNA</text>
  
  <!-- Pathway Arrows -->
  <line x1="250" y1="150" x2="240" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="220" x2="310" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="240" x2="275" y2="260" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="275" y1="300" x2="355" y2="320" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- STAT3 Translocation Arrow -->
  <path d="M375,360 Q400,410 375,480" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="405" y="420" font-family="Arial" font-size="14" fill="#000">Translocation</text>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="300" width="190" height="210" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="560" y="325" font-family="Arial" font-size="16" font-weight="bold" fill="#000">Legend</text>
  
  <circle cx="570" cy="350" r="10" fill="#ff9999" stroke="#000" stroke-width="1"/>
  <text x="590" y="355" font-family="Arial" font-size="14" fill="#000">IL11 (Cytokine)</text>
  
  <rect x="560" y="370" width="20" height="15" fill="#99ccff" stroke="#000" stroke-width="1"/>
  <text x="590" y="385" font-family="Arial" font-size="14" fill="#000">Receptors</text>
  
  <polygon points="560,405 570,400 580,405 570,410" fill="#ffcc99" stroke="#000" stroke-width="1"/>
  <text x="590" y="410" font-family="Arial" font-size="14" fill="#000">JAK1 (Kinase)</text>
  
  <polygon points="560,430 570,425 580,435 570,440 560,435" fill="#cc99ff" stroke="#000" stroke-width="1"/>
  <text x="590" y="435" font-family="Arial" font-size="14" fill="#000">STAT3 (TF)</text>
  
  <line x1="560" y1="460" x2="580" y2="460" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="590" y="465" font-family="Arial" font-size="14" fill="#000">Activation</text>
  
  <text x="565" y="490" font-family="Arial" font-size="12" fill="#666" font-weight="bold">IL11-mediated</text>
  <text x="565" y="505" font-family="Arial" font-size="12" fill="#666" font-weight="bold">signaling pathway</text>
</svg>