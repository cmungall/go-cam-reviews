<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">TREM2 Activation by APP in Microglial Cells</text>
  
  <!-- Background - Extracellular space and cell -->
  <rect x="50" y="70" width="700" height="480" rx="10" ry="10" fill="#f0f9ff" stroke="#a0a0a0" stroke-width="1"/>
  <rect x="150" y="180" width="500" height="350" rx="20" ry="20" fill="#e6f5e6" stroke="#2d862d" stroke-width="3"/>
  
  <!-- Cell components labels -->
  <text x="400" y="100" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">Extracellular Space (GO:0005615)</text>
  <text x="400" y="200" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Microglial Cell (CL:0000129)</text>
  
  <!-- Cell membrane -->
  <path d="M 150 180 H 650" stroke="#2d862d" stroke-width="5" fill="none"/>
  <text x="190" y="170" font-family="Arial" font-size="14" text-anchor="start" font-style="italic">Plasma Membrane (GO:0005886)</text>
  
  <!-- Cytoplasm label -->
  <text x="190" y="310" font-family="Arial" font-size="14" text-anchor="start" font-style="italic">Cytoplasm (GO:0005737)</text>
  
  <!-- APP Protein -->
  <circle cx="400" cy="130" r="25" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="400" y="135" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">APP</text>
  <text x="400" y="150" font-family="Arial" font-size="10" text-anchor="middle">P05067</text>
  
  <!-- TREM2 Receptor -->
  <rect x="380" y="180" width="40" height="60" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="400" y="210" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">TREM2</text>
  <text x="400" y="225" font-family="Arial" font-size="8" text-anchor="middle">Q9NZC2</text>
  
  <!-- TYROBP/DAP12 -->
  <rect x="380" y="240" width="40" height="35" fill="#cc99ff" stroke="#6600cc" stroke-width="2"/>
  <text x="400" y="258" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">TYROBP</text>
  <text x="400" y="270" font-family="Arial" font-size="8" text-anchor="middle">O43914</text>
  
  <!-- SYK Kinase -->
  <polygon points="380,320 420,320 410,350 390,350" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="400" y="335" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">SYK</text>
  <text x="400" y="347" font-family="Arial" font-size="8" text-anchor="middle">P43405</text>
  
  <!-- Signaling pathway arrows -->
  <path d="M 400 155 L 400 180" stroke="#000000" stroke-width="4" stroke-dasharray="none" marker-end="url(#ligand_binding)"/>
  <text x="415" y="170" font-family="Arial" font-size="10" text-anchor="start">Ligand binding</text>
  
  <path d="M 400 240 L 400 240" stroke="#000000" stroke-width="2"/>
  
  <path d="M 400 275 L 400 320" stroke="#000000" stroke-width="3" stroke-dasharray="4,2" marker-end="url(#signal_transduction)"/>
  <text x="415" y="305" font-family="Arial" font-size="10" text-anchor="start">Signal transduction</text>
  
  <!-- Molecular Function Labels -->
  <text x="500" y="130" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Receptor ligand activity</text>
  <text x="500" y="142" font-family="Arial" font-size="10" text-anchor="start">(GO:0048018)</text>
  <text x="500" y="154" font-family="Arial" font-size="9" text-anchor="start">Activates cellular receptor</text>
  
  <text x="500" y="210" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Transmembrane signaling receptor</text>
  <text x="500" y="222" font-family="Arial" font-size="10" text-anchor="start">(GO:0004888)</text>
  <text x="500" y="234" font-family="Arial" font-size="9" text-anchor="start">Transmits extracellular signal</text>
  
  <text x="500" y="258" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Protein-macromolecule adaptor</text>
  <text x="500" y="270" font-family="Arial" font-size="10" text-anchor="start">(GO:0030674)</text>
  <text x="500" y="282" font-family="Arial" font-size="9" text-anchor="start">Links TREM2 to downstream signaling</text>
  
  <text x="500" y="335" font-family="Arial" font-size="12" text-anchor="start" font-style="italic">Protein tyrosine kinase activity</text>
  <text x="500" y="347" font-family="Arial" font-size="10" text-anchor="start">(GO:0004713)</text>
  <text x="500" y="359" font-family="Arial" font-size="9" text-anchor="start">Phosphorylates downstream targets</text>
  
  <!-- Overall Process -->
  <text x="400" y="420" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic" font-weight="bold">Cellular response to amyloid-beta (GO:1904646)</text>
  
  <!-- Legend -->
  <rect x="100" y="450" width="600" height="80" rx="5" ry="5" fill="#f8f8f8" stroke="#666666" stroke-width="1"/>
  <text x="120" y="470" font-family="Arial" font-size="14" text-anchor="start" font-weight="bold">Legend:</text>
  
  <!-- APP -->
  <circle cx="130" cy="490" r="10" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="145" y="494" font-family="Arial" font-size="12" text-anchor="start">APP - Amyloid Precursor Protein</text>
  
  <!-- TREM2 -->
  <rect x="300" cy="480" width="15" height="20" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="320" y="494" font-family="Arial" font-size="12" text-anchor="start">TREM2 - Triggering Receptor on Myeloid cells 2</text>
  
  <!-- TYROBP -->
  <rect x="130" cy="510" width="15" height="15" fill="#cc99ff" stroke="#6600cc" stroke-width="2"/>
  <text x="150" y="518" font-family="Arial" font-size="12" text-anchor="start">TYROBP/DAP12 - Adaptor protein</text>
  
  <!-- SYK -->
  <polygon points="300,510 315,510 312,525 303,525" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="320" y="518" font-family="Arial" font-size="12" text-anchor="start">SYK - Spleen Tyrosine Kinase</text>
  
  <!-- Arrows -->
  <path d="M 550 487 L 580 487" stroke="#000000" stroke-width="4" stroke-dasharray="none" marker-end="url(#ligand_binding)"/>
  <text x="585" y="490" font-family="Arial" font-size="10" text-anchor="start">Direct binding</text>
  
  <path d="M 550 515 L 580 515" stroke="#000000" stroke-width="3" stroke-dasharray="4,2" marker-end="url(#signal_transduction)"/>
  <text x="585" y="518" font-family="Arial" font-size="10" text-anchor="start">Signal transduction</text>
  
  <!-- Arrowhead definitions -->
  <defs>
    <marker id="ligand_binding" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="signal_transduction" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>