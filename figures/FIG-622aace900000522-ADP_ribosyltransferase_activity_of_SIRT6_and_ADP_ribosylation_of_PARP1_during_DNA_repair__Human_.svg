<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell nucleus background -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f0f7ff" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Nucleus</text>
  
  <!-- DNA double strand break site -->
  <ellipse cx="400" cy="300" rx="180" ry="120" fill="#e8f4fc" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="200" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Site of Double-Strand Break (GO:0035861)</text>

  <!-- DNA strands with break -->
  <path d="M250,300 L350,300 M450,300 L550,300" stroke="#34495e" stroke-width="6"/>
  <path d="M250,315 L350,315 M450,315 L550,315" stroke="#34495e" stroke-width="6"/>
  <text x="400" y="290" text-anchor="middle" font-family="Arial" font-size="11" fill="#e74c3c">DNA break</text>

  <!-- Cytoplasm region -->
  <rect x="50" y="450" width="200" height="100" fill="#f9f3e8" stroke="#2c3e50" stroke-width="2" rx="20" ry="20"/>
  <text x="150" y="470" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Cytoplasm</text>
  
  <!-- Proteins and their interactions -->
  <!-- MAPK8 in cytoplasm -->
  <circle cx="100" cy="500" r="25" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="100" y="500" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">MAPK8</text>
  <text x="100" y="512" text-anchor="middle" font-family="Arial" font-size="9">(JNK1)</text>
  
  <!-- SIRT6 transitioning -->
  <circle cx="190" cy="500" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="190" y="500" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">SIRT6</text>
  <text x="190" y="512" text-anchor="middle" font-family="Arial" font-size="9">phosphorylated</text>
  
  <!-- SIRT6 at damage site -->
  <circle cx="330" cy="290" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="330" y="290" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">SIRT6</text>
  <text x="330" y="302" text-anchor="middle" font-family="Arial" font-size="9">ADP-ribosyltransferase</text>
  
  <!-- PARP1 at damage site -->
  <circle cx="400" cy="350" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="350" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">PARP1</text>
  <text x="400" y="362" text-anchor="middle" font-family="Arial" font-size="9">DNA binding</text>
  
  <!-- HPF1 at damage site -->
  <circle cx="470" cy="290" r="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="470" y="290" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">HPF1</text>
  <text x="470" y="302" text-anchor="middle" font-family="Arial" font-size="9">adaptor protein</text>
  
  <!-- Arrows and interactions -->
  <!-- MAPK8 phosphorylates SIRT6 -->
  <path d="M125,500 L165,500" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="120" y="480" width="50" height="16" fill="white" stroke="none"/>
  <text x="145" y="490" text-anchor="middle" font-family="Arial" font-size="10">Phosphorylates</text>
  <text x="145" y="480" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">GO:0004674</text>
  
  <!-- Oxidative stress label -->
  <text x="100" y="530" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">Response to</text>
  <text x="100" y="542" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic">oxidative stress</text>
  <text x="100" y="554" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">GO:0034599</text>
  
  <!-- SIRT6 relocates to damage site -->
  <path d="M215,490 C260,460 280,400 310,315" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <rect x="240" y="400" width="80" height="16" fill="white" stroke="none"/>
  <text x="280" y="410" text-anchor="middle" font-family="Arial" font-size="10">Relocates to break site</text>
  <text x="280" y="400" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">GO:1990166</text>
  
  <!-- SIRT6 ADP-ribosylates PARP1 -->
  <path d="M345,305 L380,335" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="330" y="325" width="70" height="16" fill="white" stroke="none"/>
  <text x="365" y="335" text-anchor="middle" font-family="Arial" font-size="10">ADP-ribosylates</text>
  <text x="365" y="325" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">GO:1990404</text>
  
  <!-- HPF1 interacts with PARP1 -->
  <path d="M455,305 L420,335" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="415" y="320" width="60" height="16" fill="white" stroke="none"/>
  <text x="445" y="330" text-anchor="middle" font-family="Arial" font-size="10">Adaptor for</text>
  <text x="445" y="320" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">GO:0140768</text>
  
  <!-- PARP1 binds damaged DNA -->
  <path d="M400,325 L400,310" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="405" y="315" width="65" height="16" fill="white" stroke="none"/>
  <text x="440" y="325" text-anchor="middle" font-family="Arial" font-size="10">Binds DNA</text>
  <text x="440" y="315" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">GO:0003684</text>
  
  <!-- PARP1 auto-poly-ADP-ribosylation -->
  <path d="M425,350 A20,20 0 1 0 375,350" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <rect x="380" y="370" width="70" height="30" fill="white" stroke="none"/>
  <text x="415" y="380" text-anchor="middle" font-family="Arial" font-size="10">Auto-poly-ADP-</text>
  <text x="415" y="390" text-anchor="middle" font-family="Arial" font-size="10">ribosylation</text>
  <text x="415" y="400" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">GO:0003950</text>
  
  <!-- Serine ADP-ribosylation by PARP1 -->
  <path d="M410,375 L450,410 L550,410" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="460" y="395" width="80" height="16" fill="white" stroke="none"/>
  <text x="500" y="405" text-anchor="middle" font-family="Arial" font-size="10">Serine ADP-ribosylation</text>
  <text x="500" y="395" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">GO:0140805</text>
  
  <!-- DNA sensing by SIRT6 -->
  <path d="M330,265 L330,240 L400,240" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="330" y="225" width="60" height="16" fill="white" stroke="none"/>
  <text x="360" y="235" text-anchor="middle" font-family="Arial" font-size="10">DNA sensing</text>
  <text x="360" y="225" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">GO:0140612</text>
  
  <!-- DNA repair process label -->
  <path d="M550,410 C580,410 600,350 600,320 C600,290 580,240 550,240 L400,240" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <text x="600" y="330" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#16a085">DNA Double-Strand</text>
  <text x="600" y="345" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#16a085">Break Repair</text>
  <text x="600" y="360" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic" fill="#16a085">GO:0006302</text>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">ADP-ribosyltransferase Activity of SIRT6 and PARP1 During DNA Repair</text>
  
  <!-- Legend -->
  <rect x="550" y="440" width="230" height="140" fill="white" stroke="#2c3e50" stroke-width="1" rx="5" ry="5"/>
  <text x="665" y="460" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="570" cy="480" r="8" fill="#f39c12"/>
  <text x="580" y="483" text-anchor="start" font-family="Arial" font-size="11">MAPK8 (P45983) - Protein kinase</text>
  
  <circle cx="570" cy="505" r="8" fill="#3498db"/>
  <text x="580" y="508" text-anchor="start" font-family="Arial" font-size="11">SIRT6 (Q8N6T7) - NAD+ ADP-ribosyltransferase</text>
  
  <circle cx="570" cy="530" r="8" fill="#e74c3c"/>
  <text x="580" y="533" text-anchor="start" font-family="Arial" font-size="11">PARP1 (P09874) - Poly-ADP-ribose polymerase</text>
  
  <circle cx="570" cy="555" r="8" fill="#9b59b6"/>
  <text x="580" y="558" text-anchor="start" font-family="Arial" font-size="11">HPF1 (Q9NWY4) - ADP-ribosyltransferase adaptor</text>

  <line x1="570" y1="575" x2="590" y2="575" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="595" y="578" text-anchor="start" font-family="Arial" font-size="11">Protein translocation</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
</svg>