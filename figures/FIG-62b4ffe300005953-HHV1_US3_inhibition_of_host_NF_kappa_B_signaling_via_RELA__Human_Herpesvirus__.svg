<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Cell outline -->
    <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f8f8f8" stroke="#666" stroke-width="2"/>
    
    <!-- Cytoplasm label -->
    <text x="200" y="480" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">Cytoplasm</text>
    <text x="200" y="500" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0005737)</text>
    
    <!-- Host cell cytoplasm label -->
    <text x="600" y="480" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">Host Cell Cytoplasm</text>
    <text x="600" y="500" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0030430)</text>
    
    <!-- Nuclear membrane -->
    <ellipse cx="400" cy="320" rx="180" ry="140" fill="#e6e6fa" stroke="#333" stroke-width="3"/>
    <text x="400" y="190" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">Nuclear Membrane</text>
    <text x="400" y="210" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0031965)</text>
    
    <!-- Chromatin in nucleus -->
    <path d="M350,320 C380,290 420,290 450,320 C480,350 440,380 410,350 C380,320 320,350 350,320" fill="#b8c4de" stroke="#666" stroke-width="1.5"/>
    <text x="400" y="330" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Chromatin</text>
    <text x="400" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0000785)</text>
    
    <!-- Herpesvirus particle near cell -->
    <circle cx="100" cy="100" r="40" fill="#9370db" stroke="#333" stroke-width="2"/>
    <text x="100" y="60" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">HHV-1</text>
    
    <!-- Viral US3 protein -->
    <circle cx="280" cy="250" r="25" fill="#ff6347" stroke="#333" stroke-width="2"/>
    <text x="280" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="white">US3</text>
    <text x="280" y="220" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Viral Kinase</text>
    <text x="280" y="235" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(UniProtKB:P04413)</text>
    
    <!-- NFKBIA (IκBα) -->
    <rect x="420" y="380" width="60" height="30" rx="5" ry="5" fill="#32cd32" stroke="#333" stroke-width="2"/>
    <text x="450" y="400" font-family="Arial" font-size="14" text-anchor="middle" fill="white">NFKBIA</text>
    <text x="450" y="420" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(UniProtKB:P25963)</text>
    
    <!-- RELA in cytoplasm -->
    <circle cx="520" cy="400" r="25" fill="#4169e1" stroke="#333" stroke-width="2"/>
    <text x="520" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="white">RELA</text>
    <text x="520" y="435" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(UniProtKB:Q04206)</text>
    
    <!-- KPNA2 at nuclear membrane -->
    <rect x="330" y="260" width="60" height="30" rx="5" ry="5" fill="#ffa500" stroke="#333" stroke-width="2"/>
    <text x="360" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="white">KPNA2</text>
    <text x="360" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(UniProtKB:P52292)</text>
    
    <!-- RELA in nucleus (faded to show inhibition) -->
    <circle cx="400" cy="370" r="20" fill="#4169e1" stroke="#333" stroke-width="2" opacity="0.3" stroke-dasharray="3,3"/>
    <text x="400" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">RELA</text>
    
    <!-- Arrows and interactions -->
    <!-- US3 inhibits KPNA2 -->
    <path d="M295,235 L320,260" stroke="#ff0000" stroke-width="2.5" marker-end="url(#inhibitionMarker)" fill="none"/>
    <text x="315" y="240" font-family="Arial" font-size="12" fill="#ff0000" transform="rotate(-25, 315, 240)">inhibits</text>
    
    <!-- NFKBIA sequesters RELA -->
    <path d="M480,395 L495,395" stroke="#32cd32" stroke-width="2.5" marker-end="url(#sequesterMarker)" fill="none"/>
    <text x="485" y="380" font-family="Arial" font-size="12" fill="#333">sequesters</text>
    
    <!-- KPNA2 normally imports RELA (blocked) -->
    <path d="M360,290 L385,340" stroke="#333" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowMarker)" fill="none"/>
    <text x="340" y="325" font-family="Arial" font-size="12" fill="#333">imports</text>
    <text x="340" y="340" font-family="Arial" font-size="12" fill="#ff0000">(blocked)</text>
    
    <!-- RELA acts on chromatin (blocked) -->
    <path d="M400,350 L400,335" stroke="#333" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowMarker)" fill="none"/>
    <text x="430" y="335" font-family="Arial" font-size="12" fill="#333">DNA binding</text>
    <text x="430" y="350" font-family="Arial" font-size="12" fill="#ff0000">(blocked)</text>
    
    <!-- Markers -->
    <defs>
        <marker id="arrowMarker" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
            <path d="M0,0 L0,6 L7,3 Z" fill="#333"/>
        </marker>
        <marker id="inhibitionMarker" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
            <path d="M0,0 L0,13 M10,0 L10,13" fill="none" stroke="#ff0000" stroke-width="2"/>
        </marker>
        <marker id="sequesterMarker" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
            <circle cx="5" cy="5" r="4" fill="none" stroke="#32cd32" stroke-width="1.5"/>
        </marker>
    </defs>
    
    <!-- Title and process labels -->
    <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">HHV1-US3 Inhibition of Host NF-kappa-B Signaling via RELA</text>
    <text x="400" y="55" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" fill="#666">Human-Herpesvirus (Host:NCBITaxon:9606)</text>
    
    <!-- Cell label -->
    <text x="400" y="570" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic" fill="#666">Host Cell</text>
    
    <!-- Pathway labels -->
    <rect x="580" y="200" width="200" height="80" rx="10" ry="10" fill="#f0f0f0" stroke="#666" stroke-width="1"/>
    <text x="680" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Viral inhibition of</text>
    <text x="680" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">host NF-κB signaling</text>
    <text x="680" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0085034)</text>
    
    <rect x="580" y="290" width="200" height="80" rx="10" ry="10" fill="#f0f0f0" stroke="#666" stroke-width="1"/>
    <text x="680" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Non-canonical NF-κB</text>
    <text x="680" y="335" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">signal transduction</text>
    <text x="680" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0038061)</text>
    
    <rect x="580" y="380" width="200" height="80" rx="10" ry="10" fill="#f0f0f0" stroke="#666" stroke-width="1"/>
    <text x="680" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Negative regulation of</text>
    <text x="680" y="425" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">protein localization to nucleus</text>
    <text x="680" y="445" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:1900181)</text>
    
    <!-- Molecular function labels -->
    <text x="120" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">US3: Protein kinase activity</text>
    <text x="120" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0004674)</text>
    
    <text x="120" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">KPNA2: Nuclear import</text>
    <text x="120" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">signal receptor activity</text>
    <text x="120" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0061608)</text>
    
    <text x="120" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">NFKBIA: Protein</text>
    <text x="120" y="340" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">sequestering activity</text>
    <text x="120" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0140311)</text>
    
    <text x="120" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">RELA: DNA-binding</text>
    <text x="120" y="410" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">transcription factor activity</text>
    <text x="120" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0003700)</text>
    
    <!-- Legend -->
    <rect x="120" y="500" width="180" height="80" rx="5" ry="5" fill="#f0f0f0" stroke="#666" stroke-width="1"/>
    <text x="210" y="520" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Legend</text>
    
    <!-- Legend item: inhibition -->
    <line x1="150" y1="535" x2="180" y2="535" stroke="#ff0000" stroke-width="2" marker-end="url(#inhibitionMarker)"/>
    <text x="230" y="540" font-family="Arial" font-size="12" fill="#333">Inhibition</text>
    
    <!-- Legend item: sequestering -->
    <line x1="150" y1="555" x2="180" y2="555" stroke="#32cd32" stroke-width="2" marker-end="url(#sequesterMarker)"/>
    <text x="230" y="560" font-family="Arial" font-size="12" fill="#333">Sequestering</text>
    
    <!-- Legend item: normal process -->
    <line x1="150" y1="575" x2="180" y2="575" stroke="#333" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowMarker)"/>
    <text x="230" y="580" font-family="Arial" font-size="12" fill="#333">Normal process (blocked)</text>
</svg>