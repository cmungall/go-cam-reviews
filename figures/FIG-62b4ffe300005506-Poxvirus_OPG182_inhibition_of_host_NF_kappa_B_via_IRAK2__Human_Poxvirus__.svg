<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Poxvirus-OPG182 inhibition of host NF-kappa-B via IRAK2</text>
  
  <!-- Host cell label -->
  <text x="400" y="70" font-family="Arial" font-size="18" text-anchor="middle" font-style="italic">Human Host Cell</text>
  
  <!-- Cytoplasm label -->
  <text x="400" y="100" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Cytoplasm (GO:0005737)</text>
  
  <!-- Virus particle -->
  <circle cx="100" cy="150" r="40" fill="#ff9966" stroke="#cc6600" stroke-width="2"/>
  <text x="100" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Poxvirus</text>
  
  <!-- Viral protein -->
  <rect x="200" y="140" width="120" height="50" rx="5" fill="#ff9966" stroke="#cc6600" stroke-width="2"/>
  <text x="260" y="165" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">VACWR178</text>
  <text x="260" y="185" font-family="Arial" font-size="11" text-anchor="middle">(Q01220)</text>
  
  <!-- Viral protein function -->
  <rect x="185" y="90" width="150" height="40" rx="5" fill="#fff" stroke="#990000" stroke-width="1" stroke-dasharray="3,1" fill-opacity="0.8"/>
  <text x="260" y="113" font-family="Arial" font-size="12" text-anchor="middle" fill="#990000" font-weight="bold">Protein sequestering</text>
  <text x="260" y="128" font-family="Arial" font-size="12" text-anchor="middle" fill="#990000">activity (GO:0140311)</text>
  
  <!-- IRAK2 -->
  <rect x="350" y="200" width="120" height="50" rx="5" fill="#99ccff" stroke="#3366cc" stroke-width="2"/>
  <text x="410" y="225" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IRAK2</text>
  <text x="410" y="243" font-family="Arial" font-size="11" text-anchor="middle">(O43187)</text>
  
  <!-- IRAK2 function -->
  <rect x="485" y="190" width="150" height="40" rx="5" fill="#fff" stroke="#3366cc" stroke-width="1" stroke-dasharray="3,1" fill-opacity="0.8"/>
  <text x="560" y="210" font-family="Arial" font-size="12" text-anchor="middle" fill="#3366cc" font-weight="bold">Molecular adaptor</text>
  <text x="560" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#3366cc">activity (GO:0060090)</text>
  
  <!-- TRAF6 -->
  <rect x="350" y="300" width="120" height="50" rx="5" fill="#99ccff" stroke="#3366cc" stroke-width="2"/>
  <text x="410" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TRAF6</text>
  <text x="410" y="343" font-family="Arial" font-size="11" text-anchor="middle">(Q9Y4K3)</text>
  
  <!-- TRAF6 function -->
  <rect x="485" y="290" width="150" height="40" rx="5" fill="#fff" stroke="#3366cc" stroke-width="1" stroke-dasharray="3,1" fill-opacity="0.8"/>
  <text x="560" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#3366cc" font-weight="bold">Ubiquitin protein ligase</text>
  <text x="560" y="325" font-family="Arial" font-size="12" text-anchor="middle" fill="#3366cc">activity (GO:0061630)</text>
  
  <!-- MAP3K7 -->
  <rect x="350" y="400" width="120" height="50" rx="5" fill="#99ccff" stroke="#3366cc" stroke-width="2"/>
  <text x="410" y="425" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">MAP3K7</text>
  <text x="410" y="443" font-family="Arial" font-size="11" text-anchor="middle">(O43318)</text>
  
  <!-- MAP3K7 function -->
  <rect x="485" y="390" width="150" height="40" rx="5" fill="#fff" stroke="#3366cc" stroke-width="1" stroke-dasharray="3,1" fill-opacity="0.8"/>
  <text x="560" y="410" font-family="Arial" font-size="12" text-anchor="middle" fill="#3366cc" font-weight="bold">MAP kinase activity</text>
  <text x="560" y="425" font-family="Arial" font-size="12" text-anchor="middle" fill="#3366cc">(GO:0004707)</text>
  
  <!-- CHUK (IKK) -->
  <rect x="350" y="500" width="120" height="50" rx="5" fill="#99ccff" stroke="#3366cc" stroke-width="2"/>
  <text x="410" y="525" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">CHUK (IKK)</text>
  <text x="410" y="543" font-family="Arial" font-size="11" text-anchor="middle">(O15111)</text>
  
  <!-- CHUK function -->
  <rect x="485" y="490" width="150" height="40" rx="5" fill="#fff" stroke="#3366cc" stroke-width="1" stroke-dasharray="3,1" fill-opacity="0.8"/>
  <text x="560" y="510" font-family="Arial" font-size="12" text-anchor="middle" fill="#3366cc" font-weight="bold">IkappaB kinase activity</text>
  <text x="560" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#3366cc">(GO:0008384)</text>
  
  <!-- Arrows for signaling cascade -->
  <line x1="140" y1="150" x2="190" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="250" x2="410" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="430" y="270" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Activates</text>
  
  <line x1="410" y1="350" x2="410" y2="390" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="430" y="370" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Activates</text>
  
  <line x1="410" y1="450" x2="410" y2="490" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="430" y="470" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Activates</text>
  
  <!-- Inhibitory arrow from viral protein to IRAK2 -->
  <line x1="320" y1="165" x2="370" y2="200" stroke="#ff0000" stroke-width="2" marker-end="url(#inhibit)"/>
  <text x="335" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff0000">Inhibits</text>
  
  <!-- Nucleus (implied) -->
  <circle cx="650" cy="400" r="70" fill="#e6e6fa" stroke="#333" stroke-width="2"/>
  <text x="650" y="385" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Nucleus</text>
  <text x="650" y="405" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">(implied, not in source)</text>
  
  <!-- Pathway process labels -->
  <rect x="95" y="210" width="150" height="85" rx="5" fill="#fff" stroke="#333" stroke-width="1" fill-opacity="0.8"/>
  <text x="170" y="230" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Symbiont-mediated</text>
  <text x="170" y="248" font-family="Arial" font-size="14" text-anchor="middle">suppression of host</text>
  <text x="170" y="266" font-family="Arial" font-size="14" text-anchor="middle">NF-κB cascade</text>
  <text x="170" y="284" font-family="Arial" font-size="12" text-anchor="middle">(GO:0085034)</text>
  
  <rect x="95" y="330" width="150" height="75" rx="5" fill="#fff" stroke="#333" stroke-width="1" fill-opacity="0.8"/>
  <text x="170" y="350" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Canonical NF-κB</text>
  <text x="170" y="368" font-family="Arial" font-size="14" text-anchor="middle">signal transduction</text>
  <text x="170" y="386" font-family="Arial" font-size="12" text-anchor="middle">(GO:0007249)</text>
  
  <!-- Host cell cytoplasm label -->
  <rect x="570" y="170" width="160" height="45" rx="5" fill="#fff" stroke="#333" stroke-width="1" fill-opacity="0.8"/>
  <text x="650" y="190" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Host cell cytoplasm</text>
  <text x="650" y="208" font-family="Arial" font-size="12" text-anchor="middle">(GO:0030430)</text>
  
  <!-- Downstream pathway (implied) -->
  <line x1="410" y1="550" x2="450" y2="580" stroke="#000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="500" y="580" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(Downstream signaling)</text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <marker id="inhibit" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#ff0000" stroke-width="2"/>
      <line x1="0" y1="10" x2="10" y2="0" stroke="#ff0000" stroke-width="2"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="600" y="460" width="180" height="130" fill="white" stroke="#333" stroke-width="1"/>
  <text x="690" y="480" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="620" y="490" width="20" height="15" rx="2" fill="#99ccff" stroke="#3366cc" stroke-width="1"/>
  <text x="655" y="503" font-family="Arial" font-size="12" text-anchor="start">Host proteins</text>
  
  <rect x="620" y="515" width="20" height="15" rx="2" fill="#ff9966" stroke="#cc6600" stroke-width="1"/>
  <text x="655" y="528" font-family="Arial" font-size="12" text-anchor="start">Viral proteins</text>
  
  <line x1="620" y1="543" x2="640" y2="543" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="655" y="547" font-family="Arial" font-size="12" text-anchor="start">Activation</text>
  
  <line x1="620" y1="563" x2="640" y2="563" stroke="#ff0000" stroke-width="2" marker-end="url(#inhibit)"/>
  <text x="655" y="567" font-family="Arial" font-size="12" text-anchor="start">Inhibition</text>
</svg>