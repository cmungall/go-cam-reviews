<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f9f9f9" stroke="#333333" stroke-width="2" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">SQSTM1 mediates retention of KEAP1 into p62 bodies</text>
  
  <!-- Cytoplasm label -->
  <text x="150" y="130" font-family="Arial" font-size="16" font-weight="bold" font-style="italic" text-anchor="middle" fill="#333333">Cytoplasm</text>
  
  <!-- Cellular stress input -->
  <path d="M50,150 L120,150" stroke="#cc0000" stroke-width="3" marker-end="url(#arrowhead)" />
  <rect x="50" y="120" width="85" height="20" fill="white" fill-opacity="0.7" rx="5" ry="5" />
  <text x="85" y="135" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Cellular Stress</text>
  <text x="85" y="165" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle" fill="#333333">GO:0033554</text>
  
  <!-- ULK1 kinase -->
  <rect x="150" y="130" width="100" height="40" rx="10" ry="10" fill="#add8e6" stroke="#333333" stroke-width="2" />
  <text x="200" y="155" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">ULK1</text>
  <text x="200" y="175" font-family="Arial" font-size="11" text-anchor="middle">protein kinase</text>
  
  <!-- Phosphorylation arrow -->
  <path d="M250,150 L320,150" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="250" y="120" width="70" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="285" y="135" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">phosphorylates</text>
  <text x="285" y="170" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle" fill="#333333">GO:0004674</text>
  
  <!-- SQSTM1/p62 -->
  <rect x="320" y="130" width="100" height="40" rx="10" ry="10" fill="#90ee90" stroke="#333333" stroke-width="2" />
  <text x="370" y="155" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">SQSTM1/p62</text>
  
  <!-- p62 body formation path -->
  <path d="M370,170 L370,250" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  <rect x="375" y="205" width="150" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="400" y="220" font-family="Arial" font-size="12" font-weight="bold" text-anchor="start" fill="#333333">forms condensates</text>
  <text x="400" y="235" font-family="Arial" font-size="11" font-style="italic" text-anchor="start" fill="#333333">GO:0140693</text>
  <text x="400" y="250" font-family="Arial" font-size="11" font-style="italic" text-anchor="start" fill="#333333">GO:0140694</text>
  
  <!-- p62 body (membraneless organelle) -->
  <ellipse cx="370" cy="350" rx="150" ry="100" fill="#ffd700" fill-opacity="0.3" stroke="#ff8c00" stroke-width="2" stroke-dasharray="5,3" />
  <rect x="320" y="290" width="100" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="370" y="305" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">p62 Body</text>
  <text x="370" y="325" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle" fill="#333333">(intracellular membraneless organelle)</text>
  <text x="370" y="340" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle" fill="#333333">GO:0043232</text>
  
  <!-- SQSTM1 sequestering activity -->
  <path d="M420,150 L550,220" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="470" y="155" width="70" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="505" y="170" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">sequesters</text>
  <text x="505" y="185" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle" fill="#333333">GO:0140311</text>
  
  <!-- KEAP1 -->
  <rect x="550" y="220" width="100" height="40" rx="10" ry="10" fill="#ff9999" stroke="#333333" stroke-width="2" />
  <text x="600" y="245" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">KEAP1</text>
  
  <!-- KEAP1 moving into p62 body -->
  <path d="M600,260 L500,320" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" stroke-width="3" />
  <rect x="535" y="280" width="70" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="570" y="295" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">retained in</text>
  
  <!-- KEAP1 inside p62 body -->
  <rect x="400" y="360" width="100" height="40" rx="10" ry="10" fill="#ff9999" stroke="#333333" stroke-width="2" />
  <text x="450" y="385" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">KEAP1</text>
  
  <!-- Ubiquitin ligase adaptor function -->
  <path d="M450,400 L450,450" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M450,450 L600,450" stroke="#333333" stroke-width="3" stroke-dasharray="6,3" />
  <rect x="450" y="420" width="150" height="20" fill="white" fill-opacity="0.8" rx="5" ry="5" />
  <text x="525" y="435" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">inhibited function:</text>
  <text x="525" y="470" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">ubiquitin-ligase adaptor</text>
  <text x="525" y="485" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle" fill="#333333">GO:1990756</text>
  <text x="525" y="500" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle" fill="#333333">GO:0006511</text>
  
  <!-- NFE2L2/Nrf2 -->
  <rect x="600" y="430" width="100" height="40" rx="10" ry="10" fill="#c6e2ff" stroke="#333333" stroke-width="2" />
  <text x="650" y="455" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">NFE2L2/Nrf2</text>
  <text x="650" y="475" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" fill="#9370db">*not in source</text>
  
  <!-- Legend -->
  <rect x="600" y="500" width="180" height="90" fill="white" stroke="#333333" stroke-width="1" />
  <text x="610" y="520" font-family="Arial" font-size="14" font-weight="bold">Legend:</text>
  
  <rect x="610" y="530" width="15" height="15" fill="#add8e6" stroke="#333333" stroke-width="1" />
  <text x="632" y="542" font-family="Arial" font-size="12">ULK1 (Kinase)</text>
  
  <rect x="610" y="550" width="15" height="15" fill="#90ee90" stroke="#333333" stroke-width="1" />
  <text x="632" y="562" font-family="Arial" font-size="12">SQSTM1/p62 (Scaffold)</text>
  
  <rect x="610" y="570" width="15" height="15" fill="#ff9999" stroke="#333333" stroke-width="1" />
  <text x="632" y="582" font-family="Arial" font-size="12">KEAP1 (Adaptor)</text>
  
  <!-- Additional legend -->
  <ellipse cx="700" cy="535" rx="10" ry="7" fill="#ffd700" fill-opacity="0.3" stroke="#ff8c00" stroke-width="1" stroke-dasharray="2,1" />
  <text x="720" y="538" font-family="Arial" font-size="12">p62 Body</text>
  
  <line x1="690" y1="555" x2="710" y2="555" stroke="#cc0000" stroke-width="2" />
  <text x="720" y="558" font-family="Arial" font-size="12">Stress Signal</text>
  
  <line x1="690" y1="575" x2="710" y2="575" stroke="#333333" stroke-width="3" stroke-dasharray="6,3" />
  <text x="720" y="578" font-family="Arial" font-size="12">Inhibited Function</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>
</svg>