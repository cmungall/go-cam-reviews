<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
  
  <!-- Nuclear region during mitosis -->
  <ellipse cx="400" cy="300" rx="250" ry="180" fill="#f0f7ff" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  
  <!-- Chromosomes with kinetochores -->
  <g id="chromosome-1">
    <rect x="350" y="250" width="30" height="100" rx="10" ry="10" fill="#9370DB" stroke="#333"/>
    <rect x="420" y="250" width="30" height="100" rx="10" ry="10" fill="#9370DB" stroke="#333"/>
    <!-- Kinetochores -->
    <rect x="350" y="230" width="30" height="20" rx="5" ry="5" fill="#FF5733" stroke="#333" stroke-width="1.5" id="kinetochore1"/>
    <rect x="420" y="230" width="30" height="20" rx="5" ry="5" fill="#FF5733" stroke="#333" stroke-width="1.5" id="kinetochore2"/>
    <text x="365" y="245" font-family="Arial" font-size="10" text-anchor="middle" fill="white">K</text>
    <text x="435" y="245" font-family="Arial" font-size="10" text-anchor="middle" fill="white">K</text>
  </g>
  
  <!-- Spindle microtubules -->
  <line x1="250" y1="170" x2="350" y2="240" stroke="#006400" stroke-width="2.5"/>
  <line x1="550" y1="170" x2="450" y2="240" stroke="#006400" stroke-width="2.5"/>
  <line x1="250" y1="430" x2="350" y2="360" stroke="#006400" stroke-width="2.5"/>
  <line x1="550" y1="430" x2="450" y2="360" stroke="#006400" stroke-width="2.5"/>
  
  <!-- Centrosomes -->
  <circle cx="250" cy="170" r="15" fill="#6495ED" stroke="#333"/>
  <circle cx="550" cy="170" r="15" fill="#6495ED" stroke="#333"/>
  <circle cx="250" cy="430" r="15" fill="#6495ED" stroke="#333"/>
  <circle cx="550" cy="430" r="15" fill="#6495ED" stroke="#333"/>
  
  <!-- Protein Nodes -->
  <g id="proteins">
    <!-- CDK1 -->
    <circle cx="180" cy="270" r="25" fill="#FFA07A" stroke="#333" stroke-width="1.5"/>
    <text x="180" y="275" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">CDK1</text>
    
    <!-- KAT5 -->
    <circle cx="280" cy="270" r="25" fill="#20B2AA" stroke="#333" stroke-width="1.5"/>
    <text x="280" y="275" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">KAT5</text>
    
    <!-- AURKB -->
    <circle cx="380" cy="180" r="25" fill="#F08080" stroke="#333" stroke-width="1.5"/>
    <text x="380" y="185" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">AURKB</text>
    
    <!-- NDC80 -->
    <rect x="350" y="270" width="55" height="25" rx="5" ry="5" fill="#FFD700" stroke="#333" stroke-width="1.5"/>
    <text x="377.5" y="287" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">NDC80</text>
    
    <!-- SIRT1 -->
    <circle cx="500" cy="270" r="25" fill="#98FB98" stroke="#333" stroke-width="1.5"/>
    <text x="500" y="275" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">SIRT1</text>
  </g>
  
  <!-- Interactions -->
  <g id="interactions">
    <!-- CDK1 phosphorylates KAT5 -->
    <line x1="205" y1="270" x2="255" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <circle cx="230" cy="265" r="8" fill="white" stroke="#333"/>
    <text x="230" y="268" font-family="Arial" font-size="10" text-anchor="middle">P</text>
    
    <!-- KAT5 acetylates AURKB -->
    <line x1="295" y1="250" x2="365" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <circle cx="330" cy="225" r="8" fill="white" stroke="#333"/>
    <text x="330" y="228" font-family="Arial" font-size="10" text-anchor="middle">Ac</text>
    
    <!-- AURKB phosphorylates NDC80 -->
    <line x1="380" y1="205" x2="380" y2="265" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <circle cx="380" cy="235" r="8" fill="white" stroke="#333"/>
    <text x="380" y="238" font-family="Arial" font-size="10" text-anchor="middle">P</text>
    
    <!-- SIRT1 deacetylates NDC80 -->
    <line x1="475" y1="270" x2="405" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="440" y="260" font-family="Arial" font-size="10" text-anchor="middle">deAc</text>
  </g>

  <!-- Process Labels -->
  <g id="process-labels">
    <text x="230" y="300" font-family="Arial" font-size="11" fill="#333">Positive regulation</text>
    <text x="450" y="300" font-family="Arial" font-size="11" fill="#333">Negative regulation</text>
    <text x="400" y="330" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Attachment of mitotic spindle</text>
    <text x="400" y="350" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">microtubules to kinetochore</text>
    <text x="400" y="380" font-family="Arial" font-size="14" font-style="italic" fill="#333" text-anchor="middle">Sister chromatid segregation</text>
  </g>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">KAT5 Regulation of the Cytoskeleton by Acetylation of Proteins</text>
  <text x="400" y="50" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">(Human)</text>
</svg>