<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell nucleus background -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f0f8ff" stroke="#6b8eb5" stroke-width="3" opacity="0.8"/>
  <text x="400" y="110" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Nucleus</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">HIV1-Vpr inhibition of UNG2 via DDB1/CUL4A</text>
  
  <!-- Proteins -->
  <!-- HIV1-Vpr -->
  <circle cx="150" cy="250" r="40" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="150" y="255" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Vpr</text>
  <text x="150" y="275" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">molecular adaptor</text>
  
  <!-- DCAF1 -->
  <rect x="240" y="230" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="280" y="255" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">DCAF1</text>
  <text x="280" y="275" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">substrate adaptor</text>
  
  <!-- DDB1 -->
  <rect x="360" y="230" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="400" y="255" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">DDB1</text>
  <text x="400" y="275" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">cullin binding</text>
  
  <!-- CUL4A -->
  <rect x="480" y="230" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="520" y="255" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CUL4A</text>
  <text x="520" y="275" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">E3 ligase scaffold</text>
  
  <!-- RBX1 -->
  <rect x="600" y="230" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="640" y="255" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">RBX1</text>
  <text x="640" y="275" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">ubiquitin ligase</text>
  
  <!-- UNG2 (UNG) -->
  <circle cx="400" cy="380" r="40" fill="#ccff99" stroke="#66cc00" stroke-width="2"/>
  <text x="400" y="385" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">UNG2</text>
  <text x="400" y="405" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">uracil DNA glycosylase</text>
  
  <!-- Interactions -->
  <!-- Vpr to DCAF1 -->
  <line x1="190" y1="250" x2="240" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="240" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">binds</text>
  
  <!-- DCAF1 to DDB1 -->
  <line x1="320" y1="250" x2="360" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="240" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">binds</text>
  
  <!-- DDB1 to CUL4A -->
  <line x1="440" y1="250" x2="480" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="240" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">binds</text>
  
  <!-- CUL4A to RBX1 -->
  <line x1="560" y1="250" x2="600" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="580" y="240" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">binds</text>
  
  <!-- Label the complex -->
  <path d="M 150,200 Q 400,150 640,200" stroke="#000" stroke-width="1" stroke-dasharray="3,2" fill="none"/>
  <text x="400" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333333">CRL4-DCAF1-Vpr Complex</text>
  
  <!-- Ubiquitin ligase complex to UNG2 -->
  <path d="M 520,270 Q 520,320 450,350 Q 440,360 420,370" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#redArrowhead)" fill="none"/>
  <text x="470" y="320" font-family="Arial" font-size="16" text-anchor="middle" fill="#d40000" font-weight="bold">ubiquitination</text>
  
  <!-- Ubiquitin symbol attached to UNG2 -->
  <circle cx="430" cy="350" r="14" fill="#ff6600" stroke="#cc3300" stroke-width="1"/>
  <text x="430" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Ub</text>
  
  <!-- DNA repair inhibition -->
  <path d="M 400,420 Q 400,450 400,470" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <text x="400" y="490" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Inhibition of DNA Repair</text>
  <line x1="330" y1="490" x2="470" y2="490" stroke="#000" stroke-width="1"/>
  
  <!-- Process description -->
  <text x="400" y="520" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Base-excision repair, AP site formation</text>
  <text x="400" y="540" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">via deaminated base removal</text>
  
  <!-- Legend elements -->
  <rect x="50" y="500" width="20" height="20" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="80" y="515" font-family="Arial" font-size="14" text-anchor="start">HIV1 viral protein</text>
  
  <rect x="50" y="530" width="20" height="20" fill="#99ccff" stroke="#0066cc" stroke-width="1"/>
  <text x="80" y="545" font-family="Arial" font-size="14" text-anchor="start">Human proteins in ubiquitin ligase complex</text>
  
  <rect x="50" y="560" width="20" height="20" fill="#ccff99" stroke="#66cc00" stroke-width="1"/>
  <text x="80" y="575" font-family="Arial" font-size="14" text-anchor="start">Target protein (DNA repair enzyme)</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <marker id="redArrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0000"/>
    </marker>
  </defs>
</svg>