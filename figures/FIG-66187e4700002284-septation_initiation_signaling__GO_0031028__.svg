  <text x="200" y="520" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Legend</text>
  
  <circle cx="55" y="540" r="10" fill="#bedaff" stroke="#000" stroke-width="1"/>
  <text x="140" y="544" text-anchor="start" font-family="Arial" font-size="10">Scaffold Proteins (Sid4, Cdc11)</text>
  
  <circle cx="55" y="565" r="10" fill="#ffe0b3" stroke="#000" stroke-width="1"/>
