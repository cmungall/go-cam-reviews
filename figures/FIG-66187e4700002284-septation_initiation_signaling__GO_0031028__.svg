  <line x1="420" y1="535" x2="450" y2="535" stroke="green" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="520" y="540" text-anchor="start" font-family="Arial" font-size="10">Activation/Positive Regulation</text>
  
  <line x1="420" y1="555" x2="450" y2="555" stroke="red" stroke-width="2" marker-end="url(#arrowRed)"/>
