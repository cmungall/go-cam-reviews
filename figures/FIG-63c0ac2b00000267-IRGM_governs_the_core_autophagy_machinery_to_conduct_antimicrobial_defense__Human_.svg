<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f5f5f5" stroke="#888888" stroke-width="2" opacity="0.7"/>
  
  <!-- Autophagosome -->
  <ellipse cx="560" cy="320" rx="150" ry="100" fill="#d1e0ff" stroke="#4a6da7" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>
  <text x="560" y="240" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#4a6da7">Autophagosome</text>
  
  <!-- Cell membrane marker -->
  <text x="400" y="100" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#555555">Cell membrane</text>
  
  <!-- Bacteria representation (outside cell) -->
  <ellipse cx="650" cy="80" rx="30" ry="15" fill="#ff9999" stroke="#cc6666" stroke-width="2"/>
  <ellipse cx="700" cy="120" rx="25" ry="12" fill="#ff9999" stroke="#cc6666" stroke-width="2"/>
  <text x="675" y="50" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#cc6666">Bacteria</text>
  
  <!-- IRGM protein -->
  <rect x="140" y="250" width="120" height="60" rx="15" ry="15" fill="#b3e0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="200" y="283" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">IRGM</text>
  <text x="200" y="303" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(A1A4Y4)</text>
  
  <!-- PRKAA1 protein -->
  <rect x="340" y="250" width="120" height="60" rx="15" ry="15" fill="#ffcc99" stroke="#ff8000" stroke-width="2"/>
  <text x="400" y="283" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">PRKAA1</text>
  <text x="400" y="303" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Q13131)</text>
  
  <!-- ULK1 protein -->
  <rect x="480" y="350" width="120" height="60" rx="15" ry="15" fill="#c6e2c6" stroke="#339933" stroke-width="2"/>
  <text x="540" y="383" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">ULK1</text>
  <text x="540" y="403" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(O75385)</text>
  
  <!-- BECN1 protein -->
  <rect x="600" y="450" width="120" height="60" rx="15" ry="15" fill="#d9b3ff" stroke="#6600cc" stroke-width="2"/>
  <text x="660" y="483" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">BECN1</text>
  <text x="660" y="503" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Q14457)</text>
  
  <!-- Pathway arrows -->
  <!-- IRGM -> PRKAA1 (activates) -->
  <path d="M260,280 L340,280" stroke="#ff8000" stroke-width="3" marker-end="url(#activationArrow)"/>
  <text x="300" y="265" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">activates</text>
  <text x="300" y="282" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">GO:0043539</text>
  
  <!-- PRKAA1 -> ULK1 (phosphorylates) -->
  <path d="M420,310 C420,330 480,350 500,350" stroke="#339933" stroke-width="3" marker-end="url(#phosphorylationArrow)"/>
  <text x="450" y="335" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">phosphorylates</text>
  <text x="450" y="352" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">GO:0004674</text>
  
  <!-- ULK1 -> BECN1 (positively regulates) -->
  <path d="M555,410 C555,430 620,450 620,450" stroke="#6600cc" stroke-width="3" marker-end="url(#regulationArrow)"/>
  <text x="590" y="435" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">positively regulates</text>
  
  <!-- IRGM -> BECN1 (adapter function) -->
  <path d="M200,310 C200,430 550,480 600,480" stroke="#6600cc" stroke-width="3" marker-end="url(#adapterArrow)"/>
  <text x="350" y="450" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">adapter function</text>
  <text x="350" y="467" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">GO:0030674</text>
  
  <!-- IRGM -> ULK1 (positively regulates) -->
  <path d="M230,310 C230,370 450,380 480,380" stroke="#339933" stroke-width="3" marker-end="url(#regulationArrow)"/>
  <text x="320" y="370" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">positively regulates</text>
  
  <!-- Process labels -->
  <rect x="530" y="520" width="200" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#cccc00" stroke-width="2"/>
  <text x="630" y="547" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">Autophagosome Assembly</text>
  <text x="630" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(GO:0000045)</text>
  
  <rect x="150" y="180" width="180" height="50" rx="10" ry="10" fill="#ffffcc" stroke="#cccc00" stroke-width="2"/>
  <text x="240" y="207" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">Defense Response to Bacterium</text>
  <text x="240" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">(GO:0042742)</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="activationArrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#ff8000"/>
    </marker>
    <marker id="phosphorylationArrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#339933"/>
    </marker>
    <marker id="regulationArrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#6600cc"/>
    </marker>
    <marker id="adapterArrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#6600cc"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">IRGM Governs Core Autophagy Machinery in Antimicrobial Defense</text>
  
  <!-- Legend -->
  <rect x="30" y="500" width="260" height="90" rx="5" ry="5" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="160" y="520" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">Legend</text>
  
  <rect x="50" y="530" width="20" height="10" fill="#b3e0ff" stroke="#0066cc" stroke-width="1"/>
  <text x="170" y="538" font-family="Arial" font-size="12" text-anchor="start" fill="#000000">IRGM - G protein/adaptor activity</text>
  
  <rect x="50" y="545" width="20" height="10" fill="#ffcc99" stroke="#ff8000" stroke-width="1"/>
  <text x="170" y="553" font-family="Arial" font-size="12" text-anchor="start" fill="#000000">PRKAA1 - Kinase activity</text>
  
  <rect x="50" y="560" width="20" height="10" fill="#c6e2c6" stroke="#339933" stroke-width="1"/>
  <text x="170" y="568" font-family="Arial" font-size="12" text-anchor="start" fill="#000000">ULK1 - Autophagosome assembly</text>
  
  <rect x="50" y="575" width="20" height="10" fill="#d9b3ff" stroke="#6600cc" stroke-width="1"/>
  <text x="170" y="583" font-family="Arial" font-size="12" text-anchor="start" fill="#000000">BECN1 - Complex assembly</text>
  
  <line x1="50" y1="590" x2="70" y2="590" stroke="#ff8000" stroke-width="3" marker-end="url(#activationArrow)"/>
  <text x="170" y="593" font-family="Arial" font-size="12" text-anchor="start" fill="#000000">Activation/Regulation</text>
</svg>