<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell background -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Cell membrane -->
  <path d="M 50,150 H 750" stroke="#333" stroke-width="3" fill="none" stroke-dasharray="5,3"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="400" rx="150" ry="100" fill="#e6f2ff" stroke="#333" stroke-width="2"/>
  <text x="400" y="405" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Nucleus</text>
  
  <!-- Extracellular space label -->
  <text x="100" y="100" font-family="Arial" font-size="16" font-weight="bold" fill="#000000">Extracellular Space</text>
  
  <!-- Cytoplasm label -->
  <text x="100" y="200" font-family="Arial" font-size="16" font-weight="bold" fill="#000000">Cytoplasm</text>
  
  <!-- IL4 cytokine -->
  <circle cx="200" cy="100" r="20" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="200" y="105" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IL4</text>
  
  <!-- IL4 Receptor -->
  <rect x="180" y="140" width="40" height="25" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="200" y="158" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">IL4R</text>
  
  <!-- IL2RG Coreceptor -->
  <rect x="230" y="140" width="40" height="25" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="250" y="158" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">IL2RG</text>
  
  <!-- JAK1 -->
  <rect x="180" y="180" width="40" height="25" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="200" y="198" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">JAK1</text>
  
  <!-- JAK3 -->
  <rect x="230" y="180" width="40" height="25" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="250" y="198" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">JAK3</text>
  
  <!-- STAT6 -->
  <polygon points="290,250 310,230 330,250 310,270" fill="#99ff99" stroke="#333" stroke-width="2"/>
  <text x="310" y="253" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">STAT6</text>
  
  <!-- STAT5A -->
  <polygon points="360,250 380,230 400,250 380,270" fill="#99ff99" stroke="#333" stroke-width="2"/>
  <text x="380" y="253" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">STAT5A</text>
  
  <!-- STAT6 in nucleus -->
  <polygon points="350,380 370,360 390,380 370,400" fill="#99ff99" stroke="#333" stroke-width="2"/>
  <text x="370" y="383" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">STAT6</text>
  
  <!-- STAT5A in nucleus -->
  <polygon points="410,380 430,360 450,380 430,400" fill="#99ff99" stroke="#333" stroke-width="2"/>
  <text x="430" y="383" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">STAT5A</text>
  
  <!-- Arrows -->
  <!-- IL4 to IL4R binding -->
  <path d="M 200,120 L 200,140" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="220" y="130" font-family="Arial" font-size="12" font-style="italic" fill="#000000">Binding</text>
  
  <!-- Receptor to JAK1/JAK3 activation -->
  <path d="M 200,165 L 200,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="160" y="175" font-family="Arial" font-size="12" font-style="italic" fill="#000000">Activation</text>
  
  <path d="M 250,165 L 250,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="290" y="175" font-family="Arial" font-size="12" font-style="italic" fill="#000000">Activation</text>
  
  <!-- JAK1 to STAT6 -->
  <path d="M 220,190 C 260,210 270,220 290,240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="240" y="225" font-family="Arial" font-size="12" font-style="italic" fill="#000000">Phosphorylation</text>
  
  <!-- JAK3 to STAT5A -->
  <path d="M 270,190 C 310,210 330,220 360,240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="320" y="225" font-family="Arial" font-size="12" font-style="italic" fill="#000000">Phosphorylation</text>
  
  <!-- STAT6 translocation to nucleus -->
  <path d="M 310,270 C 330,300 340,340 350,360" stroke="#333" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="300" y="320" font-family="Arial" font-size="12" font-style="italic" fill="#000000">Translocation</text>
  
  <!-- STAT5A translocation to nucleus -->
  <path d="M 380,270 C 400,300 410,340 410,360" stroke="#333" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="420" y="320" font-family="Arial" font-size="12" font-style="italic" fill="#000000">Translocation</text>
  
  <!-- Sequence labels -->
  <circle cx="175" y="130" r="10" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="135" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">1</text>
  
  <circle cx="175" y="175" r="10" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">2</text>
  
  <circle cx="270" y="225" r="10" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="270" y="230" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">3</text>
  
  <circle cx="335" y="310" r="10" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="335" y="315" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">4</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="60" width="180" height="200" rx="5" ry="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="640" y="80" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Legend</text>
  
  <!-- Legend items -->
  <circle cx="570" cy="100" r="10" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="650" y="105" font-family="Arial" font-size="14" fill="#000000">Cytokine (IL4)</text>
  
  <rect x="560" y="120" width="20" height="15" fill="#99ccff" stroke="#333" stroke-width="1"/>
  <text x="650" y="133" font-family="Arial" font-size="14" fill="#000000">Receptor/Coreceptor</text>
  
  <rect x="560" y="150" width="20" height="15" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="650" y="163" font-family="Arial" font-size="14" fill="#000000">Kinase (JAK1/JAK3)</text>
  
  <polygon points="560,180 570,175 580,180 570,185" fill="#99ff99" stroke="#333" stroke-width="1"/>
  <text x="650" y="183" font-family="Arial" font-size="14" fill="#000000">Transcription Factor</text>
  
  <line x1="560" y1="200" x2="580" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="650" y="203" font-family="Arial" font-size="14" fill="#000000">Activation</text>
  
  <line x1="560" y1="220" x2="580" y2="220" stroke="#333" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="650" y="223" font-family="Arial" font-size="14" fill="#000000">Translocation</text>
  
  <circle cx="570" y="240" r="10" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="570" y="245" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">1</text>
  <text x="650" y="245" font-family="Arial" font-size="14" fill="#000000">Sequence of events</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold" fill="#000000">IL4-Mediated Signaling Pathway (Human)</text>
</svg>