<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background representing nucleus -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
  <text x="60" y="80" font-family="Arial" font-size="16" fill="#666">Nucleus</text>
  
  <!-- DNA damage site -->
  <g transform="translate(100,150)">
    <rect x="0" y="0" width="600" height="80" rx="5" ry="5" fill="#e6f2ff" stroke="#99ccff" stroke-width="2"/>
    <text x="10" y="20" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Site of DNA Damage (GO:0090734)</text>
    
    <!-- DNA double helix with damage -->
    <path d="M 50,40 Q 100,20 150,40 Q 200,60 250,40 Q 300,20 350,40 Q 400,60 450,40 Q 500,20 550,40" 
          stroke="#3366cc" stroke-width="3" fill="none"/>
    <path d="M 50,50 Q 100,70 150,50 Q 200,30 250,50 Q 300,70 350,50 Q 400,30 450,50 Q 500,70 550,50" 
          stroke="#3366cc" stroke-width="3" fill="none"/>
    
    <!-- DNA break -->
    <path d="M 250,20 L 270,60" stroke="#ff0000" stroke-width="4" stroke-dasharray="5,3"/>
    <path d="M 230,60 L 250,20" stroke="#ff0000" stroke-width="4" stroke-dasharray="5,3"/>
    <circle cx="250" cy="45" r="15" fill="#ffcccc" stroke="#ff0000" stroke-width="2"/>
  </g>
  
  <!-- Step 1: PARP1 binding to damaged DNA -->
  <g transform="translate(200,240)">
    <rect x="0" y="0" width="120" height="60" rx="10" ry="10" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
    <text x="60" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">PARP1</text>
    <text x="60" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(P09874)</text>
    
    <!-- PARP1 function label -->
    <text x="60" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Damaged DNA binding</text>
    <text x="60" y="90" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(GO:0003684)</text>
    
    <!-- Arrow to DNA damage -->
    <path d="M 60,-10 L 60,-30" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Step 2: PARP1 homodimerization -->
  <g transform="translate(350,240)">
    <rect x="0" y="0" width="120" height="60" rx="10" ry="10" fill="#bbe7ac" stroke="#6aa84f" stroke-width="2"/>
    <rect x="10" y="10" width="120" height="60" rx="10" ry="10" fill="#bbe7ac" stroke="#6aa84f" stroke-width="2"/>
    <text x="70" y="45" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">PARP1 dimer</text>
    <text x="70" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(P09874)</text>
    
    <!-- Dimerization function label -->
    <text x="70" y="85" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Homodimerization</text>
    <text x="70" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(GO:0042803)</text>
  </g>
  
  <!-- Arrow from step 1 to step 2 with label -->
  <path d="M 330,270 L 350,270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="260" font-family="Arial" font-size="10" fill="#666">RO:0002629</text>
  <text x="315" y="285" font-family="Arial" font-size="11" fill="#333" font-style="italic">activates</text>
  
  <!-- Step 3: HPF1 binding and adaptor function -->
  <g transform="translate(200,350)">
    <rect x="0" y="0" width="120" height="60" rx="10" ry="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="2"/>
    <text x="60" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">HPF1</text>
    <text x="60" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(Q9NWY4)</text>
    
    <!-- HPF1 function label -->
    <text x="60" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">ADP-ribosyltransferase</text>
    <text x="60" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">adaptor activity</text>
    <text x="60" y="105" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(GO:0140768)</text>
  </g>
  
  <!-- Step 4: PARP1 NAD+-protein-serine ADP-ribosyltransferase activity -->
  <g transform="translate(400,350)">
    <rect x="0" y="0" width="160" height="70" rx="10" ry="10" fill="#d5a6bd" stroke="#a64d79" stroke-width="2"/>
    <text x="80" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">PARP1</text>
    <text x="80" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(P09874)</text>
    
    <!-- PARP1 serine-ADP-ribosyltransferase function label -->
    <text x="80" y="55" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">NAD+-protein-serine</text>
    <text x="80" y="70" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">ADP-ribosyltransferase (GO:0140805)</text>
  </g>
  
  <!-- Arrows connecting steps 3 & 4 with the PARP1 dimer with labels -->
  <path d="M 260,350 L 410,300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="320" y="320" font-family="Arial" font-size="10" fill="#666">RO:0002629</text>
  <text x="320" y="335" font-family="Arial" font-size="11" fill="#333" font-style="italic">activates</text>
  
  <path d="M 470,350 L 470,310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="480" y="330" font-family="Arial" font-size="10" fill="#666">RO:0002629</text>
  <text x="480" y="345" font-family="Arial" font-size="11" fill="#333" font-style="italic">activates</text>
  
  <!-- Step 5: NAD+-protein poly-ADP-ribosylation activity -->
  <g transform="translate(400,460)">
    <rect x="0" y="0" width="160" height="70" rx="10" ry="10" fill="#ead1dc" stroke="#a64d79" stroke-width="2"/>
    <text x="80" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">PARP1</text>
    <text x="80" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(P09874)</text>
    
    <!-- PARP1 poly-ADP-ribosylation function label -->
    <text x="80" y="55" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">NAD+-protein poly-</text>
    <text x="80" y="70" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">ADP-ribosyltransferase (GO:0003950)</text>
  </g>
  
  <!-- Arrows connecting steps with labels -->
  <path d="M 480,420 L 480,460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="490" y="440" font-family="Arial" font-size="10" fill="#666">RO:0002629</text>
  <text x="490" y="455" font-family="Arial" font-size="11" fill="#333" font-style="italic">activates</text>
  
  <!-- Biological process context boxes -->
  <rect x="600" y="220" width="120" height="90" rx="5" ry="5" fill="#fff2cc" stroke="#e69138" stroke-width="2" fill-opacity="0.7"/>
  <text x="660" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">DNA Damage</text>
  <text x="660" y="270" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Response</text>
  <text x="660" y="290" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(GO:0006974)</text>

  <!-- DNA repair process box -->  
  <rect x="600" y="350" width="120" height="100" rx="5" ry="5" fill="#fce5cd" stroke="#e69138" stroke-width="2" fill-opacity="0.7"/>
  <text x="660" y="390" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">DNA Repair</text>
  <text x="660" y="410" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(GO:0006281)</text>
  
  <!-- Connecting process indicators with color matching and labels -->
  <path d="M 320,270 L 600,265" stroke="#ffd966" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="500" y="250" font-family="Arial" font-size="11" fill="#333" font-style="italic">part of</text>
  
  <path d="M 480,385 L 600,385" stroke="#f6b26b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="550" y="370" font-family="Arial" font-size="11" fill="#333" font-style="italic">part of</text>
  
  <path d="M 480,495 L 600,430" stroke="#f6b26b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="550" y="455" font-family="Arial" font-size="11" fill="#333" font-style="italic">part of</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Activation of PARP1 by HPF1 during DNA Repair</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="700" height="30" rx="5" ry="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="60" y="540" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Proteins:</text>
  
  <!-- Protein legend -->
  <rect x="130" y="527" width="15" height="15" fill="#d9ead3" stroke="#6aa84f" stroke-width="1"/>
  <text x="150" y="540" font-family="Arial" font-size="12" fill="#333">PARP1</text>
  
  <rect x="200" y="527" width="15" height="15" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1"/>
  <text x="220" y="540" font-family="Arial" font-size="12" fill="#333">HPF1</text>
  
  <!-- Process legend -->
  <text x="280" y="540" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Processes:</text>
  
  <rect x="360" y="527" width="15" height="15" fill="#fff2cc" stroke="#e69138" stroke-width="1"/>
  <text x="380" y="540" font-family="Arial" font-size="12" fill="#333">DNA Damage Response</text>
  
  <rect x="530" y="527" width="15" height="15" fill="#fce5cd" stroke="#e69138" stroke-width="1"/>
  <text x="550" y="540" font-family="Arial" font-size="12" fill="#333">DNA Repair</text>
  
  <!-- Arrow legend -->
  <line x1="600" y1="535" x2="620" y2="535" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="630" y="540" font-family="Arial" font-size="12" fill="#333">Activation</text>
  
  <line x1="670" y1="535" x2="690" y2="535" stroke="#ffd966" stroke-width="2" stroke-dasharray="5,3" />
  <text x="700" y="540" font-family="Arial" font-size="12" fill="#333">Process relation</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>