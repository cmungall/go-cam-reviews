<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
    <!-- Cell outline -->
    <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#666" stroke-width="2" />
    
    <!-- Lysosomal membrane -->
    <ellipse cx="450" cy="340" rx="150" ry="100" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
    <text x="450" y="450" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">Lysosomal membrane</text>
    
    <!-- Omegasome membrane (early autophagosome structure) -->
    <path d="M 600 250 C 650 220, 680 280, 650 320 C 620 340, 580 330, 570 310" fill="#e6f2ff" stroke="#3399ff" stroke-width="2" fill-opacity="0.6" />
    <text x="650" y="270" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">Omegasome</text>
    
    <!-- Cytosolic components -->
    <!-- MAPK3/ERK1 -->
    <rect x="150" y="170" width="80" height="40" rx="8" ry="8" fill="#b3e0ff" stroke="#0066cc" stroke-width="2" />
    <text x="190" y="195" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">MAPK3</text>
    
    <!-- DEPTOR (unphosphorylated) -->
    <rect x="280" y="170" width="80" height="40" rx="8" ry="8" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
    <text x="320" y="195" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">DEPTOR</text>
    
    <!-- USP7 -->
    <rect x="280" y="80" width="80" height="40" rx="8" ry="8" fill="#ccf2ff" stroke="#00b3b3" stroke-width="2" />
    <text x="320" y="105" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">USP7</text>
    
    <!-- DEPTOR (phosphorylated) -->
    <rect x="380" y="170" width="100" height="40" rx="8" ry="8" fill="#ffcccc" stroke="#ff6666" stroke-width="2" />
    <text x="430" y="190" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">DEPTOR</text>
    <text x="430" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(phosphorylated)</text>
    
    <!-- DEPTOR (deubiquitinated & stabilized) -->
    <rect x="380" y="80" width="100" height="40" rx="8" ry="8" fill="#ffcccc" stroke="#ff6666" stroke-width="3" />
    <text x="430" y="95" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">DEPTOR</text>
    <text x="430" y="110" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(stabilized)</text>
    
    <!-- mTOR in lysosome -->
    <rect x="380" y="320" width="80" height="40" rx="8" ry="8" fill="#d9b3ff" stroke="#8000ff" stroke-width="2" />
    <text x="420" y="345" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">mTOR</text>
    
    <!-- ULK1 near omegasome -->
    <rect x="550" y="280" width="80" height="40" rx="8" ry="8" fill="#c6ecc6" stroke="#33cc33" stroke-width="2" />
    <text x="590" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">ULK1</text>
    
    <!-- Arrows and interactions -->
    <!-- MAPK3 to DEPTOR (phosphorylation) -->
    <path d="M 230 190 L 280 190" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
    <text x="250" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">P</text>
    <circle cx="250" cy="190" r="8" fill="#ffff99" stroke="#666" stroke-width="1" />
    
    <!-- Phospho-DEPTOR to USP7 interaction -->
    <path d="M 430 170 L 360 120" stroke="#00b3b3" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3" />
    
    <!-- USP7 deubiquitinates DEPTOR -->
    <path d="M 330 120 L 380 110" stroke="#00b3b3" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
    <text x="350" y="100" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Ub</text>
    <line x1="355" y1="105" x2="365" y2="95" stroke="red" stroke-width="2" />
    
    <!-- Stabilized DEPTOR inhibits mTOR -->
    <path d="M 430 120 L 420 320" stroke="#ff6666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
    <text x="460" y="220" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">inhibits</text>
    <line x1="460" y1="235" x2="470" y2="225" stroke="red" stroke-width="2" />
    
    <!-- mTOR inhibits ULK1 (normally) -->
    <path d="M 460 320 L 550 300" stroke="#8000ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3" />
    <text x="500" y="290" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">inhibits</text>
    <line x1="500" y1="307" x2="510" y2="297" stroke="red" stroke-width="2" />
    
    <!-- ULK1 promotes autophagosome assembly -->
    <path d="M 630 280 C 670 260, 690 270, 700 290" stroke="#33cc33" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
    <text x="690" y="240" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Autophagosome</text>
    <text x="690" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">assembly</text>
    
    <!-- Legends and labels -->
    <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">MAPK3-mediated DEPTOR Stabilization and mTOR Regulation</text>
    
    <!-- Arrowhead marker definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
        </marker>
    </defs>
    
    <!-- Pathway steps markers - repositioned for clarity -->
    <circle cx="250" cy="190" r="15" fill="#ffffcc" stroke="#666" stroke-width="1" fill-opacity="0.7" />
    <text x="250" y="194" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">1</text>
    
    <circle cx="350" cy="110" r="15" fill="#ffffcc" stroke="#666" stroke-width="1" fill-opacity="0.7" />
    <text x="350" y="114" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">2</text>
    
    <circle cx="460" cy="220" r="15" fill="#ffffcc" stroke="#666" stroke-width="1" fill-opacity="0.7" />
    <text x="460" y="224" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">3</text>
    
    <circle cx="500" cy="305" r="15" fill="#ffffcc" stroke="#666" stroke-width="1" fill-opacity="0.7" />
    <text x="500" y="309" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">4</text>
    
    <!-- Process labels with increased font size -->
    <text x="70" y="520" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Pathway Steps:</text>
    <text x="70" y="550" font-family="Arial" font-size="16" fill="#333">1. MAPK3/ERK1 phosphorylates DEPTOR</text>
    <text x="70" y="575" font-family="Arial" font-size="16" fill="#333">2. USP7 deubiquitinates phosphorylated DEPTOR, enhancing stability</text>
    <text x="70" y="600" font-family="Arial" font-size="16" fill="#333">3. Stabilized DEPTOR inhibits mTOR kinase activity</text>
    <text x="70" y="625" font-family="Arial" font-size="16" fill="#333">4. Inhibited mTOR relieves ULK1 inhibition, promoting autophagy</text>
    
    <!-- Symbol legend -->
    <rect x="550" y="520" width="220" height="110" rx="5" ry="5" fill="#f9f9f9" stroke="#666" stroke-width="1" />
    <text x="660" y="540" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Symbol Legend</text>
    
    <circle cx="570" y="560" r="8" fill="#ffff99" stroke="#666" stroke-width="1" />
    <text x="580" y="565" font-family="Arial" font-size="14" fill="#333" x="590">P = Phosphorylation</text>
    
    <text x="580" y="590" font-family="Arial" font-size="14" fill="#333">Ub = Ubiquitin</text>
    <line x1="605" y1="595" x2="615" y2="585" stroke="red" stroke-width="2" />
    <text x="625" y="590" font-family="Arial" font-size="14" fill="#333">= Removal</text>
    
    <line x1="570" y1="610" x2="590" y2="610" stroke="#666" stroke-width="2" stroke-dasharray="5,3" />
    <text x="610" y="615" font-family="Arial" font-size="14" fill="#333">= Interaction</text>
</svg>