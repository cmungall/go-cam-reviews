<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="100" y="100" width="600" height="450" rx="300" ry="225" fill="#f8f8f8" stroke="#888888" stroke-width="2" />
  
  <!-- Plasma membrane -->
  <path d="M100,300 Q400,270 700,300 Q400,330 100,300" fill="none" stroke="#888888" stroke-width="4" stroke-dasharray="5,3" />
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="430" rx="100" ry="70" fill="#e6e6fa" stroke="#9370db" stroke-width="2" />
  <text x="400" y="440" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Nucleus</text>
  
  <!-- Extracellular space label -->
  <text x="400" y="200" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333333">Extracellular Space</text>
  
  <!-- Cytoplasm label -->
  <text x="250" y="350" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333333">Cytoplasm</text>
  
  <!-- IL10 cytokine -->
  <circle cx="400" cy="220" r="20" fill="#ff9999" stroke="#cc6666" stroke-width="2" />
  <text x="400" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">IL10</text>
  
  <!-- IL10RA receptor -->
  <rect x="380" y="280" width="30" height="40" rx="5" ry="5" fill="#99ccff" stroke="#6699cc" stroke-width="2" />
  <text x="395" y="305" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">IL10RA</text>
  
  <!-- IL10RB coreceptor -->
  <rect x="420" y="280" width="30" height="40" rx="5" ry="5" fill="#99ff99" stroke="#66cc66" stroke-width="2" />
  <text x="435" y="305" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">IL10RB</text>
  
  <!-- JAK1 -->
  <polygon points="385,320 395,340 375,340" fill="#ffcc99" stroke="#cc9966" stroke-width="2" />
  <text x="385" y="355" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">JAK1</text>
  
  <!-- TYK2 -->
  <polygon points="425,320 435,340 415,340" fill="#ffcc99" stroke="#cc9966" stroke-width="2" />
  <text x="425" y="355" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">TYK2</text>
  
  <!-- STAT3 in cytoplasm -->
  <circle cx="400" cy="370" r="15" fill="#cc99ff" stroke="#9966cc" stroke-width="2" />
  <text x="400" y="375" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">STAT3</text>
  
  <!-- STAT3 in nucleus -->
  <circle cx="400" cy="430" r="15" fill="#cc99ff" stroke="#9966cc" stroke-width="2" />
  <text x="400" y="435" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">STAT3</text>
  
  <!-- DNA binding -->
  <path d="M370,460 Q400,445 430,460 Q400,475 370,460" fill="none" stroke="#333333" stroke-width="2" />
  <text x="400" y="480" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">DNA</text>
  
  <!-- Arrows for pathway with gradient and varying thickness -->
  <!-- IL10 to receptor - binding arrow -->
  <linearGradient id="bindingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ff9999" />
    <stop offset="100%" stop-color="#99ccff" />
  </linearGradient>
  <path d="M400,240 L400,280" fill="none" stroke="url(#bindingGradient)" stroke-width="3" marker-end="url(#arrowhead)" />
  
  <!-- Receptor to JAK1/TYK2 activation - activation arrows -->
  <linearGradient id="activationGradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#99ccff" />
    <stop offset="100%" stop-color="#ffcc99" />
  </linearGradient>
  <path d="M385,340 L385,360" fill="none" stroke="url(#activationGradient)" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <path d="M425,340 L425,360 L415,360" fill="none" stroke="url(#activationGradient)" stroke-width="2.5" marker-end="url(#arrowhead)" />
  
  <!-- JAK/TYK to STAT3 - phosphorylation arrow -->
  <linearGradient id="phosphoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffcc99" />
    <stop offset="100%" stop-color="#cc99ff" />
  </linearGradient>
  <path d="M385,360 L400,370" fill="none" stroke="url(#phosphoGradient)" stroke-width="3" marker-end="url(#arrowhead)" />
  
  <!-- STAT3 to nucleus - translocation arrow -->
  <linearGradient id="translocateGradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#cc99ff" />
    <stop offset="100%" stop-color="#e6e6fa" />
  </linearGradient>
  <path d="M400,385 L400,415" fill="none" stroke="url(#translocateGradient)" stroke-width="3.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  
  <!-- STAT3 to DNA - binding arrow -->
  <linearGradient id="dnabindGradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#cc99ff" />
    <stop offset="100%" stop-color="#333333" />
  </linearGradient>
  <path d="M400,445 L400,455" fill="none" stroke="url(#dnabindGradient)" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>
  
  <!-- Step descriptions -->
  <rect x="170" y="230" width="180" height="30" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="#888" stroke-width="1" />
  <text x="260" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">1. IL10 cytokine binding to receptor</text>
  
  <rect x="480" y="310" width="180" height="30" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="#888" stroke-width="1" />
  <text x="570" y="330" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">2. Receptor complex formation</text>

  <rect x="500" y="350" width="180" height="30" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="#888" stroke-width="1" />
  <text x="590" y="370" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">3. JAK1/TYK2 tyrosine kinase activation</text>
  
  <rect x="170" y="380" width="180" height="30" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="#888" stroke-width="1" />
  <text x="260" y="400" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">4. STAT3 phosphorylation</text>
  
  <rect x="500" y="400" width="180" height="30" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="#888" stroke-width="1" />
  <text x="590" y="420" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">5. STAT3 nuclear translocation</text>
  
  <rect x="170" y="450" width="180" height="30" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="#888" stroke-width="1" />
  <text x="260" y="470" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">6. DNA binding and gene transcription</text>
  
  <!-- Legend -->
  <rect x="600" y="120" width="90" height="190" fill="white" stroke="#888888" stroke-width="1" />
  <text x="645" y="135" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">Legend</text>
  
  <circle cx="615" cy="150" r="7" fill="#ff9999" stroke="#cc6666" stroke-width="1" />
  <text x="655" y="155" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">IL10</text>
  
  <rect x="608" y="165" width="14" height="14" rx="2" ry="2" fill="#99ccff" stroke="#6699cc" stroke-width="1" />
  <text x="655" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">IL10RA</text>
  
  <rect x="608" y="185" width="14" height="14" rx="2" ry="2" fill="#99ff99" stroke="#66cc66" stroke-width="1" />
  <text x="655" y="195" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">IL10RB</text>
  
  <polygon points="608,205 622,205 615,219" fill="#ffcc99" stroke="#cc9966" stroke-width="1" />
  <text x="655" y="215" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">Kinases</text>
  
  <circle cx="615" cy="230" r="7" fill="#cc99ff" stroke="#9966cc" stroke-width="1" />
  <text x="655" y="235" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">STAT3</text>
  
  <path d="M608,250 Q615,245 622,250 Q615,255 608,250" fill="none" stroke="#333333" stroke-width="1" />
  <text x="655" y="255" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">DNA</text>
  
  <line x1="608" y1="270" x2="622" y2="270" stroke-width="3.5" stroke-dasharray="5,3" stroke="#888888" />
  <text x="655" y="275" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">Translocation</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333333">IL10-mediated Signaling Pathway (Human)</text>
  <text x="400" y="75" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" fill="#666666">Regulation of immune response via STAT3 activation</text>
  
  <!-- Citation -->
  <text x="400" y="530" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">Based on GO-CAM model: gomodel:626b20c100000681</text>
  <text x="400" y="545" font-family="Arial" font-size="10" text-anchor="middle" fill="#666666">References: PMID:16982608, PMID:7543512, PMID:24994464</text>
</svg>