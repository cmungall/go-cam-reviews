<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f9f9f9" stroke="#666" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="400" cy="300" rx="250" ry="200" fill="#e6e6fa" stroke="#666" stroke-width="2"/>
  
  <!-- Chromatin regions -->
  <path d="M300,250 C320,230 340,240 350,220 C360,200 380,210 400,190 C420,170 450,180 470,200 C490,220 510,210 530,230" stroke="#8a2be2" stroke-width="4" fill="none"/>
  <path d="M280,280 C300,260 330,270 350,250 C370,230 400,240 420,220 C440,200 460,210 490,230 C510,250 520,240 540,260" stroke="#8a2be2" stroke-width="4" fill="none"/>
  <path d="M290,320 C310,300 340,310 360,290 C380,270 410,280 430,260 C450,240 470,250 500,270 C520,290 530,280 550,300" stroke="#8a2be2" stroke-width="4" fill="none"/>
  
  <!-- Progesterone in cytoplasm -->
  <circle cx="160" cy="300" r="15" fill="#ffd700" stroke="#000" stroke-width="1"/>
  <text x="160" y="304" text-anchor="middle" font-family="Arial" font-size="10">P</text>
  <text x="160" y="330" text-anchor="middle" font-family="Arial" font-size="12">Progesterone</text>

  <!-- PGR in nucleus (active form) -->
  <rect x="250" y="250" width="70" height="30" fill="#87ceeb" stroke="#000" stroke-width="1" rx="5" ry="5"/>
  <text x="285" y="270" text-anchor="middle" font-family="Arial" font-size="14">PGR</text>
  
  <!-- NCOA1 -->
  <rect x="400" y="250" width="80" height="30" fill="#98fb98" stroke="#000" stroke-width="1" rx="5" ry="5"/>
  <text x="440" y="270" text-anchor="middle" font-family="Arial" font-size="14">NCOA1</text>
  
  <!-- UBR5 -->
  <rect x="400" y="350" width="70" height="30" fill="#ff6347" stroke="#000" stroke-width="1" rx="5" ry="5"/>
  <text x="435" y="370" text-anchor="middle" font-family="Arial" font-size="14">UBR5</text>
  
  <!-- Ubiquitin -->
  <circle cx="500" cy="350" r="15" fill="#ff9900" stroke="#000" stroke-width="1"/>
  <text x="500" y="354" text-anchor="middle" font-family="Arial" font-size="10">Ub</text>
  
  <!-- Scenario 1: PGR with NCOA1 (protected from UBR5) -->
  <g transform="translate(200, 130)">
    <rect x="0" y="0" width="150" height="100" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" rx="10" ry="10" opacity="0.8"/>
    
    <!-- PGR bound to progesterone -->
    <rect x="10" y="25" width="50" height="25" fill="#87ceeb" stroke="#000" stroke-width="1" rx="5" ry="5"/>
    <text x="35" y="42" text-anchor="middle" font-family="Arial" font-size="12">PGR</text>
    
    <!-- Progesterone bound to PGR -->
    <circle cx="10" cy="37" r="8" fill="#ffd700" stroke="#000" stroke-width="1"/>
    <text x="10" y="40" text-anchor="middle" font-family="Arial" font-size="8">P</text>
    
    <!-- NCOA1 bound to PGR -->
    <rect x="80" y="25" width="60" height="25" fill="#98fb98" stroke="#000" stroke-width="1" rx="5" ry="5"/>
    <text x="110" y="42" text-anchor="middle" font-family="Arial" font-size="12">NCOA1</text>
    
    <!-- Binding line -->
    <line x1="60" y1="37" x2="80" y2="37" stroke="#000" stroke-width="2"/>
    
    <text x="75" y="70" text-anchor="middle" font-family="Arial" font-size="10">Protected from</text>
    <text x="75" y="85" text-anchor="middle" font-family="Arial" font-size="10">ubiquitination</text>
    
    <text x="75" y="10" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Scenario 1:</text>
  </g>
  
  <!-- Scenario 2: PGR without NCOA1 (targeted by UBR5) -->
  <g transform="translate(450, 130)">
    <rect x="0" y="0" width="150" height="100" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" rx="10" ry="10" opacity="0.8"/>
    
    <!-- PGR bound to progesterone -->
    <rect x="10" y="25" width="50" height="25" fill="#87ceeb" stroke="#000" stroke-width="1" rx="5" ry="5"/>
    <text x="35" y="42" text-anchor="middle" font-family="Arial" font-size="12">PGR</text>
    
    <!-- Progesterone bound to PGR -->
    <circle cx="10" cy="37" r="8" fill="#ffd700" stroke="#000" stroke-width="1"/>
    <text x="10" y="40" text-anchor="middle" font-family="Arial" font-size="8">P</text>
    
    <!-- UBR5 targeting PGR -->
    <rect x="80" y="25" width="50" height="25" fill="#ff6347" stroke="#000" stroke-width="1" rx="5" ry="5"/>
    <text x="105" y="42" text-anchor="middle" font-family="Arial" font-size="12">UBR5</text>
    
    <!-- Ubiquitin -->
    <circle cx="120" cy="15" r="8" fill="#ff9900" stroke="#000" stroke-width="1"/>
    <text x="120" y="18" text-anchor="middle" font-family="Arial" font-size="7">Ub</text>
    
    <!-- Targeting arrow -->
    <line x1="60" y1="37" x2="80" y2="37" stroke="#ff0000" stroke-width="2" stroke-dasharray="2"/>
    
    <text x="75" y="70" text-anchor="middle" font-family="Arial" font-size="10">Targeted for</text>
    <text x="75" y="85" text-anchor="middle" font-family="Arial" font-size="10">ubiquitination</text>
    
    <text x="75" y="10" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Scenario 2:</text>
  </g>
  
  <!-- Step 1: Progesterone binding -->
  <g transform="translate(120, 380)">
    <rect x="0" y="0" width="120" height="50" fill="#fff8dc" stroke="#aaaaaa" stroke-width="1" rx="5" ry="5" opacity="0.8"/>
    <text x="60" y="15" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Step 1:</text>
    <text x="60" y="30" text-anchor="middle" font-family="Arial" font-size="9">Progesterone binds to</text>
    <text x="60" y="42" text-anchor="middle" font-family="Arial" font-size="9">nuclear receptor PGR</text>
  </g>
  
  <!-- Step 2: NCOA binding (or not) -->
  <g transform="translate(260, 380)">
    <rect x="0" y="0" width="140" height="50" fill="#fff8dc" stroke="#aaaaaa" stroke-width="1" rx="5" ry="5" opacity="0.8"/>
    <text x="70" y="15" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Step 2:</text>
    <text x="70" y="30" text-anchor="middle" font-family="Arial" font-size="9">NCOA1 may associate with</text>
    <text x="70" y="42" text-anchor="middle" font-family="Arial" font-size="9">PGR as a coactivator</text>
  </g>
  
  <!-- Step 3: UBR5 targeting -->
  <g transform="translate(420, 380)">
    <rect x="0" y="0" width="140" height="50" fill="#fff8dc" stroke="#aaaaaa" stroke-width="1" rx="5" ry="5" opacity="0.8"/>
    <text x="70" y="15" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Step 3:</text>
    <text x="70" y="30" text-anchor="middle" font-family="Arial" font-size="9">UBR5 ubiquitinates PGR</text>
    <text x="70" y="42" text-anchor="middle" font-family="Arial" font-size="9">when not bound to NCOA1</text>
  </g>
  
  <!-- Arrows for main pathway -->
  <!-- Progesterone to PGR -->
  <path d="M175,300 C200,280 230,270 250,265" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="265" text-anchor="middle" font-family="Arial" font-size="10" fill="#000000">binding</text>
  
  <!-- PGR to NCOA1 (positive regulation) -->
  <path d="M320,265 C340,240 380,240 400,265" stroke="#006400" stroke-width="2" fill="none" marker-end="url(#greenArrow)"/>
  <text x="360" y="240" text-anchor="middle" font-family="Arial" font-size="12">activates</text>
  
  <!-- NCOA1 to UBR5 (negative regulation) -->
  <path d="M440,280 C440,300 435,320 435,350" stroke="#8b0000" stroke-width="2" fill="none" marker-end="url(#redArrow)" stroke-dasharray="5,3"/>
  <text x="480" y="315" text-anchor="middle" font-family="Arial" font-size="12">inhibits</text>
  
  <!-- UBR5 to PGR (ubiquitination) -->
  <path d="M400,365 C350,380 300,350 290,280" stroke="#ff0000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="340" y="390" text-anchor="middle" font-family="Arial" font-size="12">ubiquitinates</text>
  
  <!-- Ubiquitin to UBR5 -->
  <path d="M485,350 L470,350" stroke="#000" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <text x="490" y="340" text-anchor="middle" font-family="Arial" font-size="10">substrate</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b0000"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006400"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">UBR5 Ubiquitination of PGR in Absence of NCOA Coactivators</text>
  
  <!-- Labels -->
  <text x="400" y="500" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Nucleus</text>
  <text x="650" y="500" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Cytoplasm</text>
  <text x="350" y="200" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">Chromatin</text>
  
  <!-- Legend -->
  <rect x="580" y="520" width="200" height="70" fill="white" stroke="#666" stroke-width="1"/>
  <text x="590" y="535" font-family="Arial" font-size="12" font-weight="bold">Legend:</text>
  
  <rect x="590" y="545" width="15" height="10" fill="#87ceeb" stroke="#000" stroke-width="1"/>
  <text x="610" y="554" font-family="Arial" font-size="11">PGR (P06401) - Progesterone receptor</text>
  
  <rect x="590" y="560" width="15" height="10" fill="#98fb98" stroke="#000" stroke-width="1"/>
  <text x="610" y="569" font-family="Arial" font-size="11">NCOA1 (Q15788) - Nuclear receptor coactivator</text>
  
  <rect x="590" y="575" width="15" height="10" fill="#ff6347" stroke="#000" stroke-width="1"/>
  <text x="610" y="584" font-family="Arial" font-size="11">UBR5 (O95071) - E3 ubiquitin ligase</text>
  
  <circle cx="680" cy="545" r="5" fill="#ffd700" stroke="#000" stroke-width="1"/>
  <text x="710" y="548" font-family="Arial" font-size="11">Progesterone (ligand)</text>
  
  <circle cx="680" cy="560" r="5" fill="#ff9900" stroke="#000" stroke-width="1"/>
  <text x="710" y="563" font-family="Arial" font-size="11">Ubiquitin tag</text>
</svg>