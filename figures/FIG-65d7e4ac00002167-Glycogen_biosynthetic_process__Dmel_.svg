<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Cytosol -->
  <rect x="0" y="0" width="800" height="650" fill="#f8f9fa" stroke="#333" stroke-width="2" rx="20" ry="20" />
  <text x="30" y="30" font-family="Arial" font-size="22" font-weight="bold" fill="#333">Glycogen Biosynthetic Process (Drosophila melanogaster)</text>
  <text x="30" y="55" font-family="Arial" font-size="18" fill="#666">Cytosol (GO:0005829)</text>
  
  <!-- Process context box -->
  <rect x="500" y="20" width="270" height="85" rx="10" ry="10" fill="#fffaed" stroke="#d4b483" stroke-width="1.5" />
  <text x="510" y="40" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Process Context:</text>
  <text x="510" y="60" font-family="Arial" font-size="13" fill="#333">Glycogen biosynthesis (GO:0005978)</text>
  <text x="510" y="80" font-family="Arial" font-size="13" fill="#333">A sequential enzymatic process in the</text>
  <text x="510" y="100" font-family="Arial" font-size="13" fill="#333">cytosol leading to glycogen production</text>
  
  <!-- Chemical structures (simplified) -->
  <!-- Glucose-6-P -->
  <circle cx="120" cy="200" r="40" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="120" y="190" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">α-D-glucose</text>
  <text x="120" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">6-phosphate</text>
  <text x="120" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(CHEBI:58225)</text>
  
  <!-- Glucose-1-P -->
  <circle cx="280" cy="200" r="40" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="280" y="190" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">α-D-glucose</text>
  <text x="280" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">1-phosphate</text>
  <text x="280" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(CHEBI:58601)</text>
  
  <!-- UDP-glucose -->
  <circle cx="440" cy="200" r="40" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="440" y="190" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">UDP-α-D-</text>
  <text x="440" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">glucose</text>
  <text x="440" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(CHEBI:58885)</text>
  
  <!-- Initial Glycogen -->
  <polygon points="570,180 600,160 630,180 630,220 600,240 570,220" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="600" y="205" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Glycogen</text>
  <text x="600" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(Initial)</text>
  
  <!-- Elongated Glycogen -->
  <polygon points="570,320 600,300 630,320 630,360 600,380 570,360" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <text x="600" y="335" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Glycogen</text>
  <text x="600" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(Elongated)</text>
  
  <!-- Branched Glycogen -->
  <polygon points="570,460 600,440 630,460 630,500 600,520 570,500" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <circle cx="650" cy="470" r="10" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <path d="M630,470 L640,470" stroke="#ff9933" stroke-width="2" fill="none" />
  <circle cx="650" cy="490" r="10" fill="#ffe6cc" stroke="#ff9933" stroke-width="2" />
  <path d="M630,490 L640,490" stroke="#ff9933" stroke-width="2" fill="none" />
  <text x="600" y="475" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Glycogen</text>
  <text x="600" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(Branched)</text>
  <text x="600" y="515" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(CHEBI:28087)</text>
  
  <!-- Enzyme 1: Pgm1 (Phosphoglucomutase) -->
  <rect x="160" y="120" width="80" height="40" rx="10" ry="10" fill="#d9f2d9" stroke="#339933" stroke-width="2" />
  <text x="200" y="144" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Pgm1</text>
  <text x="200" y="98" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Phosphoglucomutase</text>
  <text x="200" y="115" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0004614)</text>
  
  <!-- Enzyme 2: UGP (UTP:glucose-1-phosphate uridylyltransferase) -->
  <rect x="320" y="120" width="80" height="40" rx="10" ry="10" fill="#d9f2d9" stroke="#339933" stroke-width="2" />
  <text x="360" y="144" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">UGP</text>
  <text x="360" y="98" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">UTP:glucose-1-phosphate</text>
  <text x="360" y="115" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">uridylyltransferase (GO:0003983)</text>
  
  <!-- Enzyme 3: Gyg (Glycogenin) -->
  <rect x="480" y="120" width="80" height="40" rx="10" ry="10" fill="#d9f2d9" stroke="#339933" stroke-width="2" />
  <text x="520" y="144" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Gyg</text>
  <text x="520" y="98" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Glycogenin</text>
  <text x="520" y="115" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0008466)</text>
  
  <!-- Enzyme 4: Glys (Glycogen synthase) -->
  <rect x="480" y="260" width="80" height="40" rx="10" ry="10" fill="#d9f2d9" stroke="#339933" stroke-width="2" />
  <text x="520" y="284" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Glys</text>
  <text x="520" y="238" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Glycogen synthase</text>
  <text x="520" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0004373)</text>
  
  <!-- Enzyme 5: Agbe (Branching enzyme) -->
  <rect x="480" y="400" width="80" height="40" rx="10" ry="10" fill="#d9f2d9" stroke="#339933" stroke-width="2" />
  <text x="520" y="424" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Agbe</text>
  <text x="520" y="378" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Branching enzyme</text>
  <text x="520" y="395" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GO:0003844)</text>
  
  <!-- Reaction arrows with enzyme action indicators -->
  <!-- Pgm1 reaction -->
  <path d="M160,200 L240,200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <rect x="183" y="188" width="36" height="16" rx="8" ry="8" fill="#d9f2d9" stroke="#339933" stroke-width="1" opacity="0.7" />
  <text x="201" y="200" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Pgm1</text>
  
  <!-- UGP reaction -->
  <path d="M320,200 L400,200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <rect x="343" y="188" width="36" height="16" rx="8" ry="8" fill="#d9f2d9" stroke="#339933" stroke-width="1" opacity="0.7" />
  <text x="361" y="200" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">UGP</text>
  
  <!-- Gyg reaction -->
  <path d="M480,200 L560,200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <rect x="503" y="188" width="36" height="16" rx="8" ry="8" fill="#d9f2d9" stroke="#339933" stroke-width="1" opacity="0.7" />
  <text x="521" y="200" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Gyg</text>
  
  <!-- Glys reaction -->
  <path d="M600,240 L600,300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <rect x="582" y="260" width="36" height="16" rx="8" ry="8" fill="#d9f2d9" stroke="#339933" stroke-width="1" opacity="0.7" />
  <text x="600" y="272" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Glys</text>
  
  <!-- Agbe reaction -->
  <path d="M600,380 L600,440" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <rect x="582" y="400" width="36" height="16" rx="8" ry="8" fill="#d9f2d9" stroke="#339933" stroke-width="1" opacity="0.7" />
  <text x="600" y="412" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Agbe</text>
  
  <!-- Regulatory connections -->
  <path d="M200,160 L200,200" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none" />
  <path d="M360,160 L360,200" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none" />
  <path d="M520,160 L520,200" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none" />
  <path d="M520,300 L520,340" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none" />
  <path d="M520,440 L520,480" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- UDP-glucose feedback arrow to Glys -->
  <path d="M440,230 Q440,280 480,280" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" fill="none" />
  <text x="440" y="265" font-family="Arial" font-size="12" fill="#cc0000">substrate</text>
  
  <!-- Causal arrows -->
  <path d="M520,200 Q450,250 520,260" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" />
  <text x="470" y="240" font-family="Arial" font-size="12" fill="#333">activates</text>
  
  <path d="M520,340 Q450,370 520,400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" />
  <text x="470" y="380" font-family="Arial" font-size="12" fill="#333">activates</text>
  
  <!-- Transformation labels -->
  <text x="200" y="175" font-family="Arial" font-size="11" text-anchor="middle" fill="#666" font-style="italic">G6P ⟶ G1P</text>
  <text x="360" y="175" font-family="Arial" font-size="11" text-anchor="middle" fill="#666" font-style="italic">G1P ⟶ UDP-G</text>
  <text x="520" y="175" font-family="Arial" font-size="11" text-anchor="middle" fill="#666" font-style="italic">Glycogen initiation</text>
  <text x="650" y="270" font-family="Arial" font-size="11" text-anchor="middle" fill="#666" font-style="italic">Chain elongation</text>
  <text x="650" y="410" font-family="Arial" font-size="11" text-anchor="middle" fill="#666" font-style="italic">Branch formation</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="30" y="570" width="740" height="60" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1" />
  <text x="40" y="590" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Legend:</text>
  <rect x="110" y="580" width="18" height="18" fill="#d9f2d9" stroke="#339933" stroke-width="1" rx="3" ry="3" />
  <text x="135" y="595" font-family="Arial" font-size="14" fill="#333">Gene Product (Enzyme)</text>
  <circle cx="260" y="589" r="9" fill="#e6f2ff" stroke="#0066cc" stroke-width="1" />
  <text x="275" y="595" font-family="Arial" font-size="14" fill="#333">Metabolite</text>
  <polygon points="350,580 365,580 380,589 365,598 350,598" fill="#ffe6cc" stroke="#ff9933" stroke-width="1" />
  <text x="390" y="595" font-family="Arial" font-size="14" fill="#333">Glycogen</text>
  <line x1="450" y1="589" x2="490" y2="589" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="500" y="595" font-family="Arial" font-size="14" fill="#333">Reaction flow</text>
  <line x1="590" y1="589" x2="630" y2="589" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <text x="640" y="595" font-family="Arial" font-size="14" fill="#333">Enzymatic activity</text>
</svg>