<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient for aesthetics -->
  <defs>
    <linearGradient id="cell_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f8ff" />
      <stop offset="100%" stop-color="#e6f3ff" />
    </linearGradient>
    <!-- Filter for shadow effects -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Arrowhead marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
    <!-- Activation marker -->
    <marker id="activation" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006600" />
    </marker>
    <!-- Inhibition marker -->
    <marker id="inhibition" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <circle cx="6" cy="6" r="5" fill="white" stroke="#cc0000" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Cell outline with extracellular space -->
  <rect x="0" y="0" width="800" height="110" fill="#f8f9fa" stroke="none" /> <!-- Extracellular space background -->
  <rect x="50" y="110" width="700" height="450" rx="30" ry="30" fill="url(#cell_gradient)" stroke="#8ba3b9" stroke-width="2" /> <!-- Cell outline -->
  
  <!-- Extracellular space label -->
  <rect x="300" y="60" width="200" height="30" rx="5" ry="5" fill="#f8f9fa" stroke="none" />
  <text x="400" y="80" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Extracellular Space</text>

  <!-- Cytoplasm label -->
  <rect x="320" y="125" width="160" height="30" rx="5" ry="5" fill="#e6f3ff" stroke="none" />
  <text x="400" y="145" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Cytoplasm</text>

  <!-- IFNB1 in extracellular space -->
  <circle cx="150" cy="70" r="28" fill="#ff9999" stroke="#cc0000" stroke-width="2" filter="url(#dropShadow)" />
  <text x="150" y="75" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IFNB1</text>

  <!-- Type I interferon signaling pathway -->
  <path d="M150,98 Q150,140 150,180" stroke="#cc0000" stroke-width="3" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  <rect x="30" y="120" width="100" height="40" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="80" y="140" font-family="Arial" font-size="14" text-anchor="middle">Type I IFN</text>
  <text x="80" y="155" font-family="Arial" font-size="14" text-anchor="middle">signaling</text>

  <!-- IFIT proteins -->
  <rect x="90" y="200" width="70" height="35" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2" filter="url(#dropShadow)" />
  <text x="125" y="223" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IFIT1</text>

  <rect x="180" y="200" width="70" height="35" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2" filter="url(#dropShadow)" />
  <text x="215" y="223" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IFIT2</text>

  <rect x="270" y="200" width="70" height="35" rx="5" ry="5" fill="#99ccff" stroke="#0066cc" stroke-width="2" filter="url(#dropShadow)" />
  <text x="305" y="223" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IFIT3</text>

  <!-- RNA binding function -->
  <path d="M125,235 Q125,270 125,290" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M215,235 Q215,270 215,290" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M305,235 Q305,270 305,290" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <rect x="80" y="250" width="100" height="25" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="130" y="267" font-family="Arial" font-size="14" text-anchor="middle">RNA binding</text>
  
  <rect x="170" y="250" width="100" height="25" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="220" y="267" font-family="Arial" font-size="14" text-anchor="middle">RNA binding</text>
  
  <rect x="260" y="250" width="100" height="25" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="310" y="267" font-family="Arial" font-size="14" text-anchor="middle">RNA binding</text>

  <!-- Viral RNA (target) - implied detail not in model -->
  <path d="M50,300 Q180,340 310,300" stroke="#666666" stroke-width="3" fill="none" stroke-dasharray="5,3" />
  <rect x="120" y="315" width="120" height="40" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="180" y="330" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" fill="#666666">Viral RNA</text>
  <text x="180" y="345" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" fill="#666666">(not in source model)</text>

  <!-- Antiviral immune response label -->
  <rect x="80" y="370" width="200" height="30" rx="5" ry="5" fill="#e6f9ff" stroke="#0066cc" stroke-width="1" filter="url(#dropShadow)" />
  <text x="180" y="390" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Antiviral Immune Response</text>

  <!-- Poxvirus region - light green background -->
  <rect x="500" y="170" width="200" height="120" rx="15" ry="15" fill="#efffef" stroke="#006600" stroke-width="1" stroke-dasharray="5,3" />
  <text x="600" y="185" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic" fill="#006600">Poxvirus</text>

  <!-- Poxvirus Protein OPG025 (VACWR019) -->
  <polygon points="560,200 610,200 620,230 610,260 560,260 550,230" fill="#99ff99" stroke="#006600" stroke-width="2" filter="url(#dropShadow)" />
  <text x="585" y="225" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">OPG025</text>
  <text x="585" y="245" font-family="Arial" font-size="14" text-anchor="middle">(VACWR019)</text>

  <!-- Molecular adaptor activity -->
  <path d="M560,230 Q510,230 460,280" stroke="#006600" stroke-width="2" fill="none" marker-end="url(#activation)" />
  <rect x="480" y="230" width="90" height="40" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="525" y="250" font-family="Arial" font-size="14" text-anchor="middle">Molecular</text>
  <text x="525" y="265" font-family="Arial" font-size="14" text-anchor="middle">adaptor</text>

  <!-- CUL1 (SCF complex) -->
  <rect x="400" y="280" width="120" height="50" rx="5" ry="5" fill="#ffcc99" stroke="#ff6600" stroke-width="2" filter="url(#dropShadow)" />
  <text x="460" y="305" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CUL1</text>
  <text x="460" y="320" font-family="Arial" font-size="14" text-anchor="middle">(SCF complex)</text>

  <!-- SCF-dependent process box -->
  <rect x="380" y="340" width="160" height="30" rx="5" ry="5" fill="#fff7e6" stroke="#ff6600" stroke-width="1" />
  <text x="460" y="360" font-family="Arial" font-size="14" text-anchor="middle">SCF-dependent process</text>

  <!-- Ubiquitin ligase activity -->
  <path d="M400,310 Q350,310 300,310 Q250,310 200,380" stroke="#ff6600" stroke-width="3" fill="none" marker-end="url(#inhibition)" />
  <rect x="250" y="280" width="150" height="25" rx="5" ry="5" fill="white" fill-opacity="0.8" stroke="none" />
  <text x="325" y="297" font-family="Arial" font-size="14" text-anchor="middle">Ubiquitin ligase binding</text>
  
  <!-- Degradation of IFIT proteins -->
  <rect x="120" y="415" width="160" height="30" rx="5" ry="5" fill="#ffcccc" stroke="#cc0000" stroke-width="1" />
  <text x="200" y="435" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#cc0000">IFIT Degradation</text>
  <path d="M200,390 L180,415 L220,415 Z" fill="#cc0000" stroke="#800000" stroke-width="2" />
  
  <!-- Suppression of host immune response -->
  <rect x="420" y="400" width="270" height="50" rx="10" ry="10" fill="#ffff99" stroke="#cccc00" stroke-width="2" filter="url(#dropShadow)" />
  <text x="555" y="430" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Suppression of Host Immune Response</text>
  
  <!-- Connection between degradation and suppression -->
  <path d="M280,430 Q350,430 420,425" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- Title of the pathway -->
  <rect x="150" y="15" width="500" height="35" rx="5" ry="5" fill="white" fill-opacity="0.9" stroke="#333333" stroke-width="1" />
  <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Poxvirus-OPG025 Inhibition of Antiviral IFITs</text>

  <!-- Legend -->
  <rect x="600" y="490" width="180" height="65" rx="5" ry="5" fill="white" stroke="#333333" stroke-width="1" />
  <text x="690" y="505" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  <circle cx="615" y="520" r="8" fill="#ff9999" stroke="#cc0000" stroke-width="1" />
  <text x="635" y="525" font-family="Arial" font-size="14" text-anchor="start">Cytokine</text>
  <rect x="610" y="535" width="16" height="16" fill="#99ccff" stroke="#0066cc" stroke-width="1" />
  <text x="635" y="547" font-family="Arial" font-size="14" text-anchor="start">IFIT Protein</text>
  <polygon points="615,555 625,555 627,565 625,575 615,575 613,565" fill="#99ff99" stroke="#006600" stroke-width="1" transform="scale(0.5) translate(1225, 1075)" />
  <text x="635" y="565" font-family="Arial" font-size="14" text-anchor="start">Viral Protein</text>
</svg>