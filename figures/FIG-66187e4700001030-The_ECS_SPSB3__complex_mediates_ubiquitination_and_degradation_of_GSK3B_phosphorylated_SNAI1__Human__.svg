<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell nucleus -->
  <ellipse cx="400" cy="300" rx="380" ry="280" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="400" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Nucleus</text>
  
  <!-- Title -->
  <text x="400" y="580" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">ECS(SPSB3) complex mediates ubiquitination and degradation of GSK3B-phosphorylated SNAI1</text>
  
  <!-- Step 1: GSK3B phosphorylates SNAI1 -->
  <circle cx="150" cy="200" r="40" fill="#b3e0ff" stroke="#333" stroke-width="2"/>
  <text x="150" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">GSK3B</text>
  
  <circle cx="300" cy="200" r="40" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="300" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">SNAI1</text>
  
  <path d="M 190 200 L 260 200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="190" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Phosphorylation</text>
  
  <!-- Step 2: SPSB3 recognizes phosphorylated SNAI1 -->
  <circle cx="300" cy="320" r="40" fill="#ffcc99" stroke="#333" stroke-width="2"/>
  <text x="300" y="315" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">SNAI1</text>
  <text x="300" y="335" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">P</text>
  
  <circle cx="450" cy="320" r="40" fill="#c2f0c2" stroke="#333" stroke-width="2"/>
  <text x="450" y="325" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">SPSB3</text>
  
  <path d="M 300 240 L 300 280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 340 320 L 410 320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="375" y="310" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Recognition</text>
  
  <!-- Step 3: ECS complex formation and ubiquitination -->
  <circle cx="550" cy="250" r="35" fill="#d9b3ff" stroke="#333" stroke-width="2"/>
  <text x="550" y="255" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">CUL5</text>
  
  <circle cx="550" cy="390" r="35" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="550" y="395" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">RNF7</text>
  
  <path d="M 490 320 L 550 285" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 490 320 L 550 355" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ECS complex box -->
  <rect x="500" y="290" rx="20" ry="20" width="150" height="80" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="575" y="330" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">ECS Complex</text>
  <text x="575" y="350" font-family="Arial" font-size="14" text-anchor="middle">(CUL5-RNF7-SPSB3)</text>
  
  <!-- Step 4: Ubiquitination and degradation -->
  <circle cx="700" cy="320" r="40" fill="#ffcc99" stroke="#333" stroke-width="2" opacity="0.5"/>
  <text x="700" y="315" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">SNAI1</text>
  <text x="700" y="335" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Degraded</text>
  
  <path d="M 650 320 L 660 320" stroke="#333" stroke-width="2"/>
  <path d="M 670 320 L 680 320" stroke="#333" stroke-width="2"/>
  <path d="M 690 320 L 700 320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="660" y="305" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Ubiquitination</text>
  
  <!-- Ubiquitin symbols -->
  <circle cx="300" cy="380" r="12" fill="#ffff99" stroke="#333" stroke-width="1"/>
  <text x="300" y="385" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Ub</text>
  <path d="M 300 350 L 300 368" stroke="#333" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Biological outcome arrow -->
  <path d="M 700 360 L 700 420 L 640 420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="620" y="435" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Regulates Epithelial to</text>
  <text x="620" y="455" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Mesenchymal Transition (EMT)</text>
  <text x="620" y="475" font-family="Arial" font-size="12" text-anchor="middle">SNAI1 acts as a transcriptional repressor in EMT</text>
  
  <!-- Legend -->
  <rect x="50" y="420" width="210" height="160" fill="white" stroke="#333" stroke-width="1"/>
  <text x="155" y="440" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Legend</text>
  
  <rect x="70" cy="460" width="14" height="14" fill="#b3e0ff" stroke="#333" stroke-width="1"/>
  <text x="90" y="472" font-family="Arial" font-size="14" text-anchor="start">GSK3B - Protein kinase</text>
  
  <rect x="70" cy="485" width="14" height="14" fill="#ffcc99" stroke="#333" stroke-width="1"/>
  <text x="90" y="497" font-family="Arial" font-size="14" text-anchor="start">SNAI1 - Transcription repressor</text>
  
  <rect x="70" cy="510" width="14" height="14" fill="#c2f0c2" stroke="#333" stroke-width="1"/>
  <text x="90" y="522" font-family="Arial" font-size="14" text-anchor="start">SPSB3 - Adaptor protein</text>
  
  <rect x="70" cy="535" width="14" height="14" fill="#d9b3ff" stroke="#333" stroke-width="1"/>
  <text x="90" y="547" font-family="Arial" font-size="14" text-anchor="start">CUL5 - Scaffold protein</text>
  
  <rect x="70" cy="560" width="14" height="14" fill="#ff9999" stroke="#333" stroke-width="1"/>
  <text x="90" y="572" font-family="Arial" font-size="14" text-anchor="start">RNF7 - Ubiquitin ligase</text>
  
  <circle cx="90" cy="585" r="8" fill="#ffff99" stroke="#333" stroke-width="1"/>
  <text x="105" y="590" font-family="Arial" font-size="14" text-anchor="start">Ubiquitin</text>
  
  <text x="155" y="610" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">P = Phosphorylation</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>