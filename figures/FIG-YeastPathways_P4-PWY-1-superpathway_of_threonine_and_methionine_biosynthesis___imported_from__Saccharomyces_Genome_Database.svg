<svg width="800" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Superpathway of Threonine and Methionine Biosynthesis</text>
  <text x="400" y="55" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle">Saccharomyces cerevisiae</text>
  
  <!-- Cell background -->
  <rect x="50" y="80" width="700" height="780" rx="20" ry="20" fill="#f9f9f9" stroke="#666" stroke-width="2" opacity="0.8"/>
  <text x="90" y="110" font-family="Arial" font-size="16" font-weight="bold">Cytosol</text>
  
  <!-- Pathway elements -->
  <!-- Starting Metabolite: L-aspartate -->
  <rect x="350" y="150" width="100" height="30" rx="15" ry="15" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="170" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">L-aspartate</text>
  
  <!-- Arrow 1 with cofactors -->
  <line x1="400" y1="180" x2="400" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="290" y="180" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="335" y="195" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">HOM3</text>
  <text x="335" y="207" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">aspartate kinase</text>
  
  <!-- Cofactors for reaction 1 -->
  <text x="430" y="195" font-family="Arial" font-size="10" fill="#006600">+ ATP</text>
  <text x="430" y="207" font-family="Arial" font-size="10" fill="#006600">→ ADP</text>
  
  <!-- Metabolite: 4-phosphonato-L-aspartic acid -->
  <rect x="350" y="210" width="100" height="30" rx="15" ry="15" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="225" font-family="Arial" font-size="11" text-anchor="middle">4-phosphonato-</text>
  <text x="400" y="237" font-family="Arial" font-size="11" text-anchor="middle">L-aspartic acid</text>
  
  <!-- Arrow 2 with cofactors -->
  <line x1="400" y1="240" x2="400" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="290" y="245" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="335" y="260" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">HOM2</text>
  <text x="335" y="272" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">aspartate-semialdehyde</text>
  <text x="335" y="284" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">dehydrogenase</text>
  
  <!-- Cofactors for reaction 2 -->
  <text x="430" y="255" font-family="Arial" font-size="10" fill="#006600">+ NADPH + H+</text>
  <text x="430" y="267" font-family="Arial" font-size="10" fill="#006600">→ NADP+ + Pi</text>
  
  <!-- Metabolite: L-aspartic acid 4-semialdehyde -->
  <rect x="350" y="270" width="100" height="30" rx="15" ry="15" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="285" font-family="Arial" font-size="11" text-anchor="middle">L-aspartic acid</text>
  <text x="400" y="297" font-family="Arial" font-size="11" text-anchor="middle">4-semialdehyde</text>
  
  <!-- Arrow 3 with cofactors -->
  <line x1="400" y1="300" x2="400" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="290" y="305" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="335" y="320" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">HOM6</text>
  <text x="335" y="332" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">homoserine dehydrogenase</text>
  
  <!-- Cofactors for reaction 3 -->
  <text x="430" y="315" font-family="Arial" font-size="10" fill="#006600">+ NAD(P)H</text>
  <text x="430" y="327" font-family="Arial" font-size="10" fill="#006600">→ NAD(P)+</text>
  
  <!-- Metabolite: L-homoserine -->
  <rect x="350" y="330" width="100" height="30" rx="15" ry="15" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="350" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">L-homoserine</text>
  
  <!-- Branch point -->  
  <line x1="400" y1="360" x2="400" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="400" y1="380" x2="250" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="400" y1="380" x2="550" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="250" y1="380" x2="250" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="380" x2="550" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Left Branch: Threonine Pathway -->
  <!-- Title for branch -->
  <rect x="150" y="340" width="120" height="25" rx="5" ry="5" fill="#e6f9ff" stroke="#333" stroke-width="1"/>
  <text x="210" y="357" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Threonine Pathway</text>
  
  <!-- Enzyme for left branch with cofactors -->
  <rect x="150" y="385" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="195" y="400" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">THR1</text>
  <text x="195" y="412" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">homoserine kinase</text>
  
  <!-- Cofactors for THR1 -->
  <text x="135" y="400" font-family="Arial" font-size="10" fill="#006600">+ ATP</text>
  <text x="135" y="412" font-family="Arial" font-size="10" fill="#006600">→ ADP</text>
  
  <!-- Metabolite: O-phosphonato-L-homoserine -->
  <rect x="200" y="400" width="100" height="30" rx="15" ry="15" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="250" y="415" font-family="Arial" font-size="11" text-anchor="middle">O-phosphonato-</text>
  <text x="250" y="427" font-family="Arial" font-size="11" text-anchor="middle">L-homoserine</text>
  
  <!-- Arrow with cofactors -->
  <line x1="250" y1="430" x2="250" y2="460" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="150" y="435" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="195" y="450" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">THR4</text>
  <text x="195" y="462" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">threonine synthase</text>
  
  <!-- Cofactors for THR4 -->
  <text x="135" y="450" font-family="Arial" font-size="10" fill="#006600">+ H2O</text>
  <text x="135" y="462" font-family="Arial" font-size="10" fill="#006600">→ Pi</text>
  
  <!-- Metabolite: L-threonine -->
  <rect x="200" y="460" width="100" height="30" rx="15" ry="15" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="250" y="480" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">L-threonine</text>
  
  <!-- Right Branch: Methionine Pathway -->
  <!-- Title for branch -->
  <rect x="520" y="340" width="120" height="25" rx="5" ry="5" fill="#e6f9ff" stroke="#333" stroke-width="1"/>
  <text x="580" y="357" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Methionine Pathway</text>
  
  <!-- Enzyme for right branch with cofactors -->
  <rect x="570" y="385" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="615" y="400" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">MET2</text>
  <text x="615" y="412" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">homoserine O-acetyltransferase</text>
  
  <!-- Cofactors for MET2 -->
  <text x="665" y="400" font-family="Arial" font-size="10" fill="#006600">+ Acetyl-CoA</text>
  <text x="665" y="412" font-family="Arial" font-size="10" fill="#006600">→ CoA</text>
  
  <!-- Metabolite: O-acetyl-L-homoserine -->
  <rect x="500" y="400" width="100" height="30" rx="15" ry="15" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="550" y="415" font-family="Arial" font-size="11" text-anchor="middle">O-acetyl-</text>
  <text x="550" y="427" font-family="Arial" font-size="11" text-anchor="middle">L-homoserine</text>
  
  <!-- Arrow with cofactors -->
  <line x1="550" y1="430" x2="550" y2="460" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="570" y="435" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="615" y="450" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">MET17</text>
  <text x="615" y="462" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">O-acetylhomoserine</text>
  <text x="615" y="474" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">aminocarboxypropyltransferase</text>
  
  <!-- Cofactors for MET17 -->
  <text x="665" y="450" font-family="Arial" font-size="10" fill="#006600">+ H2S</text>
  <text x="665" y="462" font-family="Arial" font-size="10" fill="#006600">→ Acetate + H+</text>
  
  <!-- Metabolite: L-homocysteine -->
  <rect x="500" y="460" width="100" height="30" rx="15" ry="15" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="550" y="480" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">L-homocysteine</text>
  
  <!-- Arrow with cofactors -->
  <line x1="550" y1="490" x2="550" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="570" y="495" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="615" y="510" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">MET6</text>
  <text x="615" y="522" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">homocysteine</text>
  <text x="615" y="534" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">methyltransferase</text>
  
  <!-- Metabolite: L-methionine -->
  <rect x="500" y="520" width="100" height="30" rx="15" ry="15" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="550" y="540" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">L-methionine</text>
  
  <!-- Additional metabolite: 5-methyltetrahydrofolate (substrate for MET6) -->
  <rect x="650" y="495" width="100" height="30" rx="15" ry="15" fill="#d9f2d9" stroke="#006600" stroke-width="1.5"/>
  <text x="700" y="510" font-family="Arial" font-size="10" text-anchor="middle">5-methyltetrahydro-</text>
  <text x="700" y="522" font-family="Arial" font-size="10" text-anchor="middle">folate</text>
  <line x1="650" y1="510" x2="610" y2="510" stroke="#006600" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Output from MET6 reaction -->
  <rect x="650" y="530" width="100" height="30" rx="15" ry="15" fill="#d9f2d9" stroke="#006600" stroke-width="1.5"/>
  <text x="700" y="545" font-family="Arial" font-size="10" text-anchor="middle">Tetrahydropteroyltri-</text>
  <text x="700" y="557" font-family="Arial" font-size="10" text-anchor="middle">L-glutamate</text>
  <line x1="610" y1="520" x2="650" y2="540" stroke="#006600" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- MET7 Enzyme -->
  <rect x="410" y="580" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="455" y="595" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">MET7</text>
  <text x="455" y="607" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">tetrahydrofolylpolyglutamate</text>
  <text x="455" y="619" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">synthase</text>
  
  <!-- AAT enzymes -->
  <rect x="410" y="620" width="90" height="25" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="455" y="635" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">AAT1/AAT2</text>
  <text x="455" y="647" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">L-aspartate:2-oxoglutarate</text>
  <text x="455" y="659" font-family="Arial" font-size="9" text-anchor="middle" font-style="italic">aminotransferase</text>
  
  <!-- Legend -->
  <rect x="90" y="700" width="620" height="130" rx="10" ry="10" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="100" y="720" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <rect x="100" y="730" width="15" height="15" rx="7.5" ry="7.5" fill="#b3e0ff" stroke="#333" stroke-width="1.5"/>
  <text x="125" y="742" font-family="Arial" font-size="12">Metabolite - Primary pathway component</text>
  
  <rect x="100" y="750" width="15" height="15" rx="5" ry="5" fill="#ffcccc" stroke="#333" stroke-width="1"/>
  <text x="125" y="762" font-family="Arial" font-size="12">Enzyme - Identified by gene name (e.g., HOM3, MET6)</text>
  
  <rect x="100" y="770" width="15" height="15" rx="7.5" ry="7.5" fill="#d9f2d9" stroke="#006600" stroke-width="1.5"/>
  <text x="125" y="782" font-family="Arial" font-size="12">Cofactor/Secondary metabolite - Supporting molecules in reactions</text>
  
  <rect x="100" y="790" width="15" height="15" rx="5" ry="5" fill="#e6f9ff" stroke="#333" stroke-width="1"/>
  <text x="125" y="802" font-family="Arial" font-size="12">Pathway branch - Labels for distinct biosynthetic routes</text>
  
  <text x="400" y="750" font-family="Arial" font-size="12" fill="#006600">Green text indicates cofactors (ATP, ADP, NADPH, etc.)</text>
  <text x="400" y="770" font-family="Arial" font-size="12" fill="#006600">Arrows indicate reaction direction</text>
  <text x="400" y="790" font-family="Arial" font-size="12" font-style="italic">Enzyme function shown in italic text</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>