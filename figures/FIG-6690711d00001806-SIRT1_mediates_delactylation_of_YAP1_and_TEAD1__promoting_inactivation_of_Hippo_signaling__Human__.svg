<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#ffffff" />
    
    <!-- Cell outline -->
    <ellipse cx="400" cy="300" rx="350" ry="250" fill="#f5f5f5" stroke="#333333" stroke-width="2" />
    
    <!-- Nucleus -->
    <ellipse cx="400" cy="300" rx="250" ry="180" fill="#e6f2ff" stroke="#333333" stroke-width="2" />
    <text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Nucleus</text>
    
    <!-- SIRT1 Protein -->
    <circle cx="300" cy="280" r="45" fill="#ff9999" stroke="#333333" stroke-width="2" />
    <text x="300" y="285" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">SIRT1</text>
    <text x="300" y="305" text-anchor="middle" font-family="Arial" font-size="10">delactylase</text>
    
    <!-- YAP1 Protein -->
    <rect x="380" y="230" width="90" height="50" rx="10" ry="10" fill="#99ccff" stroke="#333333" stroke-width="2" />
    <text x="425" y="260" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">YAP1</text>
    <text x="425" y="275" text-anchor="middle" font-family="Arial" font-size="10">coregulator</text>
    
    <!-- TEAD1 Protein -->
    <rect x="500" y="320" width="90" height="50" rx="10" ry="10" fill="#99ff99" stroke="#333333" stroke-width="2" />
    <text x="545" y="350" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">TEAD1</text>
    <text x="545" y="365" text-anchor="middle" font-family="Arial" font-size="10">transcription factor</text>
    
    <!-- DNA -->
    <path d="M 530,400 Q 545,420 560,400 Q 575,380 590,400 Q 605,420 620,400" stroke="#333333" stroke-width="3" fill="none" />
    <text x="575" y="440" text-anchor="middle" font-family="Arial" font-size="14">DNA</text>
    
    <!-- Lactyl group on YAP1 -->
    <circle cx="450" y="240" r="8" fill="#ff6600" stroke="#333333" stroke-width="1" />
    <text x="450" y="243" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Lac</text>
    
    <!-- Lactyl group on TEAD1 -->
    <circle cx="570" y="330" r="8" fill="#ff6600" stroke="#333333" stroke-width="1" />
    <text x="570" y="333" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Lac</text>
    
    <!-- Arrow from SIRT1 to YAP1 -->
    <line x1="340" y1="265" x2="380" y2="255" stroke="#333333" stroke-width="2" stroke-dasharray="5,2" />
    <polygon points="375,255 385,252 380,260" fill="#333333" />
    
    <!-- Arrow from SIRT1 to TEAD1 -->
    <line x1="340" y1="295" x2="500" y2="335" stroke="#333333" stroke-width="2" stroke-dasharray="5,2" />
    <polygon points="495,332 505,337 498,342" fill="#333333" />
    
    <!-- Arrow from YAP1 to TEAD1 -->
    <line x1="430" y1="280" x2="500" y2="320" stroke="#333333" stroke-width="2" />
    <polygon points="495,317 505,323 498,327" fill="#333333" />
    
    <!-- Hippo Signaling Label -->
    <rect x="300" y="400" width="200" height="30" rx="15" ry="15" fill="#ffffcc" stroke="#333333" stroke-width="2" />
    <text x="400" y="420" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Hippo Signaling</text>
    
    <!-- Inhibition arrow from SIRT1 to Hippo Signaling -->
    <line x1="300" y1="325" x2="300" y2="400" stroke="red" stroke-width="2" />
    <line x1="290" y1="390" x2="310" y2="390" stroke="red" stroke-width="4" />
    
    <!-- Title -->
    <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">SIRT1-Mediated Delactylation of YAP1 and TEAD1</text>
    <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="16">Negative Regulation of Hippo Signaling</text>
</svg>