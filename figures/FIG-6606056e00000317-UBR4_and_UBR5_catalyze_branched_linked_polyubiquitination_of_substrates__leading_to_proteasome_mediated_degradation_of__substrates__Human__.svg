<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Cell outline representing cytoplasm -->
    <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f8f8f8" stroke="#888" stroke-width="2" opacity="0.7"/>
    <text x="85" y="90" font-family="Arial" font-size="20" fill="#333" font-weight="bold">Cytoplasm (GO:0005737)</text>
    
    <!-- Substrate protein -->
    <circle cx="150" cy="250" r="30" fill="#b3d9ff" stroke="#0066cc" stroke-width="2"/>
    <text x="150" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Substrate</text>
    
    <!-- UBR4 -->
    <rect x="100" y="150" width="70" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
    <text x="135" y="175" font-family="Arial" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">UBR4</text>
    
    <!-- Arrow from UBR4 to substrate -->
    <path d="M135 190 L140 230" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="80" y="195" width="80" height="35" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
    <text x="90" y="213" font-family="Arial" font-size="12" fill="#333" font-weight="bold">K11-linked</text>
    <text x="90" y="228" font-family="Arial" font-size="12" fill="#333" font-weight="bold">ubiquitination</text>
    
    <!-- K11-linked ubiquitin on substrate -->
    <circle cx="165" cy="225" r="10" fill="#ff99cc" stroke="#cc0066" stroke-width="1.5"/>
    <text x="165" y="228" font-family="Arial" font-size="9" text-anchor="middle" fill="#000" font-weight="bold">K11</text>
    
    <!-- UBR5 -->
    <rect x="220" y="150" width="70" height="40" rx="5" ry="5" fill="#ffcc99" stroke="#ff9933" stroke-width="2"/>
    <text x="255" y="175" font-family="Arial" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">UBR5</text>
    
    <!-- Arrow from UBR5 to substrate -->
    <path d="M255 190 L200 235" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="230" y="195" width="85" height="35" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
    <text x="240" y="213" font-family="Arial" font-size="12" fill="#333" font-weight="bold">K48-linked</text>
    <text x="240" y="228" font-family="Arial" font-size="12" fill="#333" font-weight="bold">ubiquitination</text>
    
    <!-- K48-linked ubiquitin on substrate -->
    <circle cx="175" cy="235" r="10" fill="#99ff99" stroke="#33cc33" stroke-width="1.5"/>
    <text x="175" y="238" font-family="Arial" font-size="9" text-anchor="middle" fill="#000" font-weight="bold">K48</text>
    
    <!-- Branched polyubiquitination annotation -->
    <rect x="150" y="260" width="190" height="25" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
    <text x="180" y="278" font-family="Arial" font-size="12" fill="#333" font-style="italic" font-weight="bold">Branched polyubiquitination</text>
    
    <!-- VCP -->
    <rect x="300" y="250" width="70" height="40" rx="5" ry="5" fill="#cc99ff" stroke="#9933ff" stroke-width="2"/>
    <text x="335" y="275" font-family="Arial" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">VCP</text>
    
    <!-- Arrow from substrate to VCP -->
    <path d="M180 250 L295 265" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="210" y="230" width="100" height="45" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
    <text x="230" y="248" font-family="Arial" font-size="12" fill="#333" font-weight="bold">Recognition of</text>
    <text x="230" y="263" font-family="Arial" font-size="12" fill="#333" font-weight="bold">ubiquitin-modified</text>
    <text x="230" y="278" font-family="Arial" font-size="12" fill="#333" font-weight="bold">protein</text>
    
    <!-- Proteasome -->
    <polygon points="450,230 500,200 550,230 500,260" fill="#ff9999" stroke="#cc3333" stroke-width="2"/>
    <text x="500" y="235" font-family="Arial" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Proteasome</text>
    <text x="500" y="250" font-family="Arial" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Core Complex</text>
    
    <!-- Arrow from VCP to proteasome -->
    <path d="M370 265 L445 240" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="380" y="240" width="85" height="45" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
    <text x="400" y="258" font-family="Arial" font-size="12" fill="#333" font-weight="bold">Delivery for</text>
    <text x="400" y="273" font-family="Arial" font-size="12" fill="#333" font-weight="bold">degradation</text>
    
    <!-- Degradation products -->
    <line x1="520" y1="270" x2="535" y2="285" stroke="#333" stroke-width="2"/>
    <line x1="530" y1="270" x2="545" y2="285" stroke="#333" stroke-width="2"/>
    <line x1="540" y1="270" x2="555" y2="285" stroke="#333" stroke-width="2"/>
    <line x1="550" y1="270" x2="565" y2="285" stroke="#333" stroke-width="2"/>
    <rect x="515" y="290" width="90" height="40" fill="white" fill-opacity="0.7" rx="5" ry="5"/>
    <text x="545" y="310" font-family="Arial" font-size="12" fill="#333" font-weight="bold">Degradation</text>
    <text x="545" y="325" font-family="Arial" font-size="12" fill="#333" font-weight="bold">products</text>
    
    <!-- Process labels -->
    <rect x="110" y="340" width="160" height="60" rx="5" ry="5" fill="white" stroke="#888" stroke-width="1" opacity="0.9"/>
    <text x="125" y="360" font-family="Arial" font-size="14" fill="#333" font-weight="bold">GO:0070979</text>
    <text x="125" y="380" font-family="Arial" font-size="12" fill="#333">Protein K11-linked</text>
    <text x="125" y="395" font-family="Arial" font-size="12" fill="#333">ubiquitination</text>
    
    <rect x="280" y="340" width="160" height="60" rx="5" ry="5" fill="white" stroke="#888" stroke-width="1" opacity="0.9"/>
    <text x="295" y="360" font-family="Arial" font-size="14" fill="#333" font-weight="bold">GO:0070936</text>
    <text x="295" y="380" font-family="Arial" font-size="12" fill="#333">Protein K48-linked</text>
    <text x="295" y="395" font-family="Arial" font-size="12" fill="#333">ubiquitination</text>
    
    <rect x="450" y="340" width="160" height="60" rx="5" ry="5" fill="white" stroke="#888" stroke-width="1" opacity="0.9"/>
    <text x="465" y="360" font-family="Arial" font-size="14" fill="#333" font-weight="bold">GO:0140455</text>
    <text x="465" y="380" font-family="Arial" font-size="12" fill="#333">Cytoplasm protein</text>
    <text x="465" y="395" font-family="Arial" font-size="12" fill="#333">quality control</text>
    
    <rect x="620" y="340" width="160" height="60" rx="5" ry="5" fill="white" stroke="#888" stroke-width="1" opacity="0.9"/>
    <text x="635" y="360" font-family="Arial" font-size="14" fill="#333" font-weight="bold">GO:0010498</text>
    <text x="635" y="380" font-family="Arial" font-size="12" fill="#333">Proteasomal protein</text>
    <text x="635" y="395" font-family="Arial" font-size="12" fill="#333">catabolic process</text>
    
    <!-- Image title -->
    <rect x="100" y="470" width="600" height="60" rx="5" ry="5" fill="white" stroke="#333" stroke-width="2" opacity="0.9"/>
    <text x="400" y="495" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">
        UBR4 and UBR5 catalyze branched-linked polyubiquitination
    </text>
    <text x="400" y="520" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">
        leading to proteasome-mediated degradation of substrates
    </text>
    
    <!-- Legend -->
    <rect x="50" y="410" width="700" height="40" rx="5" ry="5" fill="white" stroke="#888" stroke-width="1" opacity="0.9"/>
    <text x="60" y="435" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Legend:</text>
    
    <!-- E3 ligases -->
    <rect x="130" y="420" width="20" height="15" rx="2" ry="2" fill="#ffcc99" stroke="#ff9933" stroke-width="1"/>
    <text x="160" y="435" font-family="Arial" font-size="12" fill="#333">E3 Ubiquitin Ligases (UBR4, UBR5)</text>
    
    <!-- Substrate -->
    <circle cx="280" cy="427" r="10" fill="#b3d9ff" stroke="#0066cc" stroke-width="1.5"/>
    <text x="300" y="435" font-family="Arial" font-size="12" fill="#333">Substrate protein</text>
    
    <!-- Ubiquitin tags -->
    <circle cx="380" cy="427" r="7" fill="#ff99cc" stroke="#cc0066" stroke-width="1"/>
    <text x="395" y="430" font-family="Arial" font-size="12" fill="#333">K11-linked ubiquitin</text>
    
    <circle cx="495" cy="427" r="7" fill="#99ff99" stroke="#33cc33" stroke-width="1"/>
    <text x="510" y="430" font-family="Arial" font-size="12" fill="#333">K48-linked ubiquitin</text>
    
    <!-- VCP -->
    <rect x="610" y="420" width="20" height="15" rx="2" ry="2" fill="#cc99ff" stroke="#9933ff" stroke-width="1"/>
    <text x="640" y="435" font-family="Arial" font-size="12" fill="#333">VCP (Reader)</text>
    
    <!-- Definitions for markers -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
        </marker>
    </defs>
</svg>