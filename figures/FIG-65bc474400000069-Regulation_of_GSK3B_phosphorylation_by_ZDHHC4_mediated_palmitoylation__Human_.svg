<svg width="800" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell outline -->
  <rect x="50" y="50" width="700" height="500" rx="50" ry="50" fill="#f9f9f9" stroke="#666" stroke-width="2" opacity="0.8"/>
  
  <!-- Endoplasmic Reticulum -->
  <path d="M100,200 C150,180 200,220 250,200 C300,180 350,220 400,200 C450,180 500,220 550,200" 
        fill="none" stroke="#5d8aa8" stroke-width="3"/>
  <path d="M100,230 C150,210 200,250 250,230 C300,210 350,250 400,230 C450,210 500,250 550,230" 
        fill="none" stroke="#5d8aa8" stroke-width="3"/>
  <path d="M100,260 C150,240 200,280 250,260 C300,240 350,280 400,260 C450,240 500,280 550,260" 
        fill="none" stroke="#5d8aa8" stroke-width="3"/>
  <text x="125" y="185" font-family="Arial" font-size="14" fill="#000">Endoplasmic Reticulum (GO:0005783)</text>
  
  <!-- Chromosomes -->
  <ellipse cx="650" cy="150" rx="100" ry="70" fill="#e6e6fa" stroke="#9370db" stroke-width="2"/>
  <text x="600" y="110" font-family="Arial" font-size="14" fill="#000">Chromosome (GO:0005694)</text>
  
  <!-- Cytoplasm label -->
  <text x="350" y="350" font-family="Arial" font-size="14" fill="#000">Cytoplasm (GO:0005737)</text>
  
  <!-- ZDHHC4 in ER -->
  <circle cx="200" cy="230" r="30" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <text x="200" y="235" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">ZDHHC4</text>
  
  <!-- AKT1 in cytoplasm -->
  <circle cx="350" cy="400" r="30" fill="#99ccff" stroke="#0066cc" stroke-width="2"/>
  <text x="350" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">AKT1</text>
  
  <!-- GSK3B in cytoplasm -->
  <circle cx="500" cy="400" r="30" fill="#ffcc99" stroke="#ff6600" stroke-width="2"/>
  <text x="500" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">GSK3B</text>
  
  <!-- EZH2 in chromosome -->
  <circle cx="650" cy="150" r="30" fill="#cc99ff" stroke="#6600cc" stroke-width="2"/>
  <text x="650" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#000">EZH2</text>
  
  <!-- Connections and Activities -->
  <!-- ZDHHC4 to AKT1 -->
  <path d="M225,245 C275,310 300,350 330,380" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="255" y="310" font-family="Arial" font-size="12" fill="#000" transform="rotate(-25, 255, 310)">Palmitoyltransferase</text>
  <text x="255" y="325" font-family="Arial" font-size="12" fill="#000" transform="rotate(-25, 255, 325)">activity</text>
  <text x="265" y="340" font-family="Arial" font-size="12" fill="#000" transform="rotate(-25, 265, 340)">(GO:0016409)</text>
  <text x="270" y="355" font-family="Arial" font-size="12" fill="#0066cc" transform="rotate(-25, 270, 355)">RO:0012010</text>
  
  <!-- AKT1 to GSK3B -->
  <path d="M380,400 L470,400" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="425" y="390" font-family="Arial" font-size="12" fill="#000">Protein S/T kinase</text>
  <text x="425" y="420" font-family="Arial" font-size="12" fill="#0066cc">RO:0002630</text>
  
  <!-- GSK3B to EZH2 -->
  <path d="M525,380 C550,330 590,250 630,180" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="555" y="280" font-family="Arial" font-size="12" fill="#000" transform="rotate(-65, 555, 280)">Protein S/T kinase</text>
  <text x="575" y="280" font-family="Arial" font-size="12" fill="#0066cc" transform="rotate(-65, 575, 280)">RO:0002630</text>
  
  <!-- Cell Migration Regulation Boxes -->
  <rect x="80" y="480" width="220" height="40" rx="10" ry="10" fill="#a0ffa0" stroke="#008800" stroke-width="2"/>
  <text x="190" y="505" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Positive regulation of cell migration</text>
  <text x="190" y="520" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">(GO:0030335)</text>
  
  <rect x="500" y="480" width="220" height="40" rx="10" ry="10" fill="#ffa0a0" stroke="#880000" stroke-width="2"/>
  <text x="610" y="505" font-family="Arial" font-size="12" text-anchor="middle" fill="#000">Negative regulation of cell migration</text>
  <text x="610" y="520" font-family="Arial" font-size="10" text-anchor="middle" fill="#000">(GO:0030336)</text>
  
  <!-- Connections to regulation processes -->
  <line x1="350" y1="430" x2="190" y2="480" stroke="#008800" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="650" y1="180" x2="190" y2="480" stroke="#008800" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="500" y1="430" x2="610" y2="480" stroke="#880000" stroke-width="1" stroke-dasharray="5,3"/>
  
  <!-- EZH2 Activity -->
  <text x="650" y="100" font-family="Arial" font-size="12" fill="#000">Histone methyltransferase</text>
  <text x="650" y="115" font-family="Arial" font-size="12" fill="#000">activity (GO:0042054)</text>
  
  <!-- Legend -->
  <rect x="50" y="565" width="700" height="65" rx="5" ry="5" fill="#f0f0f0" stroke="#333" stroke-width="1"/>
  <text x="60" y="580" font-family="Arial" font-size="12" font-weight="bold" fill="#000">Legend:</text>
  
  <!-- Protein colors -->
  <circle cx="80" cy="595" r="8" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
  <text x="95" y="599" font-family="Arial" font-size="12" fill="#000">ZDHHC4 (UniProtKB:Q9NPG8)</text>
  
  <circle cx="230" cy="595" r="8" fill="#99ccff" stroke="#0066cc" stroke-width="1"/>
  <text x="245" y="599" font-family="Arial" font-size="12" fill="#000">AKT1 (UniProtKB:P31749)</text>
  
  <circle cx="380" cy="595" r="8" fill="#ffcc99" stroke="#ff6600" stroke-width="1"/>
  <text x="395" y="599" font-family="Arial" font-size="12" fill="#000">GSK3B (UniProtKB:P49841)</text>
  
  <circle cx="530" cy="595" r="8" fill="#cc99ff" stroke="#6600cc" stroke-width="1"/>
  <text x="545" y="599" font-family="Arial" font-size="12" fill="#000">EZH2 (UniProtKB:Q15910)</text>
  
  <!-- Relationship types -->
  <line x1="80" y1="615" x2="110" y2="615" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="115" y="619" font-family="Arial" font-size="12" fill="#000">Causal relationship</text>
  
  <line x1="230" y1="615" x2="260" y2="615" stroke="#008800" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="265" y="619" font-family="Arial" font-size="12" fill="#000">Part of positive regulation</text>
  
  <line x1="420" y1="615" x2="450" y2="615" stroke="#880000" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="455" y="619" font-family="Arial" font-size="12" fill="#000">Part of negative regulation</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
</svg>