<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell membrane outline -->
  <rect x="50" y="50" width="700" height="500" rx="20" ry="20" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  
  <!-- Nucleus -->
  <ellipse cx="600" cy="350" rx="150" ry="120" fill="#e6f2ff" stroke="#333" stroke-width="2"/>
  <text x="600" y="440" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Nucleus (GO:0005634)</text>
  
  <!-- Cytoplasm label -->
  <text x="300" y="90" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Host Cell Cytoplasm (GO:0030430, GO:0005737)</text>
  
  <!-- Viral compartment -->
  <rect x="100" y="150" width="160" height="100" rx="10" ry="10" fill="#ffe6e6" stroke="#333" stroke-width="2"/>
  <text x="180" y="180" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Poxvirus</text>
  
  <!-- VACWR022 (viral protein) -->
  <circle cx="180" cy="220" r="30" fill="#ff9999" stroke="#333" stroke-width="2"/>
  <text x="180" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">VACWR022</text>
  
  <!-- TANK protein -->
  <rect x="300" y="220" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="340" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">TANK</text>
  
  <!-- TBK1 protein -->
  <rect x="450" y="220" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="490" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">TBK1</text>
  
  <!-- IRF3 protein -->
  <rect x="600" y="300" width="80" height="40" rx="5" ry="5" fill="#99ccff" stroke="#333" stroke-width="2"/>
  <text x="640" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IRF3</text>
  
  <!-- IFNB1 gene -->
  <rect x="600" y="370" width="80" height="30" rx="0" ry="0" fill="#ccffcc" stroke="#333" stroke-width="2"/>
  <text x="640" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IFNB1</text>
  <text x="700" y="380" text-anchor="start" font-family="Arial" font-size="12" fill="#999" font-style="italic">(not in source)</text>
  
  <!-- Biological processes blocks -->
  <rect x="100" y="350" width="220" height="40" rx="5" ry="5" fill="#ffffcc" stroke="#333" stroke-width="1" opacity="0.8"/>
  <text x="210" y="370" text-anchor="middle" font-family="Arial" font-size="12" fill="#666" font-style="italic">GO:0039501: Suppression by virus of</text>
  <text x="210" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#666" font-style="italic">host type I interferon production</text>
  
  <rect x="350" y="350" width="220" height="40" rx="5" ry="5" fill="#ffffcc" stroke="#333" stroke-width="1" opacity="0.8"/>
  <text x="460" y="370" text-anchor="middle" font-family="Arial" font-size="12" fill="#666" font-style="italic">GO:0032481: Positive regulation of</text>
  <text x="460" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#666" font-style="italic">type I interferon production</text>
  
  <!-- Arrows and Interactions -->
  <!-- VACWR022 inhibits TANK -->
  <line x1="210" y1="220" x2="290" y2="220" stroke="#ff0000" stroke-width="2"/>
  <polygon points="290,220 280,215 280,225" fill="#ff0000" stroke="#ff0000"/>
  <text x="250" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">inhibits</text>
  <text x="250" y="240" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(GO:0140311)</text>
  
  <!-- TANK activates TBK1 (but inhibited) -->
  <line x1="380" y1="240" x2="440" y2="240" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="440,240 430,235 430,245" fill="#333" stroke="#333"/>
  <text x="410" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">activates</text>
  <text x="410" y="260" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(GO:0060090)</text>
  
  <!-- TBK1 phosphorylates IRF3 -->
  <line x1="500" y1="260" x2="590" y2="290" stroke="#333" stroke-width="2"/>
  <polygon points="590,290 580,283 582,293" fill="#333" stroke="#333"/>
  <text x="535" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">phosphorylates</text>
  <text x="535" y="293" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(GO:0004674)</text>
  
  <!-- IRF3 activates IFNB1 transcription -->
  <line x1="640" y1="340" x2="640" y2="365" stroke="#333" stroke-width="2"/>
  <polygon points="640,365 635,355 645,355" fill="#333" stroke="#333"/>
  <text x="560" y="355" text-anchor="end" font-family="Arial" font-size="12" fill="#333">activates transcription</text>
  <text x="560" y="368" text-anchor="end" font-family="Arial" font-size="12" fill="#333">(GO:0003700)</text>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#333">Poxvirus-OPG029 Inhibition of Host TBK1-TANK Signaling Pathway</text>
</svg>