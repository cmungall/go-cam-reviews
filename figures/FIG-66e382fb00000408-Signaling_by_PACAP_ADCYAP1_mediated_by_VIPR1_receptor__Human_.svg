<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" />
  
  <!-- Cell membrane -->
  <path d="M100,200 Q400,170 700,200 Q400,230 100,200" fill="#E6F2FF" stroke="#000000" stroke-width="2" />
  
  <!-- Extracellular space label -->
  <text x="400" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Extracellular Space (GO:0005615)</text>
  
  <!-- Cytosol label -->
  <text x="400" y="270" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Cytosol (GO:0005829)</text>
  
  <!-- ADCYAP1 (P18509) in extracellular space -->
  <circle cx="300" cy="120" r="35" fill="#FF9999" stroke="#000000" stroke-width="2" />
  <text x="300" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">ADCYAP1</text>
  <text x="300" y="140" text-anchor="middle" font-family="Arial" font-size="12">(P18509)</text>
  
  <!-- VIPR1 receptor on membrane -->
  <rect x="350" y="180" width="100" height="40" rx="5" ry="5" fill="#99CCFF" stroke="#000000" stroke-width="2" />
  <text x="400" y="202" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">VIPR1</text>
  <text x="400" y="218" text-anchor="middle" font-family="Arial" font-size="12">(P32241)</text>
  
  <!-- G protein GNAS -->
  <circle cx="400" cy="280" r="35" fill="#99FF99" stroke="#000000" stroke-width="2" />
  <text x="400" y="280" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">GNAS</text>
  <text x="400" y="300" text-anchor="middle" font-family="Arial" font-size="12">(Q5JWF2)</text>
  
  <!-- Adenylate cyclase ADCY6 -->
  <rect x="500" y="330" width="100" height="40" rx="5" ry="5" fill="#FFCC99" stroke="#000000" stroke-width="2" />
  <text x="550" y="352" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">ADCY6</text>
  <text x="550" y="370" text-anchor="middle" font-family="Arial" font-size="12">(O43306)</text>
  
  <!-- cAMP -->
  <circle cx="600" cy="420" r="30" fill="#FFFF99" stroke="#000000" stroke-width="2" />
  <text x="600" y="420" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">cAMP</text>
  <text x="600" y="440" text-anchor="middle" font-family="Arial" font-size="12">(CHEBI:17489)</text>
  
  <!-- Arrows for signaling pathway -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- ADCYAP1 to VIPR1 -->
  <line x1="325" y1="140" x2="370" y2="180" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="335" y="170" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">binds</text>
  
  <!-- VIPR1 to GNAS -->
  <line x1="400" y1="220" x2="400" y2="245" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="420" y="235" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">activates</text>
  
  <!-- GNAS to ADCY6 -->
  <line x1="425" y1="300" x2="500" y2="330" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="465" y="325" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">activates</text>
  
  <!-- ADCY6 to cAMP -->
  <line x1="575" y1="370" x2="595" y2="395" stroke="#000000" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="605" y="380" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">produces</text>
  
  <!-- Figure title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Signaling by PACAP/ADCYAP1 mediated by VIPR1 receptor</text>
  <text x="400" y="75" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">GO-CAM: gomodel:66e382fb00000408</text>
  
  <!-- Biological process label -->
  <rect x="150" y="480" width="500" height="40" rx="5" ry="5" fill="#E6E6E6" stroke="#000000" stroke-width="2" />
  <text x="400" y="505" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Adenylate cyclase-activating G protein-coupled receptor signaling pathway (GO:0007189)</text>
  
  <!-- Legend -->
  <rect x="600" y="480" width="180" height="110" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="690" y="500" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Legend</text>
  
  <circle cx="620" cy="520" r="10" fill="#FF9999" stroke="#000000" stroke-width="1" />
  <text x="640" y="525" text-anchor="start" font-family="Arial" font-size="12">Neuropeptide</text>
  
  <rect x="610" y="540" width="20" height="10" fill="#99CCFF" stroke="#000000" stroke-width="1" />
  <text x="640" y="545" text-anchor="start" font-family="Arial" font-size="12">Receptor</text>
  
  <circle cx="620" cy="560" r="10" fill="#99FF99" stroke="#000000" stroke-width="1" />
  <text x="640" y="565" text-anchor="start" font-family="Arial" font-size="12">G protein</text>
  
  <rect x="610" y="580" width="20" height="10" fill="#FFCC99" stroke="#000000" stroke-width="1" />
  <text x="640" y="585" text-anchor="start" font-family="Arial" font-size="12">Enzyme</text>
  
  <circle cx="620" cy="600" r="10" fill="#FFFF99" stroke="#000000" stroke-width="1" />
  <text x="640" y="605" text-anchor="start" font-family="Arial" font-size="12">Second messenger</text>
</svg>