<svg width="800" height="1350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background cytosol -->
  <rect x="50" y="50" width="700" height="1230" rx="20" ry="20" fill="#f0f7ff" stroke="#aac" stroke-width="2"/>
  <text x="400" y="90" font-family="Arial" font-size="26" text-anchor="middle" font-weight="bold">Canonical Glycolysis (S. pombe)</text>
  <text x="710" y="80" font-family="Arial" font-size="18" text-anchor="end" font-style="italic" fill="#336699">Cytosol</text>
  
  <!-- Metabolites and Enzymes -->
  <!-- Glucose entry -->
  <circle cx="400" cy="150" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="400" y="155" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">D-hexose</text>
  
  <!-- Arrows and Reactions -->
  <!-- Reaction 1: Hexokinase (HXK1/HXK2) -->
  <line x1="400" y1="185" x2="400" y2="230" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="280" y="190" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="330" y="213" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">HXK1</text>
  <text x="330" y="228" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPAC24H6.04</text>
  
  <rect x="430" y="190" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="480" y="213" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">HXK2</text>
  <text x="480" y="228" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPAC4F8.07c</text>

  <!-- Glucose-6-phosphate -->
  <circle cx="400" cy="265" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="400" y="270" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">G6P</text>
  
  <!-- Reaction 2: Phosphoglucose isomerase (PGI1) -->
  <line x1="400" y1="300" x2="400" y2="345" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="430" y="305" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="480" y="328" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PGI1</text>
  <text x="480" y="343" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPBC1604.05</text>
  
  <!-- Fructose-6-phosphate -->
  <circle cx="400" cy="380" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="400" y="385" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">F6P</text>
  
  <!-- Reaction 3: Phosphofructokinase (PFK1) -->
  <line x1="400" y1="415" x2="400" y2="460" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="430" y="420" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="480" y="443" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PFK1</text>
  <text x="480" y="458" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPBC16H5.02</text>
  
  <!-- Fructose-1,6-bisphosphate -->
  <circle cx="400" cy="495" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="400" y="500" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">F1,6BP</text>
  
  <!-- Reaction 4: Aldolase (FBA1) -->
  <line x1="400" y1="530" x2="400" y2="575" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="430" y="535" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="480" y="558" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">FBA1</text>
  <text x="480" y="573" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPBC19C2.07</text>
  
  <!-- Split to DHAP and G3P -->
  <circle cx="320" cy="610" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="320" y="615" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">DHAP</text>
  
  <circle cx="480" cy="610" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="480" y="615" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">G3P</text>
  
  <line x1="400" y1="575" x2="320" y2="610" stroke="#000" stroke-width="2"/>
  <line x1="400" y1="575" x2="480" y2="610" stroke="#000" stroke-width="2"/>
  
  <!-- Reaction 5: Triose phosphate isomerase (TPI1) -->
  <line x1="320" y1="645" x2="480" y2="680" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="350" y="625" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="400" y="648" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TPI1</text>
  <text x="400" y="663" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPCC24B10.21</text>
  
  <!-- 2x G3P -->
  <circle cx="480" cy="715" r="40" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="480" y="720" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">2× G3P</text>
  
  <!-- Reaction 6: Glyceraldehyde 3-phosphate dehydrogenase (TDH1/GPD3) -->
  <line x1="480" y1="755" x2="480" y2="800" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="350" y="755" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="400" y="778" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">TDH1</text>
  <text x="400" y="793" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPBC32F12.11</text>
  
  <rect x="510" y="755" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="560" y="778" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">GPD3</text>
  <text x="560" y="793" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPBC354.12</text>
  
  <!-- 1,3-bisphosphoglycerate -->
  <circle cx="480" cy="835" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="480" y="840" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">1,3-BPG</text>
  
  <!-- Reaction 7: Phosphoglycerate kinase (PGK1) -->
  <line x1="480" y1="870" x2="480" y2="915" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="510" y="875" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="560" y="898" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PGK1</text>
  <text x="560" y="913" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPBC14F5.04c</text>
  
  <!-- 3-phosphoglycerate -->
  <circle cx="480" cy="950" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="480" y="955" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">3-PG</text>
  
  <!-- Reaction 8: Phosphoglycerate mutase (GPM1) -->
  <line x1="480" y1="985" x2="480" y2="1030" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="510" y="990" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="560" y="1013" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">GPM1</text>
  <text x="560" y="1028" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPAC26F1.06</text>
  
  <!-- 2-phosphoglycerate -->
  <circle cx="480" cy="1065" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="480" y="1070" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">2-PG</text>
  
  <!-- Reaction 9: Enolase (ENO101/ENO102) -->
  <line x1="480" y1="1100" x2="480" y2="1145" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="350" y="1105" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="400" y="1128" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ENO101</text>
  <text x="400" y="1143" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPBC1815.01</text>
  
  <rect x="510" y="1105" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="560" y="1128" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ENO102</text>
  <text x="560" y="1143" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPBPB21E7.01c</text>
  
  <!-- Phosphoenolpyruvate -->
  <circle cx="480" cy="1180" r="35" fill="#ffd699" stroke="#d4a76a" stroke-width="2.5"/>
  <text x="480" y="1185" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PEP</text>
  
  <!-- Final Reaction: Pyruvate kinase (PYK1) -->
  <line x1="480" y1="1215" x2="480" y2="1260" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="510" y="1220" width="100" height="45" rx="10" ry="10" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="560" y="1243" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">PYK1</text>
  <text x="560" y="1258" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">SPAC4H3.10c</text>
  
  <!-- Pyruvate (final product) -->
  <circle cx="480" cy="1295" r="40" fill="#ffb3b3" stroke="#cc6666" stroke-width="3"/>
  <text x="480" y="1300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Pyruvate</text>
  
  <!-- Legend -->
  <rect x="100" y="1150" width="250" height="120" rx="10" ry="10" fill="white" stroke="#888" stroke-width="1"/>
  <text x="225" y="1175" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Legend</text>
  
  <!-- Metabolite legend -->
  <circle cx="120" y="1200" r="15" fill="#ffd699" stroke="#d4a76a" stroke-width="2"/>
  <text x="140" y="1205" font-family="Arial" font-size="14" dx="10">Metabolite</text>
  
  <!-- Enzyme legend -->
  <rect x="120" y="1230" width="40" height="20" rx="5" ry="5" fill="#c6e0b4" stroke="#548235" stroke-width="2"/>
  <text x="170" y="1245" font-family="Arial" font-size="14" dx="10">Enzyme</text>
  
  <!-- Final product legend -->
  <circle cx="120" y="1270" r="15" fill="#ffb3b3" stroke="#cc6666" stroke-width="2"/>
  <text x="140" y="1275" font-family="Arial" font-size="14" dx="10">Final Product (Pyruvate)</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
</svg>